<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Program Portal</title>
  <link rel="stylesheet" href="program.css">
</head>
<body>
  <div class="portal">
    <aside id="sidebar" class="sidebar" aria-label="Applications">
      <div class="brand"><span class="brand-mark">P</span><span><strong id="portalName">Program</strong><small>Planning portal</small></span></div>
      <nav>
        <button class="app-link" data-app="matrix"><span>▦</span><span><b>Board matrix</b><small>Explore cards by two dimensions</small></span></button>
        <button class="app-link" data-app="transfer"><span>⇄</span><span><b>Card transfer</b><small>Move cards between boards</small></span></button>
        <button class="app-link" data-app="builder"><span>⌘</span><span><b>Matrix studio</b><small>Create and use saved matrices</small></span></button>
      </nav>
      <div class="sidebar-foot"><button id="configBtn" class="app-link"><span>⚙</span><span><b>Configuration</b><small>Names, colors and GitHub</small></span></button><span id="syncState" class="sync-state">Loading boards…</span></div>
    </aside>
    <section class="workspace">
      <header class="topbar"><button id="menuBtn" class="icon-btn" aria-label="Open applications">☰</button><div id="tabs" class="tabs" role="tablist"></div><button id="newTabBtn" class="icon-btn" title="Open another app instance">＋</button></header>
      <main id="views" class="views"></main>
    </section>
  </div>
  <div id="scrim" class="scrim"></div>
  <dialog id="cardDialog"></dialog>
  <dialog id="configDialog"></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="program.js"></script>
</body>
</html>
