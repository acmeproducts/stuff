<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Program Portal</title>
  <style>
:root{--topbar-height:64px;--sidebar-width:220px;--bg:#f4f6fa;--surface:#fff;--sidebar:#101827;--ink:#142033;--muted:#667085;--line:#dfe4ec;--accent:#6658e8;--accent-soft:#eeecff;--danger:#cf3f4f;--ribbon:#64748b;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}button,input,select,textarea{font:inherit}.portal{height:100dvh}.topbar{position:fixed;inset:0 0 auto;z-index:20;height:var(--topbar-height);display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}.topbar>strong{font-size:15px}.app-controls{flex:1}.sync-state{margin-left:auto;color:var(--muted);font-size:12px}.sync-state.error{color:var(--danger)}
.sidebar{position:fixed;z-index:19;inset:var(--topbar-height) auto 0 0;width:var(--sidebar-width);padding:12px;background:var(--sidebar);transition:transform .18s}.sidebar nav{display:grid;gap:6px}.app-link{display:flex;gap:10px;width:100%;padding:11px;border:0;border-radius:9px;background:transparent;color:#d8deea;text-align:left;cursor:pointer}.app-link:hover,.app-link.active{background:#ffffff18;color:#fff}.portal.sidebar-collapsed .sidebar{transform:translateX(-101%)}
.view{height:100dvh;margin-left:var(--sidebar-width);padding:calc(var(--topbar-height) + 10px) 10px 10px;overflow:auto;transition:margin .18s}.portal.sidebar-collapsed .view{margin-left:0}.panel{padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px #1420330a}.view-head{margin-bottom:10px}.view-head h1,.panel h2{margin:0 0 5px}.view-head p,.viewer-head p{margin:0;color:var(--muted)}
.matrix-workspace{display:grid;grid-template-columns:minmax(210px,280px) minmax(0,1fr);gap:10px;min-height:calc(100dvh - var(--topbar-height) - 20px)}.matrix-manager{min-width:0}.manager-head,.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.definition-list{display:grid;gap:6px;margin-top:10px}.definition{display:grid;gap:3px;width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);text-align:left;text-decoration:none;cursor:pointer}.definition small{color:var(--muted)}.definition:hover,.definition.active{border-color:var(--accent);background:var(--accent-soft)}
.matrix-viewer{display:flex;min-width:0;min-height:0;flex-direction:column}.definition-editor{margin:8px 0;border:1px solid var(--line);border-radius:9px}.definition-editor summary{padding:9px;font-weight:700;cursor:pointer}.definition-editor form{padding:0 9px 9px}.definition-grid{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:8px}.definition-grid label,.definition-grid fieldset,.builder-grid label,#cardDialog label{display:grid;gap:4px;color:var(--muted);font-size:12px;font-weight:700}.definition-grid input,.definition-grid select,.definition-grid textarea,.builder-grid input,.builder-grid select,.builder-grid textarea,#cardDialog input,#cardDialog select,#cardDialog textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;color:var(--ink);background:#fff}.definition-grid fieldset{grid-column:1/-1;display:flex;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px}.check{display:flex!important;align-items:center;gap:4px!important}.check input{width:auto}.tag-suggestion{padding:3px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.omni{display:flex;align-items:end;gap:7px;margin-bottom:8px}.omni label{display:grid;flex:1;gap:3px;font-size:12px;font-weight:700}.omni input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.omni output{min-width:85px;color:var(--muted);font-size:12px}.matrix-scroll{min-height:280px;flex:1;overflow:auto;border:1px solid var(--line);border-radius:9px}.matrix-grid{display:grid;grid-template-columns:clamp(70px,10vw,120px) repeat(var(--matrix-columns),minmax(125px,1fr));grid-template-rows:minmax(34px,auto) repeat(var(--matrix-rows),minmax(130px,1fr));min-width:max-content;min-height:100%}.matrix-corner,.matrix-header,.matrix-rowhead{display:flex;align-items:center;justify-content:center;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-size:11px;font-weight:800}.board-chip{display:block;max-width:100%;padding:4px 7px;border-radius:999px;overflow:hidden;background:var(--accent-soft);color:var(--accent);text-overflow:ellipsis;white-space:nowrap}.matrix-cell{display:flex;min-width:125px;min-height:130px;flex-direction:column;gap:4px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.matrix-cell:focus-visible,.card:focus-visible,.btn:focus-visible,.app-link:focus-visible{outline:3px solid #6658e855;outline-offset:1px}.card{position:relative;padding:6px;border:1px solid var(--line);border-left:5px solid var(--ribbon);border-radius:9px;background:#fff;cursor:grab}.card.selected{outline:2px solid var(--accent)}.card-title{display:block;width:100%;padding:0;border:0;background:transparent;color:var(--ink);font-weight:750;text-align:left;cursor:pointer}.card-meta{margin-top:3px;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.transfer-grid,.builder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.transfer-grid{min-height:calc(100dvh - var(--topbar-height) - 70px)}.transfer-grid .panel{display:flex;min-width:0;flex-direction:column}.transfer-grid .matrix-scroll{margin-top:8px}.builder-grid .wide{grid-column:1/-1}.btn,.icon-btn{min-height:36px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.danger{border-color:var(--danger);color:var(--danger)}
dialog{width:min(900px,96vw);max-height:94vh;padding:0;border:0;border-radius:14px;box-shadow:0 24px 80px #0005}dialog::backdrop{background:#0f172a99}#cardDialog .dialog-body{padding:16px;background:#fff}#cardDialog .dialog-head{display:flex;align-items:start;justify-content:space-between}#cardDialog .dialog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:70vh;margin-top:10px;overflow:auto}#cardDialog .span-2{grid-column:1/-1}#cardDialog textarea{min-height:120px}.tag-editor [data-tag-chips],.tag-editor [data-tag-suggestions]{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.tag-editor button{padding:4px 7px;border:0;border-radius:999px;background:var(--accent-soft);color:var(--accent);cursor:pointer}.notes-preview{min-height:70px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.notes-preview a{color:#1d4ed8}.attachment-list{display:flex;flex-wrap:wrap;gap:5px;color:var(--muted)}.dialog-actions{display:flex;justify-content:flex-end;margin-top:10px}.toast{position:fixed;z-index:100;right:16px;bottom:16px;padding:10px 14px;border-radius:9px;background:#101827;color:#fff;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.scrim{display:none}.empty{text-align:center;color:var(--muted)}
@media(max-width:900px){.matrix-workspace{grid-template-columns:1fr}.matrix-manager{max-height:230px;overflow:auto}.definition-grid{grid-template-columns:repeat(2,minmax(120px,1fr))}}
@media(max-width:759px){:root{--topbar-height:58px}.sidebar{transform:translateX(-101%)}.sidebar.open{transform:none}.view{margin-left:0}.scrim.open{display:block;position:fixed;z-index:18;inset:var(--topbar-height) 0 0;background:#0005}.transfer-grid,.builder-grid{grid-template-columns:1fr}.sync-state{display:none}}
@media(max-width:520px){.definition-grid,#cardDialog .dialog-grid{grid-template-columns:1fr}.definition-grid fieldset,#cardDialog .span-2{grid-column:1}.omni{flex-wrap:wrap}}

.kanban-head{display:flex;align-items:end;flex-wrap:wrap;gap:8px;margin-bottom:10px}.kanban-head>div{flex:1}.kanban-head h1{margin:0}.kanban-head p{margin:2px 0;color:var(--muted)}.kanban-head label,.board-create label{display:grid;gap:3px;font-size:12px;font-weight:700}.kanban-head select,.board-create input{padding:8px;border:1px solid var(--line);border-radius:8px}.board-create{display:flex;align-items:end;gap:8px;margin-bottom:10px}.board-create[hidden]{display:none}.kanban-board{display:flex;gap:10px;min-height:calc(100dvh - var(--topbar-height) - 100px);overflow:auto}.kanban-lane{flex:1 0 min(300px,85vw);padding:8px;border:1px solid var(--line);border-radius:12px;background:#e9edf4}.lane-head{display:flex;align-items:center;justify-content:space-between}.lane-head h2{margin:0;font-size:14px}.lane-cards{display:grid;gap:6px;margin-top:8px}.kanban-lane:focus-visible{outline:3px solid #6658e855}.board-chip{border:0;cursor:pointer}.attachment-list span{padding:4px 7px;border-radius:7px;background:var(--bg)}.attachment-list button{border:0;background:transparent;color:var(--danger);cursor:pointer}

  </style>
</head>
<body>
  <div class="portal">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Collapse application sidebar" aria-controls="sidebar" aria-expanded="true"><span aria-hidden="true">☰</span></button>
      <strong id="headerTitle">Board Matrix</strong>
      <div id="appControls" class="app-controls" aria-label="Application controls"></div>
      <span id="syncState" class="sync-state" role="status">Loading boards…</span>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Applications">
      <nav>
        <button class="app-link" data-app="builder"><span>＋</span><span>Kanban</span></button>
        <button class="app-link" data-app="matrix"><span>▦</span><span>Matrix Workspace</span></button>
        <button class="app-link" data-app="transfer"><span>⇄</span><span>Card Transfer</span></button>
        <button class="app-link" data-app="config"><span>⚙</span><span>Configuration</span></button>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="scrim" class="scrim"></div>
  <dialog id="nameDialog"></dialog>
  <dialog id="confirmDialog"></dialog>
  <dialog id="cardDialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  "use strict";
  const FILES={index:"kanban-boards.json",switch:"kanban-switch.json"},KEY="program_portal_configuration_v3",TOKEN_KEY="github_pat";
  const AXES=["title","platform","stage","lineage","statusColor","cardColor"],FIELDS=["platform","stage","lineage","statusColor","cardColor","tags"];
  const APPS={builder:"Kanban",matrix:"Matrix Workspace",transfer:"Card Transfer",config:"Configuration"};
  const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`,slug=s=>String(s||"").trim().toLowerCase().replace(/[^a-z0-9_-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  const defaults=()=>({version:3,portalName:"Program",github:{owner:"acmeproducts",repo:"stuff",branch:"main",pat:localStorage.getItem(TOKEN_KEY)||""},matrices:[],selectedApp:"matrix",selectedMatrix:"",sidebarCollapsed:false,matrixOrder:{}});
  let config=defaults(),index={boards:[]},repoCfg={},boardData={},state={},drag=null,touch=null,saveQueue=Promise.resolve(),toastTimer;
  const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},safeFields=a=>(Array.isArray(a)?a:[]).filter(x=>FIELDS.includes(x));
  function migrate(){const old=read(KEY,null);config={...defaults(),...(old||{}),github:{...defaults().github,...(old?.github||{})}};config.matrices=(config.matrices||[]).map(d=>({...d,fields:safeFields(d.fields),intersection:FIELDS.concat("title").includes(d.intersection)?d.intersection:"title"}));if(!APPS[config.selectedApp])config.selectedApp="matrix";persist()}
  function persist(){localStorage.setItem(KEY,JSON.stringify(config));localStorage.setItem(TOKEN_KEY,config.github.pat||"");document.title=`${config.portalName} Portal`}
  function notify(s){const t=$("#toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
  function sync(s,k=""){$("#syncState").textContent=s;$("#syncState").className=`sync-state ${k}`}
  async function fetchJson(p){const r=await fetch(p,{cache:"no-store"});if(!r.ok)throw Error(`${r.status} loading ${p}`);return r.json()}
  const boardPath=n=>`${typeof repoCfg.pathPrefix==="string"?repoCfg.pathPrefix:""}${slug(n)}.json`,boards=()=>index.boards.filter(b=>!b.archived&&boardData[b.name]),cards=n=>boardData[n]?.cards||[],defaultBoard=()=>boards().find(b=>b.name===index.activeBoard)?.name||boards()[0]?.name||"";
  const value=(c,f)=>String(c?.[f]??(f==="stage"?c?.lane:"")).trim()||"Unassigned",options=(a,s,blank="")=>`${blank?`<option value="">${esc(blank)}</option>`:""}${a.map(v=>`<option value="${esc(v)}" ${v===s?"selected":""}>${esc(v)}</option>`).join("")}`;
  const stages=n=>[...new Set([...(boardData[n]?.stages||boardData[n]?.lanes||[]).map(x=>typeof x==="string"?x:x.name),...cards(n).map(c=>c.stage||c.lane||"Backlog")])].filter(Boolean),activeDefs=()=>config.matrices.filter(d=>!d.deletedAt&&boardData[d.board]);
  function bindShell(){$("#sidebarToggle").onclick=()=>setSidebar(config.sidebarCollapsed);$("#scrim").onclick=()=>setSidebar(false);$$('[data-app]').forEach(b=>b.onclick=()=>openApp(b.dataset.app))}
  function setSidebar(open){config.sidebarCollapsed=!open;persist();$(".portal").classList.toggle("sidebar-collapsed",!open);$("#sidebar").classList.toggle("open",open);$("#scrim").classList.toggle("open",open&&innerWidth<760)}
  function openApp(app){config.selectedApp=app;persist();$("#headerTitle").textContent=APPS[app];$("#appControls").replaceChildren();$$('[data-app]').forEach(b=>b.classList.toggle("active",b.dataset.app===app));state={};({matrix:renderWorkspace,transfer:renderTransfer,builder:renderBuilder,config:renderConfig}[app])()}
  function boardOptions(s){return options(boards().map(b=>b.name),s,"Select board")}
  function validateDef(d){if(!d.name?.trim())return"Name is required.";if(!d.board)return"Board is required.";if(!AXES.includes(d.x)||!AXES.includes(d.y))return"Columns and rows are required.";if(d.x===d.y)return"Columns and rows must be different.";if(d.z&&!AXES.includes(d.z))return"Filter must be a safe scalar field.";return""}
  function tagValues(board){return[...new Set(cards(board).flatMap(c=>Array.isArray(c.tags)?c.tags:[]).map(String).filter(Boolean))].sort()}
  function fieldChecks(d){return FIELDS.map(f=>`<label class="check"><input type="checkbox" name="fields" value="${f}" ${d.fields.includes(f)?"checked":""}> ${f}</label>`).join("")+tagValues(d.board).map(t=>`<span class="tag-suggestion">#${esc(t)}</span>`).join("")}
  function blankDef(){return{id:"",name:"New matrix",board:defaultBoard(),x:"platform",y:"stage",z:"",intersection:"title",fields:["platform","stage"],createdAt:new Date().toISOString(),deletedAt:null}}
  function renderWorkspace(){const root=$("#view"),defs=activeDefs();let def=defs.find(d=>d.id===config.selectedMatrix)||defs[0];if(!def)def=blankDef();state.def={...def,fields:[...def.fields]};root.innerHTML=`<div class="matrix-workspace"><aside class="matrix-manager panel"><div class="manager-head"><h2>Matrix Manager</h2><button type="button" class="btn primary" data-new>＋ Add</button></div><div class="definition-list">${defs.map(d=>`<button type="button" class="definition ${d.id===def.id?"active":""}" data-def="${d.id}"><b>${esc(d.name)}</b><small>${esc(d.board)} · ${esc(d.x)} × ${esc(d.y)}</small></button>`).join("")||'<p class="empty">No saved matrices.</p>'}</div></aside><section class="matrix-viewer panel"><div class="viewer-head"><div><h2>Matrix Viewer</h2><p>Define a matrix, search it, and move cards.</p></div>${def.id?`<button type="button" class="btn danger" data-delete>Delete</button>`:""}</div><details class="definition-editor" open><summary>Create / edit matrix</summary><form data-definition>${definitionForm(state.def)}</form><div data-message></div></details><div class="omni"><label>Omni search <input type="search" data-search placeholder="(backlog, gemini, -May -June)"></label><button type="button" class="btn" data-clear>Clear</button><output data-count></output></div><div class="matrix-scroll"><div class="matrix-grid"></div></div></section></div>`;
    const form=$('[data-definition]',root),commit=()=>{readDef(form,state.def);const err=validateDef(state.def);if(err)return showMessage(root,err);const now=new Date().toISOString();if(state.def.id){const saved=config.matrices.find(d=>d.id===state.def.id);Object.assign(saved,state.def,{fields:safeFields(state.def.fields),updatedAt:now})}else{state.def.id=uid();config.matrices.push({...state.def,fields:safeFields(state.def.fields),createdAt:now,updatedAt:now});config.selectedMatrix=state.def.id}persist();drawWorkspaceMatrix(root);notify("Matrix updated")};
    form.onchange=e=>{if(e.target.name==="board"){state.def.board=e.target.value;$("[data-fields]",form).innerHTML=fieldChecks({...state.def,fields:safeFields(state.def.fields)})}commit()};form.addEventListener("focusout",e=>{if(e.target.matches("input,select"))commit()});form.onkeydown=e=>{if(e.key==="Enter"&&e.target.tagName!=="TEXTAREA"){e.preventDefault();commit()}};
    $$('[data-def]',root).forEach(b=>b.onclick=()=>{config.selectedMatrix=b.dataset.def;persist();renderWorkspace()});$('[data-new]',root).onclick=()=>{config.selectedMatrix="";persist();renderWorkspace()};$('[data-delete]',root)?.addEventListener("click",()=>{const d=config.matrices.find(x=>x.id===state.def.id);if(d){d.deletedAt=new Date().toISOString();config.selectedMatrix="";persist();renderWorkspace()}});$('[data-search]',root).oninput=()=>drawWorkspaceMatrix(root);$('[data-clear]',root).onclick=()=>{$('[data-search]',root).value="";drawWorkspaceMatrix(root)};drawWorkspaceMatrix(root)}
  function definitionForm(d){return`<div class="definition-grid"><label>Name of Matrix<input name="name" value="${esc(d.name)}" required></label><label>Board<select name="board">${boardOptions(d.board)}</select></label><label>Columns<select name="x">${options(AXES,d.x)}</select></label><label>Rows<select name="y">${options(AXES,d.y)}</select></label><label>Filter axis<select name="z">${options(AXES,d.z,"None")}</select></label><label>Card title field<select name="intersection">${options(["title",...FIELDS],d.intersection)}</select></label><fieldset data-fields><legend>Card fields</legend>${fieldChecks(d)}</fieldset></div>`}
  function readDef(form,d){const f=new FormData(form);Object.assign(d,{name:f.get("name").trim(),board:f.get("board"),x:f.get("x"),y:f.get("y"),z:f.get("z"),intersection:f.get("intersection"),fields:safeFields(f.getAll("fields"))})}
  function showMessage(root,msg){$("[data-message]",root).innerHTML=msg?`<p class="message error">${esc(msg)}</p>`:""}
  function parseSearch(q){const parts=String(q||"").replace(/[(),]/g," ").trim().toLowerCase().split(/\s+/).filter(Boolean),includes=[],excludes=[];parts.forEach(p=>(p[0]==="-"&&p.length>1?excludes:includes).push(p.replace(/^-/,"")));return{includes,excludes}}
  function haystack(c){return[c.title,c.platform,c.stage,c.lane,c.lineage,c.statusColor,c.notes,c.dev,c.live,...(c.tags||[]),...(c.files||[]).map(f=>f.name)].join(" ").toLowerCase()}
  function filterCards(list,q){const{includes,excludes}=parseSearch(q);return list.filter(c=>{const h=haystack(c);return includes.every(x=>h.includes(x))&&!excludes.some(x=>h.includes(x))})}
  function drawWorkspaceMatrix(root){const q=$('[data-search]',root)?.value||"",all=cards(state.def.board),shown=filterCards(all,q);$('[data-count]',root).textContent=q?`${shown.length} of ${all.length} cards`: `${all.length} cards`;drawMatrix($(".matrix-grid",root),state.def,{list:shown,axisList:all})}
  function orderedValues(list,field,def,axis){const vals=[...new Set(list.map(c=>value(c,field)))],key=`${def.id||def.board}:${axis}:${field}`,saved=config.matrixOrder[key]||[];return[...saved.filter(v=>vals.includes(v)),...vals.filter(v=>!saved.includes(v)).sort((a,b)=>a.localeCompare(b))]}
  function cardMarkup(c,board,def){const meta=safeFields(def.fields).filter(f=>f!==def.intersection).map(f=>`${f}: ${value(c,f)}`).join(" · ");return`<article class="card" draggable="true" tabindex="0" data-card="${esc(c.id)}" data-board="${esc(board)}" style="${c.cardColor?`--ribbon:${esc(c.cardColor)}`:""}"><button type="button" class="card-title">${esc(value(c,def.intersection||"title"))}</button>${meta?`<div class="card-meta">${esc(meta)}</div>`:""}</article>`}
  function drawMatrix(root,def,{list=cards(def.board),axisList=cards(def.board),drop=true}={}){if(!root)return;const xs=orderedValues(axisList,def.x,def,"x"),ys=orderedValues(axisList,def.y,def,"y");root.style.setProperty("--matrix-columns",Math.max(xs.length,1));root.style.setProperty("--matrix-rows",Math.max(ys.length,1));root.innerHTML=`<div class="matrix-corner"><button type="button" class="board-chip" data-open-board="${esc(def.board)}" aria-label="Open ${esc(def.board)} in Kanban view">${esc(def.board)}</button></div>${xs.map(x=>`<div class="matrix-header">${esc(x)}</div>`).join("")}`;ys.forEach(y=>{root.insertAdjacentHTML("beforeend",`<div class="matrix-rowhead">${esc(y)}</div>`);xs.forEach(x=>{const cs=list.filter(c=>value(c,def.x)===x&&value(c,def.y)===y).sort((a,b)=>(a.position??a.pos??0)-(b.position??b.pos??0));root.insertAdjacentHTML("beforeend",`<div class="matrix-cell" tabindex="0" data-board="${esc(def.board)}" data-x="${esc(x)}" data-y="${esc(y)}">${cs.map(c=>cardMarkup(c,def.board,def)).join("")}</div>`)})});wireCards(root);$$(`[data-open-board]`,root).forEach(b=>b.onclick=()=>openKanban(b.dataset.openBoard));if(drop)wireDrops(root,def)}
  function wireCards(root){$$('.card',root).forEach(el=>{$('.card-title',el).onclick=e=>{e.stopPropagation();openCardEditor(el.dataset.board,el.dataset.card)};el.onkeydown=e=>{if(e.key==="Enter")openCardEditor(el.dataset.board,el.dataset.card)};el.ondragstart=()=>drag={board:el.dataset.board,id:el.dataset.card};el.onclick=e=>{if(!e.target.closest("button")){touch={board:el.dataset.board,id:el.dataset.card};el.classList.add("selected")}}})}

  function openCardEditor(board,id){const c=cards(board).find(x=>String(x.id)===String(id));if(!c)return;const d=$("#cardDialog"),tags=normalizeTags(c.tags),suggestions=tagValues(board);d.innerHTML=`<form class="dialog-body" novalidate><div class="dialog-head"><div><h2 id="cardEditorTitle">Edit card</h2><small>${esc(board)}</small></div><button type="button" class="icon-btn" data-close aria-label="Save and close">×</button></div><div class="dialog-grid"><label class="span-2">Title<input name="title" required value="${esc(c.title)}"></label><label>Platform<input name="platform" value="${esc(c.platform)}"></label><label>Stage<select name="stage">${options(stages(board),c.stage||c.lane)}</select></label><label>Lineage<input name="lineage" value="${esc(c.lineage)}"></label><label>Status<input name="statusColor" value="${esc(c.statusColor)}"></label><label>Card color<input type="color" name="cardColor" value="${/^#[0-9a-f]{6}$/i.test(c.cardColor)?c.cardColor:"#64748b"}"></label><div class="span-2 tag-editor"><label>Tags<input name="tagInput" placeholder="type a tag, press Enter"></label><div data-tag-chips></div><div data-tag-suggestions>${suggestions.map(t=>`<button type="button" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div></div><label class="span-2">Development link<input name="dev" value="${esc(c.dev)}"></label><label class="span-2">Live link<input name="live" value="${esc(c.live)}"></label><div class="span-2 notes-editor"><label>Notes<textarea name="notes">${esc(c.notes)}</textarea></label><div class="notes-preview" data-notes-preview tabindex="0"></div></div><label class="span-2">Attachments<input type="file" name="files" multiple></label><div class="span-2 attachment-list" data-attachments>${(c.files||[]).map((f,i)=>`<span>${esc(f.name||"attachment")} <button type="button" data-remove-file="${i}" aria-label="Remove ${esc(f.name||"attachment")}">×</button></span>`).join("")||"No attachments"}</div></div><div class="dialog-actions"><button type="button"   function renderTransfer(){const root=$("#view"),defs=activeDefs();state.left=defs.find(d=>d.id===state.left)?.id||defs[0]?.id;state.right=defs.find(d=>d.id===state.right)?.id||defs.find(d=>d.id!==state.left)?.id||defs[0]?.id;root.innerHTML=`<div class="view-head"><h1>Card Transfer</h1><p>Move cards between saved matrix definitions.</p></div><div class="transfer-grid"><section class="panel" data-side="left"></section><section class="panel" data-side="right"></section></div>`;["left","right"].forEach(side=>drawTransferSide(root,side,defs))}

  function openKanban(board){state.kanbanBoard=board||defaultBoard();config.selectedApp="builder";persist();$("#headerTitle").textContent=APPS.builder;$$(`[data-app]`).forEach(b=>b.classList.toggle("active",b.dataset.app==="builder"));renderKanban()}
