<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Program Portal</title>
  <link rel="stylesheet" href="program.css">
</head>
<body>
  <div class="portal">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Collapse application sidebar" aria-controls="sidebar" aria-expanded="true"><span aria-hidden="true">☰</span></button>
      <strong id="headerTitle">Board Matrix</strong>
      <span id="syncState" class="sync-state" role="status">Loading boards…</span>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Applications">
      <div class="brand"><span class="brand-mark">P</span><span><strong id="portalName">Program</strong><small>Planning portal</small></span></div>
      <nav>
        <button class="app-link" data-app="matrix"><span>▦</span><span>Board Matrix</span></button>
        <button class="app-link" data-app="transfer"><span>⇄</span><span>Card Transfer</span></button>
        <button class="app-link" data-app="create"><span>＋</span><span>Create Matrix</span></button>
        <button class="app-link" data-app="use"><span>▶</span><span>Use Matrix</span></button>
        <button class="app-link" data-app="mashup"><span>▥</span><span>Create Matrix Mashup</span></button>
        <button class="app-link" data-app="config"><span>⚙</span><span>Configuration</span></button>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="scrim" class="scrim"></div>
  <dialog id="cardDialog"></dialog>
  <dialog id="nameDialog"></dialog>
  <dialog id="confirmDialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="program.js"></script>
</body>
</html>
