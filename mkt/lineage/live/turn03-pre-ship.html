n systemPrompt(packet){return`You are the Market Navigator analysis assistant. Analyze only the supplied canonical evidence and clearly distinguish evidence from interpretation. Output GitHub-flavored Markdown. When you reference an external source or recommend further research, provide a direct working Markdown hyperlink when you know the URL; never invent a URL. Evidence packet:\n${JSON.stringify(packet)}`}async function startAI(){let now=new Date().toISOString(),a={id:'a-'+Date.now(),title:`${S.health.series[S.analysisRoot]?.shortName||short(S.analysisRoot)} · ${S.h} Analysis`,status:'processing',createdAt:now,updatedAt:now,state:evidencePacket(),provider:config().provider,model:config().model,turns:[{role:'system',content:'Analysis created from frozen Market Navigator evidence.',at:now},{role:'assistant',content:'Processing…',at:now,processing:true}]};a=saveAnalysis(a);nav('library');renderLibrary(a.id);try{let text=await callAI([{role:'system',content:systemPrompt(a.state)},{role:'user',content:'Provide a concise market analysis of this evidence: what changed, what is driving it, evidence limitations, and what to watch next.'}]);let all=analyses(),z=all.find(x=>x.id===a.id);z.turns=z.turns.filter(t=>!t.processing);z.turns.push({role:'assistant',content:text,at:new Date().toISOString()});z.status='ready';z.updatedAt=new Date().toISOString();saveAnalysis(z);renderLibrary(z.id)}catch(e){let all=analyses(),z=all.find(x=>x.id===a.id);z.turns=z.turns.filter(t=>!t.processing);z.turns.push({role:'assistant',content:`**Analysis failed:** ${e.message}`,at:new Date().toISOString()});z.status='failed';z.updatedAt=new Date().toISOString();saveAnalysis(z);renderLibrary(z.id)}}$('runAI').onclick=startAI;function md(s){return DOMPurify.sanitize(marked.parse(s||''),{ADD_ATTR:['target','rel']})}function renderLibrary(select){let q=$('libSearch').value.toLowerCase(),all=analyses().filter(a=>`${a.title} ${a.status}`.toLowerCase().includes(q));if(select)S.activeAnalysis=select;$('l
