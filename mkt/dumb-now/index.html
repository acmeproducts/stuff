<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Market Navigator - modular NOW</title>
<style>
:root{--bg:#081420;--panel:#0c1c2b;--line:#1d3a52;--txt:#e6f0f8;--mut:#7f9bb2;--acc:#4cc9ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12px/1.3 system-ui,sans-serif;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100dvh}
.panel{display:flex;flex-direction:column;min-height:0;flex:1;padding:6px 8px}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.crumb{font-weight:700;color:#8fd6ff;white-space:nowrap;font-size:11px}
.hz{display:flex;gap:4px;margin-left:auto}
.btn,.lg,select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:6px;font:inherit;padding:4px 7px}
.hz .btn{font-size:10px;font-weight:700;padding:4px 6px}
.btn.on{border-color:#fff;background:#10253a}
.tabs{display:flex;gap:6px;margin:6px 0}
.tabs .btn{flex:1;font-weight:700}
.legend{display:flex;gap:5px;overflow-x:auto;padding:4px 0;scrollbar-width:none;touch-action:pan-x}
.lg{display:flex;align-items:center;gap:5px;font-size:10px;white-space:nowrap;flex:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lg.active{border-color:#fff;background:#10253a}
.lg.off{opacity:.38}
.lg .sw{width:12px;height:3px;border-radius:2px}
.lg .x{opacity:.7;margin-left:2px;padding:0 2px}
.wrap{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:#0a1826}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.read{position:absolute;left:8px;top:8px;background:#0c1c2bee;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:10px;max-width:80%;pointer-events:none;display:none}
.foot{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:10px;color:var(--mut)}
.foot select{font-size:10px;padding:3px 4px}
.foot .grow{flex:1}
.card{position:fixed;left:10px;right:10px;bottom:12px;background:#0c1c2b;border:1px solid #2b5373;border-radius:10px;padding:10px;z-index:30;display:none}
.card h4{margin:0 0 4px;font-size:13px}.card .kv{color:var(--mut);font-size:11px;margin-bottom:8px}
.card .row{display:flex;gap:8px}.card .ic{background:#10253a;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:none}.ov.on{display:block}
.picker{position:fixed;inset:0;background:#000a;z-index:50;display:none}.picker.on{display:flex;align-items:flex-end}
.picker .sheet{background:#0c1c2b;width:100%;max-height:70%;overflow:auto;border-radius:12px 12px 0 0;padding:10px}
.picker input{width:100%;background:#081420;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px}
.picker .it{padding:8px;border-bottom:1px solid #16314a}.picker .it.dis{opacity:.4}
.err{padding:16px;color:#ffb4b4}
</style></head><body>
<div class="app" id="app"><div class="panel" id="nowRoot"></div></div>
<div class="card" id="card"></div>
<div class="ov" id="view-analyze"><div class="panel" id="analyzeRoot"></div></div>
<div class="picker" id="picker"><div class="sheet"><input id="pickQ" placeholder="Search series" autocomplete="off"><div id="pickList"></div></div></div>
<script>
'use strict';
/* ===== MNStore: reads pre-built packages. No calculation. ===== */
const MNStore=(()=>{const c={};let man=null;
 async function j(u){const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u+' '+r.status);return r.json()}
 return{async manifest(){return man||(man=await j('store/manifest.json'))},async pkg(h){return c[h]||(c[h]=await j('store/series-'+h+'.json'))}}})();

/* ===== MNChart: draws arrays it is given on equal slots. No dates, no rebasing, no filtering. ===== */
const MNChart=(()=>{
 const PAL=['#ff9f43','#b28dff','#4d8dff','#f6e05e','#7bd88f','#ff7eb6','#8ee0d3','#c2a878','#9aa7b4','#d0e86a'];
 const FIX={risk:'#29d3ff',growth:'#ffd166',macro:'#5be3a0'};
 const colorOf=(id,i)=>FIX[id]||PAL[Math.abs([...id].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7))%PAL.length];
 class Chart{
  constructor(canvas,readout){this.c=canvas;this.r=readout;this.d=null;this.sel=-1;this.active=null;
   const pt=e=>{const b=canvas.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
   canvas.addEventListener('pointerdown',e=>{this._pt(pt(e))});
   canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')this._pt(pt(e))});
   canvas.addEventListener('contextmenu',e=>e.preventDefault());
   new ResizeObserver(()=>this.draw()).observe(canvas)}
  set(d){this.d=d;this.sel=-1;this.draw()}
  _geo(){const w=this.c.clientWidth,h=this.c.clientHeight,d=this.d,y2=d&&d.series.some(s=>s.axis==='Y2');return{w,h,L:44,R:y2?46:10,T:16,B:22}}
  _pt(p){if(!this.d)return;const g=this._geo(),n=this.d.slots.length;let i=n===1?0:Math.round((p.x-g.L)/((g.w-g.L-g.R)/(n-1)));i=Math.max(0,Math.min(n-1,i));this.sel=i;this.draw();this._read(i)}
  _read(i){if(!this.r)return;const d=this.d;this.r.style.display='block';this.r.innerHTML='<b>'+d.slots[i]+'</b>'+d.series.map(s=>{const v=s.values[i];return'<div style="color:'+s.color+'">'+s.label+' '+(v==null?'-':fmt(v))+(s.axis==='Y2'?' '+(s.unit||''):'')+'</div>'}).join('')}
  draw(){const c=this.c;if(!c.clientWidth)return;const dpr=devicePixelRatio||1;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const g=this._geo();x.clearRect(0,0,g.w,g.h);const d=this.d;if(!d)return;
   const n=d.slots.length,pw=g.w-g.L-g.R,ph=g.h-g.T-g.B,X=i=>n===1?g.L+pw/2:g.L+i*pw/(n-1);
   const rng=ax=>{let lo=Infinity,hi=-Infinity;d.series.filter(s=>s.axis===ax).forEach(s=>s.values.forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));if(!isFinite(lo))return null;if(lo===hi){lo-=1;hi+=1}const p=(hi-lo)*.06;return[lo-p,hi+p]};
   const R1=rng('Y1'),R2=rng('Y2'),Y=(r,v)=>g.T+ph-(v-r[0])/(r[1]-r[0])*ph;
   x.font='10px system-ui';x.strokeStyle='#17324a';x.fillStyle='#7f9bb2';x.lineWidth=1;
   for(let k=0;k<=4;k++){const yy=g.T+ph*k/4;x.beginPath();x.moveTo(g.L,yy);x.lineTo(g.w-g.R,yy);x.stroke();
    if(R1){x.textAlign='right';x.fillStyle='#7f9bb2';x.fillText(fmt(R1[1]-(R1[1]-R1[0])*k/4),g.L-4,yy+3)}
    if(R2){x.textAlign='left';x.fillStyle='#e0b872';x.fillText(fmt(R2[1]-(R2[1]-R2[0])*k/4),g.w-g.R+4,yy+3)}}
   x.fillStyle='#7f9bb2';if(R1){x.textAlign='left';x.fillText(d.axisLabel1||'',4,10)}if(R2){x.textAlign='right';x.fillStyle='#e0b872';x.fillText(d.axisLabel2||'',g.w-4,10)}
   const tk=n<=6?n:4;x.fillStyle='#7f9bb2';for(let k=0;k<tk;k++){const i=tk===1?0:Math.round(k*(n-1)/(tk-1));x.textAlign=k===0?'left':k===tk-1?'right':'center';x.fillText(d.tick(d.slots[i]),X(i),g.h-6)}
   d.series.forEach(s=>{const r=s.axis==='Y2'?R2:R1;if(!r)return;const act=this.active===s.id||!this.active;x.globalAlpha=act?1:.45;x.strokeStyle=x.fillStyle=s.color;x.lineWidth=this.active===s.id?2.4:1.4;let pen=false;x.beginPath();
    s.values.forEach((v,i)=>{if(v==null){pen=false;return}const px=X(i),py=Y(r,v);if(!pen){x.moveTo(px,py);pen=true}else x.lineTo(px,py)});
    if(d.render==='line')x.stroke();s.values.forEach((v,i)=>{if(v==null)return;const prev=s.values[i-1],next=s.values[i+1];if(d.render==='point'||(prev==null&&next==null)){x.beginPath();x.arc(X(i),Y(r,v),3,0,7);x.fill()}});x.globalAlpha=1});
   if(this.sel>=0){x.strokeStyle='#ffffff77';x.setLineDash([3,3]);x.beginPath();x.moveTo(X(this.sel),g.T);x.lineTo(X(this.sel),g.T+ph);x.stroke();x.setLineDash([])}}
 }
 const fmt=v=>Math.abs(v)>=1000?v.toLocaleString(undefined,{maximumFractionDigits:0}):(+v).toFixed(Math.abs(v)<10?3:2).replace(/\.?0+$/,'');
 return{Chart,colorOf,fmt}})();

/* ===== ChartPanel: header + legend + chart + controls, bound to a state. NOW, Analyze and future small multiples all use this. ===== */
const Bus=s=>({s,subs:[],on(f){this.subs.push(f)},set(p){Object.assign(this.s,p);this.subs.forEach(f=>f(this.s))}});
const tick=(h,d)=>{const[y,m,dd]=d.split('-');const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1];return(h==='3YR'||h==='5YR')?mo+' '+y.slice(2):(h==='1YR'||h==='YTD')?mo:mo+' '+(+dd)};
class ChartPanel{
 constructor(root,bus,opt={}){this.root=root;this.bus=bus;this.opt=opt;this.man=null;root.innerHTML=`
  <div class="bar"><span class="crumb"></span><div class="hz"></div>${opt.close?'<button class="btn" data-close aria-label="Close">×</button>':''}</div>
  ${opt.tabs?'<div class="tabs"></div>':''}<div class="legend"></div>
  <div class="wrap"><canvas></canvas><div class="read"></div></div>
  <div class="foot"><span class="range"></span><span class="grow"></span><select class="repr"><option value="indexed">Indexed 100</option><option value="dual">Dual axis</option></select><select class="disp"><option value="horizon">Horizon</option><option value="fixed">Fixed</option></select></div>`;
  this.q=s=>root.querySelector(s);this.chart=new MNChart.Chart(this.q('canvas'),this.q('.read'));
  this.q('.repr').onchange=e=>bus.set({repr:e.target.value});this.q('.disp').onchange=e=>bus.set({disp:e.target.value});
  this.q('[data-close]')&&(this.q('[data-close]').onclick=()=>opt.onClose&&opt.onClose());
  bus.on(()=>this.render());this.init()}
 async init(){try{this.man=await MNStore.manifest();this.cat=Object.fromEntries(this.man.catalog.map(c=>[c.id,c]));
   const hz=this.q('.hz');hz.innerHTML=this.man.horizons.map(h=>`<button class="btn" data-h="${h}">${h}</button>`).join('');hz.onclick=e=>{const h=e.target.dataset.h;if(h)this.bus.set({h})};
   if(this.opt.tabs){const t=this.q('.tabs');t.innerHTML=Object.entries(this.man.indices).map(([k,v])=>`<button class="btn" data-ix="${k}">${v.label}</button>`).join('');t.onclick=e=>{const k=e.target.dataset.ix;if(k)this.bus.set({index:k,ids:[k,...this.man.indices[k].components],active:k})}}
   await this.render()}catch(e){this.root.innerHTML='<div class="err">'+e.message+'</div>'}}
 async render(){const s=this.bus.s,man=this.man;if(!man)return;const pk=await MNStore.pkg(s.h);
  this.q('.crumb').textContent='ENV / '+man.indices[s.index].label+' / *';
  this.root.querySelectorAll('.hz .btn').forEach(b=>b.classList.toggle('on',b.dataset.h===s.h));
  this.root.querySelectorAll('.tabs .btn').forEach(b=>b.classList.toggle('on',b.dataset.ix===s.index));
  this.q('.repr').value=s.repr;this.q('.disp').value=s.disp;
  const rows=s.ids.map(id=>({id,p:pk.series[id],c:this.cat[id]})).filter(r=>r.p);
  const lg=this.q('.legend');lg.innerHTML=rows.map(r=>`<button class="lg ${r.id===s.active?'active':''} ${r.p.available?'':'off'}" data-id="${r.id}" ${r.p.available?'':'disabled aria-disabled="true"'} title="${r.c.name}${r.p.available?'':' - unavailable for '+s.h}"><span class="sw" style="background:${MNChart.colorOf(r.id)}"></span>${r.c.label}${r.id===s.index?'':'<span class="x" data-rm="'+r.id+'">×</span>'}</button>`).join('')+'<button class="lg" data-add>+ Add</button>';
  const grp=s.repr==='dual';const vis=rows.filter(r=>r.p.available);
  const series=vis.map(r=>{const y2=grp&&r.p.axis==='Y2';return{id:r.id,label:r.c.label,unit:r.c.unit,color:MNChart.colorOf(r.id),axis:y2?'Y2':'Y1',values:y2?r.p.native:r.p[s.disp]}});
  const u2=[...new Set(series.filter(x=>x.axis==='Y2').map(x=>x.unit))];
  this.chart.active=s.active;this.chart.set({slots:pk.slots,render:pk.render,series,tick:d=>tick(s.h,d),axisLabel1:'Indexed 100',axisLabel2:u2.join(' / ')});
  this.q('.range').textContent=pk.slots[0]+' > '+pk.slots[pk.slots.length-1]+'  ('+pk.slots.length+' batches)';
  this.wireLegend(lg)}
 wireLegend(lg){const s=this.bus.s;lg.querySelectorAll('[data-id]').forEach(b=>{const id=b.dataset.id;let t=null,long=false;
   b.addEventListener('pointerdown',()=>{long=false;t=setTimeout(()=>{long=true;this.opt.onCard&&this.opt.onCard(id,this)},450)});
   for(const ev of['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>clearTimeout(t));
   b.addEventListener('contextmenu',e=>{e.preventDefault();clearTimeout(t);this.opt.onCard&&this.opt.onCard(id,this)});
   b.addEventListener('click',e=>{if(long){long=false;return}const rm=e.target.dataset.rm;if(rm){this.bus.set({ids:s.ids.filter(x=>x!==rm),active:s.active===rm?s.index:s.active});return}if(!b.disabled)this.bus.set({active:id})})});
  const add=lg.querySelector('[data-add]');if(add)add.onclick=()=>this.opt.onAdd&&this.opt.onAdd(this)}
}

/* ===== App wiring (NOW + Analyze) ===== */
const initial={index:'risk',ids:null,h:'5D',disp:'horizon',repr:'indexed',active:'risk'};
const nowBus=Bus({...initial});let anBus=null,anPanel=null;
const card=document.getElementById('card'),ov=document.getElementById('view-analyze'),picker=document.getElementById('picker');
function showCard(id,panel){const c=panel.cat[id],pk=MNStore;card.innerHTML=`<h4>${c.label} - ${c.name}</h4><div class="kv">${c.unit} - ${c.cadence}</div><div class="row"><button class="ic" id="analyzeBtn" aria-label="Analyze"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fd6ff" stroke-width="2"><path d="M3 20V4M3 20h18M7 15l4-4 3 3 6-7"/></svg>Analyze</button><button class="ic" id="cardClose">Close</button></div>`;card.style.display='block';
 document.getElementById('cardClose').onclick=()=>card.style.display='none';
 document.getElementById('analyzeBtn').onclick=()=>{card.style.display='none';openAnalyze(id,panel)}}
function openAnalyze(id,from){const s=from.bus.s;anBus=Bus({index:s.index,ids:[...s.ids],h:s.h,disp:s.disp,repr:s.repr,active:id});ov.classList.add('on');
 anPanel=new ChartPanel(document.getElementById('analyzeRoot'),anBus,{close:true,onClose:()=>{ov.classList.remove('on');document.getElementById('analyzeRoot').innerHTML='';anBus=anPanel=null},onCard:showCard,onAdd:openPicker})}
function openPicker(panel){const man=panel.man,q=document.getElementById('pickQ'),list=document.getElementById('pickList');
 const draw=()=>{const t=q.value.toLowerCase();list.innerHTML=man.catalog.filter(c=>!t||(c.label+c.name).toLowerCase().includes(t)).map(c=>`<div class="it ${panel.bus.s.ids.includes(c.id)?'dis':''}" data-id="${c.id}" data-add-now="${c.id}"><b>${c.label}</b> - ${c.name}<br><span style="color:#7f9bb2">${c.unit} - ${c.cadence}</span></div>`).join('')};
 q.value='';draw();q.oninput=draw;picker.classList.add('on');
 list.onclick=e=>{const it=e.target.closest('.it');if(!it||it.classList.contains('dis'))return;panel.bus.set({ids:[...panel.bus.s.ids,it.dataset.id]});picker.classList.remove('on')};
 picker.onclick=e=>{if(e.target===picker)picker.classList.remove('on')}}
(async()=>{const man=await MNStore.manifest();nowBus.s.ids=[ 'risk',...man.indices.risk.components];
 window.nowPanel=new ChartPanel(document.getElementById('nowRoot'),nowBus,{tabs:true,onCard:showCard,onAdd:openPicker})})();
</script></body></html>
