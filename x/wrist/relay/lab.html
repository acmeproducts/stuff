<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>X · wrist lab</title>
<style>
:root{--bg:#0b1016;--panel:#131b24;--panel2:#17232e;--line:#243140;--text:#e8eef4;--muted:#8a98a6;--good:#4cc38a;--bad:#e5534b;--warn:#e5a23b;--accent:#39c5cf}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px}
button:active{background:var(--panel2)}
#offBtn{position:relative;overflow:hidden;padding:5px 10px;font-size:13px;color:var(--muted)}
#offBtn::before{content:"";position:absolute;inset:0;background:var(--bad);opacity:.5;transform:scaleX(0);transform-origin:left}
#offBtn.hold::before{transform:scaleX(1);transition:transform 1s linear}
#active.nostrip #strip,#active.nostrip #hint{display:none}
.linkbox h3{margin:6px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-align:left;font-weight:650}
.linkbox .scrollx{overflow-x:auto;text-align:left}
.linkbox .kv{text-align:left;font-size:14px;color:var(--text);line-height:1.6}
.linkbox .kv b.bad{color:var(--bad)}
.camview{position:relative;width:100%;max-width:520px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.camview video,.camview canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camview.small{max-width:230px}
.camview.off{display:none}
.camview.corner{position:absolute;right:8px;top:8px;width:28%;max-width:170px;margin:0;border-radius:10px;opacity:.92;border:1px solid var(--line)}
.obj{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#0d141b;border:1px solid var(--line)}
.obj>canvas{width:100%;height:100%;display:block}
.objbox{gap:8px}
select,input[type=text]{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;min-width:0;max-width:100%}
.row select,.row input[type=text]{flex:1;min-width:92px}
.sigrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;transition:background .15s}
.siglist{display:grid;gap:8px}
.sigrow>div{min-width:0}
.sigrow b{display:block;overflow-wrap:anywhere}
.sigrow em{font-style:normal;color:var(--muted);font-size:13.5px}
.sigrow button{padding:8px 10px;font-size:14px;color:var(--muted);flex:none}
.sigrow select{flex:none;max-width:48%;padding:10px 8px}
.sigrow.lit{background:var(--good);border-color:var(--good);color:#06140d}
.sigrow.lit em{color:#06140d}
.buzzgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buzzgrid button{padding:18px 8px;font-weight:650}
/* ---------- grid ---------- */
#grid{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
#top{padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
#top h1{margin:0;font-size:24px;font-weight:750}
#statusRow{display:flex;align-items:center;gap:9px;font-size:15px;margin-top:6px}
#lamp{width:11px;height:11px;border-radius:50%;background:var(--bad);flex:none}
#lamp.link{background:var(--warn)}#lamp.live{background:var(--good)}
#statusText{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meta{color:var(--muted);font-size:12.5px;margin-top:4px;font-variant-numeric:tabular-nums}
#cards{overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-content:start}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;text-align:left;display:grid;gap:6px;min-height:132px;align-content:start}
.tile b{font-size:19px;font-weight:680}
.tile span{color:var(--muted);font-size:14.5px}
.tile .foot{display:flex;gap:8px;align-items:center;margin-top:auto;font-size:13px;color:var(--muted)}
.chip{border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:650;border:1px solid var(--line);color:var(--muted)}
.chip.keep{color:#06140d;background:var(--good);border-color:var(--good)}
.chip.shop{color:#1c1203;background:var(--warn);border-color:var(--warn)}
.chip.dump{color:#fff;background:var(--bad);border-color:var(--bad)}
/* ---------- active concept ---------- */
#active{position:fixed;inset:0;background:var(--bg);display:none;perspective:1600px;z-index:3}
#active.show{display:block}
#flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
#flip.back{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr)}
#front{grid-template-rows:auto minmax(0,1fr) auto}
#backFace{transform:rotateY(180deg);grid-template-rows:auto minmax(0,1fr);}
.bar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.bar h2{margin:0;font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rec{font-size:13px;color:var(--bad);font-variant-numeric:tabular-nums;white-space:nowrap}
#play{position:relative;overflow:hidden}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--muted);font-size:13px;pointer-events:none}
#flash{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#1b2a37;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:16px;font-weight:650;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:2}
#flash.show{opacity:1;transition:none}
#need{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:rgba(11,16,22,.92);color:var(--warn);font-size:17px;z-index:1}
#need.show{display:grid}
#strip{border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
#trace{width:100%;height:74px;display:block}
#nums{display:flex;gap:14px;font:12.5px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden}
#nums i{font-style:normal}
#nums .p{color:#39c5cf}#nums .r{color:#e5a23b}#nums .y{color:#b38cf5}
#backBody{overflow-y:auto;padding:14px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px;align-content:start;max-width:720px;width:100%;margin:0 auto}
#backBody h3{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:650;letter-spacing:.3px}
#how{margin:0;font-size:16px}
#notes{width:100%;min-height:110px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row button{flex:1;min-width:92px;padding:14px 10px;font-weight:650}
.row button.on{border-color:var(--accent);background:var(--panel2)}
#rate button[data-v=keep].on{background:var(--good);border-color:var(--good);color:#06140d}
#rate button[data-v=shop].on{background:var(--warn);border-color:var(--warn);color:#1c1203}
#rate button[data-v=dump].on{background:var(--bad);border-color:var(--bad);color:#fff}
#saved{color:var(--muted);font-size:13.5px;min-height:1.4em}
/* ---------- playgrounds ---------- */
.list{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.list .th{padding:10px 16px;font-size:21px;font-weight:720;display:flex;gap:10px;align-items:baseline}
.list .th small{color:var(--muted);font-size:13px;font-weight:500}
.list .sc{overflow-y:auto;padding:30vh 14px;scrollbar-width:none;position:relative}
.list .sc::-webkit-scrollbar{display:none}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin:0 auto 11px;max-width:640px;font-size:19px;font-weight:620;display:flex;justify-content:space-between;transition:border-color .12s,background .12s}
.item.focus{border-color:var(--accent);background:var(--panel2)}
.item em{font-style:normal;color:var(--good);opacity:0}.item.chosen em{opacity:1}
.big{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.big .glyph{font-size:min(34vw,180px);line-height:1}
.big p{margin:10px 0 0;color:var(--muted);font-size:17px}
.big .count{font-size:22px;color:var(--text);margin-top:8px;font-variant-numeric:tabular-nums}
.dial{position:absolute;inset:0;display:grid;place-items:center;padding:14px}
.dial .opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:680px}
.dial .o{width:84px;height:84px;border-radius:18px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:17px;font-weight:650;position:relative;transition:transform .1s,border-color .1s}
.dial .o.hot{border-color:var(--accent);transform:scale(1.12);background:var(--panel2)}
.dial .o.picked{border-color:var(--good);background:#12301f}
.dial .o i{position:absolute;left:0;bottom:0;height:5px;background:var(--accent);border-radius:0 0 0 16px;width:0}
.dial p{color:var(--muted);text-align:center;margin:14px 0 0}
.meter{height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line);width:min(70vw,360px);margin:14px auto 0;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent)}
#seeCanvas{position:absolute;inset:0;width:100%;height:100%}
.pg{position:absolute;inset:0}
.quad{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:12px 12px 34px}
.quad .q{border:2px solid var(--line);border-radius:18px;background:var(--panel);display:grid;place-items:center;align-content:center;gap:2px;position:relative;overflow:hidden;transition:border-color .12s,background .12s}
.quad .q span{font-size:min(17vw,84px);line-height:1.1}
.quad .q b{font-size:18px}
.quad .q em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.quad .q i{position:absolute;left:0;bottom:0;height:6px;background:var(--accent);width:0}
.quad .q.in{border-color:var(--accent)}
.quad .q.lit{background:#12301f;border-color:var(--good)}
.linkbox{position:absolute;inset:0;overflow-y:auto;padding:16px 14px 40px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;grid-template-columns:minmax(0,1fr);text-align:center}
.linkbox .lk{font-size:30px;font-weight:750}
.linkbox .g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linkbox .g4>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px}
.linkbox .g4 b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.linkbox .g4 em{font-style:normal;color:var(--muted);font-size:13.5px}
.linkbox .meter{width:100%;margin:2px 0 0}
.linkbox p{margin:0;color:var(--muted);font-size:15px}
.linkbox table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.linkbox th,.linkbox td{padding:6px 3px;border-top:1px solid var(--line)}
.linkbox th{color:var(--muted);font-weight:600}
.stats{position:absolute;inset:0;display:grid;gap:10px;padding:14px 14px 36px;align-content:center}
.stats>div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center}
.stats span{font-size:44px;grid-row:1/3}
.stats b{font-size:30px;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;color:var(--muted)}
.kboard{position:absolute;inset:0;overflow-y:auto;padding:12px 14px 40px;display:grid;gap:10px;align-content:start}
.krow{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.krow b{display:block;font-size:15px;margin-bottom:7px}
.krow div{display:flex;flex-wrap:wrap;gap:7px}
.kchip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.kchip.lit{background:var(--good);border-color:var(--good);color:#06140d}
.kboard p{color:var(--muted);margin:4px 2px;font-size:14.5px}
/* ---------- pairing ---------- */
#pair{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;padding:24px;z-index:5}
#pair.show{display:grid}
#pair div{max-width:420px;width:100%;text-align:center}
#pair h1{font-size:26px;margin:0 0 8px}
#pair p{color:var(--muted);margin:0 0 20px}
#code{width:100%;font:700 44px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;text-align:center;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:16px 8px}
#code:focus{outline:none;border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){#flip{transition:none}}
</style>
</head>
<body>
<div id="grid">
  <div id="top">
    <h1>Wrist Lab</h1>
    <div id="statusRow"><i id="lamp"></i><span id="statusText">Starting…</span><button id="offBtn" type="button" title="Hold for one second to stop the watch">Watch off</button><button id="codeBtn" type="button" style="padding:5px 10px;font-size:13px;color:var(--muted)">Code</button></div>
    <div id="meta"></div>
  </div>
  <div id="cards"></div>
</div>

<div id="active">
  <div id="flip">
    <section class="face" id="front">
      <div class="bar"><button id="closeBtn" type="button" aria-label="Back to the grid">←</button><h2 id="cName"></h2><span id="rec"></span><button id="notesBtn" type="button">Notes</button></div>
      <div id="play"><div id="flash"></div><div id="need"></div><div id="hint">tap = “I meant that” · double-tap = notes and rating</div></div>
      <div id="strip"><canvas id="trace"></canvas><div id="nums"><i class="p" id="nP">tilt –</i><i class="r" id="nR">roll –</i><i class="y" id="nY">turn –</i><i id="nE"></i></div></div>
    </section>
    <section class="face" id="backFace">
      <div class="bar"><button id="frontBtn" type="button" aria-label="Back to the experiment">←</button><h2 id="cName2"></h2><button id="doneBtn" type="button">Done</button></div>
      <div id="backBody">
        <div><h3>WHAT TO TRY</h3><p id="how"></p></div>
        <div><h3>HOW DID IT FEEL?</h3><div class="row" id="thumbs"><button type="button" data-v="up">👍 Good</button><button type="button" data-v="down">👎 Bad</button></div></div>
        <div><h3>VERDICT</h3><div class="row" id="rate"><button type="button" data-v="keep">Keep</button><button type="button" data-v="shop">Back to shop</button><button type="button" data-v="dump">Dump</button></div></div>
        <div><h3>NOTES</h3><textarea id="notes" placeholder="What worked, what didn't, what to change"></textarea><div class="row" style="margin-top:8px"><button type="button" id="dictate">🎤 Speak a note</button></div></div>
        <div id="saved"></div>
      </div>
    </section>
  </div>
</div>

<div id="pair"><div>
  <h1>Enter the watch code</h1>
  <p>Open Wrist on the watch. Type the 6 digits it shows. You only do this once on this device.</p>
  <input id="code" type="tel" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="······" aria-label="6-digit watch code">
</div></div>

<script src="/signals.js"></script>
<script>
(function(){
'use strict';
var BUILD='lab-r7';
var QUERY=location.search;          // kept, because the address is tidied once the code is read from it
var Signals=window.Signals;
var LINK_SECS=Number((/[?&]linksecs=(\d+)/.exec(location.search)||[])[1])||120;
var $=function(id){return document.getElementById(id)};
var DEG=180/Math.PI;
var ws=null,retry=0,pingT=null,lastWatchAt=0,watchBuild='',resting=false,lastRawAt=0,watchLink='',watchRtt=-1,watchBat=-1,lastBatchAt=0;
var LINKNAME={bt:'Bluetooth (via phone)',wifi:'Wi-Fi',cell:'Mobile',none:'no connection',other:'other'};
var pairState='',lastDiagAt=0,asleep='',offAsked=0,offOld=false;   // pairing state, when the watch last logged its panel, why it went off, when Watch off was asked
var cur=null;            // the open concept
var trial=null;          // the recording in progress
var store={};            // per concept: rating, notes, trials

/* =====================================================================
   Signals worked out from one raw row: [dt, gx,gy,gz, wx,wy,wz, ax,ay,az] (x100)
   ===================================================================== */
function derive(r){
  var gx=r[1]/100,gy=r[2]/100,gz=r[3]/100,n=Math.sqrt(gx*gx+gy*gy+gz*gz)||1;
  var wx=r[4]/100,wy=r[5]/100,wz=r[6]/100,ax=r[7]/100,ay=r[8]/100,az=r[9]/100;
  var s=Math.max(-1,Math.min(1,gx/n));
  return {pitch:Math.asin(s)*DEG, roll:Math.atan2(gy,gz)*DEG, yaw:(wx*gx+wy*gy+wz*gz)/n,
          gyro:Math.sqrt(wx*wx+wy*wy+wz*wz), acc:Math.sqrt(ax*ax+ay*ay+az*az)};
}

/* =====================================================================
   Shared playground: a list in threads (used by the scroll and swing concepts)
   ===================================================================== */
function makeList(root){
  var names=['Messages','Research','Shopping','Code'],t=0,rate=0,last=0,alive=true,focused=null;
  var el=document.createElement('div');el.className='list';
  el.innerHTML='<div class="th"><span></span><small></small></div><div class="sc"></div>';
  var sc=el.querySelector('.sc');root.appendChild(el);
  function fill(){
    el.querySelector('.th span').textContent=names[t];el.querySelector('.th small').textContent='thread '+(t+1)+' of '+names.length;
    sc.innerHTML='';for(var i=1;i<=24;i++){var d=document.createElement('div');d.className='item';d.innerHTML='<span>'+names[t]+' · item '+i+'</span><em>✓</em>';sc.appendChild(d)}
    sc.scrollTop=0;focused=null;
  }
  function focus(){
    var mid=sc.getBoundingClientRect().top+sc.clientHeight/2,best=null,bd=1e9;
    for(var i=0;i<sc.children.length;i++){var r=sc.children[i].getBoundingClientRect(),d=Math.abs((r.top+r.bottom)/2-mid);if(d<bd){bd=d;best=sc.children[i]}}
    if(best!==focused){if(focused)focused.classList.remove('focus');focused=best;if(best)best.classList.add('focus')}
    return best;
  }
  function frame(ts){
    if(!alive)return;
    var dt=last?Math.min(0.1,(ts-last)/1000):0;last=ts;
    if(rate)sc.scrollTop-=rate*1100*dt;      /* + = hand raised = towards the top */
    focus();requestAnimationFrame(frame);
  }
  fill();requestAnimationFrame(frame);
  return {setRate:function(r){rate=r},rate:function(){return rate},
          next:function(){t=(t+1)%names.length;fill()},prev:function(){t=(t+names.length-1)%names.length;fill()},
          choose:function(){var f=focus();if(f)f.classList.toggle('chosen')},top:function(){return sc.scrollTop},thread:function(){return names[t]},
          stop:function(){alive=false}};
}

/* =====================================================================
   Recognisers: the part of each concept that decides, with no screen attached.
   Each takes derived samples and returns the gestures it fired, so the same
   code runs inside its own card and inside the Keepers card.
   ===================================================================== */
/* the watch as numbers a signal can be taught from */
function watchN(d){return{tilt:d.pitch,rollS:Math.sin(d.roll/DEG),rollC:Math.cos(d.roll/DEG),turn:d.yaw*DEG}}
function taught(kind){return Signals.signals.some(function(s){return s.kind!=='combo'&&Signals.kindOf(s.src)===kind})}
function live(kind){return Signals.signals.some(function(s){
  if(s.kind==='combo'||Signals.kindOf(s.src)!==kind)return false;
  return !!Signals.assign[s.id]||Signals.signals.some(function(c){return c.kind==='combo'&&Signals.assign[c.id]&&c.seq.indexOf(s.id)>=0})})}
/* the camera and its finders, for any card that looks at hands or the head. The picture never leaves the device. */
function camHtml(cls){return'<div class="camview'+(cls?' '+cls:'')+'"><video playsinline muted></video><canvas></canvas></div>'}
function eyesOn(card,root,want){
  card.el=root;card.frame=null;card.rateAt=now();card.rateN=0;
  var box=root.querySelector('.camview'),msg=root.querySelector('.cmsg'),t0=now();
  if(box)box.classList.remove('off');
  Signals.eyes.start(root.querySelector('video'),want,function(m){if(msg&&cur===card)msg.textContent=m}).then(function(ok){
    if(cur!==card)return;
    if(ok)ev('camera','finder ready',{ms:Math.round(now()-t0),cpu:Signals.eyes.cpu?1:0,hands:want.hands?1:0,face:want.face?1:0});
    else if(Signals.eyes.err)ev('camera','failed',{why:Signals.eyes.err.slice(0,120)});
  });
}
function eyesOff(card,why){Signals.eyes.stop();card.frame=null;var b=card.el&&card.el.querySelector('.camview'),m=card.el&&card.el.querySelector('.cmsg');if(b)b.classList.add('off');if(m)m.textContent=why||''}
function eyesTick(card){
  var f=Signals.eyes.poll(),t=now();
  if(f){card.frame=f;card.rateN++}
  else if(Signals.eyes.err&&card.el){var m=card.el.querySelector('.cmsg');if(m&&m.textContent!==Signals.eyes.err)m.textContent=Signals.eyes.err}

/* =====================================================================
   Recording a trial: what the watch saw + what the page decided + what you did + your verdict
   ===================================================================== */
var hist=[];           // derived samples for the traces: {t,pitch,roll,yaw}
var marks=[];          // {t,kind}
function now(){return performance.now()}
function rel(){return trial?Math.round(now()-trial.t0):0}
function ev(src,what,data){if(!trial)return;var e={t:rel(),src:src,what:what};if(data)for(var k in data)e[k]=data[k];trial.events.push(e)}
function detect(what,data){ev('concept',what,data);marks.push({t:now(),kind:'d'});$('nE').textContent=what}
function startTrial(c){
  var d=new Date(),p=function(x){return(x<10?'0':'')+x};
  trial={id:d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+'T'+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+'-'+c.id+'-'+Math.random().toString(36).slice(2,6),
         concept:c.id,name:c.name,page:BUILD,watch:watchBuild,started:d.toISOString(),t0:now(),events:[],raw:[],rawRows:0,thumbs:[]};
}
function endTrial(){
  if(!trial)return;
  var t=trial;trial=null;
  var s=store[t.concept];
  var head={id:t.id,concept:t.concept,name:t.name,page:t.page,watch:t.watch||watchBuild,started:t.started,ms:Math.round(now()-t.t0),
            code:'****'+code().slice(-2),rating:s.rating||'',notes:s.notes||'',thumbs:t.thumbs,events:t.events,rawRows:t.rawRows,
            rawFormat:'batches of {a: ms since trial start when the batch reached the page, w: watch clock ms of its first row, s: rows [dt,gx,gy,gz,wx,wy,wz,ax,ay,az] x100}',
            ua:navigator.userAgent.slice(0,160),screen:innerWidth+'x'+innerHeight};
  var parts=[JSON.stringify(head)],buf=[],size=0;
  for(var i=0;i<t.raw.length;i++){var j=JSON.stringify(t.raw[i]);if(size+j.length>250000){parts.push('{"id":"'+t.id+'","raw":['+buf.join(',')+']}');buf=[];size=0}buf.push(j);size+=j.length}
  if(buf.length)parts.push('{"id":"'+t.id+'","raw":['+buf.join(',')+']}');
  s.trials=(s.trials||0)+1;save();paintGrid();
  $('saved').textContent='Saving this trial to the lab log…';
  var okc=0,fail='';
  parts.reduce(function(chain,body,n){return chain.then(function(){return fetch('/t/'+code()+'/'+t.id+'/'+n,{method:'POST',body:body}).then(function(r){if(r.ok)okc++;else fail='relay said '+r.status})})},Promise.resolve())
    .catch(function(e){fail=String(e&&e.message||e)})
    .then(function(){$('saved').textContent=fail?('Trial NOT fully saved ('+okc+' of '+parts.length+' parts): '+fail):('Trial saved to the lab log: '+Math.round(head.ms/1000)+' s, '+head.events.length+' events, '+head.rawRows+' sensor rows.');
                     $('meta').textContent=metaText(fail?'last trial not saved: '+fail:'last trial saved')});
}

function open(c){
  cur=c;hist=[];marks=[];
  $('cName').textContent=$('cName2').textContent=c.name;$('how').textContent=c.how;
  $('notes').value=store[c.id].notes||'';paintBack();$('saved').textContent='';
  var play=$('play');Array.prototype.slice.call(play.querySelectorAll('.pg')).forEach(function(n){n.remove()});
  var pg=document.createElement('div');pg.className='pg';play.insertBefore(pg,play.firstChild);
  c.mount(pg);
  $('flip').classList.remove('back');$('active').classList.add('show');
  $('active').classList.toggle('nostrip',!!c.noRaw);
  if(c.noTrial){trial=null;$('rec').textContent=''}else startTrial(c);
  ev('page','open');wantRaw(c.raw?c.raw():!c.noRaw);paintNeed();
}
function flip(toBack){$('flip').classList.toggle('back',toBack);ev('page',toBack?'flip to notes':'flip to experiment')}

  if(!cur)return;
  store[cur.id].notes=$('notes').value;save();ev('page','close');
  wantRaw(false);if(cur.unmount)cur.unmount();
  $('active').classList.remove('show');

}
function wantRaw(on){try{if(ws&&ws.readyState===1)ws.send(JSON.stringify({cmd:'raw',on:on?1:0}))}catch(e){}}
function paintNeed(){
  var n=$('need'),msg='';
  if(cur&&cur.needsRaw&&now()-lastRawAt>2500){
    msg=!(ws&&ws.readyState===1)?'No link to the relay yet.':
        (watchBuild&&/^turn0[1-3]-/.test(watchBuild))?'This card needs the newer watch app (turn04). The watch is running '+watchBuild+'.':
        resting?'The watch is resting. Raise your arm.':'Waiting for the watch’s sensor stream… Open Wrist on the watch if this stays.';
  }
  n.textContent=msg;n.classList.toggle('show',!!msg);
}

(function(){

/* =====================================================================
   Traces
   ===================================================================== */
function drawTraces(c,bigMode){
  var dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}
  var g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
  var span=bigMode?10000:6000,t1=now(),t0=t1-span,X=function(t){return (t-t0)/span*w};
  var rows=[['pitch',90,'#39c5cf'],['roll',180,'#e5a23b'],['yaw',6,'#b38cf5']],rh=h/rows.length;
  g.lineWidth=bigMode?2:1.5;g.font=(bigMode?13:10)+'px ui-monospace,monospace';
  rows.forEach(function(r,i){
    var mid=rh*i+rh/2;g.strokeStyle='#243140';g.beginPath();g.moveTo(0,mid);g.lineTo(w,mid);g.stroke();
    g.strokeStyle=r[2];g.beginPath();var st=false;
    for(var k=0;k<hist.length;k++){var s=hist[k];if(s.t<t0)continue;var y=mid-Math.max(-1,Math.min(1,s[r[0]]/r[1]))*(rh/2-2);if(st)g.lineTo(X(s.t),y);else{g.moveTo(X(s.t),y);st=true}}
    g.stroke();
    if(bigMode){g.fillStyle=r[2];var lastS=hist[hist.length-1];g.fillText(['tilt','roll','turn'][i]+(lastS?'  '+(i===2?lastS.yaw.toFixed(1)+' rad/s':Math.round(lastS[r[0]])+'°'):''),8,rh*i+16)}
  });
  for(var m=0;m<marks.length;m++){if(marks[m].t<t0)continue;g.strokeStyle=marks[m].kind==='m'?'#e8eef4':'#4cc38a';g.beginPath();g.moveTo(X(marks[m].t),0);g.lineTo(X(marks[m].t),h);g.stroke()}
}
function frame(){
  if(cur){
    if(cur.tick)cur.tick();
    if(cur.draw)cur.draw();
    drawTraces($('trace'),false);
    if(trial)$('rec').textContent='● '+Math.floor(rel()/1000)+'s';
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   What arrives from the watch
   ===================================================================== */
function onRaw(m){
  lastRawAt=now();
  var rows=m.s||[];if(!rows.length)return;
  var arrive=now(),lastDt=rows[rows.length-1][0],prevDt=null;
  if(m.ln)watchLink=m.ln;if(m.rt>=0)watchRtt=m.rt;lastBatchAt=arrive;
  if(trial&&trial.rawRows<9000){trial.raw.push({a:rel(),w:m.w,ln:m.ln,rt:m.rt,s:rows});trial.rawRows+=rows.length}
  if(cur&&cur.batch)cur.batch(m);   /* 3 minutes at 50 a second, then stop keeping rows */
  for(var i=0;i<rows.length;i++){
    var d=derive(rows[i]),dt=prevDt==null?20:Math.max(1,rows[i][0]-prevDt);prevDt=rows[i][0];
    d.t=arrive-(lastDt-rows[i][0]);hist.push(d);
    Signals.feed('watch',d.t,watchN(d));
    if(cur&&cur.sample)cur.sample(d,dt);
  }
  if(hist.length>800)hist.splice(0,hist.length-800);
  var L=hist[hist.length-1];$('nP').textContent='tilt '+Math.round(L.pitch)+'°';$('nR').textContent='roll '+Math.round(L.roll)+'°';$('nY').textContent='turn '+L.yaw.toFixed(1);
  if(cur)paintNeed();
}
function act(m){
  lastWatchAt=Date.now();
  if(m.t==='raw'){resting=false;onRaw(m);return}
  if(m.b)watchBuild=m.b;
  if(m.t==='sleep'){asleep=m.why||'sleep';offAsked=0;ev('watch','sleep',{why:m.why});paintStatus();return}
  asleep='';
  if(m.t==='diag')lastDiagAt=Date.now();
  if(m.ln)watchLink=m.ln;if(m.rtt>=0)watchRtt=m.rtt;if(m.bat>=0)watchBat=m.bat;
  if(m.t==='mode'){resting=m.m==='resting';ev('watch','mode',{m:m.m,why:m.why});paintStatus();return}
  resting=false;
  if(m.t!=='hb'){var copy={};for(var k in m)if(k!=='t'&&k!=='b'&&k!=='seq')copy[k]=m[k];ev('watch',m.t,copy)}
  if(cur&&cur.watch)cur.watch(m);
  paintStatus();
}

function load(){try{store=JSON.parse(localStorage.getItem('wrist_lab')||'{}')||{}}catch(e){store={}}CONCEPTS.forEach(function(c){if(!store[c.id])store[c.id]={}})}
function save(){try{localStorage.setItem('wrist_lab',JSON.stringify(store))}catch(e){}}
function secret(c){try{return localStorage.getItem('wrist_k_'+c)||''}catch(e){return ''}}
function setSecret(c,k){try{localStorage.setItem('wrist_k_'+c,k)}catch(e){}}
/* Ask the relay to let this browser listen. An older watch build needs nothing more than the code. A watch on turn07 or
   newer hardens its code: the relay hands this browser a secret once, while the watch has just been started. */
function connect(){
  var c=code();if(!/^\d{6}$/.test(c)){askCode();return}
  if(ws){try{ws.onclose=null;ws.close()}catch(e){}ws=null}
  clearTimeout(connect.t);
  fetch('/pair/'+c,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({k:secret(c)})})
    .then(function(r){return r.json().then(function(j){return{s:r.status,j:j}},function(){return{s:r.status,j:{}}})})
    .then(function(x){
      if(code()!==c)return;
      if(x.s===200){pairState='';if(x.j.k)setSecret(c,x.j.k);if(x.j.lastDiag)lastDiagAt=x.j.lastDiag;listen(c,x.j.legacy?'':(x.j.k||''));return}
      if(x.s===404){pairState='';listen(c,'');return}       // a relay older than w4: no pairing step
      pairState=x.s===429?'limited':'closed';paintStatus();connect.t=setTimeout(connect,x.s===429?30000:15000);
    },function(){pairState='';paintStatus();connect.t=setTimeout(connect,Math.min(8000,500*Math.pow(2,retry++)))});
}
function listen(c,k){
  var s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/s/'+c+(k?'?k='+k:''));ws=s;
  s.onopen=function(){if(ws!==s)return;retry=0;paintStatus();clearInterval(pingT);pingT=setInterval(function(){try{s.send('ping')}catch(e){}},20000);if(cur)wantRaw(cur.raw?cur.raw():!cur.noRaw)};
  s.onmessage=function(e){if(ws!==s||e.data==='pong')return;var m;try{m=JSON.parse(e.data)}catch(x){return}act(m)};
  s.onclose=function(){if(ws!==s)return;clearInterval(pingT);ws=null;paintStatus();connect.t=setTimeout(connect,Math.min(8000,500*Math.pow(2,retry++)))};
  s.onerror=function(){};
  paintStatus();
}
function hhmm(ms){var d=new Date(ms),p=function(x){return(x<10?'0':'')+x};return p(d.getHours())+':'+p(d.getMinutes())}
function watchOff(){
  if(!(ws&&ws.readyState===1))return;
  try{ws.send(JSON.stringify({cmd:'sleep'}))}catch(e){}
  offAsked=Date.now();offOld=/^turn0[1-6]-/.test(watchBuild);ev('page','watch off');paintStatus();
}
(function(){
  var b=$('offBtn'),t=null;
  function cancel(){clearTimeout(t);t=null;b.classList.remove('hold')}
  b.addEventListener('pointerdown',function(e){e.preventDefault();cancel();b.classList.add('hold');t=setTimeout(function(){cancel();watchOff()},1000)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(n){b.addEventListener(n,cancel)});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
function metaText(extra){return 'code '+(code()||'none')+' · page '+BUILD+(watchBuild?' · watch '+watchBuild:'')+(lastDiagAt?' · watch logged '+hhmm(lastDiagAt):'')+(extra?' · '+extra:'')}
function paintStatus(){
  var linked=ws&&ws.readyState===1,age=lastWatchAt?Math.round((Date.now()-lastWatchAt)/1000):-1,live=linked&&age>=0&&age<25&&!resting&&!asleep;
  $('lamp').className=live?'live':linked?'link':'';
  var WHY={page:'turned off from a page',idle:'no page was listening for three minutes',hold:'held on the watch'};
  $('statusText').textContent=!linked?(pairState==='closed'?'Not paired yet. Open Wrist on the watch and wait a few seconds.':pairState==='limited'?'Too many pairing tries. Waiting a minute.':'No link to the relay. Retrying…'):asleep?'Watch is off: '+(WHY[asleep]||asleep)+'. Open Wrist on the watch to start it.':(offAsked&&Date.now()-offAsked<8000)?(offOld?'This watch app ('+watchBuild+') cannot be turned off from here. Install turn07.':'Telling the watch to sleep…'):resting?'Watch resting. Raise your arm to wake it.':live?'Watch connected'+(watchLink?' \u00B7 '+(LINKNAME[watchLink]||watchLink):'')+(watchRtt>=0?' \u00B7 '+watchRtt+' ms':''):age<0?'Waiting for the watch. Open Wrist on the watch once.':'Watch silent for '+age+'s.';
  if(!/last trial/.test($('meta').textContent))$('meta').textContent=metaText('');
  if(cur)paintNeed();
}
function paintGrid(){
  var box=$('cards');box.innerHTML='';
  CONCEPTS.forEach(function(c){
    var s=store[c.id],b=document.createElement('button');b.type='button';b.className='tile';b.dataset.id=c.id;
    var label={keep:'Keep',shop:'Back to shop',dump:'Dump'}[s.rating]||'Not rated';
    b.innerHTML='<b></b><span></span><div class="foot"><i class="chip '+(s.rating||'')+'" style="font-style:normal">'+label+'</i><span>'+(s.trials||0)+' trial'+((s.trials||0)===1?'':'s')+(s.thumb?' · '+(s.thumb==='up'?'👍':'👎'):'')+(c.needsRaw?' · raw':'')+'</span></div>';
    b.querySelector('b').textContent=c.name;b.querySelector('span').textContent=c.blurb;
    b.addEventListener('click',function(){open(c)});box.appendChild(b);
  });
}
function askCode(){var b=$('pair'),i=$('code');b.classList.add('show');i.value='';setTimeout(function(){try{i.focus()}catch(e){}},50)}
$('code').addEventListener('input',function(){var v=this.value.replace(/\D/g,'').slice(0,6);this.value=v;if(v.length===6){setCode(v);$('pair').classList.remove('show');this.blur();connect()}});
$('codeBtn').addEventListener('click',askCode);
var q=/[?&]code=(\d{6})\b/.exec(location.search);if(q){setCode(q[1]);try{history.replaceState(null,'',location.pathname)}catch(e){}}
function awake(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){awake();if(document.visibilityState==='visible'&&!ws)connect()});
window.addEventListener('pagehide',function(){if(cur)close()});

load();paintGrid();paintStatus();awake();connect();
setInterval(paintStatus,1000);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
