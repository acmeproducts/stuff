<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Flow Clock</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522e8;--text:#f5f7ff;--muted:#aab2ca;--accent:#71d7ff;--track:#ffffff18;--border:#ffffff22}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,input[type=number]{background:#151a29;border:1px solid var(--border);border-radius:.55rem;padding:.55rem .7rem}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon-button{display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;font-size:1.3rem;background:#101522dd;box-shadow:0 4px 20px #0008}.floating{position:fixed;z-index:4}.controls-button{top:1rem;right:1rem}.timer-button{right:1rem;bottom:1rem}#clockCanvas{width:100%;height:100%;display:block}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#panel{position:fixed;z-index:5;inset:0 0 0 auto;width:min(390px,100%);padding:1rem;background:var(--panel);border-left:1px solid var(--border);backdrop-filter:blur(16px);overflow:auto;transform:translateX(100%);transition:.2s}#panel.open{transform:none}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head h1{font-size:1.2rem;margin:.2rem 0 1rem}.panel-head button{border:0;background:transparent;font-size:1.4rem}.group{border:1px solid var(--border);border-radius:.8rem;padding:.8rem;margin:0 0 .8rem}.group legend{font-weight:700;padding:0 .3rem}.field{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin:.55rem 0}.field select{max-width:55%}.checks{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}.checks label{display:flex;gap:.5rem;align-items:center;padding:.3rem}.actions{display:flex;gap:.45rem;flex-wrap:wrap}.hint{color:var(--muted);font-size:.82rem;margin:.5rem 0}details{margin-top:.5rem}summary{cursor:pointer;color:var(--muted)}#message{min-height:1.2em;color:var(--accent);font-size:.85rem;margin:.5rem 0 0}
dialog{width:min(520px,calc(100% - 2rem));border:1px solid var(--border);border-radius:1rem;padding:0;background:#101522;color:var(--text);box-shadow:0 20px 80px #000b}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.dialog-body{padding:1rem}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:.2rem 0 1rem}.dialog-head button{border:0;background:transparent;font-size:1.4rem}.timer-display{text-align:center;font-size:clamp(2.5rem,12vw,5rem);font-variant-numeric:tabular-nums;font-weight:300;margin:1rem}.duration{display:flex;justify-content:center;align-items:end;gap:.5rem}.duration label{display:grid;gap:.3rem;text-align:center;color:var(--muted)}.duration input{width:5rem;text-align:center}.timer-viz{display:block;width:180px;height:180px;margin:.5rem auto}.center-actions{justify-content:center;margin-top:1rem}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="clockCanvas" role="button" tabindex="0" aria-label="Time flow clock. Activate to show or hide the center date and time."></canvas>
<p id="accessibleTime" class="sr-only" aria-live="polite"></p>
<button id="openControls" class="icon-button floating controls-button" aria-label="Open clock settings" aria-controls="panel" aria-expanded="false">⚙</button>
<button id="openTimer" class="icon-button floating timer-button" aria-label="Open timer" title="Open timer">⌛</button>

<aside id="panel" aria-label="Clock settings">
 <div class="panel-head"><h1>Clock settings</h1><button id="closeControls" aria-label="Close settings">×</button></div>
 <fieldset class="group"><legend>Display</legend>
  <label class="field">Clock style <select id="clockStyle"><option value="circular">Circular + digital</option><option value="digital">Digital only</option></select></label>
  <label class="field">Center <select id="centerStyle"><option value="digital">Digital</option><option value="verbal">Verbal</option></select></label>
  <label class="field">Time format <select id="timeFormat"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
  <label class="field">Tap clock to show or hide center <input id="tapCenter" type="checkbox"></label>
  <details><summary>Shown units</summary><div class="checks" id="unitChecks">
   <label><input type="checkbox" value="minute" checked> Minute</label><label><input type="checkbox" value="hour" checked> Hour</label><label><input type="checkbox" value="day" checked> Day</label><label><input type="checkbox" value="month" checked> Month</label><label><input type="checkbox" value="year" checked> Year</label>
  </div><button id="restoreUnits" type="button">Restore defaults</button></details>
 </fieldset>
 <fieldset class="group"><legend>Sound</legend>
  <label class="field">Hourly chime <input id="hourlyChime" type="checkbox"></label>
  <label class="field">Visual pulse <input id="hourlyFlash" type="checkbox" checked></label>
  <label class="field">Volume <input id="volume" type="range" min="0" max="1" step=".05" value=".5"></label>
  <button id="testSound">Test sound</button><p class="hint">Sound begins only after you interact with this page.</p>
 </fieldset>
 <fieldset class="group"><legend>Appearance</legend>
  <label class="field">Theme preset <select id="theme"><option value="midnight">Midnight blue</option><option value="ember">Warm ember</option><option value="forest">Forest</option><option value="mono">Monochrome</option><option value="custom">Custom</option></select></label>
  <label class="field">Page/background <input id="backgroundColor" type="color"></label>
  <label class="field">Elapsed rings <input id="ringColor" type="color"></label>
  <label class="field">Remaining tracks <input id="trackColor" type="color"></label>
  <label class="field">Center time <input id="timeColor" type="color"></label>
  <label class="field">Center date <input id="dateColor" type="color"></label>
  <label class="field">Minute highlight <input id="highlightColor" type="color"></label>
  <label class="field">Ring thickness <input id="thickness" type="range" min="8" max="28" value="16"></label>
  <label class="field">Glow strength <input id="glowStrength" type="range" min="0" max="30" value="12"></label>
  <label class="field">Background depth <input id="backgroundDepth" type="range" min="0" max="100" value="35"></label>
 </fieldset>
 <fieldset class="group"><legend>Preferences</legend><div class="actions"><button id="saveConfig">Save</button><button id="exportConfig">Export</button><button id="importButton">Import</button><input id="importConfig" type="file" accept="application/json,.json" hidden></div><p id="message" role="status"></p></fieldset>
</aside>

<dialog id="timerDialog"><div class="dialog-body">
 <div class="dialog-head"><h2>Timer</h2><button id="closeTimer" aria-label="Close timer">×</button></div>
 <label class="field">Mode <select id="timerMode"><option value="countdown">Countdown</option><option value="countup">Count up</option></select></label>
 <label class="field">Visual <select id="timerVisual"><option value="hourglass">Hourglass</option><option value="analog">Analog</option><option value="spiral">Spiral</option></select></label>
 <div class="duration"><label>Hours<input id="timerHours" type="number" min="0" max="99" value="0"></label><label>Minutes<input id="timerMinutes" type="number" min="0" max="59" value="5"></label><label>Seconds<input id="timerSeconds" type="number" min="0" max="59" value="0"></label></div>
 <canvas id="timerCanvas" class="timer-viz" width="360" height="360"></canvas><div id="timerDisplay" class="timer-display">05:00</div>
 <div class="actions center-actions"><button id="timerStart">Start</button><button id="timerPause" disabled>Pause</button><button id="timerReset">Reset</button></div>
</div></dialog>
<script>
const $=id=>document.getElementById(id),canvas=$('clockCanvas'),ctx=canvas.getContext('2d');
const controls={clockStyle:$('clockStyle'),centerStyle:$('centerStyle'),timeFormat:$('timeFormat'),tapCenter:$('tapCenter'),hourlyChime:$('hourlyChime'),hourlyFlash:$('hourlyFlash'),volume:$('volume'),theme:$('theme'),backgroundColor:$('backgroundColor'),ringColor:$('ringColor'),trackColor:$('trackColor'),timeColor:$('timeColor'),dateColor:$('dateColor'),highlightColor:$('highlightColor'),thickness:$('thickness'),glowStrength:$('glowStrength'),backgroundDepth:$('backgroundDepth')};
const palettes={midnight:{backgroundColor:'#090b12',ringColor:'#71d7ff',trackColor:'#293144',timeColor:'#f5f7ff',dateColor:'#aab2ca',highlightColor:'#d4f5ff'},ember:{backgroundColor:'#160b08',ringColor:'#ff9b62',trackColor:'#41251e',timeColor:'#fff4ec',dateColor:'#e6b9a3',highlightColor:'#ffe0a3'},forest:{backgroundColor:'#07130f',ringColor:'#67e3a5',trackColor:'#203b31',timeColor:'#effff7',dateColor:'#a7d6c1',highlightColor:'#d2ffe8'},mono:{backgroundColor:'#090909',ringColor:'#f2f2f2',trackColor:'#333333',timeColor:'#fafafa',dateColor:'#bdbdbd',highlightColor:'#ffffff'}};
const RING_ORDER=['month','year','day','hour','minute']; // Explicitly outermost to innermost.
const CONFIG_VERSION=2,HEX=/^#[0-9a-f]{6}$/i,ranges={thickness:[8,28],glowStrength:[0,30],backgroundDepth:[0,100],volume:[0,1]};
let flashUntil=0,audioContext,lastHour=new Date().getHours(),lastAccessible='',centerVisible=true;
function selectedUnits(){return RING_ORDER.filter(u=>document.querySelector(`#unitChecks input[value="${u}"]`)?.checked)}
function fit(){const d=Math.min(devicePixelRatio||1,3),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}return d}
function fractions(d){const minute=(d.getSeconds()+d.getMilliseconds()/1000)/60,hour=(d.getMinutes()+minute)/60,day=(d.getHours()+hour)/24,days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),month=(d.getDate()-1+day)/days;return{minute,hour,day,month,year:(d.getMonth()+month)/12}}
function ordinal(n){const mod100=n%100;if(mod100>=11&&mod100<=13)return`${n}th`;return`${n}${({1:'st',2:'nd',3:'rd'})[n%10]||'th'}`}
function fullDate(d){return`${d.toLocaleDateString([],{weekday:'long'})}, ${d.toLocaleDateString([],{month:'long'})} ${ordinal(d.getDate())}, ${d.getFullYear()}`}
const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine'];
function verbalTime(d){let h=d.getHours(),m=d.getMinutes();if(controls.timeFormat.value==='24')return m?`${words[h]||h} ${m<30?words[m]:m}`:`${words[h]||h} hundred`;const current=words[h%12],next=words[(h+1)%12];if(!m)return`${current} o’clock`;if(m===15)return`quarter past ${current}`;if(m===30)return`half past ${current}`;if(m===45)return`quarter to ${next}`;return m<30?`${words[m]} past ${current}`:`${words[60-m]} to ${next}`}
function centerText(d){const time=controls.centerStyle.value==='verbal'?verbalTime(d):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:controls.timeFormat.value==='12'});return[time,fullDate(d)]}
function colors(){return Object.fromEntries(['backgroundColor','ringColor','trackColor','timeColor','dateColor','highlightColor'].map(k=>[k,controls[k].value]))}
function drawCenter(d,cx,cy,inner,dpr,p){if(!centerVisible)return;const[a,b]=centerText(d),maxWidth=Math.max(120*dpr,inner*1.65),scale=Math.max(.55,Math.min(1.35,inner/(165*dpr)));ctx.textAlign='center';ctx.fillStyle=p.timeColor;ctx.font=`300 ${Math.round(42*dpr*scale)}px system-ui`;ctx.fillText(a,cx,cy,maxWidth);ctx.fillStyle=p.dateColor;ctx.font=`${Math.round(15*dpr*scale)}px system-ui`;ctx.fillText(b,cx,cy+31*dpr*scale,maxWidth)}
function drawClock(){const dpr=fit(),d=new Date(),p=colors(),w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,pad=12*dpr,portrait=h>=w,R=Math.max(80*dpr,Math.min((portrait?w:h)/2-pad,portrait?(h/2-50*dpr):(w/2-58*dpr)));document.body.style.background=p.backgroundColor;ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.7),depth=+controls.backgroundDepth.value/100;g.addColorStop(0,p.ringColor+Math.round(depth*80).toString(16).padStart(2,'0'));g.addColorStop(1,p.backgroundColor);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);if(performance.now()<flashUntil){ctx.fillStyle=p.ringColor+'24';ctx.fillRect(0,0,w,h)}
 const fr=fractions(d),units=selectedUnits(),thick=+controls.thickness.value*dpr,gap=Math.max(6*dpr,thick*.55),step=thick+gap;if(controls.clockStyle.value==='circular'&&units.length){units.forEach((u,i)=>{const r=R-i*step;if(r<=thick)return;const a=-Math.PI/2,b=a+fr[u]*Math.PI*2;ctx.lineWidth=thick;ctx.lineCap='round';ctx.strokeStyle=p.trackColor;ctx.beginPath();ctx.arc(cx,cy,r,a,a+Math.PI*2);ctx.stroke();ctx.strokeStyle=p.ringColor;ctx.shadowColor=p.ringColor;ctx.shadowBlur=+controls.glowStrength.value*dpr;ctx.beginPath();ctx.arc(cx,cy,r,a,b);ctx.stroke();ctx.shadowBlur=0;if(u==='minute'&&fr[u]>.002){ctx.strokeStyle=p.highlightColor;ctx.lineWidth=Math.max(2*dpr,thick*.25);ctx.shadowColor=p.highlightColor;ctx.shadowBlur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:Math.min(12,+controls.glowStrength.value)*dpr;ctx.beginPath();ctx.arc(cx,cy,r,Math.max(a,b-.09),b);ctx.stroke();ctx.shadowBlur=0}})}const inner=R-units.length*step;drawCenter(d,cx,cy,Math.max(inner,85*dpr),dpr,p);
 const visible=centerVisible?centerText(d).join(', '):'Center date and time hidden';if(visible!==lastAccessible){lastAccessible=visible;$('accessibleTime').textContent=visible;canvas.setAttribute('aria-label',`Time flow clock. ${visible}. Activate to show or hide the center date and time.`)}if(d.getHours()!==lastHour){lastHour=d.getHours();if(d.getMinutes()===0){if(controls.hourlyFlash.checked)flashUntil=performance.now()+1200;if(controls.hourlyChime.checked)chime()}}requestAnimationFrame(drawClock)}
function chime(){audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const now=audioContext.currentTime;[0,.18].forEach((delay,i)=>{const o=audioContext.createOscillator(),gain=audioContext.createGain();o.frequency.value=i?659.25:523.25;gain.gain.setValueAtTime(+controls.volume.value*.16,now+delay);gain.gain.exponentialRampToValueAtTime(.001,now+delay+.55);o.connect(gain).connect(audioContext.destination);o.start(now+delay);o.stop(now+delay+.6)})}
function message(s){$('message').textContent=s;setTimeout(()=>{if($('message').textContent===s)$('message').textContent=''},3000)}
function config(){return{version:CONFIG_VERSION,...Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.type==='checkbox'?v.checked:v.value])),centerVisible,units:selectedUnits(),timer:{mode:$('timerMode').value,visual:$('timerVisual').value,hours:+$('timerHours').value,minutes:+$('timerMinutes').value,seconds:+$('timerSeconds').value}}}
function validNumber(k,v){const n=Number(v),r=ranges[k];return Number.isFinite(n)&&n>=r[0]&&n<=r[1]}
function migrate(c){if(c.version!==1)return c;const base=palettes[c.theme]||palettes.midnight;return{...c,version:2,...base,glowStrength:c.glow===false?0:12,backgroundDepth:35,timeFormat:'12',tapCenter:false,centerVisible:true,units:Array.isArray(c.units)?c.units.filter(u=>u!=='week'):RING_ORDER}}
function applyConfig(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid configuration');const c=migrate(raw);if(c.version!==CONFIG_VERSION)throw Error('Unsupported configuration');for(const[k,v]of Object.entries(controls)){if(c[k]===undefined)continue;if(v.type==='checkbox')v.checked=Boolean(c[k]);else if(v.type==='color'){if(HEX.test(c[k]))v.value=c[k]}else if(v.type==='range'){if(validNumber(k,c[k]))v.value=c[k]}else if([...v.options].some(o=>o.value===String(c[k])))v.value=c[k]}if(Array.isArray(c.units))document.querySelectorAll('#unitChecks input').forEach(x=>x.checked=c.units.includes(x.value));centerVisible=controls.tapCenter.checked?c.centerVisible!==false:true;if(c.timer&&typeof c.timer==='object'){$('timerMode').value=c.timer.mode==='countup'?'countup':'countdown';$('timerVisual').value=['hourglass','analog','spiral'].includes(c.timer.visual)?c.timer.visual:'hourglass';for(const[k,max]of Object.entries({hours:99,minutes:59,seconds:59})){const n=Number(c.timer[k]);$("timer"+k[0].toUpperCase()+k.slice(1)).value=Number.isFinite(n)?Math.min(max,Math.max(0,n)):0}}applyAppearance()}
function applyAppearance(){const p=colors();for(const[k,v]of Object.entries({bg:p.backgroundColor,accent:p.ringColor,text:p.timeColor,track:p.trackColor}))document.documentElement.style.setProperty(`--${k}`,v)}
function applyPreset(){if(controls.theme.value==='custom')return;Object.entries(palettes[controls.theme.value]).forEach(([k,v])=>controls[k].value=v);applyAppearance()}
$('openControls').onclick=()=>{$('panel').classList.add('open');$('openControls').setAttribute('aria-expanded','true')};$('closeControls').onclick=()=>{$('panel').classList.remove('open');$('openControls').setAttribute('aria-expanded','false')};$('restoreUnits').onclick=()=>document.querySelectorAll('#unitChecks input').forEach(x=>x.checked=true);controls.theme.onchange=applyPreset;for(const k of ['backgroundColor','ringColor','trackColor','timeColor','dateColor','highlightColor'])controls[k].oninput=()=>{controls.theme.value='custom';applyAppearance()};controls.tapCenter.onchange=()=>{if(!controls.tapCenter.checked)centerVisible=true};$('testSound').onclick=chime;
function toggleCenter(){if(controls.tapCenter.checked)centerVisible=!centerVisible}canvas.addEventListener('click',toggleCenter);canvas.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCenter()}});
$('saveConfig').onclick=()=>{localStorage.setItem('time-flow-config',JSON.stringify(config()));message('Preferences saved')};$('exportConfig').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(config(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='time-flow-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),0)};$('importButton').onclick=()=>$('importConfig').click();$('importConfig').onchange=async e=>{try{if(!e.target.files[0])return;applyConfig(JSON.parse(await e.target.files[0].text()));message('Preferences imported')}catch{message('Could not import that file')}finally{e.target.value=''}};
// Timer is intentionally separate from the clock, but continues running while its dialog is closed.
const td=$('timerDialog'),tc=$('timerCanvas'),tx=tc.getContext('2d');let timer={state:'idle',elapsed:0,started:0};
function duration(){return Math.max(1,+$('timerHours').value*3600 + +$('timerMinutes').value*60 + +$('timerSeconds').value)}function elapsed(){return timer.elapsed+(timer.state==='running'?(performance.now()-timer.started)/1000:0)}function fmt(n){n=Math.max(0,Math.ceil(n));return`${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n/60)%60).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function timerFrame(){let e=elapsed(),total=duration();if($('timerMode').value==='countdown'&&e>=total&&timer.state==='running'){timer.elapsed=total;timer.state='done';$('timerPause').disabled=true;chime()}const progress=$('timerMode').value==='countdown'?Math.min(1,e/total):e%total/total,value=$('timerMode').value==='countdown'?total-e:e;$('timerDisplay').textContent=fmt(value);drawTimer(progress);requestAnimationFrame(timerFrame)}
function drawTimer(f){const w=tc.width,h=tc.height,cx=w/2,cy=h/2,R=130,p=colors();tx.clearRect(0,0,w,h);tx.strokeStyle=p.ringColor;tx.fillStyle=p.ringColor;tx.lineCap='round';tx.lineWidth=12;const v=$('timerVisual').value;if(v==='analog'){tx.strokeStyle=p.trackColor;tx.beginPath();tx.arc(cx,cy,R,0,Math.PI*2);tx.stroke();tx.strokeStyle=p.ringColor;tx.beginPath();tx.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+f*Math.PI*2);tx.stroke();tx.lineWidth=7;tx.beginPath();tx.moveTo(cx,cy);tx.lineTo(cx+Math.cos(-Math.PI/2+f*Math.PI*2)*R*.75,cy+Math.sin(-Math.PI/2+f*Math.PI*2)*R*.75);tx.stroke()}else if(v==='spiral'){tx.beginPath();for(let i=0;i<=200*f;i++){const t=i/200*Math.PI*5,r=R*i/200,x=cx+Math.cos(t)*r,y=cy+Math.sin(t)*r;i?tx.lineTo(x,y):tx.moveTo(x,y)}tx.stroke()}else{tx.lineWidth=6;tx.strokeRect(cx-90,cy-130,180,260);tx.beginPath();tx.moveTo(cx-88,cy-127);tx.lineTo(cx+88,cy+127);tx.moveTo(cx+88,cy-127);tx.lineTo(cx-88,cy+127);tx.stroke();tx.beginPath();tx.moveTo(cx-80,cy+120);tx.lineTo(cx+80,cy+120);tx.lineTo(cx+80-f*80,cy+120-f*120);tx.lineTo(cx-80+f*80,cy+120-f*120);tx.fill()}}
$('openTimer').onclick=()=>td.showModal();$('closeTimer').onclick=()=>td.close();$('timerStart').onclick=()=>{if(timer.state==='done'||timer.state==='idle')timer.elapsed=0;timer.started=performance.now();timer.state='running';$('timerStart').textContent='Resume';$('timerPause').disabled=false};$('timerPause').onclick=()=>{timer.elapsed=elapsed();timer.state='paused';$('timerPause').disabled=true};$('timerReset').onclick=()=>{timer={state:'idle',elapsed:0,started:0};$('timerStart').textContent='Start';$('timerPause').disabled=true};
applyPreset();try{const saved=JSON.parse(localStorage.getItem('time-flow-config'));if(saved)applyConfig(saved)}catch{message('Saved preferences could not be loaded')}applyAppearance();drawClock();timerFrame();
</script>
</body>
</html>
