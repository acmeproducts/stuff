<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Flow Clock</title>
<style>
:root{color-scheme:dark;--bg:#090b12;--panel:#111522e8;--text:#f5f7ff;--muted:#aab2ca;--accent:#71d7ff;--track:#ffffff18;--border:#ffffff22}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select{font:inherit;color:inherit}button,select,input[type=number]{background:#151a29;border:1px solid var(--border);border-radius:.55rem;padding:.55rem .7rem}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon-button{display:grid;place-items:center;width:44px;height:44px;padding:0;border-radius:50%;font-size:1.3rem;background:#101522dd;box-shadow:0 4px 20px #0008}.floating{position:fixed;z-index:4}.controls-button{top:1rem;right:1rem}.timer-button{right:1rem;bottom:1rem}#clockCanvas{width:100%;height:100%;display:block}.calendar-toggle{position:fixed;z-index:4;top:0;left:50%;transform:translateX(-50%);padding:.35rem 1.1rem;border-radius:0 0 .7rem .7rem;background:#101522ed}.calendar-bars{position:fixed;z-index:3;top:0;left:clamp(.5rem,3vw,2rem);right:clamp(4rem,8vw,6rem);max-height:min(34vh,210px);padding:2.5rem .65rem .65rem;display:grid;gap:.4rem;overflow:auto;background:var(--panel);border:1px solid var(--border);border-top:0;border-radius:0 0 .9rem .9rem;backdrop-filter:blur(12px);transform:translateY(-105%);transition:transform .2s}.calendar-bars.open{transform:none}.calendar-row{display:grid;grid-template-columns:4.5rem 1fr;gap:.45rem;align-items:center}.calendar-row-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}.calendar-bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}.calendar-segment{min-width:2px;min-height:16px;display:grid;place-items:center;overflow:hidden;font-size:clamp(6px,1vw,10px);border:1px solid var(--border);background:var(--track);border-radius:2px}.calendar-segment.done{background:var(--accent);opacity:.58}.calendar-segment.current{background:var(--accent);border:2px solid var(--text);box-shadow:0 0 6px var(--accent)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#panel{position:fixed;z-index:5;inset:0 0 0 auto;width:min(390px,100%);padding:1rem;background:var(--panel);border-left:1px solid var(--border);backdrop-filter:blur(16px);overflow:auto;transform:translateX(100%);transition:.2s}#panel.open{transform:none}.panel-head{display:flex;justify-content:space-between;align-items:center}.panel-head h1{font-size:1.2rem;margin:.2rem 0 1rem}.panel-head button{border:0;background:transparent;font-size:1.4rem}.group{border:1px solid var(--border);border-radius:.8rem;padding:.8rem;margin:0 0 .8rem}.group legend{font-weight:700;padding:0 .3rem}.field{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin:.55rem 0}.field select{max-width:55%}.checks{display:grid;grid-template-columns:1fr 1fr;gap:.3rem}.checks label{display:flex;gap:.5rem;align-items:center;padding:.3rem}.actions{display:flex;gap:.45rem;flex-wrap:wrap}.hint{color:var(--muted);font-size:.82rem;margin:.5rem 0}details{margin-top:.5rem}summary{cursor:pointer;color:var(--muted)}#message{min-height:1.2em;color:var(--accent);font-size:.85rem;margin:.5rem 0 0}
dialog{width:min(620px,calc(100% - 2rem));border:1px solid var(--border);border-radius:1rem;padding:0;background:#101522;color:var(--text);box-shadow:0 20px 80px #000b}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}.dialog-body{padding:1rem}.dialog-head{display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:.2rem 0 1rem}.dialog-head button{border:0;background:transparent;font-size:1.4rem}.timer-display{text-align:center;font-size:clamp(2.5rem,12vw,5rem);font-variant-numeric:tabular-nums;font-weight:300;margin:1rem}.duration{display:flex;justify-content:center;align-items:end;gap:.5rem}.duration label{display:grid;gap:.3rem;text-align:center;color:var(--muted)}.duration input{width:5rem;text-align:center}.timer-viz{display:block;width:min(70vw,300px);height:min(70vw,300px);max-height:42vh;margin:.5rem auto}.range-output{min-width:3.5rem;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}.center-actions{justify-content:center;margin-top:1rem}@media(max-width:520px){.calendar-bars{left:.25rem;right:.25rem}.calendar-row{grid-template-columns:3.4rem 1fr}.calendar-row-label{font-size:.62rem}.calendar-segment{min-height:13px}}@media(max-height:500px){.calendar-bars{max-height:42vh}.timer-viz{max-height:32vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="clockCanvas" role="button" tabindex="0" aria-label="Time flow clock. Activate to show or hide the center date and time."></canvas>
<p id="accessibleTime" class="sr-only" aria-live="polite"></p>
<button id="calendarToggle" class="calendar-toggle" aria-label="Show calendar progress" aria-controls="calendarBars" aria-expanded="false">Calendar ▾</button>
<div id="calendarBars" class="calendar-bars" role="region" aria-label="Calendar progress"></div>
<button id="openControls" class="icon-button floating controls-button" aria-label="Open clock settings" aria-controls="panel" aria-expanded="false">⚙</button>
<button id="openTimer" class="icon-button floating timer-button" aria-label="Open timer" title="Open timer">⌛</button>

<aside id="panel" aria-label="Clock settings">
 <div class="panel-head"><h1>Clock settings</h1><button id="closeControls" aria-label="Close settings">×</button></div>
 <fieldset class="group"><legend>Display</legend>
  <label class="field">Clock style <select id="clockStyle"><option value="rings">Rings + digital</option><option value="analog">Analog + digital</option><option value="buckets">Buckets + digital</option><option value="digital">Digital only</option></select></label>
  <label class="field">Center <select id="centerStyle"><option value="digital">Digital</option><option value="verbal">Verbal</option></select></label>
  <label class="field">Time format <select id="timeFormat"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
  <label class="field">Digital clock font size <input id="digitalFontSize" type="range" min="24" max="120" value="64"><output id="digitalFontSizeOutput" class="range-output" for="digitalFontSize">64 px</output></label>
  <label class="field">Date/day font size <input id="dateFontSize" type="range" min="10" max="42" value="18"><output id="dateFontSizeOutput" class="range-output" for="dateFontSize">18 px</output></label>
  <label class="field">Calendar overlay open <input id="calendarOpen" type="checkbox"></label>
  <label class="field">Calendar orientation <select id="calendarOrientation"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option></select></label>
  <label class="field">Tap clock to show or hide center <input id="tapCenter" type="checkbox"></label>
  <details><summary>Calendar bars</summary><div class="checks" id="unitChecks">
   <label><input type="checkbox" value="months" checked> Months</label><label><input type="checkbox" value="dates" checked> Days</label><label><input type="checkbox" value="weekdays" checked> Week</label>
  </div><button id="restoreUnits" type="button">Restore defaults</button></details>
 </fieldset>
 <fieldset class="group"><legend>Sound</legend>
  <label class="field">Hourly chime <input id="hourlyChime" type="checkbox"></label>
  <label class="field">Visual pulse <input id="hourlyFlash" type="checkbox" checked></label>
  <label class="field">Volume <input id="volume" type="range" min="0" max="1" step=".05" value=".5"></label>
  <button id="testSound">Test sound</button><p class="hint">Sound begins only after you interact with this page.</p>
 </fieldset>
 <fieldset class="group"><legend>Appearance</legend>
  <label class="field">Theme preset <select id="theme"><option value="midnight">Midnight blue</option><option value="ember">Warm ember</option><option value="forest">Forest</option><option value="mono">Monochrome</option><option value="custom">Custom</option></select></label>
  <label class="field">Page/background <input id="backgroundColor" type="color"></label>
  <label class="field">Active hands/material <input id="ringColor" type="color"></label>
  <label class="field">Inactive tracks <input id="trackColor" type="color"></label>
  <label class="field">Center time <input id="timeColor" type="color"></label>
  <label class="field">Center date <input id="dateColor" type="color"></label>
  <label class="field">Minute highlight <input id="highlightColor" type="color"></label>
  <label class="field">Ring thickness <input id="thickness" type="range" min="8" max="28" value="16"></label>
  <label class="field">Glow strength <input id="glowStrength" type="range" min="0" max="30" value="12"></label>
  <label class="field">Background depth <input id="backgroundDepth" type="range" min="0" max="100" value="35"></label>
 </fieldset>
 <fieldset class="group"><legend>Preferences</legend><div class="actions"><button id="saveConfig">Save</button><button id="exportConfig">Export</button><button id="importButton">Import</button><input id="importConfig" type="file" accept="application/json,.json" hidden></div><p id="message" role="status"></p></fieldset>
</aside>

<dialog id="timerDialog"><div class="dialog-body">
 <div class="dialog-head"><h2>Timer</h2><button id="closeTimer" aria-label="Close timer">×</button></div>
 <label class="field">Mode <select id="timerMode"><option value="countdown">Countdown</option><option value="countup">Count up</option></select></label>
 <label class="field">Visual <select id="timerVisual"><option value="buckets">Buckets</option><option value="analog">Analog</option><option value="spiral">Spiral</option></select></label>
 <div class="duration"><label>Hours<input id="timerHours" type="number" min="0" max="99" value="0"></label><label>Minutes<input id="timerMinutes" type="number" min="0" max="59" value="5"></label><label>Seconds<input id="timerSeconds" type="number" min="0" max="59" value="0"></label></div>
 <canvas id="timerCanvas" class="timer-viz" width="360" height="360" role="img" aria-label="Countdown timer, 5 minutes remaining"></canvas><div id="timerDisplay" class="timer-display">00:05:00</div>
 <div class="actions center-actions"><button id="timerStart">Start</button><button id="timerPause" disabled>Pause</button><button id="timerReset">Reset</button></div>
</div></dialog>
<script>
const $=id=>document.getElementById(id),canvas=$('clockCanvas'),ctx=canvas.getContext('2d'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
const controls={clockStyle:$('clockStyle'),centerStyle:$('centerStyle'),timeFormat:$('timeFormat'),digitalFontSize:$('digitalFontSize'),dateFontSize:$('dateFontSize'),calendarOpen:$('calendarOpen'),calendarOrientation:$('calendarOrientation'),tapCenter:$('tapCenter'),hourlyChime:$('hourlyChime'),hourlyFlash:$('hourlyFlash'),volume:$('volume'),theme:$('theme'),backgroundColor:$('backgroundColor'),ringColor:$('ringColor'),trackColor:$('trackColor'),timeColor:$('timeColor'),dateColor:$('dateColor'),highlightColor:$('highlightColor'),thickness:$('thickness'),glowStrength:$('glowStrength'),backgroundDepth:$('backgroundDepth')};
const palettes={midnight:{backgroundColor:'#090b12',ringColor:'#71d7ff',trackColor:'#293144',timeColor:'#f5f7ff',dateColor:'#aab2ca',highlightColor:'#d4f5ff'},ember:{backgroundColor:'#160b08',ringColor:'#ff9b62',trackColor:'#41251e',timeColor:'#fff4ec',dateColor:'#e6b9a3',highlightColor:'#ffe0a3'},forest:{backgroundColor:'#07130f',ringColor:'#67e3a5',trackColor:'#203b31',timeColor:'#effff7',dateColor:'#a7d6c1',highlightColor:'#d2ffe8'},mono:{backgroundColor:'#090909',ringColor:'#f2f2f2',trackColor:'#333333',timeColor:'#fafafa',dateColor:'#bdbdbd',highlightColor:'#ffffff'}};
const CALENDAR_UNITS=['months','dates','weekdays'],CONFIG_VERSION=4,HEX=/^#[0-9a-f]{6}$/i,ranges={thickness:[8,28],glowStrength:[0,30],backgroundDepth:[0,100],volume:[0,1],digitalFontSize:[24,120],dateFontSize:[10,42]},TRANSFER_SECONDS=1.2;
let flashUntil=0,audioContext,lastHour=new Date().getHours(),lastAccessible='',centerVisible=true;
function selectedUnits(){return CALENDAR_UNITS.filter(u=>document.querySelector(`#unitChecks input[value="${u}"]`)?.checked)}
function fit(){const d=Math.min(devicePixelRatio||1,3),w=Math.round(innerWidth*d),h=Math.round(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}return d}
function ordinal(n){const m=n%100;if(m>=11&&m<=13)return`${n}th`;return`${n}${({1:'st',2:'nd',3:'rd'})[n%10]||'th'}`}
function fullDate(d){return`${d.toLocaleDateString([],{weekday:'long'})}, ${d.toLocaleDateString([],{month:'long'})} ${ordinal(d.getDate())}, ${d.getFullYear()}`}
const words=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty','twenty-one','twenty-two','twenty-three','twenty-four','twenty-five','twenty-six','twenty-seven','twenty-eight','twenty-nine'];
function verbalTime(d){let h=d.getHours(),m=d.getMinutes();if(controls.timeFormat.value==='24')return m?`${words[h]||h} ${m<30?words[m]:m}`:`${words[h]||h} hundred`;const a=words[h%12],b=words[(h+1)%12];if(!m)return`${a} o’clock`;if(m===15)return`quarter past ${a}`;if(m===30)return`half past ${a}`;if(m===45)return`quarter to ${b}`;return m<30?`${words[m]} past ${a}`:`${words[60-m]} to ${b}`}
function centerText(d){return[controls.centerStyle.value==='verbal'?verbalTime(d):d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:controls.timeFormat.value==='12'}),fullDate(d)]}
function colors(){return Object.fromEntries(['backgroundColor','ringColor','trackColor','timeColor','dateColor','highlightColor'].map(k=>[k,controls[k].value]))}
function hand(cx,cy,r,f,width,color){const a=f*Math.PI*2-Math.PI/2;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);ctx.stroke()}
function drawAnalog(d,cx,cy,R,dpr,p){ctx.strokeStyle=p.trackColor;ctx.lineWidth=Math.max(3*dpr,+controls.thickness.value*dpr*.45);ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();for(let i=0;i<12;i++){const a=i*Math.PI/6-Math.PI/2,l=i%3===0?14:9;ctx.strokeStyle=i%3===0?p.highlightColor:p.dateColor;ctx.lineWidth=(i%3===0?4:2)*dpr;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(R-l*dpr),cy+Math.sin(a)*(R-l*dpr));ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.stroke()}const s=d.getSeconds()+d.getMilliseconds()/1000,m=(d.getMinutes()+s/60)/60,h=(d.getHours()%12+d.getMinutes()/60+s/3600)/12;ctx.shadowColor=p.ringColor;ctx.shadowBlur=+controls.glowStrength.value*dpr;hand(cx,cy,R*.52,h,8*dpr,p.timeColor);hand(cx,cy,R*.72,m,5*dpr,p.ringColor);ctx.shadowBlur=0;hand(cx,cy,R*.82,s/60,2*dpr,p.highlightColor);ctx.fillStyle=p.highlightColor;ctx.beginPath();ctx.arc(cx,cy,5*dpr,0,Math.PI*2);ctx.fill()}
function bucketLevels(seconds){seconds=Math.max(0,seconds);return{second:Math.floor(seconds)%60,minute:Math.floor(seconds/60)%60,hour:Math.min(24,Math.floor(seconds/3600))}}
function ring(g,cx,cy,r,f,label,p,dpr){const width=Math.max(4*dpr,+controls.thickness.value*dpr);g.lineCap='round';g.lineWidth=width;g.strokeStyle=p.trackColor;g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.stroke();g.strokeStyle=p.ringColor;g.shadowColor=p.ringColor;g.shadowBlur=+controls.glowStrength.value*dpr;g.beginPath();g.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+f*Math.PI*2);g.stroke();g.shadowBlur=0;const a=-Math.PI/2+f*Math.PI*2;g.fillStyle=p.highlightColor;g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,width*.42,0,Math.PI*2);g.fill();g.fillStyle=p.dateColor;g.font=`bold ${Math.max(9*dpr,width*.55)}px system-ui`;g.textAlign='center';g.fillText(label,cx,cy-r+width*.35)}
function drawRings(d,cx,cy,R,dpr,p){const sec=d.getSeconds()+d.getMilliseconds()/1000,min=d.getMinutes()/60+sec/3600,hour=(d.getHours()%12)/12+d.getMinutes()/720+sec/43200;ring(ctx,cx,cy,R,sec/60,'SECONDS',p,dpr);ring(ctx,cx,cy,R-34*dpr,min,'MINUTES',p,dpr);ring(ctx,cx,cy,R-68*dpr,hour,'HOURS · 12',p,dpr)}
function bucketLayout(x,y,w,h,compact=false){const bw=Math.min(w*(compact?.34:.27),h*(compact?.34:.29)),bh=bw*.72,margin=Math.max(8,w*.035);return[{x:x+margin,y:y+margin,w:bw,h:bh},{x:x+(w-bw)/2,y:y+(h-bh)/2,w:bw,h:bh},{x:x+w-bw-margin,y:y+h-bh-margin,w:bw,h:bh}]}
function cellPoint(box,index,cols,rows){const label=box.h*.18,pad=box.w*.06,cw=(box.w-pad*2)/cols,ch=(box.h-label-pad)/rows;return{x:box.x+pad+(index%cols+.5)*cw,y:box.y+label+(Math.floor(index/cols)+.5)*ch,cw,ch}}
function connector(g,a,b,p,reverse=false){const x1=a.x+a.w,y1=a.y+a.h*.65,x2=b.x,y2=b.y+b.h*.35;g.save();g.strokeStyle=p.dateColor;g.globalAlpha=.45;g.setLineDash([5,6]);g.beginPath();g.moveTo(reverse?x2:x1,reverse?y2:y1);g.lineTo(reverse?x1:x2,reverse?y1:y2);g.stroke();g.setLineDash([]);const ang=Math.atan2((reverse?y1:y2)-(reverse?y2:y1),(reverse?x1:x2)-(reverse?x2:x1));const ex=reverse?x1:x2,ey=reverse?y1:y2;g.beginPath();g.moveTo(ex,ey);g.lineTo(ex-Math.cos(ang-.5)*8,ey-Math.sin(ang-.5)*8);g.lineTo(ex-Math.cos(ang+.5)*8,ey-Math.sin(ang+.5)*8);g.closePath();g.fillStyle=p.dateColor;g.fill();g.restore()}
function drawGrid(g,box,count,total,cols,rows,dots,label,p,highlight=-1){g.save();g.strokeStyle=p.dateColor;g.lineWidth=1.5;g.strokeRect(box.x,box.y,box.w,box.h);g.textAlign='left';g.textBaseline='middle';g.fillStyle=p.timeColor;g.font=`bold ${Math.max(7,box.h*.105)}px system-ui`;g.fillText(label,box.x+box.w*.05,box.y+box.h*.1,box.w*.9);for(let i=0;i<total;i++){const q=cellPoint(box,i,cols,rows),r=Math.max(1.5,Math.min(q.cw,q.ch)*(dots?.24:.34));g.beginPath();if(dots)g.arc(q.x,q.y,r,0,Math.PI*2);else g.rect(q.x-r,q.y-r,r*2,r*2);g.fillStyle=i<count?p.ringColor:p.trackColor;g.fill();g.strokeStyle=i<count?p.highlightColor:p.dateColor;g.lineWidth=i===highlight?3:1;g.stroke();if(i===highlight){g.beginPath();g.arc(q.x,q.y,r*1.5,0,Math.PI*2);g.strokeStyle=p.highlightColor;g.stroke()}}g.restore()}
function transferPoint(a,b,t){const u=1-t;return{x:u*u*a.x+2*u*t*(a.x+b.x)/2+t*t*b.x,y:u*u*a.y+2*u*t*(Math.min(a.y,b.y)-35)+t*t*b.y}}
function drawBuckets(g,x,y,w,h,levels,p,direction='fill',phase=0,wallSeconds=0,compact=false){const boxes=bucketLayout(x,y,w,h,compact),reverse=direction==='deplete';connector(g,boxes[0],boxes[1],p,reverse);connector(g,boxes[1],boxes[2],p,reverse);const boundary=wallSeconds%60,minuteTransfer=boundary<TRANSFER_SECONDS, hourTransfer=minuteTransfer&&levels.minute===0;drawGrid(g,boxes[0],levels.second,60,10,6,true,'SECONDS',p,levels.second===59?59:-1);drawGrid(g,boxes[1],levels.minute,60,10,6,false,'MINUTES',p,minuteTransfer?Math.max(0,levels.minute-1):-1);drawGrid(g,boxes[2],levels.hour,24,6,4,false,'HOURS / DAY',p,hourTransfer?Math.max(0,levels.hour-1):-1);if(!reduced.matches){const frac=wallSeconds-Math.floor(wallSeconds),dest=cellPoint(boxes[0],levels.second,10,6),fall={x:dest.x,y:boxes[0].y-boxes[0].h*.16},q=transferPoint(fall,dest,Math.min(1,frac/.8));g.fillStyle=p.highlightColor;g.beginPath();g.arc(q.x,q.y,Math.max(2,dest.cw*.22),0,Math.PI*2);g.fill();if(minuteTransfer){const from={x:boxes[0].x+boxes[0].w/2,y:boxes[0].y+boxes[0].h/2},to=cellPoint(boxes[1],Math.max(0,levels.minute-1),10,6),z=transferPoint(from,to,Math.min(1,boundary/TRANSFER_SECONDS));g.fillRect(z.x-5,z.y-5,10,10)}if(hourTransfer){const from={x:boxes[1].x+boxes[1].w/2,y:boxes[1].y+boxes[1].h/2},to=cellPoint(boxes[2],Math.max(0,levels.hour-1),6,4),z=transferPoint(from,to,Math.min(1,boundary/TRANSFER_SECONDS));g.strokeStyle=p.highlightColor;g.lineWidth=3;g.strokeRect(z.x-6,z.y-6,12,12)}}g.save();g.fillStyle=p.timeColor;g.font=`bold ${Math.max(7,Math.min(13,boxSafe(boxes[0])*.08))}px system-ui`;g.textAlign='center';g.fillText(reverse?'DEPLETING ←':'FLOW →',x+w/2,y+Math.max(10,h*.03));g.restore();return boxes}
function boxSafe(b){return Math.min(b.w,b.h)}
function liveBucketState(d){const ms=d.getMilliseconds()/1000,sec=d.getSeconds()+ms,boundary=sec<TRANSFER_SECONDS,minuteBoundary=boundary&&d.getMinutes()===0;return{levels:{second:d.getSeconds(),minute:d.getMinutes(),hour:d.getHours()},wallSeconds:sec,status:`${d.getSeconds()} of 60 seconds; ${d.getMinutes()} of 60 minutes; ${d.getHours()} of 24 hours${minuteBoundary?', hour transfer active':boundary?', minute transfer active':''}`}}
function drawCenter(d,cx,cy,R,dpr,p,maxWidth=Infinity){if(!centerVisible)return;const[a,b]=centerText(d),requested=+controls.digitalFontSize.value*dpr,dateRequested=+controls.dateFontSize.value*dpr,limit=Math.min(maxWidth,Math.max(120*dpr,R*1.3)),size=Math.min(requested,Math.max(18*dpr,limit/(Math.max(a.length,6)*.56))),dateSize=Math.min(dateRequested,Math.max(9*dpr,limit/(Math.max(b.length,10)*.55)));ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=p.backgroundColor+'dc';ctx.fillRect(cx-limit*.55,cy-size*.65,limit*1.1,size+dateSize*2.1);ctx.fillStyle=p.timeColor;ctx.font=`300 ${size}px system-ui`;ctx.fillText(a,cx,cy-dateSize*.45,limit);ctx.fillStyle=p.dateColor;ctx.font=`${dateSize}px system-ui`;ctx.fillText(b,cx,cy+size*.55,limit);ctx.restore()}
function setCalendarOpen(open){controls.calendarOpen.checked=!!open;const host=$('calendarBars'),toggle=$('calendarToggle');host.classList.toggle('open',!!open);toggle.setAttribute('aria-expanded',String(!!open));toggle.setAttribute('aria-label',open?'Hide calendar progress':'Show calendar progress');toggle.textContent=open?'Calendar ▴':'Calendar ▾'}
function renderCalendar(d){const host=$('calendarBars'),wanted=selectedUnits(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),defs={months:{label:'Months',count:12,current:d.getMonth(),names:Array.from({length:12},(_,i)=>new Date(2000,i).toLocaleDateString([],{month:'short'}))},dates:{label:'Days',count:days,current:d.getDate()-1,names:Array.from({length:days},(_,i)=>String(i+1))},weekdays:{label:'Week',count:7,current:d.getDay(),names:Array.from({length:7},(_,i)=>new Date(2023,0,i+1).toLocaleDateString([],{weekday:'short'}))}};host.className=`calendar-bars ${controls.calendarOrientation.value} ${controls.calendarOpen.checked?'open':''}`;host.hidden=!wanted.length;const key=`${wanted}|${d.toDateString()}|${controls.calendarOrientation.value}`;if(host.dataset.key===key)return;host.dataset.key=key;host.replaceChildren(...CALENDAR_UNITS.filter(name=>wanted.includes(name)).map(name=>{const z=defs[name],row=document.createElement('div'),title=document.createElement('span'),bar=document.createElement('div');row.className='calendar-row';title.className='calendar-row-label';title.textContent=z.label;bar.className='calendar-bar';bar.setAttribute('role','list');bar.setAttribute('aria-label',`${z.label}: ${z.names[z.current]} current`);for(let i=0;i<z.count;i++){const e=document.createElement('span'),state=i<z.current?'completed':i===z.current?'current':'upcoming';e.className=`calendar-segment ${i<z.current?'done':i===z.current?'current':''}`;e.setAttribute('role','listitem');e.setAttribute('aria-label',`${z.names[i]}: ${state}`);if(i===z.current||z.count<=12)e.textContent=z.names[i];bar.append(e)}row.append(title,bar);return row}))}

function chime(){audioContext??=new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();const now=audioContext.currentTime;[0,.18].forEach((delay,i)=>{const o=audioContext.createOscillator(),gain=audioContext.createGain();o.frequency.value=i?659.25:523.25;gain.gain.setValueAtTime(+controls.volume.value*.16,now+delay);gain.gain.exponentialRampToValueAtTime(.001,now+delay+.55);o.connect(gain).connect(audioContext.destination);o.start(now+delay);o.stop(now+delay+.6)})}
function message(s){$('message').textContent=s;setTimeout(()=>{if($('message').textContent===s)$('message').textContent=''},3000)}
function config(){return{version:CONFIG_VERSION,...Object.fromEntries(Object.entries(controls).map(([k,v])=>[k,v.type==='checkbox'?v.checked:v.value])),centerVisible,calendarBars:selectedUnits(),timer:{mode:$('timerMode').value,visual:$('timerVisual').value,hours:+$('timerHours').value,minutes:+$('timerMinutes').value,seconds:+$('timerSeconds').value}}}
function migrate(raw){const c={...raw};c.version=CONFIG_VERSION;const style={both:'buckets',circular:'rings',ring:'rings',elapsed:'rings'}[c.clockStyle]||c.clockStyle;c.clockStyle=['rings','analog','buckets','digital'].includes(style)?style:'rings';c.calendarOrientation=c.calendarOrientation==='vertical'?'vertical':'horizontal';c.calendarOpen=typeof c.calendarOpen==='boolean'?c.calendarOpen:false;c.digitalFontSize=c.digitalFontSize??64;c.dateFontSize=c.dateFontSize??18;let old=Array.isArray(c.calendarBars)?c.calendarBars:Array.isArray(c.units)?c.units:[];if(!old.length)old=['months','dates','weekdays'];const map={month:'months',year:'months',day:'dates',months:'months',dates:'dates',weekdays:'weekdays'};const normalized=old.map(v=>map[v]);if(old.includes('day'))normalized.push('weekdays');c.calendarBars=CALENDAR_UNITS.filter(x=>normalized.includes(x));if(c.timer?.visual==='hourglass')c.timer={...c.timer,visual:'buckets'};return c}
function validNumber(k,v){const n=Number(v),r=ranges[k];return Number.isFinite(n)&&n>=r[0]&&n<=r[1]}
function applyConfig(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Invalid configuration');const c=migrate(raw);for(const[k,v]of Object.entries(controls)){if(c[k]===undefined)continue;if(v.type==='checkbox')v.checked=Boolean(c[k]);else if(v.type==='color'){if(HEX.test(c[k]))v.value=c[k]}else if(v.type==='range'){if(validNumber(k,c[k]))v.value=c[k]}else if([...v.options].some(o=>o.value===String(c[k])))v.value=c[k]}document.querySelectorAll('#unitChecks input').forEach(x=>x.checked=c.calendarBars.includes(x.value));centerVisible=controls.tapCenter.checked?c.centerVisible!==false:true;if(c.timer&&typeof c.timer==='object'){$('timerMode').value=c.timer.mode==='countup'?'countup':'countdown';$('timerVisual').value=['buckets','analog','spiral'].includes(c.timer.visual)?c.timer.visual:'buckets';for(const[k,max]of Object.entries({hours:99,minutes:59,seconds:59})){const n=Number(c.timer[k]);$('timer'+k[0].toUpperCase()+k.slice(1)).value=Number.isFinite(n)?Math.min(max,Math.max(0,n)):0}}setCalendarOpen(controls.calendarOpen.checked);updateRangeOutputs();applyAppearance()}
function applyAppearance(){const p=colors();for(const[k,v]of Object.entries({bg:p.backgroundColor,accent:p.ringColor,text:p.timeColor,track:p.trackColor}))document.documentElement.style.setProperty(`--${k}`,v)}function applyPreset(){if(controls.theme.value==='custom')return;Object.entries(palettes[controls.theme.value]).forEach(([k,v])=>controls[k].value=v);applyAppearance()}
$('openControls').onclick=()=>{$('panel').classList.add('open');$('openControls').setAttribute('aria-expanded','true');setCalendarOpen(false)};$('closeControls').onclick=()=>{$('panel').classList.remove('open');$('openControls').setAttribute('aria-expanded','false')};$('restoreUnits').onclick=()=>document.querySelectorAll('#unitChecks input').forEach(x=>x.checked=true);$('calendarToggle').onclick=()=>setCalendarOpen(!controls.calendarOpen.checked);controls.calendarOpen.onchange=()=>setCalendarOpen(controls.calendarOpen.checked);function updateRangeOutputs(){for(const id of ['digitalFontSize','dateFontSize'])$(id+'Output').value=`${controls[id].value} px`}for(const id of ['digitalFontSize','dateFontSize'])controls[id].oninput=updateRangeOutputs;controls.theme.onchange=applyPreset;for(const k of ['backgroundColor','ringColor','trackColor','timeColor','dateColor','highlightColor'])controls[k].oninput=()=>{controls.theme.value='custom';applyAppearance()};controls.tapCenter.onchange=()=>{if(!controls.tapCenter.checked)centerVisible=true};$('testSound').onclick=chime;function toggleCenter(){if(controls.tapCenter.checked)centerVisible=!centerVisible}canvas.onclick=toggleCenter;canvas.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleCenter()}};
$('saveConfig').onclick=()=>{localStorage.setItem('time-flow-config',JSON.stringify(config()));message('Preferences saved')};$('exportConfig').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(config(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='time-flow-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),0)};$('importButton').onclick=()=>$('importConfig').click();$('importConfig').onchange=async e=>{try{if(!e.target.files[0])return;applyConfig(JSON.parse(await e.target.files[0].text()));message('Preferences imported')}catch{message('Could not import that file')}finally{e.target.value=''}};
const td=$('timerDialog'),tc=$('timerCanvas'),tx=tc.getContext('2d');let timer={state:'idle',elapsed:0,started:0},completionAnnounced=false;function duration(){return Math.max(1,+$('timerHours').value*3600 + +$('timerMinutes').value*60 + +$('timerSeconds').value)}function elapsed(){return timer.elapsed+(timer.state==='running'?(performance.now()-timer.started)/1000:0)}function fmt(n){n=Math.max(0,Math.ceil(n));return`${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n/60)%60).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function timerFrame(){const total=duration(),mode=$('timerMode').value;let e=Math.min(elapsed(),total),remaining=Math.max(0,total-e);if(e>=total&&timer.state==='running'){timer.elapsed=total;timer.state='done';$('timerPause').disabled=true;if(!completionAnnounced){completionAnnounced=true;chime();message('Timer complete')}}const ef=e/total,rf=remaining/total,value=mode==='countdown'?remaining:e;$('timerDisplay').textContent=fmt(value);drawTimer({mode,elapsedFraction:ef,remainingFraction:rf,elapsedSeconds:e,remainingSeconds:remaining,duration:total});requestAnimationFrame(timerFrame)}
function spiral(f,p){tx.lineWidth=12;tx.lineCap='round';for(const[color,end]of[[p.trackColor,1],[p.ringColor,f]]){tx.strokeStyle=color;tx.beginPath();for(let i=0;i<=240*end;i++){const t=i/240*Math.PI*5,r=130*i/240,x=180+Math.cos(t)*r,y=180+Math.sin(t)*r;i?tx.lineTo(x,y):tx.moveTo(x,y)}tx.stroke()}}
function drawTimer(s){const p=colors(),f=s.mode==='countdown'?s.remainingFraction:s.elapsedFraction;tx.clearRect(0,0,360,360);if($('timerVisual').value==='analog'){tx.lineWidth=14;tx.lineCap='round';tx.strokeStyle=p.trackColor;tx.beginPath();tx.arc(180,180,130,0,Math.PI*2);tx.stroke();tx.strokeStyle=p.ringColor;tx.beginPath();tx.arc(180,180,130,-Math.PI/2,-Math.PI/2+f*Math.PI*2);tx.stroke();handTimer(f,p)}else if($('timerVisual').value==='spiral')spiral(f,p);else{const source=s.mode==='countdown'?s.remainingSeconds:s.elapsedSeconds,phase=reduced.matches?0:(source%60<TRANSFER_SECONDS?1-source%60/TRANSFER_SECONDS:source%60>55?(source%60-55)/5:0);drawBuckets(tx,12,12,336,336,bucketLevels(source),p,s.mode==='countdown'?'deplete':'fill',phase,source,true)}const status=`${s.mode}, ${fmt(s.mode==='countdown'?s.remainingSeconds:s.elapsedSeconds)}, ${Math.round(f*100)} percent ${s.mode==='countdown'?'remaining':'elapsed'}${timer.state==='done'?', complete':''}`;tc.setAttribute('aria-label',status)}function handTimer(f,p){const a=-Math.PI/2+f*Math.PI*2;tx.strokeStyle=p.highlightColor;tx.lineWidth=6;tx.beginPath();tx.moveTo(180,180);tx.lineTo(180+Math.cos(a)*98,180+Math.sin(a)*98);tx.stroke()}
$('openTimer').onclick=()=>td.showModal();$('closeTimer').onclick=()=>td.close();$('timerStart').onclick=()=>{if(timer.state==='done'||timer.state==='idle')timer.elapsed=0;timer.started=performance.now();timer.state='running';completionAnnounced=false;$('timerStart').textContent='Resume';$('timerPause').disabled=false};$('timerPause').onclick=()=>{timer.elapsed=elapsed();timer.state='paused';$('timerPause').disabled=true};$('timerReset').onclick=()=>{timer={state:'idle',elapsed:0,started:0};completionAnnounced=false;$('timerStart').textContent='Start';$('timerPause').disabled=true};for(const id of ['timerMode','timerVisual','timerHours','timerMinutes','timerSeconds'])$(id).addEventListener('change',()=>{if(timer.state==='idle'||timer.state==='done'){$('timerReset').click()}});
applyPreset();updateRangeOutputs();setCalendarOpen(false);try{const saved=JSON.parse(localStorage.getItem('time-flow-config'));if(saved)applyConfig(saved)}catch{message('Saved preferences could not be loaded')}applyAppearance();drawClock();timerFrame();
