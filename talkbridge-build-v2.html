/* ── language detect + translate (code-switching across four+ languages;
   detectLang pattern from bridge-turn08-base.html: script-range detection
   plus an English-word-boundary heuristic when the room's language is
   non-Latin, per spec §9's "Thai, Chinese, Korean or Arabic room who says
   a phrase in English" requirement) ── */
function detectLang(text,fallback){
  var t=(text||'').trim();if(!t)return fallback||'en';
  if(/[฀-๿]/.test(t))return'th';
  if(/[぀-ヿ]/.test(t))return'ja';
  if(/[一-鿿]/.test(t))return'zh';
  if(/[가-힣]/.test(t))return'ko';
  if(/[؀-ۿ]/.test(t))return'ar';
  if(/[ऀ-ॿ]/.test(t))return'hi';
  if(/[Ѐ-ӿ]/.test(t))return'ru';
  var nonLatinFallbacks=['zh','ja','ko','th','ar','hi','ru'];
  if(nonLatinFallbacks.indexOf(fallback)>=0&&/^[\x00-\x7FÀ-ɏ\s]+$/.test(t))return'en';
  if(/^[\x20-\x7E]+$/.test(t)&&/\b(the|this|that|those|these|they|them|their|there|then|though|okay|yeah|what|where|when|why|who|how|you|your|are|were|have|hello|good|morning|afternoon|evening|don't|can't|won't|isn't|aren't|I'm|I've|I'll|you're|it's)\b/i.test(t))return'en';
  return fallback||'en';
}
var trCache=new Map(),TR_CACHE_MAX=200;
function cleanTr(t){return norm(String(t||'').replace(/<\/?[a-zA-Z][^>]*>/g,''))}
function translateWithRetry(text,from,to,retries){
  if(!text||!from||!to||from===to)return Promise.resolve({text:text,ok:true});
  var k=from+'|'+to+'|'+text;
  if(trCache.has(k)){var v=trCache.get(k);trCache.delete(k);trCache.set(k,v);return Promise.resolve({text:v,ok:true})}
  var attempt=function(n){
    return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to)
      .then(function(r){return r.json()})
      .then(function(d){
        if(d&&d.responseStatus===200&&d.responseData){
          var t=d.responseData.translatedText;
          if(t&&t.indexOf('MYMEMORY')<0){
            t=cleanTr(t);
            if(trCache.size>=TR_CACHE_MAX){var first=trCache.keys().next().value;trCache.delete(first)}
            trCache.set(k,t);return{text:t,ok:true};
          }
        }
        throw new Error('bad response');
      })
      .catch(function(e){
        if(n>0){return new Promise(function(res){setTimeout(res,300+((retries-n)*250))}).then(function(){return attempt(n-1)})}
        log('trans_fail',{from:from,to:to,e:String(e)},'error');
        return{text:text,ok:false};
      });
  };
  return attempt(retries||0);
}

/* ════════════════════════ MODULE: AudioEngine (§20) ════════════════════════
   getUserMedia, primary + secondary Deepgram sockets, AudioWorklet/script-
   processor fallback, meter. Socket/track identity captured at creation,
   gated on SessionCore.
   ITEM 2 — exact URL, exact auth (WebSocket subprotocol, not a header), and
   the mandatory socket-identity guard: dgWs captured as mySocket at
   creation, every handler checks dgWs===mySocket before doing anything, so
   a stale socket's close event can never tear down a newer live session. */
var DG_WORKLET_CODE="class TBCap extends AudioWorkletProcessor{process(inputs){var ch=inputs[0][0];if(ch)this.port.postMessage(ch.slice());return true}}registerProcessor('tb-audio-capture',TBCap);";
var AudioEngine=(function(){
  var dgWs=null,dgActive=false,dgAudioCtx=null,dgSrc=null,dgProc=null;
  var chatMic={on:false,stream:null};
  var watchdogTimer=null,DG_WATCHDOG_MS=30000,lastMsgAt=0;
  var failCount=0,DG_MAX_FAILS=3;

  function micStream(){return CallEngine.isActive()?CallEngine.stream():(chatMic.on?chatMic.stream:null)}
  function micPipelineOn(){return CallEngine.isActive()?CallEngine.micOn():chatMic.on}
  function stopDgAudio(){
    if(dgProc)try{dgProc.disconnect()}catch(_){}dgProc=null;
    if(dgSrc)try{dgSrc.disconnect()}catch(_){}dgSrc=null;
    if(dgAudioCtx)try{dgAudioCtx.close()}catch(_){}dgAudioCtx=null;
  }
  function stopWatchdog(){clearInterval(watchdogTimer);watchdogTimer=null}
  function stopDeepgram(){
    stopWatchdog();dgActive=false;
    if(dgWs){try{dgWs.close()}catch(_){}dgWs=null}
    stopDgAudio();
    log('dg_stopped',{});
  }
  function showFailBanner(){var b=$('dg-fail-banner');if(b)b.classList.add('show');log('dg_persistent_failure',{fails:failCount},'error')}
  function hideFailBanner(){var b=$('dg-fail-banner');if(b)b.classList.remove('show')}

  var recentFinals=[];
  function isDupe(text){
    var now=Date.now(),s=norm(text).toLowerCase();
    recentFinals=recentFinals.filter(function(f){return now-f.t<4000});
    return recentFinals.some(function(f){return f.s===s});
  }
  function recFinal(text){recentFinals.push({s:norm(text).toLowerCase(),t:Date.now()})}

  async function onDGFinal(text,callTok){
    text=norm((text||'').replace(/<[^>]*>/g,''));if(!text)return;
    if(!text.replace(/[\s.,!?;:'"()\-]/g,''))return;
    if(isDupe(text))return;
    recFinal(text);log('dg_final',{t:text.slice(0,60)},'ok');
    var room=RoomStore.active();if(!room)return;
    if(!CallEngine.isActive()){
      /* chat mic: spoken text is chat text — same bubble path as typed (Item 9 / §7.1.B) */
      if(chatMic.on)sendChatText(text,null,'voice');
      return;
    }
    if(!SessionCore.isCurrentCall(callTok))return; // call ended/changed while this finalized
    /* one spoken utterance -> one durable row BEFORE translation; failure
       can never erase the spoken line (§18.4-7) */
    var src=room.myLang,tgt=room.theirLang,id='sp-'+uid(),ts=Date.now();
    var entry={id:id,kind:'chat',who:'me',sourceText:text,translatedText:text,srcLang:src,tgtLang:tgt,ts:ts,
      senderName:room.myName||AppUser.name(),origin:'voice',receipt:'sent',attachment:null};
    TranscriptStore.appendLocal(room.id,entry);
    if(AppState.roomId===room.id)UI.appendMsgDom(entry);
    UI.showCaption(text,'mine');
    var srcText=text;
    try{
      var detected=detectLang(text,src);
      if(detected&&detected!==src){
        var n=await translateWithRetry(text,detected,src,2);
        if(!SessionCore.isCurrentCall(callTok)&&!SessionCore.isCurrent(callTok))return;
        if(n.ok&&norm(n.text).toLowerCase()!==norm(text).toLowerCase()){srcText=norm(n.text);TranscriptStore.patch(room.id,id,{sourceText:srcText});if(AppState.roomId===room.id)UI.replaceMsgDom(TranscriptStore.find(room.id,id))}
        else src=detected;
      }
      RelayClient.send({type:'subtitle',subtitleSeq:id,text:srcText,sourceText:srcText,sourceLang:src,targetLang:tgt,transient:true});
      var tr=await translateWithRetry(srcText,src,tgt,2);
      var trText=tr.ok?norm(tr.text):srcText,failed=(!tr.ok&&src!==tgt);
      var patched=TranscriptStore.patch(room.id,id,{translatedText:trText,translationFailed:failed});
      if(AppState.roomId===room.id&&patched)UI.replaceMsgDom(patched);
      if(patched)RelayClient.send(RelayClient.chatPayload(patched));
      UI.showCaption(trText,'mine');
    }catch(e){log('dg_final_translate_err',{e:String(e)},'error')}
  }

  function startDeepgram(){
    var room=RoomStore.active();if(!room||!(CallEngine.isActive()||chatMic.on))return;
    var key=Cred.effective(room).dg;
    if(!key){toast('Deepgram key missing — no live transcription');log('dg_no_key',{},'warn');return}
    if(dgActive||(dgWs&&dgWs.readyState<2)){return}
    var stream=micStream();
    if(!stream){log('dg_no_stream',{},'error');return}
    var callTok=SessionCore.capture();
    var langCode=DG_LANGS[room.myLang]||'en-US';
    var url='wss://api.deepgram.com/v1/listen?model=nova-3&language='+encodeURIComponent(langCode)+'&encoding=linear16&sample_rate=16000&channels=1&interim_results=false&punctuate=false&endpointing=400';
    var dgWsLocal=new WebSocket(url, ['token', key]);
    dgWs=dgWsLocal;
    var mySocket=dgWsLocal; // captured at creation — mandatory socket-identity guard (Item 2)
    dgWsLocal.onopen=function(){
      if(dgWsLocal !== mySocket) return; // superseded before it even opened
      if(!(CallEngine.isActive()||chatMic.on)){try{dgWsLocal.close()}catch(_){}return}
      failCount=0;hideFailBanner();
      log('dg_open',{lang:langCode},'ok');
      try{
        var audioTracks=(stream?stream.getAudioTracks():[]).filter(function(t){return t.readyState==='live'});
        if(!audioTracks.length){log('dg_no_audio',{},'error');dgWsLocal.close();return}
        var dgStream=new MediaStream(audioTracks);
        dgAudioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
        dgSrc=dgAudioCtx.createMediaStreamSource(dgStream);
        var silentGain=dgAudioCtx.createGain();silentGain.gain.value=0;silentGain.connect(dgAudioCtx.destination);
        function pump(f){
          if(dgWsLocal !== mySocket || dgWsLocal.readyState!==1 || !micPipelineOn())return;
          var b=new Int16Array(f.length);
          for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i]));b[i]=s<0?s*0x8000:s*0x7FFF}
          dgWsLocal.send(b.buffer);
        }
        function scriptProc(){
          if(dgWsLocal !== mySocket)return;
          dgProc=dgAudioCtx.createScriptProcessor(4096,1,1);
          dgProc.onaudioprocess=function(e){pump(e.inputBuffer.getChannelData(0))};
          dgSrc.connect(dgProc);dgProc.connect(silentGain);
          dgActive=true;log('dg_scriptproc_active',{},'warn');
        }
        if(dgAudioCtx.audioWorklet&&typeof AudioWorkletNode!=='undefined'){
          var wblob=new Blob([DG_WORKLET_CODE],{type:'application/javascript'});
          var wurl=URL.createObjectURL(wblob);
          dgAudioCtx.audioWorklet.addModule(wurl).then(function(){
            URL.revokeObjectURL(wurl);
            if(dgWsLocal !== mySocket || dgWsLocal.readyState!==1)return; // same captured session check on the async success path
            var wnode=new AudioWorkletNode(dgAudioCtx,'tb-audio-capture');
            wnode.port.onmessage=function(ev){pump(ev.data)};
            dgSrc.connect(wnode);wnode.connect(silentGain);
            dgProc=wnode;dgActive=true;log('dg_worklet_active',{},'ok');
          }).catch(function(e){
            URL.revokeObjectURL(wurl);
            if(dgWsLocal !== mySocket)return; // same captured session check on the async failure path
            log('worklet_fallback',{e:String(e)},'warn');scriptProc();
          });
        }else scriptProc();
      }catch(e){log('dg_audio_err',{e:String(e)},'error');dgActive=false}
    };
    dgWsLocal.onmessage=function(e){
      if(dgWsLocal !== mySocket) return;
      lastMsgAt=Date.now();
      try{
        var d=JSON.parse(e.data);
        var alt=d.channel&&d.channel.alternatives&&d.channel.alternatives[0];
        if(alt&&alt.transcript&&d.is_final)onDGFinal(alt.transcript,callTok);
      }catch(_){}
    };
    dgWsLocal.onerror=function(){if(dgWsLocal===mySocket)log('dg_error',{},'error')};
    dgWsLocal.onclose=function(ev){
      if(dgWsLocal !== mySocket){log('dg_stale_close_ignored',{code:ev.code},'warn');return} // a stale socket's close must never tear down the newer live session
      log('dg_close',{code:ev.code},'warn');
      var neverOpened=!dgActive;
      dgActive=false;stopDgAudio();stopWatchdog();
      if(!(CallEngine.isActive()||chatMic.on))return;
      if(neverOpened){
        failCount++;
        log('dg_credential_failure',{count:failCount,code:ev.code},'error');
        if(failCount>=DG_MAX_FAILS){showFailBanner();return}
      }
      setTimeout(function(){if((CallEngine.isActive()||chatMic.on)&&!dgActive)startDeepgram()},2000);
    };
    lastMsgAt=Date.now();stopWatchdog();
    watchdogTimer=setInterval(function(){
      if(!dgActive||!(CallEngine.isActive()||chatMic.on)){stopWatchdog();return}
      if(Date.now()-lastMsgAt>DG_WATCHDOG_MS){
        log('dg_watchdog_restart',{silent_ms:Date.now()-lastMsgAt},'warn');
        stopDeepgram();
        setTimeout(function(){if((CallEngine.isActive()||chatMic.on)&&!dgActive)startDeepgram()},1000);
      }
    },5000);
  }

  return{
    startDeepgram:startDeepgram,
    stopAll:stopDeepgram,
    micStream:micStream,
    micPipelineOn:micPipelineOn,
    isChatMicOn:function(){return chatMic.on},
    startChatMic:async function(){
      if(chatMic.on||CallEngine.isActive())return;
      var room=RoomStore.active();if(!room)return;
      try{chatMic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
      catch(e){toast('Microphone access needed');return}
      chatMic.on=true;failCount=0;hideFailBanner();
      MicMeter.attach(chatMic.stream);
      startDeepgram();
      UI.setMicUiOn(true);
      log('chatmic_on',{},'ok');
    },
    stopChatMic:function(silent){
      if(!chatMic.on){if(chatMic.stream){chatMic.stream.getTracks().forEach(function(t){try{t.stop()}catch(_){}});chatMic.stream=null}return}
      chatMic.on=false;
      if(chatMic.stream){chatMic.stream.getTracks().forEach(function(t){try{t.stop()}catch(_){}});chatMic.stream=null}
      if(!CallEngine.isActive()){MicMeter.detach();stopDeepgram();UI.setMicUiOn(false)}
      if(!silent)log('chatmic_off',{},'ok');
    },
    wasChatMicOn:function(){return chatMic.on},
    forceChatMicFlag:function(v){chatMic.on=v}
  };
})();
/* chat mic reuses the call's micStream/micPipelineOn indirection */
function sendChatText(text,attachment,originOverride){return UI.sendChatText(text,attachment,originOverride)}

/* simple mic-level meter feeding .mic-meter .lvl scale */
var MicMeter=(function(){
  var ctx=null,analyser=null,src=null,raf=null;
  function tick(){
    if(!analyser)return;
    var data=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    var sum=0;for(var i=0;i<data.length;i++)sum+=data[i];
    var avg=sum/data.length/255;
    var el=$('mic-lvl');if(el)el.style.transform='scale('+Math.min(1,avg*3).toFixed(2)+')';
    raf=requestAnimationFrame(tick);
  }
  return{
    attach:function(stream){
      try{
        this.detach();
        ctx=new(window.AudioContext||window.webkitAudioContext)();
        src=ctx.createMediaStreamSource(stream);
        analyser=ctx.createAnalyser();analyser.fftSize=256;
        src.connect(analyser);
        tick();
      }catch(_){}
    },
    detach:function(){
      if(raf)cancelAnimationFrame(raf);raf=null;
      if(src)try{src.disconnect()}catch(_){}src=null;
      analyser=null;
      if(ctx)try{ctx.close()}catch(_){}ctx=null;
      var el=$('mic-lvl');if(el)el.style.transform='scale(0)';
    }
  };
})();

/* ════════════════════════ MODULE: CallEngine (§20) ════════════════════════
   Peer connection, TURN credentials, offer/answer/ICE, ring/accept/decline/
   recovery timers, tagged with callGeneration.
   ITEM 3 — exact TURN endpoint. On success the response's ICE server data
   becomes the REAL iceServers (not empty); on failure the failure is
   surfaced explicitly, never a silent fallback to no ICE servers.
   ITEM 8 — real <video> elements bound via .srcObject to the real
   MediaStream from getUserMedia / the peer connection's remote track. */
var RING=(function(){
  var ctx=null,timer=null;
  return{
    start:function(){
      this.stop();
      try{
        var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        ctx=new AC();
        var beep=function(){
          try{
            var o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
            o1.frequency.value=440;o2.frequency.value=480;g.gain.value=0.08;
            o1.connect(g);o2.connect(g);g.connect(ctx.destination);
            o1.start();o2.start();
            setTimeout(function(){try{o1.stop();o2.stop()}catch(_){}},900);
          }catch(_){}
          try{if(navigator.vibrate)navigator.vibrate([400,200,400])}catch(_){}
        };
        beep();timer=setInterval(beep,2000);
      }catch(_){}
    },
    stop:function(){
      if(timer){clearInterval(timer);timer=null}
      if(ctx){try{ctx.close()}catch(_){}ctx=null}
      try{if(navigator.vibrate)navigator.vibrate(0)}catch(_){}
    }
  };
})();

var CallEngine=(function(){
  var active=false,pip=false,kind='voice',caller=false,accepted=false,startTs=0,micOn=true,camOn=false;
  var pc=null,stream=null,remoteStream=null,connBad=false;
  var pendingCandidates=[],savedOffer=null,savedCandidates=[],seenCand=new Set();
  var ringPending=null,ringTimer=null,callerTimer=null,durTimer=null,pushed=false;
  var chatMicWasOn=false,endedAt=0,starting=false,callTok=null;

  function micConstraints(){return{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}

  async function acquire(wantKind){
    var wantVideo=(wantKind==='video');
    try{stream=await navigator.mediaDevices.getUserMedia({video:wantVideo,audio:micConstraints()})}
    catch(_){
      if(!wantVideo){toast('Microphone access needed');return false}
      try{stream=await navigator.mediaDevices.getUserMedia({video:false,audio:micConstraints()})}
      catch(e2){toast('Microphone access needed');return false}
    }
    camOn=wantVideo&&stream.getVideoTracks().length>0;
    stream.getVideoTracks().forEach(function(t){t.enabled=camOn});
    micOn=true;
    return true;
  }

  function mount(room){
    callTok=SessionCore.newCall()?SessionCore.capture():SessionCore.capture();
    startTs=Date.now();
    chatMicWasOn=AudioEngine.wasChatMicOn();
    AudioEngine.stopAll(); // unconditional — any live pipeline must die before rebinding to the call stream
    AudioEngine.stopChatMic(true);
    var rv=$('remote-video');if(rv)rv.muted=(room.ear===false);
    $('call-band').classList.add('on');
    $('call-band').classList.toggle('is-video',kind==='video');
    var scrRoom=$('scr-room');if(scrRoom)scrRoom.classList.add(kind==='video'?'st-video':'st-phone');
    $('local-video').srcObject=stream; // Item 8 — real MediaStream bound via srcObject
    $('local-video').style.display=(kind==='video'&&camOn)?'':'none';
    $('rb-cam').classList.toggle('off',!camOn);
    $('rb-mic').classList.remove('off');
    $('remote-ph').style.display='';
    durTimer=setInterval(function(){
      if(!active)return;
      var t=$('rz-timer');if(!t)return;
      if(connBad){t.textContent='Reconnecting…';return}
      var s=Math.floor((Date.now()-startTs)/1000);
      t.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);
    },1000);
    MicMeter.attach(stream);
    AudioEngine.startDeepgram();
  }

  async function setupPC(){
    if(pc)return;
    var room=RoomStore.active();if(!room)return;
    var iceServers=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
    var k=Cred.effective(room);
    if(k.tid&&k.tok){
      try{
        var r = await fetch('https://rtc.live.cloudflare.com/v1/turn/keys/' + encodeURIComponent(k.tid) + '/credentials/generate', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + k.tok, 'Content-Type': 'application/json' },
          body: JSON.stringify({ ttl: 86400 })
        });
        if(r.ok){var d=await r.json();if(d.iceServers){iceServers=Array.isArray(d.iceServers)?d.iceServers:[d.iceServers];log('turn_ok',{n:iceServers.length},'ok')}}
        else{toast('TURN credentials request failed ('+r.status+') — call may not connect across networks');log('turn_err',{s:r.status},'error')}
      }catch(e){toast('TURN credentials request failed — call may not connect across networks');log('turn_fetch_err',{e:String(e)},'error')}
    }else{
      log('turn_no_keys',{},'warn'); // no silent fallback: STUN-only is a real, logged degradation, not hidden
    }
    var pcLocal=pc=new RTCPeerConnection({iceServers:iceServers});
    if(room.role==='creator'){
      pcLocal.onnegotiationneeded=async function(){
        try{
          savedCandidates=[];
          await pcLocal.setLocalDescription(await pcLocal.createOffer());
          var offer={type:'webrtc-signal',transient:true,signal:{description:pcLocal.localDescription}};
          RelayClient.send(offer);savedOffer=offer;log('rtc_offer',{},'ok');
        }catch(e){log('rtc_offer_err',{e:String(e)},'error')}
      };
    }else pcLocal.onnegotiationneeded=function(){};
    (stream?stream.getTracks():[]).forEach(function(t){pcLocal.addTrack(t,stream)});
    pcLocal.onicecandidate=function(e){
      if(e.candidate){
        if(String(e.candidate.candidate||'').indexOf('.local')!==-1)return;
        var cm={type:'webrtc-signal',transient:true,signal:{candidate:e.candidate}};
        savedCandidates.push(cm);RelayClient.send(cm);
      }
    };
    pcLocal.onconnectionstatechange=function(){
      var s2=pcLocal.connectionState;
      log('rtc_conn',{s:s2},s2==='connected'?'ok':'info');
      if(s2==='connected'){
        connBad=false;AudioEngine.startDeepgram();
        var lv=$('local-video');if(lv&&stream&&lv.srcObject!==stream)lv.srcObject=stream;
        try{if(lv)lv.play()}catch(_){}
        try{$('remote-video').play()}catch(_){}
      }
      if(s2==='disconnected')connBad=true;
      if(s2==='failed'&&active){ // degraded-call repair — reconnects without a manual redial
        connBad=true;
        try{pcLocal.close()}catch(_){}
        pc=null;savedOffer=null;seenCand=new Set();pendingCandidates=[];
        if(room.role==='creator')setTimeout(function(){if(active)setupPC()},1500);
      }
    };
    pcLocal.ontrack=function(e){
      if(!remoteStream)remoteStream=new MediaStream();
      var add=function(track){if(!remoteStream.getTracks().some(function(x){return x.id===track.id}))remoteStream.addTrack(track)};
      if(e.streams&&e.streams[0])e.streams[0].getTracks().forEach(add);else if(e.track)add(e.track);
      $('remote-video').srcObject=remoteStream; // Item 8 — real remote MediaStream from the peer connection
      if(remoteStream.getVideoTracks().length)$('remote-ph').style.display='none';
      log('rtc_track',{kind:e.track&&e.track.kind},'ok');
    };
  }

  async function onSignal(d){
    if(!d.signal)return;
    var room=RoomStore.active();if(!room)return;
    if(!active&&starting){setTimeout(function(){onSignal(d)},250);return}
    try{
      if(d.signal.description){
        var desc=d.signal.description;
        if(desc.type==='offer'){
          if(!active){
            if(endedAt&&Date.now()-endedAt<5000){log('rtc_offer_ignored_postend',{},'warn');return}
            if(!(await acquire('voice')))return;
            active=true;caller=false;mount(room);
          }
          if(pc&&pc.connectionState==='connected'){return}
          if(pc&&pc.connectionState!=='closed'){try{pc.close()}catch(_){}pc=null;pendingCandidates=[];seenCand=new Set()}
          remoteStream=null;$('remote-video').srcObject=null;
          await setupPC();
          await pc.setRemoteDescription(desc);
          await flushCands();
          await pc.setLocalDescription(await pc.createAnswer());
          RelayClient.send({type:'webrtc-signal',transient:true,signal:{description:pc.localDescription}});
          log('rtc_answered',{},'ok');
        }else if(desc.type==='answer'){
          if(!pc)return;
          await pc.setRemoteDescription(desc);
          await flushCands();
          savedOffer=null;
          log('rtc_got_answer',{},'ok');
        }
      }else if(d.signal.candidate){
        var c=d.signal.candidate||{};
        var key=[c.sdpMid||'',c.sdpMLineIndex==null?'':c.sdpMLineIndex,String(c.candidate||'')].join('|');
        if(seenCand.has(key))return;seenCand.add(key);
        if(!pc||!pc.remoteDescription)pendingCandidates.push(c);
        else try{await pc.addIceCandidate(c)}catch(e){log('rtc_ice_err',{e:String(e)},'error')}
      }
    }catch(e){log('rtc_sig_err',{e:String(e)},'error')}
  }
  async function flushCands(){while(pendingCandidates.length){var c=pendingCandidates.shift();try{await pc.addIceCandidate(c)}catch(_){}}}

  function endPill(){
    var kindLabel=kind==='video'?'Video call':'Voice call';
    if(caller&&!accepted){UI.addSysPill('sp-'+uid(),kindLabel+' — no answer');return}
    var s=Math.floor((Date.now()-startTs)/1000);
    UI.addSysPill('sp-'+uid(),kindLabel+' ended · '+(s>=60?Math.floor(s/60)+' min':s+' sec'));
  }
  function teardown(){
    active=false;caller=false;endedAt=Date.now();
    SessionCore.endCall();
    clearTimeout(callerTimer);clearInterval(durTimer);callerTimer=durTimer=null;
    AudioEngine.stopAll();
    MicMeter.detach();
    if(pc){try{pc.close()}catch(_){}pc=null}
    if(stream){stream.getTracks().forEach(function(t){try{t.stop()}catch(_){}});stream=null} // genuinely releases the mic
    remoteStream=null;savedOffer=null;savedCandidates=[];pendingCandidates=[];seenCand=new Set();
    $('call-band').classList.remove('on');
    var scrRoom2=$('scr-room');if(scrRoom2)scrRoom2.classList.remove('st-phone','st-video');
    var t=$('rz-timer');if(t)t.textContent='';
    $('rb-mic').classList.add('off');$('rb-cam').classList.add('off');
    $('remote-video').srcObject=null;$('local-video').srcObject=null;
    if(chatMicWasOn)AudioEngine.startChatMic();else AudioEngine.forceChatMicFlag(false); // strip returns to exact pre-call mic state
    chatMicWasOn=false;
    if(PhrasebookSync.pair()&&PhrasebookSync.isDirty())PhrasebookSync.writeBack(); // PB write-back at call end
    log('call_end',{},'ok');
  }

  return{
    isActive:function(){return active},
    stream:function(){return stream},
    micOn:function(){return micOn},
    kind:function(){return kind},
    keys:function(){return Cred.effective(RoomStore.active())},
    resendOffer:function(){if(savedOffer){RelayClient.send(savedOffer);savedCandidates.forEach(function(cm){RelayClient.send(cm)});log('rtc_offer_resent',{},'ok')}},
    onSignal:onSignal,remoteMic:function(on){UI.setRemoteMic(!!on)},remoteCam:function(on){var el=$('remote-ph');if(el)el.style.display=on?'none':''},
    start:async function(wantKind){
      var room=RoomStore.active();if(!room||active||starting)return;
      starting=true;ensureNotifPerm();
      var ok=await acquire(wantKind);
      starting=false;if(!ok||active)return;
      kind=wantKind;caller=true;active=true;accepted=false;
      mount(room);
      RelayClient.send({type:'call-start',kind:wantKind,name:room.myName||AppUser.name()});
      RelayClient.send({type:'mic-state',micOn:micOn,transient:true});
      var t=$('rz-timer');if(t)t.textContent='Connecting…';
      callerTimer=setTimeout(function(){
        if(active&&!pc){UI.addSysPill('sp-'+uid(),'Missed '+(kind==='video'?'video':'voice')+' call');RelayClient.send({type:'call-end',reason:'missed'});teardown()}
      },30000);
      log('call_start',{kind:wantKind},'ok');
    },
    onIncoming:function(room,d){
      if(active||ringPending)return;
      if(room.muted)return;
      ringPending={roomId:room.id,kind:d.kind||'voice',name:d.name||room.partnerName||'Partner'};
      $('ring-name').textContent=ringPending.name;
      $('ring-sub').textContent=(d.kind==='video'?'Video call':'Voice call')+' · TalkBridge';
      $('ring-overlay').classList.add('show');
      RING.start();
      PushNotify.osNotify(ringPending.name+' · TalkBridge','Incoming call…',room.id); // Item 5 — locked/backgrounded ring notification
      ringTimer=setTimeout(function(){
        var wasKind=ringPending?ringPending.kind:'voice',wasRoom=ringPending?ringPending.roomId:room.id;
        CallEngine.stopRing();
        UI.bgAddPill(wasRoom,'Missed '+(wasKind==='video'?'video':'voice')+' call'); // never labelled "ended"
        ringPending=null;UI.renderIfActive(wasRoom);
        if(!room.muted)PushNotify.osNotify(room.partnerName||'TalkBridge','Missed '+(wasKind==='video'?'video':'voice')+' call',wasRoom);
      },30000);
      log('call_ring',{room:room.id},'ok');
    },
    ringingFor:function(roomId){return!!ringPending&&ringPending.roomId===roomId},
    ringKind:function(){return ringPending?ringPending.kind:'voice'},
    stopRing:function(){RING.stop();$('ring-overlay').classList.remove('show');clearTimeout(ringTimer);ringTimer=null},
    accept:async function(){
      var p=ringPending;if(!p)return;
      CallEngine.stopRing();ringPending=null;ensureNotifPerm();
      if(AppState.roomId!==p.roomId){UI.closePanel();UI.enterRoom(p.roomId)}
      var room=RoomStore.active();if(!room||starting)return;
      starting=true;var ok=await acquire(p.kind);starting=false;
      if(!ok||active)return;
      kind=p.kind;caller=false;active=true;
      mount(room);
      RelayClient.send({type:'call-accept'});
      RelayClient.send({type:'mic-state',micOn:micOn,transient:true});
      if(room.role==='creator')setupPC();
      log('call_accept',{},'ok');
    },
    decline:function(){
      var p=ringPending;if(!p)return;
      CallEngine.stopRing();ringPending=null;
      var m={type:'call-decline'};
      if(AppState.roomId===p.roomId)RelayClient.send(m);else LISTEN.send(p.roomId,m);
      UI.bgAddPill(p.roomId,(p.kind==='video'?'Video':'Voice')+' call declined');
      UI.renderIfActive(p.roomId);
    },
    onAccepted:function(room){
      clearTimeout(callerTimer);callerTimer=null;
      if(!active)return;
      accepted=true;
      if(room.role==='creator')setupPC();
    },
    onDeclined:function(){
      if(!active)return;
      clearTimeout(callerTimer);UI.addSysPill('sp-'+uid(),(kind==='video'?'Video':'Voice')+' call declined');teardown();
    },
    onRemoteEnd:function(room){
      if(ringPending&&ringPending.roomId===room.id){var mk=ringPending.kind==='video'?'video':'voice';CallEngine.stopRing();UI.bgAddPill(room.id,'Missed '+mk+' call');ringPending=null;UI.renderIfActive(room.id);return}
      if(!active)return;
      endPill();teardown();
    },
    toggleMic:function(){
      micOn=!micOn;
      (stream?stream.getAudioTracks():[]).forEach(function(t){t.enabled=micOn}); // genuinely releases the mic when off
      $('rb-mic').classList.toggle('off',!micOn);
      RelayClient.send({type:'mic-state',micOn:micOn,transient:true});
    },
    toggleCam:function(){
      if(!active||kind!=='video')return;
      camOn=!camOn;
      (stream?stream.getVideoTracks():[]).forEach(function(t){t.enabled=camOn});
      $('rb-cam').classList.toggle('off',!camOn);
      $('local-video').style.display=camOn?'':'none';
      RelayClient.send({type:'cam-state',camOn:camOn,transient:true});
    },
    hangUp:function(send){
      if(!active)return;
      if(send)RelayClient.send({type:'call-end'});
      endPill();teardown();
    }
  };
})();

/* ── invite link encode/decode ── */
function encInv(p){try{return btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(_){return''}}
function decInv(s){if(!s)return null;try{var b=s.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';return JSON.parse(decodeURIComponent(escape(atob(b))))}catch(_){return null}}
function invUrl(room){
  var k=Cred.keys();
  return location.href.split('?')[0].split('#')[0]+'#j='+encInv({r:room.id,ml:room.myLang,tl:room.theirLang,n:AppUser.name()||'',dg:k.dg,tid:k.tid,tok:k.tok});
}
function linkDeviceUrl(room,expiresAt){
  var k=Cred.keys();
  return location.href.split('?')[0].split('#')[0]+'#j='+encInv({r:room.id,ld:1,exp:expiresAt||null,role:room.role,ml:room.myLang,tl:room.theirLang,myn:room.myName||AppUser.name()||'',pn:room.partnerName||'',t:room.title||'',dg:k.dg,tid:k.tid,tok:k.tok});
}

/* ── appearance system (per-side preset/tone/color/font/size/width, §7) ── */
var THEME_PALETTES={
  light:[{id:'atomic-tangerine',hex:'#ff6b35'},{id:'peach-glow',hex:'#f7c59f'},{id:'beige',hex:'#efefd0'},{id:'steel-azure',hex:'#004e89'},{id:'baltic-blue',hex:'#1a659e'}],
  medium:[{id:'pacific-blue',hex:'#46b1c9'},{id:'frosted-blue',hex:'#84c0c6'},{id:'ash-grey',hex:'#9fb7b9'},{id:'ash-grey-2',hex:'#bcc1ba'},{id:'almond-cream',hex:'#f2e2d2'}],
  dark:[{id:'gunmetal',hex:'#474448'},{id:'shadow-grey',hex:'#2d232e'},{id:'bone',hex:'#e0ddcf'},{id:'taupe-grey',hex:'#534b52'},{id:'parchment',hex:'#f1f0ea'}]
};
function themePaletteColor(preset,id){var c=THEME_PALETTES[preset]||THEME_PALETTES.medium;var hit=c.find(function(x){return x.id===id});return hit?hit.hex:c[0].hex}
function hexLum(h){h=(h||'#888').replace('#','');var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;return 0.2126*r+0.7152*g+0.0722*b}
function themeVal(r,key,fallback){return(r.theme&&r.theme[key]!=null)?r.theme[key]:fallback}
function applyBubbleTheme(){
  var s=$('bubble-theme-tag');if(!s){s=document.createElement('style');s.id='bubble-theme-tag';document.head.appendChild(s)}
  var r=RoomStore.active();if(!r){s.textContent='';return}
  var preset=themeVal(r,'preset','medium');
  var meBg=themeVal(r,'meBg',themePaletteColor(preset,'pacific-blue'));
  var pnBg=themeVal(r,'pnBg',themePaletteColor(preset,'almond-cream'));
  var meFont=themeVal(r,'meFont','')||(hexLum(meBg)>0.45?'#1A1714':'#ffffff');
  var pnFont=themeVal(r,'pnFont','')||(hexLum(pnBg)>0.45?'#1A1714':'#ffffff');
  var meSize=themeVal(r,'meSize',15),pnSize=themeVal(r,'pnSize',15);
  var meWidth=themeVal(r,'meWidth',75),pnWidth=themeVal(r,'pnWidth',75);
  var hdrSize=themeVal(r,'hdrSize',11),hdrColor=themeVal(r,'hdrColor','#8a8378');
  s.textContent=
    '.tr-body{grid-template-columns:'+meWidth+'fr 1px '+pnWidth+'fr}'
    +'.tr-col[data-side="left"]{background:'+meBg+'}'
    +'.tr-col[data-side="left"] .tr-text{color:'+meFont+';font-size:'+meSize+'px}'
    +'.tr-col[data-side="right"]{background:'+pnBg+'}'
    +'.tr-col[data-side="right"] .tr-text{color:'+pnFont+';font-size:'+pnSize+'px}'
    +'.bubble-hdr{font-size:'+hdrSize+'px;color:'+hdrColor+'}';
}
function setTheme(patch){var r=RoomStore.active();if(!r)return;r.theme=r.theme||{};for(var k in patch)r.theme[k]=patch[k];RoomStore.save();applyBubbleTheme()}

/* ═ send pipeline ═ */
UI.sendChatText=async function(text,attachment,originOverride){
  var room=RoomStore.active();if(!room)return;
  var src=room.myLang,tgt=room.theirLang,srcText=text,failed=false;
  if(text){
    var detected=detectLang(text,src);
    if(detected&&detected!==src){
      var normed=await translateWithRetry(text,detected,src,2);
      if(normed.ok&&norm(normed.text).toLowerCase()!==norm(text).toLowerCase())srcText=norm(normed.text);
      else src=detected;
    }
    var tgtText=srcText;
    if(src!==tgt){
      var tr=await translateWithRetry(srcText,src,tgt,1);
      if(tr.ok)tgtText=norm(tr.text);else failed=true;
    }
  }else var tgtText='';
  var entry={id:'cm-'+uid(),kind:'chat',who:'me',sourceText:srcText,translatedText:tgtText,srcLang:src,tgtLang:tgt,
    ts:Date.now(),senderName:room.myName||AppUser.name(),origin:originOverride||'typed',
    receipt:'sent',translationFailed:failed,attachment:attachment||null};
  TranscriptStore.appendLocal(room.id,entry);
  room.lastAt=Date.now();RoomStore.save();UI.renderPanel();
  UI.appendMsgDom(entry);
  if(RelayClient.send(RelayClient.chatPayload(entry)))log('chat_sent',{},'ok');else log('chat_queued',{},'warn');
};
async function sendChat(attachment,originOverride){

/* ═ compose-strip phrase search — "/" or ".." trigger, "//" is an escape
   hatch handled as ordinary text, turn09-exact scoring/ordering, capped 30 ═ */
function composeIsSearchTrigger(v){
  if(v.slice(0,2)==='//')return false; // escape hatch — ordinary text
  return v.charAt(0)==='/'||v.slice(0,2)==='..';
}
function composeQuery(){
  var v=$('chat-input').value||'';
  return v.charAt(0)==='/'?v.slice(1):v.slice(0,2)==='..'?v.slice(2):v;
}
function enterSearch(){
  AppState.searchMode=true;
  $('search-drawer').classList.add('show');
  var r=RoomStore.active();
  $('sd-flags').textContent=gL(r.myLang).flag+' ↔ '+gL(r.theirLang).flag;
}
function exitSearch(){AppState.searchMode=false;$('search-drawer').classList.remove('show')}
function searchFilter(cards,q){
  var terms=norm(q).toLowerCase().split(' ').filter(Boolean);
  var inc=terms.filter(function(t){return t.charAt(0)!=='-'});
  var exc=terms.filter(function(t){return t.charAt(0)==='-'&&t.length>1}).map(function(t){return t.slice(1)});
  return cards.filter(function(c){
    var hay=(c.source+' '+c.target).toLowerCase();
    return inc.every(function(t){return hay.indexOf(t)>=0})&&!exc.some(function(t){return hay.indexOf(t)>=0});
  });
}
function pbScore(card,q){
  var s=(card.source||'').toLowerCase(),tg=(card.tags||[]).join(' ').toLowerCase();
  if(s===q)return 100;if(s.indexOf(q)===0)return 80;if(tg.indexOf(q)>=0)return 70;if(s.indexOf(q)>=0)return 50;return 30;
}
function renderSearch(q){
  var live=PhrasebookSync.live().slice();
  var qLow=norm(q).toLowerCase();
  var res=searchFilter(live,q);
  if(qLow)res.sort(function(a,b){return pbScore(b,qLow)-pbScore(a,qLow)});
  else res.sort(function(a,b){return(b.usage||0)-(a.usage||0)||(b.createdAt||0)-(a.createdAt||0)});
  res=res.slice(0,30);
  $('sd-count').textContent=res.length+' of '+live.length;
  var body=$('sd-body');
  body.innerHTML=res.map(function(c){
    return'<div class="sr-row" data-card="'+esc(c.id)+'">'
      +'<div class="sr-side src"><span class="txt">'+esc(c.source)+'</span><button data-tts="src">🔊</button><button data-use="src">➜</button></div>'
      +'<div class="divider"></div>'
      +'<div class="sr-side tgt"><span class="txt">'+esc(c.target)+'</span><button data-tts="tgt">🔊</button><button data-use="tgt">➜</button></div>'
      +'</div>';
  }).join('')||'<div style="text-align:center;color:var(--ink-dim);font-size:13px;padding:24px">No matching phrases</div>';
  body.querySelectorAll('.sr-row').forEach(function(row){
    var c=PhrasebookSync.byId(row.dataset.card);if(!c)return;
    row.querySelectorAll('[data-tts]').forEach(function(b){b.addEventListener('click',function(ev){ev.stopPropagation();speakText(b.dataset.tts==='src'?c.source:c.target,b.dataset.tts==='src'?c.sourceLang:c.targetLang)})});
    row.querySelectorAll('[data-use]').forEach(function(b){b.addEventListener('click',function(ev){ev.stopPropagation();sendPhrase(b.dataset.use==='src'?c.source:c.target,c)})});
    row.querySelectorAll('.txt').forEach(function(t,i){t.addEventListener('click',function(){useInCompose(i===0?c.source:c.target,c)})});
  });
}
function sendPhrase(text,card){
  exitSearch();
  var ta=$('chat-input');ta.value=text;composeInput();
  sendChat(null,'phrase');
  if(card){card.usage=(card.usage||0)+1;card.lastUsed=Date.now();PhrasebookSync.touch(card)}
}
function useInCompose(text,card){
  var ta=$('chat-input');exitSearch();ta.value=text;composeInput();ta.focus();
  if(card){card.usage=(card.usage||0)+1;card.lastUsed=Date.now();PhrasebookSync.touch(card)}
}
function composeInput(){
  var ta=$('chat-input');
  ta.style.height='';ta.style.height=Math.min(120,ta.scrollHeight)+'px';
  var v=ta.value;
  if(composeIsSearchTrigger(v)){
    if(!AppState.searchMode)enterSearch();
    renderSearch(composeQuery());
  }else if(AppState.searchMode)exitSearch();
  syncGoBtn();
}
function syncGoBtn(){
  var r=RoomStore.active();
  var go=$('btn-send');
  go.classList.toggle('hidden',!!r&&r.goBtn===false);
  go.disabled=!norm($('chat-input').value||'');
}

/* ═ phrasebook overlay ═ */
var TTS_SVG='🔊',USE_SVG='➜';
function pbCardEmpty(c){return!norm(c.source)&&!norm(c.target)}
function pbHdrText(c){
  var made=fmtDate(c.createdAt)+' by '+esc(c.createdBy||'?');
  var upd=c.updatedAt&&c.updatedAt!==c.createdAt?' · edited '+fmtDate(c.updatedAt)+' by '+esc(c.updatedBy||'?'):'';
  return made+upd+' · used '+(c.usage||0)+'×';
}
function cardCats(c){return(c.categories&&c.categories.length)?c.categories:['unassigned']}
function pbAllCategories(cards){
  var set={};cards.forEach(function(c){cardCats(c).forEach(function(cat){set[cat]=true})});
  return Object.keys(set).sort();
}
function pbFilterByActiveCats(cards){
  if(!pbActiveCats.length)return cards;
  return cards.filter(function(c){return cardCats(c).some(function(cat){return pbActiveCats.indexOf(cat)>=0})});
}
function pbTagRegistry(){
  var set={};PhrasebookSync.live().forEach(function(c){(c.tags||[]).forEach(function(t){set[t]=true})});
  return Object.keys(set).sort();
}
function pbBubbleHtml(c){
  var cs=pbCsMap[c.id]=pbCsMap[c.id]||{tagsOpen:false};
  function col(field,lang){
    return'<div class="pb-col"><textarea data-field="'+field+'" data-card="'+esc(c.id)+'">'+esc(c[field])+'</textarea>'
      +'<div style="display:flex;gap:6px;font-size:11px;color:var(--ink-dim)"><button data-usecard="'+field+'" data-id="'+esc(c.id)+'">'+USE_SVG+' Use</button><button data-ttscard="'+field+'" data-id="'+esc(c.id)+'">'+TTS_SVG+'</button></div></div>';
  }
  var verdictTag=c.backtranslate&&c.backtranslate.verdict==='good'?'<span class="chip">✓Verified</span>':'';
  var tags=(c.tags||[]).map(function(t){return'<span class="chip">'+esc(t)+' <a data-untag="'+esc(t)+'" data-id="'+esc(c.id)+'" style="cursor:pointer">×</a></span>'}).join('');
  return'<div class="pb-card" data-id="'+esc(c.id)+'">'
    +'<div class="pb-hdr">'+pbHdrText(c)+'</div>'
    +'<div class="pb-body">'+col('source',c.sourceLang)+'<div class="divider"></div>'+col('target',c.targetLang)+'</div>'
    +'<div class="pb-footer"><div>'+tags+verdictTag+'</div>'
      +'<div><button data-good="'+esc(c.id)+'">Sounds Good</button> <button data-flag="'+esc(c.id)+'">Flag</button> <button data-clarify="'+esc(c.id)+'">Clarify</button> <button data-trashcard="'+esc(c.id)+'">🗑</button></div></div>'
    +'</div>';
}
UI.renderPbList=function(){
  var live=PhrasebookSync.live();
  var q=pbOriginQuery;
  var filtered=q?searchFilter(live,q):live;
  filtered=pbFilterByActiveCats(filtered);
  var cats=pbAllCategories(live);
  $('pb-cats').innerHTML=cats.map(function(cat){
    var n=live.filter(function(c){return cardCats(c).indexOf(cat)>=0}).length;
    return'<span class="chip'+(pbActiveCats.indexOf(cat)>=0?' active':'')+'" data-cat="'+esc(cat)+'" style="cursor:pointer">'+esc(cat)+' ('+n+')</span>';
  }).join('');
  $('pb-cats').querySelectorAll('[data-cat]').forEach(function(el){
    el.addEventListener('click',function(){
      var cat=el.dataset.cat,i=pbActiveCats.indexOf(cat);
      if(i>=0)pbActiveCats.splice(i,1);else pbActiveCats.push(cat);
      UI.renderPbList();
    });
  });
  $('pb-list').innerHTML=filtered.map(pbBubbleHtml).join('')||'<div style="text-align:center;color:var(--ink-dim);padding:24px">No phrases</div>';
  wirePbCards();
  $('pb-footer-count').textContent=live.length+' phrases · '+(PhrasebookSync.lastPull()?('synced '+fmtAgo(PhrasebookSync.lastPull().at)+' ago'):'not yet synced');
};
function wirePbCards(){
  $('pb-list').querySelectorAll('.pb-card').forEach(function(node){
    var c=PhrasebookSync.byId(node.dataset.id);if(!c)return;
    node.querySelectorAll('textarea[data-field]').forEach(function(ta){
      ta.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'&&!ev.shiftKey){
          ev.preventDefault();
          pbCommitEdit(c.id,ta.dataset.field,ta.value);
        }
      });
    });
    node.querySelectorAll('[data-usecard]').forEach(function(b){b.addEventListener('click',function(){useInCompose(b.dataset.usecard==='source'?c.source:c.target,c);UI.closePb()})});
    node.querySelectorAll('[data-ttscard]').forEach(function(b){b.addEventListener('click',function(){speakText(b.dataset.ttscard==='source'?c.source:c.target,b.dataset.ttscard==='source'?c.sourceLang:c.targetLang)})});
    node.querySelectorAll('[data-untag]').forEach(function(b){b.addEventListener('click',function(){pbRemoveTag(c.id,b.dataset.untag)})});
    var g=node.querySelector('[data-good]');if(g)g.addEventListener('click',function(){pbSetVerdict(c.id,'good')});
    var f=node.querySelector('[data-flag]');if(f)f.addEventListener('click',function(){pbSetVerdict(c.id,'flagged')});
    var tr=node.querySelector('[data-trashcard]');if(tr)tr.addEventListener('click',function(){c.deletedAt=Date.now();PhrasebookSync.touch(c);UI.renderPbList()});
  });
}
async function pbCommitEdit(id,field,value){
  var c=PhrasebookSync.byId(id);if(!c)return;
  var changed=field==='source'&&norm(value)!==norm(c.source);
  c[field]=norm(value);
  var srcLang=c.sourceLang,tgtLang=c.targetLang;
  if(field==='source'){ // Enter always re-translates, changed or not (§9A.1.2)
    var tr=await translateWithRetry(c.source,srcLang,tgtLang,1);
    if(tr.ok)c.target=tr.text;
    if(changed){ // verdict resets ONLY if source actually changed (§9A.2/9A.3)
      c.backtranslate=c.backtranslate||{};c.backtranslate.verdict='';
      c.clarifyChain=c.clarifyChain||[];c.clarifyChain.push({text:'Verdict reset to pending (source changed)',author:AppUser.name()||'me',timestamp:Date.now()});
    }
  }
  var bt=await translateWithRetry(c.target,tgtLang,srcLang,1); // back-translation always re-runs (§9A.1.3)
  c.backtranslate=c.backtranslate||{};c.backtranslate.resultText=bt.ok?bt.text:c.backtranslate.resultText;
  PhrasebookSync.touch(c);
  UI.renderPbList();
  var ta=document.querySelector('.pb-card[data-id="'+CSS.escape(id)+'"] textarea[data-field="'+field+'"]');
  if(ta){ta.focus();var l=ta.value.length;ta.setSelectionRange(l,l)} // cursor stays put, caret at end (§9A.1.1)
}
function pbSetVerdict(id,v){
  var c=PhrasebookSync.byId(id);if(!c)return;
  c.backtranslate=c.backtranslate||{};c.backtranslate.verdict=v;
  c.clarifyChain=c.clarifyChain||[];c.clarifyChain.push({text:'Verdict set to '+v,author:AppUser.name()||'me',timestamp:Date.now()});
  PhrasebookSync.touch(c);UI.renderPbList();
}
function pbRemoveTag(id,tag){
  var c=PhrasebookSync.byId(id);if(!c)return;
  c.tags=(c.tags||[]).filter(function(t){return t!==tag});
  var wasGood=c.backtranslate&&c.backtranslate.verdict==='good';
  if(tag==='✓Verified'||wasGood){ // removing Verified resets verdict too — coupling runs both ways (§9A.6)
    c.backtranslate.verdict='';
    c.clarifyChain=c.clarifyChain||[];c.clarifyChain.push({text:'Verdict reset to pending (Verified tag removed, was good)',author:AppUser.name()||'me',timestamp:Date.now()});
  }
  PhrasebookSync.touch(c);UI.renderPbList();
}
function pbNewCard(){

  var existing=PhrasebookSync.newEmptyExists();
  var c=PhrasebookSync.newCard(room);
  pbOriginQuery=null; // clear active search so the new card is visible

  $('build-info').textContent=BUILD_INFO.release+' · built '+fmtDate(d.getTime())+' '+fmtTime(d.getTime());
  var k=Cred.keys();
  $('k-dg').value=k.dg;$('k-tid').value=k.tid;$('k-tok').value=k.tok;$('k-pat').value=k.pat;
  ['ks-dg','ks-tid','ks-tok','ks-pat'].forEach(function(id){setKeyStatus(id,'','')});
  if(k.dg){setKeyStatus('ks-dg','Verifying…','');verifyDgKeyLive(k.dg)}
  if(k.tid&&k.tok){setKeyStatus('ks-tid','Verifying…','');setKeyStatus('ks-tok','Verifying…','');verifyTurnLive(k.tid,k.tok)}
  if(k.pat){setKeyStatus('ks-pat','Verifying…','');verifyPatLive(k.pat)}
  $('m-keys').classList.add('show');
}

/* ═ room drawer — settings + appearance tabs ═ */
function openDrawer(){
  var r=RoomStore.active();if(!r)return;
  $('dr-name').value=r.title||'';
  $('dr-name').disabled=(r.role!=='creator');
  $('dr-myname').value=r.myName||AppUser.name();
  $('dr-ear').classList.toggle('on',r.ear!==false);
  $('dr-autoread').classList.toggle('on',!!r.autoRead);
  $('dr-mute').classList.toggle('on',!!r.muted);
  $('dr-go').classList.toggle('on',r.goBtn!==false);
  $('dr-hdrpos').value=r.bubbleHeader||'top';
  renderAppearanceValues();
  var invBox=$('dr-invite-qr');invBox.innerHTML='';var svg=QR.makeSvg(invUrl(r));if(svg)invBox.appendChild(svg);
  $('dr-invite-link').textContent=invUrl(r);
  var ldBox=$('dr-linkdevice-qr');ldBox.innerHTML='';
  $('drawer').classList.add('open');
}
function closeDrawer(){commitRoomName();$('drawer').classList.remove('open')}
function commitRoomName(){
  var r=RoomStore.active();if(!r||r.role!=='creator')return;
  var v=norm($('dr-name').value);if(v)r.title=v;RoomStore.save();UI.renderRoomHead();UI.renderPanel();
}
function renderAppearanceValues(){
  var r=RoomStore.active();if(!r)return;
  var preset=themeVal(r,'preset','medium');
  $('ap-preset').value=preset;
  $('ap-me-bg').value=themeVal(r,'meBg',themePaletteColor(preset,'pacific-blue'));
  $('ap-pn-bg').value=themeVal(r,'pnBg',themePaletteColor(preset,'almond-cream'));
  $('ap-me-size').value=themeVal(r,'meSize',15);$('ap-pn-size').value=themeVal(r,'pnSize',15);
  $('ap-me-width').value=themeVal(r,'meWidth',75);$('ap-pn-width').value=themeVal(r,'pnWidth',75);
}
function wireAppearance(){
  ['ap-preset'].forEach(function(id){$(id).addEventListener('change',function(){setTheme({preset:$(id).value});renderAppearanceValues()})});
  [['ap-me-bg','meBg'],['ap-pn-bg','pnBg'],['ap-me-size','meSize'],['ap-pn-size','pnSize'],['ap-me-width','meWidth'],['ap-pn-width','pnWidth']].forEach(function(pair){
    $(pair[0]).addEventListener('input',function(){var p={};p[pair[1]]=$(pair[0]).type==='range'||$(pair[0]).type==='number'?Number($(pair[0]).value):$(pair[0]).value;setTheme(p)});
  });
}
function exportTranscript(){
  var r=RoomStore.active();if(!r)return;
  var text=TranscriptStore.exportText(r.id,r);
  var blob=new Blob([text],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=UI.roomTitle(r)+'-transcript.txt';a.click();
}
function clearTranscript(){
  var r=RoomStore.active();if(!r)return;
  if(confirm('Export the transcript before clearing? (Recommended)'))exportTranscript();
  if(!confirm('Clear your copy of this transcript? The other person keeps theirs.'))return;
  TranscriptStore.clearDevice(r.id);UI.renderTranscript();
  toast('Transcript cleared on this device');
}

  $('rb-drawer').addEventListener('click',openDrawer);
  $('drawer-close').addEventListener('click',closeDrawer);
  document.querySelectorAll('.dtab').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.dtab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');
      document.querySelectorAll('.drawer-pane').forEach(function(p){p.classList.toggle('active',p.dataset.pane===b.dataset.tab)});
    });
  });
  $('dr-name').addEventListener('keydown',function(ev){if(ev.key==='Enter'){ev.preventDefault();commitRoomName();closeDrawer()}});
  $('dr-myname').addEventListener('change',function(){var r=RoomStore.active();if(r){r.myName=norm($('dr-myname').value)||AppUser.name();RoomStore.save();UI.renderRoomHead()}});
  [['dr-ear','ear'],['dr-autoread','autoRead'],['dr-mute','muted'],['dr-go','goBtn']].forEach(function(pair){
    $(pair[0]).addEventListener('click',function(){
      var r=RoomStore.active();if(!r)return;
      var el=$(pair[0]);el.classList.toggle('on');
      r[pair[1]]=el.classList.contains('on');RoomStore.save();
      if(pair[1]==='goBtn')syncGoBtn();
      if(pair[1]==='ear'){var rv=$('remote-video');if(rv)rv.muted=(r.ear===false)}
    });
  });
  $('dr-hdrpos').addEventListener('change',function(){var r=RoomStore.active();if(r){r.bubbleHeader=$('dr-hdrpos').value;RoomStore.save();UI.renderTranscript()}});
  $('dr-export').addEventListener('click',exportTranscript);
  $('dr-clear').addEventListener('click',clearTranscript);
  $('dr-linkdevice-btn').addEventListener('click',function(){
    var r=RoomStore.active();if(!r)return;
    var url=linkDeviceUrl(r);
    var box=$('dr-linkdevice-qr');box.innerHTML='';var svg=QR.makeSvg(url);if(svg)box.appendChild(svg);
    var linkEl=document.createElement('div');linkEl.className='inv-link';linkEl.style.cssText='font-size:11px;color:var(--ink-dim);word-break:break-all;text-align:center';linkEl.textContent=url;box.appendChild(linkEl);
    if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied')});
  });
  wireAppearance();

  $('btn-video').addEventListener('click',function(){if(!CallEngine.isActive())CallEngine.start('video')});
  $('btn-call').addEventListener('click',function(){if(!CallEngine.isActive())CallEngine.start('voice')});
  $('rb-mic').addEventListener('click',function(){CallEngine.toggleMic()});
  $('rb-cam').addEventListener('click',function(){CallEngine.toggleCam()});
  $('rb-hangup').addEventListener('click',function(){CallEngine.hangUp(true)});
  $('btn-chatmic').addEventListener('click',function(){if(AudioEngine.isChatMicOn())AudioEngine.stopChatMic();else AudioEngine.startChatMic()});
  $('ring-acc').addEventListener('click',function(){CallEngine.accept()});
  $('ring-dec').addEventListener('click',function(){CallEngine.decline()});

  $('chat-input').addEventListener('input',composeInput);
  $('chat-input').addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){if(AppState.searchMode){exitSearch();$('chat-input').value='';syncGoBtn()}return}
    if(ev.key==='Enter'&&!ev.shiftKey){
      ev.preventDefault();
      if(AppState.searchMode){exitSearch();var q=composeQuery();$('chat-input').value='';UI.openPb(q);return}
      sendChat();
    }
  });
  $('btn-send').addEventListener('click',function(){
    if(AppState.searchMode){var q=composeQuery();exitSearch();$('chat-input').value='';UI.openPb(q);return}
    sendChat();
  });
  $('btn-attach').addEventListener('click',function(){$('att-input').click()});
  $('att-input').addEventListener('change',function(){
    var f=$('att-input').files[0];$('att-input').value='';
    AttachmentIO.pick(f,function(att){sendChat(att)});
  });
  $('inv-copy').addEventListener('click',function(){var url=$('invite-card').dataset.url;if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied')})});
  $('inv-share').addEventListener('click',function(){var url=$('invite-card').dataset.url;if(navigator.share)navigator.share({url:url});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied')})});
  $('invite-card').querySelector('.inv-link').addEventListener('click',function(){var url=$('invite-card').dataset.url;if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied')})});

  $('pb-close').addEventListener('click',UI.closePb);
  $('pb-new').addEventListener('click',pbNewCard);
  $('pb-search').addEventListener('input',function(){pbOriginQuery=$('pb-search').value||null;UI.renderPbList()});

  $('cl-input').addEventListener('input',function(){
    clearTimeout(wire._clt);
    wire._clt=setTimeout(async function(){
      var room=RoomStore.active();if(!room)return;
      var tr=await translateWithRetry($('cl-input').value,room.myLang,room.theirLang,1);
      $('cl-bt').textContent=tr.ok?('→ '+tr.text):'';
    },400);
  });
  $('cl-cancel').addEventListener('click',function(){$('m-clarify').classList.remove('show')});
  $('cl-send').addEventListener('click',function(){
    var v=norm($('cl-input').value);if(!v)return;
    $('m-clarify').classList.remove('show');
    $('chat-input').value=v;composeInput();sendChat(null,'typed');
  });
  $('att-close').addEventListener('click',function(){$('m-att').classList.remove('show')});
}

function boot(){
  $('app').innerHTML=APP_HTML;
  wire();
  ensureNotifPerm();
  checkGrantExpiry();
  PersistenceGuard.retryAll('transcript',function(){}); // any pending writes from a prior crash are already in localStorage; nothing further to replay here
  if($('left-clock'))tickClock();
  setInterval(tickClock,30000);

  var h=location.hash||'';
  if(h.indexOf('#j=')===0){
    var p=decInv(h.slice(3));
    if(p&&p.r){
      if(!AppUser.hasName()&&!p.myn){ /* first-ever joiner: name prompt renders in the invite's own language (§4.2.A) */ }
      showJoinerLanding(p);
      log('boot',{mode:'joiner'},'ok');
      return;
    }
  }
  if(!AppUser.hasName())UI.showScreen('s0-name');
  else{UI.showScreen('s1');$('s1-myname').textContent=AppUser.name();UI.renderPanel()}
  LISTEN.sync();
  log('boot',{mode:'owner',rooms:RoomStore.all().length},'ok');
}
function tickClock(){var c=$('left-clock');if(c){var d=new Date();c.textContent=fmtDate(d.getTime())+' · '+fmtTime(d.getTime())}}

document.addEventListener('DOMContentLoaded',boot);
})(); /* closes the UI IIFE opened above UI.renderPartnerState */
</script>
</body>
</html>
