<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TalkBridge</title>
<style>
:root{--bg:#f4f2ee;--panel:#fff;--ink:#1a1714;--ink-dim:#8a8378;--line:#e4e0d8;--teal:#0e8a86;--teal-dim:#0e8a8622;--red:#c0392b;--blue:#2f6fed;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit}
.hidden{display:none!important}
#app{position:relative;width:100%;height:100%;overflow:hidden}

/* ═ start / room screens ═ */
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.show{display:flex}
.ribbon{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;min-height:52px}
.ribbon button.icon-btn{background:none;border:none;color:var(--ink);display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%}
.ribbon button.icon-btn:active{background:var(--teal-dim)}
.ribbon button.icon-btn.off{color:var(--red)}
.ribbon .names{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-weight:600}
.ribbon .names .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ribbon .names input{border:none;background:var(--teal-dim);border-radius:8px;padding:2px 6px;max-width:34vw}
.rz-left{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.rz-center{display:flex;align-items:center;flex-shrink:0;gap:8px}
.rz-right{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:16px}
.rz-slot.cam-slot{visibility:hidden}
.rz-slot.call-mic-slot{visibility:hidden}
#scr-room.st-video .rz-slot.cam-slot{visibility:visible}
#scr-room.st-phone .rz-slot.call-mic-slot,#scr-room.st-video .rz-slot.call-mic-slot{visibility:visible}
#scr-room.st-phone #btn-call,#scr-room.st-phone #btn-video,#scr-room.st-video #btn-call,#scr-room.st-video #btn-video{display:none}
#rb-hangup{display:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;border:none;cursor:pointer;line-height:0;align-items:center;justify-content:center;flex-shrink:0;transform:rotate(135deg)}
#scr-room.st-phone #rb-hangup,#scr-room.st-video #rb-hangup{display:flex}
.meter-btn{background:none;border:none;cursor:pointer;line-height:0;color:var(--ink-mid);padding:0;display:flex}
.meter-btn:not(.off) .cam-slash,.meter-btn:not(.off) .mic-slash{display:none}
.meter-btn.off .cam-slash,.meter-btn.off .mic-slash{display:block}
.mic-meter{width:24px;height:24px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;color:var(--ink)}
.mic-meter .lvl{position:absolute;inset:2px;border-radius:50%;background:var(--teal);transform:scale(0);transition:transform .06s}
.mic-meter svg{position:relative;z-index:1}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--ink-dim);background:
 radial-gradient(circle at 20% 20%,#0e8a860d,transparent 40%),
 radial-gradient(circle at 80% 70%,#c0392b0d,transparent 40%)}
.empty-state h2{color:var(--ink);margin:8px 0 4px}
.home-summary{padding:10px 14px;color:var(--ink-dim);font-size:13px;background:var(--panel);border-bottom:1px solid var(--line)}
.home-cards{flex:1;overflow-y:auto;padding:8px}

/* ═ room card (three row, two column) ═ */
.room-card{background:var(--panel);border-radius:var(--radius);padding:10px 12px;margin:6px 8px;box-shadow:0 1px 2px #0000000f;position:relative}
.room-card .rc-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room-card .rc-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.room-card .rc-del{background:none;border:none;color:var(--ink-dim);flex-shrink:0}
.room-card .rc-sub{color:var(--ink-dim);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.room-card .rc-time{color:var(--ink-dim);font-size:12px;flex-shrink:0}
.room-card .rc-badges{display:flex;gap:10px;align-items:center}
.room-card .badge{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-dim)}
.room-card .badge .n{background:var(--teal);color:#fff;border-radius:8px;min-width:16px;height:16px;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.room-card .rc-flags{font-size:13px;letter-spacing:1px}

/* ═ left panel ═ */
.left-panel{position:absolute;top:0;left:0;bottom:0;width:86vw;max-width:360px;background:var(--panel);transform:translateX(-100%);transition:transform .22s;z-index:40;display:flex;flex-direction:column;box-shadow:2px 0 12px #0000001a}
.left-panel.open{transform:translateX(0)}
.left-scrim{position:absolute;inset:0;background:#00000055;opacity:0;pointer-events:none;transition:opacity .22s;z-index:39}
.left-scrim.show{opacity:1;pointer-events:auto}
.left-top{padding:6px 10px 0}
.left-clock{font-size:13px;color:var(--ink-dim);user-select:none}
.app-info-row{padding:0 10px 8px;border-bottom:1px solid var(--line)}
.app-info-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.app-info-card:active{background:var(--teal-dim)}
.aic-ic{color:var(--teal)}
.aic-t{font-weight:700}
.aic-s{font-weight:400;font-size:12px;color:var(--ink-dim)}
.left-body{flex:1;overflow-y:auto}
.fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;box-shadow:0 4px 10px #0e8a8655}

/* ═ transcript ═ */
.transcript-wrap{flex:1;overflow-y:auto;padding:10px 8px 4px;position:relative}
.date-pill,.sys-pill{text-align:center;margin:10px auto;color:var(--ink-dim);font-size:12px}
.sys-pill span{background:#0000000a;border-radius:10px;padding:3px 10px}
.bubble{max-width:88%;margin:6px 0;display:flex;flex-direction:column}
.bubble.me{margin-left:auto;align-items:flex-end}
.bubble.partner{margin-right:auto;align-items:flex-start}
.tr-body{display:grid;grid-template-columns:1fr 1px 1fr;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px #0000000f}
.tr-col{padding:8px 10px;min-width:0}
.tr-col[data-side="left"]{background:var(--teal-dim)}
.tr-col[data-side="right"]{background:#efece4}
.tr-text{white-space:pre-wrap;word-break:break-word;font-size:15px}
.tr-text.warn{color:var(--red);font-style:italic}
.divider{background:var(--line)}
.meta-line{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-dim);margin-top:2px;padding:0 2px}
.receipts{display:flex;gap:1px}
.rc-dot{width:6px;height:6px;border-radius:50%;background:#333}
.rc-dot.read{width:8px;height:8px;background:var(--blue)}
.att-box{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px;background:#0000000a}
.att-box img,.att-box video{max-width:220px;max-height:220px;border-radius:8px;display:block;margin-top:4px}
.more-below{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--teal);color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center}

/* ═ compose ═ */
.compose{display:flex;align-items:flex-end;gap:8px;padding:8px;background:var(--panel);border-top:1px solid var(--line)}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:18px;padding:9px 14px;max-height:120px;background:var(--bg)}
.compose button.icon-btn{background:none;border:none;width:36px;height:36px;border-radius:50%;color:var(--ink-dim);flex-shrink:0}
.compose button.go{background:var(--teal);color:#fff;border:none;border-radius:50%;width:36px;height:36px;flex-shrink:0}
.compose button.go[disabled]{opacity:.35}

.search-drawer{position:absolute;left:0;right:0;bottom:0;top:30%;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px #00000022;display:none;flex-direction:column;z-index:20}
.search-drawer.show{display:flex}
.search-drawer .sd-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--ink-dim);font-size:13px}
.search-drawer .sd-body{flex:1;overflow-y:auto}
.sr-row{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);gap:6px}
.sr-side{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.sr-side .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-side button{background:none;border:none;color:var(--teal)}

/* ═ call band ═ */
.call-band{display:none;position:relative;background:#000;flex-shrink:0;height:0}
.call-band.on{display:block;height:38vh;min-height:220px}
.videos{position:absolute;inset:0}
.call-band .cb-video-wrap{position:relative;width:100%;height:0;padding-bottom:56%;background:#111}
#remote-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#local-video{position:absolute;width:26%;bottom:8px;right:8px;border-radius:10px;object-fit:cover;border:2px solid #fff3}
#remote-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff8;font-size:13px}
.cb-info{position:absolute;top:8px;left:8px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.cb-controls{position:absolute;bottom:8px;left:8px;display:flex;gap:8px}
.cb-controls button{width:38px;height:38px;border-radius:50%;border:none;background:#ffffff33;color:#fff;backdrop-filter:blur(4px)}
.cb-controls button.off{background:var(--red)}
.cb-controls button.end{background:var(--red)}
.caption-layer{position:absolute;left:0;right:0;bottom:44px;display:flex;flex-direction:column;gap:2px;padding:0 8px;pointer-events:none}
.caption-line{align-self:flex-start;background:#000000aa;color:#fff;border-radius:8px;padding:3px 8px;font-size:13px;max-width:80%;opacity:0;transition:opacity .3s}
.caption-line.mine{align-self:flex-end}
.caption-line.show{opacity:1}

/* ═ ring overlay ═ */
.ring-overlay{position:fixed;inset:0;background:#0b1c1bee;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:14px}
.ring-overlay.show{display:flex}
.ring-circle{width:110px;height:110px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #0e8a8688}70%{box-shadow:0 0 0 26px #0e8a8600}100%{box-shadow:0 0 0 0 #0e8a8600}}
.ring-btns{display:flex;gap:40px;margin-top:20px}
.ring-btns button{width:60px;height:60px;border-radius:50%;border:none;font-size:22px;color:#fff}
.ring-accept{background:#1f9d55}
.ring-decline{background:var(--red);transform:rotate(135deg)}

/* ═ drawer ═ */
.drawer{position:absolute;top:0;right:0;bottom:0;width:88vw;max-width:380px;background:var(--panel);transform:translateX(100%);transition:transform .22s;z-index:40;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.drawer-tabs{display:flex;border-bottom:1px solid var(--line)}
.drawer-tabs button{flex:1;padding:10px;background:none;border:none;color:var(--ink-dim);border-bottom:2px solid transparent}
.drawer-tabs button.active{color:var(--teal);border-color:var(--teal)}
.drawer-body{flex:1;overflow-y:auto;padding:12px}
.drawer-pane{display:none}
.drawer-pane.active{display:block}
.field-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field-label{font-size:14px}
.toggle{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;border:none}
.toggle.on{background:var(--teal)}
.toggle .kn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on .kn{left:20px}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
.qr-box svg{width:160px;height:160px;background:#fff;border-radius:8px}

/* ═ phrasebook ═ */
.pb-overlay{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:60}
.pb-overlay.show{display:flex}
.pb-list{flex:1;overflow-y:auto;padding:8px}
.pb-card{background:var(--panel);border-radius:var(--radius);margin:6px 0;padding:8px;box-shadow:0 1px 2px #0000000f}
.pb-hdr{font-size:11px;color:var(--ink-dim);padding:2px 4px}
.pb-body{display:grid;grid-template-columns:1fr 1px 1fr;gap:0;border-radius:10px;overflow:hidden}
.pb-col{padding:6px 8px}
.pb-col textarea{width:100%;border:none;background:none;resize:none;min-height:36px}
.pb-footer{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 0;font-size:12px;color:var(--ink-dim)}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--teal-dim);border-radius:10px;padding:2px 8px;font-size:11px;margin:2px 3px 2px 0}
.pb-cats{display:flex;flex-wrap:wrap;gap:6px;padding:6px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#4caf50}
.sync-dot.dirty{background:#e0a800}
.sync-dot.error{background:var(--red)}

/* ═ modals ═ */
.modal{position:fixed;inset:0;background:#00000055;display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.modal.show{display:flex}
.modal-card{background:var(--panel);border-radius:16px;padding:16px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto}
.modal-card h3{margin-top:0}
.modal-card label{display:block;font-size:12px;color:var(--ink-dim);margin:10px 0 4px}
.modal-card input[type=text],.modal-card input[type=password],.modal-card input[type=date],.modal-card select,.modal-card textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.btn{border:none;border-radius:20px;padding:9px 18px;background:var(--line);color:var(--ink)}
.btn.primary{background:var(--teal);color:#fff}
.keys-status{font-size:11px;margin-left:8px;color:var(--ink-dim)}
.keys-status.ok{color:#1f9d55}
.keys-status.bad{color:var(--red)}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ctx-menu{position:fixed;background:var(--panel);border-radius:10px;box-shadow:0 2px 10px #00000033;overflow:hidden;z-index:90;display:none}
.ctx-menu button{display:block;width:100%;text-align:left;padding:10px 16px;background:none;border:none;color:var(--ink)}
.ctx-menu button.danger{color:var(--red)}
.dg-fail-banner{position:absolute;top:52px;left:0;right:0;background:var(--red);color:#fff;text-align:center;padding:4px;font-size:12px;display:none;z-index:15}
.dg-fail-banner.show{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="ctx-menu" class="ctx-menu"></div>

<script>
/* ════════════ ITEM 4 — QR encoder, verbatim, no CDN, no dependency ════════════ */
var QR=(function(){
  function makeSvg(text){
    var m=encode(text);if(!m)return null;
    var n=m.length,cell=4,q=4,size=(n+q*2)*cell;
    var p='';
    for(var y=0;y<n;y++)for(var x=0;x<n;x++)if(m[y][x])p+='M'+((x+q)*cell)+' '+((y+q)*cell)+'h'+cell+'v'+cell+'h-'+cell+'z';
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 '+size+' '+size);
    s.innerHTML='<rect width="'+size+'" height="'+size+'" fill="#fff"/><path d="'+p+'" fill="#000"/>';
    return s;
  }
  var ECC_L=[7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30];
  var BLK_L=[1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25];
  function rawModules(v){var size=v*4+17,r=size*size;r-=8*8*3;r-=15*2+1;r-=(size-16)*2;if(v>=2){var na=Math.floor(v/7)+2;r-=(na-1)*(na-1)*25;r-=(na-2)*2*20;if(v>=7)r-=6*3*2}return r}
  function dataCapBytes(v){var total=Math.floor(rawModules(v)/8)-ECC_L[v-1]*BLK_L[v-1];var cnt=v<10?8:16;return Math.floor((total*8-4-cnt)/8)}
  function rsMul(a,b){var z=0;for(var i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((b>>>i)&1)*a}return z}
  function rsDiv(gen,data){var res=data.slice().concat(new Array(gen.length).fill(0));for(var i=0;i<data.length;i++){var f=res[i];if(f===0)continue;for(var j=0;j<gen.length;j++)res[i+1+j]^=rsMul(gen[j],f)}return res.slice(data.length)}
  function rsGen(deg){var g=[1],root=1;for(var i=0;i<deg;i++){var ng=new Array(g.length+1).fill(0);for(var j=0;j<g.length;j++){ng[j]^=rsMul(g[j],root);ng[j+1]^=g[j]}g=ng;root=rsMul(root,2)}return g.reverse().slice(1)}
  function alignPos(v){if(v===1)return[];var na=Math.floor(v/7)+2,size=v*4+17;var step=(v===32)?26:Math.ceil((v*4+4)/(na*2-2))*2;var res=[6];for(var pos=size-7;res.length<na;pos-=step)res.splice(1,0,pos);return res}
  function encode(text){
    try{
      var bytes=[];var enc=unescape(encodeURIComponent(text));
      for(var i=0;i<enc.length;i++)bytes.push(enc.charCodeAt(i));
      var v=1;while(v<=40&&dataCapBytes(v)<bytes.length)v++;
      if(v>40)return null;
      var size=v*4+17;
      var bits=[];
      function put(val,len){for(var i=len-1;i>=0;i--)bits.push((val>>>i)&1)}
      put(4,4);put(bytes.length,v<10?8:16);
      bytes.forEach(function(b){put(b,8)});
      var capBits=(Math.floor(rawModules(v)/8)-ECC_L[v-1]*BLK_L[v-1])*8;
      put(0,Math.min(4,capBits-bits.length));
      while(bits.length%8)bits.push(0);
      var pads=[0xEC,0x11],pi=0;
      while(bits.length<capBits){put(pads[pi%2],8);pi++}
      var data=[];for(var i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
      var nb=BLK_L[v-1],el=ECC_L[v-1],raw=Math.floor(rawModules(v)/8);
      var nShort=nb-raw%nb,shortLen=Math.floor(raw/nb);
      var gen=rsGen(el),blocks=[],k=0;
      for(var b2=0;b2<nb;b2++){var dl=shortLen-el+(b2<nShort?0:1);var d=data.slice(k,k+dl);k+=dl;var ecc=rsDiv(gen,d);if(b2<nShort)d.push(-1);blocks.push(d.concat(ecc))}
      var out=[];
      for(var i2=0;i2<blocks[0].length;i2++)for(var b3=0;b3<nb;b3++){var val=blocks[b3][i2];if(val!==-1)out.push(val)}
      var mod=[],fun=[];
      for(var y=0;y<size;y++){mod.push(new Array(size).fill(false));fun.push(new Array(size).fill(false))}
      function setF(x,y,v2){mod[y][x]=v2;fun[y][x]=true}
      function finder(cx,cy){for(var dy=-4;dy<=4;dy++)for(var dx=-4;dx<=4;dx++){var x=cx+dx,y2=cy+dy;if(x<0||x>=size||y2<0||y2>=size)continue;var dist=Math.max(Math.abs(dx),Math.abs(dy));setF(x,y2,dist!==2&&dist!==4)}}
      function align(cx,cy){for(var dy=-2;dy<=2;dy++)for(var dx=-2;dx<=2;dx++)setF(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}
      for(var i3=0;i3<size;i3++){setF(6,i3,i3%2===0);setF(i3,6,i3%2===0)}
      finder(3,3);finder(size-4,3);finder(3,size-4);
      var ap=alignPos(v);
      for(var ai=0;ai<ap.length;ai++)for(var aj=0;aj<ap.length;aj++){if((ai===0&&aj===0)||(ai===0&&aj===ap.length-1)||(ai===ap.length-1&&aj===0))continue;align(ap[ai],ap[aj])}
      var fmtData=(1<<3)|0;
      var rem=fmtData;
      for(var i4=0;i4<10;i4++)rem=(rem<<1)^((rem>>>9)*0x537);
      var fmt=((fmtData<<10)|rem)^0x5412;
      for(var i5=0;i5<=5;i5++)setF(8,i5,((fmt>>>i5)&1)!==0);
      setF(8,7,((fmt>>>6)&1)!==0);setF(8,8,((fmt>>>7)&1)!==0);setF(7,8,((fmt>>>8)&1)!==0);
      for(var i6=9;i6<15;i6++)setF(14-i6,8,((fmt>>>i6)&1)!==0);
      for(var i7=0;i7<8;i7++)setF(size-1-i7,8,((fmt>>>i7)&1)!==0);
      for(var i8=8;i8<15;i8++)setF(8,size-15+i8,((fmt>>>i8)&1)!==0);
      setF(8,size-8,true);
      if(v>=7){
        var rem2=v;
        for(var i9=0;i9<12;i9++)rem2=(rem2<<1)^((rem2>>>11)*0x1F25);
        var vb=(v<<12)|rem2;
        for(var i10=0;i10<18;i10++){var bit=((vb>>>i10)&1)!==0;var a=size-11+i10%3,b4=Math.floor(i10/3);setF(a,b4,bit);setF(b4,a,bit)}
      }
      var bi=0,total=out.length*8;
      for(var right=size-1;right>=1;right-=2){
        if(right===6)right=5;
        for(var vert=0;vert<size;vert++){
          for(var j2=0;j2<2;j2++){
            var x2=right-j2;
            var upward=((right+1)&2)===0;
            var y3=upward?size-1-vert:vert;
            if(fun[y3][x2])continue;
            var dark=false;
            if(bi<total)dark=((out[bi>>>3]>>>(7-(bi&7)))&1)!==0;
            bi++;
            if((x2+y3)%2===0)dark=!dark;
            mod[y3][x2]=dark;
          }
        }
      }
      return mod;
    }catch(e){return null}
  }
  return{makeSvg:makeSvg};
})();
</script>
<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   TalkBridge v2 — built per TalkBridge-Build-Specification.md Part Five
   (§19-21 module ownership map + sequenced build plan) and the literal
   /goal addendum (Items 1-11). Ten modules, one owner per concern (§20).
   ════════════════════════════════════════════════════════════════════ */

/* ── tiny utils ── */
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function norm(s){return(s||'').replace(/\s+/g,' ').trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function lsGet(k,f){try{var r=localStorage.getItem(k);return r==null?f:JSON.parse(r)}catch(_){return f}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){log('storage_write_fail',{k:k,e:String(e)},'error');return false}}
var debugLog=[];
function log(ev,d,lvl){debugLog.push({ts:new Date().toISOString(),ev:ev,d:d||{},lvl:lvl||'info'});if(debugLog.length>500)debugLog.shift();if(lvl==='error')console.error(ev,d)}
function toast(m,dur){var e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('show')},dur||2600)}

var LANG_ORDER=['en','th','zh','ko','ar','es','fr','de','ja','vi','hi','ru'];
var LANGS={
  en:{flag:'🇬🇧',name:'English',tts:'en-US'},th:{flag:'🇹🇭',name:'Thai',tts:'th-TH'},
  zh:{flag:'🇨🇳',name:'Chinese',tts:'zh-CN'},ko:{flag:'🇰🇷',name:'Korean',tts:'ko-KR'},
  ar:{flag:'🇸🇦',name:'Arabic',tts:'ar-SA'},es:{flag:'🇪🇸',name:'Spanish',tts:'es-ES'},
  fr:{flag:'🇫🇷',name:'French',tts:'fr-FR'},de:{flag:'🇩🇪',name:'German',tts:'de-DE'},
  ja:{flag:'🇯🇵',name:'Japanese',tts:'ja-JP'},vi:{flag:'🇻🇳',name:'Vietnamese',tts:'vi-VN'},
  hi:{flag:'🇮🇳',name:'Hindi',tts:'hi-IN'},ru:{flag:'🇷🇺',name:'Russian',tts:'ru-RU'}
};
var DG_LANGS={en:'en-US',th:'th',zh:'zh',ko:'ko',ar:'multi',es:'es',fr:'fr',de:'de',ja:'ja',vi:'vi',hi:'hi',ru:'ru'};
function gL(c){return LANGS[c]||{flag:'🏳',name:c,tts:c}}
function langToTtsCode(lang){return gL(lang).tts}

function fmtTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function fmtDate(ts){return new Date(ts).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}
function fmtAgo(ts){
  var s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';
}

/* ════════════════════════ MODULE: SessionCore (§20) ════════════════════════
   Issues and invalidates {roomId, sessionGeneration, callGeneration}. Every
   other module checks it before any async callback touches shared state.
   Implements the lifecycle contract in spec §18.1/§18.4: every async op
   captures room+generation at start; a late result is rejected if either
   has moved on. */
var SessionCore=(function(){
  var roomId=null,sessionGeneration=0,callGeneration=0;
  return{
    capture:function(){return{roomId:roomId,sessionGeneration:sessionGeneration,callGeneration:callGeneration}},
    currentRoomId:function(){return roomId},
    isCurrent:function(tok){return!!tok&&tok.roomId===roomId&&tok.sessionGeneration===sessionGeneration},
    isCurrentCall:function(tok){return!!tok&&tok.roomId===roomId&&tok.sessionGeneration===sessionGeneration&&tok.callGeneration===callGeneration},
    /* enter a (possibly different) room: bumps sessionGeneration so every
       async op captured under the old room/session is invalidated */
    enterRoom:function(id){roomId=id;sessionGeneration++;callGeneration=0;log('session_enter',{room:id,gen:sessionGeneration})},
    exitRoom:function(){log('session_exit',{room:roomId,gen:sessionGeneration});roomId=null;sessionGeneration++;callGeneration=0},
    newCall:function(){callGeneration++;return callGeneration},
    endCall:function(){callGeneration++}
  };
})();

/* ════════════════════════ MODULE: PersistenceGuard (§20) ════════════════════════
   Writes dirty state synchronously to durable local storage before any async
   network call; retried on next start/online event (P3, §18.4-10). */
var PersistenceGuard=(function(){
  var pending={};
  function key(ns,id){return 'tbpg_pending_'+ns+'_'+id}
  return{
    /* call BEFORE any async network op that depends on this data surviving */
    commit:function(ns,id,data){
      var ok=lsSet(key(ns,id),{data:data,at:Date.now()});
      if(!ok){toast('Storage is full or unavailable — change not saved');log('persist_fail',{ns:ns,id:id},'error')}
      return ok;
    },
    clear:function(ns,id){try{localStorage.removeItem(key(ns,id))}catch(_){}},
    /* re-run any pending commits left over from a prior session/crash */
    retryAll:function(ns,fn){
      var prefix='tbpg_pending_'+ns+'_';
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf(prefix)===0){
          var id=k.slice(prefix.length),v=lsGet(k,null);
          if(v)try{fn(id,v.data)}catch(e){log('persist_retry_err',{k:k,e:String(e)},'error')}
        }
      }
    }
  };
})();

/* ════════════════════════ MODULE: LifecycleBoundary (§20) ════════════════════════
   One idempotent teardown. Every exit path — room switch, hangup, chat-mic
   off, background/unload — calls it. Releases everything above (§18.4-5). */
var LifecycleBoundary=(function(){
  var torn=true; // starts torn-down (no room open yet)
  return{
    /* idempotent: safe to call twice (T14-14) */
    teardown:function(reason){
      if(torn){log('teardown_noop',{reason:reason});return}
      torn=true;
      log('teardown_start',{reason:reason});
      try{if(CallEngine&&CallEngine.isActive())CallEngine.hangUp(true)}catch(e){log('teardown_call_err',{e:String(e)},'error')}
      try{AudioEngine.stopChatMic(true)}catch(e){log('teardown_chatmic_err',{e:String(e)},'error')}
      try{AudioEngine.stopAll()}catch(e){log('teardown_dg_err',{e:String(e)},'error')}
      try{RelayClient.disconnectForeground()}catch(e){log('teardown_relay_err',{e:String(e)},'error')}
      try{ReceiptsCoordinator.flush()}catch(e){}
      try{if(PhrasebookSync.isDirty())PhrasebookSync.writeBack()}catch(e){log('teardown_pb_err',{e:String(e)},'error')}
      log('teardown_done',{reason:reason});
    },
    markLive:function(){torn=false}
  };
})();
window.addEventListener('beforeunload',function(){
  /* O: beforeunload cannot guarantee an async GH write completes — durable
     dirty state was already recorded synchronously by PersistenceGuard at
     time of edit, so there is nothing more to do here than a best-effort
     teardown log. */
  log('beforeunload',{});
});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ReceiptsCoordinator.onForegroundReturn();RelayClient.onForegroundReturn()}
});

/* ── credential store (§2.4, §2.1) ── */
var Cred={
  keys:function(){
    return{
      dg:(localStorage.getItem('tb_dg_key')||'').trim(),
      tid:(localStorage.getItem('tb_cf_tid')||'').trim(),
      tok:(localStorage.getItem('tb_cf_tok')||'').trim(),
      pat:(localStorage.getItem('tb_gh_pat')||'').trim()
    };
  },
  /* joiner keys carried in an invite link are NOT written to the device
     credential store (§2.4) — they live only on the active room object */
  effective:function(room){
    var stored=this.keys();
    var jk=(room&&room._joinerKeys)||null;
    return{
      dg:(jk&&jk.dg)||stored.dg,
      tid:(jk&&jk.tid)||stored.tid,
      tok:(jk&&jk.tok)||stored.tok,
      pat:stored.pat /* PAT is never carried in an invite — phrasebook sync is initiator-only by design */
    };
  },
  hasStored:function(){var k=this.keys();return!!(k.dg||k.tid||k.pat)},
  remove:function(){['tb_dg_key','tb_cf_tid','tb_cf_tok','tb_gh_pat'].forEach(function(k){localStorage.removeItem(k)})}
};

/* ════════════════════════ MODULE: TranscriptStore (§20) ════════════════════════
   Durable per-room message log. Patches a translation result only into its
   originating row. Owns history merge/dedupe/sort. Every appendLocal and
   receiveRemote writes through PersistenceGuard to durable storage (Item 7). */
var TranscriptStore=(function(){
  function trKey(roomId){return'tba_tr_'+roomId}
  var cache={},activeRoomId=null,activeArr=[];
  function loadFor(roomId){
    if(!cache[roomId])cache[roomId]=lsGet(trKey(roomId),[]);
    return cache[roomId];
  }
  function saveFor(roomId,arr){
    cache[roomId]=arr;
    PersistenceGuard.commit('transcript',roomId,arr);
    lsSet(trKey(roomId),arr); /* the durable copy itself — PersistenceGuard tracks retry-on-failure */
  }
  return{
    setActive:function(roomId){activeRoomId=roomId;activeArr=loadFor(roomId);return activeArr},
    all:function(roomId){return roomId===activeRoomId?activeArr:loadFor(roomId)},
    /* one spoken utterance = one durable row created BEFORE translation (§18.4-7) */
    appendLocal:function(roomId,entry){
      var arr=(roomId===activeRoomId)?activeArr:loadFor(roomId);
      arr.push(entry);saveFor(roomId,arr);
      return entry;
    },
    /* patch a translation result into its ORIGINATING row only — never the
       currently-visible transcript if the room has since changed (§18.3-E) */
    patch:function(roomId,entryId,patch){
      var arr=loadFor(roomId);
      var e=arr.find(function(x){return x.id===entryId});
      if(!e)return null;
      for(var k in patch)e[k]=patch[k];
      saveFor(roomId,arr);
      return e;
    },
    find:function(roomId,entryId){return loadFor(roomId).find(function(x){return x.id===entryId})},
    receiveRemote:function(roomId,entry){
      var arr=(roomId===activeRoomId)?activeArr:loadFor(roomId);
      arr.push(entry);saveFor(roomId,arr);
      return entry;
    },
    /* history-sync merge: dedupe by stable id, flip perspective exactly
       once, sort deterministically, never merge into whichever room is
       merely "current" — always the room the chunk names (§18.4-M) */
    mergeHistory:function(roomId,chunk){
      var arr=loadFor(roomId);
      var byId={};arr.forEach(function(m){if(m&&m.id)byId[m.id]=true});
      var changed=false;
      (chunk||[]).forEach(function(raw){
        if(!raw||!raw.id||byId[raw.id])return;
        var who=raw.who==='me'?'partner':(raw.who==='partner'?'me':raw.who);
        arr.push({id:raw.id,kind:raw.kind||'chat',who:who,sourceText:raw.sourceText||'',
          translatedText:raw.translatedText||raw.sourceText||'',srcLang:raw.srcLang,tgtLang:raw.tgtLang,
          ts:raw.ts||Date.now(),senderName:raw.senderName||'',origin:raw.origin||'typed',
          attachment:raw.attachment||null,receipt:'delivered'});
        byId[raw.id]=true;changed=true;
      });
      if(!changed)return false;
      arr.sort(function(a,b){return(a.ts||0)-(b.ts||0)});
      saveFor(roomId,arr);
      if(roomId===activeRoomId)activeArr=arr;
      log('history_sync_merged',{room:roomId,n:(chunk||[]).length},'ok');
      return true;
    },
    clearDevice:function(roomId){saveFor(roomId,[]);if(roomId===activeRoomId)activeArr=[]},
    exportText:function(roomId,room){
      var arr=loadFor(roomId);
      return arr.map(function(e){
        if(e.kind==='sys')return'['+fmtTime(e.ts)+'] * '+e.text;
        var who=e.who==='me'?(room.myName||'Me'):(room.partnerName||'Partner');
        return'['+fmtTime(e.ts)+'] '+who+': '+e.sourceText+(e.translatedText&&e.translatedText!==e.sourceText?' | '+e.translatedText:'');
      }).join('\n');
    }
  };
})();

/* ════════════════════════ MODULE: RelayClient (§20) ════════════════════════
   Foreground socket + per-room background LISTEN sockets, keyed by room id.
   ITEM 1 wire contract reproduced exactly: relayConnect/relaySend/heartbeat.
   Full message-type table wired into handleRelay. */
var RELAY_WS='wss://talk-signal.myacctfortracking.workers.dev/signal';
var RELAY_APP='talk-say-v1';
var HEARTBEAT_MS=20000;
var deviceId=(function(){var k='tba_device_id';var v=localStorage.getItem(k);if(!v){v=uid();localStorage.setItem(k,v)}return v})();
var seq=0;

var RelayClient=(function(){
  var ws=null,hbTimer=null,reconnectTimer=null,reconnecting=false,stillInThisRoom=false;

  /* ITEM 1 — exact reproduction of relayConnect() */
  function relayConnect(){
    var room=RoomStore.active();if(!room)return;
    stillInThisRoom=true;
    if(ws)try{ws.close()}catch(_){}
    ws=new WebSocket(RELAY_WS+'?app='+encodeURIComponent(RELAY_APP)+'&session='+encodeURIComponent(room.id)+'&client='+encodeURIComponent(deviceId));
    var mySocket=ws;
    ws.onopen=function(){
      if(ws!==mySocket)return;
      log('relay_open',{room:room.id},'ok');
      relaySend({type:'hello',lang:room.myLang,targetLang:room.theirLang,role:room.role,name:room.myName||AppUser.name()});
      startHB();
      resendUndelivered();
      reconnecting=false;UI.renderPartnerState();
    };
    ws.onmessage=function(e){if(ws!==mySocket)return;try{handleRelay(JSON.parse(e.data))}catch(_){}};
    ws.onclose=function(ev){
      if(ws!==mySocket)return; // stale socket's close must never tear down a newer session
      log('relay_close',{code:ev.code},'warn');stopHB();clearTimeout(reconnectTimer);
      RoomStore.setPresence(false);
      if(stillInThisRoom){ // reconnect only if still viewing this room
        reconnecting=true;UI.renderPartnerState();
        reconnectTimer=setTimeout(relayConnect,2000);
      }
    };
    ws.onerror=function(){if(ws===mySocket)log('relay_err',{},'error')};
  }
  function relaySend(m){
    if(!ws||ws.readyState!==1)return false;
    var room=RoomStore.active();
    m.session=room?room.id:null;m.from=deviceId;m.ts=m.ts||Date.now();m.seq=++seq;
    try{ws.send(JSON.stringify(m));return true}catch(_){return false}
  }
  function startHB(){stopHB();hbTimer=setInterval(function(){relaySend({type:'ping',transient:true})},HEARTBEAT_MS)}
  function stopHB(){if(hbTimer){clearInterval(hbTimer);hbTimer=null}}
  function resendUndelivered(){
    var room=RoomStore.active();if(!room)return;
    var n=0;
    TranscriptStore.all(room.id).forEach(function(e){
      if(e.who==='me'&&e.kind==='chat'&&e.receipt==='sent'){relaySend(chatPayload(e));n++}
    });
    if(n)log('chat_resend',{n:n});
  }
  function chatPayload(e){
    return{type:'chat-msg',chatId:e.id,srcText:e.sourceText,tgtText:e.translatedText,srcLang:e.srcLang,tgtLang:e.tgtLang,senderName:e.senderName,origin:e.origin||'typed',attachment:e.attachment||null,ts:e.ts};
  }
  var HISTORY_SYNC_MAX=1500,HISTORY_SYNC_CHUNK=80,_lastHistorySentAt={};
  function sanitizeHistoryEntry(e){
    if(e.kind==='sys')return null;
    return{id:e.id,kind:e.kind,who:e.who,sourceText:e.sourceText,translatedText:e.translatedText,srcLang:e.srcLang,tgtLang:e.tgtLang,ts:e.ts,senderName:e.senderName,origin:e.origin||'typed',attachment:e.attachment||null};
  }
  /* history-sync — this is what makes TranscriptStore.mergeHistory actually
     get called: wired to fire on hello/hello-ack (Item 1's table) */
  function sendHistorySync(room){
    if(!room)return;
    var now=Date.now();
    if(_lastHistorySentAt[room.id]&&(now-_lastHistorySentAt[room.id])<10000)return;
    var msgs=TranscriptStore.all(room.id).slice(-HISTORY_SYNC_MAX).map(sanitizeHistoryEntry).filter(Boolean);
    if(!msgs.length)return;
    for(var i=0;i<msgs.length;i+=HISTORY_SYNC_CHUNK){
      relaySend({type:'history-sync',transient:true,chunk:msgs.slice(i,i+HISTORY_SYNC_CHUNK),done:(i+HISTORY_SYNC_CHUNK)>=msgs.length});
    }
    _lastHistorySentAt[room.id]=now;
    log('history_sync_sent',{n:msgs.length},'ok');
  }
  var _chatReceived=new Set();
  function handleChatMsg(d,room){
    if(!d)return;
    if(d.chatId){
      if(_chatReceived.has(d.chatId)||TranscriptStore.find(room.id,d.chatId)){relaySend({type:'chat-ack',chatId:d.chatId,transient:true});return}
      _chatReceived.add(d.chatId);
      relaySend({type:'chat-ack',chatId:d.chatId,transient:true});
    }
    if(d.senderName&&d.senderName!==room.partnerName){room.partnerName=d.senderName;RoomStore.save();UI.renderRoomHead();UI.renderPanel()}
    var entry={id:d.chatId||('ci-'+uid()),kind:'chat',who:'partner',
      sourceText:norm(d.srcText||''),translatedText:norm(d.tgtText||d.srcText||''),
      srcLang:d.srcLang||room.theirLang,tgtLang:d.tgtLang||room.myLang,
      ts:d.ts||Date.now(),senderName:d.senderName||room.partnerName||'Partner',
      origin:d.origin||'typed',attachment:d.attachment||null};
    TranscriptStore.receiveRemote(room.id,entry);
    room.lastAt=Date.now();room.chatWaiting=(room.chatWaiting||0)+(document.hidden||AppState.view!=='room'||AppState.roomId!==room.id?1:0);
    RoomStore.save();
    UI.appendMsgDom(entry);UI.renderPanel();
    if(document.hidden||AppState.view!=='room'||AppState.roomId!==room.id){
      room.unread=(room.unread||0)+1;RoomStore.save();UI.renderPanel();
      if(!room.muted)PushNotify.osNotify(entry.senderName||'New message',entry.translatedText||entry.sourceText||'',room.id);
    }else{ReceiptsCoordinator.onRoomEntry(room.id)}
    if(room.autoRead&&entry.translatedText)speakText(entry.translatedText,entry.tgtLang);
  }
  function handleRelay(d){
    if(!d||d.from===deviceId)return;
    var room=RoomStore.active();if(!room)return;
    RoomStore.touchPresence();
    if(d.type==='hello'){
      if(d.name&&d.name!==room.partnerName){room.partnerName=d.name;RoomStore.save();UI.renderRoomHead();UI.renderPanel()}
      if(!room.joined){room.joined=true;RoomStore.save();UI.addSysPill('sp-join-'+room.id+'-'+Date.now(),(room.partnerName||'Partner')+' joined');UI.renderInviteCard()}
      relaySend({type:'hello-ack',transient:true,name:room.myName||AppUser.name()});
      resendUndelivered();
      sendHistorySync(room);
      if(CallEngine.isActive()&&room.role==='creator')CallEngine.resendOffer();
      return;
    }
    if(d.type==='hello-ack'){
      if(d.name&&d.name!==room.partnerName){room.partnerName=d.name;RoomStore.save();UI.renderRoomHead();UI.renderPanel()}
      if(!room.joined){room.joined=true;RoomStore.save();UI.renderInviteCard()}
      sendHistorySync(room);
      return;
    }
    if(d.type==='ping'){relaySend({type:'pong',transient:true});return}
    if(d.type==='pong')return;
    if(d.type==='chat-ack'){
      var e=TranscriptStore.find(room.id,d.chatId);
      if(e&&e.receipt==='sent'){TranscriptStore.patch(room.id,e.id,{receipt:'delivered',deliveredAt:Date.now()});UI.updateReceiptDom(e.id)}
      return;
    }
    if(d.type==='chat-read'){
      (d.ids||[]).forEach(function(id){
        var e2=TranscriptStore.find(room.id,id);
        if(e2&&e2.receipt!=='read'){TranscriptStore.patch(room.id,id,{receipt:'read',readAt:Date.now()});UI.updateReceiptDom(id)}
      });
      return;
    }
    if(d.type==='call-start'){CallEngine.onIncoming(room,d);return}
    if(d.type==='call-accept'){CallEngine.onAccepted(room,d);return}
    if(d.type==='call-decline'){CallEngine.onDeclined(room,d);return}
    if(d.type==='call-end'){CallEngine.onRemoteEnd(room,d);return}
    if(d.type==='webrtc-signal'){CallEngine.onSignal(d);return}
    if(d.type==='mic-state'){CallEngine.remoteMic(d.micOn!==false);return}
    if(d.type==='cam-state'){CallEngine.remoteCam(d.camOn!==false);return}
    if(d.type==='chat-msg'){handleChatMsg(d,room);return}
    if(d.type==='history-sync'){
      if(TranscriptStore.mergeHistory(room.id,d.chunk)&&AppState.roomId===room.id)UI.renderTranscript();
      return;
    }
    if(d.type==='sys-pill'){
      if(d.newName){room.partnerName=d.newName;RoomStore.save();UI.renderRoomHead();UI.renderPanel()}
      UI.addSysPill(d.pillId,d.text||'');
      return;
    }
  }
  return{
    connect:relayConnect,
    send:relaySend,
    chatPayload:chatPayload,
    sendHistorySync:sendHistorySync,
    disconnectForeground:function(){
      stillInThisRoom=false;
      stopHB();clearTimeout(reconnectTimer);reconnectTimer=null;
      if(ws){var w=ws;ws=null;try{w.close()}catch(_){}}
      RoomStore.setPresence(false);reconnecting=false;
    },
    isReconnecting:function(){return reconnecting},
    onForegroundReturn:function(){
      /* foreground return proactively reconnects a missing relay instead of
         waiting for a browser-delayed close event (§18.2) */
      if(AppState.view==='room'&&AppState.roomId&&(!ws||ws.readyState>1))relayConnect();
    }
  };
})();

/* per-room background LISTEN sockets — RelayClient's other half. Keyed by
   room id; routes messages into that room's stored transcript so a room
   not currently open still receives calls/messages/badges (§20 RelayClient). */
var LISTEN=(function(){
  var socks={};
  function bgAddPill(roomId,text){
    TranscriptStore.receiveRemote(roomId,{id:'sp-'+uid(),kind:'sys',text:text,ts:Date.now()});
  }
  function open(room){
    var ws=new WebSocket(RELAY_WS+'?app='+encodeURIComponent(RELAY_APP)+'&session='+encodeURIComponent(room.id)+'&client='+encodeURIComponent(deviceId));
    socks[room.id]=ws;
    var mySocket=ws;
    ws.onopen=function(){if(ws!==mySocket)return;send(room.id,{type:'hello',lang:room.myLang,targetLang:room.theirLang,role:room.role,name:room.myName||AppUser.name()});log('listen_open',{room:room.id})};
    ws.onmessage=function(e){if(ws!==mySocket)return;try{handle(room.id,JSON.parse(e.data))}catch(_){}};
    ws.onclose=function(){
      if(ws!==mySocket)return;
      if(socks[room.id]===ws){
        delete socks[room.id];
        setTimeout(function(){var r=RoomStore.byId(room.id);if(!socks[room.id]&&room.id!==AppState.roomId&&r&&!r.deletedAt)open(r)},15000);
      }
    };
    ws.onerror=function(){};
  }
  function send(roomId,m){
    var ws=socks[roomId];
    if(!ws||ws.readyState!==1)return false;
    m.session=roomId;m.from=deviceId;m.ts=m.ts||Date.now();m.seq=++seq;
    try{ws.send(JSON.stringify(m));return true}catch(_){return false}
  }
  function handle(roomId,d){
    if(!d||d.from===deviceId)return;
    var room=RoomStore.byId(roomId);if(!room)return;
    if(d.type==='ping'){send(roomId,{type:'pong',transient:true});return}
    if(d.type==='hello'){
      if(d.name&&d.name!==room.partnerName){room.partnerName=d.name;RoomStore.save();UI.renderPanel()}
      if(!room.joined){room.joined=true;RoomStore.save()}
      send(roomId,{type:'hello-ack',transient:true,name:room.myName||AppUser.name()});
      return;
    }
    if(d.type==='chat-msg'){
      if(!d.chatId)return;
      if(TranscriptStore.find(roomId,d.chatId)){send(roomId,{type:'chat-ack',chatId:d.chatId,transient:true});return}
      send(roomId,{type:'chat-ack',chatId:d.chatId,transient:true});
      if(d.senderName&&d.senderName!==room.partnerName)room.partnerName=d.senderName;
      TranscriptStore.receiveRemote(roomId,{id:d.chatId,kind:'chat',who:'partner',sourceText:norm(d.srcText||''),translatedText:norm(d.tgtText||d.srcText||''),
        srcLang:d.srcLang||room.theirLang,tgtLang:d.tgtLang||room.myLang,ts:d.ts||Date.now(),
        senderName:d.senderName||room.partnerName||'Partner',origin:d.origin||'typed',attachment:d.attachment||null});
      room.unread=(room.unread||0)+1;room.lastAt=Date.now();RoomStore.save();UI.renderPanel();
      if(!room.muted)PushNotify.osNotify((d.senderName||room.partnerName||'New message')+' · TalkBridge',norm(d.tgtText||d.srcText||''),roomId);
      return;
    }
    if(d.type==='sys-pill'){
      if(d.newName){room.partnerName=d.newName;RoomStore.save();UI.renderPanel()}
      bgAddPill(roomId,d.text||'');return;
    }
    if(d.type==='call-start'){CallEngine.onIncoming(room,d);return}
    if(d.type==='call-end'){
      if(CallEngine.ringingFor(roomId)){var mk=CallEngine.ringKind();CallEngine.stopRing();bgAddPill(roomId,'Missed '+mk+' call');room.unread=(room.unread||0)+1;RoomStore.save();UI.renderPanel();if(!room.muted)PushNotify.osNotify(d.name||room.partnerName||'TalkBridge','Missed '+mk+' call',roomId)}
      return;
    }
  }
  return{
    send:send,
    sync:function(){
      var want={};
      RoomStore.all().filter(function(r){return!r.deletedAt&&r.id!==AppState.roomId}).forEach(function(r){want[r.id]=r});
      Object.keys(socks).forEach(function(id){if(!want[id]){var ws=socks[id];delete socks[id];try{ws.close()}catch(_){}}});
      Object.keys(want).forEach(function(id){var ws=socks[id];if(!ws||ws.readyState>1)open(want[id])});
    }
  };
})();

/* ════════════════════════ MODULE: PhrasebookSync (§20) ════════════════════════
   Local cache, dirty flag, remote SHA/version check, write-back queue. Every
   operation captures immutable pair identity (§18.3-F). Stable unversioned
   filename per pair; version is a field inside the JSON, never a new
   filename (spec §11 "File identity and version"). Coexists with the other
   application per BRIDGE-PB-COMPAT-v1.md: shared repo/dir, REPLACE-on-load,
   GH is source of truth, categories[] default ['unassigned']. */
var PB_REPO={owner:'acmeproducts',name:'stuff',dir:'phrasebook'};
function pairKeyOf(room){return room.myLang+'-'+room.theirLang} // directional — EN-TH and TH-EN are separate books
function pbCacheKey(pk){return'tba_pb_'+pk}
function pbDirtyKey(pk){return'tba_pb_dirty_'+pk}
var PhrasebookSync=(function(){
  var cards=[],pk=null,version=null,lastPull=null;
  function ghHeaders(){
    var pat=Cred.keys().pat;
    var h={'Accept':'application/vnd.github.v3+json'};
    if(pat)h['Authorization']='token '+pat;
    return h;
  }
  function load(pair){
    pk=pair;
    var c=lsGet(pbCacheKey(pair),{cards:[],version:null});
    cards=c.cards||[];version=c.version||null;
  }
  function persist(){if(pk)lsSet(pbCacheKey(pk),{cards:cards,version:version})}
  function markDirty(){if(pk){localStorage.setItem(pbDirtyKey(pk),'1');UI.pbSyncDot('dirty')}}
  function clearDirty(){if(pk)localStorage.removeItem(pbDirtyKey(pk))}
  function isDirtyPair(pair){return localStorage.getItem(pbDirtyKey(pair))==='1'}
  var retryArmed=false;
  return{
    load:load,
    pair:function(){return pk},
    live:function(){return cards.filter(function(c){return!c.deletedAt})},
    trash:function(){return cards.filter(function(c){return c.deletedAt})},
    byId:function(id){return cards.find(function(c){return c.id===id})},
    isDirty:function(){return isDirtyPair(pk)},
    markDirty:markDirty,
    save:persist,
    version:function(){return version},
    lastPull:function(){return lastPull},
    /* cache-first: room entry loads local cache immediately, never a blind
       download; a lightweight metadata check runs separately (pull()) */
    cacheOnly:function(pair){load(pair);return cards},
    pull:function(){
      var capturedPk=pk; /* immutable pair identity captured now (§18.3-F) */
      if(!capturedPk)return Promise.resolve({status:'no-pair'});
      var pat=Cred.keys().pat;
      if(!pat){log('pb_pull_no_pat',{});return Promise.resolve({status:'no-pat'})}
      var prefix='phrasebook-'+capturedPk+'-';
      var url='https://api.github.com/repos/'+PB_REPO.owner+'/'+PB_REPO.name+'/contents/'+PB_REPO.dir+'/?ref=main';
      return fetch(url,{headers:ghHeaders()}).then(function(r){
        if(!r.ok)throw new Error('list HTTP '+r.status);return r.json();
      }).then(function(files){
        var best=null,bestVer=-1;
        (files||[]).forEach(function(f){
          if(f.name.indexOf(prefix)===0&&f.name.slice(-5)==='.json'){
            var v=parseInt(f.name.replace(prefix,'').replace('.json',''),10);
            if(v>=1000&&v>bestVer){bestVer=v;best=f}
          }
        });
        if(pk!==capturedPk)return{status:'stale-pair'}; /* pair changed while we were listing */
        if(!best){lastPull={status:'no-pair-file',at:Date.now()};UI.renderPbStatus();return{status:'no-pair-file'}}
        if(version===bestVer){ /* staleness check — already current, skip fetch+parse+replace */
          lastPull={status:'ok',unchanged:true,n:cards.length,at:Date.now()};UI.renderPbStatus();
          return{status:'ok',unchanged:true};
        }
        var fileUrl='https://api.github.com/repos/'+PB_REPO.owner+'/'+PB_REPO.name+'/contents/'+PB_REPO.dir+'/'+encodeURIComponent(best.name)+'?ref=main';
        return fetch(fileUrl,{headers:ghHeaders()}).then(function(r2){
          if(!r2.ok)throw new Error('file HTTP '+r2.status);return r2.json();
        }).then(function(meta){
          if(meta&&meta.content)return JSON.parse(decodeURIComponent(escape(atob(String(meta.content).replace(/\s/g,'')))));
          throw new Error('no content in API response');
        }).then(function(data){
          if(pk!==capturedPk)return{status:'stale-pair'}; /* committed only to the pair that initiated it (§18.3-F) */
          var newCards=Array.isArray(data)?data:(data.cards||[]);
          newCards.forEach(function(c){if(!c.categories||!c.categories.length)c.categories=['unassigned']});
          cards=newCards;version=bestVer; /* REPLACE-on-load — GH is source of truth, local cache is disposable */
          if(!persist())return{status:'cache-write-failed'};
          clearDirty();
          lastPull={status:'ok',n:cards.length,at:Date.now()};UI.renderPbStatus();
          log('pb_pulled',{pair:capturedPk,version:bestVer,n:cards.length},'ok');
          return{status:'ok',version:bestVer,n:cards.length};
        });
      }).catch(function(e){
        var d=String(e&&e.message||e);log('pb_pull_err',{e:d},'warn');
        var st=/HTTP 401|HTTP 403/.test(d)?'auth':'error';
        lastPull={status:st,detail:d,at:Date.now()};UI.renderPbStatus();
        return{status:st,detail:d};
      });
    },
    addCard:function(o){
      var srcT=norm(o.source||''),tgtT=norm(o.target||'');
      var dup=this.live().find(function(c){return norm(c.source).toLowerCase()===srcT.toLowerCase()&&norm(c.target).toLowerCase()===tgtT.toLowerCase()});
      if(dup){dup.usage=(dup.usage||0)+1;dup.lastUsed=Date.now();persist();markDirty();toast('Already saved');return null}
      var now=Date.now();
      var card={id:uid(),sourceLang:o.sourceLang,targetLang:o.targetLang,source:srcT,target:tgtT,notes:'',tags:[],
        categories:o.categories&&o.categories.length?o.categories:['unassigned'],
        backtranslate:{sourceLang:o.targetLang,targetLang:o.sourceLang,inputText:tgtT,resultText:'',verdict:'',contentHash:srcT+'||'+tgtT,updatedAt:now},
        clarifyChain:[{text:'Created',author:AppUser.name()||'me',timestamp:now}],
        savedBy:AppUser.name()||'me',createdBy:AppUser.name()||'me',createdAt:now,updatedAt:now,updatedBy:'local'};
      cards.unshift(card);persist();markDirty(); /* saved locally, immediately, done (P3) — write-back is separate */
      toast('Saved to phrasebook');
      return card;
    },
    newEmptyExists:function(){return cards.find(function(c){return!c.deletedAt&&!norm(c.source)&&!norm(c.target)})},
    newCard:function(room){
      var existing=this.newEmptyExists();if(existing)return existing;
      var now=Date.now();
      var card={id:uid(),sourceLang:room.myLang,targetLang:room.theirLang,source:'',target:'',notes:'',tags:[],categories:['unassigned'],
        backtranslate:{sourceLang:room.theirLang,targetLang:room.myLang,inputText:'',resultText:'',verdict:'',contentHash:'',updatedAt:now},
        clarifyChain:[{text:'Created',author:AppUser.name()||'me',timestamp:now}],
        savedBy:AppUser.name()||'me',createdBy:AppUser.name()||'me',createdAt:now,updatedAt:now,updatedBy:'local'};
      cards.unshift(card);persist();markDirty();
      return card;
    },
    touch:function(c){c.updatedAt=Date.now();c.updatedBy='local';persist();markDirty()},
    /* the write-back step (§11 "Saving") — captures immutable identity
       BEFORE the async call so a room-switch mid-write cannot corrupt it */
    writeBack:function(){
      var capturedPk=pk,capturedCards=cards.slice();
      if(!capturedPk)return Promise.resolve({status:'no-pair'});
      if(!isDirtyPair(capturedPk))return Promise.resolve({status:'skipped'});
      var pat=Cred.keys().pat;
      if(!pat)return Promise.resolve({status:'no-pat'});
      var dirp=capturedPk.split('-'),src=dirp[0],tgt=dirp[1];
      var ver=version||1000; /* never invents a higher version — overwrites what's loaded, or 1000 if new */
      var v=String(ver);while(v.length<4)v='0'+v;
      var fname='phrasebook-'+src+'-'+tgt+'-'+v+'.json';
      var getUrl='https://api.github.com/repos/'+PB_REPO.owner+'/'+PB_REPO.name+'/contents/'+PB_REPO.dir+'/'+fname+'?ref=main';
      return fetch(getUrl,{headers:ghHeaders()}).then(function(r){
        if(r.status===404)return null;
        if(!r.ok)throw new Error('get '+r.status);
        return r.json();
      }).then(function(existing){
        var envelope={type:'phrasebook',pair:capturedPk,version:ver,updatedAt:new Date().toISOString(),updatedBy:AppUser.name()||'me',cards:capturedCards};
        var content=btoa(unescape(encodeURIComponent(JSON.stringify(envelope,null,2))));
        var putUrl='https://api.github.com/repos/'+PB_REPO.owner+'/'+PB_REPO.name+'/contents/'+PB_REPO.dir+'/'+fname;
        var body={message:'PB update '+capturedPk+' v'+ver,content:content,branch:'main'};
        if(existing&&existing.sha)body.sha=existing.sha; /* refuses a stale write without the current sha */
        return fetch(putUrl,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)}).then(function(r2){
          if(!r2.ok)throw new Error('put '+r2.status);return r2.json();
        });
      }).then(function(){
        if(pk===capturedPk){version=ver;persist();clearDirty();UI.pbSyncDot('idle')} /* only commit to the pair that initiated it */
        lastPull={status:'ok',file:fname,n:capturedCards.length,at:Date.now()};UI.renderPbStatus();
        log('pb_writeback',{pair:capturedPk,version:ver},'ok');
        return{status:'ok',version:ver};
      }).catch(function(e){
        log('pb_writeback_err',{e:String(e)},'warn');
        if(pk===capturedPk)UI.pbSyncDot('error');
        toast('trouble updating GitHub, check the debug log',5200);
        if(!retryArmed){
          retryArmed=true;
          window.addEventListener('online',function _r(){window.removeEventListener('online',_r);retryArmed=false;if(isDirtyPair(capturedPk))PhrasebookSync.writeBack()});
        }
        return{status:'pending'};
      });
    }
  };
})();

/* ════════════════════════ MODULE: AttachmentIO (§20) ════════════════════════
   FileReader lifecycle. A stale read is discarded or redirected by its
   captured room/message id (§18.3-H). ITEM 10 — 200MB max, rejected with an
   explicit visible error BEFORE the file is read; accept restricted to
   images/video per spec §7.3.A. */
var ATTACHMENT_MAX_BYTES=200*1024*1024;
var AttachmentIO=(function(){
  return{
    accept:'image/*,video/*',
    pick:function(file,onReady){
      if(!file)return;
      if(file.size>ATTACHMENT_MAX_BYTES){
        toast('That file is over 200 MB — attachments must be 200 MB or smaller');
        log('attachment_too_large',{size:file.size,name:file.name},'error');
        return; /* rejected before reading */
      }
      var tok=SessionCore.capture(); /* captured room/generation — a late read must not land elsewhere */
      var reader=new FileReader();
      reader.onload=function(){
        if(!SessionCore.isCurrent(tok)){log('attachment_read_discarded',{reason:'room changed'},'warn');return}
        onReady({name:file.name,type:file.type,size:file.size,dataUrl:reader.result});
      };
      reader.onerror=function(){log('attachment_read_err',{name:file.name},'error');toast('Could not read that file')};
      reader.readAsDataURL(file);
    }
  };
})();

/* ════════════════════════ MODULE: ReceiptsCoordinator (§20) ════════════════════════
   Fires read-receipt reconciliation on room entry directly, not only on
   visibilitychange (§18.3-L, T14-11). */
var ReceiptsCoordinator=(function(){
  function sendReadReceipts(){
    if(AppState.view!=='room'||document.hidden)return;
    var room=RoomStore.active();if(!room)return;
    var ids=TranscriptStore.all(room.id).filter(function(e){return e.who==='partner'&&e.kind==='chat'&&!e.readSent}).map(function(e){e.readSent=true;return e.id});
    if(ids.length){RelayClient.send({type:'chat-read',ids:ids,transient:true})}
  }
  return{
    onRoomEntry:sendReadReceipts, /* room entry ITSELF sends receipts — not only visibilitychange */
    onForegroundReturn:sendReadReceipts,
    flush:sendReadReceipts
  };
})();
