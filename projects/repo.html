<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AcmeProducts Repo Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body,html{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5}
        #app{display:flex;height:100vh;overflow:hidden}
        #left-rail{
            width:260px;
            min-width:200px;
            background:#2c3e50;
            color:#ecf0f1;
            overflow-y:auto;
            padding:10px;
        }
        #left-rail h2{margin-top:0;font-size:1.2em}
        .repo-item{
            padding:8px;
            border-radius:4px;
            cursor:pointer;
            margin-bottom:4px;
        }
        .repo-item:hover,.repo-item.active{background:#34495e}
        .repo-meta{font-size:0.8em;color:#bdc3c7;margin-top:2px}
        #right-panel{
            flex:1;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        #tabs{
            display:flex;
            background:#fff;
            border-bottom:1px solid #ddd;
        }
        .tab{
            padding:10px 15px;
            cursor:pointer;
        }
        .tab.active{border-bottom:3px solid #2980b9;color:#2980b9}
        #tab-content{
            flex:1;
            overflow-y:auto;
            padding:15px;
            background:#fff;
        }
        .chevron{
            cursor:pointer;
            user-select:none;
            margin-left:5px;
        }
        .app-group{
            margin-left:20px;
            display:none;
        }
        .app-group.active{display:block}
        .launch-btn{
            background:#27ae60;
            color:#fff;
            border:none;
            padding:5px 10px;
            border-radius:3px;
            cursor:pointer;
        }
        .diagnostics{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            background:#333;
            color:#fff;
            padding:5px 10px;
            font-size:0.9em;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="left-rail">
        <h2>Repositories</h2>
        <div id="repo-list"></div>
    </div>
    <div id="right-panel">
        <div id="tabs">
            <div class="tab active" data-tab="overview">Overview</div>
            <div class="tab" data-tab="apps">Apps</div>
            <div class="tab" data-tab="code">Code</div>
            <div class="tab" data-tab="readme">Readme/Install</div>
        </div>
        <div id="tab-content">
            <div class="tab-page" data-tab="overview">
                <h3>Repository Overview</h3>
                <div id="overview-content"></div>
                <button class="launch-btn" id="launch-repo">Launch Repo</button>
                <button class="launch-btn" id="analyze-repo">Analyze (no GitHub Pages)</button>
            </div>
            <div class="tab-page" data-tab="apps" style="display:none">
                <h3>Applications</h3>
                <div id="apps-content"></div>
            </div>
            <div class="tab-page" data-tab="code" style="display:none">
                <h3>Code Links</h3>
                <ul id="code-links"></ul>
            </div>
            <div class="tab-page" data-tab="readme" style="display:none">
                <h3>Readme / Install</h3>
                <div id="readme-content"></div>
            </div>
        </div>
    </div>
</div>

<div class="diagnostics" id="diagnostics">Dashboard Ready</div>

<script>
/* ---------- Static sample data (replace with real API later) ---------- */
const sampleRepos = [
    {
        id: "repo1",
        name: "repo-one",
        lastAccessed: "2026-10-09",
        pages: true,
        overview: "Repo‑one contains the main Acme product web app.",
        apps: [
            { name: "App‑A", versions: ["v1.0","v0.9"] },
            { name: "App‑B", versions: ["v2.3"] }
        ],
        codeLinks: [
            { href:"#", label:"src/index.html" },
            { href:"#", label:"src/app.js" }
        ],
        readme: "## Repo‑One\nThis repo hosts the primary web UI..."
    },
    {
        id: "repo2",
        name: "repo-two",
        lastAccessed: "2026-10-08",
        pages: false,
        overview: "Repo‑two is a collection of utilities.",
        apps: [
            { name: "Utility‑X", versions: ["v0.1"] }
        ],
        codeLinks: [
            { href:"#", label:"utils/util.js" }
        ],
        readme: "## Repo‑Two\nUtility scripts for internal use."
    }
];

/* ---------- Rendering functions ---------- */
function renderRepoList() {
    const list = document.getElementById('repo-list');
    list.innerHTML = '';
    sampleRepos.forEach((repo, idx) => {
        const div = document.createElement('div');
        div.className = 'repo-item' + (idx===0 ? ' active' : '');
        div.dataset.repoId = repo.id;
        div.innerHTML = `
            <div>${repo.name}</div>
            <div class="repo-meta">
                Last accessed: ${repo.lastAccessed}<br>
                GitHub Pages: ${repo.pages ? '✅' : '❌'}
            </div>`;
        div.addEventListener('click', () => selectRepo(repo.id));
        list.appendChild(div);
    });
    // load first repo by default
    if (sampleRepos.length) selectRepo(sampleRepos[0].id);
}

function selectRepo(repoId) {
    // highlight
    document.querySelectorAll('.repo-item').forEach(i=>i.classList.toggle('active', i.dataset.repoId===repoId));
    const repo = sampleRepos.find(r=>r.id===repoId);
    if (!repo) return;
    // update diagnostics
    document.getElementById('diagnostics').textContent = `Dashboard Ready – ${repo.name}`;
    // populate overview
    document.getElementById('overview-content').innerHTML = `<p>${repo.overview}</p>`;
    // launch button (placeholder)
    document.getElementById('launch-repo').onclick = () => alert(`Launching ${repo.name}`);
    // analyze button
    document.getElementById('analyze-repo').onclick = () => analyzeRepo(repo);
    // apps
    renderApps(repo);
    // code links
    renderCodeLinks(repo);
    // readme
    document.getElementById('readme-content').innerHTML = repo.readme.replace(/\n/g,'<br>');
}

function renderApps(repo) {
    const container = document.getElementById('apps-content');
    container.innerHTML = '';
    repo.apps.forEach(app => {
        const header = document.createElement('div');
        header.className = 'app-header';
        header.dataset.group = `${repo.id}-${app.name}`;
        header.innerHTML = `<span class="chevron">▶</span> ${app.name}`;
        const group = document.createElement('div');
        group.className = 'app-group';
        group.id = `${repo.id}-${app.name}`;
        app.versions.forEach(v => {
            const verDiv = document.createElement('div');
            verDiv.textContent = v + ' ';
            const btn = document.createElement('button');
            btn.className = 'launch-btn';
            btn.textContent = 'Launch';
            btn.onclick = () => alert(`Launching ${app.name} ${v}`);
            verDiv.appendChild(btn);
            group.appendChild(verDiv);
        });
        header.addEventListener('click', () => {
            const grp = document.getElementById(header.dataset.group);
            const chevron = header.querySelector('.chevron');
            grp.classList.toggle('active');
            chevron.textContent = grp.classList.contains('active') ? '▼' : '▶';
        });
        container.appendChild(header);
        container.appendChild(group);
    });
}

function renderCodeLinks(repo) {
    const ul = document.getElementById('code-links');
    ul.innerHTML = '';
    repo.codeLinks.forEach(l => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = l.href;
        a.target = '_blank';
        a.textContent = l.label;
        li.appendChild(a);
        ul.appendChild(li);
    });
}

/* ---------- Analyze flow (placeholder) ---------- */
function analyzeRepo(repo) {
    // Simple heuristic: if no pages, suggest enabling GitHub Pages
    const suggestion = repo.pages
        ? 'Repo already has GitHub Pages enabled.'
        : 'Repo lacks GitHub Pages. You can add a simple index.html and enable Pages in settings.';
    alert(`Analysis for ${repo.name}:\n\n${suggestion}`);
}

/* ---------- Tab switching ---------- */
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.querySelectorAll('.tab-page').forEach(page=>{
            page.style.display = page.dataset.tab===target ? 'block' : 'none';
        });
    });
});

/* ---------- Init ---------- */
renderRepoList();
</script>
</body>
</html>
