<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AcmeProducts Repo Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body,html{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5}
        #app{display:flex;height:100vh;overflow:hidden}
        #left-rail{
            width:260px;
            min-width:200px;
            background:#2c3e50;
            color:#ecf0f1;
            overflow-y:auto;
            padding:10px;
        }
        #left-rail h2{margin-top:0;font-size:1.2em}
        .repo-item{
            padding:8px;
            border-radius:4px;
            cursor:pointer;
            margin-bottom:4px;
        }
        .repo-item:hover,.repo-item.active{background:#34495e}
        .repo-meta{font-size:0.8em;color:#bdc3c7;margin-top:2px}
        #right-panel{
            flex:1;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        #tabs{
            display:flex;
            background:#fff;
            border-bottom:1px solid #ddd;
        }
        .tab{
            padding:10px 15px;
            cursor:pointer;
        }
        .tab.active{border-bottom:3px solid #2980b9;color:#2980b9}
        #tab-content{
            flex:1;
            overflow-y:auto;
            padding:15px;
            background:#fff;
        }
        .chevron{
            cursor:pointer;
            user-select:none;
            margin-left:5px;
        }
        .app-group{
            margin-left:20px;
            display:none;
        }
        .app-group.active{display:block}
        .launch-btn{
            background:#27ae60;
            color:#fff;
            border:none;
            padding:5px 10px;
            border-radius:3px;
            cursor:pointer;
        }
        .diagnostics{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            background:#333;
            color:#fff;
            padding:5px 10px;
            font-size:0.9em;
        }
    </style>
</head>
<body>
<div id="app">
    <div id="left-rail">
        <h2>Repositories</h2>
        <div id="repo-list"></div>
    </div>
    <div id="right-panel">
        <div id="tabs">
            <div class="tab active" data-tab="overview">Overview</div>
            <div class="tab" data-tab="apps">Apps</div>
            <div class="tab" data-tab="code">Code</div>
            <div class="tab" data-tab="readme">Readme/Install</div>
        </div>
        <div id="tab-content">
            <div class="tab-page" data-tab="overview">
                <h3>Repository Overview</h3>
                <div id="overview-content"></div>
                <button class="launch-btn" id="launch-repo">Launch Repo</button>
                <button class="launch-btn" id="analyze-repo">Analyze (no GitHub Pages)</button>
            </div>
            <div class="tab-page" data-tab="apps" style="display:none">
                <h3>Applications</h3>
                <div id="apps-content"></div>
            </div>
            <div class="tab-page" data-tab="code" style="display:none">
                <h3>Code Links</h3>
                <ul id="code-links"></ul>
            </div>
            <div class="tab-page" data-tab="readme" style="display:none">
                <h3>Readme / Install</h3>
                <div id="readme-content"></div>
            </div>
        </div>
    </div>
</div>

<div class="diagnostics" id="diagnostics">Dashboard Ready</div>

<script>
/* ---------- Live GitHub API fetch ---------- */
const ORG = 'acmeproducts';
let reposData = [];

/* Helper to format ISO date */
function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
}

/* Fetch repos from GitHub */
async function fetchRepos() {
    try {
        const resp = await fetch(`https://api.github.com/orgs/${ORG}/repos`);
        if (!resp.ok) throw new Error(`GitHub API error: ${resp.status}`);
        const repos = await resp.json();
        // Map needed fields
        reposData = await Promise.all(repos.map(async repo => {
            // Get README HTML
            let readmeHTML = '';
            try {
                const readmeResp = await fetch(`https://api.github.com/repos/${ORG}/${repo.name}/readme`, {
                    headers: { Accept: 'application/vnd.github.VERSION.html' }
                });
                if (readmeResp.ok) readmeHTML = await readmeResp.text();
            } catch (_) {}
            // Simple heuristic for apps: look for top‑level directories named "app-" or "src"
            let apps = [];
            try {
                const contentsResp = await fetch(`https://api.github.com/repos/${ORG}/${repo.name}/contents`);
                if (contentsResp.ok) {
                    const items = await contentsResp.json();
                    const appDirs = items.filter(i => i.type === 'dir' && /app|src/i.test(i.name));
                    apps = appDirs.map(dir => ({
                        name: dir.name,
                        versions: [] // version detection omitted for brevity
                    }));
                }
            } catch (_) {}
            return {
                id: repo.id,
                name: repo.name,
                lastAccessed: formatDate(repo.pushed_at),
                pages: repo.has_pages || false,
                overview: repo.description || 'No description.',
                apps,
                codeLinks: [{ href: repo.html_url, label: 'GitHub Repo' }],
                readme: readmeHTML || `<p>No README found.</p>`
            };
        }));
        renderRepoList();
        document.getElementById('diagnostics').textContent = `Dashboard Live – ${reposData.length} repos loaded`;
    } catch (e) {
        console.error(e);
        document.getElementById('diagnostics').textContent = `Error loading repos`;
    }
}

/* ---------- Rendering functions ---------- */
function renderRepoList() {
    const list = document.getElementById('repo-list');
    list.innerHTML = '';
    reposData.forEach((repo, idx) => {
        const div = document.createElement('div');
        div.className = 'repo-item' + (idx===0 ? ' active' : '');
        div.dataset.repoId = repo.id;
        div.innerHTML = `
            <div>${repo.name}</div>
            <div class="repo-meta">
                Last accessed: ${repo.lastAccessed}<br>
                GitHub Pages: ${repo.pages ? '✅' : '❌'}
            </div>`;
        div.addEventListener('click', () => selectRepo(repo.id));
        list.appendChild(div);
    });
    if (reposData.length) selectRepo(reposData[0].id);
}

function selectRepo(repoId) {
    document.querySelectorAll('.repo-item').forEach(i=>i.classList.toggle('active', i.dataset.repoId==repoId));
    const repo = reposData.find(r=>r.id==repoId);
    if (!repo) return;
    document.getElementById('diagnostics').textContent = `Dashboard Live – ${repo.name}`;
    document.getElementById('overview-content').innerHTML = `<p>${repo.overview}</p>`;
    document.getElementById('launch-repo').onclick = () => {
        if (repo.pages) window.open(`https://${ORG}.github.io/${repo.name}`, '_blank');
        else alert('No GitHub Pages site.');
    };
    document.getElementById('analyze-repo').onclick = () => analyzeRepo(repo);
    renderApps(repo);
    renderCodeLinks(repo);
    document.getElementById('readme-content').innerHTML = repo.readme;
}

/* Apps rendering with chevrons */
function renderApps(repo) {
    const container = document.getElementById('apps-content');
    container.innerHTML = '';
    if (!repo.apps.length) {
        container.textContent = 'No detected applications.';
        return;
    }
    repo.apps.forEach(app => {
        const header = document.createElement('div');
        header.className = 'app-header';
        header.dataset.group = `${repo.id}-${app.name}`;
        header.innerHTML = `<span class="chevron">▶</span> ${app.name}`;
        const group = document.createElement('div');
        group.className = 'app-group';
        group.id = `${repo.id}-${app.name}`;
        // versions placeholder
        const verDiv = document.createElement('div');
        verDiv.textContent = 'v1.0 ';
        const btn = document.createElement('button');
        btn.className = 'launch-btn';
        btn.textContent = 'Launch';
        btn.onclick = () => alert(`Launching ${app.name} v1.0`);
        verDiv.appendChild(btn);
        group.appendChild(verDiv);
        header.addEventListener('click', () => {
            const grp = document.getElementById(header.dataset.group);
            const chevron = header.querySelector('.chevron');
            grp.classList.toggle('active');
            chevron.textContent = grp.classList.contains('active') ? '▼' : '▶';
        });
        container.appendChild(header);
        container.appendChild(group);
    });
}

/* Code links */
function renderCodeLinks(repo) {
    const ul = document.getElementById('code-links');
    ul.innerHTML = '';
    repo.codeLinks.forEach(l => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = l.href;
        a.target = '_blank';
        a.textContent = l.label;
        li.appendChild(a);
        ul.appendChild(li);
    });
}

/* Analyze flow */
function analyzeRepo(repo) {
    const suggestion = repo.pages
        ? 'Repo already has GitHub Pages enabled.'
        : 'Repo lacks GitHub Pages. Add an index.html and enable Pages in the repo settings.';
    alert(`Analysis for ${repo.name}:\n\n${suggestion}`);
}

/* Tab switching */
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.dataset.tab;
        document.querySelectorAll('.tab-page').forEach(page=>{
            page.style.display = page.dataset.tab===target ? 'block' : 'none';
        });
    });
});

/* Init */
fetchRepos();
</script>
</body>
</html>
