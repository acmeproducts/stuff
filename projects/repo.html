<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AcmeProducts Repo Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body,html{margin:0;padding:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f5f5f5}
        #app{display:flex;height:100vh;overflow:hidden}
        #left-rail{
            width:260px;
            min-width:200px;
            background:#2c3e50;
            color:#ecf0f1;
            overflow-y:auto;
            padding:10px;
        }
        #left-rail h2{margin-top:0;font-size:1.2em}
        .repo-item{
            padding:8px;
            border-radius:4px;
            cursor:pointer;
            margin-bottom:4px;
        }
        .repo-item:hover,.repo-item.active{background:#34495e}
        .repo-meta{font-size:0.8em;color:#bdc3c7;margin-top:2px}
        #right-panel{
            flex:1;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        #tabs{
            display:flex;
            background:#fff;
            border-bottom:1px solid #ddd;
        }
        .tab{
            padding:10px 15px;
            cursor:pointer;
        }
        .tab.active{border-bottom:3px solid #2980b9;color:#2980b9}
        #tab-content{
            flex:1;
            overflow-y:auto;
            padding:15px;
            background:#fff;
        }
        .chevron{
            cursor:pointer;
            user-select:none;
            margin-left:5px;
        }
        .app-group{
            margin-left:20px;
            display:none;
        }
        .app-group.active{display:block}
        .launch-btn{
            background:#27ae60;
            color:#fff;
            border:none;
            padding:5px 10px;
            border-radius:3px;
            cursor:pointer;
        }
        .diagnostics{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            background:#333;
            color:#fff;
            padding:5px 10px;
            font-size:0.9em;
        }
        #org-input{margin-bottom:10px;width:100%;padding:5px;}
        #retry-btn{margin-top:5px;padding:5px 10px;background:#e67e22;color:#fff;border:none;border-radius:3px;cursor:pointer;}
    </style>
</head>
<body>
<div id="app">
    <div id="left-rail">
        <h2>Repositories</h2>
        <input type="text" id="org-input" placeholder="GitHub organization (default: acmeproducts)" />
        <button id="retry-btn">Load Repos</button>
        <div id="repo-list"></div>
    </div>
    <div id="right-panel">
        <div id="tabs">
            <div class="tab active" data-tab="overview">Overview</div>
            <div class="tab" data-tab="apps">Apps</div>
            <div class="tab" data-tab="code">Code</div>
            <div class="tab" data-tab="readme">Readme/Install</div>
        </div>
        <div id="tab-content">
            <div class="tab-page" data-tab="overview">
                <h3>Repository Overview</h3>
                <div id="overview-content"></div>
                <button class="launch-btn" id="launch-repo">Launch Repo</button>
                <button class="launch-btn" id="analyze-repo">Analyze (no GitHub Pages)</button>
            </div>
            <div class="tab-page" data-tab="apps" style="display:none">
                <h3>Applications</h3>
                <div id="apps-content"></div>
            </div>
            <div class="tab-page" data-tab="code" style="display:none">
                <h3>Code Links</h3>
                <ul id="code-links"></ul>
            </div>
            <div class="tab-page" data-tab="readme" style="display:none">
                <h3>Readme / Install</h3>
                <div id="readme-content"></div>
            </div>
        </div>
    </div>
</div>

<div class="diagnostics" id="diagnostics">Dashboard Ready</div>

<script>
let ORG = 'acmeproducts';
let reposData = [];

/* Helpers */
function formatDate(iso){const d=new Date(iso);return d.toLocaleDateString()+' '+d.toLocaleTimeString();}

/* Fetch repos */
async function fetchRepos(){
    const org = document.getElementById('org-input').value.trim()||ORG;
    ORG = org;
    try{
        const resp = await fetch(`https://api.github.com/orgs/${ORG}/repos`);
        if(!resp.ok) throw new Error(`GitHub API error: ${resp.status}`);
        const repos = await resp.json();
        reposData = await Promise.all(repos.map(async repo=>{
            let readmeHTML = '';
            try{
                const r = await fetch(`https://api.github.com/repos/${ORG}/${repo.name}/readme`,{
                    headers:{Accept:'application/vnd.github.VERSION.html'}
                });
                if(r.ok) readmeHTML = await r.text();
            }catch{}
            let apps = [];
            try{
                const c = await fetch(`https://api.github.com/repos/${ORG}/${repo.name}/contents`);
                if(c.ok){
                    const items = await c.json();
                    const dirs = items.filter(i=>i.type==='dir' && /app|src/i.test(i.name));
                    apps = dirs.map(d=>({name:d.name,versions:[]}));
                }
            }catch{}
            return {
                id:repo.id,
                name:repo.name,
                lastAccessed:formatDate(repo.pushed_at),
                pages:repo.has_pages||false,
                overview:repo.description||'No description.',
                apps,
                codeLinks:[{href:repo.html_url,label:'GitHub Repo'}],
                readme:readmeHTML||`<p>No README found.</p>`
            };
        }));
        renderRepoList();
        document.getElementById('diagnostics').textContent=`Dashboard Live – ${reposData.length} repos loaded`;
    }catch(e){
        console.error(e);
        document.getElementById('diagnostics').textContent=`Error loading repos for "${ORG}"`;
        document.getElementById('repo-list').innerHTML='<p style="color:#e74c3c;">Failed to load repos. Check organization name.</p>';
    }
}

/* Rendering */
function renderRepoList(){
    const list=document.getElementById('repo-list');
    list.innerHTML='';
    reposData.forEach((repo,idx)=>{
        const div=document.createElement('div');
        div.className='repo-item'+(idx===0?' active':'');
        div.dataset.repoId=repo.id;
        div.innerHTML=`<div>${repo.name}</div>
            <div class="repo-meta">Last accessed: ${repo.lastAccessed}<br>GitHub Pages: ${repo.pages?'✅':'❌'}</div>`;
        div.onclick=()=>selectRepo(repo.id);
        list.appendChild(div);
    });
    if(reposData.length) selectRepo(reposData[0].id);
}

function selectRepo(id){
    document.querySelectorAll('.repo-item').forEach(i=>i.classList.toggle('active',i.dataset.repoId==id));
    const repo=reposData.find(r=>r.id==id);
    if(!repo) return;
    document.getElementById('diagnostics').textContent=`Dashboard Live – ${repo.name}`;
    document.getElementById('overview-content').innerHTML=`<p>${repo.overview}</p>`;
    document.getElementById('launch-repo').onclick=()=>{if(repo.pages)window.open(`https://${ORG}.github.io/${repo.name}`,'_blank');else alert('No GitHub Pages site.');};
    document.getElementById('analyze-repo').onclick=()=>analyzeRepo(repo);
    renderApps(repo);
    renderCodeLinks(repo);
    document.getElementById('readme-content').innerHTML=repo.readme;
}

function renderApps(repo){
    const container=document.getElementById('apps-content');
    container.innerHTML='';
    if(!repo.apps.length){container.textContent='No detected applications.';return;}
    repo.apps.forEach(app=>{
        const header=document.createElement('div');
        header.className='app-header';
        header.dataset.group=`${repo.id}-${app.name}`;
        header.innerHTML=`<span class="chevron">▶</span> ${app.name}`;
        const group=document.createElement('div');
        group.className='app-group';
        group.id=`${repo.id}-${app.name}`;
        const verDiv=document.createElement('div');
        verDiv.textContent='v1.0 ';
        const btn=document.createElement('button');
        btn.className='launch-btn';
        btn.textContent='Launch';
        btn.onclick=()=>alert(`Launching ${app.name} v1.0`);
        verDiv.appendChild(btn);
        group.appendChild(verDiv);
        header.onclick=()=>{const g=document.getElementById(header.dataset.group);const c=header.querySelector('.chevron');g.classList.toggle('active');c.textContent=g.classList.contains('active')?'▼':'▶';};
        container.appendChild(header);
        container.appendChild(group);
    });
}

function renderCodeLinks(repo){
    const ul=document.getElementById('code-links');
    ul.innerHTML='';
    repo.codeLinks.forEach(l=>{const li=document.createElement('li');const a=document.createElement('a');a.href=l.href;a.target='_blank';a.textContent=l.label;li.appendChild(a);ul.appendChild(li);});
}

/* Analyze */
function analyzeRepo(repo){
    const suggestion=repo.pages?'Repo already has GitHub Pages enabled.':'Repo lacks GitHub Pages. Add an index.html and enable Pages in the repo settings.';
    alert(`Analysis for ${repo.name}:\n\n${suggestion}`);
}

/* Tab switching */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    const target=t.dataset.tab;
    document.querySelectorAll('.tab-page').forEach(p=>p.style.display=p.dataset.tab===target?'block':'none');
}));

/* Retry button */
document.getElementById('retry-btn').addEventListener('click',fetchRepos);

/* Init */
fetchRepos();
</script>
</body>
</html>
