<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#151311">
<title>Cassette</title>
<style>
  :root{
    --bg:#151311; --shell:#2a2724; --shell2:#3a3632; --edge:#0c0b0a;
    --paper:#f4ebd4; --paper2:#e9dcbc; --paper-ink:#3a2c1c; --paper-fade:#8a6a3a;
    --btn:#4a4540; --btn-top:#6b6560; --btn-face:#57524d;
    --accent:#ffb84d; --good:#7dd87d; --bad:#ff6b5e; --dim:#8a8278;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#eee;
    overscroll-behavior:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 52px) 12px calc(env(safe-area-inset-bottom) + 8px)}

  /* Portrait lock: the deck NEVER rotates — tape on top, keys below.
     In walkman look + landscape phone, the whole app rotates itself upright. */
  body.rotlock #app{
    inset:auto;top:0;left:100vw;
    width:100vh;height:100vw;
    transform:rotate(90deg);
    transform-origin:left top;
  }

  /* ---------- toast (only appears when something needs saying) ---------- */
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);
    transform:translateX(-50%);z-index:60;max-width:86vw;text-align:center;
    background:#100e0dee;border:1px solid #2a2624;border-radius:20px;
    color:#e8ddc9;font-size:12px;letter-spacing:.5px;padding:9px 16px;
    opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}

  /* ---------- drawer (library) ---------- */
  #drawer{position:fixed;top:0;left:0;right:0;z-index:40;
    background:linear-gradient(#211e1b,#191715);border-bottom:2px solid var(--edge);
    border-radius:0 0 18px 18px;box-shadow:0 10px 30px rgba(0,0,0,.6);
    transform:translateY(calc(-100% + 46px));transition:transform .25s ease;
    max-height:78vh;display:flex;flex-direction:column}
  #drawer.open{transform:translateY(0)}
  #drawer.dragging{transition:none}
  #drawerBody{padding:14px 16px 8px;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  #drawerBody h2{margin:10px 0 8px;font-size:12px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
  #addBtn{width:100%;padding:14px;margin:0 0 4px;border:2px dashed var(--dim);border-radius:12px;
    background:transparent;color:var(--accent);font-size:16px;font-weight:600}
  #spotRow{display:flex;gap:8px;margin:0 0 10px}
  #spotInput{flex:1;min-width:0;padding:12px;border-radius:10px;border:1px solid #3a352f;
    background:#141210;color:#e8ddc9;font-size:14px}
  #spotLoad{padding:0 16px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--btn-top),var(--btn-face) 45%,var(--btn));
    color:#f2ede6;font-weight:800;letter-spacing:1px;
    box-shadow:0 4px 0 #232019;transition:transform .05s, box-shadow .05s}
  #spotLoad:active{transform:translateY(3px);box-shadow:0 1px 0 #232019}
  #spotifyBox{display:none;margin:0 0 12px}
  #spotifyBox iframe{width:100%;height:152px;border:0;border-radius:12px;background:#000}
  .presetRow{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
  .preset{flex:1 1 44%;padding:13px 8px;border:1px solid #3a352f;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,#332f2a,#26231f);color:#e8ddc9;font-size:13px;font-weight:700;
    box-shadow:0 4px 0 #1d1a15, 0 6px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .05s, box-shadow .05s;user-select:none;-webkit-user-select:none}
  .preset:active{transform:translateY(3px);box-shadow:0 1px 0 #1d1a15, inset 0 1px 0 rgba(255,255,255,.05)}
  .preset.on{color:var(--accent);text-shadow:0 0 8px rgba(255,184,77,.6)}
  #trackList{list-style:none;margin:0;padding:0}
  #trackList li{padding:12px 10px;border-bottom:1px solid #2c2825;font-size:15px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #trackList li.current{color:var(--accent);font-weight:700}
  #emptyMsg{color:var(--dim);font-size:13px;padding:8px 2px 12px;line-height:1.5}
  #handle{height:46px;flex:0 0 46px;display:flex;align-items:center;justify-content:center;cursor:grab;position:relative}
  #handleBar{width:64px;height:6px;border-radius:3px;background:var(--dim)}
  #handleLabel{position:absolute;font-size:10px;letter-spacing:2px;color:var(--dim);margin-top:16px}

  /* ---------- device shells (R5 adaptive form factor) ---------- */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
  #device{display:flex;flex-direction:column;align-items:center;max-width:100%}
  #deviceBody{display:flex;align-items:stretch;gap:14px;max-width:100%}
  #cassetteWell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .speaker{display:none}
  #carryHandle{display:none}
  #walkmanTrim{display:none;width:100%;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
  #brandStrip{font-size:9px;letter-spacing:3px;color:var(--dim);font-weight:700}
  #trimRight{display:flex;align-items:center;gap:8px}
  #led{width:7px;height:7px;border-radius:50%;background:#3a2222;transition:background .2s, box-shadow .2s}
  body.playing #led{background:#ff4a3d;box-shadow:0 0 7px #ff4a3d}
  #jackDot{width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#666,#111 70%);
    box-shadow:inset 0 0 3px #000, 0 0 0 2px #0a0908}

  /* Walkman (phone default): slim body, door frame, headphone-jack vibe */
  body.look-walkman #walkmanTrim{display:flex}
  body.look-walkman #deviceBody{
    background:linear-gradient(160deg,#34302c,#1e1c19);
    border:2px solid var(--edge);border-radius:18px;padding:14px 12px;gap:0;
    box-shadow:0 16px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.07)}
  body.look-walkman #cassette{
    box-shadow:0 0 0 3px #141210, 0 0 0 5px #0a0908, 0 14px 34px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.08)}

  /* Carry unit (tablet default): top handle, speakers flanking the well */
  body.look-boombox #carryHandle{display:block;width:52%;height:42px;
    border:12px solid #28241f;border-bottom:none;border-radius:22px 22px 0 0;
    margin-bottom:-8px;
    background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(255,255,255,.03) 10px 12px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.06)}
  body.look-boombox #deviceBody{
    background:linear-gradient(170deg,#3b3733,#24211e 60%,#1a1815);
    border:3px solid var(--edge);border-radius:20px;
    padding:22px clamp(14px,4vw,34px);gap:clamp(12px,3.5vw,30px);
    box-shadow:0 20px 50px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.08)}
  body.look-boombox .speaker{display:block;flex:1 1 0;min-width:64px;max-width:190px;
    border-radius:12px;border:2px solid #0e0c0b;
    background-color:#26231f;
    background-image:radial-gradient(#0b0a09 2.2px, transparent 2.7px);
    background-size:11px 11px;
    box-shadow:inset 0 3px 10px rgba(0,0,0,.75), inset 0 -1px 0 rgba(255,255,255,.05)}
  body.look-boombox #cassette{width:min(44vw,420px)}
  body.look-boombox .tbtn{max-width:88px;height:74px;font-size:21px}
  body.look-boombox #transport{gap:14px}
  body.look-boombox #walkmanTrim{display:flex}

  /* ---------- cassette ---------- */
  #cassette{width:min(94vw,430px);aspect-ratio:1.586;position:relative;border-radius:14px;
    background:linear-gradient(160deg,var(--shell2),var(--shell) 55%,#211e1b);
    border:2px solid var(--edge);
    box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);
    transition:transform .35s ease}
  body.ejected #cassette{transform:translateY(-30%) rotate(-1.5deg)}
  .screw{position:absolute;width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#777,#222);box-shadow:inset 0 0 2px #000}
  .screw.tl{top:7px;left:9px}.screw.tr{top:7px;right:9px}
  .screw.bl{bottom:7px;left:9px}.screw.br{bottom:7px;right:9px}

  /* paper label — ruled lines, printed corners, handwritten title. Nothing digital. */
  #label{position:absolute;top:8%;left:7%;right:7%;height:34%;border-radius:4px;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(180deg,transparent 0 11px,rgba(140,100,50,.16) 11px 12px),
      linear-gradient(180deg,var(--paper),var(--paper2));
    box-shadow:inset 0 0 0 1px rgba(120,90,40,.28), 0 1px 2px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:5px 10px 4px;color:var(--paper-ink)}
  #labelTop{display:flex;justify-content:space-between;font-size:9px;font-weight:800;
    letter-spacing:2px;color:var(--paper-fade)}
  #titleLine{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;
    font-size:15px;font-weight:700;color:#2c2115;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    border-bottom:1px solid rgba(90,60,20,.35);padding-bottom:1px;min-height:20px}
  #labelBottom{display:flex;justify-content:space-between;font-size:8px;font-weight:700;
    letter-spacing:2px;color:var(--paper-fade)}

  #window{position:absolute;top:47%;left:50%;transform:translateX(-50%);
    width:64%;height:34%;border-radius:8px;background:rgba(8,8,10,.92);
    border:2px solid #000;box-shadow:inset 0 3px 10px #000;
    display:flex;align-items:center;justify-content:space-between;padding:0 8%}
  .reel{width:34%;aspect-ratio:1;border-radius:50%;position:relative;
    background:radial-gradient(circle at 50% 50%,#d8d2c8 0 22%,#b8b2a8 22% 26%,transparent 26%),
    repeating-conic-gradient(#cfc9bf 0 12deg,#8f897f 12deg 24deg);
    border:3px solid #1c1a18;box-shadow:0 0 0 3px rgba(255,255,255,.06), inset 0 0 8px rgba(0,0,0,.4)}
  .reel::after{content:"";position:absolute;inset:38%;border-radius:50%;
    background:#222;border:2px solid #555}
  .spinning .reel{animation:spin 2.4s linear infinite}
  .spinning .reel.r2{animation-duration:3.1s}
  @keyframes spin{to{transform:rotate(360deg)}}
  #tapeLine{position:absolute;top:calc(47% + 17%);left:14%;right:14%;height:3px;
    background:#0a0a0a;border-radius:2px}
  #headSlot{position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
    width:34%;height:7%;border-radius:4px 4px 0 0;background:#141210;border:2px solid var(--edge)}

  /* ---------- transport: physical keys with travel ---------- */
  #transport{display:flex;justify-content:center;gap:8px;padding:14px 0 4px}
  .tbtn{flex:1;max-width:66px;height:66px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--btn-top),var(--btn-face) 42%,var(--btn));
    color:#f2ede6;font-size:18px;font-weight:800;letter-spacing:.5px;
    box-shadow:0 8px 0 #232019, 0 12px 16px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.2),
      inset 0 -2px 3px rgba(0,0,0,.3);
    transform:translateY(0);transition:transform .06s, box-shadow .06s, filter .1s;
    touch-action:none;user-select:none;-webkit-user-select:none}
  .tbtn:active,.tbtn.down{transform:translateY(7px);
    box-shadow:0 1px 0 #232019, 0 3px 6px rgba(0,0,0,.5), inset 0 2px 4px rgba(0,0,0,.35);
    filter:brightness(1.12)}
  .tbtn.active{color:var(--accent);text-shadow:0 0 8px rgba(255,184,77,.7)}
  .tbtn small{display:block;font-size:8px;letter-spacing:1.5px;color:var(--dim);margin-top:2px}

  #lookRow{display:flex;justify-content:center;padding-top:2px}
  #lookToggle{background:none;border:1px solid #2a2624;border-radius:6px;
    color:var(--dim);font-size:10px;letter-spacing:2px;padding:5px 10px}
</style>
</head>
<body>

<div id="app">

  <div id="drawer">
    <div id="drawerBody">
      <h2>Spotify</h2>
      <div id="spotRow">
        <input id="spotInput" type="text" inputmode="url" placeholder="Paste a Spotify link…" autocomplete="off">
        <button id="spotLoad">LOAD</button>
      </div>
      <div id="spotifyBox">
        <iframe id="spotFrame" title="Spotify player" loading="lazy"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
      </div>
      <h2>Radio</h2>
      <div class="presetRow" id="presetRow"></div>
      <h2>Your tapes</h2>
      <button id="addBtn">＋ Add songs from this device</button>
      <ul id="trackList"></ul>
      <div id="emptyMsg">No tapes yet — add local files above, paste a Spotify link, or tap a radio preset.</div>
    </div>
    <div id="handle"><div id="handleBar"></div><div id="handleLabel">LIBRARY</div></div>
  </div>

  <div id="stage">
    <div id="device">
      <div id="carryHandle"></div>
      <div id="deviceBody">
        <div class="speaker" id="spkL"></div>
        <div id="cassetteWell">
          <div id="walkmanTrim">
            <span id="brandStrip">STEREO CASSETTE PLAYER</span>
            <span id="trimRight"><span id="led"></span><span id="jackDot"></span></span>
          </div>
          <div id="cassette">
            <div class="screw tl"></div><div class="screw tr"></div>
            <div class="screw bl"></div><div class="screw br"></div>
            <div id="label">
              <div id="labelTop"><span>SIDE A</span><span>CHROME · TYPE II</span></div>
              <div id="titleLine">— no tape loaded —</div>
              <div id="labelBottom"><span>NORMAL BIAS</span><span>90 MIN</span></div>
            </div>
            <div id="window">
              <div class="reel r1"></div>
              <div class="reel r2"></div>
            </div>
            <div id="tapeLine"></div>
            <div id="headSlot"></div>
          </div>
        </div>
        <div class="speaker" id="spkR"></div>
      </div>
    </div>
  </div>

  <div id="transport">
    <button class="tbtn" id="btnRew">◂◂<small>REW</small></button>
    <button class="tbtn" id="btnPlay">▶<small>PLAY</small></button>
    <button class="tbtn" id="btnPause">❚❚<small>PAUSE</small></button>
    <button class="tbtn" id="btnStop">■<small>STOP</small></button>
    <button class="tbtn" id="btnFf">▸▸<small>FF</small></button>
    <button class="tbtn" id="btnEject">⏏<small>EJECT</small></button>
  </div>

  <div id="lookRow">
    <button id="lookToggle">LOOK: AUTO</button>
  </div>

  <div id="toast"></div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple style="display:none">

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  var audio = new Audio();
  audio.preload = "metadata";

  var tracks = [];          // {name, url}
  var current = -1;
  var isLive = false;       // true when a radio stream is loaded
  var state = "IDLE";       // IDLE LOADED PLAYING PAUSED STOPPED ERROR
  var actx = null;

  /* ---------- toast: the only "diagnostics" — speaks only when needed ---------- */
  var toastTimer = null;
  function toast(msg){
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
  }

  /* ---------- adaptive look (R5): phone=walkman, tablet=carry unit ---------- */
  var lookMode = "auto";
  var effectiveLook = "walkman";
  var mqTablet = window.matchMedia("(min-width: 768px)");
  function resolveLook(){
    effectiveLook = lookMode === "auto" ? (mqTablet.matches ? "boombox" : "walkman") : lookMode;
    document.body.classList.toggle("look-boombox", effectiveLook === "boombox");
    document.body.classList.toggle("look-walkman", effectiveLook === "walkman");
    $("lookToggle").textContent = "LOOK: " + (lookMode === "auto"
      ? "AUTO (" + (effectiveLook === "boombox" ? "CARRY" : "WALKMAN") + ")"
      : (effectiveLook === "boombox" ? "CARRY" : "WALKMAN"));
    checkRot();
  }
  if(mqTablet.addEventListener) mqTablet.addEventListener("change", resolveLook);
  else if(mqTablet.addListener) mqTablet.addListener(resolveLook);
  $("lookToggle").addEventListener("click", function(){
    clack();
    lookMode = lookMode === "auto" ? "walkman" : lookMode === "walkman" ? "boombox" : "auto";
    resolveLook();
  });

  /* ---------- portrait lock: deck never rotates ---------- */
  function checkRot(){
    var landscape = window.innerWidth > window.innerHeight;
    var lock = effectiveLook === "walkman" && landscape;
    document.body.classList.toggle("rotlock", lock);
  }
  window.addEventListener("resize", checkRot);
  window.addEventListener("orientationchange", function(){ setTimeout(checkRot, 60); });

  /* ---------- sounds: mechanical, no zap ---------- */
  function ensureCtx(){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
    }catch(e){}
  }
  function clack(){ // key click: short noise burst + tiny low knock
    ensureCtx(); if(!actx) return;
    try{
      var t = actx.currentTime;
      var len = Math.floor(actx.sampleRate * 0.03);
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
      var src = actx.createBufferSource(); src.buffer = buf;
      var f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1700; f.Q.value = 1.1;
      var g = actx.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.035);
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start(t);
      var o = actx.createOscillator(), g2 = actx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(65, t+0.05);
      g2.gain.setValueAtTime(0.16, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t+0.07);
      o.connect(g2); g2.connect(actx.destination);
      o.start(t); o.stop(t+0.08);
    }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate(8); }catch(e){}
  }
  function thunk(){ // deck engage / stop clunk: heavier low thump
    ensureCtx(); if(!actx) return;
    try{
      var t = actx.currentTime;
      var len = Math.floor(actx.sampleRate * 0.08);
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
      var src = actx.createBufferSource(); src.buffer = buf;
      var f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420;
      var g = actx.createGain();
      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.09);
      src.connect(f); f.connect(g); g.connect(actx.destination);
      src.start(t);
      var o = actx.createOscillator(), g2 = actx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(95, t);
      o.frequency.exponentialRampToValueAtTime(38, t+0.12);
      g2.gain.setValueAtTime(0.32, t);
      g2.gain.exponentialRampToValueAtTime(0.001, t+0.14);
      o.connect(g2); g2.connect(actx.destination);
      o.start(t); o.stop(t+0.15);
    }catch(e){}
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
  }
  var hissNode = null, hissGain = null;
  function setHiss(on){ // gentle tape hiss loop while playing
    ensureCtx(); if(!actx) return;
    try{
      if(on && !hissNode){
        var len = actx.sampleRate * 2;
        var buf = actx.createBuffer(1, len, actx.sampleRate);
        var d = buf.getChannelData(0);
        for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
        hissNode = actx.createBufferSource(); hissNode.buffer = buf; hissNode.loop = true;
        var f = actx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 5500; f.Q.value = 0.4;
        hissGain = actx.createGain(); hissGain.gain.value = 0;
        hissNode.connect(f); f.connect(hissGain); hissGain.connect(actx.destination);
        hissNode.start();
        hissGain.gain.setTargetAtTime(0.012, actx.currentTime, 0.4);
      } else if(!on && hissGain){
        hissGain.gain.setTargetAtTime(0, actx.currentTime, 0.15);
        var n = hissNode; hissNode = null; hissGain = null;
        setTimeout(function(){ try{ n.stop(); }catch(e){} }, 700);
      }
    }catch(e){}
  }

  /* ---------- state / UI ---------- */
  function setState(s){
    state = s;
    document.getElementById("cassette").classList.toggle("spinning", s==="PLAYING");
    document.body.classList.toggle("playing", s==="PLAYING");
    $("btnPlay").classList.toggle("active", s==="PLAYING");
    $("btnPause").classList.toggle("active", s==="PAUSED");
    setHiss(s==="PLAYING");
  }
  audio.addEventListener("ended", function(){ if(!isLive) setState("STOPPED"); });
  audio.addEventListener("error", function(){
    var m = {1:"loading stopped",2:"network problem",3:"can't decode that file",4:"that format isn't supported"};
    toast(m[audio.error && audio.error.code] || "audio problem");
    setState("ERROR");
  });

  function clearSpotify(){
    try{ $("spotFrame").src = ""; }catch(e){}
    $("spotifyBox").style.display = "none";
  }
  function loadTrack(i){
    if(i<0 || i>=tracks.length) return;
    current = i; isLive = false;
    clearSpotify();
    audio.src = tracks[i].url;
    $("titleLine").textContent = tracks[i].name.replace(/\.[a-z0-9]+$/i,"");
    document.body.classList.remove("ejected");
    renderList();
    setState("LOADED");
  }
  var PRESETS = [
    { name:"SomaFM Groove Salad", url:"https://ice1.somafm.com/groovesalad-128-mp3" },
    { name:"SomaFM Drone Zone",   url:"https://ice1.somafm.com/dronezone-128-mp3" },
    { name:"SomaFM DEF CON",      url:"https://ice1.somafm.com/defcon-128-mp3" },
    { name:"Radio Paradise",      url:"https://stream.radioparadise.com/mp3-192" },
    { name:"NPR News",            url:"https://npr-ice.streamguys1.com/live.mp3" }
  ];
  var liveName = "";
  function loadRadio(p){
    isLive = true; current = -1; liveName = p.name;
    clearSpotify();
    audio.src = p.url;
    $("titleLine").textContent = "RADIO · " + p.name;
    document.body.classList.remove("ejected");
    renderList();
    setState("LOADED");
    thunk();
    audio.play().then(function(){ setState("PLAYING"); })
      .catch(function(e){ toast("radio blocked: " + (e && e.message || e)); setState("ERROR"); });
  }
  function needTape(){
    if(current < 0 && !isLive){
      toast("no tape loaded — hit EJECT and pick music");
      doEject();
      return true;
    }
    return false;
  }

  /* ---------- transport ---------- */
  function doPlay(){
    if(needTape()) return;
    thunk();
    audio.play().then(function(){ setState("PLAYING"); })
      .catch(function(e){ toast("play blocked: " + (e && e.message || e)); setState("ERROR"); });
  }
  function doPause(){
    if(state === "PLAYING"){ audio.pause(); setState("PAUSED"); }
  }
  function doStop(){
    if(current < 0 && !isLive) return;
    thunk();
    audio.pause();
    if(!isLive){ try{ audio.currentTime = 0; }catch(e){} }
    setState("STOPPED");
  }
  function doEject(){
    thunk();
    try{ audio.pause(); }catch(e){}
    if(state === "PLAYING") setState("PAUSED");
    clearSpotify();
    document.body.classList.add("ejected");
    openDrawer(true);
    toast("TAPE EJECTED — pick music below");
  }
  function scrub(dir){
    if(isLive || current < 0 || !isFinite(audio.duration)) return;
    try{ audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + dir*2)); }catch(e){}
  }
  function nudge(dir){
    if(isLive || current < 0 || !isFinite(audio.duration)) return;
    try{ audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + dir*5)); }catch(e){}
  }

  function bindTap(id, fn){
    var el = $(id);
    el.addEventListener("pointerdown", function(e){ e.preventDefault(); clack(); fn(); });
  }
  bindTap("btnPlay", doPlay);
  bindTap("btnPause", doPause);
  bindTap("btnStop", doStop);
  bindTap("btnEject", doEject);

  function bindScrub(id, dir){
    var el = $(id), timer = null, t0 = 0, moved = false;
    el.addEventListener("pointerdown", function(e){
      e.preventDefault(); clack();
      t0 = Date.now(); moved = false;
      el.classList.add("down");
      timer = setInterval(function(){ moved = true; scrub(dir); }, 130);
    });
    function release(){
      if(timer){ clearInterval(timer); timer = null; }
      el.classList.remove("down");
      if(!moved && Date.now()-t0 < 250) nudge(dir);
    }
    el.addEventListener("pointerup", release);
    el.addEventListener("pointercancel", release);
    el.addEventListener("pointerleave", release);
  }
  bindScrub("btnRew", -1);
  bindScrub("btnFf", +1);

  /* ---------- library: local files ---------- */
  $("addBtn").addEventListener("click", function(){ clack(); $("fileInput").click(); });
  $("fileInput").addEventListener("change", function(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    files.forEach(function(f){
      tracks.push({ name: f.name, url: URL.createObjectURL(f) });
    });
    if(files.length && current < 0 && !isLive) loadTrack(0);
    renderList();
    e.target.value = "";
  });
  function renderList(){
    var ul = $("trackList");
    ul.innerHTML = "";
    tracks.forEach(function(t, i){
      var li = document.createElement("li");
      li.textContent = t.name;
      if(i === current) li.className = "current";
      li.addEventListener("click", function(){
        clack(); loadTrack(i); openDrawer(false); doPlay();
      });
      ul.appendChild(li);
    });
    $("emptyMsg").style.display = tracks.length ? "none" : "block";
    var btns = $("presetRow").children;
    for(var i=0;i<btns.length;i++)
      btns[i].classList.toggle("on", isLive && liveName === PRESETS[i].name);
  }

  /* ---------- library: radio presets ---------- */
  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "preset";
    b.textContent = p.name;
    b.addEventListener("click", function(){
      clack(); loadRadio(p); openDrawer(false);
    });
    $("presetRow").appendChild(b);
  });

  /* ---------- library: Spotify link → official embed player ---------- */
  $("spotLoad").addEventListener("click", function(){
    clack();
    var v = $("spotInput").value.trim();
    var m = v.match(/open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|playlist|episode|show)\/([A-Za-z0-9]+)/);
    if(!m){ toast("that doesn't look like a Spotify link"); return; }
    try{ audio.pause(); }catch(e){}
    if(state === "PLAYING") setState("PAUSED");
    isLive = false;
    $("spotFrame").src = "https://open.spotify.com/embed/" + m[1] + "/" + m[2] + "?utm_source=generator";
    $("spotifyBox").style.display = "block";
    $("titleLine").textContent = "SPOTIFY · " + m[1].toUpperCase();
    document.body.classList.remove("ejected");
    renderList();
    setState("LOADED");
    toast("Spotify plays in its own mini-player above (log in there for full songs)");
  });

  /* ---------- pull-down drawer ---------- */
  var drawer = $("drawer"), startY = 0, baseT = 0, dragging = false, movedPx = 0;
  function closedT(){ return -(drawer.offsetHeight - 46); }
  function openDrawer(open){ drawer.classList.toggle("open", open); }
  $("handle").addEventListener("touchstart", function(e){
    dragging = true; movedPx = 0;
    startY = e.touches[0].clientY;
    baseT = drawer.classList.contains("open") ? 0 : closedT();
    drawer.classList.add("dragging");
  }, {passive:true});
  drawer.addEventListener("touchmove", function(e){
    if(!dragging) return;
    var dy = e.touches[0].clientY - startY;
    movedPx = Math.max(movedPx, Math.abs(dy));
    var t = Math.max(closedT(), Math.min(0, baseT + dy));
    drawer.style.transform = "translateY(" + t + "px)";
  }, {passive:true});
  drawer.addEventListener("touchend", function(){
    if(!dragging) return;
    dragging = false;
    drawer.classList.remove("dragging");
    drawer.style.transform = "";
    if(movedPx < 8){ openDrawer(!drawer.classList.contains("open")); return; }
    var mid = closedT()/2;
    openDrawer(true);
    var rect = drawer.getBoundingClientRect();
    openDrawer(rect.top > mid);
  });
  $("handle").addEventListener("click", function(){
    if(movedPx < 8) openDrawer(!drawer.classList.contains("open"));
  });

  renderList(); resolveLook(); checkRot(); setState("IDLE");
})();
</script>
</body>
</html>
