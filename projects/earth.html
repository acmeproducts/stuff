<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Earth Explorer</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; }
  #renderCanvas { width:100%; height:100%; outline:none; display:block; }
  #hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  #topHud { position:absolute; top:8px; left:8px; color:#0f0; background:rgba(0,0,0,0.45); font-family:monospace; font-size:15px; text-shadow:1px 1px 0 #000; line-height:1.45; padding:6px 8px; border-radius:4px; max-width:92vw; }
  #errBox { position:absolute; bottom:8px; left:8px; right:8px; color:#f66; background:rgba(0,0,0,0.75); font-family:monospace; font-size:13px; padding:8px; border-radius:4px; max-height:30%; overflow:auto; display:none; pointer-events:auto; white-space:pre-wrap; cursor:pointer; }
  #controls { position:absolute; bottom:8px; right:8px; pointer-events:auto; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  button { font-family:monospace; font-size:15px; padding:10px 14px; border:none; border-radius:4px; background:rgba(255,255,255,0.88); color:#000; touch-action:manipulation; }
  button:active { background:rgba(200,200,200,0.95); }
  #btnGear { position:absolute; top:8px; right:8px; pointer-events:auto; z-index:5; font-size:18px; }
  #modalWrap { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55); display:none; pointer-events:auto; z-index:10; }
  #modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(92vw,420px); max-height:86vh; overflow:auto; background:#101418; color:#dfe; font-family:monospace; border:1px solid #3a4; border-radius:8px; padding:14px 16px; font-size:14px; box-sizing:border-box; }
  #modal h2 { margin:0 0 10px; font-size:16px; color:#8f8; }
  #modal .sec { margin-bottom:14px; }
  #modal label { display:block; margin:6px 0 2px; color:#9c9; }
  #modal input[type=range] { width:100%; }
  #modal input[type=number], #modal select { width:100%; box-sizing:border-box; font-family:monospace; font-size:14px; padding:6px; background:#1c232b; color:#dfe; border:1px solid #456; border-radius:4px; }
  #modal .row { display:flex; gap:8px; }
  #modal .row > * { flex:1; }
  #modal .val { color:#8f8; }
  #modal .keys { color:#8aa; font-size:12px; line-height:1.5; }
  #modalBtns { display:flex; gap:8px; margin-top:8px; }
  #modalBtns button { flex:1; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud">
  <div id="topHud">Loading...</div>
  <div id="errBox"></div>
  <button id="btnGear">&#9881;</button>
  <div id="controls">
    <button id="btnFly">Fly</button>
  </div>
  <div id="modalWrap">
    <div id="modal">
      <h2>Settings</h2>
      <div class="sec">
        <label>Detail</label>
        <select id="optDetail">
          <option value="LOW">LOW (fast)</option>
          <option value="MED">MED</option>
          <option value="HIGH">HIGH</option>
        </select>
        <label style="margin-top:6px"><input type="checkbox" id="optImagery" checked> Satellite imagery (real map photos)</label>
      </div>
      <div class="sec">
        <label>Top speed — walk <span class="val" id="walkVal">5</span> / fly <span class="val" id="flyVal">40</span></label>
        <input type="range" id="optWalk" min="1" max="25" step="0.5" value="5">
        <input type="range" id="optFly" min="5" max="300" step="5" value="40">
      </div>
      <div class="sec">
        <label>Time of day <span class="val" id="todVal">12:00</span></label>
        <input type="range" id="optTod" min="0" max="24" step="0.25" value="12">
      </div>
      <div class="sec">
        <label>Jump to location</label>
        <select id="optPreset">
          <option value="">— presets —</option>
          <option value="37.7749,-122.4194">San Francisco</option>
          <option value="40.7128,-74.0060">New York</option>
          <option value="51.5074,-0.1278">London</option>
          <option value="48.8584,2.2945">Paris</option>
          <option value="35.6762,139.6503">Tokyo</option>
          <option value="-33.8688,151.2093">Sydney</option>
          <option value="27.9881,86.9250">Mt Everest</option>
        </select>
        <div class="row" style="margin-top:6px">
          <input type="number" id="optLat" step="0.0001" min="-85" max="85" placeholder="lat">
          <input type="number" id="optLon" step="0.0001" min="-180" max="180" placeholder="lon">
        </div>
        <div id="modalBtns">
          <button id="btnJump">Jump</button>
        </div>
      </div>
      <div class="sec">
        <label>Controls — look damping <span class="val" id="sensVal">3000</span> (lower = faster)</label>
        <input type="range" id="optSens" min="500" max="10000" step="100" value="3000">
        <label style="margin-top:6px"><input type="checkbox" id="optInvertY"> Invert Y axis</label>
        <div class="keys" style="margin-top:6px">
          WASD move &middot; mouse drag / pointer-lock look &middot; wheel &amp; pinch zoom &middot; F fly/walk &middot; touch: drag to move/look
        </div>
      </div>
      <div id="modalBtns">
        <button id="btnClose">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const BUILD = 'M3.3-visual 2026-09-30';
const errBox = document.getElementById('errBox');
function showErr(msg) {
  errBox.style.display = 'block';
  const lines = (errBox.textContent + msg + '\n').split('\n');
  errBox.textContent = lines.slice(-9).join('\n');
}
errBox.addEventListener('click', function() {
  errBox.textContent = '';
  errBox.style.display = 'none';
});
window.onerror = function(msg, src, line, col, err) {
  showErr('ERR: ' + msg + ' @' + line + ':' + col);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  showErr('PROMISE: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
});

const CDN_URLS = [
  'https://cdn.babylonjs.com/babylon.js',
  'https://cdn.jsdelivr.net/npm/babylonjs@7/babylon.js',
  'https://unpkg.com/babylonjs@7/babylon.js'
];

function loadScript(url) {
  return new Promise(function(resolve, reject) {
    const s = document.createElement('script');
    s.src = url;
    s.onload = function() { resolve(); };
    s.onerror = function() { reject(new Error('script load failed')); };
    document.head.appendChild(s);
  });
}

async function loadBabylon() {
  let lastErr = null;
  for (let i = 0; i < CDN_URLS.length; i++) {
    try {
      await loadScript(CDN_URLS[i]);
      if (typeof window.BABYLON === 'undefined') throw new Error('BABYLON undefined after load');
      return CDN_URLS[i];
    } catch (e) {
      lastErr = e;
    }
  }
  throw new Error('All Babylon CDNs failed (' + (lastErr ? lastErr.message : 'unknown') + ')');
}

(function init() {
  loadBabylon().then(function(cdn) {
    try {
      startApp(cdn);
    } catch (e) {
      showErr('FATAL: ' + (e && e.stack ? e.stack : e));
    }
  }).catch(function(e) {
    showErr('FATAL: ' + e.message);
  });
})();

function startApp(cdnUrl) {
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.5, 0.7, 0.95, 1);

  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.00035;
  scene.fogColor = new BABYLON.Color3(0.6, 0.75, 0.9);

  const sky = BABYLON.MeshBuilder.CreateBox('sky', { size: 10000 }, scene);
  const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
  skyMat.backFaceCulling = false;
  skyMat.disableLighting = true;
  skyMat.fogEnabled = false;
  skyMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
  skyMat.specularColor = new BABYLON.Color3(0, 0, 0);
  skyMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
  sky.material = skyMat;
  sky.infiniteDistance = true;

  const skyDT = new BABYLON.DynamicTexture('skyDT', { width: 4, height: 256 }, scene, true);
  skyDT.hasAlpha = false;
  skyDT.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
  skyDT.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
  skyMat.emissiveTexture = skyDT;

  function css(c) {
    return 'rgb(' + Math.round(Math.min(Math.max(c.r, 0), 1) * 255) + ',' +
      Math.round(Math.min(Math.max(c.g, 0), 1) * 255) + ',' +
      Math.round(Math.min(Math.max(c.b, 0), 1) * 255) + ')';
  }
  function paintSky(top, hor) {
    try {
      const ctx = skyDT.getContext();
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, css(top));
      g.addColorStop(0.6, css(hor));
      g.addColorStop(1, css(hor.scale(0.75)));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 4, 256);
      skyDT.update();
    } catch (e) {}
  }

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.5), scene);
  sun.intensity = 1.15;
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.6;
  hemi.groundColor = new BABYLON.Color3(0.4, 0.38, 0.34);

  const camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 100, 0), scene);
  camera.minZ = 0.3;
  camera.maxZ = 20000;
  camera.attachControl(canvas, true);
  camera.speed = 5;
  camera.angularSensibility = 3000;
  camera.keysUp.push(87);
  camera.keysDown.push(83);
  camera.keysLeft.push(65);
  camera.keysRight.push(68);

  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  canvas.addEventListener('click', function() {
    if (!document.pointerLockElement && canvas.requestPointerLock) {
      try {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function() {});
      } catch (e) {}
    }
  });

  // ---- settings (persisted) ----
  const settings = { detail: 'MED', walkSpeed: 5, flySpeed: 40, tod: 12, sens: 3000, invertY: false, imagery: true };
  try {
    const s = JSON.parse(localStorage.getItem('earthSettings') || 'null');
    if (s) for (const k in settings) { if (typeof s[k] === typeof settings[k]) settings[k] = s[k]; }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem('earthSettings', JSON.stringify(settings)); } catch (e) {}
  }

  let flyMode = false;
  const eyeHeight = 1.7;

  const EARTH_R = 6378137;
  const DEG2RAD = Math.PI / 180;

  function latLonToTile(lat, lon, z) {
    const n = Math.pow(2, z);
    const x = Math.floor((lon + 180) / 360 * n);
    const latRad = lat * DEG2RAD;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x: x, y: y, n: n };
  }

  function tileMeters(z) {
    return 2 * Math.PI * EARTH_R / Math.pow(2, z);
  }

  function hash2(x, y) {
    const s = Math.sin(x * 12.9898 + y * 78.233 + 37.719) * 43758.5453;
    return s - Math.floor(s);
  }
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const a = hash2(ix, iy);
    const b = hash2(ix + 1, iy);
    const c = hash2(ix, iy + 1);
    const d = hash2(ix + 1, iy + 1);
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (d - c - (b - a)) * ux * uy;
  }
  function fBm(x, y, octaves, lac, gain) {
    let total = 0, amp = 1, freq = 1, norm = 0;
    for (let i = 0; i < octaves; i++) {
      total += noise2(x * freq, y * freq) * amp;
      norm += amp;
      amp *= gain;
      freq *= lac;
    }
    return total / norm;
  }

  const SF = { lat: 37.7749, lon: -122.4194 };
  const zoom = 15;
  const NZ = Math.pow(2, zoom);
  let originTx = 0, originTy = 0, TILE_M = 1;

  function tileFrac(lat, lon) {
    const latRad = lat * DEG2RAD;
    return {
      x: (lon + 180) / 360 * NZ,
      y: (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * NZ
    };
  }

  function procHeight(gx, gy) {
    return 20 + fBm(gx * 0.006, gy * 0.006, 6, 2.0, 0.5) * 380;
  }

  function bilinear(h, px, py) {
    px = Math.min(Math.max(px, 0), 255);
    py = Math.min(Math.max(py, 0), 255);
    const x0 = Math.floor(px), y0 = Math.floor(py);
    const x1 = Math.min(x0 + 1, 255), y1 = Math.min(y0 + 1, 255);
    const fx = px - x0, fy = py - y0;
    const a = h[y0 * 256 + x0], b = h[y0 * 256 + x1];
    const c = h[y1 * 256 + x0], d = h[y1 * 256 + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }

  function heightColor(h) {
    if (h < 0) return new BABYLON.Color3(0.1, 0.3, 0.5);
    if (h < 5) return new BABYLON.Color3(0.75, 0.7, 0.4);
    if (h < 100) return new BABYLON.Color3(0.25, 0.55, 0.15);
    if (h < 500) return new BABYLON.Color3(0.4, 0.35, 0.25);
    if (h < 1500) return new BABYLON.Color3(0.5, 0.45, 0.4);
    return new BABYLON.Color3(0.85, 0.85, 0.9);
  }

  const tiles = new Map();
  const CACHE = 3;
  const SKIRT = 14;

  const QUALITY = {
    LOW:  { subdiv: [48, 24, 12], ring: 2 },
    MED:  { subdiv: [96, 48, 24], ring: 2 },
    HIGH: { subdiv: [144, 72, 36], ring: 3 }
  };
  let RING = QUALITY[settings.detail] ? QUALITY[settings.detail].ring : 2;

  function lodForDist(d) {
    const s = (QUALITY[settings.detail] || QUALITY.MED).subdiv;
    return d <= 1 ? s[0] : (d === 2 ? s[1] : s[2]);
  }

  const terrainMat = new BABYLON.StandardMaterial('terrainMat', scene);
  terrainMat.specularColor = new BABYLON.Color3(0, 0, 0);
  terrainMat.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.4);
  terrainMat.backFaceCulling = false;

  function makeProcHeights(tx, ty) {
    const S = 64;
    const coarse = new Float32Array((S + 1) * (S + 1));
    for (let j = 0; j <= S; j++) {
      for (let i = 0; i <= S; i++) {
        coarse[j * (S + 1) + i] = procHeight(tx * 256 + i / S * 255, ty * 256 + j / S * 255);
      }
    }
    const h = new Float32Array(65536);
    for (let py = 0; py < 256; py++) {
      const fy = py / 255 * S;
      const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, S), wy = fy - y0;
      for (let px = 0; px < 256; px++) {
        const fx = px / 255 * S;
        const x0 = Math.floor(fx), x1 = Math.min(x0 + 1, S), wx = fx - x0;
        const a = coarse[y0 * (S + 1) + x0], b = coarse[y0 * (S + 1) + x1];
        const c = coarse[y1 * (S + 1) + x0], d = coarse[y1 * (S + 1) + x1];
        h[py * 256 + px] = a + (b - a) * wx + (c - a) * wy + (a - b - c + d) * wx * wy;
      }
    }
    return h;
  }

  function buildTileMesh(t) {
    const N = t.lod, nb = N + 1;
    const positions = [], indices = [], normals = [], uvs = [], colors = [];
    for (let j = 0; j < nb; j++) {
      for (let i = 0; i < nb; i++) {
        const h = bilinear(t.heights, i / N * 255, j / N * 255);
        positions.push((i / N - 0.5) * TILE_M, h, (0.5 - j / N) * TILE_M);
        uvs.push(i / N, j / N);
        const c = heightColor(h);
        colors.push(c.r, c.g, c.b, 1);
      }
    }
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * nb + i, b = a + 1, c = a + nb, d = c + 1;
        indices.push(a, b, c, b, d, c);
      }
    }
    const edges = [
      function(k) { return k; },
      function(k) { return N * nb + k; },
      function(k) { return k * nb; },
      function(k) { return k * nb + N; }
    ];
    for (let e = 0; e < 4; e++) {
      const getIdx = edges[e];
      let prevTop = -1, prevSk = -1;
      for (let k = 0; k < nb; k++) {
        const top = getIdx(k);
        const s = positions.length / 3;
        positions.push(positions[top * 3], positions[top * 3 + 1] - SKIRT, positions[top * 3 + 2]);
        uvs.push(uvs[top * 2], uvs[top * 2 + 1]);
        colors.push(colors[top * 4], colors[top * 4 + 1], colors[top * 4 + 2], 1);
        if (prevTop >= 0) {
          indices.push(prevTop, prevSk, top, top, prevSk, s);
        }
        prevTop = top; prevSk = s;
      }
    }
    BABYLON.VertexData.ComputeNormals(positions, indices, normals);
    const vd = new BABYLON.VertexData();
    vd.positions = positions;
    vd.indices = indices;
    vd.normals = normals;
    vd.uvs = uvs;
    vd.colors = colors;
    const mesh = new BABYLON.Mesh('t' + t.key, scene);
    vd.applyToMesh(mesh);
    mesh.material = terrainMat;
    return mesh;
  }

  function applyImagery(t) {
    if (!t.mesh || !t.imgTex) return;
    const n = t.mesh.getTotalVertices();
    const whites = new Float32Array(n * 4);
    whites.fill(1);
    t.mesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, whites);
    if (!t.imgMat) {
      t.imgMat = terrainMat.clone('im' + t.key);
      t.imgMat.ambientColor = new BABYLON.Color3(0.55, 0.55, 0.55);
    }
    t.imgMat.diffuseTexture = t.imgTex;
    t.mesh.material = t.imgMat;
  }

  function disposeTileExtras(t) {
    if (t.imgTex) { t.imgTex.dispose(); t.imgTex = null; }
    if (t.imgMat) { t.imgMat.dispose(); t.imgMat = null; }
  }

  function rebuildMesh(t) {
    if (t.mesh) { t.mesh.dispose(); t.mesh = null; }
    t.mesh = buildTileMesh(t);
    t.mesh.position.set((t.tx - originTx) * TILE_M, 0, -(t.ty - originTy) * TILE_M);
    if (settings.imagery && t.imgTex) applyImagery(t);
  }

  function decodePng(blob) {
    return new Promise(function(resolve, reject) {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function() {
        try {
          const c = document.createElement('canvas');
          c.width = 256; c.height = 256;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 256, 256);
          URL.revokeObjectURL(url);
          resolve(ctx.getImageData(0, 0, 256, 256).data);
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        reject(new Error('PNG decode failed'));
      };
      img.src = url;
    });
  }

  const ELEV_HOSTS = [
    function(z, x, y) { return 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + z + '/' + x + '/' + y + '.png'; },
    function(z, x, y) { return 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/' + z + '/' + x + '/' + y + '.png'; }
  ];
  const IMG_HOSTS = [
    function(z, x, y) { return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x; },
    function(z, x, y) { return 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png'; }
  ];
  let netFails = 0;
  let lastNetErr = '';
  let imgOk = 0;
  let imgFails = 0;
  let dlActive = 0;
  const dlQueue = [];
  const DL_MAX = 6;

  function pumpDl() {
    while (dlActive < DL_MAX && dlQueue.length > 0) {
      const job = dlQueue.shift();
      dlActive++;
      job().catch(function() {}).then(function() {
        dlActive--;
        pumpDl();
      });
    }
  }
  function queueDl(job) {
    dlQueue.push(job);
    pumpDl();
  }

  async function fetchElev(t) {
    const fx = ((t.tx % NZ) + NZ) % NZ;
    const fy = Math.min(Math.max(t.ty, 0), NZ - 1);
    let lastErr = null;
    for (let h = 0; h < ELEV_HOSTS.length; h++) {
      if (!tiles.has(t.key)) return;
      const ctrl = new AbortController();
      const timer = setTimeout(function() { ctrl.abort(); }, 12000);
      try {
        const resp = await fetch(ELEV_HOSTS[h](zoom, fx, fy), { mode: 'cors', signal: ctrl.signal });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await decodePng(await resp.blob());
        if (!tiles.has(t.key)) return;
        const hh = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) {
          hh[i] = data[i * 4] * 256 + data[i * 4 + 1] + data[i * 4 + 2] / 256 - 32768;
        }
        t.heights = hh;
        t.state = 'terr';
        rebuildMesh(t);
        return;
      } catch (e) {
        lastErr = e;
      } finally {
        clearTimeout(timer);
      }
    }
    if (!tiles.has(t.key)) return;
    t.state = 'proc';
    netFails++;
    lastNetErr = (lastErr && lastErr.message) ? lastErr.message : String(lastErr);
  }

  async function fetchImagery(t) {
    if (!settings.imagery) return;
    const fx = ((t.tx % NZ) + NZ) % NZ;
    const fy = Math.min(Math.max(t.ty, 0), NZ - 1);
    for (let h = 0; h < IMG_HOSTS.length; h++) {
      if (!tiles.has(t.key) || !settings.imagery) return;
      const ctrl = new AbortController();
      const timer = setTimeout(function() { ctrl.abort(); }, 12000);
      try {
        const resp = await fetch(IMG_HOSTS[h](zoom, fx, fy), { mode: 'cors', signal: ctrl.signal });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const tex = new BABYLON.Texture(objUrl, scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
          function() { URL.revokeObjectURL(objUrl); },
          function() { URL.revokeObjectURL(objUrl); });
        tex.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
        tex.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
        if (!tiles.has(t.key) || !settings.imagery) { tex.dispose(); return; }
        t.imgTex = tex;
        applyImagery(t);
        imgOk++;
        return;
      } catch (e) {
      } finally {
        clearTimeout(timer);
      }
    }
    if (tiles.has(t.key)) imgFails++;
  }

  function ensureTile(tx, ty, d) {
    const key = tx + ',' + ty;
    const want = lodForDist(d);
    let t = tiles.get(key);
    if (t) {
      if (t.lod !== want) { t.lod = want; rebuildMesh(t); }
      return;
    }
    t = { key: key, tx: tx, ty: ty, lod: want, state: 'proc', heights: makeProcHeights(tx, ty), mesh: null, imgTex: null, imgMat: null };
    tiles.set(key, t);
    rebuildMesh(t);
    queueDl(function() { return fetchElev(t); });
    queueDl(function() { return fetchImagery(t); });
  }

  function updateStreaming(ptx, pty) {
    for (let dy = -RING; dy <= RING; dy++) {
      for (let dx = -RING; dx <= RING; dx++) {
        ensureTile(ptx + dx, pty + dy, Math.max(Math.abs(dx), Math.abs(dy)));
      }
    }
    for (const entry of tiles) {
      const key = entry[0], t = entry[1];
      const d = Math.max(Math.abs(t.tx - ptx), Math.abs(t.ty - pty));
      if (d > CACHE) {
        if (t.mesh) t.mesh.dispose();
        disposeTileExtras(t);
        tiles.delete(key);
      }
    }
  }

  function worldHeight(x, z) {
    const txf = x / TILE_M + originTx + 0.5;
    const tyf = -z / TILE_M + originTy + 0.5;
    const tx = Math.floor(txf), ty = Math.floor(tyf);
    const t = tiles.get(tx + ',' + ty);
    const px = (txf - tx) * 256, py = (tyf - ty) * 256;
    if (t) return bilinear(t.heights, px, py);
    return procHeight(txf * 256, tyf * 256);
  }

  let lastPTx = 0, lastPTy = 0;

  function teleport(lat, lon) {
    lat = Math.min(Math.max(lat, -85), 85);
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const o = latLonToTile(lat, lon, zoom);
    originTx = o.x;
    originTy = o.y;
    TILE_M = tileMeters(zoom) * Math.max(Math.cos(lat * DEG2RAD), 0.01);
    for (const t of tiles.values()) {
      if (t.mesh) t.mesh.dispose();
      disposeTileExtras(t);
    }
    tiles.clear();
    const f = tileFrac(lat, lon);
    const wx = (f.x - originTx - 0.5) * TILE_M;
    const wz = -(f.y - originTy - 0.5) * TILE_M;
    lastPTx = Math.round(wx / TILE_M) + originTx;
    lastPTy = Math.round(-wz / TILE_M) + originTy;
    updateStreaming(lastPTx, lastPTy);
    camera.position.set(wx, worldHeight(wx, wz) + eyeHeight, wz);
  }

  function setQuality(q) {
    if (!QUALITY[q]) return;
    settings.detail = q;
    RING = QUALITY[q].ring;
    for (const t of tiles.values()) {
      const d = Math.max(Math.abs(t.tx - lastPTx), Math.abs(t.ty - lastPTy));
      const want = lodForDist(d);
      if (t.lod !== want) { t.lod = want; rebuildMesh(t); }
    }
    updateStreaming(lastPTx, lastPTy);
  }

  teleport(SF.lat, SF.lon);

  // ---- fly / walk ----
  const btnFly = document.getElementById('btnFly');
  function applySpeeds() {
    camera.speed = flyMode ? settings.flySpeed : settings.walkSpeed;
  }
  function setFly(v) {
    flyMode = v;
    btnFly.textContent = flyMode ? 'Walk' : 'Fly';
    applySpeeds();
  }
  btnFly.addEventListener('click', function() { setFly(!flyMode); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'f' || e.key === 'F') setFly(!flyMode);
  });
  applySpeeds();

  // ---- zoom: wheel + pinch (FOV based, 1x..8x) ----
  const BASE_FOV = camera.fov;
  let zoomMult = 1;
  function setZoom(mult) {
    zoomMult = Math.min(Math.max(mult, 1), 8);
    camera.fov = BASE_FOV / zoomMult;
  }
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    setZoom(zoomMult * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });

  const pinchPts = new Map();
  let pinchD0 = 0, pinchZ0 = 1;
  canvas.addEventListener('pointerdown', function(e) {
    if (e.pointerType !== 'touch') return;
    pinchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchPts.size === 2) {
      const p = [];
      for (const v of pinchPts.values()) p.push(v);
      pinchD0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      pinchZ0 = zoomMult;
    }
  });
  canvas.addEventListener('pointermove', function(e) {
    if (!pinchPts.has(e.pointerId)) return;
    pinchPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchPts.size === 2 && pinchD0 > 0) {
      const p = [];
      for (const v of pinchPts.values()) p.push(v);
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      if (d > 0) setZoom(pinchZ0 * d / pinchD0);
    }
  });
  function pinchEnd(e) {
    pinchPts.delete(e.pointerId);
    if (pinchPts.size < 2) pinchD0 = 0;
  }
  canvas.addEventListener('pointerup', pinchEnd);
  canvas.addEventListener('pointercancel', pinchEnd);

  // ---- time of day ----
  const dayTop = new BABYLON.Color3(0.2, 0.45, 0.85);
  const dayHor = new BABYLON.Color3(0.7, 0.82, 0.94);
  const nightTop = new BABYLON.Color3(0.01, 0.02, 0.06);
  const nightHor = new BABYLON.Color3(0.05, 0.08, 0.14);
  const sunsetHor = new BABYLON.Color3(0.98, 0.5, 0.24);
  function fmtTOD(h) {
    const hh = Math.floor(h) % 24;
    const mm = Math.floor((h - Math.floor(h)) * 60);
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function applyTOD() {
    const h = settings.tod;
    const elev = Math.sin((h - 6) / 12 * Math.PI);
    const daylight = Math.min(Math.max(elev, 0), 1);
    const az = (h - 12) / 12 * Math.PI;
    if (elev <= 0) {
      sun.direction = new BABYLON.Vector3(0.2, -1, 0.3).normalize();
    } else {
      sun.direction = new BABYLON.Vector3(Math.sin(az), -elev, Math.cos(az) * 0.5).normalize();
    }
    sun.intensity = 0.15 + 1.1 * daylight;
    hemi.intensity = 0.28 + 0.38 * daylight;
    const dl = Math.min(daylight + 0.06, 1);
    let top = BABYLON.Color3.Lerp(nightTop, dayTop, dl);
    let hor = BABYLON.Color3.Lerp(nightHor, dayHor, dl);
    const sunset = Math.max(0, 1 - Math.abs(elev) / 0.3);
    if (sunset > 0) hor = BABYLON.Color3.Lerp(hor, sunsetHor, sunset * 0.65);
    paintSky(top, hor);
    scene.fogColor = hor;
    scene.clearColor = new BABYLON.Color4(hor.r, hor.g, hor.b, 1);
  }
  applyTOD();

  camera.angularSensibility = settings.sens;

  // ---- settings modal wiring ----
  const modalWrap = document.getElementById('modalWrap');
  const optDetail = document.getElementById('optDetail');
  const optImagery = document.getElementById('optImagery');
  const optWalk = document.getElementById('optWalk');
  const optFly = document.getElementById('optFly');
  const optTod = document.getElementById('optTod');
  const optSens = document.getElementById('optSens');
  const optInvertY = document.getElementById('optInvertY');
  const optPreset = document.getElementById('optPreset');
  const optLat = document.getElementById('optLat');
  const optLon = document.getElementById('optLon');
  const walkVal = document.getElementById('walkVal');
  const flyVal = document.getElementById('flyVal');
  const todVal = document.getElementById('todVal');
  const sensVal = document.getElementById('sensVal');

  optDetail.value = settings.detail;
  optImagery.checked = settings.imagery;
  optWalk.value = settings.walkSpeed;
  optFly.value = settings.flySpeed;
  optTod.value = settings.tod;
  optSens.value = settings.sens;
  optInvertY.checked = settings.invertY;
  walkVal.textContent = settings.walkSpeed;
  flyVal.textContent = settings.flySpeed;
  todVal.textContent = fmtTOD(settings.tod);
  sensVal.textContent = settings.sens;

  document.getElementById('btnGear').addEventListener('click', function() {
    modalWrap.style.display = 'block';
  });
  function closeModal() {
    modalWrap.style.display = 'none';
    saveSettings();
  }
  document.getElementById('btnClose').addEventListener('click', closeModal);
  modalWrap.addEventListener('click', function(e) {
    if (e.target === modalWrap) closeModal();
  });

  optDetail.addEventListener('change', function() {
    setQuality(optDetail.value);
    saveSettings();
  });
  optImagery.addEventListener('change', function() {
    settings.imagery = optImagery.checked;
    saveSettings();
    for (const t of tiles.values()) {
      if (settings.imagery) {
        if (!t.imgTex) queueDl(function() { return fetchImagery(t); });
        else applyImagery(t);
      } else {
        disposeTileExtras(t);
        rebuildMesh(t);
      }
    }
  });
  optWalk.addEventListener('input', function() {
    settings.walkSpeed = parseFloat(optWalk.value) || 5;
    walkVal.textContent = optWalk.value;
    applySpeeds();
  });
  optFly.addEventListener('input', function() {
    settings.flySpeed = parseFloat(optFly.value) || 40;
    flyVal.textContent = optFly.value;
    applySpeeds();
  });
  optTod.addEventListener('input', function() {
    settings.tod = parseFloat(optTod.value) || 0;
    todVal.textContent = fmtTOD(settings.tod);
    applyTOD();
  });
  optSens.addEventListener('input', function() {
    settings.sens = parseFloat(optSens.value) || 3000;
    sensVal.textContent = optSens.value;
    camera.angularSensibility = settings.sens;
  });
  optInvertY.addEventListener('change', function() {
    settings.invertY = optInvertY.checked;
    saveSettings();
  });
  optPreset.addEventListener('change', function() {
    if (!optPreset.value) return;
    const parts = optPreset.value.split(',');
    optLat.value = parts[0];
    optLon.value = parts[1];
  });
  document.getElementById('btnJump').addEventListener('click', function() {
    const la = parseFloat(optLat.value), lo = parseFloat(optLon.value);
    if (isNaN(la) || isNaN(lo)) { showErr('JUMP: enter valid lat/lon'); return; }
    teleport(la, lo);
    closeModal();
  });

  // ---- per-frame ----
  scene.registerBeforeRender(function() {
    const ptx = Math.round(camera.position.x / TILE_M) + originTx;
    const pty = Math.round(-camera.position.z / TILE_M) + originTy;
    if (ptx !== lastPTx || pty !== lastPTy) {
      lastPTx = ptx; lastPTy = pty;
      updateStreaming(ptx, pty);
    }
    if (!flyMode) {
      camera.position.y = worldHeight(camera.position.x, camera.position.z) + eyeHeight;
    }
  });

  const topHud = document.getElementById('topHud');
  scene.onBeforeRenderObservable.add(function() {
    const fps = engine.getFps().toFixed(1);
    const tcfX = camera.position.x / TILE_M + originTx + 0.5;
    const tcfY = -camera.position.z / TILE_M + originTy + 0.5;
    let lon = tcfX / NZ * 360 - 180;
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * tcfY / NZ))) / DEG2RAD;
    let terr = 0, proc = 0;
    for (const t of tiles.values()) {
      if (t.state === 'terr') terr++; else proc++;
    }
    topHud.innerHTML = BUILD +
      '<br>FPS:' + fps +
      '<br>Lat:' + lat.toFixed(5) + ' Lon:' + lon.toFixed(5) +
      '<br>Alt:' + camera.position.y.toFixed(1) + 'm' +
      '<br>Mode:' + (flyMode ? 'FLY' : 'WALK') +
      ' Time:' + fmtTOD(settings.tod) +
      ' Q:' + settings.detail +
      (zoomMult !== 1 ? ' Zoom:' + zoomMult.toFixed(1) + 'x' : '') +
      '<br>Tiles:' + tiles.size + ' (ring ' + RING + ')' +
      '<br>SRC: TERR ' + terr + ' / PROC ' + proc +
      '<br>IMG: ' + (settings.imagery ? ('OK ' + imgOk + ' / FAIL ' + imgFails) : 'off') +
      '<br>NET fails:' + netFails + (lastNetErr ? ' (' + lastNetErr.slice(0, 40) + ')' : '') +
      '<br>CDN:' + cdnUrl.split('/')[2];
  });

  let prevRotX = camera.rotation.x;
  engine.runRenderLoop(function() {
    scene.render();
    if (settings.invertY) {
      const dx = camera.rotation.x - prevRotX;
      if (dx !== 0) camera.rotation.x = prevRotX - dx;
    }
    prevRotX = camera.rotation.x;
  });
  window.addEventListener('resize', function() { engine.resize(); });
}
</script>
</body>
</html>
