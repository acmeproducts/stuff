<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Earth Explorer</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; user-select:none; -webkit-user-select:none; }
  #renderCanvas { width:100%; height:100%; outline:none; display:block; }
  #hud { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  #topHud { position:absolute; top:8px; left:8px; color:#0f0; background:rgba(0,0,0,0.45); font-family:monospace; font-size:15px; text-shadow:1px 1px 0 #000; line-height:1.45; padding:6px 8px; border-radius:4px; max-width:92vw; }
  #errBox { position:absolute; bottom:8px; left:8px; right:8px; color:#f66; background:rgba(0,0,0,0.75); font-family:monospace; font-size:13px; padding:8px; border-radius:4px; max-height:30%; overflow:auto; display:none; pointer-events:auto; white-space:pre-wrap; cursor:pointer; }
  #controls { position:absolute; bottom:8px; right:8px; pointer-events:auto; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  button { font-family:monospace; font-size:15px; padding:10px 14px; border:none; border-radius:4px; background:rgba(255,255,255,0.88); color:#000; touch-action:manipulation; }
  button:active { background:rgba(200,200,200,0.95); }
  #btnGear { position:absolute; top:8px; right:8px; pointer-events:auto; z-index:5; font-size:18px; }
  #btnJumpTouch { position:absolute; bottom:92px; right:16px; display:none; z-index:4; width:78px; height:78px; border-radius:50%; padding:0; font-size:15px; font-weight:bold; background:rgba(255,255,255,0.72); }
  #stickBase { position:absolute; width:120px; height:120px; margin-left:-60px; margin-top:-60px; border:2px solid rgba(255,255,255,0.5); border-radius:50%; background:rgba(255,255,255,0.08); display:none; pointer-events:none; z-index:3; }
  #stickKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin-left:-26px; margin-top:-26px; border-radius:50%; background:rgba(255,255,255,0.55); }
  #modalWrap { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55); display:none; pointer-events:auto; z-index:10; }
  #modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:min(92vw,420px); max-height:86vh; overflow:auto; background:#101418; color:#dfe; font-family:monospace; border:1px solid #3a4; border-radius:8px; padding:14px 16px; font-size:14px; box-sizing:border-box; }
  #modal h2 { margin:0 0 10px; font-size:16px; color:#8f8; }
  #modal .sec { margin-bottom:14px; }
  #modal label { display:block; margin:6px 0 2px; color:#9c9; }
  #modal input[type=range] { width:100%; }
  #modal input[type=number], #modal select { width:100%; box-sizing:border-box; font-family:monospace; font-size:14px; padding:6px; background:#1c232b; color:#dfe; border:1px solid #456; border-radius:4px; }
  #modal .row { display:flex; gap:8px; }
  #modal .row > * { flex:1; }
  #modal .val { color:#8f8; }
  #modal .keys { color:#8aa; font-size:12px; line-height:1.5; }
  #modalBtns { display:flex; gap:8px; margin-top:8px; }
  #modalBtns button { flex:1; }
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="hud">
  <div id="topHud">Loading...</div>
  <div id="errBox"></div>
  <button id="btnGear">&#9881;</button>
  <div id="stickBase"><div id="stickKnob"></div></div>
  <button id="btnJumpTouch">JUMP</button>
  <div id="controls">
    <button id="btnFly">Fly</button>
  </div>
  <div id="modalWrap">
    <div id="modal">
      <h2>Settings</h2>
      <div class="sec">
        <label>Detail</label>
        <select id="optDetail">
          <option value="LOW">LOW (fast)</option>
          <option value="MED">MED</option>
          <option value="HIGH">HIGH</option>
        </select>
        <label style="margin-top:6px"><input type="checkbox" id="optImagery" checked> Satellite imagery (real map photos)</label>
      </div>
      <div class="sec">
        <label>Top speed — walk <span class="val" id="walkVal">5</span> / fly <span class="val" id="flyVal">40</span></label>
        <input type="range" id="optWalk" min="1" max="25" step="0.5" value="5">
        <input type="range" id="optFly" min="5" max="300" step="5" value="40">
      </div>
      <div class="sec">
        <label>Time of day <span class="val" id="todVal">12:00</span></label>
        <input type="range" id="optTod" min="0" max="24" step="0.25" value="12">
        <label style="margin-top:6px"><input type="checkbox" id="optAutoTod" checked> Auto day/night cycle (full day = 10 min)</label>
      </div>
      <div class="sec">
        <label>Weather &amp; season</label>
        <label><input type="checkbox" id="optClouds" checked> Clouds</label>
        <label><input type="checkbox" id="optRain"> Rain (heavier fog)</label>
        <label style="margin-top:4px">Season</label>
        <select id="optSeason">
          <option value="auto">AUTO (by date)</option>
          <option value="spring">Spring</option>
          <option value="summer">Summer</option>
          <option value="autumn">Autumn</option>
          <option value="winter">Winter</option>
        </select>
      </div>
      <div class="sec">
        <label>Jump to location</label>
        <select id="optPreset">
          <option value="">— presets —</option>
          <option value="37.7749,-122.4194">San Francisco</option>
          <option value="40.7128,-74.0060">New York</option>
          <option value="51.5074,-0.1278">London</option>
          <option value="48.8584,2.2945">Paris</option>
          <option value="35.6762,139.6503">Tokyo</option>
          <option value="-33.8688,151.2093">Sydney</option>
          <option value="27.9881,86.9250">Mt Everest</option>
        </select>
        <div class="row" style="margin-top:6px">
          <input type="number" id="optLat" step="0.0001" min="-85" max="85" placeholder="lat">
          <input type="number" id="optLon" step="0.0001" min="-180" max="180" placeholder="lon">
        </div>
        <div id="modalBtns">
          <button id="btnJump">Jump</button>
        </div>
      </div>
      <div class="sec">
        <label>Controls — look damping <span class="val" id="sensVal">3000</span> (lower = faster)</label>
        <input type="range" id="optSens" min="500" max="10000" step="100" value="3000">
        <label style="margin-top:6px"><input type="checkbox" id="optInvertY"> Invert Y axis</label>
        <label style="margin-top:8px">Touch controls</label>
        <select id="optTouch">
          <option value="auto">AUTO (show on first touch)</option>
          <option value="on">ON</option>
          <option value="off">OFF</option>
        </select>
        <div class="keys" style="margin-top:6px">
          WASD move &middot; mouse drag / pointer-lock look &middot; wheel &amp; pinch zoom &middot; F fly/walk<br>
          Touch: left-half thumb = move stick &middot; right-half drag = look &middot; pinch = zoom &middot; JUMP button (walk)
        </div>
      </div>
      <div id="modalBtns">
        <button id="btnClose">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
'use strict';
const BUILD = 'M6-weather 2026-09-30';
const errBox = document.getElementById('errBox');
function showErr(msg) {
  errBox.style.display = 'block';
  const lines = (errBox.textContent + msg + '\n').split('\n');
  errBox.textContent = lines.slice(-9).join('\n');
}
errBox.addEventListener('click', function() {
  errBox.textContent = '';
  errBox.style.display = 'none';
});
window.onerror = function(msg, src, line, col, err) {
  showErr('ERR: ' + msg + ' @' + line + ':' + col);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  showErr('PROMISE: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
});

const CDN_URLS = [
  'https://cdn.babylonjs.com/babylon.js',
  'https://cdn.jsdelivr.net/npm/babylonjs@7/babylon.js',
  'https://unpkg.com/babylonjs@7/babylon.js'
];

function loadScript(url) {
  return new Promise(function(resolve, reject) {
    const s = document.createElement('script');
    s.src = url;
    s.onload = function() { resolve(); };
    s.onerror = function() { reject(new Error('script load failed')); };
    document.head.appendChild(s);
  });
}

async function loadBabylon() {
  let lastErr = null;
  for (let i = 0; i < CDN_URLS.length; i++) {
    try {
      await loadScript(CDN_URLS[i]);
      if (typeof window.BABYLON === 'undefined') throw new Error('BABYLON undefined after load');
      return CDN_URLS[i];
    } catch (e) {
      lastErr = e;
    }
  }
  throw new Error('All Babylon CDNs failed (' + (lastErr ? lastErr.message : 'unknown') + ')');
}

(function init() {
  loadBabylon().then(function(cdn) {
    try {
      startApp(cdn);
    } catch (e) {
      showErr('FATAL: ' + (e && e.stack ? e.stack : e));
    }
  }).catch(function(e) {
    showErr('FATAL: ' + e.message);
  });
})();

function startApp(cdnUrl) {
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.5, 0.7, 0.95, 1);

  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.00035;
  scene.fogColor = new BABYLON.Color3(0.6, 0.75, 0.9);

  const sky = BABYLON.MeshBuilder.CreateBox('sky', { size: 10000 }, scene);
  const skyMat = new BABYLON.StandardMaterial('skyMat', scene);
  skyMat.backFaceCulling = false;
  skyMat.disableLighting = true;
  skyMat.fogEnabled = false;
  skyMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
  skyMat.specularColor = new BABYLON.Color3(0, 0, 0);
  skyMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
  sky.material = skyMat;
  sky.infiniteDistance = true;

  const skyDT = new BABYLON.DynamicTexture('skyDT', { width: 4, height: 256 }, scene, true);
  skyDT.hasAlpha = false;
  skyDT.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
  skyDT.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
  skyMat.emissiveTexture = skyDT;

  function css(c) {
    return 'rgb(' + Math.round(Math.min(Math.max(c.r, 0), 1) * 255) + ',' +
      Math.round(Math.min(Math.max(c.g, 0), 1) * 255) + ',' +
      Math.round(Math.min(Math.max(c.b, 0), 1) * 255) + ')';
  }
  function paintSky(top, hor) {
    try {
      const ctx = skyDT.getContext();
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0, css(top));
      g.addColorStop(0.6, css(hor));
      g.addColorStop(1, css(hor.scale(0.75)));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 4, 256);
      skyDT.update();
    } catch (e) {}
  }

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.5), scene);
  sun.intensity = 1.15;
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.6;
  hemi.groundColor = new BABYLON.Color3(0.4, 0.38, 0.34);

  const camera = new BABYLON.UniversalCamera('cam', new BABYLON.Vector3(0, 100, 0), scene);
  camera.minZ = 0.3;
  camera.maxZ = 20000;
  camera.attachControl(canvas, true);
  camera.speed = 5;
  camera.angularSensibility = 3000;
  camera.keysUp.push(87);
  camera.keysDown.push(83);
  camera.keysLeft.push(65);
  camera.keysRight.push(68);

  // M3.4: remove Babylon's built-in touch camera handling — all touch is routed
  // through our pointer-role state machine (stick / look / pinch) to avoid double-fire.
  try {
    if (camera.inputs && camera.inputs.attached) {
      if (camera.inputs.attached.touch) camera.inputs.remove(camera.inputs.attached.touch);
      if (camera.inputs.attached.mouse) camera.inputs.attached.mouse.touchEnabled = false;
    }
  } catch (e) {}

  canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  canvas.addEventListener('click', function() {
    if (!document.pointerLockElement && canvas.requestPointerLock) {
      try {
        const p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function() {});
      } catch (e) {}
    }
  });

  // ---- settings (persisted) ----
  const settings = { detail: 'MED', walkSpeed: 5, flySpeed: 40, tod: 12, sens: 3000, invertY: false, imagery: true, touchCtl: 'auto', autoTod: true, clouds: true, rain: false, season: 'auto' };
  try {
    const s = JSON.parse(localStorage.getItem('earthSettings') || 'null');
    if (s) for (const k in settings) { if (typeof s[k] === typeof settings[k]) settings[k] = s[k]; }
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem('earthSettings', JSON.stringify(settings)); } catch (e) {}
  }

  let flyMode = false;
  const eyeHeight = 1.7;
  let vy = 0;            // vertical velocity (jump)
  let airborne = false;  // true while a jump is in the air
  const GRAV = 25;
  const JUMP_V = 8.5;

  const EARTH_R = 6378137;
  const DEG2RAD = Math.PI / 180;

  function latLonToTile(lat, lon, z) {
    const n = Math.pow(2, z);
    const x = Math.floor((lon + 180) / 360 * n);
    const latRad = lat * DEG2RAD;
    const y = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
    return { x: x, y: y, n: n };
  }

  function tileMeters(z) {
    return 2 * Math.PI * EARTH_R / Math.pow(2, z);
  }

  function hash2(x, y) {
    const s = Math.sin(x * 12.9898 + y * 78.233 + 37.719) * 43758.5453;
    return s - Math.floor(s);
  }
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const a = hash2(ix, iy);
    const b = hash2(ix + 1, iy);
    const c = hash2(ix, iy + 1);
    const d = hash2(ix + 1, iy + 1);
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (d - c - (b - a)) * ux * uy;
  }
  function fBm(x, y, octaves, lac, gain) {
    let total = 0, amp = 1, freq = 1, norm = 0;
    for (let i = 0; i < octaves; i++) {
      total += noise2(x * freq, y * freq) * amp;
      norm += amp;
      amp *= gain;
      freq *= lac;
    }
    return total / norm;
  }

  const SF = { lat: 37.7749, lon: -122.4194 };
  const zoom = 15;
  const NZ = Math.pow(2, zoom);
  let originTx = 0, originTy = 0, TILE_M = 1;

  function tileFrac(lat, lon) {
    const latRad = lat * DEG2RAD;
    return {
      x: (lon + 180) / 360 * NZ,
      y: (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * NZ
    };
  }

  function procHeight(gx, gy) {
    return 20 + fBm(gx * 0.006, gy * 0.006, 6, 2.0, 0.5) * 380;
  }

  function bilinear(h, px, py) {
    px = Math.min(Math.max(px, 0), 255);
    py = Math.min(Math.max(py, 0), 255);
    const x0 = Math.floor(px), y0 = Math.floor(py);
    const x1 = Math.min(x0 + 1, 255), y1 = Math.min(y0 + 1, 255);
    const fx = px - x0, fy = py - y0;
    const a = h[y0 * 256 + x0], b = h[y0 * 256 + x1];
    const c = h[y1 * 256 + x0], d = h[y1 * 256 + x1];
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }

  function heightColor(h) {
    if (h < 0) return new BABYLON.Color3(0.1, 0.3, 0.5);
    if (h < 5) return new BABYLON.Color3(0.75, 0.7, 0.4);
    if (h < 100) return new BABYLON.Color3(0.25, 0.55, 0.15);
    if (h < 500) return new BABYLON.Color3(0.4, 0.35, 0.25);
    if (h < 1500) return new BABYLON.Color3(0.5, 0.45, 0.4);
    return new BABYLON.Color3(0.85, 0.85, 0.9);
  }

  const tiles = new Map();
  const CACHE = 3;
  const SKIRT = 14;

  const QUALITY = {
    LOW:  { subdiv: [48, 24, 12], ring: 2 },
    MED:  { subdiv: [96, 48, 24], ring: 2 },
    HIGH: { subdiv: [144, 72, 36], ring: 3 }
  };
  let RING = QUALITY[settings.detail] ? QUALITY[settings.detail].ring : 2;

  function lodForDist(d) {
    const s = (QUALITY[settings.detail] || QUALITY.MED).subdiv;
    return d <= 1 ? s[0] : (d === 2 ? s[1] : s[2]);
  }

  const terrainMat = new BABYLON.StandardMaterial('terrainMat', scene);
  terrainMat.specularColor = new BABYLON.Color3(0, 0, 0);
  terrainMat.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.4);
  terrainMat.backFaceCulling = false;

  function makeProcHeights(tx, ty) {
    const S = 64;
    const coarse = new Float32Array((S + 1) * (S + 1));
    for (let j = 0; j <= S; j++) {
      for (let i = 0; i <= S; i++) {
        coarse[j * (S + 1) + i] = procHeight(tx * 256 + i / S * 255, ty * 256 + j / S * 255);
      }
    }
    const h = new Float32Array(65536);
    for (let py = 0; py < 256; py++) {
      const fy = py / 255 * S;
      const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, S), wy = fy - y0;
      for (let px = 0; px < 256; px++) {
        const fx = px / 255 * S;
        const x0 = Math.floor(fx), x1 = Math.min(x0 + 1, S), wx = fx - x0;
        const a = coarse[y0 * (S + 1) + x0], b = coarse[y0 * (S + 1) + x1];
        const c = coarse[y1 * (S + 1) + x0], d = coarse[y1 * (S + 1) + x1];
        h[py * 256 + px] = a + (b - a) * wx + (c - a) * wy + (a - b - c + d) * wx * wy;
      }
    }
    return h;
  }

  // ---- M4 biomes: per-pixel land classification (procedural now, TiTiler upgrade later) ----
  const B_UNKNOWN = 0, B_OCEAN = 1, B_BEACH = 2, B_GRASS = 3, B_FOREST = 4,
        B_ROCK = 5, B_SNOW = 6, B_DESERT = 7, B_CROP = 8, B_URBAN = 9;
  const BIOME_COLORS = [];
  BIOME_COLORS[B_OCEAN]  = new BABYLON.Color3(0.10, 0.28, 0.48);
  BIOME_COLORS[B_BEACH]  = new BABYLON.Color3(0.78, 0.72, 0.52);
  BIOME_COLORS[B_GRASS]  = new BABYLON.Color3(0.30, 0.54, 0.20);
  BIOME_COLORS[B_FOREST] = new BABYLON.Color3(0.11, 0.33, 0.11);
  BIOME_COLORS[B_ROCK]   = new BABYLON.Color3(0.46, 0.43, 0.39);
  BIOME_COLORS[B_SNOW]   = new BABYLON.Color3(0.90, 0.90, 0.94);
  BIOME_COLORS[B_DESERT] = new BABYLON.Color3(0.80, 0.69, 0.44);
  BIOME_COLORS[B_CROP]   = new BABYLON.Color3(0.56, 0.60, 0.26);
  BIOME_COLORS[B_URBAN]  = new BABYLON.Color3(0.50, 0.50, 0.52);

  function biomeSample(t, px, py) {
    const ix = Math.min(Math.max(Math.round(px), 0), 255);
    const iy = Math.min(Math.max(Math.round(py), 0), 255);
    return t.biome[iy * 256 + ix];
  }
  function vertexColor(t, h, px, py) {
    if (t.biome) {
      const c = BIOME_COLORS[biomeSample(t, px, py)];
      if (c) return c;
    }
    return heightColor(h);
  }
  function classifyProc(h, lat, m) {
    const alat = Math.abs(lat);
    if (h <= 1) return B_OCEAN;
    const snowline = Math.max(1200, 3400 - 30 * alat);
    if (h > snowline || alat >= 72) return B_SNOW;
    if (h > snowline * 0.72 || alat >= 66) return B_ROCK;
    if (m < 0.30 && alat < 38 && h < 1500) return B_DESERT;
    if (m > 0.60 && h < 1800) return B_FOREST;
    if (m > 0.45 && h < 2200) return B_GRASS;
    if (m < 0.36 && h < 800) return B_DESERT;
    return B_GRASS;
  }
  function computeProcBiome(t) {
    const b = new Uint8Array(65536);
    const MS = 32;
    const moist = new Float32Array((MS + 1) * (MS + 1));
    for (let j = 0; j <= MS; j++) {
      for (let i = 0; i <= MS; i++) {
        moist[j * (MS + 1) + i] = fBm((t.tx * 256 + i / MS * 255) * 0.0016, (t.ty * 256 + j / MS * 255) * 0.0016, 3, 2.0, 0.5);
      }
    }
    for (let py = 0; py < 256; py++) {
      const gy = (t.ty * 256 + py) / (256 * NZ);
      const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * gy))) / DEG2RAD;
      const fy = py / 255 * MS;
      const y0 = Math.floor(fy), y1 = Math.min(y0 + 1, MS), wy = fy - y0;
      for (let px = 0; px < 256; px++) {
        const idx = py * 256 + px;
        const h = t.heights[idx];
        const fx = px / 255 * MS;
        const x0 = Math.floor(fx), x1 = Math.min(x0 + 1, MS), wx = fx - x0;
        const a = moist[y0 * (MS + 1) + x0], bb = moist[y0 * (MS + 1) + x1];
        const c = moist[y1 * (MS + 1) + x0], d = moist[y1 * (MS + 1) + x1];
        const m = a + (bb - a) * wx + (c - a) * wy + (a - bb - c + d) * wx * wy;
        b[idx] = classifyProc(h, lat, m);
      }
    }
    // beach pass: low land adjacent to water becomes sand
    for (let py = 0; py < 256; py++) {
      for (let px = 0; px < 256; px++) {
        const idx = py * 256 + px;
        if (b[idx] === B_OCEAN || b[idx] === B_SNOW) continue;
        if (t.heights[idx] > 4) continue;
        const x0 = Math.max(px - 28, 0), x1 = Math.min(px + 28, 255);
        const y0 = Math.max(py - 28, 0), y1 = Math.min(py + 28, 255);
        if (t.heights[py * 256 + x0] <= 1 || t.heights[py * 256 + x1] <= 1 ||
            t.heights[y0 * 256 + px] <= 1 || t.heights[y1 * 256 + px] <= 1) {
          b[idx] = B_BEACH;
        }
      }
    }
    return b;
  }

  function lcmToBiome(c) {
    if (c === 80 || c === 200) return B_OCEAN;
    if (c === 50) return B_URBAN;
    if (c === 40) return B_CROP;
    if (c >= 111 && c <= 126) return B_FOREST;
    if (c === 20 || c === 30 || c === 90) return B_GRASS;
    if (c === 60 || c === 100) return B_ROCK;
    if (c === 70) return B_SNOW;
    return 0;
  }
  const lcmState = { promise: null, href: null };
  let cogFails = 0;
  function pickTif(assets) {
    if (!assets) return null;
    for (const k in assets) {
      const h = assets[k] && assets[k].href;
      if (h && /\.tiff?(\?|$)/i.test(h)) return h;
    }
    return null;
  }
  async function lcmDiscover() {
    if (lcmState.promise) return lcmState.promise;
    lcmState.promise = (async function() {
      const tries = [
        'https://stac.terrascope.be/collections/lcfm-lcm-10/items?limit=1',
        'https://stac.terrascope.be/collections/lcfm-lcm-10'
      ];
      for (let i = 0; i < tries.length; i++) {
        const ctrl = new AbortController();
        const timer = setTimeout(function() { ctrl.abort(); }, 10000);
        try {
          const r = await fetch(tries[i], { mode: 'cors', signal: ctrl.signal });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const j = await r.json();
          let href = null;
          if (j && j.features && j.features[0]) href = pickTif(j.features[0].assets);
          if (!href && j) href = pickTif(j.assets);
          if (href) { lcmState.href = href; return href; }
        } catch (e) {
        } finally {
          clearTimeout(timer);
        }
      }
      return null;
    })();
    return lcmState.promise;
  }
  async function fetchLC(t) {
    const latC = Math.atan(Math.sinh(Math.PI * (1 - 2 * ((t.ty + 0.5) / NZ)))) / DEG2RAD;
    if (latC < -60 || latC > 83) return; // LCM-10 coverage band; stay procedural outside it
    const href = await lcmDiscover();
    if (!href || !tiles.has(t.key)) return;
    const fx = ((t.tx % NZ) + NZ) % NZ;
    const fy = Math.min(Math.max(t.ty, 0), NZ - 1);
    const url = 'https://titiler.terrascope.be/cog/tiles/WebMercatorQuad/' + zoom + '/' + fx + '/' + fy +
      '@1x.png?url=' + encodeURIComponent(href) + '&resampling=nearest';
    const ctrl = new AbortController();
    const timer = setTimeout(function() { ctrl.abort(); }, 12000);
    try {
      const resp = await fetch(url, { mode: 'cors', signal: ctrl.signal });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await decodePng(await resp.blob());
      if (!tiles.has(t.key)) return;
      let valid = 0;
      const nb = new Uint8Array(65536);
      for (let i = 0; i < 65536; i++) {
        const code = data[i * 4];
        if (code) valid++;
        nb[i] = lcmToBiome(code) || t.biome[i];
      }
      if (valid < 3000) throw new Error('empty classification');
      t.biome = nb;
      t.lcSrc = 'titi';
      rebuildMesh(t);
      scatterTile(t);
    } catch (e) {
      cogFails++;
      if (cogFails >= 3) lcmState.href = null; // circuit breaker: stop hammering a dead endpoint
    } finally {
      clearTimeout(timer);
    }
  }

  // ---- M4 vegetation: per-tile thin-instance scatter driven by biome ----
  const vegMat = new BABYLON.StandardMaterial('vegMat', scene);
  vegMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
  vegMat.specularColor = new BABYLON.Color3(0, 0, 0);
  vegMat.ambientColor = new BABYLON.Color3(0.45, 0.45, 0.45);

  function paintVerts(mesh, r, g, b) {
    const n = mesh.getTotalVertices();
    const arr = new Float32Array(n * 4);
    for (let i = 0; i < n; i++) {
      arr[i * 4] = r; arr[i * 4 + 1] = g; arr[i * 4 + 2] = b; arr[i * 4 + 3] = 1;
    }
    mesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, arr, true);
  }

  const treeTemplate = (function() {
    const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', { height: 1.4, diameterTop: 0.22, diameterBottom: 0.34, tessellation: 6 }, scene);
    trunk.position.y = 0.7;
    paintVerts(trunk, 0.32, 0.20, 0.10);
    const fol = BABYLON.MeshBuilder.CreateCylinder('fol', { height: 3.0, diameterTop: 0.02, diameterBottom: 2.0, tessellation: 7 }, scene);
    fol.position.y = 2.9;
    paintVerts(fol, 0.09, 0.30, 0.10);
    let tree = null;
    try { tree = BABYLON.Mesh.MergeMeshes([trunk, fol], true, true); } catch (e) { tree = null; }
    if (!tree) tree = fol;
    if (!tree.getVerticesData(BABYLON.VertexBuffer.ColorKind)) paintVerts(tree, 0.12, 0.32, 0.12);
    tree.material = vegMat;
    tree.setEnabled(false);

  })();

  const grassTemplate = (function() {
    const g = BABYLON.MeshBuilder.CreateCylinder('grassT', { height: 0.55, diameterTop: 0.04, diameterBottom: 0.5, tessellation: 5 }, scene);
    g.position.y = 0.27;
    paintVerts(g, 0.40, 0.50, 0.17);

  function makeScatter(template, items, name) {
    const m = template.clone(name);
    m.setEnabled(true);
    m.alwaysSelectAsActiveMesh = true; // template bounding box does not cover instances
    const f32 = new Float32Array(items.length * 16);
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const mtx = BABYLON.Matrix.Compose(
        new BABYLON.Vector3(it.s, it.s, it.s),
        BABYLON.Quaternion.RotationYaw(it.rot),
        new BABYLON.Vector3(it.x, it.y, it.z));
      mtx.copyToArray(f32, i * 16);
    }
    m.thinInstanceSetBuffer('matrix', f32, 16, true);
    return m;
  }

  function clearScatter(t) {
    if (t.treeMesh) { t.treeMesh.dispose(); t.treeMesh = null; }
    if (t.grassMesh) { t.grassMesh.dispose(); t.grassMesh = null; }
    t.vegCount = 0;
  }

  function scatterTile(t) {
    clearScatter(t);
    if (!t.mesh || !t.biome) return;
    const density = settings.detail === 'LOW' ? 0.4 : (settings.detail === 'HIGH' ? 1.8 : 1);
    const trees = [], grass = [];
    const K = 90;
    for (let k = 0; k < K; k++) {
      const px = hash2(t.tx * 3.1 + k * 0.713, t.ty * 7.7) * 255;
      const py = hash2(t.tx * 5.3, t.ty * 3.9 + k * 0.377) * 255;
      const r = hash2(t.tx * 11.7 + k * 0.517, t.ty * 13.1 + k * 0.911);
      const h = bilinear(t.heights, px, py);
      if (h < 2.5) continue; // no vegetation in water or on the beach
      const step = 3 / 256 * TILE_M;
      const sx = (bilinear(t.heights, Math.min(px + 3, 255), py) - bilinear(t.heights, Math.max(px - 3, 0), py)) / (2 * step);
      const sy = (bilinear(t.heights, px, Math.min(py + 3, 255)) - bilinear(t.heights, px, Math.max(py - 3, 0))) / (2 * step);
      if (Math.abs(sx) + Math.abs(sy) > 1.1) continue; // too steep
      const b = biomeSample(t, px, py);
      const wx = t.mesh.position.x + (px / 255 - 0.5) * TILE_M;
      const wz = t.mesh.position.z + (0.5 - py / 255) * TILE_M;
      const rot = r * Math.PI * 2;
      if ((b === B_FOREST && r < 0.85 * density) || (b === B_GRASS && r < 0.16 * density) ||
          (b === B_CROP && r < 0.08 * density) || (b === B_URBAN && r < 0.05 * density)) {
        trees.push({ x: wx, y: h - 0.1, z: wz, s: 0.75 + r * 0.9, rot: rot });
      } else if ((b === B_GRASS && r < 0.7 * density) || (b === B_CROP && r < 0.5 * density)) {
        grass.push({ x: wx, y: h - 0.05, z: wz, s: 0.8 + r * 0.8, rot: rot });
      }
    }
    if (trees.length > 0) t.treeMesh = makeScatter(treeTemplate, trees, 'sct' + t.key);
    if (grass.length > 0) t.grassMesh = makeScatter(grassTemplate, grass, 'scg' + t.key);
    t.vegCount = trees.length + grass.length;
  }

  // ---- M4 water: single animated sea-level plane following the player ----
  const water = BABYLON.MeshBuilder.CreateGround('water', { width: 1, height: 1 }, scene);

  const waterDT = new BABYLON.DynamicTexture('waterDT', { width: 128, height: 128 }, scene, true);
  (function() {

  // ---- M6 weather + seasons: drifting billboard clouds, rain particles, fog control, season palette ----
  const cloudTex = new BABYLON.DynamicTexture('cloudTex', { width: 128, height: 128 }, scene, true);

  (function() {

  const cloudRoot = new BABYLON.TransformNode('cloudRoot', scene);

  const CLOUD_N = 14;

    });

  const WIND_X = 6, WIND_Z = 2.2;
  function wrapBox(v, F) {

  function updateClouds(dt) {

  }

  const rainTex = new BABYLON.DynamicTexture('rainTex', { width: 16, height: 64 }, scene, true);

  const rainRoot = BABYLON.MeshBuilder.CreateBox('rainRoot', { size: 0.1 }, scene);

  let seasonNow = 'summer';
  function seasonFromDate() {
    const m = new Date().getMonth();

    if (m < 5) return 'spring';
    if (m < 8) return 'summer';
    return 'autumn';
  }
  const SEASON_TINT = {
    spring: [0.85, 1.0, 0.80],
    summer: [1.0, 1.0, 1.0],
    autumn: [1.0, 0.74, 0.48],

  };
  function applySeason() {

  }

  function applyWeather() {

  // ---- M5 city: Overpass roads + buildings with procedural fallback ----
  const OVERPASS_HOSTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];
  const AREA_T = 2; // tiles per city-area side
  const cityLive = new Map();  // areaKey -> {roads, buildings, status, feats}
  const cityData = new Map();  // areaKey -> {proc, elements} session cache (survives eviction)
  let osmConsecFails = 0;
  let osmBroken = false;       // circuit breaker: stops hammering a dead Overpass
  let osmBackoff = 5000;
  let cityPending = null;

  const cityMat = new BABYLON.StandardMaterial('cityMat', scene);
  cityMat.specularColor = new BABYLON.Color3(0, 0, 0);
  cityMat.ambientColor = new BABYLON.Color3(0.5, 0.5, 0.5);

  function worldFromLatLon(lat, lon) {
    const f = tileFrac(lat, lon);
    return { x: (f.x - originTx - 0.5) * TILE_M, z: -(f.y - originTy - 0.5) * TILE_M };
  }
  function tileLonW(tx) { return tx / NZ * 360 - 180; }
  function tileLatN(ty) { return Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / NZ))) / DEG2RAD; }
  function sleep(ms) { return new Promise(function(res) { setTimeout(res, ms); }); }

  function clearCityMeshes() {
    for (const a of cityLive.values()) {

  function meshFromVerts(name, pos, idx, col) {
    const normals = [];
    BABYLON.VertexData.ComputeNormals(pos, idx, normals);
    const vd = new BABYLON.VertexData();
    vd.positions = pos;
    vd.indices = idx;
    vd.normals = normals;
    vd.colors = col;
    const m = new BABYLON.Mesh(name, scene);
    vd.applyToMesh(m);
    m.material = cityMat;
    return m;
  }

  const ROAD_W = { motorway: 12, trunk: 10, primary: 10, secondary: 8, tertiary: 6,
    residential: 6, unclassified: 5, living_street: 5, service: 4, pedestrian: 4,
    track: 4, footway: 2.5, path: 2.5, cycleway: 2.5, steps: 2 };

  function addRibbonSeg(pos, idx, col, x0, z0, x1, z1, w, r, g, b) {
    const dx = x1 - x0, dz = z1 - z0;
    const len = Math.hypot(dx, dz);
    if (len < 0.01) return;
    const px = -dz / len * w / 2, pz = dx / len * w / 2;
    const n = Math.max(1, Math.ceil(len / 16));
    for (let k = 0; k < n; k++) {
      const t0 = k / n, t1 = (k + 1) / n;
      const ax = x0 + dx * t0, az = z0 + dz * t0;
      const bx = x0 + dx * t1, bz = z0 + dz * t1;
      const base = pos.length / 3;
      pos.push(
        ax + px, worldHeight(ax + px, az + pz) + 0.18, az + pz,
        ax - px, worldHeight(ax - px, az - pz) + 0.18, az - pz,
        bx + px, worldHeight(bx + px, bz + pz) + 0.18, bz + pz,
        bx - px, worldHeight(bx - px, bz - pz) + 0.18, bz - pz);
      for (let q2 = 0; q2 < 4; q2++) col.push(r, g, b, 1);
      idx.push(base, base + 2, base + 1, base + 1, base + 2, base + 3);
    }
  }

  function addBuildingBox(pos, idx, col, ring, hgt, seed) {
    let cx = 0, cz = 0;
    for (const p of ring) { cx += p.x; cz += p.z; }
    cx /= ring.length; cz /= ring.length;
    const base = worldHeight(cx, cz) - 1.0;
    const top = base + 1.0 + hgt;
    const rr = 0.55 + 0.35 * hash2(seed, 1.1);
    const gg = 0.55 + 0.35 * hash2(seed, 2.3);
    const bb = 0.55 + 0.35 * hash2(seed, 3.7);
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b2 = ring[(i + 1) % ring.length];
      const vb = pos.length / 3;
      const sh = 0.8 + 0.2 * hash2(seed, i * 1.7);
      pos.push(a.x, base, a.z, b2.x, base, b2.z, b2.x, top, b2.z, a.x, top, a.z);
      for (let q2 = 0; q2 < 4; q2++) col.push(rr * sh, gg * sh, bb * sh, 1);
      idx.push(vb, vb + 1, vb + 2, vb, vb + 2, vb + 3);
    }
    const rb = pos.length / 3;
    pos.push(cx, top + 0.05, cz);
    col.push(rr * 0.55, gg * 0.55, bb * 0.55, 1);
    for (let i = 0; i < ring.length; i++) {
      const a = ring[i], b2 = ring[(i + 1) % ring.length];
      pos.push(a.x, top + 0.05, a.z, b2.x, top + 0.05, b2.z);
      col.push(rr * 0.55, gg * 0.55, bb * 0.55, 1, rr * 0.55, gg * 0.55, bb * 0.55, 1);
      idx.push(rb, rb + 1 + ((i + 1) % ring.length) * 2, rb + 1 + i * 2);
    }
  }

  function addDoorBuilding(pos, idx, col, cx, cz, w, d, hgt, seed, doorAxis, doorSign) {
    const x0 = cx - w / 2, x1 = cx + w / 2, z0 = cz - d / 2, z1 = cz + d / 2;
    const base = worldHeight(cx, cz) - 1.0;
    const top = base + 1.0 + hgt;
    const rr = 0.6 + 0.3 * hash2(seed, 1.1);
    const gg = 0.6 + 0.3 * hash2(seed, 2.3);
    const bb = 0.6 + 0.3 * hash2(seed, 3.7);
    function quad(ax, ay, az, bx, by, bz, cx2, cy2, cz2, dx2, dy2, dz2, sh) {
      const vb = pos.length / 3;
      pos.push(ax, ay, az, bx, by, bz, cx2, cy2, cz2, dx2, dy2, dz2);
      for (let q2 = 0; q2 < 4; q2++) col.push(rr * sh, gg * sh, bb * sh, 1);
      idx.push(vb, vb + 1, vb + 2, vb, vb + 2, vb + 3);
    }
    function wall(ax, az, bx, bz, withDoor) {
      if (!withDoor) {
        quad(ax, base, az, bx, base, bz, bx, top, bz, ax, top, az, 0.85);
        return;
      }
      const len = Math.hypot(bx - ax, bz - az);
      const ux = (bx - ax) / len, uz = (bz - az) / len;
      const hw = Math.min(1.1, len * 0.15);
      const dh = Math.min(3.0, hgt * 0.55);
      const mx = (ax + bx) / 2, mz = (az + bz) / 2;
      const l1x = mx - ux * hw, l1z = mz - uz * hw;
      const l2x = mx + ux * hw, l2z = mz + uz * hw;
      quad(ax, base, az, l1x, base, l1z, l1x, top, l1z, ax, top, az, 0.85);
      quad(l2x, base, l2z, bx, base, bz, bx, top, bz, l2x, top, l2z, 0.85);
      quad(l1x, base + 1 + dh, l1z, l2x, base + 1 + dh, l2z, l2x, top, l2z, l1x, top, l1z, 0.8);
    }
    wall(x0, z0, x1, z0, doorAxis === 'z' && doorSign < 0);
    wall(x1, z0, x1, z1, doorAxis === 'x' && doorSign > 0);
    wall(x1, z1, x0, z1, doorAxis === 'z' && doorSign > 0);
    wall(x0, z1, x0, z0, doorAxis === 'x' && doorSign < 0);
    quad(x0, top + 0.05, z0, x0, top + 0.05, z1, x1, top + 0.05, z1, x1, top + 0.05, z0, 0.55);
  }

  function buildCityFromOSM(ax, ay, elements) {
    const rPos = [], rIdx = [], rCol = [];
    const bPos = [], bIdx = [], bCol = [];
    let roadN = 0, bldN = 0;
    for (const el of elements) {
      if (el.type !== 'way' || !el.geometry || el.geometry.length < 2) continue;
      const tags = el.tags || {};
      if (tags.highway) {
        if (roadN >= 600) continue;
        const w = ROAD_W[tags.highway] || 5;
        const minor = tags.highway === 'footway' || tags.highway === 'path' ||
          tags.highway === 'cycleway' || tags.highway === 'steps';
        const shade = minor ? 0.42 : 0.16;
        let prev = null;
        for (const nd of el.geometry) {
          const p = worldFromLatLon(nd.lat, nd.lon);
          if (prev) addRibbonSeg(rPos, rIdx, rCol, prev.x, prev.z, p.x, p.z, w, shade, shade, shade * 1.06);
          prev = p;
        }
        roadN++;
      } else if (tags.building && el.geometry.length >= 4) {
        if (bldN >= 800) continue;
        const g = el.geometry;
        const first = g[0], last = g[g.length - 1];
        if (first.lat !== last.lat || first.lon !== last.lon) continue;
        const ring = [];
        let minx = 1e18, maxx = -1e18, minz = 1e18, maxz = -1e18;
        for (let i = 0; i < g.length - 1; i++) {
          const p = worldFromLatLon(g[i].lat, g[i].lon);
          ring.push(p);
          if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
          if (p.z < minz) minz = p.z; if (p.z > maxz) maxz = p.z;
        }
        if (ring.length < 3 || maxx - minx > 400 || maxz - minz > 400) continue;
        let hgt = parseFloat(tags.height);
        if (!(hgt > 2)) hgt = (parseInt(tags['building:levels'], 10) || 0) * 3;
        if (!(hgt > 2)) hgt = 8 + hash2(first.lat * 100, first.lon * 100) * 14;
        addBuildingBox(bPos, bIdx, bCol, ring, Math.min(hgt, 220), el.id * 0.613);
        bldN++;
      }
    }
    const area = { roads: null, buildings: null, status: 'ok', feats: roadN + bldN };
    if (rIdx.length) area.roads = meshFromVerts('crd' + ax + ',' + ay, rPos, rIdx, rCol);
    if (bIdx.length) area.buildings = meshFromVerts('cbd' + ax + ',' + ay, bPos, bIdx, bCol);
    return area;
  }

  function buildProcCity(ax, ay) {
    const rPos = [], rIdx = [], rCol = [];
    const bPos = [], bIdx = [], bCol = [];
    const wx0 = (ax * AREA_T - originTx - 0.5) * TILE_M;
    const wx1 = wx0 + AREA_T * TILE_M;
    const wz0 = -(ay * AREA_T - originTy + 0.5) * TILE_M;
    const wz1 = wz0 + AREA_T * TILE_M;
    const seedA = ax * 91.7 + ay * 37.3;
    const spacing = 118 + hash2(seedA, 1) * 14;
    let feats = 0;
    for (let x = wx0 + hash2(seedA, 2) * spacing; x < wx1; x += spacing) {
      for (let z = wz0; z < wz1; z += 20) {
        const z2 = Math.min(z + 20, wz1);
        if (worldHeight(x, z) < 1.5 && worldHeight(x, z2) < 1.5) continue;
        addRibbonSeg(rPos, rIdx, rCol, x, z, x, z2, 6, 0.17, 0.17, 0.18);
      }
      feats++;
      let side = hash2(x, seedA) > 0.5 ? 1 : -1;
      for (let z = wz0 + 10 + hash2(x, 7.7) * 20; z < wz1 - 10; z += 26 + hash2(x, z) * 14) {
        if (hash2(x * 1.3, z * 0.7) < 0.35) continue;
        const d = 9 + hash2(x, z * 1.1) * 8;
        const w = 9 + hash2(x * 0.9, z) * 9;
        const cx = x + side * (5 + d / 2);
        if (worldHeight(cx, z) < 2) continue;
        addDoorBuilding(bPos, bIdx, bCol, cx, z, d, w, 8 + hash2(x * 2.1, z * 1.7) * 14,
          x * 0.01 + z * 0.013, 'x', -side);
        side = -side;
        feats++;
      }
    }
    for (let z = wz0 + hash2(seedA, 3) * spacing; z < wz1; z += spacing) {
      for (let x = wx0; x < wx1; x += 20) {
        const x2 = Math.min(x + 20, wx1);
        if (worldHeight(x, z) < 1.5 && worldHeight(x2, z) < 1.5) continue;
        addRibbonSeg(rPos, rIdx, rCol, x, z, x2, z, 6, 0.17, 0.17, 0.18);
      }
      feats++;
      let side = hash2(z, seedA) > 0.5 ? 1 : -1;
      for (let x = wx0 + 10 + hash2(z, 5.1) * 20; x < wx1 - 10; x += 26 + hash2(z, x) * 14) {
        if (hash2(z * 1.3, x * 0.7) < 0.35) continue;
        const w = 9 + hash2(z, x * 1.1) * 9;
        const d = 9 + hash2(z * 0.9, x) * 8;
        const cz = z + side * (5 + d / 2);
        if (worldHeight(x, cz) < 2) continue;
        addDoorBuilding(bPos, bIdx, bCol, x, cz, w, d, 8 + hash2(z * 2.1, x * 1.7) * 14,
          z * 0.011 + x * 0.017, 'z', -side);
        side = -side;
        feats++;
      }
    }
    const area = { roads: null, buildings: null, status: 'proc', feats: feats };
    if (rIdx.length) area.roads = meshFromVerts('crd' + ax + ',' + ay, rPos, rIdx, rCol);
    if (bIdx.length) area.buildings = meshFromVerts('cbd' + ax + ',' + ay, bPos, bIdx, bCol);
    return area;
  }

  function mountCity(ax, ay, key) {
    if (cityLive.has(key)) return;
    const data = cityData.get(key);
    if (!data) return;
    const area = data.proc ? buildProcCity(ax, ay) : buildCityFromOSM(ax, ay, data.elements);
    cityLive.set(key, area);
  }

  async function fetchCity(ax, ay, key) {
    if (cityLive.has(key)) return;
    if (cityData.has(key)) { mountCity(ax, ay, key); return; }
    if (osmBroken) {
      cityData.set(key, { proc: true });
      mountCity(ax, ay, key);
      return;
    }
    const S = tileLatN(ay * AREA_T + AREA_T).toFixed(6);
    const N2 = tileLatN(ay * AREA_T).toFixed(6);
    const W2 = tileLonW(ax * AREA_T).toFixed(6);
    const E2 = tileLonW(ax * AREA_T + AREA_T).toFixed(6);
    const q = '[out:json][timeout:25];(way["highway"](' + S + ',' + W2 + ',' + N2 + ',' + E2 +
      ');way["building"](' + S + ',' + W2 + ',' + N2 + ',' + E2 + '););out geom;';
    for (let h = 0; h < OVERPASS_HOSTS.length; h++) {
      const ctrl = new AbortController();
      const timer = setTimeout(function() { ctrl.abort(); }, 25000);
      try {
        const resp = await fetch(OVERPASS_HOSTS[h], {
          method: 'POST',
          mode: 'cors',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(q)
        });
        if (resp.status === 429 || resp.status >= 500) {
          osmBackoff = Math.min(osmBackoff * 2, 60000);
          await sleep(Math.min(osmBackoff, 12000));
          if (lastAreaKey !== key) return;
          throw new Error('HTTP ' + resp.status);
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const j = await resp.json();
        osmConsecFails = 0;
        osmBackoff = 5000;
        cityData.set(key, { proc: false, elements: j.elements || [] });
        mountCity(ax, ay, key);
        return;
      } catch (e) {
      } finally {
        clearTimeout(timer);
      }
    }
    osmConsecFails++;
    if (osmConsecFails >= 3) osmBroken = true;
    cityData.set(key, { proc: true });
    mountCity(ax, ay, key);
  }

  function updateCity(ptx, pty) {
    const ax = Math.floor(ptx / AREA_T), ay = Math.floor(pty / AREA_T);
    const akey = ax + ',' + ay;
    if (akey !== lastAreaKey) {
      lastAreaKey = akey;
      cityPending = { key: akey, ax: ax, ay: ay, since: performance.now() };
      for (const entry of cityLive) {
        const kp = entry[0].split(',');
        if (Math.max(Math.abs(+kp[0] - ax), Math.abs(+kp[1] - ay)) > 1) {
          const a = entry[1];
          if (a.roads) a.roads.dispose();
          if (a.buildings) a.buildings.dispose();
          cityLive.delete(entry[0]);
        }
      }
    }
    if (cityPending && performance.now() - cityPending.since > 1500) {
      const p = cityPending;
      cityPending = null;
      fetchCity(p.ax, p.ay, p.key).catch(function() {});
    }
  }

  function buildTileMesh(t) {
    const N = t.lod, nb = N + 1;
    const positions = [], indices = [], normals = [], uvs = [], colors = [];
    for (let j = 0; j < nb; j++) {
      for (let i = 0; i < nb; i++) {
        const h = bilinear(t.heights, i / N * 255, j / N * 255);
        positions.push((i / N - 0.5) * TILE_M, h, (0.5 - j / N) * TILE_M);
        uvs.push(i / N, j / N);
        const c = vertexColor(t, h, i / N * 255, j / N * 255);
        colors.push(c.r, c.g, c.b, 1);
      }
    }
    for (let j = 0; j < N; j++) {
      for (let i = 0; i < N; i++) {
        const a = j * nb + i, b = a + 1, c = a + nb, d = c + 1;
        indices.push(a, b, c, b, d, c);
      }
    }
    const edges = [
      function(k) { return k; },
      function(k) { return N * nb + k; },
      function(k) { return k * nb; },
      function(k) { return k * nb + N; }
    ];
    for (let e = 0; e < 4; e++) {
      const getIdx = edges[e];
      let prevTop = -1, prevSk = -1;
      for (let k = 0; k < nb; k++) {
        const top = getIdx(k);
        const s = positions.length / 3;
        positions.push(positions[top * 3], positions[top * 3 + 1] - SKIRT, positions[top * 3 + 2]);
        uvs.push(uvs[top * 2], uvs[top * 2 + 1]);
        colors.push(colors[top * 4], colors[top * 4 + 1], colors[top * 4 + 2], 1);
        if (prevTop >= 0) {
          indices.push(prevTop, prevSk, top, top, prevSk, s);
        }
        prevTop = top; prevSk = s;
      }
    }
    BABYLON.VertexData.ComputeNormals(positions, indices, normals);
    const vd = new BABYLON.VertexData();
    vd.positions = positions;
    vd.indices = indices;
    vd.normals = normals;
    vd.uvs = uvs;
    vd.colors = colors;
    const mesh = new BABYLON.Mesh('t' + t.key, scene);
    vd.applyToMesh(mesh);
    mesh.material = terrainMat;
    return mesh;
  }

  function applyImagery(t) {
    if (!t.mesh || !t.imgTex) return;
    const n = t.mesh.getTotalVertices();
    const whites = new Float32Array(n * 4);
    whites.fill(1);
    t.mesh.setVerticesData(BABYLON.VertexBuffer.ColorKind, whites);
    if (!t.imgMat) {
      t.imgMat = terrainMat.clone('im' + t.key);
      t.imgMat.ambientColor = new BABYLON.Color3(0.55, 0.55, 0.55);
    }
    t.imgMat.diffuseTexture = t.imgTex;
    t.mesh.material = t.imgMat;
  }

  function disposeTileExtras(t) {
    if (t.imgTex) { t.imgTex.dispose(); t.imgTex = null; }
    if (t.imgMat) { t.imgMat.dispose(); t.imgMat = null; }
  }

  function rebuildMesh(t) {
    if (t.mesh) { t.mesh.dispose(); t.mesh = null; }
    t.mesh = buildTileMesh(t);
    t.mesh.position.set((t.tx - originTx) * TILE_M, 0, -(t.ty - originTy) * TILE_M);
    if (settings.imagery && t.imgTex) applyImagery(t);
  }

  function decodePng(blob) {
    return new Promise(function(resolve, reject) {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function() {
        try {
          const c = document.createElement('canvas');
          c.width = 256; c.height = 256;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 256, 256);
          URL.revokeObjectURL(url);
          resolve(ctx.getImageData(0, 0, 256, 256).data);
        } catch (err) {
          URL.revokeObjectURL(url);
          reject(err);
        }
      };
      img.onerror = function() {
        URL.revokeObjectURL(url);
        reject(new Error('PNG decode failed'));
      };
      img.src = url;
    });
  }

  const ELEV_HOSTS = [
    function(z, x, y) { return 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/' + z + '/' + x + '/' + y + '.png'; },
    function(z, x, y) { return 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/' + z + '/' + x + '/' + y + '.png'; }
  ];
  const IMG_HOSTS = [
    function(z, x, y) { return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + z + '/' + y + '/' + x; },
    function(z, x, y) { return 'https://tile.openstreetmap.org/' + z + '/' + x + '/' + y + '.png'; }
  ];
  let netFails = 0;
  let lastNetErr = '';
  let imgOk = 0;
  let imgFails = 0;
  let dlActive = 0;
  const dlQueue = [];
  const DL_MAX = 6;

  function pumpDl() {
    while (dlActive < DL_MAX && dlQueue.length > 0) {
      const job = dlQueue.shift();
      dlActive++;
      job().catch(function() {}).then(function() {
        dlActive--;
        pumpDl();
      });
    }
  }
  function queueDl(job) {
    dlQueue.push(job);
    pumpDl();
  }

  async function fetchElev(t) {
    const fx = ((t.tx % NZ) + NZ) % NZ;
    const fy = Math.min(Math.max(t.ty, 0), NZ - 1);
    let lastErr = null;
    for (let h = 0; h < ELEV_HOSTS.length; h++) {
      if (!tiles.has(t.key)) return;
      const ctrl = new AbortController();
      const timer = setTimeout(function() { ctrl.abort(); }, 12000);
      try {
        const resp = await fetch(ELEV_HOSTS[h](zoom, fx, fy), { mode: 'cors', signal: ctrl.signal });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await decodePng(await resp.blob());
        if (!tiles.has(t.key)) return;
        const hh = new Float32Array(65536);
        for (let i = 0; i < 65536; i++) {
          hh[i] = data[i * 4] * 256 + data[i * 4 + 1] + data[i * 4 + 2] / 256 - 32768;
        }
        t.heights = hh;
        t.state = 'terr';
        if (t.lcSrc !== 'titi') t.biome = computeProcBiome(t); // reclassify on real elevation
        rebuildMesh(t);
        scatterTile(t);
        return;
      } catch (e) {
        lastErr = e;
      } finally {
        clearTimeout(timer);
      }
    }
    if (!tiles.has(t.key)) return;
    t.state = 'proc';
    netFails++;
    lastNetErr = (lastErr && lastErr.message) ? lastErr.message : String(lastErr);
  }

  async function fetchImagery(t) {
    if (!settings.imagery) return;
    const fx = ((t.tx % NZ) + NZ) % NZ;
    const fy = Math.min(Math.max(t.ty, 0), NZ - 1);
    for (let h = 0; h < IMG_HOSTS.length; h++) {
      if (!tiles.has(t.key) || !settings.imagery) return;
      const ctrl = new AbortController();
      const timer = setTimeout(function() { ctrl.abort(); }, 12000);
      try {
        const resp = await fetch(IMG_HOSTS[h](zoom, fx, fy), { mode: 'cors', signal: ctrl.signal });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        const tex = new BABYLON.Texture(objUrl, scene, false, false, BABYLON.Texture.TRILINEAR_SAMPLINGMODE,
          function() { URL.revokeObjectURL(objUrl); },
          function() { URL.revokeObjectURL(objUrl); });
        tex.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
        tex.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
        if (!tiles.has(t.key) || !settings.imagery) { tex.dispose(); return; }
        t.imgTex = tex;
        applyImagery(t);
        imgOk++;
        return;
      } catch (e) {
      } finally {
        clearTimeout(timer);
      }
    }
    if (tiles.has(t.key)) imgFails++;
  }

  function ensureTile(tx, ty, d) {
    const key = tx + ',' + ty;
    const want = lodForDist(d);
    let t = tiles.get(key);
    if (t) {
      if (t.lod !== want) { t.lod = want; rebuildMesh(t); }
      return;
    }
    t = { key: key, tx: tx, ty: ty, lod: want, state: 'proc', heights: makeProcHeights(tx, ty), mesh: null, imgTex: null, imgMat: null, biome: null, lcSrc: 'proc', treeMesh: null, grassMesh: null, vegCount: 0 };
    t.biome = computeProcBiome(t);
    tiles.set(key, t);
    rebuildMesh(t);
    scatterTile(t);
    queueDl(function() { return fetchElev(t); });
    queueDl(function() { return fetchImagery(t); });
    queueDl(function() { return fetchLC(t); });
  }

  function updateStreaming(ptx, pty) {
    for (let dy = -RING; dy <= RING; dy++) {
      for (let dx = -RING; dx <= RING; dx++) {
        ensureTile(ptx + dx, pty + dy, Math.max(Math.abs(dx), Math.abs(dy)));
      }
    }
    for (const entry of tiles) {
      const key = entry[0], t = entry[1];
      const d = Math.max(Math.abs(t.tx - ptx), Math.abs(t.ty - pty));
      if (d > CACHE) {
        clearScatter(t);
        if (t.mesh) t.mesh.dispose();
        disposeTileExtras(t);
        tiles.delete(key);
      }
    }
  }

  function worldHeight(x, z) {
    const txf = x / TILE_M + originTx + 0.5;
    const tyf = -z / TILE_M + originTy + 0.5;
    const tx = Math.floor(txf), ty = Math.floor(tyf);
    const t = tiles.get(tx + ',' + ty);
    const px = (txf - tx) * 256, py = (tyf - ty) * 256;
    if (t) return bilinear(t.heights, px, py);
    return procHeight(txf * 256, tyf * 256);
  }

  let lastPTx = 0, lastPTy = 0;

  function teleport(lat, lon) {
    lat = Math.min(Math.max(lat, -85), 85);
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const o = latLonToTile(lat, lon, zoom);
    originTx = o.x;
    originTy = o.y;
    TILE_M = tileMeters(zoom) * Math.max(Math.cos(lat * DEG2RAD), 0.01);
    for (const t of tiles.values()) {
      clearScatter(t);
      if (t.mesh) t.mesh.dispose();
      disposeTileExtras(t);
    }
    tiles.clear();
    clearCityMeshes();
    osmBroken = false;
    osmConsecFails = 0;
    osmBackoff = 5000;
    vy = 0;
    airborne = false;
    const f = tileFrac(lat, lon);
    const wx = (f.x - originTx - 0.5) * TILE_M;
    const wz = -(f.y - originTy - 0.5) * TILE_M;
    lastPTx = Math.round(wx / TILE_M) + originTx;
    lastPTy = Math.round(-wz / TILE_M) + originTy;
    sizeWater();
    updateStreaming(lastPTx, lastPTy);
    camera.position.set(wx, worldHeight(wx, wz) + eyeHeight, wz);
  }

  function setQuality(q) {
    if (!QUALITY[q]) return;
    settings.detail = q;
    RING = QUALITY[q].ring;
    for (const t of tiles.values()) {
      const d = Math.max(Math.abs(t.tx - lastPTx), Math.abs(t.ty - lastPTy));
      const want = lodForDist(d);
      if (t.lod !== want) { t.lod = want; rebuildMesh(t); }
    }
    sizeWater();
    updateStreaming(lastPTx, lastPTy);
  }

  teleport(SF.lat, SF.lon);

  // ---- fly / walk ----
  const btnFly = document.getElementById('btnFly');
  function applySpeeds() {
    camera.speed = flyMode ? settings.flySpeed : settings.walkSpeed;
  }
  function setFly(v) {
    flyMode = v;
    btnFly.textContent = flyMode ? 'Walk' : 'Fly';
    if (flyMode) { vy = 0; airborne = false; }
    applySpeeds();
    updateTouchUI();
  }
  btnFly.addEventListener('click', function() { setFly(!flyMode); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'f' || e.key === 'F') setFly(!flyMode);
  });
  applySpeeds();

  // ---- zoom: wheel (FOV based, 1x..8x) ----
  const BASE_FOV = camera.fov;
  let zoomMult = 1;
  function setZoom(mult) {
    zoomMult = Math.min(Math.max(mult, 1), 8);
    camera.fov = BASE_FOV / zoomMult;
  }
  canvas.addEventListener('wheel', function(e) {
    e.preventDefault();
    setZoom(zoomMult * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });

  // ---- M3.4 touch controls: pointer roles (stick / look / pinch) ----
  const stickBase = document.getElementById('stickBase');
  const stickKnob = document.getElementById('stickKnob');
  const btnJumpTouch = document.getElementById('btnJumpTouch');
  const STICK_R = 55;
  const stick = { id: -1, baseX: 0, baseY: 0, vx: 0, vy: 0 };
  const others = new Map();   // non-stick touch pointers
  const look = { id: -1, lastX: 0, lastY: 0 };
  let pinchD0 = 0, pinchZ0 = 1;
  let touchActive = false;    // AUTO mode: set on first real touch
  let modalOpen = false;

  function touchOn() {
    if (settings.touchCtl === 'off') return false;
    if (settings.touchCtl === 'on') return true;
    return touchActive;
  }

  function releaseAllRoles() {
    stick.id = -1; stick.vx = 0; stick.vy = 0;
    others.clear();
    look.id = -1;
    pinchD0 = 0;
    stickBase.style.display = 'none';
  }

  function updateTouchUI() {
    const show = touchOn() && !modalOpen;
    btnJumpTouch.style.display = (show && !flyMode) ? 'block' : 'none';
    if (!show) releaseAllRoles();
  }

  function showStickAt(x, y) {
    stickBase.style.display = 'block';
    stickBase.style.left = x + 'px';
    stickBase.style.top = y + 'px';
  }
  function moveKnob(nx, ny) {
    stickKnob.style.transform = 'translate(' + nx + 'px,' + ny + 'px)';
  }

  canvas.addEventListener('pointerdown', function(e) {
    if (e.pointerType !== 'touch') return;
    if (settings.touchCtl === 'off') return;
    if (!touchActive) { touchActive = true; updateTouchUI(); }
    if (modalOpen) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (stick.id === -1 && e.clientX < window.innerWidth * 0.45) {
      stick.id = e.pointerId;
      stick.baseX = e.clientX; stick.baseY = e.clientY;
      stick.vx = 0; stick.vy = 0;
      showStickAt(e.clientX, e.clientY);
      moveKnob(0, 0);
    } else {
      others.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (others.size === 1) {
        look.id = e.pointerId;
        look.lastX = e.clientX; look.lastY = e.clientY;
      } else if (others.size === 2) {
        const p = [];
        for (const v of others.values()) p.push(v);
        pinchD0 = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        pinchZ0 = zoomMult;
      }
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (e.pointerId === stick.id) {
      const dx = e.clientX - stick.baseX;
      const dy = e.clientY - stick.baseY;
      const mag = Math.hypot(dx, dy);
      let nx = dx, ny = dy;
      if (mag > STICK_R) { nx = dx / mag * STICK_R; ny = dy / mag * STICK_R; }
      stick.vx = nx / STICK_R;
      stick.vy = ny / STICK_R;
      moveKnob(nx, ny);
    } else if (others.has(e.pointerId)) {
      others.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (others.size === 2 && pinchD0 > 0) {
        const p = [];
        for (const v of others.values()) p.push(v);
        const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
        if (d > 0) setZoom(pinchZ0 * d / pinchD0);
      } else if (others.size === 1 && e.pointerId === look.id) {
        const dx = e.clientX - look.lastX;
        const dy = e.clientY - look.lastY;
        look.lastX = e.clientX; look.lastY = e.clientY;
        camera.rotation.y += dx / settings.sens;
        camera.rotation.x += dy / settings.sens; // invert-Y handled by the shared render-loop flip
      }
    }
  });

  function releasePointer(e) {
    if (e.pointerId === stick.id) {
      stick.id = -1; stick.vx = 0; stick.vy = 0;
      stickBase.style.display = 'none';
    }
    if (others.has(e.pointerId)) {
      others.delete(e.pointerId);
      if (others.size === 1) {
        const entry = others.entries().next().value;
        look.id = entry[0];
        look.lastX = entry[1].x; look.lastY = entry[1].y;
      } else {
        look.id = -1;
      }
      if (others.size < 2) pinchD0 = 0;
    }
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);

  btnJumpTouch.addEventListener('pointerdown', function(e) {
    e.preventDefault();
    if (!flyMode && !airborne) {
      vy = JUMP_V;
      airborne = true;
    }
  });

  updateTouchUI();

  // ---- time of day ----
  const dayTop = new BABYLON.Color3(0.2, 0.45, 0.85);
  const dayHor = new BABYLON.Color3(0.7, 0.82, 0.94);
  const nightTop = new BABYLON.Color3(0.01, 0.02, 0.06);
  const nightHor = new BABYLON.Color3(0.05, 0.08, 0.14);
  const sunsetHor = new BABYLON.Color3(0.98, 0.5, 0.24);
  function fmtTOD(h) {
    const hh = Math.floor(h) % 24;
    const mm = Math.floor((h - Math.floor(h)) * 60);
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }
  function applyTOD() {
    const h = settings.tod;
    const elev = Math.sin((h - 6) / 12 * Math.PI);
    const daylight = Math.min(Math.max(elev, 0), 1);
    const az = (h - 12) / 12 * Math.PI;
    if (elev <= 0) {
      sun.direction = new BABYLON.Vector3(0.2, -1, 0.3).normalize();
    } else {
      sun.direction = new BABYLON.Vector3(Math.sin(az), -elev, Math.cos(az) * 0.5).normalize();
    }
    sun.intensity = 0.15 + 1.1 * daylight;
    hemi.intensity = 0.28 + 0.38 * daylight;
    const dl = Math.min(daylight + 0.06, 1);
    let top = BABYLON.Color3.Lerp(nightTop, dayTop, dl);
    let hor = BABYLON.Color3.Lerp(nightHor, dayHor, dl);
    const sunset = Math.max(0, 1 - Math.abs(elev) / 0.3);
    if (sunset > 0) hor = BABYLON.Color3.Lerp(hor, sunsetHor, sunset * 0.65);
    paintSky(top, hor);
    scene.fogColor = hor;
    scene.clearColor = new BABYLON.Color4(hor.r, hor.g, hor.b, 1);
    const cb = 0.2 + 0.8 * dl;
    cloudMat.emissiveColor.set(cb, cb, Math.min(cb * 1.07, 1));
  }
  applyTOD();

  camera.angularSensibility = settings.sens;

  // ---- settings modal wiring ----
  const modalWrap = document.getElementById('modalWrap');
  const optDetail = document.getElementById('optDetail');
  const optImagery = document.getElementById('optImagery');
  const optWalk = document.getElementById('optWalk');
  const optFly = document.getElementById('optFly');
  const optTod = document.getElementById('optTod');
  const optSens = document.getElementById('optSens');
  const optInvertY = document.getElementById('optInvertY');
  const optTouch = document.getElementById('optTouch');
  const optAutoTod = document.getElementById('optAutoTod');
  const optClouds = document.getElementById('optClouds');
  const optRain = document.getElementById('optRain');
  const optSeason = document.getElementById('optSeason');
  const optPreset = document.getElementById('optPreset');
  const optLat = document.getElementById('optLat');
  const optLon = document.getElementById('optLon');
  const walkVal = document.getElementById('walkVal');
  const flyVal = document.getElementById('flyVal');
  const todVal = document.getElementById('todVal');
  const sensVal = document.getElementById('sensVal');

  optDetail.value = settings.detail;
  optImagery.checked = settings.imagery;
  optWalk.value = settings.walkSpeed;
  optFly.value = settings.flySpeed;
  optTod.value = settings.tod;
  optSens.value = settings.sens;
  optInvertY.checked = settings.invertY;
  optTouch.value = settings.touchCtl;
  optAutoTod.checked = settings.autoTod;
  optClouds.checked = settings.clouds;
  optRain.checked = settings.rain;
  optSeason.value = settings.season;
  walkVal.textContent = settings.walkSpeed;
  flyVal.textContent = settings.flySpeed;
  todVal.textContent = fmtTOD(settings.tod);
  sensVal.textContent = settings.sens;

  document.getElementById('btnGear').addEventListener('click', function() {
    modalOpen = true;
    modalWrap.style.display = 'block';
    updateTouchUI();
  });
  function closeModal() {
    modalOpen = false;
    modalWrap.style.display = 'none';
    saveSettings();
    updateTouchUI();
  }
  document.getElementById('btnClose').addEventListener('click', closeModal);
  modalWrap.addEventListener('click', function(e) {
    if (e.target === modalWrap) closeModal();
  });

  optDetail.addEventListener('change', function() {
    setQuality(optDetail.value);
    saveSettings();
  });
  optImagery.addEventListener('change', function() {
    settings.imagery = optImagery.checked;
    saveSettings();
    for (const t of tiles.values()) {
      if (settings.imagery) {
        if (!t.imgTex) queueDl(function() { return fetchImagery(t); });
        else applyImagery(t);
      } else {
        disposeTileExtras(t);
        rebuildMesh(t);
      }
    }
  });
  optWalk.addEventListener('input', function() {
    settings.walkSpeed = parseFloat(optWalk.value) || 5;
    walkVal.textContent = optWalk.value;
    applySpeeds();
  });
  optFly.addEventListener('input', function() {
    settings.flySpeed = parseFloat(optFly.value) || 40;
    flyVal.textContent = optFly.value;
    applySpeeds();
  });
  optTod.addEventListener('input', function() {
    settings.tod = parseFloat(optTod.value) || 0;
    settings.autoTod = false;
    optAutoTod.checked = false;
    todVal.textContent = fmtTOD(settings.tod);
    applyTOD();
  });
  optSens.addEventListener('input', function() {
    settings.sens = parseFloat(optSens.value) || 3000;
    sensVal.textContent = optSens.value;
    camera.angularSensibility = settings.sens;
  });
  optInvertY.addEventListener('change', function() {
    settings.invertY = optInvertY.checked;
    saveSettings();
  });
  optTouch.addEventListener('change', function() {
    settings.touchCtl = optTouch.value;
    saveSettings();
    updateTouchUI();
  });
  optAutoTod.addEventListener('change', function() {
    settings.autoTod = optAutoTod.checked;
    saveSettings();
  });
  optClouds.addEventListener('change', function() {
    settings.clouds = optClouds.checked;
    applyWeather();
    saveSettings();
  });
  optRain.addEventListener('change', function() {
    settings.rain = optRain.checked;
    applyWeather();
    saveSettings();
  });
  optSeason.addEventListener('change', function() {
    settings.season = optSeason.value;
    applySeason();
    saveSettings();
  });
  optPreset.addEventListener('change', function() {
    if (!optPreset.value) return;
    const parts = optPreset.value.split(',');
    optLat.value = parts[0];
    optLon.value = parts[1];
  });
  document.getElementById('btnJump').addEventListener('click', function() {
    const la = parseFloat(optLat.value), lo = parseFloat(optLon.value);
    if (isNaN(la) || isNaN(lo)) { showErr('JUMP: enter valid lat/lon'); return; }
    teleport(la, lo);
    closeModal();
  });

  // ---- per-frame ----
  scene.registerBeforeRender(function() {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.1);

    // M3.4: virtual stick movement (camera-relative, delta-time scaled)
    if (stick.id !== -1 && !modalOpen) {
      const vm = Math.hypot(stick.vx, stick.vy);
      if (vm > 0.02) {
        const sp = (flyMode ? settings.flySpeed : settings.walkSpeed) * dt;
        const fwd = camera.getForwardRay().direction;
        const hl = Math.hypot(fwd.x, fwd.z);
        if (hl > 0.001) {
          const fw = -stick.vy;   // screen-up = forward
          const st = stick.vx;    // screen-right = strafe right
          if (flyMode) {
            const rx = fwd.z / hl, rz = -fwd.x / hl;
            camera.position.x += (fwd.x * fw + rx * st) * sp;
            camera.position.y += fwd.y * fw * sp;
            camera.position.z += (fwd.z * fw + rz * st) * sp;
          } else {
            const gx = fwd.x / hl, gz = fwd.z / hl;
            const rx = gz, rz = -gx;
            camera.position.x += (gx * fw + rx * st) * sp;
            camera.position.z += (gz * fw + rz * st) * sp;
          }
        }
      }
    }

    const ptx = Math.round(camera.position.x / TILE_M) + originTx;
    const pty = Math.round(-camera.position.z / TILE_M) + originTy;
    if (ptx !== lastPTx || pty !== lastPTy) {
      lastPTx = ptx; lastPTy = pty;
      updateStreaming(ptx, pty);
    }

    // M5: city areas (debounced Overpass query ~1.5 s after settling)
    updateCity(ptx, pty);

    // M4: water plane follows the player and animates (bob + texture drift)
    water.position.x = (ptx - originTx) * TILE_M;
    water.position.z = -(pty - originTy) * TILE_M;
    water.position.y = 0.32 + Math.sin(performance.now() * 0.0011) * 0.12;
    waterDT.uOffset += dt * 0.02;
    waterDT.vOffset += dt * 0.008;

    // M6: auto day/night cycle (manual slider pauses it), cloud drift, rain follows camera
    if (settings.autoTod) {
      settings.tod = (settings.tod + dt * 24 / 600) % 24;
      applyTOD();
      if (modalOpen) {
        optTod.value = settings.tod;
        todVal.textContent = fmtTOD(settings.tod);
      }
    }
    if (settings.clouds) updateClouds(dt);
    if (settings.rain) rainRoot.position.copyFrom(camera.position);

    if (!flyMode) {
      const ground = worldHeight(camera.position.x, camera.position.z) + eyeHeight;
      if (airborne) {
        vy -= GRAV * dt;
        camera.position.y += vy * dt;
        if (camera.position.y <= ground) {
          camera.position.y = ground;
          vy = 0;
          airborne = false;
        }
      } else {
        camera.position.y = ground;
      }
    }
  });

  const topHud = document.getElementById('topHud');
  scene.onBeforeRenderObservable.add(function() {
    const fps = engine.getFps().toFixed(1);
    const tcfX = camera.position.x / TILE_M + originTx + 0.5;
    const tcfY = -camera.position.z / TILE_M + originTy + 0.5;
    let lon = tcfX / NZ * 360 - 180;
    lon = ((lon + 180) % 360 + 360) % 360 - 180;
    const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * tcfY / NZ))) / DEG2RAD;
    let terr = 0, proc = 0, lcTiti = 0, vegTotal = 0;
    for (const t of tiles.values()) {
      if (t.state === 'terr') terr++; else proc++;
      if (t.lcSrc === 'titi') lcTiti++;
      vegTotal += t.vegCount || 0;
    }
    let osmAreas = 0, osmProcAreas = 0, osmFeats = 0;
    for (const a of cityLive.values()) {
      if (a.status === 'ok') { osmAreas++; osmFeats += a.feats; }
      else osmProcAreas++;
    }
    let osmLine = '--';
    if (osmAreas > 0) osmLine = 'OK ' + osmFeats;
    if (osmProcAreas > 0) osmLine = (osmAreas > 0 ? osmLine + ' / ' : '') + 'PROC ' + osmProcAreas;
    if (osmBroken) osmLine += ' (brk)';
    topHud.innerHTML = BUILD +
      '<br>FPS:' + fps +
      '<br>Lat:' + lat.toFixed(5) + ' Lon:' + lon.toFixed(5) +
      '<br>Alt:' + camera.position.y.toFixed(1) + 'm' +
      '<br>Mode:' + (flyMode ? 'FLY' : 'WALK') +
      ' CTL:' + (touchOn() ? 'TOUCH' : 'KEYS') +
      ' Time:' + fmtTOD(settings.tod) + (settings.autoTod ? 'A' : '') +
      ' Q:' + settings.detail +
      (zoomMult !== 1 ? ' Zoom:' + zoomMult.toFixed(1) + 'x' : '') +
      '<br>Tiles:' + tiles.size + ' (ring ' + RING + ')' +
      '<br>SRC: TERR ' + terr + ' / PROC ' + proc +
      '<br>IMG: ' + (settings.imagery ? ('OK ' + imgOk + ' / FAIL ' + imgFails + ' · Imagery © Esri & contributors') : 'off') +
      '<br>LC: ' + (lcTiti > 0 ? 'TITI ' + lcTiti + ' / ' : '') + 'PROC ' + (tiles.size - lcTiti) + ' · VEG ' + vegTotal +
      '<br>OSM: ' + osmLine +
      '<br>WX: ' + (settings.rain ? 'rain' : (settings.clouds ? 'clouds' : 'clear')) + ' · ' + seasonNow +
      '<br>NET fails:' + netFails + (lastNetErr ? ' (' + lastNetErr.slice(0, 40) + ')' : '') +
      '<br>CDN:' + cdnUrl.split('/')[2];
  });

  let prevRotX = camera.rotation.x;
  engine.runRenderLoop(function() {
    scene.render();
    if (settings.invertY) {
      const dx = camera.rotation.x - prevRotX;
      if (dx !== 0) camera.rotation.x = prevRotX - dx;
    }
    prevRotX = camera.rotation.x;
  });
  window.addEventListener('resize', function() { engine.resize(); });
}
</script>
</body>
</html>
