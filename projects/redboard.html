<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Redboard — Case Board</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#7a5636}

  /* ---------- board viewport & world ---------- */
  #viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;background-color:#7a5636;background-repeat:repeat}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(30,15,5,.35) 100%)}
  #world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}
  #threads{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:999999}
  #threads path.hit{pointer-events:stroke;cursor:pointer}
  #threads g.pin{pointer-events:all;cursor:pointer}

  /* ---------- items ---------- */
  .item{position:absolute;left:0;top:0;cursor:default;touch-action:none;user-select:none;
    box-shadow:3px 8px 18px rgba(40,20,5,.4),1px 2px 4px rgba(40,20,5,.3)}
  .item.sel{outline:2px solid #4da3ff;outline-offset:1px}
  .item.edit{outline:2px dashed #ffb84d;outline-offset:2px;cursor:grab}
  .item.pend{outline:3px dashed #c0392b;outline-offset:2px}
  .item textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:transparent;
    pointer-events:none;font-family:'Caveat',cursive;color:#3a2a18;overflow:hidden}
  .h{position:absolute;width:16px;height:16px;background:#fff;border:2px solid #ff9f2e;border-radius:50%;
    display:none;touch-action:none;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .item.edit .h{display:block}
  .h.rot{left:50%;top:-32px;transform:translateX(-50%);cursor:grab}
  .h.rot::after{content:'';position:absolute;left:50%;top:16px;width:2px;height:14px;background:#ff9f2e;transform:translateX(-50%)}
  .h.rez{right:-9px;bottom:-9px;cursor:nwse-resize}

  .sticky{border-radius:2px}
  .sticky::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 45%)}
  .sticky textarea{padding:16px 14px;font-size:24px;line-height:1.15;font-weight:500}

  .lined{border-radius:2px;
    background:linear-gradient(90deg,transparent 26px,rgba(220,90,90,.55) 26px,rgba(220,90,90,.55) 28px,transparent 28px),
    repeating-linear-gradient(#fffdf4 0 26px,#c9d4e2 26px 27px)}
  .lined textarea{padding:24px 12px 8px 36px;font-size:19px;line-height:27px}

  .photo{background:#f8f6f1;padding:10px 10px 6px;display:flex;flex-direction:column;border-radius:3px}
  .photo .ph{flex:1;background:#151312;overflow:hidden;pointer-events:none}
  .photo .ph img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .photo textarea.cap{height:38px;font-size:19px;text-align:center;padding:4px;color:#4a3b2c}

  .maplink{background:#fdfbf5;padding:8px 8px 6px;display:flex;flex-direction:column;border-radius:3px;gap:4px}
  .maplink .mlprev{flex:1;background:#e8e4dc;border-radius:2px;overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;pointer-events:none}
  .maplink .mlprev iframe{width:100%;height:100%;border:0;pointer-events:none}
  .maplink .mlicon{font-size:46px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  .maplink .mlprev .mltag{position:absolute;bottom:4px;left:6px;font-size:10px;color:#6b5d4a;letter-spacing:.4px}
  .maplink .mltitle{font-family:'Caveat',cursive;font-size:19px;color:#2b4a8b;text-decoration:underline;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:auto;cursor:pointer}

  /* ---------- selection toolbar ---------- */
  #selbar{position:fixed;display:none;gap:4px;background:rgba(28,24,20,.94);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:4px;transform:translate(-50%,-100%);z-index:1000;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  #selbar button{background:#3a332c;color:#f0e9de;border:0;border-radius:7px;padding:7px 10px;font-size:14px;cursor:pointer}
  #selbar button:hover{background:#544a3f}
  #selbar button.danger:hover{background:#8a2a20}

  /* ---------- top bar (undo/redo/sync) ---------- */
  #topbar{position:fixed;top:10px;right:10px;z-index:1001;display:flex;gap:6px}
  #topbar button{background:rgba(28,24,20,.9);color:#f0e9de;border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  #topbar button:hover{background:#453b31}
  #topbar button:disabled{opacity:.35;cursor:default}
  #topbar button small{display:block;font-size:9px;letter-spacing:.3px;opacity:.8}

  /* ---------- dock ---------- */
  #dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
    display:flex;gap:6px;background:rgba(28,24,20,.92);border:1px solid rgba(255,255,255,.12);
    border-radius:18px;padding:8px 10px;z-index:1000;box-shadow:0 10px 26px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
  #dock button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;
    background:transparent;color:#e8e0d2;border:0;border-radius:12px;padding:8px 8px 6px;cursor:pointer;
    font-size:22px;line-height:1;transition:transform .15s ease,background .15s ease}
  #dock button span{font-size:10px;font-family:inherit;letter-spacing:.3px;opacity:.85}
  #dock button:hover{transform:translateY(-8px) scale(1.18);background:#453b31}
  #dock button.active{background:#4a3428;outline:2px solid #c0392b}

  /* ---------- variant picker ---------- */
  #picker{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:none;gap:10px;
    background:rgba(28,24,20,.95);border:1px solid rgba(255,255,255,.12);border-radius:14px;
    padding:10px 12px;z-index:1001;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  #picker button{width:44px;height:44px;border-radius:8px;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:transform .12s}
  #picker button:hover{transform:scale(1.15)}

  /* ---------- thread cut bar ---------- */
  #threadbar{position:fixed;display:none;background:rgba(28,24,20,.94);border:1px solid rgba(255,255,255,.14);
    border-radius:10px;padding:4px;transform:translate(-50%,-50%);z-index:1000;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  #threadbar button{background:#8a2a20;color:#fff;border:0;border-radius:7px;padding:8px 12px;
    font-size:13px;cursor:pointer;font-weight:600}
  #threadbar button:hover{background:#a83528}

  /* ---------- diagnostics ---------- */
  #diag{position:fixed;top:60px;right:10px;z-index:1000;background:rgba(20,17,14,.9);color:#d8cfc0;
    border:1px solid rgba(255,255,255,.12);border-radius:10px;font:11px/1.5 ui-monospace,Menlo,monospace;
    max-width:230px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  #diagHead{padding:6px 10px;cursor:pointer;font-weight:700;letter-spacing:.4px;display:flex;justify-content:space-between;gap:12px}
  #diagBody{padding:2px 10px 8px;display:none}
  #diag.open #diagBody{display:block}
  #diag .logs{opacity:.75;border-top:1px solid rgba(255,255,255,.1);margin-top:5px;padding-top:5px}

  /* ---------- modals ---------- */
  .overlay{position:fixed;inset:0;background:rgba(15,10,5,.55);display:none;align-items:center;
    justify-content:center;z-index:2000;backdrop-filter:blur(2px);padding:16px}
  .overlay.open{display:flex}
  .dialog{background:#fdf9f0;color:#3a2c1c;border-radius:14px;padding:20px 20px 16px;width:100%;max-width:400px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);border:1px solid rgba(120,90,50,.3)}
  .dialog h3{margin:0 0 4px;font-family:'Caveat',cursive;font-size:26px;color:#4a3220}
  .dialog p.sub{margin:0 0 12px;font-size:12px;color:#8a7458}
  .dialog label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    color:#8a7458;margin:10px 0 4px}
  .dialog input{width:100%;padding:10px 12px;border:1.5px solid #d8c9ae;border-radius:8px;font-size:14px;
    background:#fff;color:#3a2c1c;outline:none;font-family:inherit}
  .dialog input:focus{border-color:#c98f3d}
  .dialog input.bad{border-color:#c0392b;background:#fdf0ee}
  .dialog .err{display:none;color:#b03a2a;font-size:12px;margin-top:5px}
  .dialog .hint{display:none;margin-top:8px;font-size:12px;background:#eef6e6;border:1px solid #cfe3bd;
    color:#3d6b22;border-radius:8px;padding:7px 10px}
  .dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .dialog .row button{border:0;border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer;font-weight:600}
  .dialog .cancel{background:#e8e0cf;color:#5a4a36}
  .dialog .ok{background:#8a5a2b;color:#fff}
  .dialog .ok:hover{background:#a06c35}
  .dialog .ghost{background:transparent;color:#8a5a2b;border:1.5px solid #c9a76a !important}
  .dialog .status{margin-top:12px;font-size:12px;color:#6b5a44;background:#f4ecdc;border-radius:8px;
    padding:8px 10px;display:none;word-break:break-word}

  /* ---------- toasts ---------- */
  #toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:1200;display:flex;
    flex-direction:column;align-items:center;gap:6px;pointer-events:none}
  .toast{background:rgba(24,20,17,.94);color:#f5efe2;border:1px solid rgba(255,255,255,.14);
    border-radius:20px;padding:8px 16px;font-size:13px;box-shadow:0 6px 16px rgba(0,0,0,.4);
    animation:tin .18s ease,tout .4s ease 2.1s forwards;max-width:88vw;text-align:center}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  @keyframes tout{to{opacity:0;transform:translateY(-6px)}}

  @media (max-width:560px){
    #dock button{min-width:48px;font-size:19px}
    #diag{max-width:170px;top:56px}
    #topbar button{padding:7px 10px;font-size:15px}
  }
</style>
</head>
<body>

<div id="viewport"><div id="world"><svg id="threads"></svg></div></div>
<div id="vignette"></div>

<div id="topbar">
  <button id="btnUndo" title="Undo">↶<small>undo</small></button>
  <button id="btnRedo" title="Redo">↷<small>redo</small></button>
  <button id="btnSync" title="GitHub sync">☁️<small>sync</small></button>
</div>

<div id="diag"><div id="diagHead"><span>◉ diagnostics</span><span>▾</span></div><div id="diagBody"></div></div>

<div id="selbar">
  <button data-act="front" title="Bring to front">⬆</button>
  <button data-act="back" title="Send to back">⬇</button>
  <button data-act="dup" title="Duplicate">⧉</button>
  <button data-act="del" title="Delete" class="danger">🗑</button>
</div>

<div id="threadbar"><button id="btnCutThread">✂ cut thread</button></div>

<div id="picker"></div>

<div id="dock">
  <button data-tool="sticky" title="Sticky note">🟨<span>Sticky</span></button>
  <button data-tool="lined" title="Lined note">🗒️<span>Lined</span></button>
  <button data-tool="photo" title="Photo (upload)">🖼️<span>Photo</span></button>
  <button data-tool="url" title="Photo from URL">🔗<span>URL</span></button>
  <button data-tool="maplink" title="Map link (Google Maps)">🗺️<span>Map</span></button>
  <button data-tool="thread" title="Red thread (T)">🧵<span>Thread</span></button>
</div>

<!-- link modal (photo URL + map link) -->
<div class="overlay" id="linkModal">
  <div class="dialog">
    <h3 id="lmTitle">Add link</h3>
    <p class="sub" id="lmSub"></p>
    <label for="lmName">Title</label>
    <input id="lmName" type="text" placeholder="e.g. Warehouse district" autocomplete="off">
    <label for="lmUrl">URL</label>
    <input id="lmUrl" type="url" placeholder="https://…" autocomplete="off" inputmode="url">
    <div class="err" id="lmErr"></div>
    <div class="hint" id="lmHint">📍 Google Maps link detected — a live location preview will be embedded.</div>
    <div class="row">
      <button class="cancel" id="lmCancel">Cancel</button>
      <button class="ok" id="lmOk">Pin to board</button>
    </div>
  </div>
</div>

<!-- GitHub sync modal -->
<div class="overlay" id="ghModal">
  <div class="dialog">
    <h3>GitHub sync</h3>
    <p class="sub">Push / pull this board as a JSON file in your repo (GitHub Contents API). Your token is stored only in this browser.</p>
    <label for="ghToken">Personal access token</label>
    <input id="ghToken" type="password" placeholder="github_pat_…" autocomplete="off">
    <label for="ghRepo">Repository (owner/repo)</label>
    <input id="ghRepo" type="text" placeholder="you/case-files" autocomplete="off">
    <label for="ghPath">File path</label>
    <input id="ghPath" type="text" placeholder="redboard/board.json" autocomplete="off">
    <label for="ghBranch">Branch</label>
    <input id="ghBranch" type="text" placeholder="main" autocomplete="off">
    <div class="err" id="ghErr"></div>
    <div class="status" id="ghStatus"></div>
    <div class="row">
      <button class="cancel" id="ghClose">Close</button>
      <button class="ghost" id="ghPull">⬇ Pull</button>
      <button class="ok" id="ghPush">⬆ Push</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
(()=>{ 'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const uid=()=>'i'+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const vp=$('#viewport'),world=$('#world'),svg=$('#threads'),selbar=$('#selbar'),
      diag=$('#diag'),diagBody=$('#diagBody'),dock=$('#dock'),picker=$('#picker'),toasts=$('#toasts');
const SVGNS='http://www.w3.org/2000/svg';
const STICKY={yellow:'#ffe08a',pink:'#ffc4d6',blue:'#b5dcff',green:'#c8efaf'};

/* ================= state ================= */
const S={items:[],threads:[],pan:{x:0,y:0},zoom:1,zTop:1,zMin:0,
         mode:'select',threadFrom:null,sel:null,editId:null,selThread:null,store:'indexeddb'};
let editing=false;

/* ================= undo / redo ================= */
const undoStack=[],redoStack=[];let lastPush=0;
function snapshot(){
  return JSON.parse(JSON.stringify({items:S.items.map(({el,...r})=>r),threads:S.threads,zTop:S.zTop,zMin:S.zMin}));
}
function pushUndo(gap=0){
  const n=Date.now();if(n-lastPush<gap)return;lastPush=n;
  undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift();
  redoStack.length=0;updateUndoBtns();renderDiag();
}
function updateUndoBtns(){
  $('#btnUndo').disabled=!undoStack.length;
  $('#btnRedo').disabled=!redoStack.length;
}
function restore(snap){
  world.querySelectorAll('.item').forEach(e=>e.remove());
  S.items=[];S.threads=JSON.parse(JSON.stringify(snap.threads||[]));
  S.zTop=snap.zTop||1;S.zMin=snap.zMin||0;
  (snap.items||[]).forEach(it=>{const c=JSON.parse(JSON.stringify(it));S.items.push(c);buildEl(c);});
  S.sel=null;S.editId=null;S.selThread=null;S.threadFrom=null;
  renderThreads();positionSelbar();save();renderDiag();
}
function undo(){
  if(!undoStack.length){toast('Nothing to undo');return;}
  redoStack.push(snapshot());restore(undoStack.pop());
  updateUndoBtns();log('undo');toast('Undone');
}
function redo(){
  if(!redoStack.length){toast('Nothing to redo');return;}
  undoStack.push(snapshot());restore(redoStack.pop());
  updateUndoBtns();log('redo');toast('Redone');
}
$('#btnUndo').addEventListener('click',undo);
$('#btnRedo').addEventListener('click',redo);

/* ================= diag & toast ================= */
const logs=[];
function log(m){logs.unshift(new Date().toLocaleTimeString()+'  '+m);if(logs.length>6)logs.length=6;renderDiag();}
function renderDiag(){
  diagBody.innerHTML=
   'mode: '+S.mode+(S.editId?' (editing item)':'')+'<br>zoom: '+Math.round(S.zoom*100)+'%'+
   '<br>items: '+S.items.length+'<br>threads: '+S.threads.length+
   '<br>undo: '+undoStack.length+' / redo: '+redoStack.length+
   '<br>store: '+S.store+'<div class="logs">'+logs.join('<br>')+'</div>';
}
$('#diagHead').addEventListener('click',()=>diag.classList.toggle('open'));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;toasts.appendChild(t);
  setTimeout(()=>t.remove(),2600);}

/* ================= storage (IndexedDB + fallback) ================= */
let idbDb=null;
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('redboard',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>{idbDb=r.result;res();};
  r.onerror=()=>rej(r.error);});}
function idbPut(v){return new Promise((res,rej)=>{
  const t=idbDb.transaction('kv','readwrite');t.objectStore('kv').put(v,'board1');
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
function idbGet(){return new Promise((res,rej)=>{
  const q=idbDb.transaction('kv').objectStore('kv').get('board1');
  q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);});}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(doSave,400);renderDiag();}
async function doSave(){
  const data=JSON.stringify({items:S.items.map(({el,...r})=>r),threads:S.threads,
    pan:S.pan,zoom:S.zoom,zTop:S.zTop,zMin:S.zMin});
  try{
    if(idbDb){await idbPut(data);S.store='indexeddb';}
    else{localStorage.setItem('redboard1',data);S.store='localStorage';}
  }catch(e){
    try{localStorage.setItem('redboard1',data);S.store='localStorage (fallback)';}
    catch(e2){S.store='FAILED';}
    log('save error: '+e.message);
  }
  renderDiag();
}

/* ================= cork texture ================= */
function makeCork(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#a97e53';g.fillRect(0,0,256,256);
  for(let i=0;i<70;i++){
    const x=Math.random()*256,y=Math.random()*256,r=14+Math.random()*30;
    g.fillStyle=Math.random()<.5?'rgba(120,80,45,'+(0.04+Math.random()*.06)+')'
                                :'rgba(215,175,125,'+(0.04+Math.random()*.06)+')';
    g.beginPath();g.ellipse(x,y,r,r*(0.6+Math.random()*.6),Math.random()*3.2,0,6.3);g.fill();
  }
  for(let i=0;i<2800;i++){
    const x=Math.random()*256,y=Math.random()*256,r=.4+Math.random()*2.1;
    g.fillStyle=Math.random()<.52?'rgba(66,42,22,'+(0.05+Math.random()*.13)+')'
                                 :'rgba(255,226,180,'+(0.04+Math.random()*.1)+')';
    g.beginPath();g.ellipse(x,y,r*1.7,r,Math.random()*3.2,0,6.3);g.fill();
  }
  vp.style.backgroundImage='url('+c.toDataURL()+')';
}

/* ================= view transforms ================= */
const s2w=(sx,sy)=>({x:(sx-S.pan.x)/S.zoom,y:(sy-S.pan.y)/S.zoom});
const w2s=(wx,wy)=>({x:wx*S.zoom+S.pan.x,y:wy*S.zoom+S.pan.y});
function applyView(){
  world.style.transform='translate('+S.pan.x+'px,'+S.pan.y+'px) scale('+S.zoom+')';
  vp.style.backgroundPosition=S.pan.x+'px '+S.pan.y+'px';
  vp.style.backgroundSize=(256*S.zoom)+'px '+(256*S.zoom)+'px';
  positionSelbar();positionThreadbar();renderDiag();
}

/* ================= url helpers ================= */
function validURL(u){
  try{const x=new URL(u.trim());return /^https?:$/.test(x.protocol)?x:null;}catch(e){return null;}
}
function isMapURL(u){
  const x=validURL(u);if(!x)return false;
  const h=x.hostname.toLowerCase();
  return (/(^|\.)google\.[a-z.]+$/.test(h)&&x.pathname.includes('/maps'))
      || h==='maps.app.goo.gl'
      || (h==='goo.gl'&&x.pathname.startsWith('/maps'))
      || h.startsWith('maps.google');
}
function mapQuery(u){ // extract something embeddable from a Google Maps URL
  try{
    const x=new URL(u);
    const q=x.searchParams.get('q')||x.searchParams.get('query')||x.searchParams.get('destination');
    if(q)return q;
    const at=u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/);if(at)return at[1]+','+at[2];
    const pl=u.match(/\/place\/([^\/]+)/);if(pl)return decodeURIComponent(pl[1]).replace(/\+/g,' ');
    const dir=u.match(/\/dir\/([^?]+)/);if(dir)return decodeURIComponent(dir[1]).split('/').filter(Boolean).join(' to ');
  }catch(e){}
  return null;
}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'');}catch(e){return u;}};

/* ================= items ================= */
function byId(id){return S.items.find(i=>i.id===id);}
function anchorOf(it){ // pin anchor = top-center, rotated about item center
  const cx=it.x+it.w/2,cy=it.y+it.h/2,r=(it.rot||0)*Math.PI/180,dy=-it.h/2;
  return {x:cx-dy*Math.sin(r),y:cy+dy*Math.cos(r)};
}
function place(it){
  it.el.style.transform='translate('+it.x+'px,'+it.y+'px) rotate('+(it.rot||0)+'deg)';
  it.el.style.width=it.w+'px';it.el.style.height=it.h+'px';it.el.style.zIndex=it.z;
}
function viewCenter(){
  const c=s2w(innerWidth/2,innerHeight/2);
  return {x:c.x+(Math.random()*40-20),y:c.y+(Math.random()*40-20)};
}
function addItem(type,opts={}){
  pushUndo();
  const c=opts.x!==undefined?{x:opts.x,y:opts.y}:viewCenter();
  const base={id:uid(),type,x:c.x,y:c.y,rot:0,z:++S.zTop,text:'',caption:'',src:'',color:'yellow',url:'',mapq:''};
  if(type==='sticky'){base.w=190;base.h=190;base.rot=Math.random()*6-3;base.color=opts.color||'yellow';}
  if(type==='lined'){base.w=230;base.h=270;base.rot=Math.random()*6-3;}
  if(type==='photo'){base.w=210;base.h=252;base.rot=Math.random()*4-2;base.src=opts.src||'';base.caption=opts.caption||'';}
  if(type==='maplink'){base.w=250;base.h=215;base.rot=Math.random()*4-2;
    base.url=opts.url||'';base.text=opts.title||'';base.mapq=opts.mapq||'';}
  base.x-=base.w/2;base.y-=base.h/2;
  Object.assign(base,opts.extra||{});
  S.items.push(base);buildEl(base);select(base);save();
  log('added '+type);return base;
}
function buildEl(it){
  const el=document.createElement('div');
  el.className='item '+it.type;el.dataset.id=it.id;
  if(it.type==='photo'){
    el.innerHTML='<div class="ph"><img draggable="false"></div><textarea class="cap" readonly placeholder="caption…"></textarea>';
    el.querySelector('img').src=it.src;
    const cap=el.querySelector('.cap');cap.value=it.caption||'';
    cap.addEventListener('input',()=>{pushUndo(1500);it.caption=cap.value;save();});
    wireEdit(cap);
  }else if(it.type==='maplink'){
    el.innerHTML='<div class="mlprev"></div><a class="mltitle" target="_blank" rel="noopener noreferrer"></a>';
    const prev=el.querySelector('.mlprev');
    if(it.mapq){
      const f=document.createElement('iframe');
      f.src='https://www.google.com/maps?q='+encodeURIComponent(it.mapq)+'&output=embed';
      f.setAttribute('loading','lazy');f.setAttribute('draggable','false');
      prev.appendChild(f);
    }else{
      prev.innerHTML='<div class="mlicon">📍</div><span class="mltag">map link — no preview available</span>';
    }
    const a=el.querySelector('.mltitle');
    a.textContent=it.text||hostOf(it.url);a.href=it.url;a.title=it.url;
    a.addEventListener('pointerdown',e=>e.stopPropagation());
    a.addEventListener('click',e=>e.stopPropagation());
  }else{
    el.innerHTML='<textarea readonly placeholder="write…"></textarea>';
    const ta=el.querySelector('textarea');ta.value=it.text||'';
    ta.addEventListener('input',()=>{pushUndo(1500);it.text=ta.value;save();});
    wireEdit(ta);
    if(it.type==='sticky')el.style.background=STICKY[it.color]||STICKY.yellow;
  }
  el.insertAdjacentHTML('beforeend','<div class="h rot" data-h="rot"></div><div class="h rez" data-h="rez"></div>');
  el.addEventListener('dblclick',e=>{e.stopPropagation();select(it);setEdit(it);});
  it.el=el;world.appendChild(el);place(it);
}
function wireEdit(ta){
  ta.addEventListener('blur',()=>{ta.readOnly=true;ta.style.pointerEvents='';editing=false;save();});
}
function enableEdit(it){ // text editing (only while item is in manipulate mode)
  const ta=it.el.querySelector('textarea');if(!ta)return;
  editing=true;ta.readOnly=false;ta.style.pointerEvents='auto';ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
}

/* ================= selection & edit mode ================= */
function select(it){
  S.sel=it?it.id:null;S.selThread=null;
  world.querySelectorAll('.item.sel').forEach(e=>e.classList.remove('sel'));
  if(it)it.el.classList.add('sel');
  positionSelbar();renderThreads();
}
function setEdit(it){
  S.editId=it?it.id:null;
  world.querySelectorAll('.item.edit').forEach(e=>e.classList.remove('edit'));
  if(it){it.el.classList.add('edit');log('edit mode: '+it.type);}
  renderDiag();
}
function positionSelbar(){
  const it=S.sel&&byId(S.sel);
  if(!it){selbar.style.display='none';return;}
  const a=anchorOf(it),s=w2s(a.x,a.y);
  selbar.style.display='flex';selbar.style.left=s.x+'px';selbar.style.top=(s.y-14)+'px';
}
const threadbar=$('#threadbar');
function positionThreadbar(){
  const t=S.selThread&&S.threads.find(x=>x.id===S.selThread);
  const a=t&&byId(t.from),b=t&&byId(t.to);
  if(!a||!b){threadbar.style.display='none';return;}
  const p1=anchorOf(a),p2=anchorOf(b);
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2+Math.min(130,Math.hypot(p2.x-p1.x,p2.y-p1.y)*.18)+12;
  const s=w2s((p1.x+2*mx+p2.x)/4,(p1.y+2*my+p2.y)/4); // curve midpoint
  threadbar.style.display='block';threadbar.style.left=s.x+'px';threadbar.style.top=s.y+'px';
}
$('#btnCutThread').addEventListener('click',()=>{if(S.selThread)cutThread(S.selThread);});
selbar.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!S.sel)return;
  const it=byId(S.sel);if(!it)return;
  const act=b.dataset.act;
  if(act==='front'){pushUndo();it.z=++S.zTop;place(it);log('brought to front');}
  if(act==='back'){pushUndo();it.z=--S.zMin;place(it);log('sent to back');}
  if(act==='dup'){
    pushUndo();
    const copy=JSON.parse(JSON.stringify({...it,el:undefined}));
    copy.id=uid();copy.x+=26;copy.y+=26;copy.z=++S.zTop;
    S.items.push(copy);buildEl(copy);select(copy);log('duplicated');
  }
  if(act==='del'){deleteItem(it.id);}
  save();
});
function deleteItem(id){
  const it=byId(id);if(!it)return;
  pushUndo();
  it.el.remove();S.items=S.items.filter(i=>i.id!==id);
  S.threads=S.threads.filter(t=>t.from!==id&&t.to!==id);
  if(S.sel===id)S.sel=null;if(S.editId===id)S.editId=null;if(S.threadFrom===id)S.threadFrom=null;
  select(null);save();log('item deleted');toast('Item removed');
}

/* ================= threads ================= */
function clearPend(){world.querySelectorAll('.item.pend').forEach(e=>e.classList.remove('pend'));}
function threadClick(it){
  if(!S.threadFrom){
    S.threadFrom=it.id;it.el.classList.add('pend');
    toast('Pin set — tap another item to tie the thread');
  }else if(S.threadFrom===it.id){
    clearPend();S.threadFrom=null;toast('Pin cleared');
  }else{
    const dup=S.threads.some(t=>(t.from===S.threadFrom&&t.to===it.id)||(t.from===it.id&&t.to===S.threadFrom));
    if(dup){toast('Those two are already tied');}
    else{pushUndo();S.threads.push({id:uid(),from:S.threadFrom,to:it.id});log('thread tied');save();}
    clearPend();S.threadFrom=it.id;it.el.classList.add('pend');
  }
  renderThreads();
}
function cutThread(id){
  pushUndo();
  S.threads=S.threads.filter(t=>t.id!==id);
  if(S.selThread===id)S.selThread=null;
  renderThreads();save();log('thread cut');toast('Thread cut ✂');
}
function unpin(itemId){ // long-press on a pin: cut every thread tied there
  const n=S.threads.filter(t=>t.from===itemId||t.to===itemId).length;
  if(!n)return;
  pushUndo();
  S.threads=S.threads.filter(t=>t.from!==itemId&&t.to!==itemId);
  renderThreads();save();log('unpinned ('+n+' thread'+(n>1?'s':'')+' cut)');
  toast('Pin removed — '+n+' thread'+(n>1?'s':'')+' cut');
}
let pinTimer=null;
function renderThreads(){
  svg.innerHTML='';
  const defs=document.createElementNS(SVGNS,'defs');
  defs.innerHTML='<radialGradient id="pg" cx="35%" cy="30%" r="80%">'+
    '<stop offset="0%" stop-color="#ff8a6a"/><stop offset="55%" stop-color="#c93a28"/>'+
    '<stop offset="100%" stop-color="#7e1f12"/></radialGradient>';
  svg.appendChild(defs);
  for(const t of S.threads){
    const a1=byId(t.from),a2=byId(t.to);if(!a1||!a2)continue;
    const p1=anchorOf(a1),p2=anchorOf(a2);
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;
    const sag=Math.min(130,Math.hypot(p2.x-p1.x,p2.y-p1.y)*.18)+12;
    const d='M '+p1.x+' '+p1.y+' Q '+mx+' '+(my+sag)+' '+p2.x+' '+p2.y;
    const hit=document.createElementNS(SVGNS,'path');
    hit.setAttribute('d',d);hit.setAttribute('class','hit');
    hit.setAttribute('stroke','rgba(0,0,0,0)');hit.setAttribute('stroke-width',16/S.zoom+8);
    hit.setAttribute('fill','none');
    hit.addEventListener('pointerdown',e=>{e.stopPropagation();});
    hit.addEventListener('click',e=>{
      e.stopPropagation();S.sel=null;setEdit(null);
      world.querySelectorAll('.item.sel').forEach(x=>x.classList.remove('sel'));
      S.selThread=t.id;renderThreads();positionSelbar();});
    svg.appendChild(hit);
    const p=document.createElementNS(SVGNS,'path');
    p.setAttribute('d',d);p.setAttribute('fill','none');
    p.setAttribute('stroke',S.selThread===t.id?'#ff5a3c':'#c2362b');
    p.setAttribute('stroke-width',S.selThread===t.id?4.5:3);
    p.setAttribute('stroke-linecap','round');p.setAttribute('opacity','.96');
    svg.appendChild(p);
  }
  const pinned=new Set();S.threads.forEach(t=>{pinned.add(t.from);pinned.add(t.to);});
  for(const id of pinned){
    const it=byId(id);if(!it)continue;const a=anchorOf(it);
    const g=document.createElementNS(SVGNS,'g');
    g.setAttribute('class','pin');g.dataset.item=id;
    const tt=document.createElementNS(SVGNS,'title');tt.textContent='Hold to unpin';g.appendChild(tt);
    const mk=(cx,cy,r,fill,extra)=>{const c=document.createElementNS(SVGNS,'circle');
      c.setAttribute('cx',cx);c.setAttribute('cy',cy);c.setAttribute('r',r);c.setAttribute('fill',fill);
      if(extra)for(const k in extra)c.setAttribute(k,extra[k]);return c;};
    g.appendChild(mk(a.x+2,a.y+3.5,8,'rgba(30,10,5,.35)'));
    g.appendChild(mk(a.x,a.y,7.5,'url(#pg)',{stroke:'#5e170c','stroke-width':'.8'}));
    g.appendChild(mk(a.x-2.4,a.y-2.6,2.1,'#ffd9cf',{opacity:'.85'}));
    g.addEventListener('pointerdown',e=>{
      e.stopPropagation();clearTimeout(pinTimer);
      pinTimer=setTimeout(()=>{unpin(id);pinTimer=null;},550);
    });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>
      g.addEventListener(ev,()=>{clearTimeout(pinTimer);pinTimer=null;}));
    svg.appendChild(g);
  }
  positionThreadbar();renderDiag();
}

/* ================= modes ================= */
function setMode(m){
  S.mode=m;clearPend();S.threadFrom=null;
  dock.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tool==='thread'&&m==='thread'));
  if(m==='thread')toast('Thread mode — tap two items to tie red thread · tap 🧵 again to exit');

/* ================= gestures =================
   tap item            = select only
   double-tap item     = edit mode (drag to move, handles to resize/rotate)
   long-press pin      = unpin
   drag empty board    = pan
================================================= */
const ptrs=new Map();let g=null,pinch=null,lastTap={id:null,t:0};
function handleTap(it){
  const now=Date.now();
  const dbl=lastTap.id===it.id&&now-lastTap.t<380;
  lastTap={id:it.id,t:now};
  if(dbl){select(it);setEdit(it);toast('Edit mode — drag to move · click the surface to type · handles resize & rotate');return;}
  if(S.editId===it.id)return;
  if(S.sel===it.id){setEdit(it);return;} // clicking an already-selected item enters edit mode
  setEdit(null);select(it);
}
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('#selbar'))return;
  const ta=e.target.closest('textarea');
  if(ta){
    const el=ta.closest('.item'),it=el&&byId(el.dataset.id);
    if(it&&S.editId===it.id)enableEdit(it);
    return;
  }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{vp.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){
    const [a,b]=[...ptrs.values()];
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={d0:Math.hypot(a.x-b.x,a.y-b.y),z0:S.zoom,anchor:s2w(mid.x,mid.y)};
    g=null;return;
  }
  pinch=null;
  const wp=s2w(e.clientX,e.clientY);
  const h=e.target.closest('.h');
  if(h){
    const el=h.closest('.item'),it=el&&byId(el.dataset.id);if(!it)return;
    if(S.editId!==it.id)return;
    if(h.dataset.h==='rez')g={type:'rez',it,w0:it.w,h0:it.h,wx0:wp.x,wy0:wp.y,moved:false};
    else g={type:'rot',it,cx:it.x+it.w/2,cy:it.y+it.h/2,moved:false};
    return;
  }
  const itemEl=e.target.closest('.item');
  if(itemEl){
    const it=byId(itemEl.dataset.id);if(!it)return;
    if(S.mode==='thread'){threadClick(it);g={type:'none'};return;}
    if(S.editId===it.id){
      g={type:'move',it,ox:wp.x-it.x,oy:wp.y-it.y,moved:false};
    }else{
      g={type:'tap',it,moved:false};
    }
    return;
  }
  // empty board
  if(S.mode==='thread'){clearPend();S.threadFrom=null;}
  if(S.selThread){S.selThread=null;renderThreads();}
  setEdit(null);select(null);
  g={type:'pan',sx:e.clientX,sy:e.clientY,px:S.pan.x,py:S.pan.y,moved:false};
});
window.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){
    const [a,b]=[...ptrs.values()];
    const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    S.zoom=clamp(pinch.z0*d/pinch.d0,.2,3.5);
    S.pan.x=mid.x-pinch.anchor.x*S.zoom;
    S.pan.y=mid.y-pinch.anchor.y*S.zoom;
    applyView();return;
  }
  if(!g)return;
  const wp=s2w(e.clientX,e.clientY);
  if(g.type==='pan'){
    S.pan.x=g.px+(e.clientX-g.sx);S.pan.y=g.py+(e.clientY-g.sy);g.moved=true;applyView();
  }else if(g.type==='move'||g.type==='rez'||g.type==='rot'){
    if(!g.moved){pushUndo();g.moved=true;}
    if(g.type==='move'){g.it.x=wp.x-g.ox;g.it.y=wp.y-g.oy;}
    else if(g.type==='rez'){
      g.it.w=clamp(g.w0+(wp.x-g.wx0),90,2000);
      g.it.h=clamp(g.h0+(wp.y-g.wy0),70,2000);
    }else{
      let ang=Math.atan2(wp.y-g.cy,wp.x-g.cx)*180/Math.PI+90;
      ang=((ang+540)%360)-180; // normalize to (-180,180]
      for(const L of [0,10,25,45,90,135,180]){ // snap to fixed orientation locks
        for(const s of [L,-L]){if(Math.abs(ang-s)<5){ang=s;}}
      }
      g.it.rot=Math.round(ang*10)/10;
    }
    place(g.it);renderThreads();positionSelbar();
  }else if(g.type==='tap'){
    g.moved=true;g={type:'none'}; // finger slid — cancel the tap
  }
});
function endPointer(e){
  ptrs.delete(e.pointerId);
  if(pinch&&ptrs.size<2){pinch=null;save();}
  if(g){
    if(g.type==='tap'&&!g.moved)handleTap(g.it);
    else if(g.type==='move'&&!g.moved)enableEdit(g.it); // click the surface in edit mode = type on it
    else if(g.moved)save();
  }
  g=null;
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',endPointer);
vp.addEventListener('contextmenu',e=>e.preventDefault());
vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:1/1.12;
  const w=s2w(e.clientX,e.clientY);
  S.zoom=clamp(S.zoom*f,.2,3.5);
  S.pan.x=e.clientX-w.x*S.zoom;S.pan.y=e.clientY-w.y*S.zoom;
  applyView();save();
},{passive:false});

/* ================= GitHub sync ================= */
const ghModal=$('#ghModal'),ghStatus=$('#ghStatus'),ghErr=$('#ghErr');
const GHKEY='redboard_gh';
function ghLoad(){
  try{return JSON.parse(localStorage.getItem(GHKEY))||{};}catch(e){return{};}
}
function ghSaveCfg(c){localStorage.setItem(GHKEY,JSON.stringify(c));}
function ghStatusMsg(m,isErr){
  ghStatus.style.display='block';ghStatus.textContent=m;
  ghStatus.style.color=isErr?'#b03a2a':'#3d6b22';
  log('sync: '+m);
}
function b64enc(s){const bytes=new TextEncoder().encode(s);let bin='';
  for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);}
function b64dec(b){const bin=atob(b.replace(/\n/g,''));const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);}
function ghCfg(){
  const c={token:$('#ghToken').value.trim(),repo:$('#ghRepo').value.trim(),
           path:$('#ghPath').value.trim()||'redboard/board.json',
           branch:$('#ghBranch').value.trim()||'main'};
  return c;
}
function ghValidate(c){
  if(!c.token)return 'Personal access token is required.';
  if(!/^[^\/\s]+\/[^\/\s]+$/.test(c.repo))return 'Repository must look like owner/repo.';
  if(!c.path)return 'File path is required.';
  return null;
}
async function ghFetch(url,c,opts={}){
  const r=await fetch(url,{...opts,headers:{
    'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  return r;
}
async function ghPush(){
  const c=ghCfg();const bad=ghValidate(c);
  if(bad){ghErr.textContent=bad;ghErr.style.display='block';return;}
  ghErr.style.display='none';ghSaveCfg(c);
  ghStatusMsg('Pushing…');
  try{
    const api='https://api.github.com/repos/'+c.repo+'/contents/'+c.path;
    let sha=null;
    const cur=await ghFetch(api+'?ref='+encodeURIComponent(c.branch),c);
    if(cur.ok){sha=(await cur.json()).sha;}
    else if(cur.status!==404){throw new Error('lookup failed: HTTP '+cur.status);}
    const payload=JSON.stringify({app:'redboard',version:3,exportedAt:new Date().toISOString(),
      board:{items:S.items.map(({el,...r})=>r),threads:S.threads,pan:S.pan,zoom:S.zoom,zTop:S.zTop,zMin:S.zMin}});
    const body={message:'redboard sync '+new Date().toISOString(),content:b64enc(payload),branch:c.branch};
    if(sha)body.sha=sha;
    const r=await ghFetch(api,c,{method:'PUT',body:JSON.stringify(body)});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status));}
    ghStatusMsg('Pushed ✓ '+c.repo+'/'+c.path+' ('+(payload.length/1024).toFixed(1)+' KB)');
    toast('Board pushed to GitHub ✓');
  }catch(e){ghStatusMsg('Push failed: '+e.message,true);toast('Push failed — see sync dialog');}
}
async function ghPull(){
  const c=ghCfg();const bad=ghValidate(c);
  if(bad){ghErr.textContent=bad;ghErr.style.display='block';return;}
  ghErr.style.display='none';ghSaveCfg(c);
  ghStatusMsg('Pulling…');
  try{
    const api='https://api.github.com/repos/'+c.repo+'/contents/'+c.path;
    const r=await ghFetch(api+'?ref='+encodeURIComponent(c.branch),c);
    if(r.status===404)throw new Error('file not found in repo');
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||('HTTP '+r.status));}
    const j=await r.json();
    const payload=JSON.parse(b64dec(j.content));
    if(!payload.board)throw new Error('not a redboard file');
    pushUndo();
    restore(payload.board);
    if(payload.board.pan){S.pan=payload.board.pan;S.zoom=payload.board.zoom||1;applyView();save();}
    ghStatusMsg('Pulled ✓ '+S.items.length+' items, '+S.threads.length+' threads');
    toast('Board pulled from GitHub ✓');
  }catch(e){ghStatusMsg('Pull failed: '+e.message,true);toast('Pull failed — see sync dialog');}
}
$('#btnSync').addEventListener('click',()=>{
  const c=ghLoad();
  $('#ghToken').value=c.token||'';$('#ghRepo').value=c.repo||'';
  $('#ghPath').value=c.path||'redboard/board.json';$('#ghBranch').value=c.branch||'main';
  ghErr.style.display='none';ghStatus.style.display='none';
  ghModal.classList.add('open');
});
$('#ghClose').addEventListener('click',()=>ghModal.classList.remove('open'));
ghModal.addEventListener('click',e=>{if(e.target===ghModal)ghModal.classList.remove('open');});
$('#ghPush').addEventListener('click',ghPush);
$('#ghPull').addEventListener('click',ghPull);

/* ================= dock & picker ================= */
function hidePicker(){picker.style.display='none';}
dock.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const tool=b.dataset.tool;hidePicker();
  if(tool==='sticky'){
    if(picker.dataset.open==='1'){picker.dataset.open='';return;}
    picker.innerHTML='';
    for(const [name,col] of Object.entries(STICKY)){
      const s=document.createElement('button');
      s.style.background=col;s.title=name;
      s.addEventListener('click',()=>{addItem('sticky',{color:name});hidePicker();picker.dataset.open='';toast('Sticky note pinned');});
      picker.appendChild(s);
    }
    picker.style.display='flex';picker.dataset.open='1';
    setTimeout(()=>{picker.dataset.open='';},50);
  }
  if(tool==='lined'){setMode('select');addItem('lined');toast('Lined note pinned');}
  if(tool==='photo'){
    setMode('select');
    const inp=document.createElement('input');
    inp.type='file';inp.accept='image/*';
    inp.onchange=()=>{
      const f=inp.files[0];if(!f)return;
      const r=new FileReader();
      r.onload=ev=>{addItem('photo',{src:ev.target.result});toast('Photo pinned');};
      r.readAsDataURL(f);
    };
    inp.click();
  }
  if(tool==='url'){
    setMode('select');
    openLinkModal('Add photo from URL','Give it a title (used as the caption) and a direct image link.',({url,title})=>{
      addItem('photo',{src:url,caption:title});toast('Photo pinned from URL');
    });
  }
  if(tool==='maplink'){
    setMode('select');
    openLinkModal('Add map link','Paste a Google Maps link — a live preview will be embedded when possible.',({url,title,isMap,mapq})=>{
      addItem('maplink',{url,title,mapq:(isMap&&mapq)?mapq:''});
      if(isMap&&mapq)toast('Map link pinned with live preview');
      else if(isMap)toast('Map link pinned — short links can\u2019t preview, title opens Google Maps');
      else toast('Link pinned (not recognised as Google Maps — title opens the link)');
    });
  }
  if(tool==='thread')setMode(S.mode==='thread'?'select':'thread');
});
vp.addEventListener('pointerdown',hidePicker);

/* ================= drop & paste ================= */
vp.addEventListener('dragover',e=>e.preventDefault());
vp.addEventListener('drop',e=>{
  e.preventDefault();
  const wp=s2w(e.clientX,e.clientY);let n=0;
  for(const f of e.dataTransfer.files){
    if(!f.type.startsWith('image/'))continue;
    const r=new FileReader();
    r.onload=ev=>{addItem('photo',{src:ev.target.result,x:wp.x,y:wp.y});};
    r.readAsDataURL(f);n++;
  }
  if(n)toast('Dropped '+n+' photo'+(n>1?'s':'')+' onto the board');
  else toast('Only image files can be pinned right now');
});
window.addEventListener('paste',e=>{
  if(document.querySelector('.overlay.open'))return;
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(const ci of items){
    if(ci.type.startsWith('image/')){
      const f=ci.getAsFile();const r=new FileReader();
      r.onload=ev=>{addItem('photo',{src:ev.target.result});toast('Photo pasted from clipboard');};
      r.readAsDataURL(f);return;
    }
  }
});

/* ================= keyboard ================= */
// No keyboard shortcuts — every action is mouse/touch driven (owner directive).
// Keys only work inside dialogs and text surfaces.
window.addEventListener('keydown',e=>{
  const modalOpen=document.querySelector('.overlay.open');
  if(modalOpen&&e.key==='Escape')modalOpen.classList.remove('open');
});

/* ================= init ================= */
(async function init(){
  makeCork();
  try{await idbOpen();}catch(e){idbDb=null;S.store='localStorage';}
  let raw=null;
  try{raw=idbDb?await idbGet():localStorage.getItem('redboard1');}catch(e){}
  if(!raw){try{raw=localStorage.getItem('redboard1');}catch(e){}}
  if(raw){
    try{
      const d=JSON.parse(raw);
      S.pan=d.pan||{x:0,y:0};S.zoom=d.zoom||1;S.zTop=d.zTop||1;S.zMin=d.zMin||0;
      (d.items||[]).forEach(it=>{S.items.push(it);buildEl(it);});
      S.threads=d.threads||[];
      log('board restored ('+S.items.length+' items)');
    }catch(e){log('restore failed: '+e.message);}
  }
  applyView();renderThreads();renderDiag();updateUndoBtns();
  log('ready · store='+S.store);
  if(!S.items.length)toast('Welcome to Redboard — pin evidence from the dock below');
})();
})();
</script>
