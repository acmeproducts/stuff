<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circle Menu Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  /* Theme variables */
  :root {
    --bg-color: #f0f0f0;
    --menu-bg: #007bff;
    --item-bg: #28a745;
    --diag-bg: #fff;
    --text-color: #000;
  }
  [data-theme="dark"] {
    --bg-color: #202020;
    --menu-bg: #1e90ff;
    --item-bg: #3cb371;
    --diag-bg: #2a2a2a;
    --text-color: #fff;
  }

  /* Mobile‑first layout */
  body, html {
    margin:0; padding:0;
    height:100%; width:100%;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    background:var(--bg-color);
    color:var(--text-color);
  }
  #menuContainer {
    position:relative;
    width:100%; height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #centerBtn {
    width:60px; height:60px;
    border-radius:50%;
    background:var(--menu-bg);
    color:#fff;
    border:none;
    font-size:1.2rem;
    z-index:2;
    position:relative;
  }
  .menuItem {
    position:absolute;
    width:50px; height:50px;
    border-radius:50%;
    background:var(--item-bg);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.9rem;
    opacity:0;
    transition:opacity 0.2s;
  }
  #diagnostics {
    position:absolute;
    bottom:0; left:0;
    width:100%;
    max-height:30%;
    background:var(--diag-bg);
    border-top:1px solid #ccc;
    font-size:0.8rem;
    overflow:auto;
    padding:5px;
    box-sizing:border-box;
  }
  #diagnostics h4 {
    margin:0 0 5px 0;
    font-size:0.9rem;
  }
  #themeToggle {
    position:absolute;
    top:10px;
    right:10px;
    background:transparent;
    border:1px solid var(--text-color);
    color:var(--text-color);
    padding:4px 8px;
    border-radius:4px;
    font-size:0.9rem;
  }
</style>
</head>
<body>
<div id="menuContainer">
  <button id="centerBtn">☰</button>
  <div id="diagnostics">
    <h4>Diagnostics</h4>
    <pre id="log"></pre>
  </div>
  <button id="themeToggle">Dark</button>
</div>

<script>
  // Core data
  const items = [
    {label:'A', action:()=>log('Item A clicked')},
    {label:'B', action:()=>log('Item B clicked')},
    {label:'C', action:()=>log('Item C clicked')},
    {label:'D', action:()=>log('Item D clicked')},
    {label:'E', action:()=>log('Item E clicked')},
    {label:'F', action:()=>log('Item F clicked')}
  ];

  const centerBtn = document.getElementById('centerBtn');
  const container = document.getElementById('menuContainer');
  const logEl = document.getElementById('log');
  const themeBtn = document.getElementById('themeToggle');
  let menuOpen = false;
  let itemElements = [];
  let currentTheme = 'light';

  function log(message) {
    const time = new Date().toLocaleTimeString();
    logEl.textContent += `[${time}] ${message}\n`;
    logEl.scrollTop = logEl.scrollHeight;
  }

  function createMenuItems() {
    itemElements.forEach(el => el.remove());
    itemElements = [];

    const radius = Math.min(container.clientWidth, container.clientHeight) / 2 - 80;
    const angleStep = (2 * Math.PI) / items.length;

    items.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'menuItem';
      btn.textContent = item.label;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        item.action();
        closeMenu();
      });
      container.appendChild(btn);
      itemElements.push(btn);

      const angle = i * angleStep - Math.PI/2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    });
  }

  function openMenu() {
    if (menuOpen) return;
    menuOpen = true;
    log('Menu opened');
    itemElements.forEach(el => el.style.opacity = '1');
  }

  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    log('Menu closed');
    itemElements.forEach(el => el.style.opacity = '0');
  }

  centerBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuOpen ? closeMenu() : openMenu();
  });

  container.addEventListener('click', (e) => {
    if (menuOpen && e.target === container) closeMenu();
  });

  // Simple touch handling
  let touchStartX = 0, touchStartY = 0;
  container.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  });
  container.addEventListener('touchend', (e) => {
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.hypot(dx, dy) < 30) {
      if (e.target === centerBtn) return;
      menuOpen ? closeMenu() : openMenu();
    }
  });

  // Theme toggle
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    themeBtn.textContent = theme === 'light' ? 'Dark' : 'Light';
    currentTheme = theme;
    log(`Theme set to ${theme}`);
  }

  themeBtn.addEventListener('click', () => {
    applyTheme(currentTheme === 'light' ? 'dark' : 'light');
  });

  // Initialize
  createMenuItems();
  closeMenu();
  applyTheme('light');
</script>
</body>
</html>
