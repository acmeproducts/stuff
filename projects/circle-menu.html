<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circle Menu Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root {
    --bg-color: #f0f0f0;
    --menu-bg: #007bff;
    --item-bg: #28a745;
    --diag-bg: #fff;
    --text-color: #000;
  }
  [data-theme="dark"] {
    --bg-color: #202020;
    --menu-bg: #1e90ff;
    --item-bg: #3cb371;
    --diag-bg: #2a2a2a;
    --text-color: #fff;
  }
  body,html{margin:0;padding:0;height:100%;width:100%;font-family:Arial,Helvetica,sans-serif;overflow:hidden;background:var(--bg-color);color:var(--text-color);}
  #menuContainer{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #heartBtn{
    width:60px;height:60px;
    border-radius:50%;
    background:#ff6666;
    color:#fff;
    font-size:1.5rem;
    border:none;
    position:absolute;
    left:calc(50% - 30px);
    top:calc(50% - 30px);
    z-index:2;
    touch-action:none;
    cursor:grab;
  }
  #centerBtn{display:none;}
  .menuItem{
    position:absolute;
    width:50px;height:50px;
    border-radius:50%;
    background:var(--item-bg);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:0.9rem;
    opacity:0;
    transition:opacity 0.2s;
  }
  #diagnostics{
    position:absolute;
    bottom:0;left:0;
    width:100%;
    max-height:30%;
    background:var(--diag-bg);
    border-top:1px solid #ccc;
    font-size:0.8rem;
    overflow:auto;
    padding:5px;
    box-sizing:border-box;
  }
  #diagnostics h4{margin:0 0 5px 0;font-size:0.9rem;}
  #themeToggle{
    position:absolute;
    top:10px;right:10px;
    background:transparent;
    border:1px solid var(--text-color);
    color:var(--text-color);
    padding:4px 8px;
    border-radius:4px;
    font-size:0.9rem;
  }
  #closeBtn{
    position:absolute;
    top:10px;right:10px;
    background:transparent;
    border:none;
    color:var(--text-color);
    font-size:1.2rem;
    cursor:pointer;
    z-index:3;
    display:none;
  }
  /* Pop‑over for long‑press */
  #lpMenu{
    position:absolute;
    background:var(--diag-bg);
    border:1px solid #888;
    border-radius:4px;
    padding:4px 8px;
    display:none;
    z-index:4;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
  }
  #lpMenu button{
    background:none;
    border:none;
    color:var(--text-color);
    padding:4px 0;
    width:100%;
    text-align:left;
    cursor:pointer;
    font-size:0.9rem;
  }
  #lpMenu button:hover{background:rgba(0,0,0,0.1);}
</style>
</head>
<body>
<div id="menuContainer">
  <button id="heartBtn">❤️</button>
  <button id="centerBtn">☰</button>
  <div id="diagnostics"><h4>Diagnostics</h4><pre id="log"></pre></div>
  <button id="themeToggle">Dark</button>
  <button id="closeBtn" style="display:none;">✕</button>
  <div id="lpMenu">
    <button id="configBtn">Configure</button>
    <button id="quitBtn">Quit</button>
  </div>
</div>

<script>
  const items = [
    {label:'A',action:()=>log('Item A')},
    {label:'B',action:()=>log('Item B')},
    {label:'C',action:()=>log('Item C')},
    {label:'D',action:()=>log('Item D')},
    {label:'E',action:()=>log('Item E')},
    {label:'F',action:()=>log('Item F')}
  ];
  const container=document.getElementById('menuContainer');
  const heartBtn=document.getElementById('heartBtn');
  const closeBtn=document.getElementById('closeBtn');
  const themeBtn=document.getElementById('themeToggle');
  const logEl=document.getElementById('log');
  const lpMenu=document.getElementById('lpMenu');
  const configBtn=document.getElementById('configBtn');
  const quitBtn=document.getElementById('quitBtn');

  let menuOpen=false;
  let itemElements=[];
  let currentTheme='light';
  let dragOffset={x:0,y:0};

  // Long‑press handling
  let lpTimer=null;
  const LP_DELAY=600; // ms

  function log(msg){
    const t=new Date().toLocaleTimeString();
    logEl.textContent+=`[${t}] ${msg}\n`;
    logEl.scrollTop=logEl.scrollHeight;
  }

  function createMenuItems(){
    itemElements.forEach(el=>el.remove());
    itemElements=[];
    const radius=Math.min(container.clientWidth,container.clientHeight)/2-80;
    const step=(2*Math.PI)/items.length;
    items.forEach((it,i)=>{
      const btn=document.createElement('button');
      btn.className='menuItem';
      btn.textContent=it.label;
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        it.action();
        closeMenu();
      });
      container.appendChild(btn);
      itemElements.push(btn);
      const angle=i*step-Math.PI/2;
      const x=Math.cos(angle)*radius;
      const y=Math.sin(angle)*radius;
      btn.style.transform=`translate(${x}px,${y}px)`;
    });
  }

  function openMenu(){
    if(menuOpen) return;
    menuOpen=true;
    log('Menu opened');
    itemElements.forEach(el=>el.style.opacity='1');
    closeBtn.style.display='block';
  }
  function closeMenu(){
    if(!menuOpen) return;
    menuOpen=false;
    log('Menu closed');
    itemElements.forEach(el=>el.style.opacity='0');
    closeBtn.style.display='none';
  }

  heartBtn.addEventListener('click',e=>{
    e.stopPropagation();
    // ignore click if long‑press menu is visible
    if(lpMenu.style.display==='block') return;
    menuOpen?closeMenu():openMenu();
  });

  closeBtn.addEventListener('click',e=>{
    e.stopPropagation();
    closeMenu();
  });

  // Drag heart
  heartBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    dragOffset.x=e.clientX-heartBtn.offsetLeft;
    dragOffset.y=e.clientY-heartBtn.offsetTop;
    heartBtn.setPointerCapture(e.pointerId);
    heartBtn.style.cursor='grabbing';
    // start long‑press timer
    lpTimer=setTimeout(()=>{
      // show pop‑over near heart
      const rect=heartBtn.getBoundingClientRect();
      lpMenu.style.left=`${rect.right+4}px`;
      lpMenu.style.top=`${rect.top}px`;
      lpMenu.style.display='block';
      log('Long‑press menu shown');
    },LP_DELAY);
  });
  heartBtn.addEventListener('pointermove',e=>{
    if(e.pressure===0) return;
    // cancel long‑press if moved beyond a small threshold
    if(lpTimer && (Math.abs(e.clientX-dragOffset.x-heartBtn.offsetLeft)>5 ||
                    Math.abs(e.clientY-dragOffset.y-heartBtn.offsetTop)>5)){
      clearTimeout(lpTimer);
      lpTimer=null;
    }
    const x=e.clientX-dragOffset.x;
    const y=e.clientY-dragOffset.y;
    heartBtn.style.left=`${x}px`;
    heartBtn.style.top=`${y}px`;
  });
  heartBtn.addEventListener('pointerup',e=>{
    heartBtn.releasePointerCapture(e.pointerId);
    heartBtn.style.cursor='grab';
    if(lpTimer){
      clearTimeout(lpTimer);
      lpTimer=null;
    }
  });
  // Hide long‑press menu when clicking elsewhere
  document.addEventListener('click',e=>{
    if(lpMenu.style.display==='block' && !lpMenu.contains(e.target)){
      lpMenu.style.display='none';
      log('Long‑press menu hidden');
    }
  });

  // Config button (placeholder)
  configBtn.addEventListener('click',()=>log('Configure selected (TODO)'));

  // Quit button – hide whole UI
  quitBtn.addEventListener('click',()=>{
    container.style.display='none';
    log('Application quit');
  });

  // Theme toggle
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    themeBtn.textContent=t==='light'?'Dark':'Light';
    currentTheme=t;
    log(`Theme set to ${t}`);
  }
  themeBtn.addEventListener('click',()=>applyTheme(currentTheme==='light'?'dark':'light'));

  // Init
  createMenuItems();
  closeMenu();
  applyTheme('light');
</script>
</body>
</html>
