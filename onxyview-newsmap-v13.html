<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071019">
<title>OnxyView v1.3.0</title>
<style>
:root{--bg:#071019;--panel:#0a1622;--panel2:#102031;--line:#263746;--text:#f4f7f9;--muted:#94a4b2;--accent:#78d2ff;--pos:#2a8f6a;--neu:#8b6b2b;--neg:#a74457}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:42px auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:7px;padding:5px 7px;border-bottom:1px solid var(--line);background:#08121d}.brand{font-weight:900;font-size:15px;white-space:nowrap}.brand small{font-size:9px;color:var(--muted)}.search{flex:1;max-width:760px;margin:auto;height:30px;border:1px solid #31506a;border-radius:999px;background:#0a1723;padding:0 12px;outline:0;font-size:11px}.status{font-size:9px;color:var(--muted);white-space:nowrap}.iconbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#102033;display:grid;place-items:center}
.dimbar{background:#091522;border-bottom:1px solid var(--line)}.dimsummary{height:32px;display:flex;align-items:center;gap:5px;padding:3px 6px;overflow-x:auto;scrollbar-width:none}.dimsummary::-webkit-scrollbar{display:none}.chev{flex:none;width:28px;height:24px;border:1px solid var(--line);border-radius:999px;background:#102033}.dimchip{flex:none;height:24px;border:1px solid var(--line);border-radius:999px;background:#102033;padding:0 8px;font-size:8px;font-weight:800;white-space:nowrap}.dimchip b{color:var(--accent);font-weight:900}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-height:0;overflow:hidden;padding:0 7px;transition:max-height .16s ease,padding .16s ease}.controls.open{max-height:86px;padding:7px}.control label{display:block;font-size:8px;color:var(--muted);font-weight:800;text-transform:uppercase;margin:0 0 3px 3px}.control select{width:100%;height:33px;border:1px solid #31506a;border-radius:9px;background:#0f1e2d;padding:0 8px;font-size:10px;outline:0}
.stage{position:relative;min-height:0;overflow:hidden}.map{position:absolute;inset:0;background:#071019}.group{position:absolute;overflow:hidden;border:1px solid #071019;background:#0b1723;transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease}.glabel{position:absolute;z-index:5;left:4px;top:3px;max-width:calc(100% - 8px);border:0;border-radius:7px;background:#071019d9;color:#fff;padding:3px 6px;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.glabel small{color:var(--muted);margin-left:4px}.tile{position:absolute;border:1px solid #071019;overflow:hidden;padding:0;text-align:left;color:#fff;background:#284c5e;transition:left .16s ease,top .16s ease,width .16s ease,height .16s ease,filter .08s}.tile:hover,.tile:focus-visible{filter:brightness(1.12);z-index:4;outline:1px solid #fff}.headline{position:absolute;inset:0;padding:5px 6px;font-weight:800;line-height:1.05;overflow:hidden;text-shadow:0 1px 2px #0009}.meta{position:absolute;left:6px;right:6px;bottom:4px;font-size:8px;color:#eef7ffcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tiny .headline,.tiny .meta{display:none}.micro .meta{display:none}.micro .headline{font-size:8px;padding:3px}.small .headline{font-size:9px}.medium .headline{font-size:11px}.large .headline{font-size:14px}.hero .headline{font-size:clamp(16px,2.2vw,28px);padding:9px 10px}.hero .meta{font-size:9px;left:10px;bottom:7px}
.reader{position:absolute;z-index:20;right:6px;top:6px;bottom:6px;width:min(430px,36vw);border:1px solid #3a5a73;border-radius:14px;background:#0a1622fa;backdrop-filter:blur(18px);transform:translateX(calc(100% + 14px));transition:transform .16s;overflow:auto}.reader.open{transform:none}.rhead{position:sticky;top:0;z-index:2;display:flex;gap:5px;align-items:center;padding:9px;background:#0a1622f7;border-bottom:1px solid var(--line)}.rhead .spacer{flex:1}.rbtn{height:30px;min-width:30px;border:1px solid var(--line);border-radius:8px;background:#102033;display:grid;place-items:center}.rbody{padding:12px}.reader h1{font-size:19px;line-height:1.13;margin:0 0 8px}.digest{font-size:12px;line-height:1.48;color:#d6e0e7;margin:0 0 11px}.eventmeta{font-size:9px;color:var(--muted);margin-bottom:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 11px}.tag{border:0;border-radius:999px;background:#102033;color:#8fdcff;padding:4px 7px;font-size:8px}.coverage{font-size:10px;font-weight:900;margin:12px 0 5px}.source{display:block;padding:9px 0;border-top:1px solid #ffffff14;text-decoration:none;color:#eef7ff}.source b{font-size:10px}.source .stitle{display:block;font-size:10px;line-height:1.25;margin-top:2px;color:#dcecf5}.source .sdesc{display:block;font-size:9px;line-height:1.35;color:#9fb0bd;margin-top:4px}.source .open{display:inline-block;margin-top:5px;color:#8fdcff;font-size:8px}.empty{padding:10px 0;color:var(--muted);font-size:10px}
.settings{position:absolute;z-index:30;right:6px;top:6px;width:min(330px,92vw);border:1px solid #3a5a73;border-radius:12px;background:#0a1622fa;padding:10px;display:none}.settings.open{display:block}.settings h3{font-size:12px;margin:0 0 8px}.settings label{display:block;font-size:8px;color:var(--muted);margin:8px 0 3px}.settings select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#0f1e2d}.loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#071019;font-size:11px;color:var(--muted)}
@media(max-width:700px){.app{grid-template-rows:39px auto 1fr}.brand{font-size:13px}.brand small,.status{display:none}.top{padding:4px 5px;gap:4px}.search{height:29px;font-size:10px;padding:0 10px}.iconbtn{width:29px;height:29px}.controls{grid-template-columns:1fr 1fr}.controls.open{max-height:150px}.glabel{font-size:8px}.small .headline{font-size:8px}.medium .headline{font-size:9px}.large .headline{font-size:11px}.hero .headline{font-size:14px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(46vh,360px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.reader h1{font-size:16px}.digest{font-size:11px}.source .stitle{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">OnxyView <small>v1.3.0</small></div><input id="q" class="search" autocomplete="off" placeholder="Search events, #tags, #favorite, sources…"><div id="status" class="status">Starting…</div><button id="gear" class="iconbtn" aria-label="Settings">⚙</button></header>
<section class="dimbar"><div class="dimsummary"><button id="chev" class="chev">⌄</button><button class="dimchip" data-open="group">Group <b id="gNow">Subject</b></button><button class="dimchip" data-open="color">Color <b id="cNow">Sentiment</b></button><button class="dimchip" data-open="size">Size <b id="sNow">Importance</b></button><button class="dimchip" data-open="lens">Lens <b id="lNow">All</b></button></div><div id="controls" class="controls"><div class="control"><label>Group</label><select id="group"><option value="subject">Subject</option><option value="region">Region</option><option value="sentiment">Sentiment</option><option value="editorialTier">Editorial tier</option><option value="corroboration">Corroboration</option></select></div><div class="control"><label>Color</label><select id="color"><option value="sentiment">Sentiment</option><option value="subject">Subject</option><option value="region">Region</option><option value="editorialTier">Editorial tier</option></select></div><div class="control"><label>Size</label><select id="size"><option value="importance" selected>Importance</option><option value="sources">Independent sources</option><option value="recency">Recency</option></select></div><div class="control"><label>Lens</label><select id="lens"><option value="All">All</option><option value="Core Global">Core Global</option><option value="Markets">Markets</option><option value="Technology">Technology</option><option value="US Spectrum">US Spectrum</option></select></div></div></section>
<main class="stage"><div id="map" class="map"></div><aside id="reader" class="reader"></aside><section id="settings" class="settings"><h3>View settings</h3><label>Minimum significance</label><select id="minTier"><option value="background">Everything</option><option value="reported">Reported+</option><option value="developing" selected>Developing+</option><option value="significant">Significant+</option><option value="major">Major only</option></select><label>Time window</label><select id="hours"><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="336">14 days</option><option value="504" selected>21 days</option></select></section><div id="loading" class="loading">Building prioritized event map…</div></main>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let data={events:[],sourcePacks:{}},events=[],visible=[],currentIndex=-1;const FKEY='onxyview.favorites.v3';let fav=new Set(JSON.parse(localStorage.getItem(FKEY)||'[]'));
const state={group:'subject',color:'sentiment',size:'importance',lens:'All',minTier:'developing',hours:504};const tierRank={background:1,reported:2,developing:3,significant:4,major:5};const tierFactor={background:.35,reported:.55,developing:.9,significant:1.35,major:2.1};const SENT={positive:'#2a8f6a',neutral:'#8b6b2b',negative:'#a74457'};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clean(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}function val(e,k){if(k==='corroboration'){let n=e.independentSourceCount||1;return n>=6?'6+ sources':n>=3?'3–5 sources':n===2?'2 sources':'1 source'}return e[k]||'Unknown'}function packs(e){if(e.sourcePacks?.length)return e.sourcePacks;let out=[];for(const[n,srcs]of Object.entries(data.sourcePacks||{}))if((e.sources||[]).some(s=>srcs.includes(s)))out.push(n);return out}function passLens(e){return state.lens==='All'||packs(e).includes(state.lens)}function weight(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,100-Math.min(99,(Date.now()-(e.lastSeen||0))/36e5));let t=e.editorialTier||'reported';return Math.max(1,(e.importance||1)*(tierFactor[t]||1))}function color(e){let v=val(e,state.color);if(state.color==='sentiment')return SENT[v]||SENT.neutral;if(state.color==='editorialTier')return {major:'#536f86',significant:'#496777',developing:'#3d5b68',reported:'#344a55',background:'#2b3940'}[v]||'#3b5360';let h=0;for(let c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 34% 38%)`}function searchable(e){return JSON.stringify([e.headline,e.summary,e.subject,e.region,e.tags,e.sources,e.articles?.map(a=>[a.title,a.description,a.source])]).toLowerCase()}function filtered(){let q=$('q').value.trim().toLowerCase(),cut=Date.now()-state.hours*36e5;return events.filter(e=>(tierRank[e.editorialTier||'reported']||2)>=tierRank[state.minTier]&&(e.lastSeen||0)>=cut&&passLens(e)&&(!q||(q==='#favorite'?fav.has(e.eventId):searchable(e).includes(q.replace(/^#/,'')))))}function sum(a,b){return a+b}function worst(R,w){if(!R.length)return Infinity;let s=R.reduce(sum,0),mx=Math.max(...R),mn=Math.min(...R),w2=w*w,s2=s*s;return Math.max(w2*mn/s2,s2/(w2*mx))}
function layout(vals,{width,height}){let dims=[];if(!vals.length||width<=0||height<=0)return dims;let ratio=height/width,total=vals.reduce(sum,0),vw=Math.sqrt(total/ratio),vh=vw*ratio,scale=width/vw,horiz=width<height,row=[],cx=0,cy=0;vals.forEach((v,i,a)=>{let fixed=horiz?vw:vh,cur,add;if(i===a.length-1){let rem=horiz?vw-v/vh:vh-v/vw;cur=worst([v],Math.max(.0001,rem));add=worst([...row,v],fixed)}else{cur=worst(row,fixed);add=worst([...row,v],fixed)}if(add>cur)fin();row.push(v)});if(row.length)fin();return dims;function fin(){if(!row.length)return;let rv=row.reduce(sum,0),rw,rh,x=cx,y=cy;if(!horiz){rw=rv/vh;rh=vh;vw-=rw;cx+=rw}else{rw=vw;rh=rv/vw;vh-=rh;cy+=rh}for(let v of row){let w,h;if(!horiz){w=rw;h=v/rw}else{w=v/rh;h=rh}dims.push({left:x*scale,top:y*scale,width:w*scale,height:h*scale});if(!horiz)y+=h;else x+=w}horiz=!horiz;row=[]}}}
function render(){visible=filtered();let groups={};for(let e of visible)(groups[val(e,state.group)]??=[]).push(e);let gs=Object.entries(groups).map(([name,items])=>({name,items:items.sort((a,b)=>weight(b)-weight(a)),weight:items.reduce((s,e)=>s+weight(e),0)})).sort((a,b)=>b.weight-a.weight),M=$('map'),W=M.clientWidth,H=M.clientHeight;M.innerHTML='';let gd=layout(gs.map(g=>g.weight),{width:W,height:H});gs.forEach((g,i)=>{let d=gd[i];if(!d)return;let box=document.createElement('section');box.className='group';Object.assign(box.style,{left:d.left+'px',top:d.top+'px',width:d.width+'px',height:d.height+'px'});box.innerHTML=`<button class="glabel">${esc(g.name)} <small>${g.items.length}</small></button>`;M.appendChild(box);let ed=layout(g.items.map(weight),{width:d.width,height:d.height});g.items.forEach((e,j)=>{let r=ed[j];if(!r)return;let area=r.width*r.height,cls=area<45?'tiny':area<120?'micro':area<420?'small':area<1300?'medium':area<4200?'large':'hero',b=document.createElement('button');b.className='tile '+cls;Object.assign(b.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:color(e)});b.innerHTML=`<span class="headline">${esc(e.headline)}</span><span class="meta">${e.independentSourceCount||1} sources · importance ${e.importance||0}</span>`;b.onclick=()=>openReader(e);box.appendChild(b)})});$('status').textContent=`${visible.length} events · ${data.articleCount||0} articles`;syncLabels()}
function digestFor(e){if(e.summary)return clean(e.summary);let seen=new Set(),parts=[];for(let a of e.articles||[]){let d=clean(a.description||a.summary||'');if(d.length<45)continue;let k=d.toLowerCase().slice(0,120);if(seen.has(k))continue;seen.add(k);parts.push(d);if(parts.length===2)break}return parts.join(' ')}
function openReader(e){currentIndex=visible.findIndex(x=>x.eventId===e.eventId);let r=$('reader'),digest=digestFor(e),arts=(e.articles||[]).filter(a=>a.url);r.innerHTML=`<div class="rhead"><button class="rbtn" id="closeR" aria-label="Close">×</button><button class="rbtn" id="prevR" aria-label="Previous">‹</button><button class="rbtn" id="nextR" aria-label="Next">›</button><span class="spacer"></span><button class="rbtn" id="ttsR" aria-label="Read aloud"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button class="rbtn" id="favR" aria-label="Favorite">${fav.has(e.eventId)?'★':'☆'}</button></div><div class="rbody"><h1>${esc(e.headline)}</h1><p class="digest">${digest?esc(digest):'No publisher summary available for this event.'}</p><div class="eventmeta">${e.independentSourceCount||1} independent sources · importance ${e.importance||0} · ${esc(e.region||'Global')}</div><div class="tags">${(e.tags||[]).slice(0,10).map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div><div class="coverage">Source coverage</div>${arts.length?arts.slice(0,18).map(a=>`<a class="source" target="_blank" rel="noopener" href="${esc(a.url)}"><b>${esc(a.source||'Source')}</b><span class="stitle">${esc(a.title||'Open report')}</span>${clean(a.description||a.summary||'')?`<span class="sdesc">${esc(clean(a.description||a.summary||'').slice(0,260))}</span>`:''}<span class="open">Open original ↗</span></a>`).join(''):'<div class="empty">No source links were supplied with this event.</div>'}</div>`;r.classList.add('open');$('closeR').onclick=()=>r.classList.remove('open');$('prevR').onclick=()=>nav(-1);$('nextR').onclick=()=>nav(1);$('ttsR').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(e.headline+'. '+(digest||'')))};$('favR').onclick=()=>{fav.has(e.eventId)?fav.delete(e.eventId):fav.add(e.eventId);localStorage.setItem(FKEY,JSON.stringify([...fav]));openReader(e)};r.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.tag;render();r.classList.remove('open')})}
function nav(delta){if(!visible.length)return;currentIndex=(currentIndex+delta+visible.length)%visible.length;openReader(visible[currentIndex])}
function syncLabels(){$('gNow').textContent=label(state.group);$('cNow').textContent=label(state.color);$('sNow').textContent=label(state.size);$('lNow').textContent=state.lens}function label(v){return ({subject:'Subject',region:'Region',sentiment:'Sentiment',editorialTier:'Tier',corroboration:'Corroboration',importance:'Importance',sources:'Sources',recency:'Recency'}[v]||v)}
function change(k,v){state[k]=v;render()}
$('chev').onclick=()=>{$('controls').classList.toggle('open');$('chev').textContent=$('controls').classList.contains('open')?'⌃':'⌄'};document.querySelectorAll('.dimchip').forEach(b=>b.onclick=()=>{$('controls').classList.add('open');$('chev').textContent='⌃'});$('gear').onclick=()=>{$('settings').classList.toggle('open')};for(let k of ['group','color','size','lens'])$(k).onchange=e=>change(k,e.target.value);$('minTier').onchange=e=>change('minTier',e.target.value);$('hours').onchange=e=>{state.hours=+e.target.value;render()};$('q').oninput=()=>{clearTimeout(window.qt);window.qt=setTimeout(render,90)};addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(render,100)});
(async()=>{try{let j=await fetch('./onxyview-event-cache.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});data=j;events=j.events||[];$('loading').remove();render()}catch(e){$('loading').textContent='Event cache unavailable · '+e.message}})();
})();
</script>
</body>
</html>
