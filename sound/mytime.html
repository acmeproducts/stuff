<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="manifest" href="mytime.webmanifest">
<title>My Time</title>
<style>
  :root{ --bg:#0a0c12; --panel:rgba(15,18,26,.96); --line:#2a3040; --txt:#e8ecf4; --dim:#8b93a7; --acc:#37d6e0; --rec:#ff5a5a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #hud{ position:fixed; top:calc(8px + env(safe-area-inset-top)); left:10px; font-size:12px;
    color:var(--dim); pointer-events:none; z-index:3; max-width:70vw; }
  #hud b{ color:var(--txt); font-weight:600; font-size:14px; display:block; }
  #hud i{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--rec); margin-right:5px; vertical-align:0; }
  #hud i.off{ display:none; } #hud i.on{ animation:blink 1.6s infinite; } #hud i.paused{ background:var(--dim); }
  @keyframes blink{50%{opacity:.25}}
  #status{ position:fixed; top:calc(52px + env(safe-area-inset-top)); right:10px; max-width:60vw;
    text-align:right; font-size:12px; color:var(--acc); pointer-events:none; z-index:3; }
  #hint{ position:fixed; left:50%; top:36%; transform:translate(-50%,-50%); z-index:4;
    background:rgba(10,13,20,.85); border:1px solid var(--line); border-radius:14px;
    padding:14px 18px; text-align:center; font-size:14px; max-width:84vw; pointer-events:none; transition:opacity .4s; }
  #hint b{ color:var(--acc); font-weight:600; } #hint.gone{ opacity:0; }
  #sheet{ position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--panel);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line); border-radius:16px 16px 0 0;
    transform:translateY(calc(100% - 54px)); transition:transform .25s ease; max-height:78vh; display:flex; flex-direction:column; }
  #sheet.open{ transform:translateY(0); }
  #sheet.hidden{ transform:translateY(110%); }
  #grabRow{ height:54px; flex:0 0 54px; display:flex; align-items:center; }
  #grab{ flex:1; height:54px; border:0; background:none; color:var(--txt); font-size:16px; font-weight:600; cursor:pointer; position:relative; }
  #grab::before{ content:""; position:absolute; top:8px; left:50%; transform:translateX(-50%); width:42px; height:4px; border-radius:2px; background:var(--line); }
  #grab .chev{ color:var(--acc); margin-left:8px; display:inline-block; transition:transform .25s; }
  #sheet.open #grab .chev{ transform:rotate(180deg); }
  #hideBtn{ width:54px; height:54px; border:0; background:none; color:var(--dim); font-size:20px; cursor:pointer; }
  #showBtn{ position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:6; width:44px; height:44px; border-radius:50%;
    border:1px solid var(--line); background:var(--panel); color:var(--txt); font-size:18px; display:none; cursor:pointer; }
  #showBtn.on{ display:block; }
  #body{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 16px calc(18px + env(safe-area-inset-bottom)); }
  .chips{ display:flex; gap:8px; margin:4px 0 12px; }
  .chip{ flex:1; min-height:46px; border:1px solid var(--line); border-radius:12px; background:#141926; color:var(--txt); font-size:14px; font-weight:600; cursor:pointer; }
  .chip:active{ background:#1c2436; border-color:var(--acc); }
  .chip.on{ border-color:var(--acc); color:var(--acc); }
  .row{ display:flex; align-items:center; gap:12px; margin:10px 0; min-height:44px; }
  .row label{ flex:0 0 108px; color:var(--dim); font-size:14px; }
  .row input[type=range]{ flex:1; height:36px; accent-color:var(--acc); }
  .row .val{ flex:0 0 46px; text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
  .row select,.row input[type=text],.row input[type=password]{ flex:1; height:44px; background:#141926; color:var(--txt); border:1px solid var(--line); border-radius:10px; font-size:15px; padding:0 10px; min-width:0; }
  .row input[type=color]{ flex:1; height:44px; border:1px solid var(--line); border-radius:10px; background:#141926; padding:4px; }
  .toggles{ justify-content:space-between; flex-wrap:wrap; }
  .toggles label{ flex:0 0 auto; display:flex; align-items:center; gap:8px; color:var(--txt); font-size:14px; min-height:44px; }
  .toggles input{ width:22px; height:22px; accent-color:var(--acc); }
  .btns{ gap:8px; }
  .btns button{ flex:1; min-height:48px; border:1px solid var(--line); border-radius:12px; background:#141926; color:var(--txt); font-size:14px; font-weight:600; cursor:pointer; }
  .btns button:active{ background:#1c2436; border-color:var(--acc); }
  .btns button.on{ border-color:var(--acc); color:var(--acc); }
  .btns button.rec{ border-color:var(--rec); color:var(--rec); }
  .note{ color:var(--dim); font-size:13px; margin:6px 0 2px; }
  h4{ margin:16px 0 2px; font-size:12px; font-weight:600; color:var(--dim); letter-spacing:.02em; }
  .log{ font-size:11.5px; color:var(--dim); background:#0a0c12; border-radius:10px; padding:8px 10px; max-height:140px; overflow:auto; white-space:pre-wrap; word-break:break-word; margin-top:8px; }
  .plist div{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .plist div span{ flex:1; } .plist button{ min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#141926; color:var(--txt); font-weight:600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><i id="recDot" class="off"></i><span id="hudLine">—</span><b id="hudTitle">—</b></div>
<div id="status"></div>
<div id="hint"><b>drag</b> to orbit · <b>pinch</b> to zoom, keep pinching to open the next stretch of time<br><b>double-tap</b> to reset · tap <b>⚙ Controls</b> below</div>
<button id="showBtn" aria-label="Show controls">⚙</button>

<div id="sheet">
  <div id="grabRow"><button id="grab">⚙ Controls <span class="chev">▲</span></button><button id="hideBtn" aria-label="Hide controls">×</button></div>
  <div id="body">
    <div class="chips">
      <button class="chip" id="viewLive">Live</button>
      <button class="chip" id="viewHist">History</button>
    </div>
    <div class="row btns">
      <button id="micBtn" class="rec">🎤 Start listening</button>
      <button id="playBtn">▶ Play history</button>
    </div>
    <div class="row"><label>Span</label>
      <select id="span">
        <option value="minute">Minute</option><option value="hour">Hour</option><option value="day">Day</option><option value="week">Week</option>
        <option value="month">Month</option><option value="year">Year</option><option value="decade">Decade</option><option value="life">Life</option>
      </select>
      <button class="chip" id="outBtn" style="flex:0 0 72px">Out</button>
      <button class="chip" id="nowBtn" style="flex:0 0 72px">Now</button>
    </div>
    <div class="row"><label>Play speed</label>
      <select id="rate">
        <option value="1">Real time</option><option value="2">×2</option><option value="10">×10</option><option value="60">×60 (a minute per second)</option>
        <option value="600">×600</option><option value="3600">An hour per second</option><option value="86400">A day per second</option>
        <option value="604800">A week per second</option><option value="2629800">A month per second</option>
      </select>
    </div>
    <div class="note" id="playNote">—</div>

    <h4>Look</h4>
    <div class="chips">
      <button class="chip" data-p="calm">🌊 Calm Sea</button>
      <button class="chip" data-p="storm">⛈ Storm</button>
      <button class="chip" data-p="bass">🔊 Bass Reactor</button>
    </div>
    <div class="row"><label>Wave mode</label>
      <select id="mode">
        <option value="wave">Wave</option>
        <option value="radial">Radial</option>
        <option value="noise">Noise</option>
      </select>
    </div>
    <div class="row"><label>Resolution</label><input type="range" id="res" min="30" max="160" step="5"><span class="val" id="resV"></span></div>
    <div class="row"><label>Amplitude</label><input type="range" id="amp" min="0" max="20" step="0.5"><span class="val" id="ampV"></span></div>
    <div class="row"><label>Frequency</label><input type="range" id="freq" min="0.05" max="0.8" step="0.01"><span class="val" id="freqV"></span></div>
    <div class="row"><label>Point size</label><input type="range" id="size" min="0.5" max="4" step="0.1"><span class="val" id="sizeV"></span></div>
    <div class="row"><label>Speed</label><input type="range" id="speed" min="0" max="3" step="0.05"><span class="val" id="speedV"></span></div>
    <div class="row"><label>Deep color</label><input type="color" id="cA"></div>
    <div class="row"><label>Peak color</label><input type="color" id="cB"></div>
    <div class="row toggles">
      <label><input type="checkbox" id="trails"> Trails</label>
      <label><input type="checkbox" id="rotate"> Spin</label>
      <label><input type="checkbox" id="autoq"> Auto-quality</label>
      <label><input type="checkbox" id="horizon"> Horizon</label>
    </div>
    <div class="row"><label>Years ahead</label><input type="range" id="ahead" min="1" max="90" step="1"><span class="val" id="aheadV"></span></div>
    <div class="row"><label>History scale</label>
      <select id="scale"><option value="abs">Absolute (20–100 dB)</option><option value="rel">Relative to my median</option><option value="pct">Percentile in view</option></select>
    </div>
    <div class="row btns">
      <button id="pauseBtn">⏸ Pause</button>
      <button id="fsBtn">⛶ Fullscreen</button>
      <button id="pngBtn">📷 PNG</button>
      <button id="shareBtn">↗ Share</button>
    </div>

    <h4>Presets</h4>
    <div class="row"><input type="text" id="pName" placeholder="Save this look as…" maxlength="30"><button class="chip" id="pSave" style="flex:0 0 80px">Save</button></div>
    <div class="plist" id="pList"></div>

    <h4>Listening and sync</h4>
    <div id="micStatus" class="note">Mic off — the sheet runs free.</div>
    <div class="row"><label>Device name</label><input type="text" id="devName" maxlength="20"></div>
    <div class="row"><label>Calibration</label><input type="range" id="cal" min="60" max="130" step="1"><span class="val" id="calV"></span></div>
    <div class="row"><label>Data</label><select id="src"><option value="rec">What this phone and the shared store heard</option><option value="test">Test life (20 generated years)</option></select></div>
    <div class="row"><label>GitHub token</label><input type="password" id="token" placeholder="github_pat_…" autocomplete="off"></div>
    <div class="row"><label>Auto-sync</label><select id="autosync"><option value="0">Off</option><option value="5">Every 5 min</option><option value="15">Every 15 min</option><option value="60">Hourly</option></select></div>
    <div class="row btns"><button id="syncBtn">⇅ Sync now</button><button id="reloadBtn">⟳ Reload shared</button></div>
    <div class="log" id="log">—</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ===================== settings + persistence (donor, extended) ===================== */
var KEY='mytime-settings', SEEN='mytime-seen';
var S={ mode:'radial', res:90, amp:8, freq:0.28, size:2.2, speed:1.2, liveSpeed:1.2,
        cA:'#0a3d2e', cB:'#7cff4f', trails:false, rotate:false, autoq:true,
        view:'live', span:'day', rate:1, scale:'abs', horizon:true, ahead:40,
        cal:100, src:'rec', autosync:15, devName:'', devId:'' };
var hadSave=false;
try{ var raw=localStorage.getItem(KEY); if(raw){ Object.assign(S, JSON.parse(raw)); hadSave=true; } }catch(e){}
try{ var base=JSON.parse(localStorage.getItem('sot.settings')||'{}'); if(!S.devId&&base.devId)S.devId=base.devId; if(!S.devName&&base.devName)S.devName=base.devName; }catch(e){}
if(!S.devId) S.devId=Math.random().toString(36).slice(2,8);
if(!S.devName) S.devName=/iPhone|iPad/.test(navigator.userAgent)?'iPhone':/Android/.test(navigator.userAgent)?'Android':'Phone';
if(!hadSave && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ S.speed=0; S.rotate=false; }
var saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} },300); }
var TOKEN=''; try{ TOKEN=localStorage.getItem('sot.token')||''; }catch(e){}

/* ===================== dom ===================== */
var canvas=document.getElementById('c'), ctx2d=canvas.getContext('2d',{alpha:false});
var hudLine=document.getElementById('hudLine'), hudTitle=document.getElementById('hudTitle'), statusEl=document.getElementById('status');
var hintEl=document.getElementById('hint'), sheet=document.getElementById('sheet'), micStatusEl=document.getElementById('micStatus');
var $=function(id){return document.getElementById(id);};
var statusTimer=null;
function setStatus(msg){ statusEl.textContent=msg; clearTimeout(statusTimer); statusTimer=setTimeout(function(){ statusEl.textContent=''; },7000); }
function dismissHint(){ hintEl.classList.add('gone'); try{ localStorage.setItem(SEEN,'1'); }catch(e){} }
try{ if(localStorage.getItem(SEEN)) hintEl.classList.add('gone'); }catch(e){}
function log(m){ $('log').textContent=(new Date().toLocaleTimeString()+' '+m+'\n'+$('log').textContent).split('\n').slice(0,40).join('\n'); }

/* ===================== canvas sizing ===================== */
var dpr=1;
function resize(){ dpr=Math.min(2, window.devicePixelRatio||1); canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr); }
addEventListener('resize', resize); resize();

/* ===================== camera (donor) ===================== */
var yaw=0.6, pitch=0.9, dist=62;
function resetCamera(){ yaw=0.6; pitch=0.9; dist=62; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ===================== grid (donor) ===================== */
var cols=0, rows=0, px=null, pz=null, colNorm=null, qualityRes=S.res, effRes=S.res;
function buildGrid(res){
  effRes=res; cols=res; rows=res;
  px=new Float32Array(cols*rows); pz=new Float32Array(cols*rows); colNorm=new Float32Array(cols);
  var S2=40, i=0, r, c;
  for(r=0;r<rows;r++) for(c=0;c<cols;c++,i++){ px[i]=-S2+(2*S2)*(c/(cols-1)); pz[i]=-S2+(2*S2)*(r/(rows-1)); }
  for(c=0;c<cols;c++) colNorm[c]=c/(cols-1);
  histDirty=true;
}

/* ===================== color LUT (donor) ===================== */
var LUT=new Array(256), DIM=new Array(256);
function h2r(h){ var n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; }
function buildLUT(){
  var a=h2r(S.cA), b=h2r(S.cB), i, t;
  for(i=0;i<256;i++){ t=i/255;
    LUT[i]='rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
    DIM[i]='rgba('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+',0.28)';
  }
}

/* ===================== wave field (donor) ===================== */
var t=0, paused=false;
function waveVal(x,z){
  var f=S.freq;
  if(S.mode==='wave')   return Math.sin(x*f+t)*Math.cos(z*f*0.9+t*0.8);
  if(S.mode==='radial'){ var d=Math.sqrt(x*x+z*z); return Math.sin(d*f*2.2 - t*1.6); }
  return Math.sin(x*f*1.6+t)*Math.cos(z*f*1.9-t*0.7)*0.6 + Math.sin((x+z)*f+t*1.3)*0.4;
}

/* ===================== calendar ===================== */
var SEC=1000, MIN=60000, HOUR=3600000, DAY=86400000, WEEK=7*DAY;
var UNITS=['second','minute','hour','day','week','month','year','decade','life'];
var UMS={second:SEC,minute:MIN,hour:HOUR,day:DAY,week:WEEK,month:30.44*DAY,year:365.25*DAY,decade:3652.5*DAY};
var UI={}; UNITS.forEach(function(u,i){UI[u]=i;});
var DATA_YEARS=20, nowReal=Date.now(), T_END=nowReal;
var T0=new Date(new Date(nowReal).getFullYear()-DATA_YEARS,0,1).getTime();
function lifeEnd(){ return new Date(new Date(T0).getFullYear()+DATA_YEARS+(S.horizon?S.ahead:0),0,1).getTime(); }
function stepUnit(tm,id,n){ var d=new Date(tm);
  switch(id){case 'second':d.setSeconds(d.getSeconds()+n);break;case 'minute':d.setMinutes(d.getMinutes()+n);break;case 'hour':d.setHours(d.getHours()+n);break;
  case 'day':d.setDate(d.getDate()+n);break;case 'week':d.setDate(d.getDate()+7*n);break;case 'month':d.setMonth(d.getMonth()+n);break;
  case 'year':d.setFullYear(d.getFullYear()+n);break;case 'decade':d.setFullYear(d.getFullYear()+10*n);break;default:return tm;}
  return d.getTime(); }
function alignDown(tm,id){ var d=new Date(tm);
  switch(id){case 'second':d.setMilliseconds(0);break;case 'minute':d.setSeconds(0,0);break;case 'hour':d.setMinutes(0,0,0);break;
  case 'day':d.setHours(0,0,0,0);break;case 'week':d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());break;
  case 'month':d.setHours(0,0,0,0);d.setDate(1);break;case 'year':d.setHours(0,0,0,0);d.setMonth(0,1);break;
  case 'decade':d.setHours(0,0,0,0);d.setMonth(0,1);d.setFullYear(Math.floor(d.getFullYear()/10)*10);break;case 'life':return T0;}
  return d.getTime(); }
function spanEnd(t0,id){ return id==='life'?lifeEnd():stepUnit(t0,id,1); }
function anchorFor(v){ if(v==='life')return T0; var tm=alignDown(T_END-1,v); if((T_END-tm)<(spanEnd(tm,v)-tm)*0.25) tm=stepUnit(tm,v,-1); return tm; }
var view={span:S.span, t0:0};
var fmtD=function(tm){return new Date(tm).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});};
var fmtT=function(tm){return new Date(tm).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
var fmtTs=function(tm){return new Date(tm).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',second:'2-digit'});};
function rangeLabel(a,b,unit){
  if(unit==='second')return fmtTs(a); if(unit==='minute')return fmtT(a)+', '+fmtD(a); if(unit==='hour')return fmtT(a)+'–'+fmtT(b)+', '+fmtD(a);
  if(unit==='day')return new Date(a).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  if(unit==='month')return new Date(a).toLocaleDateString(undefined,{year:'numeric',month:'long'});
  if(unit==='year')return String(new Date(a).getFullYear()); if(unit==='decade')return new Date(a).getFullYear()+'s';
  if(unit==='life')return 'Your life, '+new Date(T0).getFullYear()+' → '+(new Date(b-1).getFullYear());
  return fmtD(a)+' → '+fmtD(b-1); }

/* ===================== test life (deterministic) ===================== */
var SEED=7;
function h32(a,b,c){var n=(a*73856093)^(b*19349663)^(c*83492791)^(SEED*2654435761);n=(n^61)^(n>>>16);n=(n+(n<<3))|0;n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return (n>>>0)/4294967296;}
var SCENE={sleep:22,quiet:32,commute:64,work:50,meeting:58,evening:55,concert:100,travel:76,kids:66,night:38};
function sampleTest(tm){
  var rel=tm-T0; if(rel<0||tm>T_END)return null;
  var d=new Date(tm), dayIdx=Math.floor(rel/DAY), dow=d.getDay(), wknd=dow===0||dow===6, hour=d.getHours()+d.getMinutes()/60, years=rel/(365.25*DAY);
  if(h32(dayIdx,1,0)<0.03)return null; if(years>3.1&&years<3.3)return null; if(h32(dayIdx,Math.floor(hour),2)<0.018)return null;
  var sc, wake=wknd?8.5:6.5;
  if(hour<wake-0.5||hour>=23.5)sc='sleep'; else if(hour<wake+1)sc='quiet'; else if(!wknd&&hour<wake+2.5)sc='commute';
  else if(!wknd&&hour<17.5){sc='work';if((hour>=10&&hour<11)||(hour>=14&&hour<15))sc='meeting';}
  else if(!wknd&&hour<18.5)sc='commute'; else if(hour<22)sc='evening'; else sc='night';
  if(wknd&&hour>=wake+1&&hour<22)sc=hour<12?'quiet':'evening';
  if(hour>=20&&hour<23.2&&h32(dayIdx,3,0)<(years<4.5?0.018:0.008))sc='concert'; else if(hour>=6&&hour<14&&h32(dayIdx,4,0)<0.012)sc='travel';
  var v=SCENE[sc]+(h32(Math.floor(rel/MIN),9,0)-0.5)*5;
  if(years<4.5)v+=5; else if(years>=13.3&&years<14.3)v-=9; else if(years>=9.5&&years<13.3&&hour>=16&&hour<20.5&&sc!=='concert')v=Math.max(v,SCENE.kids);
  return v;
}

/* ===================== recorded minutes: memory + IndexedDB ===================== */
var REC=new Map(), db=null, recVer=0;
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open('sot',1);r.onupgradeneeded=function(){r.result.createObjectStore('min',{keyPath:'k'});r.result.createObjectStore('meta',{keyPath:'k'});};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function loadLocal(){return openDB().then(function(d){db=d;return new Promise(function(res,rej){var c=db.transaction('min').objectStore('min').openCursor();c.onsuccess=function(){var cur=c.result;if(!cur){res();return;}putRec(cur.value,false);cur.continue();};c.onerror=function(){rej(c.error);};});}).catch(function(e){log('Local store unavailable: '+e.message);});}

$('autosync').addEventListener('change', function(){ S.autosync=+this.value; save(); setupAutoSync(); });
$('devName').addEventListener('change', function(){ S.devName=this.value.trim()||S.devName; save(); });
$('token').addEventListener('change', function(){ TOKEN=this.value.trim(); try{ localStorage.setItem('sot.token',TOKEN); }catch(e){} log(TOKEN?'Token saved on this phone.':'Token cleared.'); });
$('syncBtn').addEventListener('click', syncNow);
$('reloadBtn').addEventListener('click', function(){ loadShared().then(function(){ modelKey=''; setStatus('Reloaded'); }); });
$('outBtn').addEventListener('click', zoomOut);
$('nowBtn').addEventListener('click', function(){ setSpan(view.span, anchorFor(view.span)); });
$('viewLive').addEventListener('click', function(){ setView('live'); });
$('viewHist').addEventListener('click', function(){ setView('history'); });
function setView(v){ if(v==='history'&&S.view!=='history'){ S.liveSpeed=S.speed; S.speed=0; } if(v==='live'&&S.view!=='live'){ S.speed=S.liveSpeed||1.2; } S.view=v; $('viewLive').classList.toggle('on',v==='live'); $('viewHist').classList.toggle('on',v==='history'); $('speed').value=S.speed; $('speedV').textContent=fmt2(S.speed); save(); updateHud(); }
function setSpan(span,t0){ view.span=span; view.t0=t0; S.span=span; $('span').value=span; modelKey=''; save(); if(S.view!=='history')setView('history'); updateHud(); }
$('pauseBtn').addEventListener('click', function(){ paused=!paused; this.textContent=paused?'▶ Resume':'⏸ Pause'; setStatus(paused?'Paused':'Playing'); });
$('fsBtn').addEventListener('click', function(){ var p;
  if(!document.fullscreenElement && !document.webkitFullscreenElement){ var el=document.documentElement; p=(el.requestFullscreen||el.webkitRequestFullscreen||function(){return Promise.reject();}).call(el); p.then(function(){setStatus('Fullscreen on');},function(){setStatus('Fullscreen not available here');}); }
  else{ p=(document.exitFullscreen||document.webkitExitFullscreen).call(document); p.then(function(){setStatus('Fullscreen off');},function(){}); } });
$('pngBtn').addEventListener('click', function(){ var a=document.createElement('a'); a.download='my-time-'+(S.view==='history'?view.span+'-'+new Date(view.t0).toISOString().slice(0,10):'live')+'.png'; a.href=canvas.toDataURL('image/png'); a.click(); });
$('shareBtn').addEventListener('click', function(){ canvas.toBlob(function(blob){ var file=new File([blob],'my-time.png',{type:'image/png'}); if(navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:'My Time'}).catch(function(){}); else if(navigator.share)navigator.share({title:'My Time',url:location.href}).catch(function(){}); else $('pngBtn').click(); },'image/png'); });
$('grab').addEventListener('click', function(){ sheet.classList.toggle('open'); });
$('hideBtn').addEventListener('click', function(){ sheet.classList.remove('open'); sheet.classList.add('hidden'); $('showBtn').classList.add('on'); });
$('showBtn').addEventListener('click', function(){ sheet.classList.remove('hidden'); $('showBtn').classList.remove('on'); });
var rebuildT=null;
function scheduleRebuild(){ clearTimeout(rebuildT); rebuildT=setTimeout(function(){ buildGrid(S.autoq?Math.min(qualityRes,S.res):S.res); },120); }
Array.prototype.forEach.call(document.querySelectorAll('.chip[data-p]'), function(btn){
  btn.addEventListener('click', function(){ Object.assign(S, PRESETS[btn.dataset.p]); if(S.view==='history'){ S.liveSpeed=S.speed; S.speed=0; } qualityRes=S.res; applyUI(); buildLUT(); buildGrid(S.res); save(); setStatus('Preset: '+btn.textContent.trim()); });
});
function applyUI(){
  $('mode').value=S.mode; $('res').value=S.res; $('resV').textContent=fmt0(S.res); $('amp').value=S.amp; $('ampV').textContent=fmt1(S.amp);
  $('freq').value=S.freq; $('freqV').textContent=fmt2(S.freq); $('size').value=S.size; $('sizeV').textContent=fmt1(S.size); $('speed').value=S.speed; $('speedV').textContent=fmt2(S.speed);
  $('cA').value=S.cA; $('cB').value=S.cB; $('trails').checked=S.trails; $('rotate').checked=S.rotate; $('autoq').checked=S.autoq; $('horizon').checked=S.horizon;
  $('ahead').value=S.ahead; $('aheadV').textContent=fmt0(S.ahead); $('scale').value=S.scale; $('span').value=view.span; $('rate').value=String(S.rate);
  $('cal').value=S.cal; $('calV').textContent=fmt0(S.cal); $('src').value=S.src; $('autosync').value=String(S.autosync); $('devName').value=S.devName; $('token').value=TOKEN;
  $('viewLive').classList.toggle('on',S.view==='live'); $('viewHist').classList.toggle('on',S.view==='history');
}

/* ===================== pointer camera (donor) + time rungs under pinch ===================== */
var pointers=new Map(), pinchD=0, lastTap=0, downInfo=null;
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
canvas.addEventListener('pointerdown', function(e){
  try{ canvas.setPointerCapture(e.pointerId); }catch(x){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ var p=Array.from(pointers.values()); pinchD=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y); }
  downInfo={x:e.clientX,y:e.clientY,t:performance.now()}; dismissHint();
});
canvas.addEventListener('pointermove', function(e){
  var pt=pointers.get(e.pointerId); if(!pt) return;
  var dx=e.clientX-pt.x, dy=e.clientY-pt.y; pt.x=e.clientX; pt.y=e.clientY;
  if(pointers.size===1){ yaw+=dx*0.005; pitch=clamp(pitch+dy*0.005, 0.15, 1.45); }
  else if(pointers.size===2){
    var p=Array.from(pointers.values()); var d=Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
    if(pinchD>0 && d>0) dist=clamp(dist*pinchD/d, 12, 240); pinchD=d;
    if(S.view==='history'){ if(dist<=14 && view.span!=='minute'){ zoomInAt((p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2); dist=120; } else if(dist>=236 && view.span!=='life'){ zoomOut(); dist=50; } }
  }
});
function endPointer(e){
  if(pointers.has(e.pointerId)){ pointers.delete(e.pointerId); if(pointers.size<2) pinchD=0;
    if(pointers.size===0 && downInfo){ var moved=Math.hypot(e.clientX-downInfo.x, e.clientY-downInfo.y), dur=performance.now()-downInfo.t;
      if(moved<12 && dur<400){ var now=performance.now(); if(now-lastTap<350){ resetCamera(); setStatus('Camera reset'); } else if(S.view==='history'){ describeAt(e.clientX,e.clientY); } lastTap=now; }
      downInfo=null; } }
}
canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', function(e){ e.preventDefault(); dist=clamp(dist*(1+e.deltaY*0.001), 12, 240);
  if(S.view==='history'){ if(dist<=14 && view.span!=='minute'){ zoomInAt(e.clientX,e.clientY); dist=120; } else if(dist>=236 && view.span!=='life'){ zoomOut(); dist=50; } } },{passive:false});
/* which cell is under a screen point: nearest projected grid point */
var lastProj=null; // Float32Array of [sx,sy,cell] triples sampled every few grid points
function cellAt(sx,sy){ if(!lastProj)return -1; var best=-1,bd=1e9; for(var i=0;i<lastProj.length;i+=3){ var d=(lastProj[i]-sx*dpr)*(lastProj[i]-sx*dpr)+(lastProj[i+1]-sy*dpr)*(lastProj[i+1]-sy*dpr); if(d<bd){bd=d;best=lastProj[i+2];} } return best; }
function zoomInAt(sx,sy){ ensureModel(); var ci=cellAt(sx,sy); if(ci<0)ci=cellAt(innerWidth/2,innerHeight/2); if(ci<0)return; var c=model.cells[ci]; var tu=UI[view.span]-1; if(view.span==='life')tu=UI.decade; var id=UNITS[tu]; setSpan(id, alignDown(c.a,id)); setStatus('Opened '+rangeLabel(view.t0,spanEnd(view.t0,id),id)); }
function zoomOut(){ if(view.span==='life')return; var mid=view.t0+(spanEnd(view.t0,view.span)-view.t0)/2, id=UNITS[UI[view.span]+1]; setSpan(id, alignDown(mid,id)); setStatus(rangeLabel(view.t0,spanEnd(view.t0,id),id)); }
function describeAt(sx,sy){ ensureModel(); var ci=cellAt(sx,sy); if(ci<0)return; var c=model.cells[ci]; setStatus(rangeLabel(c.a,c.b,model.cu)+(c.L==null?(c.future?' · not yet':' · nothing recorded'):' · '+Math.round(c.L)+' dB')); }

/* ===================== fps + adaptive quality (donor) ===================== */
var fps=0, frames=0, fpsT=performance.now();
function autoQ(){ if(!S.autoq) return;
  if(fps<26 && effRes>40){ qualityRes=Math.max(40, effRes-15); buildGrid(qualityRes); }
  else if(fps>52 && effRes<S.res){ qualityRes=Math.min(S.res, effRes+15); buildGrid(qualityRes); } }

/* ===================== playback: the story at a speed, then live ===================== */
var AC2=null, master=null, voices=null, playing=false, simT=0, followLive=false, playRAF=0, lastPlayI=-1;
var PENTA=[0,2,4,7,9,12,14,16,19,21];
function ensureAudio(){ if(AC2)return; AC2=new (window.AudioContext||window.webkitAudioContext)(); master=AC2.createGain(); master.gain.value=0.6; var comp=AC2.createDynamicsCompressor(); master.connect(comp); comp.connect(AC2.destination); }
function mkVoices(){ voices=[]; for(var b=0;b<10;b++){ var o=AC2.createOscillator(); o.type='sine'; var g=AC2.createGain(); g.gain.value=0; o.connect(g); g.connect(master); o.start(); voices.push({o:o,g:g}); } }
function killVoices(){ if(!voices)return; voices.forEach(function(v){ try{ v.g.gain.setTargetAtTime(0,AC2.currentTime,0.03); v.o.stop(AC2.currentTime+0.2); }catch(e){} }); voices=null; }
function voiceCell(c,ramp){ var tm=AC2.currentTime; if(c.L==null){ voices.forEach(function(v){v.g.gain.setTargetAtTime(0,tm,ramp);}); return; }
  var v=c.v, rec=S.src==='rec'?REC.get(Math.floor(c.a/MIN)):null, bands=rec?rec.b:null;
  for(var b=0;b<10;b++){ var bv=bands?clamp((bands[b]-20)/80,0,1):v*(b<5?1:0.5); voices[b].o.frequency.setTargetAtTime(110*Math.pow(2,PENTA[b]/12),tm,ramp); voices[b].g.gain.setTargetAtTime(Math.pow(bv,2.2)*0.16,tm,ramp); } }
function startPlay(){
  if(S.view!=='history')setView('history'); ensureModel(); ensureAudio(); AC2.resume(); killVoices(); mkVoices(); playing=true; followLive=false; pauseRec(true);
  simT=view.t0; lastPlayI=-1; $('playBtn').textContent='■ Stop'; $('playBtn').classList.add('on'); var lastNow=performance.now();
  var tick=function(){ if(!playing)return; var now=performance.now(), dt=(now-lastNow)/1000; lastNow=now; var end=spanEnd(view.t0,view.span);
    if(followLive)simT=Date.now(); else { simT+=S.rate*1000*dt; if(simT>=Date.now()){ simT=Date.now(); followLive=true; pauseRec(false); setStatus('Live'); } }
    if(simT>=end){ stopPlay(); return; }
    var cells=model.cells, lo=0, hi=cells.length-1; while(lo<hi){ var m=(lo+hi+1)>>1; if(cells[m].a<=simT)lo=m; else hi=m-1; }
    if(lo!==lastPlayI){ lastPlayI=lo; voiceCell(cells[lo], followLive?0.3:Math.min(0.08,(cells[lo].b-cells[lo].a)/S.rate/2000)); }
    playRAF=requestAnimationFrame(tick); };
  playRAF=requestAnimationFrame(tick);
}
function stopPlay(){ playing=false; followLive=false; cancelAnimationFrame(playRAF); killVoices(); pauseRec(false); $('playBtn').textContent='▶ Play history'; $('playBtn').classList.remove('on'); updateHud(); }
$('playBtn').addEventListener('click', function(){ playing?stopPlay():startPlay(); });

/* ===================== render ===================== */
function render(){
  var w=canvas.width, h=canvas.height;
  ctx2d.fillStyle=S.trails?'rgba(10,12,18,0.28)':'#0a0c12'; ctx2d.fillRect(0,0,w,h);
  var cyw=Math.cos(yaw), syw=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  var cx=w/2, cyc=h/2, fov=Math.min(w,h)*1.1;
  var hist=S.view==='history';
  if(hist){ ensureModel(); if(histDirty||!gridCell||gridCell.length!==cols*rows)buildGridMap(); }
  var ampEff=Math.max(0.001, S.amp*(1+level*1.2)), norm=ampEff*1.6, beatBoost=beat*90, sizeBeat=1+beat*0.8;
  var liveV=hist&&recState==='on'&&liveDb!=null?clamp((liveDb-20)/80,0,1):0;
  var nowCell=-1; if(hist){ for(var q=0;q<model.cells.length;q++){ if(model.cells[q].a<=T_END&&T_END<model.cells[q].b){nowCell=q;break;} } }
  var sampleEvery=Math.max(1,Math.round(cols*rows/3000)), proj=hist?[]:null;
  var i=0, r, c;
  for(r=0;r<rows;r++){ for(c=0;c<cols;c++,i++){
    var x=px[i], z=pz[i], y, ci, cell=null, dim=false;
    if(hist){
      ci=gridCell[i]; if(ci<0)continue; cell=model.cells[ci];
      var unbuilt=playing&&cell.a>simT, v=cell.v;
      if(cell.L==null||unbuilt){ y=0; dim=true; }
      else { y=v*S.amp*1.6; if(ci===nowCell&&liveV)y+=liveV*S.amp*0.6; }
      if(S.speed>0&&!unbuilt&&cell.L!=null) y+=waveVal(x,z)*S.amp*0.12;
    } else { y=waveVal(x,z)*ampEff; if(colF) y*=1+colF[c]*1.4; }
    var x1=x*cyw - z*syw, z1=x*syw + z*cyw, y1=y*cp - z1*sp, z2=y*sp + z1*cp + dist;
    if(z2<2) continue;
    var s=fov/z2, sx=cx+x1*s, sy2=cyc-y1*s;
    if(sx<-10||sx>w+10||sy2<-10||sy2>h+10) continue;
    var cidx;
    if(hist){ if(proj&&(i%sampleEvery===0))proj.push(sx,sy2,ci); cidx=dim?8:((cell.v*0.85+0.15)*255)|0; if(ci===nowCell&&liveV)cidx=Math.min(255,cidx+liveV*120); ctx2d.fillStyle=dim?DIM[cidx]:LUT[cidx]; }
    else { var yn=y/norm; if(yn>1)yn=1; else if(yn<-1)yn=-1; cidx=((yn*0.5+0.5)*255 + beatBoost)|0; if(cidx>255)cidx=255; else if(cidx<0)cidx=0; ctx2d.fillStyle=LUT[cidx]; }
    var sz=S.size*s*0.25*(hist?1:sizeBeat); if(sz<0.7)sz=0.7; else if(sz>26)sz=26;
    ctx2d.fillRect(sx-sz/2, sy2-sz/2, sz, sz);
  } }
  if(hist&&proj)lastProj=Float32Array.from(proj);
}

/* ===================== audio per-frame (donor) ===================== */
function audioFrame(){
  if(!micOn || !analyser){ level*=0.95; beat*=0.93; return; }
  analyser.getByteFrequencyData(freqData); analyser.getByteTimeDomainData(tdData);
  var n=analyser.frequencyBinCount, c;
  if(!colF || colF.length!==cols) colF=new Float32Array(cols);
  for(c=0;c<cols;c++) colF[c]=freqData[Math.min(n-1,(colNorm[c]*(n-1)*0.5)|0)]/255;
  var sum=0, i2, v; for(i2=0;i2<tdData.length;i2++){ v=(tdData[i2]-128)/128; sum+=v*v; }
  var rms=Math.sqrt(sum/tdData.length); level+=(Math.min(1,rms*3)-level)*0.2;
  var db=rms>0 ? 20*Math.log10(rms) : -80; if(!isFinite(db)) db=-80; dbNow=db; dbBase+=(db-dbBase)*0.06;
  if(beatCool>0) beatCool--; if(db>dbBase+5 && beatCool===0){ beat=1; beatCool=8; } beat*=0.93;
  packetFrame();
}

/* ===================== hud ===================== */
function updateHud(){
  if(S.view==='history'){ ensureModel(); var end=spanEnd(view.t0,view.span);
    hudTitle.textContent=(view.span==='life'?'Life':'One '+view.span)+' · '+rangeLabel(view.t0,end,view.span);
    var need=(Math.min(T_END,end)-view.t0)/1000/S.rate, needS=need<90?Math.round(need)+' s':need<5400?Math.round(need/60)+' min':need<172800?(need/3600).toFixed(1)+' h':Math.round(need/86400)+' days';
    var rec=model.cells.filter(function(c){return c.L!=null;}).length;
    hudLine.textContent=model.cells.length+' '+model.cu+'s · '+rec+' recorded · '+(playing?(followLive?'live':$('rate').options[$('rate').selectedIndex].text+' · '+(UI[model.cu]<=UI.hour?fmtTs(simT):fmtD(simT))):'play takes '+needS);
    $('playNote').textContent='Played from the start of the view at this speed it takes '+needS+', then it follows live.';
  } else { hudTitle.textContent='Live'; hudLine.textContent=(recState==='on'?'listening':'mic off')+(liveDb!=null?' · '+Math.round(liveDb)+' dB':''); $('playNote').textContent=''; }
}

/* ===================== main loop (donor) ===================== */
var last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(!paused){ t+=S.speed*dt; if(S.rotate && pointers.size===0) yaw+=0.12*dt; }
  audioFrame(); render(); frames++;
  if(now-fpsT>=1000){ fps=frames; frames=0; fpsT=now; updateHud();
    if(micOn) micStatusEl.textContent='Listening · '+(liveDb!=null?Math.round(liveDb)+' dB':'')+' · '+REC.size+' minutes stored · '+dirty.size+' unsynced'+(beat>0.4?' · BEAT':'');
    statusEl.title=fps+' fps · '+cols+'×'+rows; autoQ(); }
}

/* ===================== boot ===================== */
view.t0=anchorFor(view.span);
applyUI(); buildLUT(); buildGrid(S.res); renderPresets(); setView(S.view);
if(S.view==='history'&&S.speed>0){ S.liveSpeed=S.speed; S.speed=0; $('speed').value=0; $('speedV').textContent='0.00'; }
setStatus('Welcome to My Time');
requestAnimationFrame(frame);
loadLocal().then(function(){ var want=false; try{ want=localStorage.getItem('mytime-wantRec')==='1'; }catch(e){} if(want&&!micOn)enableMic(); return loadShared(); }).then(function(){ setupAutoSync(); syncPresets(); modelKey=''; });
})();
</script>
