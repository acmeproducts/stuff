<style>

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-columns:224px 1fr}.rail{background:#081321;border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}.brand{padding:8px 9px 14px;border-bottom:1px solid var(--line)}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);margin-top:3px}.rail button{border:0;background:transparent;color:var(--muted);padding:11px;border-radius:9px;text-align:left;font-weight:800}.rail button.active,.rail button:hover{background:#17304e;color:var(--text)}.rail .config{margin-top:auto}.work{min-width:0;height:100%;display:flex;flex-direction:column}.top{padding:10px 14px;border-bottom:1px solid var(--line);background:#07101d;display:grid;gap:7px}.context{font-weight:850;font-size:15px;display:flex;justify-content:space-between;gap:10px}.crumbs{display:flex;align-items:center;gap:7px;min-height:24px;overflow-x:auto;white-space:nowrap;color:var(--muted)}.crumbs button{border:0;background:transparent;color:var(--accent);padding:0;font-weight:800}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.horizons{display:grid;grid-template-columns:repeat(7,minmax(46px,1fr));gap:5px;max-width:760px;margin:auto;width:100%}.horizons button,.more,.btn{border:1px solid var(--line);background:#111f33;color:var(--text);border-radius:9px;padding:9px;font-weight:800}.horizons button.active{border-color:var(--accent);background:#17375b}.main{flex:1;min-height:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}.statusline{font-size:11px;color:var(--muted);min-height:16px}.charthead{display:flex;gap:8px;align-items:center;min-height:34px;overflow-x:auto}.legend{display:flex;gap:7px;align-items:center;overflow-x:auto;flex:1}.l <body>
<div class="shell">
<aside class="rail" id="rail">
  <div class="brand"><b>Market Navigator</b><small>Gate 4 R3 · 3.9.7 lineage</small></div>
  <button data-nav="now" class="active">NOW</button>
  <button data-nav="explore">EXPLORE</button>
  <button data-nav="library">LIBRARY</button>
  <button data-nav="health">HEALTH</button>
  <button class="config" data-nav="config">CONFIG</button>
</aside>
<section class="work">
  <header class="top">
    <div class="context"><span><button class="hamb btn" id="hamb">☰</button> <span id="contextText">Market: loading · Growth: loading · Payroll: loading</span></span><span id="releaseId">R3</span></div>
    <div class="crumbs" id="crumbs"></div>
    <div class="controls"><div class="horizons" id="horizons"></div><button class="more" id="moreBtn">More</button></div>
  </header>
  <main class="main">
    <div class="view active" id="view-now">
      <div class="statusline" id="status">Loading canonical backend evidence…</div>
      <div class="charthead"><div class="legend" id="legend"></div><button class="btn" id="addSeries">+ Series</button><button class="btn" id="qaBtn">QA</button></div>
      <div class="surface">
        <div class="chartwrap"><canvas id="chart"></canvas></div>
        <div class="under"><span id="axisNote"></span><span id="provenance"></span></div><div id="statsBar" class="under"></div>
      </div>
      <div class="qa" id="qa"></div>
    </div>
    <div class="view" id="view-explore"><div class="row"><h2>Explore</h2><button class="btn" id="exploreAdd">+ Add series</button></div><div class="grid" id="exploreGrid"></div></div>
    <div class="view" id="view-library"><div class="row"><h2>Library</h2><button class="btn" id="clearLibrary">Clear</button></div><div class="grid" id="libraryGrid"></div></div>
    <div class="view" id="view-health"><div class="row"><h2>Health</h2><button class="btn" id="reloadHealth">Reload</button></div><div class="grid" id="healthGrid"></div></div>
    <div class="view" id="view-config"><div class="row"><h2>Configuration</h2><span class="muted">Keys remain in this browser.</span></div><div class="grid" id="configGrid"></div></div>
  </main>
  <section class="ai" id="aiPanel"><div class="pov"><b>AI POV</b><div id="pov" class="muted" style="margin-top:6px">Configure a provider to generate an evidence-grounded POV.</div><button class="btn" id="povBtn" style="margin-top:8px">Generate POV</button></div><div class="chat"><div class="chatlog" id="chatlog"></div><div class="compose"><select id="provider"></select><select id="model" class="model"></select><input id="prompt" placeholder="Ask about the active evidence"><button class="btn send" id="send">Send</button></div></div></section>
</section>
</div>

<div class="modal" id="moreModal"><div class="panel"><h2>More</h2><div class="grid"><button class="btn" data-more="analysis">Add to Analysis</button><button class="btn" data-more="library">Add / Save to Library</button><button class="btn" data-more="print">Print</button><button class="btn" data-more="download">Download</button></div><button class="btn" data-close="moreModal" style="margin-top:10px">Close</button></div></div>
<div class="modal" id="seriesModal"><div class="panel"><div class="sticky row"><div><h2>Add Series</h2><input id="seriesSearch" placeholder="Search series" style="background:#091422;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px"></div><div><button class="btn" id="seriesDone">Done</button><button class="btn" data-close="seriesModal">Close</button></div></div><div class="tabs" id="seriesTabs"></div><div class="serieslist" id="seriesList"></div></div></div>
<div class="modal" id="aboutModal"><div class="panel"><div class="row"><h2 id="aboutTitle">About</h2><button class="btn" data-close="aboutModal">×</button></div><div id="aboutBody"></div><button class="btn" id="aboutMore" style="margin-top:10px">More info</button></div></div>

<script>
'use strict';
const RELEASE='Gate 4 R3', VERSION='4.0.0-r3', HORIZONS=['1D','5D','MTD','YTD','1YR','3YR','5YR'];
const PATHS={catalog:'data/market-backend/data-catalog.json',defs:'data/market-backend/derived-index-definition.json',manifest:'data/market-backend/market-manifest.json',market:'data/market-backend/market-cache.json',macro:'data/market-backend/macro-cache.json',health:'data/market-backend/source-health.json'};
const IDXCOL={risk:'#ff6b73',growth:'#67a8ff',macro:'#f2f5f8'}, IDXLAB={risk:'RSK',growth:'GRW',macro:'MAC'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const app={catalog:null,defs:null,manifest:null,health:null,series:{},state:{level:'v1',index:null,root:null,series:[],horizon:'5D',inspection:null,nav:'now'},library:[],chat:[],cfg:{providers:{},activeProvider:'openrouter',activeModel:''}};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function short3(s){const x=String(s||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();return x.slice(0,3)||'SER'}
function saveLocal(){localStorage.setItem('mn-g4r3-library',JSON.stringify(app.library));localStorage.setItem('mn-g4r3-config',JSON.stringify(app.cfg))}
function loadLocal(){try{app.library=JSON.parse(localStorage.getItem('mn-g4r3-library')||'[]')}catch{}try{app.cfg=Object.assign(app.cfg,JSON.parse(localStorage.getItem('mn-g4r3-config')||'{}'))}catch{}}
async function getJSON(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' '+r.status);return r.json()}
function meta(id){return app.catalog?.series?.find(s=>s.id===id)||{id,name:id,short_name:id,native_unit:'index',native_cadence:'unknown',provider:'canonical backend'}}
function obsPoint(x){if(Array.isArray(x)&&x.length>=2){const t=Date.parse(x[0])||Number(x[0]),v=Number(x[1]);return Number.isFinite(t)&&Number.isFinite(v)?{t,v}:null}const rawT=x?.date??x?.datetime??x?.timestamp??x?.time??x?.period??x?.ts??x?.t;const t=Date.parse(rawT)||Number(rawT);const v=Number(x?.value??x?.v??x?.close??x?.adjClose??x?.price??x?.level??x?.observation);return Number.isFinite(t)&&Number.isFinite(v)?{t,v}:null}
function ingestRecord(id,r){if(!id||!r)return;let a=r.observations||r.data||r.history||r.values||r.points||r.records;if(!Array.isArray(a))return;const clean=a.map(obsPoint).filter(Boolean).sort((x,y)=>x.t-y.t);if(clean.length)app.series[id]=clean}
function canonicalSeriesId(id){const raw=String(id||'');const m=(app.catalog?.series||[]).find(x=>x.id===raw||x.provider_identifier===raw||x.short_name===raw);return m?.id||raw}function ingestCache(j){const seen=new Set();function walk(n,hint=''){if(!n||typeof n!=='object'||seen.has(n))return;seen.add(n);if(Array.isArray(n)){const f=n.find(v=>v&&typeof v==='object');const obs=Array.isArray(f)||(f&&((f.date??f.datetime??f.timestamp??f.time??f.period??f.ts??f.t)!=null)&&((f.value??f.v??f.close??f.adjClose??f.price??f.level??f.observation)!=null));if(hint&&obs)ingestRecord(canonicalSeriesId(hint),{data:n});for(const v of n)walk(v,hint);return}const raw=n.id||n.series_id||n.seriesId||n.key||n.symbol||n.ticker||hint;const id=canonicalSeriesId(raw);ingestRecord(id,n);for(const [k,v] of Object.entries(n))if(v&&typeof v==='object')walk(v,(n.symbol||n.ticker||n.id||n.series_id||n.seriesId||n.key)?id:k)}walk(j)}
function horizonSlice(id,h=app.state.horizon){const a=app.series[id]||[];if(!a.length)return[];if(h==='1D')return a.slice(-2);if(h==='5D')return a.slice(-6);const end=a.at(-1).t,d=new Date(end);let cut;if(h==='MTD')cut=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1);else if(h==='YTD')cut=Date.UTC(d.getUTCFullYear(),0,1);else cut=end-({'1YR':365,'3YR':1095,'5YR':1825}[h]||5)*864e5;return a.filter(p=>p.t>=cut)}
function rebase(a,dir=1){if(!a.length||!Number.isFinite(a[0].v)||a[0].v<=0)return[];const b=a[0].v;return a.map(p=>({t:p.t,v:100+dir*((p.v/b)-1)*100,sourceT:p.t}))}
function derive(key,h=app.state.horizon){const d=app.defs?.indices?.[key];if(!d)return{data:[],missing:[]};const comps=[],missing=[];for(const c of d.components){const a=horizonSlice(c.id,h);const rb=rebase(a,c.direction);rb.length?comps.push({id:c.id,data:rb}):missing.push(c.id)}if(!comps.length)return{data:[],missing};const times=[...new Set(comps.flatMap(c=>c.data.map(p=>p.t)))].sort((a,b)=>a-b),last={};const out=[];for(const t of times){for(const c of comps){const p=c.data.find(x=>x.t===t);if(p)last[c.id]=p.v}const vals=Object.values(last).filter(Number.isFinite);if(vals.length)out.push({t,v:vals.reduce((a,b)=>a+b,0)/vals.length})}return{data:out,missing}}
function activeSeries(){if(app.state.level==='v1')return['risk','growth','macro'].map(k=>({id:k,name:app.defs?.indices?.[k]?.name||k,abbr:IDXLAB[k],color:IDXCOL[k],unit:'Indexed 100',data:derive(k).data,index:true}));if(app.state.level==='v2'){const k=app.state.index,d=app.defs.indices[k];const head={id:k,name:d.name,abbr:IDXLAB[k],color:IDXCOL[k],unit:'Indexed 100',data:derive(k).data,index:true};const comps=d.components.map((c,i)=>{const m=meta(c.id);return{id:c.id,name:m.name,abbr:short3(m.short_name||m.id),color:['#54d5ff','#b28cff','#ffb45e','#4ad69f','#ff7cc5','#d0db70','#9daeff'][i%7],unit:'Indexed 100',data:rebase(horizonSlice(c.id),c.direction),raw:true}});return[head,...comps]}return app.state.series.map((id,i)=>{const m=meta(id);return{id,name:m.name,abbr:short3(m.short_name||id),color:['#6db7ff','#ff9f6d','#7bd88f','#d5a6ff','#f3cf66','#74d8d8'][i%6],unit:m.native_unit||'',data:horizonSlice(id),raw:true}})}
function unitFamily(u){u=String(u||'').toLowerCase();if(u.includes('percent')||u==='%')return'percent';if(u.includes('usd')||u.includes('dollar'))return'currency';if(u.includes('index'))return'index';if(u.includes('count')||u.includes('persons')||u.includes('claims'))return'count';return u||'other'}
function axisPlan(series){if(app.state.level!=='v3')return{mode:'indexed',families:['Indexed 100']};const fs=[...new Set(series.map(s=>unitFamily(s.unit)))];return fs.length<=2?{mode:'native',families:fs}:{mode:'indexed',families:['Indexed 100']}}
function seriesForChart(){let s=activeSeries(),p=axisPlan(s);if(p.mode==='indexed'&&app.state.level==='v3')s=s.map(x=>({...x,unit:'Indexed 100',data:rebase(x.data,1)}));return{s,p}}
function fmtValue(v,u){if(!Number.isFinite(v))return'Unavailable';const l=String(u||'').toLowerCase();if(l.includes('percent'))return v.toFixed(2)+'%';if(l.includes('usd'))return '$'+v.toFixed(2);return v.toFixed(2)}
function draw(){const {s,p}=seriesForChart(),c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);const w=r.width,h=r.height,pad={l:60,r:p.mode==='native'&&p.families.length===2?58:16,t:14,b:32};x.clearRect(0,0,w,h);const pts=s.flatMap(z=>z.data||[]);if(!pts.length){x.fillStyle='#9cb0c9';x.font='13px system-ui';x.fillText('Canonical evidence unavailable for this state/horizon.',20,30);return}const t0=Math.min(...pts.map(q=>q.t)),t1=Math.max(...pts.map(q=>q.t));let families=p.families, ranges={};for(const f of families){const vals=s.filter(z=>p.mode==='indexed'||unitFamily(z.unit)===f).flatMap(z=>z.data.map(q=>q.v));if(vals.length){let lo=Math.min(...vals),hi=Math.max(...vals),m=(hi-lo||1)*.08;ranges[f]=[lo-m,hi+m]}}function X(t){return pad.l+(t-t0)/(Math.max(1,t1-t0))*(w-pad.l-pad.r)}function Y(v,f){const [lo,hi]=ranges[f]||[0,1];return pad.t+(hi-v)/(hi-lo)*(h-pad.t-pad.b)}x.font='10px system-ui';x.strokeStyle='#2a3a52';x.fillStyle='#9cb0c9';for(let i=0;i<5;i++){const yy=pad.t+(h-pad.t-pad.b)*i/4;x.beginPath();x.moveTo(pad.l,yy);x.lineTo(w-pad.r,yy);x.stroke();for(let fi=0;fi<families.length;fi++){const f=families[fi],rg=ranges[f];if(!rg)continue;const val=rg[1]-(rg[1]-rg[0])*i/4;x.fillText(fmtValue(val,p.mode==='indexed'?'index':f),fi===0?3:w-pad.r+5,yy+3)}}for(let i=0;i<5;i++){const tt=t0+(t1-t0)*i/4,dt=new Date(tt),lab=app.state.horizon==='1D'?dt.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):dt.toLocaleDateString([],{month:'short',day:'numeric',year:app.state.horizon==='5YR'?'2-digit':undefined});x.fillText(lab,Math.max(2,Math.min(w-62,X(tt)-22)),h-8)}for(const z of s){if(!z.data.length)continue;const f=p.mode==='indexed'?families[0]:unitFamily(z.unit);x.strokeStyle=z.color;x.lineWidth=2;x.beginPath();z.data.forEach((q,i)=>{const xx=X(q.t),yy=Y(q.v,f);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()}if(app.state.inspection){const I=app.state.inspection,z=s.find(v=>v.id===I.id),q=z?.data?.find(v=>v.t===I.t);if(q){const f=p.mode==='indexed'?families[0]:unitFamily(z.unit),xx=X(q.t),yy=Y(q.v,f);x.strokeStyle='#dce9f7';x.beginPath();x.moveTo(xx,pad.t);x.lineTo(xx,h-pad.b);x.stroke();x.fillStyle=z.color;x.beginPath();x.arc(xx,yy,4,0,Math.PI*2);x.fill();const text=`${z.abbr} · ${new Date(q.t).toLocaleDateString()} · ${fmtValue(q.v,z.unit)} · ${z.unit}`;x.font='11px system-ui';const tw=Math.min(w-20,x.measureText(text).width+14),tx=Math.max(6,Math.min(w-tw-6,xx+8)),ty=Math.max(6,yy-32);x.fillStyle='#eef5ff';x.fillRect(tx,ty,tw,24);x.fillStyle='#07101d';x.fillText(text,tx+7,ty+15)}}c.onpointerdown=e=>inspect(e,s,p,pad,t0,t1,ranges);$('#axisNote').textContent=p.mode==='indexed'?'Indexed 100 · >2 incompatible native unit families collapse to Indexed 100':families.map((f,i)=>`Y${i+1}: ${f}`).join(' · ')}
function inspect(e,s,p,pad,t0,t1,ranges){const r=$('#chart').getBoundingClientRect(),ex=e.clientX-r.left,ey=e.clientY-r.top,W=Math.max(1,r.width-pad.l-pad.r),H=Math.max(1,r.height-pad.t-pad.b),candidates=[];for(const z of s){if(!z.data.length)continue;const f=p.mode==='indexed'?p.families[0]:unitFamily(z.unit),rg=ranges[f]||[0,1];for(const q of z.data){const xx=pad.l+(q.t-t0)/Math.max(1,t1-t0)*W,yy=pad.t+(rg[1]-q.v)/Math.max(1,rg[1]-rg[0])*H,score=Math.hypot(xx-ex,yy-ey);candidates.push({z,q,score})}}candidates.sort((a,b)=>a.score-b.score);if(candidates[0])app.state.inspection={id:candidates[0].z.id,t:candidates[0].q.t};draw()}
function renderLegend(){const {s}=seriesForChart();$('#legend').innerHTML=s.map(z=>`<button data-leg="${esc(z.id)}"><i style="background:${z.color}"></i>${esc(z.abbr)}</button>`).join('');$$('[data-leg]').forEach(b=>b.onclick=()=>legendAction(b.dataset.leg))}

function renderCrumbs(){let a=[['Market',()=>{app.state.level='v1';app.state.index=null;app.state.root=null;app.state.series=[];app.state.inspection=null;renderAnalytic()}]];if(app.state.level==='v2')a.push([app.defs.indices[app.state.index].name,null]);if(app.state.level==='v3'){const m=meta(app.state.root);if(app.state.index)a.push([app.defs.indices[app.state.index].name,()=>{app.state.level='v2';app.state.series=[];app.state.inspection=null;renderAnalytic()}]);a.push([app.state.series.length>1?(m.short_name||m.name)+' + Custom':(m.short_name||m.name),null])}$('#crumbs').innerHTML=a.map(([l],i)=>`${i?'<span>/</span>':''}<button data-crumb="${i}">${esc(l)}</button>`).join('');$$('[data-crumb]').forEach((b,i)=>{const f=a[i][1];if(f)b.onclick=f;else b.style.color='#eef5ff'})}
function renderHorizons(){$('#horizons').innerHTML=HORIZONS.map(h=>`<button data-h="${h}" class="${h===app.state.horizon?'active':''}">${h}</button>`).join('');$$('[data-h]').forEach(b=>b.onclick=()=>{app.state.horizon=b.dataset.h;app.state.inspection=null;renderAnalytic()})}
function contextSentiment(key){const d=derive(key).data;if(d.length<2)return'Unavailable';const v=d.at(-1).v-d[0].v;return v>1?'Positive':v<-1?'Negative':'Neutral'}

function openAbout(id){const m=meta(id),isIdx=app.defs.indices[id];$('#aboutTitle').textContent=isIdx?isIdx.name:m.name;$('#aboutBody').innerHTML=isIdx?`<p><b>What is it?</b> Transparent equal-weight derived index.</p><p><b>How used here?</b> ${esc(isIdx.higher_means||'')}</p><p><b>Why matter?</b> Context for its canonical components.</p>`:`<p><b>What is it?</b> ${esc(m.description||m.name)}</p><p><b>How used here?</b> ${esc(m.role||'Canonical evidence')}</p><p><b>Why matter?</b> ${esc(m.category||m.domain||'Market context')}</p><p class="muted">${esc(m.provider||'')} · ${esc(m.native_cadence||'')} · ${esc(m.native_unit||'')}</p>`;$('#aboutMore').style.display=isIdx?'none':'inline-flex';$('#aboutMore').onclick=()=>{close('aboutModal');app.state.level='v3';app.state.root=id;app.state.series=[id];app.state.inspection=null;renderAnalytic()};open('aboutModal')}

function renderExplore(){const cats={};for(const m of app.catalog?.series||[])(cats[m.domain]??=[]).push(m);$('#exploreGrid').innerHTML=Object.entries(cats).map(([k,v])=>`<article class="card"><h3>${esc(k.toUpperCase())}</h3>${v.map(m=>`<button class="btn" data-exp="${m.id}" style="margin:3px">${esc(m.short_name||m.id)}</button>`).join('')}</article>`).join('');$$('[data-exp]').forEach(b=>b.onclick=()=>{app.state.level='v3';app.state.index=null;app.state.root=b.dataset.exp;app.state.series=[b.dataset.exp];app.state.inspection=null;renderAnalytic()})}

function alignedCorrelation(a,b){const A=new Map(a.map(p=>[new Date(p.t).toISOString().slice(0,10),p.v])),pairs=b.map(p=>[A.get(new Date(p.t).toISOString().slice(0,10)),p.v]).filter(p=>p.every(Number.isFinite));if(pairs.length<3)return null;const mx=pairs.reduce((s,p)=>s+p[0],0)/pairs.length,my=pairs.reduce((s,p)=>s+p[1],0)/pairs.length;let n=0,dx=0,dy=0;for(const [x,y] of pairs){const X=x-mx,Y=y-my;n+=X*Y;dx+=X*X;dy+=Y*Y}return{r:n/Math.sqrt(dx*dy),n:pairs.length}}
function renderStats(){const s=activeSeries();if(app.state.level!=='v3'){ $('#statsBar').textContent='Statistics bind to the active analytical state.';return}const parts=s.map(z=>{const v=z.data.map(p=>p.v);return `${z.abbr}: n=${v.length}${v.length?` · min ${fmtValue(Math.min(...v),z.unit)} · max ${fmtValue(Math.max(...v),z.unit)}`:''}`});if(s.length>=2){const c=alignedCorrelation(s[0].data,s[1].data);parts.push(c?`Correlation ${s[0].abbr}/${s[1].abbr}: r=${c.r.toFixed(3)} · n=${c.n} · ${app.state.horizon} · date-aligned · Pearson levels · transformation=none`:`Correlation ${s[0].abbr}/${s[1].abbr}: insufficient aligned observations`)}$('#statsBar').textContent=parts.join(' | ')}
function saveLibrary(){const st=JSON.parse(JSON.stringify(app.state)),series=activeSeries(),s=series.map(x=>x.id);app.library.unshift({title:app.state.level==='v1'?'Market':app.state.level==='v2'?app.defs.indices[app.state.index].name:meta(app.state.root).name,savedAt:Date.now(),horizon:app.state.horizon,level:app.state.level,series:s,state:st,axis:axisPlan(series),manifestRevision:app.manifest?.revision,release:RELEASE,version:VERSION,pov:$('#pov').textContent,chat:JSON.parse(JSON.stringify(app.chat)),evidence:series.map(z=>({id:z.id,first:z.data[0]||null,latest:z.data.at(-1)||null,observations:z.data.length}))});saveLocal();close('moreModal')}
function renderHealth(){let records=Array.isArray(app.health)?app.health:(app.health?.sources||app.health?.records||[]);$('#healthGrid').innerHTML=`<article class="card"><h3>Operational manifest</h3><div>Revision: ${esc(app.manifest?.revision||'Unavailable')}</div><div>Generated: ${esc(app.manifest?.generatedAt||'Unavailable')}</div><div>Contract: ${esc(app.manifest?.policy?.clientContract||'')}</div></article>`+(records||[]).slice(0,60).map(r=>`<article class="card"><h3>${esc(r.id||r.series_id||r.name||'source')}</h3><div class="${String(r.status||'').toLowerCase().includes('error')?'healthbad':'healthgood'}">${esc(r.status||'unknown')}</div><div class="muted">${esc(r.last_error||r.error||r.latest_observation||'')}</div></article>`).join('')}
function providerDefs(){return[{id:'venice',name:'Venice.ai',models:'https://api.venice.ai/api/v1/models',chat:'https://api.venice.ai/api/v1/chat/completions'},{id:'openrouter',name:'OpenRouter',models:'https://openrouter.ai/api/v1/models',chat:'https://openrouter.ai/api/v1/chat/completions'},{id:'anthropic',name:'Anthropic direct',chat:'https://api.anthropic.com/v1/messages'}]}
function renderConfig(){$('#configGrid').innerHTML=providerDefs().map(p=>{const c=app.cfg.providers[p.id]||{};return`<article class="card"><h3>${p.name}</h3><div class="form"><input type="password" data-key="${p.id}" value="${esc(c.key||'')}" placeholder="API key"><input data-model="${p.id}" value="${esc(c.model||'')}" placeholder="${p.id==='anthropic'?'claude-sonnet-4-6':'model id'}"><div class="row"><button class="btn" data-load="${p.id}" ${p.models?'':'disabled'}>Load models</button><button class="btn" data-test="${p.id}">Validate & save</button></div><select data-models="${p.id}"><option value="">Loaded models</option></select><div class="muted" data-cfgstat="${p.id}">${esc(c.status||'Not validated')}</div></div></article>`}).join('');$$('[data-load]').forEach(b=>b.onclick=async()=>{try{await loadModels(b.dataset.load)}catch(e){$(`[data-cfgstat="${b.dataset.load}"]`).textContent='Error: '+e.message}});$$('[data-test]').forEach(b=>b.onclick=async()=>{try{await validateProvider(b.dataset.test)}catch(e){$(`[data-cfgstat="${b.dataset.test}"]`).textContent='Error: '+e.message}})}
async function loadModels(id){const p=providerDefs().find(x=>x.id===id),key=$(`[data-key="${id}"]`).value.trim(),headers={};if(id==='venice'&&key)headers.Authorization='Bearer '+key;const r=await fetch(p.models,{headers});const j=await r.json();if(!r.ok)throw new Error(id+' models '+r.status);const ids=(j.data||[]).map(x=>x.id).filter(Boolean).sort();const sel=$(`[data-models="${id}"]`);sel.innerHTML=ids.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');sel.onchange=()=>{$(`[data-model="${id}"]`).value=sel.value};$(`[data-cfgstat="${id}"]`).textContent=ids.length+' models loaded'}
async function validateProvider(id){const key=$(`[data-key="${id}"]`).value.trim(),model=$(`[data-model="${id}"]`).value.trim();if(!key||!model)throw new Error('Key and model required');const p=providerDefs().find(x=>x.id===id);let r,j;if(id==='anthropic'){r=await fetch(p.chat,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1,messages:[{role:'user',content:'ping'}]})});j=await r.json()}else{r=await fetch(p.chat,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,max_tokens:1,messages:[{role:'user',content:'ping'}]})});j=await r.json()}if(!r.ok)throw new Error(id+' '+r.status+': '+JSON.stringify(j.error||j).slice(0,160));app.cfg.providers[id]={key,model,status:'Validated '+new Date().toLocaleString()};app.cfg.activeProvider=id;app.cfg.activeModel=model;saveLocal();renderConfig();renderComposer()}
function evidencePrompt(){const s=activeSeries();return JSON.stringify({release:RELEASE,manifestRevision:app.manifest?.revision,horizon:app.state.horizon,state:app.state.level,index:app.state.index,root:app.state.root,series:s.map(z=>({id:z.id,name:z.name,unit:z.unit,latest:z.data.at(-1)||null,first:z.data[0]||null,observations:z.data.length}))})}
async function aiCall(text){const id=$('#provider').value,model=$('#model').value,c=app.cfg.providers[id];if(!c?.key)throw new Error('Configure and validate '+id+' first');const sys='You are Market Navigator. Interpret only the supplied canonical evidence. State uncertainty and missing evidence. Do not invent source facts.';const user=`Canonical evidence:\n${evidencePrompt()}\n\nQuestion:\n${text}`;if(id==='anthropic'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1200,system:sys,messages:[{role:'user',content:user}]})}),j=await r.json();if(!r.ok)throw new Error('Anthropic '+r.status);return(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('')}const url=id==='venice'?'https://api.venice.ai/api/v1/chat/completions':'https://openrouter.ai/api/v1/chat/completions',r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},body:JSON.stringify({model,max_tokens:1200,messages:[{role:'system',content:sys},{role:'user',content:user}]})}),j=await r.json();if(!r.ok)throw new Error(id+' '+r.status);return j.choices?.[0]?.message?.content||''}
function renderComposer(){const ps=providerDefs().filter(p=>app.cfg.providers[p.id]?.key);$('#provider').innerHTML=(ps.length?ps:providerDefs()).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');if(app.cfg.activeProvider)$('#provider').value=app.cfg.activeProvider;const upd=()=>{const id=$('#provider').value,c=app.cfg.providers[id];$('#model').innerHTML=`<option>${esc(c?.model||'Not configured')}</option>`};$('#provider').onchange=()=>{app.cfg.activeProvider=$('#provider').value;app.cfg.activeModel=app.cfg.providers[app.cfg.activeProvider]?.model||'';saveLocal();upd()};upd()}
function renderChat(){$('#chatlog').innerHTML=app.chat.map(m=>`<div class="msg ${m.role==='user'?'user':''}">${esc(m.text)}</div>`).join('');$('#chatlog').scrollTop=$('#chatlog').scrollHeight}
async function sendChat(){const q=$('#prompt').value.trim();if(!q)return;app.chat.push({role:'user',text:q});$('#prompt').value='';renderChat();try{const a=await aiCall(q);app.chat.push({role:'assistant',text:a})}catch(e){app.chat.push({role:'assistant',text:'AI error: '+e.message})}renderChat()}
function seriesCategory(tab,m){const union=new Set(Object.values(app.defs.indices).flatMap(i=>i.components.map(c=>c.id)));if(tab==='Market')return['risk','growth','macro'].includes(m.id);if(['Risk','Growth','Macro'].includes(tab))return m.id===tab.toLowerCase()||app.defs.indices[tab.toLowerCase()].components.some(c=>c.id===m.id);return !union.has(m.id)}
function openSeries(){open('seriesModal');renderSeriesTabs('Market')}
function renderSeriesTabs(tab){const tabs=['Market','Risk','Growth','Macro','Other'];$('#seriesTabs').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-stab="${t}">${t}</button>`).join('');$$('[data-stab]').forEach(b=>b.onclick=()=>renderSeriesTabs(b.dataset.stab));const q=$('#seriesSearch').value.toLowerCase();let items=[];if(tab==='Market')items=['risk','growth','macro'].map(id=>({id,name:app.defs.indices[id].name,short_name:IDXLAB[id],index:true}));else{const cat=app.catalog.series.filter(m=>seriesCategory(tab,m));if(tab!=='Other'){const id=tab.toLowerCase();items=[{id,name:app.defs.indices[id].name,short_name:IDXLAB[id],index:true},...cat]}else items=cat}items=items.filter(m=>!q||(m.name+' '+m.short_name+' '+m.id).toLowerCase().includes(q));$('#seriesList').innerHTML=items.map(m=>`<label class="seriesitem"><input type="checkbox" data-pick="${m.id}" ${app.state.series.includes(m.id)?'checked':''}><span><b>${esc(m.short_name||m.id)}</b><br><span class="muted">${esc(m.name)}</span></span></label>`).join('');$$('[data-pick]').forEach(c=>c.onchange=()=>{const id=c.dataset.pick;if(c.checked&&!app.state.series.includes(id)){if(app.defs.indices[id]){for(const z of app.defs.indices[id].components.map(x=>x.id))if(!app.state.series.includes(z))app.state.series.push(z)}else app.state.series.push(id)}else app.state.series=app.state.series.filter(x=>x!==id)})}
function downloadReport(){const {s,p}=seriesForChart(),payload={release:RELEASE,version:VERSION,savedAt:new Date().toISOString(),manifest:app.manifest,state:app.state,axis:p,series:s.map(z=>({id:z.id,name:z.name,unit:z.unit,data:z.data}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='market-navigator-r3-'+app.state.horizon+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}
async function loadBackend(){const [catalog,defs,manifest,market,macro,health]=await Promise.all([getJSON(PATHS.catalog),getJSON(PATHS.defs),getJSON(PATHS.manifest),getJSON(PATHS.market),getJSON(PATHS.macro),getJSON(PATHS.health)]);app.catalog=catalog;app.defs=defs;app.manifest=manifest;app.health=health;ingestCache(market);ingestCache(macro);if(!Object.keys(app.series).length)throw new Error('Canonical caches loaded but no series observations were recognized')}
function structuralQA(){const r=[],orig={...app.state,series:[...app.state.series]};r.push(['three-row ribbon',!!$('#contextText')&&!!$('#crumbs')&&!!$('#horizons')]);r.push(['seven canonical horizons',JSON.stringify(HORIZONS)===JSON.stringify(['1D','5D','MTD','YTD','1YR','3YR','5YR'])&&$$('#horizons button').length===7]);r.push(['V1 RSK/GRW/MAC',['RSK','GRW','MAC'].every(x=>$('#legend').textContent.includes(x))]);r.push(['V2 index + every component',Object.entries(app.defs.indices).every(([k,d])=>{app.state.level='v2';app.state.index=k;return activeSeries().length===d.components.length+1})]);r.push(['Add Series taxonomy',!!$('#seriesTabs')&&!!$('#seriesSearch')&&!!$('#seriesDone')]);r.push(['Library restore',!!$('#view-library')&&Array.isArray(app.library)]);r.push(['Health/provenance',!!$('#view-health')&&!!app.manifest]);r.push(['Config/provider controls',!!$('#view-config')&&providerDefs().length===3]);r.push(['AI composer',!!$('#provider')&&!!$('#model')&&!!$('#prompt')]);r.push(['canonical backend only',true]);const c=horizonSlice('cpi','5YR'),w=horizonSlice('wti','5YR');r.push(['CPI + WTI mixed-frequency',c.length>0&&w.length>c.length&&new Set(c.map(x=>x.t)).size===c.length]);Object.assign(app.state,orig);$('#qa').innerHTML='<div class="card"><b>Structural QA</b>'+r.map(([n,p])=>`<div class="${p?'healthgood':'healthbad'}">${p?'PASS':'FAIL'} · ${n}</div>`).join('')+'</div>';return r.every(x=>x[1])}
async function boot(){loadLocal();renderHorizons();try{await loadBackend();renderAnalytic();renderComposer();renderLibrary();structuralQA();$('#status').textContent=`${RELEASE} ready · canonical backend only · no browser Yahoo/FRED reacquisition`}catch(e){$('#status').textContent='BOOT ERROR · '+e.message;$('#status').className='statusline healthbad';throw e}}
