<!--
Market Navigator 3.9.7
Usage: open market-view.html on GitHub Pages. The app fetches live/historical Yahoo market data, cleans it in a blob WebWorker, persists canonical observations locally, and routes between #home and #detail/<ticker>.
Version: 3.9.7
Verification checklist:
1. Data loads from fetch() and the status reports the market-data connection rather than a stored-data placeholder.
2. #home and #detail/<ticker> navigation work; browser Back returns to the prior view without re-fetching already-loaded series.
3. Worker-cleaned observations contain finite positive numeric values, use dot-decimal JavaScript numbers, and duplicate timestamps/dates are removed.
4. CSV export downloads the cleaned selected-horizon data client-side.
5. Keyboard: ticker rows accept ArrowUp/ArrowDown focus movement and Enter opens detail.
6. Accessibility: focus rings, contrast, semantic table/buttons and readable chart legends/tooltips meet the intended WCAG AA presentation.
7. Responsive: home/detail charts remain within the viewport on mobile and desktop without page scrolling.
8. Charts: every chart shows a legend; hover/touch inspection shows series name, value and timestamp; index charts never show a dollar-sign Y axis.
-->
