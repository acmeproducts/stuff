<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT DB Admin</title><style>body{font:14px system-ui;margin:0;background:#f5f6f8;color:#182230}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:white;border:1px solid #d7dde5;border-radius:10px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #cfd6df;border-radius:8px;background:white;padding:8px 10px;font-weight:700}.primary{background:#344054;color:white}.mono{font:11px ui-monospace,Consolas,monospace;word-break:break-all}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{border:1px solid #e1e5ea;border-radius:8px;padding:9px}.m small{display:block;color:#667085}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:7px;border-bottom:1px solid #edf0f2;text-align:left}.good{color:#137547}.bad{color:#b42318}.warn{color:#8a6500}select{padding:8px;border:1px solid #cfd6df;border-radius:8px;min-width:280px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="card"><div class="row"><h2 style="margin:0">SOT DB Admin</h2><span style="flex:1"></span><span class="mono">2026.08.23.stability-admin-1</span></div><p>Operational controls only: inspect, snapshot, dump, and preflight projects. This page does not change project workflow state.</p></div><div class="card"><div class="row"><button class="btn primary" id="refresh">Refresh DB status</button><button class="btn" id="backup">Backup SQLite</button><button class="btn" id="dump">Dump SQL</button></div><div id="db" style="margin-top:10px">Loading…</div></div><div class="card"><h3>Project source preflight</h3><div class="row"><select id="projects"><option value="">Select project…</option></select><button class="btn primary" id="preflight">Run preflight</button></div><div id="pf" style="margin-top:10px"></div></div><div class="card"><h3>Snapshots / dumps</h3><div id="files">Loading…</div></div></div><script>
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const $=s=>document.querySelector(s);const bytes=n=>{n=Number(n||0);const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i? n.toFixed(n>=100?0:n>=10?1:2):n)+' '+u[i]};
async function api(p,o={}){const r=await fetch(API+p,{cache:'no-store',headers:{'Content-Type':'application/json'},...o});const x=await r.json();if(!r.ok)throw new Error(x.error||r.statusText);return x}
function err(e){alert(e.message||e)}
async function loadDb(){const x=await api('/admin/db/status');$('#db').innerHTML=`<div class="grid"><div class="m"><small>Integrity</small><b class="${x.integrity?.ok?'good':'bad'}">${x.integrity?.result}</b></div><div class="m"><small>DB size</small><b>${bytes(x.size)}</b></div><div class="m"><small>Modified</small><b>${x.modified_at}</b></div></div><p class="mono">${x.database_path}</p><table class="table"><thead><tr><th>Table</th><th>Rows</th></tr></thead><tbody>${Object.entries(x.tables||{}).map(([k,v])=>`<tr><td class="mono">${k}</td><td>${v}</td></tr>`).join('')}</tbody></table>`}
async function loadFiles(){const x=await api('/admin/db/backups');$('#files').innerHTML=`<p class="mono">${x.path}</p><table class="table"><thead><tr><th>File</th><th>Size</th><th>Modified</th></tr></thead><tbody>${(x.files||[]).map(f=>`<tr><td class="mono">${f.name}</td><td>${bytes(f.size)}</td><td>${f.modified_at}</td></tr>`).join('')}</tbody></table>`}
async function loadProjects(){const x=await api('/turn01/projects');$('#projects').innerHTML='<option value="">Select project…</option>'+((x.projects||[]).map(p=>`<option value="${p.project_token}">${p.project_name}</option>`).join(''))}
$('#refresh').onclick=()=>loadDb().catch(err);$('#backup').onclick=async()=>{try{const x=await api('/admin/db/backup',{method:'POST',body:'{}'});alert('Backup created: '+x.path);await loadFiles()}catch(e){err(e)}};$('#dump').onclick=async()=>{try{const x=await api('/admin/db/dump',{method:'POST',body:'{}'});alert('Dump created: '+x.path);await loadFiles()}catch(e){err(e)}};$('#preflight').onclick=async()=>{try{const t=$('#projects').value;if(!t)return;const x=await api('/admin/projects/'+encodeURIComponent(t)+'/preflight');$('#pf').innerHTML=`<p class="${x.ready?'good':'bad'}"><b>${x.ready?'READY':'BLOCKED'}</b> · ${x.blocking_count} blocking · ${x.warning_count} warnings</p><table class="table"><thead><tr><th>Status</th><th>Source</th><th>Detail</th></tr></thead><tbody>${(x.sources||[]).map(s=>`<tr><td class="${s.blocking?'bad':s.warning?'warn':'good'}">${s.status}</td><td class="mono">${s.path}</td><td>${s.warning||''}</td></tr>`).join('')}</tbody></table>`}catch(e){err(e)}};
Promise.all([loadDb(),loadFiles(),loadProjects()]).catch(err);
</script></body></html>
