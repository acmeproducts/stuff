<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOT Database Admin</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111720;--line:#2b3543;--text:#eef3f8;--muted:#8e9aac;--accent:#76b8ff;--good:#63d49a;--bad:#ff7b82;font:15px/1.45 Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(1050px,100%);margin:auto;padding:24px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px}h1{font-size:25px;margin:0}a{color:var(--accent)}.build{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:5px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:10px;background:#192331;color:var(--text);padding:9px 13px;font-weight:700;cursor:pointer}.btn.primary{background:#286fc7;border-color:#4d9af4}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:15px}.card b{display:block;font-size:20px;overflow-wrap:anywhere}.card span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.section{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-top:14px;overflow:hidden}.section-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}.section-head h2{font-size:15px;margin:0}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.table-wrap{overflow:auto}.empty{padding:24px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);border:1px solid var(--line);border-radius:10px;background:#172231;padding:10px 14px;box-shadow:0 18px 60px #0008}.toast.error{border-color:#71343a;background:#30171a}.hidden{display:none}@media(max-width:750px){header{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr 1fr}.buttons{width:100%}.buttons .btn{flex:1}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <header><div><h1>SOT Database Admin</h1><div class="build">2026.08.24.sot-compact-destinations-6</div></div><div class="buttons"><a class="btn" href="sot-turn01-r2-wizard.html">Workflow and destinations</a><button id="refresh" class="btn">Refresh</button><button id="backup" class="btn primary">Backup SQLite</button><button id="dump" class="btn">Dump SQL</button></div></header>
  <div id="summary" class="grid"></div>
  <section class="section"><div class="section-head"><h2>Applied migrations</h2></div><div id="migrations" class="table-wrap"></div></section>
  <section class="section"><div class="section-head"><h2>Table row counts</h2></div><div id="tables" class="table-wrap"></div></section>
  <section class="section"><div class="section-head"><h2>Database snapshots</h2><span id="snapshotPath" class="path"></span></div><div id="snapshots" class="table-wrap"></div></section>
</main>
<div id="toast" class="toast hidden"></div>
<script>
'use strict';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const $=selector=>document.querySelector(selector);let busy=false;
function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
function bytes(value){let n=Number(value||0),i=0,u=['B','KB','MB','GB','TB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?2:0)} ${u[i]}`}
function toast(message,error=false){const node=$('#toast');node.textContent=message;node.className=`toast${error?' error':''}`;clearTimeout(node._timer);node._timer=setTimeout(()=>node.classList.add('hidden'),4000)}
async function api(path,options={}){const response=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||response.statusText);return data}
function setBusy(value){busy=value;document.querySelectorAll('button').forEach(button=>button.disabled=value)}
async function run(fn){if(busy)return;setBusy(true);try{await fn()}catch(error){toast(error.message,true)}finally{setBusy(false)}}
function table(headers,rows){return rows.length?`<table><thead><tr>${headers.map(item=>`<th>${escapeHtml(item)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(item=>`<td>${item}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">None</div>'}
async function load(){const [status,snapshots]=await Promise.all([api('/admin/db/status'),api('/admin/db/backups')]);$('#summary').innerHTML=`<div class="card"><b class="status ${status.integrity.ok?'good':'bad'}">${escapeHtml(status.integrity.result)}</b><span>Integrity</span></div><div class="card"><b>${bytes(status.size)}</b><span>Database size</span></div><div class="card"><b>${escapeHtml(status.journal_mode)}</b><span>Journal mode</span></div><div class="card"><b>${Object.keys(status.tables||{}).length}</b><span>Managed tables</span></div><div class="card" style="grid-column:1/-1"><b class="path">${escapeHtml(status.database_path)}</b><span>Authoritative database</span></div>`;$('#migrations').innerHTML=table(['Version','Migration','SHA-256 checksum','Applied'],(status.migrations||[]).map(row=>[escapeHtml(row.version),escapeHtml(row.name),`<span class="path">${escapeHtml(row.checksum_sha256)}</span>`,escapeHtml(new Date(row.applied_at).toLocaleString())]));$('#tables').innerHTML=table(['Table','Rows'],Object.entries(status.tables||{}).map(([name,count])=>[escapeHtml(name),Number(count).toLocaleString()]));$('#snapshotPath').textContent=snapshots.path||'';$('#snapshots').innerHTML=table(['File','Size','Modified'],(snapshots.files||[]).map(file=>[`<span class="path">${escapeHtml(file.name)}</span>`,bytes(file.size),escapeHtml(new Date(file.modified_at).toLocaleString())]))}
$('#refresh').onclick=()=>run(load);$('#backup').onclick=()=>run(async()=>{const result=await api('/admin/db/backup',{method:'POST',body:'{}'});toast(`Backup created: ${result.path}`);await load()});$('#dump').onclick=()=>run(async()=>{const result=await api('/admin/db/dump',{method:'POST',body:'{}'});toast(`SQL dump created: ${result.path}`);await load()});run(load);
</script>
</body>
</html>
