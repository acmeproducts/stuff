<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Market Navigator 3.9.13 Recovery</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}
iframe{display:block;width:100%;height:100%;border:0;background:#08111f}
</style>
</head>
<body>
<iframe id="app" src="market-view.html?v=3.9.13-recovery" title="Market Navigator 3.9.13 Recovery"></iframe>
<script>
'use strict';
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d)return;
  const style=d.createElement('style');
  style.textContent='.progress{pointer-events:none}.brand small{opacity:.9}';
  d.head.appendChild(style);
  const brand=d.querySelector('.brand small');
  if(brand)brand.textContent='Directional situational awareness · 3.9.13 recovery';
  const hamburger=d.querySelector('.hamb');
  if(hamburger){
    hamburger.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      d.body.classList.toggle('drawer');
    });
  }
  d.querySelectorAll('.nav button,.configBtn').forEach(btn=>{
    btn.addEventListener('click',()=>d.body.classList.remove('drawer'));
  });
});
</script>
</body>
</html>
