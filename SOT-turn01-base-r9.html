<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSOT</title><style>
:root{color-scheme:dark;--bg:#071019;--p:#0d1924;--p2:#112433;--line:#263b4c;--txt:#eef6fb;--mut:#91a6b5;--blue:#3294dc;--green:#39b982;--amber:#d49a38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:9px 14px;background:#09141e;border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:19px}.nav{display:flex;gap:5px}.nav button,.btn{border:1px solid #35536b;background:#14283a;color:var(--txt);border-radius:8px;padding:8px 11px;font-weight:750;cursor:pointer}.nav button.on,.btn.primary{background:var(--blue)}.search{flex:1;background:#0d1b27;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 11px}.page{max-width:1280px;margin:auto;padding:18px}.ey{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800}h1{font-size:26px;margin:3px 0 14px}.estate{display:grid;gap:10px}.estateRow{display:grid;grid-template-columns:180px 1fr 110px;align-items:center;gap:12px}.track{height:18px;background:#152736;border-radius:10px;overflow:hidden;border:1px solid #294356}.fill{height:100%;background:var(--blue)}.fill.good{background:var(--green)}.fill.warn{background:var(--amber)}.num{text-align:right;font-weight:850}.panel{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--p);overflow:hidden}.panelHead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}.panelHead h2{font-size:16px;margin:0}.inside{padding:12px}.activeCard{padding:12px;border:1px solid #31536c;border-radius:10px;background:var(--p2);margin:7px 0}.activeTop,.projectTop{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:#182b39;border-radius:8px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;background:var(--blue)}.mut{color:var(--mut)}.master{display:grid;grid-template-columns:1.3fr .8fr .8fr .8fr 1fr;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #1d3040;cursor:pointer}.master:hover,.master.sel{background:#122536}.master b{font-size:15px}.status{font-weight:800}.status.warn{color:#efb95c}.status.good{color:#73d5a6}.detail{padding:15px;background:#091722}.bars{display:grid;gap:8px;margin:12px 0}.barRow{display:grid;grid-template-columns:150px 1fr 110px;gap:10px;align-items:center}.smallTrack{height:12px;background:#182b39;border-radius:8px;overflow:hidden}.smallTrack i{display:block;height:100%;background:var(--green)}.actions{display:flex;gap:7px;flex-wrap:wrap}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#102131;color:var(--txt);padding:7px 10px;border-radius:7px}.tabs button.on{background:#234663}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #1c3040;vertical-align:top}.table th{color:var(--mut);font-size:11px;text-transform:uppercase}.mono{font-family:ui-monospace,monospace;word-break:break-all}.empty{color:var(--mut);padding:16px}.modal{width:min(1050px,96vw);max-height:90vh;background:#0a1722;color:var(--txt);border:1px solid #3a5870;border-radius:12px;padding:0}.modal::backdrop{background:#000b}.modalHead{position:sticky;top:0;background:#0a1722;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.modalBody{padding:14px;max-height:75vh;overflow:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chip{display:inline-block;padding:3px 7px;border-radius:10px;background:#183148;margin:2px}.liveDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 0 4px #39b98222}@media(max-width:800px){.top{flex-wrap:wrap}.nav{order:3;width:100%;overflow:auto}.search{min-width:180px}.page{padding:10px}.estateRow{grid-template-columns:120px 1fr 82px}.master{grid-template-columns:1.2fr .8fr 1fr}.master .hideMob{display:none}.barRow{grid-template-columns:105px 1fr 80px}.cols{grid-template-columns:1fr}}@media print{.top,.actions{display:none}.page{max-width:none}.modal{position:static;width:auto;max-height:none;border:0}.modalBody{max-height:none}}
</style></head><body><header class="top"><div class="brand">SSOT</div><nav class="nav"><button data-tab="dashboard" class="on">Dashboard</button><button data-tab="database">Database</button><button data-tab="activity">Activity</button><button data-tab="settings">Settings</button></nav><input class="search" id="globalSearch" placeholder="Search projects, fingerprints, paths…"><button class="btn" id="refresh">↻</button></header><main class="page" id="app">Loading SSOT…</main><dialog class="modal" id="deep"><div class="modalHead"><b id="deepTitle">Details</b><div class="actions"><button class="btn" id="print">Print</button><button class="btn" id="json">Download JSON</button><button class="btn" id="close">Close</button></div></div><div class="modalBody" id="deepBody"></div></dialog><script>
const BUILD='SOT-turn01-base-r9-database-master-detail',API='/report/api/sot',$=s=>document.querySelector(s),state={tab:'dashboard',ssot:null,projects:[],activity:[],selected:localStorage.getItem('sot.r9.selected')||'',dbView:'content',db:null,query:'',deep:null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bytes=n=>{n=Number(n||0);if(!n)return'0 B';let u=['B','KB','MB','GB','TB','PB'],i=Math.min(5,Math.floor(Math.log(n)/Math.log(1024)));return`${(n/1024**i).toFixed(i>2?2:1)} ${u[i]}`};const pct=(a,b)=>b?Math.max(0,Math.min(100,Math.round(Number(a||0)/Number(b)*100))):0;
async function api(p,o={}){let r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o}),x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||`HTTP ${r.status}`);return x}function live(p){let s=String(p.processing_state||p.operation?.state||'').toLowerCase();return['wip','queued','running','paused'].includes(s)}function runState(p){let s=String(p.processing_state||p.operation?.state||'');return s==='WIP'?'Scanning':s==='Queued'?'Queued':s==='Paused'?'Paused':s||''}function merge(){let m=new Map(state.projects.map(p=>[p.project_token,p]));state.ssot.projects=state.ssot.projects.map(p=>({...p,processing_state:m.get(p.project_token)?.processing_state,processing_phase:m.get(p.project_token)?.processing_phase,files_discovered:m.get(p.project_token)?.files_discovered,files_processed:m.get(p.project_token)?.files_processed,bytes_discovered:m.get(p.project_token)?.size_bytes,bytes_processed:m.get(p.project_token)?.bytes_processed,current_item:m.get(p.project_token)?.current_item,workers:m.get(p.project_token)?.workers||[]}))}
async function load(render=true){let [s,p,a]=await Promise.all([api('/turn01/ssot'),api('/turn01/projects'),api('/activity?limit=80').catch(()=>({events:[]}))]);state.ssot=s;state.projects=p.projects||p||[];state.activity=a.events||a.activity||a||[];merge();if(render)draw()}
function estateRow(label,value,total,cls=''){return`<div class="estateRow"><b>${label}</b><div class="track"><div class="fill ${cls}" style="width:${pct(value,total)}%"></div></div><div class="num">${bytes(value)}</div></div>`}function activeHTML(p){let fd=Number(p.files_discovered||0),fp=Number(p.files_processed||0),bd=Number(p.bytes_discovered||0),bp=Number(p.bytes_processed||0),pr=fd?pct(fp,fd):(bd?pct(bp,bd):0);return`<div class="activeCard"><div class="activeTop"><div><b><span class="liveDot"></span>${esc(p.project_name)} · ${runState(p)}</b><div class="mut">${esc(p.processing_phase||'working')}${p.current_item?` · ${esc(p.current_item)}`:''}</div></div><div class="actions">${String(p.processing_state).toLowerCase()==='paused'?`<button class="btn" onclick="resume('${p.project_token}')">Resume</button>`:`<button class="btn" onclick="pause('${p.project_token}')">Pause</button>`}<button class="btn" onclick="stop('${p.project_token}')">Stop</button></div></div><div class="progress"><i style="width:${pr}%"></i></div><b>${pr}%</b> · ${fp.toLocaleString()} / ${fd.toLocaleString()} files · ${bytes(bp)} / ${bytes(bd)} processed</div>`}
function condition(p){if(live(p))return[runState(p),'warn'];if(p.condition==='protected')return['Protected','good'];if(p.condition==='needs_copy')return['Needs protection','warn'];if(p.condition==='needs_sources')return['Needs sources','warn'];return['Needs scan','warn']}function masterHTML(p){let [s,c]=condition(p),total=Number(p.logical_bytes||0),safe=Number(p.protected_bytes||0);return`<div class="master ${state.selected===p.project_token?'sel':''}" onclick="selectP('${p.project_token}')"><div><b>${esc(p.project_name)}</b><div class="mut">${Number(p.unique_content||0).toLocaleString()} fingerprints</div></div><div>${bytes(total)}</div><div class="hideMob">${bytes(p.shared_bytes)} shared</div><div class="hideMob">${bytes(safe)} safe</div><div><span class="status ${c}">${s}</span>${live(p)?`<div class="progress"><i style="width:${pct(p.files_processed,p.files_discovered)}%"></i></div>`:''}</div></div>`}
function detailHTML(p){let total=Number(p.logical_bytes||0),a=Math.max(0,total-Number(p.missing_copy_a_bytes||0)),b=Math.max(0,total-Number(p.missing_copy_b_bytes||0));let [s]=condition(p);return`<div class="detail"><div class="projectTop"><div><div class="ey">Selected project</div><h1>${esc(p.project_name)}</h1><b>${s}</b> · ${bytes(p.project_only_bytes)} unique here · ${bytes(p.shared_bytes)} shared</div><div class="actions">${!live(p)&&p.condition==='needs_scan'?`<button class="btn primary" onclick="scan('${p.project_token}')">Scan now</button>`:''}<button class="btn" onclick="deep('${p.project_token}')">Details</button></div></div><div class="bars">${smallBar('Source content',total,total)}${smallBar('Verified copy A',a,total)}${smallBar('Verified copy B',b,total)}${smallBar('Fully protected',p.protected_bytes,total)}</div>${live(p)?activeHTML(p):''}</div>`}function smallBar(l,v,t){return`<div class="barRow"><b>${l}</b><div class="smallTrack"><i style="width:${pct(v,t)}%"></i></div><div class="num">${bytes(v)}</div></div>`}
function dashboard(){let s=state.ssot,g=s.global,total=Number(g.unique_bytes||0),a=Math.max(0,total-Number(g.missing_copy_a_bytes||0)),b=Math.max(0,total-Number(g.missing_copy_b_bytes||0)),active=s.projects.filter(live),q=state.query.toLowerCase(),ps=s.projects.filter(p=>!q||p.project_name.toLowerCase().includes(q));if(!state.selected&&ps[0])state.selected=ps[0].project_token;let sel=s.projects.find(p=>p.project_token===state.selected);return`<div class="ey">Single source of truth</div><h1>Storage dashboard</h1><section class="panel"><div class="panelHead"><h2>Storage estate</h2><span class="mut">${Number(g.unique_content||0).toLocaleString()} unique fingerprints · ${bytes(g.shared_bytes)} shared across projects</span></div><div class="inside estate">${estateRow('Unique content',total,total)}${estateRow('Verified copy A',a,total,'good')}${estateRow('Verified copy B',b,total,'good')}${estateRow('Fully protected',g.protected_bytes,total,'good')}${estateRow('Needs protection',Math.max(g.missing_copy_a_bytes||0,g.missing_copy_b_bytes||0),total,'warn')}</div></section><section class="panel"><div class="panelHead"><h2>Active now</h2><b>${active.length} operation${active.length===1?'':'s'}</b></div><div class="inside">${active.length?active.map(activeHTML).join(''):'<div class="empty">No storage work is running.</div>'}</div></section><section class="panel"><div class="panelHead"><h2>Projects</h2><span class="mut">Master list · select a row for detail</span></div><div class="master"><b>Project</b><b>Content</b><b class="hideMob">Shared</b><b class="hideMob">Safe</b><b>Status</b></div>${ps.map(masterHTML).join('')}${sel?detailHTML(sel):''}</section>`}
function database(){return`<div class="ey">SSOT database</div><h1>Database</h1><div class="tabs">${['content','locations','projects','operations'].map(v=>`<button class="${state.dbView===v?'on':''}" onclick="db('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><section class="panel"><div class="inside" id="dbbody">${state.db?dbTable(state.db):'<div class="empty">Loading database…</div>'}</div></section>`}function dbTable(x){let rows=x.rows||[];if(!rows.length)return'<div class="empty">No matching database records.</div>';let keys=Object.keys(rows[0]).slice(0,7);return`<table class="table"><thead><tr>${keys.map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td class="${k.includes('sha')?'mono':''}">${esc(r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function activity(){let rows=state.activity||[];return`<div class="ey">Durable work history</div><h1>Activity</h1><section class="panel"><div class="inside">${rows.length?`<table class="table"><thead><tr><th>Time</th><th>Project</th><th>Event</th><th>Detail</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.created_at||e.updated_at||'')}</td><td>${esc(e.project_token||'')}</td><td>${esc(e.event_type||e.kind||e.state||'')}</td><td class="mono">${esc(e.detail_json||e.detail||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No activity records.</div>'}</div></section>`}function settings(){return`<div class="ey">SSOT configuration</div><h1>Settings</h1><section class="panel"><div class="inside"><b>Storage policy and volume roles</b><p class="mut">The dashboard treats projects as database membership views. Storage destinations are SSOT-level policy. Existing backend configuration remains available while volume-role management is consolidated.</p></div></section>`}function draw(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab));$('#app').innerHTML=state.tab==='dashboard'?dashboard():state.tab==='database'?database():state.tab==='activity'?activity():settings();if(state.tab==='database'&&!state.db)loadDB()}
async function loadDB(){try{state.db=await api(`/turn01/catalog?view=${state.dbView}&q=${encodeURIComponent(state.query)}&limit=250`);if(state.tab==='database')draw()}catch(e){$('#dbbody').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function selectP(t){state.selected=t;localStorage.setItem('sot.r9.selected',t);draw()}async function db(v){state.dbView=v;state.db=null;draw()}async function scan(t){await api(`/projects/${encodeURIComponent(t)}/fingerprint/start`,{method:'POST',body:'{}'});await load()}async function pause(t){await api(`/projects/${encodeURIComponent(t)}/fingerprint/pause`,{method:'POST',body:'{}'});await load()}async function resume(t){await api(`/projects/${encodeURIComponent(t)}/fingerprint/resume`,{method:'POST',body:'{}'});await load()}async function stop(t){await api(`/projects/${encodeURIComponent(t)}/fingerprint/stop`,{method:'POST',body:'{}'});await load()}
async function deep(t){let p=state.ssot.projects.find(x=>x.project_token===t),[d,sources,act,cat]=await Promise.all([api(`/turn01/projects/${encodeURIComponent(t)}`),api(`/turn01/projects/${encodeURIComponent(t)}/sources`),api(`/activity?project_token=${encodeURIComponent(t)}&limit=100`).catch(()=>({events:[]})),api(`/turn01/catalog?view=content&project_token=${encodeURIComponent(t)}&limit=500`).catch(()=>({rows:[]}))]);state.deep={project:p,detail:d,sources:sources.sources||sources||[],activity:act.events||act.activity||act||[],content:cat.rows||[]};$('#deepTitle').textContent=`${p.project_name} · deep dive`;$('#deepBody').innerHTML=`<div class="cols"><section><h2>Project membership</h2>${state.deep.sources.map(s=>`<div class="chip">${esc(s.normalized_path||s.path)}</div>`).join('')||'<div class="mut">No sources</div>'}</section><section><h2>Coverage</h2>${smallBar('Content',p.logical_bytes,p.logical_bytes)}${smallBar('Copy A',Math.max(0,p.logical_bytes-p.missing_copy_a_bytes),p.logical_bytes)}${smallBar('Copy B',Math.max(0,p.logical_bytes-p.missing_copy_b_bytes),p.logical_bytes)}</section></div><h2>Content fingerprints</h2>${dbTable({rows:state.deep.content})}<h2>Operation / evidence detail</h2><pre class="mono">${esc(JSON.stringify({detail:d,activity:state.deep.activity},null,2))}</pre>`;$('#deep').showModal()}function downloadJSON(){if(!state.deep)return;let b=new Blob([JSON.stringify(state.deep,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`ssot-${state.deep.project.project_name.replace(/[^a-z0-9]+/gi,'-')}.json`;a.click();URL.revokeObjectURL(a.href)}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.db=null;draw()});$('#globalSearch').oninput=e=>{state.query=e.target.value;if(state.tab==='database'){state.db=null;draw()}else draw()};$('#refresh').onclick=()=>load();$('#close').onclick=()=>$('#deep').close();$('#print').onclick=()=>window.print();$('#json').onclick=downloadJSON;load();setInterval(()=>load(false).then(()=>{if(state.tab==='dashboard')draw()}),3000);
</script></body></html>
