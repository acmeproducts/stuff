<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Look</title>
<style>
:root{
  --bg:#e8edf2; --ring-hi:#f7f9fa; --ring-lo:#c3c8ce; --ring-face:#dde1e6;
  --engrave:#7e858c; --engrave-soft:#9aa1a8; --ped-hi:#d7dbe0; --ped-lo:#b8bdc3;
  --led:#ffffff; --led-off:rgba(120,130,140,.16); --ball-a:#8f959c; --ball-b:#fbfcfd;
  --shadow:rgba(35,45,58,.20); --panel:#f4f6f8; --panel-txt:#3a4048; --accent:#5a6472;
  --sun:#f2ede2; --moon:#4a515a;
}
[data-theme="midnight"]{
  --bg:#101318; --ring-hi:#343a41; --ring-lo:#181c21; --ring-face:#262b31;
  --engrave:#8b929a; --engrave-soft:#5c636b; --ped-hi:#2b3037; --ped-lo:#15181d;
  --led:#eef2f6; --led-off:rgba(238,242,246,.07); --ball-a:#565d65; --ball-b:#e8ecf0;
  --shadow:rgba(0,0,0,.55); --panel:#1a1e24; --panel-txt:#d7dce2; --accent:#9fb2c8;
  --sun:#e9e2d0; --moon:#0d1014;
}
[data-theme="amber"]{
  --bg:#12100c; --ring-hi:#3a352c; --ring-lo:#1a1712; --ring-face:#2a261f;
  --engrave:#9c8f76; --engrave-soft:#5f5744; --ped-hi:#2e2a22; --ped-lo:#171410;
  --led:#ffb454; --led-off:rgba(255,180,84,.08); --ball-a:#6b6250; --ball-b:#ffcf8a;
  --shadow:rgba(0,0,0,.6); --panel:#1c1913; --panel-txt:#e6d9c2; --accent:#ffb454;
  --sun:#ffd9a0; --moon:#0e0c08;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;transition:background .4s;display:flex;align-items:center;justify-content:center}
#stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
svg#scene{width:min(100vw,60vh);height:auto;max-height:96vh;display:block;touch-action:none}
text{user-select:none}
.eng{fill:var(--engrave);font-weight:600;letter-spacing:.06em}
.eng-soft{fill:var(--engrave-soft);font-weight:500}
body.flash::before{content:"";position:fixed;inset:0;background:var(--led);opacity:.14;
  z-index:5;pointer-events:none;animation:ff 1.1s ease-out forwards}
@keyframes ff{to{opacity:0}}
/* corner buttons */
.cbtn{position:fixed;width:44px;height:44px;border:none;border-radius:50%;
  background:var(--panel);color:var(--panel-txt);font-size:19px;
  box-shadow:0 2px 10px var(--shadow);z-index:30;cursor:pointer}
#gear{top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
#tmr{top:calc(env(safe-area-inset-top,0px) + 14px);left:16px}
/* panel */
#cfg{position:fixed;top:0;right:0;height:100%;width:min(330px,90vw);background:var(--panel);
  color:var(--panel-txt);z-index:40;padding:22px 18px calc(env(safe-area-inset-bottom,0px)+26px);
  transform:translateX(105%);transition:transform .28s ease;box-shadow:-6px 0 30px var(--shadow);
  overflow-y:auto;font-size:15px;-webkit-overflow-scrolling:touch}
#cfg.open{transform:translateX(0)}
#cfg h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin:0 0 16px}
.grp{margin-bottom:20px}
.grp.hid{display:none}
.grp>label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 30%;min-height:38px;padding:7px 8px;border:1px solid color-mix(in srgb,var(--panel-txt) 18%,transparent);
  background:transparent;color:var(--panel-txt);border-radius:9px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:10px}
.row span{font-size:14px}
.sw{position:relative;flex:0 0 50px;width:50px;height:28px;border-radius:14px;border:none;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 22%,transparent);transition:background .2s}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on::after{left:25px}
.srow{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;min-height:36px}
.srow.c3{grid-template-columns:74px 1fr 46px}
.srow .sl{font-size:12px;opacity:.65}
.srow output{font-size:11px;opacity:.6;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.crow{display:grid;grid-template-columns:1fr 44px 30px;gap:8px;align-items:center;min-height:40px}
.crow span{font-size:13px;opacity:.8}
input[type=color]{width:44px;height:30px;border:1px solid color-mix(in srgb,var(--panel-txt) 25%,transparent);
  border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.xbtn{width:28px;height:28px;border:none;border-radius:7px;font-size:13px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.ghost{width:100%;min-height:38px;border:1px dashed color-mix(in srgb,var(--panel-txt) 30%,transparent);
  background:transparent;color:var(--panel-txt);border-radius:9px;font-size:13px;cursor:pointer;margin-top:6px}
.solid{width:100%;min-height:42px;border:none;border-radius:10px;font-size:15px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.bhdr{font-size:11px;font-weight:700;letter-spacing:.15em;opacity:.6;margin:12px 0 4px}
select,input[type=number]{min-height:38px;border:1px solid color-mix(in srgb,var(--panel-txt) 22%,transparent);
  background:transparent;color:var(--panel-txt);border-radius:9px;padding:4px 8px;font-size:14px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
/* timer dialog */
dialog{border:none;border-radius:18px;background:var(--panel);color:var(--panel-txt);
  padding:20px;width:min(330px,92vw);box-shadow:0 12px 50px var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.4)}
#tsvg{width:210px;height:210px;display:block;margin:6px auto}
.tnum{display:flex;gap:8px;justify-content:center;margin:10px 0}
.tnum input{width:74px;text-align:center;font-size:17px}
.tbtns{display:flex;gap:8px;margin-top:12px}
.tbtns button{flex:1;min-height:44px;border:none;border-radius:10px;font-size:15px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.tbtns button.primary{background:var(--accent);color:var(--panel);font-weight:600}
.tbtns button:disabled{opacity:.4}
.drop{transition:transform .55s cubic-bezier(.25,.9,.3,1.05)}
.fall{transition:transform .9s cubic-bezier(.2,.7,.3,1)}
@media (prefers-reduced-motion:reduce){.drop,.fall{transition:none}}
/* ===== engine shell ===== */
#engines{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:50;display:flex;gap:4px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(8px);
  border-radius:22px;padding:4px;box-shadow:0 3px 14px var(--shadow)}
#engines button{min-height:36px;padding:6px 16px;border:none;border-radius:18px;
  background:transparent;color:var(--panel-txt);font-size:13px;font-weight:600;
  letter-spacing:.06em;cursor:pointer}
#engines button.on{background:var(--accent);color:var(--panel)}
.engframe{position:fixed;inset:0;width:100%;height:100%;border:none;z-index:1;
  background:var(--bg);display:none}
.engframe.on{display:block}
body[data-engine="flow"] #stage,body[data-engine="mosaic"] #stage,
body[data-engine="flow"] .cbtn,body[data-engine="mosaic"] .cbtn{display:none}
</style>
</head>
<body data-theme="studio" data-engine="look">
<div id="stage"><svg id="scene" viewBox="0 0 420 560" xmlns="http://www.w3.org/2000/svg"></svg></div>
<iframe id="frFlow" class="engframe" title="Time Flow — full time.html"></iframe>
<iframe id="frMosaic" class="engframe" title="Clock Mosaic — full clock.html"></iframe>
<nav id="engines" aria-label="Engine">
  <button data-eng="look" class="on">Look</button>
  <button data-eng="flow">Flow</button>
  <button data-eng="mosaic">Mosaic</button>
</nav>
<button id="gear" class="cbtn" aria-label="Settings">⚙</button>
<button id="tmr" class="cbtn" aria-label="Timer">⏱</button>
<div id="scrim"></div>

<aside id="cfg">
  <h2>Look · Settings</h2>
  <div class="grp"><label>Mode</label><div class="seg" id="segMode"></div></div>
  <div class="grp"><label>Theme</label><div class="seg" id="segTheme"></div></div>
  <div class="grp"><label>Readout</label>
    <div class="row"><span>24-hour</span><button class="sw" id="sw24"></button></div>
    <div class="row" id="rowSec"><span>Seconds</span><button class="sw" id="swSec"></button></div>
    <div class="row" id="rowDate"><span>Date</span><button class="sw" id="swDate"></button></div>
  </div>
  <div class="grp"><label>Size</label>
    <div class="srow"><input type="range" id="rgScale" min="60" max="130" step="5"><output id="rgScaleO"></output></div>
  </div>
  <div class="grp" id="grpColors"><label>Colors</label><div id="colorRows"></div>
    <button class="ghost" id="colReset">Reset colors to theme</button></div>

  <div class="grp hid" id="grpMosaic"><label>Mosaic</label>
    <div class="row"><span>Effect</span><select id="mfx">
      <option value="none">None</option><option value="breathe">Breathe</option>
      <option value="wave">Wave</option><option value="scan">Scan</option>
      <option value="sparkle">Sparkle</option><option value="ripple">Ripple</option>
      <option value="rain">Rain</option><option value="spiral">Spiral</option>
    </select></div>
    <div class="row"><span>Orientation</span><select id="mor">
      <option value="h">Horizontal</option><option value="v">Vertical</option></select></div>
    <div class="srow c3"><span class="sl">Dot size</span><input type="range" id="mdot" min="50" max="160" step="5"><output id="mdotO"></output></div>
  </div>

  <div class="grp hid" id="grpBuckets"><label>Buckets — drag them on screen</label>
    <div id="bucketCtl"></div>
    <button class="ghost" id="bPosReset">Reset positions</button>
    <button class="ghost" id="bReset">Reset sizes &amp; grids</button>
  </div>

  <div class="grp"><label>Sound &amp; signals</label>
    <div class="row"><span>Hourly chime</span><button class="sw" id="swChime"></button></div>
    <div class="row"><span>Hourly flash</span><button class="sw" id="swFlash"></button></div>
    <div class="srow c3"><span class="sl">Volume</span><input type="range" id="rgVol" min="0" max="100" step="5"><output id="rgVolO"></output></div>
    <button class="ghost" id="testChime">Test chime</button>
  </div>
  <button class="solid" id="closeCfg">Done</button>
  <p style="margin-top:16px;font-size:11px;opacity:.4;letter-spacing:.05em">look v3.0 · acmeproducts</p>
</aside>

<dialog id="tdlg">
  <h2 style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.6">Timer</h2>
  <div class="row" style="margin-top:8px"><span>Mode</span><select id="tmode">
    <option value="countdown">Countdown</option><option value="countup">Count up</option></select></div>
  <div class="tnum">
    <input type="number" id="tH" min="0" max="99" value="0" inputmode="numeric" aria-label="Hours">
    <input type="number" id="tM" min="0" max="59" value="5" inputmode="numeric" aria-label="Minutes">
    <input type="number" id="tS" min="0" max="59" value="0" inputmode="numeric" aria-label="Seconds">
  </div>
  <svg id="tsvg" viewBox="0 0 210 210" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="tbtns">
    <button id="tStart" class="primary">Start</button>
    <button id="tPause" disabled>Pause</button>
    <button id="tReset">Reset</button>
    <button id="tClose">Close</button>
  </div>
</dialog>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("scene");
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)");

/* ================= config ================= */
const DEF={
  mode:"orbit",theme:"studio",h24:false,sec:false,date:true,scale:100,
  colors:{},                       /* key -> hex override */
  chime:false,flash:false,vol:50,
  mosaic:{fx:"breathe",orient:"h",dot:100},
  buckets:{
    pos:{s:{x:.5,y:.16},m:{x:.5,y:.47},h:{x:.5,y:.76}},
    s:{w:100,h:100,cols:12,dot:100},
    m:{w:100,h:100,cols:12,dot:100},
    h:{w:100,h:100,cols:12,dot:100}
  },
  timer:{mode:"countdown",h:0,m:5,s:0}
};
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])){t[k]=t[k]&&typeof t[k]==="object"?t[k]:{};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}
let cfg=structuredClone(DEF);
try{deepMerge(cfg,JSON.parse(localStorage.getItem("look2-config")||"{}"))}catch(e){}
function saveCfg(){try{localStorage.setItem("look2-config",JSON.stringify(cfg))}catch(e){}}

/* color registry: key -> [label, css default var] */
const COLOR_DEFS={
  common:[["led","Digits / LED","--led"],["engrave","Engraving","--engrave"],["bg","Background","--bg"]],
  orbit:[["ballH","Hour bearing","--ball-a"],["ballM","Minute bearing","--ball-b"]],
  eclipse:[["sun","Sun","--sun"],["moon","Shade","--moon"]],
  rainfall:[["arc","Seconds arc","--led"]],
  orrery:[["pH","Hour planet","--ball-a"],["pM","Minute planet","--ball-b"],["pS","Second planet","--led"]],
  buckets:[["bS","Seconds fill","--led"],["bM","Minutes fill","--led"],["bH","Hours fill","--led"]],
  mosaic:[]
};
function themeVal(v){return getComputedStyle(document.body).getPropertyValue(v).trim()}
function C(key,defVar){return cfg.colors[key]||`var(${defVar})`}
function CDef(key){for(const arr of Object.values(COLOR_DEFS)){const f=arr.find(a=>a[0]===key);if(f)return f[2]}return"--led"}

const MODES=[["orbit","Orbit"],["eclipse","Eclipse"],["rainfall","Rainfall"],
             ["orrery","Orrery"],["buckets","Buckets"],["mosaic","Matrix"]];
const THEMES=[["studio","Studio"],["midnight","Midnight"],["amber","Amber"]];
const RELEVANT={
  orbit:{sec:true,date:true},eclipse:{sec:true,date:true},rainfall:{sec:true,date:true},
  orrery:{sec:false,date:false},buckets:{sec:false,date:true},mosaic:{sec:true,date:true}
};

/* ================= panel build ================= */
function buildSeg(el2,items,cur,fn){
  el2.innerHTML="";
  items.forEach(([v,label])=>{
    const b=document.createElement("button");b.textContent=label;
    if(v===cur)b.classList.add("on");
    b.onclick=()=>{fn(v);buildSeg(el2,items,v,fn)};
    el2.appendChild(b);
  });
}
function buildSw(el2,get,set){
  el2.classList.toggle("on",get());
  el2.onclick=()=>{set(!get());el2.classList.toggle("on",get());saveCfg();hardRedraw()};
}
function buildColors(){
  const host=$("colorRows");host.innerHTML="";
  [...COLOR_DEFS.common,...(COLOR_DEFS[cfg.mode]||[])].forEach(([key,label,dv])=>{
    const row=document.createElement("div");row.className="crow";
    const sp=document.createElement("span");sp.textContent=label;
    const inp=document.createElement("input");inp.type="color";
    inp.value=cfg.colors[key]||themeVal(dv)||"#ffffff";
    inp.oninput=()=>{cfg.colors[key]=inp.value;saveCfg();hardRedraw()};
    const x=document.createElement("button");x.className="xbtn";x.textContent="↺";
    x.setAttribute("aria-label","Reset "+label);
    x.onclick=()=>{delete cfg.colors[key];inp.value=themeVal(dv)||"#ffffff";saveCfg();hardRedraw()};
    row.append(sp,inp,x);host.appendChild(row);
  });
}
function buildBucketCtl(){
  const host=$("bucketCtl");host.innerHTML="";
  [["s","SECONDS",60],["m","MINUTES",60],["h","HOURS",24]].forEach(([k,label,total])=>{
    const hdr=document.createElement("div");hdr.className="bhdr";hdr.textContent=label;
    host.appendChild(hdr);
    const mk=(sl,prop,min,max,step,fmtV)=>{
      const row=document.createElement("div");row.className="srow c3";
      const s1=document.createElement("span");s1.className="sl";s1.textContent=sl;
      const r=document.createElement("input");r.type="range";r.min=min;r.max=max;r.step=step;
      r.value=cfg.buckets[k][prop];
      const o=document.createElement("output");o.textContent=fmtV(cfg.buckets[k][prop]);
      r.oninput=()=>{cfg.buckets[k][prop]=+r.value;o.textContent=fmtV(+r.value);saveCfg();hardRedraw();
        if(prop==="cols")syncRowOuts()};
      row.append(s1,r,o);host.appendChild(row);
      return{r,o};
    };
    mk("Width","w",50,170,5,v=>v+"%");
    mk("Height","h",50,170,5,v=>v+"%");
    const c=mk("Columns","cols",4,20,1,v=>v+" × "+Math.ceil(total/v));
    mk("Dot size","dot",50,170,5,v=>v+"%");
    c.total=total;
  });
  function syncRowOuts(){}
}
function syncPanel(){
  const r=RELEVANT[cfg.mode];
  $("rowSec").style.display=r.sec?"":"none";
  $("rowDate").style.display=r.date?"":"none";
  $("grpBuckets").classList.toggle("hid",cfg.mode!=="buckets");
  $("grpMosaic").classList.toggle("hid",cfg.mode!=="mosaic");
  buildColors();
}
function applyTheme(){document.body.dataset.theme=cfg.theme;buildColors()}

buildSeg($("segMode"),MODES,cfg.mode,v=>{cfg.mode=v;saveCfg();syncPanel();hardRedraw()});
buildSeg($("segTheme"),THEMES,cfg.theme,v=>{cfg.theme=v;saveCfg();applyTheme();hardRedraw()});
buildSw($("sw24"),()=>cfg.h24,v=>cfg.h24=v);
buildSw($("swSec"),()=>cfg.sec,v=>cfg.sec=v);
buildSw($("swDate"),()=>cfg.date,v=>cfg.date=v);
buildSw($("swChime"),()=>cfg.chime,v=>cfg.chime=v);
buildSw($("swFlash"),()=>cfg.flash,v=>cfg.flash=v);
$("rgScale").value=cfg.scale;$("rgScaleO").textContent=cfg.scale+"%";
$("rgScale").oninput=e=>{cfg.scale=+e.target.value;$("rgScaleO").textContent=cfg.scale+"%";saveCfg();hardRedraw()};
$("rgVol").value=cfg.vol;$("rgVolO").textContent=cfg.vol+"%";
$("rgVol").oninput=e=>{cfg.vol=+e.target.value;$("rgVolO").textContent=cfg.vol+"%";saveCfg()};
$("colReset").onclick=()=>{cfg.colors={};saveCfg();buildColors();hardRedraw()};
$("mfx").value=cfg.mosaic.fx;$("mfx").onchange=e=>{cfg.mosaic.fx=e.target.value;saveCfg();hardRedraw()};
$("mor").value=cfg.mosaic.orient;$("mor").onchange=e=>{cfg.mosaic.orient=e.target.value;saveCfg();hardRedraw()};
$("mdot").value=cfg.mosaic.dot;$("mdotO").textContent=cfg.mosaic.dot+"%";
$("mdot").oninput=e=>{cfg.mosaic.dot=+e.target.value;$("mdotO").textContent=cfg.mosaic.dot+"%";saveCfg();hardRedraw()};
$("bPosReset").onclick=()=>{cfg.buckets.pos=structuredClone(DEF.buckets.pos);saveCfg();hardRedraw()};
$("bReset").onclick=()=>{for(const k of["s","m","h"])cfg.buckets[k]=structuredClone(DEF.buckets[k]);
  saveCfg();buildBucketCtl();hardRedraw()};
$("testChime").onclick=()=>chime();
applyTheme();syncPanel();buildBucketCtl();

$("gear").onclick=()=>{$("cfg").classList.add("open");$("scrim").classList.add("open")};
const closeCfg=()=>{$("cfg").classList.remove("open");$("scrim").classList.remove("open")};
$("closeCfg").onclick=closeCfg;$("scrim").onclick=closeCfg;

/* ================= svg helpers ================= */
let root=svg; /* current draw target */
function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs)n.setAttribute(k,attrs[k]);
  (parent||root).appendChild(n);return n;
}
function txt(x,y,s,size,cls,parent,rot){
  const t=el("text",{x,y,"font-size":size,"text-anchor":"middle","dominant-baseline":"middle",
    class:cls||"eng",...(rot!=null?{transform:`rotate(${rot} ${x} ${y})`}:{})},parent);
  t.textContent=s;return t;
}
function pt(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arcPath(cx,cy,r,a0,a1){
  const[x0,y0]=pt(cx,cy,r,a0),[x1,y1]=pt(cx,cy,r,a1);
  const large=((a1-a0)%360+360)%360>180?1:0;
  return`M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
}
function defs(){
  const d=el("defs",{},svg);
  const g1=el("linearGradient",{id:"ringG",x1:"0",y1:"0",x2:"0",y2:"1"},d);
  el("stop",{offset:"0","stop-color":"var(--ring-hi)"},g1);
  el("stop",{offset:"1","stop-color":"var(--ring-lo)"},g1);
  const g2=el("linearGradient",{id:"pedG",x1:"0",y1:"0",x2:"0",y2:"1"},d);
  el("stop",{offset:"0","stop-color":"var(--ped-hi)"},g2);
  el("stop",{offset:"1","stop-color":"var(--ped-lo)"},g2);

/* ================= 5x7 dot font ================= */
const FONT={
"0":["01110","10001","10011","10101","11001","10001","01110"],
"1":["00100","01100","00100","00100","00100","00100","01110"],
"2":["01110","10001","00001","00010","00100","01000","11111"],
"3":["11111","00010","00100","00010","00001","10001","01110"],
"4":["00010","00110","01010","10010","11111","00010","00010"],
"5":["11111","10000","11110","00001","00001","10001","01110"],
"6":["00110","01000","10000","11110","10001","10001","01110"],
"7":["11111","00001","00010","00100","01000","01000","01000"],
"8":["01110","10001","10001","01110","10001","10001","01110"],
"9":["01110","10001","10001","01111","00001","00010","01100"],
":":["000","000","010","000","010","000","000"],
" ":["000","000","000","000","000","000","000"]};
function matrixCells(str){
  let col=0;const cells=[];
  for(const ch of str){
    const gl=FONT[ch]||FONT[" "];const w=gl[0].length;
    for(let r=0;r<7;r++)for(let c=0;c<w;c++)
      cells.push({col:col+c,row:r,on:gl[r][c]==="1"});
    col+=w+1;
  }
  return{cells,cols:col-1};
}
function drawMatrix(parent,cx,cy,str,pitch,rad,withOff,fill){
  const{cells,cols}=matrixCells(str);
  const x0=cx-(cols-1)*pitch/2, y0=cy-3*pitch;
  cells.forEach(c=>{
    if(!c.on&&!withOff)return;
    el("circle",{cx:x0+c.col*pitch,cy:y0+c.row*pitch,r:rad,
      fill:c.on?(fill||C("led","--led")):"var(--led-off)"},parent);
  });
}

/* ============ BUCKETS (time.html qualities, no connectors) ============ */
const REGION={x:24,y:34,w:372,h:436};
let bucketHits={};   /* k -> plate box for drag */
function bucketGeom(k,total){
  const b=cfg.buckets[k],cols=b.cols,rows=Math.ceil(total/cols);
  const w=Math.min(REGION.w,300*b.w/100);
  const h=Math.min(REGION.h*.5,(rows*17+26)*b.h/100);
  const p=cfg.buckets.pos[k];
  const x=Math.max(REGION.x,Math.min(REGION.x+REGION.w-w,REGION.x+p.x*REGION.w-w/2));
  const y=Math.max(REGION.y,Math.min(REGION.y+REGION.h-h,REGION.y+p.y*REGION.h-h/2));
  return{x,y,w,h,cols,rows};
}
function bucketPlate(k,label,total,count,fill,animateNow){
  const g0=bucketGeom(k,total);
  const{x,y,w,h,cols,rows}=g0;
  const grp=el("g",{"data-bucket":k});
  el("rect",{x,y,width:w,height:h,rx:10,fill:"url(#pedG)"},grp);
  el("rect",{x,y,width:w,height:h,rx:10,fill:"none",stroke:"var(--ring-hi)","stroke-opacity":".45"},grp);
  const t=txt(x+12,y+13,label,8,"eng-soft",grp);
  t.setAttribute("text-anchor","start");t.setAttribute("letter-spacing",".28em");
  const c2=txt(x+w-12,y+13,fmt(count),9,"eng",grp);c2.setAttribute("text-anchor","end");
  const padX=13,top=22,padB=9;
  const cw=(w-padX*2)/cols,ch=(h-top-padB)/rows;
  const r=Math.min(cw,ch)*.30*cfg.buckets[k].dot/100;
  for(let i=0;i<total;i++){
    const dx=x+padX+(i%cols+.5)*cw, dy=y+top+(Math.floor(i/cols)+.5)*ch;
    const on=i<count, now=i===count&&count<total;
    const dot=el("circle",{cx:dx,cy:dy,r:now?r*1.12:Math.max(1.2,r),
      fill:(on||now)?fill:"var(--led-off)"},grp);
    if(now){
      dot.setAttribute("stroke","var(--ring-hi)");dot.setAttribute("stroke-width","1");
      if(animateNow&&!reduced.matches){       /* the falling drop — seconds only */
        dot.classList.add("drop");
        dot.style.transform=`translateY(${(y-4)-dy}px)`;
        requestAnimationFrame(()=>requestAnimationFrame(()=>{dot.style.transform="translateY(0)"}));
      }
    }
  }
  /* invisible drag surface on top */
  el("rect",{x,y,width:w,height:h,rx:10,fill:"transparent","data-drag":k,style:"cursor:grab;touch-action:none"},grp);
  bucketHits[k]={x,y,w,h};
}

  bucketHits={};

  bucketPlate("m","MINUTES",60,d.getMinutes(),C("bM","--led"),false);

/* drag & drop */
let bdrag=null;
function svgPoint(e){
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return{x:p.x,y:p.y};
}
svg.addEventListener("pointerdown",e=>{
  if(cfg.mode!=="buckets")return;
  const k=e.target.getAttribute&&e.target.getAttribute("data-drag");
  if(!k)return;
  const p=svgPoint(e);
  bdrag={k,id:e.pointerId,off:{x:p.x-(bucketHits[k].x+bucketHits[k].w/2),
                              y:p.y-(bucketHits[k].y+bucketHits[k].h/2)}};
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove",e=>{
  if(!bdrag||bdrag.id!==e.pointerId)return;
  const p=svgPoint(e);
  cfg.buckets.pos[bdrag.k]={
    x:Math.max(0,Math.min(1,(p.x-bdrag.off.x-REGION.x)/REGION.w)),
    y:Math.max(0,Math.min(1,(p.y-bdrag.off.y-REGION.y)/REGION.h))};
  render("soft");
});
function endB(e){if(bdrag&&bdrag.id===e.pointerId){bdrag=null;saveCfg()}}
svg.addEventListener("pointerup",endB);svg.addEventListener("pointercancel",endB);

/* ============ MOSAIC (from clock.html) ============ */
let mosaicDots=null,mosaicKey="";
function buildMosaic(d){
  const str=timeStr(d);
  const grp=el("g",{id:"mosaicG"});
  mosaicDots=[];
  const lines=cfg.mosaic.orient==="v"
    ? (cfg.sec?[str.slice(0,2),str.slice(3,5),str.slice(6,8)]:[str.slice(0,2),str.slice(3,5)])
    : [str];
  const lineData=lines.map(s=>matrixCells(s));
  const maxCols=Math.max(...lineData.map(l=>l.cols));
  const pitch=Math.min(360/maxCols, 420/(lines.length*8+2));
  const rad=pitch*.36*cfg.mosaic.dot/100;
  const totalH=lines.length*8*pitch;
  lineData.forEach((ld,li)=>{
    const x0=210-(ld.cols-1)*pitch/2;
    const y0=280-totalH/2+li*8*pitch+pitch;
    ld.cells.forEach(c=>{
      const cx=x0+c.col*pitch,cy=y0+c.row*pitch;
      const dot=el("circle",{cx,cy,r:rad,fill:c.on?C("led","--led"):"var(--led-off)"},grp);
      mosaicDots.push({dot,on:c.on,col:c.col,row:c.row+li*8,cx,cy});
    });
  });
  if(cfg.date)txt(210,280+totalH/2+34,dateStr(d),10,"eng-soft").setAttribute("letter-spacing",".3em");
  mosaicKey=str+"|"+cfg.mosaic.orient+"|"+cfg.mosaic.dot;
}
function mosaicFrame(){
  if(!mosaicDots)return;
  const t=performance.now()/1000,fx=cfg.mosaic.fx;
  if(fx==="none"||reduced.matches){mosaicDots.forEach(m=>{if(m.on)m.dot.setAttribute("opacity",1)});return}
  mosaicDots.forEach(m=>{
    if(!m.on){m.dot.setAttribute("opacity",1);return}
    let o=1;
    if(fx==="breathe")o=.55+.45*Math.sin(t*1.6);
    else if(fx==="wave")o=.45+.55*(.5+.5*Math.sin(t*2.2-m.row*.55));
    else if(fx==="scan")o=.45+.55*(.5+.5*Math.sin(t*2.2-m.col*.4));
    else if(fx==="sparkle")o=.4+.6*(.5+.5*Math.sin(t*3+(m.col*13.37+m.row*7.91)%6.28*7));
    else if(fx==="ripple"){const dd=Math.hypot(m.cx-210,m.cy-280);o=.4+.6*(.5+.5*Math.sin(t*2.5-dd*.045))}
    else if(fx==="rain")o=.35+.65*(.5+.5*Math.sin(t*3-m.row*.9+m.col*1.7));
    else if(fx==="spiral"){const a=Math.atan2(m.cy-280,m.cx-210),dd=Math.hypot(m.cx-210,m.cy-280);
      o=.4+.6*(.5+.5*Math.sin(t*2.4-a*2-dd*.02))}
    m.dot.setAttribute("opacity",o.toFixed(3));
  });
}

/* ================= chime + hourly ================= */
let audioCtx=null,lastHour=new Date().getHours();
function chime(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,.18].forEach((delay,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=i?659.25:523.25;
      g.gain.setValueAtTime(cfg.vol/100*.18,now+delay);
      g.gain.exponentialRampToValueAtTime(.001,now+delay+.55);
      o.connect(g).connect(audioCtx.destination);
      o.start(now+delay);o.stop(now+delay+.6);
    });
  }catch(e){}
}
function hourlyCheck(d){
  if(d.getHours()!==lastHour){
    lastHour=d.getHours();
    if(cfg.chime)chime();
    if(cfg.flash){document.body.classList.remove("flash");void document.body.offsetWidth;
      document.body.classList.add("flash")}
  }
}

    }
    const tt=T("text",{x:105,y:100,"text-anchor":"middle","dominant-baseline":"middle",
      "font-size":"22","font-weight":"600",fill:"var(--panel-txt)"});
    tt.textContent=tFmt(mode==="countdown"?remain:e);
    const st=T("text",{x:105,y:126,"text-anchor":"middle","font-size":"9",fill:"var(--panel-txt)",opacity:".55","letter-spacing":".2em"});
    st.textContent=timer.state==="done"?"COMPLETE":mode.toUpperCase();
  }
  requestAnimationFrame(timerFrame);
}

/* ================= render loop ================= */
let lastKey="";
function scaleWrap(){
  root=svg;
  const s=cfg.scale/100;
  if(s!==1)root=el("g",{transform:`translate(210 280) scale(${s}) translate(-210 -280)`},svg);
}
function render(force){
  if(document.body.dataset.engine!=="look"&&!force)return;
  const d=new Date();
  hourlyCheck(d);
  /* rainfall: in-place seconds arc */
  if(!force&&cfg.mode==="rainfall"&&timeStr(d)===rainKey){
    const arc=document.getElementById("secArc");
    if(arc){
      const sf=(d.getSeconds()+d.getMilliseconds()/1000)/60;
      arc.setAttribute("d",sf>0.002?arcPath(210,218,161.5,0,sf*360):"M 0 0");
      return;
    }
  }
  /* mosaic: in-place effect frames */
  if(!force&&cfg.mode==="mosaic"&&(timeStr(d)+"|"+cfg.mosaic.orient+"|"+cfg.mosaic.dot)===mosaicKey){
    mosaicFrame();return;
  }
  const smooth=cfg.mode==="orrery";
  const key=cfg.mode+"|"+timeStr(d)+"|"+(cfg.mode==="buckets"?d.getSeconds():"")+"|"+(smooth?d.getTime():"");
  if(!force&&key===lastKey)return;
  lastKey=key;
  const soft=force==="soft";
  svg.innerHTML="";defs();scaleWrap();
  mosaicDots=null;
  if(cfg.mode==="orbit")drawOrbit(d);
  else if(cfg.mode==="eclipse")drawEclipse(d);
  else if(cfg.mode==="rainfall")drawRain(d,soft);
  else if(cfg.mode==="buckets")drawBucketsMode(d,soft);
  else if(cfg.mode==="mosaic")buildMosaic(d);
  else drawOrrery(d);
}
function hardRedraw(){rainKey="";mosaicKey="";render("soft")}
function loop(){render();requestAnimationFrame(loop)}
/* ================= engine shell ================= */
const FR={flow:{el:$("frFlow"),src:"time.html"},mosaic:{el:$("frMosaic"),src:"clock.html"}};
function setEngine(eng){
  cfg.engine=eng;saveCfg();
  document.body.dataset.engine=eng;
  document.querySelectorAll("#engines button").forEach(b=>b.classList.toggle("on",b.dataset.eng===eng));
  for(const k in FR){
    const f=FR[k];
    const on=eng===k;
    if(on&&!f.el.src)f.el.src=f.src;      /* lazy load full original app */
    f.el.classList.toggle("on",on);
  }
  if(eng==="look")hardRedraw();
}
document.querySelectorAll("#engines button").forEach(b=>b.onclick=()=>setEngine(b.dataset.eng));
setEngine(cfg.engine||"look");
render(true);loop();timerFrame();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)hardRedraw()});
</script>
