<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Navigator Evidence Viewer</title><style>:root{color-scheme:dark;--bg:#08111f;--p:#101b2d;--p2:#0b1525;--line:#263854;--text:#eef5ff;--muted:#91a3bb;--ok:#2dd47b;--bad:#ef6670;--accent:#6db7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.top{position:sticky;top:0;background:#070e1a;border-bottom:1px solid var(--line);padding:14px 16px;z-index:3}.top b{font-size:18px}.top small{display:block;color:var(--muted);margin-top:3px}.wrap{padding:14px;display:grid;gap:12px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,.pane{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}.card span,.muted{color:var(--muted)}.card strong{display:block;font-size:22px;margin-top:4px}.layout{display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:12px;min-height:70vh}.pane{overflow:auto}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.toolbar input{flex:1;background:var(--p2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{position:sticky;top:0;background:var(--p);color:var(--muted);font-size:11px}.row{cursor:pointer}.row:hover,.row.active{background:#172941}.pill{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid var(--line);font-size:11px}.ok{color:var(--ok)}.bad{color:var(--bad)}h2,h3{margin:0 0 9px}.meta{display:grid;grid-template-columns:150px 1fr;gap:6px 10px}.meta dt{color:var(--muted)}.meta dd{margin:0}.horizons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}.h{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:8px;min-width:0}.h b{display:block;margin-bottom:5px}.obs{max-height:310px;overflow:auto}.error{padding:16px;color:var(--bad)}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.horizons{grid-template-columns:repeat(2,1fr)}.meta{grid-template-columns:110px 1fr}}</style></head><body><header class="top"><b>Market Navigator — Evidence Database Viewer</b><small id="status">Loading catalog and operational manifest…</small></header><main class="wrap"><section class="summary" id="summary"></section><section class="layout"><div class="pane"><div class="toolbar"><input id="q" placeholder="Filter series, provider, category…"></div><table><thead><tr><th>Series</th><th>Source</th><th>Obs</th><th>History</th><th>State</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pane" id="detail"><div class="muted">Select a series.</div></div></section></main><script>'use strict';const BASE='.';const H=['1D','5D','1M','YTD','1Y','3Y','5Y'];let catalog,manifest,selected;const $=s=>document.querySelector(s),fmtDate=t=>t?new Date(t).toISOString().slice(0,10):'—',num=v=>Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:4}).format(v):'—';async function j(p){let r=await fetch(BASE+'/'+p+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(p+' HTTP '+r.status);return r.json()}function cards(){let s=manifest.summary||{},states=Object.values(manifest.series||{});$('#summary').innerHTML=[['Catalog series',s.catalogSeries],['Processed',s.processedSeries],['Bootstrap complete',states.filter(x=>x.bootstrap_complete).length],['Acceptance',s.ready?'READY':'BLOCKED']].map(([a,b])=>`<div class="card"><span>${a}</span><strong class="${b==='READY'?'ok':b==='BLOCKED'?'bad':''}">${b??'—'}</strong></div>`).join('')}function drawRows(){let q=$('#q').value.toLowerCase(),items=(catalog.series||[]).filter(x=>x.enabled!==false&&JSON.stringify(x).toLowerCase().includes(q));$('#rows').innerHTML=items.map(m=>{let s=manifest.series?.[m.id]||{};return `<tr class="row ${selected===m.id?'active':''}" data-id="${m.id}"><td><b>${m.short_name||m.id}</b><br><span class="muted">${m.name}</span></td><td>${m.provider}<br><span class="muted">${m.provider_identifier}</span></td><td>${s.observation_count??'—'}</td><td>${s.history_years??'—'}y</td><td><span class="pill ${s.status==='healthy'?'ok':'bad'}">${s.status||'missing'}</span></td></tr>`}).join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>openSeries(r.dataset.id))}async function openSeries(id){selected=id;drawRows();let m=catalog.series.find(x=>x.id===id),s=manifest.series?.[id]||{};$('#detail').innerHTML='<div class="muted">Loading '+id+'…</div>';try{let [ser,rep]=await Promise.all([j('market-evidence/series/'+id+'.json'),j('market-evidence/reports/'+id+'.json')]);let hrs=H.map(h=>{let r=rep.reports?.[h]||{};return `<div class="h"><b>${h} <span class="${r.ready?'ok':'bad'}">${r.ready?'ready':'not ready'}</span></b><div>T0 ${fmtDate(r.t0_date)} · ${num(r.t0_value)}</div><div>Now ${fmtDate(r.now_date)} · ${num(r.now_value)}</div><div>Δ ${num(r.absolute_change)} · ${Number.isFinite(r.percentage_change)?r.percentage_change.toFixed(2)+'%':'—'}</div><div class="muted">n=${r.observation_count??0}</div></div>`}).join('');let obs=(ser.observations||[]).slice().reverse();$('#detail').innerHTML=`<h2>${m.name}</h2><dl class="meta"><dt>Description</dt><dd>${m.description}</dd><dt>Provider</dt><dd>${m.provider} · ${m.provider_identifier}</dd><dt>Source</dt><dd><a href="${m.source_reference_url}" target="_blank" rel="noopener">provider reference</a></dd><dt>Cadence</dt><dd>${m.native_cadence} → ${m.canonical_storage_cadence}</dd><dt>Transformation</dt><dd>${m.transformation}</dd><dt>Coverage</dt><dd>${fmtDate(s.first_observation)} → ${fmtDate(s.latest_observation)} · ${s.observation_count} observations · ${s.history_years} years</dd><dt>Bootstrap</dt><dd class="${s.bootstrap_complete?'ok':'bad'}">${s.bootstrap_complete?'complete':'incomplete'}</dd><dt>Last success</dt><dd>${s.last_successful||'—'}</dd><dt>Revision</dt><dd>${s.source_revision||'—'}</dd></dl><h3 style="margin-top:15px">Precomputed horizon reports</h3><div class="horizons">${hrs}</div><h3>Canonical observations</h3><div class="obs"><table><thead><tr><th>Date</th><th>Value</th></tr></thead><tbody>${obs.map(p=>`<tr><td>${fmtDate(p.t)}</td><td>${num(p.v)}</td></tr>`).join('')}</tbody></table></div>`}catch(e){$('#detail').innerHTML='<div class="error">'+e.message+'. The evidence pipeline must run before this series can be inspected.</div>'}}async function init(){try{[catalog,manifest]=await Promise.all([j('data/market-backend/data-catalog.json'),j('market-evidence/operational-manifest.json')]);$('#status').textContent=`Catalog ${catalog.version} · manifest ${manifest.generatedAt} · ${manifest.mode}`;cards();drawRows();let first=catalog.series?.find(x=>x.enabled!==false);if(first)openSeries(first.id)}catch(e){$('#status').textContent='Evidence database not built';$('#summary').innerHTML='<div class="error">'+e.message+'</div>'}}$('#q').addEventListener('input',drawRows);init();</script></body></html>
