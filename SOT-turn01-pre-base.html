<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOT Turn 01 Service Surface</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--panel:#10151d;--panel2:#171e29;--line:#303a49;--text:#f3f6f9;--muted:#94a0b1;--accent:#68b6ff;--good:#63d49a;--warn:#f2c66d;--bad:#ff7e86;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c1118}.brand{font-size:21px;font-weight:900;white-space:nowrap}.brand small{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-left:7px}.searchWrap{position:relative;flex:1;max-width:900px;margin:auto}.search{width:100%;height:40px;border:1px solid #43536b;border-radius:10px;background:#111925;color:var(--text);padding:0 42px 0 13px;outline:none}.clear{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:21px}.gear{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:20px}.body{min-height:0;display:grid;grid-template-columns:320px minmax(0,1fr)}.rail{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#0c1118}.railHead{height:45px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}.railHead b{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.add{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:6px 10px;font-weight:800}.cards{min-height:0;overflow:auto;padding:8px}.card{border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;background:var(--panel);padding:11px;margin-bottom:8px;cursor:pointer}.card:hover{background:var(--panel2)}.card.active{border-left-color:var(--accent);background:var(--panel2)}.cardHead{display:flex;align-items:center;gap:8px}.cardName{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardState{margin-left:auto;font-size:9px;font-weight:850;text-transform:uppercase;color:var(--muted)}.cardMeta{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.opdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:5px}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--bg)}.workspaceHead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0d1219}.workspaceTitle{min-width:0;flex:1}.workspaceTitle h1{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspaceTitle div{font-size:10px;color:var(--muted);margin-top:2px}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800;white-space:nowrap}.content{min-height:0;overflow:auto;padding:16px}.section{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:12px;overflow:hidden}.sectionHead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}.sectionHead h2{margin:0;font-size:13px}.sectionHead .spacer{flex:1}.sectionBody{padding:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric,.compact{border:1px solid var(--line);border-radius:9px;background:#111923;padding:12px}.metric b{display:block;font-size:18px}.metric span,.compact small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.btn{border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);padding:8px 11px;font-weight:750}.btn.primary{background:#2b76cc;border-color:#4b9af2}.btn.danger{color:#ffb1b5;border-color:#71343b;background:#2a1518}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px}.empty{padding:18px;text-align:center;color:var(--muted)}.loading{min-height:52px;display:flex;align-items:center;color:var(--muted)}.progress{height:8px;border-radius:999px;background:#202a37;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.activityLine{font-size:11px;color:var(--muted);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.errorBox{border:1px solid #73363d;border-radius:9px;background:#2a161a;padding:10px 12px;color:#ffd3d6;white-space:pre-wrap}.notice{border:1px solid #66572f;border-radius:9px;background:#211c0d;padding:10px 12px;color:#f6d993}.modalBg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:12px;background:#020406d8}.modal{width:min(760px,100%);max-height:92dvh;display:flex;flex-direction:column;border:1px solid #39475b;border-radius:13px;background:#10161f;overflow:hidden}.modalHead,.modalFoot{display:flex;align-items:center;gap:8px;padding:11px 13px}.modalHead{border-bottom:1px solid var(--line)}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{min-height:0;overflow:auto;padding:13px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#080d13;color:var(--text);padding:9px 10px;outline:none}.picker{display:grid;grid-template-columns:170px minmax(0,1fr);height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.volumes,.folders{min-height:0;overflow:auto}.volumes{border-right:1px solid var(--line)}.pickBtn{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px;text-align:left}.folderRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}.folderRow button{border:0;background:transparent;color:var(--text);text-align:left}.folderRow .use{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#182231}.pathBar{padding:8px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;z-index:150;transform:translateX(-50%);border:1px solid var(--line);border-radius:9px;background:#17212d;padding:9px 12px}.hidden{display:none!important}
@media(max-width:820px){.body{grid-template-columns:270px minmax(0,1fr)}.metrics,.grid3{grid-template-columns:1fr 1fr}}@media(max-width:620px){.body{grid-template-columns:min(58vw,250px) minmax(0,1fr)}.content{padding:10px}.metrics,.grid3{grid-template-columns:1fr}.workspaceHead{padding:10px}.brand small{display:none}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand">SOT <small>TURN 01 · SERVICE SURFACE</small></div><div class="searchWrap"><input id="search" class="search" placeholder="Omnisearch projects…" autocomplete="off"><button id="clearSearch" class="clear" aria-label="Clear search">×</button></div><button id="gear" class="gear" title="Configuration">⚙</button></header>
<div class="body">
<aside class="rail"><div class="railHead"><b>Projects</b><button id="addProject" class="add">+ Project</button></div><div id="cards" class="cards"><div class="empty">Loading projects…</div></div></aside>
<main class="workspace"><div id="workspaceHead" class="workspaceHead"><div class="workspaceTitle"><h1>Source of Truth</h1><div>Choose a project. The interface remains usable while data loads.</div></div></div><section id="content" class="content"><div class="section"><div class="sectionBody"><div class="loading">Project services load independently; no background job owns this surface.</div></div></div></section></main>
</div></div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const BUILD='2026.09.04.sot-turn01-service-surface-1';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const state={projects:[],selected:localStorage.getItem('sot.selectedProject')||'',query:'',serviceNonce:0,health:null,rollup:null};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(v){let n=Number(v||0),i=0,u=['B','KB','MB','GB','TB','PB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function toast(m){let n=$('toast');n.textContent=m;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),2400)}
async function api(path,opt={}){let r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||r.statusText);return d}
function selectedProject(){return state.projects.find(p=>p.project_token===state.selected)||null}
function committedLabel(p){let ev=Number(p.evidence_revision||0);if(Number(p.executed_revision||0)>=ev&&ev)return `Executed r${ev}`;if(Number(p.plan_evidence_revision||0)===ev&&ev)return `Planned r${ev}`;if(ev)return `Indexed r${ev}`;return Number(p.source_count||0)?'Sources ready':'Setup'}
function activeLabel(p){let s=String(p.processing_state||p.lifecycle_state||p.status||'').toLowerCase();if(['queued','wip','processing','indexing','reindexing'].some(x=>s.includes(x)))return 'Indexing';if(s.includes('planning'))return 'Planning';if(s.includes('execut'))return 'Executing';if(s.includes('pause'))return 'Paused';if(s.includes('fail')||s.includes('error'))return 'Failed';return ''}
function cardSignature(){return state.projects.map(p=>[p.project_token,p.project_name,p.evidence_revision,p.processing_state,p.status,p.files_discovered,p.size_bytes,p.source_count]).join('|')}
function renderCards(){let q=state.query.trim().toLowerCase(),ps=state.projects.filter(p=>!q||String(p.project_name||'').toLowerCase().includes(q));$('cards').innerHTML=ps.map(p=>{let op=activeLabel(p);return `<div class="card ${p.project_token===state.selected?'active':''}" data-project="${esc(p.project_token)}"><div class="cardHead"><div class="cardName">${esc(p.project_name)}</div><div class="cardState" data-card-state="${esc(p.project_token)}">${esc(committedLabel(p))}</div></div><div class="cardMeta" data-card-meta="${esc(p.project_token)}">${Number(p.files_discovered||0).toLocaleString()} files · ${bytes(p.size_bytes||0)} · ${Number(p.source_count||0)} sources</div><div class="cardMeta" data-card-op="${esc(p.project_token)}">${op?`<span class="opdot"></span>${esc(op)}`:'No active operation'}</div></div>`}).join('')||'<div class="empty">No matching projects.</div>';document.querySelectorAll('[data-project]').forEach(n=>n.onclick=()=>selectProject(n.dataset.project))}
function updateCardNodes(){for(let p of state.projects){let s=document.querySelector(`[data-card-state="${CSS.escape(p.project_token)}"]`),m=document.querySelector(`[data-card-meta="${CSS.escape(p.project_token)}"]`),o=document.querySelector(`[data-card-op="${CSS.escape(p.project_token)}"]`);if(s)s.textContent=committedLabel(p);if(m)m.textContent=`${Number(p.files_discovered||0).toLocaleString()} files · ${bytes(p.size_bytes||0)} · ${Number(p.source_count||0)} sources`;if(o){let a=activeLabel(p);o.innerHTML=a?`<span class="opdot"></span>${esc(a)}`:'No active operation'}}}
function selectProject(token){if(state.selected===token&&$('serviceRoot'))return;state.selected=token;localStorage.setItem('sot.selectedProject',token);document.querySelectorAll('[data-project]').forEach(n=>n.classList.toggle('active',n.dataset.project===token));renderServiceShell(selectedProject())}
function renderServiceShell(p){let nonce=++state.serviceNonce;if(!p){$('workspaceHead').innerHTML='<div class="workspaceTitle"><h1>Source of Truth</h1><div>Select a project from the informational rail.</div></div>';$('content').innerHTML='<div class="section"><div class="sectionBody"><div class="empty">No project selected.</div></div></div>';return}$('workspaceHead').innerHTML=`<div class="workspaceTitle"><h1>${esc(p.project_name)}</h1><div><span id="committedHeader">${esc(committedLabel(p))}</span> · evidence r${Number(p.evidence_revision||0)} · ${Number(p.source_count||0)} sources</div></div><span id="operationBadge" class="badge">${esc(activeLabel(p)||'Idle')}</span>`;$('content').innerHTML=`<div id="serviceRoot" data-token="${esc(p.project_token)}"><section class="section"><div class="sectionHead"><h2>Storage & Scope</h2><div class="spacer"></div><button id="editSetup" class="btn">Edit Sources</button></div><div id="scopeBody" class="sectionBody"><div class="loading">Loading setup…</div></div></section><section class="section"><div class="sectionHead"><h2>Index & Evidence</h2><div class="spacer"></div><button id="indexStart" class="btn primary">${Number(p.evidence_revision||0)?'Re-index':'Start Index'}</button><button id="indexPause" class="btn">Pause</button><button id="indexStop" class="btn danger">Stop</button></div><div id="indexBody" class="sectionBody"><div class="loading">Loading committed evidence and current activity…</div></div></section><section class="section"><div class="sectionHead"><h2>Plan</h2><div class="spacer"></div><button id="planGenerate" class="btn primary">Generate Plan</button></div><div id="planBody" class="sectionBody"><div class="loading">Loading plan…</div></div></section><section class="section"><div class="sectionHead"><h2>Execution</h2><div class="spacer"></div><button id="executeStart" class="btn primary">Execute</button></div><div id="executeBody" class="sectionBody"><div class="loading">Loading execution readiness…</div></div></section><section class="section"><div class="sectionHead"><h2>Activity</h2></div><div id="activityBody" class="sectionBody"><div class="loading">Loading recent activity…</div></div></section></div>`;bindServiceActions(p,nonce);hydrateScope(p,nonce);hydrateIndex(p,nonce);hydratePlan(p,nonce);hydrateActivity(p,nonce)}
function currentService(token,nonce){return state.selected===token&&state.serviceNonce===nonce&&$('serviceRoot')?.dataset.token===token}
function bindServiceActions(p,nonce){$('editSetup').onclick=()=>hydrateScope(p,nonce,true);$('indexStart').onclick=()=>requestIndex(p,'continue');$('indexPause').onclick=()=>requestIndex(p,'pause');$('indexStop').onclick=()=>requestIndex(p,'stop');$('planGenerate').onclick=()=>generatePlan(p);$('executeStart').onclick=()=>executePlan(p)}
async function hydrateScope(p,nonce,openPicker=false){try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}`);if(!currentService(p.project_token,nonce))return;let src=d.sources||[];$('scopeBody').innerHTML=`<div class="grid3"><div class="compact"><b>Sources</b><small>${src.length} selected</small>${src.slice(0,4).map(s=>`<div class="mono" style="font-size:10px;margin-top:5px;overflow:hidden;text-overflow:ellipsis">${esc(s.normalized_path)}</div>`).join('')}</div><div class="compact"><b>Target</b><small>${esc(d.target_root||'Configured in project storage')}</small></div><div class="compact"><b>Backup</b><small>${esc(d.backup_root||'Configured in project storage')}</small></div></div>`;if(openPicker)openSourcePicker(p,src)}catch(e){if(currentService(p.project_token,nonce))$('scopeBody').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function hydrateIndex(p,nonce){let body=$('indexBody');try{let [s,review]=await Promise.allSettled([api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`),api(`/turn01/projects/${encodeURIComponent(p.project_token)}/review`)]);if(!currentService(p.project_token,nonce))return;let st=s.status==='fulfilled'?s.value:{},rv=review.status==='fulfilled'?review.value:{},r=st.run||{},pr=st.progress||{},ev=Number(p.evidence_revision||rv.evidence_revision||0);body.innerHTML=`<div class="metrics"><div class="metric"><b>${ev}</b><span>Committed evidence revision</span></div><div class="metric"><b>${Number(rv.files||p.files_discovered||0).toLocaleString()}</b><span>Committed files</span></div><div class="metric"><b>${Number(rv.duplicate_groups||0).toLocaleString()}</b><span>Duplicate groups</span></div><div class="metric"><b>${esc(st.state||activeLabel(p)||'Idle')}</b><span>Current operation</span></div></div><div style="margin-top:12px"><div class="progress"><i id="indexProgressBar" style="width:${Number(pr.bytes_percent||0)}%"></i></div><div id="indexActivityLine" class="activityLine">${Number(pr.bytes_percent||0).toFixed(0)}% · ${esc(r.current_item||r.current_source||'No active indexing work')}</div></div>${ev?'<div class="notice" style="margin-top:12px">Committed evidence remains available while replacement indexing runs. A replacement does not become current until it completes successfully.</div>':''}`;updateOperationBadge(p,st)}catch(e){if(currentService(p.project_token,nonce))body.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
function updateOperationBadge(p,status){let b=$('operationBadge');if(!b)return;let label=status?.state||activeLabel(p)||'Idle';b.textContent=label}
async function hydratePlan(p,nonce){try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`);if(!currentService(p.project_token,nonce))return;let items=d.items||[],ev=Number(d.evidence_revision||0);$('planBody').innerHTML=`<div class="metrics"><div class="metric"><b>${esc(d.state||'none')}</b><span>Plan state</span></div><div class="metric"><b>${ev}</b><span>Plan evidence revision</span></div><div class="metric"><b>${items.length.toLocaleString()}</b><span>Plan items</span></div><div class="metric"><b>${ev&&ev===Number(p.evidence_revision||0)?'Current':ev?'Stale':'—'}</b><span>Revision relationship</span></div></div><div class="list" style="margin-top:10px">${items.slice(0,30).map(i=>`<div class="row"><div><b>${esc(i.action||'action')}</b><small class="mono">${esc(i.source_path||i.content_sha256||'')}</small></div><span>${esc(i.state||'')}</span></div>`).join('')||'<div class="empty">No plan yet.</div>'}</div>`;$('executeBody').innerHTML=`<div class="compact"><b>${d.state==='draft'?'Ready to execute current draft':'Execution not ready'}</b><small>${d.state==='draft'?`Plan is bound to evidence r${ev}.`:'Generate a current draft plan first.'}</small></div>`;$('executeStart').disabled=d.state!=='draft'}catch(e){if(currentService(p.project_token,nonce)){$('planBody').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`;$('executeBody').innerHTML='<div class="empty">Execution readiness unavailable.</div>'}}}
async function hydrateActivity(p,nonce){try{let d=await api('/activity?limit=120'),rows=(d.events||[]).filter(x=>!x.project_token||x.project_token===p.project_token||x.project_name===p.project_name).slice(0,40);if(!currentService(p.project_token,nonce))return;$('activityBody').innerHTML=`<div class="list">${rows.map(x=>`<div class="row"><div><b>${esc(x.event_type||x.type||'activity')}</b><small>${esc(x.detail||x.message||'')} ${x.created_at?'· '+esc(new Date(x.created_at).toLocaleString()):''}</small></div></div>`).join('')||'<div class="empty">No recent activity.</div>'}</div>`}catch(e){if(currentService(p.project_token,nonce))$('activityBody').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function requestIndex(p,action){try{let route=action;if(action==='continue'){let s=await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`);if(['Queued','WIP'].includes(s.state)){toast('Index already running');return}route=s.state==='Paused'?'continue':Number(p.evidence_revision||0)?'restart':'start'}await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/${route}`,{method:'POST',body:'{}'});toast(`Index ${route} requested`);refreshSelectedNow()}catch(e){toast(e.message)}}
async function generatePlan(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Plan generated');refreshSelectedNow()}catch(e){toast(e.message)}}
async function executePlan(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started');refreshSelectedNow()}catch(e){toast(e.message)}}
function openModal(title,body,foot){$('modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><div class="modalHead"><b>${esc(title)}</b></div><div class="modalBody">${body}</div><div class="modalFoot">${foot||'<button class="btn" data-close>Close</button>'}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(n=>n.onclick=closeModal)}function closeModal(){$('modalRoot').innerHTML=''}
function newProject(){openModal('New project',`<div class="field"><label>Project name</label><input id="newProjectName" class="input" placeholder="Project name"></div>`,`<button class="btn" data-close>Cancel</button><button id="createProject" class="btn primary">Create</button>`);$('createProject').onclick=async()=>{let name=$('newProjectName').value.trim();if(!name)return;try{let p=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name})});closeModal();await refreshProjects(true);selectProject(p.project_token)}catch(e){toast(e.message)}}}
async function openSourcePicker(p,current){openModal('Project Sources','<div id="pickerMount" class="empty">Loading volumes…</div>','<button class="btn" data-close>Cancel</button>');let staged=current.map(s=>s.normalized_path),root=$('pickerMount');async function browse(path='/'){try{let d=await api(`/fs?path=${encodeURIComponent(path)}`);let vols=(d.locations||[]).map(v=>`<button class="pickBtn" data-browse="${esc(v.path)}"><b>${esc(v.name)}</b><small>${esc(v.path)}</small></button>`).join(''),folders=(d.folders||[]).map(f=>`<div class="folderRow"><button data-browse="${esc(f.path)}">${esc(f.name)}</button><button class="use" data-use="${esc(f.path)}">Add</button></div>`).join('');root.className='';root.innerHTML=`<div class="picker"><div class="volumes">${vols}</div><div class="folders"><div class="pathBar">${esc(d.path)}</div>${d.path!=='/'?`<div class="folderRow"><button data-browse="${esc(d.parent)}">..</button><button class="use" data-use="${esc(d.path)}">Add this folder</button></div>`:''}${folders}</div></div><div class="section" style="margin-top:10px"><div class="sectionBody"><div id="staged" class="list"></div></div></div><div class="actions"><button id="saveSources" class="btn primary">Save Sources</button></div>`;function draw(){$('staged').innerHTML=staged.map(x=>`<div class="row"><div class="mono">${esc(x)}</div><button class="btn" data-remove="${esc(x)}">Remove</button></div>`).join('')||'<div class="empty">None selected.</div>';document.querySelectorAll('[data-remove]').forEach(n=>n.onclick=()=>{staged=staged.filter(x=>x!==n.dataset.remove);draw()})}draw();document.querySelectorAll('[data-browse]').forEach(n=>n.onclick=()=>browse(n.dataset.browse));document.querySelectorAll('[data-use]').forEach(n=>n.onclick=()=>{if(!staged.includes(n.dataset.use))staged.push(n.dataset.use);draw()});$('saveSources').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/sources`,{method:'PUT',body:JSON.stringify({sources:staged})});closeModal();toast('Sources saved');refreshSelectedNow()}catch(e){toast(e.message)}}}catch(e){root.className='errorBox';root.textContent=e.message}}browse('/')}
function openConfig(){openModal('Configuration','<div class="notice">Configuration remains separate from project work. Project work occurs only in the Project Service surface.</div>')}
async function refreshProjects(forceRender=false){try{let raw=await api('/projects'),next=Array.isArray(raw)?raw:(raw.projects||[]),before=cardSignature();state.projects=next;if(state.selected&&!next.some(p=>p.project_token===state.selected))state.selected='';if(!state.selected&&next.length)state.selected=next[0].project_token;let after=cardSignature();if(forceRender||before!==after)renderCards();else updateCardNodes();if(!$('serviceRoot')&&state.selected)renderServiceShell(selectedProject());return true}catch(e){if(!state.projects.length)$('cards').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`;return false}}
async function refreshSelectedNow(){await refreshProjects(false);let p=selectedProject();if(!p)return;let nonce=state.serviceNonce;hydrateIndex(p,nonce);hydratePlan(p,nonce);hydrateActivity(p,nonce)}
async function backgroundPulse(){await refreshProjects(false);let p=selectedProject();if(!p)return;try{let s=await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`);if(state.selected!==p.project_token)return;let pr=s.progress||{},r=s.run||{},bar=$('indexProgressBar'),line=$('indexActivityLine');if(bar)bar.style.width=`${Number(pr.bytes_percent||0)}%`;if(line)line.textContent=`${Number(pr.bytes_percent||0).toFixed(0)}% · ${r.current_item||r.current_source||'No active indexing work'}`;updateOperationBadge(p,s)}catch{}}
$('addProject').onclick=newProject;$('gear').onclick=openConfig;$('clearSearch').onclick=()=>{$('search').value='';state.query='';renderCards()};$('search').oninput=e=>{state.query=e.target.value;renderCards()};
renderCards();refreshProjects(true).then(()=>{if(state.selected)selectProject(state.selected)});setInterval(backgroundPulse,2000);setInterval(()=>{let p=selectedProject();if(p)hydrateActivity(p,state.serviceNonce)},10000);
</script>
