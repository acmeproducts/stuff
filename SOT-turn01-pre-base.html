<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOT Turn 01 Pre-Base</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--panel:#10151d;--panel2:#171e29;--line:#303a49;--text:#f3f6f9;--muted:#94a0b1;--accent:#68b6ff;--good:#63d49a;--warn:#f2c66d;--bad:#ff7e86;--shadow:0 20px 60px #0008;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c1118}.brand{display:flex;align-items:baseline;gap:7px;min-width:max-content;font-size:21px;font-weight:900}.brand small{font-size:9px;color:var(--muted);letter-spacing:.08em}.searchWrap{position:relative;flex:1;max-width:900px;margin:auto}.search{width:100%;height:40px;border:1px solid #43536b;border-radius:10px;background:#111925;color:var(--text);padding:0 42px 0 13px;font-size:15px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #68b6ff20}.clear{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:21px}.gear{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:20px}.body{min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr)}.rail{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#0c1118}.railHead{height:45px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}.railHead b{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.add{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:6px 10px;font-weight:800}.cards{min-height:0;overflow:auto;padding:8px}.card{border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;background:var(--panel);padding:11px;margin-bottom:8px;cursor:pointer}.card:hover{background:var(--panel2)}.card.active{border-left-color:var(--accent);background:var(--panel2)}.sotCard{border-left-color:#657184}.sotCard.active{border-left-color:var(--accent)}.cardHead{display:flex;align-items:center;gap:8px}.cardName{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardStatus{margin-left:auto;font-size:9px;font-weight:850;text-transform:uppercase;color:var(--muted)}.cardMeta{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardProgress{height:4px;margin-top:7px;border-radius:999px;background:#222b38;overflow:hidden}.cardProgress i{display:block;height:100%;background:var(--accent)}.cardControls{display:flex;gap:5px;margin-top:8px}.mini{width:30px;height:29px;border:1px solid var(--line);border-radius:7px;background:#17202c;color:var(--text);font-weight:900}.mini.stop{color:var(--bad)}.attention{margin-top:6px;font-size:10px;color:var(--warn)}
.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg)}.workspaceHead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0d1219}.workspaceTitle{min-width:0}.workspaceTitle h1{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspaceTitle div{font-size:10px;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:2px;overflow:auto;padding:7px 10px;border-bottom:1px solid var(--line);background:#0b1016}.tab{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:8px 12px;font-size:11px;font-weight:850;white-space:nowrap}.tab:hover{background:#ffffff08;color:var(--text)}.tab.active{background:#68b6ff18;color:var(--text);box-shadow:inset 0 -2px var(--accent)}.content{min-height:0;overflow:auto;padding:16px}.section{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:12px;overflow:hidden}.sectionHead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}.sectionHead h2{margin:0;font-size:13px}.sectionBody{padding:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:9px;background:#111923;padding:12px}.metric b{display:block;font-size:18px}.metric span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.btn{border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);padding:8px 11px;font-weight:750}.btn:hover{border-color:#54667f;background:#223044}.btn.primary{background:#2b76cc;border-color:#4b9af2}.btn.danger{color:#ffb1b5;border-color:#71343b;background:#2a1518}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px}.empty{padding:24px;text-align:center;color:var(--muted)}.progress{height:8px;border-radius:999px;background:#202a37;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.notice{border:1px solid #66572f;border-radius:9px;background:#211c0d;padding:10px 12px;color:#f6d993}.errorBox{border:1px solid #73363d;border-radius:9px;background:#2a161a;padding:10px 12px;color:#ffd3d6;white-space:pre-wrap}.context{position:fixed;z-index:90;width:210px;border:1px solid var(--line);border-radius:10px;background:#151c26;box-shadow:var(--shadow);padding:5px}.context button{display:block;width:100%;border:0;border-radius:7px;background:transparent;color:var(--text);padding:8px 9px;text-align:left}.context button:hover{background:#ffffff0c}.context button.danger{color:var(--bad)}
.modalBg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:12px;background:#020406d8}.modal{width:min(760px,100%);max-height:92dvh;display:flex;flex-direction:column;border:1px solid #39475b;border-radius:13px;background:#10161f;box-shadow:var(--shadow);overflow:hidden}.modalHead,.modalFoot{display:flex;align-items:center;gap:8px;padding:11px 13px}.modalHead{border-bottom:1px solid var(--line)}.modalHead b{font-size:16px}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{min-height:0;overflow:auto;padding:13px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#080d13;color:var(--text);padding:9px 10px;outline:none}.picker{display:grid;grid-template-columns:170px minmax(0,1fr);height:440px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.volumes,.folders{min-height:0;overflow:auto}.volumes{border-right:1px solid var(--line)}.pickBtn{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px;text-align:left}.pickBtn:hover,.pickBtn.active{background:#68b6ff12}.folderRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}.folderRow button{border:0;background:transparent;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folderRow .use{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#182231}.pathBar{padding:8px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:18px;z-index:150;transform:translateX(-50%);border:1px solid var(--line);border-radius:9px;background:#17212d;padding:9px 12px;box-shadow:var(--shadow)}
@media(max-width:900px){.body{grid-template-columns:280px minmax(0,1fr)}.metrics{grid-template-columns:1fr 1fr}}@media(max-width:680px){#app{grid-template-rows:54px minmax(0,1fr)}.top{gap:7px;padding:6px 8px}.brand{font-size:17px}.brand small{display:none}.body{grid-template-columns:min(62vw,270px) minmax(0,1fr)}.workspaceHead{padding:9px 10px}.workspaceTitle h1{font-size:17px}.content{padding:10px}.metrics{grid-template-columns:1fr}.tab{padding:7px 9px}.picker{grid-template-columns:120px minmax(0,1fr);height:58dvh}}
</style>
</head>
<body>
<div id="app">
<header class="top"><div class="brand">SOT <small>TURN 01 · PRE-BASE</small></div><div class="searchWrap"><input id="search" class="search" placeholder="Omnisearch projects…" autocomplete="off"><button id="clearSearch" class="clear" aria-label="Clear search">×</button></div><button id="gear" class="gear" title="Configuration">⚙</button></header>
<div class="body">
<aside class="rail"><div class="railHead"><b>Projects</b><button id="addProject" class="add">+ Project</button></div><div id="cards" class="cards"></div></aside>
<main class="workspace"><div id="workspaceHead" class="workspaceHead"></div><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section></main>
</div></div>
<div id="modalRoot"></div><div id="contextRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const BUILD='SOT-turn01-pre-base';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const state={projects:[],selected:'__sot__',tab:'overview',globalTab:'overview',projectTab:'scope',health:null,rollup:null,scheduler:null,query:''};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(v){let n=Number(v||0),i=0,u=['B','KB','MB','GB','TB','PB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function pct(v){return `${Math.max(0,Math.min(100,Number(v||0))).toFixed(0)}%`}
function toast(m){let n=$('toast');n.textContent=m;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),2600)}
async function api(path,opt={}){let r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||r.statusText);return d}
function selectedProject(){return state.projects.find(p=>p.project_token===state.selected)||null}
function projectState(p){let s=p.processing_state||p.status||'Idle';return String(s)}
function projectPercent(p){let total=Number(p.size_bytes||0),done=Number(p.bytes_processed||0);return total?done/total*100:0}
function attentionFor(p){if(projectState(p)==='Error')return 'Worker failed';if(projectState(p)==='Interrupted')return 'Processing interrupted';if(Number(p.processing_errors||0)>0)return `${p.processing_errors} processing error(s)`;return ''}
function renderCards(){let q=state.query.trim().toLowerCase(),ps=state.projects.filter(p=>!q||String(p.project_name).toLowerCase().includes(q));let r=state.rollup||{};let sot=`<div class="card sotCard ${state.selected==='__sot__'?'active':''}" data-select="__sot__"><div class="cardHead"><div class="cardName">SOT</div><div class="cardStatus">${esc(state.health?.status||'…')}</div></div><div class="cardMeta">${state.projects.length} projects · ${Number(r.active_jobs||0)} active · ${Number(r.failed_jobs||0)} failed</div><div class="cardMeta">${bytes(r.bytes_discovered||0)} discovered · ${Number(r.files_discovered||0).toLocaleString()} files</div>${Number(r.failed_jobs||0)?`<div class="attention">${r.failed_jobs} job(s) need attention</div>`:''}</div>`;let cards=ps.map(p=>{let st=projectState(p),a=attentionFor(p),pr=projectPercent(p);return `<div class="card ${state.selected===p.project_token?'active':''}" data-select="${esc(p.project_token)}"><div class="cardHead"><div class="cardName">${esc(p.project_name)}</div><div class="cardStatus">${esc(st)}</div></div><div class="cardMeta">${bytes(p.size_bytes||0)} · ${Number(p.files_discovered||0).toLocaleString()} files · ${Number(p.source_count||0)} sources</div>${['Queued','WIP','Paused'].includes(st)?`<div class="cardProgress"><i style="width:${pr}%"></i></div>`:''}${a?`<div class="attention">! ${esc(a)}</div>`:''}<div class="cardControls"><button class="mini" data-run="${esc(p.project_token)}" title="Start/continue">▶</button><button class="mini" data-pause="${esc(p.project_token)}" title="Pause">Ⅱ</button><button class="mini stop" data-stop="${esc(p.project_token)}" title="Stop">■</button><button class="mini" data-menu="${esc(p.project_token)}" title="Project menu">⋮</button></div></div>`}).join('');$('cards').innerHTML=sot+(cards||'<div class="empty">No matching projects.</div>');document.querySelectorAll('[data-select]').forEach(n=>n.onclick=e=>{if(e.target.closest('button'))return;select(n.dataset.select)});document.querySelectorAll('[data-run]').forEach(n=>n.onclick=e=>{e.stopPropagation();runAction(n.dataset.run,'continue')});document.querySelectorAll('[data-pause]').forEach(n=>n.onclick=e=>{e.stopPropagation();runAction(n.dataset.pause,'pause')});document.querySelectorAll('[data-stop]').forEach(n=>n.onclick=e=>{e.stopPropagation();runAction(n.dataset.stop,'stop')});document.querySelectorAll('[data-menu]').forEach(n=>n.onclick=e=>{e.stopPropagation();openProjectMenu(n.dataset.menu,n)})}
function select(id){state.selected=id;if(id==='__sot__')state.tab=state.globalTab;else state.tab=state.projectTab;renderCards();renderWorkspace()}
function renderWorkspace(){let p=selectedProject();if(!p){$('workspaceHead').innerHTML=`<div class="workspaceTitle"><h1>Source of Truth</h1><div>Central database · scheduler · Master Plan · status</div></div>`;let tabs=['overview','master plan','activity','insights'];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${esc(t)}">${esc(t.replace(/^./,c=>c.toUpperCase()))}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{state.tab=n.dataset.tab;state.globalTab=state.tab;renderWorkspace()});renderGlobalContent();return}$('workspaceHead').innerHTML=`<div class="workspaceTitle"><h1>${esc(p.project_name)}</h1><div>${esc(projectState(p))} · ${Number(p.source_count||0)} sources · evidence r${Number(p.evidence_revision||0)}</div></div>`;let tabs=['scope','index','plan','execute','insights'];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{state.tab=n.dataset.tab;state.projectTab=state.tab;renderWorkspace()});renderProjectContent(p)}
async function renderGlobalContent(){let c=$('content');if(state.tab==='overview'){c.innerHTML='<div class="empty">Loading SOT status…</div>';try{let [h,r,s]=await Promise.all([api('/health'),api('/rollup'),api('/scheduler/status')]);state.health=h;state.rollup=r;state.scheduler=s;c.innerHTML=`<div class="metrics"><div class="metric"><b>${state.projects.length}</b><span>Projects</span></div><div class="metric"><b>${Number(r.active_jobs||0)}</b><span>Active jobs</span></div><div class="metric"><b>${bytes(r.bytes_discovered||0)}</b><span>Discovered</span></div><div class="metric"><b>${Number(r.failed_jobs||0)}</b><span>Failed jobs</span></div></div><div class="section"><div class="sectionHead"><h2>Central SOT</h2></div><div class="sectionBody"><div class="row"><div><b>Database</b><small>${esc(h.build||'')}</small></div><span class="good">${esc(h.status)}</span></div><div class="row"><div><b>Scheduler</b><small>Central authority for independent project jobs</small></div><span>${esc(s.status||s.state||'ready')}</span></div></div></div>`;renderCards()}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}return}if(state.tab==='activity'){c.innerHTML='<div class="empty">Loading activity…</div>';try{let d=await api('/activity?limit=100'),rows=(d.events||[]).map(x=>`<div class="row"><div><b>${esc(x.event_type)}</b><small>${esc(x.project_name)} · ${esc(new Date(x.created_at).toLocaleString())}</small></div></div>`).join('');c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Activity</h2></div><div class="sectionBody"><div class="list">${rows||'<div class="empty">No activity.</div>'}</div></div></div>`}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}return}if(state.tab==='master plan'){c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Master Plan</h2></div><div class="sectionBody"><p class="muted">Turn 01 pre-base establishes the centralized workspace. Project plans already remain in the existing SOT database; compilation into a first-class cross-project Master Plan is deliberately reserved for a later governed stage.</p></div></div>`;return}c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Global Insights</h2></div><div class="sectionBody"><p class="muted">Global analytics and inference-assisted interpretation live here. Inference remains advisory and cannot directly mutate storage.</p></div></div>`}
async function renderProjectContent(p){let c=$('content');if(state.tab==='scope')return renderScope(p);if(state.tab==='index')return renderIndex(p);if(state.tab==='plan')return renderPlan(p);if(state.tab==='execute')return renderExecute(p);return renderInsights(p)}
async function renderScope(p){let c=$('content');c.innerHTML='<div class="empty">Loading scope…</div>';try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}`),src=d.sources||[];c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Source</h2><button class="btn" id="editSources">Assign source</button></div><div class="sectionBody"><div class="list">${src.map(s=>`<div class="row"><div><b>${esc(s.operator_label||s.normalized_path)}</b><small class="mono">${esc(s.normalized_path)}</small></div><span>${esc(s.preflight_status||'unknown')}</span></div>`).join('')||'<div class="empty">No sources assigned.</div>'}</div><div class="actions" style="margin-top:10px"><button id="preflight" class="btn">Run preflight</button></div></div></div><div class="section"><div class="sectionHead"><h2>Target & Backup</h2></div><div class="sectionBody"><div class="notice">Project-owned Target and Backup selectors are part of the governing architecture but are not fabricated in pre-base because the current backend still exposes them as global settings. Their backend contract must be corrected in a governed later stage before this UI writes them.</div></div></div>`;$('editSources').onclick=()=>openSourcePicker(p,src);$('preflight').onclick=async()=>{try{let x=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/preflight`);toast(x.ready?'Preflight ready':`${x.blocking_count} blocking issue(s)`);renderScope(p)}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderIndex(p){let c=$('content');c.innerHTML='<div class="empty">Loading index status…</div>';try{let s=await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`),r=s.run||{},pr=s.progress||{};c.innerHTML=`<div class="metrics"><div class="metric"><b>${Number(r.files_discovered||0).toLocaleString()}</b><span>Files discovered</span></div><div class="metric"><b>${Number(r.files_processed||0).toLocaleString()}</b><span>Files processed</span></div><div class="metric"><b>${bytes(r.bytes_processed||0)}</b><span>Bytes processed</span></div><div class="metric"><b>${esc(s.state||'NotStarted')}</b><span>Activity</span></div></div><div class="section"><div class="sectionHead"><h2>Index / Fingerprint</h2></div><div class="sectionBody"><div class="progress"><i style="width:${Number(pr.bytes_percent||0)}%"></i></div><p class="muted">${pct(pr.bytes_percent||0)} · ${esc(r.current_item||r.current_source||'Idle')}</p><div class="actions"><button class="btn primary" id="idxStart">Start / Continue</button><button class="btn" id="idxPause">Pause</button><button class="btn danger" id="idxStop">Stop</button></div></div></div>`;$('idxStart').onclick=()=>runAction(p.project_token,'continue');$('idxPause').onclick=()=>runAction(p.project_token,'pause');$('idxStop').onclick=()=>runAction(p.project_token,'stop')}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderPlan(p){let c=$('content');c.innerHTML='<div class="empty">Loading plan…</div>';try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`),items=d.items||[];c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Project Plan</h2><button id="generatePlan" class="btn primary">Generate current plan</button></div><div class="sectionBody"><p class="muted">State: ${esc(d.state||'none')} · evidence revision ${Number(d.evidence_revision||0)}</p><div class="list">${items.slice(0,100).map(i=>`<div class="row"><div><b>${esc(i.action||'action')}</b><small class="mono">${esc(i.source_path||i.content_sha256||'')}</small></div><span>${esc(i.state||'')}</span></div>`).join('')||'<div class="empty">No current plan.</div>'}</div></div></div>`;$('generatePlan').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Plan generated');renderPlan(p);load()}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderExecute(p){let c=$('content');c.innerHTML='<div class="empty">Loading execution state…</div>';try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`);let allowed=d.state==='draft';c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Execute</h2></div><div class="sectionBody"><p>Current plan: <b>${esc(d.state||'none')}</b></p><p class="muted">Execution remains deterministic and consumes the current plan contract exposed by the existing backend. Immutable revision hardening is governed in the architecture plan.</p><button id="execute" class="btn primary" ${allowed?'':'disabled'}>Execute current plan</button>${allowed?'':'<p class="muted">Generate a current draft plan before execution.</p>'}</div></div>`;if(allowed)$('execute').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started');load()}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderInsights(p){let c=$('content');c.innerHTML='<div class="empty">Loading findings…</div>';try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/review`);c.innerHTML=`<div class="metrics"><div class="metric"><b>${Number(d.files||0).toLocaleString()}</b><span>Files</span></div><div class="metric"><b>${bytes(d.bytes||0)}</b><span>Bytes</span></div><div class="metric"><b>${Number(d.unique_content||0).toLocaleString()}</b><span>Unique content</span></div><div class="metric"><b>${Number(d.duplicate_groups||0).toLocaleString()}</b><span>Duplicate groups</span></div></div><div class="section"><div class="sectionHead"><h2>Insights</h2></div><div class="sectionBody"><p class="muted">Deterministic findings are shown here. Venice/OpenRouter provider configuration is available from the gear for future advisory analysis; inference does not execute file operations.</p></div></div>`}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function runAction(token,action){try{let route=action==='continue'?'continue':action;await api(`/projects/${encodeURIComponent(token)}/fingerprint/${route}`,{method:'POST',body:'{}'});toast(`Index ${action} requested`);setTimeout(load,500)}catch(e){toast(e.message)}}
function openProjectMenu(token,anchor){let p=state.projects.find(x=>x.project_token===token);if(!p)return;let r=anchor.getBoundingClientRect(),root=$('contextRoot');root.innerHTML=`<div id="ctx" class="context" style="left:${Math.max(8,Math.min(innerWidth-220,r.right-210))}px;top:${Math.min(innerHeight-210,r.bottom+5)}px"><button id="renameProject">Rename</button><button id="reindexProject">Re-index</button><button id="deleteProject" class="danger">Delete project</button></div>`;$('renameProject').onclick=()=>{closeContext();renameProject(p)};$('reindexProject').onclick=()=>{closeContext();runAction(token,'restart')};$('deleteProject').onclick=async()=>{closeContext();if(!confirm(`Delete project “${p.project_name}”?`))return;try{await api(`/turn01/projects/${encodeURIComponent(token)}`,{method:'DELETE'});if(state.selected===token)state.selected='__sot__';toast('Project deleted');load()}catch(e){toast(e.message)}};setTimeout(()=>document.addEventListener('pointerdown',outsideContext,true),0)}
function outsideContext(e){if(!e.target.closest('#ctx'))closeContext()}function closeContext(){document.removeEventListener('pointerdown',outsideContext,true);$('contextRoot').innerHTML=''}
function renameProject(p){openModal('Rename project',`<div class="field"><label>Name</label><input id="renameInput" class="input" value="${esc(p.project_name)}"></div>`,`<button class="btn" data-close>Cancel</button><button id="saveRename" class="btn primary">Save</button>`);$('saveRename').onclick=async()=>{let name=$('renameInput').value.trim();if(!name)return;try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}`,{method:'PATCH',body:JSON.stringify({project_name:name})});closeModal();toast('Project renamed');load()}catch(e){toast(e.message)}}}
function openModal(title,body,foot){$('modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><div class="modalHead"><b>${esc(title)}</b></div><div class="modalBody">${body}</div><div class="modalFoot">${foot||'<button class="btn" data-close>Close</button>'}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(n=>n.onclick=closeModal)}function closeModal(){$('modalRoot').innerHTML=''}
function newProject(){openModal('New project',`<div class="field"><label>Project name</label><input id="newProjectName" class="input" placeholder="Project name"></div><p class="muted">Create the project first, then assign Source from its Scope tab.</p>`,`<button class="btn" data-close>Cancel</button><button id="createProject" class="btn primary">Create</button>`);$('createProject').onclick=async()=>{let name=$('newProjectName').value.trim();if(!name)return;try{let p=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name})});closeModal();state.selected=p.project_token;state.tab='scope';state.projectTab='scope';toast('Project created');load()}catch(e){toast(e.message)}}}
async function openSourcePicker(p,current){openModal('Assign source','<div id="pickerMount" class="empty">Loading volumes…</div>','<button class="btn" data-close>Cancel</button>');let staged=current.map(s=>s.normalized_path),root=$('pickerMount');async function browse(path='/'){try{let d=await api(`/fs?path=${encodeURIComponent(path)}`);let vols=(d.locations||[]).map(v=>`<button class="pickBtn" data-browse="${esc(v.path)}"><b>${esc(v.name)}</b><small>${esc(v.path)}</small></button>`).join('');let folders=(d.folders||[]).map(f=>`<div class="folderRow"><button data-browse="${esc(f.path)}">${esc(f.name)}</button><button class="use" data-use="${esc(f.path)}">Add</button></div>`).join('');root.className='';root.innerHTML=`<div class="picker"><div class="volumes">${vols||'<div class="empty">Choose parent/back from right pane.</div>'}</div><div class="folders"><div class="pathBar">${esc(d.path)}</div>${d.path!=='/'?`<div class="folderRow"><button data-browse="${esc(d.parent)}">..</button><button class="use" data-use="${esc(d.path)}">Add this folder</button></div>`:''}${folders||'<div class="empty">No folders.</div>'}</div></div><div class="section" style="margin-top:10px"><div class="sectionHead"><h2>Selected source folders</h2></div><div class="sectionBody"><div id="staged" class="list"></div></div></div><div class="actions"><button id="saveSources" class="btn primary">Save sources</button></div>`;function drawStaged(){$('staged').innerHTML=staged.map(x=>`<div class="row"><div class="mono">${esc(x)}</div><button class="btn" data-remove="${esc(x)}">Remove</button></div>`).join('')||'<div class="empty">None selected.</div>';document.querySelectorAll('[data-remove]').forEach(n=>n.onclick=()=>{staged=staged.filter(x=>x!==n.dataset.remove);drawStaged()})}drawStaged();document.querySelectorAll('[data-browse]').forEach(n=>n.onclick=()=>browse(n.dataset.browse));document.querySelectorAll('[data-use]').forEach(n=>n.onclick=()=>{if(!staged.includes(n.dataset.use))staged.push(n.dataset.use);drawStaged()});$('saveSources').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/sources`,{method:'PUT',body:JSON.stringify({sources:staged})});closeModal();toast('Sources saved');load()}catch(e){toast(e.message)}}}catch(e){root.className='errorBox';root.textContent=e.message}}browse('/')}
function openConfig(){let ven=localStorage.getItem('sot.veniceKey')||'',op=localStorage.getItem('sot.openrouterKey')||'';openModal('Configuration',`<div class="field"><label>Venice API key — browser local only</label><input id="veniceKey" class="input" type="password" value="${esc(ven)}" autocomplete="off"></div><div class="field"><label>OpenRouter API key — browser local only</label><input id="openrouterKey" class="input" type="password" value="${esc(op)}" autocomplete="off"></div><div class="notice">Provider credentials are never written to GitHub SOT or the centralized SOT database. Inference is advisory only.</div>`,`<button class="btn" data-close>Cancel</button><button id="saveConfig" class="btn primary">Save local keys</button>`);$('saveConfig').onclick=()=>{localStorage.setItem('sot.veniceKey',$('veniceKey').value.trim());localStorage.setItem('sot.openrouterKey',$('openrouterKey').value.trim());closeModal();toast('Provider keys saved locally')}}
async function load(){try{let [p,h,r,s]=await Promise.all([api('/projects'),api('/health'),api('/rollup'),api('/scheduler/status')]);state.projects=Array.isArray(p)?p:(p.projects||[]);state.health=h;state.rollup=r;state.scheduler=s;if(state.selected!=='__sot__'&&!state.projects.some(x=>x.project_token===state.selected))state.selected='__sot__';renderCards();renderWorkspace()}catch(e){$('cards').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`;$('content').innerHTML=`<div class="errorBox">SOT backend unavailable. ${esc(e.message)}</div>`}}
$('addProject').onclick=newProject;$('gear').onclick=openConfig;$('clearSearch').onclick=()=>{$('search').value='';state.query='';renderCards()};$('search').oninput=e=>{state.query=e.target.value;renderCards()};
load();setInterval(async()=>{try{let [p,r]=await Promise.all([api('/projects'),api('/rollup')]);state.projects=Array.isArray(p)?p:(p.projects||[]);state.rollup=r;renderCards();let psel=selectedProject();if(psel&&state.tab==='index')renderIndex(psel)}catch{}},3000);
</script>
</body>
