<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071019"><title>OnxyView v1.2.0</title><style>:root{--bg:#071019;--panel:#0b1621;--line:#263746;--text:#f4f7f9;--muted:#94a4b2;--accent:#78d2ff;--pos:#2a8f6a;--neu:#8b6b2b;--neg:#a74457}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:42px 34px 1fr}.top,.strip{display:flex;align-items:center;border-bottom:1px solid var(--line);background:#08121d}.top{gap:7px;padding:5px 7px}.brand{font-weight:900;font-size:15px}.brand small{font-size:9px;color:var(--muted)}.search{flex:1;max-width:760px;margin:auto;height:30px;border:1px solid #31506a;border-radius:999px;background:#0a1723;padding:0 12px;outline:0;font-size:11px}.status{font-size:9px;color:var(--muted)}.gear,.chip{border:1px solid var(--line);background:#102033}.gear{width:30px;height:30px;border-radius:8px}.strip{gap:5px;padding:4px 6px;overflow-x:auto}.chip{height:25px;border-radius:999px;padding:0 9px;font-size:9px;font-weight:800;white-space:nowrap}.stage{position:relative;min-height:0}.map{position:absolute;inset:0;background:#071019}.group{position:absolute;overflow:hidden;border:1px solid #071019;background:#0b1723}.glabel{position:absolute;z-index:5;left:4px;top:3px;max-width:calc(100% - 8px);border:0;border-radius:7px;background:#071019cc;color:#fff;padding:3px 6px;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.glabel small{color:var(--muted);margin-left:4px}.tile{position:absolute;border:1px solid #071019;overflow:hidden;padding:0;text-align:left;color:#fff;background:#284c5e}.tile .headline{position:absolute;inset:0;padding:5px 6px;font-weight:800;line-height:1.05;overflow:hidden;text-shadow:0 1px 2px #0009}.tile .meta{position:absolute;left:6px;right:6px;bottom:4px;font-size:8px;color:#eef7ffcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile.tiny .headline,.tile.tiny .meta{display:none}.tile.micro .meta{display:none}.tile.micro .headline{font-size:8px;padding:3px}.tile.small .headline{font-size:9px}.tile.medium .headline{font-size:11px}.tile.large .headline{font-size:14px}.tile.hero .headline{font-size:clamp(16px,2.2vw,28px);padding:9px 10px}.tier{position:absolute;right:4px;top:4px;border-radius:999px;background:#071019b8;padding:2px 5px;font-size:7px;text-transform:uppercase}.tier.major{color:#fff}.tier.significant{color:#d9ecf7}.tier.developing{color:#c9d6de}.tier.reported,.tier.background{display:none}.reader{position:absolute;z-index:20;right:6px;top:6px;bottom:6px;width:min(410px,34vw);border:1px solid #3a5a73;border-radius:14px;background:#0a1622f5;backdrop-filter:blur(18px);padding:12px;transform:translateX(calc(100% + 14px));transition:.16s;overflow:auto}.reader.open{transform:none}.rbar{display:flex;gap:4px}.rbar button{height:28px;border:1px solid var(--line);border-radius:8px;background:#102033}.reader h1{font-size:19px;line-height:1.12}.reader p{font-size:11px;color:#cad5dd}.source{display:block;padding:8px 0;border-top:1px solid #ffffff12;color:#dcecf5;text-decoration:none;font-size:10px}.tray{position:absolute;z-index:30;left:50%;top:0;transform:translate(-50%,-105%);width:min(760px,96vw);background:#091522f7;border:1px solid #355670;border-radius:0 0 14px 14px;padding:10px;transition:.15s}.tray.open{transform:translate(-50%,0)}.traygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.tray label{font-size:8px;color:var(--muted)}.tray select{width:100%;height:31px;margin-top:3px;background:#0f1e2d;border:1px solid var(--line);border-radius:8px}.loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}@media(max-width:700px){.app{grid-template-rows:39px 31px 1fr}.brand{font-size:13px}.brand small,.status{display:none}.search{font-size:10px}.strip{padding:3px 5px}.chip{height:24px;font-size:8px;padding:0 7px}.glabel{font-size:8px}.tile.small .headline{font-size:8px}.tile.medium .headline{font-size:9px}.tile.large .headline{font-size:11px}.tile.hero .headline{font-size:14px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(43vh,335px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.traygrid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><div class="brand">OnxyView <small>v1.2.0</small></div><input id="q" class="search" placeholder="Search events, #tags, #favorite, sources…"><div id="status" class="status">Starting…</div><button id="gear" class="gear">⚙</button></header><nav class="strip"><button id="openTray" class="chip">⌄</button><button id="gChip" class="chip"></button><button id="cChip" class="chip"></button><button id="sChip" class="chip"></button><button id="tierChip" class="chip"></button><button id="lChip" class="chip"></button></nav><main class="stage"><div id="map" class="map"></div><aside id="reader" class="reader"></aside><section id="tray" class="tray"><div class="traygrid"><label>GROUP<select id="group"><option value="subject">Subject</option><option value="region">Region</option><option value="sentiment">Sentiment</option><option value="editorialTier">Editorial tier</option><option value="corroboration">Corroboration</option></select></label><label>COLOR<select id="color"><option value="sentiment">Sentiment</option><option value="subject">Subject</option><option value="region">Region</option><option value="editorialTier">Editorial tier</option></select></label><label>SIZE<select id="size"><option value="importance">Importance</option><option value="sources">Independent sources</option><option value="recency">Recency</option></select></label><label>MIN TIER<select id="minTier"><option value="background">Background+</option><option value="reported">Reported+</option><option value="developing" selected>Developing+</option><option value="significant">Significant+</option><option value="major">Major only</option></select></label><label>LENS<select id="lens"><option value="All">All</option><option value="Core Global">Core Global</option><option value="Markets">Markets</option><option value="Technology">Technology</option><option value="US Spectrum">US Spectrum</option></select></label></div></section><div id="loading" class="loading">Building prioritized event map…</div></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id);let data={events:[],sourcePacks:{}},events=[];const state={group:'subject',color:'sentiment',size:'importance',minTier:'developing',lens:'All'};const tierRank={background:1,reported:2,developing:3,significant:4,major:5};const tierFactor={background:.35,reported:.55,developing:.9,significant:1.35,major:2.1};const SENT={positive:'#2a8f6a',neutral:'#8b6b2b',negative:'#a74457'};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function val(e,k){if(k==='corroboration'){let n=e.independentSourceCount||1;return n>=6?'6+ sources':n>=3?'3–5 sources':n===2?'2 sources':'1 source'}return e[k]||'Unknown'}function packNames(e){let out=[];for(const [n,srcs] of Object.entries(data.sourcePacks||{}))if((e.sources||[]).some(s=>srcs.includes(s)))out.push(n);return out}function passLens(e){return state.lens==='All'||packNames(e).includes(state.lens)}function weight(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,100-Math.min(99,(Date.now()-(e.lastSeen||0))/36e5));let tier=e.editorialTier||'reported';return Math.max(1,(e.importance||1)*(tierFactor[tier]||1))}function color(e){let v=val(e,state.color);if(state.color==='sentiment')return SENT[v]||SENT.neutral;if(state.color==='editorialTier')return {major:'#526f89',significant:'#476878',developing:'#3c5b68',reported:'#354a55',background:'#2c3940'}[v]||'#3b5360';let h=0;for(let c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 35% 38%)`}function text(e){return JSON.stringify([e.headline,e.subject,e.region,e.tags,e.sources]).toLowerCase()}function filtered(){let q=$('q').value.trim().toLowerCase();return events.filter(e=>(tierRank[e.editorialTier||'reported']||2)>=tierRank[state.minTier]&&passLens(e)&&(!q||text(e).includes(q.replace(/^#/,''))))}function sum(a,b){return a+b}function worst(R,w){if(!R.length)return Infinity;let s=R.reduce(sum,0),mx=Math.max(...R),mn=Math.min(...R),w2=w*w,s2=s*s;return Math.max(w2*mn/s2,s2/(w2*mx))}function layout(vals,{width,height}){let dims=[];if(!vals.length||width<=0||height<=0)return dims;let ratio=height/width,total=vals.reduce(sum,0),vw=Math.sqrt(total/ratio),vh=vw*ratio,scale=width/vw,horiz=width<height,row=[],cx=0,cy=0;vals.forEach((v,i,a)=>{let fixed=horiz?vw:vh,cur,add;if(i===a.length-1){let rem=horiz?vw-v/vh:vh-v/vw;cur=worst([v],Math.max(.0001,rem));add=worst([...row,v],fixed)}else{cur=worst(row,fixed);add=worst([...row,v],fixed)}if(add>cur)fin();row.push(v)});if(row.length)fin();return dims;function fin(){if(!row.length)return;let rv=row.reduce(sum,0),rw,rh,x=cx,y=cy;if(!horiz){rw=rv/vh;rh=vh;vw-=rw;cx+=rw}else{rw=vw;rh=rv/vw;vh-=rh;cy+=rh}for(let v of row){let w,h;if(!horiz){w=rw;h=v/rw}else{w=v/rh;h=rh}dims.push({left:x*scale,top:y*scale,width:w*scale,height:h*scale});if(!horiz)y+=h;else x+=w}horiz=!horiz;row=[]}}function render(){let vis=filtered(),groups={};for(let e of vis)(groups[val(e,state.group)]??=[]).push(e);let gs=Object.entries(groups).map(([name,items])=>({name,items:items.sort((a,b)=>weight(b)-weight(a)),weight:items.reduce((s,e)=>s+weight(e),0)})).sort((a,b)=>b.weight-a.weight),M=$('map'),W=M.clientWidth,H=M.clientHeight;M.innerHTML='';let gd=layout(gs.map(g=>g.weight),{width:W,height:H});gs.forEach((g,i)=>{let d=gd[i];if(!d)return;let box=document.createElement('section');box.className='group';Object.assign(box.style,{left:d.left+'px',top:d.top+'px',width:d.width+'px',height:d.height+'px'});box.innerHTML=`<button class="glabel">${esc(g.name)} <small>${g.items.length}</small></button>`;M.appendChild(box);let inner={left:0,top:0,width:d.width,height:d.height},ed=layout(g.items.map(weight),inner);g.items.forEach((e,j)=>{let r=ed[j];if(!r)return;let a=Math.max(0,r.width*r.height),cls=a<45?'tiny':a<120?'micro':a<420?'small':a<1300?'medium':a<4200?'large':'hero',b=document.createElement('button');b.className='tile '+cls;Object.assign(b.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:color(e)});b.innerHTML=`<span class="headline">${esc(e.headline)}</span><span class="meta">${esc(e.editorialTier||'reported')} · ${e.independentSourceCount||1} src · imp ${e.importance||0}</span><span class="tier ${esc(e.editorialTier||'reported')}">${esc(e.editorialTier||'reported')}</span>`;b.onclick=()=>openReader(e);box.appendChild(b)})});$('status').textContent=`${vis.length} prioritized events · ${data.articleCount||0} articles`;chips()}function chips(){$('gChip').textContent='Group '+state.group;$('cChip').textContent='Color '+state.color;$('sChip').textContent='Size '+state.size;$('tierChip').textContent='Tier '+state.minTier+'+';$('lChip').textContent='Lens '+state.lens}function openReader(e){let r=$('reader');r.innerHTML=`<div class="rbar"><button id="x">×</button><button id="tts">TTS</button></div><h1>${esc(e.headline)}</h1><p>${esc(e.editorialTier||'reported')} · importance ${e.importance||0} · ${e.independentSourceCount||1} independent sources</p>${(e.tags||[]).map(t=>`<span style="font-size:9px;color:#8fdcff;margin-right:5px">${esc(t)}</span>`).join('')}<p></p>${(e.articles||[]).slice(0,15).map(a=>a.url?`<a class="source" target="_blank" rel="noopener" href="${esc(a.url)}">${esc(a.source||'Source')} — ${esc(a.title||'Open report')}</a>`:'').join('')}`;r.classList.add('open');$('x').onclick=()=>r.classList.remove('open');$('tts').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(e.headline))}}async function boot(){try{let j=await fetch('./onxyview-event-cache.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json());data=j;events=j.events||[];$('loading').remove();render()}catch(e){$('loading').textContent='Event cache unavailable · '+e.message}}$('openTray').onclick=$('gear').onclick=()=>$('tray').classList.toggle('open');for(let k of ['group','color','size'])$(k).onchange=e=>{state[k]=e.target.value;render()};$('minTier').onchange=e=>{state.minTier=e.target.value;render()};$('lens').onchange=e=>{state.lens=e.target.value;render()};$('q').oninput=()=>{clearTimeout(window.qt);window.qt=setTimeout(render,100)};addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(render,120)});boot()})();</script></body></html>
