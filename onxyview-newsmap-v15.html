ettings.open{display:block}.settings h3{font-size:12px;margin:0 0 8px}.settings label{display:block;font-size:8px;color:var(--muted);margin:8px 0 3px}.settings select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#0f1e2d}@media(max-width:700px){.app{grid-template-rows:39px auto 1fr}.brand{font-size:13px}.brand small,.status{display:none}.top{padding:4px 5px;gap:4px}.search{height:29px;font-size:10px}.icon{width:29px;height:29px}.controls{grid-template-columns:1fr 1fr}.controls.open{max-height:150px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(48vh,375px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.reader h1{font-size:16px}.digest{font-size:11px}}</style></head><body><div class="app"><header class="top"><div class="brand">OnxyView <small>v1.5.0</small></div><input id="q" class="search" autocomplete="off" placeholder="Search events, #tags, #favorite, sources…"><div id="status" class="status">Opening cache…</div><button id="gear" class="icon" aria-label="Settings">⚙</button></header><section class="dimbar"><div class="summary"><button id="chev" class="chev">⌄</button><button class="chip">Group <b id="gNow">Subject</b></button><button class="chip">Color <b id="cNow">Sentiment</b></button><button class="chip">Size <b id="sNow">Importance</b></button><button class="chip">Lens <b id="lNow">All</b></button></div><div id="controls" class="controls"><div class="control"><label>Group</label><select id="group"><option value="subject">Subject</option><option value="region">Region</option><option value="sentiment">Sentiment</option><option value="editorialTier">Significance</option><option value="corroboration">Corroboration</option></select></div><div class="control"><label>Color</label><select id="color"><option value="sentiment">Sentiment</option><option value="subject">Subject</option><option value="region">Region</option><option value="editorialTier">Significance</option></select></div><div c '&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clean(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}function val(e,k){if(k==='corroboration'){let n=e.independentSourceCount||1;return n>=6?'6+ sources':n>=3?'3–5 sources':n===2?'2 sources':'1 source'}return e[k]||'Unknown'}function packs(e){return e.sourcePacks||[]}function weight(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,100-Math.min(99,(Date.now()-(e.lastSeen||0))/36e5));return Math.max(1,(e.importance||1)*(factor[e.editorialTier||'reported']||1))}function color(e){let v=val(e,state.color);if(state.color==='sentiment')return SENT[v]||SENT.neutral;if(state.color==='editorialTier')return {major:'#526f86',significant:'#496777',developing:'#3d5b68',reported:'#344a55',background:'#2b3940'}[v]||'#3b5360';let h=0;for(let c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 34% 38%)`}function searchable(e){return JSON.stringify([e.headline,e.summary,e.subject,e.region,e.tags,e.sources,(e.articles||[]).map(a=>[a.title,a.description,a.source])]).toLowerCase()}function filtered(){let q=$('q').value.trim().toLowerCase(),cut=Date.now()-state.hours*36e5;return events.filter(e=>(rank[e.editorialTier||'reported']||2)>=rank[state.minTier]&&(e.lastSeen||0)>=cut&&(state.lens==='All'||packs(e).includes(state.lens))&&(!q||(q==='#favorite'?fav.has(e.eventId):searchable(e).includes(q.replace(/^#/,''))))}function sum(a,b){return a+b}function worst(R,w){if(!R.length)return Infinity;let s=R.reduce(sum,0),mx=Math.max(...R),mn=Math.min(...R),w2=w*w,s2=s*s;return Math.max(w2*mn/s2,s2/(w2*mx))}function layout(vals,width,height){let out=[];if(!vals.length||width<=0||height<=0)return out;let total=vals.reduce(sum,0),ratio=height/width,vw=Math.sqrt(total/ratio),vh=vw*ratio,scale=width/vw,horiz=width<height,row=[],cx=0,cy=0;vals.forEach((v,i,a)=>{let fixed=horiz?vw:vh,cur,add;if(i===a.length-1){let rem=horiz?vw-v/vh:vh-v/vw;cur=worst([v],Math.max(.0001,rem));add=worst([...row,v],fixed)}else{cur=worst(row,fixed);add=worst([...row,v],fixed)}if(add>cur)fin();row.push(v)});if(row.length)fin();return out;function fin(){if(!row.length)return;let rv=row.reduce(sum,0),rw,rh,x=cx,y=cy;if(!horiz){rw=rv/vh;rh=vh;vw-=rw;cx+=rw}else{rw=vw;rh=rv/vw;vh-=rh;cy+=rh}for(let v of row){let w,h;if(!horiz){w=rw;h=v/rw}else{w=v/rh;h=rh}out.push({x:x*scale,y:y*scale,w:w*scale,h:h*scale});if(!horiz)y+=h;else x+=w}horiz=!horiz;row=[]}}}function resize(){let r=C.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);C.width=Math.max(1,Math.floor(r.width*d));C.height=Math.max(1,Math.floor(r.height*d));ctx.setTransform(d,0,0,d,0,0);draw()}function wrap(t,x,y,w,h,fs){ctx.font=`800 ${fs}px system-ui`;ctx.fillStyle='#fff';ctx.textBaseline='top';let words=String(t||'').split(/\s+/),line='',yy=y,lh=fs*1.13,max=Math.max(1,Math.floor(h/lh));for(let i=0,l=0;i<words.length&&l<max;i++){let test=line?line+' '+words[i]:words[i];if(ctx.measureText(test).width>w&&line){ctx.fillText(line,x,yy);yy+=lh;l++;line=words[i]}else line=test}if(yy<y+h-lh/2)ctx.fillText(line,x,yy)}function draw(){let W=C.clientWidth,H=C.clientHeight;if(!W||!H)return;ctx.fillStyle='#071019';ctx.fillRect(0,0,W,H);visible=filtered();if(!visible.length){ctx.fillStyle='#94a4b2';ctx.font='12px system-ui';ctx.fillText(events.length?'No events match this view.':'No cached events available.',18,24);hits=[];return}let gm=new Map;for(let e of visible){let k=val(e,state.group);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(e)}let gs=[...gm].map(([name,items])=>({name,items:items.sort((a,b)=>weight(b)-weight(a)),weight:items.reduce((s,e)=>s+weight(e),0)})).sort((a,b)=>b.weight-a.weight),gd=layout(gs.map(g=>g.weight),W,H);hits=[];gs.forEach((g,i)=>{let gr=gd[i];if(!gr)return;let ed=layout(g.items.map(weight),gr.w,gr.h);g.items.forEach((e,j)=>{let r=ed[j];if(!r)return;let x=gr.x+r.x,y=gr.y+r.y,w=r.w,h=r.h;ctx.fillStyle=color(e);ctx.fillRect(x,y,w,h);ctx.strokeStyle='#071019';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);let area=w*h;if(area>620&&w>66&&h>30){ctx.fillStyle='rgba(0,0,0,.16)';ctx.fillRect(x,y,w,h);wrap(e.headline,x+5,y+5,w-10,h-10,area>7000?17:area>2800?13:10)}hits.push({x,y,w,h,e})});if(gr.w>64&&gr.h>22){let label=`${g.name}  ${g.items.length}`;ctx.font='800 9px system-ui';let tw=Math.min(gr.w-6,ctx.measureText(label).width+10);ctx.fillStyle='rgba(7,16,25,.86)';ctx.fillRect(gr.x+3,gr.y+3,tw,18);ctx.fillStyle='#fff';ctx.fillText(label,gr.x+8,gr.y+7)}});$('status').textContent=`${visible.length} events · ${data.articleCount||0} articles`;chips()}function chips(){$('gNow').textContent=$('group').selectedOptions[0].text;$('cNow').textContent=$('color').selectedOptions[0].text;$('sNow').textContent=$('size').selectedOptions[0].text;$('lNow').textContent=state.lens}function openReader(e){current=visible.findIndex(x=>x.eventId===e.eventId);let arts=e.articles||[],digest=clean(e.summary)||clean(arts[0]?.description)||'No publisher summary available.';$('reader').innerHTML=`<div class="rhead"><button class="rbtn" id="prev">‹</button><button class="rbtn" id="next">›</button><button class="rbtn" id="tts" aria-label="Read aloud">◖</button><button class="rbtn" id="fav">${fav.has(e.eventId)?'★':'☆'}</button><span class="spacer"></span><button class="rbtn" id="close">×</button></div><div class="rbody"><h1>${esc(e.headline)}</h1><p class="digest">${esc(digest)}</p><div class="eventmeta">${e.independentSourceCount||1} independent sources · importance ${e.importance||0}</div><div class="tags">${(e.tags||[]).slice(0,10).map(t=>`<button class="tag" data-tag="${esc(t)}">#${esc(String(t).replace(/^#/,''))}</button>`).join('')}</div><div class="coverage">Coverage</div>${arts.length?arts.map(a=>{let href=a.link||a.url||'';return href?`<a class="source" href="${esc(href)}" target="_blank" rel="noopener"><b>${esc(a.source||'Source')}</b><span class="stitle">${esc(a.title||'Open report')}</span>${a.description?`<span class="sdesc">${esc(clean(a.description))}</span>`:''}<span class="open">Open original ↗</span></a>`:''}).join(''):'<div class="eventmeta">No publisher links available for this event.</div>'}</div>`;$('reader').classList.add('open');$('close').onclick=()=>$('reader').classList.remove('open');$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('tts').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(`${e.headline}. ${digest}`))};$('fav').onclick=()=>{fav.has(e.eventId)?fav.delete(e.eventId):fav.add(e.eventId);localStorage.setItem(FKEY,JSON.stringify([...fav]));openReader(e)};document.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.tag;draw()})}function nav(d){if(!visible.length)return;current=(current+d+visible.length)%visible.length;openReader(visible[current])}C.addEventListener('click',ev=>{let r=C.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;for(let i=hits.length-1;i>=0;i--){let h=hits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){openReader(h.e);break}}});function idbOpen(){return new Promise((res,rej)=>{let q=indexedDB.open('onxyview-cache',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function cacheGet(){try{let db=await idbOpen();return await new Promise((res,rej)=>{let tx=db.transaction('kv','readonly'),q=tx.objectStore('kv').get('event-index');q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch{return null}}async function cachePut(v){try{let db=await idbOpen();await new Promise((res,rej)=>{let tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,'event-index');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch{}}function apply(j,label){if(!j||!Array.isArray(j.events))return false;data=j;events=j.events;$('notice').hidden=true;$('status').textContent=`${label} · ${events.length} events`;resize();return true}async function network(){let ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),7000);try{le
