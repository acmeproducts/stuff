<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT · Storage Reconciliation</title><style>
:root{color-scheme:dark;--bg:#071019;--panel:#0d1823;--panel2:#101f2c;--line:#243646;--text:#eef5fa;--muted:#8fa5b5;--blue:#318bd1;--green:#1f8a62;--amber:#c58b2a;--red:#c85858}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.top{height:54px;display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08131d;z-index:10}.brand{font-weight:900;font-size:18px}.top input{flex:1;background:#0d1a26;border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:8px}.btn{border:1px solid #345069;background:#172a3b;color:var(--text);padding:8px 11px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary{background:var(--blue);border-color:#55a5e3}.btn:disabled{opacity:.45;cursor:not-allowed}.shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 54px)}aside{border-right:1px solid var(--line);background:#09141e;padding:12px}.eyebrow{text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:10px;font-weight:800}.estate{padding:8px 4px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}.estate strong{font-size:22px;display:block;margin-top:3px}.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.mini div{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)}.mini b{display:block;font-size:16px}.project{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;margin:5px 0;cursor:pointer}.project.active{border-left:4px solid var(--blue);background:#13263a}.project b{display:block;font-size:15px}.project small{color:var(--muted)}.state{font-weight:800;margin-top:6px}.state.good{color:#75d7a9}.state.warn{color:#f0bd65}.main{padding:22px;max-width:1180px;width:100%;margin:auto}.hero h1{margin:0 0 5px;font-size:28px}.hero p{color:var(--muted);margin:0 0 18px}.flow{display:grid;grid-template-columns:1fr 52px 1fr 52px 1fr;align-items:stretch}.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}.box .big{font-size:27px;font-weight:900;margin:5px 0}.arrow{display:grid;place-items:center;color:#5d829e;font-size:28px}.bar{height:9px;background:#1b2c39;border-radius:8px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.metric b{display:block;font-size:20px;margin:4px 0}.section{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}.section h2{font-size:16px;margin:0;padding:13px 15px;border-bottom:1px solid var(--line)}.inside{padding:14px}.attention{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #1d3040}.attention:last-child{border:0}.attention .why{flex:1}.attention b{display:block}.muted{color:var(--muted)}.projectHero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.projectHero h1{margin:0}.summary{font-size:18px;font-weight:800;margin-top:6px}.coverage{display:grid;grid-template-columns:1fr 42px 1fr 42px 1fr;margin-top:15px}.cov{border:1px solid var(--line);background:var(--panel2);padding:14px;border-radius:10px}.cov b{display:block;font-size:21px;margin:4px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.callout{background:#102c40;border:1px solid #2f6e98;border-radius:10px;padding:14px;margin-top:12px}.callout b{font-size:18px;display:block}.source{padding:7px 0;border-bottom:1px solid #1d3040;word-break:break-all}.advanced summary{padding:13px 15px;font-weight:800;cursor:pointer}.advanced .inside{border-top:1px solid var(--line)}dialog{width:min(920px,96vw);background:#0b1722;color:var(--text);border:1px solid #36526a;border-radius:12px;padding:0}dialog::backdrop{background:#000a}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.picker{display:grid;grid-template-columns:180px 1fr 1fr;min-height:420px}.pane{border-right:1px solid var(--line);padding:8px}.pick,.folder{display:flex;width:100%;gap:8px;align-items:center;padding:8px;background:none;border:0;color:var(--text);text-align:left}.folder button:first-child{flex:1;text-align:left}.error{color:#ffaaaa;padding:8px}.toast{position:fixed;right:15px;bottom:15px;background:#17344a;border:1px solid #3f7598;padding:10px 14px;border-radius:9px;display:none;z-index:30}@media(max-width:800px){.shell{grid-template-columns:220px 1fr}.main{padding:12px}.cards{grid-template-columns:1fr 1fr}.flow,.coverage{grid-template-columns:1fr}.arrow{height:32px;transform:rotate(90deg)}.picker{grid-template-columns:1fr}.pane{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body><header class="top"><div class="brand">SSOT</div><input id="search" placeholder="Find a project"><button class="btn" id="home">Storage estate</button><button class="btn" id="refresh">↻</button></header><div class="shell"><aside><div class="estate"><div class="eyebrow">single source of truth</div><strong id="estateBytes">—</strong><span class="muted">unique physical content</span><div class="mini"><div><b id="protectedBytes">—</b><small>fully protected</small></div><div><b id="sharedBytes">—</b><small>shared by projects</small></div><div><b id="needsBytes">—</b><small>needs copies</small></div><div><b id="unknownCount">—</b><small>projects unknown</small></div></div></div><div class="eyebrow">projects · views into SSOT</div><div id="projects"></div></aside><main class="main" id="main"><div class="muted">Loading storage truth…</div></main></div><dialog id="modal"><div class="modalHead"><b id="modalTitle"></b><button class="btn" id="modalClose">Close</button></div><div id="modalBody"></div></dialog><div class="toast" id="toast"></div><script>
const BUILD='SOT-turn01-base-r8-global-reconciliation';const API='/report/api/sot';const $=id=>document.getElementById(id);const state={ssot:null,selected:null,details:{},volumes:[],query:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(n){n=Number(n||0);if(!n)return '0 B';let u=['B','KB','MB','GB','TB','PB'],i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return `${(n/1024**i).toFixed(i>2?2:1)} ${u[i]}`}
async function api(path,opt={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opt});let x=await r.json().catch(()=>({}));if(!r.ok)throw new Error(x.error||`HTTP ${r.status}`);return x}
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function condition(p){if(p.condition==='protected')return ['Storage protected','good'];if(p.condition==='needs_copy')return ['Needs another safe copy','warn'];if(p.condition==='needs_sources')return ['Needs sources','warn'];return ['Needs scan','warn']}
function renderRail(){let s=state.ssot,g=s.global,need=Math.max(Number(g.missing_copy_a_bytes||0),Number(g.missing_copy_b_bytes||0));$('estateBytes').textContent=bytes(g.unique_bytes);$('protectedBytes').textContent=bytes(g.protected_bytes);$('sharedBytes').textContent=bytes(g.shared_bytes);$('needsBytes').textContent=bytes(need);$('unknownCount').textContent=s.unknown_projects;let q=state.query.toLowerCase();$('projects').innerHTML=s.projects.filter(p=>!q||p.project_name.toLowerCase().includes(q)).map(p=>{let [label,cls]=condition(p);return `<button class="project ${state.selected===p.project_token?'active':''}" data-p="${esc(p.project_token)}"><b>${esc(p.project_name)}</b><small>${bytes(p.logical_bytes)} · ${p.unique_content} unique items</small><div class="state ${cls}">${label}</div><small>${bytes(p.project_only_bytes)} unique here · ${bytes(p.shared_bytes)} shared</small></button>`}).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>selectProject(b.dataset.p))}
function renderHome(){state.selected=null;localStorage.removeItem('sot.r8.project');renderRail();let s=state.ssot,g=s.global,needA=Number(g.missing_copy_a_bytes||0),needB=Number(g.missing_copy_b_bytes||0),pct=g.unique_bytes?Math.round(g.protected_bytes/g.unique_bytes*100):0;let attention=s.projects.filter(p=>p.condition!=='protected');$('main').innerHTML=`<div class="hero"><h1>Your storage</h1><p>One deduplicated view across every project. The same file is counted once no matter how many projects reference it.</p></div><div class="flow"><div class="box"><div class="eyebrow">unique source content</div><div class="big">${bytes(g.unique_bytes)}</div><div>${g.unique_content} fingerprinted items</div><div class="muted">${bytes(g.shared_bytes)} belongs to more than one project</div></div><div class="arrow">→</div><div class="box"><div class="eyebrow">safe copy a</div><div class="big">${bytes(Math.max(0,g.unique_bytes-needA))}</div><div>${bytes(needA)} still missing</div></div><div class="arrow">→</div><div class="box"><div class="eyebrow">safe copy b</div><div class="big">${bytes(Math.max(0,g.unique_bytes-needB))}</div><div>${bytes(needB)} still missing</div></div></div><div class="cards"><div class="metric"><span class="eyebrow">fully protected</span><b>${bytes(g.protected_bytes)}</b><span>${pct}% of known content</span><div class="bar"><span style="width:${pct}%"></span></div></div><div class="metric"><span class="eyebrow">needs copy a</span><b>${bytes(needA)}</b><span>${g.missing_copy_a_content} items</span></div><div class="metric"><span class="eyebrow">needs copy b</span><b>${bytes(needB)}</b><span>${g.missing_copy_b_content} items</span></div><div class="metric"><span class="eyebrow">unknown</span><b>${s.unknown_projects}</b><span>projects need sources or scan</span></div></div><section class="section"><h2>What needs attention</h2><div class="inside">${attention.length?attention.map(p=>attentionRow(p)).join(''):'<b>All known content has the required verified copies.</b>'}</div></section><section class="section"><h2>Why SSOT matters</h2><div class="inside"><b>${bytes(g.shared_bytes)} is shared between projects.</b><div class="muted">SSOT counts those physical bytes once. Projects are membership views, not separate copies of the same storage.</div></div></section>`}
function attentionRow(p){let [label]=condition(p),action=p.condition==='needs_sources'?'Choose sources':p.condition==='needs_scan'?'Scan project':'Open project';return `<div class="attention"><div class="why"><b>${esc(p.project_name)} · ${label}</b><span class="muted">${bytes(p.logical_bytes)} known · ${bytes(p.shared_bytes)} shared with other projects</span></div><button class="btn primary" onclick="selectProject('${esc(p.project_token)}')">${action}</button></div>`}
async function selectProject(token){state.selected=token;localStorage.setItem('sot.r8.project',token);renderRail();renderProject();try{let [d,sources,review,plan]=await Promise.all([api(`/turn01/projects/${encodeURIComponent(token)}`),api(`/turn01/projects/${encodeURIComponent(token)}/sources`),api(`/turn01/projects/${encodeURIComponent(token)}/review`).catch(()=>({})),api(`/turn01/projects/${encodeURIComponent(token)}/plan`).catch(()=>({state:'none'}))]);state.details[token]={d,sources:sources.sources||[],review,plan};if(state.selected===token)renderProject()}catch(e){toast(e.message)}}
function renderProject(){let p=state.ssot.projects.find(x=>x.project_token===state.selected);if(!p)return renderHome();let x=state.details[p.project_token]||{},sources=x.sources||[],known=p.logical_bytes,protectedB=p.protected_bytes,need=Math.max(p.missing_copy_a_bytes,p.missing_copy_b_bytes),[label,cls]=condition(p);let action=p.condition==='needs_sources'?`<button class="btn primary" onclick="chooseSources('${esc(p.project_token)}')">Choose sources</button>`:p.condition==='needs_scan'?`<button class="btn primary" onclick="startScan('${esc(p.project_token)}')">Scan now</button>`:p.condition==='needs_copy'?`<button class="btn primary" onclick="protect('${esc(p.project_token)}')">Protect missing content</button>`:'<span class="state good">No storage action required</span>';$('main').innerHTML=`<div class="projectHero"><div><div class="eyebrow">project view into ssot</div><h1>${esc(p.project_name)}</h1><div class="summary ${cls}">${label}</div></div>${action}</div><div class="coverage"><div class="cov"><span class="eyebrow">source content</span><b>${bytes(known)}</b><span>${p.unique_content} unique fingerprinted items</span><div class="muted">${bytes(p.project_only_bytes)} only here · ${bytes(p.shared_bytes)} shared</div></div><div class="arrow">→</div><div class="cov"><span class="eyebrow">safe copy a</span><b>${bytes(Math.max(0,known-p.missing_copy_a_bytes))}</b><span>${bytes(p.missing_copy_a_bytes)} missing</span></div><div class="arrow">→</div><div class="cov"><span class="eyebrow">safe copy b</span><b>${bytes(Math.max(0,known-p.missing_copy_b_bytes))}</b><span>${bytes(p.missing_copy_b_bytes)} missing</span></div></div><div class="callout"><b>${p.condition==='protected'?'This project is covered.':p.condition==='needs_copy'?`${bytes(need)} still needs protection.`:p.condition==='needs_sources'?'Tell SOT what belongs to this project.':'SOT does not yet have enough current evidence to judge this project.'}</b><span>${p.condition==='protected'?`${bytes(protectedB)} has both verified copies.`:p.headline}</span></div><div class="split"><section class="section"><h2>Project membership</h2><div class="inside">${sources.length?sources.map(s=>`<div class="source">${esc(s.normalized_path)}</div>`).join(''):'<div class="muted">No source locations defined.</div>'}<div style="margin-top:10px"><button class="btn" onclick="chooseSources('${esc(p.project_token)}')">Edit sources</button></div></div></section><section class="section"><h2>Physical overlap</h2><div class="inside"><b>${bytes(p.project_only_bytes)} unique to this project</b><p class="muted">${bytes(p.shared_bytes)} is also referenced by other projects and is not counted twice in SSOT.</p></div></section></div><details class="section advanced"><summary>Advanced / diagnostics</summary><div class="inside"><div>Committed evidence revision: ${p.evidence_revision||0}</div><div>Internal lifecycle: ${esc(p.lifecycle_state||'')}</div><div>Latest operation: ${esc(p.operation?.kind||'none')} ${esc(p.operation?.state||'')}</div><div>Plan: ${esc(x.plan?.state||'not loaded')}</div>${p.operation&&['running','paused','queued'].includes(p.operation.state)?`<p><button class="btn" onclick="op('${esc(p.project_token)}','pause')">Pause</button> <button class="btn" onclick="op('${esc(p.project_token)}','stop')">Stop</button></p>`:''}</div></details>`}
async function startScan(t){try{await api(`/projects/${encodeURIComponent(t)}/fingerprint/start`,{method:'POST',body:'{}'});toast('Scan started');await refresh()}catch(e){toast(e.message)}}
async function op(t,a){try{await api(`/projects/${encodeURIComponent(t)}/fingerprint/${a}`,{method:'POST',body:'{}'});await refresh()}catch(e){toast(e.message)}}
async function protect(t){try{let plan=await api(`/turn01/projects/${encodeURIComponent(t)}/plan`,{method:'POST',body:'{}'});toast(`Protection plan: ${plan.totals?.items||'ready'} items`);if(confirm('Start verified copy work now?')){await api(`/turn01/projects/${encodeURIComponent(t)}/execute`,{method:'POST',body:'{}'});toast('Protection started')}await refresh()}catch(e){toast(e.message)}}
async function chooseSources(t){let current=(state.details[t]?.sources||[]).map(x=>x.normalized_path);await picker('Choose project sources',current,true,async selected=>{await api(`/turn01/projects/${encodeURIComponent(t)}/sources`,{method:'PUT',body:JSON.stringify({sources:selected})});toast('Sources saved');$('modal').close();await selectProject(t);await refresh()})}
async function picker(title,selected,multi,onSave){$('modalTitle').textContent=title;$('modal').showModal();let root=$('modalBody'),vols=state.volumes;if(!vols.length){let v=await api('/turn01/volumes');vols=v.volumes||[];state.volumes=vols}let current=selected[0]||vols[0]?.path||'';async function browse(path){current=path;let d=await api(`/turn01/fs?path=${encodeURIComponent(path)}`);root.innerHTML=`<div class="picker"><div class="pane"><div class="eyebrow">volumes</div>${vols.map(v=>`<button class="pick" data-v="${esc(v.path)}">${esc(v.name||v.path)}<br><small>${bytes(v.free_bytes)} free</small></button>`).join('')}</div><div class="pane"><div class="eyebrow">folders · ${esc(d.path)}</div>${d.parent?`<div class="folder"><button class="btn" data-b="${esc(d.parent)}">..</button></div>`:''}${(d.folders||[]).map(f=>`<div class="folder"><button class="btn" data-b="${esc(f.path)}">${esc(f.name)}</button><button class="btn" data-u="${esc(f.path)}">Use</button></div>`).join('')}</div><div class="pane"><div class="eyebrow">selected</div>${selected.map(s=>`<div class="source">${esc(s)} <button class="btn" data-r="${esc(s)}">×</button></div>`).join('')||'<p class="muted">Nothing selected</p>'}<button id="pickerSave" class="btn primary" ${selected.length?'':'disabled'}>Save</button></div></div>`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>browse(b.dataset.v));document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>browse(b.dataset.b));document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{let v=b.dataset.u;if(multi){if(!selected.includes(v))selected.push(v)}else selected=[v];browse(current)});document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{selected=selected.filter(x=>x!==b.dataset.r);browse(current)});$('pickerSave').onclick=()=>onSave(selected)}if(current)await browse(current);else root.innerHTML='<p class="error">No storage volumes available.</p>'}
async function refresh(){try{let s=await api('/turn01/ssot');state.ssot=s;renderRail();if(state.selected)renderProject();else renderHome()}catch(e){$('main').innerHTML=`<div class="error">Cannot read SSOT: ${esc(e.message)}</div>`}}
$('home').onclick=renderHome;$('refresh').onclick=refresh;$('modalClose').onclick=()=>$('modal').close();$('search').oninput=e=>{state.query=e.target.value;renderRail()};(async()=>{await refresh();let saved=localStorage.getItem('sot.r8.project');if(saved&&state.ssot.projects.some(p=>p.project_token===saved))selectProject(saved)})();setInterval(async()=>{if($('modal').open)return;try{state.ssot=await api('/turn01/ssot');renderRail();if(state.selected){let p=state.ssot.projects.find(x=>x.project_token===state.selected);if(p){let main=$('main');main.querySelector('.summary')?.replaceChildren(document.createTextNode(condition(p)[0]))}}}catch{}},4000);
</script></body></html>
