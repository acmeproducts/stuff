<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market View — Five View Chart Acceptance</title><style>:root{color-scheme:dark;--bg:#07101c;--p:#0e1929;--p2:#091422;--line:#263a55;--text:#edf5ff;--muted:#8ea2bb;--accent:#78b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.top{padding:14px 16px;border-bottom:1px solid var(--line)}.top b{font-size:18px}.top small,.muted{color:var(--muted)}.top small{display:block}.wrap{max-width:1500px;margin:auto;padding:12px}.toolbar,.views,.horizons,.chips,.mode{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:10px}button{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:8px 10px;border-radius:8px}button.active{border-color:var(--accent);background:#132b46}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:12px}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0}.chartbox{height:58vh;min-height:360px}.chartbox canvas{width:100%;height:100%;display:block}.chips{margin:8px 0}.chips button.off{opacity:.35}.meta{border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:12px}.notice{border:1px solid #6b3030;background:#211011;color:#ffb2b2;padding:12px;border-radius:9px}.picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}.picker label{border:1px solid var(--line);padding:7px;border-radius:7px}.readout{font-size:12px;text-align:right}@media(max-width:850px){.grid{grid-template-columns:1fr}.chartbox{height:52vh;min-height:330px}}@media(max-width:520px){.picker{grid-template-columns:1fr}.chartbox{height:48vh;min-height:300px}}</style></head><body><header class="top"><b>Market View — Five View Chart Acceptance</b><small>One engine · real canonical evidence · V1/V2 fail closed until derived-index contract exists</small></header><main class="wrap"><div class="toolbar"><div class="views" id="views"></div><span id="status">Loading canonical evidence…</span></div><div class="toolbar"><div class="horizons" id="horizons"></div><div class="mode" id="modes"></div></div><div class="grid"><section class="card"><div class="head"><div><h2 id="title"></h2><div class="muted" id="subtitle"></div></div><div class="readout" id="readout"></div></div><div class="chips" id="legend"></div><div class="chartbox"><canvas id="chart"></canvas></div><div class="meta" id="meta"></div></section><aside class="card" id="side"></aside></div></main><script>'use strict';const BASE='https://acmeproducts.github.io/stuff/',H=['1D','5D','1M','YTD','1Y','3Y','5Y'],C=['#78b9ff','#f4c15d','#ef7373','#74d69b','#c399ff','#f59e8b','#68d6d3'],D=['vix','hySpread','spy','qqq','tenYear','wti','cpi'],S={view:3,h:'5D',mode:'indexed',selected:new Set(['vix']),catalog:null,series:new Map()},$=s=>document.querySelector(s);function controls(){$('#views').innerHTML=[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${S.view===v?'active':''}">V${v} ${['','Market','Index','Component','Multi-series','Explore'][v]}</button>`).join('');$('#horizons').innerHTML=H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.v;if(S.view===3)S.selected=new Set(['vix']);if(S.view===4&&S.selected.size<2)S.selected=new Set(D);render()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;render()})}function cutoff(h,last){let d=new Date(last),x=new Date(d);if(h==='1D')x.setDate(x.getDate()-1);if(h==='5D')x.setDate(x.getDate()-8);if(h==='1M')x.setMonth(x.getMonth()-1);if(h==='YTD')x=new Date(d.getFullYear(),0,1);if(h==='1Y')x.setFullYear(x.getFullYear()-1);if(h==='3Y')x.setFullYear(x.getFullYear()-3);if(h==='5Y')x.setFullYear(x.getFullYear()-5);return +x}function data(id){let s=S.series.get(id);if(!s)return[];let last=s.observations.at(-1)?.t||Date.now();return s.observations.filter(p=>p.t>=cutoff(S.h,last))}function idx(a){if(!a.length)return a;let b=a[0].v;return a.map(p=>({t:p.t,v:100*p.v/b,raw:p.v}))}function fmt(v){return Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(v):'—'}function clear(){let c=$('#chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height)}function fail(name){$('#title').textContent=`V${S.view} — ${name}`;$('#subtitle').textContent='Derived analytical index contract required';$('#legend').innerHTML='';$('#meta').textContent='No synthetic or historical weighted index substituted.';$('#readout').textContent='';$('#side').innerHTML='<div class="notice"><b>Intentionally unavailable</b><p>Canonical source evidence exists, but Risk / Growth / Macro component membership, sign orientation, normalization and aggregation are not yet persisted as a canonical reproducible contract. This artifact refuses to invent them.</p></div><p class="muted">Once defined, this same chart engine renders V1 and V2.</p>';clear()}function render(){controls();if(S.view===1)return fail('Market');if(S.view===2)return fail('Index');$('#modes').innerHTML=S.view===5?`<button data-m="native2" class="${S.mode==='native2'?'active':''}">Native dual-axis</button><button data-m="indexed" class="${S.mode==='indexed'?'active':''}">Indexed 100</button>`:'';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;if(S.mode==='native2')S.selected=new Set(['cpi','wti']);render()});let ids=[...S.selected];if(S.view===3)ids=ids.slice(0,1);if(S.view===5&&S.mode==='native2')ids=ids.slice(0,2);$('#title').textContent=`V${S.view} — ${S.view===3?'Component':S.view===4?'Multi-series':'Explore'}`;$('#subtitle').textContent=S.view===3?'Native values':S.view===4?'Fixed Indexed 100':S.mode==='native2'?'Two native units · left/right Y axes':'Indexed 100';legend(ids);draw(ids);side()}function legend(ids){$('#legend').innerHTML=D.filter(id=>S.series.has(id)).map(id=>{let m=S.catalog.series.find(x=>x.id===id);return `<button data-id="${id}" class="${ids.includes(id)?'':'off'}">${m?.short_name||id}</button>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let id=b.dataset.id;if(S.view===3)S.selected=new Set([id]);else S.selected.has(id)?S.selected.delete(id):S.selected.add(id);if(S.view===5&&S.mode==='native2'&&S.selected.size>2)S.selected=new Set([...S.selected].slice(-2));render()})}function draw(ids){let c=$('#chart'),box=c.parentElement,dpr=devicePixelRatio||1;c.width=box.clientWidth*dpr;c.height=box.clientHeight*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);let W=box.clientWidth,HH=box.clientHeight,p={l:55,r:S.view===5&&S.mode==='native2'?55:18,t:15,b:36},pw=W-p.l-p.r,ph=HH-p.t-p.b,sets=ids.map((id,i)=>{let a=data(id),native=S.view===3||(S.view===5&&S.mode==='native2');return{id,i,a:native?a:idx(a),raw:a}}),ts=sets.flatMap(s=>s.a.map(q=>q.t));if(!ts.length){x.fillStyle='#8ea2bb';x.fillText('No observations in selected horizon.',p.l,p.t+20);return}let t0=Math.min(...ts),t1=Math.max(...ts);x.strokeStyle='#263a55';x.fillStyle='#8ea2bb';x.font='11px system-ui';for(let i=0;i<6;i++){let xx=p.l+pw*i/5;x.beginPath();x.moveTo(xx,p.t);x.lineTo(xx,p.t+ph);x.stroke();let dt=new Date(t0+(t1-t0)*i/5);x.fillText(dt.toLocaleDateString(undefined,{month:'short',year:S.h==='3Y'||S.h==='5Y'?'2-digit':undefined,day:S.h==='5D'||S.h==='1M'?'numeric':undefined}),Math.max(2,xx-18),HH-10)}let dual=S.view===5&&S.mode==='native2',sc=[];if(dual)sets.forEach(s=>{let v=s.a.map(q=>q.v),mn=Math.min(...v),mx=Math.max(...v),z=(mx-mn||1)*.08;sc.push([mn-z,mx+z])});else{let v=sets.flatMap(s=>s.a.map(q=>q.v)),mn=Math.min(...v),mx=Math.max(...v),z=(mx-mn||1)*.08;sc=sets.map(()=>[mn-z,mx+z])}sets.forEach((s,i)=>{let[mn,mx]=sc[i];x.strokeStyle=C[s.i%C.length];x.lineWidth=2;x.beginPath();s.a.forEach((q,j)=>{let xx=p.l+(q.t-t0)/(t1-t0||1)*pw,yy=p.t+ph-(q.v-mn)/(mx-mn||1)*ph;j?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()});c.onpointermove=e=>{let r=c.getBoundingClientRect(),xx=e.clientX-r.left;if(xx<p.l||xx>p.l+pw)return;let tt=t0+(xx-p.l)/pw*(t1-t0),vals=sets.map(s=>{let q=s.raw.reduce((a,b)=>Math.abs(b.t-tt)<Math.abs(a.t-tt)?b:a),m=S.catalog.series.find(z=>z.id===s.id);return `${m?.short_name||s.id} ${fmt(q.v)} ${m?.native_unit||''}`});$('#readout').textContent=new Date(tt).toLocaleDateString()+'\n'+vals.join(' · ')};$('#meta').textContent=`Canonical evidence · ${S.h} · ${ids.length} visible series · ${dual?'native dual-axis':'common plot scale'}`}function side(){$('#side').innerHTML='<h3>Common engine</h3><p class="muted">V3, V4 and both V5 modes use this same rendering/axis/series/crosshair framework. V1/V2 plug into it after their derived-index contract is canonical.</p>'+(S.view>=4?'<h3>Series</h3><div class="picker">'+D.filter(id=>S.series.has(id)).map(id=>{let m=S.catalog.series.find(x=>x.id===id);return `<label><input type="checkbox" data-p="${id}" ${S.selected.has(id)?'checked':''}> ${m?.short_name||id}<br><span class="muted">${m?.native_unit||''}</span></label>`}).join('')+'</div>':'');document.querySelectorAll('[data-p]').forEach(q=>q.onchange=()=>{q.checked?S.selected.add(q.dataset.p):S.selected.delete(q.dataset.p);if(S.view===5&&S.mode==='native2'&&S.selected.size>2)S.selected=new Set([...S.selected].slice(-2));render()})}async function load(){try{S.catalog=await fetch(BASE+'data/market-backend/data-catalog.json?x='+Date.now()).then(r=>r.json());let a=await Promise.all(D.map(async id=>{try{let s=await fetch(BASE+'market-evidence/series/'+id+'.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});return[id,s]}catch{return[id,null]}}));a.forEach(([id,s])=>{if(s)S.series.set(id,s)});$('#status').textContent=`LIVE · ${S.series.size} canonical series loaded`;render()}catch(e){$('#status').textContent='Evidence load failed'}}load();</script></body></html>
