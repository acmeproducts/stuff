<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market View — Five View Chart Acceptance</title><style>
:root{color-scheme:dark;--bg:#07101c;--p:#0e1929;--p2:#091422;--line:#263a55;--text:#edf5ff;--muted:#8ea2bb;--accent:#78b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.top{padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07101cf2;z-index:9}.top b{font-size:18px}.muted,.top small{color:var(--muted)}.top small{display:block}.wrap{max-width:1500px;margin:auto;padding:10px}.toolbar,.views,.horizons,.chips,.mode{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:8px}button{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:7px 9px;border-radius:8px;cursor:pointer}button.active{border-color:var(--accent);background:#132b46}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:18px}.chartbox{height:58vh;min-height:360px;position:relative}.chartbox canvas{width:100%;height:100%;display:block;touch-action:none}.chips{margin:7px 0}.chip{display:inline-flex;align-items:center;gap:6px}.sw{width:9px;height:9px;border-radius:50%;display:inline-block}.chips button.off{opacity:.3}.meta{border-top:1px solid var(--line);padding-top:7px;color:var(--muted);font-size:11px}.picker{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:290px;overflow:auto}.picker label{border:1px solid var(--line);padding:6px;border-radius:7px}.tip{position:absolute;display:none;z-index:5;min-width:205px;max-width:300px;background:#050c16ed;border:1px solid #496886;border-radius:8px;padding:7px;box-shadow:0 4px 16px #0008;pointer-events:none}.tiphead{font-weight:800;margin-bottom:4px}.tiprow{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:baseline;padding:2px 0}.tipval{font-variant-numeric:tabular-nums;font-weight:800}.tiny{font-size:10px;color:var(--muted)}.axisState{font-weight:800;color:#c9dcf4}.readout{font-size:11px;text-align:right}.notice{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--p2)}h3{margin:10px 0 6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chartbox{height:52vh;min-height:330px}}@media(max-width:520px){.chartbox{height:48vh;min-height:300px}.picker{grid-template-columns:1fr}.grid{gap:7px}}
</style></head><body><header class="top"><b>Market View — Five View Chart Acceptance</b><small>One chart engine · real canonical evidence · common legend / axes / point-value crosshair grammar</small></header><main class="wrap"><div class="toolbar"><div class="views" id="views"></div><span id="status" class="muted">Loading…</span></div><div class="toolbar"><div class="horizons" id="horizons"></div><div class="mode" id="modes"></div></div><div class="grid"><section class="card"><div class="head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div><div id="readout" class="readout"></div></div><div id="legend" class="chips"></div><div class="chartbox"><canvas id="chart"></canvas><div id="tip" class="tip"></div></div><div id="meta" class="meta"></div></section><aside id="side" class="card"></aside></div></main><script>
'use strict';const BASE='https://acmeproducts.github.io/stuff/',H=['1D','5D','1M','YTD','1Y','3Y','5Y'],C=['#78b9ff','#f4c15d','#ef7373','#74d69b','#c399ff','#f59e8b','#68d6d3','#d5a6ff','#9fd56e','#ff9fd1'];const S={view:1,h:'5D',selected:new Set(['vix']),index:'risk',exploreMode:'auto',catalog:null,defs:null,series:new Map(),plot:null,pinned:false},$=s=>document.querySelector(s);
function meta(id){return S.catalog?.series.find(x=>x.id===id)||{id,short_name:id,name:id,native_unit:''}}function cutoff(h,last){let d=new Date(last),x=new Date(d);if(h==='1D')x.setDate(x.getDate()-1);else if(h==='5D')x.setDate(x.getDate()-8);else if(h==='1M')x.setMonth(x.getMonth()-1);else if(h==='YTD')x=new Date(d.getFullYear(),0,1);else if(h==='1Y')x.setFullYear(x.getFullYear()-1);else if(h==='3Y')x.setFullYear(x.getFullYear()-3);else x.setFullYear(x.getFullYear()-5);return +x}function raw(id){let s=S.series.get(id);if(!s?.observations?.length)return[];let last=s.observations.at(-1).t;return s.observations.filter(p=>p.t>=cutoff(S.h,last))}function idx(a,dir=1){if(!a.length||!Number.isFinite(a[0].v)||a[0].v<=0)return[];let b=a[0].v;return a.map(p=>({t:p.t,v:100+dir*((p.v/b)-1)*100,raw:p.v,sourceT:p.t}))}function fmt(v){return Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(v):'—'}function unit(id){return meta(id).native_unit||''}function short(id){return meta(id).short_name||id}function date(t){let o={month:'short',day:'numeric'};if(S.h==='3Y'||S.h==='5Y')o={month:'short',year:'2-digit'};return new Date(t).toLocaleDateString(undefined,o)}
function derived(key){let def=S.defs.indices[key],parts=def.components.map(c=>({id:c.id,dir:c.direction,a:idx(raw(c.id),c.direction)})).filter(x=>x.a.length);let times=[...new Set(parts.flatMap(x=>x.a.map(p=>p.t)))].sort((a,b)=>a-b),last=new Map(),out=[];for(let t of times){let vals=[];for(let p of parts){let q=p.a.find(x=>x.t===t);if(q)last.set(p.id,q);let z=last.get(p.id);if(z)vals.push(z.v)}if(vals.length)out.push({t,v:vals.reduce((a,b)=>a+b,0)/vals.length,raw:null,sourceT:t})}return out}
function modeFor(ids){if(ids.length<=1)return'native';let us=[...new Set(ids.map(unit))];if(us.length===1)return'native';if(ids.length===2)return'dual';return'indexed'}
function setupControls(){let names=['','Market','Index','Component','Multi-series','Explore'];$('#views').innerHTML=[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${S.view===v?'active':''}">V${v} ${names[v]}</button>`).join('');$('#horizons').innerHTML=H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.v;if(S.view===3)S.selected=new Set(['vix']);if(S.view===4&&S.selected.size<2)S.selected=new Set(['cpi','wti']);if(S.view===5&&S.selected.size<2)S.selected=new Set(['cpi','wti']);S.pinned=false;render()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.pinned=false;render()})}
function buildView(){let ids=[],sets=[],mode='indexed',title='',subtitle='';if(S.view===1){title='V1 — Market';subtitle='Risk · Growth · Macro · Indexed 100';ids=['risk','growth','macro'];sets=ids.map((id,i)=>({id,label:S.defs.indices[id].name,unit:'Index',color:C[i],a:derived(id),derived:true}));mode='indexed'}else if(S.view===2){let def=S.defs.indices[S.index];title=`V2 — ${def.name}`;subtitle=`${def.higher_means} · components Indexed 100`;sets=def.components.map((c,i)=>({id:c.id,label:short(c.id),unit:unit(c.id),color:C[i%C.length],a:idx(raw(c.id),c.direction)})).filter(s=>s.a.length);ids=sets.map(s=>s.id);mode='indexed'}else{ids=[...S.selected].filter(id=>S.series.has(id));if(S.view===3)ids=ids.slice(0,1);mode=S.view===5&&S.exploreMode!=='auto'?S.exploreMode:modeFor(ids);if(mode==='dual'&&ids.length!==2)mode=modeFor(ids);sets=ids.map((id,i)=>{let a=raw(id);return{id,label:short(id),unit:unit(id),color:C[i%C.length],a:mode==='indexed'?idx(a):a.map(p=>({...p,raw:p.v,sourceT:p.t}))}});title=`V${S.view} — ${S.view===3?'Component':S.view===4?'Multi-series':'Explore'}`;subtitle=mode==='dual'?'Automatic native dual Y-axis':mode==='indexed'?'Indexed 100 comparison':'Native values'}return{ids,sets,mode,title,subtitle}}
function legend(v){$('#legend').innerHTML=v.sets.map(s=>`<button class="chip" data-series="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.label}</button>`).join('');if(S.view===1)document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{S.index=b.dataset.series;S.view=2;render()});else if(S.view===2)document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{S.selected=new Set([b.dataset.series]);S.view=3;render()})}
function side(v){let x=`<h3>Chart state</h3><div class="notice"><span class="axisState">${v.mode==='dual'?'DUAL Y-AXIS':v.mode==='indexed'?'INDEXED 100':'NATIVE AXIS'}</span><div class="tiny">Chosen by the common engine from active measurement units.</div></div>`;if(S.view===1)x+=`<h3>Market</h3><p class="muted">Select a colored index pill to open its component view.</p>`;if(S.view===2)x+=`<h3>Index</h3><div class="mode">${['risk','growth','macro'].map(k=>`<button data-index="${k}" class="${S.index===k?'active':''}">${S.defs.indices[k].name}</button>`).join('')}</div><p class="muted">Select a component pill to open that exact series in V3.</p>`;if(S.view>=4){let avail=[...S.series.keys()].filter(id=>['vix','hySpread','spy','qqq','tenYear','wti','brent','cpi','coreCpi','fedFunds'].includes(id));x+=`<h3>Series</h3><div class="picker">${avail.map(id=>`<label><input type="checkbox" data-p="${id}" ${S.selected.has(id)?'checked':''}> ${short(id)}<br><span class="tiny">${unit(id)}</span></label>`).join('')}</div>`;if(S.view===5)x+=`<h3>Explore mode</h3><div class="mode"><button data-mode="auto" class="${S.exploreMode==='auto'?'active':''}">Auto</button><button data-mode="dual" class="${S.exploreMode==='dual'?'active':''}">Dual</button><button data-mode="indexed" class="${S.exploreMode==='indexed'?'active':''}">Indexed 100</button></div>`}$('#side').innerHTML=x;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{S.index=b.dataset.index;render()});document.querySelectorAll('[data-p]').forEach(q=>q.onchange=()=>{q.checked?S.selected.add(q.dataset.p):S.selected.delete(q.dataset.p);render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.exploreMode=b.dataset.mode;render()})}
function render(){setupControls();let v=buildView();$('#title').textContent=v.title;$('#subtitle').textContent=v.subtitle;$('#readout').textContent='';legend(v);side(v);draw(v);$('#meta').textContent=`Canonical evidence · ${S.h} · ${v.sets.length} visible series · ${v.mode==='dual'?'native left/right axes':v.mode==='indexed'?'display rebased to 100; crosshair retains native evidence':'native measurement axis'}`}
function scale(vals){let mn=Math.min(...vals),mx=Math.max(...vals),z=(mx-mn||1)*.09;return[mn-z,mx+z]}function nearest(a,t){return a.reduce((x,y)=>Math.abs(y.t-t)<Math.abs(x.t-t)?y:x)}
function draw(v,hoverT=null){let c=$('#chart'),box=c.parentElement,dpr=devicePixelRatio||1,W=box.clientWidth,HH=box.clientHeight;c.width=W*dpr;c.height=HH*dpr;let g=c.getContext('2d');g.scale(dpr,dpr);let p={l:58,r:v.mode==='dual'?58:20,t:16,b:38},pw=W-p.l-p.r,ph=HH-p.t-p.b,ts=v.sets.flatMap(s=>s.a.map(q=>q.t));if(!ts.length){g.fillStyle='#8ea2bb';g.fillText('No observations for this horizon.',p.l,p.t+20);return}let t0=Math.min(...ts),t1=Math.max(...ts),sc=[];if(v.mode==='dual')sc=v.sets.map(s=>scale(s.a.map(q=>q.v)));else{let z=scale(v.sets.flatMap(s=>s.a.map(q=>q.v)));sc=v.sets.map(()=>z)};g.font='11px system-ui';g.strokeStyle='#263a55';g.fillStyle='#8ea2bb';for(let i=0;i<6;i++){let x=p.l+pw*i/5;g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+ph);g.stroke();g.fillText(date(t0+(t1-t0)*i/5),Math.max(3,x-20),HH-11)}
function xy(q,i){let[mn,mx]=sc[i];return[p.l+(q.t-t0)/(t1-t0||1)*pw,p.t+ph-(q.v-mn)/(mx-mn||1)*ph]}v.sets.forEach((s,i)=>{g.strokeStyle=s.color;g.lineWidth=2;g.beginPath();s.a.forEach((q,j)=>{let[x,y]=xy(q,i);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()});if(v.mode==='dual'){v.sets.forEach((s,i)=>{let[mn,mx]=sc[i],x=i?p.l+pw+7:5;g.fillStyle=s.color;g.fillText(`${s.label} · ${s.unit}`,x,i?14:14);for(let k=0;k<4;k++){let val=mx-(mx-mn)*k/3,y=p.t+ph*k/3;g.fillText(fmt(val),i?W-p.r+7:5,y+4)}})}
S.plot={v,t0,t1,p,pw,ph,sc,xy};if(hoverT!=null)cross(g,hoverT);c.onpointermove=e=>{if(S.pinned&&e.pointerType!=='mouse')return;let r=c.getBoundingClientRect(),x=e.clientX-r.left;if(x<p.l||x>p.l+pw)return;let t=t0+(x-p.l)/pw*(t1-t0);draw(v,t)};c.onpointerdown=e=>{S.pinned=true;let r=c.getBoundingClientRect(),x=e.clientX-r.left,t=t0+(Math.max(p.l,Math.min(p.l+pw,x))-p.l)/pw*(t1-t0);draw(v,t)};c.onpointerleave=()=>{if(!S.pinned){$('#tip').style.display='none';draw(v)}}}
function cross(g,t){let P=S.plot,v=P.v,p=P.p,x=p.l+(t-P.t0)/(P.t1-P.t0||1)*P.pw;g.strokeStyle='#c8d8ea99';g.lineWidth=1;g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+P.ph);g.stroke();let rows=[],ys=[];v.sets.forEach((s,i)=>{if(!s.a.length)return;let q=nearest(s.a,t),[px,py]=P.xy(q,i);ys.push(py);g.fillStyle=s.color;g.beginPath();g.arc(px,py,4,0,Math.PI*2);g.fill();g.strokeStyle='#07101c';g.lineWidth=1;g.stroke();let native=q.raw??q.v,label=v.mode==='indexed'?`${fmt(q.v)} idx · ${fmt(native)} ${s.unit}`:`${fmt(native)} ${s.unit}`;g.font='bold 10px system-ui';let tw=g.measureText(label).width+8,lx=px+8;if(lx+tw>p.l+P.pw)lx=px-tw-8;let ly=Math.max(p.t+12,Math.min(p.t+P.ph-4,py-7));g.fillStyle='#050c16e8';g.fillRect(lx,ly-10,tw,16);g.fillStyle=s.color;g.fillText(label,lx+4,ly+2);rows.push({s,q,native})});let tip=$('#tip'),d=rows[0]?.q?.t||t;tip.innerHTML=`<div class="tiphead">${new Date(d).toLocaleDateString()}</div>`+rows.map(r=>`<div class="tiprow"><span class="sw" style="background:${r.s.color}"></span><span>${r.s.label}<div class="tiny">obs ${new Date(r.q.sourceT||r.q.t).toLocaleDateString()}</div></span><span class="tipval">${v.mode==='indexed'?fmt(r.q.v)+' idx · ':''}${fmt(r.native)} ${r.s.unit}</span></div>`).join('');let box=$('#chart').parentElement,tx=x+14;if(tx+285>box.clientWidth)tx=x-290;tip.style.left=Math.max(4,tx)+'px';tip.style.top=Math.max(4,Math.min(box.clientHeight-tip.offsetHeight-4,(ys.length?Math.min(...ys):20)+10))+'px';tip.style.display='block';$('#readout').textContent=`${new Date(d).toLocaleDateString()} · ${rows.length} series`}
async function load(){try{[S.catalog,S.defs]=await Promise.all([fetch(BASE+'data/market-backend/data-catalog.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'data/market-backend/derived-index-definition.json?x='+Date.now()).then(r=>r.json())]);let ids=new Set(['vix','hySpread','spy','qqq','tenYear','wti','brent','cpi','coreCpi','fedFunds']);Object.values(S.defs.indices).forEach(d=>d.components.forEach(c=>ids.add(c.id)));let a=await Promise.all([...ids].map(async id=>{try{let r=await fetch(BASE+'market-evidence/series/'+id+'.json?x='+Date.now());if(!r.ok)throw 0;return[id,await r.json()]}catch{return[id,null]}}));a.forEach(([id,s])=>{if(s)S.series.set(id,s)});$('#status').textContent=`LIVE · ${S.series.size} canonical series loaded`;render()}catch(e){$('#status').textContent='Evidence load failed';$('#side').innerHTML='<div class="notice">'+e.message+'</div>'}}load();
</script></body></html>
