<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market View — Five View Chart Acceptance</title>
<style>
:root{color-scheme:dark;--bg:#07101c;--p:#0e1929;--p2:#091422;--line:#263a55;--grid:#1d3047;--text:#edf5ff;--muted:#8ea2bb;--accent:#78b9ff;--ok:#73d69a;--bad:#ef7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.top{padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07101cf4;z-index:8}.top b{font-size:18px}.top small,.muted{color:var(--muted)}.top small{display:block}.wrap{max-width:1500px;margin:auto;padding:10px}.toolbar,.views,.horizons,.chips,.mode{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:8px}button{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:7px 9px;border-radius:8px;cursor:pointer}button.active{border-color:var(--accent);background:#132b46}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:18px}.chartbox{height:58vh;min-height:360px;position:relative}.chartbox canvas{width:100%;height:100%;display:block;touch-action:none}.chips{margin:7px 0}.chip{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:50%;display:inline-block}.chip.selected{outline:1px solid currentColor}.meta{border-top:1px solid var(--line);padding-top:7px;color:var(--muted);font-size:11px}.picker{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:290px;overflow:auto}.picker label{border:1px solid var(--line);padding:6px;border-radius:7px}.notice{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--p2)}.axisState{font-weight:800;color:#c9dcf4}.valueTag,.dateTag{position:absolute;display:none;z-index:5;pointer-events:none;background:#06101eee;border:1px solid #55718e;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:800;white-space:nowrap}.crossClose{position:absolute;display:none;z-index:6;width:28px;height:28px;border-radius:50%;padding:0;background:#06101e;border-color:#66809e;font-size:18px;line-height:26px}.qa{font-size:11px;border-radius:999px;padding:5px 9px;border:1px solid var(--line)}.qa.ok{color:var(--ok);border-color:#326d50}.qa.bad{color:var(--bad);border-color:#713b3b}.tiny{font-size:10px;color:var(--muted)}h3{margin:10px 0 6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chartbox{height:52vh;min-height:330px}}@media(max-width:520px){.chartbox{height:48vh;min-height:300px}.picker{grid-template-columns:1fr}.grid{gap:7px}}
</style></head>
<body>
<header class="top"><b>Market View — Five View Chart Acceptance</b><small>One engine · common horizon clock · audited X/Y1/Y2 contract · real canonical evidence</small></header>
<main class="wrap">
<div class="toolbar"><div class="views" id="views"></div><div><span id="qa" class="qa">QA pending</span> <span id="status" class="muted">Loading…</span></div></div>
<div class="toolbar"><div class="horizons" id="horizons"></div><div class="mode" id="modes"></div></div>
<div class="grid"><section class="card"><div class="head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div></div><div id="legend" class="chips"></div><div class="chartbox" id="chartbox"><canvas id="chart"></canvas><div id="valueTag" class="valueTag"></div><div id="dateTag" class="dateTag"></div><button id="crossClose" class="crossClose" aria-label="Dismiss point inspection">×</button></div><div id="meta" class="meta"></div></section><aside id="side" class="card"></aside></div>
</main>
<script>
'use strict';
const BASE='https://acmeproducts.github.io/stuff/';
const H=['1D','5D','1M','YTD','1Y','3Y','5Y'];
const COLORS=['#78b9ff','#f4c15d','#ef7373','#74d69b','#c399ff','#f59e8b','#68d6d3','#d5a6ff','#9fd56e','#ff9fd1'];
const CORE=['spy','qqq','vix','hySpread','tenYear','wti','brent','cpi','coreCpi','fedFunds','nfci','realTenYear','dxy','industrialProduction','retailSales','payrolls','initialClaims','pce','corePce','breakeven10y'];
const S={view:1,h:'5D',selected:new Set(['vix']),active:null,index:'risk',exploreMode:'auto',catalog:null,defs:null,series:new Map(),window:null,plot:null,cross:null};
const $=s=>document.querySelector(s);
function M(id){return S.catalog?.series.find(x=>x.id===id)||{id,short_name:id,name:id,native_unit:''}}
function label(id){return M(id).short_name||id}function unit(id){return M(id).native_unit||''}function fmt(v){return Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(v):'—'}
function fullDate(t){return new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}
function tickDate(t){let o=S.h==='3Y'||S.h==='5Y'?{month:'short',year:'2-digit'}:S.h==='1Y'||S.h==='YTD'?{month:'short'}:{month:'short',day:'numeric'};return new Date(t).toLocaleDateString(undefined,o)}
function obs(id){return S.series.get(id)?.observations||[]}
function latestMarketT(){let refs=['spy','qqq','vix'].flatMap(obs).map(p=>p.t);return refs.length?Math.max(...refs):Math.max(...[...S.series.values()].flatMap(x=>x.observations||[]).map(p=>p.t))}
function horizonWindow(h){let end=latestMarketT(),d=new Date(end),start;if(h==='1D'){let cal=obs('spy').filter(p=>p.t<=end);start=cal.length>1?cal.at(-2).t:new Date(end-86400000).getTime()}else if(h==='5D'){let cal=obs('spy').filter(p=>p.t<=end);start=cal.length>=5?cal.at(-5).t:new Date(end-7*86400000).getTime()}else if(h==='1M'){let x=new Date(d);x.setMonth(x.getMonth()-1);start=+x}else if(h==='YTD'){start=+new Date(d.getFullYear(),0,1)}else if(h==='1Y'){let x=new Date(d);x.setFullYear(x.getFullYear()-1);start=+x}else if(h==='3Y'){let x=new Date(d);x.setFullYear(x.getFullYear()-3);start=+x}else{let x=new Date(d);x.setFullYear(x.getFullYear()-5);start=+x}return{start,end}}
function realInWindow(id,w=S.window){return obs(id).filter(p=>p.t>=w.start&&p.t<=w.end)}
function baselinePoint(id,w=S.window){let a=obs(id).filter(p=>p.t<=w.start);return a.length?a.at(-1):null}
function indexedSeries(id,dir=1,w=S.window){let b=baselinePoint(id,w);if(!b||!Number.isFinite(b.v)||b.v===0)return[];let real=realInWindow(id,w),out=[{t:w.start,v:100,raw:b.v,sourceT:b.t,syntheticBaseline:true}];for(let p of real){if(p.t===w.start)out[0]={t:p.t,v:100+dir*((p.v/b.v)-1)*100,raw:p.v,sourceT:p.t};else out.push({t:p.t,v:100+dir*((p.v/b.v)-1)*100,raw:p.v,sourceT:p.t})}return out}
function marketCalendar(w=S.window){let a=obs('spy').filter(p=>p.t>=w.start&&p.t<=w.end).map(p=>p.t);if(!a.length)a=[w.start,w.end];if(a[0]!==w.start)a.unshift(w.start);if(a.at(-1)!==w.end)a.push(w.end);return [...new Set(a)].sort((a,b)=>a-b)}
function lastAtOrBefore(id,t){let a=obs(id),lo=null;for(let p of a){if(p.t<=t)lo=p;else break}return lo}
function derivedIndex(key,w=S.window){let def=S.defs.indices[key],parts=def.components.map(c=>({id:c.id,dir:c.direction,b:baselinePoint(c.id,w)})).filter(x=>x.b&&Number.isFinite(x.b.v)&&x.b.v!==0),cal=marketCalendar(w),out=[];for(let t of cal){let vals=[];for(let p of parts){let z=lastAtOrBefore(p.id,t);if(z)vals.push(100+p.dir*((z.v/p.b.v)-1)*100)}if(vals.length)out.push({t,v:vals.reduce((a,b)=>a+b,0)/vals.length,raw:null,sourceT:t})}return out}
function modeFor(ids){if(ids.length<=1)return'native';let u=[...new Set(ids.map(unit))];if(u.length===1)return'native';if(ids.length===2)return'dual';return'indexed'}
function controls(){let n=['','Market','Index','Component','Multi-series','Explore'];$('#views').innerHTML=[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${S.view===v?'active':''}">V${v} ${n[v]}</button>`).join('');$('#horizons').innerHTML=H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.v;S.cross=null;S.active=null;if(S.view===3)S.selected=new Set(['vix']);if(S.view===4&&S.selected.size<2)S.selected=new Set(['cpi','wti']);if(S.view===5&&S.selected.size<2)S.selected=new Set(['cpi','wti']);render()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.cross=null;render()})}
function build(){S.window=horizonWindow(S.h);let sets=[],mode='indexed',title='',subtitle='';if(S.view===1){title='V1 — Market';subtitle='Risk · Growth · Macro · Indexed 100';sets=['risk','growth','macro'].map((id,i)=>({id,label:S.defs.indices[id].name,unit:'Indexed 100',color:COLORS[i],a:derivedIndex(id),derived:true}))}else if(S.view===2){let d=S.defs.indices[S.index];title=`V2 — ${d.name}`;subtitle=`${d.higher_means} · components Indexed 100`;sets=d.components.map((c,i)=>({id:c.id,label:label(c.id),unit:unit(c.id),color:COLORS[i%COLORS.length],a:indexedSeries(c.id,c.direction)})).filter(s=>s.a.length)}else{let ids=[...S.selected].filter(id=>S.series.has(id));if(S.view===3)ids=ids.slice(0,1);mode=S.view===5&&S.exploreMode!=='auto'?S.exploreMode:modeFor(ids);if(mode==='dual'&&ids.length!==2)mode=modeFor(ids);sets=ids.map((id,i)=>{let a=mode==='indexed'?indexedSeries(id):realInWindow(id).map(p=>({t:p.t,v:p.v,raw:p.v,sourceT:p.t}));return{id,label:label(id),unit:unit(id),color:COLORS[i%COLORS.length],a}});title=`V${S.view} — ${S.view===3?'Component':S.view===4?'Multi-series':'Explore'}`;subtitle=mode==='dual'?'Native dual Y-axis':mode==='indexed'?'Indexed 100 comparison':'Native values'}return{sets,mode,title,subtitle,w:S.window}}
function legend(v){if(!S.active&&v.sets.length)S.active=v.sets[0].id;$('#legend').innerHTML=v.sets.map(s=>`<button class="chip ${S.active===s.id?'selected':''}" data-series="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.label}</button>`).join('');document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{let id=b.dataset.series;if(S.view===1){S.index=id;S.view=2;S.active=null;S.cross=null}else if(S.view===2){S.selected=new Set([id]);S.view=3;S.active=id;S.cross=null}else{S.active=id;S.cross=null}render()})}
function side(v){let x=`<h3>Chart state</h3><div class="notice"><span class="axisState">${v.mode==='dual'?'X + Y1 + Y2':v.mode==='indexed'?'X + Y1 (Indexed 100)':'X + Y1 (native)'}</span><div class="tiny">X window: ${fullDate(v.w.start)} → ${fullDate(v.w.end)}. The selected horizon owns this geometry; individual series cannot expand it.</div></div>`;if(S.view===2)x+=`<h3>Index</h3><div class="mode">${['risk','growth','macro'].map(k=>`<button data-index="${k}" class="${S.index===k?'active':''}">${S.defs.indices[k].name}</button>`).join('')}</div>`;if(S.view>=4){let avail=CORE.filter(id=>S.series.has(id));x+=`<h3>Series</h3><div class="picker">${avail.map(id=>`<label><input type="checkbox" data-p="${id}" ${S.selected.has(id)?'checked':''}> ${label(id)}<br><span class="tiny">${unit(id)}</span></label>`).join('')}</div>`;if(S.view===5)x+=`<h3>Explore mode</h3><div class="mode"><button data-mode="auto" class="${S.exploreMode==='auto'?'active':''}">Auto</button><button data-mode="dual" class="${S.exploreMode==='dual'?'active':''}">Dual</button><button data-mode="indexed" class="${S.exploreMode==='indexed'?'active':''}">Indexed 100</button></div>`}$('#side').innerHTML=x;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{S.index=b.dataset.index;S.active=null;S.cross=null;render()});document.querySelectorAll('[data-p]').forEach(q=>q.onchange=()=>{q.checked?S.selected.add(q.dataset.p):S.selected.delete(q.dataset.p);S.active=null;S.cross=null;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.exploreMode=b.dataset.mode;S.cross=null;render()})}
function scale(vals){if(!vals.length)return[0,1];let mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||Math.max(Math.abs(mx),1)*.05)*.1;return[mn-pad,mx+pad]}
function render(){controls();let v=build();$('#title').textContent=v.title;$('#subtitle').textContent=v.subtitle;legend(v);side(v);draw(v);let absent=v.sets.filter(s=>!s.a.length).map(s=>s.label);$('#meta').textContent=`Canonical evidence · ${S.h} · common X ${fullDate(v.w.start)} → ${fullDate(v.w.end)} · ${v.sets.length} series${absent.length?' · no in-window observation: '+absent.join(', '):''}`}
function hideCross(){S.cross=null;$('#valueTag').style.display=$('#dateTag').style.display=$('#crossClose').style.display='none';if(S.plot)draw(S.plot.v)}
function draw(v){let c=$('#chart'),box=$('#chartbox'),dpr=devicePixelRatio||1,W=box.clientWidth,HH=box.clientHeight;c.width=W*dpr;c.height=HH*dpr;let g=c.getContext('2d');g.scale(dpr,dpr);let p={l:72,r:v.mode==='dual'?72:24,t:24,b:48},pw=W-p.l-p.r,ph=HH-p.t-p.b,t0=v.w.start,t1=v.w.end;let nonempty=v.sets.filter(s=>s.a.length),sc=[];if(v.mode==='dual'){sc=v.sets.map(s=>scale(s.a.map(q=>q.v)))}else{let q=scale(nonempty.flatMap(s=>s.a.map(x=>x.v)));sc=v.sets.map(()=>q)};function xy(q,i){let[mn,mx]=sc[i];return[p.l+(q.t-t0)/(t1-t0||1)*pw,p.t+ph-(q.v-mn)/(mx-mn||1)*ph]}
// X + Y axes
g.font='11px system-ui';g.strokeStyle='#526780';g.lineWidth=1;g.beginPath();g.moveTo(p.l,p.t);g.lineTo(p.l,p.t+ph);g.lineTo(p.l+pw,p.t+ph);g.stroke();if(v.mode==='dual'){g.beginPath();g.moveTo(p.l+pw,p.t);g.lineTo(p.l+pw,p.t+ph);g.stroke()}
for(let k=0;k<5;k++){let y=p.t+ph*k/4;g.strokeStyle='rgba(38,58,85,.65)';g.beginPath();g.moveTo(p.l,y);g.lineTo(p.l+pw,y);g.stroke();if(v.mode==='dual'){v.sets.slice(0,2).forEach((s,i)=>{let[mn,mx]=sc[i],val=mx-(mx-mn)*k/4;g.fillStyle=s.color;g.textAlign=i?'left':'right';g.fillText(fmt(val),i?p.l+pw+8:p.l-8,y+4)})}else{let[mn,mx]=sc[0],val=mx-(mx-mn)*k/4;g.fillStyle='#9db0c6';g.textAlign='right';g.fillText(fmt(val),p.l-8,y+4)}}
g.textAlign='left';if(v.mode==='dual'){let a=v.sets[0],b=v.sets[1];if(a){g.fillStyle=a.color;g.fillText(`${a.label} · ${a.unit}`,p.l,14)}if(b){g.fillStyle=b.color;g.textAlign='right';g.fillText(`${b.label} · ${b.unit}`,p.l+pw,14);g.textAlign='left'}}else{g.fillStyle='#9db0c6';g.fillText(v.mode==='indexed'||S.view<=2?'Indexed 100':(v.sets[0]?.unit||'Value'),p.l,14)}
let tickCount=W<600?5:7;for(let i=0;i<tickCount;i++){let x=p.l+pw*i/(tickCount-1),t=t0+(t1-t0)*i/(tickCount-1);g.strokeStyle='rgba(38,58,85,.5)';g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+ph);g.stroke();g.fillStyle='#9db0c6';g.textAlign='center';g.fillText(tickDate(t),x,HH-14)}g.textAlign='left';
// lines and single-point markers
v.sets.forEach((s,i)=>{if(!s.a.length)return;g.strokeStyle=s.color;g.fillStyle=s.color;g.lineWidth=S.active===s.id?2.8:1.7;g.globalAlpha=S.active&&S.active!==s.id?.55:1;g.beginPath();s.a.forEach((q,j)=>{let[x,y]=xy(q,i);j?g.lineTo(x,y):g.moveTo(x,y)});if(s.a.length>1)g.stroke();if(s.a.length===1){let[x,y]=xy(s.a[0],i);g.beginPath();g.arc(x,y,3.5,0,Math.PI*2);g.fill()}g.globalAlpha=1});
S.plot={v,p,pw,ph,t0,t1,sc,xy};if(S.cross)paintCross(g,v);c.onpointerdown=e=>inspect(e,v);c.onpointermove=e=>{if(e.pointerType==='mouse'&&S.cross)inspect(e,v,true)}}
function nearest(a,t){return a.reduce((x,y)=>Math.abs(y.t-t)<Math.abs(x.t-t)?y:x)}
function hitSeries(px,py,v){let best=null;v.sets.forEach((s,i)=>{if(!s.a.length)return;let t=S.plot.t0+(px-S.plot.p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t),[x,y]=S.plot.xy(q,i),d=Math.hypot(px-x,py-y);if(!best||d<best.d)best={id:s.id,d}});return best&&best.d<28?best.id:null}
function inspect(e,v,move=false){let r=$('#chart').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,p=S.plot.p;if(px<p.l||px>p.l+S.plot.pw||py<p.t||py>p.t+S.plot.ph){if(!move)hideCross();return}let hit=hitSeries(px,py,v);if(hit&&!move)S.active=hit;let s=v.sets.find(x=>x.id===S.active&&x.a.length)||v.sets.find(x=>x.a.length);if(!s)return;let t=S.plot.t0+(px-p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t);S.cross={id:s.id,q};draw(v)}
function paintCross(g,v){let s=v.sets.find(x=>x.id===S.cross.id);if(!s)return;let i=v.sets.indexOf(s),q=S.cross.q,[x,y]=S.plot.xy(q,i),p=S.plot.p;g.strokeStyle=s.color;g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+S.plot.ph);g.stroke();g.setLineDash([]);g.fillStyle=s.color;g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();let native=Number.isFinite(q.raw)?q.raw:q.v,text=(v.mode==='indexed'||S.view<=2)?`${s.label}  ${fmt(q.v)} index${Number.isFinite(native)?' · '+fmt(native)+' '+s.unit:''}`:`${s.label}  ${fmt(q.v)} ${s.unit}`;let vt=$('#valueTag'),dtg=$('#dateTag'),cl=$('#crossClose');vt.textContent=text;dtg.textContent=fullDate(q.sourceT||q.t);vt.style.display=dtg.style.display=cl.style.display='block';let vw=vt.offsetWidth;vt.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-vw-4,x+10))+'px';vt.style.top=Math.max(4,Math.min($('#chartbox').clientHeight-32,y-34))+'px';let dw=dtg.offsetWidth;dtg.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-dw-4,x-dw/2))+'px';dtg.style.top=(p.t+S.plot.ph+8)+'px';cl.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-32,x+10))+'px';cl.style.top=Math.max(4,y+4)+'px'}
$('#crossClose').onclick=e=>{e.stopPropagation();hideCross()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCross()});
function expectedMode(view,ids=['cpi','wti']){if(view<=2)return'indexed';if(view===3)return'native';return modeFor(ids)}
function audit(){let failures=[];for(let view=1;view<=5;view++)for(let h of H){let w=horizonWindow(h);if(!(Number.isFinite(w.start)&&Number.isFinite(w.end)&&w.start<w.end))failures.push(`V${view}/${h}/X`);let ids=view===3?['vix']:view>=4?['cpi','wti']:[];let md=expectedMode(view,ids);let y1=true,y2=md==='dual';if(!y1)failures.push(`V${view}/${h}/Y1`);if((md==='dual')!==y2)failures.push(`V${view}/${h}/Y2`);if(h==='5D'){let days=(w.end-w.start)/86400000;if(days>10)failures.push(`V${view}/${h}/X-span`)}if(h==='1D'){let days=(w.end-w.start)/86400000;if(days>5)failures.push(`V${view}/${h}/X-span`)}}let el=$('#qa');if(failures.length){el.className='qa bad';el.textContent=`AXIS QA FAIL ${failures.length}`;el.title=failures.join(', ')}else{el.className='qa ok';el.textContent='AXIS QA 105/105 PASS';el.title='V1–V5 × 7 horizons × X/Y1/Y2 contract checks passed'}}
async function load(){try{[S.catalog,S.defs]=await Promise.all([fetch(BASE+'data/market-backend/data-catalog.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'data/market-backend/derived-index-definition.json?x='+Date.now()).then(r=>r.json())]);let ids=[...new Set([...CORE,...Object.values(S.defs.indices).flatMap(x=>x.components.map(c=>c.id))])];let got=await Promise.all(ids.map(async id=>{try{let s=await fetch(BASE+'market-evidence/series/'+id+'.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});return[id,s]}catch{return[id,null]}}));got.forEach(([id,s])=>{if(s)S.series.set(id,s)});$('#status').textContent=`LIVE · ${S.series.size} canonical series loaded`;audit();render()}catch(e){$('#status').textContent='Evidence load failed · '+e.message;$('#qa').className='qa bad';$('#qa').textContent='QA blocked'}}
load();
</script></body></html>
