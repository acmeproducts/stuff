<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market View — Five View Chart Acceptance</title><style>

26px}.qaBtn{font-size:11px;padding:5px 9px}.qaPanel{display:none;margin-top:8px}.qaPanel.open{display:block}.twoSelect{display:grid;grid-template-columns:1fr 1fr}.twoSelect label{display:grid;gap:4px;font-size:10px;color:var(--muted)}.fresh{font-size:11px;color:var(--muted);margin:2px 0 8px}.tiny{font-size:10px;color:var(--muted)}h3{margin:10px 0 6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chartbox{height:52vh;min-height:330px}}@media(max-width:520px){.chartbox{height:48vh;min-height:300px}.grid{gap:7px}.twoSelect{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><b>Market View — Five View Chart Acceptance</b><small>One chart engine · real canonical evidence</small></header><main class="wrap"><div class="toolbar"><div class="views" id="views"></div><div><button id="qaBtn" class="qaBtn">QA</button> <span id="status" class="muted">Loading…</span></div></div><div id="qaPanel" class="qaPanel notice"><b>Acceptance audit</b><div id="qaText" class="tiny"></div></div><div class="toolbar"><div class="horizons" id="horizons"></div><div class="mode" id="modes"></div></div><div class="grid"><section class="card"><div class="head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div></div><div id="legend" class="chips"></div><div id="fresh" class="fresh"></div><div class="chartbox" id="chartbox"><canvas id="chart"></canvas><div id="valueTag" class="valueTag"></div><div id="dateTag" class="dateTag"></div><button id="crossClose" class="crossClose" aria-label="Dismiss point inspection">×</button></div><div id="meta" class="meta"></div></section><aside id="side" class="card"></aside></div></main><script>
'use strict';const BASE='https://acmeproducts.github.io/stuff/',H=['1D','5D','1M','YTD','1Y','3Y','5Y'],COLORS=['#78b9ff','#f4c15d','#ef7373','#74d69b','#c399ff','#f59e8b','#68d6d3','#d5a6ff','#9fd56e','#ff9fd1'],CORE=['spy','qqq','vix','hySpread','tenYear','wti','brent','cpi','coreCpi','fedFunds','nfci','realTenYear','dxy','industrialProduction','retailSales','payrolls','initialClaims','pce','corePce','breakeven10y'];
const ABB={risk:'RSK',growth:'GRW',macro:'MAC',vix:'VIX',hySpread:'HYS',nfci:'NFC',realTenYear:'R10',dxy:'DXY',spy:'SPY',qqq:'QQQ',industrialProduction:'IP',retailSales:'RET',payrolls:'PAY',initialClaims:'CLM',wti:'WTI',brent:'BRT',cpi:'CPI',coreCpi:'CCI',pce:'PCE',corePce:'PCP',fedFunds:'FFR',breakeven10y:'BEI',tenYear:'10Y'};
const S={view:1,h:'5D',selected:['cpi','wti'],active:null,index:'risk',exploreMode:'auto',catalog:null,defs:null,series:new Map(),window:null,plot:null,cross:null};const $=s=>document.querySelector(s);
function M(id){return S.catalog?.series.find(x=>x.id===id)||{id,short_name:id,name:id,native_unit:''}}function label(id){return M(id).short_name||id}function fullName(id){return M(id).name||label(id)}function unit(id){return M(id).native_unit||''}function abbr(id){return ABB[id]||label(id).replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()}function fmt(v){return Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(v):'—'}function fullDate(t){return new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})}function tickDate(t){let o=S.h==='3Y'||S.h==='5Y'?{month:'short',year:'2-digit'}:S.h==='1Y'||S.h==='YTD'?{month:'short'}:{month:'short',day:'numeric'};return new Date(t).toLocaleDateString(undefined,o)}function obs(id){return S.series.get(id)?.observations||[]}
function clearInspection(){S.cross=null;$('#valueTag').style.display=$('#dateTag').style.display=$('#crossClose').style.display='none'}
function latestMarketT(){let r=['spy','qqq','vix'].flatMap(obs).map(p=>p.t);return r.length?Math.max(...r):Math.max(...[...S.series.values()].flatMap(x=>x.observations||[]).map(p=>p.t))}function horizonWindow(h){let end=latestMarketT(),d=new Date(end),start;if(h==='1D'){let a=obs('spy').filter(p=>p.t<=end);start=a.length>1?a.at(-2).t:end-86400000}else if(h==='5D'){let a=obs('spy').filter(p=>p.t<=end);start=a.length>=5?a.at(-5).t:end-7*86400000}else if(h==='1M'){let x=new Date(d);x.setMonth(x.getMonth()-1);start=+x}else if(h==='YTD')start=+new Date(d.getFullYear(),0,1);else if(h==='1Y'){let x=new Date(d);x.setFullYear(x.getFullYear()-1);start=+x}else if(h==='3Y'){let x=new Date(d);x.setFullYear(x.getFullYear()-3);start=+x}else{let x=new Date(d);x.setFullYear(x.getFullYear()-5);start=+x}return{start,end}}
function realInWindow(id,w=S.window){return obs(id).filter(p=>p.t>=w.start&&p.t<=w.end)}function baselinePoint(id,w=S.window){let a=obs(id).filter(p=>p.t<=w.start);return a.length?a.at(-1):null}function indexedSeries(id,dir=1,w=S.window){let b=baselinePoint(id,w);if(!b||!Number.isFinite(b.v)||b.v===0)return[];let out=[{t:w.start,v:100,raw:b.v,sourceT:b.t,baseline:true}];for(let p of realInWindow(id,w)){let z={t:p.t,v:100+dir*((p.v/b.v)-1)*100,raw:p.v,sourceT:p.t};if(p.t===w.start)out[0]=z;else out.push(z)}return out}function marketCalendar(w=S.window){let a=obs('spy').filter(p=>p.t>=w.start&&p.t<=w.end).map(p=>p.t);if(!a.length)a=[w.start,w.end];if(a[0]!==w.start)a.unshift(w.start);if(a.at(-1)!==w.end)a.push(w.end);return[...new Set(a)].sort((a,b)=>a-b)}function lastAtOrBefore(id,t){let z=null;for(let p of obs(id)){if(p.t<=t)z=p;else break}return z}
function derivedIndex(key,w=S.window){let d=S.defs.indices[key],parts=d.components.map(c=>({id:c.id,dir:c.direction,b:baselinePoint(c.id,w)})).filter(x=>x.b&&Number.isFinite(x.b.v)&&x.b.v!==0),out=[];for(let t of marketCalendar(w)){let vals=[];for(let p of parts){let z=lastAtOrBefore(p.id,t);if(z)vals.push(100+p.dir*((z.v/p.b.v)-1)*100)}if(vals.length)out.push({t,v:vals.reduce((a,b)=>a+b,0)/vals.length,sourceT:t})}return out}
function modeFor(ids){if(ids.length<=1)return'native';let u=[...new Set(ids.map(unit))];if(u.length===1)return'native';if(ids.length===2)return'dual';return'indexed'}
function controls(){let n=['','Market','Index','Component','Multi-series','Explore'];$('#views').innerHTML=[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${S.view===v?'active':''}">V${v} ${n[v]}</button>`).join('');$('#horizons').innerHTML=H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{clearInspection();S.view=+b.dataset.v;S.active=null;if(S.view===3&&S.selected.length!==1)S.selected=['vix'];if(S.view>=4&&S.selected.length<2)S.selected=['cpi','wti'];render()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{clearInspection();S.h=b.dataset.h;render()})}
function build(){S.window=horizonWindow(S.h);let sets=[],mode='indexed',title='',subtitle='';if(S.view===1){title='V1 — Market';subtitle='Risk · Growth · Macro';sets=['risk','growth','macro'].map((id,i)=>({id,label:S.defs.indices[id].name,unit:'Indexed 100',color:COLORS[i],a:derivedIndex(id)}))}else if(S.view===2){let d=S.defs.indices[S.index];title=`V2 — ${d.name}`;subtitle=`${d.higher_means} · contextual component view`;sets=d.components.map((c,i)=>({id:c.id,label:label(c.id),unit:unit(c.id),color:COLORS[i%COLORS.length],a:indexedSeries(c.id,c.direction)})).filter(s=>s.a.length)}else{let ids=S.selected.filter(id=>S.series.has(id));if(S.view===3)ids=ids.slice(0,1);mode=S.view===5&&S.exploreMode!=='auto'?S.exploreMode:modeFor(ids);if(mode==='dual'&&ids.length!==2)mode=modeFor(ids);sets=ids.map((id,i)=>({id,label:label(id),unit:unit(id),color:COLORS[i%COLORS.length],a:mode==='indexed'?indexedSeries(id):realInWindow(id).map(p=>({t:p.t,v:p.v,raw:p.v,sourceT:p.t}))}));if(S.view===3){let id=ids[0];title=`V3 — ${abbr(id)} · ${fullName(id)}`;subtitle=`${unit(id)||'native value'} · drill-down`}else{title=`V${S.view} — ${S.view===4?'Multi-series':'Explore'}`;subtitle=mode==='dual'?'Native dual Y-axis':mode==='indexed'?'Indexed 100 comparison':'Native values'}}return{sets,mode,title,subtitle,w:S.window}}
function legend(v){if(!S.active&&v.sets.length)S.active=v.sets[0].id;$('#legend').innerHTML=v.sets.map(s=>`<button title="${s.label}" class="chip ${S.active===s.id?'selected':''}" data-series="${s.id}"><span class="sw" style="background:${s.color}"></span>${abbr(s.id)}</button>`).join('');document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{clearInspection();let id=b.dataset.series;if(S.view===1){S.index=id;S.view=2;S.active=null}else if(S.view===2){S.selected=[id];S.view=3;S.active=id}else S.active=id;render()});let fresh=v.sets.map(s=>{let a=obs(s.id),t=a.at(-1)?.t;return t?`${abbr(s.id)} latest ${fullDate(t)}`:null}).filter(Boolean);$('#fresh').textContent=fresh.join(' · ')}
function seriesOptions(selected){return CORE.filter(id=>S.series.has(id)).map(id=>`<option value="${id}" ${id===selected?'selected':''}>${abbr(id)} — ${label(id)}</option>`).join('')}
function side(v){let x=`<h3>Chart</h3><div class="notice"><b>${v.mode==='dual'?'Dual native axes':v.mode==='indexed'?'Indexed 100':'Native axis'}</b><div class="tiny">${fullDate(v.w.start)} → ${fullDate(v.w.end)}</div></div>`;if(S.view===2)x+=`<h3>Context</h3><div class="mode">${['risk','growth','macro'].map(k=>`<button data-index="${k}" class="${S.index===k?'active':''}">${S.defs.indices[k].name}</button>`).join('')}</div><p class="tiny">Tap a component legend pill to open its V3 drill-down.</p>`;if(S.view>=4){if(S.selected.length===2)x+=`<h3>Series</h3><div class="twoSelect"><label>Series 1<select data-slot="0">${seriesOptions(S.selected[0])}</select></label><label>Series 2<select data-slot="1">${seriesOptions(S.selected[1])}</select></label></div>`;else x+=`<h3>Series</h3><div class="tiny">${S.selected.map(id=>`${abbr(id)} ${label(id)}`).join(' · ')}</div>`;if(S.view===5)x+=`<h3>Explore mode</h3><div class="mode"><button data-mode="auto" class="${S.exploreMode==='auto'?'active':''}">Auto</button><button data-mode="dual" class="${S.exploreMode==='dual'?'active':''}">Dual</button><button data-mode="indexed" class="${S.exploreMode==='indexed'?'active':''}">Indexed</button></div>`}$('#side').innerHTML=x;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{clearInspection();S.index=b.dataset.index;S.active=null;render()});document.querySelectorAll('[data-slot]').forEach(s=>s.onchange=()=>{clearInspection();let n=+s.dataset.slot,arr=[...S.selected];arr[n]=s.value;if(arr[0]===arr[1])return;S.selected=arr;S.active=null;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{clearInspection();S.exploreMode=b.dataset.mode;render()})}
function scale(vals){if(!vals.length)return[0,1];let mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||Math.max(Math.abs(mx),1)*.05)*.1;return[mn-pad,mx+pad]}
function render(){clearInspection();controls();let v=build();$('#title').textContent=v.title;$('#subtitle').textContent=v.subtitle;legend(v);side(v);draw(v);$('#meta').textContent=`Canonical evidence · ${S.h} · common X ${fullDate(v.w.start)} → ${fullDate(v.w.end)} · ${v.sets.length} series`}
function draw(v){let c=$('#chart'),box=$('#chartbox'),dpr=devicePixelRatio||1,W=box.clientWidth,HH=box.clientHeight;c.width=W*dpr;c.height=HH*dpr;let g=c.getContext('2d');g.scale(dpr,dpr);let p={l:72,r:v.mode==='dual'?72:24,t:24,b:48},pw=W-p.l-p.r,ph=HH-p.t-p.b,t0=v.w.start,t1=v.w.end,non=v.sets.filter(s=>s.a.length),sc=[];if(v.mode==='dual')sc=v.sets.map(s=>scale(s.a.map(q=>q.v)));else{let q=scale(non.flatMap(s=>s.a.map(x=>x.v)));sc=v.sets.map(()=>q)}function xy(q,i){let[mn,mx]=sc[i];return[p.l+(q.t-t0)/(t1-t0||1)*pw,p.t+ph-(q.v-mn)/(mx-mn||1)*ph]}g.font='11px system-ui';g.strokeStyle='#526780';g.beginPath();g.moveTo(p.l,p.t);g.lineTo(p.l,p.t+ph);g.lineTo(p.l+pw,p.t+ph);g.stroke();if(v.mode==='dual'){g.beginPath();g.moveTo(p.l+pw,p.t);g.lineTo(p.l+pw,p.t+ph);g.stroke()}for(let k=0;k<5;k++){let y=p.t+ph*k/4;g.strokeStyle='rgba(38,58,85,.65)';g.beginPath();g.moveTo(p.l,y);g.lineTo(p.l+pw,y);g.stroke();if(v.mode==='dual'){v.sets.slice(0,2).forEach((s,i)=>{let[mn,mx]=sc[i],val=mx-(mx-mn)*k/4;g.fillStyle=s.color;g.textAlign=i?'left':'right';g.fillText(fmt(val),i?p.l+pw+8:p.l-8,y+4)})}else{let[mn,mx]=sc[0],val=mx-(mx-mn)*k/4;g.fillStyle='#9db0c6';g.textAlign='right';g.fillText(fmt(val),p.l-8,y+4)}}g.textAlign='left';if(v.mode==='dual'){let a=v.sets[0],b=v.sets[1];if(a){g.fillStyle=a.color;g.fillText(`${abbr(a.id)} · ${a.unit}`,p.l,14)}if(b){g.fillStyle=b.color;g.textAlign='right';g.fillText(`${abbr(b.id)} · ${b.unit}`,p.l+pw,14);g.textAlign='left'}}else{g.fillStyle='#9db0c6';g.fillText(v.mode==='indexed'||S.view<=2?'Indexed 100':(v.sets[0]?.unit||'Value'),p.l,14)}let tc=W<600?5:7;for(let i=0;i<tc;i++){let x=p.l+pw*i/(tc-1),t=t0+(t1-t0)*i/(tc-1);g.strokeStyle='rgba(38,58,85,.5)';g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+ph);g.stroke();g.fillStyle='#9db0c6';g.textAlign='center';g.fillText(tickDate(t),x,HH-14)}g.textAlign='left';v.sets.forEach((s,i)=>{if(!s.a.length)return;g.strokeStyle=s.color;g.fillStyle=s.color;g.lineWidth=S.active===s.id?2.8:1.7;g.globalAlpha=S.active&&S.active!==s.id?.55:1;g.beginPath();s.a.forEach((q,j)=>{let[x,y]=xy(q,i);j?g.lineTo(x,y):g.moveTo(x,y)});if(s.a.length>1)g.stroke();if(s.a.length===1){let[x,y]=xy(s.a[0],i);g.beginPath();g.arc(x,y,3.5,0,Math.PI*2);g.fill()}g.globalAlpha=1});S.plot={v,p,pw,ph,t0,t1,sc,xy};if(S.cross)paintCross(g,v);c.onpointerdown=e=>inspect(e,v);c.onpointermove=e=>{if(e.pointerType==='mouse'&&S.cross)inspect(e,v,true)}}
function nearest(a,t){return a.reduce((x,y)=>Math.abs(y.t-t)<Math.abs(x.t-t)?y:x)}function hitSeries(px,py,v){let best=null;v.sets.forEach((s,i)=>{if(!s.a.length)return;let t=S.plot.t0+(px-S.plot.p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t),[x,y]=S.plot.xy(q,i),d=Math.hypot(px-x,py-y);if(!best||d<best.d)best={id:s.id,d}});return best&&best.d<28?best.id:null}function inspect(e,v,move=false){let r=$('#chart').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,p=S.plot.p;if(px<p.l||px>p.l+S.plot.pw||py<p.t||py>p.t+S.plot.ph){if(!move)clearInspection();return}let hit=hitSeries(px,py,v);if(hit&&!move)S.active=hit;let s=v.sets.find(x=>x.id===S.active&&x.a.length)||v.sets.find(x=>x.a.length);if(!s)return;let t=S.plot.t0+(px-p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t);S.cross={id:s.id,q};draw(v)}
function paintCross(g,v){let s=v.sets.find(x=>x.id===S.cross.id);if(!s)return;let i=v.sets.indexOf(s),q=S.cross.q,[x,y]=S.plot.xy(q,i),p=S.plot.p;g.strokeStyle=s.color;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+S.plot.ph);g.stroke();g.setLineDash([]);g.fillStyle=s.color;g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.stroke();let native=Number.isFinite(q.raw)?q.raw:q.v,text=(v.mode==='indexed'||S.view<=2)?`${abbr(s.id)} ${fmt(q.v)} idx${Number.isFinite(native)?' · '+fmt(native)+' '+s.unit:''}`:`${abbr(s.id)} ${fmt(q.v)} ${s.unit}`;let vt=$('#valueTag'),dtg=$('#dateTag'),cl=$('#crossClose');vt.textContent=text;dtg.textContent=fullDate(q.sourceT||q.t);vt.style.display=dtg.style.display=cl.style.display='block';let vw=vt.offsetWidth;vt.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-vw-4,x+10))+'px';vt.style.top=Math.max(4,Math.min($('#chartbox').clientHeight-32,y-34))+'px';let dw=dtg.offsetWidth;dtg.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-dw-4,x-dw/2))+'px';dtg.style.top=(p.t+S.plot.ph+8)+'px';cl.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-32,x+10))+'px';cl.style.top=Math.max(4,y+4)+'px'}
$('#crossClose').onclick=e=>{e.stopPropagation();clearInspection();if(S.plot)draw(S.plot.v)};$('#qaBtn').onclick=()=>$('#qaPanel').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearInspection();if(S.plot)draw(S.plot.v)}});
function audit(){let f=[];for(let view=1;view<=5;view++)for(let h of H){let w=horizonWindow(h);if(!(w.start<w.end))f.push(`V${view}/${h}/X`);if(h==='5D'&&(w.end-w.start)/86400000>10)f.push(`V${view}/5D span`)}$('#qaText').textContent=f.length?`FAIL: ${f.join(', ')}`:'Axis-window contract checks passed for V1–V5 across all seven horizons. QA remains test-only and is hidden from the chart surface by default.'}
async function load(){try{[S.catalog,S.defs]=await Promise.all([fetch(BASE+'data/market-backend/data-catalog.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'data/market-backend/derived-index-definition.json?x='+Date.now()).then(r=>r.json())]);let ids=[...new Set([...CORE,...Object.values(S.defs.indices).flatMap(x=>x.components.map(c=>c.id))])],got=await Promise.all(ids.map(async id=>{try{let s=await fetch(BASE+'market-evidence/series/'+id+'.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});return[id,s]}catch{return[id,null]}}));got.forEach(([id,s])=>{if(s)S.series.set(id,s)});$('#status').textContent=`LIVE · ${S.series.size} series`;audit();render()}catch(e){$('#status').textContent='Evidence load failed · '+e.message}}
load();</script></body></html>
