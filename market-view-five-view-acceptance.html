<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market View — Five View Chart Acceptance</title>
<style>
:root{color-scheme:dark;--bg:#07101c;--p:#0e1929;--p2:#091422;--line:#263a55;--text:#edf5ff;--muted:#8ea2bb;--accent:#78b9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.top{padding:12px 16px;border-bottom:1px solid var(--line)}.top b{font-size:18px}.top small,.muted{color:var(--muted)}.top small{display:block}.wrap{max-width:1500px;margin:auto;padding:10px}.toolbar,.views,.horizons,.chips,.mode{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.toolbar{justify-content:space-between;margin-bottom:8px}button{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:7px 9px;border-radius:8px;cursor:pointer}button.active{border-color:var(--accent);background:#132b46}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.card{background:var(--p);border:1px solid var(--line);border-radius:12px;padding:11px;min-width:0}.head{display:flex;justify-content:space-between;gap:10px}.head h2{margin:0;font-size:18px}.chartbox{height:58vh;min-height:360px;position:relative}.chartbox canvas{width:100%;height:100%;display:block;touch-action:none}.chips{margin:7px 0}.chip{display:inline-flex;align-items:center;gap:6px}.sw{width:10px;height:10px;border-radius:50%;display:inline-block}.chip.off{opacity:.32}.chip.selected{outline:1px solid currentColor}.meta{border-top:1px solid var(--line);padding-top:7px;color:var(--muted);font-size:11px}.picker{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:290px;overflow:auto}.picker label{border:1px solid var(--line);padding:6px;border-radius:7px}.axisState{font-weight:800;color:#c9dcf4}.notice{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--p2)}.crossClose{position:absolute;display:none;z-index:6;width:28px;height:28px;border-radius:50%;padding:0;background:#06101e;border-color:#66809e;font-size:18px;line-height:26px}.valueTag,.dateTag{position:absolute;display:none;z-index:5;pointer-events:none;background:#06101eee;border:1px solid #55718e;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:800;white-space:nowrap}.tiny{font-size:10px;color:var(--muted)}h3{margin:10px 0 6px}@media(max-width:850px){.grid{grid-template-columns:1fr}.chartbox{height:52vh;min-height:330px}}@media(max-width:520px){.chartbox{height:48vh;min-height:300px}.picker{grid-template-columns:1fr}.grid{gap:7px}}
</style></head>
<body>
<header class="top"><b>Market View — Five View Chart Acceptance</b><small>One chart engine · visible Y-axis · single-series point crosshair · real canonical evidence</small></header>
<main class="wrap"><div class="toolbar"><div class="views" id="views"></div><span id="status" class="muted">Loading…</span></div><div class="toolbar"><div class="horizons" id="horizons"></div><div class="mode" id="modes"></div></div><div class="grid"><section class="card"><div class="head"><div><h2 id="title"></h2><div id="subtitle" class="muted"></div></div></div><div id="legend" class="chips"></div><div class="chartbox" id="chartbox"><canvas id="chart"></canvas><div id="valueTag" class="valueTag"></div><div id="dateTag" class="dateTag"></div><button id="crossClose" class="crossClose" aria-label="Dismiss crosshair">×</button></div><div id="meta" class="meta"></div></section><aside id="side" class="card"></aside></div></main>
<script>
'use strict';
const BASE='https://acmeproducts.github.io/stuff/';
const H=['1D','5D','1M','YTD','1Y','3Y','5Y'];
const COLORS=['#78b9ff','#f4c15d','#ef7373','#74d69b','#c399ff','#f59e8b','#68d6d3','#d5a6ff','#9fd56e','#ff9fd1'];
const CORE=['vix','hySpread','spy','qqq','tenYear','wti','brent','cpi','coreCpi','fedFunds','nfci','realTenYear','dxy','industrialProduction','retailSales','payrolls','initialClaims','pce','corePce','breakeven10y'];
const S={view:1,h:'5D',selected:new Set(['vix']),active:null,index:'risk',exploreMode:'auto',catalog:null,defs:null,series:new Map(),plot:null,cross:null};
const $=s=>document.querySelector(s);
function m(id){return S.catalog?.series.find(x=>x.id===id)||{id,short_name:id,name:id,native_unit:''}}
function label(id){return m(id).short_name||id} function unit(id){return m(id).native_unit||''}
function cutoff(h,last){let d=new Date(last),x=new Date(d);if(h==='1D')x.setDate(x.getDate()-1);else if(h==='5D')x.setDate(x.getDate()-8);else if(h==='1M')x.setMonth(x.getMonth()-1);else if(h==='YTD')x=new Date(d.getFullYear(),0,1);else if(h==='1Y')x.setFullYear(x.getFullYear()-1);else if(h==='3Y')x.setFullYear(x.getFullYear()-3);else x.setFullYear(x.getFullYear()-5);return +x}
function raw(id){let s=S.series.get(id);if(!s?.observations?.length)return[];let last=s.observations.at(-1).t;return s.observations.filter(p=>p.t>=cutoff(S.h,last))}
function idx(a,dir=1){if(!a.length||!Number.isFinite(a[0].v)||a[0].v===0)return[];let b=a[0].v;return a.map(p=>({t:p.t,v:100+dir*((p.v/b)-1)*100,raw:p.v,sourceT:p.t}))}
function fmt(v){return Number.isFinite(v)?new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(v):'—'}
function dt(t,full=false){return new Date(t).toLocaleDateString(undefined,full?{year:'numeric',month:'short',day:'numeric'}:{month:'short',day:'numeric',year:(S.h==='3Y'||S.h==='5Y')?'2-digit':undefined})}
function derived(key){let def=S.defs.indices[key],parts=def.components.map(c=>({id:c.id,a:idx(raw(c.id),c.direction)})).filter(x=>x.a.length),times=[...new Set(parts.flatMap(x=>x.a.map(p=>p.t)))].sort((a,b)=>a-b),last=new Map(),out=[];for(let t of times){let vals=[];for(let p of parts){let q=p.a.find(x=>x.t===t);if(q)last.set(p.id,q);let z=last.get(p.id);if(z)vals.push(z.v)}if(vals.length)out.push({t,v:vals.reduce((a,b)=>a+b,0)/vals.length,raw:null,sourceT:t})}return out}
function modeFor(ids){if(ids.length<=1)return'native';let us=[...new Set(ids.map(unit))];if(us.length===1)return'native';if(ids.length===2)return'dual';return'indexed'}
function controls(){let names=['','Market','Index','Component','Multi-series','Explore'];$('#views').innerHTML=[1,2,3,4,5].map(v=>`<button data-v="${v}" class="${S.view===v?'active':''}">V${v} ${names[v]}</button>`).join('');$('#horizons').innerHTML=H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=+b.dataset.v;S.cross=null;S.active=null;if(S.view===3)S.selected=new Set(['vix']);if(S.view===4&&S.selected.size<2)S.selected=new Set(['cpi','wti']);if(S.view===5&&S.selected.size<2)S.selected=new Set(['cpi','wti']);render()});document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.cross=null;render()})}
function build(){let sets=[],mode='indexed',title='',subtitle='';if(S.view===1){title='V1 — Market';subtitle='Risk · Growth · Macro · Indexed 100';sets=['risk','growth','macro'].map((id,i)=>({id,label:S.defs.indices[id].name,unit:'Index',color:COLORS[i],a:derived(id),derived:true}));}else if(S.view===2){let def=S.defs.indices[S.index];title=`V2 — ${def.name}`;subtitle=`${def.higher_means} · components Indexed 100`;sets=def.components.map((c,i)=>({id:c.id,label:label(c.id),unit:unit(c.id),color:COLORS[i%COLORS.length],a:idx(raw(c.id),c.direction)})).filter(s=>s.a.length)}else{let ids=[...S.selected].filter(id=>S.series.has(id));if(S.view===3)ids=ids.slice(0,1);mode=S.view===5&&S.exploreMode!=='auto'?S.exploreMode:modeFor(ids);if(mode==='dual'&&ids.length!==2)mode=modeFor(ids);sets=ids.map((id,i)=>{let a=raw(id);return{id,label:label(id),unit:unit(id),color:COLORS[i%COLORS.length],a:mode==='indexed'?idx(a):a.map(p=>({...p,raw:p.v,sourceT:p.t}))}});title=`V${S.view} — ${S.view===3?'Component':S.view===4?'Multi-series':'Explore'}`;subtitle=mode==='dual'?'Automatic native dual Y-axis':mode==='indexed'?'Indexed 100 comparison':'Native values'}return{sets,mode,title,subtitle}}
function legend(v){if(!S.active&&v.sets.length)S.active=v.sets[0].id;$('#legend').innerHTML=v.sets.map(s=>`<button class="chip ${S.active===s.id?'selected':''}" data-series="${s.id}"><span class="sw" style="background:${s.color}"></span>${s.label}</button>`).join('');document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{let id=b.dataset.series;if(S.view===1){S.index=id;S.view=2;S.active=null;S.cross=null;render();return}if(S.view===2){S.selected=new Set([id]);S.view=3;S.active=id;S.cross=null;render();return}S.active=id;S.cross=null;render()})}
function side(v){let x=`<h3>Chart state</h3><div class="notice"><span class="axisState">${v.mode==='dual'?'DUAL Y-AXIS':v.mode==='indexed'?'INDEXED 100':'NATIVE AXIS'}</span><div class="tiny">Tap a colored legend pill or tap a line to select one series. Crosshair reports only that series.</div></div>`;if(S.view===2)x+=`<h3>Index</h3><div class="mode">${['risk','growth','macro'].map(k=>`<button data-index="${k}" class="${S.index===k?'active':''}">${S.defs.indices[k].name}</button>`).join('')}</div>`;if(S.view>=4){let avail=CORE.filter(id=>S.series.has(id));x+=`<h3>Series</h3><div class="picker">${avail.map(id=>`<label><input type="checkbox" data-p="${id}" ${S.selected.has(id)?'checked':''}> ${label(id)}<br><span class="tiny">${unit(id)}</span></label>`).join('')}</div>`;if(S.view===5)x+=`<h3>Explore mode</h3><div class="mode"><button data-mode="auto" class="${S.exploreMode==='auto'?'active':''}">Auto</button><button data-mode="dual" class="${S.exploreMode==='dual'?'active':''}">Dual</button><button data-mode="indexed" class="${S.exploreMode==='indexed'?'active':''}">Indexed 100</button></div>`}$('#side').innerHTML=x;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{S.index=b.dataset.index;S.active=null;S.cross=null;render()});document.querySelectorAll('[data-p]').forEach(q=>q.onchange=()=>{q.checked?S.selected.add(q.dataset.p):S.selected.delete(q.dataset.p);S.active=null;S.cross=null;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.exploreMode=b.dataset.mode;S.cross=null;render()})}
function scale(vals){let mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||1)*.1;return[mn-pad,mx+pad]}
function nearest(a,t){return a.reduce((x,y)=>Math.abs(y.t-t)<Math.abs(x.t-t)?y:x)}
function render(){controls();let v=build();$('#title').textContent=v.title;$('#subtitle').textContent=v.subtitle;legend(v);side(v);draw(v);$('#meta').textContent=`Canonical evidence · ${S.h} · ${v.sets.length} series · ${v.mode==='dual'?'native left/right Y axes':v.mode==='indexed'?'Indexed 100 Y-axis; native value retained for point inspection':'native Y-axis'}`}
function hideCross(){S.cross=null;$('#valueTag').style.display=$('#dateTag').style.display=$('#crossClose').style.display='none';if(S.plot)draw(S.plot.v)}
function draw(v){let c=$('#chart'),box=$('#chartbox'),dpr=devicePixelRatio||1,W=box.clientWidth,HH=box.clientHeight;c.width=W*dpr;c.height=HH*dpr;let g=c.getContext('2d');g.scale(dpr,dpr);let p={l:72,r:v.mode==='dual'?72:24,t:22,b:48},pw=W-p.l-p.r,ph=HH-p.t-p.b,ts=v.sets.flatMap(s=>s.a.map(q=>q.t));if(!ts.length){g.fillStyle='#8ea2bb';g.fillText('No observations for this horizon.',p.l,p.t+20);return}let t0=Math.min(...ts),t1=Math.max(...ts),sc=[];if(v.mode==='dual')sc=v.sets.map(s=>scale(s.a.map(q=>q.v)));else{let q=scale(v.sets.flatMap(s=>s.a.map(x=>x.v)));sc=v.sets.map(()=>q)};
function xy(q,i){let[mn,mx]=sc[i];return[p.l+(q.t-t0)/(t1-t0||1)*pw,p.t+ph-(q.v-mn)/(mx-mn||1)*ph]}
// axes
g.font='11px system-ui';g.lineWidth=1;g.strokeStyle='#4a5f79';g.fillStyle='#9db0c6';g.beginPath();g.moveTo(p.l,p.t);g.lineTo(p.l,p.t+ph);g.lineTo(p.l+pw,p.t+ph);g.stroke();if(v.mode==='dual'){g.beginPath();g.moveTo(p.l+pw,p.t);g.lineTo(p.l+pw,p.t+ph);g.stroke()}
for(let k=0;k<5;k++){let y=p.t+ph*k/4;g.strokeStyle='#1e3047';g.beginPath();g.moveTo(p.l,y);g.lineTo(p.l+pw,y);g.stroke();if(v.mode==='dual'){v.sets.slice(0,2).forEach((s,i)=>{let[mn,mx]=sc[i],val=mx-(mx-mn)*k/4;g.fillStyle=s.color;g.textAlign=i?'left':'right';g.fillText(fmt(val),i?p.l+pw+8:p.l-8,y+4)})}else{let[mn,mx]=sc[0],val=mx-(mx-mn)*k/4;g.fillStyle='#9db0c6';g.textAlign='right';g.fillText(fmt(val),p.l-8,y+4)}}
g.textAlign='left';if(v.mode==='dual'){let a=v.sets[0],b=v.sets[1];if(a){g.fillStyle=a.color;g.fillText(`${a.label} · ${a.unit}`,p.l,13)}if(b){let txt=`${b.label} · ${b.unit}`;g.fillStyle=b.color;g.textAlign='right';g.fillText(txt,p.l+pw,13);g.textAlign='left'}}else{let u=v.mode==='indexed'?'Indexed 100':(v.sets[0]?.unit||'Value');g.fillStyle='#9db0c6';g.fillText(u,p.l,13)}
for(let i=0;i<6;i++){let x=p.l+pw*i/5,t=t0+(t1-t0)*i/5;g.strokeStyle='#1e3047';g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+ph);g.stroke();g.fillStyle='#9db0c6';g.textAlign='center';g.fillText(dt(t),x,HH-15)}g.textAlign='left';
// lines
v.sets.forEach((s,i)=>{g.strokeStyle=s.color;g.lineWidth=S.active===s.id?2.8:1.7;g.globalAlpha=S.active&&S.active!==s.id?.55:1;g.beginPath();s.a.forEach((q,j)=>{let[x,y]=xy(q,i);j?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.globalAlpha=1});
S.plot={v,p,pw,ph,t0,t1,sc,xy};
if(S.cross)paintCross(g,v);
c.onpointerdown=e=>handlePoint(e,v);c.onpointermove=e=>{if(e.pointerType==='mouse'&&S.cross)handlePoint(e,v,true)};c.onpointerleave=()=>{};
}
function hitSeries(px,py,v){let best=null;v.sets.forEach((s,i)=>{let t=S.plot.t0+(px-S.plot.p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t),[x,y]=S.plot.xy(q,i),d=Math.hypot(px-x,py-y);if(!best||d<best.d)best={id:s.id,d}});return best&&best.d<24?best.id:null}
function handlePoint(e,v,move=false){let r=$('#chart').getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,p=S.plot.p;if(px<p.l||px>p.l+S.plot.pw||py<p.t||py>p.t+S.plot.ph){if(!move)hideCross();return}let hit=hitSeries(px,py,v);if(hit&&!move)S.active=hit;let s=v.sets.find(x=>x.id===S.active)||v.sets[0];if(!s)return;let i=v.sets.indexOf(s),t=S.plot.t0+(px-p.l)/S.plot.pw*(S.plot.t1-S.plot.t0),q=nearest(s.a,t);S.cross={id:s.id,q,i};draw(v);}
function paintCross(g,v){let s=v.sets.find(x=>x.id===S.cross.id);if(!s)return;let i=v.sets.indexOf(s),q=S.cross.q,[x,y]=S.plot.xy(q,i),p=S.plot.p;g.strokeStyle=s.color;g.lineWidth=1;g.setLineDash([4,4]);g.beginPath();g.moveTo(x,p.t);g.lineTo(x,p.t+S.plot.ph);g.stroke();g.setLineDash([]);g.fillStyle=s.color;g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();let native=Number.isFinite(q.raw)?q.raw:q.v,valueText=v.mode==='indexed'?`${fmt(q.v)} index · ${fmt(native)} ${s.unit}`:`${fmt(q.v)} ${s.unit}`;let vt=$('#valueTag'),dtg=$('#dateTag'),cl=$('#crossClose');vt.textContent=`${s.label}  ${valueText}`;vt.style.display='block';dtg.textContent=dt(q.sourceT||q.t,true);dtg.style.display='block';cl.style.display='block';let vw=vt.offsetWidth;vt.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-vw-4,x+10))+'px';vt.style.top=Math.max(4,Math.min($('#chartbox').clientHeight-32,y-34))+'px';let dw=dtg.offsetWidth;dtg.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-dw-4,x-dw/2))+'px';dtg.style.top=(p.t+S.plot.ph+8)+'px';cl.style.left=Math.max(4,Math.min($('#chartbox').clientWidth-32,x+10))+'px';cl.style.top=Math.max(4,y+4)+'px'}
$('#crossClose').onclick=e=>{e.stopPropagation();hideCross()};document.addEventListener('keydown',e=>{if(e.key==='Escape')hideCross()});
async function load(){try{[S.catalog,S.defs]=await Promise.all([fetch(BASE+'data/market-backend/data-catalog.json?x='+Date.now()).then(r=>r.json()),fetch(BASE+'data/market-backend/derived-index-definition.json?x='+Date.now()).then(r=>r.json())]);let ids=[...new Set([...CORE,...Object.values(S.defs.indices).flatMap(x=>x.components.map(c=>c.id))])];let got=await Promise.all(ids.map(async id=>{try{let s=await fetch(BASE+'market-evidence/series/'+id+'.json?x='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});return[id,s]}catch{return[id,null]}}));got.forEach(([id,s])=>{if(s)S.series.set(id,s)});$('#status').textContent=`LIVE · ${S.series.size} canonical series loaded`;render()}catch(e){$('#status').textContent='Evidence load failed · '+e.message}}
load();
</script></body></html>
