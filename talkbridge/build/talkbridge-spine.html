<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>TalkBridge</title>
<style>
/* ==== 00-tokens.css ==== */
:root{--cream:#FDFAF7;--ink:#1A1714;--teal:#2E8B8B;--tl:#E6F2F2;--bd:#E2DDD8;--dim:#8A827A;--red:#C0392B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ==== 10-shell.css ==== */
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.screen{display:none;height:100%}
.screen.show{display:flex;flex-direction:column}

</style>
</head>
<body>
<!-- ==== 00-screens.html ==== -->
<div id="s1" class="screen show">
  <div id="app-root"></div>
</div>

<script>
/* ==== 00-boot.js ==== */
/* BOOT — global namespace, no side effects at parse time */
var TB = { version: '9.0.0-a1', parts: [] };
function $(id){ return document.getElementById(id); }

/* ==== 10-store.js ==== */
/* STORE — localStorage wrapper, quota-safe */
TB.parts.push('store');
var STORE = (function(){
  function get(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(_){ return d; } }
  function set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(_){ return false; } }
  function del(k){ try{ localStorage.removeItem(k); }catch(_){} }
  function json(k, d){ try{ return JSON.parse(get(k, '')) || d; }catch(_){ return d; } }
  return { get: get, set: set, del: del, json: json };
})();

/* ==== 20-audio-engine.js ==== */
/* AUDIO ENGINE — placeholder part; real implementation lands at its own gate */
TB.parts.push('audio-engine');

/* ==== 90-wire.js ==== */
/* WIRE — all listeners attach here, after DOM exists */
TB.parts.push('wire');
function wire(){ /* listeners attach here */ }
function boot(){ wire(); }
if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}

</script>
</body>
</html>
