<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071019"><title>OnxyView v1.4.0</title><style>:root{--bg:#071019;--panel:#0a1622;--line:#263746;--text:#f4f7f9;--muted:#94a4b2;--accent:#78d2ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:42px auto minmax(0,1fr)}.top{display:flex;align-items:center;gap:7px;padding:5px 7px;border-bottom:1px solid var(--line);background:#08121d}.brand{font-weight:900;font-size:15px;white-space:nowrap}.brand small{font-size:9px;color:var(--muted)}.search{flex:1;max-width:760px;margin:auto;height:30px;border:1px solid #31506a;border-radius:999px;background:#0a1723;padding:0 12px;outline:0;font-size:11px}.status{font-size:9px;color:var(--muted);white-space:nowrap}.iconbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:#102033}.dimbar{background:#091522;border-bottom:1px solid var(--line)}.dimsummary{height:32px;display:flex;align-items:center;gap:5px;padding:3px 6px;overflow-x:auto}.chev,.dimchip{height:24px;border:1px solid var(--line);border-radius:999px;background:#102033;font-size:8px}.chev{width:28px}.dimchip{padding:0 8px;font-weight:800;white-space:nowrap}.dimchip b{color:var(--accent)}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-height:0;overflow:hidden;padding:0 7px;transition:.14s}.controls.open{max-height:86px;padding:7px}.control label{display:block;font-size:8px;color:var(--muted);margin:0 0 3px 3px;text-transform:uppercase;font-weight:800}.control select{width:100%;height:33px;border:1px solid #31506a;border-radius:9px;background:#0f1e2d;padding:0 8px;font-size:10px}.stage{position:relative;min-height:0;overflow:hidden}.map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}.reader{position:absolute;z-index:20;right:6px;top:6px;bottom:6px;width:min(430px,36vw);border:1px solid #3a5a73;border-radius:14px;background:#0a1622fa;backdrop-filter:blur(18px);transform:translateX(calc(100% + 14px));transition:transform .16s;overflow:auto}.reader.open{transform:none}.rhead{position:sticky;top:0;z-index:2;display:flex;gap:5px;align-items:center;padding:9px;background:#0a1622f7;border-bottom:1px solid var(--line)}.rhead .spacer{flex:1}.rbtn{height:30px;min-width:30px;border:1px solid var(--line);border-radius:8px;background:#102033}.rbody{padding:12px}.reader h1{font-size:19px;line-height:1.13;margin:0 0 8px}.digest{font-size:12px;line-height:1.48;color:#d6e0e7;margin:0 0 11px}.eventmeta{font-size:9px;color:var(--muted);margin-bottom:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}.tag{border:0;border-radius:999px;background:#102033;color:#8fdcff;padding:4px 7px;font-size:8px}.coverage{font-size:10px;font-weight:900;margin:12px 0 5px}.source{display:block;padding:9px 0;border-top:1px solid #ffffff14;text-decoration:none;color:#eef7ff}.source b{font-size:10px}.source .stitle{display:block;font-size:10px;line-height:1.25;margin-top:2px}.source .sdesc{display:block;font-size:9px;line-height:1.35;color:#9fb0bd;margin-top:4px}.source .open{display:inline-block;margin-top:5px;color:#8fdcff;font-size:8px}.settings{position:absolute;z-index:30;right:6px;top:6px;width:min(330px,92vw);border:1px solid #3a5a73;border-radius:12px;background:#0a1622fa;padding:10px;display:none}.settings.open{display:block}.settings h3{font-size:12px;margin:0 0 8px}.settings label{display:block;font-size:8px;color:var(--muted);margin:8px 0 3px}.settings select{width:100%;height:32px;border:1px solid var(--line);border-radius:8px;background:#0f1e2d}.boot{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:#071019;color:var(--muted);font-size:11px}.boot.done{display:none}@media(max-width:700px){.app{grid-template-rows:39px auto 1fr}.brand{font-size:13px}.brand small,.status{display:none}.top{padding:4px 5px;gap:4px}.search{height:29px;font-size:10px}.iconbtn{width:29px;height:29px}.controls{grid-template-columns:1fr 1fr}.controls.open{max-height:150px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(46vh,360px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.reader h1{font-size:16px}.digest{font-size:11px}}</style></head><body><div class="app"><header class="top"><div class="brand">OnxyView <small>v1.4.0</small></div><input id="q" class="search" autocomplete="off" placeholder="Search events, #tags, #favorite, sources…"><div id="status" class="status">Starting…</div><button id="gear" class="iconbtn" aria-label="Settings">⚙</button></header><section class="dimbar"><div class="dimsummary"><button id="chev" class="chev">⌄</button><button class="dimchip">Group <b id="gNow">Subject</b></button><button class="dimchip">Color <b id="cNow">Sentiment</b></button><button class="dimchip">Size <b id="sNow">Importance</b></button><button class="dimchip">Lens <b id="lNow">All</b></button></div><div id="controls" class="controls"><div class="control"><label>Group</label><select id="group"><option value="subject">Subject</option><option value="region">Region</option><option value="sentiment">Sentiment</option><option value="editorialTier">Editorial tier</option><option value="corroboration">Corroboration</option></select></div><div class="control"><label>Color</label><select id="color"><option value="sentiment">Sentiment</option><option value="subject">Subject</option><option value="region">Region</option><option value="editorialTier">Editorial tier</option></select></div><div class="control"><label>Size</label><select id="size"><option value="importance" selected>Importance</option><option value="sources">Independent sources</option><option value="recency">Recency</option></select></div><div class="control"><label>Lens</label><select id="lens"><option value="All">All</option><option value="Core Global">Core Global</option><option value="Markets">Markets</option><option value="Technology">Technology</option><option value="US Spectrum">US Spectrum</option></select></div></div></section><main class="stage"><canvas id="map" class="map"></canvas><aside id="reader" class="reader"></aside><section id="settings" class="settings"><h3>View settings</h3><label>Minimum significance</label><select id="minTier"><option value="background">Everything</option><option value="reported">Reported+</option><option value="developing" selected>Developing+</option><option value="significant">Significant+</option><option value="major">Major only</option></select><label>Time window</label><select id="hours"><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="336">14 days</option><option value="504" selected>21 days</option></select></section><div id="boot" class="boot">Opening event cache…</div></main></div><script>(()=>{'use strict';const $=id=>document.getElementById(id),C=$('map'),ctx=C.getContext('2d',{alpha:false});let data={events:[],sourcePacks:{}},events=[],visible=[],hits=[],current=-1;const state={group:'subject',color:'sentiment',size:'importance',lens:'All',minTier:'developing',hours:504};const rank={background:1,reported:2,developing:3,significant:4,major:5};const factor={background:.35,reported:.55,developing:.9,significant:1.35,major:2.1};const SENT={positive:'#2a8f6a',neutral:'#8b6b2b',negative:'#a74457'};const FKEY='onxyview.favorites.v4';let fav=new Set(JSON.parse(localStorage.getItem(FKEY)||'[]'));function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function clean(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}function val(e,k){if(k==='corroboration'){let n=e.independentSourceCount||1;return n>=6?'6+ sources':n>=3?'3–5 sources':n===2?'2 sources':'1 source'}return e[k]||'Unknown'}function packs(e){if(e.sourcePacks?.length)return e.sourcePacks;let out=[];for(const[n,srcs]of Object.entries(data.sourcePacks||{}))if((e.sources||[]).some(s=>srcs.includes(s)))out.push(n);return out}function passLens(e){return state.lens==='All'||packs(e).includes(state.lens)}function weight(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,100-Math.min(99,(Date.now()-(e.lastSeen||0))/36e5));return Math.max(1,(e.importance||1)*(factor[e.editorialTier||'reported']||1))}function color(e){let v=val(e,state.color);if(state.color==='sentiment')return SENT[v]||SENT.neutral;if(state.color==='editorialTier')return {major:'#536f86',significant:'#496777',developing:'#3d5b68',reported:'#344a55',background:'#2b3940'}[v]||'#3b5360';let h=0;for(let c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 34% 38%)`}function searchable(e){return JSON.stringify([e.headline,e.summary,e.subject,e.region,e.tags,e.sources,e.articles?.map(a=>[a.title,a.description,a.source])]).toLowerCase()}function filtered(){let q=$('q').value.trim().toLowerCase(),cut=Date.now()-state.hours*36e5;return events.filter(e=>(rank[e.editorialTier||'reported']||2)>=rank[state.minTier]&&(e.lastSeen||0)>=cut&&passLens(e)&&(!q||(q==='#favorite'?fav.has(e.eventId):searchable(e).includes(q.replace(/^#/,''))))}function sum(a,b){return a+b}function worst(R,w){if(!R.length)return Infinity;let s=R.reduce(sum,0),mx=Math.max(...R),mn=Math.min(...R),w2=w*w,s2=s*s;return Math.max(w2*mn/s2,s2/(w2*mx))}function layout(vals,width,height){let out=[];if(!vals.length||width<=0||height<=0)return out;let total=vals.reduce(sum,0),ratio=height/width,vw=Math.sqrt(total/ratio),vh=vw*ratio,scale=width/vw,horiz=width<height,row=[],cx=0,cy=0;vals.forEach((v,i,a)=>{let fixed=horiz?vw:vh,cur,add;if(i===a.length-1){let rem=horiz?vw-v/vh:vh-v/vw;cur=worst([v],Math.max(.0001,rem));add=worst([...row,v],fixed)}else{cur=worst(row,fixed);add=worst([...row,v],fixed)}if(add>cur)fin();row.push(v)});if(row.length)fin();return out;function fin(){if(!row.length)return;let rv=row.reduce(sum,0),rw,rh,x=cx,y=cy;if(!horiz){rw=rv/vh;rh=vh;vw-=rw;cx+=rw}else{rw=vw;rh=rv/vw;vh-=rh;cy+=rh}for(let v of row){let w,h;if(!horiz){w=rw;h=v/rw}else{w=v/rh;h=rh}out.push({x:x*scale,y:y*scale,w:w*scale,h:h*scale});if(!horiz)y+=h;else x+=w}horiz=!horiz;row=[]}}}function resize(){let r=C.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);C.width=Math.max(1,Math.floor(r.width*dpr));C.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function wrap(text,x,y,w,h,font){ctx.font=font;ctx.fillStyle='#fff';ctx.textBaseline='top';let words=text.split(/\s+/),line='',yy=y,maxLines=Math.max(1,Math.floor(h/15));for(let i=0,l=0;i<words.length&&l<maxLines;i++){let test=line?line+' '+words[i]:words[i];if(ctx.measureText(test).width>w&&line){ctx.fillText(line,x,yy);yy+=15;l++;line=words[i]}else line=test}if(yy<=y+h-12)ctx.fillText(line,x,yy)}function draw(){let W=C.clientWidth,H=C.clientHeight;if(!W||!H)return;ctx.fillStyle='#071019';ctx.fillRect(0,0,W,H);visible=filtered();let gm=new Map;for(let e of visible){let k=val(e,state.group);if(!gm.has(k))gm.set(k,[]);gm.get(k).push(e)}let gs=[...gm].map(([name,items])=>({name,items:items.sort((a,b)=>weight(b)-weight(a)),weight:items.reduce((s,e)=>s+weight(e),0)})).sort((a,b)=>b.weight-a.weight);let gd=layout(gs.map(g=>g.weight),W,H);hits=[];gs.forEach((g,i)=>{let gr=gd[i];if(!gr)return;ctx.strokeStyle='#071019';ctx.lineWidth=2;ctx.strokeRect(gr.x,gr.y,gr.w,gr.h);let ed=layout(g.items.map(weight),gr.w,gr.h);g.items.forEach((e,j)=>{let r=ed[j];if(!r)return;let x=gr.x+r.x,y=gr.y+r.y,w=r.w,h=r.h;ctx.fillStyle=color(e);ctx.fillRect(x,y,w,h);ctx.strokeStyle='#071019';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);let area=w*h;if(area>650&&w>70&&h>34){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x,y,w,h);let fs=area>8500?18:area>3500?14:11;wrap(e.headline||'Untitled',x+6,y+6,w-12,h-18,`800 ${fs}px system-ui`)}hits.push({x,y,w,h,e})});if(gr.w>70&&gr.h>24){ctx.fillStyle='rgba(7,16,25,.82)';let label=(g.name+'  '+g.items.length);ctx.font='800 10px system-ui';let tw=Math.min(gr.w-8,ctx.measureText(label).width+12);ctx.fillRect(gr.x+4,gr.y+4,tw,20);ctx.fillStyle='#fff';ctx.fillText(label,gr.x+9,gr.y+9)}});$('status').textContent=`${visible.length} events · ${data.articleCount||0} articles`;syncLabels()}function digest(e){if(clean(e.summary))return clean(e.summary);let ds=(e.articles||[]).map(a=>clean(a.description)).filter(x=>x&&x.length>35);return ds.slice(0,3).join(' ')||'No publisher summary available for this event.'}function openReader(e){current=visible.findIndex(x=>x.eventId===e.eventId);let d=digest(e),arts=e.articles||[],r=$('reader');r.innerHTML=`<div class="rhead"><button class="rbtn" id="prev">‹</button><button class="rbtn" id="next">›</button><button class="rbtn" id="tts" aria-label="Read aloud">◖)</button><button class="rbtn" id="fav">${fav.has(e.eventId)?'★':'☆'}</button><span class="spacer"></span><button class="rbtn" id="close">×</button></div><div class="rbody"><h1>${esc(e.headline)}</h1><p class="digest">${esc(d)}</p><div class="eventmeta">${e.independentSourceCount||1} independent sources · importance ${e.importance||0}</div><div class="tags">${(e.tags||[]).slice(0,10).map(t=>`<button class="tag">#${esc(String(t).replace(/^#/,''))}</button>`).join('')}</div><div class="coverage">Source coverage</div>${arts.length?arts.slice(0,20).map(a=>a.url?`<a class="source" target="_blank" rel="noopener" href="${esc(a.url)}"><b>${esc(a.source||'Source')}</b><span class="stitle">${esc(a.title||'Open report')}</span>${clean(a.description)?`<span class="sdesc">${esc(clean(a.description))}</span>`:''}<span class="open">Open original ↗</span></a>`:'').join(''):'<div class="empty">No source links available for this event.</div>'}</div>`;r.classList.add('open');$('close').onclick=()=>r.classList.remove('open');$('prev').onclick=()=>nav(-1);$('next').onclick=()=>nav(1);$('tts').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance((e.headline||'')+'. '+d))};$('fav').onclick=()=>{fav.has(e.eventId)?fav.delete(e.eventId):fav.add(e.eventId);localStorage.setItem(FKEY,JSON.stringify([...fav]));$('fav').textContent=fav.has(e.eventId)?'★':'☆'};r.querySelectorAll('.tag').forEach(b=>b.onclick=()=>{$('q').value=b.textContent;draw()})}function nav(n){if(!visible.length)return;current=(current+n+visible.length)%visible.length;openReader(visible[current])}function syncLabels(){$('gNow').textContent=label(state.group);$('cNow').textContent=label(state.color);$('sNow').textContent=label(state.size);$('lNow').textContent=state.lens}function label(x){return ({subject:'Subject',region:'Region',sentiment:'Sentiment',editorialTier:'Tier',corroboration:'Corroboration',importance:'Importance',sources:'Sources',recency:'Recency'})[x]||x}function point(ev){let r=C.getBoundingClientRect(),x=(ev.clientX??ev.touches?.[0]?.clientX)-r.left,y=(ev.clientY??ev.touches?.[0]?.clientY)-r.top;return{x,y}}C.addEventListener('click',ev=>{let p=point(ev);for(let i=hits.length-1;i>=0;i--){let h=hits[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){openReader(h.e);break}}});$('chev').onclick=()=>{$('controls').classList.toggle('open');setTimeout(resize,170)};$('gear').onclick=()=>$('settings').classList.toggle('open');for(let k of ['group','color','size','lens'])$(k).onchange=e=>{state[k]=e.target.value;draw()};$('minTier').onchange=e=>{state.minTier=e.target.value;draw()};$('hours').onchange=e=>{state.hours=+e.target.value;draw()};$('q').oninput=()=>{clearTimeout(window.qtimer);window.qtimer=setTimeout(draw,80)};addEventListener('resize',()=>{clearTimeout(window.rtimer);window.rtimer=setTimeout(resize,100)});async function boot(){try{let j=await fetch('./onxyview-event-cache.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});data=j;events=j.events||[];$('boot').classList.add('done');$('status').textContent=`${events.length} events`;requestAnimationFrame(resize)}catch(e){$('boot').textContent='Event cache unavailable · '+e.message}}boot()})();</script></body></html>
