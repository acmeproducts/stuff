<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>PRISM · Turn 01 pre-ship R19</title>
<style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}#app{border:0;display:block}</style>
</head>
<body>
<iframe id="app" src="./prism-turn01-pre-ship-r18.html?v=e5c4dd5b78453ee4d911b2378fce091fe7ccc4a7" title="PRISM R19"></iframe>
<script>
(()=>{'use strict';
const frame=document.getElementById('app');
function patch(){
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d||!w.echarts)return setTimeout(patch,120);
  const el=d.getElementById('treemap'),chart=el&&w.echarts.getInstanceByDom(el);
  if(!chart)return setTimeout(patch,120);
  if(chart.__r19Patched)return;
  chart.__r19Patched=true;

  const style=d.createElement('style');
  style.textContent=`
    #treemap{inset:0!important}.surface{background:#07111b}.mapFocusClear{font-size:12px;min-height:30px;padding:4px 9px}
    #sphere{overflow:auto!important;touch-action:auto!important;background:#07111b!important}#orb,#zoomHint{display:none!important}
    .r19Explore{height:100%;overflow:auto;padding:10px;display:grid;gap:9px;align-content:start;background:#07111b}
    .r19Cluster{border:1px solid #29445e;border-radius:12px;background:#0d1d2c;padding:12px;text-align:left;color:#edf6ff;min-height:96px}
    .r19Cluster h3{margin:0 0 5px;font-size:18px}.r19Cluster .n{font-size:11px;color:#91a8bb}.r19Cluster p{margin:8px 0 0;font-size:12px;line-height:1.35;color:#c9d8e4}
    .r19ExploreHead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;background:#07111bf2;padding:4px 0 7px}.r19ExploreHead b{font-size:16px}
    .r19ExploreBack{margin-left:auto;border:1px solid #7dd3fc;border-radius:999px;background:#102338;color:#edf6ff;padding:6px 10px;font-weight:850}
    .r19Event{display:block;width:100%;border:1px solid #29445e;border-left:5px solid #7dd3fc;border-radius:10px;background:#0d1d2c;color:#edf6ff;text-align:left;padding:10px;margin:0 0 7px}.r19Event b{display:block;font-size:14px;line-height:1.3}.r19Event small{display:block;color:#91a8bb;margin-top:5px}
    @media(max-width:760px){.library.detailOpen{display:grid!important;grid-template-rows:48px minmax(0,1fr)!important;height:100%!important}.library.detailOpen .libraryRail{display:block!important;height:48px!important;border-right:0!important;border-bottom:1px solid var(--line)!important;background:#091522!important}.library.detailOpen .libraryRailHead,.library.detailOpen .libraryHelp,.library.detailOpen .libraryList{display:none!important}.library.detailOpen .libraryOmni{display:block!important;height:36px!important;margin:6px 8px!important;width:calc(100% - 16px)!important}.library.detailOpen .libraryStage{display:grid!important;height:auto!important;min-height:0!important}.libraryCompose{padding-bottom:max(9px,env(safe-area-inset-bottom))!important}}
  `;d.head.appendChild(style);
  const brand=d.querySelector('.railBrand small');if(brand)brand.textContent='Turn 01 · pre-ship R19';

  const nativeSet=chart.setOption.bind(chart);
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  function parseMeta(c){const t=String(c.tooltipText||'').replace(/<br\s*\/?>/gi,' ');const score=+(t.match(/(?:Critical|High|Medium|Low)\s+(\d{1,3})/)||[])[1]||50;const sources=+(t.match(/(\d+)\s+sources?/)||[])[1]||1;let age=72,m=t.match(/(\d+)m\s+ago/);if(m)age=+m[1]/60;else if(m=t.match(/(\d+)h\s+ago/))age=+m[1];else if(m=t.match(/(\d+)d\s+ago/))age=+m[1]*24;return{score:clamp(score,0,100),sources:clamp(sources,1,12),age:Math.max(0,age)}}
  function topologyWeight(c){const m=parseMeta(c),mode=d.getElementById('sizeCtl')?.value||'importance';if(mode==='corroboration')return Math.max(1,Math.pow(m.sources,2.35)*(0.82+m.score/280));if(mode==='recency')return Math.max(1,(1+55*Math.exp(-m.age/22))*(0.82+m.score/350));return clamp(Math.exp((m.score-48)/11.5),1,88)}
  function mapColor(hex){const h=String(hex||'').toLowerCase();if(h==='#36d38d')return'#2f841d';if(h==='#d8ad53')return'#8b7616';if(h==='#f06b7e')return'#811b21';const m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return'#46515b';const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;const scale=.62;return'#'+[r,g,b].map(v=>Math.round(18+(v-18)*scale).toString(16).padStart(2,'0')).join('')}
  function transformData(data){return(data||[]).map(g=>{const ng={...g};ng.children=(g.children||[]).map(c=>{const m=parseMeta(c),item={...(c.itemStyle||{})},value=topologyWeight(c);item.color=mapColor(item.color);item.borderColor='#111';return{...c,__r19Score:m.score,__r19Sources:m.sources,__r19Age:m.age,value,itemStyle:item}}).sort((a,b)=>b.value-a.value);ng.value=ng.children.reduce((s,c)=>s+(+c.value||0),0);return ng}).sort((a,b)=>b.value-a.value)}
  function labelStyle(c){const v=+c.value||1;if(v>=45)return'hero';if(v>=18)return'large';if(v>=7)return'medium';return'small'}
  function mapPatch(opt){const s=opt&&opt.series&&opt.series[0];if(!s||s.type!=='treemap')return opt;if(s.data)s.data=transformData(s.data);s.left=0;s.right=0;s.top=0;s.bottom=0;s.sort='desc';s.squareRatio=.95;s.roam=false;s.nodeClick=false;s.breadcrumb={show:false};s.upperLabel={show:true,height:26,color:'#f3f3ef',fontFamily:'Arial,Helvetica,sans-serif',fontSize:15,fontWeight:600,padding:[2,4],overflow:'truncate'};s.itemStyle={gapWidth:1,borderColor:'#111',borderWidth:1};s.levels=[{itemStyle:{borderWidth:2,borderColor:'#111',gapWidth:2}},{upperLabel:{show:true},itemStyle:{borderWidth:1,gapWidth:1}}];s.label={show:true,position:'insideTopLeft',distance:0,padding:[4,5],overflow:'break',lineOverflow:'truncate',formatter:p=>p.data?.children?'':('{'+labelStyle(p.data||{})+'|'+(p.data?.name||p.name||'')+'}'),rich:{hero:{fontFamily:'Arial,Helvetica,sans-serif',fontSize:24,fontWeight:400,lineHeight:27,color:'#fff'},large:{fontFamily:'Arial,Helvetica,sans-serif',fontSize:18,fontWeight:400,lineHeight:21,color:'#fff'},medium:{fontFamily:'Arial,Helvetica,sans-serif',fontSize:13,fontWeight:400,lineHeight:16,color:'#fff'},small:{fontFamily:'Arial,Helvetica,sans-serif',fontSize:10,fontWeight:400,lineHeight:12,color:'#f2f2ee'}}};s.labelLayout=p=>{const r=p.rect||{},ww=r.width||0,hh=r.height||0,area=ww*hh;return{hide:ww<38||hh<24||area<1050,width:Math.max(0,ww-8),height:Math.max(0,hh-6)}};opt.tooltip={...(opt.tooltip||{}),confine:true,backgroundColor:'#071522f4',borderColor:'#416781',borderWidth:1,padding:[8,10],textStyle:{color:'#edf6ff',fontFamily:'Arial,Helvetica,sans-serif',fontSize:13,lineHeight:17},extraCssText:'max-width:260px;white-space:normal;word-break:break-word;box-shadow:0 8px 26px #0009;border-radius:8px'};return opt}
  chart.setOption=function(opt,...rest){return nativeSet(mapPatch(opt),...rest)};

  const navs=[...d.querySelectorAll('.navBtn')],exploreBtn=navs.find(b=>b.dataset.view==='explore'),mapBtn=navs.find(b=>b.dataset.view==='map'),feedBtn=navs.find(b=>b.dataset.view==='feed'),libraryBtn=navs.find(b=>b.dataset.view==='library');const baseHandlers=new Map(navs.map(b=>[b,b.onclick]));let exploreMode=false,focusGroup=null;
  function mapGroups(){const opt=chart.getOption(),s=opt.series&&opt.series[0];return(s&&s.data)||[]}
  function showExplore(){exploreMode=true;navs.forEach(b=>b.classList.toggle('on',b===exploreBtn));d.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='explore'));d.getElementById('context').textContent='Explore';d.querySelector('.shell').classList.remove('libraryMode');d.getElementById('q').hidden=false;renderExplore()}
  function renderExplore(){if(!exploreMode)return;const sphere=d.getElementById('sphere');if(!sphere)return;const groups=mapGroups();sphere.innerHTML='';const wrap=d.createElement('div');wrap.className='r19Explore';sphere.appendChild(wrap);if(focusGroup){const g=groups.find(x=>x.name===focusGroup);if(!g){focusGroup=null;return renderExplore()}const head=d.createElement('div');head.className='r19ExploreHead';head.innerHTML='<b>'+focusGroup+'</b><span class="n">'+((g.children||[]).length)+' items</span><button class="r19ExploreBack">× All clusters</button>';head.querySelector('button').onclick=()=>{focusGroup=null;renderExplore()};wrap.appendChild(head);(g.children||[]).forEach(c=>{const b=d.createElement('button');b.className='r19Event';b.innerHTML='<b>'+String(c.name||'')+'</b><small>Open event</small>';b.onclick=()=>{baseHandlers.get(feedBtn).call(feedBtn);setTimeout(()=>{const card=d.querySelector('.feedCard[data-id="'+c.eventId+'"]');if(card)card.click();baseHandlers.get(mapBtn).call(mapBtn);setTimeout(()=>{showExplore();focusGroup=g.name;renderExplore()},0)},0)};wrap.appendChild(b)})}else{groups.forEach(g=>{const kids=g.children||[],b=d.createElement('button');b.className='r19Cluster';b.innerHTML='<h3>'+String(g.name||'Unknown')+'</h3><div class="n">'+kids.length+' items</div><p>'+kids.slice(0,3).map(x=>String(x.name||'')).join(' · ')+'</p>';b.onclick=()=>{focusGroup=g.name;renderExplore()};wrap.appendChild(b)})}}
  exploreBtn.onclick=()=>{focusGroup=null;showExplore()};[mapBtn,feedBtn,libraryBtn].forEach(b=>{b.onclick=function(){exploreMode=false;return baseHandlers.get(b).call(b)}});function refreshExploreSoon(){if(exploreMode)setTimeout(renderExplore,40)}['q','groupCtl','colorCtl','sizeCtl','windowCtl','filterClose','filterScrim'].forEach(id=>{const x=d.getElementById(id);if(x){x.addEventListener('input',refreshExploreSoon);x.addEventListener('change',refreshExploreSoon);x.addEventListener('click',refreshExploreSoon)}});d.addEventListener('click',e=>{if(exploreMode&&e.target.closest('.chip'))setTimeout(renderExplore,60)});
  const send=d.getElementById('librarySend');if(send){const normalize=()=>{if(send.textContent==='Research')send.textContent='Research web'};normalize();new MutationObserver(normalize).observe(send,{childList:true,characterData:true,subtree:true})}
  baseHandlers.get(mapBtn).call(mapBtn);
}
frame.addEventListener('load',()=>setTimeout(patch,80));
})();
</script>
</body>
</html>
