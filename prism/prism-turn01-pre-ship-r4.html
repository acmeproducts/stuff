function showAI(){const es=[...state.selected].map(id=>events.find(e=>e.eventId===id)).filter(Boolean),p=(currentAnalysis&&currentAnalysis.provider)||Object.keys(aiCfg).find(k=>aiCfg[k]?.verified)||'venice',c=aiCfg[p]||{};openRight('ai',rightHead('AI POV')+'<div class="section"><div class="row"><select id="aiProvider" class="input"><option value="venice">Venice</option><option value="openrouter">OpenRouter</option><option value="anthropic">Anthropic</option></select><select id="aiModel" class="input"></select></div><div id="aiVerify" class="hint"></div></div><div class="section"><div class="row"><h3 style="margin:0">Selected evidence · '+es.length+'</h3><span class="grow"></span><button class="btn" data-clear-evidence>Clear all</button></div>'+es.map(e=>'<div class="evidenceItem"><div><b>'+esc(e.headline)+'</b><div class="hint">'+esc(e.subject)+' · '+esc(e.region)+' · '+e.corroboration+' sources</div></div><button class="removeEv" data-remove-evidence="'+e.eventId+'">×</button></div>').join('')+'</div><div class="section"><h3>Research</h3><div class="suggests"><button class="suggest" data-suggest="What is the throughline between these selected stories that may not be obvious?">Throughline</button><button class="suggest" data-suggest="How often do developments like these occur? Find useful historical comparisons.">Frequency</button><button class="suggest" data-suggest="How recent or unusual are these developments compared with relevant prior examples?">Recency</button><button class="suggest" data-suggest="What important context is missing? Include reliable further reading with working links when known.">Missing context</button></div><textarea id="aiPrompt" class="input prompt" placeholder="Ask about the selected evidence…"></textarea><button class="btn primary" data-ai-run style="width:100%;margin-top:7px">Research with AI</button></div><div class="section"><h3>Analysis</h3><div id="aiResult" class="md">'+(currentAnalysis?.turns?.length?md(currentAnalysis.turns.at(-1 role:'user',content:evidenceText(es)+'\n\nQUESTION\n'+prompt}]})});return j.choices?.[0]?.message?.content||''}async function runAI(){const p=$('aiProvider').value,c=aiCfg[p]||{},model=$('aiModel').value,prompt=$('aiPrompt').value.trim(),es=[...state.selected].map(id=>events.find(e=>e.eventId===id)).filter(Boolean);if(!c.verified||c.model!==model)return toast('Validate provider/model in Config');if(!prompt||!es.length)return toast('Select evidence and enter a question');$('aiResult').textContent='Researching…';try{const response=await callAI(p,c.key,model,prompt,es),turn={prompt,response,at:Date.now(),eventIds:es.map(e=>e.eventId)};if(currentAnalysis&&currentAnalysis.provider===p&&currentAnalysis.model===model){currentAnalysis.turns.push(turn);currentAnalysis.updatedAt=Date.now()}else currentAnalysis={analysisId:'an-'+Date.now()+'-'+hash(prompt),title:prompt.slice(0,100),createdAt:Date.now(),updatedAt:Date.now(),provider:p,model,eventIds:es.map(e=>e.eventId),events:structuredClone(es),turns:[turn]};showAI()}catch(e){$('aiResult').textContent='AI request failed: '+e.message}}async function saveCurrent(){if(!currentAnalysis)return;const i=analyses.findIndex(a=>a.analysisId===currentAnalysis.analysisId);i>=0?analyses[i]=currentAnalysis:analyses.push(currentAnalysis);await put('analyses',currentAnalysis);toast('Saved to Library');renderLibrary()}
function sourceCounts(){const m={};events.forEach(e=>e.coverage.forEach(c=>{m[c.source]||(m[c.source]={articles:0,events:new Set()});m[c.source].articles++;m[c.source].events.add(e.eventId)}));return m}function openSources(){const m=sourceCounts(),dis=new Set(sourceCfg.disabled||[]),names=Object.keys(m).sort();$('sourceList').innerHTML=names.map(n=>'<div class="sourceRow"><input type="checkbox" data-source-toggle="'+esc(n)+'" '+(!dis.has(n)?'checked':'')+'><div><b>'+esc(n)+'</b><small>'+m[n].articles+' articles · '+m[n].events.size+' events</small></div><span class="hint">cache</span></div>').join('')+(sourceCfg.custom||[]).map((s,i)=>'<div class="sourceRow"><input type="checkbox" disabled><div><b>'+esc(s.name)+'</b><small>'+esc(s.url)+'</small></div><button class="btn" data-custom-remove="'+i+'">Remove</button></div>').join('');$('sourceSummary').textContent=enabledSources().size+' enabled of '+names.length;$$('[data-source-toggle]').forEach(x=>x.onchange=()=>{const d=new Set(sourceCfg.disabled||[]);x.checked?d.delete(x.dataset.sourceToggle):d.add(x.dataset.sourceToggle);sourceCfg.disabled=[...d];localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()});$$('[data-custom-remove]').forEach(x=>x.onclick=()=>{sourceCfg.custom.splice(+x.dataset.customRemove,1);localStorage.setItem(LSS,JSON.stringify(sourceCfg));openSources()});$('sourceModal').classList.add('open')}function addSource(){const name=$('newSourceName').value.trim(),url=$('newSourceUrl').value.trim(),type=$('newSourceType').value;if(!name||!/^https?:\/\//i.test(url))return toast('Enter a name and http(s) URL');(sourceCfg.custom||(sourceCfg.custom=[])).push({name,url,type,enabled:false,createdAt:Date.now()});localStorage.setItem(LSS,JSON.stringify(sourceCfg));openSources()}
function exportOne(id){const a=analyses.find(x=>x.analysisId===id);downloadJSON({schema:SCHEMA,analyses:[a]},'prism-analysis.json')}function exportAll(){downloadJSON({schema:SCHEMA,analyses},'prism-library.json')}function downloadJSON(o,n){const b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importLib(file){const j=JSON.parse(await file.text());if(j.schema!==SCHEMA||!Array.isArray(j.analyses))throw new Error('Unsupported library file');const m=new Map(analyses.map(a=>[a.analysisId,a]));j.analyses.forEach(a=>a.analysisId&&m.set(a.analysisId,a));analyses=[...m.values()];await put('analyses',analyses);renderLibrary()}async function deleteAnalysis(id){await del('analyses',id);analyses=analyses.filter(a=>a.analysisId!==id);libActive=null;closeRight();renderLibrary()}function continueAnalysis(id){const a=id?analyses.find(x=>x.analysisId===id):analyses.find(x=>x.analysisId===libActive);if(!a)return;currentAnalysis=a;state.selected=new Set(a.eventIds||[]);showAI()}
function wireRight(){$('[data-close-right]')&&($('[data-close-right]').onclick=closeRight);$$('[data-select]').forEach(b=>b.onclick=()=>toggleSelect(b.dataset.select));$$('[data-remove-evidence]').forEach(b=>b.onclick=()=>toggleSelect(b.dataset.removeEvidence));$('[data-clear-evidence]')&&($('[data-clear-evidence]').onclick=()=>{state.selected.clear();render();showAI()});$('[data-manage-sources]')&&($('[data-manage-sources]').onclick=openSources);$('[data-v-load]')&&($('[data-v-load]').onclick=()=>loadModelUI('venice'));$('[data-or-load]')&&($('[data-or-load]').onclick=()=>loadModelUI('openrouter'));$('[data-v-test]')&&($('[data-v-test]').onclick=()=>validateUI('venice'));$('[data-or-test]')&&($('[data-or-test]').onclick=()=>validateUI('openrouter'));$('[data-a-test]')&&($('[data-a-test]').onclick=()=>validateUI('anthropic'));$$('[data-suggest]').forEach(b=>b.onclick=()=>{$('aiPrompt').value=b.dataset.suggest});$('[data-ai-run]')&&($('[data-ai-run]').onclick=runAI);$('[data-save-analysis]')&&($('[data-save-analysis]').onclick=saveCurrent);$('[data-continue-analysis]')&&($('[data-continue-analysis]').onclick=()=>continueAnalysis());$('[data-export-analysis]')&&($('[data-export-analysis]').onclick=()=>exportOne($('[data-export-analysis]').dataset.exportAnalysis));$('[data-delete-analysis]')&&($('[data-delete-analysis]').onclick=()=>deleteAnalysis($('[data-delete-analysis]').dataset.deleteAnalysis))}
function render(){renderFilters();$('selCount').textContent=state.selected.size+' selected';$('clearSel').disabled=!state.selected.size;$('aiOpen').disabled=!state.selected.size;$('eventCount').textContent=filtered().length+' events';if(state.view==='map')renderMap();if(state.view==='explore')renderExplore();if(state.view==='feed')renderFeed();if(state.view==='library')renderLibrary()}
function pointerDown(e){if(state.mode==='grid')return;pose.drag={x:e.clientX,y:e.clientY,rx:pose.rx,rz:pose.rz};$('dimStage').setPointerCapture?.(e.pointerId)}function pointerMove(e){if(!pose.drag||state.mode==='grid')return;pose.rz=pose.drag.rz+(e.clientX-pose.drag.x)*.08;pose.rx=Math.max(-45,Math.min(55,pose.drag.rx-(e.clientY-pose.drag.y)*.08));applyPose()}function pointerUp(){pose.drag=null}function wheel(e){if(state.mode==='grid')return;e.preventDefault();pose.scale=Math.max(.55,Math.min(1.75,pose.scale*(e.deltaY>0?.92:1.08)));applyPose()}function dist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}function touchStart(e){if(e.touches.length===2)pose.pinch=dist(e.touches)}function touchMove(e){if(e.touches.length===2&&pose.pinch&&state.mode!=='grid'){e.preventDefault();const n=dist(e.touches);pose.scale=Math.max(.55,Math.min(1.75,pose.scale*n/pose.pinch));pose.pinch=n;applyPose()}}function touchEnd(){pose.pinch=0}
function wire(){$$('.navBtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('menu').onclick=()=>$('rail').classList.toggle('closed');$('configNav').onclick=cfgPanel;$('q').oninput=e=>{state.query=e.target.value;render()};$('xCtl').onchange=e=>{state.x=e.target.value;render()};$('yCtl').onchange=e=>{state.y=e.target.value;render()};$('colorCtl').onchange=e=>{state.color=e.target.value;render()};$('sizeCtl').onchange=e=>{state.size=e.target.value;render()};$('windowCtl').onchange=e=>{state.window=+e.target.value;render()};$('clearSel').onclick=()=>{state.selected.clear();render();if(rightMode==='ai')showAI()};$('aiOpen').onclick=showAI;$('spatialMode').onclick=()=>{state.mode='spatial';$('spatialMode').classList.add('on');$('gridMode').classList.remove('on');renderExplore()};$('gridMode').onclick=()=>{state.mode='grid';$('gridMode').classList.add('on');$('spatialMode').classList.remove('on');renderExplore()};$('libSearch').oninput=renderLibrary;$('exportAll').onclick=exportAll;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>e.target.files[0]&&importLib(e.target.files[0]).catch(x=>toast(x.message));$('sourceClose').onclick=()=>$('sourceModal').classList.remove('open');$('enableAll').onclick=()=>{sourceCfg.disabled=[];localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()};$('disableAll').onclick=()=>{sourceCfg.disabled=Object.keys(sourceCounts());localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()};$('addSource').onclick=addSource;const s=$('dimStage');s.addEventListener('pointerdown',pointerDown);s.addEventListener('pointermove',pointerMove);s.addEventListener('pointerup',pointerUp);s.addEventListener('pointercancel',pointerUp);s.addEventListener('wheel',wheel,{passive:false});s.addEventListener('touchstart',touchStart,{passive:false});s.addEventListener('touchmove',touchMove,{passive:false});s.addEventListener('touchend',touchEnd);window.addEventListener('resize',()=>chart&&chart.resize())}
async function boot(){fillSelect('xCtl','X / Group',['subject','region','sentiment','editorialTier','corroboration','source'],state.x);fillSelect('yCtl','Y',['subject','region','sentiment','editorialTier','corroboration','source','importance'],state.y);fillSelect('colorCtl','Color',['sentiment','subject','region','editorialTier','corroboration','source','importance'],state.color);fillSelect('sizeCtl','Z / Size',['importance','corroboration','recency'],state.size);wire();await openDB();events=await all('events');analyses=await all('analyses');try{const r=await fetch(CACHE,{cache:'no-store'}),j=await r.json(),arts=Array.isArray(j.data)?j.data:[],fresh=canonicalize(arts);if(fresh.length){events=fresh;await put('events',events)}$('statusText').textContent='Ready · '+events.length+' events from '+arts.length+' articles';$('status').classList.add('good')}catch(e){$('statusText').textContent=events.length?'Using saved events':'Cache unavailable';$('status').classList.add(events.length?'good':'bad')}render();renderLibrary()}boot().catch(e=>{$('statusText').textContent=e.message;$('status').classList.add('bad')});})();
</script></body></html>
