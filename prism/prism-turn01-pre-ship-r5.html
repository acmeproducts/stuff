<script>
(()=>{'use strict';const CACHE='../data/market-backend/news-cache.json',$=id=>document.getElementById(id);let events=[],selected=new Set(),drillKey=null;const state={x:'subject',y:'region',color:'sentiment',z:'importance',window:168,q:'',filters:{}};const orbit={yaw:0,zoom:1,drag:null,pinch:0};
const DIMS={subject:'Subject',region:'Region',sentiment:'Sentiment',editorialTier:'Tier',source:'Source',importance:'Importance',corroboration:'Corroboration',recency:'Recency'};const CAT=['subject','region','sentiment','editorialTier','source'],XYS=['subject','region','sentiment','editorialTier','source'],COL=['sentiment','editorialTier','subject','region','source'],ZS=['importance','editorialTier','corroboration','recency'];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function hash(s){let x=2166136261;for(const c of String(s)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}
function subject(a){const t=((a.topics||[]).join(' ')+' '+a.title+' '+a.description).toLowerCase();if(/war|iran|ukraine|china|military|election|government|diplom|geopolit/.test(t))return'Geopolitics';if(/ai|tech|chip|software|robot|apple|google|microsoft|semiconductor/.test(t))return'Technology';if(/bank|bond|yield|market|stock|crypto|finance|currency|dollar/.test(t))return'Finance';if(/climate|coral|ocean|temperature|emission|weather/.test(t))return'Climate';if(/health|medical|disease|drug|hospital/.test(t))return'Health';if(/science|research|space|nasa/.test(t))return'Science';if(/company|business|deal|earnings|ceo|sales/.test(t))return'Business';return'World'}function region(a){const t=(a.title+' '+a.description).toLowerCase();if(/iran|israel|gaza|jordan|saudi|qatar|iraq|syria/.test(t))return'Middle East';if(/china|india|japan|korea|singapore|taiwan/.test(t))return'Asia';if(/france|uk |britain|germany|europe|romania|ukraine|sweden|iceland/.test(t))return'Europe';if(/united states|u\.s\.|america|canada|trump|fed /.test(t))return'North America';if(/australia|new zealand/.test(t))return'Oceania';if(/africa|kenya|nigeria|south africa/.test(t))return'Africa';if(/brazil|argentina|mexico|latin america/.test(t))return'Latin America';return'Global'}function sentiment(a){const t=(a.title+' '+a.description).toLowerCase(),n=(t.match(/war|strike|fall|slide|crisis|debt|risk|kill|dead|loss|warn|fail|attack|down/g)||[]).length,p=(t.match(/rise|gain|growth|record|improve|recover|deal|success|up |surge/g)||[]).length;return n>p?'negative':p>n?'positive':'neutral'}function words(s){return new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x.length>3))}function sim(a,b){const A=words(a),B=words(b);let n=0;A.forEach(x=>B.has(x)&&n++);return n/Math.max(1,Math.min(A.size,B.size))}
function canonicalize(arts){const out=[];for(const a of [...arts].sort((a,b)=>+new Date(b.publishedAt)-+new Date(a.publishedAt))){const su=subject(a),re=region(a),ts=+new Date(a.publishedAt);let e=out.find(x=>x.subject===su&&x.region===re&&sim(x.headline,a.title)>=.42&&Math.abs(x.lastSeen-ts)<48*36e5),c={source:a.source,title:a.title,url:a.url,publishedAt:ts};if(e){e.coverage.push(c);e.lastSeen=Math.max(e.lastSeen,ts)}else out.push({eventId:'ev-'+hash(a.title+'|'+ts),headline:a.title,summary:a.description||'',subject:su,region:re,sentiment:sentiment(a),editorialTier:'developing',importance:0,corroboration:1,lastSeen:ts,tags:a.topics||[],coverage:[c]})}for(const e of out){e.corroboration=new Set(e.coverage.map(c=>c.source)).size;const age=Math.max(0,(Date.now()-e.lastSeen)/36e5);e.importance=Math.round(Math.min(100,35+e.corroboration*12+Math.max(0,28-age*.7)+(e.subject==='Geopolitics'?8:0)));e.editorialTier=e.importance>=88?'breaking':e.importance>=76?'major':e.importance>=58?'significant':'developing';e.importanceBucket=e.importance>=80?'Critical':e.importance>=60?'High':e.importance>=40?'Medium':'Low';e.corroborationBucket=e.corroboration>=4?'4+':String(e.corroboration);e.recencyBucket=age<=6?'0–6h':age<=24?'6–24h':age<=72?'1–3d':'3–7d'}return out}
function value(e,k){if(k==='source')return e.coverage[0]?.source||'Unknown';if(k==='importance')return e.importanceBucket;if(k==='corroboration')return e.corroborationBucket;if(k==='recency')return e.recencyBucket;return String(e[k]??'Unknown')}function zScore(e){if(state.z==='importance')return e.importance;if(state.z==='editorialTier')return{breaking:100,major:78,significant:58,developing:38}[e.editorialTier]||30;if(state.z==='corroboration')return Math.min(100,e.corroboration*22);if(state.z==='recency')return Math.max(10,100-Math.min(100,(Date.now()-e.lastSeen)/36e5));return 50}function colorForVal(v){if(state.color==='sentiment')return{positive:'#3ed18a',neutral:'#d7aa46',negative:'#f05b78'}[v]||'#7dd3fc';if(state.color==='editorialTier')return{breaking:'#ff5d73',major:'#f5a94b',significant:'#7dd3fc',developing:'#8195a8'}[v]||'#7dd3fc';const p=['#6db7ff','#a78bfa','#2dd4bf','#f59e0b','#fb7185','#60a5fa','#34d399','#c084fc'];return p[hash(v)%p.length]}
function activeDims(){return[...new Set([state.x,state.y,state.color,state.z])]}function allVals(k){if(k==='importance')return['Critical','High','Medium','Low'];if(k==='corroboration')return['1','2','3','4+'];if(k==='recency')return['0–6h','6–24h','1–3d','3–7d'];return[...new Set(events.map(e=>value(e,k)))].sort()}function filtered(){const cut=Date.now()-state.window*36e5,q=state.q.toLowerCase();return events.filter(e=>e.lastSeen>=cut&&(!q||(e.headline+' '+e.summary+' '+e.tags.join(' ')+' '+e.coverage.map(c=>c.source+' '+c.title).join(' ')).toLowerCase().includes(q))&&activeDims().every(k=>{const s=state.filters[k];return!s||!s.size||s.has(value(e,k))}))}
function syncFilters(){const a=new Set(activeDims());Object.keys(state.filters).forEach(k=>{if(!a.has(k))delete state.filters[k]})}function renderFilters(){syncFilters();const root=$('filters');root.innerHTML='';for(const k of activeDims()){const block=document.createElement('div');block.className='filterBlock';const lab=document.createElement('span');lab.className='filterLabel';lab.textContent=DIMS[k];block.appendChild(lab);const s=state.filters[k]||(state.filters[k]=new Set());const all=document.createElement('button');all.className='chip all '+(!s.size?'on':'');all.textContent='All';all.onclick=()=>{s.clear();render()};block.appendChild(all);allVals(k).forEach(v=>{const b=document.createElement('button');b.className='chip '+(k===state.color?'legend ':'')+(s.has(v)?'on':'');if(k===state.color)b.innerHTML='<i style="background:'+colorForVal(v)+'"></i>'+esc(v);else b.textContent=v;b.onclick=()=>{s.has(v)?s.delete(v):s.add(v);render()};block.appendChild(b)});root.appendChild(block)}}
function populate(){const opts=(arr,prefix)=>arr.map(k=>'<option value="'+k+'">'+prefix+' · '+DIMS[k]+'</option>').join('');$('xCtl').innerHTML=opts(XYS,'X');$('yCtl').innerHTML=opts(XYS,'Y');$('colorCtl').innerHTML=opts(COL,'Color');$('zCtl').innerHTML=opts(ZS,'Z / Size');$('xCtl').value=state.x;$('yCtl').value=state.y;$('colorCtl').value=state.color;$('zCtl').value=state.z}
function renderMacro(){const fs=filtered(),xs=[...new Set(fs.map(e=>value(e,state.x)))].sort(),ys=[...new Set(fs.map(e=>value(e,state.y)))].sort(),m=$('macro');if(!xs.length||!ys.length){m.innerHTML='<div style="padding:40px;color:#91a8bb">No events match.</div>';return}m.innerHTML='<div id="matrix" class="matrix"></div>';const g=$('matrix');g.style.gridTemplateColumns='96px repeat('+xs.length+', minmax(150px,1fr))';const corner=document.createElement('div');corner.className='axisCorner';corner.textContent=DIMS[state.y]+' ↓ / '+DIMS[state.x]+' →';g.appendChild(corner);xs.forEach(x=>{const h=document.createElement('div');h.className='xHead';h.textContent=x;g.appendChild(h)});ys.forEach(y=>{const yh=document.createElement('div');yh.className='yHead';yh.textContent=y;g.appendChild(yh);xs.forEach(x=>{const arr=fs.filter(e=>value(e,state.x)===x&&value(e,state.y)===y),b=document.createElement('button');b.className='cluster '+(!arr.length?'empty ':'')+(arr.some(e=>zScore(e)>=80)?'hot':'');if(!arr.length){b.disabled=true;b.innerHTML='<div class="clusterTop"><div class="clusterTitle">'+esc(x)+' × '+esc(y)+'</div><span class="clusterCount">0</span></div>';g.appendChild(b);return}const zAvg=Math.round(arr.reduce((s,e)=>s+zScore(e),0)/arr.length),top=[...arr].sort((a,b)=>zScore(b)-zScore(a))[0],colors={};arr.forEach(e=>colors[value(e,state.color)]=(colors[value(e,state.color)]||0)+1);const seg=Object.entries(colors).sort((a,b)=>b[1]-a[1]);b.style.minHeight=(94+Math.min(30,zAvg*.22))+'px';b.innerHTML='<div class="clusterTop"><div class="clusterTitle">'+esc(x)+' × '+esc(y)+'</div><span class="clusterCount">'+arr.length+'</span></div><div class="clusterMeta"><span class="pill">'+esc(DIMS[state.z])+' '+Math.round(zAvg)+'</span><span class="pill">Top '+esc(value(top,state.z))+'</span></div><div class="dist">'+seg.map(([v,n])=>'<span style="width:'+(n/arr.length*100)+'%;background:'+colorForVal(v)+'"></span>').join('')+'</div><div class="headline">'+esc(top.headline)+'</div>';b.onclick=()=>openCluster(x,y);g.appendChild(b)})})}
function openCluster(x,y){drillKey={x,y};orbit.yaw=0;orbit.zoom=1;$('drill').classList.add('on');renderDrill()}function closeCluster(){$('drill').classList.remove('on');drillKey=null}function clusterEvents(){return filtered().filter(e=>value(e,state.x)===drillKey.x&&value(e,state.y)===drillKey.y)}function renderDrill(){if(!drillKey)return;const arr=clusterEvents(),root=$('orbit'),r=root.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,R=Math.min(r.width,r.height)*.31*orbit.zoom;$('drillTitle').textContent=drillKey.x+' × '+drillKey.y;$('drillStats').textContent=arr.length+' events · Z='+DIMS[state.z]+' · Color='+DIMS[state.color];root.innerHTML='';const sorted=[...arr].sort((a,b)=>zScore(b)-zScore(a));sorted.forEach((e,i)=>{const n=Math.max(1,sorted.length),base=i/n*Math.PI*2+orbit.yaw,ring=1+Math.floor(i/10),rr=R*(.42+.18*Math.min(2,ring)),z=(Math.cos(base)+1)/2,s=.78+.34*z+(zScore(e)/100)*.08,x=cx+Math.cos(base)*rr,y=cy+Math.sin(base)*rr*.58+(ring-1)*18,card=document.createElement('button');card.className='orbCard '+(selected.has(e.eventId)?'selected':'');card.style.left=x+'px';card.style.top=y+'px';card.style.setProperty('--s',s.toFixed(2));card.style.setProperty('--c',colorForVal(value(e,state.color)));card.style.zIndex=String(10+Math.round(z*40));card.innerHTML='<b>'+esc(e.headline)+'</b><small>'+esc(e.subject)+' · '+esc(e.region)+' · '+e.corroboration+' sources</small><span class="z">'+esc(DIMS[state.z])+': '+esc(value(e,state.z))+'</span>';card.onclick=()=>{selected.has(e.eventId)?selected.delete(e.eventId):selected.add(e.eventId);renderDrill();renderCounts()};root.appendChild(card)});renderSelectionDock()}
function renderSelectionDock(){$('selectionDock').innerHTML=[...selected].slice(0,6).map(id=>{const e=events.find(x=>x.eventId===id);return e?'<span class="selChip">'+esc(e.headline.slice(0,42))+(e.headline.length>42?'…':'')+'</span>':''}).join('')+(selected.size>6?'<span class="selChip">+'+(selected.size-6)+' more</span>':'')}
function renderCounts(){$('selCount').textContent=selected.size+' selected';$('eventCount').textContent=filtered().length+' events'}function render(){renderFilters();renderMacro();renderCounts();if(drillKey)renderDrill()}
function bind(){$('menu').onclick=()=>$('rail').classList.toggle('closed');$('q').oninput=e=>{state.q=e.target.value;render()};$('xCtl').onchange=e=>{state.x=e.target.value;closeCluster();render()};$('yCtl').onchange=e=>{state.y=e.target.value;closeCluster();render()};$('colorCtl').onchange=e=>{state.color=e.target.value;render()};$('zCtl').onchange=e=>{state.z=e.target.value;render()};$('windowCtl').onchange=e=>{state.window=+e.target.value;render()};$('clearSel').onclick=()=>{selected.clear();render()};$('aiBtn').onclick=()=>toast(selected.size?selected.size+' events ready for AI POV':'Select events in a cluster first');$('closeDrill').onclick=closeCluster;const d=$('drill');d.addEventListener('wheel',e=>{if(!drillKey)return;e.preventDefault();orbit.zoom=Math.max(.55,Math.min(1.7,orbit.zoom*(e.deltaY>0?.92:1.08)));renderDrill()},{passive:false});d.addEventListener('pointerdown',e=>{if(e.target.closest('.orbCard,.closeDrill'))return;orbit.drag={x:e.clientX,y:e.clientY,yaw:orbit.yaw}});d.addEventListener('pointermove',e=>{if(!orbit.drag)return;orbit.yaw=orbit.drag.yaw+(e.clientX-orbit.drag.x)*.009;renderDrill()});d.addEventListener('pointerup',()=>orbit.drag=null);d.addEventListener('pointercancel',()=>orbit.drag=null);d.addEventListener('touchstart',e=>{if(e.touches.length===2)orbit.pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});d.addEventListener('touchmove',e=>{if(e.touches.length===2&&orbit.pinch){e.preventDefault();const n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);orbit.zoom=Math.max(.55,Math.min(1.7,orbit.zoom*n/orbit.pinch));orbit.pinch=n;renderDrill()}},{passive:false});d.addEventListener('touchend',()=>orbit.pinch=0);window.onresize=()=>drillKey&&renderDrill()}
async function boot(){populate();bind();try{const r=await fetch(CACHE,{cache:'no-store'}),j=await r.json(),arts=Array.isArray(j.data)?j.data:[];events=canonicalize(arts);$('statusText').textContent='Ready · '+events.length+' events from '+arts.length+' articles';$('status').classList.add('good')}catch(e){$('statusText').textContent='Cache unavailable';$('status').classList.add('bad')}render()}boot();})();
</script></body></html>
