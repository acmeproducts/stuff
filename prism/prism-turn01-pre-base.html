<script>
(()=>{'use strict';
const VERSION='01-pre-base.1',DB_NAME='prism',DB_VERSION=1,CACHE_URL='../data/market-backend/news-cache.json',SCHEMA='prism-library-1';
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const state={view:'explore',query:'',timeWindow:168,filters:{},clusterDimension:'subject',colorDimension:'sentiment',sizeDimension:'importance',lens:'All',selectedEventIds:[],focusedEventId:null,favorites:new Set(),ai:{provider:'venice',model:'',verified:false}};
let db=null,events=[],analyses=[],points=[],yaw=0,pitch=0,drag=null,logs=[];
function log(s){logs.push(new Date().toISOString().slice(11,19)+' '+s);if(logs.length>120)logs.shift();if($('log'))$('log').textContent=logs.join('\n')}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
const FIXTURE=[
 {eventId:'fx-us-iran',headline:'US and Iran trade strikes after renewed regional escalation',summary:'Multiple outlets report renewed military exchanges involving the United States and Iran.',subject:'Geopolitics',region:'Middle East',sentiment:'negative',importance:94,editorialTier:'major',corroboration:4,firstSeen:Date.now()-5e6,lastSeen:Date.now()-1e6,tags:['geopolitics','energy'],coverage:[{articleId:'fx1a',source:'BBC World',title:'US and Iran trade strikes for first time in weeks',description:'Renewed exchanges reported.',url:'#',publishedAt:Date.now()-2e6},{articleId:'fx1b',source:'Financial Times World',title:'US and Iran exchange fire',description:'Oil prices and regional security affected.',url:'#',publishedAt:Date.now()-1.5e6}]},
 {eventId:'fx-ai-chip',headline:'AI infrastructure spending accelerates across major technology firms',summary:'Capital spending tied to AI compute and data-center expansion remains elevated.',subject:'Technology',region:'Global',sentiment:'positive',importance:82,editorialTier:'significant',corroboration:3,firstSeen:Date.now()-9e6,lastSeen:Date.now()-3e6,tags:['ai','chips'],coverage:[{articleId:'fx2a',source:'Financial Times World',title:'AI spending pushes capital budgets higher',description:'Large technology firms increase investment.',url:'#',publishedAt:Date.now()-3e6}]},
 {eventId:'fx-france-debt',headline:'French borrowing costs rise amid debt and political concerns',summary:'Markets are repricing French sovereign risk as debt and political uncertainty persist.',subject:'Finance',region:'Europe',sentiment:'negative',importance:71,editorialTier:'significant',corroboration:2,firstSeen:Date.now()-7e6,lastSeen:Date.now()-4e6,tags:['bonds','europe'],coverage:[{articleId:'fx3a',source:'CNBC World',title:'France borrowing costs near 2008 highs',description:'Debt concerns pressure bond markets.',url:'#',publishedAt:Date.now()-4e6}]},
 {eventId:'fx-coral',headline:'Coral reefs face shorter recovery windows as oceans warm',summary:'New research suggests repeated marine heat waves are reducing recovery time.',subject:'Climate',region:'Global',sentiment:'negative',importance:66,editorialTier:'developing',corroboration:2,firstSeen:Date.now()-8e6,lastSeen:Date.now()-5e6,tags:['climate','science'],coverage:[{articleId:'fx4a',source:'New York Times World',title:'Coral reefs are running out of time to recover',description:'Researchers warn of shrinking recovery intervals.',url:'#',publishedAt:Date.now()-5e6}]},
 {eventId:'fx-byd',headline:'BYD shares slide as Chinese EV competition intensifies',summary:'Strong overseas growth is offset by pressure from fierce domestic competition.',subject:'Business',region:'Asia',sentiment:'negative',importance:61,editorialTier:'developing',corroboration:2,firstSeen:Date.now()-9e6,lastSeen:Date.now()-6e6,tags:['autos','china'],coverage:[{articleId:'fx5a',source:'CNBC World',title:'BYD shares slide as fierce China competition dents earnings',description:'Automaker shares fall after results.',url:'#',publishedAt:Date.now()-6e6}]},
 {eventId:'fx-gas',headline:'Global scramble for gas assets pushes dealmaking higher',summary:'National oil companies and traders are increasing spending on gas infrastructure.',subject:'Energy',region:'North America',sentiment:'neutral',importance:59,editorialTier:'developing',corroboration:2,firstSeen:Date.now()-11e6,lastSeen:Date.now()-7e6,tags:['gas','deals'],coverage:[{articleId:'fx6a',source:'Financial Times Markets',title:'Scramble for gas assets pushes dealmaking to decade high',description:'US gas projects attract investment.',url:'#',publishedAt:Date.now()-7e6}]}
];
function normalizeArticle(a){const published=Date.parse(a.publishedAt)||Number(a.publishedAt)||Date.now();const topic=(a.topics&&a.topics[0])||'general';const subject=topic==='geopolitics'?'Geopolitics':topic==='oil'?'Energy':topic==='equities'||topic==='currency'?'Finance':topic==='inflation'?'Macro':'World';return{eventId:'article:'+a.id,headline:a.title||'Untitled',summary:a.description||'',subject,region:'Global',sentiment:'neutral',importance:a.geopolitical?72:50,editorialTier:a.geopolitical?'developing':'reported',corroboration:1,firstSeen:published,lastSeen:published,tags:a.topics||[],coverage:[{articleId:a.id,source:a.source||a.sourceId||'Unknown',title:a.title||'',description:a.description||'',url:a.url||'#',publishedAt:published}]}}
function adaptCache(j){const raw=Array.isArray(j)?j:Array.isArray(j?.events)?j.events:Array.isArray(j?.data)?j.data:[];if(!raw.length)return[];if(raw[0]?.eventId&&raw[0]?.coverage)return raw;return raw.map(normalizeArticle)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'eventId'});if(!d.objectStoreNames.contains('analyses'))d.createObjectStore('analyses',{keyPath:'analysisId'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function idbGetAll(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function idbPutMany(store,rows){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite'),s=t.objectStore(store);rows.forEach(x=>s.put(x));t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function idbPut(store,row){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(row);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function idbDelete(store,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(key);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
function filtered(){const q=state.query.toLowerCase(),cut=Date.now()-state.timeWindow*36e5;return events.filter(e=>(e.lastSeen||0)>=cut&&(!q||JSON.stringify([e.headline,e.summary,e.subject,e.region,e.tags,e.coverage?.map(c=>c.source)]).toLowerCase().includes(q)))}
function colorFor(e){if(state.colorDimension==='sentiment')return e.sentiment==='positive'?'#43d18b':e.sentiment==='negative'?'#ff7181':'#e8b95c';const v=String(e[state.colorDimension]||'Unknown');let h=0;for(const c of v)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 55% 55%)`}
function eventSize(e){if(state.sizeDimension==='corroboration')return 5+Math.min(12,e.corroboration*2);if(state.sizeDimension==='recency')return 6+Math.max(0,10-(Date.now()-e.lastSeen)/36e5);return 6+Math.min(13,(e.importance||50)/8)}
function setView(v){state.view=v;$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));render();saveState()}
function saveState(){try{localStorage.setItem('prism.state',JSON.stringify({...state,favorites:[...state.favorites]}))}catch(e){}}
function loadState(){try{const s=JSON.parse(localStorage.getItem('prism.state')||'null');if(!s)return;Object.assign(state,s);state.favorites=new Set(s.favorites||[])}catch(e){}}
function selectEvent(id){state.focusedEventId=id;state.selectedEventIds=[id];renderReaders();saveState()}
function renderReaders(){const e=events.find(x=>x.eventId===state.focusedEventId);['readerA','readerM','readerF'].forEach(id=>{const r=$(id);if(!e){r.classList.remove('open');r.innerHTML='';return}r.classList.add('open');r.innerHTML=`<button class="icon close" data-close-reader>×</button><div class="meta"><span>${e.subject}</span><span>${e.region}</span><span>${e.editorialTier}</span><span>${e.corroboration} source${e.corroboration===1?'':'s'}</span></div><h2>${esc(e.headline)}</h2><p>${esc(e.summary)}</p><div class="coverage"><b>Coverage</b>${(e.coverage||[]).map(c=>`<a href="${esc(c.url||'#')}" target="_blank" rel="noopener"><b>${esc(c.source)}</b><small>${esc(c.title)}</small></a>`).join('')}</div>`;r.querySelector('[data-close-reader]').onclick=()=>{state.focusedEventId=null;state.selectedEventIds=[];renderReaders();saveState()}})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderSphere(){const C=$('sphere'),ctx=C.getContext('2d'),r=C.getBoundingClientRect(),dpr=devicePixelRatio||1;C.width=Math.max(1,r.width*dpr);C.height=Math.max(1,r.height*dpr);ctx.scale(dpr,dpr);const list=filtered(),cx=r.width/2,cy=r.height/2,R=Math.min(r.width,r.height)*.39;points=[];ctx.fillStyle='#07111b';ctx.fillRect(0,0,r.width,r.height);ctx.strokeStyle='#7dd3fc22';ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();const groups=[...new Set(list.map(e=>e[state.clusterDimension]||'Unknown'))];list.forEach((e,i)=>{const gi=Math.max(0,groups.indexOf(e[state.clusterDimension]||'Unknown')),base=(gi/groups.length)*Math.PI*2;const a=base+(i*2.399963229728653),z=Math.sin(a*.73+pitch),rr=R*(.25+.65*Math.sqrt((i+.5)/Math.max(1,list.length))),x=cx+Math.cos(a+yaw)*rr,y=cy+Math.sin(a+yaw)*rr*.72+z*R*.12,sz=eventSize(e)*(0.8+0.35*(z+1)/2);points.push({x,y,r:sz,e,z});});points.sort((a,b)=>a.z-b.z).forEach(p=>{ctx.globalAlpha=.55+.45*(p.z+1)/2;ctx.fillStyle=colorFor(p.e);ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();if(state.focusedEventId===p.e.eventId){ctx.globalAlpha=1;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}});ctx.globalAlpha=1;$('countA').textContent=list.length+' events'}
function mapKey(e,k){if(k==='corroboration')return e.corroboration>=4?'4+ sources':e.corroboration>=2?'2–3 sources':'1 source';return e[k]||'Unknown'}
function renderMap(){const list=filtered(),k=$('mapGroup').value,groups={};list.forEach(e=>(groups[mapKey(e,k)]??=[]).push(e));const keys=Object.keys(groups).sort((a,b)=>groups[b].length-groups[a].length);$('mapGrid').style.gridTemplateColumns=`repeat(${Math.min(3,Math.max(1,keys.length))},minmax(0,1fr))`;$('mapGrid').innerHTML=keys.map(g=>`<section class="group"><h3>${esc(g)} · ${groups[g].length}</h3>${groups[g].sort((a,b)=>b.importance-a.importance).slice(0,10).map(e=>`<div class="eventTile" data-event="${esc(e.eventId)}" title="${esc(e.headline)}">${esc(e.headline)}</div>`).join('')}</section>`).join('');$$('#mapGrid [data-event]').forEach(x=>x.onclick=()=>selectEvent(x.dataset.event));$('countM').textContent=list.length+' events'}
function renderFeed(){let list=filtered().slice(),sort=$('sortFeed').value;if(sort==='importance')list.sort((a,b)=>b.importance-a.importance);if(sort==='recency')list.sort((a,b)=>b.lastSeen-a.lastSeen);if(sort==='corroboration')list.sort((a,b)=>b.corroboration-a.corroboration);$('feedList').innerHTML=list.map(e=>`<article class="feedCard" data-event="${esc(e.eventId)}"><div class="meta"><span>${esc(e.subject)}</span><span>${esc(e.region)}</span><span>${e.corroboration} source${e.corroboration===1?'':'s'}</span><span class="star">${state.favorites.has(e.eventId)?'★':'☆'}</span></div><h3>${esc(e.headline)}</h3><p>${esc(e.summary)}</p><div class="feedFoot"><span>importance ${e.importance}</span><span>${new Date(e.lastSeen).toLocaleString()}</span></div></article>`).join('');$$('#feedList [data-event]').forEach(x=>{x.onclick=()=>selectEvent(x.dataset.event);x.querySelector('.star').onclick=ev=>{ev.stopPropagation();const id=x.dataset.event;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);saveState();renderFeed()}});$('countF').textContent=list.length+' events'}
function renderLibrary(){analyses.sort((a,b)=>b.createdAt-a.createdAt);$('countL').textContent=analyses.length+' analyses';$('libraryList').innerHTML=analyses.length?analyses.map(a=>`<article class="analysisCard"><button class="icon close" data-del="${esc(a.analysisId)}">×</button><h3>${esc(a.title)}</h3><p>${new Date(a.createdAt).toLocaleString()} · ${esc(a.provider)} · ${esc(a.model||'fixture')}</p><p>${esc(a.response).slice(0,260)}</p></article>`).join(''):'<div class="empty">No saved analyses yet.<br>Turn 01 pre-base proves the local Library contract; AI execution arrives at 01·ship.</div>';$$('[data-del]').forEach(b=>b.onclick=async()=>{await idbDelete('analyses',b.dataset.del);analyses=analyses.filter(a=>a.analysisId!==b.dataset.del);renderLibrary()})}
function render(){if(state.view==='explore')renderSphere();if(state.view==='map')renderMap();if(state.view==='feed')renderFeed();if(state.view==='library')renderLibrary();renderReaders();renderDiag()}
function exportPayload(){return{schema:SCHEMA,exportedAt:new Date().toISOString(),analyses:analyses.map(a=>({...a})),references:{events:events.filter(e=>analyses.some(a=>(a.eventIds||[]).includes(e.eventId)))}}}
function downloadJSON(obj,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}
async function importPayload(p){if(!p||p.schema!==SCHEMA||!Array.isArray(p.analyses))throw new Error('Unsupported or malformed PRISM library');let imported=0,replaced=0;const known=new Map(analyses.map(a=>[a.analysisId,a]));for(const a of p.analyses){if(!a.analysisId||!a.createdAt)continue;known.has(a.analysisId)?replaced++:imported++;known.set(a.analysisId,a);await idbPut('analyses',a)}analyses=[...known.values()];renderLibrary();return{imported,replaced}}
function roundTripFixture(){const fixture={schema:SCHEMA,exportedAt:new Date().toISOString(),analyses:[{analysisId:'test',createdAt:1,title:'t',prompt:'p',provider:'venice',model:'m',scope:'selected-events',eventIds:['fx'],sourceArticleIds:['a'],response:'r'}],references:{events:[]}};const x=JSON.parse(JSON.stringify(fixture));return x.schema===fixture.schema&&x.analyses[0].analysisId==='test'&&x.analyses[0].response==='r'}
function renderDiag(){const cached=events.length,selected=state.selectedEventIds.length;$('diagKV').innerHTML=`<span>Version</span><b>${VERSION}</b><span>View</span><b>${state.view}</b><span>Events</span><b>${cached}</b><span>Selected</span><b>${selected}</b><span>IndexedDB</span><b>${db?'open':'closed'}</b><span>Cache adapter</span><b>${CACHE_URL}</b><span>Publisher fan-out</span><b>disabled</b>`;$('aiProvider').textContent=state.ai.provider;$('aiModel').textContent=state.ai.model||'unconfigured'}
async function selfTest(){const t=[];const check=(name,fn)=>{try{const ok=!!fn();t.push((ok?'PASS ':'FAIL ')+name);return ok}catch(e){t.push('FAIL '+name+' · '+e.message);return false}};check('artifact stage contract',()=>document.title.includes('Turn 01 pre-base'));check('four routed views',()=>['explore','map','feed','library'].every(id=>$(id)));check('single shared state object',()=>state&&Array.isArray(state.selectedEventIds)&&state.filters);check('fixture canonical Event → Coverage model',()=>FIXTURE.every(e=>e.eventId&&Array.isArray(e.coverage)&&e.coverage.every(c=>c.articleId)));check('library schema JSON round-trip',roundTripFixture);check('normal startup publisher fan-out absent',()=>!document.documentElement.innerHTML.includes('allorigins.win')&&!document.documentElement.innerHTML.includes('corsproxy.io'));check('IndexedDB stores available',()=>db&&['events','analyses','meta'].every(s=>db.objectStoreNames.contains(s)));$('tests').textContent=t.join('\n');return t.every(x=>x.startsWith('PASS'))}
async function refreshCanonical(){try{log('checking same-origin canonical news cache');const r=await fetch(CACHE_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),adapted=adaptCache(j);if(adapted.length){await idbPutMany('events',adapted);events=adapted;await idbPut('meta',{key:'cache',collectorVersion:j.collectorVersion||'unknown',lastSuccess:Date.now(),count:adapted.length});log('canonical cache loaded · '+adapted.length+' records');$('statusText').textContent='Canonical cache · '+adapted.length;$('statusDot').className='dot good';render()}else throw new Error('empty cache')}catch(e){log('cache refresh unavailable · '+e.message);$('statusText').textContent='Using saved cache';$('statusDot').className='dot';render()}}
async function boot(){loadState();$('q').value=state.query;$('cluster').value=state.clusterDimension;$('color').value=state.colorDimension;$('size').value=state.sizeDimension;$('windowCtl').value=String(state.timeWindow);await openDB();const saved=await idbGetAll('events');analyses=await idbGetAll('analyses');events=saved.length?saved:FIXTURE;if(!saved.length)await idbPutMany('events',FIXTURE);log(saved.length?'booted from IndexedDB · '+saved.length+' events':'booted fixture and persisted to IndexedDB');setView(state.view);const pass=await selfTest();$('statusText').textContent=pass?'Ready · cached':'Pre-flight warning';$('statusDot').className='dot '+(pass?'good':'');setTimeout(refreshCanonical,250)}
$$('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('q').oninput=e=>{state.query=e.target.value;render();saveState()};$('cluster').onchange=e=>{state.clusterDimension=e.target.value;render();saveState()};$('color').onchange=e=>{state.colorDimension=e.target.value;render();saveState()};$('size').onchange=e=>{state.sizeDimension=e.target.value;render();saveState()};$('windowCtl').onchange=e=>{state.timeWindow=+e.target.value;render();saveState()};$('mapGroup').onchange=renderMap;$('sortFeed').onchange=renderFeed;$('gear').onclick=()=>{$('drawer').classList.add('open');renderDiag()};$('drawerClose').onclick=()=>$('drawer').classList.remove('open');$('exportLib').onclick=()=>downloadJSON(exportPayload(),'prism-library-'+new Date().toISOString().slice(0,10)+'.json');$('importLib').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text()),z=await importPayload(p);toast(`Imported ${z.imported} · replaced ${z.replaced}`)}catch(err){toast(err.message)}e.target.value=''};$('seedAnalysis').onclick=async()=>{const e=filtered()[0]||events[0],a={analysisId:'fixture-'+Date.now(),createdAt:Date.now(),title:'Fixture POV · '+e.headline,prompt:'Explain why this event matters.',provider:'venice',model:'fixture-only',scope:'this-event',eventIds:[e.eventId],sourceArticleIds:(e.coverage||[]).map(c=>c.articleId),response:'Pre-base fixture analysis used to verify the local Library persistence and export/import contract.'};await idbPut('analyses',a);analyses.push(a);renderLibrary();toast('Fixture analysis saved')};
const C=$('sphere');C.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)/180;pitch=drag.pitch+(e.clientY-drag.y)/240;renderSphere()};C.onpointerup=e=>{if(!drag)return;const moved=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);drag=null;if(moved<8){const r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,p=points.slice().reverse().find(p=>Math.hypot(p.x-x,p.y-y)<=p.r+5);if(p)selectEvent(p.e.eventId)}};addEventListener('resize',()=>state.view==='explore'&&renderSphere());
boot().catch(e=>{log('boot failed · '+e.message);$('statusText').textContent='Boot failed';$('tests').textContent='FAIL boot · '+e.message});
})();
</script>
