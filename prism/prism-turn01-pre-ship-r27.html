function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}async function ingestFiles(files){for(const f of files){const at={id:'att-'+Date.now()+'-'+h(f.name+Math.random()),name:f.name,type:f.type||'application/octet-stream',size:f.size,at:Date.now()};if(at.type.startsWith('image/'))at.dataUrl=await fileToDataURL(f);else{try{at.text=await f.text()}catch{at.text=''}}pending.push(at)}renderPending()}function renderPending(){$('pendingFiles').innerHTML=pending.map(x=>'<span class="pendingChip">'+esc(x.name)+'</span>').join('')}
async function send(){if(busy)return;const a=analyses.find(x=>x.analysisId===activeId),prompt=$('libraryPrompt').value.trim();if(!a||(!prompt&&!pending.length)){toast(a?'Enter a prompt or attach a file':'Select an Analysis');return}busy=true;$('librarySend').disabled=true;$('librarySend').textContent='…';const now=Date.now(),userPrompt=prompt||(pending.length?'Review the attached material and continue the research.':'Continue research.'),attachments=structuredClone(pending);a.status='processing';a.updatedAt=now;a.attachments=[...(a.attachments||[]),...attachments];await put(a);renderCards();try{const response=await callProvider(a,userPrompt,attachments);a.turns=turns(a);a.turns.push({prompt:userPrompt,response,at:Date.now(),attachments:attachments.map(x=>x.id),web:true});a.prompt=userPrompt;a.response=response;a.updatedAt=Date.now();a.status='ready';await put(a);pending=[];$('libraryPrompt').value='';renderPending();renderCards();toast('Research turn saved')}catch(e){a.status='failed';a.updatedAt=Date.now();a.turns=turns(a);a.turns.push({prompt:userPrompt,response:'**Research request failed:** '+e.message,at:Date.now(),attachments:attachments.map(x=>x.id),web:true});await put(a);renderCards();toast(e.message)}finally{busy=false;$('librarySend').disabled=false;$('librarySend').textContent='Send'}}
function setView(v){$$('.navBtn').forEach(b=>b.classList.toggle('on',b.dataset.view===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));$('context').textContent=v[0].toUpperCase()+v.slice(1);$('q').hidden=v==='library';if(v==='library')renderCards();else renderEvents()}function wire(){$$('.navBtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('menu').onclick=()=>{$('rail').classList.toggle('closed')};$('q').oninput=renderEvents;$('libQ').oninput=renderCards;$('libraryRailToggle').onclick=()=>{const p=$('libraryPortal'),collapsed=p.classList.toggle('collapsed'),b=$('libraryRailToggle');b.textContent=collapsed?'›':'‹';b.setAttribute('aria-expanded',String(!collapsed))};$('libraryAttach').onclick=()=>$('libraryAttachFile').click();$('libraryAttachFile').onchange=async e=>{await ingestFiles([...e.target.files]);e.target.value=''};$('librarySend').onclick=send;$('libraryPrompt').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')send()})}
async function boot(){wire();await openDB();events=await all('events');await loadAnalyses();if(!events.length){try{const r=await fetch(CACHE_URL,{cache:'no-store'}),j=await r.json();const data=Array.isArray(j.data)?j.data:[];events=data.slice(0,100).map((a,i)=>({eventId:'cache-'+i,headline:a.title||'Untitled',summary:a.description||'',subject:'News',coverage:[{source:a.source||'Source',title:a.title||'',url:a.url||''}]}))}catch{}}renderCards();renderEvents()}boot().catch(e=>{console.error(e);toast(e.message)})})();
</script></body></html>
