function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'eventId'});if(!d.objectStoreNames.contains('analyses'))d.createObjectStore('analyses',{keyPath:'analysisId'})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}function getOne(store,key){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function putMany(store,arr){return new Promise((res,rej)=>{const tr=db.transaction(store,'readwrite'),s=tr.objectStore(store);arr.forEach(x=>s.put(x));tr.oncomplete=res;tr.onerror=()=>rej(tr.error)})}function delOne(store,key){return new Promise((res,rej)=>{const tr=db.transaction(store,'readwrite');tr.objectStore(store).delete(key);tr.oncomplete=res;tr.onerror=()=>rej(tr.error)})}
function importanceBucket(e){return e.importance>=80?'Critical':e.importance>=60?'High':e.importance>=40?'Medium':'Low'}function groupVal(e,k){return k==='subject'?e.subject:k==='region'?e.region:k==='sentiment'?e.sentiment:k==='editorialTier'?e.editorialTier:importanceBucket(e)}function colorFor(e){const v=groupVal(e,state.color),m={positive:'#36d38d',neutral:'#d8ad53',negative:'#f06b7e',Critical:'#ff5d73',High:'#f59e0b',Medium:'#60a5fa',Low:'#64748b'};return m[v]||'#405362'}function weight(e){return{Critical:144,High:64,Medium:28,Low:12}[importanceBucket(e)]||12}function filtered(){const q=state.query.toLowerCase(),cut=Date.now()-state.window*36e5;return events.filter(e=>e.lastSeen>=cut&&(!q||(e.headline+' '+e.summary).toLowerCase().includes(q)))}function muted(hex){const x=String(hex||'').toLowerCase();if(x==='#36d38d')return'#2e7f22';if(x==='#d8ad53')return'#8d741d';if(x==='#f06b7e')return'#8a2630';return x||'#405362'}
function fitMapTile(btn){const span=btn.firstElementChild;if(!span)return;let fs=btn.classList.contains('big')?24:btn.classList.contains('med')?17:13;span.style.fontSize=fs+'px';span.style.lineHeight='1.08';for(let i=0;i<40;i++){if(span.scrollHeight<=btn.clientHeight-10&&span.scrollWidth<=btn.clientWidth-10)break;fs=Math.max(8,fs-.5);span.style.fontSize=fs+'px';if(fs===8)break}}
function renderMap(){const root=$('treemap'),groups={};for(const e of filtered()){const k=groupVal(e,state.group)||'Unknown';(groups[k]||(groups[k]=[])).push(e)}if(mapFocus&&!groups[mapFocus])mapFocus=null;root.innerHTML='';const wrap=document.createElement('div');wrap.className='r21Map';root.appendChild(wrap);Object.entries(groups).filter(([name])=>!mapFocus||name===mapFocus).forEach(([name,kids])=>{const sec=document.createElement('section');sec.className='r21Group';const head=document.createElement('div');head.className='r21GroupHead';const gb=document.createElement('button');gb.className='r21GroupBtn';gb.textContent=name;gb.onclick=()=>{mapFocus=name;renderMap()};head.appendChild(gb);const count=document.createElement('span');count.className='r21GroupCount';count.textContent=kids.length+' items';head.appendChild(count);if(mapFocus){const x=document.createElement('button');x.className='r21ZoomOut';x.textContent='×';x.onclick=e=>{e.stopPropagation();mapFocus=null;renderMap()};head.appendChild(x)}sec.appendChild(head);[...kids].sort((a,b)=>weight(b)-weight(a)).forEach((e,i)=>{const b=document.createElement('button'),v=weight(e);b.className='r21Tile '+(i<2||v>=64?'big':i<8||v>=28?'med':'small');b.style.background=muted(colorFor(e));const sp=document.createElement('span');sp.textContent=e.headline||'';b.appendChild(sp);b.onclick=()=>selectEvent(e.eventId,true);sec.appendChild(b)});wrap.appendChild(sec)});requestAnimationFrame(()=>wrap.querySelectorAll('.r21Tile').forEach(fitMapTile))}
function selectEvent(id,toggle=true){if(toggle){state.selected.has(id)?state.selected.delete(id):state.selected.add(id)}renderSelection();openReader(id);renderMap();renderFeed()}function clearSelection(){state.selected.clear();renderSelection();renderMap();renderFeed()}function renderSelection(){const n=state.selected.size;$('selCount').textContent=n;$('selCount').hidden=!n;$('aiOpen').disabled=!n&&!aiBusy;$('aiEvidenceList').innerHTML=[...state.selected].map(id=>{const e=events.find(x=>x.eventId===id);return e?'<div class="evidenceItem"><b>'+esc(e.headline)+'</b></div>':''}).join('');$('aiContextSummary').textContent='Selected context · '+n+' item'+(n===1?'':'s')}
function readerHtml(e){return'<div class="readerHead"><div><h2>'+esc(e.headline)+'</h2></div><button class="icon readerClose">×</button></div><p>'+esc(e.summary)+'</p>'}function openReader(id){const e=events.find(x=>x.eventId===id);if(!e)return;['A','M','F'].forEach(s=>{const r=$('reader'+s),w=$('work'+s);r.innerHTML=readerHtml(e);w.classList.add('readerOpen');r.querySelector('.readerClose').onclick=()=>w.classList.remove('readerOpen')})}
function renderFeed(){const box=$('feedList');box.innerHTML=filtered().sort((a,b)=>weight(b)-weight(a)).map(e=>'<article class="feedCard" data-id="'+e.eventId+'" style="--c:'+colorFor(e)+'"><h3>'+esc(e.headline)+'</h3><p>'+esc(e.summary)+'</p></article>').join('');box.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>selectEvent(x.dataset.id,true))}
function renderMarkdown(target,md){if(!window.marked||!window.DOMPurify){target.textContent=md;return}target.innerHTML=DOMPurify.sanitize(marked.parse(String(md||''),{gfm:true}))}
function analysisTurns(a){const t=Array.isArray(a.turns)?a.turns.filter(x=>x&&(x.prompt||x.response)):[];if(t.length)return t;if(a.prompt||a.response)return[{prompt:a.prompt||'',response:a.response||'',askedAt:a.createdAt||Date.now(),answeredAt:a.updatedAt||a.createdAt||Date.now()}];return[]}function queryTokens(q){return String(q||'').trim().split(/\s+/).filter(Boolean).map(t=>({negative:t.startsWith('-'),pattern:t.replace(/^-/, '')}))}function globHit(text,p){let r='';for(const ch of p)r+=ch==='*'?'.*':ch==='?'?'.':/[\\^$.*+?()[\]{}|]/.test(ch)?'\\'+ch:ch;try{return new RegExp(r,'i').test(String(text||''))}catch{return String(text||'').toLowerCase().includes(String(p).toLowerCase())}}function textMatches(text,q){return queryTokens(q).every(t=>t.negative?!globHit(text,t.pattern):globHit(text,t.pattern))}async function refreshAnalysesFromDB(renderNow=true){analyses=await all('analyses');if(renderNow)renderLibrary();return analyses}function selectLibraryAnalysis(id){activeLibraryId=id;$('libraryPortal').classList.add('detailOpen');renderLibrary()}async function deleteAnalysis(id){await delOne('analyses',id);if(activeLibraryId===id)activeLibraryId=null;await refreshAnalysesFromDB(true)}
function renderLibraryDetail(a){const head=$('libraryDetailHead'),body=$('libraryTranscript'),compose=$('libraryCompose');if(!a){head.innerHTML='<div><h2>Live research</h2><p>Select a research item.</p></div>';body.innerHTML='<div class="empty">No research item selected.</div>';compose.hidden=true;return}head.innerHTML='<div><h2>'+esc(a.title||'Untitled research')+'</h2><p>Status: '+esc(a.status||'ready')+' · Created '+esc(fmt(a.createdAt))+' · Updated '+esc(fmt(a.updatedAt||a.createdAt))+'</p></div><input id="analysisQ" class="analysisOmni" type="search" placeholder="Search this Analysis…">';const q=head.querySelector('#analysisQ');q.oninput=()=>renderLibraryDetail(a);body.innerHTML='';analysisTurns(a).forEach((t,i)=>{if(q.value&&!textMatches((t.prompt||'')+' '+(t.response||''),q.value))return;const s=document.createElement('section');s.className='researchTurn';s.innerHTML='<div class="turnMeta">Query '+(i+1)+' · '+esc(fmt(t.askedAt))+'</div><div class="researchQuestion">'+esc(t.prompt||'')+'</div><div class="turnMeta">Response '+(i+1)+'</div><div class="aiResult researchResponse"></div>';if(t.response)renderMarkdown(s.querySelector('.researchResponse'),t.response);else s.querySelector('.researchResponse').textContent='Analysis is processing…';body.appendChild(s)});if(a.status==='failed'&&a.error)body.innerHTML+='<div class="err">'+esc(a.error)+'</div>';compose.hidden=false}
function renderLibrary(){const q=$('libQ').value,visible=[...analyses].sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).filter(a=>!q||textMatches((a.title||'')+' '+analysisTurns(a).map(t=>(t.prompt||'')+' '+(t.response||'')).join(' '),q));$('libCount').textContent=visible.length+'/'+analyses.length;const b=$('libraryList');b.innerHTML='';if(!visible.length){b.innerHTML='<div class="empty">No research items.</div>';renderLibraryDetail(null);return}if(!visible.some(a=>a.analysisId===activeLibraryId))activeLibraryId=visible[0].analysisId;visible.forEach(a=>{const d=document.createElement('article');d.className='analysisCard'+(a.analysisId===activeLibraryId?' on':'');d.innerHTML='<div class="analysisCardTop"><h3>'+esc(a.title||'Untitled research')+'</h3><button class="analysisDelete">×</button></div><div class="analysisMeta">Created '+esc(fmt(a.createdAt))+' | Updated '+esc(fmt(a.updatedAt||a.createdAt))+'</div><div class="analysisStatus '+esc(a.status||'ready')+'">Status: '+esc(a.status||'ready')+'</div>';d.onclick=e=>{if(e.target.closest('button')){deleteAnalysis(a.analysisId);return}selectLibraryAnalysis(a.analysisId)};b.appendChild(d)});renderLibraryDetail(analyses.find(a=>a.analysisId===activeLibraryId))}
function activeAI(){const p=aiCfg.activeProvider,c=aiCfg[p]||{};return c.verified&&c.key&&c.model?{provider:p,key:c.key,model:c.model}:null}async function callAI(provider,key,model,prompt){const url=provider==='venice'?'https://api.venice.ai/api/v1/chat/completions':provider==='openrouter'?'https://openrouter.ai/api/v1/chat/completions':'https://api.anthropic.com/v1/messages';const body=provider==='anthropic'?{model,max_tokens:4000,messages:[{role:'user',content:prompt}]}:{model,max_tokens:4000,messages:[{role:'user',content:prompt}]};const headers={'Content-Type':'application/json'};if(provider==='anthropic'){headers['x-api-key']=key;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true'}else headers.Authorization='Bearer '+key;const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return provider==='anthropic'?(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join(''):(j.choices?.[0]?.message?.content||'')}
async function persistAnalysis(a){await putMany('analyses',[structuredClone(a)]);const check=await getOne('analyses',a.analysisId);if(!check)throw new Error('Library verification failed');await refreshAnalysesFromDB(false);currentAnalysis=check;activeLibraryId=check.analysisId;renderLibrary();return check}
async function runAI(){const runtime=activeAI(),prompt=$('aiPrompt').value.trim(),es=events.filter(e=>state.selected.has(e.eventId));if(!runtime){toast('Choose and validate the AI POV default in ⚙');return}if(!prompt){toast('Enter a research question');return}if(!es.length){toast('Select at least one event');return}const createdAt=Date.now(),analysis={analysisId:'an-'+createdAt+'-'+h(prompt),createdAt,updatedAt:createdAt,title:prompt.length>90?prompt.slice(0,87)+'…':prompt,prompt,provider:runtime.provider,model:runtime.model,status:'processing',events:structuredClone(es),response:'',turns:[{prompt,response:'',askedAt:createdAt,answeredAt:null}],attachments:[]};await persistAnalysis(analysis);$('aiResult').textContent='Searching and analyzing…';aiBusy=true;$('libQ').value='';$('aiPanel').classList.remove('open');setView('library');selectLibraryAnalysis(analysis.analysisId);try{const response=await callAI(runtime.provider,runtime.key,runtime.model,prompt),done=Date.now();analysis.response=response;analysis.status='ready';analysis.updatedAt=done;analysis.turns[0].response=response;analysis.turns[0].answeredAt=done;await persistAnalysis(analysis);renderMarkdown($('aiResult'),response)}catch(e){analysis.status='failed';analysis.error=e.message;analysis.updatedAt=Date.now();await persistAnalysis(analysis)}finally{aiBusy=false}}
async function continueLibraryResearch(){let a=analyses.find(x=>x.analysisId===activeLibraryId),prompt=$('libraryPrompt').value.trim(),runtime=activeAI();if(!a||!prompt||!runtime)return;a=structuredClone(a);const askedAt=Date.now();a.status='processing';a.updatedAt=askedAt;a.turns=analysisTurns(a);a.turns.push({prompt,response:'',askedAt,answeredAt:null});await persistAnalysis(a);$('libraryPrompt').value='';try{const response=await callAI(runtime.provider,runtime.key,runtime.model,prompt),done=Date.now();const t=a.turns[a.turns.length-1];t.response=response;t.answeredAt=done;a.status='ready';a.updatedAt=done;await persistAnalysis(a)}catch(e){a.status='failed';a.error=e.message;a.updatedAt=Date.now();await persistAnalysis(a)}}
function fillDimensionControls(){const opts={group:['subject','region','sentiment','editorialTier'],color:['sentiment','subject','region','importance'],size:['importance']};for(const [role,id] of Object.entries({group:'groupCtl',color:'colorCtl',size:'sizeCtl'})){const s=$(id);s.innerHTML=opts[role].map(v=>'<option value="'+v+'">'+v+'</option>').join('');s.value=state[role]}}
function setView(v){state.view=v;$$('.navBtn').forEach(b=>b.classList.toggle('on',b.dataset.view===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));$('context').textContent=v[0].toUpperCase()+v.slice(1);document.querySelector('.shell').classList.toggle('libraryMode',v==='library');$('q').hidden=v==='library';render()}function render(){if(state.view==='map')renderMap();if(state.view==='feed')renderFeed();if(state.view==='library')renderLibrary();$('eventCount').textContent=filtered().length+' items';renderSelection()}
function wire(){$$('.navBtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('menu').onclick=()=>$('rail').classList.toggle('closed');$('q').oninput=e=>{state.query=e.target.value;render()};$('libQ').oninput=renderLibrary;$('groupCtl').onchange=e=>{state.group=e.target.value;mapFocus=null;render()};$('colorCtl').onchange=e=>{state.color=e.target.value;render()};$('sizeCtl').onchange=e=>{state.size=e.target.value;render()};$('windowCtl').onchange=e=>{state.window=+e.target.value;render()};$('settings').onclick=()=>$('settingsPanel').classList.add('open');$('settingsClose').onclick=()=>$('settingsPanel').classList.remove('open');$('aiOpen').onclick=()=>$('aiPanel').classList.add('open');$('aiClose').onclick=()=>$('aiPanel').classList.remove('open');$('aiClearSelection').onclick=clearSelection;$('aiRun').onclick=runAI;$('librarySend').onclick=continueLibraryResearch;$('libraryAttach').onclick=()=>$('libraryAttachFile').click()}
async function boot(){fillDimensionControls();wire();await openDB();events=await all('events');analyses=await all('analyses');if(!events.length){try{const r=await fetch(CACHE_URL,{cache:'no-store'}),j=await r.json();const a=Array.isArray(j.data)?j.data:[];events=a.slice(0,80).map((x,i)=>({eventId:'ev-'+i,headline:x.title||'Untitled',summary:x.description||'',subject:'World',region:'Global',sentiment:'neutral',importance:50,lastSeen:+new Date(x.publishedAt||Date.now())}));await putMany('events',events)}catch(e){$('statusText').textContent=e.message}}$('statusText').textContent='Ready · '+events.length+' events';renderLibrary();render()}
boot().catch(e=>{$('statusText').textContent=e.message});
