<script>
(()=>{'use strict';
const VERSION='01-base.1',DB_NAME='prism',DB_VERSION=2,CACHE_URL='../data/market-backend/news-cache.json',SCHEMA='prism-library-1';
const $=id=>document.getElementById(id),$$=s=>[...document.querySelectorAll(s)];
const state={view:'explore',query:'',timeWindow:168,filters:{subject:[],region:[],sentiment:[]},clusterDimension:'subject',colorDimension:'sentiment',sizeDimension:'importance',mapGroup:'subject',mapSize:'importance',selectedEventIds:[],focusedEventId:null,favorites:new Set()};
let db=null,articles=[],events=[],analyses=[],points=[],yaw=.25,pitch=-.12,drag=null,logs=[],canonNotes=[],cacheMeta={};
const STOP=new Set('the a an and or but for nor so yet to of in on at by with from into over after before amid as is are was were be been being has have had will would can could may might should this that these those its their his her our your about more new latest says say said amid across against between first up down out not'.split(' '));
const SUBJECTS={Geopolitics:['iran','israel','ukraine','russia','china','trump','military','war','strike','missile','defence','defense','sanction','nato','diplomatic'],Technology:['ai','artificial','intelligence','chip','semiconductor','apple','google','microsoft','software','robot','technology','data center'],Finance:['bank','bond','yield','debt','market','stock','shares','fund','currency','dollar','crypto','rate'],Climate:['climate','coral','ocean','warming','flood','glacier','emission','temperature'],Health:['health','disease','vaccine','hospital','medical'],Science:['science','research','space','nasa','study'],Business:['company','ceo','earnings','manufacturing','business','deal','sales','profit']};
const REGIONS={"Middle East":['iran','israel','gaza','tehran','jordan','saudi','lebanon','syria','iraq'],Asia:['china','india','japan','korea','taiwan','byd','beijing','delhi'],Europe:['france','ukraine','russia','romania','eu ','europe','uk ','britain','germany','sweden','iceland'],"North America":['u.s.',' us ','united states','america','canada','mexico'],Oceania:['australia','new zealand'],Africa:['africa','nigeria','kenya','egypt','south africa'],"Latin America":['argentina','brazil','mexico','chile','colombia']};
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function hash(s){let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
function hcolor(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return`hsl(${h} 48% 52%)`}
function log(s){logs.push(new Date().toISOString().slice(11,19)+' '+s);if(logs.length>140)logs.shift();if($('runtime'))$('runtime').textContent=logs.join('\n')}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)}
function classify(text,map,fallback='Global'){text=' '+String(text||'').toLowerCase()+' ';let best=[fallback,0];for(const[k,words]of Object.entries(map)){let n=0;for(const w of words)if(text.includes(w))n++;if(n>best[1])best=[k,n]}return best[0]}
function sentiment(text){text=String(text||'').toLowerCase();let neg=['war','strike','attack','crisis','fall','slide','debt','risk','kill','dead','inflation','loss','flood','warming'].filter(w=>text.includes(w)).length,pos=['rise','growth','gain','recover','profit','peace','deal','expand','improve','record'].filter(w=>text.includes(w)).length;return neg>pos?'negative':pos>neg?'positive':'neutral'}
function tokens(s){return [...new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)))].slice(0,20)}
function sim(a,b){const A=new Set(tokens(a)),B=tokens(b);if(!A.size||!B.length)return 0;let n=0;for(const x of B)if(A.has(x))n++;return n/Math.min(A.size,B.length)}
function articleToCoverage(a){return{articleId:a.id||'a-'+hash((a.source||'')+'|'+(a.url||a.title)),source:a.source||a.sourceId||'Unknown',title:a.title||'Untitled',description:a.description||'',url:a.url||'#',publishedAt:+new Date(a.publishedAt||Date.now())}}
function canonicalize(list){const sorted=[...list].sort((a,b)=>+new Date(b.publishedAt)-+new Date(a.publishedAt)),out=[];for(const a of sorted){const text=(a.title||'')+' '+(a.description||'')+' '+((a.topics||[]).join(' '));const subj=classify(text,SUBJECTS,'World'),reg=classify(text,REGIONS,'Global'),cov=articleToCoverage(a);let best=null,score=0;for(const e of out){if(e.subject!==subj)continue;const age=Math.abs(cov.publishedAt-e.lastSeen)/36e5;if(age>48)continue;const s=sim(a.title,e.headline);if(s>score){score=s;best=e}}if(best&&score>=.42){best.coverage.push(cov);best.firstSeen=Math.min(best.firstSeen,cov.publishedAt);best.lastSeen=Math.max(best.lastSeen,cov.publishedAt);best.corroboration=new Set(best.coverage.map(x=>x.source)).size;best.importance=Math.min(100,best.importance+8);best.tags=[...new Set([...best.tags,...(a.topics||[])])];}else{const tier=(a.geopolitical||a.outlook)?'significant':'developing';out.push({eventId:'ev-'+hash(tokens(a.title).sort().slice(0,8).join('|')+'|'+subj),headline:a.title||'Untitled event',summary:a.description||'',subject:subj,region:reg,sentiment:sentiment(text),importance:(a.geopolitical?78:a.outlook?70:54)+Math.min(18,(a.topics||[]).length*4),editorialTier:tier,corroboration:1,firstSeen:cov.publishedAt,lastSeen:cov.publishedAt,tags:a.topics||[],coverage:[cov]})}}
out.forEach(e=>{if(e.corroboration>=4)e.editorialTier='major';else if(e.corroboration>=2&&e.editorialTier==='developing')e.editorialTier='significant';e.importance=Math.min(100,e.importance+Math.min(20,(e.corroboration-1)*7))});canonNotes=[`articles ${list.length}`,`events ${out.length}`,`merged coverage ${list.length-out.length}`,`multi-source events ${out.filter(e=>e.corroboration>1).length}`];return out}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('events'))d.createObjectStore('events',{keyPath:'eventId'});if(!d.objectStoreNames.contains('analyses'))d.createObjectStore('analyses',{keyPath:'analysisId'});if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});if(!d.objectStoreNames.contains('articles'))d.createObjectStore('articles',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function putMany(store,rows){return new Promise((res,rej)=>{const tr=db.transaction(store,'readwrite'),s=tr.objectStore(store);rows.forEach(x=>s.put(x));tr.oncomplete=res;tr.onerror=()=>rej(tr.error)})}
function putMeta(key,value){return new Promise((res,rej)=>{const tr=db.transaction('meta','readwrite');tr.objectStore('meta').put({key,value});tr.oncomplete=res;tr.onerror=()=>rej(tr.error)})}
async function cachedBoot(){events=await all('events');analyses=await all('analyses');cacheMeta=(await all('meta')).reduce((o,x)=>(o[x.key]=x.value,o),{});if(events.length){log('rendered '+events.length+' cached canonical events');renderAll()}try{const r=await fetch(CACHE_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('cache '+r.status);const j=await r.json();articles=Array.isArray(j)?j:(j.data||j.stories||j.articles||[]);if(!articles.length)throw new Error('cache contained no articles');const fresh=canonicalize(articles);events=fresh;await putMany('events',events);await putMeta('lastCacheLoad',Date.now());await putMeta('collectorVersion',j.collectorVersion||'unknown');cacheMeta.lastCacheLoad=Date.now();cacheMeta.collectorVersion=j.collectorVersion||'unknown';renderAll();setStatus(`Ready · ${events.length} events from ${articles.length} articles`,true);log('same-origin cache ingested');}catch(e){setStatus(events.length?`Saved cache · ${events.length} events`:'Cache unavailable',!!events.length);log('refresh failed: '+e.message)}runTests()}
function setStatus(text,good){$('statusText').textContent=text;$('status').className='status '+(good?'good':'bad')}
function vals(k){return [...new Set(events.map(e=>String(e[k]??'Unknown')))].sort()}
function filtered(){const q=state.query.trim().toLowerCase(),cut=Date.now()-state.timeWindow*36e5;return events.filter(e=>e.lastSeen>=cut&&Object.entries(state.filters).every(([k,a])=>!a.length||a.includes(String(e[k])))&&(!q||JSON.stringify([e.headline,e.summary,e.subject,e.region,e.tags,e.coverage.map(c=>[c.source,c.title])]).toLowerCase().includes(q)))}
function setView(v){state.view=v;$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.view===v));$$('.view').forEach(x=>x.classList.toggle('on',x.id===v));renderAll()}
function renderFilters(){const specs=[['subject','Subject'],['region','Region'],['sentiment','Sentiment']];$('filterTray').innerHTML=specs.map(([k,label])=>`<div class="filterLine"><div class="filterName">${label}</div><div class="chips"><button class="chip all ${state.filters[k].length?'':'on'}" data-f="${k}" data-v="__all">All</button>${vals(k).map(v=>`<button class="chip ${state.filters[k].includes(v)?'on':''}" data-f="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');$$('[data-f]').forEach(b=>b.onclick=()=>{const k=b.dataset.f,v=b.dataset.v;if(v==='__all')state.filters[k]=[];else state.filters[k]=state.filters[k].includes(v)?state.filters[k].filter(x=>x!==v):[...state.filters[k],v];renderAll()})}
function colorOf(e,k=state.colorDimension){const v=String(e[k]??'Unknown');if(k==='sentiment')return{positive:'#3ed18a',neutral:'#e9bb5d',negative:'#ff6f82'}[v]||'#91a8bb';if(k==='editorialTier')return{major:'#9d8cff',significant:'#69b7ff',developing:'#5b7f9c'}[v]||'#91a8bb';return hcolor(v)}
function sizeWeight(e,k=state.sizeDimension){if(k==='corroboration')return .78+Math.min(1.1,e.corroboration*.18);if(k==='recency'){const h=(Date.now()-e.lastSeen)/36e5;return .72+1.2*Math.max(0,1-h/168)}return .72+1.15*(e.importance/100)}
function legendHtml(k,arr){return`<div class="legendTitle">${esc(k)} · ${arr.length} values</div>`+arr.map(v=>`<span class="leg"><i class="sw" style="background:${colorOf({[k]:v},k)}"></i>${esc(v)}</span>`).join('')}
function rotate(p){let{x,y,z}=p,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),x1=x*cy-z*sy,z1=x*sy+z*cy,y1=y*cp-z1*sp;return{x:x1,y:y1,z:y*sp+z1*cp}}
function spherePoints(list){const groups=[...new Set(list.map(e=>String(e[state.clusterDimension])))],centers={};groups.forEach((g,i)=>{const a=i*Math.PI*(3-Math.sqrt(5)),z=1-2*(i+.5)/Math.max(1,groups.length),r=Math.sqrt(Math.max(0,1-z*z));centers[g]={x:r*Math.cos(a)*.72,y:z*.72,z:r*Math.sin(a)*.72}});const count={};return list.map(e=>{const g=String(e[state.clusterDimension]),i=count[g]||0,n=list.filter(x=>String(x[state.clusterDimension])===g).length;count[g]=i+1;const c=centers[g],a=i*Math.PI*(3-Math.sqrt(5)),rr=.07+.25*Math.sqrt((i+.5)/Math.max(1,n));return{e,g,x:c.x+Math.cos(a)*rr,y:c.y+Math.sin(a)*rr,z:c.z+.05*Math.sin(a*1.7)}})}
function drawSphere(){const C=$('sphere'),r=C.getBoundingClientRect(),d=devicePixelRatio||1;C.width=Math.max(1,Math.round(r.width*d));C.height=Math.max(1,Math.round(r.height*d));const x=C.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);const list=filtered(),raw=spherePoints(list),R=Math.min(r.width,r.height)*.38,cx=r.width/2,cy=r.height/2;points=[];for(const p of raw){const q=rotate(p),sz=5+15*sizeWeight(p.e)*(R/320),px=cx+q.x*R,py=cy+q.y*R;points.push({...p,q,px,py,sz})}points.sort((a,b)=>a.q.z-b.q.z);for(const p of points){x.globalAlpha=.38+.62*((p.q.z+1)/2);x.fillStyle=colorOf(p.e);x.beginPath();x.arc(p.px,p.py,p.sz/2,0,Math.PI*2);x.fill();if(state.selectedEventIds.includes(p.e.eventId)){x.lineWidth=2;x.strokeStyle='#fff';x.stroke()}}x.globalAlpha=1;$('countA').textContent=`${list.length} events · ${list.reduce((n,e)=>n+e.coverage.length,0)} articles`;const lv=[...new Set(list.map(e=>String(e[state.colorDimension])))];$('legendA').innerHTML=legendHtml(state.colorDimension,lv);renderClusterLabels(raw,groupsOf(raw),R,cx,cy)}
function groupsOf(raw){const o={};raw.forEach(p=>{if(!o[p.g])o[p.g]=[];o[p.g].push(p)});return o}
function renderClusterLabels(raw,gs,R,cx,cy){const host=$('labels');host.innerHTML='';for(const[g,a]of Object.entries(gs)){const c=a.reduce((o,p)=>(o.x+=p.x,o.y+=p.y,o.z+=p.z,o),{x:0,y:0,z:0});c.x/=a.length;c.y/=a.length;c.z/=a.length;const q=rotate(c),el=document.createElement('div');el.className='clusterLabel';el.textContent=g+' · '+a.length;el.style.left=(cx+q.x*R)+'px';el.style.top=(cy+q.y*R)+'px';host.appendChild(el)}}
function tmLayout(items,x,y,w,h){if(!items.length)return[];const total=items.reduce((s,i)=>s+i.weight,0)||1,out=[];let off=0;const horizontal=w>=h;for(let i=0;i<items.length;i++){const it=items[i],frac=i===items.length-1?1-off:it.weight/total;if(horizontal){const ww=w*frac;out.push({...it,x:x+w*off,y,w:ww,h});off+=frac}else{const hh=h*frac;out.push({...it,x,y:y+h*off,w,h:hh});off+=frac}}return out}
function renderMap(){const list=filtered(),key=state.mapGroup,groups={};for(const e of list){const g=String(e[key]??'Unknown');(groups[g]||(groups[g]=[])).push(e)}const host=$('treemap'),r=host.getBoundingClientRect();host.innerHTML='';const G=Object.entries(groups).map(([name,evs])=>({name,evs,weight:evs.reduce((s,e)=>s+mapWeight(e),0)})).sort((a,b)=>b.weight-a.weight);const grects=tmLayout(G,0,0,r.width,r.height);for(const gr of grects){const gd=document.createElement('div');gd.className='tm group';Object.assign(gd.style,{left:gr.x+'px',top:gr.y+'px',width:Math.max(0,gr.w-3)+'px',height:Math.max(0,gr.h-3)+'px'});gd.innerHTML=`<div class="tmLabel">${esc(gr.name)} · ${gr.evs.length}</div>`;host.appendChild(gd);const inner={x:gr.x+4,y:gr.y+20,w:Math.max(0,gr.w-8),h:Math.max(0,gr.h-24)};const evs=gr.evs.map(e=>({e,weight:mapWeight(e)})).sort((a,b)=>b.weight-a.weight);for(const er of tmLayout(evs,inner.x,inner.y,inner.w,inner.h)){if(er.w<28||er.h<20)continue;const d=document.createElement('div');d.className='tm';d.dataset.event=er.e.eventId;Object.assign(d.style,{left:er.x+'px',top:er.y+'px',width:Math.max(0,er.w-2)+'px',height:Math.max(0,er.h-2)+'px',background:colorOf(er.e,state.colorDimension)});d.innerHTML=`<div class="tmLabel">${esc(er.e.headline)}</div><div class="tmEvent"><strong>${er.e.importance} · ${er.e.corroboration} src</strong><small>${esc(er.e.summary)}</small></div>`;d.onclick=()=>selectEvent(er.e);host.appendChild(d)}}$('countM').textContent=`${list.length} events · ${G.length} groups`;$('legendM').innerHTML=legendHtml(state.colorDimension,[...new Set(list.map(e=>String(e[state.colorDimension])))])}
function mapWeight(e){if(state.mapSize==='corroboration')return Math.max(1,e.corroboration);if(state.mapSize==='recency')return Math.max(1,168-(Date.now()-e.lastSeen)/36e5);return Math.max(1,e.importance)}
function renderFeed(){let list=[...filtered()],s=$('sortFeed').value;if(s==='recency')list.sort((a,b)=>b.lastSeen-a.lastSeen);else list.sort((a,b)=>(b[s]||0)-(a[s]||0));$('feedList').innerHTML=list.map(e=>`<article class="feedCard ${state.selectedEventIds.includes(e.eventId)?'selected':''}" data-event="${e.eventId}"><div class="meta"><span>${esc(e.subject)}</span><span>${esc(e.region)}</span><span>${e.importance}</span><span>${e.corroboration} sources</span></div><h3>${esc(e.headline)}</h3><p>${esc(e.summary)}</p><div class="feedFoot"><span>${new Date(e.lastSeen).toLocaleString()}</span><span>${esc(e.editorialTier)}</span><span class="star">${state.favorites.has(e.eventId)?'★':'☆'}</span></div></article>`).join('')||'<div class="empty">No events match the shared filters.</div>';$$('#feedList [data-event]').forEach(d=>d.onclick=()=>selectEvent(events.find(e=>e.eventId===d.dataset.event)));$('countF').textContent=list.length+' events'}
function readerHtml(e){return`<div class="readerHead"><div class="meta"><span>${esc(e.subject)}</span><span>${esc(e.region)}</span><span>${esc(e.sentiment)}</span><span>${e.importance} importance</span><span>${e.corroboration} independent source${e.corroboration===1?'':'s'}</span></div><button class="icon readerClose">×</button></div><h2>${esc(e.headline)}</h2><p>${esc(e.summary)}</p><div class="coverage"><b style="font-size:9px">Coverage · ${e.coverage.length}</b>${e.coverage.map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener"><b>${esc(c.source)}</b> · ${esc(c.title)}<small>${esc(c.description)}</small></a>`).join('')}</div>`}
function selectEvent(e){if(!e)return;state.focusedEventId=e.eventId;state.selectedEventIds=[e.eventId];['A','M','F'].forEach(k=>{const work=$('work'+k),reader=$('reader'+k);reader.innerHTML=readerHtml(e);work.classList.add('readerOpen');reader.querySelector('.readerClose').onclick=()=>{work.classList.remove('readerOpen');state.focusedEventId=null;setTimeout(renderAll,130)}});renderAll()}
function renderLibrary(){analyses.sort((a,b)=>b.createdAt-a.createdAt);$('countL').textContent=analyses.length+' analyses';$('libraryList').innerHTML=analyses.length?analyses.map(a=>`<article class="analysisCard"><h3>${esc(a.title)}</h3><p>${new Date(a.createdAt).toLocaleString()} · ${esc(a.provider||'fixture')} · ${esc(a.model||'fixture')}</p><p style="margin-top:5px;color:#c9d8e5">${esc(a.response||'')}</p></article>`).join(''):'<div class="empty">No saved analyses yet.<br>AI execution arrives at 01·ship; import/export is already live.</div>'}
function renderAll(){renderFilters();drawSphere();renderMap();renderFeed();renderLibrary();diag()}
function diag(){$('diagKV').innerHTML=`<span>Version</span><b>${VERSION}</b><span>Articles</span><b>${articles.length}</b><span>Canonical events</span><b>${events.length}</b><span>Cache collector</span><b>${esc(cacheMeta.collectorVersion||'unknown')}</b><span>Last cache load</span><b>${cacheMeta.lastCacheLoad?new Date(cacheMeta.lastCacheLoad).toLocaleString():'none'}</b><span>Network path</span><b>same-origin cache only</b><span>Publisher fan-out</span><b>disabled</b>`;$('canonLog').textContent=canonNotes.join('\n')}
async function saveAnalysis(){const a={analysisId:'fixture-'+Date.now(),createdAt:Date.now(),title:'PRISM fixture analysis',prompt:'Fixture only',provider:'fixture',model:'none',scope:'selected-events',eventIds:[...state.selectedEventIds],sourceArticleIds:[],response:'Library persistence and portability are active before AI execution.'};await putMany('analyses',[a]);analyses=await all('analyses');renderLibrary();toast('Fixture analysis saved')}
function exportLib(){const payload={schema:SCHEMA,exportedAt:new Date().toISOString(),analyses,events:events.filter(e=>analyses.some(a=>(a.eventIds||[]).includes(e.eventId)))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prism-library.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function importLib(file){let j;try{j=JSON.parse(await file.text())}catch(e){throw new Error('Invalid JSON')}if(j.schema!==SCHEMA||!Array.isArray(j.analyses))throw new Error('Unsupported PRISM library schema');const existing=new Map(analyses.map(a=>[a.analysisId,a]));let added=0,replaced=0;j.analyses.forEach(a=>{if(!a.analysisId)return;if(existing.has(a.analysisId))replaced++;else added++;existing.set(a.analysisId,a)});analyses=[...existing.values()];await putMany('analyses',analyses);renderLibrary();toast(`Imported ${added} · replaced ${replaced}`)}
function runTests(){const T=[];const ok=(n,b)=>T.push((b?'PASS ':'FAIL ')+n);ok('four view routes',$$('.tab').length===4);ok('shared filter contract',Array.isArray(state.filters.subject)&&Array.isArray(state.filters.region));ok('canonical events have coverage',events.length>0&&events.every(e=>Array.isArray(e.coverage)&&e.coverage.length));ok('dedupe reduced or preserved article count',events.length<=articles.length||!articles.length);ok('treemap renderer present',!!$('treemap'));ok('legend renderer present',!!$('legendA'));ok('IndexedDB v2',!!db&&DB_VERSION===2);ok('library schema',SCHEMA==='prism-library-1');$('tests').textContent=T.join('\n')}
$$('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('q').oninput=e=>{state.query=e.target.value;renderAll()};$('cluster').onchange=e=>{state.clusterDimension=e.target.value;renderAll()};$('color').onchange=e=>{state.colorDimension=e.target.value;renderAll()};$('size').onchange=e=>{state.sizeDimension=e.target.value;renderAll()};$('windowCtl').onchange=e=>{state.timeWindow=+e.target.value;renderAll()};$('mapGroup').onchange=e=>{state.mapGroup=e.target.value;renderAll()};$('mapSize').onchange=e=>{state.mapSize=e.target.value;renderAll()};$('sortFeed').onchange=renderFeed;$('gear').onclick=()=>{$('drawer').classList.add('open');diag();runTests()};$('drawerClose').onclick=()=>$('drawer').classList.remove('open');$('seedAnalysis').onclick=saveAnalysis;$('exportLib').onclick=exportLib;$('importLib').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{if(e.target.files[0])await importLib(e.target.files[0])}catch(x){toast(x.message)}e.target.value=''};
const C=$('sphere');C.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};C.setPointerCapture(e.pointerId)};C.onpointermove=e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)/220;pitch=drag.pitch+(e.clientY-drag.y)/240;drawSphere()};C.onpointerup=C.onpointercancel=e=>{drag=null};C.onclick=e=>{const r=C.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,d=18;for(const p of points){const q=Math.hypot(x-p.px,y-p.py);if(q<d){d=q;best=p}}if(best)selectEvent(best.e)};
window.onresize=()=>renderAll();
(async()=>{await openDB();await cachedBoot();renderAll()})().catch(e=>{setStatus('Boot failed',false);log(e.stack||e.message);runTests()});
})();
