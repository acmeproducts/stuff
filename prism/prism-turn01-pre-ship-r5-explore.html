<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRISM · R5 Explore</title><style>:root{--bg:#07111b;--p:#0b1928;--p2:#102338;--line:#29445e;--text:#edf6ff;--muted:#91a8bb;--accent:#7dd3fc}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px system-ui}button,select,input{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-columns:178px 1fr}.rail{background:#091522;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-weight:900;letter-spacing:.08em;padding:14px}.nav{padding:6px}.nav button{display:block;width:100%;height:36px;text-align:left;border:0;border-radius:8px;background:transparent;color:var(--muted)}.nav button.on{background:var(--p2);color:var(--text)}.work{min-width:0;display:grid;grid-template-rows:44px 78px 1fr}.top,.r1,.r2{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);background:#081522}.menu{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--p2)}.search{flex:1;max-width:720px;height:31px;border:1px solid #385e7d;border-radius:999px;background:#0b1b2b;padding:0 12px}.status{margin-left:auto;color:var(--muted);font-size:8px}.ribbon{display:grid;grid-template-rows:36px 42px}.ctl{height:28px;border:1px solid var(--line);border-radius:8px;background:var(--p2);padding:0 8px;font-size:9px}.grow{flex:1}.chips{display:flex;align-items:center;gap:4px;overflow-x:auto}.block{display:flex;align-items:center;gap:4px;padding-right:8px;border-right:1px solid #ffffff14}.lab{font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}.chip{height:23px;border:1px solid #ffffff22;border-radius:999px;background:var(--p2);padding:0 7px;font-size:8px;opacity:.45;white-space:nowrap}.chip.on{opacity:1;border-color:#ffffff66}.chip.all.on{outline:1px solid var(--accent)}.chip i{d onst CACHE='../data/market-backend/news-cache.json',$=id=>document.getElementById(id);let events=[],selected=new Set(),focus=null,filters={};const S={x:'subject',y:'region',color:'sentiment',z:'importanceBucket',window:168,q:''};const D={subject:'Subject',region:'Region',sentiment:'Sentiment',editorialTier:'Tier',source:'Source',corroborationBucket:'Corroboration',importanceBucket:'Importance',recencyBucket:'Recency'};const cat=['subject','region','sentiment','editorialTier','source','corroborationBucket','importanceBucket','recencyBucket'];const COLORS={positive:'#35d08a',neutral:'#d8ad53',negative:'#f06b7e','Critical':'#ff6175','High':'#f4a63b','Medium':'#63b7ff','Low':'#72869a',major:'#ff6f82',significant:'#e9bb5d',developing:'#6fb7ff'};function hash(s){let x=2166136261;for(const c of String(s)){x^=c.charCodeAt(0);x=Math.imul(x,16777619)}return x>>>0}function subject(a){let t=((a.topics||[]).join(' ')+' '+a.title+' '+a.description).toLowerCase();if(/war|iran|ukraine|china|military|election|government/.test(t))return'Geopolitics';if(/ai|tech|chip|software|robot|apple|google|microsoft/.test(t))return'Technology';if(/bank|bond|yield|market|stock|crypto|finance|currency/.test(t))return'Finance';if(/climate|ocean|temperature|emission|weather/.test(t))return'Climate';if(/health|medical|disease|drug|hospital/.test(t))return'Health';if(/science|research|space|nasa/.test(t))return'Science';if(/company|business|deal|earnings|ceo|sales/.test(t))return'Business';return'World'}function region(a){let t=(a.title+' '+a.description).toLowerCase();if(/iran|israel|gaza|saudi|qatar|iraq|syria/.test(t))return'Middle East';if(/china|india|japan|korea|singapore|taiwan/.test(t))return'Asia';if(/france|britain|germany|europe|ukraine|sweden|iceland/.test(t))return'Europe';if(/united states|u\.s\.|america|canada|trump|fed /.test(t))return'North America';if(/australia|new zealand/.test(t))return'Oceania';if(/africa|kenya|nigeria|south africa/.test(t))return'Africa';if(/brazil|argentina|mexi ;b.className='block';let l=document.createElement('span');l.className='lab';l.textContent=D[k];b.appendChild(l);let s=filters[k]||(filters[k]=new Set());let all=document.createElement('button');all.className='chip all '+(!s.size?'on':'');all.textContent='All';all.onclick=()=>{s.clear();render()};b.appendChild(all);values(k).forEach(v=>{let x=document.createElement('button');x.className='chip '+(s.has(v)?'on':'');if(k===S.color)x.innerHTML=`<i style="background:${color(v)}"></i>${v}`;else x.textContent=v;x.onclick=()=>{s.has(v)?s.delete(v):s.add(v);render()};b.appendChild(x)});root.appendChild(b)})}function zScore(es){if(S.z==='importanceBucket'||S.z==='importance')return es.reduce((a,e)=>a+e.importance,0)/Math.max(1,es.length);if(S.z==='corroborationBucket')return es.reduce((a,e)=>a+e.corroboration,0)/Math.max(1,es.length)*20;return es.length*10}function summary(es){let counts={};es.forEach(e=>{let v=String(val(e,S.color));counts[v]=(counts[v]||0)+1});let dom=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';let top=[...es].sort((a,b)=>b.importance-a.importance).slice(0,2).map(e=>e.headline);return{dom,top}}function renderMatrix(){let es=visible(),xs=[...new Set(es.map(e=>String(val(e,S.x))))].sort(),ys=[...new Set(es.map(e=>String(val(e,S.y))))].sort(),m=$('matrix');m.style.gridTemplateColumns=`repeat(${Math.max(1,xs.length)},minmax(150px,1fr))`;m.style.gridTemplateRows=`repeat(${Math.max(1,ys.length)},minmax(92px,1fr))`;m.innerHTML='';$('axisX').style.gridTemplateColumns=m.style.gridTemplateColumns;$('axisX').innerHTML=xs.map(x=>`<span>${x}</span>`).join('');$('axisY').style.gridTemplateRows=m.style.gridTemplateRows;$('axisY').innerHTML=ys.map(y=>`<span>${y}</span>`).join('');ys.forEach(y=>xs.forEach(x=>{let a=es.filter(e=>String(val(e,S.x))===x&&String(val(e,S.y))===y),c=document.createElement('div');c.className='cell'+(!a.length?' empty':'');if(!a.length){m.appendChild(c);return}let sm=summary(a),z=zScore(a),sz=Math.max(26,Math.min(68,22+z*.45)),ib={Critical:0,High:0,Medium:0,Low:0};a.forEach(e=>ib[e.importanceBucket]++);c.innerHTML=`<h3>${x} × ${y}</h3><span class="n">${a.length}</span><div class="cluster"><div class="bubble" style="--s:${sz}px;--c:${color(sm.dom)}"></div><div class="sum"><b>${sm.top[0]||''}</b><small>${sm.dom} · Crit ${ib.Critical} · High ${ib.High} · Med ${ib.Medium}</small></div></div>`;c.onclick=()=>openCluster(x,y,a);m.appendChild(c)}))}let rot={yaw:0,pitch:0,zoom:1,drag:null,pinch:0,hits:[]};function openCluster(x,y,a){focus={x,y,events:a};$('drillTitle').textContent=`${x} × ${y}`;$('drillMeta').textContent=`${a.length} events · ${D[S.z]} drives size`;$('drill').classList.add('on');drawCluster()}function closeCluster(){$('drill').classList.remove('on');focus=null}function drawCluster(){if(!focus)return;let c=$('clusterCanvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,r.width,r.height);let cx=r.width/2,cy=r.height/2,R=Math.min(r.width,r.height)*.34*rot.zoom;rot.hits=[];focus.events.forEach((e,i)=>{let a=i*2.399963,rad=.16+.62*Math.sqrt((i+1)/focus.events.length),x=Math.cos(a)*rad,y=Math.sin(a)*rad,z=Math.sin(a*1.7)*.46;let cyw=Math.cos(rot.yaw),syw=Math.sin(rot.yaw),cp=Math.cos(rot.pitch),sp=Math.sin(rot.pitch),xx=x*cyw-z*syw,zz=x*syw+z*cyw,yy=y*cp-zz*sp;zz=y*sp+zz*cp;let px=cx+xx*R,py=cy-yy*R,dep=(zz+1)/2,base=e.importanceBucket==='Critical'?130:e.importanceBucket==='High'?112:e.importanceBucket==='Medium'?96:82,w=base*(.72+.42*dep),h=46*(.72+.42*dep);g.globalAlpha=.5+.5*dep;g.fillStyle='#0b1b2b';g.strokeStyle=selected.has(e.id)?'#fff':color(String(val(e,S.color)));g.lineWidth=selected.has(e.id)?3:2;g.beginPath();g.roundRect(px-w/2,py-h/2,w,h,8);g.fill();g.stroke();g.fillStyle='#eef7ff';g.font='700 8px system-ui';let t=e.headline.length>46?e.headline.slice(0,43)+'…':e.headline;g.fillText(t,px-w/2+6,py-3,w-12);g.fillStyle='#9db2c4';g.font='7px system-ui';g.fillText(`${e.importanceBucket} · ${e.corroboration} src`,px-w/2+6,py+12,w-12);rot.hits.push({id:e.id,x:px-w/2,y:py-h/2,w,h,z:zz})});g.globalAlpha=1}$('closeDrill').onclick=closeCluster;let cv=$('clusterCanvas');cv.addEventListener('pointerdown',e=>{rot.drag={x:e.clientX,y:e.clientY,yaw:rot.yaw,pitch:rot.pitch,m:false};cv.setPointerCapture?.(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!rot.drag)return;let dx=e.clientX-rot.drag.x,dy=e.clientY-rot.drag.y;if(Math.hypot(dx,dy)>4)rot.drag.m=true;rot.yaw=rot.drag.yaw+dx*.007;rot.pitch=Math.max(-1.3,Math.min(1.3,rot.drag.pitch+dy*.007));drawCluster()});cv.addEventListener('pointerup',e=>{let q=rot.drag;rot.drag=null;if(q&&!q.m){let r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,h=[...rot.hits].sort((a,b)=>b.z-a.z).find(v=>x>=v.x&&x<=v.x+v.w&&y>=v.y&&y<=v.y+v.h);if(h){selected.has(h.id)?selected.delete(h.id):selected.add(h.id);$('sel').textContent=selected.size+' selected';drawCluster()}}});cv.addEventListener('wheel',e=>{e.preventDefault();rot.zoom=Math.max(.65,Math.min(2.2,rot.zoom*(e.deltaY>0?.92:1.08)));drawCluster()},{passive:false});cv.addEventListener('touchstart',e=>{if(e.touches.length===2)rot.pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:false});cv.addEventListener('touchmove',e=>{if(e.touches.length===2&&rot.pinch){e.preventDefault();let n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);rot.zoom=Math.max(.65,Math.min(2.2,rot.zoom*n/rot.pinch));rot.pinch=n;drawCluster()}},{passive:false});function sync(k,v){let old=S[k];S[k]=v;if(!dims().includes(old))delete filters[old];render()}function render(){controls();renderFilters();renderMatrix();$('sel').textContent=selected.size+' selected'}$('xCtl').onchange=e=>sync('x',e.target.value);$('yCtl').onchange=e=>sync('y',e.target.value);$('colorCtl').onchange=e=>sync('color',e.target.value);$('zCtl').onchange=e=>sync('z',e.target.value);$('windowCtl').onchange=e=>{S.window=+e.target.value;render()};$('q').oninput=e=>{S.q=e.target.value;render()};fetch(CACHE,{cache:'no-store'}).then(r=>r.json()).then(j=>{events=(j.data||[]).map(canon);$('status').textContent=`Ready · ${events.length} events`;render()}).catch(e=>{$('status').textContent='Cache unavailable';console.error(e)});})();</script></body></html>
