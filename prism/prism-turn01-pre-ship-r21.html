<script>
(()=>{'use strict';const frame=document.getElementById('app');
function patch(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.echarts)return setTimeout(patch,120);const treemap=d.getElementById('treemap'),chart=treemap&&w.echarts.getInstanceByDom(treemap);if(!chart)return setTimeout(patch,120);if(treemap.dataset.r21)return;treemap.dataset.r21='1';
const css=d.createElement('style');css.textContent=`

const navs=[...d.querySelectorAll('.navBtn')],mapBtn=navs.find(b=>b.dataset.view==='map'),feedBtn=navs.find(b=>b.dataset.view==='feed'),exploreBtn=navs.find(b=>b.dataset.view==='explore'),libraryBtn=navs.find(b=>b.dataset.view==='library'),base=new Map(navs.map(b=>[b,b.onclick]));
function muted(hex){const h=String(hex||'').toLowerCase();if(h==='#36d38d')return'#2e7f22';if(h==='#d8ad53')return'#8d741d';if(h==='#f06b7e')return'#8a2630';return h||'#405362'}
function fit(btn){const span=btn.firstElementChild;if(!span)return;let fs=btn.classList.contains('big')?24:btn.classList.contains('med')?17:13,min=8;span.style.fontSize=fs+'px';span.style.lineHeight='1.08';for(let i=0;i<40;i++){if(span.scrollHeight<=btn.clientHeight-10&&span.scrollWidth<=btn.clientWidth-10)break;fs-=.5;if(fs<min){const rows=Math.min(4,Math.ceil(span.scrollHeight/Math.max(1,btn.clientHeight-10)));btn.style.gridRow='span '+Math.max(1,rows);fs=min;break}span.style.fontSize=fs+'px'}span.style.fontSize=fs+'px'}
function rawGroups(){const opt=chart.getOption(),s=opt.series&&opt.series[0];return(s&&s.data)||[]}
let mapFocus=null;
function renderMap(){const all=rawGroups(),groups=mapFocus?all.filter(g=>g.name===mapFocus):all;treemap.innerHTML='';const root=d.createElement('div');root.className='r21Map';treemap.appendChild(root);groups.forEach(g=>{const sec=d.createElement('section');sec.className='r21Group';const head=d.createElement('div');head.className='r21GroupHead';const groupBtn=d.createElement('button');groupBtn.className='r21GroupBtn';groupBtn.textContent=g.name||'Unknown';groupBtn.title=mapFocus?'Focused group':'Zoom to '+(g.name||'group');groupBtn.onclick=()=>{mapFocus=g.name;renderMap()};head.appendChild(groupBtn);const count=d.createElement('span');count.className='r21GroupCount';count.textContent=(g.children||[]).length+' items';head.appendChild(count);if(mapFocus){const x=d.createElement('button');x.className='r21ZoomOut';x.textContent='×';x.setAttribute('aria-label','Zoom out to all groups');x.title='Show all groups';x.onclick=e=>{e.stopPropagation();mapFocus=null;renderMap()};head.appendChild(x)}sec.appendChild(head);const kids=[...(g.children||[])].sort((a,b)=>(+b.value||0)-(+a.value||0));kids.forEach((c,i)=>{const b=d.createElement('button');const v=+c.value||0;b.className='r21Tile '+(i<2||v>=64?'big':i<8||v>=28?'med':'small');b.style.background=muted(c.itemStyle&&c.itemStyle.color);b.dataset.eventId=c.eventId||'';const span=d.createElement('span');span.textContent=c.name||'';b.appendChild(span);b.onclick=()=>{if(!c.eventId)return;base.get(feedBtn).call(feedBtn);setTimeout(()=>{const card=d.querySelector('.feedCard[data-id="'+c.eventId+'"]');if(card)card.click();base.get(mapBtn).call(mapBtn);setTimeout(renderMap,0)},0)};sec.appendChild(b)});root.appendChild(sec)});requestAnimationFrame(()=>root.querySelectorAll('.r21Tile').forEach(fit))}
mapBtn.onclick=function(){const r=base.get(mapBtn).call(mapBtn);setTimeout(renderMap,0);return r};
function resetMapFocus(){mapFocus=null;setTimeout(renderMap,25)}
['q','groupCtl','colorCtl','sizeCtl','windowCtl','filterClose','filterScrim'].forEach(id=>{const x=d.getElementById(id);if(x){x.addEventListener('input',resetMapFocus);x.addEventListener('change',resetMapFocus);x.addEventListener('click',()=>setTimeout(renderMap,40))}});d.addEventListener('click',e=>{if(e.target.closest('.chip')){mapFocus=null;setTimeout(renderMap,50)}});
let focus=null,exploreMode=false;function showExplore(){exploreMode=true;navs.forEach(b=>b.classList.toggle('on',b===exploreBtn));d.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='explore'));d.getElementById('context').textContent='Explore';d.querySelector('.shell').classList.remove('libraryMode');d.getElementById('q').hidden=false;renderExplore()}
function renderExplore(){if(!exploreMode)return;const sphere=d.getElementById('sphere');sphere.innerHTML='';const wrap=d.createElement('div');wrap.className='r21Explore';sphere.appendChild(wrap);const groups=rawGroups();if(focus){const g=groups.find(x=>x.name===focus);if(!g){focus=null;return renderExplore()}const h=d.createElement('div');h.style.display='flex';h.style.alignItems='center';h.innerHTML='<b style="font-size:16px">'+focus+'</b><button class="r21Back">×</button>';h.querySelector('button').onclick=()=>{focus=null;renderExplore()};wrap.appendChild(h);(g.children||[]).forEach(c=>{const b=d.createElement('button');b.className='r21Cluster';b.innerHTML='<h3>'+c.name+'</h3>';wrap.appendChild(b)})}else groups.forEach(g=>{const b=d.createElement('button');b.className='r21Cluster';const kids=g.children||[];b.innerHTML='<h3>'+g.name+'</h3><div>'+kids.length+' items</div><p>'+kids.slice(0,3).map(x=>x.name).join(' · ')+'</p>';b.onclick=()=>{focus=g.name;renderExplore()};wrap.appendChild(b)})}
