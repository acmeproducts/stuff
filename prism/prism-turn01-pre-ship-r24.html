<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>PRISM · Turn 01 pre-ship R24</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}#app{border:0;display:block}</style></head><body><iframe id="app" src="./prism-turn01-pre-ship-r23.html?v=ca83c9f1beead8e8e8a8c0d102038233c1c47eba" title="PRISM R24"></iframe><script>(()=>{'use strict';const outer=document.getElementById('app');function boot(){const d1=outer.contentDocument,inner=d1&&d1.getElementById('app');if(!inner)return setTimeout(boot,120);const d=inner.contentDocument,w=inner.contentWindow;if(!d||!w)return setTimeout(boot,120);const lib=d.querySelector('.library'),rail=d.querySelector('.rail'),list=d.querySelector('.libraryList'),stage=d.querySelector('.libraryStage'),head=d.querySelector('.libraryDetailHead'),tx=d.querySelector('.libraryTranscript'),compose=d.querySelector('.libraryCompose');if(!lib||!rail||!list||!stage||!head||!tx||!compose)return setTimeout(boot,120);if(d.documentElement.dataset.r24)return;d.documentElement.dataset.r24='1';const s=d.createElement('style');s.textContent=`.library{grid-template-columns:132px minmax(0,1fr)!important}.libraryStage.r24Blank .libraryDetailHead,.libraryStage.r24Blank .libraryTranscript,.libraryStage.r24Blank .libraryCompose{visibility:hidden!important}.r24Status{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#e9bb5d}.analysisCard.r24Running{border-color:#9c7d2f!important}.analysisCard.r24Running .r24Status{color:#e9bb5d}.analysisCard.r24Complete .r24Status{color:#3ed18a}.analysisCard.r24Failed .r24Status{color:#ff6f82}@media(min-width:761px){.library{grid-template-columns:286px minmax(0,1fr)!important}}`;d.head.appendChild(s);const brand=d.querySelector('.railBrand small');if(brand)brand.textContent='Turn 01 · pre-ship R24';
const DB='prism-analysis-index-v1',STORE='analyses';function db(){return new Promise((ok,no)=>{const r=w.indexedDB.open(DB,1);r.onupgradeneeded=()=>{const x=r.result;if(!x.objectStoreNames.contains(STORE))x.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function put(v){try{const x=await db(),t=x.transaction(STORE,'readwrite');t.objectStore(STORE).put(v)}catch{}}async function del(id){try{const x=await db(),t=x.transaction(STORE,'readwrite');t.objectStore(STORE).delete(id)}catch{}}function idFor(c){if(!c.dataset.r24id)c.dataset.r24id='a-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);return c.dataset.r24id}function titleFor(c){return(c.querySelector('h3')?.textContent||'Analysis').trim()}function persistCard(c,status){const now=Date.now(),id=idFor(c),m=c.querySelector('.r23Meta'),created=+(c.dataset.r24created||now);c.dataset.r24created=created;c.dataset.r24status=status||c.dataset.r24status||'Complete';put({id,title:titleFor(c),created,updated:now,status:c.dataset.r24status,markdown:tx.innerText||'',html:tx.innerHTML||''});decorate(c)}function decorate(c){if(!c||!c.classList.contains('analysisCard'))return;let st=c.querySelector('.r24Status');if(!st){st=d.createElement('div');st.className='r24Status';c.appendChild(st)}st.textContent=c.dataset.r24status||'Complete';c.classList.toggle('r24Running',c.dataset.r24status==='In process');c.classList.toggle('r24Complete',c.dataset.r24status==='Complete');c.classList.toggle('r24Failed',c.dataset.r24status==='Failed');const x=c.querySelector('.r23Delete');if(x&&!x.dataset.r24){x.dataset.r24='1';x.addEventListener('click',()=>del(idFor(c)),{capture:true})}}function all(){list.querySelectorAll('.analysisCard').forEach(c=>{decorate(c);if(!c.dataset.r24created)persistCard(c,'Complete')})}all();new MutationObserver(all).observe(list,{childList:true,subtree:true});
function selected(){return list.querySelector('.analysisCard.on')}function blank(){stage.classList.toggle('r24Blank',!selected())}blank();d.addEventListener('click',e=>{if(lib.contains(e.target)&&!rail.classList.contains('closed'))rail.classList.add('closed');if(e.target.closest('.analysisCard'))setTimeout(()=>{blank();const c=selected();if(c){persistCard(c,c.dataset.r24status||'Complete');tx.scrollTop=0}},20)});
const aiRun=d.getElementById('aiRun');if(aiRun){aiRun.addEventListener('click',()=>{setTimeout(()=>{let c=[...list.querySelectorAll('.analysisCard')].find(x=>x.dataset.r24status==='In process');if(!c){c=d.createElement('button');c.className='analysisCard r24Running';c.type='button';const p=d.querySelector('#aiPrompt,textarea[name="prompt"],.aiPanel textarea');const title=(p&&p.value||'New analysis').trim().slice(0,90)||'New analysis';c.innerHTML='<h3></h3><div class="r24Status">In process</div>';c.querySelector('h3').textContent=title;c.dataset.r24status='In process';c.onclick=()=>{list.querySelectorAll('.analysisCard').forEach(x=>x.classList.toggle('on',x===c));head.querySelector('h2')&&(head.querySelector('h2').textContent=title);tx.innerHTML='<div class="researchTurn"><div class="turnMeta">Analysis</div><div class="markdownBody"><p>Analysis is in process…</p></div></div>';blank()};list.prepend(c)}persistCard(c,'In process')},0)},true)}
const out=d.querySelector('#aiOutput,#aiResult,.aiOutput,.aiResult,.aiBody,.analysisOutput');if(out)new MutationObserver(()=>{const c=[...list.querySelectorAll('.analysisCard')].find(x=>x.dataset.r24status==='In process');if(c&&out.textContent.trim()){c.dataset.r24status='Complete';persistCard(c,'Complete')}}).observe(out,{subtree:true,childList:true,characterData:true});
const send=d.getElementById('librarySend');if(send){send.textContent='Research web';send.title='Continue the selected Analysis with current web research';send.addEventListener('click',()=>{const c=selected();if(c)setTimeout(()=>persistCard(c,'Complete'),100)},true)}const ta=compose.querySelector('textarea');if(ta)ta.placeholder='Ask, paste, attach, or research the current web…';new MutationObserver(()=>{const c=selected();if(c)persistCard(c,c.dataset.r24status||'Complete')}).observe(tx,{subtree:true,childList:true,characterData:true});}
outer.addEventListener('load',()=>setTimeout(boot,120));})();</script></body></html>
