function evidenceText(es){return es.map((e,i)=>'EVENT '+(i+1)+': '+e.headline+'\nSummary: '+e.summary+'\nSubject/region/sentiment: '+e.subject+' / '+e.region+' / '+e.sentiment+'\nImportance: '+e.importance+'; independent sources: '+e.corroboration+'\nCoverage:\n'+e.coverage.map(c=>'- '+c.source+' | '+c.title+' | '+c.description+' | '+c.url+' | '+new Date(c.publishedAt).toISOString()).join('\n')).join('\n\n')}function sysPrompt(){return'You are PRISM AI POV, an analytical research assistant. Supplied PRISM events are primary evidence. Distinguish selected-event evidence from broader model knowledge and inference. The user wants contextual texture: throughlines, recurrence, historical comparisons, external drivers, competing interpretations, and useful further research. Render the answer in clear Markdown. For any Sources, Further reading, Research leads, or navigational reference where you reliably know a URL, use a complete working Markdown hyperlink such as [Source title](https://example.com/path). Never invent a URL. If you know a source conceptually but cannot provide a reliable URL, label it as an unlinked research lead. Do not claim live web verification unless the provider/model actually supplies it.'}async function callAI(p,key,model,prompt,es,history=[]){const user='PRISM EVIDENCE PACKET\n\n'+evidenceText(es)+'\n\nUSER RESEARCH QUESTION\n'+prompt;if(p==='anthropic'){const msgs=[...history.flatMap(t=>[{role:'user',content:t.prompt},{role:'assistant',content:t.response}]),{role:'user',content:user}],r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:5000,system:sysPrompt(),messages:msgs})}),j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);return(j.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('')}const msgs=[{role:'system',content:sysPrompt()},...history.flatMap(t=>[{role:'user',content:t.prompt},{role:'assistant',content:t.response}]),{role:'user',content:user}],u=p==='venice'?'https://api.venice.ai/api/v1/chat/completions':'https://openrouter.ai/api/v1/chat/completions',r=await fetch(u,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,max_tokens:5000,messages:msgs})}),j=await r.json();if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||r.status);return j.choices?.[0]?.message?.content||''}async function runAI(){const p=$('aiProvider').value,c=aiCfg[p]||{},model=$('aiModel').value,prompt=$('aiPrompt').value.trim(),es=[...state.selected].map(id=>events.find(e=>e.eventId===id)).filter(Boolean);if(!c.verified||c.model!==model){toast('Provider/model must be verified in Config');return}if(!prompt||!es.length){toast('Select evidence and enter a question');return}const out=$('aiResult');out.innerHTML='Researching…';try{const hist=currentAnalysis?.turns||[],response=await callAI(p,c.key,model,prompt,es,hist);if(!currentAnalysis)currentAnalysis={analysisId:'an-'+Date.now()+'-'+hash(prompt),title:prompt.slice(0,90),createdAt:Date.now(),updatedAt:Date.now(),provider:p,model,eventIds:es.map(e=>e.eventId),events:structuredClone(es),turns:[]};currentAnalysis.provider=p;currentAnalysis.model=model;currentAnalysis.updatedAt=Date.now();currentAnalysis.turns.push({prompt,response,at:Date.now()});out.innerHTML=md(response);wireRight()}catch(e){out.textContent='AI request failed: '+e.message}}async function saveCurrent(){if(!currentAnalysis)return;const i=analyses.findIndex(a=>a.analysisId===currentAnalysis.analysisId);i>=0?analyses[i]=currentAnalysis:analyses.push(currentAnalysis);await put('analyses',currentAnalysis);toast('Saved to Library');renderLibrary()}function continueFromPanel(){const a=libActive&&analyses.find(x=>x.analysisId===libActive);if(a){currentAnalysis=structuredClone(a);state.selected=new Set(a.eventIds||[]);setView('map')}showAI()}async function deleteAnalysis(id){if(!confirm('Delete this analysis?'))return;await del('analyses',id);analyses=analyses.filter(a=>a.analysisId!==id);libActive=null;closeRight();renderLibrary()}function downloadObj(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function exportOne(id){const a=analyses.find(x=>x.analysisId===id);if(a)downloadObj({schema:SCHEMA,exportedAt:new Date().toISOString(),analyses:[a]},'prism-analysis-'+id+'.json')}function exportAll(){downloadObj({schema:SCHEMA,exportedAt:new Date().toISOString(),analyses},'prism-library-'+new Date().toISOString().slice(0,10)+'.json')}async function importLib(f){const j=JSON.parse(await f.text());if(j.schema!==SCHEMA||!Array.isArray(j.analyses))throw new Error('Unsupported library file');const m=new Map(analyses.map(a=>[a.analysisId,a]));j.analyses.forEach(a=>a.analysisId&&m.set(a.analysisId,a));analyses=[...m.values()];await put('analyses',analyses);renderLibrary();toast('Library merged')}
function render(){renderFilters();$('selCount').textContent=state.selected.size+' selected';$('aiOpen').disabled=!state.selected.size;$('clearSel').disabled=!state.selected.size;$('eventCount').textContent=filtered().length+' events';if(state.view==='map')renderMap();if(state.view==='explore')renderSphere();if(state.view==='feed')renderFeed();if(state.view==='library')renderLibrary()}function sourceCounts(){const m={};events.forEach(e=>e.coverage.forEach(c=>{m[c.source]||(m[c.source]={articles:0,events:new Set()});m[c.source].articles++;m[c.source].events.add(e.eventId)}));return m}function openSources(){const m=sourceCounts(),dis=new Set(sourceCfg.disabled||[]),names=Object.keys(m).sort();$('sourceList').innerHTML=names.map(n=>'<div class="sourceRow"><input type="checkbox" data-source-toggle="'+esc(n)+'" '+(!dis.has(n)?'checked':'')+'><div><b>'+esc(n)+'</b><small>'+m[n].articles+' articles · '+m[n].events.size+' events</small></div><span class="hint">cache</span></div>').join('')+(sourceCfg.custom||[]).map((s,i)=>'<div class="sourceRow"><input type="checkbox" disabled><div><b>'+esc(s.name)+'</b><small>'+esc(s.url)+'</small></div><button class="btn" data-custom-remove="'+i+'">Remove</button></div>').join('');$('sourceSummary').textContent=enabledSources().size+' enabled of '+names.length+' cache sources';$$('[data-source-toggle]').forEach(x=>x.onchange=()=>{const d=new Set(sourceCfg.disabled||[]);x.checked?d.delete(x.dataset.sourceToggle):d.add(x.dataset.sourceToggle);sourceCfg.disabled=[...d];localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()});$$('[data-custom-remove]').forEach(x=>x.onclick=()=>{sourceCfg.custom.splice(+x.dataset.customRemove,1);localStorage.setItem(LSS,JSON.stringify(sourceCfg));openSources()});$('sourceModal').classList.add('open')}function addSource(){const name=$('newSourceName').value.trim(),url=$('newSourceUrl').value.trim(),type=$('newSourceType').value;if(!name||!/^https?:\/\//i.test(url)){toast('Enter a name and http(s) URL');return}(sourceCfg.custom||(sourceCfg.custom=[])).push({name,url,type,enabled:false,createdAt:Date.now()});localStorage.setItem(LSS,JSON.stringify(sourceCfg));$('newSourceName').value='';$('newSourceUrl').value='';openSources()}
function sphereDown(e){if(e.pointerType==='touch'&&e.isPrimary===false)return;sphere.drag={x:e.clientX,y:e.clientY,yaw:sphere.yaw,pitch:sphere.pitch,moved:false};$('sphere').setPointerCapture?.(e.pointerId)}function sphereMove(e){if(!sphere.drag)return;const dx=e.clientX-sphere.drag.x,dy=e.clientY-sphere.drag.y;if(Math.hypot(dx,dy)>4)sphere.drag.moved=true;sphere.yaw=sphere.drag.yaw+dx*.007;sphere.pitch=Math.max(-1.45,Math.min(1.45,sphere.drag.pitch+dy*.007));renderSphere()}function sphereUp(e){const d=sphere.drag;sphere.drag=null;if(d&&!d.moved){const r=$('sphere').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,hit=[...sphere.hits].sort((a,b)=>b.z-a.z).find(h=>x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h);if(hit){toggleSelect(hit.id);showEvent(hit.id)}}}function sphereWheel(e){e.preventDefault();sphere.zoom=Math.max(.62,Math.min(1.9,sphere.zoom*(e.deltaY>0?.92:1.08)));renderSphere()}function touchDist(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}function sphereTouchStart(e){if(e.touches.length===2)sphere.pinch=touchDist(e.touches)}function sphereTouchMove(e){if(e.touches.length===2&&sphere.pinch){e.preventDefault();const n=touchDist(e.touches);sphere.zoom=Math.max(.62,Math.min(1.9,sphere.zoom*n/sphere.pinch));sphere.pinch=n;renderSphere()}}function sphereTouchEnd(){sphere.pinch=0}
function wire(){$$('.navBtn').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('configNav').onclick=cfgPanel;$('menu').onclick=()=>$('rail').classList.toggle('closed');$('q').oninput=e=>{state.query=e.target.value;render()};$('groupCtl').onchange=e=>{state.group=e.target.value;render()};$('colorCtl').onchange=e=>{state.color=e.target.value;render()};$('sizeCtl').onchange=e=>{state.size=e.target.value;render()};$('windowCtl').onchange=e=>{state.window=+e.target.value;render()};$('clearSel').onclick=()=>{state.selected.clear();render();if(rightMode==='ai')showAI()};$('aiOpen').onclick=showAI;$('libSearch').oninput=renderLibrary;$('exportAll').onclick=exportAll;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>e.target.files[0]&&importLib(e.target.files[0]).catch(x=>toast(x.message));$('sourceClose').onclick=()=>$('sourceModal').classList.remove('open');$('enableAll').onclick=()=>{sourceCfg.disabled=[];localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()};$('disableAll').onclick=()=>{sourceCfg.disabled=Object.keys(sourceCounts());localStorage.setItem(LSS,JSON.stringify(sourceCfg));render();openSources()};$('addSource').onclick=addSource;const c=$('sphere');c.addEventListener('pointerdown',sphereDown);c.addEventListener('pointermove',sphereMove);c.addEventListener('pointerup',sphereUp);c.addEventListener('pointercancel',()=>sphere.drag=null);c.addEventListener('wheel',sphereWheel,{passive:false});c.addEventListener('touchstart',sphereTouchStart,{passive:false});c.addEventListener('touchmove',sphereTouchMove,{passive:false});c.addEventListener('touchend',sphereTouchEnd);window.addEventListener('resize',()=>{chart&&chart.resize();if(state.view==='explore')renderSphere()})}
async function boot(){wire();await openDB();events=await all('events');analyses=await all('analyses');try{const r=await fetch(CACHE,{cache:'no-store'}),j=await r.json(),arts=Array.isArray(j.data)?j.data:[],fresh=canonicalize(arts);if(fresh.length){events=fresh;await put('events',events)}$('statusText').textContent='Ready · '+events.length+' events from '+arts.length+' articles';$('status').classList.add('good')}catch(e){$('statusText').textContent=events.length?'Using saved events':'Cache unavailable';$('status').classList.add(events.length?'good':'bad')}render();renderLibrary()}boot().catch(e=>{$('statusText').textContent=e.message;$('status').classList.add('bad')});})();
