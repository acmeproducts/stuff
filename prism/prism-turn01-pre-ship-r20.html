<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>PRISM · Turn 01 pre-ship R20</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b}#app{border:0;display:block}</style></head>
<body><iframe id="app" src="./prism-turn01-pre-ship-r18.html?v=e5c4dd5b78453ee4d911b2378fce091fe7ccc4a7" title="PRISM R20"></iframe>
<script>
(()=>{'use strict';const frame=document.getElementById('app');
function patch(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||!w.echarts)return setTimeout(patch,120);const treemap=d.getElementById('treemap'),chart=treemap&&w.echarts.getInstanceByDom(treemap);if(!chart)return setTimeout(patch,120);if(treemap.dataset.r20)return;treemap.dataset.r20='1';
const css=d.createElement('style');css.textContent=`
#treemap{position:absolute!important;inset:0!important;overflow:auto!important;background:#07111b!important;padding:8px!important}.r20Map{display:grid;gap:10px;align-content:start}.r20Group{border:1px solid #1d3142;background:#0a1622;padding:6px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:92px;gap:5px}.r20GroupTitle{grid-column:1/-1;font:700 16px/1.2 Arial,Helvetica,sans-serif;color:#fff;padding:2px 3px}.r20Tile{border:1px solid #111;padding:7px 8px;text-align:left;color:#fff;overflow:hidden;display:flex;align-items:flex-start;justify-content:flex-start;font-family:Arial,Helvetica,sans-serif;line-height:1.08;white-space:normal;word-break:normal;overflow-wrap:anywhere}.r20Tile.big{grid-column:span 2;grid-row:span 2}.r20Tile.med{grid-column:span 2;grid-row:span 1}.r20Tile.small{grid-column:span 1;grid-row:span 1}.r20Tile span{display:block;width:100%;height:100%}.r20More{grid-column:span 2;grid-row:span 1;background:#142333!important;color:#d6e3ed!important;font-size:13px!important;font-weight:700!important}@media(max-width:760px){#treemap{padding:6px!important}.r20Map{gap:8px}.r20Group{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:96px;gap:4px;padding:4px}.r20GroupTitle{font-size:15px}.r20Tile{padding:6px}.r20Tile.big{grid-column:span 2;grid-row:span 2}.r20Tile.med{grid-column:span 2}.r20Tile.small{grid-column:span 1}}
@media(min-width:900px){.r20Group{grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:104px}}
#sphere{overflow:auto!important;touch-action:auto!important;background:#07111b!important}#orb,#zoomHint{display:none!important}.r20Explore{height:100%;overflow:auto;padding:10px;display:grid;gap:9px;align-content:start}.r20Cluster{border:1px solid #29445e;border-radius:12px;background:#0d1d2c;padding:12px;text-align:left;color:#edf6ff}.r20Cluster h3{margin:0 0 5px;font-size:18px}.r20Cluster p{margin:7px 0 0;color:#b9cbd8;font-size:12px}.r20Back{margin-left:auto;border:1px solid #7dd3fc;border-radius:999px;background:#102338;color:#edf6ff;padding:6px 10px}@media(max-width:760px){.library.detailOpen{display:grid!important;grid-template-rows:48px minmax(0,1fr)!important;height:100%!important}.library.detailOpen .libraryRail{display:block!important;height:48px!important}.library.detailOpen .libraryRailHead,.library.detailOpen .libraryHelp,.library.detailOpen .libraryList{display:none!important}.library.detailOpen .libraryOmni{display:block!important;height:36px!important;margin:6px 8px!important;width:calc(100% - 16px)!important}.library.detailOpen .libraryStage{display:grid!important;height:auto!important}.libraryCompose{padding-bottom:max(9px,env(safe-area-inset-bottom))!important}}`;d.head.appendChild(css);
const brand=d.querySelector('.railBrand small');if(brand)brand.textContent='Turn 01 · pre-ship R20';
const navs=[...d.querySelectorAll('.navBtn')],mapBtn=navs.find(b=>b.dataset.view==='map'),feedBtn=navs.find(b=>b.dataset.view==='feed'),exploreBtn=navs.find(b=>b.dataset.view==='explore'),libraryBtn=navs.find(b=>b.dataset.view==='library'),base=new Map(navs.map(b=>[b,b.onclick]));
function muted(hex){const h=String(hex||'').toLowerCase();if(h==='#36d38d')return'#2e7f22';if(h==='#d8ad53')return'#8d741d';if(h==='#f06b7e')return'#8a2630';return h||'#405362'}
function fit(btn){const span=btn.firstElementChild;if(!span)return;let fs=btn.classList.contains('big')?24:btn.classList.contains('med')?17:13, min=8;span.style.fontSize=fs+'px';span.style.lineHeight='1.08';for(let i=0;i<40;i++){if(span.scrollHeight<=btn.clientHeight-10&&span.scrollWidth<=btn.clientWidth-10)break;fs-=.5;if(fs<min){const rows=Math.min(4,Math.ceil(span.scrollHeight/Math.max(1,btn.clientHeight-10)));btn.style.gridRow='span '+Math.max(1,rows);fs=min;break}span.style.fontSize=fs+'px'}span.style.fontSize=fs+'px'}
function rawGroups(){const opt=chart.getOption(),s=opt.series&&opt.series[0];return(s&&s.data)||[]}
function renderMap(){const groups=rawGroups();treemap.innerHTML='';const root=d.createElement('div');root.className='r20Map';treemap.appendChild(root);groups.forEach(g=>{const sec=d.createElement('section');sec.className='r20Group';const title=d.createElement('div');title.className='r20GroupTitle';title.textContent=g.name||'Unknown';sec.appendChild(title);const kids=[...(g.children||[])].sort((a,b)=>(+b.value||0)-(+a.value||0));kids.forEach((c,i)=>{const b=d.createElement('button');const v=+c.value||0;b.className='r20Tile '+(i<2||v>=64?'big':i<8||v>=28?'med':'small');b.style.background=muted(c.itemStyle&&c.itemStyle.color);b.dataset.eventId=c.eventId||'';const span=d.createElement('span');span.textContent=c.name||'';b.appendChild(span);b.onclick=()=>{if(!c.eventId)return;base.get(feedBtn).call(feedBtn);setTimeout(()=>{const card=d.querySelector('.feedCard[data-id="'+c.eventId+'"]');if(card)card.click();base.get(mapBtn).call(mapBtn);setTimeout(renderMap,0)},0)};sec.appendChild(b)});root.appendChild(sec)});requestAnimationFrame(()=>root.querySelectorAll('.r20Tile').forEach(fit))}
mapBtn.onclick=function(){const r=base.get(mapBtn).call(mapBtn);setTimeout(renderMap,0);return r};
['q','groupCtl','colorCtl','sizeCtl','windowCtl','filterClose','filterScrim'].forEach(id=>{const x=d.getElementById(id);if(x){x.addEventListener('input',()=>setTimeout(renderMap,20));x.addEventListener('change',()=>setTimeout(renderMap,20));x.addEventListener('click',()=>setTimeout(renderMap,40))}});d.addEventListener('click',e=>{if(e.target.closest('.chip'))setTimeout(renderMap,50)});
let focus=null,exploreMode=false;function showExplore(){exploreMode=true;navs.forEach(b=>b.classList.toggle('on',b===exploreBtn));d.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='explore'));d.getElementById('context').textContent='Explore';d.querySelector('.shell').classList.remove('libraryMode');d.getElementById('q').hidden=false;renderExplore()}
function renderExplore(){if(!exploreMode)return;const sphere=d.getElementById('sphere');sphere.innerHTML='';const wrap=d.createElement('div');wrap.className='r20Explore';sphere.appendChild(wrap);const groups=rawGroups();if(focus){const g=groups.find(x=>x.name===focus);if(!g){focus=null;return renderExplore()}const h=d.createElement('div');h.style.display='flex';h.style.alignItems='center';h.innerHTML='<b style="font-size:16px">'+focus+'</b><button class="r20Back">× All clusters</button>';h.querySelector('button').onclick=()=>{focus=null;renderExplore()};wrap.appendChild(h);(g.children||[]).forEach(c=>{const b=d.createElement('button');b.className='r20Cluster';b.innerHTML='<h3>'+c.name+'</h3>';wrap.appendChild(b)})}else groups.forEach(g=>{const b=d.createElement('button');b.className='r20Cluster';const kids=g.children||[];b.innerHTML='<h3>'+g.name+'</h3><div>'+kids.length+' items</div><p>'+kids.slice(0,3).map(x=>x.name).join(' · ')+'</p>';b.onclick=()=>{focus=g.name;renderExplore()};wrap.appendChild(b)})}
exploreBtn.onclick=()=>{focus=null;showExplore()};[mapBtn,feedBtn,libraryBtn].forEach(b=>{const prior=b.onclick;b.onclick=function(){exploreMode=false;return prior.call(b)}});
const send=d.getElementById('librarySend');if(send){const normalize=()=>{if(send.textContent==='Research')send.textContent='Research web'};normalize();new MutationObserver(normalize).observe(send,{childList:true,subtree:true})}
base.get(mapBtn).call(mapBtn);setTimeout(renderMap,0)}
frame.addEventListener('load',()=>setTimeout(patch,80));})();
</script></body></html>
