<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#182230;--muted:#667085;--line:#d7dde5;--soft:#eef2f6;--accent:#3e4d60;--good:#137547;--warn:#8a6500;--bad:#b42318;--shadow:0 8px 24px rgba(16,24,40,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{color:var(--muted)}.app{min-height:100vh}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 14px}.brand{font-weight:900;letter-spacing:.02em}.build{font:10px ui-monospace,Consolas,monospace;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px}.tabs{display:flex;gap:4px;flex:1;justify-content:center}.tab{border:0;background:transparent;border-radius:8px;padding:8px 11px;font-weight:800;color:#475467}.tab.active,.tab:hover{background:var(--soft)}.content{max-width:1500px;margin:auto;padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.panel{padding:14px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;color:var(--ink)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}.input,.textarea,.select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;color:var(--ink);outline:none}.input:focus,.textarea:focus,.select:focus{border-color:#98a2b3}.textarea{resize:vertical;min-height:62px}.omni{font-size:16px;min-width:260px;flex:1}.grid2{display:grid;grid-template-columns:minmax(260px,.72fr) minmax(0,2fr);gap:12px}.rail{overflow:hidden}.railHead{padding:10px;border-bottom:1px solid var(--line)}.projectList{max-height:calc(100vh - 190px);overflow:auto}.projectRow{padding:10px 11px;border-bottom:1px solid #edf0f2;cursor:pointer}.projectRow:hover,.projectRow.active{background:#f1f4f7}.projectRow strong{display:block}.projectRow small{color:var(--muted)}.workspace{min-width:0}.projectHead{padding:12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:8px;align-items:start}.projectName{font-size:21px;font-weight:900;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;width:100%}.projectName:focus,.projectName:hover{border-color:var(--line);background:#fff}.projectNote{width:100%;margin-top:4px;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 7px;resize:vertical;min-height:44px}.projectNote:focus,.projectNote:hover{border-color:var(--line);background:#fff}.stage{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc}.stage span{font-size:10px;font-weight:900;letter-spacing:.04em;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.stage .current{background:#e9edf2;color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:7px;padding:12px}.metric{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fafbfc;min-width:0}.metric .k{font-size:9px;text-transform:uppercase;font-weight:900;color:var(--muted)}.metric .v{font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.section{padding:0 12px 12px}.sectionHead{display:flex;align-items:center;gap:8px;margin:4px 0 7px}.sectionHead h3{font-size:13px;margin:0;flex:1}.source{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;overflow:hidden}.sourceTop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px;background:#fff}.chev{border:0;background:transparent;font-weight:900;width:28px}.sourcePath{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sourceSub{font-size:10px;color:var(--muted);margin-top:2px}.sourceBody{border-top:1px solid var(--line);padding:9px;background:#fafbfc}.sourceMetrics{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px}.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px}.mini b{display:block;font-size:11px}.mini span{font-size:9px;color:var(--muted);text-transform:uppercase}.noteInput{width:100%;margin-top:8px}.planSummary{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:7px}.planTable,.table{width:100%;border-collapse:collapse;min-width:760px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:8px}.table th,.table td,.planTable th,.planTable td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.table th,.planTable th{position:sticky;top:0;background:#fafbfc;font-size:9px;text-transform:uppercase;color:var(--muted);z-index:2}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:9px;font-weight:900}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.activityGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.worker{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.worker .path{font:10px ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.modal{position:fixed;inset:0;background:rgba(17,24,39,.42);z-index:80;display:grid;place-items:center;padding:14px}.modalCard{width:min(1100px,96vw);height:min(760px,92vh);background:#fff;border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(16,24,40,.24);display:flex;flex-direction:column;overflow:hidden}.modalHead{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.pickerBody{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:0;flex:1}.locations{border-right:1px solid var(--line);overflow:auto}.loc{width:100%;border:0;border-bottom:1px solid #edf0f2;background:#fff;text-align:left;padding:9px;font-weight:800}.loc:hover,.loc.active{background:#f1f4f7}.browse{min-width:0;display:flex;flex-direction:column}.browseTools{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}.browsePath{flex:1;font:11px ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-radius:7px;padding:7px}.browseList{overflow:auto;flex:1}.browseRow{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 130px;gap:7px;align-items:center;padding:8px;border-bottom:1px solid #edf0f2}.browseOpen{border:0;background:transparent;text-align:left;padding:0;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modalFoot{padding:9px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}.formGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.formGrid .full{grid-column:1/-1}.toastWrap{position:fixed;right:14px;bottom:14px;z-index:100;display:grid;gap:6px}.toast{background:#111827;color:#fff;border-radius:8px;padding:9px 11px;max-width:380px}.toast.bad{background:#8f231a}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:1000px){.grid2{grid-template-columns:1fr}.projectList{max-height:220px}.metrics,.sourceMetrics{grid-template-columns:repeat(3,1fr)}.activityGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.top{align-items:flex-start;flex-wrap:wrap}.tabs{order:3;width:100%;justify-content:flex-start;overflow:auto}.content{padding:9px}.metrics,.sourceMetrics,.planSummary{grid-template-columns:repeat(2,1fr)}.projectHead{grid-template-columns:1fr}.pickerBody{grid-template-columns:120px minmax(360px,1fr);overflow:auto}.modalCard{width:100%;height:94vh}.formGrid{grid-template-columns:1fr}.formGrid .full{grid-column:auto}.build{display:none}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">SOT</div><span class="build">TURN01 · 2026.08.21.turn01-pre-base</span><nav class="tabs" id="tabs"><button class="tab active" data-page="projects">Projects</button><button class="tab" data-page="corpus">Corpus</button><button class="tab" data-page="activity">Activity</button><button class="tab" data-page="lifecycle">Lifecycle</button></nav><button class="btn" id="refresh">Refresh</button></header><main class="content" id="app"></main></div>
<div class="toastWrap" id="toasts"></div>
<div class="modal hidden" id="picker"><div class="modalCard"><div class="modalHead"><strong>Add source paths</strong><span class="muted" id="pickStatus"></span><span class="grow"></span><button class="btn" id="pickClose">Close</button></div><div class="pickerBody"><div class="locations" id="locations"></div><div class="browse"><div class="browseTools"><button class="btn" id="pickUp">Up</button><div class="browsePath" id="browsePath">/</div><button class="btn" id="pickAll">Select all</button></div><div class="browseList" id="browseList"></div></div></div><div class="modalFoot"><span class="muted grow" id="pickCount">0 selected</span><button class="btn primary" id="pickAdd">Add selected</button></div></div></div>
<script>
'use strict';
const BUILD='2026.08.21.turn01-pre-base';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={page:'projects',projects:[],project:null,sources:[],intel:null,plan:null,scheduler:null,query:null,lifecycle:null,expanded:new Set(),picker:{path:'/',parent:'/',locations:[],rows:[],selected:new Map()},poll:null};
function escHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtBytes(n){n=Number(n||0);if(!n)return '0 B';const u=['B','KB','MB','GB','TB','PB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i?n.toFixed(n>=100?0:n>=10?1:2):Math.round(n))+' '+u[i]}
function fmtDate(v){if(!v)return '—';const n=Number(v),d=Number.isFinite(n)&&n>10000000000?new Date(n):new Date(v);return isNaN(d)?'—':d.toLocaleString()}
function toast(msg,bad=false){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3600)}
async function api(path,opt={}){const r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.error||r.statusText);return x}
function metric(k,v){return `<div class="metric"><div class="k">${escHtml(k)}</div><div class="v">${escHtml(v)}</div></div>`}
function mini(k,v){return `<div class="mini"><span>${escHtml(k)}</span><b>${escHtml(v)}</b></div>`}
function pill(v){const s=String(v||'');const c=/verified|noop|closed|done/i.test(s)?'good':/missing|transfer|backup|wip|pending|recorded/i.test(s)?'warn':/error|unresolved|disposed/i.test(s)?'bad':'';return `<span class="pill ${c}">${escHtml(s||'—')}</span>`}
async function loadProjects(q=''){const x=await api('/turn01/projects?q='+encodeURIComponent(q));state.projects=x.projects||[];if(state.project&&!state.projects.some(p=>p.project_token===state.project.project_token))state.project=null}
async function selectProject(t){state.project=await api('/turn01/projects/'+encodeURIComponent(t));await Promise.all([loadSourceSummaries(),loadIntel(),loadPlan()]);render()}
async function loadSourceSummaries(){if(!state.project)return;const x=await api('/turn01/projects/'+encodeURIComponent(state.project.project_token)+'/sources');state.sources=x.sources||[]}
async function loadIntel(){if(state.project)state.intel=await api('/turn01/projects/'+encodeURIComponent(state.project.project_token)+'/intelligence');else state.intel=await api('/turn01/intelligence')}
async function loadPlan(){if(!state.project)return;state.plan=await api('/turn01/projects/'+encodeURIComponent(state.project.project_token)+'/plan')}
async function saveProject(){if(!state.project)return;const sources=state.sources.map(s=>({path:s.path||s.last_observed_locator,operator_label:s.operator_label||s.label||s.path,note:s.operator_note||''}));const b={project_name:$('#projectName').value.trim(),project_note:$('#projectNote').value,sources};state.project=await api('/turn01/projects/'+encodeURIComponent(state.project.project_token),{method:'PATCH',body:JSON.stringify(b)});await Promise.all([loadProjects($('#projectOmni')?.value||''),loadSourceSummaries(),loadIntel(),loadPlan()]);render();toast('Project saved')}
async function newProject(){const name=prompt('Project name');if(!name)return;state.project=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name,project_note:''})});await loadProjects();state.sources=[];state.intel=state.project.intelligence;state.plan=await api('/turn01/projects/'+encodeURIComponent(state.project.project_token)+'/plan');render();toast('Project created')}
async function processProject(){if(!state.project)return;try{await api('/projects/'+encodeURIComponent(state.project.project_token)+'/fingerprint/start',{method:'POST',body:'{}'});toast('Project queued');await refreshActivity();await loadIntel();render()}catch(e){if(/already scheduled/i.test(e.message))toast('Project already scheduled');else throw e}}
async function pauseProject(){if(!state.project)return;await api('/projects/'+encodeURIComponent(state.project.project_token)+'/fingerprint/pause',{method:'POST',body:'{}'});toast('Project paused');await refreshActivity();render()}
async function removeSource(pathId){state.sources=state.sources.filter(s=>s.path_id!==pathId);await saveProject()}
function renderProjects(){const p=state.project,i=state.intel||{},pl=state.plan||{totals:{},items:[]};return `<div class="grid2"><aside class="card rail"><div class="railHead"><div class="toolbar"><input id="projectOmni" class="input omni" placeholder="Search projects…" value=""><button class="btn" id="newProject">+ New</button></div></div><div class="projectList">${state.projects.map(x=>`<div class="projectRow ${p&&x.project_token===p.project_token?'active':''}" data-token="${escHtml(x.project_token)}"><strong>${escHtml(x.project_name)}</strong><small>${escHtml(x.status)} · ${fmtDate(x.updated_at)}</small></div>`).join('')||'<div class="empty">No projects</div>'}</div></aside><section class="card workspace">${!p?'<div class="empty"><strong>Select or create a project.</strong><br>Projects are scopes over corpus paths; corpus evidence remains global.</div>':`<div class="projectHead"><div><input id="projectName" class="projectName" value="${escHtml(p.project_name)}"><textarea id="projectNote" class="projectNote" placeholder="Project note">${escHtml(p.notes||'')}</textarea></div><div class="toolbar"><button class="btn" id="addSource">+ Source</button><button class="btn primary" id="processProject">Process</button><button class="btn" id="pauseProject">Pause</button></div></div><div class="stage"><span class="current">SCOPE</span><span>PROCESS</span><span>REVIEW</span><span>EXECUTE</span><span>CERTIFY</span></div><div class="metrics">${metric('Observed',i.observations||0)}${metric('Source bytes',fmtBytes(i.bytes))}${metric('Unique',i.unique_content||0)}${metric('Duplicate bytes',fmtBytes(i.duplicate_bytes))}${metric('Target missing',fmtBytes(i.target_missing_bytes))}${metric('Backup missing',fmtBytes(i.backup_missing_bytes))}</div><div class="section"><div class="sectionHead"><h3>Sources</h3><span class="muted">expand source → SOT evidence</span></div>${state.sources.map(renderSource).join('')||'<div class="empty">No source paths yet.</div>'}</div><div class="section"><div class="sectionHead"><h3>Dynamic execution plan</h3><button class="btn" id="refreshPlan">Refresh plan</button></div><div class="planSummary">${metric('No-op',fmtBytes(pl.totals?.noop_bytes))}${metric('Transfer',fmtBytes(pl.totals?.transfer_bytes))}${metric('Backup',fmtBytes(pl.totals?.backup_bytes))}${metric('Verify target',fmtBytes(pl.totals?.verify_target_bytes))}${metric('Unresolved',fmtBytes(pl.totals?.unresolved_bytes))}</div><div class="tableWrap" style="margin-top:8px;max-height:280px"><table class="planTable"><thead><tr><th>Action</th><th>File</th><th>Size</th><th>Fingerprint</th><th>Source</th><th>Target</th><th>Backup</th></tr></thead><tbody>${(pl.items||[]).slice(0,500).map(x=>`<tr><td>${pill(x.action)}</td><td>${escHtml(x.filename)}</td><td>${fmtBytes(x.size)}</td><td class="mono">${escHtml((x.file_fingerprint||'').slice(0,16))}</td><td class="mono">${escHtml(x.source_path)}</td><td>${escHtml(x.target_path||x.target_status)}</td><td>${escHtml(x.backup_path||x.backup_status)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No fingerprinted plan items yet.</td></tr>'}</tbody></table></div></div>`}</section></div>`}
function renderSource(s){const open=state.expanded.has(s.path_id);return `<div class="source"><div class="sourceTop"><button class="chev" data-expand="${escHtml(s.path_id)}">${open?'▾':'▸'}</button><div><div class="sourcePath">${escHtml(s.path||s.last_observed_locator)}</div><div class="sourceSub">${escHtml(s.operator_label||'')} · last observed ${fmtDate(s.last_indexed_at||s.last_fingerprinted_at)}</div></div><button class="btn danger" data-remove-source="${escHtml(s.path_id)}">Remove</button></div>${open?`<div class="sourceBody"><div class="sourceMetrics">${mini('Files',s.observations||s.file_count||0)}${mini('Bytes',fmtBytes(s.bytes||s.byte_count))}${mini('Unique',s.unique_content||0)}${mini('Duplicate',fmtBytes(s.duplicate_bytes))}${mini('Target',String(s.target_coverage_percent||0)+'%')}${mini('Backup',String(s.backup_coverage_percent||0)+'%')}</div><input class="input noteInput" data-source-note="${escHtml(s.path_id)}" value="${escHtml(s.operator_note||'')}" placeholder="Source-specific note"></div>`:''}</div>`}
async function renderCorpus(){if(!state.query)state.query=await api('/turn01/query?limit=500');const q=state.query;$('#app').innerHTML=`<section class="card panel"><div class="toolbar"><input id="corpusQ" class="input omni" placeholder="Path, filename, fingerprint…"><select id="targetFilter" class="select"><option value="">Target: any</option><option value="present">Target present</option><option value="missing">Target missing</option></select><select id="backupFilter" class="select"><option value="">Backup: any</option><option value="present">Backup present</option><option value="missing">Backup missing</option></select><select id="copiesFilter" class="select"><option value="1">Copies ≥1</option><option value="2">Copies ≥2</option><option value="3">Copies ≥3</option></select><button class="btn primary" id="runQuery">Query</button></div><div class="tableWrap" style="margin-top:10px;max-height:72vh"><table class="table"><thead><tr><th>File</th><th>Path</th><th>Size</th><th>Modified</th><th>Copies</th><th>Fingerprint</th><th>Target</th><th>Backup</th></tr></thead><tbody>${(q.rows||[]).map(x=>`<tr><td>${escHtml(x.filename)}</td><td class="mono">${escHtml(x.full_path||x.relative_path)}</td><td>${fmtBytes(x.size)}</td><td>${fmtDate(x.modified_at)}</td><td>${x.copy_count}</td><td class="mono">${escHtml((x.file_fingerprint||'').slice(0,20))}</td><td>${pill(x.target_verified?'verified':'missing')}</td><td>${pill(x.backup_verified?'verified':'missing')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No results.</td></tr>'}</tbody></table></div></section>`;$('#runQuery').onclick=runCorpusQuery}
async function runCorpusQuery(){const qs=new URLSearchParams({q:$('#corpusQ').value,target:$('#targetFilter').value,backup:$('#backupFilter').value,copies:$('#copiesFilter').value,limit:'1000'});state.query=await api('/turn01/query?'+qs);await renderCorpus()}
async function refreshActivity(){state.scheduler=await api('/scheduler/status');if(state.page==='activity')renderActivity()}
function renderActivity(){const s=state.scheduler||{workers:[],queue:[]};$('#app').innerHTML=`<section class="card panel"><div class="sectionHead"><h3>Global processing</h3><span class="muted">${s.worker_pool||0} workers · ${s.queue?.length||0} queued projects</span></div><div class="activityGrid">${(s.workers||[]).map(w=>`<div class="worker"><div><b>Worker ${w.worker_id}</b> ${pill(w.phase||'idle')}</div><div class="muted">${escHtml(w.project_token||'idle')}</div><div class="path">${escHtml(w.path||'')}</div><div class="path">${escHtml(w.item||'')}</div></div>`).join('')}</div><div class="tableWrap" style="margin-top:10px"><table class="table"><thead><tr><th>Project</th><th>Phase</th><th>State</th><th>Files</th><th>Bytes</th><th>Done</th><th>Throughput</th><th>ETA</th></tr></thead><tbody>${(s.queue||[]).map(q=>`<tr><td class="mono">${escHtml(q.project_token)}</td><td>${escHtml(q.phase)}</td><td>${pill(q.state)}</td><td>${q.totals?.files||0}</td><td>${fmtBytes(q.totals?.bytes)}</td><td>${fmtBytes(q.totals?.bytes_done)}</td><td>${fmtBytes(q.progress?.bytes_per_second)}/s</td><td>${q.progress?.eta_seconds?Math.round(q.progress.eta_seconds/60)+' min':'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No queued processing.</td></tr>'}</tbody></table></div></section>`}
async function loadLifecycle(){state.lifecycle=await api('/turn01/lifecycle?limit=100')}
async function renderLifecycle(){if(!state.lifecycle)await loadLifecycle();const l=state.lifecycle||{};$('#app').innerHTML=`<div class="grid2" style="grid-template-columns:1fr 1fr"><section class="card panel"><h3>Record lifecycle evidence</h3><div class="formGrid"><input id="lifeFp" class="input full mono" placeholder="File fingerprint / SHA-256"><input id="lifeSource" class="input full" placeholder="Source path"><input id="lifeTarget" class="input" placeholder="Target path"><input id="lifeBackup" class="input" placeholder="Backup path"><input id="lifeLibrary" class="input" placeholder="Library / physical location"><select id="lifeStatus" class="select"><option value="recorded">Recorded</option><option value="verified">Verified</option></select><textarea id="lifeNote" class="textarea full" placeholder="Note"></textarea></div><div class="toolbar" style="margin-top:8px"><button class="btn" id="recordTransfer">Record source → target</button><button class="btn" id="recordTarget">Record target holding</button><button class="btn" id="recordBackup">Record backup holding</button></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><h3>Source disposition</h3><div class="formGrid"><input id="dispSource" class="input full" placeholder="Source path"><select id="dispStatus" class="select"><option value="active">Active</option><option value="safe_to_retire">Safe to retire</option><option value="archived">Archived</option><option value="cold_stored">Cold stored</option><option value="disposed_external">Disposed externally</option></select><input id="dispLibrary" class="input" placeholder="Library / physical location"><textarea id="dispNote" class="textarea full" placeholder="Disposition note"></textarea></div><button class="btn primary" id="recordDisposition" style="margin-top:8px">Record disposition</button></section><section class="card panel"><h3>Recent evidence</h3><div class="tableWrap" style="max-height:65vh"><table class="table"><thead><tr><th>Type</th><th>Fingerprint / Source</th><th>Location</th><th>Status</th><th>Time</th></tr></thead><tbody>${[...(l.targets||[]).map(x=>({type:'Target',key:x.file_fingerprint,loc:x.target_path,status:x.verification_status,time:x.established_at})),...(l.backups||[]).map(x=>({type:'Backup',key:x.file_fingerprint,loc:x.backup_path,status:x.verification_status,time:x.backed_up_at})),...(l.dispositions||[]).map(x=>({type:'Disposition',key:x.source_path,loc:x.library_location,status:x.disposition_status,time:x.disposition_at}))].sort((a,b)=>String(b.time).localeCompare(String(a.time))).slice(0,200).map(x=>`<tr><td>${x.type}</td><td class="mono">${escHtml(String(x.key||'').slice(0,48))}</td><td>${escHtml(x.loc||'')}</td><td>${pill(x.status)}</td><td>${fmtDate(x.time)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No lifecycle evidence recorded.</td></tr>'}</tbody></table></div></section></div>`;$('#recordTarget').onclick=recordTarget;$('#recordBackup').onclick=recordBackup;$('#recordTransfer').onclick=recordTransfer;$('#recordDisposition').onclick=recordDisposition}
async function recordTarget(){await api('/turn01/holdings/target',{method:'POST',body:JSON.stringify({file_fingerprint:$('#lifeFp').value,target_path:$('#lifeTarget').value,library_location:$('#lifeLibrary').value,verification_status:$('#lifeStatus').value,note:$('#lifeNote').value})});toast('Target holding recorded');state.lifecycle=null;await renderLifecycle()}
async function recordBackup(){await api('/turn01/holdings/backup',{method:'POST',body:JSON.stringify({file_fingerprint:$('#lifeFp').value,backup_path:$('#lifeBackup').value,library_location:$('#lifeLibrary').value,verification_status:$('#lifeStatus').value,note:$('#lifeNote').value})});toast('Backup holding recorded');state.lifecycle=null;await renderLifecycle()}
async function recordTransfer(){await api('/turn01/transfers',{method:'POST',body:JSON.stringify({project_token:state.project?.project_token||null,file_fingerprint:$('#lifeFp').value,source_path:$('#lifeSource').value,target_path:$('#lifeTarget').value,library_location:$('#lifeLibrary').value,event_type:'source_to_target',verification_status:$('#lifeStatus').value,note:$('#lifeNote').value})});toast('Transfer evidence recorded');state.lifecycle=null;await renderLifecycle()}
async function recordDisposition(){await api('/turn01/dispositions',{method:'POST',body:JSON.stringify({project_token:state.project?.project_token||null,source_path:$('#dispSource').value,disposition_status:$('#dispStatus').value,library_location:$('#dispLibrary').value,note:$('#dispNote').value})});toast('Disposition recorded');state.lifecycle=null;await renderLifecycle()}
async function openPicker(){state.picker.selected=new Map();$('#picker').classList.remove('hidden');const x=await api('/fs?path=%2F');state.picker.locations=x.locations||[];renderLocations();const first=state.picker.locations.find(x=>x.available!==false);if(first)await browse(first.path)}
function renderLocations(){const p=state.picker.path;$('#locations').innerHTML=state.picker.locations.map(x=>`<button class="loc ${p===x.path?'active':''}" data-loc="${escHtml(x.path)}" ${x.available===false?'disabled':''}>${escHtml(x.label||x.name)}${x.available===false?'<br><small>Unavailable</small>':''}</button>`).join('');$$('[data-loc]').forEach(b=>b.onclick=()=>browse(b.dataset.loc))}
async function browse(p){$('#pickStatus').textContent='Reading…';const x=await api('/fs?path='+encodeURIComponent(p));state.picker.path=x.path||p;state.picker.parent=x.parent||'/';state.picker.rows=x.folders||[];if(x.locations?.length)state.picker.locations=x.locations;$('#pickStatus').textContent=x.status||'Ready';renderLocations();renderBrowse()}
function renderBrowse(){const s=state.picker.selected;$('#browsePath').textContent=state.picker.path;$('#browseList').innerHTML=state.picker.rows.map(x=>`<div class="browseRow"><input type="checkbox" data-pick="${escHtml(x.path)}" ${s.has(x.path)?'checked':''}><button class="browseOpen" data-open="${escHtml(x.path)}">${escHtml(x.name)}</button><span>${x.bytes==null?'—':fmtBytes(x.bytes)}</span><span>${fmtDate(x.last)}</span></div>`).join('')||'<div class="empty">No folders.</div>';$$('[data-pick]').forEach(c=>c.onchange=()=>{if(c.checked)s.set(c.dataset.pick,{path:c.dataset.pick,operator_label:c.dataset.pick.split('/').pop(),note:''});else s.delete(c.dataset.pick);$('#pickCount').textContent=s.size+' selected'});$$('[data-open]').forEach(b=>b.onclick=()=>browse(b.dataset.open));$('#pickCount').textContent=s.size+' selected'}
async function addPicked(){if(!state.project){toast('Create/select a project first',true);return}for(const x of state.picker.selected.values()){if(!state.sources.some(s=>(s.path||s.last_observed_locator)===x.path))state.sources.push({path_id:'new:'+x.path,path:x.path,last_observed_locator:x.path,operator_label:x.operator_label,operator_note:x.note,observations:0,bytes:0,unique_content:0,duplicate_bytes:0,target_coverage_percent:0,backup_coverage_percent:0})}$('#picker').classList.add('hidden');await saveProject()}
async function render(){if(state.page==='projects'){$('#app').innerHTML=renderProjects();wireProjects()}else if(state.page==='corpus')await renderCorpus();else if(state.page==='activity'){if(!state.scheduler)await refreshActivity();renderActivity()}else if(state.page==='lifecycle')await renderLifecycle()}
function wireProjects(){if($('#newProject'))$('#newProject').onclick=newProject;if($('#projectOmni')){$('#projectOmni').oninput=async e=>{await loadProjects(e.target.value);render()}}$$('.projectRow').forEach(x=>x.onclick=()=>selectProject(x.dataset.token));if(!state.project)return;$('#projectName').onblur=saveProject;$('#projectName').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur()}};$('#projectNote').onblur=saveProject;$('#addSource').onclick=openPicker;$('#processProject').onclick=()=>processProject().catch(e=>toast(e.message,true));$('#pauseProject').onclick=()=>pauseProject().catch(e=>toast(e.message,true));$('#refreshPlan').onclick=async()=>{await Promise.all([loadIntel(),loadPlan(),loadSourceSummaries()]);render()};$$('[data-expand]').forEach(b=>b.onclick=()=>{const id=b.dataset.expand;state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id);render()});$$('[data-remove-source]').forEach(b=>b.onclick=()=>removeSource(b.dataset.removeSource));$$('[data-source-note]').forEach(inp=>inp.onblur=async()=>{const s=state.sources.find(x=>x.path_id===inp.dataset.sourceNote);if(s){s.operator_note=inp.value;await saveProject()}})}
async function refreshAll(){try{if(state.page==='projects'){await loadProjects($('#projectOmni')?.value||'');if(state.project)await selectProject(state.project.project_token);else render()}else if(state.page==='corpus'){state.query=null;await renderCorpus()}else if(state.page==='activity'){await refreshActivity()}else if(state.page==='lifecycle'){state.lifecycle=null;await renderLifecycle()}}catch(e){toast(e.message,true)}}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-page]');if(!b)return;state.page=b.dataset.page;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render().catch(e=>toast(e.message,true))};$('#refresh').onclick=refreshAll;$('#pickClose').onclick=()=>$('#picker').classList.add('hidden');$('#pickUp').onclick=()=>browse(state.picker.parent);$('#pickAll').onclick=()=>{for(const x of state.picker.rows)state.picker.selected.set(x.path,{path:x.path,operator_label:x.name,note:''});renderBrowse()};$('#pickAdd').onclick=()=>addPicked().catch(e=>toast(e.message,true));
async function boot(){try{await loadProjects();await loadIntel();render();state.poll=setInterval(async()=>{try{await refreshActivity();if(state.project&&state.page==='projects'){await Promise.all([loadIntel(),loadPlan(),loadSourceSummaries()]);render()}}catch{}},2500)}catch(e){$('#app').innerHTML=`<div class="card panel"><h3>TURN01 could not connect to SOT API</h3><div class="muted">${escHtml(e.message)}</div></div>`}}
boot();
</script>
</body></html>
