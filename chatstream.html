(--muted)}.empty strong{color:var(--text);font-size:18px}.threadView{height:100%;display:flex;flex-direction:column;min-height:0}.threadStrip{display:flex;gap:8px;align-items:center;padding:7px 10px;background:#0e1115;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);overflow-x:auto;white-space:nowrap}.threadStrip code{color:#dff4ff}.messages{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:11px}.msg{max-width:min(88%,900px);border:1px solid var(--line);border-radius:10px;padding:11px 13px;white-space:pre-wrap;word-break:break-word}.msg.user{align-self:flex-end;background:#15212a;border-left:3px solid var(--accent)}.msg.assistant{align-self:flex-start;background:#13221b;border-left:3px solid var(--green)}.msg.system{align-self:center;background:#161a20;color:#dce3e9}.msgHead{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:9px;text-transform:uppercase;font-weight:800;color:var(--muted)}.msgTime{margin-left:auto;text-transform:none;font-weight:400}.msg a{color:#87cffb}.composer{border-top:1px solid var(--line);background:var(--panel);padding:9px max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}.composeRow{display:flex;align-items:flex-end;gap:7px}.composeRow textarea{flex:1;min-height:48px;max-height:170px;resize:none}.input{width:100%;border:1px solid var(--line);background:#080a0d;color:var(--text);border-radius:8px;padding:9px 10px;outline:none}.input:focus{border-color:var(--accent)}.composerMeta{display:flex;gap:8px;align-items:center;margin-top:5px;color:var(--muted);font-size:9px}.testLink{color:#8bd4ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dashboard{height:100%;overflow:auto;padding:14px}.dashSummary{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin-bottom:12px}.stat{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}.stat b{display:block;font-size:21px}.stat span{font-size:10px;color:var(--muted)}.dashTools{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.dashTools .input{width:auto;min-width:140px}.dashTable{border:1px solid var(--line);border-radius:10px;overflow:hidden}.dashRow{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(150px,1.5fr) 90px 120px minmax(120px,1fr);gap:7px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel)}.dashRow:last-child{border-bottom:0}.dashRow.head{background:var(--panel2);font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:800}.dashRow:not(.head){cursor:pointer}.dashRow:not(.head):hover{background:var(--panel2)}.dashCell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.statusText{display:flex;align-items:center;gap:6px}.attention{color:var(--yellow);font-size:10px}.notes{margin-top:14px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}.notes textarea{min-height:78px;resize:vertical}.modalBg{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:14px}.modal{width:min(700px,100%);max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}.modalHead,.modalFoot{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--panel2)}.modalHead{border-bottom:1px solid var(--line)}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{padding:13px;overflow:auto}.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:5px}.help{font-size:9px;color:var(--muted);margin-top:4px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.filePicker{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:5;max-height:210px;overflow:auto;background:#0c0f13;border:1px solid var(--line);border-radius:8px;margin-top:3px;box-shadow:0 12px 30px #0008}.suggestion{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #292f38;background:transparent;color:var(--text);padding:8px 9px}.suggestion:hover{background:var(--panel3)}.notice{border:1px solid var(--line);background:#0d1014;border-radius:8px;padding:9px;color:var(--muted);font-size:10px}.settingsTabs{display:flex;gap:4px;padding:8px;background:var(--panel2);border-bottom:1px solid var(--line);overflow:auto}.settingsTab{white-space:nowrap}.settingsTab.active{border-color:var(--accent);color:#ccebff}.pane{display:none}.pane.active{display:block}.diag{font:10px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:#050607;border:1px solid var(--line);border-radius:8px;padding:9px;max-height:340px;overflow:auto}.toastWrap{position:fixed;right:10px;bottom:max(10px,env(safe-area-inset-bottom));z-index:1000;display:flex;flex-direction:column;gap:7px;max-width:min(420px,calc(100vw - 20px))}.toast{background:#151a20;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 11px;box-shadow:0 8px 24px #0008}.toast.err{border-left-color:var(--red)}.toast.ok{border-left-color:var(--green)}
@media(max-width:800px){:root{--sidebar:100%}.sidebar{position:fixed;inset:0;z-index:300;width:100%;border:0}.sidebar.closed{display:none}.menuBtn{display:grid}.mainTop{padding-left:max(8px,env(safe-area-inset-left))}.dashSummary{grid-template-columns:repeat(2,1fr)}.dashRow{grid-template-columns:1.15fr 1.5fr 82px}.dashRow .desktopOnly{display:none}.grid2{grid-template-columns:1fr}.msg{max-width:94%}.tabs{height:52px}.tab{height:45px}.dashTools .input{width:100%}}

<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar">
  <div class="topbar"><div><span class="brand">ChatStream</span><span class="version">v0.1.0</span></div><span class="grow"></span><button class="btn iconbtn" id="settingsBtn" title="Settings">⚙</button></div>
  <div class="sidebarBody" id="sidebarBody"></div>
  <div class="sidebarFooter"><button class="btn primary" id="newProjectBtn">+ Project</button><button class="btn" id="syncBtn">Sync</button><span class="grow"></span><span class="conn" id="syncState">Local</span></div>
</aside>
<main class="main" id="main">
  <div class="mainTop"><button class="btn iconbtn menuBtn" id="menuBtn">☰</button><div class="titleWrap"><div class="mainTitle" id="mainTitle">Dashboard</div><div class="mainSub" id="mainSub">All ChatStream work</div></div><span class="grow"></span><span class="conn" id="gatewayState">OpenClaw offline</span><button class="btn" id="refreshBtn">Refresh</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</main>
</div>
<div id="modalRoot"></div><div class="toastWrap" id="toastWrap"></div>
<script>
(()=>{'use strict';
const BUILD='0.1.0',PV=4,CID='openclaw-control-ui',CMODE='webchat',ROLE='operator',SCOPES=['operator.read','operator.write','operator.admin'];
const LS={settings:'chatstream_settings_v1',pat:'chatstream_github_pat_v1',identity:'chatstream_openclaw_identity_v1',device:'chatstream_openclaw_device_v1',gatewayToken:'chatstream_openclaw_token_v1',cache:'chatstream_state_cache_v1',outbox:'chatstream_outbox_v1'};
const $=id=>document.getElementById(id),enc=new TextEncoder(),now=()=>new Date().toISOString(),uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultSettings={codeOwner:'acmeproducts',codeRepo:'stuff',codeBranch:'main',stateOwner:'acmeproducts',stateRepo:'stuff',stateBranch:'main',statePath:'chatstream/state.json',gatewayUrl:'wss://oc-ref.fell-dojo.ts.net',testBase:'https://acmeproducts.github.io/stuff/',autoSync:true,syncInterval:60000};
function loadJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d}catch{return d}}
const state={settings:{...defaultSettings,...loadJSON(LS.settings,{})},doc:null,remoteSha:null,activeProjectId:null,activeThreadId:null,view:'dashboard',repoFiles:[],repoFilesKey:'',ws:null,connected:false,connecting:false,pending:new Map(),identity:null,hello:null,scopes:[],runByThread:new Map(),streamByThread:new Map(),syncing:false,poll:null,diag:[]};
function blankDoc(){return{schema:'chatstream-state',version:1,updatedAt:now(),deviceId:'',projects:[],threads:[],events:[],dashboardNotes:''}}
function normalizeDoc(d){let x=d&&typeof d==='object'?d:blankDoc();x.schema='chatstream-state';x.version=1;x.projects=Array.isArray(x.projects)?x.projects:[];x.threads=Array.isArray(x.threads)?x.threads:[];x.events=Array.isArray(x.events)?x.events:[];x.dashboardNotes=String(x.dashboardNotes||'');for(let p of x.projects){p.id=String(p.id||uid());p.name=String(p.name||'Project');p.createdAt=p.createdAt||now();p.updatedAt=p.updatedAt||p.createdAt;p.notes=String(p.notes||'')}for(let t of x.threads){t.id=String(t.id||uid());t.projectId=String(t.projectId||'');t.title=String(t.title||t.outputFile||'Thread');t.repo=t.repo||`${state.settings.codeOwner}/${state.settings.codeRepo}`;t.branch=t.branch||state.settings.codeBranch;t.inputFile=t.inputFile?String(t.inputFile):'';t.outputFile=t.outputFile?String(t.outputFile):'';t.messages=Array.isArray(t.messages)?t.messages:[];t.executions=Array.isArray(t.executions)?t.executions:[];t.status=['queued','running','waiting','completed','error','cancelled'].includes(t.status)?t.status:'completed';t.attentionRequired=!!t.attentionRequired;t.notes=String(t.notes||'');t.createdAt=t.createdAt||now();t.updatedAt=t.updatedAt||t.createdAt;t.sessionKey=t.sessionKey||'';t.sessionId=t.sessionId||'';t.lastTestUrl=t.lastTestUrl||''}return x}
state.doc=normalizeDoc(loadJSON(LS.cache,blankDoc()));
function log(kind,msg,data){let line=`${new Date().toLocaleTimeString()} ${kind} ${msg}${data!==undefined?' '+safe(data):''}`;state.diag.push(line);if(state.diag.length>500)state.diag.shift()}
function safe(v){try{return JSON.stringify(v,(k,x)=>/token|pat|authorization|content/i.test(k)?'[redacted]':x).slice(0,1600)}catch{return String(v)}}
function toast(msg,type=''){let d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('toastWrap').appendChild(d);setTimeout(()=>d.remove(),3500)}
function fmtAge(v){if(!v)return'—';let n=Date.now()-new Date(v).getTime();if(n<60000)return'now';if(n<3600000)return Math.floor(n/60000)+'m';if(n<86400000)return Math.floor(n/3600000)+'h';return Math.floor(n/86400000)+'d'}
function activeProject(){return state.doc.projects.find(p=>p.id===state.activeProjectId)||null}function activeThread(){return state.doc.threads.find(t=>t.id===state.activeThreadId)||null}function threadsFor(p){return state.doc.threads.filter(t=>t.projectId===p)}
function touchProject(id){let p=state.doc.projects.find(x=>x.id===id);if(p)p.updatedAt=now()}
function markLocal(type,payload){let e={id:uid(),type,at:now(),payload};state.doc.events.push(e);if(state.doc.events.length>1500)state.doc.events=state.doc.events.slice(-1500);state.doc.updatedAt=e.at;localStorage.setItem(LS.cache,JSON.stringify(state.doc));let out=loadJSON(LS.outbox,[]);out.push(e);localStorage.setItem(LS.outbox,JSON.stringify(out));render();if(state.settings.autoSync)scheduleSync()}
function scheduleSync(){clearTimeout(scheduleSync.t);scheduleSync.t=setTimeout(()=>syncNow(true).catch(()=>{}),850)}
function eventMap(a){let m=new Map();for(let e of a||[])if(e?.id)m.set(e.id,e);return m}
function applyEvents(base,events){let d=normalizeDoc(JSON.parse(JSON.stringify(base||blankDoc())));let sorted=[...eventMap(events).values()].sort((a,b)=>String(a.at).localeCompare(String(b.at))||String(a.id).localeCompare(String(b.id)));for(let e of sorted){let p=e.payload||{};if(e.type==='project.upsert'){let i=d.projects.findIndex(x=>x.id===p.id);i>=0?d.projects[i]={...d.projects[i],...p}:d.projects.push({...p})}else if(e.type==='project.delete'){d.projects=d.projects.filter(x=>x.id!==p.id);d.threads=d.threads.filter(x=>x.projectId!==p.id)}else if(e.type==='thread.upsert'){let i=d.threads.findIndex(x=>x.id===p.id);i>=0?d.threads[i]={...d.threads[i],...p}:d.threads.push({...p})}else if(e.type==='thread.delete'){d.threads=d.threads.filter(x=>x.id!==p.id)}else if(e.type==='dashboard.notes'){d.dashboardNotes=String(p.notes||'')}else if(e.type==='message.add'){let t=d.threads.find(x=>x.id===p.threadId);if(t&&!t.messages.some(m=>m.id===p.message?.id))t.messages.push(p.message)}else if(e.type==='execution.add'){let t=d.threads.find(x=>x.id===p.threadId);if(t&&!t.executions.some(r=>r.id===p.execution?.id))t.executions.push(p.execution)}}d.events=sorted;d.updatedAt=sorted.at(-1)?.at||d.updatedAt;return normalizeDoc(d)}
function getPat(){return(localStorage.getItem(LS.pat)||'').trim()}function githubHeaders(json=false){let h={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(getPat())h.Authorization='Bearer '+getPat();if(json)h['Content-Type']='application/json';return h}
function ghBase(owner,repo){return`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`}
function b64utf(s){let b=new TextEncoder().encode(s),x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}function unb64(s){let x=atob(String(s||'').replace(/\s/g,'')),b=Uint8Array.from(x,c=>c.charCodeAt(0));return new TextDecoder().decode(b)}
async function gh(url,opt={}){let r=await fetch(url,{...opt,headers:{...githubHeaders(!!opt.body),...(opt.headers||{})}});if(!r.ok){let txt=await r.text();let e=Error(`GitHub ${r.status}: ${txt.slice(0,280)}`);e.status=r.status;throw e}return r.status===204?null:r.json()}
async function fetchRemoteState(){let s=state.settings,url=`${ghBase(s.stateOwner,s.stateRepo)}/contents/${s.statePath.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(s.stateBranch)}`;try{let r=await gh(url);return{sha:r.sha,doc:normalizeDoc(JSON.parse(unb64(r.content)))}}catch(e){if(e.status===404)return{sha:null,doc:blankDoc()};throw e}}
async function putRemoteState(doc,sha){let s=state.settings,url=`${ghBase(s.stateOwner,s.stateRepo)}/contents/${s.statePath.split('/').map(encodeURIComponent).join('/')}`,body={message:`ChatStream state sync ${new Date().toISOString()}`,content:b64utf(JSON.stringify(doc,null,2)),branch:s.stateBranch,...(sha?{sha}:{})};return gh(url,{method:'PUT',body:JSON.stringify(body)})}
async function syncNow(silent=false){if(state.syncing)return;if(!getPat()){if(!silent)toast('GitHub PAT required for sync','err');return}state.syncing=true;setSyncState('Syncing','busy');try{for(let attempt=0;attempt<4;attempt++){let remote=await fetchRemoteState(),out=loadJSON(LS.outbox,[]),all=[...(remote.doc.events||[]),...out];let merged=applyEvents(remote.doc,all);if(!out.length){state.doc=merged;state.remoteSha=remote.sha;localStorage.setItem(LS.cache,JSON.stringify(state.doc));setSyncState('Current','ok');render();return}try{let res=await putRemoteState(merged,remote.sha);state.doc=merged;state.remoteSha=res?.content?.sha||null;let pushed=new Set(out.map(x=>x.id));localStorage.setItem(LS.outbox,JSON.stringify(loadJSON(LS.outbox,[]).filter(x=>!pushed.has(x.id)));localStorage.setItem(LS.cache,JSON.stringify(state.doc));setSyncState('Synced','ok');render();if(!silent)toast('ChatStream synchronized','ok');return}catch(e){if((e.status===409||e.status===422)&&attempt<3)continue;throw e}}throw Error('GitHub conflict retry limit reached')}catch(e){setSyncState('Sync error','');log('ERROR','sync',e.message);if(!silent)toast(e.message,'err');throw e}finally{state.syncing=false}}
async function receive(){if(!getPat()||state.syncing)return;try{let remote=await fetchRemoteState();let out=loadJSON(LS.outbox,[]);state.doc=applyEvents(remote.doc,[...(remote.doc.events||[]),...out]);state.remoteSha=remote.sha;localStorage.setItem(LS.cache,JSON.stringify(state.doc));setSyncState(out.length?'Pending':'Current',out.length?'busy':'ok');render()}catch(e){log('WARN','receive',e.message)}}
function setSyncState(t,c){$('syncState').textContent=t;$('syncState').className='conn '+(c||'')}
async function listRepoFiles(owner=state.settings.codeOwner,repo=state.settings.codeRepo,branch=state.settings.codeBranch){let key=`${owner}/${repo}@${branch}`;if(state.repoFilesKey===key&&state.repoFiles.length)return state.repoFiles;let r=await gh(`${ghBase(owner,repo)}/git/trees/${encodeURIComponent(branch)}?recursive=1`),files=(r.tree||[]).filter(x=>x.type==='blob').map(x=>x.path).sort();state.repoFiles=files;state.repoFilesKey=key;log('INFO','Repo files loaded',{key,count:files.length});return files}
async function currentFileMeta(t){if(!t.outputFile)return null;let [owner,repo]=t.repo.split('/'),path=t.outputFile.split('/').map(encodeURIComponent).join('/');try{let r=await gh(`${ghBase(owner,repo)}/contents/${path}?ref=${encodeURIComponent(t.branch)}`);return{sha:r.sha,size:r.size,path:r.path}}catch(e){if(e.status===404)return null;throw e}}

function paintStream(t){if(t.id!==state.activeThreadId)return;let box=$('messages');if(!box)return;let old=$('streamMsg');if(!old){old=document.createElement('div');old.id='streamMsg';old.className='msg assistant';old.innerHTML='<div class="msgHead"><span>Agent · working</span></div><span class="streamBody"></span>';box.appendChild(old)}old.querySelector('.streamBody').textContent=state.streamByThread.get(t.id)||'';box.scrollTop=box.scrollHeight}
function finishThread(t,text,status,error){t.status=status;t.updatedAt=now();t.attentionRequired=status==='error';let ex=t.executions.at(-1);if(ex&&['queued','running'].includes(ex.status)){ex.status=status;ex.finishedAt=now();ex.error=error;if(text){let m=text.match(/\b[0-9a-f]{7,40}\b/i);if(m)ex.commit=m[0];let changed=text.match(/(?:changed files?|files changed)[:\s]+([^\n]+)/i);if(changed)ex.changedFiles=changed[1].split(/[,;]/).map(x=>x.trim()).filter(Boolean);ex.testUrl=extractUrl(text,t)}}if(text){addMessage(t,'assistant',text);t.lastTestUrl=ex?.testUrl||extractUrl(text,t)||t.lastTestUrl}else if(error)addMessage(t,'system','Execution error: '+error);if(ex?.testUrl)t.lastTestUrl=ex.testUrl;markLocal('thread.upsert',{...t,messages:undefined,executions:undefined});state.runByThread.delete(t.id);render();scheduleSync();toast(status==='completed'?'Execution completed':status==='cancelled'?'Execution cancelled':error,status==='completed'?'ok':'err')}
function modal(html){$('modalRoot').innerHTML=`<div class="modalBg"><div class="modal">${html}</div></div>`;$('modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}function closeModal(){$('modalRoot').innerHTML=''}
function openSettings(){let s=state.settings;modal(`<div class="modalHead"><b>ChatStream settings</b><span class="grow"></span><span class="version">v${BUILD}</span><button class="btn" data-close>×</button></div><div class="settingsTabs"><button class="btn settingsTab active" data-pane="repo">Repositories</button><button class="btn settingsTab" data-pane="connection">Connection</button><button class="btn settingsTab" data-pane="sync">Sync</button><button class="btn settingsTab" data-pane="diagnostics">Diagnostics</button></div><div class="modalBody"><section class="pane active" data-section="repo"><div class="grid2"><div class="field"><label>Code owner</label><input class="input" id="codeOwner" value="${esc(s.codeOwner)}"></div><div class="field"><label>Code repository</label><input class="input" id="codeRepo" value="${esc(s.codeRepo)}"></div><div class="field"><label>Code branch</label><input class="input" id="codeBranch" value="${esc(s.codeBranch)}"></div><div class="field"><label>Test URL base</label><input class="input" id="testBase" value="${esc(s.testBase)}"></div></div><div class="notice">Threads inherit these defaults when created. Existing threads keep their own repository and branch bindings.</div></section><section class="pane" data-section="connection"><div class="field"><label>OpenClaw Gateway WebSocket URL</label><input class="input" id="gatewayUrl" value="${esc(s.gatewayUrl)}"></div><div class="field"><label>Gateway shared token <span style="font-weight:400;color:var(--muted)">(optional after device pairing)</span></label><input class="input" type="password" id="gatewayToken" value="${esc(token())}"></div><div class="notice">Credentials stay in this browser and are never written to ChatStream GitHub state. OpenClaw remains the execution backend; GitHub remains ChatStream's durable workspace memory.</div><div style="margin-top:9px"><button class="btn" id="reconnectBtn">Save + reconnect</button></div></section><section class="pane" data-section="sync"><div class="field"><label>GitHub Personal Access Token</label><input class="input" type="password" id="githubPat" value="${esc(getPat())}" autocomplete="off"><div class="help">Stored only in this browser. Needs Contents read/write access to the state repository and read access to code repositories used for file search.</div></div><div class="grid2"><div class="field"><label>State owner</label><input class="input" id="stateOwner" value="${esc(s.stateOwner)}"></div><div class="field"><label>State repository</label><input class="input" id="stateRepo" value="${esc(s.stateRepo)}"></div><div class="field"><label>State branch</label><input class="input" id="stateBranch" value="${esc(s.stateBranch)}"></div><div class="field"><label>State path</label><input class="input" id="statePath" value="${esc(s.statePath)}"></div></div><label style="display:flex;gap:7px;align-items:center"><input type="checkbox" id="autoSync" ${s.autoSync?'checked':''}> Automatically synchronize GitHub state</label><div class="notice" style="margin-top:10px">Repository visibility controls ChatStream metadata visibility. The default <b>acmeproducts/stuff</b> repository is public; use a private state repository if project names, thread conversations, or notes should remain private.</div></section><section class="pane" data-section="diagnostics"><div class="diag" id="diagBox">${esc(state.diag.join('\n')||'No diagnostics yet.')}</div><div style="display:flex;gap:7px;margin-top:8px"><button class="btn" id="copyDiag">Copy diagnostics</button><button class="btn" id="clearDiag">Clear</button></div></section></div><div class="modalFoot"><span class="help" style="margin-right:auto">Secrets are local-only.</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="saveSettings">Save</button></div>`);document.querySelectorAll('.settingsTab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.settingsTab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('active',x.dataset.section===b.dataset.pane))});$('copyDiag').onclick=()=>navigator.clipboard?.writeText(state.diag.join('\n'));$('clearDiag').onclick=()=>{state.diag=[];$('diagBox').textContent='No diagnostics yet.'};let commit=()=>{state.settings={...state.settings,codeOwner:$('codeOwner').value.trim(),codeRepo:$('codeRepo').value.trim(),codeBranch:$('codeBranch').value.trim(),testBase:$('testBase').value.trim(),gatewayUrl:$('gatewayUrl').value.trim(),stateOwner:$('stateOwner').value.trim(),stateRepo:$('stateRepo').value.trim(),stateBranch:$('stateBranch').value.trim(),statePath:$('statePath').value.trim(),autoSync:$('autoSync').checked};if(!state.settings.codeOwner||!state.settings.codeRepo||!state.settings.codeBranch||!state.settings.stateOwner||!state.settings.stateRepo||!state.settings.stateBranch||!state.settings.statePath)throw Error('Repository, branch, and state path fields are required');localStorage.setItem(LS.settings,JSON.stringify(state.settings));localStorage.setItem(LS.pat,$('githubPat').value.trim());localStorage.setItem(LS.gatewayToken,$('gatewayToken').value.trim());state.repoFiles=[];state.repoFilesKey=''};$('saveSettings').onclick=()=>{try{commit();closeModal();restartPolling();toast('Settings saved','ok');receive();connect()}catch(e){toast(e.message,'err')}};$('reconnectBtn').onclick=()=>{try{commit();if(state.ws)try{state.ws.close(1000,'reconfigure')}catch{}state.connected=false;state.connecting=false;setTimeout(connect,150);toast('Reconnecting…')}catch(e){toast(e.message,'err')}}}
function restartPolling(){clearInterval(state.poll);if(state.settings.autoSync)state.poll=setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine!==false)receive()},Math.max(15000,Number(state.settings.syncInterval)||60000))}
function closeSidebarMobile(){if(innerWidth<=800)$('sidebar').classList.add('closed')}
$('menuBtn').onclick=()=>$('sidebar').classList.toggle('closed');$('settingsBtn').onclick=openSettings;$('newProjectBtn').onclick=openProjectModal;$('syncBtn').onclick=()=>syncNow(false);$('refreshBtn').onclick=()=>{receive();if(!state.connected)connect();render()};window.addEventListener('focus',receive);window.addEventListener('online',()=>{receive();connect()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')receive()});
if(innerWidth<=800)$('sidebar').classList.add('closed');render();restartPolling();receive();connect();
})();
</script>
</body>
