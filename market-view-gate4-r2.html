<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Navigator Gate 4 R2</title><style>:root{color-scheme:dark;--b:#070b11;--p:#101721;--l:#303d4e;--t:#f4f7fb;--m:#8996a8;--r:#ff5964;--g:#4f9dff}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}button,input,select{font:inherit;color:inherit;background:var(--p);border:1px solid var(--l);border-radius:8px;padding:8px}.app{display:flex;min-height:100dvh}.rail{width:185px;background:#0b111a;border-right:1px solid var(--l);display:flex;flex-direction:column;padding:12px 8px}.rail.closed{width:0;padding:0;overflow:hidden}.rail nav{display:grid;gap:5px}.cfg{margin-top:auto}.work{flex:1;min-width:0;padding-bottom:68px}.rib{position:sticky;top:0;z-index:10;background:#070b11f5;border-bottom:1px solid var(--l)}.r1,.r2,.r3{display:flex;align-items:center;padding:5px 10px}.r1{height:45px;gap:8px}.r1 h1{font-size:17px;margin:0}.r2{height:32px;overflow:hidden;white-space:nowrap}.crumb{border:0;background:none;padding:3px;color:var(--m)}.r3{height:48px;justify-content:center;gap:3px;position:relative}.r3 button{font-size:13px;min-height:38px;padding:7px 9px;border:0;background:none}.r3 .on{border-bottom:2px solid var(--t)}.more{position:absolute;right:8px}.menuBox{display:none;position:absolute;right:8px;top:42px;background:var(--p);border:1px solid var(--l);padding:5px;border-radius:9px}.menuBox.on{display:grid}.body{max-width:1120px;margin:auto;padding:10px}.legend{display:flex;gap:6px;justify-content:center;overflow:auto;white-space:nowrap;padding:5px}.chip{padding:6px 9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.chart{height:min(48vh,440px);min-height:285px;position:relative}.chart canvas{width:100%;height:100%;touch-action:none}.pop{position:absolute;z-index:4;background:#09111ddd;border:1px solid #53657b;padding:6px 8px;border-radius:7px;font-size:11px;pointer-events:none}.ai{border-top:1px solid var(--l);padding:13px 4px}.aihead{display:flex}.aihead button{margin-left:auto}.info{color:var(--m);font-size:12px}.composer{position:fixed;z-index:12;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px;background:#0b111af5;border-top:1px solid var(--l)}.composer input{flex:1}.modalWrap{position:fixed;z-index:30;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(680px,100%);max-height:86vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:16px 16px 0 0;padding:12px}.mh{position:sticky;top:-12px;background:var(--p);display:flex;gap:7px;align-items:center;padding:12px 0;z-index:2}.mh h2{margin:0;font-size:17px;flex:1}.tabs{display:flex;gap:4px;overflow:auto;margin-bottom:8px}.tabs .on{border-color:#9cb2cf}.pick{display:grid;gap:5px}.pick button{text-align:left}.about{position:fixed;z-index:25;width:min(330px,calc(100vw - 20px));background:var(--p);border:1px solid #53657b;border-radius:10px;padding:11px;box-shadow:0 12px 30px #000a}.about h3{margin:0}.about a{color:#a9c8ff}.placeholder{padding:40px 10px}.librow,.cfgrow{padding:9px;border-bottom:1px solid var(--l)}@media(max-width:720px){.rail{position:fixed;z-index:20;height:100%;box-shadow:5px 0 20px #000}.rail.closed{transform:translateX(-100%);width:185px}.r3{justify-content:flex-start;overflow-x:auto;padding-right:50px}.r3 button{font-size:14px;min-width:47px}.body{padding:7px}}</style></head><body><div class="app"><aside id="rail" class="rail closed"><b style="padding:8px">MARKET VIEW</b><nav><button data-nav="now">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav><button class="cfg" data-nav="config">CONFIG</button></aside><main class="work"><header class="rib"><div class="r1"><button id="hamb">☰</button><h1 id="title">Market</h1></div><div class="r2" id="crumbs"></div><div class="r3" id="hz"></div></header><div class="body" id="body"></div></main></div><div class="composer"><button id="engine">AI</button><input id="ask" placeholder="Ask about this evidence…"><button id="send">↑</button></div><div id="overlay"></div><script>const $=s=>document.querySelector(s),H=['1D','5D','MTD','YTD','1YR','3YR','5YR'],COL=['#a98cff','#59c7d2','#dc995d','#bd91d8','#d8a4ff','#52c7d7','#e5a25f','#c893df','#77a7ff'];let CAT={},DEF={},CACHE={},FAIL={},S={nav:'now',screen:'market',index:null,analysis:[],h:'5D',active:null,info:false,ai:null};const LS='mn_g4r2_cfg',LL='mn_g4r2_library';let CFG=JSON.parse(localStorage.getItem(LS)||'{}');function m(id){if(DEF[id])return{n:DEF[id].name,a:id==='risk'?'RSK':id==='growth'?'GRW':'MAC',u:'Indexed 100',c:id==='risk'?'#ff5964':id==='growth'?'#4f9dff':'#f4f7fb'};let q=CAT[id]||{};return{n:q.name||id,a:abbr(q.short_name||id),u:q.native_unit||'',c:COL[Math.max(0,Object.keys(CAT).indexOf(id))%COL.length],d:q.description||'',cad:q.native_cadence||'',role:q.role||''}}function abbr(x){let s=String(x).replace(/[^A-Za-z0-9]/g,'');if(/^\d/.test(s))return s.slice(0,3).toUpperCase();return s.slice(0,3).toUpperCase()}function comps(k){return(DEF[k]?.components||[]).map(x=>x.id)}function owner(id){return Object.keys(DEF).find(k=>comps(k).includes(id))}function ids(){if(S.screen==='market')return['risk','growth','macro'];if(S.screen==='index')return[S.index,...comps(S.index)];return S.analysis}function title(){if(S.nav!=='now')return S.nav.toUpperCase();if(S.screen==='market')return'Market · '+sent('market');if(S.screen==='index')return DEF[S.index].name+' · '+sent(S.index);return m(S.analysis[0]).n+' · '+sent(S.analysis[0])}function sent(){return S.h+' view'}function crumbs(){if(S.screen==='market')return'<button class="crumb" data-c="market">Market</button>';if(S.screen==='index')return'<button class="crumb" data-c="market">Market</button> / <button class="crumb">'+DEF[S.index].name+'</button>';let root=m(S.analysis[0]).n+(S.analysis.length>1?' + Custom':'');return'<button class="crumb" data-c="market">Market</button> / <button class="crumb" data-c="index">'+DEF[S.index]?.name+'</button> / <button class="crumb">'+root+'</button>'}function path(id){let q=CAT[id];return'data/market-backend/sources/'+(q?.domain==='market'?'market':'macro')+'/'+id+'.json'}async function load(id){if(CACHE[id])return CACHE[id];try{let r=await fetch(path(id));if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),a=(j.records||j.daily||j.data||[]).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.v)).sort((a,b)=>a.t-b.t);if(!a.length)throw Error('no records');return CACHE[id]=a}catch(e){FAIL[id]=e.message;return CACHE[id]=[]}}async function ensure(){let q=S.screen==='market'?[...new Set(Object.keys(DEF).flatMap(comps))]:ids().filter(x=>CAT[x]);await Promise.all(q.map(load))}function norm(a,dir=1){if(!a.length||a[0].v<=0)return[];let b=a[0].v;return a.map(x=>({t:x.t,v:100+dir*((x.v/b)-1)*100,raw:x.v}))}function windowed(id,st,en){return(CACHE[id]||[]).filter(x=>x.t>=st&&x.t<=en)}function range(){let en=Math.max(Date.now(),...ids().flatMap(id=>(CACHE[id]||[]).map(x=>x.t)));let d=new Date(en),st;if(S.h==='1D')st=en-864e5;else if(S.h==='5D')st=en-7*864e5;else if(S.h==='MTD')st=+new Date(d.getFullYear(),d.getMonth(),1);else if(S.h==='YTD')st=+new Date(d.getFullYear(),0,1);else{let y=S.h==='1YR'?1:S.h==='3YR'?3:5;d.setFullYear(d.getFullYear()-y);st=+d}return[st,en]}function derived(k,st,en){let ss=(DEF[k].components||[]).map(c=>({c,a:norm(windowed(c.id,st,en),c.direction)})).filter(x=>x.a.length),ts=[...new Set(ss.flatMap(x=>x.a.map(y=>y.t)))].sort((a,b)=>a-b);return ts.map(t=>{let v=ss.map(s=>[...s.a].reverse().find(x=>x.t<=t)).filter(Boolean).map(x=>x.v);return{t,v:v.reduce((a,b)=>a+b,0)/v.length}}).filter(x=>Number.isFinite(x.v))}function plotted(){let[st,en]=range();if(S.screen==='market')return['risk','growth','macro'].map(id=>({id,a:derived(id,st,en),mm:m(id)}));if(S.screen==='index'){let z=[{id:S.index,a:derived(S.index,st,en),mm:m(S.index)}];for(let c of DEF[S.index].components)z.push({id:c.id,a:norm(windowed(c.id,st,en),c.direction),mm:m(c.id)});return z}return S.analysis.map(id=>({id,a:windowed(id,st,en),mm:m(id)}))}function legend(){return'<div class="legend">'+ids().map(id=>'<button class="chip" data-s="'+id+'"><i class="dot" style="background:'+m(id).c+'"></i>'+m(id).a+(S.screen==='analysis'&&S.analysis.length>1?' <span data-x="'+id+'">×</span>':'')+'</button>').join('')+(S.screen==='analysis'?'<button id="add">＋</button>':'')+'</div>'}function chart(){return legend()+'<div class="chart"><canvas id="cv"></canvas><div id="pop" class="pop" hidden></div></div>'}function ai(){return'<section class="ai"><div class="aihead"><b>AI POV</b><button id="info">ⓘ</button></div><div id="pov">'+(S.ai||'Select AI POV or ask a question below. The request will be grounded in the active series, horizon and canonical observations.')+'</div>'+(S.info?'<div class="info">Active: '+ids().map(x=>m(x).n).join(' · ')+'<br>Horizon: '+S.h+'<br>Failures: '+(Object.keys(FAIL).length?JSON.stringify(FAIL):'none')+'</div>':'')+'</section>'}function now(){return chart()+ai()}function library(){let a=JSON.parse(localStorage.getItem(LL)||'[]');return'<h2>Library</h2>'+(a.length?a.map((x,i)=>'<div class="librow"><b>'+x.label+'</b><br><small>'+x.h+' · '+new Date(x.at).toLocaleString()+'</small> <button data-open="'+i+'">Open</button></div>').join(''):'<div class="placeholder">No saved analyses.</div>')}function health(){return'<h2>Health</h2><div class="info">Canonical catalog: '+Object.keys(CAT).length+' enabled series<br>Loaded: '+Object.keys(CACHE).length+'<br>Source failures: '+(Object.keys(FAIL).length?Object.entries(FAIL).map(x=>x.join(': ')).join('<br>'):'none')+'</div>'}function config(){return'<h2>CONFIG</h2>'+['venice','openrouter','anthropic'].map(p=>'<div class="cfgrow"><b>'+p+'</b><input type="password" id="k_'+p+'" placeholder="API key" value="'+(CFG[p+'Key']||'')+'"><input id="m_'+p+'" placeholder="model" value="'+(CFG[p+'Model']||'')+'"><button data-test="'+p+'">Validate & save</button> <span id="st_'+p+'"></span></div>').join('')}function render(){ $('#title').textContent=title();$('#crumbs').innerHTML=S.nav==='now'?crumbs():'';$('#hz').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(S.h===h?'on':'')+'">'+h+'</button>').join('')+'<div class="more"><button id="more">…</button><div id="mb" class="menuBox"><button id="save">Add to Library</button><button id="dl">Download</button><button onclick="print()">Print</button></div></div>';$('#body').innerHTML=S.nav==='now'?now():S.nav==='library'?library():S.nav==='health'?health():S.nav==='config'?config():'<div class="placeholder">Explore uses the same Analysis workspace. Open an index/component from NOW.</div>';wire();if(S.nav==='now')requestAnimationFrame(draw)}function draw(){let c=$('#cv');if(!c)return,0;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,L=48,R=16,T=12,B=28,ss=plotted().filter(s=>s.a.length);if(!ss.length)return;let minT=Math.min(...ss.flatMap(s=>s.a.map(p=>p.t))),maxT=Math.max(...ss.flatMap(s=>s.a.map(p=>p.t)));if(minT===maxT){minT-=432e5;maxT+=432e5}let vals=ss.flatMap(s=>s.a.map(p=>p.v)),mn=Math.min(...vals),mx=Math.max(...vals),pad=(mx-mn||1)*.08;mn-=pad;mx+=pad;x.font='10px system-ui';x.strokeStyle='#283342';x.fillStyle='#8996a8';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText((mx-(mx-mn)*i/4).toFixed(1),3,y+3)}for(let s of ss){x.strokeStyle=s.mm.c;x.lineWidth=s.id===S.index?3:2;x.beginPath();s.a.forEach((p,i)=>{let px=L+(p.t-minT)/(maxT-minT)*(W-L-R),py=T+(mx-p.v)/(mx-mn)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}c.onpointerdown=e=>inspect(e,ss,{L,R,T,B,W,HH,minT,maxT,mn,mx})}function inspect(e,ss,g){let rect=e.currentTarget.getBoundingClientRect(),cx=e.clientX-rect.left,cy=e.clientY-rect.top,best=null;for(let s of ss)for(let p of s.a){let px=g.L+(p.t-g.minT)/(g.maxT-g.minT)*(g.W-g.L-g.R),py=g.T+(g.mx-p.v)/(g.mx-g.mn)*(g.HH-g.T-g.B),dist=Math.hypot(px-cx,py-cy);if(!best||dist<best.dist)best={s,p,px,py,dist}}if(!best)return;S.active=best.s.id;draw();let c=$('#cv'),x=c.getContext('2d'),d=devicePixelRatio||1;x.save();x.scale(d,d);x.strokeStyle=best.s.mm.c;x.beginPath();x.moveTo(best.px,g.T);x.lineTo(best.px,g.HH-g.B);x.stroke();x.fillStyle=best.s.mm.c;x.beginPath();x.arc(best.px,best.py,4,0,Math.PI*2);x.fill();x.restore();let p=$('#pop');p.hidden=false;p.textContent=best.s.mm.a+' · '+new Date(best.p.t).toLocaleDateString()+' · '+best.p.v.toLocaleString()+' '+best.s.mm.u;p.style.left=Math.min(g.W-190,best.px+7)+'px';p.style.top=Math.max(4,best.py-35)+'px'}function about(id,el){let q=m(id),r=el.getBoundingClientRect();$('#overlay').innerHTML='<div class="about" style="left:'+Math.max(10,Math.min(innerWidth-340,r.left))+'px;top:'+Math.min(innerHeight-260,r.bottom+5)+'px"><button id="ac" style="float:right">×</button><h3>'+q.n+'</h3><p>'+q.d+'</p><p><b>Used here:</b> '+(q.role||'canonical evidence')+'</p><a id="mi">More info →</a></div>';$('#ac').onclick=()=>$('#overlay').innerHTML='';$('#mi').onclick=()=>window.open('market-view-gate4-r2.html?series='+id,'_blank')}function groups(){let used=new Set(Object.values(DEF).flatMap(z=>z.components.map(c=>c.id))),other=Object.keys(CAT).filter(id=>!used.has(id));return{Market:['risk','growth','macro'],Risk:['risk',...comps('risk')],Growth:['growth',...comps('growth')],Macro:['macro',...comps('macro')],Other:other}}function picker(){let G=groups(),tab='Market';function paint(){let a=G[tab].filter(id=>!S.analysis.includes(id));$('#plist').innerHTML=a.map(id=>'<button data-p="'+id+'">'+m(id).a+' · '+m(id).n+'</button>').join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=async()=>{let id=b.dataset.p;if(DEF[id]){S.screen='index';S.index=id;S.analysis=[]}else{S.screen='analysis';S.index=owner(id)||S.index||'growth';S.analysis.push(id);S.analysis=[...new Set(S.analysis)]}$('#overlay').innerHTML='';await ensure();render()})}$('#overlay').innerHTML='<div class="modalWrap"><div class="modal"><div class="mh"><h2>Add Series</h2><button id="close">Close</button></div><div class="tabs">'+Object.keys(G).map(k=>'<button data-tab="'+k+'">'+k+'</button>').join('')+'</div><div id="plist" class="pick"></div></div></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));paint()});document.querySelector('[data-tab="Market"]').classList.add('on');$('#close').onclick=()=>$('#overlay').innerHTML='';paint()}async function callAI(prompt){let p=CFG.provider||'venice',key=CFG[p+'Key'],model=CFG[p+'Model'];if(!key||!model)throw Error('Configure and validate '+p+' in CONFIG');let context=JSON.stringify({screen:S.screen,index:S.index,series:ids(),horizon:S.h,latest:ids().map(id=>[id,(CACHE[id]||[]).slice(-6)])});if(p==='anthropic'){let r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:500,messages:[{role:'user',content:'Market evidence: '+context+'\nQuestion: '+prompt}]})});let j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j.content?.[0]?.text||''}let url=p==='openrouter'?'https://openrouter.ai/api/v1/chat/completions':'https://api.venice.ai/api/v1/chat/completions',r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,messages:[{role:'user',content:'Market evidence: '+context+'\nQuestion: '+prompt}],max_tokens:500})}),j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j.choices?.[0]?.message?.content||''}async function test(p){let key=$('#k_'+p).value.trim(),model=$('#m_'+p).value.trim();CFG[p+'Key']=key;CFG[p+'Model']=model;CFG.provider=p;localStorage.setItem(LS,JSON.stringify(CFG));$('#st_'+p).textContent='testing…';try{await callAI('Reply only OK');$('#st_'+p).textContent='verified';localStorage.setItem(LS,JSON.stringify(CFG))}catch(e){$('#st_'+p).textContent=e.message}}function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;render()});document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{if(b.dataset.c==='market'){S.screen='market';S.index=null;S.analysis=[]}else{S.screen='index';S.analysis=[]}await ensure();render()});document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async e=>{if(e.target.dataset.x){S.analysis=S.analysis.filter(x=>x!==e.target.dataset.x);render();return}let id=b.dataset.s;if(S.screen==='market'){S.index=id;S.screen='index';await ensure();render()}else about(id,b)});$('#add')?.addEventListener('click',picker);$('#info')?.addEventListener('click',()=>{S.info=!S.info;render()});$('#more').onclick=()=>$('#mb').classList.toggle('on');$('#save').onclick=()=>{let a=JSON.parse(localStorage.getItem(LL)||'[]');a.push({label:S.screen==='analysis'?m(S.analysis[0]).n+(S.analysis.length>1?' + Custom':''):S.screen==='index'?DEF[S.index].name:'Market',screen:S.screen,index:S.index,analysis:S.analysis,h:S.h,at:new Date().toISOString()});localStorage.setItem(LL,JSON.stringify(a));$('#mb').classList.remove('on')};$('#dl').onclick=()=>{let rows=['series,date,value'];ids().forEach(id=>(CACHE[id]||[]).forEach(r=>rows.push(id+','+new Date(r.t).toISOString()+','+r.v)));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='market-navigator.csv';a.click()};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{let x=JSON.parse(localStorage.getItem(LL)||'[]')[+b.dataset.open];Object.assign(S,x,{nav:'now'});await ensure();render()});document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>test(b.dataset.test))}$('#hamb').onclick=()=>$('#rail').classList.toggle('closed');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});$('#engine').onclick=()=>{S.nav='config';render()};$('#send').onclick=async()=>{let q=$('#ask').value.trim();if(!q)return;$('#send').disabled=true;try{S.ai=await callAI(q);$('#ask').value='';render()}catch(e){S.ai='AI error: '+e.message;render()}finally{$('#send').disabled=false}};window.onresize=()=>S.nav==='now'&&draw();(async()=>{let[c,d]=await Promise.all([fetch('data/market-backend/data-catalog.json').then(r=>r.json()),fetch('data/market-backend/derived-index-definition.json').then(r=>r.json())]);CAT=Object.fromEntries(c.series.filter(x=>x.enabled!==false).map(x=>[x.id,x]));DEF=d.indices;let sid=new URLSearchParams(location.search).get('series');if(sid&&CAT[sid]){S.screen='analysis';S.index=owner(sid)||'growth';S.analysis=[sid]}await ensure();render()})();</script></body></html>
