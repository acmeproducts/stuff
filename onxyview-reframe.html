<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OnxyView Reframe</title><style>:root{--bg:#071019;--panel:#0d1824;--line:#263746;--text:#f5f7f8;--muted:#9caab6;--pos:#1f8f68;--neu:#a77d25;--neg:#a94355;--accent:#79d2ff}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit;color:inherit}.app{height:100%;display:grid;grid-template-rows:46px 38px 1fr}.top{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}.brand{font-weight:900;font-size:18px}.brand small{font-size:9px;color:var(--muted)}.search{flex:1;max-width:760px;margin:auto;height:32px;border:1px solid var(--line);border-radius:16px;background:#0b1722;padding:0 14px;outline:0}.status{font-size:10px;color:var(--muted)}.gear{height:32px;width:32px;border:1px solid var(--line);border-radius:9px;background:#0d1a27}.dims{display:flex;align-items:center;gap:7px;padding:4px 10px;border-bottom:1px solid var(--line);overflow-x:auto}.dim{height:28px;border:1px solid var(--line);border-radius:14px;background:#102031;padding:0 11px;font-size:10px;font-weight:750;white-space:nowrap}.stage{position:relative;overflow:hidden}.canvas{position:absolute;inset:0;padding:10px;display:grid;gap:8px;background:radial-gradient(circle at 50% 40%,#102031 0,#071019 65%)}.cluster{position:relative;overflow:hidden;border:1px solid #ffffff18;border-radius:14px;background:#0b1722;min-height:0}.cluster h2{position:absolute;z-index:3;top:0;left:0;right:0;margin:0;padding:8px 10px 6px;font-size:12px;background:linear-gradient(#0b1722ee,#0b172200);pointer-events:none}.cluster h2 span{font-size:9px;color:var(--muted);font-weight:500;margin-left:5px}.stories{position:absolute;inset:30px 6px 6px;display:grid;gap:5px}.story{position:relative;min-width:0;min-height:0;border:1px solid #ffffff18;border-radius:10px;padding:8px;text-align:left;background:#152432;overflow:hidden;cursor:pointer}.story:hover{filter:brightness(1.08)}.story strong{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;font-size:clamp(10px,1.05vw,16px);line-height:1.12}.story .meta{position:absolute;left:8px;bottom:6px;font-size:8px;color:#d5e0e8aa}.story .sources{position:absolute;right:6px;top:6px;font-size:8px;color:#fff9;border-radius:8px;background:#07101999;padding:2px 5px}.story.pos{border-top:3px solid var(--pos)}.story.neu{border-top:3px solid var(--neu)}.story.neg{border-top:3px solid var(--neg)}.more{display:grid;place-items:center;color:var(--muted);background:#102031}.reader{position:absolute;z-index:20;right:10px;top:10px;bottom:10px;width:min(410px,38vw);border:1px solid #36516a;border-radius:14px;background:#0b1724f7;backdrop-filter:blur(16px);padding:14px;transform:translateX(calc(100% + 20px));transition:transform .16s;overflow:auto}.reader.open{transform:none}.reader h1{font-size:20px;line-height:1.12;margin:8px 0}.reader p{font-size:12px;line-height:1.45;color:#cad5dd}.rbar{display:flex;gap:5px}.rbar button{border:1px solid var(--line);border-radius:8px;background:#102031;padding:5px 8px}.source{display:block;padding:8px 0;border-top:1px solid #ffffff14;color:#a9dcff;text-decoration:none;font-size:11px}.tray{position:absolute;z-index:30;left:50%;top:0;transform:translate(-50%,-101%);width:min(720px,96vw);background:#0a1622f8;border:1px solid #36516a;border-radius:0 0 14px 14px;padding:12px;transition:.16s}.tray.open{transform:translate(-50%,0)}.traygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tray label{font-size:9px;color:var(--muted)}.tray select{width:100%;height:32px;margin-top:4px;background:#102031;border:1px solid var(--line);border-radius:8px}.loading{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg)}@media(max-width:700px){.app{grid-template-rows:40px 34px 1fr}.brand{font-size:14px}.brand small,.status{display:none}.top{padding:4px 6px;gap:5px}.search{height:29px;font-size:11px}.dims{padding:3px 6px}.dim{height:25px;font-size:9px}.canvas{padding:5px;gap:5px}.cluster{border-radius:10px}.cluster h2{font-size:10px;padding:6px 7px}.stories{inset:25px 4px 4px;gap:3px}.story{padding:6px;border-radius:7px}.story strong{font-size:10px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(42vh,330px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.traygrid{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><div class="brand">OnxyView <small>REFRAME 0.1</small></div><input id="q" class="search" placeholder="Search events, #tags, sources…"><div id="status" class="status">Loading…</div><button id="gear" class="gear">⚙</button></header><nav class="dims"><button id="trayBtn" class="dim">⌄</button><button class="dim" id="gChip">Group · subject</button><button class="dim" id="cChip">Color · sentiment</button><button class="dim" id="sChip">Size · importance</button><button class="dim" id="lChip">Lens · all</button></nav><main class="stage"><div id="canvas" class="canvas"></div><aside id="reader" class="reader"></aside><section id="tray" class="tray"><div class="traygrid"><label>GROUP<select id="group"><option value="subject">Subject</option><option value="region">Region</option><option value="sentiment">Sentiment</option><option value="corroboration">Corroboration</option></select></label><label>COLOR<select id="color"><option value="sentiment">Sentiment</option><option value="subject">Subject</option><option value="region">Region</option></select></label><label>SIZE<select id="size"><option value="importance">Importance</option><option value="sources">Independent sources</option><option value="recency">Recency</option></select></label><label>LENS<select id="lens"><option value="all">All</option><option value="Core Global">Core Global</option><option value="Markets">Markets</option><option value="Technology">Technology</option><option value="US Spectrum">US Spectrum</option></select></label></div></section><div id="loading" class="loading">Building editorial landscape…</div></main></div><script>const $=id=>document.getElementById(id);let DATA=[],S={group:'subject',color:'sentiment',size:'importance',lens:'all',q:''};const palette=['#1d6980','#63529b','#347568','#805e35','#79516a','#536b36','#496c82'];function val(e,k){if(k==='subject')return e.subject||e.category||'World';if(k==='region')return e.region||'Global';if(k==='sentiment'){let p=+(e.sentiment?.positive||e.positive||0),n=+(e.sentiment?.negative||e.negative||0);return p>n?'Positive':n>p?'Negative':'Neutral'}if(k==='corroboration'){let n=+(e.independentSourceCount||e.independent_sources||1);return n>=4?'4+ sources':n>=2?'2–3 sources':'Single source'}return 'Other'}function weight(e){if(S.size==='sources')return Math.max(1,+(e.independentSourceCount||e.independent_sources||1));if(S.size==='recency'){let t=Date.parse(e.lastSeen||e.published||0);return Math.max(1,100-(Date.now()-t)/36e5)}return Math.max(1,+(e.importance||20))}function sentClass(e){let v=val(e,'sentiment');return v==='Positive'?'pos':v==='Negative'?'neg':'neu'}function filtered(){let a=DATA;if(S.lens!=='all')a=a.filter(e=>(e.sourcePacks||e.source_packs||[]).includes(S.lens));let q=S.q.trim().toLowerCase();if(q)a=a.filter(e=>JSON.stringify(e).toLowerCase().includes(q));return a}function layoutGroups(groups,w,h){let arr=groups.map(g=>({...g,total:g.events.reduce((a,e)=>a+weight(e),0)})).sort((a,b)=>b.total-a.total);let total=arr.reduce((a,g)=>a+g.total,0)||1,cols=w>h*1.15?3:w>700?2:1;let colTotals=Array(cols).fill(0),placed=arr.map(g=>{let c=colTotals.indexOf(Math.min(...colTotals));let frac=g.total/total;let hh=Math.max(90,h*frac*cols);colTotals[c]+=hh;return {...g,c,hh}});let ys=Array(cols).fill(0);return placed.map(g=>{let cw=w/cols,x=g.c*cw,y=ys[g.c];ys[g.c]+=g.hh;return {...g,x,y,w:cw,h:g.hh}})}function render(){let a=filtered(),m=new Map;for(let e of a){let k=val(e,S.group);if(!m.has(k))m.set(k,[]);m.get(k).push(e)}let groups=[...m].map(([name,events])=>({name,events:events.sort((x,y)=>weight(y)-weight(x))}));let C=$('canvas'),w=C.clientWidth-20,h=C.clientHeight-20;C.innerHTML='';let boxes=layoutGroups(groups,w,h);C.style.display='block';for(let [gi,g] of boxes.entries()){let d=document.createElement('section');d.className='cluster';Object.assign(d.style,{position:'absolute',left:(g.x+10)+'px',top:(g.y+10)+'px',width:Math.max(0,g.w-8)+'px',height:Math.max(80,g.h-8)+'px'});d.innerHTML=`<h2>${esc(g.name)} <span>${g.events.length} events</span></h2><div class="stories"></div>`;C.appendChild(d);let st=d.querySelector('.stories'),area=Math.max(1,(g.w-20)*(g.h-45)),capacity=Math.max(2,Math.min(g.events.length,Math.floor(area/13000))),shown=g.events.slice(0,capacity),rest=g.events.length-shown.length;let cols=Math.max(1,Math.round(Math.sqrt(capacity*(g.w/Math.max(100,g.h))))),rows=Math.ceil((capacity+(rest?1:0))/cols);st.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;st.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;for(let e of shown){let b=document.createElement('button');b.className='story '+sentClass(e);b.innerHTML=`<strong>${esc(e.headline||e.title||'Untitled event')}</strong><span class="sources">${+(e.independentSourceCount||e.independent_sources||1)} src</span><span class="meta">${esc(e.region||'Global')} · ${esc(e.subject||e.category||'World')}</span>`;b.onclick=()=>openReader(e);st.appendChild(b)}if(rest){let b=document.createElement('button');b.className='story more';b.innerHTML=`<strong>Explore ${rest} more</strong>`;b.onclick=()=>{S.q='';$('q').value='';let keep=g.name;S.group=S.group;render();[...document.querySelectorAll('.cluster')].find(x=>x.querySelector('h2').textContent.startsWith(keep))?.scrollIntoView()};st.appendChild(b)}}$('status').textContent=`${a.length} events · ${groups.length} neighborhoods`;chips()}function openReader(e){let r=$('reader'),arts=e.articles||e.sources||[];r.innerHTML=`<div class="rbar"><button id="closeR">×</button><button id="tts">▶︎ TTS</button><button id="fav">☆</button></div><h1>${esc(e.headline||e.title||'Untitled event')}</h1><p>${esc(e.summary||e.description||'')}</p><p>${+(e.independentSourceCount||e.independent_sources||1)} independent sources · importance ${Math.round(+(e.importance||0))}</p>${arts.slice(0,12).map(a=>a.url?`<a class="source" target="_blank" rel="noopener" href="${attr(a.url)}">${esc(a.source||a.publisher||'Source')} — ${esc(a.title||a.headline||'Open report')}</a>`:'').join('')}`;r.classList.add('open');$('closeR').onclick=()=>r.classList.remove('open');$('tts').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance((e.headline||'')+'. '+(e.summary||e.description||'')))}}function chips(){$('gChip').textContent='Group · '+S.group;$('cChip').textContent='Color · '+S.color;$('sChip').textContent='Size · '+S.size;$('lChip').textContent='Lens · '+S.lens}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(s){return esc(s)}async function boot(){try{let j=await fetch('./onxyview-event-cache.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});DATA=j.events||j.items||[];$('loading').remove();render()}catch(e){$('loading').textContent='Event cache unavailable · '+e.message}}$('trayBtn').onclick=()=>$('tray').classList.toggle('open');$('gear').onclick=()=>$('tray').classList.toggle('open');for(let k of ['group','color','size','lens'])$(k).onchange=e=>{S[k]=e.target.value;render()};$('q').oninput=e=>{S.q=e.target.value;clearTimeout(window.qt);window.qt=setTimeout(render,120)};addEventListener('resize',()=>{clearTimeout(window.rt);window.rt=setTimeout(render,120)});boot();</script></body></html>
