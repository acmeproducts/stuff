name: Verify Market Navigator Turn 25 Ship

# Supersedes the earlier temporary build automation, which rewrote the builder's own source at run time
# to compensate for anchors taken from non-baseline markup. The builder now carries the correct
# baseline anchors, so this job only proves reproducibility: rebuild from a clean checkout and require
# the committed candidate to be byte-identical. It never edits the builder and never pushes.

on:
  push:
    branches: [main]
    paths:
      - market-navigator-build-turn25-ship.py
      - market-navigator-turn25-ship-parts/**
      - market-navigator-turn25-ship.html
      - .github/workflows/build-market-navigator-turn25-ship.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce the candidate from the owner-authoritative baseline
        run: |
          set -euo pipefail
          cp market-navigator-turn25-ship.html /tmp/committed.html
          python3 market-navigator-build-turn25-ship.py
          if ! cmp -s /tmp/committed.html market-navigator-turn25-ship.html; then
            echo "::error::committed candidate is not reproducible from the pinned baseline"
            diff <(head -c 4000 /tmp/committed.html) <(head -c 4000 market-navigator-turn25-ship.html) || true
            exit 1
          fi
          echo "candidate is byte-identical to a clean rebuild"
      - name: Provenance and static ship gates
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess
          BASE='ddf275a8da943cfb8b0e9c5e610649b36424b886'
          BLOB='89095a52e02b06db2b26192099846a5f0015a42d'
          SIZE=127374
          SHA='84eb47caade89ca89ccb92281d888f9c6eb6fd3b1415dc18d170dddb46a155ba'
          blob=subprocess.check_output(['git','rev-parse',f'{BASE}:market-navigator-turn25-pre-ship.html'],text=True).strip()
          raw=subprocess.check_output(['git','cat-file','blob',BLOB])
          assert blob==BLOB, blob
          assert len(raw)==SIZE, len(raw)
          assert hashlib.sha256(raw).hexdigest()==SHA
          s=pathlib.Path('market-navigator-turn25-ship.html').read_text(encoding='utf-8')
          assert s.count('id="indexInfoBtn"')==1
          assert s.count('aria-label="Explain index movement"')==1
          for t in ['id="mnxModal"','id="nowPrintReport"','function mnxRecord(','function mnxModelHealth(',
                    'function mnxPrintNow(','function mnxRenderHealth(','window.__mnShip25',
                    'governedIndexExplanation:state.indexExplanation','data-mnx-health="models"']:
              assert t in s, t
          assert 'c3cde56268303d8e2a222012d5a34aee9f26651e' not in s
          print('provenance + static ship gates PASS', len(s.encode()))
          PY
      - name: JavaScript parse
        run: |
          python3 - <<'PY'
          import pathlib, re
          s=pathlib.Path('market-navigator-turn25-ship.html').read_text(encoding='utf-8')
          m=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
          assert len(m)==1, len(m)
          pathlib.Path('/tmp/candidate.js').write_text(m[0], encoding='utf-8')
          PY
          node --check /tmp/candidate.js
          echo "javascript parse PASS"
