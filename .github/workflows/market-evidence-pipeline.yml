name: Market Navigator canonical evidence pipeline

on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-data-pipeline.py'
      - 'market-navigator-bootstrap-prep.py'
      - 'data/market-backend/data-catalog.json'
      - 'data/market-backend/data-catalog-amendment-v1.1.json'
      - '.github/workflows/market-evidence-pipeline.yml'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Rebuild up to ten years of canonical source history
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "37 23 * * *"

permissions:
  contents: write

concurrency:
  group: market-navigator-canonical-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical provenance and historical bootstrap inputs
        run: python3 market-navigator-bootstrap-prep.py
      - name: Build canonical evidence store
        env:
          MARKET_NAVIGATOR_BOOTSTRAP: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.bootstrap) && 'true' || 'false' }}
        run: python3 market-navigator-data-pipeline.py
      - name: Validate evidence contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/market-backend/data-catalog.json').read_text())
          m=json.loads(Path('market-evidence/operational-manifest.json').read_text())
          expected=c['canonical_horizons']
          assert c['version']=='1.1.0'
          assert expected==['1D','5D','1M','YTD','1Y','3Y','5Y']
          assert m['schema']=='market-navigator-operational-manifest-v1'
          ten=next(x for x in c['series'] if x['id']=='tenYear')
          assert ten['provider']=='FRED' and ten['provider_identifier']=='DGS10'
          for x in c['series']:
              if not x.get('enabled',True): continue
              sid=x['id']; s=m['series'][sid]
              p=json.loads(Path('market-evidence/reports',sid+'.json').read_text())
              assert set(p['reports'])==set(expected)
              assert p['computedRevision']==s['computed_revision']
              assert Path('market-evidence/series',sid+'.json').exists()
          assert m['series']['tenYear']['bootstrap_complete'], '10Y canonical history incomplete'
          assert m['series']['hySpread']['bootstrap_complete'], 'HY spread historical bootstrap incomplete'
          assert all(m['series']['hySpread']['horizon_readiness'].values()), 'HY spread canonical horizons incomplete'
          assert m['summary']['ready'], 'Canonical evidence acceptance still blocked: '+str(m['summary']['acceptanceBlockers'])
          print('Canonical evidence ACCEPTED:',m['revision'])
          PY
      - name: Commit canonical evidence
        run: |
          git config user.name "market-evidence-bot"
          git config user.email "market-evidence-bot@users.noreply.github.com"
          git add market-evidence
          if git diff --cached --quiet; then echo "No evidence changes."; exit 0; fi
          git commit -m "data: refresh canonical Market Navigator evidence"
          git pull --rebase origin main
          git push origin HEAD:main
