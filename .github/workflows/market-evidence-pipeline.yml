name: Market Navigator canonical evidence pipeline R7

on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-r7-catalog-reconcile.py'
      - 'market-navigator-r7-data-pipeline.py'
      - 'market-navigator-r7-health.py'
      - 'data/market-backend/data-catalog.json'
      - 'data/market-backend/derived-index-definition.json'
      - '.github/workflows/market-evidence-pipeline.yml'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Rebuild up to ten years of canonical source history
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "37 23 * * *"

permissions:
  contents: write

concurrency:
  group: market-navigator-canonical-evidence-r7
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile accepted R7 catalog and derived definitions
        run: |
          set -euo pipefail
          python3 market-navigator-r7-catalog-reconcile.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/market-backend/data-catalog.json').read_text())
          d=json.loads(Path('data/market-backend/derived-index-definition.json').read_text())
          assert c['canonical_horizons']==['1D','5D','MTD','YTD','1YR','3YR','5YR']
          exp={
            'risk':[('spy',-1),('vix',1),('hySpread',1),('hyg',-1),('dxy',1),('move',1),('nfci',1)],
            'growth':[('qqq',1),('copper',1),('smallCaps',1),('pmi',1),('wti',1),('unemployment',-1),('payrolls',1)],
            'macro':[('tenYear',1),('twoYear',1),('curve10y2y',1),('curve10y3m',1),('cpi',1),('corePce',1),('fedFunds',1)]}
          for k,v in exp.items():
              got=[(x['id'],x['direction']) for x in d['indices'][k]['components']]
              assert got==v,(k,got,v)
          ids={x['id'] for x in c['series']}
          assert set(sum(([x[0] for x in v] for v in exp.values()),[])) <= ids
          print('R7 accepted definitions reconciled')
          PY

      - name: Build canonical evidence
        env:
          MARKET_NAVIGATOR_BOOTSTRAP: ${{ (github.event_name == 'schedule' && 'false') || 'true' }}
        run: python3 market-navigator-r7-data-pipeline.py

      - name: Build publication-aware Health envelope
        run: python3 market-navigator-r7-health.py

      - name: Validate backend truth
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          c=json.loads(Path('data/market-backend/data-catalog.json').read_text())
          m=json.loads(Path('market-evidence/operational-manifest.json').read_text())
          h=json.loads(Path('market-evidence/health-envelope.json').read_text())
          assert m['canonicalHorizons']==['1D','5D','MTD','YTD','1YR','3YR','5YR']
          required={'spy','vix','hySpread','hyg','dxy','move','nfci','qqq','copper','smallCaps','pmi','wti','unemployment','payrolls','tenYear','twoYear','curve10y2y','curve10y3m','cpi','corePce','fedFunds'}
          assert required <= set(m['series'])
          unavailable=[x for x in required if m['series'][x]['status']=='unavailable']
          assert not unavailable,'required series unavailable: '+','.join(sorted(unavailable))
          for sid in ('cpi','corePce','payrolls'):
              r=h['series'][sid]
              exp=r['latestPubliclyExpectedObservation'];act=r['actualLatestCanonicalObservation']
              assert not (exp and act and act<exp and r['classification']=='expected-lag'),(sid,r)
          # CPI is mandatory: on/after the August release window, July reference-period evidence must be present.
          today=datetime.datetime.now(datetime.timezone.utc).date()
          if today.year==2026 and today.month>=8 and today.day>=16:
              r=h['series']['cpi']; assert r['actualLatestCanonicalObservation']>='2026-07-31',r
          # Canonical direct lines retain their own real ending dates.
          cpi=json.loads(Path('market-evidence/series/cpi.json').read_text())
          wti=json.loads(Path('market-evidence/series/wti.json').read_text())
          assert cpi['last'] < wti['last'],'mixed-frequency direct evidence was stretched'
          print('R7 backend truth ACCEPTED',m['revision'],h['summary'])
          PY

      - name: Commit reconciled canonical backend
        run: |
          set -euo pipefail
          git config user.name "market-evidence-bot"
          git config user.email "market-evidence-bot@users.noreply.github.com"
          git add data/market-backend/data-catalog.json data/market-backend/derived-index-definition.json market-evidence
          if git diff --cached --quiet; then echo "No canonical evidence changes."; exit 0; fi
          git commit -m "data: reconcile Market Navigator R7 canonical evidence"
          git pull --rebase origin main
          git push origin HEAD:main
