name: Publish SOT v0.3.1 build .4

on:
  push:
    paths:
      - '.github/workflows/sot-v031-b4-owner-flow.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover .4 candidate from prior governed workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/sot-v031-b4-owner-flow.yml > /tmp/prior.yml
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, gzip
          s=Path('/tmp/prior.yml').read_text()
          m=re.search(r"cat > /tmp/project\.b64 <<'PAYLOAD'\n(.*?)\nPAYLOAD",s,re.S)
          if not m:
              raise SystemExit('FAIL: .4 payload not found in prior governed workflow')
          data=gzip.decompress(base64.b64decode(m.group(1))).decode('utf-8')
          if 'Build: 2026.08.10.4' not in data:
              raise SystemExit('FAIL: payload is not build .4')
          Path('project.html').write_text(data)
          PY

      - name: Align helper and release metadata to build .4
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Build: 2026\.08\.10\.3/Build: 2026.08.10.4/' file_browser.py
          sed -i 's/BUILD_ID = "2026\.08\.10\.3"/BUILD_ID = "2026.08.10.4"/' file_browser.py
          sed -i 's/2026\.08\.10\.3/2026.08.10.4/g' SOT_PROJECT_VERSION deploy-sot-project.sh

      - name: Update governed plan for .4 owner flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()
          anchor='- **Reporting needs further product definition. Until the engine exists, show authoritative project metadata/events only and do not invent reconciliation metrics.**\n'
          rulings='''- **Adding locations is a staged draft operation. The explorer shows a third “Added to project” panel with every staged source and an × removal control; nothing is persisted or fingerprinted until Save selections and the later Create project action.**\n- **After Save selections, Intake provides a final Review project surface where project name, sources, and notes can still be changed before authoritative project creation/fingerprinting.**\n- **A final SOT data destination is NOT required at Intake. Required capacity is unknown until inventory/reconciliation establishes the surviving-size requirement.**\n- **Destination planning later includes both primary SOT capacity and backup capacity.**\n- **Long-term SOT maintenance must handle additions, changes, and deletions through reviewed change sets while keeping the backup verified; source disappearance alone never automatically deletes SOT content.**\n'''
          if rulings.splitlines()[0] not in s:
              s=s.replace(anchor,anchor+rulings)
          evidence='''\n## 1.5 Owner gate — v0.3.1 build 2026.08.10.3 FAILED\n\nOwner review accepted the simplified storage concept but rejected the source commit flow and premature target requirement. Build .4 corrects the same locked Intake surface:\n\n- three-pane Add Locations with visible staged selections and × removal;\n- Save selections commits only to the Intake draft;\n- final Review project before authoritative project creation/fingerprinting;\n- final SOT data destination deferred until capacity is known;\n- later primary SOT + backup planning and ongoing maintenance remain explicit release-plan work.\n\n'''
          if '## 1.5 Owner gate — v0.3.1 build 2026.08.10.3 FAILED' not in s:
              s=s.replace('# 2. RELEASE CHAIN',evidence+'# 2. RELEASE CHAIN')
          s=s.replace('**Status:** build 2026.08.10.2 FAILED owner gate; build 2026.08.10.3 is the active v0.3.1 candidate.', '**Status:** builds .2/.3 FAILED owner gate; build 2026.08.10.4 is the active v0.3.1 candidate.')
          s=s.replace('**Owner/device gate:** build .2 FAIL; build .3 NOT YET RUN.', '**Owner/device gate:** builds .2/.3 FAIL; build .4 NOT YET RUN.')
          if '## 3.9 Build .4 owner-flow requirements' not in s:
              block='''\n## 3.9 Build .4 owner-flow requirements\n\n- Source explorer is three-pane in source mode: storage, contents, Added to project.\n- Added sources are staged only and removable with ×.\n- Save selections commits only to the Intake draft, not the server.\n- Intake then has an explicit Review project step.\n- Review project shows project name, all source locations, and notes; destination is explicitly deferred.\n- Create project is the first authoritative persistence/fingerprinting action.\n- Project creation sends no target requirement.\n- Operations shows SOT destination as deferred until scan/capacity/backup planning.\n\n'''
              s=s.replace('# 4. RELEASE PLAN AFTER v0.3.1',block+'# 4. RELEASE PLAN AFTER v0.3.1')
          if '## G-011 — Requiring the final SOT destination during Intake' not in s:
              grave='''\n## G-011 — Requiring the final SOT destination during Intake\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED  \n**Approach:** require final SOT storage before a source project can be created.  \n**Why buried:** surviving size is unknown until inventory/reconciliation, and the primary SOT also needs backup capacity.  \n**Replacement:** create/fingerprint the source project first, measure it, then choose primary SOT + backup before copy execution.\n\n## G-012 — Immediately committing each source click\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED  \n**Approach:** mutate the Intake source list immediately on each folder click.  \n**Why buried:** weak review/undo visibility and accidental inclusion risk.  \n**Replacement:** three-pane staged selection → Save selections → Review project → authoritative Create project/fingerprint.\n\n'''
              s=s.replace('# 8. DONE / CURRENT IMPLEMENTATION LEDGER',grave+'# 8. DONE / CURRENT IMPLEMENTATION LEDGER')
          p.write_text(s)
          PY

      - name: Gate .4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile file_browser.py
          bash -n deploy-sot-project.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.10.4' project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
          grep -q 'Review project' project.html
          grep -q 'nothing is fingerprinted yet' project.html
          grep -q 'target:null' project.html
          grep -q 'Destination comes after the scan' project.html
          grep -q 'Not chosen yet.' project.html
          grep -q 'BUILD_ID = "2026.08.10.4"' file_browser.py
          grep -q '2026.08.10.4' SOT_PROJECT_VERSION deploy-sot-project.sh
          ! grep -q '8082' deploy-sot-project.sh
          ! grep -q 'tailscale serve' deploy-sot-project.sh

      - name: Commit published .4 and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-b4-owner-flow.yml
          git add project.html file_browser.py deploy-sot-project.sh SOT_PROJECT_VERSION project-backlog.md
          git commit -m 'Publish SOT v0.3.1 build 2026.08.10.4'
          git pull --rebase origin main
          git push origin HEAD:main
