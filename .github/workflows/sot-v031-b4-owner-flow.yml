name: SOT v0.3.1 build .4 owner-flow rebuild

on:
  push:
    paths:
      - '.github/workflows/sot-v031-b4-owner-flow.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from declared baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE_UI='89920a073aae12dcebecb50a9ba9cf7e32f2bd14'
          BASE_HELPER='32c684163c8e7682d62370738d711400e013ab94'
          git cat-file blob "$BASE_UI" > /tmp/v030-project.html
          git cat-file blob "$BASE_HELPER" > /tmp/v030-helper.py
          test "$(git hash-object /tmp/v030-project.html)" = "$BASE_UI"
          test "$(git hash-object /tmp/v030-helper.py)" = "$BASE_HELPER"

          # Reapply the accepted helper delta to a clean v0.3.0 helper, then bump build.
          cp file_browser.py /tmp/v031-b3-helper.py
          cp /tmp/v030-helper.py file_browser.py
          diff -u /tmp/v030-helper.py /tmp/v031-b3-helper.py > /tmp/helper.patch || true
          patch --silent file_browser.py < /tmp/helper.patch
          cmp -s file_browser.py /tmp/v031-b3-helper.py
          sed -i 's/Build: 2026\.08\.10\.3/Build: 2026.08.10.4/' file_browser.py
          sed -i 's/BUILD_ID = "2026\.08\.10\.3"/BUILD_ID = "2026.08.10.4"/' file_browser.py

      - name: Install full UI candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/project.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/project.b64 | gzip -d > project.html
          echo '13eac7183cd8c30976789aca59741d8822da08f268c8fc200b04d9108a365092  project.html' | sha256sum -c -

      - name: Update release metadata and governance
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/2026\.08\.10\.3/2026.08.10.4/g' SOT_PROJECT_VERSION deploy-sot-project.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()
          rulings='''- **Adding locations is a staged draft operation. The location explorer must show a third “Added to project” panel with every staged source and an × removal control; nothing is persisted or fingerprinted until the user explicitly saves selections and later creates the project.**\n- **After saving source selections, Intake must provide a final project review surface where project name and sources can still be changed before authoritative project creation/fingerprinting.**\n- **A target/SOT destination is NOT required at Intake. Required capacity is unknown until source inventory/reconciliation establishes surviving size. Destination selection is a later step and must account for both primary SOT capacity and backup capacity.**\n- **The long-term SOT lifecycle must include an ongoing method to apply additions, changes, and deletions to the SOT while maintaining backup protection; this is separate from initial project Intake.**\n'''
          anchor='- **Reporting needs further product definition. Until the engine exists, show authoritative project metadata/events only and do not invent reconciliation metrics.**\n'
          if rulings.splitlines()[0] not in s:
              s=s.replace(anchor,anchor+rulings)
          evidence='''\n## 1.5 Owner gate evidence — v0.3.1 build 2026.08.10.3 FAILED\n\nThe owner accepted the simplified storage mental model but rejected the source commit flow and early target decision:\n\n- Add Locations needs a third selected-items panel so staged sources remain visible and removable before saving.\n- Saving source selections must still leave one final project-level review before the server creates the project and fingerprints sources.\n- The target cannot be a prerequisite because surviving size and required free space are not known yet.\n- Destination planning must include backup capacity, followed later by an ongoing SOT update/backup method for additions, changes, and deletions.\n\nBuild .3 is therefore not accepted. Build .4 remains v0.3.1 and is rebuilt from the declared v0.3.0 baseline with these owner rulings applied.\n\n'''
          if '## 1.5 Owner gate evidence — v0.3.1 build 2026.08.10.3 FAILED' not in s:
              s=s.replace('# 2. RELEASE CHAIN',evidence+'# 2. RELEASE CHAIN')
          s=s.replace('**Status:** BUILD 2026.08.10.2 FAILED OWNER GATE; rebuild 2026.08.10.3 is the active candidate.', '**Status:** BUILDS .2 AND .3 FAILED OWNER GATE; build 2026.08.10.4 is the active candidate.')
          s=s.replace('**Owner/device gate:** build .2 FAIL; build .3 NOT YET RUN.', '**Owner/device gate:** builds .2/.3 FAIL; build .4 NOT YET RUN.')
          extra='''\n## 3.9 Owner-flow rebuild requirements — build 2026.08.10.4\n\n- Source explorer is three-pane in source mode: storage, contents, Added to project.\n- Added sources are staged only and removable with ×.\n- Save selections commits only to the Intake draft, not to the server.\n- Intake then has an explicit Review project step.\n- Review project shows project name, all source locations, notes, and explicitly shows destination deferred.\n- Create project is the first authoritative persistence/fingerprinting action.\n- Project creation sends no target requirement.\n- Operations shows SOT destination as deferred until scan/capacity/backup planning.\n\n'''
          if '## 3.9 Owner-flow rebuild requirements — build 2026.08.10.4' not in s:
              s=s.replace('# 4. RELEASE PLAN AFTER v0.3.1',extra+'# 4. RELEASE PLAN AFTER v0.3.1')
          # Assign later lifecycle work explicitly.
          s=s.replace('## v0.4.0 — Engine foundation: source identity + scan + manifest', '## v0.4.0 — Engine foundation: source identity + scan + manifest + capacity assessment')
          if '- Capacity report: raw source bytes, discovered file count, and preliminary space requirement before any target is selected.' not in s:
              s=s.replace('- Manifest persistence.\n', '- Manifest persistence.\n- Capacity report: raw source bytes, discovered file count, and preliminary space requirement before any target is selected.\n')
          if '## v0.5.1 — Destination + backup planning' not in s:
              marker='## v0.6.0 — Copy plan + dry run + verified execution'
              block='''## v0.5.1 — Destination + backup planning\n\n**Goal:** choose where the SOT will live only after the engine knows the surviving/candidate size.\n\nPlanned items:\n\n- Show required primary SOT capacity from scan/hash/crunch results.\n- Choose primary SOT storage and final folder after capacity is known.\n- Require/record a backup destination or explicit backup plan before copy execution.\n- Show free-space margin for both primary and backup storage.\n- Keep destination selection editable until copy execution begins.\n\n'''
              s=s.replace(marker,block+marker)
          if '- Ongoing SOT maintenance mode: detect registered-source additions, changes, and deletions and produce a reviewed update plan.' not in s:
              anchor2='## v0.9.0 — OpenClaw orchestration'
              block2='''## v0.8.1 — Ongoing SOT maintenance + backup\n\n**Goal:** keep the promoted SOT current and protected after the initial reconciliation.\n\nPlanned items:\n\n- Ongoing SOT maintenance mode: detect registered-source additions, changes, and deletions and produce a reviewed update plan.\n- Never delete from the SOT automatically merely because a source item disappeared; deletion propagation requires policy/review.\n- Apply approved additions/changes/deletions to the SOT with provenance.\n- Update/verify the backup after each approved SOT change set.\n- Report primary/backup health and last successful synchronization.\n\n'''
              s=s.replace(anchor2,block2+anchor2)
          grave='''\n## G-011 — Requiring the final SOT destination during Intake\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED  \n**Approach:** require the operator to choose/create the final target before the source project can be created.  \n**Why buried:** the surviving data size is not yet known, so capacity cannot be selected intelligently; the primary destination also needs a backup plan.  \n**Replacement:** create/fingerprint the source project first, measure it, then select primary SOT + backup capacity before copy execution.\n\n## G-012 — Immediately committing each source click\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED  \n**Approach:** each “Add this folder” click mutates the Intake project source list directly and closing the picker ends selection.  \n**Why buried:** weak review/undo visibility and accidental inclusion risk.  \n**Replacement:** three-pane staged selection → Save selections to Intake draft → final Review project → authoritative Create project/fingerprint.\n\n'''
          if '## G-011 — Requiring the final SOT destination during Intake' not in s:
              s=s.replace('# 8. DONE / CURRENT IMPLEMENTATION LEDGER',grave+'# 8. DONE / CURRENT IMPLEMENTATION LEDGER')
          p.write_text(s)
          PY

      - name: Gate build .4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile file_browser.py
          bash -n deploy-sot-project.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.10.4' project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
          grep -q 'Review project' project.html
          grep -q 'nothing is fingerprinted yet' project.html
          grep -q 'target:null' project.html
          grep -q 'Destination comes after the scan' project.html
          grep -q 'Not chosen yet.' project.html
          ! grep -q 'workspace required' project.html
          grep -q 'BUILD_ID = "2026.08.10.4"' file_browser.py
          grep -q '2026.08.10.4' SOT_PROJECT_VERSION deploy-sot-project.sh

      - name: Commit candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-b4-owner-flow.yml
          git add project.html file_browser.py deploy-sot-project.sh SOT_PROJECT_VERSION project-backlog.md
          git commit -m 'Rebuild SOT v0.3.1 build 2026.08.10.4 owner flow'
          git pull --rebase origin main
          git push origin HEAD:main
