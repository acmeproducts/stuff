name: Deploy Chatlink runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chatlink/runner/**'
      - '.github/workflows/deploy-chatlink-runner.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatlink/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Live check
        run: |
          sleep 8
          curl -fsS -m 20 https://chatlink-runner.myacctfortracking.workers.dev/health | tee /tmp/h.txt; echo
          grep -q '"v":"c1"' /tmp/h.txt
