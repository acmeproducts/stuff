name: Market Navigator Turn 08 build
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn08.py'
      - 'market-navigator-turn07-pre-ship.html'
      - '.github/workflows/market-navigator-turn08-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Turn 08
        run: python3 market-navigator-build-turn08.py
      - name: Syntax gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn08-pre-ship.html').read_text()
          assert 'TURN 08 PRE-SHIP' in s
          assert 'Validate & save' in s
          assert 'marketNavigatorAIRegistryV1' in s
          assert 'function cfg(){' not in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/mn8.js').write_text(js)
          PY
          node --check /tmp/mn8.js
      - name: Publish generated standalone source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn08-pre-ship.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'market navigator: build Turn 08 AI registry and analysis lifecycle'
          git push
