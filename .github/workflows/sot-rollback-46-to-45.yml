name: Rollback SOT picker .4.6 to .4.5

on:
  push:
    paths:
      - '.github/workflows/sot-rollback-46-to-45.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact .4.5 project.html
        shell: bash
        run: |
          set -euo pipefail
          BASE='970d56435a84192c74de4d3eb7978ee327d303c4'
          git checkout "$BASE" -- project.html
          grep -q 'Build: 2026.08.11.4.5' project.html
          grep -q 'explorer.three' project.html
          grep -q 'Added to project' project.html
          grep -q 'folder-add' project.html

      - name: Record owner gate failure and locked three-pane model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()
          note='''\n## Owner gate — build 2026.08.11.4.6 FAILED / rolled back\n\nBuild .4.6 is rejected. It replaced the working folder browser behavior and resulted in a picker that could no longer browse folders correctly. The runtime is rolled back to exact build .4.5 from commit `970d56435a84192c74de4d3eb7978ee327d303c4`.\n\nThe three-panel model is locked and must not be collapsed or replaced:\n\n1. **Locations / volumes** — visible drives and accessible storage.\n2. **Contents** — folders/files for the selected location, independently scrollable.\n3. **Added to project** — persistent staged-source review with × remove and Save selections.\n\nNext implementation must be rebuilt from .4.5, preserving its working folder enumeration. The correction is limited to selection ergonomics: allow a whole volume or individual folders to be selected without losing browse capability; keep the selection action visible without requiring scrolling to the bottom. Do not patch .4.6 forward.\n\n'''
          if '## Owner gate — build 2026.08.11.4.6 FAILED / rolled back' not in s:
              anchor='# 2. RELEASE CHAIN'
              s=s.replace(anchor,note+anchor)
          p.write_text(s)
          PY

      - name: Gate rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.11.4.5' project.html
          grep -q 'class=\"explorer ${mode===\x27source\x27?\x27three\x27:\x27\x27}\"' project.html || grep -q "mode==='source'?'three':''" project.html
          grep -q 'Added to project' project.html
          grep -q 'data-add-folder' project.html

      - name: Commit rollback and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-rollback-46-to-45.yml
          git add project.html project-backlog.md
          git commit -m 'Rollback broken SOT picker .4.6 to working .4.5'
          git pull --rebase origin main
          git push origin HEAD:main
