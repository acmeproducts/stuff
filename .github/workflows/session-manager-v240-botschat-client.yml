          js=re.findall(r'<script>(.*?)</script>',s,re.S); assert len(js)==1
          Path('/tmp/session-manager-v240.js').write_text(js[0],encoding='utf-8')
          g=Path('session-manager-backlog.md').read_text(encoding='utf-8')
          assert 'SESSION-MANAGER-GOVERNANCE v1.8.0' in g
          assert 'Client Type' in g and 'G-017' in g
          print('semantic gates PASS')
          PY
