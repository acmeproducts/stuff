name: Session Manager v2.4.0 BotsChat client type

on:
  push:
    branches: [main]
    paths: [.github/workflows/session-manager-v240-botschat-client.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase onto current main and verify governed input
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Session Manager release builder'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin main
          test "$(git hash-object session-manager-v3.html)" = "b9800aa5e46b4e4e52bf58ca83a86a0d7606fe24"

      - name: Build v2.4.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('session-manager-v3.html')
          before=p.read_text(encoding='utf-8')
          s=before

          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)

          def fn(text,name):
              m=re.search(rf'(?:(?:async\s+)?function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{)',text)
              if not m: raise SystemExit('protected function missing: '+name)
              i=m.start(); j=m.end(); depth=1; quote=None; esc=False
              while j<len(text) and depth:
                  c=text[j]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  j+=1
              if depth: raise SystemExit('unbalanced protected function: '+name)
              return text[i:j]

          protected=['identity','deviceToken','saveDeviceToken','connectParams','rpc','rejectPending','connect','handleConnectError','schedule','reconnect','hostingDefaultGateway']
          frozen={n:fn(before,n) for n in protected}

          # Build number only. Protocol/client signature version remains frozen.
          if s.count('v2.3.5') < 2: raise SystemExit('v2.3.5 markers missing')
          s=s.replace('v2.3.5','v2.4.0')

          # Persistent thread store and client-type state.
          one("trash:'oc_session_manager_soft_deleted_v1'};", "trash:'oc_session_manager_soft_deleted_v1',threads:'oc_session_manager_threads_v1'};", 'thread storage key')
          one("archivePaths:[],trashOpen:false,settings:loadSettings()};", "archivePaths:[],trashOpen:false,threadState:null,settings:loadSettings()};", 'thread state')
          one("return{gatewayUrl:s.gatewayUrl||hostingDefaultGateway(),debugEnabled:s.debugEnabled===true,debugText:s.debugText===true,appearance:normalizeAppearance(s.appearance||{})}", "return{gatewayUrl:s.gatewayUrl||hostingDefaultGateway(),debugEnabled:s.debugEnabled===true,debugText:s.debugText===true,clientType:s.clientType==='botschat'?'botschat':'standard',appearance:normalizeAppearance(s.appearance||{})}", 'client type settings')

          # Three additional complete appearance presets.
          preset_anchor="'large-print':{preset:'large-print'"
          i=s.find(preset_anchor)
          if i<0: raise SystemExit('preset insertion anchor missing')
          additions="""'claude':{preset:'claude',accent:'#c86f52',bg:'#f7f4ee',panel:'#fffdfa',panel2:'#eee9e1',line:'#c8c0b5',text:'#2c2825',muted:'#625c56',input:'#ffffff',code:'#2b2927',codeText:'#ffffff',inlineCode:'#eee9e1',inlineCodeText:'#2c2825',pathBg:'#f3e6df',pathText:'#3a241d',link:'#8a4d38',userBg:'#f1ece5',userFont:'#2c2825',agentBg:'#fffaf4',agentFont:'#2c2825',chromeBg:'#f2ede5',chromeText:'#2c2825',chromeBtnBg:'#fffdfa',chromeBtnText:'#2c2825',chromeBtnHover:'#e4d3c8',systemBg:'#eee9e1',systemText:'#2c2825',userSize:17,agentSize:17,msgWidth:88,density:'comfortable',sidebarWidth:390,baseSize:16,metaSize:12,metaColor:'#625c56',lineHeight:1.65,fontFamily:'system'},
'chatgpt':{preset:'chatgpt',accent:'#10a37f',bg:'#ffffff',panel:'#f7f7f8',panel2:'#ececf1',line:'#d1d5db',text:'#202123',muted:'#565869',input:'#ffffff',code:'#202123',codeText:'#ffffff',inlineCode:'#ececf1',inlineCodeText:'#202123',pathBg:'#eef8f5',pathText:'#17483c',link:'#087f65',userBg:'#f7f7f8',userFont:'#202123',agentBg:'#ffffff',agentFont:'#202123',chromeBg:'#f7f7f8',chromeText:'#202123',chromeBtnBg:'#ffffff',chromeBtnText:'#202123',chromeBtnHover:'#e7f3ef',systemBg:'#ececf1',systemText:'#202123',userSize:17,agentSize:17,msgWidth:88,density:'normal',sidebarWidth:390,baseSize:16,metaSize:12,metaColor:'#565869',lineHeight:1.62,fontFamily:'system'},
'botschat':{preset:'botschat',accent:'#0877b9',bg:'#ffffff',panel:'#f7f7f8',panel2:'#ededee',line:'#d4d5d8',text:'#202124',muted:'#62656b',input:'#ffffff',code:'#16181b',codeText:'#ffffff',inlineCode:'#eef0f2',inlineCodeText:'#202124',pathBg:'#e7f3fb',pathText:'#123f5d',link:'#006db5',userBg:'#f7f3fb',userFont:'#202124',agentBg:'#eff9f4',agentFont:'#173a29',chromeBg:'#ffffff',chromeText:'#202124',chromeBtnBg:'#f4f5f6',chromeBtnText:'#202124',chromeBtnHover:'#dcecf7',systemBg:'#f1f2f3',systemText:'#202124',userSize:17,agentSize:17,msgWidth:92,density:'normal',sidebarWidth:330,baseSize:16,metaSize:12,metaColor:'#62656b',lineHeight:1.6,fontFamily:'system'},
"""
          s=s[:i]+additions+s[i:]

          # BotsChat layout/decorations. Color remains controlled independently by Appearance.
          css="""
.threadTabs{display:none;height:48px;align-items:stretch;gap:2px;padding:0 10px;border-bottom:1px solid var(--ln);background:var(--p);overflow-x:auto;overflow-y:hidden;flex:0 0 48px}.threadTab{display:flex;align-items:center;gap:7px;min-width:120px;max-width:260px;padding:0 12px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--mu);font-weight:700;white-space:nowrap}.threadTab.active{color:var(--tx);background:var(--p2);border-bottom-color:var(--am)}.threadTab .tabLabel{overflow:hidden;text-overflow:ellipsis}.threadTab .tabClose{margin-left:auto;border:0;background:transparent;color:var(--mu);font-size:16px;padding:3px 4px;border-radius:5px}.threadTab .tabClose:hover{background:var(--p2);color:var(--rd)}.threadTabAdd{min-width:46px;border:0;background:transparent;color:var(--mu);font-size:25px}.threadTabAdd:hover{color:var(--am);background:var(--p2)}
.threadRow{padding:13px 16px;border-left:3px solid transparent;cursor:pointer;display:flex;align-items:center;gap:9px;color:var(--tx)}.threadRow:hover,.threadRow.active{background:var(--p2);border-left-color:var(--am)}.threadHash{font-weight:800}.threadMeta{font-size:10px;color:var(--mu);margin-left:auto}.threadHint{padding:10px 16px;color:var(--mu);font-size:10px;border-top:1px solid var(--ln)}
.clientTypeCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.clientTypeCard{display:block;border:2px solid var(--ln);border-radius:12px;background:var(--p);padding:15px;cursor:pointer}.clientTypeCard:has(input:checked){border-color:var(--am);background:var(--p2);box-shadow:0 0 0 2px color-mix(in srgb,var(--am) 20%,transparent)}.clientTypeCard input{margin-right:8px}.clientTypeCard b{font-size:14px}.clientTypeCard small{display:block;color:var(--mu);margin:7px 0 0 24px;line-height:1.45}
.sessionPickerList{display:grid;gap:6px;max-height:52vh;overflow:auto}.sessionPick{display:flex;align-items:center;gap:8px;text-align:left;width:100%;border:1px solid var(--ln);background:var(--p);color:var(--tx);border-radius:9px;padding:10px 12px}.sessionPick:hover{background:var(--p2);border-color:var(--am)}.sessionPick .pickText{min-width:0;flex:1}.sessionPick .pickLabel{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sessionPick .pickKey{font:9px ui-monospace,Consolas,monospace;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#app.client-botschat #searchWrap{display:none}#app.client-botschat #sessionList{padding:8px 0}#app.client-botschat #threadTabs{display:flex}#app.client-botschat #sidebar{min-width:250px}#app.client-botschat .sidebarTop{min-height:64px;height:64px}#app.client-botschat .mainbar{height:66px;min-height:66px}#app.client-botschat .session{display:none}
@media(max-width:760px){.clientTypeCards{grid-template-columns:1fr}.threadTabs{padding-left:6px}.threadTab{min-width:105px}}
"""
          one('</style>',css+'</style>','botschat CSS')

          # Make brand text addressable and add session-tab strip.
          one('<span class="brand">Session Manager <span class="version">v2.4.0</span></span>', '<span class="brand"><span id="brandName">Session Manager</span> <span class="version">v2.4.0</span></span>', 'brand id')
          one('</div>\n  <div id="error"></div>', '</div>\n  <div id="threadTabs" class="threadTabs"></div>\n  <div id="error"></div>', 'thread tabs DOM')

          # Thread persistence and client behavior.
          marker='function saveSettings(){localStorage.setItem(K.settings,JSON.stringify(state.settings))}'
          if s.count(marker)!=1: raise SystemExit('thread-function insertion marker missing')
          funcs="""
function normalizeThreadState(v){let t=v&&typeof v==='object'?v:{},items=Array.isArray(t.items)?t.items:[],g=items.find(x=>x&&x.id==='general')||{id:'general',name:'General',sessions:[]};g={id:'general',name:String(g.name||'General').trim()||'General',sessions:[...new Set((Array.isArray(g.sessions)?g.sessions:[]).map(String).filter(Boolean))]};return{active:'general',items:[g]}}
function threadScope(){return state?.settings?.gatewayUrl||DEF}function loadThreadState(){let all={};try{all=JSON.parse(localStorage.getItem(K.threads)||'{}')||{}}catch{}return normalizeThreadState(all[threadScope()])}function saveThreadState(){let all={};try{all=JSON.parse(localStorage.getItem(K.threads)||'{}')||{}}catch{}all[threadScope()]=normalizeThreadState(state.threadState);localStorage.setItem(K.threads,JSON.stringify(all))}function activeThread(){if(!state.threadState)state.threadState=loadThreadState();return state.threadState.items[0]}
function addSessionToThread(k,selectIt=false){k=String(k||'');if(!k)return;let t=activeThread();if(!t.sessions.includes(k)){t.sessions.push(k);saveThreadState()}renderThreadTabs();renderSessions();if(selectIt&&state.sessions.some(s=>s.key===k))select(k)}function removeSessionFromThread(k){let t=activeThread();t.sessions=t.sessions.filter(x=>x!==k);saveThreadState();let was=state.current?.key===k;renderThreadTabs();renderSessions();if(was){let next=t.sessions.find(x=>state.sessions.some(s=>s.key===x));next?select(next):clearSelection()}}
function seedBotsChatThread(){if(state.settings.clientType!=='botschat')return;let t=activeThread();t.sessions=t.sessions.filter(k=>state.sessions.some(s=>s.key===k));if(!t.sessions.length){let k=state.current?.key||state.sessions[0]?.key;if(k)t.sessions.push(k)}saveThreadState()}
function applyClientType(){let bot=state.settings.clientType==='botschat';$('app').classList.toggle('client-botschat',bot);$('brandName').textContent=bot?'BotsChat':'Session Manager';$('newChat').textContent=bot?'+ Session':'+ New';if(bot)seedBotsChatThread();renderSessions();renderThreadTabs();header()}
function renderThreadSidebar(){let t=activeThread(),valid=t.sessions.filter(k=>state.sessions.some(s=>s.key===k)),working=valid.filter(k=>sessionState(k)==='working').length;$('stats').textContent=`${valid.length} sessions${working?' · '+working+' working':''}`;$('sessionList').innerHTML=`<div class="threadRow active"><span class="threadHash">#</span><b>${esc(t.name)}</b><span class="threadMeta">${valid.length}</span></div><div class="threadHint">Sessions in this thread appear as tabs across the conversation surface. Closing a tab removes it from the thread only.</div>`}
function renderThreadTabs(){let root=$('threadTabs');if(!root)return;if(state.settings.clientType!=='botschat'){root.innerHTML='';return}let t=activeThread(),sessions=t.sessions.map(k=>state.sessions.find(s=>s.key===k)).filter(Boolean);root.innerHTML=sessions.map(s=>{let v=sessionState(s.key,s);return`<button class="threadTab ${state.current?.key===s.key?'active':''}" data-thread-session="${esc(s.key)}"><span class="sessionState ${statusClass(v)}"></span><span class="tabLabel">${esc(name(s))}</span><span class="tabClose" data-thread-close="${esc(s.key)}" title="Remove from thread">×</span></button>`}).join('')+`<button class="threadTabAdd" id="threadAddSession" title="Add session to thread">+</button>`;root.querySelectorAll('[data-thread-session]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-thread-close]'))return;select(b.dataset.threadSession)});root.querySelectorAll('[data-thread-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();removeSessionFromThread(b.dataset.threadClose)});$('threadAddSession').onclick=openThreadSessionPicker}
function openThreadSessionPicker(){let t=activeThread(),available=state.sessions.filter(s=>!t.sessions.includes(s.key));$('modal').innerHTML=`<div class="modalbg"><div class="modal"><div class="mhead"><b>Add session to #${esc(t.name)}</b><span class="grow"></span><button class="btn" id="pickerClose">×</button></div><div class="mbody"><button class="btn primary" id="pickerNew" style="width:100%;margin-bottom:12px">+ Create new OpenClaw session</button><input class="input" id="pickerSearch" placeholder="Find an existing session" style="margin-bottom:10px"><div class="sessionPickerList" id="pickerList"></div></div></div></div>`;let draw=()=>{let q=$('pickerSearch').value.trim().toLowerCase(),a=available.filter(s=>!q||[name(s),s.key,s.preview].some(v=>String(v||'').toLowerCase().includes(q)));$('pickerList').innerHTML=a.length?a.map(s=>`<button class="sessionPick" data-pick="${esc(s.key)}"><span class="sessionState ${statusClass(sessionState(s.key,s))}"></span><span class="pickText"><div class="pickLabel">${esc(name(s))}</div><div class="pickKey">${esc(s.key)}</div></span></button>`).join(''):'<div class="empty">No additional sessions match.</div>';$('pickerList').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let k=b.dataset.pick;$('modal').innerHTML='';addSessionToThread(k,true)})};$('pickerClose').onclick=()=>$('modal').innerHTML='';$('pickerNew').onclick=()=>{$('modal').innerHTML='';newChat()};$('pickerSearch').oninput=draw;draw()}
"""
          s=s.replace(marker,marker+funcs,1)

          # Standard session renderer becomes thread renderer in BotsChat client type.
          one("function renderSessions(){let q=", "function renderSessions(){if(state.settings.clientType==='botschat'){renderThreadSidebar();renderThreadTabs();return}let q=", 'botschat sidebar branch')

          # New sessions are attached to the current BotsChat thread.
          one("if(!key)throw Error('sessions.create returned no session key');await loadSessions();", "if(!key)throw Error('sessions.create returned no session key');await loadSessions();if(state.settings.clientType==='botschat')addSessionToThread(key,false);", 'new chat attaches to thread')

          # Keep tab status in sync without rebuilding the whole chat.
          one("if(state.current?.key===k)updateWorkPill()}", "if(state.current?.key===k)updateWorkPill();if(state.settings.clientType==='botschat'){let tn=document.querySelector(`.threadTab[data-thread-session=\"${CSS.escape(k)}\"] .sessionState`);if(tn){tn.className='sessionState '+statusClass(v);tn.title=statusText(v)}}}", 'thread status paint')

          # Selection refreshes the active tab.
          one("renderSessions();header();$('emptyState')", "renderSessions();renderThreadTabs();header();$('emptyState')", 'select tab refresh')

          # BotsChat header represents the thread; selected session identity lives in the tab strip.
          old_header="function header(){let s=state.current;if(!s){$('chatTitle').textContent='Select a session';$('chatInfo').textContent='OpenClaw Gateway protocol v4';$('downloadSession').classList.add('hidden');$('shareSession').classList.add('hidden');updateWorkPill();return}$('chatTitle').textContent=name(s);$('chatInfo').textContent=s.key+(s.agentId?' · agent '+s.agentId:'')+(state.sessionId?' · '+state.sessionId:'');$('downloadSession').classList.remove('hidden');$('shareSession').classList.remove('hidden');updateWorkPill()}"
          new_header="function header(){let s=state.current;if(state.settings.clientType==='botschat'){let t=activeThread(),n=t.sessions.filter(k=>state.sessions.some(x=>x.key===k)).length;$('chatTitle').textContent='# '+t.name;$('chatInfo').textContent=`${n} session${n===1?'':'s'} · OpenClaw Gateway`;if(s){$('downloadSession').classList.remove('hidden');$('shareSession').classList.remove('hidden')}else{$('downloadSession').classList.add('hidden');$('shareSession').classList.add('hidden')}updateWorkPill();return}if(!s){$('chatTitle').textContent='Select a session';$('chatInfo').textContent='OpenClaw Gateway protocol v4';$('downloadSession').classList.add('hidden');$('shareSession').classList.add('hidden');updateWorkPill();return}$('chatTitle').textContent=name(s);$('chatInfo').textContent=s.key+(s.agentId?' · agent '+s.agentId:'')+(state.sessionId?' · '+state.sessionId:'');$('downloadSession').classList.remove('hidden');$('shareSession').classList.remove('hidden');updateWorkPill()}"
          one(old_header,new_header,'botschat header')

          # Configuration gets a real Client tab, independent of Appearance.
          one('<button class="configTab active" data-cfg="connection">Connection</button><button class="configTab" data-cfg="appearance">Appearance</button>', '<button class="configTab active" data-cfg="connection">Connection</button><button class="configTab" data-cfg="client">Client</button><button class="configTab" data-cfg="appearance">Appearance</button>', 'client tab')
          pane="""</section><section class="cfgPane" data-pane="client"><div class="appearanceSection"><h3>Client type</h3><div class="sectionHelp">Client type changes navigation and working model. It is separate from Appearance colors.</div><div class="clientTypeCards"><label class="clientTypeCard"><input type="radio" name="clientType" value="standard" ${state.settings.clientType!=='botschat'?'checked':''}><b>Standard Session Manager</b><small>One selected OpenClaw session at a time with the complete session list in the left panel.</small></label><label class="clientTypeCard"><input type="radio" name="clientType" value="botschat" ${state.settings.clientType==='botschat'?'checked':''}><b>BotsChat — threaded</b><small>One local #General thread containing multiple independent OpenClaw sessions as tabs. Sessions can continue working while you switch tabs.</small></label></div><div class="notice" style="margin-top:14px">BotsChat v1 intentionally has one thread. The thread is local client organization; it does not rename, merge, delete, or otherwise change the underlying OpenClaw sessions.</div><button class="btn" id="useBotsPreset">Use BotsChat appearance preset</button></div>"""
          one('</section><section class="cfgPane" data-pane="appearance">',pane+'</section><section class="cfgPane" data-pane="appearance">','client pane')

          # Add Claude, ChatGPT and BotsChat preset cards.
          one("'large-print':['Large Print','Largest text and generous spacing']", "'claude':['Claude','Warm cream surfaces and restrained terracotta accent'],'chatgpt':['ChatGPT','Neutral white/gray surfaces with restrained green accent'],'botschat':['BotsChat','Light collaborative shell with blue/green accents'],'large-print':['Large Print','Largest text and generous spacing']", 'preset card names')

          # Commit client type; connection/auth does not need to reconnect for a client-layout switch.
          one("let commit=()=>{let u=$('su').value.trim();", "$('useBotsPreset').onclick=()=>{$('apreset').value='botschat';populate(appearancePreset('botschat'));document.querySelectorAll('.configTab').forEach(x=>x.classList.toggle('active',x.dataset.cfg==='appearance'));document.querySelectorAll('.cfgPane').forEach(x=>x.classList.toggle('active',x.dataset.pane==='appearance'));live()};let commit=()=>{let u=$('su').value.trim();", 'BotsChat preset shortcut')
          one("state.settings.gatewayUrl=u;state.settings.debugEnabled=", "state.settings.gatewayUrl=u;state.settings.clientType=document.querySelector('input[name=clientType]:checked')?.value==='botschat'?'botschat':'standard';state.settings.debugEnabled=", 'save client type')
          one("state.settings.appearance=read();applyAppearance();saveSettings()", "state.settings.appearance=read();applyAppearance();saveSettings();applyClientType()", 'apply client type after save')

          # Reload thread state if the Gateway URL changes before applying the client type.
          one("state.settings.gatewayUrl=u;state.settings.clientType=", "state.settings.gatewayUrl=u;state.threadState=loadThreadState();state.settings.clientType=", 'gateway scoped thread state')

          # Initialize thread model after identity-independent appearance load.
          one("async function init(){applyAppearance();setSidebar(true);bind();", "async function init(){applyAppearance();state.threadState=loadThreadState();setSidebar(true);bind();applyClientType();", 'client init')

          # Gate protected Gateway/auth functions.
          for n,v in frozen.items():
              if fn(s,n)!=v: raise SystemExit('protected function changed: '+n)
          if "const APP_VERSION='2.3.0'" not in s: raise SystemExit('protocol APP_VERSION changed')
          for x in ["const BUILD_VERSION='2.4.0'",'data-pane="client"','value="botschat"','id="threadTabs"','function renderThreadTabs()','function openThreadSessionPicker()','Claude','ChatGPT','BotsChat']:
              if x not in s: raise SystemExit('required v2.4.0 marker missing: '+x)

          p.write_text(s,encoding='utf-8',newline='')
          print('v2.4.0 client-type build PASS')
          PY

      - name: Update governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('session-manager-backlog.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- SESSION-MANAGER-GOVERNANCE v1.7.0 -->','<!-- SESSION-MANAGER-GOVERNANCE v1.8.0 -->',1)
          s=s.replace('**Governance version:** 1.7.0','**Governance version:** 1.8.0',1)
          s=s.replace('**Updated:** 2026-08-10','**Updated:** 2026-08-11',1)
          s=s.replace('# 2. ACTIVE RELEASE — SM-R2 / visible build v2.3.1','# 2. ACTIVE RELEASE — SM-R3 / visible build v2.4.0 — CLIENT TYPE / BOTSCHAT THREAD',1)
          anchor='v2.3.1 is an accessibility/appearance refinement of the governed v2.3 feature line. It does not redesign the Gateway connection contract.\n'
          amendment='''\n\n### Owner ruling — 2026-08-11\n\nThe BotsChat reference is **not merely an appearance palette**. It defines a second client interaction model. v2.4.0 therefore introduces a persisted `Client Type` setting independent of Appearance.\n\n**Locked v2.4.0 scope:**\n\n- `Standard Session Manager` preserves the existing one-selected-session layout.\n- `BotsChat — threaded` provides one local `#General` thread containing multiple independent OpenClaw sessions as tabs across the conversation surface.\n- `+` on the tab strip adds an existing OpenClaw session or creates a new one.\n- Closing a session tab removes only the local thread membership; it does not delete, archive, rename, merge, or reset the OpenClaw session.\n- Existing session run-state/subscription behavior remains independent, allowing multiple sessions to continue working while the operator switches tabs.\n- Multi-thread / multi-channel is intentionally deferred until this one-thread model is owner-gated.\n- Appearance remains a separate layer; Claude, ChatGPT and BotsChat are added as complete appearance presets.\n- Gateway identity/signature/connect code remains protected and unchanged.\n\n'''
          if '### Owner ruling — 2026-08-11' not in s:
              s=s.replace(anchor,anchor+amendment,1)
          s += '''\n\n## Governance amendment — client type vs appearance\n\n### G-017 — Treating a reference client as only a color theme\n\n**Date buried:** 2026-08-11  \n**Status:** VETOED  \n**Why:** The owner supplied BotsChat as a reference for decorations, navigation, session tabs, grouping and interaction model, not merely colors.  \n**Replacement:** `Client Type` governs structural interaction; `Appearance` governs palette/typography. The two settings remain independent.\n\n### D-016 — BotsChat first gate is one thread with multiple sessions\n\nThe first BotsChat client type stops deliberately at one local `#General` thread. Multi-thread/channel and multi-instance expansion follow only after this model passes the owner gate.\n'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Mechanical gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text(encoding='utf-8')
          assert 'Session Manager <span class="version">v2.4.0</span>' not in s  # brand is now split for client switching
          assert '<span id="brandName">Session Manager</span> <span class="version">v2.4.0</span>' in s
          assert "const BUILD_VERSION='2.4.0';" in s
          assert "const APP_VERSION='2.3.0'" in s
          assert "s.clientType==='botschat'?'botschat':'standard'" in s
          assert 'function renderThreadTabs()' in s
