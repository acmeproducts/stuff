name: TalkBridge device log
# Drains the shared device log from the relay into the repository so both
# handsets' lines can be read together, in arrival order, in one file.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      clear:
        description: 'clear the device log before draining'
        required: false
        default: 'false'
      clear_activity:
        description: 'clear the activity log before draining'
        required: false
        default: 'false'
permissions:
  contents: write
concurrency:
  group: device-log
  cancel-in-progress: false
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Drain every 30 seconds
        run: |
          # GitHub's schedule cannot fire faster than every 5 minutes, so this
          # run stays alive and drains every 30 seconds for the whole window;
          # the next scheduled run picks straight up from it.
          U="https://talk-signal.myacctfortracking.workers.dev/log"
          A="https://talk-signal.myacctfortracking.workers.dev/activity"
          git config user.name acmeproducts
          git config user.email 182510673+acmeproducts@users.noreply.github.com
          if [ "${{ github.event.inputs.clear }}" = "true" ]; then
            curl -sS -X DELETE --max-time 20 "$U" || true
          fi
          if [ "${{ github.event.inputs.clear_activity }}" = "true" ]; then
            curl -sS -X DELETE --max-time 20 "$A" || true
          fi
          mkdir -p talkbridge
          for i in $(seq 1 11); do
            curl -sS --max-time 20 "$U" -o /tmp/dev.log || echo "(relay unreachable)" > /tmp/dev.log
            {
              echo "# TalkBridge device log"
              echo ""
              echo "Both handsets write here. Drained $(date -u +%FT%TZ), every 30s. Newest at the bottom."
              echo ""
              echo '```'
              tail -c 400000 /tmp/dev.log
              echo '```'
            } > talkbridge/DEVICE-LOG.md
            curl -sS --max-time 20 "$A" -o /tmp/activity.log || echo "(relay unreachable)" > /tmp/activity.log
            {
              echo "# TalkBridge activity log"
              echo ""
              echo "Who created, joined, called and chatted, one line per event, no message text (§7.21; relay v6.14). Drained $(date -u +%FT%TZ). Newest at the bottom. Person = the name typed in the app, letters and digits only (no name: Guest 1, Guest 2 … per room); room = its short id. Live view: https://acmeproducts.github.io/stuff/talkbridge/dash.html"
              echo ""
              echo '```'
              tail -c 400000 /tmp/activity.log
              echo '```'
            } > talkbridge/ACTIVITY-LOG.md
            git add talkbridge/DEVICE-LOG.md talkbridge/ACTIVITY-LOG.md
            if ! git diff --staged --quiet; then
              git commit -q -m "device + activity log [skip ci]"
              git pull --rebase -q origin main || true
              git push -q origin HEAD:main || true
            fi
            [ "$i" = "11" ] || sleep 30
          done
