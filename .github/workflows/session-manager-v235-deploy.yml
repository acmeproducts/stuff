name: Deploy Session Manager v2.3.5
on:
  push:
    branches: [agent/session-manager-v235-unified-appearance]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-manager-v235-unified-appearance
          fetch-depth: 0
      - name: Verify candidate and publish to main
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const BUILD_VERSION='2.3.5';" session-manager-v3.html
          grep -q "function hostingDefaultGateway()" session-manager-v3.html
          grep -q "achromebg" session-manager-v3.html
          grep -q "asystembg" session-manager-v3.html
          cp session-manager-v3.html /tmp/session-manager-v3.html
          git config user.name 'acmeproducts'
          git config user.email '182510693+acmeproducts@users.noreply.github.com'
          git checkout main
          cp /tmp/session-manager-v3.html session-manager-v3.html
          git add session-manager-v3.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Session Manager v2.3.5 unify appearance surfaces'
          git push origin main
