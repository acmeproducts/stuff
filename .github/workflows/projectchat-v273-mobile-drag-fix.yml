name: ProjectChat v2.7.4 production patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('session-manager-v3.html')
          s=p.read_text(encoding='utf-8')
          assert "const BUILD_VERSION='2.7.2';" in s
          s=s.replace("const BUILD_VERSION='2.7.2';","const BUILD_VERSION='2.7.4';",1)

          old='<span class="sessionState ${statusClass(v)}" title="${statusText(v)}"></span><span class="tabLabel">'
          new='<span class="tabDragHandle" draggable="true" role="button" aria-label="Drag tab" title="Drag tab">⠿</span><span class="sessionState ${statusClass(v)}" title="${statusText(v)}"></span><span class="tabLabel">'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          oldtab='class="projectTab ${state.current?.key===x.key?\'active\':\'\'}" draggable="true" data-project-session='
          newtab='class="projectTab ${state.current?.key===x.key?\'active\':\'\'}" draggable="false" data-project-session='
          assert s.count(oldtab)==1
          s=s.replace(oldtab,newtab,1)

          marker='/* v2.7 ProjectChat tab context menu + persistent tab customization */'
          assert marker in s
          css='.tabDragHandle{display:inline-grid;place-items:center;flex:0 0 30px;width:30px;height:34px;margin-left:-7px;border-radius:6px;color:var(--mu);font-size:19px;line-height:1;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.tabDragHandle:hover,.tabDragHandle:focus{background:var(--p2);color:var(--am);outline:none}.tabDragHandle:active{cursor:grabbing}.projectTab{touch-action:auto}'
          s=s.replace(marker,marker+'\n'+css,1)

          start=s.rfind("<script>\n(()=>{'use strict';\nconst DOUBLE_TAP_MS=360,DRAG_MOVE=12;")
          assert start!=-1
          end=s.find('</script>',start)
          assert end!=-1
          end+=len('</script>')
          js=r'''<script>
(()=>{'use strict';
const DOUBLE_TAP_MS=360,DRAG_MOVE=5;
let g=null,ghost=null,lastTap={key:'',at:0,x:0,y:0},suppress=0;
const root=()=>document.getElementById('projectTabs');
function hit(x,y){let e=document.elementFromPoint(x,y);return{project:e?.closest?.('.projectRow[data-project]')||null,tab:e?.closest?.('.projectTab[data-project-session]')||null}}
function clean(){try{if(g?.capture?.hasPointerCapture?.(g.id))g.capture.releasePointerCapture(g.id)}catch{}ghost?.remove();ghost=null;document.querySelectorAll('.dragOver,.dragBefore,.dragAfter').forEach(e=>e.classList.remove('dragOver','dragBefore','dragAfter'));g=null}
function showGhost(x,y){ghost=document.createElement('div');ghost.textContent=g.tab.querySelector('.tabLabel')?.textContent||'Session';Object.assign(ghost.style,{position:'fixed',zIndex:'2500',pointerEvents:'none',left:x+'px',top:y+'px',transform:'translate(-50%,-135%)',padding:'8px 11px',border:'1px solid var(--ln)',borderRadius:'9px',background:'var(--p)',color:'var(--tx)',boxShadow:'0 12px 34px rgba(0,0,0,.28)'});document.body.appendChild(ghost)}
function mark(x,y){document.querySelectorAll('.dragOver,.dragBefore,.dragAfter').forEach(e=>e.classList.remove('dragOver','dragBefore','dragAfter'));let h=hit(x,y);if(h.project)h.project.classList.add('dragOver');else if(h.tab&&h.tab!==g.tab){let r=h.tab.getBoundingClientRect();h.tab.classList.add(x>r.left+r.width/2?'dragAfter':'dragBefore')}}
function drop(el,key,e){let dt={getData:t=>t==='text/session-key'?key:'',types:['text/session-key'],dropEffect:'move',effectAllowed:'move'};if(typeof el?.ondrop==='function')el.ondrop({preventDefault(){},stopPropagation(){},dataTransfer:dt,clientX:e.clientX,clientY:e.clientY,target:el})}
function down(e){if(!['touch','pen'].includes(e.pointerType)||e.button!==0)return;let tab=e.target.closest?.('.projectTab[data-project-session]');if(!tab||e.target.closest?.('.tabClose'))return;clean();let handle=e.target.closest?.('.tabDragHandle'),capture=handle||tab;try{capture.setPointerCapture(e.pointerId)}catch{}g={id:e.pointerId,tab,capture,key:tab.dataset.projectSession,x:e.clientX,y:e.clientY,mode:handle?'dragPending':'tap'}}
function move(e){if(!g||e.pointerId!==g.id)return;let d=Math.hypot(e.clientX-g.x,e.clientY-g.y);if(g.mode==='dragPending'&&d>DRAG_MOVE){g.mode='drag';suppress=Date.now()+800;showGhost(e.clientX,e.clientY)}if(g.mode==='drag'){e.preventDefault();ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';mark(e.clientX,e.clientY)}}
function up(e){if(!g||e.pointerId!==g.id)return;let q=g;if(q.mode==='drag'){e.preventDefault();let h=hit(e.clientX,e.clientY);if(h.project)drop(h.project,q.key,e);else if(h.tab&&h.tab!==q.tab)drop(h.tab,q.key,e);lastTap={key:'',at:0,x:0,y:0}}else if(q.mode==='tap'){let n=Date.now(),dbl=lastTap.key===q.key&&n-lastTap.at<=DOUBLE_TAP_MS&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<=24;if(dbl){e.preventDefault();suppress=n+700;let f=q.tab.oncontextmenu;if(typeof f==='function')f.call(q.tab,{preventDefault(){},stopPropagation(){},clientX:e.clientX,clientY:e.clientY,target:q.tab,pointerType:e.pointerType});lastTap={key:'',at:0,x:0,y:0}}else lastTap={key:q.key,at:n,x:e.clientX,y:e.clientY}}clean()}
function bind(){let r=root();if(!r)return;r.addEventListener('pointerdown',down,{passive:true});r.addEventListener('pointermove',move,{passive:false});r.addEventListener('pointerup',up,{passive:false});r.addEventListener('pointercancel',clean);r.addEventListener('click',e=>{if(Date.now()<suppress&&e.target.closest?.('.projectTab')){e.preventDefault();e.stopImmediatePropagation()}},true);r.addEventListener('dragstart',e=>{let h=e.target.closest?.('.tabDragHandle');if(!h){e.preventDefault();return}let t=h.closest('.projectTab');e.dataTransfer.setData('text/session-key',t.dataset.projectSession);e.dataTransfer.effectAllowed='move'},true);document.addEventListener('pointerdown',e=>{let m=document.getElementById('tabContext');if(m&&!e.target.closest?.('#tabContext'))closeTabContext()},true)}
document.querySelectorAll('.version').forEach(n=>n.textContent='v2.7.4');bind();
})();
</script>'''
          s=s[:start]+js+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          import re
          s=open('session-manager-v3.html',encoding='utf-8').read()
          for g in ["const BUILD_VERSION='2.7.4'",'class="tabDragHandle"','draggable="false" data-project-session','touch-action:none','dragPending','setPointerCapture','elementFromPoint','DOUBLE_TAP_MS=360']:
              assert g in s,g
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',s,re.S)
          for i,j in enumerate(scripts):open(f'/tmp/v274-{i}.js','w',encoding='utf-8').write(j)
          PY
          for f in /tmp/v274-*.js; do node --check "$f"; done

          git add session-manager-v3.html
          git commit -m 'ProjectChat v2.7.4 explicit tab drag handle'
          git push origin HEAD:main
