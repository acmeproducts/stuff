name: Market Navigator Turn 37 Stage 5 NOW Cutover
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-turn37-stage5-adapter.js'
      - 'market-navigator-build-turn37-stage5.py'
      - '.github/workflows/market-navigator-turn37-stage5.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Accepted baseline identity
        run: test "$(git hash-object market-navigator-turn28-post-ship.html)" = "9ce7f67451f9e1b7804927ce5c56adb667614724"
      - name: Build Stage 5
        run: python market-navigator-build-turn37-stage5.py
      - name: Syntax
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('market-navigator-turn37-stage5.html').read_text()
          pathlib.Path('/tmp/mn37s5.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/mn37s5.js
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Baseline visual and Analyze isolation regression
        run: |
          python3 -m http.server 8123 >/tmp/mn37-stage5-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          MN_CAND_URL=http://127.0.0.1:8123/market-navigator-turn37-stage5.html node market-navigator-turn37-stage3-qa.mjs
      - name: Controller ownership and analytical parity
        run: |
          cat > /tmp/s5.mjs <<'JS'
          import assert from 'node:assert/strict';import{createRequire}from'node:module';const{chromium}=createRequire(import.meta.url)('playwright');
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:1440,height:900}}),p=await c.newPage(),errs=[];
          p.on('pageerror',e=>errs.push(e.message));p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});
          await p.route('https://cdn.jsdelivr.net/npm/marked/marked.min.js',r=>r.fulfill({body:"window.marked={parse:s=>s}"}));await p.route('https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js',r=>r.fulfill({body:'window.DOMPurify={sanitize:s=>s}'}));
          await p.goto('http://127.0.0.1:8123/market-navigator-turn37-stage5.html',{waitUntil:'networkidle'});await p.waitForFunction(()=>window.__mn37Stage5?.ready?.());
          let a=await p.evaluate(()=>window.__mn37Stage5.counts().total);await p.locator('#legend [data-id="risk"]').click();await p.waitForTimeout(220);let z=await p.evaluate(()=>window.__mn37Stage5.counts().total);assert.equal(z-a,1);assert((await p.evaluate(()=>window.__mn37Stage5.parity())).equal);
          for(const h of ['5D','YTD','1YR','3YR','5YR']){a=await p.evaluate(()=>window.__mn37Stage5.counts().total);await p.locator('#hzs [data-h="'+h+'"]').click();await p.waitForTimeout(180);z=await p.evaluate(()=>window.__mn37Stage5.counts().total);assert.equal(z-a,1);assert((await p.evaluate(()=>window.__mn37Stage5.parity())).equal)}
          await p.locator('#nowIndexDisplay').selectOption('rebase');await p.waitForTimeout(180);assert((await p.evaluate(()=>window.__mn37Stage5.parity())).equal);
          await p.locator('#nowAddSeries').click();await p.waitForSelector('#nowPicker:not(.hidden)');assert.deepEqual((await p.locator('#nowPicker [data-mn37-picker-group]').allTextContents()).map(x=>x.trim()),['Risk','Growth','Macro','Other']);
          let cb=p.locator('#nowPicker [data-mn37-picker-id]:not([disabled])');if(await cb.count()){let before=await p.evaluate(()=>window.__mn37Stage5.state().spec.series.slice());await cb.first().check();await p.locator('#nowPicker [data-mn37-picker-cancel]').click();assert.deepEqual(await p.evaluate(()=>window.__mn37Stage5.state().spec.series),before)}
          assert.equal(errs.length,0,errs.join('|'));console.log('PASS Stage 5 ownership/parity');await c.close();await b.close();
          JS
          node /tmp/s5.mjs
      - name: Publish passing Stage 5
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('market-navigator-turn37-stage5-evidence.json').write_text(json.dumps({
            'stage':5,'status':'PASS','baselineBlob':'9ce7f67451f9e1b7804927ce5c56adb667614724',
            'visualGeometryParity':'PASS','eventOwnership':'PASS','analyticalParity':'PASS',
            'analyzeIsolation':'PASS','libraryIndependence':'PASS','sharedBatchAdd':'PASS'
          },indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --ff-only origin/main
          python market-navigator-build-turn37-stage5.py
          git add market-navigator-turn37-stage5.html market-navigator-turn37-stage5-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Market Navigator Turn 37 Stage 5: qualify NOW controller cutover'
          git push origin HEAD:main
