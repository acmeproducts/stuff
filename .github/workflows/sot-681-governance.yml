name: SOT 6.8.1 governance
on:
  push:
    paths:
      - '.github/workflows/sot-681-governance.yml'
permissions:
  contents: write
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record explorer-first Project Setup ruling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md'); s=p.read_text()
          block='''\n## 0.2E Project Setup explorer-first ruling — 2026-08-19\n\n- Pane 2 (Source folders) is the primary working surface in Project Setup. On mobile it must remain fully usable without horizontally scrolling through a three-panel desktop canvas.\n- Pane 2 uses a conventional file-explorer structure: a top ribbon with Up, current path, refresh, Select All, folder search, selected count, and Add Selected; below it is a vertically scrollable folder table.\n- Folder rows use sortable metadata columns. Required first release columns are Name, Date Modified, Type, and Size where known. Unknown recursive folder size is shown explicitly as `—`; the UI may not invent metadata or block browsing while recursively calculating it.\n- The folder table header remains sticky while the folder body scrolls. Selection state is visible at row level. Folder drill-down is performed from the Name cell.\n- On mobile, Source Drives becomes a narrow persistent rail, Pane 2 occupies the primary width, and staged Project sources remain available in a compact lower pane. The mobile view may not require horizontal page scrolling to reach Pane 2.\n- The previous `root files ignored` status/copy is removed from this surface; Project Setup is a folder-source selector and should describe the folder result set directly.\n- This is a UI-only release on the accepted 6.8 backend. Backend worker scheduling, inventory, reporting, report-server topology, ports, proxying, and Tailscale are unchanged.\n- Candidate UI build: `2026.08.19.6.8.1-wsl-setup-explorer`.\n\n'''
          if '## 0.2E Project Setup explorer-first ruling — 2026-08-19' not in s:
              s=s.replace('## 0.3 Established plumbing — keep',block+'## 0.3 Established plumbing — keep',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-backlog.md
          git commit -m 'Lock explorer-first Project Setup pane'
          git push
