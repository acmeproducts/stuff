name: Build SOT v0.3.1 .4 correctly on report server

on:
  push:
    paths:
      - '.github/workflows/sot-v031-b4-correct-server.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild UI from .3 baseline, not failed .4
        shell: bash
        run: |
          set -euo pipefail
          BASE='037a0198800f45e616596fc27efb562db5289fa6'
          git diff "$BASE" HEAD -- project.html > /tmp/approved-ui.delta || true
          git show "$BASE":project.html > project.html
          patch --silent -p1 < /tmp/approved-ui.delta
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.html'); s=p.read_text()
          s=s.replace('Build: 2026.08.10.4.1','Build: 2026.08.10.4.2')
          s=s.replace("BUILD_ID='2026.08.10.4.1'","BUILD_ID='2026.08.10.4.2'")
          # Remove the failed helper tunnel. All APIs now live on the existing report server.
          s=s.replace("const FS_API='/api/fs',PROJECT_API='/api/projects',REPORT_API='/api/reports';",
                      "const FS_API='/api/sot/fs',PROJECT_API='/api/sot/projects',REPORT_API='/api/sot/reports';")
          s=s.replace("const transport=(url.startsWith(PROJECT_API)||url.startsWith(REPORT_API))?`${FS_API}?route=${encodeURIComponent(url)}`:url;","const transport=url;")
          p.write_text(s)
          PY

      - name: Create SOT API module for existing Node report server
        shell: bash
        run: |
          cat > sot-api.js <<'JS'
          'use strict';
          const fs=require('fs');
          const path=require('path');
          const crypto=require('crypto');
          const os=require('os');
          const {execFileSync}=require('child_process');

          const VERSION='0.3.1', BUILD='2026.08.10.4.2';
          const DEFAULT_DB=path.join(os.homedir(),'.openclaw','sot','sot.sqlite');
          const CONFIG=path.join(os.homedir(),'.openclaw','sot','config.json');
          const HOME=os.homedir();
          function json(res,status,obj){res.writeHead(status,{'Content-Type':'application/json','Cache-Control':'no-store'});res.end(JSON.stringify(obj));}
          function body(req){return new Promise((resolve,reject)=>{let b='';req.on('data',c=>{b+=c;if(b.length>2e6)req.destroy();});req.on('end',()=>{try{resolve(b?JSON.parse(b):{});}catch(e){reject(e);}});req.on('error',reject);});}
          function cfg(){try{return {...{database_path:DEFAULT_DB,database_backup_path:''},...JSON.parse(fs.readFileSync(CONFIG,'utf8'))};}catch(_){return {database_path:DEFAULT_DB,database_backup_path:''};}}
          function saveCfg(c){fs.mkdirSync(path.dirname(CONFIG),{recursive:true});fs.writeFileSync(CONFIG,JSON.stringify(c,null,2));}
          function sql(q,db=cfg().database_path){fs.mkdirSync(path.dirname(db),{recursive:true});return execFileSync('sqlite3',['-json',db,q],{encoding:'utf8'}).trim();}
          function esc(v){return "'"+String(v??'').replace(/'/g,"''")+"'";}
          function init(){const db=cfg().database_path;sql(`PRAGMA journal_mode=WAL; CREATE TABLE IF NOT EXISTS projects(project_token TEXT PRIMARY KEY,project_name TEXT NOT NULL,created_at TEXT NOT NULL,updated_at TEXT NOT NULL,status TEXT NOT NULL DEFAULT 'new',current_stage TEXT NOT NULL DEFAULT 'intake',notes TEXT NOT NULL DEFAULT ''); CREATE TABLE IF NOT EXISTS sources(source_id TEXT PRIMARY KEY,project_token TEXT NOT NULL,path TEXT NOT NULL,fingerprint TEXT NOT NULL,created_at TEXT NOT NULL,UNIQUE(project_token,path)); CREATE TABLE IF NOT EXISTS events(event_id INTEGER PRIMARY KEY AUTOINCREMENT,project_token TEXT,event_type TEXT NOT NULL,created_at TEXT NOT NULL,detail TEXT NOT NULL DEFAULT '');` ,db);}
          function rows(q){init();const x=sql(q);return x?JSON.parse(x):[];}
          function roots(){const out=[];for(const letter of 'cdefghijklmnopqrstuvwxyz'){const p='/mnt/'+letter;try{if(fs.statSync(p).isDirectory())out.push({name:letter.toUpperCase()+':',path:p,kind:'storage'});}catch(_){}}out.push({name:'WSL Home',path:HOME,kind:'storage'});return out;}
          function browse(p){if(!p||p==='/')return {path:'/',folders:roots().map(x=>x.name),files:[],paths:Object.fromEntries(roots().map(x=>[x.name,x.path])),locations:roots()};const rp=path.resolve(p);const items=fs.readdirSync(rp,{withFileTypes:true});const folders=[],files=[];for(const e of items){if(e.isDirectory())folders.push(e.name);else if(e.isFile())files.push(e.name);}folders.sort();files.sort();return {path:rp,parent:path.dirname(rp),folders,files,paths:Object.fromEntries(folders.map(n=>[n,path.join(rp,n)]))};}
          function token(name,sources){return crypto.createHash('sha256').update(new Date().toISOString()+'\0'+name+'\0'+sources.join('\0')).digest('hex').slice(0,24);}
          function fingerprint(p){let st;try{st=fs.statSync(p);}catch(_){st=null;}return crypto.createHash('sha256').update(`${p}\0${st?st.dev:''}\0${st?st.ino:''}`).digest('hex');}
          function project(token){const p=rows(`SELECT * FROM projects WHERE project_token=${esc(token)} LIMIT 1`)[0];if(!p)return null;p.sources=rows(`SELECT source_id,path,fingerprint,created_at FROM sources WHERE project_token=${esc(token)} ORDER BY created_at`);return p;}

          async function handle(req,res,url){
            const pn=url.pathname;
            if(!pn.startsWith('/api/sot/'))return false;
            try{
              if(pn==='/api/sot/health'){init();json(res,200,{service:'sot',status:'ok',version:VERSION,build:BUILD,server:'session-server.js',port:18080});return true;}
              if(pn==='/api/sot/fs'&&req.method==='GET'){json(res,200,browse(url.searchParams.get('path')||'/'));return true;}
              if(pn==='/api/sot/config'&&req.method==='GET'){json(res,200,cfg());return true;}
              if(pn==='/api/sot/config'&&req.method==='POST'){const b=await body(req),c={...cfg(),...b};saveCfg(c);init();json(res,200,c);return true;}
              if(pn==='/api/sot/projects/health'){init();json(res,200,{status:'ok',version:VERSION,build:BUILD});return true;}
              if(pn==='/api/sot/projects'&&req.method==='GET'){json(res,200,rows('SELECT * FROM projects ORDER BY created_at DESC'));return true;}
              if(pn==='/api/sot/projects'&&req.method==='POST'){
                const b=await body(req),name=String(b.project_name||b.name||'').trim(),sources=(b.sources||[]).map(x=>typeof x==='string'?x:x.path).filter(Boolean);
                if(!name||!sources.length){json(res,400,{error:'project_name and at least one source are required'});return true;}
                const now=new Date().toISOString(),t=token(name,sources);
                init();
                sql('BEGIN;'+`INSERT OR IGNORE INTO projects(project_token,project_name,created_at,updated_at,status,current_stage,notes) VALUES(${esc(t)},${esc(name)},${esc(now)},${esc(now)},'new','intake',${esc(b.notes||'')});`+sources.map(p=>{const sid=crypto.createHash('sha256').update(t+'\0'+p).digest('hex').slice(0,24);return `INSERT OR IGNORE INTO sources(source_id,project_token,path,fingerprint,created_at) VALUES(${esc(sid)},${esc(t)},${esc(p)},${esc(fingerprint(p))},${esc(now)});`;}).join('')+`INSERT INTO events(project_token,event_type,created_at,detail) VALUES(${esc(t)},'project.created',${esc(now)},${esc(JSON.stringify({sources:sources.length}))});COMMIT;`);
                json(res,201,project(t));return true;
              }
              let m=pn.match(/^\/api\/sot\/projects\/([^/]+)$/);
              if(m&&req.method==='GET'){const p=project(m[1]);json(res,p?200:404,p||{error:'not found'});return true;}
              if(m&&req.method==='PATCH'){const b=await body(req),sets=[];if(b.project_name!=null)sets.push(`project_name=${esc(b.project_name)}`);if(b.notes!=null)sets.push(`notes=${esc(b.notes)}`);if(!sets.length){json(res,400,{error:'nothing to update'});return true;}sets.push(`updated_at=${esc(new Date().toISOString())}`);sql(`UPDATE projects SET ${sets.join(',')} WHERE project_token=${esc(m[1])}`);json(res,200,project(m[1]));return true;}
              if(m&&req.method==='DELETE'){sql(`DELETE FROM sources WHERE project_token=${esc(m[1])}; DELETE FROM events WHERE project_token=${esc(m[1])}; DELETE FROM projects WHERE project_token=${esc(m[1])};`);json(res,200,{success:true});return true;}
              if(pn==='/api/sot/reports/aggregate'){json(res,200,{projects:rows('SELECT COUNT(*) AS count FROM projects')[0]?.count||0,sources:rows('SELECT COUNT(*) AS count FROM sources')[0]?.count||0});return true;}
              if(pn==='/api/sot/reports/timeline'){json(res,200,rows('SELECT * FROM events ORDER BY created_at DESC LIMIT 500'));return true;}
              json(res,404,{error:'SOT route not found'});return true;
            }catch(e){json(res,500,{error:e.message});return true;}
          }
          module.exports={handle,VERSION,BUILD};
          JS

      - name: Create integration patcher for supplied production session-server.js
        shell: bash
        run: |
          cat > integrate-sot-server.js <<'JS'
          #!/usr/bin/env node
          'use strict';
          const fs=require('fs');
          const p=process.argv[2]||'session-server.js';
          let s=fs.readFileSync(p,'utf8');
          if(s.includes("require('./sot-api')")){console.log('SOT integration already present');process.exit(0);}
          const anchor="const path = require('path');";
          if(!s.includes(anchor))throw new Error('Expected supplied session-server.js baseline not found');
          s=s.replace(anchor,anchor+"\nconst sotApi = require('./sot-api');");
          const route="  if (req.method === 'OPTIONS') { res.writeHead(204); res.end(); return; }";
          if(!s.includes(route))throw new Error('Expected request-router anchor not found');
          s=s.replace(route,route+"\n  if (pathname.startsWith('/api/sot/')) { sotApi.handle(req, res, url); return; }");
          fs.writeFileSync(p,s);
          console.log('Integrated /api/sot/* into existing session-server.js without changing existing routes.');
          JS
          chmod +x integrate-sot-server.js

      - name: Update governance to proven topology
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md');s=p.read_text()
          s=s.replace('**Canonical helper/backend:** `file_browser.py`','**Canonical backend:** existing production `session-server.js` on port 18080 + versioned `sot-api.js` module')
          start=s.index('## 0.2 Current owner rulings');end=s.index('## 0.3 Build rules')
          section=s[start:end]
          section=section.replace('- Do not add a new service, daemon, port, database, or proxy layer when the existing SOT helper can safely own the function.\n- The SOT HTTP helper remains one process on `127.0.0.1:8081`.\n- **Release deployment must use the existing report server, existing SOT helper, existing port 8081, and existing Tailscale routing. A release is not permission to restart, replace, or reconfigure infrastructure.**\n- **`deploy-sot-project.sh` is release-file installation only: overwrite the canonical `project.html` and `file_browser.py` in their already-established locations. It must not create/start/stop/restart servers or alter ports/routes.**\n- If an already-running Python helper requires a reload to pick up a changed `file_browser.py`, that is an operational reload of the existing helper, not a new service or architecture decision; do not perform it as part of a release unless the owner explicitly asks for that operational step.\n',
          '- **There is one production report/application server: `/usr/bin/node session-server.js`, working directory `/home/support/.openclaw/workspace/https/report`, port `18080`. SOT APIs extend this existing process under `/api/sot/*`.**\n- **Port 8081 / FastAPI / Uvicorn / `file_browser.py` is rejected and removed. Never reintroduce it.**\n- **OpenClaw Gateway remains independently on 18789 and is unchanged by SOT releases.**\n- **Tailscale `/report` continues to proxy the existing 18080 server. No SOT release may create another server, daemon, port, or proxy.**\n- **Existing session-server routes and behavior are preserved; SOT is additive under `/api/sot/*`.**\n')
          s=s[:start]+section+s[end:]
          old='''## 1.3 Current architectural topology\n\n```text\nOpenClaw Gateway       existing port\nReport/static server   existing port\n\nONE SOT helper\n127.0.0.1:8081\n  ├── /api/fs\n  ├── /api/projects\n  └── /api/reports\n```\n\nNo supported SOT architecture includes a second project API service or port 8082.\n'''
          new='''## 1.3 Current architectural topology\n\n```text\nOpenClaw Gateway\n127.0.0.1:18789                         UNCHANGED\n\nProduction report/application server\n127.0.0.1:18080  session-server.js\n  ├── existing session APIs             UNCHANGED\n  ├── existing static /report content   UNCHANGED\n  └── /api/sot/*                        SOT API\n      ├── fs\n      ├── projects\n      ├── reports\n      └── config\n```\n\nPort 8081 and the standalone Python/FastAPI helper are graveyard architecture.\n'''
          if old in s:s=s.replace(old,new)
          entry='''\n## 1.7 Runtime architecture correction — owner evidence\n\nOwner diagnostic on 2026-08-10 proved the production report server is `/usr/bin/node session-server.js`, PID observed 172102, port 18080, working directory `/home/support/.openclaw/workspace/https/report`. The extra Python process on 8081 was unnecessary and is rejected. Build .4.2 is rebuilt from .3 and reimplements the approved .4 UX against additive `/api/sot/*` routes in the existing 18080 Node server.\n\n'''
          if '## 1.7 Runtime architecture correction' not in s:s=s.replace('# 2. RELEASE CHAIN',entry+'# 2. RELEASE CHAIN')
          grave='''\n## G-014 — Standalone SOT server on port 8081\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED / REMOVED  \n**Approach:** Python FastAPI/Uvicorn `file_browser.py` on 127.0.0.1:8081.  \n**Why buried:** duplicates application-server responsibility already available in production `session-server.js` on 18080 and created deployment/routing failure modes.  \n**Replacement:** additive `/api/sot/*` routes inside the existing 18080 Node report/application server. Existing session routes remain unchanged.\n\n'''
          if '## G-014 — Standalone SOT server' not in s:s=s.replace('# 8. DONE / CURRENT IMPLEMENTATION LEDGER',grave+'# 8. DONE / CURRENT IMPLEMENTATION LEDGER')
          s=s.replace('governance-correct rebuild 2026.08.10.4.1 from .3 is the active candidate','architecture-correct rebuild 2026.08.10.4.2 from .3 is the active candidate')
          p.write_text(s)
          PY

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          node --check sot-api.js
          node --check integrate-sot-server.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text();m=re.search(r'<script>(.*?)</script>',s,re.S);assert m;Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.10.4.2' project.html
          grep -q "FS_API='/api/sot/fs'" project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
          grep -q 'Review project' project.html
          grep -q 'target:null' project.html
          grep -q "pathname.startsWith('/api/sot/')" integrate-sot-server.js
          ! grep -RqiE '8081|uvicorn|fastapi|file_browser' project.html sot-api.js integrate-sot-server.js

      - name: Publish and remove transient workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-b4-correct-server.yml
          git add project.html sot-api.js integrate-sot-server.js project-backlog.md
          git commit -m 'Build SOT v0.3.1 .4 on existing 18080 report server'
          git pull --rebase origin main
          git push origin HEAD:main
