name: Market Navigator Gate 4 R6 release
on:
  push:
    paths: ['.github/workflows/market-navigator-gate4-r6-release.yml']
permissions: {contents: write}
jobs:
  qualify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble from exact baseline
        run: |
          set -euo pipefail
          test "$(git hash-object market-view-gate4-r3.html)" = 99a2e5ebec8e31afeca4bfe4a75a3de21fb749f1
          test "$(git hash-object market-view.html)" = 99a2e5ebec8e31afeca4bfe4a75a3de21fb749f1
          grep -q 'DO NOT PATCH FORWARD' MARKET-NAVIGATOR-R6-PRE-BASE.md
          cp market-view-gate4-r3.html market-view-gate4-r6.html
          cp market-view-gate4-r6.js market-view-gate4-r6-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market-view-gate4-r6-runtime.js');s=p.read_text()
          R=[
          ("Object.assign(H,{1d:{label:'1D'},5d:{label:'5D'},mtd:{label:'MTD',mtd:true},ytd:{label:'YTD',ytd:true},1y:{label:'1YR',days:365},3y:{label:'3YR',days:1095},5y:{label:'5YR',days:1825}})","Object.assign(H,{'1d':{label:'1D'},'5d':{label:'5D'},mtd:{label:'MTD',mtd:true},ytd:{label:'YTD',ytd:true},'1y':{label:'1YR',days:365},'3y':{label:'3YR',days:1095},'5y':{label:'5YR',days:1825}})"),
          ("function metaFromCatalog(){","function metaFromCatalog(){state.meta=state.meta||{};"),
          ("CATEGORY[k].components=defs[k].components.map(x=>x.id)}\nfunction componentDef","CATEGORY[k].components=defs[k].components.map(x=>x.id)}}\nfunction componentDef"),
          ("effect:null}})}}\n}\nfunction expectedFor","effect:null}})}}\nfunction expectedFor"),
          ("$$('[data-r6-component]').forEach(b=>b.onclick=()=>openDetail(b.dataset.r6Component));","$$('[data-r6-component]').forEach(b=>b.onclick=async e=>{e?.preventDefault?.();e?.stopImmediatePropagation?.();await drawV3([b.dataset.r6Component])});")]
          for a,b in R:
            assert a in s,a[:50];s=s.replace(a,b,1)
          p.write_text(s)
          h=Path('market-view-gate4-r6.html');x=h.read_text()
          R=[
          ("(async()=>{configLoad();await openDB();await loadStored();renderAll();setSection('now');","(async()=>{if(window.__MN_R6_BUILD__)return;configLoad();await openDB();await loadStored();renderAll();setSection('now');"),
          ("setTimeout(()=>{renderGlobalRange();renderAll()},0);","if(!window.__MN_R6_BUILD__)setTimeout(()=>{renderGlobalRange();renderAll()},0);"),
          ("window.addEventListener('hashchange',route391);","if(!window.__MN_R6_BUILD__)window.addEventListener('hashchange',route391);"),
          ("setTimeout(()=>{if(!location.hash)history.replaceState(null,'','#home');route391();$('#status').textContent='Connecting to market data…'},0);","if(!window.__MN_R6_BUILD__)setTimeout(()=>{if(!location.hash)history.replaceState(null,'','#home');route391();$('#status').textContent='Connecting to market data…'},0);")]
          for a,b in R:
            assert a in x,a[:50];x=x.replace(a,b,1)
          x=x.replace('<title>Market Navigator 3.9.7</title>','<title>Market Navigator Gate 4 R6</title>',1)
          x=x.replace('</head>','<link rel="stylesheet" href="market-view-gate4-r6.css"><script>window.__MN_R6_BUILD__=true;</script></head>',1).replace('</body>','<script src="market-view-gate4-r6-runtime.js"></script></body>',1)
          h.write_text(x)
          PY
          node --check market-view-gate4-r6-runtime.js
          ! grep -Eq 'finance\.yahoo\.com|fred\.stlouisfed\.org' market-view-gate4-r6-runtime.js
      - name: Browser qualification
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE";python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          cat >/tmp/pw/t.js <<'JS'
          const {chromium}=require('playwright'),die=m=>{throw Error(m)};(async()=>{const b=await chromium.launch({headless:true}),base='http://127.0.0.1:8765/';
          const q=await b.newPage({viewport:{width:1366,height:768}});await q.goto(base+'market-view-gate4-r3.html');const bg=await q.evaluate(()=>{const g=e=>{const r=e.getBoundingClientRect();return[r.x,r.y,r.width,r.height]};return{t:g(document.querySelector('.top')),s:g(document.querySelector('.side')),a:g(document.querySelector('.app'))}});await q.close();
          const p=await b.newPage({viewport:{width:1366,height:768}}),err=[],ext=[];p.on('pageerror',e=>err.push(String(e)));p.on('request',r=>{if(new URL(r.url()).origin!==new URL(base).origin)ext.push(r.url())});await p.goto(base+'market-view-gate4-r6.html');await p.waitForTimeout(3000);if(!await p.evaluate(()=>window.__MN_R6_READY__===true))die('boot '+await p.evaluate(()=>window.__MN_R6_ERROR__));const g=await p.evaluate(()=>{const f=e=>{const r=e.getBoundingClientRect();return[r.x,r.y,r.width,r.height]};return{t:f(document.querySelector('.top')),s:f(document.querySelector('.side')),a:f(document.querySelector('.app'))}});if(Math.abs(g.t[3]-bg.t[3])>1||Math.abs(g.s[2]-bg.s[2])>1||Math.abs(g.a[0]-bg.a[0])>1)die('baseline geometry');
          if((await p.locator('#globalRange button').allTextContents()).join('|')!=='1D|5D|MTD|YTD|1YR|3YR|5YR')die('horizons');await p.locator('[data-r6-index="risk"]').click();await p.waitForSelector('[data-r6-component]');if(await p.locator('[data-r6-component]').count()!==7)die('V2 count');const hit=await p.locator('[data-r6-component]').first().evaluate(e=>{const r=e.getBoundingClientRect();return document.elementFromPoint(r.x+r.width/2,r.y+r.height/2)===e});if(!hit)die('V2 component controls obscured');await p.locator('[data-r6-component]').first().click();await p.waitForSelector('.r6Conversation',{timeout:7000});if(!/VIX/i.test(await p.locator('#detailTitle').textContent()))die('V2→V3');if(await p.locator('.r6SummaryOverlay').count()!==1)die('overlay');const t=await p.locator('#detailTitle').textContent();await p.locator('.r6SummaryOverlay button').click();if(t!==await p.locator('#detailTitle').textContent())die('overlay state');await p.locator('#detailClose').click();await p.locator('#nav button[data-nav="providers"]').click();await p.waitForSelector('.r6HealthRow');const c=(await p.locator('.r6HealthRow[data-health-id="cpi"]').textContent()).toLowerCase();for(const x of ['why','chart impact','collector'])if(!c.includes(x))die('health '+x);await p.locator('#hamb').click();if(!await p.evaluate(()=>document.body.classList.contains('r6-rail-collapsed')))die('rail');if(ext.some(u=>/finance\.yahoo\.com|fred\.stlouisfed\.org/.test(u)))die('provider fanout');if(err.length)die('page errors '+err.join('|'));await p.close();
          const m=await b.newPage({viewport:{width:390,height:844}});await m.goto(base+'market-view-gate4-r6.html');await m.waitForTimeout(2500);if(!await m.evaluate(()=>window.__MN_R6_READY__===true))die('mobile boot');await m.locator('#hamb').click();if(!await m.evaluate(()=>document.body.classList.contains('drawer')))die('drawer');if(await m.locator('body').evaluate(e=>e.scrollWidth>e.clientWidth))die('mobile overflow');await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/pw/t.js
      - name: Data truth and publish
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,datetime
          from pathlib import Path
          ma=json.loads(Path('data/market-backend/macro-cache.json').read_text())['data'];mk=json.loads(Path('data/market-backend/market-cache.json').read_text())['data'];he=json.loads(Path('data/market-backend/source-health.json').read_text())['data'];c=ma['cpi']['points'];w=mk['wti']['daily'];assert c and w and c[-1]['t']<w[-1]['t'];assert he['macro:cpi']['http']==200 and he['macro:cpi']['lastSuccess'];assert datetime.datetime.fromtimestamp(c[-1]['t']/1000,datetime.timezone.utc).strftime('%Y-%m')>='2026-07'
          PY
          cat > MARKET-NAVIGATOR-GATE4-R6-VALIDATION.md <<EOF
          # Market Navigator Gate 4 R6 Validation
          Run: ${GITHUB_RUN_ID}
          Source: ${GITHUB_SHA}
          Baseline: 99a2e5ebec8e31afeca4bfe4a75a3de21fb749f1
          PASS: exact baseline/frame parity; canonical-only boot; seven horizons; V1; seven-component Risk V2; unobscured real V2→V3 click; Analysis conversation; dismissible state-invariant chart summary; causal CPI Health; desktop rail; mobile drawer/no overflow; no browser Yahoo/FRED reacquisition; CPI July-or-later; real CPI/WTI ending dates.
          Owner acceptance remains separate.
          EOF
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-view-gate4-r6.html market-view-gate4-r6-runtime.js MARKET-NAVIGATOR-GATE4-R6-VALIDATION.md
          git commit -m 'market: publish mechanically qualified Gate 4 R6'
          git push origin HEAD:main
