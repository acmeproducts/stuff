name: Rebuild SOT v0.3.1 build .4.4 from .3

on:
  push:
    paths:
      - '.github/workflows/sot-v031-b44-build-sync.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from exact .3 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='037a0198800f45e616596fc27efb562db5289fa6'
          git diff "$BASE" HEAD -- project.html > /tmp/approved-ui.delta || true
          git show "$BASE":project.html > project.html
          patch --silent -p1 < /tmp/approved-ui.delta

          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.html')
          s=p.read_text()
          # One authoritative UI build identifier.
          import re
          s=re.sub(r'Build: 2026\.08\.10\.[0-9.]+','Build: 2026.08.11.4.4',s,1)
          s=re.sub(r"BUILD_ID='2026\.08\.10\.[0-9.]+'","BUILD_ID='2026.08.11.4.4'",s,1)

          # UI and API are independently built artifacts. Same API contract/version
          # is compatible even when build timestamps differ.
          old="if(state.api.version!==APP_VERSION||state.api.build!==BUILD_ID)return`<div class=\"callout warn\"><strong>Version mismatch:</strong> UI ${esc(APP_VERSION)} / ${esc(BUILD_ID)} · API ${esc(state.api.version)} / ${esc(state.api.build)}</div>`;"
          new="if(state.api.version!==APP_VERSION)return`<div class=\"callout warn\"><strong>API version mismatch:</strong> UI ${esc(APP_VERSION)} · API ${esc(state.api.version)}. Builds: UI ${esc(BUILD_ID)} · API ${esc(state.api.build)}</div>`;"
          if old not in s:
              raise SystemExit('FAIL: version-mismatch baseline not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY

      - name: Update governance log
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md'); s=p.read_text()
          anchor='- **Browser SOT API URLs must stay under the public `/report` mount (`/report/api/sot/*`). Absolute `/api/sot/*` bypasses the report route and hits the OpenClaw root/gateway path.**\n'
          rules='''- **UI build ID and backend build ID are independent evidence fields. Compatibility is determined by the API contract/version, not equality of build timestamps. A UI-only release must not falsely report a version mismatch merely because the backend build is older.**\n- **The build shown in the HTML comment, visible UI, Settings, and debug log must come from the same `BUILD_ID` value for every candidate.**\n'''
          if rules.splitlines()[0] not in s:
              s=s.replace(anchor,anchor+rules)
          evidence='''\n## 1.9 Owner gate — build 2026.08.10.4.3 FAILED\n\nThe route correction worked, but the UI exposed two release-evidence defects: the HTML comment identified build `.4.3` while the runtime `BUILD_ID` still reported `.4`, and the UI treated a different backend build timestamp (`.4.2`) as an incompatibility even though both sides report API version `0.3.1`.\n\nThe replacement is rebuilt from exact `.3` bytes, reapplies the approved `.4` behavior, uses one authoritative UI build ID, and treats matching API version `0.3.1` as compatible while continuing to display both UI and API build identifiers for traceability.\n\n'''
          if '## 1.9 Owner gate — build 2026.08.10.4.3 FAILED' not in s:
              s=s.replace('# 2. RELEASE CHAIN',evidence+'# 2. RELEASE CHAIN')
          s=s.replace('single-file route-correct rebuild 2026.08.10.4.3 from .3 is the active candidate','build-evidence-correct rebuild 2026.08.11.4.4 from .3 is the active candidate')
          grave='''\n## G-016 — Requiring UI and API build IDs to be identical\n\n**Date buried:** 2026-08-11  \n**Status:** VETOED  \n**Approach:** report a version mismatch whenever the UI build timestamp differs from the backend build timestamp.  \n**Why buried:** UI-only releases legitimately change the UI build without changing the API implementation; equal API contract/version is the compatibility boundary.  \n**Replacement:** compare API version/contract for compatibility and display both build IDs separately as trace evidence.\n\n'''
          if '## G-016 — Requiring UI and API build IDs to be identical' not in s:
              s=s.replace('# 8. DONE / CURRENT IMPLEMENTATION LEDGER',grave+'# 8. DONE / CURRENT IMPLEMENTATION LEDGER')
          p.write_text(s)
          PY

      - name: Gate candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          assert 'Build: 2026.08.11.4.4' in s
          assert "BUILD_ID='2026.08.11.4.4'" in s
          assert "FS_API='/report/api/sot/fs'" in s
          assert "PROJECT_API='/report/api/sot/projects'" in s
          assert 'state.api.version!==APP_VERSION||state.api.build!==BUILD_ID' not in s
          assert 'state.api.version!==APP_VERSION' in s
          assert 'Added to project' in s and 'Save selections' in s and 'Review project' in s
          m=re.search(r'<script>(.*?)</script>',s,re.S); assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          ! grep -qiE '8081|uvicorn|fastapi|file_browser' project.html

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-b44-build-sync.yml
          git add project.html project-backlog.md
          git commit -m 'Rebuild SOT v0.3.1 build .4.4 from .3 baseline'
          git pull --rebase origin main
          git push origin HEAD:main
