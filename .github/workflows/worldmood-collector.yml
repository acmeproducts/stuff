name: WorldMood data collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "worldmood-collector.py"
      - ".github/workflows/worldmood-collector.yml"

permissions:
  contents: write

concurrency:
  group: worldmood-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect and normalize GDELT data
        id: collect
        continue-on-error: true
        run: python3 worldmood-collector.py

      - name: Commit refreshed cache
        run: |
          if [ -z "$(git status --porcelain -- worldmood-data.json)" ]; then
            echo "No cache changes to commit."
            exit 0
          fi
          git config user.name "worldmood-bot"
          git config user.email "worldmood-bot@users.noreply.github.com"
          git add worldmood-data.json
          git commit -m "data: refresh WorldMood cache"
          git push

      - name: Report collector failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collector could not refresh any GDELT window. Existing cache was preserved where available."
          exit 1
