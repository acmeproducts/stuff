name: WorldPulse data collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "worldmood-collector.py"
      - ".github/workflows/worldmood-collector.yml"

permissions:
  contents: write

concurrency:
  group: worldpulse-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build rolling history and precomputed index
        id: collect
        run: python3 worldmood-collector.py

      - name: Commit refreshed WorldPulse data
        run: |
          if [ -z "$(git status --porcelain -- worldpulse-history.json worldpulse-index.json)" ]; then
            echo "No WorldPulse data changes to commit."
            exit 0
          fi
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add worldpulse-history.json worldpulse-index.json
          git commit -m "data: refresh WorldPulse rolling index"
          git pull --rebase origin main
          git push origin HEAD:main
