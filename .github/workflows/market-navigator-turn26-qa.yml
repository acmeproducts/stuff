name: Market Navigator Turn 26 QA
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-turn26-ship.html'
      - 'market-navigator-turn26-qa.mjs'
      - '.github/workflows/market-navigator-turn26-qa.yml'
      - 'market-evidence/**'
      - 'data/market-backend/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser qualification dependencies
        run: |
          npm install --no-save playwright@1.55.0 marked@15.0.12 dompurify@3.1.6
          npx playwright install --with-deps chromium
      - name: Run Turn 26 semantic qualification
        run: node market-navigator-turn26-qa.mjs
