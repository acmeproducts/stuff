name: Deploy Peace chat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-peace-chat.yml'
permissions:
  contents: read
concurrency:
  group: deploy-peace-chat
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: acmeproducts/joy
          ref: 478028cb1a103a9f972a4fcc5ff4a42b316c0b36
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify chat and worker contracts
        run: |
          node tests/peace.test.mjs
          node tests/peace-worker.test.mjs
      - name: Deploy existing gift-signal worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.156.2 deploy
      - name: Verify durable recovery in isolated room
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://gift-signal.myacctfortracking.workers.dev/signal';
          const session = 'peace-release-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT;
          const post = async body => {
            const response = await fetch(base, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ session, from: 'release-check', ...body }),
              signal: AbortSignal.timeout(20000)
            });
            assert.equal(response.status, 200, 'POST failed');
            assert.equal((await response.json()).ok, true);
          };
          const read = async room => {
            let cursor = null; const entries = [];
            do {
              const url = new URL(base);
              url.searchParams.set('session', room);
              url.searchParams.set('chat', '1');
              if (cursor !== null) url.searchParams.set('cursor', cursor);
              const response = await fetch(url, { signal: AbortSignal.timeout(20000) });
              assert.equal(response.status, 200, 'GET failed');
              const page = await response.json();
              assert.ok(Array.isArray(page.entries), 'Durable history endpoint missing');
              entries.push(...page.entries); cursor = page.cursor;
            } while (cursor !== null);
            return entries;
          };
          const entries = Array.from({length:310}, (_,i) => ({ id:'proof-'+i, senderId:'release-check', name:'Release check', ts:i+1, message:'yo--google' }));
          for (let i=0; i<entries.length; i+=50) await post({type:'chat-room-migrate',entries:entries.slice(i,i+50)});
          await post({type:'chat-room',id:'proof-0',text:'duplicate must not replace'});
          const recovered = await read(session);
          assert.equal(recovered.length,310);
          assert.equal(recovered.find(e=>e.id==='proof-0').message,'yo--google');
          await post({type:'chat-room-delete',from:'another-participant',id:'proof-0'});
          await post({type:'chat-room-migrate',entries:[entries[0]]});
          assert.equal((await read(session)).find(e=>e.id==='proof-0').deleted,true);
          // Verify the real room is recoverable without changing its contents.
          await read('relax:peace');
          console.log('PASS: production durable history, 310-entry pagination, deduplication, shared deletion, stale-import protection, and real-room read');
          JS
      - name: Record rollout result
        run: |
          echo '## Peace chat worker deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: acmeproducts/joy@478028cb1a103a9f972a4fcc5ff4a42b316c0b36' >> "$GITHUB_STEP_SUMMARY"
          echo 'Durable recovery checks passed against the deployed worker. Publish the matching peace.html after this job succeeds.' >> "$GITHUB_STEP_SUMMARY"
