name: Market Navigator R7 governance correction
on:
  push:
    paths: ['.github/workflows/market-navigator-r7-governance-correction.yml']
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - run: |
          set -euo pipefail
          if ! grep -q 'G4-R6-C1 — Owner correction to analytical journey' MARKET-NAVIGATOR-GRAVEYARD.md; then
            cat >> MARKET-NAVIGATOR-GRAVEYARD.md <<'EOF'

## G4-R6-C1 — Owner correction to analytical journey

The owner clarified after R6 rejection that the accepted analytical lineage is the previously accepted chart model:

**V1 Market + V2 selected Index together in NOW → direct V2 component → exact V3 Component Analysis → additive/multi-series Analysis.**

Historical V4 capability is collapsed into V3. Historical V5 is abandoned.

This correction supersedes any earlier R6 recovery wording that proposed inserting an About → More info step between V2 and V3. The failure in R6 was not that it navigated directly from a component toward Analysis; the failure was that it abandoned the accepted V1+V2 simultaneous NOW composition, collapsed/reshaped the product into implementation-driven modal behavior, drifted the component definitions, shipped contradictory data-health classifications, and split AI validation state from AI execution state.

### Rejected from this point forward
- V1 disappearing when an index is selected.
- V1 and V2 as peer top-level product pages rather than simultaneous NOW composition.
- Any replacement hierarchy inserted between V2 and the exact V3 component unless explicitly approved later.
- Recreating historical V4 or V5 as separate product states.
- Treating implementation-shaped modal navigation as permission to alter the accepted product lineage.
EOF
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add MARKET-NAVIGATOR-GRAVEYARD.md
            git commit -m 'market: correct graveyard to accepted V1-V3 journey'
            git push origin HEAD:main
          fi
