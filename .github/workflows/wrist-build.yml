name: Wrist watch app build
# Builds the Wear OS app in wrist/ with the plain Android SDK tools and writes the
# result (wrist/out/wrist.apk + wrist/out/BUILD-LOG.md) back to the same branch,
# so the owner has a download link and the log can be read from the repo.
on:
  push:
    branches: [main, 'wrist-**']
    paths:
      - 'wrist/app/**'
      - 'wrist/test/**'
      - 'wrist/build.sh'
      - '.github/workflows/wrist-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wrist-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        run: |
          mkdir -p wrist/out
          set +e
          bash wrist/build.sh "${{ github.run_number }}" "turn06-b${{ github.run_number }}" > /tmp/build.txt 2>&1
          code=$?
          set -e
          cat /tmp/build.txt
          {
            echo "# Wrist build log"
            echo ""
            echo "Run ${{ github.run_number }}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ), exit $code"
            echo ""
            echo '```'
            tail -c 60000 /tmp/build.txt
            echo '```'
          } > wrist/out/BUILD-LOG.md
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish the result to the branch
        if: always()
        run: |
          git config user.name acmeproducts
          git config user.email 182510673+acmeproducts@users.noreply.github.com
          git add wrist/out/BUILD-LOG.md
          if [ -f wrist/out/wrist.apk ]; then git add wrist/out/wrist.apk; fi
          if ! git diff --staged --quiet; then
            git commit -q -m "wrist build ${{ github.run_number }} [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
      - name: Fail if the build failed
        run: test "${{ steps.build.outputs.code }}" = "0"
