name: Synchronize verified Market Navigator chart data
on:
  push:
    branches: [main]
    paths: ['market-navigator-sync/**', '.github/workflows/market-navigator-sync.yml', 'market-navigator-chart-correction-*.cjs', 'market-navigator-chart-selector-tests.cjs', 'market-navigator-chart-correction-build.py', 'market-navigator-chart-correction/**', 'market-navigator-acceptance/**', 'market-navigator-chart-contract-tests.cjs', 'market-navigator-chart-presentation-tests.cjs', 'MARKET-NAVIGATOR-CHART-OWNER-CLARIFICATIONS.md', 'MARKET-VIEW-CHART-ACCEPTANCE-MATRIX.md', 'MARKET-NAVIGATOR-NOW-EXPLORE-CONTRACT.md', 'MARKET-NAVIGATOR-PERSISTENT-INDEX-SPEC.md']
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Recheck all approved source histories'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: market-navigator-verified-data-sync
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.data.outputs.changed }}
      publication: ${{ steps.publish.outputs.sha }}
      containment: ${{ steps.contain.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce approved chart and source pins
        run: python market-navigator-sync/rebuild_chart.py
      - name: Update and revision regressions, with failed-publication isolation
        if: github.event_name != 'schedule'
        run: |
          python market-navigator-sync/test_sync.py
          python market-navigator-sync/test_vintage.py
          python market-navigator-sync/test_publish.py
          python market-navigator-sync/test_release_probe.py
          python market-navigator-sync/test_freshness.py
          node market-navigator-sync/test_consumer_freshness.cjs
      - name: Synchronize and independently qualify sources, horizons and indices
        id: data
        env:
          MARKET_NAVIGATOR_FRED_API_KEY: ${{ secrets.MARKET_NAVIGATOR_FRED_API_KEY }}
          MARKET_NAVIGATOR_FRED_API_KEY_SECONDARY: ${{ secrets.MARKET_NAVIGATOR_FRED_API_KEY_SECONDARY }}
          FORCE_CHECK: ${{ inputs.force || github.event_name == 'push' }}
        run: |
          python - <<'PY'
          import os,subprocess,sys
          import importlib.util,datetime,json
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('vintage_access',Path('market-navigator-sync/market-navigator-vintage-sidecar.py').resolve())
          api=importlib.util.module_from_spec(spec);spec.loader.exec_module(api)
          Path('.sync-publish').mkdir(exist_ok=True)
          previous=Path.cwd();os.chdir('.sync-publish')
          try:
              result=api.get_json({'series_id':'DFF','observation_start':(datetime.date.today()-datetime.timedelta(days=14)).isoformat()})
              if not result.get('observations'):raise RuntimeError('Configured vintage credential returned no observations')
              Path('vintage-access.json').write_text(json.dumps({'status':'PASS','provider':'FRED/ALFRED','credentialConfigured':True,'responses':api.RESPONSE_REFS}))
          except Exception as error:
              message=str(error)
              for name in ('MARKET_NAVIGATOR_FRED_API_KEY','MARKET_NAVIGATOR_FRED_API_KEY_SECONDARY'):
                  secret=os.environ.get(name)
                  if secret:message=message.replace(secret,'[redacted]')
              code='FRED_MAINTENANCE' if 'FRED_MAINTENANCE' in message else 'PROVIDER_ACCESS_FAILED'
              Path('sync-status.json').write_text(json.dumps({'status':'BLOCKED','error':message,'displayPermitted':False,'diagnostic':{'code':code,'provider':'FRED','stage':'provider access','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}}))
              raise RuntimeError(message) from None
          finally:os.chdir(previous)
          args=[sys.executable,'market-navigator-sync/run.py','--base','market-navigator-throwaway-review','--output','.sync-publish/market-navigator-throwaway-review']
          if os.environ.get('FORCE_CHECK')=='true': args.append('--force')
          subprocess.run(args,check=True)
          status=json.loads(Path('.sync-publish/sync-status.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('changed='+str(not status.get('unchanged',False)).lower()+'\n')
          PY
      - uses: actions/setup-node@v4
        if: steps.data.outputs.changed == 'true'
        with:
          node-version: '22'
      - name: Install browser verification
        if: steps.data.outputs.changed == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/mn-browser" playwright
          "$RUNNER_TEMP/mn-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify unchanged approved chart with synchronized data
        if: steps.data.outputs.changed == 'true'
        env:
          MN_PLAYWRIGHT_MODULE: ${{ runner.temp }}/mn-browser/node_modules/playwright
          MN_BROWSER_CHANNELS: chromium
          MN_SYNC_BROWSER_ROOT: .sync-publish/market-navigator-throwaway-review
          MN_CHART_CANDIDATE_ROOT: .sync-publish/market-navigator-throwaway-review
        run: |
          node market-navigator-acceptance/run.cjs
      - name: Publish one qualified data tree, preserving every other project
        id: publish
        if: steps.data.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import json,subprocess,shutil,hashlib
          from pathlib import Path
          old=json.loads(Path('market-navigator-throwaway-review/connection.json').read_text())['data_version']
          subprocess.run(['git','fetch','origin','main'],check=True)
          subprocess.run(['git','switch','-c','verified-sync-publication','FETCH_HEAD'],check=True)
          construction=json.loads(Path('.evidence/chart-construction-proof.json').read_text())
          for path,digest in construction['input_hashes'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest()!=digest:raise SystemExit('Concurrent chart constructor change; publication preserved')
          current=json.loads(Path('market-navigator-throwaway-review/connection.json').read_text())['data_version']
          if old!=current:raise SystemExit('Published data changed concurrently; preserving it for the next scheduled run.')
          shutil.copytree('.sync-publish/market-navigator-throwaway-review','market-navigator-throwaway-review',dirs_exist_ok=True)
          shutil.copy2('.sync-publish/sync-status.json','market-navigator-sync-status.json')
          PY
          git config user.name 'Market Navigator verified synchronization'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- market-navigator-throwaway-review market-navigator-sync-status.json market-navigator-sync/approved-chart.html market-navigator-sync/run.py market-navigator-sync/browser.cjs market-navigator-sync/verify_public.py market-navigator-sync/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize verified chart sources, horizon aggregates and indices [skip ci]'
            python market-navigator-sync/push_verified.py
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record failed verification without replacing chart data
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          from pathlib import Path
          status={'status':'FAIL','lastVerifiedVersionPreserved':True,'run':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          p=Path('.sync-publish/sync-status.json')
          if p.exists():status['detail']=json.loads(p.read_text())
          p.parent.mkdir(exist_ok=True);p.write_text(json.dumps(status))
          url=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/contents/market-navigator-sync-status.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          body={'message':'Record failed data synchronization; preserve verified chart','content':base64.b64encode((json.dumps(status)+'\n').encode()).decode(),'branch':'main'}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as r:body['sha']=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(body).encode(),headers=headers,method='PUT'),timeout=30) as r:assert r.status in (200,201)
          PY
      - name: Withhold incomplete data from live consumers
        id: contain
        if: failure()
        run: |
          python market-navigator-sync/test_freshness.py
          node market-navigator-sync/test_consumer_freshness.cjs
          npm install --prefix "$RUNNER_TEMP/mn-browser" playwright
          "$RUNNER_TEMP/mn-browser/node_modules/.bin/playwright" install --with-deps chromium
          MN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mn-browser/node_modules/playwright" MN_BROWSER_CHANNELS=chromium node market-navigator-sync/test_blocked_browser.cjs
          python - <<'PY'
          import sys,json,subprocess,hashlib
          from pathlib import Path
          sys.path.insert(0,'market-navigator-sync')
          import historical
          candidates=sorted(Path('.sync-publish/rejected-evidence').glob('*'))
          source=candidates[-1] if candidates else Path('market-navigator-throwaway-review/market-navigator-rebuild-data')
          try:historical.build('market-navigator-throwaway-review',source,'.sync-publish/historical')
          except Exception as error:
              Path('.evidence/historical-unavailable.json').write_text(json.dumps({'status':'UNAVAILABLE','error':str(error)}))
              print('No complete historical package qualified; live containment remains mandatory.')
          PY
          MN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/mn-browser/node_modules/playwright" MN_BROWSER_CHANNELS=chromium node market-navigator-sync/test_historical_browser.cjs
          python - <<'PY'
          import json,subprocess,hashlib,shutil
          from pathlib import Path
          app=Path('.evidence/chart-correction-candidate/throwaway.html').read_bytes()
          proof=json.loads(Path('.evidence/chart-construction-proof.json').read_text())
          subprocess.run(['git','fetch','origin','main'],check=True)
          subprocess.run(['git','switch','-C','withhold-incomplete-data','FETCH_HEAD'],check=True)
          for path,digest in proof['input_hashes'].items():
              if hashlib.sha256(Path(path).read_bytes()).hexdigest()!=digest:raise SystemExit('Concurrent constructor change; containment not published')
          target=Path('market-navigator-throwaway-review')
          if Path('.sync-publish/historical').exists():shutil.copytree('.sync-publish/historical',target/'previous',dirs_exist_ok=True)
          (target/'throwaway.html').write_bytes(app)
          connection=json.loads((target/'connection.json').read_text())
          connection.update(status='BLOCKED',displayPermitted=False,application_blob=hashlib.sha1(b'blob '+str(len(app)).encode()+b'\0'+app).hexdigest(),reason='ETL did not establish a complete current package. Live chart and analysis consumers are withheld.')
          (target/'connection.json').write_text(json.dumps(connection,sort_keys=True)+'\n')
          PY
          git config user.name 'Market Navigator verified synchronization'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- market-navigator-throwaway-review/throwaway.html market-navigator-throwaway-review/connection.json market-navigator-throwaway-review/previous
          if ! git diff --cached --quiet; then
            git commit -m 'Withhold incomplete live data pending strict ETL qualification [skip ci]'
            python market-navigator-sync/push_verified.py
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Retain synchronization evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-navigator-sync-evidence
          path: |
            .sync-publish/rejected-evidence/
            .sync-publish/sync-status.json
            .sync-publish/vintage-access.json
            .sync-publish/market-evidence/
            .evidence/chart-correction-*.json
            .evidence/chart-selector-tests.json
            .evidence/chart-construction-proof.json
            .evidence/chart-cumulative-acceptance.json
            .evidence/chart-contract-tests.json
            .evidence/chart-period-audit.json
            .evidence/period-*.png
            .evidence/withheld-*.png
            .evidence/historical-*.png
            .evidence/historical-acceptance.json
            .evidence/chart-presentation-tests.json
            .evidence/presentation-*.png
          include-hidden-files: true
          retention-days: 14
  deploy:
    needs: synchronize
    if: always() && (needs.synchronize.outputs.publication != '' || needs.synchronize.outputs.containment != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.synchronize.outputs.publication || needs.synchronize.outputs.containment }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy verified data publication
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify actual public chart and data version
        if: needs.synchronize.outputs.publication != ''
        run: python market-navigator-sync/verify_public.py

      - name: Verify incomplete publication is withheld
        if: needs.synchronize.outputs.containment != ''
        run: python market-navigator-sync/verify_blocked.py
