name: Market Navigator Turn 37 Stage 1 Map
on:
  push:
    paths:
      - 'market-navigator-turn37-stage1-map.json'
      - 'market-navigator-turn37-stage1-gate.mjs'
      - '.github/workflows/market-navigator-turn37-stage1.yml'
      - 'MARKET-NAVIGATOR-TURN37-RCA-PLAN.md'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify accepted baseline
        run: test "$(git hash-object market-navigator-turn28-post-ship.html)" = "9ce7f67451f9e1b7804927ce5c56adb667614724"
      - name: Verify dependency map
        run: node market-navigator-turn37-stage1-gate.mjs
