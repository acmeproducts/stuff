name: Market Navigator Turn 37 Stage 1 Dependency Map
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-turn37-stage1-dependency-map.json'
      - 'market-navigator-turn37-stage1-qa.py'
      - '.github/workflows/market-navigator-turn37-stage1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Accepted baseline identity
        run: test "$(git hash-object market-navigator-turn28-post-ship.html)" = "9ce7f67451f9e1b7804927ce5c56adb667614724"
      - name: Validate dependency map
        run: python market-navigator-turn37-stage1-qa.py
