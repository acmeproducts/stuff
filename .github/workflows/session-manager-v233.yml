name: Session Manager v2.3.3 final focused update

on:
  push:
    branches:
      - agent/session-manager-v233-new-chat-inline-rename

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-manager-v233-new-chat-inline-rename
          fetch-depth: 0

      - name: Verify exact v2.3.2 input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object session-manager-v3.html)" = "88e3188452394131a85bc80e4691175c997b9422"

      - name: Apply v2.3.3 focused patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('session-manager-v3.html')
          before = path.read_text(encoding='utf-8')
          s = before

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Visible/source build version only. Protocol client version remains frozen at APP_VERSION 2.3.0.
          count = s.count('v2.3.2')
          if count < 2:
              raise SystemExit(f'expected v2.3.2 build markers, found {count}')
          s = s.replace('v2.3.2', 'v2.3.3')
          replace_once("const BUILD_VERSION='2.3.2';", "const BUILD_VERSION='2.3.3';", 'BUILD_VERSION')

          # Make the session name itself the rename affordance and remove the pencil UI.
          replace_once(
              '.label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}',
              '.label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:text}.label:hover{text-decoration:underline;text-underline-offset:3px}',
              'label CSS'
          )
          replace_once(
              '.labelWrap.editing .label,.labelWrap.editing .renameBtn{display:none}.labelWrap.editing .renameInput{display:block}.renameBtn{border:0;background:transparent;color:#6f6f7a;padding:0 3px;opacity:0;font-size:11px}.session:hover .renameBtn,.session.active .renameBtn{opacity:1}.renameBtn:hover{color:var(--am)}',
              '.labelWrap.editing .label{display:none}.labelWrap.editing .renameInput{display:block}',
              'rename CSS'
          )
          replace_once(
              '<span class="label">${esc(name(s))}</span>',
              '<span class="label" title="Click to rename" role="button" tabindex="0">${esc(name(s))}</span>',
              'rename label markup'
          )
          replace_once(
              '<button class="renameBtn" title="Rename session">✎</button>',
              '',
              'rename pencil markup'
          )
          replace_once(
              ",btn=n.querySelector('.renameBtn'),del=n.querySelector('.trashBtn')",
              ",label=n.querySelector('.label'),del=n.querySelector('.trashBtn')",
              'rename event variable'
          )
          replace_once(
              "e.target===input||e.target===btn||e.target===del",
              "e.target===input||e.target===label||e.target===del",
              'row click exclusion'
          )
          replace_once(
              "btn.onclick=e=>{e.stopPropagation();beginRename(k,n)};",
              "label.onclick=e=>{e.stopPropagation();beginRename(k,n)};label.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();beginRename(k,n)}};",
              'label rename handler'
          )

          # Add a prominent native New chat control to the existing left-panel header.
          replace_once(
              '<span class="grow"></span><button class="btn" id="refresh" title="Refresh">↻</button>',
              '<span class="grow"></span><button class="btn newChatBtn" id="newChat" title="Start a new chat" aria-label="Start a new chat">+ New</button><button class="btn" id="refresh" title="Refresh">↻</button>',
              'new chat button'
          )
          replace_once(
              '.btn:disabled{opacity:.45;cursor:not-allowed}#menu{',
              '.btn:disabled{opacity:.45;cursor:not-allowed}.newChatBtn{white-space:nowrap;font-weight:800}#menu{',
              'new chat CSS'
          )

          # OpenClaw 2026.5.19 supports sessions.create natively. With no key it creates a dashboard session for the default agent.
          marker = 'function trashStore(){'
          if s.count(marker) != 1:
              raise SystemExit('newChat insertion marker missing or ambiguous')
          new_chat = """async function newChat(){if(!state.connected){toast('Gateway is not connected','err');return}let b=$('newChat');if(b)b.disabled=true;try{let r=await rpc('sessions.create',{label:'New chat'},20000),key=String(r?.key||'').trim();if(!key)throw Error('sessions.create returned no session key');await loadSessions();let created=state.sessions.find(x=>x.key===key);if(!created){created=norm({key,label:'New chat',sessionId:r?.sessionId||r?.entry?.sessionId||null,updatedAt:Date.now()});state.sessions.unshift(created);renderSessions()}await select(key);$('message').focus();clearError();toast('New chat created','ok');dbg('SESS','New chat created',{key,sessionId:r?.sessionId||r?.entry?.sessionId||null})}catch(e){showError('New chat failed: '+e.message);toast('New chat failed: '+e.message,'err')}finally{updateComposer()}}\n"""
          s = s.replace(marker, new_chat + marker, 1)

          # Keep New chat disabled until the proven Gateway handshake is complete.
          replace_once(
              "function updateComposer(){let s=!!state.current,w=canWrite(),working=s&&sessionState(state.current.key,state.current)==='working';",
              "function updateComposer(){let s=!!state.current,w=canWrite(),working=s&&sessionState(state.current.key,state.current)==='working';if($('newChat'))$('newChat').disabled=!state.connected;",
              'new chat connection state'
          )
          replace_once(
              "function bind(){$('menu').onclick=toggleSidebar;$('settings').onclick=settings;",
              "function bind(){$('menu').onclick=toggleSidebar;$('settings').onclick=settings;$('newChat').onclick=newChat;",
              'new chat binding'
          )

          # Guard the subsystems this patch is not allowed to change.
          def function_line(text, name):
              m = re.search(rf'^(?:async )?function {re.escape(name)}\([^\n]*$', text, re.M)
              if not m:
                  raise SystemExit(f'protected function not found: {name}')
              return m.group(0)

          protected = [
              'identity','deviceToken','saveDeviceToken','connectParams','rpc','rejectPending',
              'connect','handleConnectError','schedule','reconnect','hostingDefaultGateway','loadSettings'
          ]
          for name in protected:
              if function_line(before, name) != function_line(s, name):
                  raise SystemExit(f'protected function changed: {name}')

          if "const APP_VERSION='2.3.0'" not in s:
              raise SystemExit('protocol APP_VERSION changed')
          if 'renameBtn' in s:
              raise SystemExit('pencil rename affordance still present')
          if "rpc('sessions.create',{label:'New chat'},20000)" not in s:
              raise SystemExit('native sessions.create new-chat path missing')
          if 'id="newChat"' not in s:
              raise SystemExit('New chat control missing')
          if 'title="Click to rename" role="button" tabindex="0"' not in s:
              raise SystemExit('click-to-rename affordance missing')
          if 'function hostingDefaultGateway()' not in s:
              raise SystemExit('GitHub Pages hosting bootstrap missing')

          path.write_text(s, encoding='utf-8', newline='')
          print('v2.3.3 semantic/protected-function patch checks PASS')
          PY

      - name: Syntax and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text(encoding='utf-8')
          assert 'Session Manager <span class="version">v2.3.3</span>' in s
          assert "const BUILD_VERSION='2.3.3';" in s
          assert "const APP_VERSION='2.3.0'" in s
          assert "rpc('sessions.create',{label:'New chat'},20000)" in s
          assert 'renameBtn' not in s
          assert 'id="newChat"' in s
          assert 'function hostingDefaultGateway()' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(scripts)==1
          Path('/tmp/session-manager-v233.js').write_text(scripts[0],encoding='utf-8')
          print('HTML semantic gates PASS')
          PY
          node --check /tmp/session-manager-v233.js
          echo 'JavaScript syntax PASS'

      - name: Commit candidate and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'acmeproducts'
          git config user.email '182510693+acmeproducts@users.noreply.github.com'
          git rm .github/workflows/session-manager-v233.yml
          git add session-manager-v3.html
          git commit -m 'Session Manager v2.3.3 new chat and click-to-rename'
          git push origin HEAD:agent/session-manager-v233-new-chat-inline-rename
