name: WorldPulse v1.7.0 performance patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldpulse-v170-performance.yml'
      - 'worldpulse-v170-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 worldpulse-v170-patch.py

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('globe.html').read_text(encoding='utf-8')
          assert 'WorldPulse v1.7.0' in s
          assert 'function enterBrowseMode()' in s
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/worldpulse.js').write_text(scripts[-1],encoding='utf-8')
          raise SystemExit(subprocess.run(['node','--check','/tmp/worldpulse.js']).returncode)
          PY

      - name: Commit v1.7.0
        run: |
          git config user.name worldpulse-bot
          git config user.email worldpulse-bot@users.noreply.github.com
          git add globe.html
          git rm worldpulse-v170-patch.py
          git rm .github/workflows/worldpulse-v170-performance.yml
          git commit -m "perf: WorldPulse v1.7.0 fast region reader workspace"
          git pull --rebase origin main
          git push
