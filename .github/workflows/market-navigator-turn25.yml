name: Market Navigator Turn 25 cumulative qualification

on:
  push:
    branches:
      - market-navigator-turn25-consolidation
      - main
    paths:
      - 'market-navigator-turn25-governance.py'
      - 'market-navigator-build-turn25.py'
      - 'market-navigator-finalize-turn25.py'
      - 'market-navigator-turn25-qa.mjs'
      - 'market-navigator-turn25-pre-ship.html'
      - '.github/workflows/market-navigator-turn25.yml'
      - 'MARKET-NAVIGATOR-MASTER-PLAN.md'
      - 'MARKET-NAVIGATOR-GRAVEYARD.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    if: ${{ !contains(github.event.head_commit.message || '', '[turn25-generated]') && !contains(github.event.head_commit.message || '', '[turn25-governance]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cumulative governance
        run: |
          set -euo pipefail
          python3 market-navigator-turn25-governance.py
          grep -F '## 24. Turn 25 cumulative consolidation' MARKET-NAVIGATOR-MASTER-PLAN.md
          grep -F '## 26. Library Print — binding Turn 25 report contract' MARKET-NAVIGATOR-MASTER-PLAN.md
          grep -F '## Turn 25 permanent cumulative-release rule' MARKET-NAVIGATOR-GRAVEYARD.md
          grep -F '## Permanent Library Print prohibitions' MARKET-NAVIGATOR-GRAVEYARD.md
      - name: Build exact-baseline Turn 25 candidate
        id: build
        run: |
          set -uo pipefail
          committed="$(git rev-parse HEAD:market-navigator-turn18-pre-ship.html)"; test "$committed" = '4a52c7e764513024176aea80cc13c56e05370c11' || exit 97
          git show HEAD:market-navigator-turn18-pre-ship.html > market-navigator-turn18-pre-ship.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market-navigator-build-turn25.py');s=p.read_text();old="one('Market Navigator · Turn 18','Market Navigator · Turn 25','title')";new="assert s.count('Market Navigator · Turn 18')>=1;s=s.replace('Market Navigator · Turn 18','Market Navigator · Turn 25',1)"
          if old in s:p.write_text(s.replace(old,new,1))
          f=Path('market-navigator-finalize-turn25.py');z=f.read_text();anchor="pos=s.rfind('</script>')";patch="print_js=print_js.replace(\"$(\",\"document.getElementById(\")\n";assert anchor in z
          if patch not in z:z=z.replace(anchor,patch+anchor,1)
          f.write_text(z)
          PY
          python3 market-navigator-build-turn25.py > market-navigator-turn25-build-failure.txt 2>&1; rc=$?
          if [ "$rc" -eq 0 ]; then python3 market-navigator-finalize-turn25.py >> market-navigator-turn25-build-failure.txt 2>&1; rc=$?; fi
          if [ "$rc" -eq 0 ]; then
            python3 - <<'PY' >> market-navigator-turn25-build-failure.txt 2>&1
          from pathlib import Path
          app=Path('market-navigator-turn25-pre-ship.html');s=app.read_text();anchor="function currentAnalysis(){return analyses().find(x=>x.id===S.activeAnalysis&&!x.deletedAt)}";assert s.count(anchor)==1;s=s.replace(anchor,anchor+"window.__mnCurrentAnalysis=currentAnalysis;",1)
          a=s.index('function printContextRows25(');b=s.index("window.addEventListener('afterprint'",a);s=s[:a]+s[a:b].replace('currentAnalysis()','window.__mnCurrentAnalysis()')+s[b:]
          old="function printLibraryAnalysis25(){let before=window.__mnCurrentAnalysis(),beforeJson=before?JSON.stringify(before):null;buildLibraryPrintReport25();window.__libraryPrintInvariant25={id:before?.id||null,before:beforeJson};window.print();let after=window.__mnCurrentAnalysis();window.__libraryPrintInvariant25.after=after?JSON.stringify(after):null;return window.__libraryPrintInvariant25}"
          new="async function printLibraryAnalysis25(){let before=window.__mnCurrentAnalysis(),beforeJson=before?JSON.stringify(before):null;buildLibraryPrintReport25();let img=document.getElementById('libraryPrintChart');if(img&&img.src){try{if(img.decode)await img.decode();else if(!img.complete)await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject})}catch(e){cleanupLibraryPrint25();throw new Error('Frozen Library chart could not be prepared for printing.')}}await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));window.__libraryPrintInvariant25={id:before?.id||null,before:beforeJson};window.print();let after=window.__mnCurrentAnalysis();window.__libraryPrintInvariant25.after=after?JSON.stringify(after):null;return window.__libraryPrintInvariant25}"
          assert s.count(old)==1;s=s.replace(old,new,1)
          old="if(document.getElementById('libPrint'))document.getElementById('libPrint').onclick=()=>{document.getElementById('libMenu')?.classList.add('hidden');printLibraryAnalysis25()};";new="if(document.getElementById('libPrint'))document.getElementById('libPrint').onclick=async()=>{document.getElementById('libMenu')?.classList.add('hidden');await printLibraryAnalysis25()};";assert s.count(old)==1;s=s.replace(old,new,1)
          # Library continuation: persist an explicit Processing… assistant turn, bind completion to the launching Analysis,
          # and never introduce a global busy lock. Existing async provider work continues independently of navigation.
          hs=s.index("$('send').onclick=async()=>");he=s.index('function renderHealth',hs);h=s[hs:he]
          needle="a.status='processing';"
          assert h.count(needle)==1,('chat processing anchor',h.count(needle))
          h=h.replace(needle,"let processingId='processing-'+Date.now()+'-'+Math.random().toString(36).slice(2);a.turns.push({id:processingId,role:'assistant',content:'Processing…',at:new Date().toISOString(),processing:true});a.status='processing';",1)
          assert h.count("saved.status='ready';")==1
          h=h.replace("saved.status='ready';","saved.turns=saved.turns.filter(t=>t.id!==processingId);saved.status='ready';",1)
          if "saved.status='failed';" in h:h=h.replace("saved.status='failed';","saved.turns=saved.turns.filter(t=>t.id!==processingId);saved.status='failed';",1)
          s=s[:hs]+h+s[he:];app.write_text(s)
          qa=Path('market-navigator-turn25-qa.mjs');q=qa.read_text().replace('JSON.stringify(currentAnalysis())','JSON.stringify(window.__mnCurrentAnalysis())').replace("for(let x of ['break-inside: avoid','page-break-inside: avoid','display: table-header-group'])","for(let x of ['break-inside: avoid','display: table-header-group'])")
          q=q.replace("await p.locator('#libMoreBtn').click();await p.locator('#libPrint').click();\n  assert.equal(await p.evaluate(()=>window.__printCount),1,'native print invoked exactly once');","await p.locator('#libMoreBtn').click();await p.locator('#libPrint').click();await p.waitForFunction(()=>window.__printCount===1);\n  assert.equal(await p.evaluate(()=>window.__printCount),1,'native print invoked exactly once');")
          q=q.replace("assert((await p.locator('#libraryPrintChart').getAttribute('src'))?.startsWith('data:image/png'),'exact rendered frozen chart captured');","assert((await p.locator('#libraryPrintChart').getAttribute('src'))?.startsWith('data:image/png'),'exact rendered frozen chart captured');let printImage=await p.locator('#libraryPrintChart').evaluate(img=>({complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}));assert(printImage.complete&&printImage.naturalWidth>0&&printImage.naturalHeight>0,`frozen chart decoded before native print ${JSON.stringify(printImage)}`);")
          # Observation counts are live evidence and must not be frozen to yesterday's count.
          q=q.replace('/observations: 2514.*provider: Yahoo Finance.*fallback: false.*enabled horizons:.*5D.*last success:/s','/observations: \\d+.*provider: Yahoo Finance.*fallback: false.*enabled horizons:.*5D.*last success:/s')
          # Runtime concurrency gate: delayed continuation must visibly show Processing…, allow NOW navigation,
          # and allow a second AI analysis to launch while the first request remains pending.
          gate=r'''
          async function parallelLibraryChatCase(){
            const reg={defaultProvider:'openrouter',providers:{openrouter:{verified:true,key:'qa-key',model:'qa-model',models:['qa-model']}}};
            const t=await makePage({width:412,height:915,registry:reg}),p=t.page;let calls=0;
            await p.unroute('https://openrouter.ai/api/v1/chat/completions');
            await p.route('https://openrouter.ai/api/v1/chat/completions',async r=>{calls++;await new Promise(x=>setTimeout(x,1800));await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({choices:[{message:{content:'# Parallel QA\n\nCompleted.'}}]})})});
            await injectTTSAnalysis(p);await p.reload({waitUntil:'networkidle'});if(await p.locator('#rail').evaluate(el=>el.classList.contains('closed')))await p.locator('#toggle').click();await p.locator('[data-view="library"]').click();await p.locator('#libList [data-id="qa-tts25"]').click();await p.locator('#compose').fill('Continue this analysis while I keep working.');await p.locator('#send').click();
            await p.waitForFunction(()=>document.querySelector('#transcript')?.textContent.includes('Processing…'));assert.equal(await p.locator('#send').isDisabled(),false,'chat processing does not globally disable composer');
            await p.locator('[data-view="now"]').click();await p.waitForFunction(()=>document.querySelector('#view-now')?.classList.contains('on'));assert.equal(await p.locator('#view-now').isVisible(),true,'NOW exploration remains interactive during chat processing');
            await p.locator('#nowMoreBtn').click();await p.locator('#nowAnalyze').click();await p.waitForFunction(()=>document.querySelector('#view-library')?.classList.contains('on'));await p.waitForFunction(()=>calls>=2);assert(calls>=2,'new analysis generation starts while Library continuation is still pending');
            await p.waitForFunction(()=>[...document.querySelectorAll('#libList .rowMeta')].some(x=>/ready/i.test(x.textContent)),{timeout:7000});assert.deepEqual(t.errors,[]);assert.deepEqual(t.failed,[]);await t.context.close();
          }
          '''
          assert 'try{' in q;q=q.replace('try{',gate+'\ntry{',1);q=q.replace('await ttsCase(false);await ttsCase(true);','await ttsCase(false);await ttsCase(true);await parallelLibraryChatCase();',1)
          qa.write_text(q);print('TURN 25 PRINT + PARALLEL CHAT QUALIFICATION: PASS')
          PY
            rc=$?
          fi
          cat market-navigator-turn25-build-failure.txt; exit "$rc"
      - name: Static and JavaScript gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn25-pre-ship.html').read_text()
          for x in ['Market Navigator · Turn 25','id="libraryPrintReport"','async function printLibraryAnalysis25','await img.decode()','window.__mnCurrentAnalysis=currentAnalysis',"content:'Processing…'",'processingId']:assert x in s,x
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I);Path('/tmp/mn25.js').write_text(scripts[-1])
          PY
          node --check /tmp/mn25.js
          node --check market-navigator-turn25-qa.mjs
      - name: Backend Sources truth gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          reg=json.loads(Path('data/market-backend/source-registry.json').read_text());dow=reg.get('aliases',{}).get('DOW|index');assert dow and dow['symbol']=='^DJI';ids={r.get('id') for r in reg.get('registrations',[])};assert {'custom_nvda','custom_v','custom_gaamhx'} <= ids
          PY
      - name: Install browser qualification
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run cumulative semantic browser matrix
        run: |
          set -euo pipefail
          python3 -m http.server 8123 >/tmp/mn25-server.log 2>&1 &
          MARKET_NAVIGATOR_URL=http://127.0.0.1:8123/market-navigator-turn25-pre-ship.html node market-navigator-turn25-qa.mjs
      - name: Publish exact qualified candidate
        if: github.ref_name == 'market-navigator-turn25-consolidation'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf node_modules
          git add market-navigator-turn25-pre-ship.html
          git diff --cached --quiet && exit 0
          git commit -m 'Market Navigator Turn 25 qualified print and parallel chat [turn25-generated]'
          git push origin HEAD:market-navigator-turn25-consolidation
