name: SOT Release D Qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - sot-release-d-job-queue
      - sot-release-d-volume-recovery
      - sot-release-d-queue-state
      - sot-release-d-parallel-queue-observability
      - sot-release-d-lifecycle-search-theme
      - sot-release-d-status-groups
      - sot-release-d-simplified-analysis-groups
      - sot-release-d-analysis-polish
    paths:
      - 'SOT/sot-turn02-release-d-engine.py'
      - 'SOT/sot-turn02-release-d-ai.py'
      - 'SOT/sot-turn02-release-d-server.py'
      - 'SOT/sot-turn02-release-d.html'
      - 'SOT/sot-turn02-release-d.service'
      - 'SOT/qualify-release-d.py'
      - 'install-SOT-turn02-release-d.sh'
      - '.github/workflows/sot-release-d-qualify.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Preserve Release C
        shell: bash
        run: |
          set -euo pipefail
          test -f SOT/sot-turn02-release-c-engine.py
          test -f SOT/sot-turn02-release-c-ai.py
          test -f SOT/sot-turn02-release-c-server.py
          test -f SOT/sot-turn02-release-c.html
          echo "PASS Release C rollback artifacts preserved"

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             SOT/sot-turn02-release-d-engine.py             SOT/sot-turn02-release-d-ai.py             SOT/sot-turn02-release-d-server.py             SOT/qualify-release-d.py
          echo "PASS Release D Python syntax"

      - name: Release D server volume fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("SOT/sot-turn02-release-d-server.py").read_text()
          required=[
            "def mounted_windows_drive_record",
            "identity_source",
            "verified_mount",
            "PowerShell/CIM inventory is unavailable",
            "cur[\"windows\"]=True",
          ]
          missing=[x for x in required if x not in s]
          assert not missing,missing
          print("PASS Release D verified-mount Windows identity contract")
          PY

      - name: Release D scheduler concurrency contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          engine=Path("SOT/sot-turn02-release-d-engine.py").read_text()
          server=Path("SOT/sot-turn02-release-d-server.py").read_text()
          service=Path("SOT/sot-turn02-release-d.service").read_text()
          required_engine=[
            "max_active_jobs=4",
            "def enqueue_info",
            "def pause_all",
            "def resume_all",
            "suppressed_source_count",
            "overlap_source_count",
            "known_remaining_files",
            "heartbeat=tick",
          ]
          missing=[x for x in required_engine if x not in engine]
          assert not missing,missing
          assert '/api/scheduler/control' in server
          assert 'SOT_MAX_ACTIVE_JOBS","4"' in server
          assert 'Environment=SOT_MAX_ACTIVE_JOBS=4' in service
          assert '"stall_seconds":self.stall' in engine
          print("PASS Release D parallel scheduler + dedupe + heartbeat contract")
          PY

      - name: Release D browser syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("SOT/sot-turn02-release-d.html").read_text()
          engine=Path("SOT/sot-turn02-release-d-engine.py").read_text()
          required=[
            "SOT Turn 02 Release D",
            "Kick off job",
            "/api/job/kickoff",
            "/api/jobs",
            "Abort + Delete",
            "Restart",
            "Comparison Sources",
            "Go!",
            "/api/ai/compare/enqueue",
            "/api/ai/compare/control",
            "seconds_per_media_minute",
            "Send",
            "It does not rescan files",
            "refreshCompareJobPanel",
            "Job log",
            "jobLogOpen=new Set()",
            "setJobLogOpen",
            "restoreAnalyzeUi",
            "Restart unavailable · no persisted source scope",
            "Pause All",
            "Start All",
            "schedulerToggle",
            "captureAnalyzeUi",
            "jobContents",
            "Queue overlap:",
            "known remaining",
            "compareLogOpen",
            "Deterministic outcome",
            "ffmpeg PASS",
            "Job content · ",
            "jobCardOpen",
            "jobCardDetails",
            "sourceCardOpen",
            "sourceCardDetails",
            "Soft Deleted",
            "Soft delete",
            "Permanently delete",
            "Restore",
            "/api/source/control",
            "omniSuggestInteracting",
            "touch-action:pan-y",
            "overscroll-behavior:contain",
            "config-tabs",
            "App colors",
            "Database zebra",
            "Database hover",
            "data-app-preset",
            "data-db-zebra",
            "data-db-hover",
            "jobGroupOpen",
            "sourceGroupOpen",
            "jobStatusGroup",
            "sourceStatusGroup",
            "renderJobStatusGroups",
            "renderSourceStatusGroups",
            "canonicalStatusBadge",
            "STATUS_GROUP_ORDER=['Action Needed','Running','Completed','Soft Deleted']",
            "Action Needed",
            "Running",
            "Completed",
            "Soft Deleted",
            "Raw job state",
            "Currentness",
            "sourceReadiness",
            "liveJobSourceIds",
            "queueSummaryText",
            "jobSubtitle",
            "Last successful analysis",
            "Latest error",
            "registered",
            "rows.length>0&&set.has(name)",
            "jobqueue .status-group.action-needed",
            ".jobcard[open]",
            "omniFolderScopes",
            "function folderScopeMatch",
            "omniChipHtml",
            "removeOmniFolderScope",
            "sf.name==='folder'",
            "result-count-export",
            "countPressStart",
            "Matching files / total files · long press to export",
            "a.length+' / '+placements.length",
            "diagnosticSnapshot",
            "diagnosticPublish",
            "/api/diagnostics/snapshot",
            "/api/diagnostics/publish",
          ]
          missing=[x for x in required if x not in s]
          assert not missing,missing
          rejected=[
            'onclick="registerSelected()">Register selected',
            "Refresh rescans these saved sources",
            "source_ids:pending.map",
            "STATUS_GROUP_ORDER=['Running','Stalled','Error','Completed','Soft Deleted']",
            "ageSec=src?.last_progress",
            "Registered source readiness",
            " · restart of '+String(j.parent_job_id)",
            ".jobqueue .status-group.action-needed{border-color:#8a4b4b}",
            "title=\"Export\" aria-label=\"Export\"",
            "a.length+(a.length>shown.length?' / '+shown.length:'')",
          ]
          present=[x for x in rejected if x in s]
          assert not present,present
          assert "f===r||f.startsWith(r+'/')" in s, "folder chips must scope to selected root or descendant"
          assert "vals=vals.filter(v=>!omniFolderScopes.some" in s, "selected folder paths must leave autocomplete"
          assert "a.length+' / '+placements.length" in s, "Database count must be matches / total loaded files"
          assert "toggleExportMenu()" not in s, "dedicated Database export trigger must be removed"
          assert "Create SQLite snapshot" in s and "Publish diagnostics" in s, "diagnostic controls missing"
          assert "completion_integrity_failed" in engine, "Analyze completion must reconcile persisted evidence"
          assert "job_completion_blocked" in engine, "false completion must be blocked and logged"
          assert "actual_files!=expected_discovered or actual_hashed!=expected_hashed or pending" in engine, "completion reconciliation predicate missing"
          assert "'AVAILABLE' if unchanged else 'PENDING'" in engine, "changed existing evidence must enter PENDING without erasing fingerprint"
          assert "SET fingerprint=?,content_id=?,lifecycle='HASHED',availability='AVAILABLE'" in engine, "successful rehash must atomically replace evidence"
          assert "SET fingerprint=NULL,content_id=NULL" not in engine, "Analyze must not destructively erase prior fingerprint evidence"
          assert "lifecycle='HASHED' AND availability='AVAILABLE' AND fingerprint IS NOT NULL" in engine, "completion must count only current available hashed evidence"
          source_card=s.split("function sourceCard(src)",1)[1].split("async function sourceAction",1)[0]
          assert "restartJob(" not in source_card, "Sources must not expose Restart/job execution controls"
          js=s.rsplit("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/sot-release-d.js").write_text(js)
          print("PASS Release D governed UI markers")
          PY
          node --check /tmp/sot-release-d.js

      - name: Release D behavioral qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 SOT/qualify-release-d.py

      - name: Installer syntax
        if: hashFiles('install-SOT-turn02-release-d.sh') != ''
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-SOT-turn02-release-d.sh
          echo "PASS Release D installer syntax"
