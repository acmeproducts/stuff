      - name: Syntax and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text(encoding='utf-8')
          gates={
            'visible version':'<span class="version">v2.3.5</span>',
            'build version':"const BUILD_VERSION='2.3.5';",
            'protocol identity':"const APP_VERSION='2.3.0'",
            'new chat':"rpc('sessions.create',{label:'New chat'},20000)",
            'pages bootstrap':'function hostingDefaultGateway()',
            'chrome controls':'achromebg',
            'system controls':'asystembg',
            'debug themed':'#debugPanel',
            'toast themed':'.toast{background:var(--p2)'
          }
          for name,needle in gates.items():
              if needle not in s: raise SystemExit(f'gate failed: {name}')
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(js)!=1: raise SystemExit(f'expected one script, got {len(js)}')
          Path('/tmp/session-manager-v235.js').write_text(js[0],encoding='utf-8')
          print('semantic gates PASS')
          PY
          node --check /tmp/session-manager-v235.js
          echo 'JavaScript syntax PASS'

      - name: Commit candidate and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'acmeproducts'
          git config user.email '182510693+acmeproducts@users.noreply.github.com'
          git rm .github/workflows/session-manager-v235-unified-appearance.yml
