name: Session Manager v2.3.5 unified appearance

on:
  push:
    branches:
      - agent/session-manager-v235-unified-appearance

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-manager-v235-unified-appearance
          fetch-depth: 0

      - name: Verify exact v2.3.4 input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object session-manager-v3.html)" = "4974617a3746e8d91cde558a1da5cb64a2c1e26a"

      - name: Apply unified appearance patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('session-manager-v3.html'); before=p.read_text(encoding='utf-8'); s=before
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, found {n}')
              s=s.replace(old,new,1)
          def fn(text,name):
              m=re.search(rf'(?:(?:async\s+)?function\s+{re.escape(name)}\s*\([^)]*\)\s*\{{)',text)
              if not m: raise SystemExit(f'protected function missing: {name}')
              i=m.start(); j=m.end(); depth=1; quote=None; esc=False
              while j<len(text) and depth:
                  c=text[j]
                  if quote:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}': depth-=1
                  j+=1
              if depth: raise SystemExit(f'unbalanced protected function: {name}')
              return text[i:j]
          protected=['identity','deviceToken','saveDeviceToken','connectParams','rpc','rejectPending','connect','handleConnectError','schedule','reconnect','hostingDefaultGateway','newChat','beginRename']
          protected_before={n:fn(before,n) for n in protected}
          if s.count('v2.3.4')<2: raise SystemExit('v2.3.4 build markers missing')
          s=s.replace('v2.3.4','v2.3.5')
          one('--system-bg:#121923;--system-text:#ffffff;--user-size:', '--system-bg:#121923;--system-text:#ffffff;--chrome-bg:#1b1e22;--chrome-text:#ffffff;--chrome-btn-bg:#101214;--chrome-btn-text:#ffffff;--chrome-btn-hover:#5bc0ff;--chrome-btn-hover-text:#00131f;--user-size:', 'root chrome vars')
