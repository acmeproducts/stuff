name: SOT 6.8 governance
on:
  push:
    paths:
      - '.github/workflows/sot-680-governance.yml'
permissions:
  contents: write
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record 6.8 owner direction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md'); s=p.read_text()
          block='''\n## 0.2D Multi-project fingerprinting + durable reporting ruling — 2026-08-19\n\n- The current Fingerprinting page incorrectly presents inventory completion (`folders_done / folders`) beside fingerprint completion as if they were one progress dimension. They are separate phases and must be labeled separately.\n- Primary fingerprint progress is **bytes fingerprinted / total inventoried bytes**. File count is secondary. Throughput and ETA are derived from bytes processed over elapsed fingerprint time.\n- Multiple projects may run concurrently, but worker count is global. A project does not own four independent workers. The first implementation uses one four-worker pool shared fairly across all WIP projects so project concurrency cannot multiply I/O concurrency without bound.\n- Durable `fingerprint_inventory` is the reporting authority for per-file detail. Reporting must not reread source volumes merely to display already-inventoried filename, relative path, size, modified date, hash, or status.\n- Reporting adopts a persistent **Project -> Folder -> File** model. Project search populates folder summaries; selecting a folder opens the file-detail table.\n- `repolist.html` is the approved interaction donor for the file table: omni-search, sortable columns, draggable column order, resizable columns, dense rows, persistent column preferences, and horizontal overflow. `repolist.html` itself remains unchanged.\n- The 6.8 candidate is `2026.08.19.6.8-wsl-multiproject-reporting`. It is reconstructed from the verified 6.6 pair plus reviewed 6.7/6.7.1/6.7.3 deltas and the 6.8 delta. Failed 6.7.4 is not a baseline.\n- Existing report-server topology remains locked: `openclaw-report-server.service`, port 18080, no extra HTTP service, no 8081/8082, no proxy/Tailscale change.\n- Detailed implementation contract: `SOT-6.8-MULTI-PROJECT-REPORTING-PLAN.md`.\n\n'''
          if '## 0.2D Multi-project fingerprinting + durable reporting ruling — 2026-08-19' not in s:
              s=s.replace('## 0.3 Established plumbing — keep',block+'## 0.3 Established plumbing — keep',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-backlog.md
          git commit -m 'Lock 6.8 multi-project scheduler and reporting model'
          git push
