name: Market Navigator final internal gate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-navigator-turn10-final.yml'
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: build
        continue-on-error: true
        run: |
          python3 market-navigator-build-turn10.py
          python3 market-navigator-build-turn10-fix.py
      - id: gate
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 >/tmp/mn10.log 2>&1 &
          cat > /tmp/q.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1024,height:900}}),u='http://127.0.0.1:8123/market-navigator-turn10-pre-ship.html';
          let errs=[];p.on('pageerror',e=>errs.push(String(e)));let req=[];
          await p.route('https://openrouter.ai/api/v1/models',r=>r.fulfill({status:200,contentType:'application/json',body:'{"data":[{"id":"openrouter/test-model"}]}'}));
          await p.route('https://openrouter.ai/api/v1/chat/completions',async r=>{let x=JSON.parse(r.request().postData()||'{}');req.push(x);let c=x.max_tokens===8?'OK':'## Analysis\nPersisted result with [source](https://example.com).';await r.fulfill({status:200,contentType:'application/json',body:JSON.stringify({choices:[{message:{content:c}}]})})});
          await p.goto(u,{waitUntil:'networkidle'});await p.evaluate(()=>document.querySelector('[data-view="explore"]').click());await p.locator('[data-cat="Growth"]').click();await p.locator('#exploreSearch').fill('QQQ');await p.locator('#exploreList .row').first().click();await p.locator('#openExploreAnalysis').click();for(const t of ['Brent','Core CPI']){await p.locator('#addSeries').click();await p.locator('#pickerSearch').fill(t);let r=p.locator('#pickerList .pickerRow').first();if(!await r.locator('.typeBadge').count()||!await r.locator('.cadBadge').count())throw Error('picker metadata');await r.locator('[data-add]').click();await p.waitForTimeout(100)}let m=await p.locator('#analysisMeta').textContent();if(!m.includes('dual native axes')||!/monthly/i.test(m))throw Error('axis/cadence '+m);if((await p.locator('#axisBadge').textContent()).includes('Indexed'))throw Error('wrong indexed mode');
          await p.goto(u,{waitUntil:'networkidle'});await p.evaluate(()=>document.querySelector('[data-view="explore"]').click());await p.locator('[data-cat="Other"]').click();await p.locator('#exploreSearch').fill('Retail Sales');await p.locator('#exploreList .row').first().click();await p.locator('#openExploreAnalysis').click();await p.waitForFunction(()=>document.querySelector('#analysisMeta').textContent.length>0);m=await p.locator('#analysisMeta').textContent();if(!/Retail.*monthly/i.test(m))throw Error('retail cadence '+m);await p.locator('#closeAnalysis').click();
          await p.evaluate(()=>document.querySelector('[data-view="config"]').click());await p.locator('#openrouterKey').fill('sk-or-test');await p.locator('#openrouterLoad').click();await p.waitForFunction(()=>document.querySelector('#openrouterStatus').textContent.includes('models loaded'));await p.locator('#openrouterValidate').click();await p.waitForFunction(()=>document.querySelector('#openrouterStatus').textContent.includes('registered'));await p.locator('#defaultProvider').selectOption('openrouter');await p.evaluate(()=>document.querySelector('[data-view="explore"]').click());await p.locator('[data-cat="Growth"]').click();await p.locator('#exploreSearch').fill('QQQ');await p.locator('#exploreList .row').first().click();await p.locator('#openExploreAnalysis').click();await p.locator('#moreBtn').click();await p.locator('#moreAI').click();await p.waitForFunction(()=>document.querySelector('#view-library').classList.contains('on'));await p.waitForFunction(()=>document.querySelector('#libList').textContent.includes('ready'),null,{timeout:5000});if(await p.locator('#webToggle').count())throw Error('web button');if(!/Persisted result/.test(await p.locator('#transcript').textContent()))throw Error('markdown');let rail=await p.locator('.libList').boundingBox(),detail=await p.locator('.libDetail').boundingBox();if(!rail||!detail||detail.x<=rail.x)throw Error('library layout');let w=rail.width;await p.locator('#libCollapse').click();rail=await p.locator('.libList').boundingBox();if(!rail||rail.width>=w/2)throw Error('collapse');await p.locator('#libCollapse').click();await p.locator('#libMoreBtn').click();let a=await p.locator('#libMenu button').allTextContents();for(const x of ['Print','Download Markdown','Export JSON','Import JSON','Soft delete'])if(!a.includes(x))throw Error('menu '+x);await p.locator('#libDelete').click();if(!/Deleted \(1\)/.test(await p.locator('#deletedToggle').textContent()))throw Error('soft delete');await p.locator('#deletedToggle').click();await p.locator('[data-restore]').click();let stores=await p.evaluate(()=>new Promise((res,rej)=>{let r=indexedDB.open('marketNavigatorLocal');r.onsuccess=()=>res([...r.result.objectStoreNames]);r.onerror=()=>rej(r.error)}));if(!stores.includes('analyses')||!stores.includes('attachments'))throw Error('idb');if(!req.some(x=>x.plugins?.some(z=>z.id==='web')))throw Error('web grounding');if(errs.length)throw Error(errs.join('\n'));await b.close();console.log('TURN10 FINAL PASS')})().catch(e=>{console.error(e);process.exit(1)});
          JS
          NODE_PATH=$(npm root) node /tmp/q.js
      - name: Publish qualified candidate
        if: steps.build.outcome == 'success' && steps.gate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn10-pre-ship.html
          git commit -m 'market navigator: publish qualified Turn 10'
          git pull --rebase origin main
          git push origin main
      - if: always()
        run: echo "build=${{ steps.build.outcome }} gate=${{ steps.gate.outcome }}"
