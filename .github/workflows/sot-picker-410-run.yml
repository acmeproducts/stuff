name: Run SOT picker .4.10 rebuild
on:
  push:
    paths:
      - '.github/workflows/sot-picker-410-run.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore baseline
        run: git checkout 970d56435a84192c74de4d3eb7978ee327d303c4 -- project.html
      - name: Apply patch
        run: python3 tools/sot_patch_410.py
      - name: Gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.11.4.10' project.html
          grep -q "BUILD_ID='2026.08.11.4.10'" project.html
          grep -q 'function openSourceExplorer410' project.html
          grep -q 'bottom:0!important' project.html
          grep -q 'grid-template-columns:24% 43% 33%' project.html
          grep -q 'STATIC_PREVIEW' project.html
          grep -q 'data-note' project.html
          ! grep -q '8081' project.html
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-picker-410-run.yml
          git rm tools/sot_patch_410.py
          git rm -f .github/workflows/sot-picker-410-owner-rebuild.yml || true
          git add project.html project-backlog.md
          git commit -m 'Rebuild SOT picker .4.10 from .4.5 after mobile gate'
          git pull --rebase origin main
          git push origin HEAD:main
