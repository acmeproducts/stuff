name: Market Navigator live Pages smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-navigator-live-smoke.yml'
      - 'market-navigator-turn11-pre-ship.html'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages and inspect live app
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > live.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const u='https://acmeproducts.github.io/stuff/market-navigator-turn11-pre-ship.html?live='+Date.now();
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            const errors=[];const bad=[];
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            p.on('response',r=>{if(r.status()>=400)bad.push(r.status()+' '+r.url())});
            let resp=null;
            for(let i=0;i<12;i++){
              resp=await p.goto(u,{waitUntil:'networkidle',timeout:30000}).catch(()=>null);
              if(resp&&resp.status()===200)break;
              await new Promise(r=>setTimeout(r,5000));
            }
            console.log('MAIN',resp?.status(),await p.title());
            console.log('BAD',bad.join('\n'));
            console.log('ERRORS',errors.join('\n'));
            const state=await p.evaluate(()=>({
              bodyText:document.body.innerText.slice(0,500),
              app:!!document.querySelector('.app'),
              now:document.querySelector('#view-now')?.classList.contains('on'),
              canvas:document.querySelector('#nowChart')?.getBoundingClientRect().toJSON?.()||null,
              wrapText:document.querySelector('#nowWrap')?.innerText||'',
              ready:document.readyState
            }));
            console.log('STATE',JSON.stringify(state));
            if(!resp||resp.status()!==200)throw Error('live HTML not 200');
            if(!state.app||!state.now)throw Error('app shell not visible');
            if(!state.canvas||state.canvas.width<100||state.canvas.height<100)throw Error('NOW canvas not displayed');
            if(errors.length)throw Error(errors.join('\n'));
            await b.close();
          })().catch(e=>{console.error('LIVE_FAIL',e);process.exit(1)});
          JS
          node live.js
