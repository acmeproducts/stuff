name: Market Navigator live Pages smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-navigator-live-smoke.yml'
      - 'market-navigator-turn12-pre-ship.html'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Pages and inspect live app
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > live.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const base='https://acmeproducts.github.io/stuff/market-navigator-turn12-pre-ship.html';
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            let errors=[],bad=[],resp=null,state=null;
            p.on('pageerror',e=>errors.push(String(e)));
            p.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
            p.on('response',r=>{if(r.status()>=400)bad.push(r.status()+' '+r.url())});
            for(let i=0;i<18;i++){
              errors=[];bad=[];
              resp=await p.goto(base+'?live='+Date.now(),{waitUntil:'networkidle',timeout:30000}).catch(()=>null);
              if(resp&&resp.status()===200){
                state=await p.evaluate(()=>({title:document.title,app:!!document.querySelector('.app'),now:document.querySelector('#view-now')?.classList.contains('on'),canvas:document.querySelector('#nowChart')?.getBoundingClientRect().toJSON?.()||null,wrapText:document.querySelector('#nowWrap')?.innerText||'',config:!!document.querySelector('#defaultProvider'),ready:document.readyState}));
                if(state.title.includes('Turn 12')&&state.app&&state.now&&state.canvas&&state.canvas.width>=100&&state.canvas.height>=100&&!/not defined|HTTP \d+|failed/i.test(state.wrapText)&&!errors.length&&!bad.length)break;
              }
              await new Promise(r=>setTimeout(r,5000));
            }
            console.log('MAIN',resp?.status(),state?.title);
            console.log('STATE',JSON.stringify(state));
            console.log('BAD',bad.join('\n'));
            console.log('ERRORS',errors.join('\n'));
            if(!resp||resp.status()!==200)throw Error('live HTML not 200');
            if(!state?.title?.includes('Turn 12'))throw Error('Pages did not publish Turn 12');
            if(!state.app||!state.now)throw Error('app shell not visible');
            if(!state.canvas||state.canvas.width<100||state.canvas.height<100)throw Error('NOW canvas not displayed');
            if(!state.config)throw Error('AI config DOM missing');
            if(/not defined|HTTP \d+|failed/i.test(state.wrapText))throw Error('boot error surface: '+state.wrapText);
            if(bad.length)throw Error('failed resources: '+bad.join('\n'));
            if(errors.length)throw Error(errors.join('\n'));
            await p.evaluate(()=>document.querySelector('[data-view="config"]').click());
            if(!(await p.locator('#defaultProvider').isVisible()))throw Error('CONFIG not visible live');
            await b.close(); console.log('LIVE TURN12 PASS');
          })().catch(e=>{console.error('LIVE_FAIL',e);process.exit(1)});
          JS
          node live.js
