name: Run SOT location picker build

on:
  push:
    paths:
      - '.github/workflows/sot-run-location-picker-46.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply build
        run: python3 tools/sot_patch_location_picker_46.py
      - name: Gate JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.11.4.6' project.html
          grep -q 'data-root-check' project.html
          grep -q 'data-folder-check' project.html
          grep -q 'Add to project (' project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-run-location-picker-46.yml
          git rm tools/sot_patch_location_picker_46.py
          git rm -f .github/workflows/sot-owner-location-picker-46.yml || true
          git add project.html project-backlog.md
          git commit -m 'Implement selectable volumes and folders in Add locations'
          git pull --rebase origin main
          git push origin HEAD:main
