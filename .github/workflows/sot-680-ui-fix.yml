name: SOT 6.8 UI correction
on:
  push:
    paths:
      - '.github/workflows/sot-680-ui-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make multi-project controls nonblocking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sot-ui-6.8-multiproject-addon.js'); s=p.read_text()
          old="try{state.fp.live=await api('/projects/'+encodeURIComponent(p.project_token)+'/fingerprint/status')}catch{}mpPollTimer=setTimeout(poll,1000)"
          new="try{state.fp.live=await api('/projects/'+encodeURIComponent(p.project_token)+'/fingerprint/status');mpRefreshFingerprintMetrics(state.fp.live)}catch{}mpPollTimer=setTimeout(poll,1000)"
          if old not in s: raise SystemExit('poll anchor not found')
          s=s.replace(old,new,1)
          anchor=" document.querySelector('.build').textContent='UI v0.4.1 · '+MP_UI_BUILD;\n render();"
          insert=r''' function mpRefreshFingerprintMetrics(live){
  const cells=$$('.statusCell');if(cells.length<6)return;const run=live?.run||{},job=live?.job||{},t=live?.totals||{},pr=live?.progress||{};
  const phase=job.phase||run.status||'Ready',filesDone=Number(t.done||0)+Number(t.errors||0),filesTotal=Number(t.files||0),bytesDone=Number(t.bytes_done||run.bytes_done||0),bytesTotal=Number(t.bytes||0),pct=Number(pr.bytes_percent||0);
  cells[0].querySelector('.v').textContent=phase;
  cells[1].querySelector('.v').textContent=bytesTotal?mpPct(pct):'—';const fill=cells[1].querySelector('.progressFill');if(fill)fill.style.width=Math.max(0,Math.min(100,pct))+'%';
  cells[2].querySelector('.v').textContent=fmtBytes(bytesDone)+' / '+fmtBytes(bytesTotal);
  cells[3].querySelector('.v').textContent=filesDone.toLocaleString()+' / '+filesTotal.toLocaleString();
  cells[4].querySelector('.v').textContent=Number(t.folders_done||0).toLocaleString()+' / '+Number(t.folders||0).toLocaleString()+' folders';
  cells[5].querySelector('.v').textContent=mpFmtRate(pr.bytes_per_second)+' · '+mpFmtEta(pr.eta_seconds);
 }
 fpAction67=async function(p,action){
  try{state.fp.running=true;await api('/projects/'+encodeURIComponent(p.project_token)+'/fingerprint/'+action,{method:'POST',body:'{}'});state.fp.live=await api('/projects/'+encodeURIComponent(p.project_token)+'/fingerprint/status');toast(action==='start'?'Project added to global worker pool.':action==='continue'?'Project resumed in global worker pool.':'Project restarted in global worker pool.');renderFingerprinting()}catch(e){toast(e.message,true)}finally{state.fp.running=false}
 };
 document.querySelector('.build').textContent='UI v0.4.1 · '+MP_UI_BUILD;
 render();'''
          if anchor not in s: raise SystemExit('tail anchor not found')
          s=s.replace(anchor,insert,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sot-ui-6.8-multiproject-addon.js
          git commit -m 'Keep multi-project fingerprint actions nonblocking'
          git push
