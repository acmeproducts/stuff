name: Market Navigator qualified publish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-navigator-turn10-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild exact qualified artifact
        run: |
          python3 market-navigator-build-turn10.py
          python3 market-navigator-build-turn10-fix.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn10-pre-ship.html').read_text()
          assert 'TURN 10 PRE-SHIP' in s
          assert 'function axisPlan(' in s
          assert 'libCollapse' in s and 'deletedToggle' in s and 'libMoreBtn' in s
          assert 'id="webToggle"' not in s
          Path('/tmp/mn10.js').write_text(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])
          PY
          node --check /tmp/mn10.js
      - name: Commit and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn10-pre-ship.html
          git commit -m 'market navigator: publish qualified Turn 10'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push origin main
