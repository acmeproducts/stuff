name: SOT pin coordination release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sot-pin-coordination-release.yml']
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Pin qualified coordination source
        run: |
          set -euo pipefail
          sed -i "s/SRC_COMMIT='5d0cc9bd0874d68cfbc27732f799a1692d20c406'/SRC_COMMIT='91f158c48eed9a46063a1258c9ecce73b69aa8e1'/" install-SOT-turn01-base.sh
          grep -Fq "SRC_COMMIT='91f158c48eed9a46063a1258c9ecce73b69aa8e1'" install-SOT-turn01-base.sh
          bash -n install-SOT-turn01-base.sh
          git config user.name sot-release-bot
          git config user.email sot-release-bot@local
          git add install-SOT-turn01-base.sh
          git commit -m 'sot: pin qualified coordination source'
          git pull --rebase origin main
          git push origin main
