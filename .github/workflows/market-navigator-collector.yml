name: Market Navigator data collector

on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore source TTLs and attempt every source
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - "market-navigator-collector.py"
      - "market-navigator-build-db.py"
      - "scripts/market-navigator-ui-migrate.py"
      - ".github/workflows/market-navigator-collector.yml"

permissions:
  contents: write

concurrency:
  group: market-navigator-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect eligible sources
        env:
          MARKET_NAVIGATOR_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: python3 market-navigator-collector.py

      - name: Build canonical database and derived indexes
        run: python3 market-navigator-build-db.py

      - name: Apply canonical UI semantics
        run: python3 scripts/market-navigator-ui-migrate.py

      - name: Validate UI JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('market-view-ui-v2.html').read_text()
          m=re.search(r'<script>(.*)</script>',html,re.S)
          if not m: raise SystemExit('Market Navigator inline script not found')
          Path('/tmp/market-view-ui-v2.js').write_text(m.group(1))
          PY
          node --check /tmp/market-view-ui-v2.js

      - name: Validate generated backend and database contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          backend=Path('data/market-backend')
          required_backend=['market-manifest.json','market-cache.json','macro-cache.json','news-cache.json','source-health.json']
          missing=[x for x in required_backend if not (backend/x).exists()]
          if missing: raise SystemExit('Missing backend outputs: '+', '.join(missing))
          manifest=json.loads((backend/'market-manifest.json').read_text())
          if manifest.get('schema')!='market-navigator-manifest-v1': raise SystemExit('Invalid backend manifest schema')

          root=Path('market-data')
          db=json.loads((root/'manifest.json').read_text())
          if db.get('schema')!='market-navigator-database-v1': raise SystemExit('Invalid database manifest schema')
          if not db.get('validation',{}).get('ok'): raise SystemExit('Database reconciliation failed: '+str(db.get('validation')))
          if db.get('indexes',{}).get('growth',{}).get('children') != ['qqq']:
            raise SystemExit('Growth must measure growth leadership; financing conditions cannot be an equal-weight Growth child')
          for name in ('risk','growth','macro','regime'):
            p=root/'indexes'/f'{name}.json'
            if not p.exists(): raise SystemExit(f'Missing derived index {name}')
            obj=json.loads(p.read_text())
            if not obj.get('observations'): raise SystemExit(f'Empty derived index {name}')
          print('Validated database',db.get('revision'),'regime observations',db['indexes']['regime']['count'])
          PY

      - name: Commit refreshed Market Navigator database and UI
        run: |
          if [ -z "$(git status --porcelain -- data/market-backend market-data market-view-ui-v2.html)" ]; then
            echo "No eligible Market Navigator data or UI changed."
            exit 0
          fi
          git config user.name "market-navigator-bot"
          git config user.email "market-navigator-bot@users.noreply.github.com"
          git add data/market-backend market-data market-view-ui-v2.html
          git commit -m "data: refresh Market Navigator database and UI"
          git pull --rebase origin main
          git push origin HEAD:main
