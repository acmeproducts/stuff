name: Market Navigator data collector

on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore source TTLs and attempt every source
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "market-navigator-publish-now.trigger"

permissions:
  contents: write

concurrency:
  group: market-navigator-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Collect eligible sources
        env:
          MARKET_NAVIGATOR_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: python3 market-navigator-collector.py
      - name: Build canonical database
        run: python3 market-navigator-build-db.py
      - name: Apply UI migration only for explicit publication
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/market-navigator-ui-migrate.py
      - name: Validate
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          db=json.loads(Path('market-data/manifest.json').read_text())
          if db.get('databaseVersion')!='1.2.0' or not db.get('validation',{}).get('ok'):
              raise SystemExit('Invalid database '+str(db.get('validation')))
          model=json.loads(Path('market-data/model.json').read_text())
          if model.get('schema')!='market-navigator-relative-model-v1': raise SystemExit('Invalid model')
          if '${{ github.event_name }}' in ('push','workflow_dispatch'):
              html=Path('market-view-ui-v2.html').read_text();m=re.search(r'<script>(.*)</script>',html,re.S)
              if not m: raise SystemExit('UI script missing')
              Path('/tmp/market-view-ui-v2.js').write_text(m.group(1))
          PY
          if [ -f /tmp/market-view-ui-v2.js ]; then node --check /tmp/market-view-ui-v2.js; fi
      - name: Commit refreshed data and explicit UI publication
        run: |
          git config user.name "market-navigator-bot"
          git config user.email "market-navigator-bot@users.noreply.github.com"
          git add data/market-backend market-data
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then git add market-view-ui-v2.html; fi
          if git diff --cached --quiet; then echo "No Market Navigator changes."; exit 0; fi
          git commit -m "data: publish Market Navigator database 1.2 and UI"
          git pull --rebase origin main
          git push origin HEAD:main
