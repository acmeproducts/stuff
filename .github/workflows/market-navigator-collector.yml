name: Market Navigator data collector

on:
  workflow_dispatch:
    inputs:
      force:
        description: Ignore source TTLs and attempt every source
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: market-navigator-data-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect eligible sources
        env:
          MARKET_NAVIGATOR_FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: python3 market-navigator-collector.py

      - name: Build canonical database
        run: python3 market-navigator-build-db.py

      - name: Validate generated data contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          backend = Path('data/market-backend')
          required_backend = [
              'market-manifest.json',
              'market-cache.json',
              'macro-cache.json',
              'news-cache.json',
              'source-health.json',
          ]
          missing = [x for x in required_backend if not (backend / x).exists()]
          if missing:
              raise SystemExit('Missing backend outputs: ' + ', '.join(missing))

          backend_manifest = json.loads((backend / 'market-manifest.json').read_text())
          if backend_manifest.get('schema') != 'market-navigator-manifest-v1':
              raise SystemExit('Invalid backend manifest schema')

          root = Path('market-data')
          db = json.loads((root / 'manifest.json').read_text())
          if db.get('schema') != 'market-navigator-database-v1':
              raise SystemExit('Invalid database manifest schema')
          if not db.get('validation', {}).get('ok'):
              raise SystemExit('Database validation failed: ' + str(db.get('validation')))
          if db.get('databaseVersion') != '1.2.0':
              raise SystemExit('Expected database model 1.2.0')

          model = json.loads((root / 'model.json').read_text())
          if model.get('schema') != 'market-navigator-relative-model-v1':
              raise SystemExit('Missing T0-relative model')

          for name in ('risk', 'growth', 'macro'):
              cfg = model['indexes'][name]
              total = sum(float(x['weight']) for x in cfg['components'])
              if abs(total - 1) > 0.0001:
                  raise SystemExit(f'{name} weights do not sum to 1: {total}')
              if not cfg['components']:
                  raise SystemExit(f'{name} has no model components')

          print('Validated Market Navigator database', db.get('revision'))
          PY

      - name: Commit refreshed Market Navigator data
        run: |
          if [ -z "$(git status --porcelain -- data/market-backend market-data)" ]; then
            echo "No Market Navigator data changed."
            exit 0
          fi

          git config user.name "market-navigator-bot"
          git config user.email "market-navigator-bot@users.noreply.github.com"
          git add data/market-backend market-data
          git commit -m "data: refresh Market Navigator database"
          git pull --rebase origin main
          git push origin HEAD:main
