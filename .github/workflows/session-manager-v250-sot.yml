name: Session Manager v2.5.0 GitHub SOT
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/session-manager-v250.py'
      - '.github/workflows/session-manager-v250-sot.yml'
permissions:
  contents: write
concurrency:
  group: session-manager-v250-sot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Backup governed baseline
        run: |
          mkdir -p .release-backups/session-manager-v250
          cp session-manager-v3.html .release-backups/session-manager-v250/session-manager-v3.v240.html
          cp session-manager-backlog.md .release-backups/session-manager-v250/session-manager-backlog.pre-v190.md
      - name: Build v2.5.0
        run: python3 .github/scripts/session-manager-v250.py
      - name: Syntax and release gates
        run: |
          python3 - <<'PY'
          import re
          s=open('session-manager-v3.html',encoding='utf-8').read()
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert m, 'script block missing'
          open('/tmp/session-manager-v250.js','w',encoding='utf-8').write(m.group(1))
          required=['v2.5.0','session-manager-sot','GitHub source of truth','function sotSync(','function githubApi(','sotOutbox','data-pane="sync"']
          for x in required: assert x in s, x
          assert '<span class="projectHash">#</span>' not in s
          assert "'# '+p.name" not in s
          assert "const APP_VERSION='2.3.0'" in s
          print('HTML release gates passed')
          PY
          node --check /tmp/session-manager-v250.js
      - name: Publish release and clean temporary builder
        run: |
          rm -f .github/scripts/session-manager-v250.py .github/workflows/session-manager-v250-sot.yml
          git add session-manager-v3.html session-manager-backlog.md .release-backups/session-manager-v250 .github/scripts/session-manager-v250.py .github/workflows/session-manager-v250-sot.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Release Session Manager v2.5.0 GitHub SOT'
          git push origin HEAD:main
