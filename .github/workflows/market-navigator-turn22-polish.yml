name: Market Navigator Turn 22 polish
on:
  push:
    branches: [market-navigator-turn22]
    paths:
      - 'market-navigator-turn22-polish.py'
      - '.github/workflows/market-navigator-turn22-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-navigator-turn22
      - name: Apply Turn 22 direct-source polish
        run: |
          python3 market-navigator-turn22-polish.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn22-pre-ship.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S); assert scripts
          Path('/tmp/mn22.js').write_text(scripts[-1])
          assert 'active:state.active' in s and 'active:chart.active' in s
          PY
          node --check /tmp/mn22.js
      - name: Commit polished source
        run: |
          git config user.name 'market-navigator-build-bot'
          git config user.email 'market-navigator-build-bot@users.noreply.github.com'
          git add market-navigator-turn22-pre-ship.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish Turn 22 visible-state fidelity'
          git push origin HEAD:market-navigator-turn22
