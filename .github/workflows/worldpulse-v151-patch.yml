name: Patch WorldPulse v1.5.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldpulse-v151-patch.yml'

permissions:
  contents: write

concurrency:
  group: worldpulse-v151-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reporting and breadcrumb patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('globe.html')
          s=p.read_text(encoding='utf-8')

          reps=[
            ('WorldPulse v1.5.0 — Global News Sentiment','WorldPulse v1.5.1 — Global News Sentiment'),
            ('<span class="version">v1.5.0</span>','<span class="version">v1.5.1</span>'),
            ('const VERSION="1.5.0", DATA_URL=', 'const VERSION="1.5.1", DATA_URL='),
            ('.paneHead{padding:12px 14px 8px;display:flex;align-items:flex-start;gap:10px}', '.rightCrumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-height:34px;padding:8px 14px 4px;border-bottom:1px solid #172b42;background:#081522}.rightCrumbs .crumb{font-size:11px}.rightCrumbs .crumb:last-child{color:var(--text);font-weight:700}.rightCrumbs .crumbSep{color:#58728d;font-size:10px}.paneHead{padding:9px 14px 8px;display:flex;align-items:flex-start;gap:10px}'),
            ('<section class="explorePane">\n      <div class="paneHead">', '<section class="explorePane">\n      <div id="rightCrumbs" class="rightCrumbs" aria-label="Reporting breadcrumb"></div>\n      <div class="paneHead">'),
            ('crumbs:$("crumbs"),title:$("selectionTitle")', 'crumbs:$("crumbs"),rightCrumbs:$("rightCrumbs"),title:$("selectionTitle")'),
            ('admin1:"States / provinces",city:"Key cities / Other"', 'admin1:"States / provinces / counties",city:"Cities / Other"'),
          ]
          for old,new in reps:
              if old not in s:
                  raise SystemExit(f'Missing expected patch target: {old[:90]}')
              s=s.replace(old,new,1)

          old='function scopeLabel(){return selection.city||selection.admin1||selection.country||selection.region||"World"}'
          new='function scopeLabel(){return selection.city||selection.admin1||selection.country||selection.region||"World"}\nfunction currentLevel(){return selection.city?"city":selection.admin1?"admin1":selection.country?"country":selection.region?"region":"world"}\nfunction currentLevelLabel(){return({world:"World",region:"Region",country:"Country",admin1:"State / province / county",city:"City"})[currentLevel()]}'
          if old not in s: raise SystemExit('scopeLabel target missing')
          s=s.replace(old,new,1)

          old='function renderSummary(){const n=currentNode();if(!n)return;const p=pct100(n),next=nextLevel();E.title.textContent=scopeLabel();E.sub.textContent=next==="article"?"Detailed coverage for this city.":`Select ${levelLabel(next).toLowerCase()} to drill deeper.`;E.depth.textContent=levelLabel(next).toUpperCase();'
          new='function renderSummary(){const n=currentNode();if(!n)return;const p=pct100(n),next=nextLevel();E.title.textContent=`${scopeLabel()} · ${currentLevelLabel()} report`;E.sub.textContent=next==="article"?"City-level sentiment and detailed coverage.":`${currentLevelLabel()}-level sentiment. Select ${levelLabel(next).toLowerCase()} to drill deeper.`;E.depth.textContent=currentLevelLabel().toUpperCase();'
          if old not in s: raise SystemExit('renderSummary target missing')
          s=s.replace(old,new,1)

          old='function renderCrumbs(){const a=[{name:"World",level:"world"}];if(selection.region)a.push({name:selection.region,level:"region"});if(selection.country)a.push({name:selection.country,level:"country"});if(selection.admin1)a.push({name:selection.admin1,level:"admin1"});if(selection.city)a.push({name:selection.city,level:"city"});E.crumbs.innerHTML="";a.forEach((x,i)=>{if(i)E.crumbs.insertAdjacentHTML("beforeend",\'<span style="color:#58728d;font-size:10px">›</span>\');const b=document.createElement("button");b.className="crumb";b.textContent=x.name;b.addEventListener("click",()=>goToLevel(x.level));E.crumbs.appendChild(b)})}'
          new='function renderCrumbs(){const a=[{name:"World",level:"world"}];if(selection.region)a.push({name:selection.region,level:"region"});if(selection.country)a.push({name:selection.country,level:"country"});if(selection.admin1)a.push({name:selection.admin1,level:"admin1"});if(selection.city)a.push({name:selection.city,level:"city"});const paint=el=>{if(!el)return;el.innerHTML="";a.forEach((x,i)=>{if(i){const sep=document.createElement("span");sep.className="crumbSep";sep.textContent="›";el.appendChild(sep)}const b=document.createElement("button");b.className="crumb";b.type="button";b.textContent=x.name;b.title=`Open ${x.name} ${x.level} report`;b.addEventListener("click",()=>goToLevel(x.level));el.appendChild(b)})};paint(E.crumbs);paint(E.rightCrumbs)}'
          if old not in s: raise SystemExit('renderCrumbs target missing')
          s=s.replace(old,new,1)

          old='function selectChild(n){const l=nextLevel();if(l==="region")selection={region:n.name,country:null,admin1:null,city:null};else if(l==="country")selection.country=n.name;else if(l==="admin1")selection.admin1=n.name;else if(l==="city")selection.city=n.name;renderAll(true)}'
          new='function selectChild(n){const l=nextLevel();if(l==="region")selection={region:n.name,country:null,admin1:null,city:null};else if(l==="country")selection.country=n.name;else if(l==="admin1")selection.admin1=n.name;else if(l==="city")selection.city=n.name;renderAll(true)}\nfunction selectCountryFromGlobe(name){if(!index||selection.country||!name)return;const target=String(name).trim().toLowerCase();for(const r of index.children.values()){for(const c of r.children.values()){const n=String(c.name).trim().toLowerCase();if(n===target||n.replace(/[^a-z0-9]/g,"")===target.replace(/[^a-z0-9]/g,"")){selection={region:r.name,country:c.name,admin1:null,city:null};renderAll(true);return}}}}'
          if old not in s: raise SystemExit('selectChild target missing')
          s=s.replace(old,new,1)

          old='function applyCountries(){if(!globe||!countries?.features)return;globe.polygonsData(countries.features).polygonCapColor(()=>"rgba(50,92,78,.67)").polygonSideColor(()=>"rgba(17,45,61,.16)").polygonStrokeColor(()=>"rgba(185,214,223,.5)").polygonAltitude(.003).polygonLabel(d=>`<div style="background:#07101ded;border:1px solid #33516f;border-radius:7px;padding:6px 8px;color:white;font:11px system-ui">${esc(d.properties?.name||d.properties?.ADMIN||"Country")}</div>`);debug()}'
          new='function applyCountries(){if(!globe||!countries?.features)return;globe.polygonsData(countries.features).polygonCapColor(()=>"rgba(50,92,78,.67)").polygonSideColor(()=>"rgba(17,45,61,.16)").polygonStrokeColor(()=>"rgba(185,214,223,.5)").polygonAltitude(.003).polygonLabel(d=>`<div style="background:#07101ded;border:1px solid #33516f;border-radius:7px;padding:6px 8px;color:white;font:11px system-ui"><b>${esc(d.properties?.name||d.properties?.ADMIN||"Country")}</b><br>Click for country report</div>`).onPolygonClick(d=>selectCountryFromGlobe(d.properties?.name||d.properties?.ADMIN||""));debug()}'
          if old not in s: raise SystemExit('applyCountries target missing')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'WorldPulse v1.5.1' globe.html
          grep -q 'id="rightCrumbs"' globe.html
          grep -q 'State / province / county' globe.html
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('globe.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/worldpulse.js').write_text(scripts[-1],encoding='utf-8')
          raise SystemExit(subprocess.run(['node','--check','/tmp/worldpulse.js']).returncode)
          PY

      - name: Commit patch
        run: |
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add globe.html
          git rm .github/workflows/worldpulse-v151-patch.yml
          git commit -m "fix: hierarchical reporting breadcrumb v1.5.1"
          git pull --rebase origin main
          git push
