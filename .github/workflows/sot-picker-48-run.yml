name: Run SOT picker .4.8

on:
  push:
    paths:
      - '.github/workflows/sot-picker-48-run.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore .4.5 baseline
        run: git checkout 970d56435a84192c74de4d3eb7978ee327d303c4 -- project.html
      - name: Apply screenshot layout
        run: python3 tools/sot_patch_picker_48.py
      - name: Gate JavaScript and owner markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.11.4.8' project.html
          grep -q 'function openApprovedSourcePicker' project.html
          grep -q 'data-volume-check' project.html
          grep -q 'data-add-folder' project.html
          grep -q 'sshot-grid' project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-picker-48-run.yml
          git rm tools/sot_patch_picker_48.py
          git rm -f .github/workflows/sot-picker-48-screenshot-layout.yml || true
          git add project.html project-backlog.md
          git commit -m 'Rebuild SOT picker .4.8 from approved screenshot layout'
          git pull --rebase origin main
          git push origin HEAD:main
