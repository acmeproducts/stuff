name: Install WorldPulse v1.5.0

# retry 3 after exact chunk repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldpulse-v150-install.yml'

permissions:
  contents: write

concurrency:
  group: worldpulse-v150-install
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate WorldPulse
        run: |
          : > globe.html
          for f in .worldpulse-v150/chunk*.b64; do
            base64 --decode "$f" >> globe.html
          done
          grep -q 'WorldPulse v1.5.0' globe.html
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('globe.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          if not scripts:
              raise SystemExit('No inline JavaScript found')
          pathlib.Path('/tmp/worldpulse.js').write_text(scripts[-1],encoding='utf-8')
          p=subprocess.run(['node','--check','/tmp/worldpulse.js'])
          raise SystemExit(p.returncode)
          PY

      - name: Commit application
        run: |
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add globe.html
          git rm -r .worldpulse-v150
          git rm .github/workflows/worldpulse-v150-install.yml
          git commit -m "feat: WorldPulse hierarchical cached explorer v1.5.0"
          git pull --rebase origin main
          git push
