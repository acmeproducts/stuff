name: Build WorldPulse v1.9.1 layout

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worldpulse-v191-layout.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rework WorldPulse layout and performance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('globe.html')
          s=p.read_text(encoding='utf-8')

          # Version.
          s=s.replace('WorldPulse v1.9.0','WorldPulse v1.9.1')
          s=s.replace('>v1.9.0<','>v1.9.1<')
          s=s.replace("const VERSION='1.9.0'","const VERSION='1.9.1'")

          # Desktop geometry: lighter globe, largest center workspace, persistent reader.
          s=s.replace('--globe:40vw;--reader:34vw','--globe:31vw;--reader:33vw')
          s=s.replace('grid-template-columns:var(--globe) minmax(390px,1fr) var(--reader)',
                      'grid-template-columns:var(--globe) minmax(520px,1fr) minmax(390px,var(--reader))')
          s=s.replace('grid-template-columns:0 minmax(430px,1fr) minmax(380px,var(--reader))',
                      'grid-template-columns:0 minmax(560px,1fr) minmax(390px,var(--reader))')

          # Critical whitespace fix: navigator is content-sized; headlines consume the rest.
          s=s.replace('.middle{min-width:0;height:100%;display:grid;grid-template-rows:44% 56%;background:var(--panel)}',
                      '.middle{min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--panel);overflow:hidden}')
          s=s.replace('.navigator{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}',
                      '.navigator{min-height:0;max-height:46vh;display:flex;flex-direction:column;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}')
          s=s.replace('.headlines{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}',
                      '.headlines{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);overflow:hidden}')
          s=s.replace('.locations{padding:0 9px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:6px;overflow:auto;min-height:0}',
                      '.locations{padding:0 9px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:6px;overflow:auto;min-height:0;max-height:23vh;align-content:start}')
          s=s.replace('.headlineList{padding:0 9px 12px;display:grid;gap:6px;overflow:auto;min-height:0}',
                      '.headlineList{padding:0 9px 12px;display:grid;gap:6px;overflow:auto;min-height:0;align-content:start;content-visibility:auto;contain:layout paint style}')

          # More compact report chrome so stories arrive higher on screen.
          s=s.replace('.sectionHead{padding:9px 12px 7px;', '.sectionHead{padding:7px 12px 5px;')
          s=s.replace('.sent{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 7px}', '.sent{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px 5px}')
          s=s.replace('.sc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px}', '.sc{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 7px}')
          s=s.replace('.sc strong{font-size:18px}', '.sc strong{font-size:16px}')
          s=s.replace('.sentbar{height:7px;display:flex;margin:0 12px 8px;', '.sentbar{height:6px;display:flex;margin:0 12px 6px;')
          s=s.replace('.subHead{padding:0 12px 6px;', '.subHead{padding:0 12px 5px;')

          # Headline cards become denser/readable; don't waste vertical space.
          s=s.replace('.story{border:1px solid var(--line);background:#091725;color:var(--text);border-radius:9px;padding:9px 10px;text-align:left}',
                      '.story{border:1px solid var(--line);background:#091725;color:var(--text);border-radius:9px;padding:8px 10px;text-align:left;contain:content}')
          s=s.replace('.storyTitle{font-size:11px;line-height:1.34}', '.storyTitle{font-size:12px;line-height:1.35;font-weight:600}')

          # Reader stays visually distinct and uses its entire column.
          s=s.replace('.reader{min-width:0;background:#091522;display:flex;flex-direction:column}',
                      '.reader{min-width:0;background:#091522;display:flex;flex-direction:column;border-left:1px solid var(--line);overflow:hidden}')
          s=s.replace('.readerBody{min-height:0;flex:1;display:flex;flex-direction:column}',
                      '.readerBody{min-height:0;flex:1;display:flex;flex-direction:column;overflow:hidden}')

          # Better desktop/mobile breakpoints. Keep stacked layout only when genuinely narrow.
          s=s.replace('@media(max-width:980px)', '@media(max-width:860px)')
          s=s.replace('.middle{height:760px}', '.middle{height:auto;min-height:720px;grid-template-rows:auto minmax(420px,1fr)}')

          # Performance: avoid high-DPI WebGL cost and pause the render loop when globe is hidden.
          init_marker="const resize=()=>globe.width(el.clientWidth).height(el.clientHeight);resize();addEventListener(\"resize\",resize,{passive:true});"
          if init_marker in s:
              s=s.replace(init_marker,
                  "try{globe.renderer().setPixelRatio(Math.min(window.devicePixelRatio||1,1.25))}catch(e){};"+init_marker)

          # Replace hamburger listener with a pause/resume aware version.
          patt=r'E\.menu\.addEventListener\("click",\(\)=>\{E\.app\.classList\.toggle\("collapsed"\);.*?\}\);'
          repl='''E.menu.addEventListener("click",()=>{\n  const collapsed=E.app.classList.toggle("collapsed");\n  try{if(globe&&typeof globe.pauseAnimation==="function")collapsed?globe.pauseAnimation():globe.resumeAnimation()}catch(e){}\n  setTimeout(()=>{if(globe&&!collapsed){const el=E.globeEl;globe.width(el.clientWidth).height(el.clientHeight)}},140)\n});'''
          s2,n=re.subn(patt,repl,s,count=1,flags=re.S)
          if n:
              s=s2

          # Auto-collapse after choosing a world region, and pause immediately.
          # selectChild is used by location cards; only collapse at region depth.
          patt2=r'function selectChild\(.*?\)\{(.*?)\n\}'
          m=re.search(patt2,s,re.S)
          if m and 'pauseAnimation' not in m.group(0):
              body=m.group(1)
              # append after existing behavior without changing selection semantics
              body += '''\nif(selection&&selection.region&&!selection.country&&!E.app.classList.contains("collapsed")){E.app.classList.add("collapsed");try{if(globe&&typeof globe.pauseAnimation==="function")globe.pauseAnimation()}catch(e){}}'''
              s=s[:m.start(1)]+body+s[m.end(1):]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('globe.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/worldpulse.js').write_text(scripts[-1],encoding='utf-8')
          assert 'v1.9.1' in s
          assert 'grid-template-rows:auto minmax(0,1fr)' in s
          assert 'max-height:23vh' in s
          assert 'pauseAnimation' in s
          PY
          node --check /tmp/worldpulse.js

      - name: Commit v1.9.1
        run: |
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add globe.html
          git commit -m "ui: WorldPulse v1.9.1 compact split reader layout"
          git pull --rebase origin main
          git push origin HEAD:main
