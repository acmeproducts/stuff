name: Deploy relay
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'talkbridge/worker-talk.js'
      - 'talkbridge/wrangler.jsonc'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        working-directory: talkbridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          set +e
          wrangler deploy > /tmp/deploy-out.txt 2>&1
          echo "wrangler-exit=$?" >> /tmp/deploy-out.txt
          set -e
          cat /tmp/deploy-out.txt
      - name: Live check
        run: |
          sleep 5
          curl -s -m 15 -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=deploycheck&session=deploycheck&client=ci" -H 'Content-Type: application/json' -d '{"type":"vapid"}' > /tmp/live-check.txt || echo "curl-failed" >> /tmp/live-check.txt
          cat /tmp/live-check.txt
      - name: WebSocket handshake + delivery-contract check
        run: |
          npm i ws@8 >/dev/null 2>&1
          cat > wscheck.mjs <<'JS'
          import WebSocket from 'ws';
          const BASE='wss://talk-signal.myacctfortracking.workers.dev';
          const HTTP='https://talk-signal.myacctfortracking.workers.dev';
          const s='ci-'+Date.now().toString(36);
          const u=c=>`${BASE}/signal?app=deploycheck&session=${s}&client=${c}`;
          const post=(c,body)=>fetch(`${HTTP}/signal?app=deploycheck&session=${s}&client=${c}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
          const open=c=>new Promise((res,rej)=>{const w=new WebSocket(u(c));w.on('open',()=>res(w));w.on('error',e=>rej(e));setTimeout(()=>rej(new Error('timeout')),10000);});
          try{
            const a=await open('ciA'), b=await open('ciB');
            const got=[]; b.on('message',d=>{try{got.push(JSON.parse(d))}catch(_){}});
            a.send(JSON.stringify({type:'chat-msg',from:'ciA',chatId:'ci-1',srcText:'x',ts:Date.now()}));
            await new Promise(r=>setTimeout(r,1500));
            const m=got.find(x=>x.chatId==='ci-1');
            console.log('ws-connect=ok');
            console.log('ws-deliver='+(m?'ok':'FAIL'));
            /* ── WAKE-PATH END-TO-END (plan 4c.2) ── */
            /* subscribe phone C with a fake endpoint, keep it DISCONNECTED */
            await post('ciC',{type:'subscribe',subscription:{endpoint:'https://updates.push.services.mozilla.com/wpush/v2/ci-fake-'+s,keys:{p256dh:'BNcW4StLJLQ3nc9DGdvyRT8VTCLBUyIYbnaqfHNW08','auth':'ciauthciauthciauthcia'}}});
            a.send(JSON.stringify({type:'chat-msg',from:'ciA',chatId:'ci-2',srcText:'wake-c',ts:Date.now()}));
            await new Promise(r=>setTimeout(r,2500));
            const diag=await post('ciA',{type:'diag'});
            console.log('wake-attempted='+((diag&&diag.lastWake&&diag.lastWake.clientId==='ciC')?'ok':'FAIL '+JSON.stringify(diag&&diag.lastWake)));
            console.log('wake-result='+((diag&&diag.lastWake&&/status-/.test(diag.lastWake.result||''))?diag.lastWake.result:'FAIL'));
            console.log('connected-visible='+((diag&&Array.isArray(diag.connected)&&diag.connected.includes('ciA'))?'ok':'FAIL'));
            /* fresh connected B must NOT be the wake target */
            console.log('no-wake-for-live='+((diag&&diag.lastWake&&diag.lastWake.clientId!=='ciB')?'ok':'FAIL'));
            a.close();b.close();
          }catch(e){console.log('ws-connect=FAIL '+(e&&e.message||e));}
          JS
          node wscheck.mjs > /tmp/ws-check.txt 2>&1 || true
          rm -f wscheck.mjs
          cat /tmp/ws-check.txt
      - name: Publish status
        if: always()
        run: |
          git config user.name deploy-bot
          git config user.email deploy-bot@local
          { echo "run: ${{ github.run_id }}  $(date -u)"; echo '=== wrangler ==='; cat /tmp/deploy-out.txt 2>/dev/null; echo; echo '=== live check (vapid probe) ==='; cat /tmp/live-check.txt 2>/dev/null; echo; echo '=== websocket + delivery contract ==='; cat /tmp/ws-check.txt 2>/dev/null; echo; } > talkbridge/DEPLOY-STATUS.txt
          git add talkbridge/DEPLOY-STATUS.txt
          git commit -m "relay deploy status [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
