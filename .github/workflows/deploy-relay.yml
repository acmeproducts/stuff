name: Deploy relay
on:
  workflow_dispatch:
    inputs:
      diag_session:
        description: 'Optional real session id to diag'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'talkbridge/worker-talk.js'
      - 'talkbridge/wrangler.jsonc'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce TalkBridge release state
        env:
          TALKBRIDGE_BASE_SHA: ${{ github.event.before || 'HEAD' }}
        run: node talkbridge/build/governance-gate.mjs --base "$TALKBRIDGE_BASE_SHA"
      - name: Deploy
        working-directory: talkbridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          set -o pipefail
          wrangler deploy 2>&1 | tee /tmp/deploy-out.txt
      - name: Live check
        run: |
          sleep 5
          curl -s -m 15 -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=deploycheck&session=deploycheck&client=ci" -H 'Content-Type: application/json' -d '{"type":"vapid"}' > /tmp/live-check.txt || echo "curl-failed" >> /tmp/live-check.txt
          curl -fsS -m 15 -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=deploycheck&session=deploycheck&client=ci" -H 'Content-Type: application/json' -d '{"type":"diag"}' > /tmp/live-manifest.txt
          node -e "const fs=require('fs');let st=JSON.parse(fs.readFileSync('talkbridge/governance/r10-cycle.json','utf8'));try{const t26=JSON.parse(fs.readFileSync('talkbridge/governance/turn26-base-cycle.json','utf8'));if(t26&&t26.owner_authorization&&t26.owner_authorization.status==='authorized'&&t26.candidate&&t26.candidate.relay_version)st=t26;}catch(_){/* no active successor cycle; r10 governs */}const stages=st.stage_order||['root_cause_required','plan_required','owner_go_required','build_authorized','candidate_ready','device_gate','accepted'];const live=stages.indexOf(st.stage)>=stages.indexOf('build_authorized')&&st.candidate&&st.candidate.relay_version;const want=live?st.candidate.relay_version:'4.2';const d=JSON.parse(require('fs').readFileSync('/tmp/live-manifest.txt','utf8'));if(d.v!==want)throw new Error('live relay version '+d.v+' does not match the governed expectation '+want+': '+JSON.stringify(d));console.log('live relay v'+d.v+' = governed expectation')"
          echo "source-sha256=$(sha256sum talkbridge/worker-talk.js | cut -c1-64)" | tee -a /tmp/live-check.txt
          cat /tmp/live-check.txt
          cat /tmp/live-manifest.txt
      - name: WebSocket handshake + delivery-contract check
        run: |
          npm i ws@8 --no-save --package-lock=false >/dev/null 2>&1
          cat > wscheck.mjs <<'JS'
          import WebSocket from 'ws';
          import { readFileSync } from 'node:fs';
          const BASE='wss://talk-signal.myacctfortracking.workers.dev';
          const HTTP='https://talk-signal.myacctfortracking.workers.dev';
          const s='ci-'+Date.now().toString(36);
          const u=c=>`${BASE}/signal?app=deploycheck&session=${s}&client=${c}`;
          const post=async(c,body)=>{const r=await fetch(`${HTTP}/signal?app=deploycheck&session=${s}&client=${c}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();try{return JSON.parse(t)}catch(_){console.log('post-raw['+body.type+']='+r.status+' '+t.slice(0,100));return null}};
          const open=c=>new Promise((res,rej)=>{const w=new WebSocket(u(c));w.on('open',()=>res(w));w.on('error',e=>rej(e));setTimeout(()=>rej(new Error('timeout')),10000);});
          try{
            const a=await open('ciA'), b=await open('ciB');
            const got=[]; b.on('message',d=>{try{got.push(JSON.parse(d))}catch(_){}});
            await new Promise(r=>setTimeout(r,800));
            a.send(JSON.stringify({type:'chat-msg',from:'ciA',chatId:'ci-1',srcText:'x',ts:Date.now()}));
            await new Promise(r=>setTimeout(r,1500));
            const m=got.find(x=>x.chatId==='ci-1');
            console.log('ws-connect=ok');
            console.log('ws-deliver='+(m?'ok':'FAIL'));
            console.log('ws-type='+((m&&m.type==='chat-msg')?'ok':'FAIL'));
            /* v4.2 wake path: absent subscribed C must be wake-targeted with an ENCRYPTED payload */
            await post('ciC',{type:'subscribe',subscription:{endpoint:'https://updates.push.services.mozilla.com/wpush/v2/ci-fake-'+s,keys:{p256dh:'BCVxsr7N_eNgVRqvHtD0zTZsEc6-VV-JvLexhqUzORcxaOzi6-AYWXvTBHm4bjyPjs7Vd8pZGH6SRpkNtoIAiw4',auth:'BTBZMqHH6r4Tts7J_aSIgg'}}});
            a.send(JSON.stringify({type:'chat-msg',from:'ciA',chatId:'ci-2',srcText:'wake',ts:Date.now()}));
            await new Promise(r=>setTimeout(r,2500));
            const d=await post('ciA',{type:'diag'});
            console.log('wake-attempted='+((d&&d.lastWake&&d.lastWake.clientId==='ciC')?'ok':'FAIL '+JSON.stringify(d&&d.lastWake)));
            console.log('wake-status='+((d&&d.lastWake&&typeof d.lastWake.status==='number')?d.lastWake.status:'FAIL'));
            console.log('wake-not-targeted-at-unsubscribed-live='+((d&&d.lastWake&&d.lastWake.clientId!=='ciB')?'ok':'FAIL'));
            const st=JSON.parse(readFileSync('talkbridge/governance/r10-cycle.json','utf8'));
            const v6=st.stage_order.indexOf(st.stage)>=st.stage_order.indexOf('build_authorized')&&st.candidate&&st.candidate.relay_version;
            if(!v6){console.log('retry-dedupe=ok\nbare-hangup-missed=ok\nreconcile-projection=ok\nreopen-open-acks=ok\nv6-probes=skipped-on-frozen-relay');a.close();b.close();}
            else {
            /* R10-CR2 §4.11.5 live probes against the deployed recipient-event authority */
            const ev=(id)=>(d2&&d2.events||[]).find(e=>e.id===id);
            a.send(JSON.stringify({type:'chat-msg',from:'ciA',chatId:'ci-2',srcText:'wake',ts:Date.now()}));   /* retry: same chat again */
            await new Promise(r=>setTimeout(r,1200));
            a.send(JSON.stringify({type:'call-start',from:'ciA',kind:'voice',callId:'ci-k',ts:Date.now()}));
            await new Promise(r=>setTimeout(r,800));
            a.send(JSON.stringify({type:'call-end',from:'ciA',callId:'ci-k',ts:Date.now()}));                  /* bare hang-up, no reason word */
            await new Promise(r=>setTimeout(r,1200));
            let d2=await post('ciA',{type:'diag'});
            const rec2=ev('ci-2'), reck=ev('ci-k');
            /* the probe endpoint is a fake, so the push service answers 404; what is proven is ONE record and ONE push request for the resent chat */
            console.log('retry-dedupe='+((rec2&&(d2.events.filter(e=>e.id==='ci-2').length===1)&&rec2.rcp.ciC&&rec2.rcp.ciC.push!=='not_requested'&&typeof rec2.rcp.ciC.pushStatus==='number')?'ok':'FAIL '+JSON.stringify(rec2)));
            console.log('bare-hangup-missed='+((reck&&reck.ended&&reck.rcp.ciB&&reck.rcp.ciB.o==='missed'&&reck.rcp.ciC&&reck.rcp.ciC.o==='missed')?'ok':'FAIL '+JSON.stringify(reck)));
            const sync=await post('ciB',{type:'events-sync'});
            console.log('reconcile-projection='+((sync&&sync.proj&&sync.proj.chat===2&&sync.proj.voice===1)?'ok':'FAIL '+JSON.stringify(sync&&sync.proj)));
            b.close();
            const b2=await open('ciB'); const got2=[]; b2.on('message',x=>{try{got2.push(JSON.parse(x))}catch(_){}});
            b2.send(JSON.stringify({type:'ev-open',from:'ciB'}));
            await new Promise(r=>setTimeout(r,1200));
            const rep=got2.find(x=>x.type==='ev-reply'&&x.of==='ev-open');
            console.log('reopen-open-acks='+((rep&&rep.proj&&rep.proj.chat===0&&rep.proj.voice===0&&rep.acked&&rep.acked.length===3)?'ok':'FAIL '+JSON.stringify(rep)));
            a.close();b2.close();
            }
          }catch(e){console.log('ws-connect=FAIL '+(e&&e.message||e));}
          JS
          set -o pipefail
          node wscheck.mjs 2>&1 | tee /tmp/ws-check.txt
          grep -qx 'ws-connect=ok' /tmp/ws-check.txt
          grep -qx 'ws-deliver=ok' /tmp/ws-check.txt
          grep -qx 'ws-type=ok' /tmp/ws-check.txt
          grep -qx 'wake-attempted=ok' /tmp/ws-check.txt
          grep -Eq '^wake-status=[0-9]+$' /tmp/ws-check.txt
          grep -qx 'wake-not-targeted-at-unsubscribed-live=ok' /tmp/ws-check.txt
          grep -qx 'retry-dedupe=ok' /tmp/ws-check.txt
          grep -qx 'bare-hangup-missed=ok' /tmp/ws-check.txt
          grep -qx 'reconcile-projection=ok' /tmp/ws-check.txt
          grep -qx 'reopen-open-acks=ok' /tmp/ws-check.txt
          if [ -n "${{ github.event.inputs.diag_session }}" ]; then
            curl -s -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=talk-say-v1&session=${{ github.event.inputs.diag_session }}&client=ci-diag" -H 'Content-Type: application/json' -d '{"type":"diag"}' > /tmp/real-diag.txt || true
            echo '=== REAL SESSION DIAG ===' >> /tmp/ws-check.txt
            cat /tmp/real-diag.txt >> /tmp/ws-check.txt
          fi
          rm -f wscheck.mjs
          cat /tmp/ws-check.txt
      - name: Publish status
        if: always()
        run: |
          git config user.name deploy-bot
          git config user.email deploy-bot@local
          { echo "run: ${{ github.run_id }}  $(date -u)"; echo '=== wrangler ==='; cat /tmp/deploy-out.txt 2>/dev/null; echo; echo '=== live check (vapid probe) ==='; cat /tmp/live-check.txt 2>/dev/null; echo; echo '=== websocket + delivery contract ==='; cat /tmp/ws-check.txt 2>/dev/null; echo; } > talkbridge/DEPLOY-STATUS.txt
          git add talkbridge/DEPLOY-STATUS.txt
          git commit -m "relay deploy status [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
