name: Deploy relay
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'talkbridge/worker-talk.js'
      - 'talkbridge/wrangler.jsonc'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy
        working-directory: talkbridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          set +e
          wrangler deploy > /tmp/deploy-out.txt 2>&1
          echo "wrangler-exit=$?" >> /tmp/deploy-out.txt
          set -e
          cat /tmp/deploy-out.txt
      - name: Live check
        run: |
          sleep 5
          curl -s -m 15 -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=deploycheck&session=deploycheck&client=ci" -H 'Content-Type: application/json' -d '{"type":"vapid"}' > /tmp/live-check.txt || echo "curl-failed" >> /tmp/live-check.txt
          cat /tmp/live-check.txt
      - name: Publish status
        if: always()
        run: |
          git config user.name deploy-bot
          git config user.email deploy-bot@local
          { echo "run: ${{ github.run_id }}  $(date -u)"; echo '=== wrangler ==='; cat /tmp/deploy-out.txt 2>/dev/null; echo; echo '=== live check (vapid probe) ==='; cat /tmp/live-check.txt 2>/dev/null; echo; } > talkbridge/DEPLOY-STATUS.txt
          git add talkbridge/DEPLOY-STATUS.txt
          git commit -m "relay deploy status [skip ci]" || true
          git pull --rebase origin main || true
          git push || true
