name: Market Navigator Turn 32 Governance
on:
  push:
    paths:
      - 'market-navigator-turn32-governance.py'
      - '.github/workflows/market-navigator-turn32-governance.yml'
permissions:
  contents: write
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python market-navigator-turn32-governance.py
      - name: Commit governance
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MARKET-NAVIGATOR-MASTER-PLAN.md MARKET-NAVIGATOR-GRAVEYARD.md
          if git diff --cached --quiet; then echo 'No governance changes'; exit 0; fi
          git commit -m 'Market Navigator: update Turn 32 plan and graveyard'
          git push
