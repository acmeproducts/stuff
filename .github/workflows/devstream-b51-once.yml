name: Devstream b51 one-shot
on:
  push:
    paths:
      - '.github/workflows/devstream-b51-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch devstream blocker resolution
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          p=Path('devstream-test.html')
          s=p.read_text()
          old='''r.innerHTML=`<div class="tabContext ${stack?'stacked':''}" id="tabContext" style="left:${left}px;top:${top}px"><div class="tabContextMain"><button class="tabContextItem" data-c="rename">Rename<span class="tabContextArrow">›</span></button><button class="tabContextItem" data-c="assign">Assign<span class="tabContextArrow">›</span></button><button class="tabContextItem" data-c="custom">Customize<span class="tabContextArrow">›</span></button><button class="tabContextItem" data-a="download">Download</button><button class="tabContextItem" data-a="share">Share</button></div><div id="tabContextLeaf" class="tabContextLeaf"></div></div>`;'''
          new='''r.innerHTML=`<div class="tabContext ${stack?'stacked':''}" id="tabContext" style="left:${left}px;top:${top}px"><div class="tabContextMain"><button class="tabContextItem" data-c="rename">Rename<span class="tabContextArrow">›</span></button><button class="tabContextItem" data-c="assign">Assign<span class="tabContextArrow">›</span></button>${row.state==='error'?'<button class="tabContextItem" data-c="resolve">Resolve blocker<span class="tabContextArrow">›</span></button>':''}<button class="tabContextItem" data-c="custom">Customize<span class="tabContextArrow">›</span></button><button class="tabContextItem" data-a="download">Download</button><button class="tabContextItem" data-a="share">Share</button></div><div id="tabContextLeaf" class="tabContextLeaf"></div></div>`;'''
          if old not in s: raise SystemExit('openTabContext menu anchor not found')
          s=s.replace(old,new,1)
          old2="""    else if(w==='assign'){leaf.innerHTML=`<div class=\"tabContextTitle\">Assign to project</div><input id=\"ctxAssign\" class=\"tabContextInput\" placeholder=\"Project search\"><div id=\"ctxResults\" class=\"omniResults\"></div>`;const i=$('ctxAssign'),out=$('ctxResults'),draw=()=>{const choices=normalizeProjectOrder().filter(x=>!sot.projects[x].deleted&&x!==row.project&&projectMatches(x,i.value));out.innerHTML=choices.map(x=>`<button class=\"omniResult\" data-id=\"${esc(x)}\"><b>${esc(x)}</b><small>${projectThreads(x).filter(k=>!sot.threads[k].deleted).length} tab(s)</small></button>`).join('')||'<div class=\"tabContextHelp\">No matches.</div>';out.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{closeTabContext();moveThreadToProject(key,b.dataset.id)})};i.oninput=draw;i.onkeydown=e=>{if(e.key==='Escape')closeTabContext()};draw();i.focus()}
    else{const st=tabStyle(key)"""
          new2="""    else if(w==='assign'){leaf.innerHTML=`<div class=\"tabContextTitle\">Assign to project</div><input id=\"ctxAssign\" class=\"tabContextInput\" placeholder=\"Project search\"><div id=\"ctxResults\" class=\"omniResults\"></div>`;const i=$('ctxAssign'),out=$('ctxResults'),draw=()=>{const choices=normalizeProjectOrder().filter(x=>!sot.projects[x].deleted&&x!==row.project&&projectMatches(x,i.value));out.innerHTML=choices.map(x=>`<button class=\"omniResult\" data-id=\"${esc(x)}\"><b>${esc(x)}</b><small>${projectThreads(x).filter(k=>!sot.threads[k].deleted).length} tab(s)</small></button>`).join('')||'<div class=\"tabContextHelp\">No matches.</div>';out.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{closeTabContext();moveThreadToProject(key,b.dataset.id)})};i.oninput=draw;i.onkeydown=e=>{if(e.key==='Escape')closeTabContext()};draw();i.focus()}
    else if(w==='resolve'){leaf.innerHTML=`<div class=\"tabContextTitle\">Resolve blocker</div><div class=\"tabContextHelp\" style=\"margin-bottom:10px\">The failed run stays in history. This only clears whether it still needs attention.</div><button class=\"omniResult\" data-r=\"elsewhere\"><b>Resolved another way</b><small>Clear red; preserve failed run</small></button><button class=\"omniResult\" data-r=\"abandoned\"><b>No longer needed</b><small>Clear red; mark work abandoned</small></button><button class=\"omniResult\" data-r=\"retry\"><b>Retry</b><small>Keep the blocker active and run again</small></button>`;leaf.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>resolveBlockedTab(key,b.dataset.r))}
    else{const st=tabStyle(key)"""
          if old2 not in s: raise SystemExit('assign branch anchor not found')
          s=s.replace(old2,new2,1)
          anchor='''async function renameProjectInline(oldName,newName){'''
          fn='''async function resolveBlockedTab(key,kind){
  const row=sot.threads[key];if(!row||row.state!=='error')return;
  const prior={state:row.state,error:row.error||'',finishedAt:row.finishedAt||''};
  row.resolution={kind,at:now(),prior};
  closeTabContext();
  if(kind==='retry'){
    await saveSOT('devstream: retry blocker '+key);renderTabs();renderSidebar();queueProjectRun(key);toast('Retry queued');return;
  }
  row.state='idle';row.error='';row.finishedAt=now();
  await saveSOT('devstream: resolve blocker '+kind+' '+key);
  renderTabs();renderSidebar();if(activeKey===key)openThread(key);
  toast(kind==='elsewhere'?'Blocker resolved another way':'Blocker marked no longer needed');
}
'''
          if anchor not in s: raise SystemExit('resolve function anchor not found')
          s=s.replace(anchor,fn+anchor,1)
          s=re.sub(r'v1\.0 b\d+','v1.0 b51',s,count=1)
          p.write_text(s)
          bp=Path('devstream-backlog.md')
          if bp.exists():
            b=bp.read_text()
            note='''# 2026-09-29 — b51 failed-tab disposition\n\n- Red/error tabs gain Context → Resolve blocker.\n- Resolved another way: clears attention state while preserving the failed run/error snapshot in `resolution.prior`.\n- No longer needed: clears attention state and records abandoned disposition.\n- Retry: preserves the error state and queues the tab again.\n- No execution history is deleted or rewritten.\n\n---\n\n'''
            if 'b51 failed-tab disposition' not in b: b=note+b
            b=re.sub(r'Current release: v1\.0 b\d+','Current release: v1.0 b51',b,count=1)
            bp.write_text(b)
          Path('.github/workflows/devstream-b51-once.yml').unlink()
      - name: Commit b51
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "devstream b51: add failed-tab blocker resolution"
          git push
