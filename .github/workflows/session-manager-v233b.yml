name: Session Manager v2.3.3 corrected build

on:
  push:
    branches:
      - agent/session-manager-v233-new-chat-inline-rename

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-manager-v233-new-chat-inline-rename
          fetch-depth: 0

      - name: Verify exact v2.3.2 input
        run: test "$(git hash-object session-manager-v3.html)" = "88e3188452394131a85bc80e4691175c997b9422"

      - name: Apply focused v2.3.3 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('session-manager-v3.html')
          before=p.read_text(encoding='utf-8')
          s=before
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1, found {n}')
              s=s.replace(old,new,1)

          # Build identification only; protocol identity remains frozen.
          if s.count('v2.3.2') < 2: raise SystemExit('v2.3.2 build markers missing')
          s=s.replace('v2.3.2','v2.3.3')
          one("const BUILD_VERSION='2.3.2';","const BUILD_VERSION='2.3.3';",'build version')

          # Name itself is the edit affordance; remove pencil.
          one('.label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}',
              '.label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:text}.label:hover{text-decoration:underline;text-underline-offset:3px}', 'label css')
          one('.labelWrap.editing .label,.labelWrap.editing .renameBtn{display:none}.labelWrap.editing .renameInput{display:block}.renameBtn{border:0;background:transparent;color:#6f6f7a;padding:0 3px;opacity:0;font-size:11px}.session:hover .renameBtn,.session.active .renameBtn{opacity:1}.renameBtn:hover{color:var(--am)}',
              '.labelWrap.editing .label{display:none}.labelWrap.editing .renameInput{display:block}', 'rename css')
          one('<span class="label">${esc(name(s))}</span>', '<span class="label" title="Click to rename" role="button" tabindex="0">${esc(name(s))}</span>', 'label markup')
          one('<button class="renameBtn" title="Rename session">✎</button>','', 'pencil markup')
          one(",btn=n.querySelector('.renameBtn'),del=n.querySelector('.trashBtn')", ",label=n.querySelector('.label'),del=n.querySelector('.trashBtn')", 'rename event variable')
          one('e.target===input||e.target===btn||e.target===del','e.target===input||e.target===label||e.target===del','row exclusion')
          one("btn.onclick=e=>{e.stopPropagation();beginRename(k,n)};", "label.onclick=e=>{e.stopPropagation();beginRename(k,n)};label.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();beginRename(k,n)}};", 'rename handler')

          # Native new-session control.
          one('<span class="grow"></span><button class="btn" id="refresh" title="Refresh">↻</button>', '<span class="grow"></span><button class="btn newChatBtn" id="newChat" title="Start a new chat" aria-label="Start a new chat">+ New</button><button class="btn" id="refresh" title="Refresh">↻</button>', 'new button')
          one('.btn:disabled{opacity:.45;cursor:not-allowed}#menu{', '.btn:disabled{opacity:.45;cursor:not-allowed}.newChatBtn{white-space:nowrap;font-weight:800}#menu{', 'new button css')
          marker='function trashStore(){'
          if s.count(marker)!=1: raise SystemExit('newChat insertion marker not unique')
          fn="async function newChat(){if(!state.connected){toast('Gateway is not connected','err');return}let b=$('newChat');if(b)b.disabled=true;try{let r=await rpc('sessions.create',{label:'New chat'},20000),key=String(r?.key||'').trim();if(!key)throw Error('sessions.create returned no session key');await loadSessions();let created=state.sessions.find(x=>x.key===key);if(!created){created=norm({key,label:'New chat',sessionId:r?.sessionId||r?.entry?.sessionId||null,updatedAt:Date.now()});state.sessions.unshift(created);renderSessions()}await select(key);$('message').focus();clearError();toast('New chat created','ok');dbg('SESS','New chat created',{key,sessionId:r?.sessionId||r?.entry?.sessionId||null})}catch(e){showError('New chat failed: '+e.message);toast('New chat failed: '+e.message,'err')}finally{updateComposer()}}\n"
          s=s.replace(marker,fn+marker,1)
          one("function updateComposer(){let s=!!state.current,w=canWrite(),working=s&&sessionState(state.current.key,state.current)==='working';", "function updateComposer(){let s=!!state.current,w=canWrite(),working=s&&sessionState(state.current.key,state.current)==='working';if($('newChat'))$('newChat').disabled=!state.connected;", 'new connection state')
          one("function bind(){$('menu').onclick=toggleSidebar;$('settings').onclick=settings;", "function bind(){$('menu').onclick=toggleSidebar;$('settings').onclick=settings;$('newChat').onclick=newChat;", 'new binding')

          # Protected functions may share physical lines; compare source ranges, not lines.
          def fsrc(text,name):
              m=re.search(rf'(?:async )?function {re.escape(name)}\(',text)
              if not m: raise SystemExit(f'protected function not found: {name}')
              nxt=re.search(r'(?:async )?function [A-Za-z_$][\w$]*\(',text[m.end():])
              end=m.end()+nxt.start() if nxt else len(text)
              return text[m.start():end]
          for name in ['identity','deviceToken','saveDeviceToken','connectParams','rpc','rejectPending','connect','handleConnectError','schedule','reconnect','hostingDefaultGateway','loadSettings']:
              if fsrc(before,name)!=fsrc(s,name): raise SystemExit(f'protected function changed: {name}')

          assert "const APP_VERSION='2.3.0'" in s
          assert "const BUILD_VERSION='2.3.3';" in s
          assert "rpc('sessions.create',{label:'New chat'},20000)" in s
          assert 'id="newChat"' in s
          assert 'renameBtn' not in s
          assert 'title="Click to rename" role="button" tabindex="0"' in s
          assert 'function hostingDefaultGateway()' in s
          p.write_text(s,encoding='utf-8',newline='')
          print('focused patch + protected source-range gates PASS')
          PY

      - name: Syntax and semantic gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text(encoding='utf-8')
          for x in ['Session Manager <span class="version">v2.3.3</span>',"const BUILD_VERSION='2.3.3';","const APP_VERSION='2.3.0'","rpc('sessions.create',{label:'New chat'},20000)",'id="newChat"','function hostingDefaultGateway()']:
              assert x in s,x
          assert 'renameBtn' not in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/v233.js').write_text(js[0],encoding='utf-8')
          print('semantic gates PASS')
          PY
          node --check /tmp/v233.js
          echo 'JavaScript syntax PASS'

      - name: Commit candidate and remove temporary builders
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'acmeproducts'
          git config user.email '182510693+acmeproducts@users.noreply.github.com'
          git rm .github/workflows/session-manager-v233.yml .github/workflows/session-manager-v233b.yml
          git add session-manager-v3.html
          git commit -m 'Session Manager v2.3.3 new chat and click-to-rename'
          git push origin HEAD:agent/session-manager-v233-new-chat-inline-rename
