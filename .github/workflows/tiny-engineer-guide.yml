name: Tiny Engineer guide
on:
  push:
    paths: ['tiny-engineer/**', '.github/workflows/tiny-engineer-guide.yml']
  pull_request:
    paths: ['tiny-engineer/**', '.github/workflows/tiny-engineer-guide.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiny-engineer
      - name: Check the page against its recorded revision
        working-directory: tiny-engineer
        run: sha256sum --check REVIEW.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python tiny-engineer/test_guide.py tiny-engineer/index.html
