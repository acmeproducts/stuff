name: SOT Release B Qualification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SOT/sot-turn02-release-b-engine.py'
      - 'SOT/sot-turn02-release-b-ai.py'
      - 'SOT/sot-turn02-release-b-server.py'
      - 'SOT/sot-turn02-release-b.html'
      - 'SOT/sot-turn02-release-b.service'
      - 'SOT/sot-mount-drive.sh'
      - 'SOT/qualify-release-b.py'
      - 'install-SOT-turn02-release-b.sh'
      - '.github/workflows/sot-release-b-qualify.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Preserve qualified Release A ancestor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object SOT/sot-turn02-pre-base-release-a.html)" = "92810933977e4dfd7d8defcd346b60af29a97954"
          echo "PASS Release A UI ancestor preserved byte-for-byte"

      - name: Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             SOT/sot-turn02-release-b-engine.py             SOT/sot-turn02-release-b-ai.py             SOT/sot-turn02-release-b-server.py             SOT/qualify-release-b.py
          echo "PASS Release B Python compile"

      - name: Release B browser syntax and governed UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("SOT/sot-turn02-release-b.html").read_text()
          js=s.rsplit("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/sot-release-b.js").write_text(js)
          required=[
            "SOT Turn 02 Release B",
            "const names=['Estate','Analyze','Database','Grid','Plan','AI','Activity']",
            "AI Tasks",
            "const AI_CATALOG=[",
            "auto_tag",
            "analyze_estate",
            "explain_duplicates",
            "find_review_candidates",
            "propose_target_structure",
            "plan_target_landing",
            "compare_paths",
            "Compare Paths / Folders",
            "function openAiComparePicker(side)",
            "/api/ai/task/scope",
            "setInterval(volumePoll,7000)",
            "Apply approved tags",
            "function activeAiConfig()",
            "function renderAI()",
            "function buildAiScope()",
            "function confirmApplyAutoTag()",
            "Task is running independently; you can navigate away.",
            "DOMPurify.sanitize(marked.parse",
            "['path','Folder']",
            "if(f==='path')return val(p,'folder')",
            ".dbgrid tbody tr:nth-child(odd) td{background:#20262d;color:#fff}",
            ".dbgrid tbody tr:nth-child(even) td{background:#fff;color:#343a40}",
            "font-weight:800",
            "full.length>25?full.slice(0,25)+'…':full",
            "omniQuery=gridQuery=omniDraft.trim()",
            "omniQuery=gridQuery=gridDraft.trim()",
            "function sharedQuery()",
            "return q||'Entire SOT'",
            "function scopeCaption(s)",
            "Scope is the shared Database/Grid search. Blank search means Entire SOT.",
            "if(!['Estate','Grid','Database','AI'].includes(active))render(active)",
            "loadAiTasks(true,false)",
            "Mount unavailable",
            "function openVolumeIndex(i)",
            "function targetVolumeIndex(i)",
          ]
          missing=[x for x in required if x not in s]
          assert not missing,missing
          assert "AI — available next release" not in s
          assert 'class="ai-inert"' not in s
          assert "['path','Path']" not in s
          assert '#343a40;color:#fff' not in s
          assert 'id="aiScope"' not in s
          assert 'function aiScopeValue()' not in s
          sel=s[s.index("function selectDbRow"):s.index("function renderDatabase")]
          assert "renderDatabase()" not in sel
          fn=s[s.index("function filenameCell"):s.index("function copyText")]
          assert fn.index("viewerlaunch") < fn.index("class=\"fname\"")
          assert "copyText(" in fn and "full.slice(0,25)" in fn
          poll=s[s.index("async function aiPoll"):s.index("function renderActivity")]
          assert "renderAI()" not in poll and "loadAiTasks(true,false)" in poll
          disp=s[s.index("function disp("):s.index("function beginResize")]
          assert "if(f==='path')return val(p,'folder')" in disp
          print("PASS stable Database + shared search + query-scoped flicker-free AI contract")
          PY
          node --check /tmp/sot-release-b.js
          echo "PASS Release B browser JavaScript syntax"

      - name: Backend task authority contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SCHEMA=13' SOT/sot-turn02-release-b-engine.py
          grep -F 'CREATE TABLE IF NOT EXISTS ai_tasks' SOT/sot-turn02-release-b-engine.py
          grep -F 'CREATE TABLE IF NOT EXISTS ai_turns' SOT/sot-turn02-release-b-engine.py
          grep -F 'https://api.venice.ai/api/v1/chat/completions' SOT/sot-turn02-release-b-ai.py
          grep -F 'https://openrouter.ai/api/v1/chat/completions' SOT/sot-turn02-release-b-ai.py
          grep -F 'Auto Tag proposal is stale' SOT/sot-turn02-release-b-ai.py
          grep -F 'self.metadata_update' SOT/sot-turn02-release-b-ai.py
          grep -F '/api/ai/task/apply' SOT/sot-turn02-release-b-server.py
          grep -F 'def windows_logical_drives()' SOT/sot-turn02-release-b-server.py
          grep -F 'Get-CimInstance Win32_LogicalDisk' SOT/sot-turn02-release-b-server.py
          grep -F 'def verified_windows_mount(letter)' SOT/sot-turn02-release-b-server.py
          grep -F 'def ensure_windows_drive_mounted(letter,force=False)' SOT/sot-turn02-release-b-server.py
          grep -F 'subprocess.run(["sudo","-n",MOUNT_HELPER' SOT/sot-turn02-release-b-server.py
          grep -F 'def reconcile_ai_scope(scope)' SOT/sot-turn02-release-b-server.py
          grep -F '/api/ai/task/scope' SOT/sot-turn02-release-b-server.py
          grep -F '"compare_paths"' SOT/sot-turn02-release-b-ai.py
          grep -F 'def compare_packet(self,scope,probe_limit=400)' SOT/sot-turn02-release-b-ai.py
          grep -F '"ffprobe"' SOT/sot-turn02-release-b-ai.py
          ! grep -E 'sudo mount|wsl.exe .* -u root .*mount' SOT/sot-turn02-release-b-server.py
          ! grep -F 'os.remove' SOT/sot-turn02-release-b-ai.py
          ! grep -F 'shutil.move' SOT/sot-turn02-release-b-ai.py
          echo "PASS task-specific AI authority boundary"

      - name: Installer syntax and rollback contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n install-SOT-turn02-release-b.sh
          grep -F 'REF="e74482f24cc74f49241da41095a2a77e5e11b9fb"' install-SOT-turn02-release-b.sh
          grep -F 'DB12="$HOME/.sot-turn02/sot-v12-release-a.db"' install-SOT-turn02-release-b.sh
          grep -F 'DB13="$HOME/.sot-turn02/sot-v13-release-b.db"' install-SOT-turn02-release-b.sh
          grep -F 'Release A migration snapshot materialized as schema-13 seed' install-SOT-turn02-release-b.sh
          grep -F 'Release A predecessor frozen for cutover' install-SOT-turn02-release-b.sh
          grep -F 'rollback()' install-SOT-turn02-release-b.sh
          grep -F 'prior inactive schema-13 attempt archived' install-SOT-turn02-release-b.sh
          grep -F 'Release A predecessor preserved' install-SOT-turn02-release-b.sh
          grep -F 'shared-origin Release B HTTPS' install-SOT-turn02-release-b.sh
          grep -F 'sot-mount-drive.sh' install-SOT-turn02-release-b.sh
          grep -F 'visudo -cf' install-SOT-turn02-release-b.sh
          grep -F 'NOPASSWD: %s' install-SOT-turn02-release-b.sh
          grep -F 'len(a["task_types"])==7' install-SOT-turn02-release-b.sh
          bash -n SOT/sot-mount-drive.sh
          grep -F '[[ "$#" -ne 1 || ! "$1" =~ ^[A-Za-z]$ ]]' SOT/sot-mount-drive.sh
          grep -F 'ROOT="/mnt/$LOWER"' SOT/sot-mount-drive.sh
          grep -F 'mount -t drvfs "$EXPECTED" "$ROOT"' SOT/sot-mount-drive.sh
          grep -F '"$fstype" == "drvfs" || "$fstype" == "9p"' SOT/sot-mount-drive.sh
          grep -F 'refusing conflicting mount' SOT/sot-mount-drive.sh
          test "$(printf '%s' 'C:\x5c' | sed -E 's/(\\x5c|\\x2f|[\\/])+$//')" = "C:"
          python3 - <<'PY'
          from pathlib import Path
          src=Path("SOT/sot-turn02-release-b-server.py").read_text()
          assert "def normalize_mount_source(v):" in src
          assert 'chr(92)+"x5c"' in src
          assert 'chr(92)+"x2f"' in src
          print("PASS escaped findmnt Windows source normalization contract")
          PY
          set +e
          bash SOT/sot-mount-drive.sh ZZ >/tmp/mount-helper.out 2>&1
          rc=$?
          set -e
          test "$rc" -eq 64
          ! grep -E 'tailscale serve .*--set-path|tailscale serve --bg' install-SOT-turn02-release-b.sh
          echo "PASS Release B staged rollback-safe installer"

      - name: Disposable Release B qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 SOT/qualify-release-b.py
