name: Apply WorldPulse adaptive restack
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch globe layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('globe.html')
          s=p.read_text()
          s=s.replace('WorldPulse Sphere v2.6.1','WorldPulse Sphere v2.6.2')
          old="function offset(i,n,focused=false){const g=Math.PI*(3-Math.sqrt(5)),r=focused?.55:(.16+.13*Math.min(1,n/42)),a=g*i;return{x:Math.cos(a)*r*(.22+(i%7)/8),y:Math.sin(a)*r*(.22+((i*3)%7)/8),z:Math.sin(a*1.7)*r*.56}}"
          new="function clusterOffset(c,i,n,focused=false){const g=Math.PI*(3-Math.sqrt(5)),a=g*i,fill=Math.sqrt((i+.5)/Math.max(1,n)),spread=focused?.72:Math.min(.40,.13+.045*Math.sqrt(Math.max(1,n))),rr=spread*fill,ln=Math.hypot(c.x,c.y,c.z)||1,nx=c.x/ln,ny=c.y/ln,nz=c.z/ln,ax=Math.abs(ny)<.88?0:1,ay=Math.abs(ny)<.88?1:0,az=0,ux=ay*nz-az*ny,uy=az*nx-ax*nz,uz=ax*ny-ay*nx,ul=Math.hypot(ux,uy,uz)||1;ux/=ul;uy/=ul;uz/=ul;const vx=ny*uz-nz*uy,vy=nz*ux-nx*uz,vz=nx*uy-ny*ux,wobble=(focused?.08:.045)*Math.sin(a*1.7);return{x:ux*Math.cos(a)*rr+vx*Math.sin(a)*rr+nx*wobble,y:uy*Math.cos(a)*rr+vy*Math.sin(a)*rr+ny*wobble,z:uz*Math.cos(a)*rr+vz*Math.sin(a)*rr+nz*wobble}}"
          if old not in s: raise SystemExit('offset function target not found')
          s=s.replace(old,new,1)
          old2="const o=offset(i,cnt[k],!!focusCluster),c=cs[k]||{x:0,y:0,z:0};return{x:c.x+o.x,y:c.y+o.y,z:c.z+o.z,cluster:k}"
          new2="const c=cs[k]||{x:0,y:0,z:.1},o=clusterOffset(c,i,cnt[k],!!focusCluster);return{x:c.x+o.x,y:c.y+o.y,z:c.z+o.z,cluster:k}"
          if old2 not in s: raise SystemExit('point packing target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add globe.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: adaptive sphere restack after filter changes"
          git push
