name: SOT 6.7.3 governance update
on:
  push:
    paths:
      - '.github/workflows/sot-673-governance.yml'
permissions:
  contents: write
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update project plan and graveyard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()
          ruling='''\n## 0.2B Mounted-volume rollback ruling — 2026-08-18\n\n- Build 6.7/6.7.1 introduced a Project Setup regression by replacing the 6.6 browse contract with shallow folder-only enumeration and by treating Windows drive-letter discovery as if it proved WSL readability.\n- Build 6.7.2 changed telemetry presentation only; it did not repair the mounted-volume regression.\n- 6.7.x is therefore not an accepted backend baseline for source browsing. The retry must first restore the verified 6.6 backend/UI pair, prove 6.6 health, and then reconstruct the 6.7 parallel/fingerprint work from that 6.6 baseline.\n- A source root shown in Project Setup must be readable by the production `openclaw-report-server.service` process. Drive-letter visibility from Windows is not sufficient evidence.\n- `/api/sot/fs` must preserve both `folders` and root-level `files`; root files may not be silently discarded.\n- An unreadable advertised volume must return an explicit unavailable/error state. It must never be represented as a successful empty folder.\n- Release gates must browse every advertised readable root through the same production API used by the UI before owner testing.\n- Q:, R:, and any other mounted volumes are not special cases; the rule applies to every root returned by the filesystem adapter.\n- The retry release is build `2026.08.18.6.7.3-wsl-mount-safe`; it retains the single production report server and introduces no service, port, proxy, or Tailscale topology change.\n\n'''
          if '## 0.2B Mounted-volume rollback ruling — 2026-08-18' not in s:
              anchor='## 0.3 Established plumbing — keep'
              if anchor not in s: raise SystemExit('governance anchor missing')
              s=s.replace(anchor,ruling+anchor,1)
          grave='''\n\n## Graveyard addendum — mounted-volume regression\n\n**G-FS-SHALLOW-ROOT — shallow folder-only Project Setup browse (BURIED / VETOED).** Do not override the established filesystem browse contract with immediate-child-folder-only results that discard root-level files.\n\n**G-FS-DRIVE-VISIBILITY — treating Windows drive-letter discovery as proof of WSL readability (BURIED / VETOED).** A drive may be displayed as readable only after the production report-server process can actually open/enumerate its WSL path. If it cannot, expose `available=false` plus the error; never return a false empty-success state.\n'''
          if 'G-FS-SHALLOW-ROOT' not in s:
              s += grave
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-backlog.md
          git commit -m 'Lock mounted-volume rollback and bury shallow browse regression'
          git push
# trigger: owner-approved retry
