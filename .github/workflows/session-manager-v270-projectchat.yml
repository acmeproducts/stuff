name: Session Manager v2.7.0 ProjectChat
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/session-manager-v270.py'
      - '.github/workflows/session-manager-v270-projectchat.yml'
permissions:
  contents: write
concurrency:
  group: session-manager-v270-projectchat
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Backup governed baseline
        run: |
          mkdir -p .release-backups/session-manager-v270
          cp session-manager-v3.html .release-backups/session-manager-v270/session-manager-v3.v260.html
          cp session-manager-backlog.md .release-backups/session-manager-v270/session-manager-backlog.pre-v111.md
      - name: Repair builder anchor
        run: |
          python3 - <<'PY'
          p='.github/scripts/session-manager-v270.py'
          lines=open(p,encoding='utf-8').read().splitlines()
          found=False
          for i,line in enumerate(lines):
            if "context helpers insertion" in line and line.lstrip().startswith('one('):
              lines[i]="one(\"function moveSessionToProject(k,targetId){\",helpers+\"function moveSessionToProject(k,targetId){\",'context helpers insertion')"
              found=True
              break
          assert found,'context helper insertion statement not found'
          open(p,'w',encoding='utf-8').write('\n'.join(lines)+'\n')
          PY
      - name: Build v2.7.0
        run: python3 .github/scripts/session-manager-v270.py
      - name: Syntax and semantic gates
        run: |
          python3 - <<'PY'
          import re
          s=open('session-manager-v3.html',encoding='utf-8').read()
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert m, 'script block missing'
          open('/tmp/session-manager-v270.js','w',encoding='utf-8').write(m.group(1))
          req=["const BUILD_VERSION='2.7.0'","ProjectChat","openTabContext","projectSearchTokens","wildcardMatch","Customize","tabStyles","reorderSessionInCurrentProject","oncontextmenu","sessions.patch"]
          for x in req: assert x in s,x
          assert "const APP_VERSION='2.3.0'" in s
          print('v2.7 semantic gates passed')
          PY
          node --check /tmp/session-manager-v270.js
      - name: Publish and clean temporary builder
        run: |
          rm -f .github/scripts/session-manager-v270.py .github/workflows/session-manager-v270-projectchat.yml
          git add session-manager-v3.html session-manager-backlog.md .release-backups/session-manager-v270 .github/scripts/session-manager-v270.py .github/workflows/session-manager-v270-projectchat.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Release Session Manager v2.7.0 ProjectChat interactions'
          git push origin HEAD:main