name: Market Navigator R6 click diagnostic
on:
  push:
    paths: ['.github/workflows/market-navigator-gate4-r6-click-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          cp market-view-gate4-r3.html /tmp/r6.html
          cp market-view-gate4-r6.js /tmp/r6.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/r6.js');s=p.read_text()
          for a,b in [
          ("Object.assign(H,{1d:{label:'1D'},5d:{label:'5D'},mtd:{label:'MTD',mtd:true},ytd:{label:'YTD',ytd:true},1y:{label:'1YR',days:365},3y:{label:'3YR',days:1095},5y:{label:'5YR',days:1825}})","Object.assign(H,{'1d':{label:'1D'},'5d':{label:'5D'},mtd:{label:'MTD',mtd:true},ytd:{label:'YTD',ytd:true},'1y':{label:'1YR',days:365},'3y':{label:'3YR',days:1095},'5y':{label:'5YR',days:1825}})"),
          ("function metaFromCatalog(){","function metaFromCatalog(){state.meta=state.meta||{};"),
          ("CATEGORY[k].components=defs[k].components.map(x=>x.id)}\nfunction componentDef","CATEGORY[k].components=defs[k].components.map(x=>x.id)}}\nfunction componentDef"),
          ("effect:null}})}}\n}\nfunction expectedFor","effect:null}})}}\nfunction expectedFor"),
          ("$$('[data-r6-component]').forEach(b=>b.onclick=()=>openDetail(b.dataset.r6Component));","$$('[data-r6-component]').forEach(b=>b.onclick=async e=>{console.log('R6CLICK',b.dataset.r6Component);e?.preventDefault?.();e?.stopImmediatePropagation?.();try{await drawV3([b.dataset.r6Component]);console.log('R6DRAW3DONE')}catch(err){window.__CLICKERR__=err.stack||String(err);console.error('R6DRAW3ERR',err)}});")]:
            if a not in s: raise SystemExit('missing '+a[:50])
            s=s.replace(a,b,1)
          p.write_text(s)
          h=Path('/tmp/r6.html');x=h.read_text()
          for a,b in [
          ("(async()=>{configLoad();await openDB();await loadStored();renderAll();setSection('now');","(async()=>{if(window.__MN_R6_BUILD__)return;configLoad();await openDB();await loadStored();renderAll();setSection('now');"),
          ("setTimeout(()=>{renderGlobalRange();renderAll()},0);","if(!window.__MN_R6_BUILD__)setTimeout(()=>{renderGlobalRange();renderAll()},0);"),
          ("window.addEventListener('hashchange',route391);","if(!window.__MN_R6_BUILD__)window.addEventListener('hashchange',route391);"),
          ("setTimeout(()=>{if(!location.hash)history.replaceState(null,'','#home');route391();$('#status').textContent='Connecting to market data…'},0);","if(!window.__MN_R6_BUILD__)setTimeout(()=>{if(!location.hash)history.replaceState(null,'','#home');route391();$('#status').textContent='Connecting to market data…'},0);")]:x=x.replace(a,b,1)
          x=x.replace('</head>','<link rel="stylesheet" href="/market-view-gate4-r6.css"><script>window.__MN_R6_BUILD__=true;</script></head>',1).replace('</body>','<script src="/r6.js"></script></body>',1);h.write_text(x)
          PY
          cp /tmp/r6.html r6.html; cp /tmp/r6.js r6.js
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null 2>&1 && npm i playwright@1.55.0 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"; python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          cat >/tmp/pw/t.js <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true}),p=await b.newPage({viewport:{width:1366,height:768}});p.on('console',m=>console.log('CONSOLE',m.type(),m.text()));p.on('pageerror',e=>console.log('PAGEERROR',e.stack||e));await p.goto('http://127.0.0.1:8765/r6.html');await p.waitForTimeout(2500);await p.locator('[data-r6-index="risk"]').click();await p.waitForTimeout(250);await p.evaluate(()=>document.addEventListener('click',e=>console.log('CAPTURE',e.target.tagName,e.target.className,e.target.dataset?.r6Component||''),true));const q=await p.locator('[data-r6-component]').first().evaluate(e=>{const r=e.getBoundingClientRect(),z=document.elementFromPoint(r.x+r.width/2,r.y+r.height/2);return{id:e.dataset.r6Component,onclick:String(e.onclick),disabled:e.disabled,rect:r.toJSON(),centerTarget:{tag:z?.tagName,cls:z?.className,id:z?.id,text:z?.textContent?.slice(0,80)}}});console.log('BEFORE',q);await p.locator('[data-r6-component]').first().click();await p.waitForTimeout(700);console.log('AFTER_CLICK',await p.evaluate(()=>({clickerr:window.__CLICKERR__||null,title:document.querySelector('#detailTitle')?.textContent,stats:document.querySelector('#detailStats')?.className,conv:document.querySelectorAll('.r6Conversation').length,overlay:document.querySelectorAll('.r6SummaryOverlay').length})));await p.locator('[data-r6-component]').first().dispatchEvent('click');await p.waitForTimeout(700);console.log('AFTER_DISPATCH',await p.evaluate(()=>({clickerr:window.__CLICKERR__||null,title:document.querySelector('#detailTitle')?.textContent,stats:document.querySelector('#detailStats')?.className,conv:document.querySelectorAll('.r6Conversation').length,overlay:document.querySelectorAll('.r6SummaryOverlay').length})));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/pw/t.js
