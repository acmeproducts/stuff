name: Patch Market Navigator 3.9.2
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 3.9.2 cache-first and drill-through patch
        run: python3 scripts/patch_market_view_392.py
      - name: Validate 3.9.2 startup, chart and navigation contract
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert '<title>Market Navigator 3.9.2</title>' in s
          assert 'Version 3.9.2' in s
          assert "const VERSION='3.9.2'" in s
          assert 'ensureFoundation392' in s
          assert 'refreshStale392' in s
          assert "Ready · local history" in s
          assert 'throughline392' in s
          assert 'dateRangeLabel392' in s
          assert 'chartTipSwatch' in s
          assert "$('#refreshBtn').onclick=()=>refreshStale392(true)" in s
          assert 'await foundation();await incremental(false)' not in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Make Market Navigator cache-first and clarify regime drill-through'
          git pull --rebase origin main
          git push origin HEAD:main
