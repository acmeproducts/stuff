name: Patch Market Navigator 3.9.3
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 3.9.3 patch
        run: python3 scripts/patch_market_view_393.py
      - name: Validate 3.9.3
        shell: bash
        run: |
          python3 -c "import re; s=open('market-view.html').read(); assert '<title>Market Navigator 3.9.3</title>' in s; assert 'Version 3.9.3' in s; assert \"const VERSION='3.9.3'\" in s; assert 'Refresh due data' not in s; assert 'function openRegime393' in s; assert 'function categoryHistory393' in s; assert 'microGrid393' in s; assert 'Add to Library' in s; assert 'Add to Analysis' in s; assert 'mn393-foundation-attempt' in s; js=re.search(r'<script>([\\s\\S]*?)</script>',s).group(1); open('/tmp/market-view.js','w').write(js)"
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Refine Market Navigator regime and category drilldowns'
          git pull --rebase origin main
          git push origin HEAD:main
