name: Patch Market Navigator 3.9
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply global horizon and category-index patch
        run: python3 scripts/patch_market_view_390.py
      - name: Validate model contract and JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert 'Version 3.9' in s
          assert "const VERSION='3.9.0'" in s
          assert 'id="globalRange"' in s
          assert 'const CATEGORY=' in s
          assert "risk:{name:'Risk'" in s
          assert "growth:{name:'Growth'" in s
          assert "macro:{name:'Macro'" in s
          assert 'REGIME SENTIMENT INDEX · 0–100' in s
          assert 'function renderGlobalRange' in s
          assert 'async function openCategory' in s
          assert 'state.detail={id,range:state.range}' in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Unify horizons and add category indexes to Market Navigator'
          git pull --rebase origin main
          git push origin HEAD:main
