name: Patch Market Navigator 3.5.1
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch_market_view_351.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert 'Version 3.5.1' in s
          assert "const APP_VERSION='3.5.1'" in s
          assert 'ensureOverviewHorizon' in s
          assert 'bootstrapHistory' in s
          assert 'exactRangeSeries' in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Fix Market Navigator history coverage and horizon integrity'
          git push origin HEAD:main
