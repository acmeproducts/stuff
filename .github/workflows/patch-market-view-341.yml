name: Patch Market Navigator 3.8.1
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply regime history repair
        run: python3 scripts/patch_market_view_381.py
      - name: Validate data repair and JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert 'Version 3.8.1' in s
          assert "const VERSION='3.8.1'" in s
          assert "const REGIME_SERIES=['spy','tenYear','wti']" in s
          assert 'repairRegimeHistory' in s
          assert "regimeFetch(id,full?'5y':'1mo')" in s
          assert "provider:'Yahoo Finance'" in s
          assert 'Regime history repaired' in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Repair SPY 10Y WTI historical foundation and incremental refresh'
          git push origin HEAD:main
