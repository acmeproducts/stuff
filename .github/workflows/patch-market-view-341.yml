name: Patch Market Navigator 3.7
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply formal navigation patch
        run: python3 scripts/patch_market_view_370.py
      - name: Validate navigation and JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert 'Version 3.7' in s
          assert "const APP_VERSION='3.7.0'" in s
          assert 'data-section="markets"' not in s
          assert "markets:[" not in s
          assert "macro:[['inflation','Inflation'],['rates','Rates']]" in s
          assert 'function openSeriesModal' in s
          assert 'Save to Analysis' in s
          assert 'function saveCompositeSnapshot' in s
          assert 'function saveSeriesSnapshot' in s
          assert 'overflow:hidden' in s
          assert "showSection('markets'" not in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Revamp Market Navigator navigation to formal snapshot flow'
          git push origin HEAD:main
