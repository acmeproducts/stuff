name: Patch Market Navigator 3.8.2
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply null-close and history repair
        run: python3 scripts/patch_market_view_382.py
      - name: Validate data repair and JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert 'Version 3.8.2' in s
          assert "const VERSION='3.8.2'" in s
          assert "typeof raw!=='number'" in s
          assert 'raw<=0' in s
          assert 'localStorage.removeItem(REGIME_FOUNDATION_KEY)' in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Reject Yahoo null closes and rebuild regime history'
          git pull --rebase origin main
          git push origin HEAD:main
