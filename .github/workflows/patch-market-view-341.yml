name: Patch Market Navigator 3.9.1
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-341.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply 3.9.1 market-data, router, chart and accessibility patch
        run: python3 scripts/patch_market_view_391.py
      - name: Validate 3.9.1 contract and JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert '<title>Market Navigator 3.9.1</title>' in s
          assert 'Version 3.9.1' in s
          assert "const VERSION='3.9.1'" in s
          assert 'new Worker' in s and 'new Blob' in s
          assert 'parseMarketJSON391' in s
          assert "fetch(u,{cache:'no-store'})" in s
          assert '#detail/' in s and 'hashchange' in s
          assert 'data-ticker=' in s and "ArrowDown" in s and "ArrowUp" in s
          assert 'exportCSV391' in s
          assert 'Regime sentiment index' in s
          assert 'index:true' in s
          assert 'hoverValue391' in s
          assert 'Connecting to market data…' in s
          assert 'Loading stored data…' not in s
          assert 'Verification checklist:' in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit patch
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Upgrade Market Navigator data loading routing charts and accessibility'
          git pull --rebase origin main
          git push origin HEAD:main
