name: SOT 6.9 hardening
on:
  push:
    paths:
      - '.github/workflows/sot-690-hardening.yml'
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden path identity, atomic project path edits, and UI override
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sot-backend-6.9-path-centric-addon.js'); s=p.read_text()
          s=s.replace(" CREATE TABLE IF NOT EXISTS file_hash_cache(\n  path_id TEXT NOT NULL, relative_path TEXT NOT NULL, size INTEGER NOT NULL,\n  modified_at REAL NOT NULL, sha256 TEXT NOT NULL, verified_at TEXT NOT NULL,\n  PRIMARY KEY(path_id,relative_path,size,modified_at));", " CREATE TABLE IF NOT EXISTS file_hash_cache(\n  path_id TEXT NOT NULL, relative_path TEXT NOT NULL, size INTEGER NOT NULL,\n  modified_at REAL NOT NULL, sha256 TEXT NOT NULL, verified_at TEXT NOT NULL,\n  PRIMARY KEY(path_id,relative_path,size,modified_at));\n CREATE TABLE IF NOT EXISTS file_locator_cache(\n  volume_id TEXT NOT NULL, volume_relative_path TEXT NOT NULL, size INTEGER NOT NULL,\n  modified_at REAL NOT NULL, sha256 TEXT NOT NULL, verified_at TEXT NOT NULL,\n  PRIMARY KEY(volume_id,volume_relative_path,size,modified_at));")
          s=s.replace("'file_hash_cache','explorer_index'", "'file_hash_cache','file_locator_cache','explorer_index'")
          a=s.index('function pcWindowsVolumeIdentity(root){')
          b=s.index('\nfunction pcIdentity(locator){',a)
          new=r'''function pcWindowsVolumeIdentity(root){
 if(!root)return null;if(pcVolumeCache.has(root))return pcVolumeCache.get(root);
 const letter=root.slice(-1).toUpperCase(),ps='/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe';let id=null;
 try{if(fs.existsSync(ps)){
  const cmd=`$d=Get-CimInstance Win32_LogicalDisk -Filter \"DeviceID='${letter}:'\" -ErrorAction SilentlyContinue; if($d){ Write-Output (($d.VolumeSerialNumber)+'|'+($d.FileSystem)+'|'+($d.Size)) }`;
  const out=execFileSync(ps,['-NoProfile','-Command',cmd],{encoding:'utf8',timeout:7000,maxBuffer:1024*1024}).trim();if(out&&out!=='||')id='windows-volume:'+out;
  if(!id){const cmd2=`$v=Get-Volume -DriveLetter '${letter}' -ErrorAction SilentlyContinue; if($v){ Write-Output (($v.UniqueId)+'|'+($v.SerialNumber)+'|'+($v.FileSystem)) }`;const out2=execFileSync(ps,['-NoProfile','-Command',cmd2],{encoding:'utf8',timeout:7000,maxBuffer:1024*1024}).trim();if(out2&&out2!=='||')id='windows-volume:'+out2;}
 }}catch(e){recoveryLog('warn','identity','volume.identity.failed',{root,error:e.message},null,null,root)}
 if(!id){try{const st=fs.statSync(root);id='wsl-device:'+String(st.dev)+':'+root}catch{id='locator:'+root}}
 pcVolumeCache.set(root,id);return id;
}'''
          s=s[:a]+new+s[b:]
          a=s.index('function pcReplaceProjectPaths(projectToken,input){')
          b=s.index('\nfunction pcCacheForFile',a)
          new=r'''function pcReplaceProjectPaths(projectToken,input){
 pcEnsureSchema();const p=project(projectToken);if(!p)throw new Error('project not found');const now=pcNow(),wanted=[];
 for(const x of input||[]){const raw=String(x.path||x.locator||'').trim();if(!raw)continue;const locator=path.resolve(raw);pcAssertPath(locator);const i=pcIdentity(locator),label=String(x.operator_label||x.name||path.basename(locator)||locator),note=String(x.note||x.operator_note||'');wanted.push({...i,label,note});}
 const ids=new Set(wanted.map(x=>x.path_id)),existing=pcProjectPaths(projectToken),statements=[];
 for(const e of existing)if(!ids.has(e.path_id)){statements.push(`UPDATE project_paths SET removed_at=${esc(now)} WHERE project_token=${esc(projectToken)} AND path_id=${esc(e.path_id)};`);if(e.source_id)statements.push(`DELETE FROM sources WHERE project_token=${esc(projectToken)} AND source_id=${esc(e.source_id)};`)}
 for(const w of wanted){const sid=sourceId(projectToken,'wsl_path',w.locator);statements.push(`INSERT INTO sources(source_id,project_token,source_type,original_path_or_locator,normalized_path_or_locator,operator_label,operator_note,registered_at,source_status) VALUES(${esc(sid)},${esc(projectToken)},'wsl_path',${esc(w.locator)},${esc(w.locator)},${esc(w.label)},${esc(w.note)},${esc(now)},'registered') ON CONFLICT(project_token,source_type,normalized_path_or_locator) DO UPDATE SET operator_label=excluded.operator_label,operator_note=excluded.operator_note;`);statements.push(`INSERT INTO project_paths(project_token,path_id,source_id,operator_label,operator_note,added_at,removed_at) VALUES(${esc(projectToken)},${esc(w.path_id)},${esc(sid)},${esc(w.label)},${esc(w.note)},${esc(now)},NULL) ON CONFLICT(project_token,path_id) DO UPDATE SET source_id=excluded.source_id,operator_label=excluded.operator_label,operator_note=excluded.operator_note,removed_at=NULL;`)}
 statements.push(`UPDATE projects SET updated_at=${esc(now)},status=CASE WHEN status='Closed' THEN 'Pending' ELSE status END WHERE project_token=${esc(projectToken)};`);
 sql('BEGIN;'+statements.join('')+'COMMIT;');audit('projects',projectToken,'replace_paths',{paths:wanted.map(x=>x.locator)});return pcProjectPaths(projectToken);
}'''
          s=s[:a]+new+s[b:]
          a=s.index('function pcCacheForFile(projectToken,f){')
          b=s.index('\nfunction pcRefreshPathSummary',a)
          new=r'''function pcCacheForFile(projectToken,f){
 const src=rows(`SELECT normalized_path_or_locator FROM sources WHERE project_token=${esc(projectToken)} AND source_id=${esc(f.source_id)} LIMIT 1`)[0];if(!src)return null;const i=pcIdentity(src.normalized_path_or_locator),volumeRel=(i.relative_root==='.'?f.relative_path:(i.relative_root+'/'+f.relative_path)).replace(/^\.\//,'');
 const direct=rows(`SELECT sha256 FROM file_hash_cache WHERE path_id=${esc(i.path_id)} AND relative_path=${esc(f.relative_path)} AND size=${Number(f.size)} AND modified_at=${Number(f.modified_at)} LIMIT 1`)[0]?.sha256;
 const relocated=rows(`SELECT sha256 FROM file_locator_cache WHERE volume_id=${esc(i.volume_id)} AND volume_relative_path=${esc(volumeRel)} AND size=${Number(f.size)} AND modified_at=${Number(f.modified_at)} LIMIT 1`)[0]?.sha256;
 return {...i,volume_relative_path:volumeRel,cache:direct||relocated||null};
}
function pcRecordFile(i,f,sha,status='done'){
 const now=pcNow(),fn=path.basename(f.relative_path);sql(`INSERT INTO file_observations(path_id,relative_path,filename,full_path,size,modified_at,sha256,status,observed_at) VALUES(${esc(i.path_id)},${esc(f.relative_path)},${esc(fn)},${esc(f.full_path)},${Number(f.size)},${Number(f.modified_at)},${sha?esc(sha):'NULL'},${esc(status)},${esc(now)}) ON CONFLICT(path_id,relative_path) DO UPDATE SET filename=excluded.filename,full_path=excluded.full_path,size=excluded.size,modified_at=excluded.modified_at,sha256=excluded.sha256,status=excluded.status,observed_at=excluded.observed_at;`);if(sha)sql(`INSERT INTO file_catalog(sha256,size,first_seen_at,last_seen_at) VALUES(${esc(sha)},${Number(f.size)},${esc(now)},${esc(now)}) ON CONFLICT(sha256) DO UPDATE SET last_seen_at=excluded.last_seen_at;INSERT OR REPLACE INTO file_hash_cache(path_id,relative_path,size,modified_at,sha256,verified_at) VALUES(${esc(i.path_id)},${esc(f.relative_path)},${Number(f.size)},${Number(f.modified_at)},${esc(sha)},${esc(now)});INSERT OR REPLACE INTO file_locator_cache(volume_id,volume_relative_path,size,modified_at,sha256,verified_at) VALUES(${esc(i.volume_id)},${esc(i.volume_relative_path)},${Number(f.size)},${Number(f.modified_at)},${esc(sha)},${esc(now)});`);
}'''
          s=s[:a]+new+s[b:]
          # Conservative target requirement includes bytes not yet fingerprinted.
          s=s.replace("let groups=0,dupFiles=0,reclaim=0,uniqueCopy=0;", "let groups=0,dupFiles=0,reclaim=0,uniqueCopy=0;const unknownBytes=vals.filter(x=>!x.sha256).reduce((a,x)=>a+Number(x.size||0),0);")
          s=s.replace("target_copy_bytes:uniqueCopy,target_required_with_10pct_margin:Math.ceil(uniqueCopy*1.10)", "target_copy_bytes:uniqueCopy+unknownBytes,target_required_with_10pct_margin:Math.ceil((uniqueCopy+unknownBytes)*1.10)")
          p.write_text(s)

          u=Path('sot-ui-6.9-path-centric-addon.js'); x=u.read_text()
          x=x.replace(' function renderSetup(statusText){\n', ' renderSetup=function(statusText){\n',1)
          # function assignment needs semicolon at its closing point before Reporting comment
          x=x.replace("  $$('[data-root-id]').forEach", "  $$('[data-root-id]').forEach",1)
          marker="  $$('[data-root-id]').forEach"
          # Find the setup function's final ' }\n // SOT Database Explorer'
          x=x.replace(";pcPollIndex();\n }\n // SOT Database Explorer", ";pcPollIndex();\n };\n // SOT Database Explorer",1)
          u.write_text(x)
          PY
          node --check sot-backend-6.9-path-centric-addon.js
          node --check sot-ui-6.9-path-centric-addon.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sot-backend-6.9-path-centric-addon.js sot-ui-6.9-path-centric-addon.js
          git commit -m 'Harden 6.9 path identity and project editing'
          git push
