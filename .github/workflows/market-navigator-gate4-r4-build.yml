name: Market Navigator Gate 4 R4 build

on:
  push:
    branches: [main]
    paths:
      - "market-gate4-r4-overlay.js"
      - ".github/workflows/market-navigator-gate4-r4-build.yml"

permissions:
  contents: write

concurrency:
  group: market-navigator-gate4-r4-build
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Assemble from restored 3.9.7 baseline
        run: |
          set -euo pipefail
          cp market-view-gate4-r3.html market-view-gate4-r4.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market-view-gate4-r4.html')
          h=p.read_text()
          overlay=Path('market-gate4-r4-overlay.js').read_text()
          assert 'Market Navigator 3.9.7' in h
          assert 'marketWorker391' in h
          assert 'exportCSV391' in h
          assert '</body></html>' in h
          h=h.replace('<title>Market Navigator 3.9.7</title>','<title>Market Navigator · Gate 4 R4</title>',1)
          h=h.replace('Directional situational awareness · Version 3.9.6','Gate 4 R4 · Market Navigator 3.9.7 lineage',1)
          h=h.replace('</body></html>',f'<script>\n{overlay}\n</script></body></html>',1)
          p.write_text(h)
          PY

      - name: JavaScript parser syntax gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path('market-view-gate4-r4.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script\s*>',html,re.S|re.I)
          if len(blocks)<2: raise SystemExit('Expected preserved runtime plus Gate 4 adaptation script')
          for i,b in enumerate(blocks,1):
              p=Path(f'/tmp/mn-r4-{i}.js');p.write_text(b);print(p)
          PY
          for f in /tmp/mn-r4-*.js; do node --check "$f"; done

      - name: Baseline parity and structural contract gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('market-view-gate4-r4.html').read_text()
          baseline=['Market Navigator 3.9.7','openDB()','marketWorker391','exportCSV391','bindRows391','hashchange','indexedDB.open','history.back()','ArrowDown','ArrowUp','canvas.onpointerdown']
          contract=['Gate 4 R4','NOW','EXPLORE','LIBRARY','HEALTH','CONFIG','RSK','GRW','MAC',"['1D','5D','MTD','YTD','1YR','3YR','5YR']",'Add Series','AI POV','Venice.ai','OpenRouter','Anthropic direct','CPI','WTI','Indexed 100','canonical-backend-only mode']
          missing=[x for x in baseline+contract if x not in h]
          if missing: raise SystemExit('Missing parity/contract markers: '+repr(missing))
          if h.count('function g4Chart') != 1: raise SystemExit('Gate 4 must expose one adaptation chart engine')
          print('Baseline parity/structural contract PASS')
          PY

      - name: Install browser validation runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Boot, journey, mixed-frequency, axis and visual gates
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mn-r4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'JS'
          const { chromium }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[],forbidden=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('request',r=>{if(/query1\.finance\.yahoo\.com|fred\.stlouisfed\.org\/series\//i.test(r.url()))forbidden.push(r.url())});
            const res=await page.goto('http://127.0.0.1:8765/market-view-gate4-r4.html',{waitUntil:'domcontentloaded'});
            if(!res?.ok())throw Error('HTTP boot failed '+res?.status());
            await page.waitForFunction(()=>window.__MARKET_GATE4_R4__?.G4?.ready,{timeout:30000});
            await page.waitForTimeout(500);
            let s=await page.evaluate(()=>({
              status:document.querySelector('#status')?.textContent||'',
              series:Object.values(window.__MARKET_GATE4_R4__.state.series).filter(x=>Array.isArray(x)&&x.length).length,
              risk:window.__MARKET_GATE4_R4__.derived('risk').length,
              growth:window.__MARKET_GATE4_R4__.derived('growth').length,
              macro:window.__MARKET_GATE4_R4__.derived('macro').length,
              legend:[...document.querySelectorAll('.g4legend b')].map(x=>x.textContent),
              horizons:document.querySelectorAll('[data-g4h]').length,
              nav:[...document.querySelectorAll('[data-g4nav]')].map(x=>x.textContent.trim()),
              title:document.title
            }));
            console.log('BOOT',JSON.stringify(s));
            if(errors.length)throw Error('Page errors: '+errors.join(' | '));
            if(forbidden.length)throw Error('Forbidden provider acquisition: '+forbidden.join(' | '));
            if(s.series<20)throw Error('Canonical evidence coverage too small: '+s.series);
            if(!s.risk||!s.growth||!s.macro)throw Error('Derived V1 index data missing');
            if(s.horizons!==7)throw Error('Seven horizons not rendered');
            if(!['RSK','GRW','MAC'].every(x=>s.legend.includes(x)))throw Error('V1 legend incomplete');
            if(JSON.stringify(s.nav)!==JSON.stringify(['NOW','EXPLORE','LIBRARY','HEALTH']))throw Error('Primary nav mismatch '+JSON.stringify(s.nav));

            await page.locator('.g4legend').filter({hasText:'RSK'}).click();
            await page.waitForFunction(()=>window.__MARKET_GATE4_R4__.G4.view==='v2');
            let v2=await page.evaluate(()=>({index:window.__MARKET_GATE4_R4__.G4.index,count:document.querySelectorAll('.g4legend').length,expected:1+window.__MARKET_GATE4_R4__.G4.defs.indices.risk.components.length,labels:[...document.querySelectorAll('.g4legend b')].map(x=>x.textContent)}));
            console.log('V2',JSON.stringify(v2));
            if(v2.index!=='risk'||v2.count!==v2.expected)throw Error('V2 index+all-components contract failed');

            const component=await page.evaluate(()=>window.__MARKET_GATE4_R4__.G4.defs.indices.risk.components[0].id);
            await page.locator(`[data-g4series="${component}"]`).click();
            if(!(await page.locator('#g4about').isVisible()))throw Error('About card did not open');
            await page.locator('#g4moreInfo').click();
            await page.waitForFunction(c=>window.__MARKET_GATE4_R4__.G4.view==='v3'&&window.__MARKET_GATE4_R4__.G4.root===c,component);

            await page.locator('#g4addInline').click();
            const tabs=await page.evaluate(()=>[...document.querySelectorAll('#g4addModal [data-tab]')].map(x=>x.textContent));
            if(JSON.stringify(tabs)!==JSON.stringify(['Market','Risk','Growth','Macro','Other']))throw Error('Add Series taxonomy failed '+JSON.stringify(tabs));
            await page.locator('#g4addModal [data-close]').click();

            const mixed=await page.evaluate(()=>{
              const api=window.__MARKET_GATE4_R4__,g=api.G4;g.view='v3';g.index='macro';g.root='cpi';g.analysis=['cpi','wti'];g.horizon='1YR';api.renderGate4();
              const c=api.dataFor('cpi'),w=api.dataFor('wti');return{cN:c.length,wN:w.length,cLast:c.at(-1)?.t,wLast:w.at(-1)?.t,plan:api.axisPlan(['cpi','wti'])};
            });
            console.log('MIXED',JSON.stringify(mixed));
            if(!mixed.cN||!mixed.wN)throw Error('CPI/WTI canonical evidence missing');
            if(mixed.cLast===mixed.wLast)throw Error('Mixed-frequency endpoints were improperly aligned');
            if(mixed.plan.mode!=='dual')throw Error('CPI/WTI should use dual native axes');

            const fallback=await page.evaluate(()=>window.__MARKET_GATE4_R4__.axisPlan(['cpi','wti','payrolls']));
            if(fallback.mode!=='indexed')throw Error('3+ family Indexed-100 fallback failed');

            await page.evaluate(()=>window.__MARKET_GATE4_R4__.saveLibrary());
            await page.locator('[data-g4nav="library"]').click();
            await page.locator('[data-g4lib]').first().click();
            await page.waitForFunction(()=>window.__MARKET_GATE4_R4__.G4.view==='v3');
            const restored=await page.evaluate(()=>({root:window.__MARKET_GATE4_R4__.G4.root,a:window.__MARKET_GATE4_R4__.G4.analysis,h:window.__MARKET_GATE4_R4__.G4.horizon}));
            if(restored.root!=='cpi'||restored.h!=='1YR'||!restored.a.includes('wti'))throw Error('Library restore failed '+JSON.stringify(restored));

            await page.locator('[data-g4nav="now"]').click();
            const desktop=await page.evaluate(()=>{const main=document.querySelector('main').getBoundingClientRect(),c=document.querySelector('#g4chart').getBoundingClientRect(),r3=document.querySelector('.g4r3').getBoundingClientRect();return{mainW:main.width,canvasW:c.width,canvasH:c.height,r3W:r3.width,r3Scroll:document.querySelector('.g4r3').scrollWidth,bodyScroll:document.documentElement.scrollWidth,inner:innerWidth}});
            console.log('DESKTOP',JSON.stringify(desktop));
            if(desktop.canvasW<600||desktop.canvasH<220||desktop.r3Scroll>desktop.r3W+3||desktop.bodyScroll>desktop.inner+3)throw Error('Desktop visual contract failed');

            await page.setViewportSize({width:390,height:844});await page.waitForTimeout(150);
            const mobile=await page.evaluate(()=>{const c=document.querySelector('#g4chart').getBoundingClientRect(),r3=document.querySelector('.g4r3').getBoundingClientRect(),legend=document.querySelector('.g4legendbar').getBoundingClientRect();return{canvasW:c.width,canvasH:c.height,r3W:r3.width,r3Scroll:document.querySelector('.g4r3').scrollWidth,legendW:legend.width,bodyScroll:document.documentElement.scrollWidth,inner:innerWidth}});
            console.log('MOBILE',JSON.stringify(mobile));
            if(mobile.canvasW<320||mobile.canvasH<200||mobile.r3Scroll>mobile.r3W+3||mobile.bodyScroll>mobile.inner+3)throw Error('Mobile visual contract failed');
            if(forbidden.length)throw Error('Forbidden provider acquisition after journeys: '+forbidden.join(' | '));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit validated R4 candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name "market-navigator-r4-bot"
          git config user.email "market-navigator-r4-bot@users.noreply.github.com"
          git add market-view-gate4-r4.html
          git commit -m "market: implement governed Gate 4 R4"
          git pull --rebase origin main
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA" >/tmp/mn-r4-sha

      - name: GitHub Pages reachability and release identity gate
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/mn-r4-sha)
          URL="https://acmeproducts.github.io/stuff/market-view-gate4-r4.html?candidate=$SHA"
          ok=0
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 15 "$URL" -o /tmp/mn-r4-page.html && grep -q 'Gate 4 R4' /tmp/mn-r4-page.html && grep -q 'Market Navigator 3.9.7' /tmp/mn-r4-page.html; then ok=1;break;fi
            sleep 5
          done
          test "$ok" = 1
          echo "$URL" >/tmp/mn-r4-url

      - name: Record exact-candidate validation and remove transport
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/mn-r4-sha);URL=$(cat /tmp/mn-r4-url)
          cat > MARKET-NAVIGATOR-GATE4-R4-VALIDATION.md <<EOF
          # Market Navigator Gate 4 R4 Validation

          - Candidate commit: \`$SHA\`
          - Test URL: $URL
          - Restored 3.9.7 baseline parity: PASS
          - JavaScript parser syntax: PASS
          - Browser boot without uncaught exception: PASS
          - Canonical backend load: PASS
          - No Yahoo/FRED browser provider acquisition during validated journeys: PASS
          - V1 RSK/GRW/MAC: PASS
          - V1 → V2 index + every component: PASS
          - V2 component About → exact Analysis: PASS
          - Add Series taxonomy: PASS
          - CPI + WTI mixed-frequency endpoint fidelity: PASS
          - Y1/Y2 native dual-axis plan: PASS
          - 3+ unit-family Indexed-100 fallback: PASS
          - Library save/restore lineage: PASS
          - Desktop visual-contract gate: PASS
          - Mobile visual-contract gate: PASS
          - GitHub Pages reachability/release identity: PASS
          EOF
          git rm -f market-gate4-r4-overlay.js .github/workflows/market-navigator-gate4-r4-build.yml
          git add MARKET-NAVIGATOR-GATE4-R4-VALIDATION.md
          git commit -m "market: record Gate 4 R4 validation"
          git pull --rebase origin main
          git push origin HEAD:main
