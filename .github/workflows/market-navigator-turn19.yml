name: Market Navigator Turn 20 qualify

on:
  push:
    branches:
      - market-navigator-turn20-20260912
    paths:
      - 'TURN20_TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-navigator-turn20-20260912
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freeze Turn 20 governance first
        run: |
          python3 market-navigator-turn20-governance.py
          grep -F 'Next release scope: Turn 20' MARKET-NAVIGATOR-MASTER-PLAN.md
          grep -F 'GRW + PCE + Payrolls + UNE' MARKET-NAVIGATOR-MASTER-PLAN.md
          grep -F 'exact frozen chart state' MARKET-NAVIGATOR-MASTER-PLAN.md
          grep -F 'Turn 20 lifecycle / AI snapshot regressions — rejected' MARKET-NAVIGATOR-GRAVEYARD.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MARKET-NAVIGATOR-MASTER-PLAN.md MARKET-NAVIGATOR-GRAVEYARD.md
          if ! git diff --cached --quiet; then
            git commit -m 'Market Navigator Turn 20 governance [turn20-plan]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Build exact Turn 20 candidate
        run: python3 market-navigator-build-turn20.py

      - name: Static and JavaScript gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn20-pre-ship.html').read_text()
          required=[
            'TURN 20 PRE-SHIP','TURN20_OWNER_CORRECTIONS',
            'raw=S.analysisSeries.filter(id=>!IDX.includes(id))',
            "if(IDX.includes(S.analysisRoot)&&!hadRaw)S.analysisRoot=id",
            'if(same)return JSON.parse(JSON.stringify(live))',
            'function renderAnalysisCrumb()','function captureAnalysisState17','async function startAI'
          ]
          for x in required: assert x in s,x
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          assert scripts and scripts[-1].strip()
          Path('/tmp/market-navigator-turn20.js').write_text(scripts[-1])
          print('TURN 20 STATIC: PASS')
          PY
          node --check /tmp/market-navigator-turn20.js

      - name: Install browser gate
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Run inherited and Turn 20 product matrices
        run: |
          python3 -m http.server 8123 >/tmp/market-navigator-turn20-http.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8123/market-navigator-turn20-pre-ship.html | grep -F 'TURN 20 PRE-SHIP' >/dev/null
          MARKET_NAVIGATOR_URL=http://127.0.0.1:8123/market-navigator-turn20-pre-ship.html node market-navigator-turn19-qa.mjs
          MARKET_NAVIGATOR_URL=http://127.0.0.1:8123/market-navigator-turn20-pre-ship.html node market-navigator-turn20-qa.mjs

      - name: Commit qualified Turn 20 candidate
        run: |
          git add market-navigator-turn20-pre-ship.html
          if git diff --cached --quiet; then
            echo 'No candidate change to commit.'
          else
            git commit -m 'Market Navigator Turn 20 qualified release [turn20-generated]'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
