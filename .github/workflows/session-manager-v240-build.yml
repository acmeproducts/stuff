name: Session Manager v2.4.0 governed build
on:
  push:
    branches: [main]
    paths: [.github/workflows/session-manager-v240-build.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase current main
        run: git pull --rebase origin main
      - name: Correct build-version migration and build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/session-manager-v240.py')
          s=p.read_text()
          needle="s=s.replace('v2.3.5','v2.4.0')"
          replacement=needle+"\ns=s.replace(\"const BUILD_VERSION='2.3.5';\",\"const BUILD_VERSION='2.4.0';\",1)"
          assert needle in s
          p.write_text(s.replace(needle,replacement,1))
          PY
          python3 .github/scripts/session-manager-v240.py
      - name: Syntax and release gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text()
          assert "const BUILD_VERSION='2.4.0'" in s
          assert "const APP_VERSION='2.3.0'" in s
          assert 'function renderProjectTabs()' in s
          assert 'function renderProjectSidebar()' in s
          assert 'function themeLibrary()' in s
          assert 'session-manager-theme-library' in s
          assert 'Claude' in s and 'ChatGPT' in s and 'BotsChat' in s
          assert "rpc('sessions.create',{label:'New chat'},20000)" in s
          assert 'title="Click to rename"' in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/sm240.js').write_text(js[0])
          print('semantic gates PASS')
          PY
          node --check /tmp/sm240.js
          echo 'JavaScript syntax PASS'
      - name: Publish and remove temporary builder
        shell: bash
        run: |
          git config user.name 'Session Manager release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/session-manager-v240-build.yml .github/scripts/session-manager-v240.py
          git add session-manager-v3.html session-manager-backlog.md
          git commit -m 'Session Manager v2.4.0 projects tabs and portable themes'
          git pull --rebase origin main
          git push origin HEAD:main
