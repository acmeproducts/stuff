name: Session Manager v2.3.1 accessibility build

on:
  push:
    branches:
      - agent/session-manager-v231-accessibility
    paths:
      - .github/workflows/session-manager-v231-build.yml
      - .github/session-manager-v231-patch.gz.b64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify governed input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object session-manager-v3.html)" = "3f55b17975c7c10c27bf3ece87a28734ffeb3358"

      - name: Apply accessibility appearance rebuild
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/session-manager-v231-patch.gz.b64 | gzip -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Gate output
        shell: bash
        run: |
          set -euo pipefail
          echo "OUTPUT_GIT_BLOB=$(git hash-object session-manager-v3.html)"
          echo "OUTPUT_SHA256=$(sha256sum session-manager-v3.html | awk '{print $1}')"
          echo "OUTPUT_BYTES=$(wc -c < session-manager-v3.html)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m, 'script missing'
          Path('/tmp/session-manager.js').write_text(m.group(1))
          checks=['v2.3.1','BUILD_VERSION=\'2.3.1\'','High Contrast Dark','High Contrast Light','Warm Paper','Soft Dark','Large Print','Page background','Panels / sidebar','Input background','Code block text','Filename / path text','Live preview','Contrast guard','hasRenderableHtml','sanitizeHtml','looksLikePath']
          for c in checks:
              assert c in s, c
          # Protected v2.1-derived Gateway machinery remains present.
          protected=[
            "privateKeyPkcs8",
            "client:{id:CID,version:CVER,platform,deviceFamily:family,mode:CMODE}",
            "payload=['v3',id.deviceId,CID,CMODE,ROLE,sc.join(','),String(ts),authToken,nonce,platform,family].join('|')",
            "function handleConnectError(e)",
            "function reconnect()"
          ]
          for c in protected:
              assert c in s, c
          PY
          node --check /tmp/session-manager.js

      - name: Commit exact gated artifact and remove builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Session Manager release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/session-manager-v231-build.yml .github/session-manager-v231-patch.gz.b64
          git add session-manager-v3.html
          git commit -m 'Session Manager v2.3.1 accessibility appearance'
          git push origin HEAD:agent/session-manager-v231-accessibility
