name: Market Navigator Turn 11 qualify
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn11.py'
      - '.github/workflows/market-navigator-turn11.yml'
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build candidate
        run: python3 market-navigator-build-turn11.py
      - name: Static and JavaScript gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn11-pre-ship.html').read_text()
          for x in ['TURN 11 PRE-SHIP','xlsx.full.min.js','Attach image or spreadsheet','id="analysisEvidence" class="hidden"','Register this provider before starting an Analysis','Attached spreadsheet/file','indexedDB.open','plugins=[{id:\'web\'']:
              assert x in s,x
          assert 'grid-template-columns:minmax(0,1fr) 280px' not in s
          Path('/tmp/mn11.js').write_text(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])
          PY
          node --check /tmp/mn11.js
      - name: Browser product gate
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 >/tmp/mn11.log 2>&1 &
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844}});
            const errs=[];p.on('pageerror',e=>errs.push(String(e)));
            const u='http://127.0.0.1:8123/market-navigator-turn11-pre-ship.html';
            await p.goto(u,{waitUntil:'networkidle'});
            await p.evaluate(()=>document.querySelector('[data-view="explore"]').click());
            await p.locator('[data-cat="Growth"]').click();await p.locator('#exploreSearch').fill('QQQ');await p.locator('#exploreList .row').first().click();await p.locator('#openExploreAnalysis').click();
            const body=await p.locator('.analysisBody').boundingBox(),plot=await p.locator('.analysisPlot').boundingBox();if(!body||!plot||Math.abs(plot.width-body.width)>2)throw Error(`Analysis plot width mismatch body=${body?.width} plot=${plot?.width}`);if(await p.locator('#analysisEvidence:not(.hidden)').count())throw Error('Visible right evidence panel remains');
            await p.locator('#closeAnalysis').click();
            const seed={id:'qa-analysis',title:'QQQ · 3YR',status:'ready',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),provider:'openrouter',model:'test-model',state:{horizon:'3YR',series:['qqq'],evidence:[]},turns:[{role:'assistant',at:new Date().toISOString(),content:'# Research update\n\nPersisted **Markdown** analysis with [source](https://example.com/current).'}]};
            await p.evaluate(seed=>localStorage.setItem('marketNavigatorAnalysesV4',JSON.stringify([seed])),seed);
            await p.reload({waitUntil:'networkidle'});await p.evaluate(()=>document.querySelector('[data-view="library"]').click());await p.waitForFunction(()=>document.querySelector('#libList').textContent.includes('QQQ'));await p.locator('#libList .row').first().click();await p.waitForFunction(()=>document.querySelector('#transcript').textContent.includes('Research update'));
            const transcript=await p.locator('#transcript').textContent();if(!transcript.includes('Research update')||!transcript.includes('Persisted Markdown analysis'))throw Error('Markdown research content missing: '+transcript);if(await p.locator('#transcript h1').count()<1||await p.locator('#transcript strong').count()<1||await p.locator('#transcript a[href="https://example.com/current"]').count()<1)throw Error('Markdown was not rendered as HTML');
            const scroll=await p.locator('#transcript').evaluate(e=>getComputedStyle(e).overflowY);if(!['auto','scroll'].includes(scroll))throw Error('Library transcript not scrollable');
            const accept=await p.locator('#attachInput').getAttribute('accept');if(!accept.includes('.xlsx')||!accept.includes('.csv')||!accept.includes('image/*'))throw Error('image/spreadsheet attachment contract missing');
            if(await p.locator('#webToggle').count())throw Error('redundant Web control returned');if(await p.locator('#send').count()!==1)throw Error('single Send missing');
            const stores=await p.evaluate(()=>new Promise((res,rej)=>{const r=indexedDB.open('marketNavigatorLocal');r.onsuccess=()=>res([...r.result.objectStoreNames]);r.onerror=()=>rej(r.error)}));if(!stores.includes('analyses')||!stores.includes('attachments'))throw Error('IndexedDB persistence missing');
            if(errs.length)throw Error(errs.join('\n'));await b.close();console.log('TURN11 PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js
      - name: Publish qualified Turn 11
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn11-pre-ship.html
          git commit -m 'market navigator: publish qualified Turn 11'
          git push origin main
