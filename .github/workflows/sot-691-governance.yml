name: SOT 6.9.1 governance
on:
  push:
    paths:
      - '.github/workflows/sot-691-governance.yml'
permissions:
  contents: write
jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock path-centric project and analysis model
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md'); s=p.read_text()
          block='''\n## 0.2F Path-centric projects, reusable fingerprint authority, and analysis — 2026-08-20\n\n- A Project is a user-defined, recallable, editable collection of **paths**. Project identity and fingerprint identity are separate. The same path may participate in any number of projects.\n- Project Setup must support New, Recall/Edit, add current deep path, add/remove paths, and Save changes. Removing a path from a project removes membership only; durable observations/hashes remain in the SOT database.\n- Project Setup has no synthetic `Root` source. Only actual available volumes/authorized roots are shown.\n- `$RECYCLE.BIN` is a blocked system path: it is visible only as excluded/system content, is never selected by Select All, cannot be added in the UI, and is rejected by the backend.\n- Explorer Pane 2 may show both directories and files. Immediate directory listing is nonblocking; a persistent progressive background index reports current path plus folder/file/byte counts as it advances.\n- Drive letters/mount paths are locators, not durable identity. Stable source identity uses platform volume identity where available plus path relative to the volume. Drive-letter remapping must not create a new logical source solely because the letter changed.\n- Fingerprint reuse hierarchy is: (1) authoritative content identity from SHA-256/content-tree evidence; (2) fast metadata-tree stillness signature from relative path + size + modified time on the same stable volume; (3) stable volume identity + volume-relative file/path locator for reuse across overlapping project paths and drive-letter remapping. Creation time may be retained as metadata but is not an identity key.\n- Hash reuse is global, not project-scoped. Selecting an unchanged path in multiple projects must reuse prior verified hashes. Overlapping parent/child project paths on the same stable volume must reuse verified hashes by volume-relative file locator. Cross-device metadata-only matches are not authoritative content matches.\n- Reporting becomes **SOT Database Explorer** using the `repolist.html` interaction model at Project -> Path -> File scope, with omni-search, sortable columns, drag reorder, resize, and persistent preferences.\n- The first Analysis capability is read-only and deterministic: exact duplicate groups, duplicate files, reclaimable source bytes, unique/copy bytes required, target-space requirement including safety margin, unfingerprinted content, and path conflicts. No copy/delete mutation occurs from assessment.\n- Canonical detailed contract: `SOT-6.9-PATH-CENTRIC-ANALYSIS-PLAN.md`. Candidate build: `2026.08.20.6.9.1-wsl-path-centric-analysis`.\n- Existing `openclaw-report-server.service`/18080 topology remains locked; no extra server, helper, port, proxy, or Tailscale change.\n\n'''
          if '## 0.2F Path-centric projects, reusable fingerprint authority, and analysis — 2026-08-20' not in s:
              s=s.replace('## 0.3 Established plumbing — keep',block+'## 0.3 Established plumbing — keep',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-backlog.md
          git commit -m 'Lock 6.9.1 path-centric project and analysis model'
          git push
