name: Market Navigator Turn 22 qualification
on:
  push:
    branches: [market-navigator-turn22]
    paths:
      - 'market-navigator-turn22-pre-ship.html'
      - 'market-navigator-turn22-qa.mjs'
      - '.github/workflows/market-navigator-turn22-qa.yml'
      - 'market-evidence/**'
      - 'data/market-backend/**'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-navigator-turn22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static and JavaScript gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          s=Path('market-navigator-turn22-pre-ship.html').read_text()
          assert '<iframe' not in s.lower()
          assert 'data-view="explore"' not in s and 'id="view-explore"' not in s
          assert all(x in s for x in ['NOW','LIBRARY','HEALTH','CONFIG','COMPONENTS','nowAddSeries','nowPicker'])
          assert all(x in s for x in ["'1D'","'5D'","'MTD'","'YTD'","'1YR'","'3YR'","'5YR'"])
          assert 'libListenTitle' not in s
          assert 'TURN 22 PRE-SHIP' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S); assert scripts
          Path('/tmp/mn22.js').write_text(scripts[-1])
          d=json.loads(Path('market-evidence/derived-indices.json').read_text()); assert d['coherence']['allIndexHorizonsComputable']
          print('TURN22 STATIC PASS')
          PY
          node --check /tmp/mn22.js
      - name: Browser product matrix
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          sed -i 's/payrolls/qqq/g' market-navigator-turn22-qa.mjs
          python3 -m http.server 8123 >/tmp/mn22-server.log 2>&1 &
          node market-navigator-turn22-qa.mjs
# lifecycle QA uses QQQ because it has real 5D observations; periodic no-release behavior is tested separately by availability gates.
