name: Wrist device log
# Copies the relay's recent events (motions with the sensor readings behind them, battery,
# mode changes; pairing codes masked) into x/wrist/out/DEVICE-LOG.md so the build session can
# read what the watch really did, and every saved Lab trial into x/wrist/out/trials/.
# Runs when x/wrist/DRAIN.trigger is pushed.
on:
  push:
    branches: [main, 'wrist-**']
    paths:
      - 'x/wrist/DRAIN.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Drain
        run: |
          mkdir -p x/wrist/out
          curl -sS --max-time 20 "https://wrist-relay.myacctfortracking.workers.dev/log" -o /tmp/wrist.log || echo "(relay unreachable)" > /tmp/wrist.log
          {
            echo "# Wrist device log"
            echo ""
            echo "Drained $(date -u +%FT%TZ). Newest at the bottom. $(wc -l < /tmp/wrist.log) lines."
            echo ""
            echo '```'
            tail -c 300000 /tmp/wrist.log
            echo '```'
          } > x/wrist/out/DEVICE-LOG.md
          # Lab trials: what the watch saw + what the owner did + the verdict, one file per saved part
          mkdir -p x/wrist/out/trials
          curl -sS --max-time 20 "https://wrist-relay.myacctfortracking.workers.dev/trials" -o /tmp/trials.json || echo "[]" > /tmp/trials.json
          # A card's record is saved while the card is still open, and grows. So a part is fetched when the repo has no copy
          # of it, or when the relay's copy is a different size from the repo's. A failed fetch never replaces a good copy.
          for row in $(node -e 'try{for(const x of JSON.parse(require("fs").readFileSync("/tmp/trials.json","utf8")))console.log(x.key+"="+x.bytes)}catch(e){}'); do
            key="${row%=*}"; want="${row##*=}"
            case "$key" in e2e-*) continue;; esac
            f="x/wrist/out/trials/$(echo "$key" | tr ':' '.').json"
            have=""; [ -f "$f" ] && have="$(LC_ALL=C.UTF-8 wc -m < "$f" | tr -d ' ')"
            [ "$have" = "$want" ] && continue
            curl -fsS --max-time 30 "https://wrist-relay.myacctfortracking.workers.dev/trial/$key" -o /tmp/part.json && mv /tmp/part.json "$f" || true
          done
          git config user.name acmeproducts
          git config user.email 182510673+acmeproducts@users.noreply.github.com
          git add x/wrist/out/DEVICE-LOG.md x/wrist/out/trials
          if ! git diff --staged --quiet; then
            git commit -q -m "wrist device log [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
