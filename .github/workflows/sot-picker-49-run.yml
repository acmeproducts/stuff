name: Run corrected SOT picker .4.9

on:
  push:
    paths:
      - '.github/workflows/sot-picker-49-run.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore baseline
        run: git checkout 970d56435a84192c74de4d3eb7978ee327d303c4 -- project.html
      - name: Apply patch
        run: python3 tools/sot_patch_picker_49.py
      - name: Gate JavaScript and backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
          node --check sot-api.js
          grep -q 'Build: 2026.08.11.4.9' project.html
          grep -q "BUILD_ID='2026.08.11.4.9'" project.html
          grep -q 'id="sidebarToggle"' project.html
          grep -q 'nav-collapsed' project.html
          grep -q 'function openSourceExplorer49' project.html
          grep -q 'STATIC_PREVIEW' project.html
          grep -q 'Server-backed WSL storage is intentionally hidden on GitHub Pages' project.html
          grep -q 'data-source-check' project.html
          grep -q 'data-note-index' project.html
          grep -q "FS_API='/report/api/sot/fs'" project.html
          grep -q 'note TEXT NOT NULL' sot-api.js
          grep -q 'sourceRows=' sot-api.js
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-picker-49-run.yml
          git rm tools/sot_patch_picker_49.py
          git rm -f .github/workflows/sot-picker-49-owner-correction.yml || true
          git add project.html sot-api.js project-backlog.md
          git commit -m 'Rebuild SOT picker .4.9 from .4.5 owner baseline'
          git pull --rebase origin main
          git push origin HEAD:main
