name: SOT Turn 01 Base installer qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sot-installer-qualification.yml'
      - 'install-SOT-turn01-base.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Parse and pin audit
        run: |
          set -euo pipefail
          bash -n install-SOT-turn01-base.sh
          for marker in \
            "QUALIFIED_COMMIT='b58920f014960c9b18b705a0fdcf0406c621fd5f'" \
            "QUALIFICATION_RUN='core=33919314140 ui=33922645501'" \
            "PRE_UI='7a377c27e1ac078510b9d1e4fe66da4f997f25f3'" \
            "PRE_API='9422453c180f8fce4e7d5fe362867912dc8005d1'" \
            "EXPECTED_BUILD='2026.09.03.sot-turn01-coordination-2'" \
            "EXPECTED_SCHEMA=5" \
            "function sotOperatorBusy()" \
            "state.projects=next" \
            "TURN 01 BASE READY FOR OWNER TEST" \
            "PUBLIC_IDENTITY" \
            "ROLLBACK"; do
            grep -Fq "$marker" install-SOT-turn01-base.sh || { echo "missing installer contract: $marker"; exit 1; }
          done
          ! grep -Fq 'function backgroundPulse()' install-SOT-turn01-base.sh
          echo 'PASS installer parse and corrected qualification pins'
      - name: Reproduce installer candidate generation and assertions
        run: |
          set -euo pipefail
          raw=https://raw.githubusercontent.com/acmeproducts/stuff
          q=b58920f014960c9b18b705a0fdcf0406c621fd5f
          curl --retry 3 --retry-all-errors -fsSL "$raw/9422453c180f8fce4e7d5fe362867912dc8005d1/sot-api.js" -o /tmp/pre.js
          curl --retry 3 --retry-all-errors -fsSL "$raw/1aebf2624621b08880a595ef9d1f58f2c8cde1b/integrate-SOT-turn01-base.py" -o /tmp/base.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/1abfeef83cc1f4da25de09e297361beb5320d516/generate-SOT-turn01-base22.py" -o /tmp/base22.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/integrate-SOT-turn01-coordination.py" -o /tmp/coord.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/integrate-SOT-turn01-coordination2.py" -o /tmp/coord2.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/sot-worker.js" -o /tmp/sot-worker.js
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/sot-coordinator.js" -o /tmp/sot-coordinator.js
          python3 /tmp/base.py /tmp/pre.js /tmp/base3.js
          python3 /tmp/base22.py /tmp/base3.js /tmp/base22.js
          python3 /tmp/coord.py /tmp/base22.js /tmp/c1.js
          python3 /tmp/coord2.py /tmp/c1.js /tmp/sot-api.js
          node --check /tmp/sot-api.js
          node --check /tmp/sot-worker.js
          node --check /tmp/sot-coordinator.js
          curl --retry 3 --retry-all-errors -fsSL "$raw/7a377c27e1ac078510b9d1e4fe66da4f997f25f3/SOT-turn01-pre-base.html" -o /tmp/pre.html
          curl --retry 3 --retry-all-errors -fsSL "$raw/603e8a331b13b72a097e9ebb9640e33707279777/integrate-SOT-turn01-base22-ui.py" -o /tmp/u22.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/083aa1334208b1e6995fa18852e82722a815f331/integrate-SOT-turn01-base24-ui.py" -o /tmp/u24.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/5660a5fd6f0aaa6c7b734f2ad04b468b65693eb5/integrate-SOT-turn01-base-ai.py" -o /tmp/uai.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/integrate-SOT-turn01-coordination-ui.py" -o /tmp/ucoord.py
          curl --retry 3 --retry-all-errors -fsSL "$raw/$q/integrate-SOT-turn01-coordination2-ui.py" -o /tmp/ucoord2.py
          python3 /tmp/u22.py /tmp/pre.html /tmp/22.html
          python3 /tmp/u24.py /tmp/22.html /tmp/24.html
          python3 /tmp/uai.py /tmp/24.html /tmp/base.html
          python3 /tmp/ucoord.py /tmp/base.html /tmp/u1.html
          python3 /tmp/ucoord2.py /tmp/u1.html /tmp/ui.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/ui.html').read_text()
          required=['TURN01_BASE24_OWNER_GATE','TURN01_BASE28_OPERATIONAL_AI','2-copy groups','3-copy groups','4+ copy groups','availableFolderSearch','selectorCommit','Current Plan','Previous / Stale Plan','Default Target','Default Backup','Venice.ai','OpenRouter','function sotOperatorBusy()',"Promise.all([api('/projects'),api('/rollup')])",'state.projects=next','state.selected=selected']
          for marker in required: assert marker in h,marker
          assert 'function backgroundPulse()' not in h
          Path('/tmp/ui.js').write_text('\n;\n'.join(re.findall(r'<script[^>]*>([\s\S]*?)</script>',h,re.I)))
          PY
          node --check /tmp/ui.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/sot-api.js').read_text()
          for marker in ["const BUILD = '2026.09.03.sot-turn01-coordination-2';",'const EXPECTED_MIGRATION = 5;','function claimProjectOperation(projectToken,kind)','active_operation_id','operation_generation','durable-project-coordination']:
              assert marker in s,marker
          PY
          echo 'PASS installer pre-cutover candidate generation and assertions'
