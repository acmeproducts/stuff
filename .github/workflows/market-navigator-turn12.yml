name: Market Navigator Turn 12 qualify
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn12.py'
      - '.github/workflows/market-navigator-turn12.yml'
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build candidate
        run: python3 market-navigator-build-turn12.py
      - name: Static and JavaScript gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn12-pre-ship.html').read_text()
          for x in ['TURN 12 PRE-SHIP','Attach image or spreadsheet','id="analysisEvidence" class="hidden"','Register this provider before starting an Analysis','Attached spreadsheet/file','indexedDB.open','plugins=[{id:\'web\'','loadXLSX()','function renderAIConfig()','function providerEndpoints(p)','function validateProvider(p)',"$('veniceLoad').onclick","$('openrouterLoad').onclick","$('anthropicValidate').onclick"]:
              assert x in s,x
          assert 'grid-template-columns:minmax(0,1fr) 280px' not in s
          assert '<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>' not in s
          Path('/tmp/mn12.js').write_text(re.findall(r'<script>(.*?)</script>',s,re.S)[-1])
          PY
          node --check /tmp/mn12.js
      - name: Browser product gate
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 >/tmp/mn12.log 2>&1 &
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            for (const vp of [{width:390,height:844},{width:1280,height:800}]) {
              const p=await b.newPage({viewport:vp}); const errs=[]; const bad=[];
              p.on('pageerror',e=>errs.push(String(e))); p.on('console',m=>{if(m.type()==='error')errs.push('console: '+m.text())}); p.on('response',r=>{if(r.status()>=400)bad.push(r.status()+' '+r.url())});
              const u='http://127.0.0.1:8123/market-navigator-turn12-pre-ship.html';
              await p.goto(u,{waitUntil:'networkidle'});
              const app=await p.locator('.app').boundingBox(); if(!app||app.width<vp.width*.95||app.height<vp.height*.95) throw Error('app shell not displayed');
              if(!(await p.locator('#view-now').isVisible())) throw Error('NOW not displayed at boot');
              const canvas=await p.locator('#nowChart').boundingBox(); if(!canvas||canvas.width<100||canvas.height<100) throw Error('NOW chart canvas missing after boot');
              const wrapText=await p.locator('#nowWrap').innerText(); if(/not defined|HTTP \d+|failed/i.test(wrapText)) throw Error('boot error surface: '+wrapText);
              await p.evaluate(()=>document.querySelector('[data-view="config"]').click()); if(!(await p.locator('#defaultProvider').isVisible())) throw Error('CONFIG failed to render');
              await p.evaluate(()=>document.querySelector('[data-view="explore"]').click());
              await p.locator('[data-cat="Growth"]').click(); await p.locator('#exploreSearch').fill('QQQ'); await p.locator('#exploreList .row').first().click(); await p.locator('#openExploreAnalysis').click();
              const body=await p.locator('.analysisBody').boundingBox(),plot=await p.locator('.analysisPlot').boundingBox(); if(!body||!plot||Math.abs(plot.width-body.width)>2) throw Error('Analysis plot is not full width');
              if(await p.locator('#analysisEvidence:not(.hidden)').count()) throw Error('right evidence panel remains');
              await p.locator('#closeAnalysis').click(); await p.evaluate(()=>document.querySelector('[data-view="library"]').click());
              const accept=await p.locator('#attachInput').getAttribute('accept'); if(!accept.includes('.xlsx')||!accept.includes('.csv')||!accept.includes('image/*')) throw Error('attachment contract missing');
              const scroll=await p.locator('#transcript').evaluate(e=>getComputedStyle(e).overflowY); if(!['auto','scroll'].includes(scroll)) throw Error('transcript not scrollable');
              if(bad.length) throw Error('failed resources: '+bad.join('\n')); if(errs.length) throw Error(errs.join('\n'));
              await p.close();
            }
            await b.close(); console.log('TURN12 PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node qa.js
      - name: Publish qualified Turn 12
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn12-pre-ship.html
          git commit -m 'market navigator: publish qualified Turn 12'
          git push origin main
