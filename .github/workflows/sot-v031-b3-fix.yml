      - '.github/workflows/sot-v031-b3-fix.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and gate
        run: bash .github/sot-v031-b3-fix.sh
