name: Market Navigator Trend V1 Research Only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce failed V1 research evidence without publishing
        run: python3 market-navigator-trend.py
      - name: Enforce failed-model boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path('market-evidence/reports/trend-backtest-v1.json').read_text())
          assert b['modelVersion']=='MN-TREND-1.0.0'
          print('MN-TREND-1.0.0 remains RESEARCH ONLY / PRODUCTION FAILED')
          PY
