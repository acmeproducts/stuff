name: Market Navigator Turn 09 build
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn09.py'
      - 'market-navigator-turn08-pre-ship.html'
      - '.github/workflows/market-navigator-turn09-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Turn 09
        run: python3 market-navigator-build-turn09.py
      - name: Syntax gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn09-pre-ship.html').read_text()
          assert 'TURN 09 PRE-SHIP' in s
          assert 'Index ${fmt(q.v)}' in s
          assert 'indexedDB.open' in s
          assert 'attachInput' in s
          assert 'moreAI' in s
          assert "plugins=[{id:'web'" in s
          assert 'enable_web_search' in s
          assert 'web_search_20250305' in s
          assert 'Provider returned no answer content' in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/mn9.js').write_text(js)
          PY
          node --check /tmp/mn9.js
      - name: Publish generated standalone source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-navigator-turn09-pre-ship.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'market navigator: build Turn 09 analysis workspace improvements'
          git push
