name: SOT Release D Continuous SSOT Qualification

on:
  workflow_dispatch:
  pull_request:
    paths: ['SOT/**', '.github/workflows/sot-release-d-autosync-qualify.yml']
  push:
    branches: [main]
    paths:
      - 'SOT/sot-turn02-release-d-autosync.py'
      - 'SOT/sot-turn02-release-d-source-actions.html'
      - 'SOT/sot-turn02-release-d-complete.html'
      - 'SOT/qualify-release-d-autosync.py'
      - 'SOT/qualify-release-d-report-estate.cjs'
      - 'SOT/SOT-TURN02-RELEASE-D-REPORT-ESTATE-PLAN.md'
      - 'SOT/SOT-TURN02-RELEASE-D-REPORT-ESTATE-GRAVEYARD.md'
      - 'install-SOT-turn02-release-d-autosync.sh'
      - '.github/workflows/sot-release-d-autosync-qualify.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete changes require their plan and graveyard
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD'],text=True).splitlines())
          if 'SOT/sot-turn02-release-d-complete.html' in changed:
              for path in ['SOT/SOT-TURN02-RELEASE-D-REPORT-ESTATE-PLAN.md','SOT/SOT-TURN02-RELEASE-D-REPORT-ESTATE-GRAVEYARD.md']:
                  assert path in changed, 'Undocumented Complete change: '+path
          PY
      - name: Python syntax and Continuous SSOT contract
        run: |
          set -euo pipefail
          python3 -m py_compile SOT/sot-turn02-release-d-autosync.py SOT/qualify-release-d-autosync.py
          python3 SOT/qualify-release-d-autosync.py
      - name: Complete owner UI JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('SOT/sot-turn02-release-d-complete.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/sot-release-d-complete.js').write_text(js)
          PY
          node --check /tmp/sot-release-d-complete.js
      - name: Installer syntax
        run: bash -n install-SOT-turn02-release-d-autosync.sh
      - name: Report / Estate browser acceptance
        run: |
          npm install --prefix /tmp/sot-browser-tests playwright@1.58.2
          /tmp/sot-browser-tests/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/sot-browser-tests/node_modules node SOT/qualify-release-d-report-estate.cjs
