name: Restore WorldPulse v1.8 quality-reader baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldpulse-v180-restore.yml'

permissions:
  contents: write

concurrency:
  group: worldpulse-v180-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore preferred UX and add quality-first reader behavior
        run: |
          git show 9f68231500ec26f55e4e4c48016d8ecaa02fe565:globe.html > globe.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('globe.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('WorldPulse v1.5.1 — Global News Sentiment','WorldPulse v1.8.0 — Global News Sentiment')
          s=s.replace('<span class="version">v1.5.1</span>','<span class="version">v1.8.0</span>')
          s=s.replace('const VERSION="1.5.1"','const VERSION="1.8.0"')

          # Make panel roles explicit: geography above, journalism below.
          s=s.replace('<h3 id="childTitle">Regions</h3>','<h3 id="childTitle">Geography navigator</h3>')
          s=s.replace('<h3>Detailed coverage</h3>','<h3>Top journalism for this geography</h3>')
          s=s.replace('placeholder="Filter detailed coverage…"','placeholder="Filter headlines or sources…"')

          # Quality source visual treatment.
          s=s.replace('.articleArrow{color:var(--muted);align-self:center}', '.articleArrow{color:var(--muted);align-self:center}.qualityBadge{display:inline-block;border:1px solid #315c4b;background:#0d2a20;color:#70dda6;border-radius:999px;padding:2px 5px;font-size:8px;font-weight:700}.sourceBadge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 5px;font-size:8px;color:#b8c9dd}')

          # Add quality-domain helpers before renderArticles.
          anchor='function renderArticles()'
          if anchor not in s:
              raise SystemExit('renderArticles anchor missing')
          helper='''const QUALITY_DOMAINS={"bbc.com":100,"bbc.co.uk":100,"reuters.com":98,"apnews.com":98,"npr.org":94,"theguardian.com":92,"aljazeera.com":92,"dw.com":90,"france24.com":90,"abc.net.au":90,"cbc.ca":90,"cbsnews.com":86,"nbcnews.com":86,"abcnews.go.com":86,"cnn.com":84,"nytimes.com":84,"washingtonpost.com":84};\nfunction cleanDomain(v){return String(v||"").toLowerCase().replace(/^www\\./,"")}\nfunction qualityScore(a){const d=cleanDomain(a.domain);for(const [k,v] of Object.entries(QUALITY_DOMAINS))if(d===k||d.endsWith("."+k))return v;return 0}\nfunction qualityName(a){const d=cleanDomain(a.domain);if(d.includes("bbc."))return "BBC";if(d.includes("reuters.com"))return "Reuters";if(d.includes("apnews.com"))return "AP";if(d.includes("npr.org"))return "NPR";if(d.includes("theguardian.com"))return "Guardian";if(d.includes("aljazeera.com"))return "Al Jazeera";if(d.includes("dw.com"))return "DW";if(d.includes("france24.com"))return "France 24";if(d.includes("abc.net.au"))return "ABC Australia";if(d.includes("cbc.ca"))return "CBC";return d||"Source"}\n'''
          s=s.replace(anchor,helper+anchor,1)

          # Replace article collection ordering inside renderArticles without changing geographic scope.
          old='const arts=articlesForNode(n).filter(a=>!q||`${a.title} ${a.domain} ${a.city} ${a.country}`.toLowerCase().includes(q)).slice(0,100);'
          new='const arts=articlesForNode(n).filter(a=>!q||`${a.title} ${a.domain} ${a.city} ${a.country}`.toLowerCase().includes(q)).sort((a,b)=>qualityScore(b)-qualityScore(a)||(String(b.published||"").localeCompare(String(a.published||"")))||Math.abs(Number(b.tone||0))-Math.abs(Number(a.tone||0))).slice(0,100);'
          if old not in s:
              raise SystemExit('article ordering target missing')
          s=s.replace(old,new,1)

          # Add a clear source-quality badge to every headline row.
          old='${esc(a.domain||"source")}'
          new='${qualityScore(a)?`<span class="qualityBadge">${esc(qualityName(a))}</span>`:`<span class="sourceBadge">${esc(a.domain||"source")}</span>`}'
          if old not in s:
              raise SystemExit('article domain display target missing')
          s=s.replace(old,new,1)

          # Reader source link remains prominent and explicitly identifies original publisher.
          s=s.replace('Open original source ↗','Read at original publisher ↗')

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('globe.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/worldpulse.js').write_text(scripts[-1],encoding='utf-8')
          raise SystemExit(subprocess.run(['node','--check','/tmp/worldpulse.js']).returncode)
          PY
          grep -q 'WorldPulse v1.8.0' globe.html
          grep -q 'QUALITY_DOMAINS' globe.html

      - name: Commit v1.8.0
        run: |
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add globe.html
          git rm .github/workflows/worldpulse-v180-restore.yml
          git commit -m "feat: restore v1.5.1 UX with quality-first reader v1.8.0"
          git pull --rebase origin main
          git push origin HEAD:main
