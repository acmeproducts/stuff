name: Market Navigator R7 PMI source probe
on:
  push:
    paths: ['.github/workflows/market-navigator-r7-pmi-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -u
          echo '=== FXMacroData PMI ==='
          curl -L --max-time 20 -sS -D /tmp/h 'https://fxmacrodata.com/api/v1/announcements/usd/pmi?start_date=2015-01-01&end_date=2026-08-31' -o /tmp/pmi || true
          head -20 /tmp/h || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pmi')
          print(p.read_text(errors='replace')[:4000] if p.exists() else 'no body')
          PY
