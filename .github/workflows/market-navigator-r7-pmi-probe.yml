name: Market Navigator R7 PMI source probe
on:
  push:
    paths: ['.github/workflows/market-navigator-r7-pmi-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -u
          for u in \
            'https://api.tradingeconomics.com/historical/country/united%20states/indicator/ism%20manufacturing%20pmi/2015-01-01/2026-08-31?c=guest:guest' \
            'https://api.tradingeconomics.com/historical/country/united%20states/indicator/ism%20manufacturing%20pmi?c=guest:guest' \
            'https://api.tradingeconomics.com/indicators/united%20states?c=guest:guest'; do
            echo "=== $u ==="
            curl -L --max-time 20 -sS -w '\nHTTP=%{http_code}\n' "$u" | head -c 6000 || true
            echo
          done
