name: SOT Turn 01 single-surface qualification
on:
  push:
    branches: [sot-turn01-single-surface-r2]
    paths:
      - 'SOT-turn01-base.html'
      - '.github/workflows/sot-single-surface-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Static product contract and JavaScript parse
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('SOT-turn01-base.html').read_text()
          required=[
            'SOT-turn01-base-single-surface-r2',
            'Scope / Storage','>Index<','>Review<','>Plan<','>Execute<','Activity / Diagnostics',
            'OMNISEARCH','Select Source','Select Target','Select Backup',
            '2-copy groups','3-copy groups','4+ copy groups',
            'Current Plan','Previous / Stale Plan',
            'Default Target','Default Backup','Venice','OpenRouter','SOT_SUPERVISOR_PROMPT',
            "api('/projects')","api('/rollup')","api('/scheduler/status')",
            '/fingerprint/${a}','/duplicates?bucket=','/execute','/certify','/activity?project_token=',
            'function operatorBusy()','setInterval(()=>refresh(false),3000)'
          ]
          for marker in required:
              assert marker in h, marker
          assert 'id="tabs"' not in h
          assert 'data-tab=' not in h
          assert 'Open Review' not in h
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',h,re.I)
          assert scripts
          Path('/tmp/ui.js').write_text('\n;\n'.join(scripts))
          PY
          node --check /tmp/ui.js
      - name: Install Chromium harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Real polling preserves operator state on the single project surface
        run: |
          cat >/tmp/test.js <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=require('assert');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1200,height:900}});
            const html=fs.readFileSync('SOT-turn01-base.html','utf8');
            let phase=0, projectRequests=0;
            await page.route('http://sot.test/**',async route=>{
              const req=route.request(),u=new URL(req.url());
              if(u.pathname==='/') return route.fulfill({status:200,contentType:'text/html',body:html});
              const p=u.pathname.replace('/api/sot','');
              let body={};
              if(p==='/projects'){
                projectRequests++;
                body=[{project_token:'A',project_name:'Alpha',status:'Review',processing_state:'Closed',evidence_revision:2,size_bytes:7700,files_discovered:phase?77:7,files_processed:phase?33:7,folder_count:3,top_level_item_count:2,hashes_reused:4,hashes_computed:3}];
              } else if(p==='/health') body={status:'ok',build:'qualified-backend',database_version:5};
              else if(p==='/rollup') body={active_jobs:0,failed_jobs:0,files_discovered:phase?77:7,bytes_discovered:7700};
              else if(p==='/scheduler/status') body={status:'idle'};
              else if(p==='/turn01/projects/A') body={project_token:'A',project_name:'Alpha',evidence_revision:2,status:'Review',sources:[{normalized_path:'/mnt/c/source'}]};
              else if(p==='/turn01/projects/A/storage') body={target_root:'/mnt/d/target',backup_root:'/mnt/e/backup'};
              else if(p==='/projects/A/fingerprint/status') body={state:'Closed',run:{state:'Closed',files_processed:7,files_discovered:7,bytes_processed:7700,bytes_discovered:7700,hashes_reused:4,hashes_computed:3},progress:{bytes_percent:100}};
              else if(p==='/turn01/projects/A/review') body={project_token:'A',evidence_revision:2,files:7,bytes:7700,unique_content:4,duplicate_groups:2,duplicate_bytes:2500,target_content:4,target_missing_content:0,backup_content:4,backup_missing_content:0};
              else if(p==='/turn01/projects/A/duplicates') body={counts:{two:1,three:1,four_plus:0}};
              else if(p==='/turn01/projects/A/plan') body={project_token:'A',plan_id:'P',state:'draft',evidence_revision:2,items:[{item_id:'1'}],totals:{items:1,target_files:0,backup_files:0,target_bytes:0,backup_bytes:0}};
              else if(p==='/activity') body={events:[{event_type:'processing.completed',created_at:'2026-09-04T20:00:00Z',detail_json:'{}'}]};
              else if(p==='/turn01/volumes') body={volumes:[{name:'C:',path:'/mnt/c',mounted:true,free_bytes:1000000},{name:'D:',path:'/mnt/d',mounted:true,free_bytes:2000000}]};
              else if(p==='/turn01/fs') body={path:u.searchParams.get('path')||'/mnt/c',parent:null,volume:{path:u.searchParams.get('path')||'/mnt/c'},folders:[{name:'one',path:(u.searchParams.get('path')||'/mnt/c')+'/one'}]};
              else if(req.method()==='PUT'||req.method()==='POST'||req.method()==='PATCH'||req.method()==='DELETE') body={ok:true,project_token:'A'};
              return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});
            });
            await page.goto('http://sot.test/',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('[data-project="A"]');
            await page.click('[data-project="A"]');
            await page.waitForSelector('#projectName');
            const headings=await page.locator('.stepTitle').allTextContents();
            for(const x of ['Scope / Storage','Index','Review','Plan','Execute','Activity / Diagnostics']) assert(headings.includes(x),x);
            assert.equal(await page.locator('#tabs').count(),0);
            await page.fill('#search','keep-me');
            await page.click('#editTarget');
            await page.waitForSelector('#newFolder');
            await page.fill('#newFolder','editing-folder');
            await page.focus('#newFolder');
            await page.evaluate(()=>{document.querySelector('#workspace').scrollTop=123;});
            const before=projectRequests;
            phase=1;
            await page.waitForTimeout(3400);
            assert(projectRequests>before,'real polling did not request projects again');
            assert.equal(await page.evaluate(()=>state.projects[0].files_discovered),77,'polled server state was not ingested');
            assert.equal(await page.evaluate(()=>state.selected),'A');
            assert.equal(await page.inputValue('#search'),'keep-me');
            assert.equal(await page.locator('.modalBg').count(),1,'picker was closed by polling');
            assert.equal(await page.inputValue('#newFolder'),'editing-folder','picker edit value was replaced');
            assert.equal(await page.evaluate(()=>document.activeElement&&document.activeElement.id),'newFolder','focus was stolen');
            assert.equal(await page.evaluate(()=>document.querySelector('#workspace').scrollTop),123,'workspace scroll changed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/test.js
