name: SOT picker 4.7 rebuild
on:
  push:
    paths:
      - '.github/workflows/sot-picker-47-run.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore baseline
        run: git checkout 970d56435a84192c74de4d3eb7978ee327d303c4 -- project.html
      - name: Apply picker
        run: python3 tools/sot_picker_47.py
      - name: Gate
        run: |
          python3 -c "import re,pathlib; s=pathlib.Path('project.html').read_text(); pathlib.Path('/tmp/p.js').write_text(re.search(r'<script>(.*?)</script>',s,re.S).group(1))"
          node --check /tmp/p.js
          grep -q 'Build: 2026.08.11.4.7' project.html
          grep -q 'function openSourceExplorer' project.html
          grep -q 'data-root-check' project.html
          grep -q 'data-folder-check' project.html
          grep -q 'Added to project' project.html
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-picker-47-run.yml
          git rm tools/sot_picker_47.py
          git rm -f .github/workflows/sot-picker-47-from-45.yml || true
          git add project.html project-backlog.md
          git commit -m 'Rebuild SOT three-panel picker .4.7 from .4.5'
          git pull --rebase origin main
          git push origin HEAD:main
