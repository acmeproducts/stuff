name: Run SOT picker .4.7

on:
  push:
    paths:
      - '.github/workflows/sot-picker-47-run.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact .4.5 baseline
        run: git checkout 970d56435a84192c74de4d3eb7978ee327d303c4 -- project.html
      - name: Build .4.7
        run: python3 tools/sot_build_picker_47.py
      - name: Gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          assert 'Build: 2026.08.11.4.7' in s
          assert "BUILD_ID='2026.08.11.4.7'" in s
          assert 'function openSourceExplorer' in s
          assert 'data-root-check' in s
          assert 'data-folder-check' in s
          assert 'Added to project' in s
          assert "if(mode==='source')return openSourceExplorer()" in s
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          PY
          node --check /tmp/project.js
      - name: Commit
        run: |
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-picker-47-run.yml
          git rm tools/sot_build_picker_47.py
          git rm -f .github/workflows/sot-picker-47-from-45.yml || true
          git add project.html project-backlog.md
          git commit -m 'Build SOT three-panel picker .4.7 from .4.5 baseline'
          git pull --rebase origin main
          git push origin HEAD:main
