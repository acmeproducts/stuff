name: Apply WorldPulse rear droplet interaction
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch globe
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('globe.html')
          s=p.read_text()
          s=s.replace('WorldPulse Sphere v2.6.0','WorldPulse Sphere v2.6.1')
          s=s.replace("const VERSION='2.6.0'","const VERSION='2.6.1'")
          s=s.replace('.drop.back{pointer-events:none}','.drop.back{pointer-events:auto}')
          s=s.replace("d.style.opacity=.18+.82*z;","d.style.opacity=1;")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add globe.html
          git diff --cached --quiet || git commit -m "fix: make rear droplets fully visible and clickable"
          git push
