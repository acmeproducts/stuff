name: Deploy DevStream runner
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'devstream/runner/**'
      - '.github/workflows/deploy-devstream-runner.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devstream/runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and test
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4 deploy
      - name: Send secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          S_GH_TOKEN: ${{ secrets.DEVSTREAM_GH_TOKEN }}
          S_VENICE_KEY: ${{ secrets.DEVSTREAM_VENICE_KEY }}
          S_OPENROUTER_KEY: ${{ secrets.DEVSTREAM_OPENROUTER_KEY }}
          S_ANTHROPIC_KEY: ${{ secrets.DEVSTREAM_ANTHROPIC_KEY }}
          S_RUNNER_CODE: ${{ secrets.DEVSTREAM_RUNNER_CODE }}
        run: |
          node -e "
            const m={GH_TOKEN:process.env.S_GH_TOKEN,VENICE_KEY:process.env.S_VENICE_KEY,OPENROUTER_KEY:process.env.S_OPENROUTER_KEY,ANTHROPIC_KEY:process.env.S_ANTHROPIC_KEY,RUNNER_CODE:process.env.S_RUNNER_CODE};
            const o={};for(const k in m)if(m[k])o[k]=m[k];
            require('fs').writeFileSync('secrets.json',JSON.stringify(o));
            console.log('secrets present:',Object.keys(o).join(', ')||'none');
            for(const k of ['GH_TOKEN','RUNNER_CODE'])if(!o[k])console.log('::warning::DEVSTREAM_'+(k==='GH_TOKEN'?'GH_TOKEN':'RUNNER_CODE')+' is not set — the runner will refuse jobs until it is');
            if(!o.VENICE_KEY&&!o.OPENROUTER_KEY&&!o.ANTHROPIC_KEY)console.log('::warning::no AI key secret is set — the runner has nothing to ask');
          "
          if [ "$(node -p "Object.keys(require('./secrets.json')).length")" != "0" ]; then npx -y wrangler@4 secret bulk secrets.json; fi
          rm -f secrets.json
      - name: Live check
        env:
          S_RUNNER_CODE: ${{ secrets.DEVSTREAM_RUNNER_CODE }}
        run: |
          B=https://devstream-runner.myacctfortracking.workers.dev
          sleep 8
          curl -fsS -m 20 "$B/health" | tee /tmp/h.txt; echo
          grep -q '"v":"b68"' /tmp/h.txt
          code=$(curl -s -m 20 -o /dev/null -w '%{http_code}' "$B/status?repo=stuff&key=ci")
          echo "status without a code -> $code"
          [ "$code" = "401" ] || [ "$code" = "503" ]
          if [ -n "$S_RUNNER_CODE" ]; then
            code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -H "X-Runner-Code: $S_RUNNER_CODE" "$B/status?repo=stuff&key=ci")
            echo "status with the code -> $code"
            [ "$code" = "200" ]
          fi
