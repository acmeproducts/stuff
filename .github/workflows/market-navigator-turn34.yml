name: Market Navigator Turn 34 Rollback Qualify
on:
  push:
    paths:
      - 'market-navigator-turn34-governance.py'
      - 'market-navigator-build-turn34.py'
      - 'market-navigator-turn34-qa.mjs'
      - '.github/workflows/market-navigator-turn34.yml'
permissions: {contents: write}
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Governance
        run: python market-navigator-turn34-governance.py
      - name: Restore exact accepted Turn 28
        run: python market-navigator-build-turn34.py
      - name: Exact artifact identity
        run: cmp -s market-navigator-turn28-ship.html market-navigator-turn34-pre-ship.html
      - name: JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s = pathlib.Path('market-navigator-turn34-pre-ship.html').read_text()
          pathlib.Path('/tmp/mn34.js').write_text('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>', s, re.S)))
          PY
          node --check /tmp/mn34.js
      - name: NOW runtime smoke
        run: |
          npm ci
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          python -m http.server 8123 >/tmp/mn34-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER || true' EXIT
          sleep 2
          MARKET_NAVIGATOR_URL=http://127.0.0.1:8123/market-navigator-turn34-pre-ship.html node market-navigator-turn34-qa.mjs
      - name: Commit qualified rollback
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MARKET-NAVIGATOR-MASTER-PLAN.md MARKET-NAVIGATOR-GRAVEYARD.md market-navigator-turn34-pre-ship.html
          git diff --cached --quiet && exit 0
          git commit -m 'Market Navigator Turn 34: restore accepted Turn 28 byte-for-byte'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
