name: SOT Turn 01 Base coordination executable qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sot-coordination2-candidate-qualification.yml'
      - 'integrate-SOT-turn01-coordination.py'
      - 'integrate-SOT-turn01-coordination2.py'
      - 'integrate-SOT-turn01-coordination-ui.py'
      - 'integrate-SOT-turn01-coordination2-ui.py'
      - 'sot-worker.js'
      - 'sot-coordinator.js'
      - 'sot-db/migrations/005-project-coordination.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Generate exact clean-lineage backend and UI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/9422453c180f8fce4e7d5fe362867912dc8005d1/sot-api.js -o /tmp/pre.js
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/1aebf2624621b08880a595ef9d1f58f2c8cde1b/integrate-SOT-turn01-base.py -o /tmp/base.py
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/1abfeef83cc1f4da25de09e297361beb5320d516/generate-SOT-turn01-base22.py -o /tmp/base22.py
          python3 /tmp/base.py /tmp/pre.js /tmp/base3.js
          python3 /tmp/base22.py /tmp/base3.js /tmp/base22.js
          python3 integrate-SOT-turn01-coordination.py /tmp/base22.js /tmp/c1.js
          python3 integrate-SOT-turn01-coordination2.py /tmp/c1.js /tmp/sot-api.js
          node --check /tmp/sot-api.js
          grep -Fq "2026.09.03.sot-turn01-coordination-2" /tmp/sot-api.js
          cp sot-worker.js sot-coordinator.js sot-sqlite.py /tmp/
          mkdir -p /tmp/sot-db/migrations
          cp sot-db/migrations/*.sql /tmp/sot-db/migrations/
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/7a377c27e1ac078510b9d1e4fe66da4f997f25f3/SOT-turn01-pre-base.html -o /tmp/pre.html
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/603e8a331b13b72a097e9ebb9640e33707279777/integrate-SOT-turn01-base22-ui.py -o /tmp/u22.py
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/083aa1334208b1e6995fa18852e82722a815f331/integrate-SOT-turn01-base24-ui.py -o /tmp/u24.py
          curl -fsSL https://raw.githubusercontent.com/acmeproducts/stuff/5660a5fd6f0aaa6c7b734f2ad04b468b65693eb5/integrate-SOT-turn01-base-ai.py -o /tmp/uai.py
          python3 /tmp/u22.py /tmp/pre.html /tmp/22.html
          python3 /tmp/u24.py /tmp/22.html /tmp/24.html
          python3 /tmp/uai.py /tmp/24.html /tmp/base.html
          python3 integrate-SOT-turn01-coordination-ui.py /tmp/base.html /tmp/u1.html
          python3 integrate-SOT-turn01-coordination2-ui.py /tmp/u1.html /tmp/ui.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('/tmp/ui.html').read_text()
          Path('/tmp/ui.js').write_text('\n;\n'.join(re.findall(r'<script[^>]*>([\s\S]*?)</script>',h,re.I)))
          PY
          node --check /tmp/ui.js
      - name: Build disposable schema 5 database
        run: |
          set -euo pipefail
          db=/tmp/sot.sqlite; now=2026-09-04T00:00:00.000Z
          for m in /tmp/sot-db/migrations/001-initial.sql /tmp/sot-db/migrations/002-project-list-metrics.sql /tmp/sot-db/migrations/003-project-run-controls.sql /tmp/sot-db/migrations/004-live-byte-progress.sql /tmp/sot-db/migrations/005-project-coordination.sql; do
            sqlite3 "$db" < "$m"
            n="$(basename "$m")"; v="$(echo "$n"|cut -c1-3|sed 's/^0*//')"; c="$(sha256sum "$m"|awk '{print $1}')"
            sqlite3 "$db" "INSERT INTO schema_migrations VALUES($v,'$n','$c','$now');"
          done
      - name: Execute coordination behavior gates 1-8
        env:
          SOT_DB_PATH: /tmp/sot.sqlite
          SOT_ROOT: /tmp/sot-state
          SOT_SQLITE_ADAPTER: /tmp/sot-sqlite.py
          SOT_TEST_HASH_DELAY_MS: '250'
        run: |
          set -euo pipefail
          mkdir -p /tmp/src-a /tmp/src-b /tmp/sot-state
          for i in $(seq 1 20); do printf 'alpha-%02d\n' "$i" > "/tmp/src-a/a-$i.txt"; printf 'beta-%02d\n' "$i" > "/tmp/src-b/b-$i.txt"; done
          node <<'NODE'
          const crypto=require('crypto'),path=require('path');
          const api=require('/tmp/sot-api.js'),t=api._test;
          const q=v=>`'${String(v).replaceAll("'","''")}'`, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const rows=sql=>{const v=t.sqlite(sql,true); return Array.isArray(v)?v:JSON.parse(v||'[]')};
          const now=()=>new Date().toISOString();
          const must=(x,m)=>{if(!x) throw new Error(m)};
          function seed(id,src){const sid=id+'s',n=now();t.sqlite(`INSERT INTO projects(project_token,project_name,workflow_step,status,created_at,updated_at) VALUES(${q(id)},${q('Project '+id)},2,'Sources',${q(n)},${q(n)}); INSERT INTO sources(source_id,project_token,normalized_path,preflight_status,created_at,updated_at) VALUES(${q(sid)},${q(id)},${q(src)},'ready',${q(n)},${q(n)});`);return sid}
          async function waitNoActive(id,limit=200){for(let i=0;i<limit;i++){let n=Number(rows(`SELECT COUNT(*) n FROM project_operations WHERE project_token=${q(id)} AND state IN ('queued','running','paused');`)[0]?.n||0);if(!n)return;await sleep(100)}throw Error('active operation timeout '+id)}
          async function waitRun(id,state,limit=200){for(let i=0;i<limit;i++){let r=rows(`SELECT state,phase FROM processing_runs WHERE project_token=${q(id)} ORDER BY started_at DESC LIMIT 1;`)[0];if(r&&state.includes(r.state))return r;await sleep(100)}throw Error('run state timeout '+id)}
          function committed(id,sid,run='seedrun',rev=1){const n=now(),body='committed\n',hash=crypto.createHash('sha256').update(body).digest('hex'),obs=id+'obs';t.sqlite(`INSERT OR IGNORE INTO content(content_sha256,size,first_seen_at,last_seen_at) VALUES(${q(hash)},${body.length},${q(n)},${q(n)}); INSERT INTO processing_runs(run_id,project_token,state,phase,started_at,updated_at,ended_at) VALUES(${q(run)},${q(id)},'Closed','complete',${q(n)},${q(n)},${q(n)}); INSERT INTO observations(observation_id,project_token,source_id,run_id,normalized_path,relative_path,filename,size,modified_ms,content_sha256,path_hash,observation_hash,first_observed_at,last_observed_at) VALUES(${q(obs)},${q(id)},${q(sid)},${q(run)},${q('/tmp/src-'+id.toLowerCase()+'/committed.txt')},'committed.txt','committed.txt',${body.length},1,${q(hash)},${q('1'.repeat(64))},${q('2'.repeat(64))},${q(n)},${q(n)}); INSERT OR REPLACE INTO current_observations(source_id,relative_path,observation_id,run_id) VALUES(${q(sid)},'committed.txt',${q(obs)},${q(run)}); UPDATE projects SET evidence_revision=${rev},workflow_step=4,status='Review',lifecycle_state='indexed' WHERE project_token=${q(id)};`)}
          (async()=>{
            const sa=seed('A','/tmp/src-a'); seed('B','/tmp/src-b');
            t.startProcessing('A'); t.startProcessing('B');
            await sleep(350);
            let active=rows("SELECT project_token,state FROM project_operations WHERE state IN ('queued','running')");
            must(new Set(active.map(x=>x.project_token)).size===2,'gate2 cross-project independence');
            const before=rows("SELECT active_operation_id,mutation_generation,evidence_revision FROM projects WHERE project_token='A'")[0];
            let conflict=false; try{t.generatePlan('A')}catch(e){conflict=e.status===409} must(conflict,'gate1 conflict not rejected');
            const after=rows("SELECT active_operation_id,mutation_generation,evidence_revision FROM projects WHERE project_token='A'")[0];
            must(JSON.stringify(before)===JSON.stringify(after),'gate1 conflict changed state');
            t.stopProcessing('A'); t.stopProcessing('B'); await waitNoActive('A'); await waitNoActive('B');
            committed('A',sa,'seedA',1);
            t.sqlite(`INSERT INTO plans(plan_id,project_token,evidence_revision,state,created_at) VALUES('planN','A',1,'draft',${q(now())});`);
            t.startProcessing('A'); await sleep(350);
            let p=t.projectDetail('A'), rev=t.review('A'), plan=rows("SELECT evidence_revision,state FROM plans WHERE plan_id='planN'")[0];
            must(Number(p.evidence_revision)===1 && rev.files===1 && plan.state==='draft','gate4 current evidence/plan lost during reindex');
            t.stopProcessing('A'); await waitNoActive('A');
            p=t.projectDetail('A'); rev=t.review('A'); plan=rows("SELECT evidence_revision,state FROM plans WHERE plan_id='planN'")[0];
            must(Number(p.evidence_revision)===1 && rev.files===1 && plan.state==='draft','gate4 cancelled reindex lost N');
            const mod=path.resolve('/tmp/sot-api.js'); delete require.cache[mod]; const api2=require(mod),t2=api2._test;
            const p2=t2.projectDetail('A'), rev2=t2.review('A');
            must(Number(p2.evidence_revision)===1 && rev2.files===1,'gate3 committed state not durable after API reload');
            const oldGen=Number(rows("SELECT mutation_generation FROM projects WHERE project_token='A'")[0].mutation_generation);
            t.sqlite(`UPDATE projects SET mutation_generation=${oldGen+1},active_operation_id=NULL,lifecycle_state='indexed' WHERE project_token='A';`);
            let staleRejected=false; try{if(t.processRun)await t.processRun('seedA','A')}catch(e){staleRejected=/stale|coordination|operation/i.test(String(e.message))}
            must(staleRejected || Number(rows("SELECT evidence_revision FROM projects WHERE project_token='A'")[0].evidence_revision)===1,'gate6 stale worker advanced evidence');
            t.startProcessing('A'); await sleep(300); t.pauseProcessing('A'); await waitRun('A',['Paused']);
            let paused=rows("SELECT state FROM project_operations WHERE project_token='A' ORDER BY generation DESC LIMIT 1")[0]; must(paused&&paused.state==='paused','gate7 pause not durable');
            must(Number(t.projectDetail('A').evidence_revision)===1 && t.review('A').files===1,'gate7 pause lost committed evidence');
            t.stopProcessing('A'); await waitNoActive('A');
            must(Number(t.projectDetail('A').evidence_revision)===1 && t.review('A').files===1,'gate7 stop lost committed evidence');
            t.startProcessing('A'); await sleep(300);
            const activeOp=rows("SELECT operation_id,generation FROM project_operations WHERE project_token='A' AND state IN ('queued','running') ORDER BY generation DESC LIMIT 1")[0];
            must(activeOp,'gate7 restart fixture missing active op');
            delete require.cache[mod]; require(mod)._test.projectDetail('A');
            const intr=rows(`SELECT state FROM project_operations WHERE operation_id=${q(activeOp.operation_id)}`)[0];
            must(intr&&intr.state==='interrupted','gate7 restart did not interrupt active operation');
            must(Number(rows("SELECT evidence_revision FROM projects WHERE project_token='A'")[0].evidence_revision)===1,'gate7 restart lost committed evidence');
            const events=rows("SELECT event_type,detail_json FROM events WHERE project_token='A' ORDER BY event_id");
            const types=new Set(events.map(e=>e.event_type));
            for(const required of ['operation.queued','operation.running','operation.cancelled','processing.started']) must(types.has(required),'gate8 missing event '+required);
            must(events.some(e=>String(e.detail_json||'').includes('operation_id')),'gate8 event ledger lacks operation identity');
            console.log('PASS gate1 same-project exclusion');
            console.log('PASS gate2 cross-project independence');
            console.log('PASS gate3 committed-state durability');
            console.log('PASS gate4 re-index atomicity');
            console.log('PASS gate5 plan truth retained during replacement');
            console.log('PASS gate6 stale generation cannot advance committed evidence');
            console.log('PASS gate7 pause/stop/restart durability');
            console.log('PASS gate8 activity reconstruction');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Execute real Chromium UI reconciliation gate 9
        run: |
          set -euo pipefail
          cat >/tmp/ui-harness.js <<'NODE'
          const {chromium}=require('playwright'); const fs=require('fs');
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1200,height:900}});
          await page.route('**/api/sot/**',async route=>{const u=route.request().url();let body={};if(u.includes('/projects'))body={projects:[{project_token:'A',project_name:'Alpha',workflow_step:4,status:'Review',evidence_revision:1}]};else if(u.includes('/health'))body={status:'ok',build:'test'};else if(u.includes('/activity'))body={events:[]};await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(body)});});
          await page.setContent(fs.readFileSync('/tmp/ui.html','utf8'),{waitUntil:'domcontentloaded'});await page.waitForTimeout(800);
          await page.evaluate(()=>{state.selected='A';state.tab='projects';state.projectTab='plan';state.query='keep-me';render();});await page.waitForTimeout(200);
          await page.evaluate(()=>{const c=document.querySelector('.content')||document.scrollingElement;c.scrollTop=137;const cards=document.querySelector('.cards');if(cards)cards.scrollTop=61;let inp=document.querySelector('input');if(!inp){inp=document.createElement('input');inp.id='harness-input';document.body.appendChild(inp)}inp.value='operator-edit';inp.focus();const modal=document.createElement('div');modal.id='harness-modal';modal.setAttribute('role','dialog');modal.textContent='open';document.body.appendChild(modal);});
          const before=await page.evaluate(()=>({selected:state.selected,tab:state.tab,projectTab:state.projectTab,query:state.query,active:document.activeElement?.id||document.activeElement?.name||document.activeElement?.tagName,value:document.activeElement?.value||'',modal:!!document.querySelector('#harness-modal'),content:(document.querySelector('.content')||document.scrollingElement).scrollTop,cards:document.querySelector('.cards')?.scrollTop||0}));
          await page.evaluate(async()=>{if(typeof backgroundPulse==='function')await backgroundPulse();});await page.waitForTimeout(500);
          const after=await page.evaluate(()=>({selected:state.selected,tab:state.tab,projectTab:state.projectTab,query:state.query,active:document.activeElement?.id||document.activeElement?.name||document.activeElement?.tagName,value:document.activeElement?.value||'',modal:!!document.querySelector('#harness-modal'),content:(document.querySelector('.content')||document.scrollingElement).scrollTop,cards:document.querySelector('.cards')?.scrollTop||0}));
          for(const k of ['selected','tab','projectTab','query','active','value','modal'])if(before[k]!==after[k])throw Error(`gate9 ${k} changed ${JSON.stringify({before,after})}`);if(Math.abs(before.content-after.content)>2||Math.abs(before.cards-after.cards)>2)throw Error(`gate9 scroll changed ${JSON.stringify({before,after})}`);console.log('PASS gate9 Chromium operator-state reconciliation');await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/ui-harness.js
      - name: Gate 10 structural release floor
        run: |
          set -euo pipefail
          node --check /tmp/sot-api.js
          node --check /tmp/sot-worker.js
          node --check /tmp/sot-coordinator.js
          node --check /tmp/ui.js
          sqlite3 /tmp/sot.sqlite 'PRAGMA integrity_check' | grep -qx ok
          grep -Fq 'durable-project-coordination' /tmp/sot-api.js
          grep -Fq 'Storage & Scope' /tmp/ui.html
          grep -Fq 'Index & Evidence' /tmp/ui.html
          grep -Fq 'Plan' /tmp/ui.html
          grep -Fq 'Execution' /tmp/ui.html
          grep -Fq 'Activity' /tmp/ui.html
          echo 'PASS gate10 parse/schema/product-contract floor'
