name: Session Manager v2.7.1 mobile interactions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/session-manager-v271-mobile-interactions.yml'
permissions:
  contents: write
concurrency:
  group: session-manager-v271-mobile-interactions
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact production file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('session-manager-v3.html')
          s=p.read_text(encoding='utf-8')
          old="const BUILD_VERSION='2.7.0';"
          assert s.count(old)==1, f'expected exactly one {old}'
          s=s.replace(old,"const BUILD_VERSION='2.7.1';",1)
          marker='</script>\n</body>\n</html>'
          assert s.count(marker)==1, 'closing script marker not unique'
          js=r'''<script>
+(()=>{'use strict';
+const LONG_PRESS_MS=550,DRAG_ARM_MS=220,LONG_PRESS_MOVE=12;
+let gesture=null,ghost=null,hoverNode=null,suppressClickUntil=0,desktopOrigin='';
+const tabs=()=>document.getElementById('projectTabs'),sidebar=()=>document.getElementById('sidebar');
+function activeProjectId(){return document.querySelector('.projectRow.active[data-project]')?.dataset.project||''}
+function clearHover(){if(!hoverNode)return;hoverNode.classList.remove('dragOver','dragBefore','dragAfter');hoverNode=null}
+function removeGhost(){ghost?.remove();ghost=null}
+function cancelGesture(){if(gesture?.timer)clearTimeout(gesture.timer);gesture=null;clearHover();removeGhost()}
+function makeGhost(tab,x,y){removeGhost();ghost=document.createElement('div');ghost.textContent=tab.querySelector('.tabLabel')?.textContent?.trim()||'Session';Object.assign(ghost.style,{position:'fixed',zIndex:'2500',pointerEvents:'none',left:x+'px',top:y+'px',transform:'translate(-50%,-135%)',maxWidth:'240px',padding:'8px 11px',border:'1px solid var(--ln)',borderRadius:'9px',background:'var(--p)',color:'var(--tx)',boxShadow:'0 12px 34px rgba(0,0,0,.28)',fontWeight:'750',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'});document.body.appendChild(ghost)}
+function moveGhost(x,y){if(ghost){ghost.style.left=x+'px';ghost.style.top=y+'px'}}
+function fakeDrop(el,key,e){let origin=gesture?.origin||desktopOrigin,dt={types:['text/session-key'],getData:t=>t==='text/session-key'?key:'',dropEffect:'move',effectAllowed:'move'};if(typeof el?.ondrop==='function')el.ondrop({preventDefault(){},stopPropagation(){},dataTransfer:dt,clientX:e.clientX,clientY:e.clientY,target:el});if(origin&&el?.matches?.('.projectRow[data-project]')&&el.dataset.project!==origin)setTimeout(()=>document.querySelector(`.projectRow[data-project="${CSS.escape(origin)}"]`)?.click(),0)}
+function elementAt(x,y){let el=document.elementFromPoint(x,y);return{project:el?.closest?.('.projectRow[data-project]')||null,tab:el?.closest?.('.projectTab[data-project-session]')||null}}
+function highlightTarget(x,y,key){clearHover();let{project,tab}=elementAt(x,y);if(project){project.classList.add('dragOver');hoverNode=project;return}if(tab&&tab.dataset.projectSession!==key){let r=tab.getBoundingClientRect(),after=x>r.left+r.width/2;tab.classList.add(after?'dragAfter':'dragBefore');hoverNode=tab}}
+function maybeOpenSidebar(x){let s=sidebar();if(x<=56&&s?.classList.contains('collapsed'))document.getElementById('menu')?.click()}
+function longPressOpen(g){if(gesture!==g||g.mode!=='pending')return;g.mode='menu';suppressClickUntil=Date.now()+800;let fn=g.tab.oncontextmenu;if(typeof fn==='function')fn.call(g.tab,{preventDefault(){},stopPropagation(){},clientX:g.x,clientY:g.y,target:g.tab,pointerType:g.pointerType});if(navigator.vibrate)try{navigator.vibrate(12)}catch{}gesture=null}
+function onPointerDown(e){if(!['touch','pen'].includes(e.pointerType)||e.button!==0)return;let tab=e.target.closest?.('.projectTab[data-project-session]');if(!tab||e.target.closest?.('.tabClose'))return;cancelGesture();let g={pointerId:e.pointerId,pointerType:e.pointerType,tab,key:tab.dataset.projectSession,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,startAt:performance.now(),mode:'pending',origin:activeProjectId(),timer:null};g.timer=setTimeout(()=>longPressOpen(g),LONG_PRESS_MS);gesture=g}
+function onPointerMove(e){let g=gesture;if(!g||e.pointerId!==g.pointerId)return;let dx=e.clientX-g.startX,dy=e.clientY-g.startY,dist=Math.hypot(dx,dy),elapsed=performance.now()-g.startAt;g.x=e.clientX;g.y=e.clientY;if(g.mode==='pending'){if(dist>LONG_PRESS_MOVE&&elapsed<DRAG_ARM_MS){cancelGesture();return}if(dist>LONG_PRESS_MOVE&&elapsed>=DRAG_ARM_MS){clearTimeout(g.timer);g.timer=null;g.mode='drag';suppressClickUntil=Date.now()+900;makeGhost(g.tab,e.clientX,e.clientY)}}if(g.mode==='drag'){e.preventDefault();moveGhost(e.clientX,e.clientY);maybeOpenSidebar(e.clientX);highlightTarget(e.clientX,e.clientY,g.key)}}
+function onPointerUp(e){let g=gesture;if(!g||e.pointerId!==g.pointerId)return;if(g.timer)clearTimeout(g.timer);if(g.mode==='drag'){e.preventDefault();let{project,tab}=elementAt(e.clientX,e.clientY);if(project)fakeDrop(project,g.key,e);else if(tab&&tab.dataset.projectSession!==g.key)fakeDrop(tab,g.key,e)}gesture=null;clearHover();removeGhost()}
+function onPointerCancel(e){if(gesture&&e.pointerId===gesture.pointerId)cancelGesture()}
+function bindMobile(){let root=tabs();if(!root)return;root.addEventListener('pointerdown',onPointerDown,{passive:true});root.addEventListener('pointermove',onPointerMove,{passive:false});root.addEventListener('pointerup',onPointerUp,{passive:false});root.addEventListener('pointercancel',onPointerCancel,{passive:true});root.addEventListener('click',e=>{if(Date.now()<suppressClickUntil&&e.target.closest?.('.projectTab[data-project-session]')){e.preventDefault();e.stopImmediatePropagation()}},true);root.addEventListener('dragstart',e=>{if(e.target.closest?.('.projectTab[data-project-session]'))desktopOrigin=activeProjectId()},true);document.addEventListener('drop',e=>{let row=e.target.closest?.('.projectRow[data-project]'),origin=desktopOrigin;desktopOrigin='';if(row&&origin&&row.dataset.project!==origin)setTimeout(()=>document.querySelector(`.projectRow[data-project="${CSS.escape(origin)}"]`)?.click(),0)},true)}
+document.querySelectorAll('.version').forEach(n=>n.textContent='v2.7.1');
+bindMobile();
+})();
+</script>'''.replace('\n+','\n').lstrip('+')
          s=s.replace(marker,'</script>\n'+js+'\n</body>\n</html>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import re
          s=open('session-manager-v3.html',encoding='utf-8').read()
          gates=["const BUILD_VERSION='2.7.1'",'LONG_PRESS_MS=550','DRAG_ARM_MS=220','LONG_PRESS_MOVE=12',"['touch','pen'].includes(e.pointerType)",'elementFromPoint','fakeDrop(project','fakeDrop(tab','oncontextmenu']
          for gate in gates: assert gate in s, gate
          scripts=re.findall(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert len(scripts)>=2
          for i,js in enumerate(scripts): open(f'/tmp/sm-{i}.js','w',encoding='utf-8').write(js)
          print('semantic gates passed')
          PY
          for f in /tmp/sm-*.js; do node --check "$f"; done
      - name: Publish and clean patch machinery
        run: |
          rm -f .github/patches/session-manager-v271-mobile-interactions.patch .github/workflows/session-manager-v271-mobile-interactions.yml
          git add -A
          git commit -m 'Patch ProjectChat v2.7.1 mobile tab interactions'
          git push origin HEAD:main
