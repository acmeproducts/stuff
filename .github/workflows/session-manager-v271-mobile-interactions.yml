name: Session Manager v2.7.1 mobile interactions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/session-manager-v271-mobile-interactions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 -c "from pathlib import Path; p=Path('session-manager-v3.html'); s=p.read_text(); q=Path('.github/patches/session-manager-v271-mobile-interactions.patch').read_text(); old=\"const BUILD_VERSION='2.7.0';\"; assert s.count(old)==1; s=s.replace(old,\"const BUILD_VERSION='2.7.1';\",1); added='\\n'.join(x[1:] for x in q.splitlines() if x.startswith('+') and not x.startswith('+++') and \"BUILD_VERSION='2.7.1'\" not in x); marker='</script>\\n</body>\\n</html>'; assert s.count(marker)==1; s=s.replace(marker,'</script>\\n'+added+'\\n</body>\\n</html>',1); p.write_text(s)"
      - name: Validate
        run: |
          grep -q "BUILD_VERSION='2.7.1'" session-manager-v3.html
          grep -q 'LONG_PRESS_MS=550' session-manager-v3.html
          grep -q 'DRAG_ARM_MS=220' session-manager-v3.html
          grep -q 'fakeDrop(project' session-manager-v3.html
          grep -q 'fakeDrop(tab' session-manager-v3.html
          python3 -c "import re; s=open('session-manager-v3.html').read(); a=re.findall(r'<script>\\s*(.*?)\\s*</script>',s,re.S); assert len(a)>=2; [open('/tmp/sm-'+str(i)+'.js','w').write(x) for i,x in enumerate(a)]"
          for f in /tmp/sm-*.js; do node --check "$f"; done
      - name: Publish
        run: |
          rm -f .github/patches/session-manager-v271-mobile-interactions.patch .github/workflows/session-manager-v271-mobile-interactions.yml
          git add -A
          git commit -m 'Patch ProjectChat v2.7.1 mobile tab interactions'
          git push origin HEAD:main
