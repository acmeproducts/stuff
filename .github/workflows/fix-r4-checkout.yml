name: Fix Gate 4 R4 checkout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-r4-checkout.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          set -euo pipefail
          sed -i 's/fetch-depth: 0/fetch-depth: 1/' .github/workflows/market-navigator-gate4-r4-build.yml
          git config user.name market-navigator-r4-bot
          git config user.email market-navigator-r4-bot@users.noreply.github.com
          git add .github/workflows/market-navigator-gate4-r4-build.yml
          git commit -m 'build: use shallow checkout for Gate 4 R4 validation'
          git push origin HEAD:main
