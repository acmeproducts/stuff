name: Market Navigator Turn 37 Stage 3 Analyze
on:
  push:
    paths:
      - 'market-navigator-turn37-stage3-analyze.html'
      - 'market-navigator-turn37-stage3-gate.mjs'
      - 'market-navigator-turn37-stage3-qa.mjs'
      - '.github/workflows/market-navigator-turn37-stage3.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: test "$(git hash-object market-navigator-turn28-post-ship.html)" = "9ce7f67451f9e1b7804927ce5c56adb667614724"
      - run: node market-navigator-turn37-stage3-gate.mjs
      - name: Syntax
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),s=fs.readFileSync('market-navigator-turn37-stage3-analyze.html','utf8');for(const [i,m] of [...s.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].entries())if(!/\bsrc\s*=/.test(m[1])&&m[2].trim())new vm.Script(m[2],{filename:'stage3-'+i+'.js'});console.log('PASS syntax');
          JS
      - run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8123 >/tmp/mn37-stage3-http.log 2>&1 &
          SERVER=$!; trap 'kill $SERVER || true' EXIT; sleep 2
          node market-navigator-turn37-stage3-qa.mjs
