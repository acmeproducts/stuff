name: Market Navigator Turn 05 qualification
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-turn05-pre-ship.html'
      - '.github/workflows/market-navigator-turn05-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static and syntax gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('market-navigator-turn05-pre-ship.html').read_text()
          assert '<iframe' not in s.lower()
          assert all(x in s for x in ['NOW','EXPLORE','LIBRARY','HEALTH','CONFIG'])
          assert all(x in s for x in ["'1D'","'5D'","'MTD'","'YTD'","'1YR'","'3YR'","'5YR'"])
          assert 'Y1 + Y2' in s and 'Indexed 100' in s and 'Add Series' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/mn.js').write_text(scripts[-1])
          PY
          node --check /tmp/mn.js
      - name: Browser chart, touch, layout and axis gates
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8123 >/tmp/mn-server.log 2>&1 &
          cat > qa.js <<'JS'
          const {chromium}=require('playwright');
          async function clickSeries(page, q){
            await page.locator('#addSeries').click();
            await page.locator('#pickerSearch').fill(q);
            const r=page.locator('#pickerList .row').first();
            if(!await r.count()) throw Error('missing picker result '+q);
            await r.click();
            await page.waitForTimeout(150);
          }
          (async()=>{
            const b=await chromium.launch({headless:true});
            for(const vp of [{width:1280,height:800},{width:390,height:844}]){
              const p=await b.newPage({viewport:vp,hasTouch:true}); let errors=[]; p.on('pageerror',e=>errors.push(String(e)));
              await p.goto('http://127.0.0.1:8123/market-navigator-turn05-pre-ship.html',{waitUntil:'networkidle'});
              await p.waitForSelector('#nowChart'); await p.waitForTimeout(500); if(errors.length) throw Error(errors.join('\n'));
              if((await p.locator('#hzs .hz').allTextContents()).join('|')!=='1D|5D|MTD|YTD|1YR|3YR|5YR') throw Error('NOW horizons');
              if(await p.locator('#legend .lg').count()!==3) throw Error('V1 legends');
              if((await p.locator('#legend .lg').allTextContents()).join('|')!=='RSK|GRW|MAC') throw Error('redundant V1 legend text');
              if(vp.width<500){let h=await p.locator('.chartHead').first().evaluate(e=>e.getBoundingClientRect().height);if(h>46)throw Error('chart header wrapped');let r=await p.locator('#range').evaluate(e=>getComputedStyle(e).display);if(r!=='none')throw Error('phone date range must not compete with legend');}
              let box=await p.locator('#nowChart').boundingBox(); await p.mouse.click(box.x+box.width*.62,box.y+box.height*.46); await p.waitForTimeout(80); if(await p.locator('#nowTip').evaluate(e=>getComputedStyle(e).display)==='none')throw Error('V1 inspection failed');
              await p.locator('#legend .lg').first().click(); await p.waitForTimeout(350); if(!(await p.locator('#crumb').textContent()).includes('RSK'))throw Error('V2 replace');
              if(await p.locator('#legend .lg').count()<8)throw Error('Risk V2 governed series incomplete');
              if(vp.width<500){let h=await p.locator('.chartHead').first().evaluate(e=>e.getBoundingClientRect().height);if(h>46)throw Error('V2 legend wrapped');}
              box=await p.locator('#nowChart').boundingBox(); await p.mouse.click(box.x+box.width*.45,box.y+box.height*.52); await p.waitForTimeout(80); if(await p.locator('#nowTip').evaluate(e=>getComputedStyle(e).display)==='none')throw Error('V2 inspection failed');
              const component=p.locator('#legend .lg').nth(1); await component.click(); await p.waitForSelector('#moreInfo'); await p.locator('#moreInfo').click(); await p.waitForTimeout(250);
              if((await p.locator('#analysisHz .hz').allTextContents()).join('|')!=='1D|5D|MTD|YTD|1YR|3YR|5YR')throw Error('V3 horizons missing');
              if(!(await p.locator('#axisBadge').textContent()).includes('Native Y1'))throw Error('single-series native Y1');
              box=await p.locator('#analysisChart').boundingBox(); await p.mouse.click(box.x+box.width*.55,box.y+box.height*.48); await p.waitForTimeout(80); if(await p.locator('#analysisTip').evaluate(e=>getComputedStyle(e).display)==='none')throw Error('V3 inspection failed');
              await p.locator('#closeAnalysis').click(); await p.locator('[data-view="explore"]').click(); await p.locator('#exploreSearch').fill('CPI'); let row=p.locator('#exploreList .row').first(); await row.click(); await p.waitForTimeout(200);
              await clickSeries(p,'WTI'); if(!(await p.locator('#axisBadge').textContent()).includes('Y1 + Y2'))throw Error('CPI+WTI dual axis');
              await clickSeries(p,'VIX'); if(!(await p.locator('#axisBadge').textContent()).includes('Indexed 100'))throw Error('3 incompatible must index');
              let overflow=await p.evaluate(()=>document.documentElement.scrollHeight>document.documentElement.clientHeight||document.body.scrollHeight>document.body.clientHeight); if(overflow)throw Error('page scroll');
              if(errors.length)throw Error(errors.join('\n')); await p.close();
            }
            await b.close(); console.log('TURN05 PASS');
          })().catch(e=>{console.error(e);process.exit(1)})
          JS
          node qa.js
