name: Market Navigator published corpus guard
on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify every audited asset reached Pages
        run: python3 market-navigator-corpus-pages.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-navigator-published-corpus-${{ github.event.workflow_run.id }}
          path: market-navigator-corpus-pages-report.json
          if-no-files-found: warn
      - name: Repair a failed deployment once
        if: failure() && github.event.workflow_run.run_attempt == 1
        env:
          GH_TOKEN: ${{ github.token }}
          MN_DEPLOY_RUN: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$MN_DEPLOY_RUN"
