name: Market Navigator Turn 37 Stage 2 Shadow
on:
  push:
    paths:
      - 'market-navigator-turn37-stage2-shadow.html'
      - 'market-navigator-turn37-stage2-gate.mjs'
      - 'market-navigator-turn37-stage2-qa.mjs'
      - '.github/workflows/market-navigator-turn37-stage2.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify accepted baseline
        run: test "$(git hash-object market-navigator-turn28-post-ship.html)" = "9ce7f67451f9e1b7804927ce5c56adb667614724"
      - name: Source isolation gate
        run: node market-navigator-turn37-stage2-gate.mjs
      - name: JavaScript syntax
        run: |
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),s=fs.readFileSync('market-navigator-turn37-stage2-shadow.html','utf8');
          for(const [i,m] of [...s.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)].entries())if(!/\bsrc\s*=/.test(m[1])&&m[2].trim())new vm.Script(m[2],{filename:'stage2-'+i+'.js'});
          console.log('PASS JS syntax');
          JS
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Differential qualification
        run: |
          python3 -m http.server 8123 >/tmp/mn37-stage2-http.log 2>&1 &
          SERVER=$!; trap 'kill $SERVER || true' EXIT; sleep 2
          node market-navigator-turn37-stage2-qa.mjs
