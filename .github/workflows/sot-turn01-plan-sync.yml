name: SOT TURN01 plan sync
on:
  push:
    paths:
      - '.github/workflows/sot-turn01-plan-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update canonical SOT plan for TURN01
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()
          s=s.replace('**Status:** **SOT 7.0 CORPUS-CENTRIC REDESIGN / IMPLEMENTATION DEFERRED PENDING CONTRACT**', '**Status:** **TURN01 PRE-BASE SEQUENCING / OWNER-APPROVED MINIMUM CORPUS MODEL**')
          anchor='## 0.3 Established plumbing — keep'
          block=r'''## 0.2H Minimum evidence model + TURN01 pre-base ruling — 2026-08-21

### Design reference point — minimum corpus evidence

The owner explicitly rejects device-centric identity and speculative edge-case modeling as prerequisites for progress. A **source is a source is a source**: the core contract is path + file evidence. `G:/`, `X:/`, `/mnt/q`, Android `DCIM`, and future source adapters are locators used to obtain observations; device identity is not required for the first useful corpus model.

For every observed file, retain the raw components:

- normalized path;
- filename;
- size;
- modified date/time;
- authoritative file fingerprint/content hash;
- observation timestamp.

Derive and retain:

1. **Path hash** = deterministic hash of normalized path.
2. **File fingerprint** = authoritative content identity.
3. **Observation hash** = deterministic hash of normalized path + file fingerprint + modified date/time + size.

The component fields remain inspectable. Composite hashes are accelerators/evidence, not replacements for raw evidence. This permits both deterministic conclusions and later fuzzy/candidate logic without inventing more identity machinery before corpus data proves it necessary.

Immediate deterministic interpretations include:

- same fingerprint, different path = same content observed in multiple locations;
- same path, different fingerprint = content changed/replaced at that path;
- same observation hash = effectively unchanged observation;
- fingerprint already verified in Target = no additional Target copy required;
- fingerprint absent from Target = new Target content candidate.

Do not add device/volume identity, Android companion application design, SD-card lifecycle handling, or similar complexity unless observed false positives/false negatives demonstrate a need. Collect the minimum, measure failure modes, then refine.

### Value gate — ingestion must produce intelligence

TURN01 is not successful merely because paths can be enumerated or fingerprints written. As observations enter the centralized SOT database, the application must continuously derive useful corpus intelligence, including at minimum:

- total files/bytes observed;
- unique content fingerprints;
- exact duplicate observations and duplicate bytes;
- new versus previously known content;
- path/content changes since prior observation;
- content already established in Target;
- content missing from Target and bytes actually requiring transfer;
- Target content with and without verified Backup coverage;
- recoverable/redundant source capacity estimate;
- project overlap and project-exclusive remainder where enough evidence exists.

The acceptance principle is: **every observation should immediately increase what the corpus can know.**

### Initial release artifact

The first new owner-testable artifact is:

`sot-turn01-pre-base.html`

This is a **pre-base**, not an accepted production baseline. It must deliberately reuse working 6.8/6.9 plumbing where valid, while replacing the clunky feature-centric workflow with a coherent corpus-centric operational surface. It may not silently change the existing one-server/port-18080/Tailscale topology.

### TURN01 implementation sequence

The build sequence is intentionally ordered so each layer creates usable evidence for the next; do not ship isolated plumbing as a nominal milestone.

#### TURN01-1 — Streamlined Project CRUD + scope

Redefine Project as a virtual editable container of paths only.

Required Project CRUD fields/behavior:

- project name;
- project note;
- sources/paths;
- source-specific note;
- one project omnibox for create/search/recall;
- inline editing with save on Enter or blur;
- add/remove source membership without deleting corpus observations/fingerprints;
- no project dropdown selector;
- no permanently embedded file explorer beside project metadata.

Path/source selection should reuse the working WSL mount/browse plumbing. The picker is invoked only when adding/changing scope and then dismissed.

#### TURN01-2 — Expand/collapse Project → Source → SOT data

The Project workspace must communicate scope and evidence hierarchically without navigating through unrelated pages:

- Project row/card expands to Sources;
- Source expands to current SOT evidence/intelligence;
- Source evidence includes files, bytes, freshness, fingerprint coverage, duplicate/unique bytes, Target coverage, Backup coverage, last observation, and source-specific note;
- dense file detail remains available as a drilldown, not the default project-editing surface.

Expand/collapse state is UI preference only; corpus state remains centralized.

#### TURN01-3 — Global scheduler / simultaneous projects

Reuse and harden the existing global multi-project worker model so multiple projects can process simultaneously without multiplying workers per project.

Required behavior:

- one global queue;
- fair project interleaving;
- configurable global worker ceiling;
- no UI blocking;
- live worker state with current project/source/path/file;
- discovered files/bytes, fingerprinted/reused files/bytes, throughput, queue/wait state, errors, and ETA where meaningful;
- source reads and hashing are independently observable so the operator is never left with an opaque `Reading...` state.

TURN01 does not require speculative device-aware identity. Scheduling can be tuned from observed throughput after real corpus runs.

#### TURN01-4 — Central SOT database

Use `oc-ref` WSL SOT data storage as the live corpus authority. GitHub remains software/governance authority.

TURN01 corpus persistence must support at minimum:

- projects;
- project-source membership + source-specific note;
- raw file observations;
- path hash;
- file fingerprint/content hash;
- observation hash;
- observation history/current state;
- Target holdings;
- Backup holdings;
- execution/transfer records;
- source disposition records.

Existing valid 6.9.x fingerprints/observations should be migrated/reused rather than discarded where deterministic mapping is possible.

#### TURN01-5 — Real-time SOT DB intelligence

As observations/fingerprints are persisted, incrementally recompute visible findings rather than waiting for a separate reporting phase.

At minimum expose in real time:

- unique content;
- exact duplicates/copy count;
- duplicate bytes;
- changed/replaced path observations;
- known vs new content;
- Target coverage;
- Backup coverage;
- new Target bytes required;
- potentially recoverable source bytes;
- project overlap/exclusive remainder when computable.

Every finding must be drillable to the underlying deterministic observations/fingerprints.

#### TURN01-6 — Ad hoc SOT intelligence

Provide one Corpus omnibox/query surface independent of projects.

Initial deterministic queries must support combinations of:

- path / filename;
- fingerprint;
- size/date ranges;
- project membership;
- duplicate/copy count;
- Target present/missing;
- Backup verified/missing;
- changed/current state;
- source disposition.

Natural-language assistance is optional later; TURN01 requires inspectable deterministic results first.

#### TURN01-7 — Real-time dynamic execution plan

The execution plan is a live derived view of current corpus state, not a manually assembled checklist.

For each authoritative content fingerprint in project scope, classify dynamically:

- already verified in Target → no-op;
- absent from Target → transfer candidate;
- Target present but Backup missing → backup candidate;
- conflicting intended destination/state → unresolved;
- changed since prior plan/observation → stale/re-evaluate.

Show continuously updated totals for no-op files/bytes, transfer files/bytes, backup files/bytes, unresolved items, and resulting source capacity potentially certifiable after completion.

A scope or corpus change invalidates/recalculates affected plan items automatically.

#### TURN01-8 — Record Target transfer, Backup, and source disposition

TURN01 must be able to record the lifecycle even if physical copy automation is introduced incrementally.

For each transfer/holding/disposition record retain at minimum:

- content fingerprint;
- source path/observation;
- Target path/location;
- transfer time/date;
- Target verification state/time;
- Backup path/library location;
- Backup time/date;
- Backup verification state/time;
- source disposition status;
- disposition location/library location when cold stored/archived;
- disposition time/date;
- operator note where needed.

Source disposition states should distinguish at minimum:

`active` → `safe_to_retire` → `archived/cold_stored` or `disposed_external`

SOT execution itself does not delete source. The corpus records evidence that Target and Backup exist and then records what the operator did with the source.

### TURN01 owner gate

`sot-turn01-pre-base.html` is ready for owner testing only when one coherent run can demonstrate all of the following against real source paths:

1. create/recall/edit a project and source notes;
2. add multiple paths using existing browse plumbing;
3. run at least two projects concurrently while the UI remains responsive and visibly reports current work;
4. persist file observations/fingerprints into the centralized SOT database;
5. show real-time duplicate/unique/Target/Backup intelligence derived from those observations;
6. answer ad hoc corpus queries without requiring a project;
7. continuously derive an execution plan that suppresses content already verified in Target;
8. record source→Target transfer evidence, Target→Backup evidence, and final source disposition with location/time/date;
9. drill every recommendation/plan item back to deterministic raw evidence.

If these cannot be demonstrated end-to-end, TURN01 is incomplete even if individual components function.

'''
          if '## 0.2H Minimum evidence model + TURN01 pre-base ruling — 2026-08-21' not in s:
              s=s.replace(anchor, block+anchor, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-backlog.md
          git commit -m 'Lock TURN01 minimum corpus model and implementation sequence'
          git push
# retrigger plan sync
