name: Market Navigator ETL candidate checks
on:
  pull_request:
    paths:
      - 'market-navigator-etl-schedule.py'
      - 'market-navigator-r7-data-pipeline.py'
      - 'test_market_navigator_etl_schedule.py'
      - 'test_market_navigator_etl_integration.py'
      - 'market-navigator-etl-review.html'
      - '.github/workflows/market-evidence-pipeline.yml'
      - '.github/workflows/market-navigator-etl-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile candidate ETL
        run: python -m py_compile market-navigator-etl-schedule.py market-navigator-r7-data-pipeline.py test_market_navigator_etl_schedule.py test_market_navigator_etl_integration.py
      - name: Run scheduling regressions
        run: python test_market_navigator_etl_schedule.py
      - name: Run isolated collector integration
        run: python test_market_navigator_etl_integration.py
      - name: Verify integrated review controls
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('market-navigator-etl-review.html').read_text()
          workflow=Path('.github/workflows/market-evidence-pipeline.yml').read_text()
          for marker in ('const MNChart=', 'mnEtlConsole','mnEtlRows','market-evidence/run-log.json'):
              assert marker in html, marker
          for marker in ('MARKET_NAVIGATOR_RETRY_COMPONENT','MARKET_NAVIGATOR_RETRY_STREAM','market-navigator-etl-schedule.py'):
              assert marker in workflow, marker
          print('PASS review markup and workflow dispatch contract')
          PY
