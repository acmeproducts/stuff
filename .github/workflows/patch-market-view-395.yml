name: Patch Market Navigator 3.9.5
on:
  push:
    paths:
      - '.github/workflows/patch-market-view-395.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 scripts/patch_market_view_395.py
      - name: Validate
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          s=open('market-view.html').read()
          assert '<title>Market Navigator 3.9.5</title>' in s
          assert "const VERSION='3.9.5'" in s
          assert 'function renderNow391Legacy()' in s
          assert 'function openDetail391Legacy' in s
          assert 'const drawCategory391Legacy=drawCategory;' in s
          assert 'MARKET DATA' in s  # legacy body may remain, but cannot own renderNow
          assert 'class=\"now393\"' in s
          assert 'data-regime393' in s
          assert 'data-category393' in s
          assert 'microGrid393' in s
          assert 'Add to Library' in s
          assert 'setTimeout(()=>repairRegimeHistory(true),500);' not in s
          js=re.search(r'<script>([\s\S]*?)</script>',s).group(1)
          open('/tmp/market-view.js','w').write(js)
          PY
          node --check /tmp/market-view.js
      - name: Commit
        run: |
          git config user.name 'Market Navigator Patch Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add market-view.html
          git commit -m 'Restore Market Navigator 3.9.3 Now drilldown UI'
          git pull --rebase origin main
          git push origin HEAD:main
