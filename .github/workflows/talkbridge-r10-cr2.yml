name: TalkBridge R10-CR2 candidate gates

on:
  pull_request:
    paths:
      - 'bridge-turn24-post-ship.html'
      - 'tb-sw.js'
      - 'talkbridge/worker-talk.js'
      - 'talkbridge/parts/r10-cr2-*.js'
      - 'talkbridge/build/*r10-cr2*.mjs'
      - 'package.json'
      - '.github/workflows/talkbridge-r10-cr2.yml'
  push:
    branches: [main]
    paths:
      - 'bridge-turn24-post-ship.html'
      - 'tb-sw.js'
      - 'talkbridge/worker-talk.js'
      - 'talkbridge/parts/r10-cr2-*.js'
      - 'talkbridge/build/*r10-cr2*.mjs'
      - 'package.json'
      - '.github/workflows/talkbridge-r10-cr2.yml'
  workflow_dispatch:
    inputs:
      diag_session:
        description: 'Real room id: read its relay record (read-only) and file it as evidence — no deploy'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install gate dependencies (clean)
        run: npm ci --no-audit --no-fund
      - name: Frozen inputs proven, outputs are the assembled bytes
        run: npm run gate:cr2:assembled
      - name: Governance gate
        env:
          TALKBRIDGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node talkbridge/build/governance-gate.mjs --base "$TALKBRIDGE_BASE_SHA"
      - name: Relay scenarios (real words, Durable Object shim)
        run: npm run gate:cr2:relay
      - name: Worker scenarios (two window clients, announcement, taps)
        run: npm run gate:cr2:worker
      - name: App scenarios (real DOM, real relay, real lifecycle)
        run: npm run gate:cr2:app
      - name: Mutation gate (every planted defect must go red)
        run: npm run gate:cr2:mutations
      - name: Output wall (only the declared files changed)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node -e "
          const {execFileSync}=require('child_process');const fs=require('fs');
          const st=JSON.parse(fs.readFileSync('talkbridge/governance/r10-cycle.json','utf8'));
          const allowed=new Set([...st.candidate.allowed_output_files,'talkbridge/governance/r10-cycle.json','talkbridge/build/governance-gate.mjs','talkbridge/build/governance-gate.test.mjs','package-lock.json']);
          const base=process.env.BASE; if(!base||/^0+$/.test(base)){console.log('no base');process.exit(0)}
          const changed=execFileSync('git',['diff','--name-only',base+'...HEAD'],{encoding:'utf8'}).split('\n').filter(Boolean).filter(f=>f.startsWith('talkbridge/')||f==='bridge-turn24-post-ship.html'||f==='tb-sw.js'||f==='package.json');
          const bad=changed.filter(f=>!allowed.has(f)); if(bad.length){console.error('outside the scope wall: '+bad.join(', '));process.exit(1)} console.log('changed within the wall: '+changed.join(', '))"

  diag:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diag_session != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the room's relay record (read-only; the same authority the app reads)
        run: |
          mkdir -p talkbridge/governance/evidence
          out="talkbridge/governance/evidence/relay-diag-${{ github.event.inputs.diag_session }}-$(date -u +%Y%m%dT%H%M%SZ).json"
          curl -fsS -m 20 -X POST "https://talk-signal.myacctfortracking.workers.dev/signal?app=talk-say-v1&session=${{ github.event.inputs.diag_session }}&client=ci-diag" -H 'Content-Type: application/json' -d '{"type":"diag"}' > "$out"
          node -e "const d=JSON.parse(require('fs').readFileSync('$out','utf8'));console.log('relay v'+d.v+' events='+(d.events||[]).length)"
          git config user.name diag-bot; git config user.email diag-bot@local
          git add "$out"; git commit -m "evidence: relay diag ${{ github.event.inputs.diag_session }} [skip ci]"
          git pull --rebase origin main; git push
