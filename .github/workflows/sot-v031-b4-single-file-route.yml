name: Rebuild SOT v0.3.1 .4 single-file UI route

on:
  push:
    paths:
      - '.github/workflows/sot-v031-b4-single-file-route.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from exact .3 baseline and reapply approved .4 UX
        shell: bash
        run: |
          set -euo pipefail
          BASE='037a0198800f45e616596fc27efb562db5289fa6'

          # Capture only the current reviewed UI delta, then restore exact .3 bytes.
          git diff "$BASE" HEAD -- project.html > /tmp/approved-ui.delta || true
          git show "$BASE":project.html > project.html
          patch --silent -p1 < /tmp/approved-ui.delta

          python3 - <<'PY'
          from pathlib import Path
          p=Path('project.html')
          s=p.read_text()
          s=s.replace('Build: 2026.08.10.4.2','Build: 2026.08.10.4.3')
          s=s.replace("BUILD_ID='2026.08.10.4.2'","BUILD_ID='2026.08.10.4.3'")

          # Public browser requests MUST remain under /report so Tailscale sends
          # them to the existing 18080 report/application server. Absolute /api/*
          # goes to the OpenClaw gateway on the root route and is therefore wrong.
          s=s.replace("const FS_API='/api/sot/fs',PROJECT_API='/api/sot/projects',REPORT_API='/api/sot/reports';",
                      "const FS_API='/report/api/sot/fs',PROJECT_API='/report/api/sot/projects',REPORT_API='/report/api/sot/reports';")

          p.write_text(s)
          PY

      - name: Update governance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('project-backlog.md')
          s=p.read_text()

          s=s.replace('**Canonical UI:** `project.html`  \n**Canonical backend:** existing production `session-server.js` on port 18080 + versioned `sot-api.js` module',
                      '**Canonical application artifact:** `project.html` — one self-contained HTML file with inline CSS/JS  \n**Existing infrastructure:** production `session-server.js` on port 18080 provides stable SOT APIs; backend support is infrastructure, not an additional application artifact')

          anchor='- `project-backlog.md` is the one current SOT governance document: release plan + backlog + graveyard.\n'
          rules='''- **The deployable SOT application is exactly one self-contained file: `project.html`. No external application JS/CSS/module files may be required by the browser.**\n- **SOT releases deploy `project.html` only. Existing server-side API capability on the production 18080 report server is infrastructure and is not recreated per UI release.**\n- **Browser SOT API URLs must stay under the public `/report` mount (`/report/api/sot/*`). Absolute `/api/sot/*` bypasses the report route and hits the OpenClaw root/gateway path.**\n'''
          if rules.splitlines()[0] not in s:
              s=s.replace(anchor,anchor+rules)

          evidence='''\n## 1.8 Owner gate — build 2026.08.10.4.2 FAILED\n\nThe backend itself was proven healthy locally on `127.0.0.1:18080/api/sot/health`, but the browser returned 404 for `/api/sot/projects/health` and `/api/sot/fs`. Root cause: the UI used absolute `/api/sot/*` URLs, which bypass the Tailscale `/report` mount and therefore do not reach the 18080 report/application server.\n\nBuild .4.3 is rebuilt from the exact .3 baseline and reimplements the approved .4 UX with browser API URLs under `/report/api/sot/*`. No server, port, proxy, or backend change is required for this correction.\n\n'''
          if '## 1.8 Owner gate — build 2026.08.10.4.2 FAILED' not in s:
              s=s.replace('# 2. RELEASE CHAIN',evidence+'# 2. RELEASE CHAIN')

          s=s.replace('architecture-correct rebuild 2026.08.10.4.2 from .3 is the active candidate',
                      'single-file route-correct rebuild 2026.08.10.4.3 from .3 is the active candidate')

          grave='''\n## G-015 — Browser calls to absolute `/api/sot/*`\n\n**Date buried:** 2026-08-10  \n**Status:** VETOED  \n**Approach:** have `project.html` call `/api/sot/*` directly from the public site.  \n**Why buried:** Tailscale routes `/report` to the production 18080 report server; absolute `/api/*` bypasses that mount and lands on the root/OpenClaw route, producing 404.  \n**Replacement:** the single-file UI calls `/report/api/sot/*`; the existing `/report` proxy delivers those calls to the established 18080 server.\n\n'''
          if '## G-015 — Browser calls to absolute `/api/sot/*`' not in s:
              s=s.replace('# 8. DONE / CURRENT IMPLEMENTATION LEDGER',grave+'# 8. DONE / CURRENT IMPLEMENTATION LEDGER')

          p.write_text(s)
          PY

      - name: Gate single-file release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('project.html').read_text()
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/project.js').write_text(m.group(1))
          assert '<link ' not in s.lower()
          assert 'src="' not in s.lower().replace('data-src="','')
          PY
          node --check /tmp/project.js
          grep -q 'Build: 2026.08.10.4.3' project.html
          grep -q "FS_API='/report/api/sot/fs'" project.html
          grep -q "PROJECT_API='/report/api/sot/projects'" project.html
          grep -q 'Added to project' project.html
          grep -q 'Save selections' project.html
          grep -q 'Review project' project.html
          grep -q 'target:null' project.html
          ! grep -q "FS_API='/api/sot/fs'" project.html
          ! grep -qiE '8081|uvicorn|fastapi|file_browser' project.html

      - name: Publish and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-b4-single-file-route.yml
          git add project.html project-backlog.md
          git commit -m 'Rebuild SOT .4 single-file UI on report route'
          git pull --rebase origin main
          git push origin HEAD:main
