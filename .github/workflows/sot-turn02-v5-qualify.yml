name: SOT Turn02 v5 qualify
on:
  push:
    branches: [sot-turn02-v5-build]
    paths:
      - 'SOT/sot-turn02-v5-engine.py'
      - 'SOT/qualify-turn02-v5.py'
      - '.github/workflows/sot-turn02-v5-qualify.yml'
  workflow_dispatch:
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile SOT/sot-turn02-v5-engine.py SOT/qualify-turn02-v5.py
      - name: Controlled estate qualification
        run: python SOT/qualify-turn02-v5.py
