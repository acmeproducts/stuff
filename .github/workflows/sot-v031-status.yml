name: Record SOT v0.3.1 candidate status

on:
  push:
    paths:
      - '.github/workflows/sot-v031-status.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update governance status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('project-backlog.md')
          s = p.read_text()
          old = '**Status:** LOCKED — next release.  '
          new = '**Status:** CANDIDATE BUILT — automated candidate gates PASS; repo readback verified; owner/device gate NOT YET RUN.  '
          if old not in s:
              raise SystemExit('expected v0.3.1 status marker not found')
          s = s.replace(old, new, 1)
          needle = '**Output:** same canonical filenames, versioned internally; no `project-v2.html` proliferation.  '
          insert = needle + '\n**Candidate commit:** `17e00575ca8a56c8b69a4c7702fa4d369a0fda1f`  \n**Candidate UI blob:** `9ed479e011e9b5275d1d6adb73d624fad7c09718`  \n**Candidate helper blob:** `799345919451c2674d0a66215a7480fb1a441845`  \n**Candidate automated gate:** PASS — `test_sot_v031.py` plus build checksum/compile checks.  \n**Owner/device gate:** NOT YET RUN.  '
          if needle not in s:
              raise SystemExit('expected output marker not found')
          s = s.replace(needle, insert, 1)
          p.write_text(s)
          PY
          git config user.name 'SOT release builder'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/sot-v031-status.yml
          git add project-backlog.md
          git commit -m 'Record SOT v0.3.1 candidate status'
          git pull --rebase origin main
          git push origin HEAD:main
