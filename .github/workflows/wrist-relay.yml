name: Deploy wrist relay
# Deploys x/wrist/relay (the worker that carries wrist motions from the watch to X and
# serves the X practice page), checks it end to end, and writes the result to
# x/wrist/out/RELAY-LOG.md on the same branch so it can be read from the repo.
on:
  push:
    branches: [main, 'wrist-**']
    paths:
      - 'x/wrist/relay/**'
      - '.github/workflows/wrist-relay.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wrist-relay
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy and check
        id: run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BASE="https://wrist-relay.myacctfortracking.workers.dev"
          cd x/wrist/relay
          set +e
          echo "== deploy ==" > /tmp/relay.txt
          npx -y wrangler@4 deploy >> /tmp/relay.txt 2>&1
          d=$?
          echo "deploy exit $d" >> /tmp/relay.txt
          e=1
          if [ "$d" = "0" ]; then
            echo "== waiting for $BASE ==" >> /tmp/relay.txt
            # wait until the version just deployed is the one answering (a fresh deploy is served by the old version for a few seconds)
            WANT="$(sed -n "s/^const V = '\(.*\)';$/\1/p" worker.js)"
            for i in $(seq 1 24); do
              GOT="$(curl -fsS -m 10 "$BASE/health" 2>/dev/null || true)"
              echo "$GOT" >> /tmp/relay.txt
              case "$GOT" in *"\"v\":\"$WANT\""*) sleep 5; break;; esac
              sleep 5
            done
            echo "== end-to-end ==" >> /tmp/relay.txt
            npm i ws@8 --no-save --package-lock=false > /dev/null 2>&1
            node e2e.mjs "$BASE" >> /tmp/relay.txt 2>&1
            e=$?
          fi
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p x/wrist/out
          # never write credentials into the repository
          sed -e "s/${CLOUDFLARE_ACCOUNT_ID:-NO_ACCOUNT_ID}/[account]/g" -e "s/${CLOUDFLARE_API_TOKEN:-NO_API_TOKEN}/[token]/g" /tmp/relay.txt > /tmp/relay-safe.txt
          cat /tmp/relay-safe.txt
          {
            echo "# Wrist relay deploy log"
            echo ""
            echo "Run ${{ github.run_number }}, commit ${GITHUB_SHA}, $(date -u +%FT%TZ), deploy exit $d, end-to-end exit $e"
            echo ""
            echo '```'
            tail -c 40000 /tmp/relay-safe.txt
            echo '```'
          } > x/wrist/out/RELAY-LOG.md
          echo "ok=$([ "$d" = "0" ] && [ "$e" = "0" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Publish the result to the branch
        if: always()
        run: |
          git config user.name acmeproducts
          git config user.email 182510673+acmeproducts@users.noreply.github.com
          git add x/wrist/out/RELAY-LOG.md
          if ! git diff --staged --quiet; then
            git commit -q -m "wrist relay deploy ${{ github.run_number }} [skip ci]"
            for i in 1 2 3 4; do
              git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
              git push -q origin "HEAD:${GITHUB_REF_NAME}" && break
              sleep 5
            done
          fi
      - name: Fail if deploy or check failed
        run: test "${{ steps.run.outputs.ok }}" = "yes"
