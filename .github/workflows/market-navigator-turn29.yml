name: Market Navigator Turn 29 Dashboard V2
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn29-dashboard.py'
      - 'market-evidence/persistent-indices-v1.json'
      - 'market-evidence/derived-indices-persistent-v1.json'
      - 'data/market-backend/component-registry-v1.json'
      - '.github/workflows/market-navigator-turn29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build dashboard
        run: python3 market-navigator-build-turn29-dashboard.py
      - name: Qualify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('market-navigator-turn29-pre-ship.html').read_text();e=json.loads(Path('market-evidence/current-state-v1.json').read_text())
          for x in ['data-view="dashboard">DASHBOARD','data-view="now">CHART','id="view-dashboard"','dash29More','Download data · JSON','Download data · CSV','dash29Explain','dash29Chart']: assert x in s,x
          assert e['schema']=='mn-dashboard-rollup-v2' and e['forecast'] is False
          assert set(e['horizons'])=={'1D','5D','MTD','YTD','1YR','3YR','5YR'}
          for h,z in e['horizons'].items():
            assert set(z['indices'])=={'risk','growth','macro'}
            expected=sum(z['indices'][k]['score'] for k in z['indices'])/3
            assert abs(z['environment']['score']-expected)<0.001
            for k,q in z['indices'].items():
              assert len(q['components'])==7
              expected=sum(c['score'] for c in q['components'])/7
              assert abs(q['score']-expected)<0.001
              assert all(1<=c['score']<=5 and 0<=c['pct']<=100 for c in q['components'])
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S);Path('/tmp/mn29.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/mn29.js
      - name: Commit candidate and evidence
        run: |
          git add market-navigator-turn29-pre-ship.html market-evidence/current-state-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'build: qualify Turn 29 dashboard v2'
          git pull --rebase origin main
          git push origin HEAD:main
