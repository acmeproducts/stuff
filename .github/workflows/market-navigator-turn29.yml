name: Market Navigator Turn 29 Analysis + Health
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn29.py'
      - 'market-evidence/derived-indices-persistent-v1.json'
      - '.github/workflows/market-navigator-turn29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build Analysis and Health candidate
        run: python3 market-navigator-build-turn29.py
      - name: Correct authoritative plan scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MARKET-NAVIGATOR-MASTER-PLAN.md');s=p.read_text();head='## 46. Turn 29 — NOW Current descriptive dashboard'
          if head in s:
            before=s.split(head,1)[0].rstrip()
            s=before+'''\n\n## 46. Turn 29 — Current-state Analysis + Health; dashboard deferred\n\nOwner correction 2026-09-30. The earlier Turn 29 candidate placed Current/Trend state in the existing drill-down strip without approval. That placement is rejected and must not be promoted.\n\n- Current-state classification is retained only as governed **Analysis evidence** and **Health/Glossary methodology evidence**.\n- No Current/Trend arrow, color, label, badge, or state is added to the existing drill-down strip.\n- The future dashboard entry point remains **undefined and unimplemented** until Part B (Trend research disposition) is complete and the owner explicitly approves dashboard layout/placement.\n- Predictive `MN-TREND-1.0.0` failed production qualification and remains research-only. It must not appear in NOW, drill-down, narrative as validated forecast, Library, Print, Download, or production Health as a validated model.\n- The failed Trend V1 scheduled publisher is disabled; V1 can only be reproduced manually as research evidence.\n- Turn 29 candidate is rebuilt directly from the qualified Turn 28 Ship baseline and may alter only Analysis evidence context and Health Glossary content for descriptive Current state.\n- Candidate: `market-navigator-turn29-pre-ship.html`; evidence: `market-evidence/current-state-v1.json`; builder: `market-navigator-build-turn29.py`.\n- Release gates: exact Turn 28 Ship ancestry; deterministic rebuild; syntax; `forecast=false`; `uiPlacement=ANALYSIS_HEALTH_ONLY`; no drill-down-strip state CSS/rendering; all three governed indices present; owner qualification before baseline promotion.\n'''
            p.write_text(s+'\n')
          PY
      - name: Static qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('market-navigator-turn29-pre-ship.html');assert p.exists() and p.stat().st_size>200000
          s=p.read_text()
          for x in ['turn29BuildMarker','MN_CURRENT_STATE_29','Current state','forecast:false','ANALYSIS_HEALTH_ONLY']:assert x in s,x
          assert 'TURN29_NOW_CURRENT_STATE' not in s
          assert '#legend [data-id="growth"]::after' not in s
          e=json.loads(Path('market-evidence/current-state-v1.json').read_text())
          assert e['forecast'] is False and e['uiPlacement']=='ANALYSIS_HEALTH_ONLY'
          assert set(e['indices'])=={'growth','risk','macro'}
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S);Path('/tmp/mn-inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          plan=Path('MARKET-NAVIGATOR-MASTER-PLAN.md').read_text();assert 'dashboard deferred' in plan and 'No Current/Trend arrow' in plan
          PY
          node --check /tmp/mn-inline.js
      - name: Commit corrected candidate, evidence and plan
        run: |
          git add market-navigator-turn29-pre-ship.html market-evidence/current-state-v1.json MARKET-NAVIGATOR-MASTER-PLAN.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'build: qualify Turn 29 Analysis and Health only'
          git pull --rebase origin main
          git push origin HEAD:main
