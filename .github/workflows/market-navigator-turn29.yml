name: Market Navigator Turn 29 State Matrix
on:
  push:
    branches: [main]
    paths:
      - 'market-navigator-build-turn29.py'
      - 'market-evidence/persistent-indices-v1.json'
      - 'market-evidence/derived-indices-persistent-v1.json'
      - 'data/market-backend/component-registry-v1.json'
      - '.github/workflows/market-navigator-turn29.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build approved state matrix
        run: python3 market-navigator-build-turn29.py
      - name: Update authoritative plan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MARKET-NAVIGATOR-MASTER-PLAN.md');s=p.read_text();head='## 46. Turn 29 — Current-state Analysis + Health; dashboard deferred'
          before=s.split(head,1)[0].rstrip() if head in s else s.rstrip()
          section='''## 46. Turn 29 — Current-state matrix dashboard + Analysis + Health\n\nOwner approved 2026-09-30 after Part B closure. The rejected drill-down-strip placement remains prohibited.\n\n### 46.1 Part B — Trend research disposition COMPLETE\n\nPredictive `MN-TREND-1.0.0` failed production qualification. V2 diagnostic evidence did not clear the burden for a governed 10–30-day investor-facing prediction. **No predictive Trend is approved.** The failed V1 scheduled publisher remains disabled.\n\n### 46.2 Approved dashboard hierarchy\n\nAt the ENV/NOW entry point, add one compact live-linked state matrix above the existing chart. It contains:\n\n1. the existing horizon choices `1D · 5D · MTD · YTD · 1YR · 3YR · 5YR`;\n2. one `ENVIRONMENT` synthesis row;\n3. three columns in owner-specified order: `RISK · GROWTH · MACRO`;\n4. exactly five favorability circles for each RSK/GRW/MAC index;\n5. exactly seven governed component rows beneath each index, each with exactly five favorability circles;\n6. a descriptive arrow beside Environment, each index and each component;\n7. every Environment/index/component label is a live link into the corresponding existing NOW state.\n\nThe matrix is an entry/dashboard surface. It must not add indicators to the existing drill-down strip.\n\n### 46.3 Visual semantics\n\nThe five-circle scale is always **market favorability**, regardless of a source's native direction:\n\n- levels 1–2: red / unfavorable;\n- level 3: yellow / neutral or mixed;\n- levels 4–5: green / favorable.\n\nA component/index level is its current selected-horizon governed movement ranked against historical movements of the same span, after applying the index's favorability orientation. This preserves one visual grammar across positive-growth and negative-risk/pressure concepts.\n\nArrows are descriptive selected-horizon recent direction only: `↑` favorable, `→` flat/mixed, `↓` unfavorable. They are **not** the rejected predictive Trend and make no 10–30-day forecast.\n\n`ENVIRONMENT` is an equal visual synthesis of RSK/GRW/MAC favorability percentiles on a 10-cell / 10-point scale. It is dashboard orientation only and **must not become a fourth governed derived index** or alter RSK/GRW/MAC mathematics.\n\n### 46.4 Evidence and governance\n\n- Source exclusively from governed `MN-PERSISTENT-1.0.0` index/component evidence.\n- No new component, source, weight, proxy, interpolation, forward fill, or alternate index arithmetic.\n- Current-state methodology is available to Analysis/AI evidence and Health/Glossary; AI may explain but not calculate/override it.\n- Dashboard horizon selection follows the same NOW horizon state and never mutates canonical evidence.\n- Candidate: `market-navigator-turn29-pre-ship.html`; evidence: `market-evidence/current-state-v1.json`; builder: `market-navigator-build-turn29.py`.\n\n### 46.5 Release gates\n\n- exact qualified Turn 28 Ship ancestry;\n- deterministic rebuild and JavaScript syntax PASS;\n- `forecast=false`;\n- seven horizons present;\n- exactly RSK/GRW/MAC, five circles per index, seven component rows per index, five circles per component;\n- Environment explicitly non-index synthesis;\n- no drill-down-strip state pseudo-elements/badges;\n- live-link handlers target existing NOW navigation;\n- Analysis/AI + Health/Glossary methodology evidence present;\n- owner qualification before baseline promotion.\n'''
          p.write_text(before+'\n\n'+section+'\n')
          PY
      - name: Static qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('market-navigator-turn29-pre-ship.html');assert p.exists() and p.stat().st_size>200000;s=p.read_text()
          for x in ['TURN29_STATE_MATRIX','MN_STATE_MATRIX_29','mnStateDash','mnDashOpen29','forecast:false','Environment score']:assert x in s,x
          assert '#legend [data-id="growth"]::after' not in s
          e=json.loads(Path('market-evidence/current-state-v1.json').read_text());assert e['forecast'] is False and e['schema']=='mn-state-matrix-v1'
          assert set(e['horizons'])=={'1D','5D','MTD','YTD','1YR','3YR','5YR'}
          for h,z in e['horizons'].items():
            assert set(z['indices'])=={'risk','growth','macro'}
            assert 1<=z['environment']['score']<=10
            for k,q in z['indices'].items():
              assert 1<=q['score']<=5 and len(q['components'])==7
              assert all(1<=c['score']<=5 for c in q['components'])
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S);Path('/tmp/mn-inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          plan=Path('MARKET-NAVIGATOR-MASTER-PLAN.md').read_text();assert 'Current-state matrix dashboard + Analysis + Health' in plan and 'must not become a fourth governed derived index' in plan
          PY
          node --check /tmp/mn-inline.js
      - name: Commit qualified candidate, evidence and plan
        run: |
          git add market-navigator-turn29-pre-ship.html market-evidence/current-state-v1.json MARKET-NAVIGATOR-MASTER-PLAN.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'build: qualify Turn 29 state matrix dashboard'
          git pull --rebase origin main
          git push origin HEAD:main
