name: Finalize Session Manager v2.3.5

on:
  push:
    branches:
      - agent/session-manager-v235-unified-appearance

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message != 'Session Manager v2.3.5 unify appearance surfaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/session-manager-v235-unified-appearance
          fetch-depth: 0
      - name: Build from exact v2.3.4 and validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object session-manager-v3.html)" = "4974617a3746e8d91cde558a1da5cb64a2c1e26a"
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/session-manager-v235-unified-appearance.yml').read_text()
          start=w.index("          python3 - <<'PY'\n")+len("          python3 - <<'PY'\n")
          end=w.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in w[start:end].splitlines())
          exec(compile(code,'unified-appearance-builder','exec'),{})
          p=Path('session-manager-v3.html')
          s=p.read_text()
          old="const BUILD_VERSION='2.3.4';"
          if s.count(old)!=1: raise SystemExit('BUILD_VERSION 2.3.4 marker missing')
          s=s.replace(old,"const BUILD_VERSION='2.3.5';",1)
          p.write_text(s,newline='')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('session-manager-v3.html').read_text()
          gates=[
            '<span class="version">v2.3.5</span>',
            "const BUILD_VERSION='2.3.5';",
            "const APP_VERSION='2.3.0'",
            "rpc('sessions.create',{label:'New chat'},20000)",
            'function hostingDefaultGateway()',
            'title="Click to rename" role="button" tabindex="0"',
            '.msg.system{align-self:center;background:var(--system-bg);color:var(--system-text)}',
            'achromebg','asystembg',
            '#debugPanel{position:fixed;right:10px;bottom:10px;width:min(760px,calc(100vw - 20px));height:min(400px,55vh);z-index:180;background:var(--p)',
            '.toast{background:var(--p2)'
          ]
          for x in gates:
              if x not in s: raise SystemExit('missing gate: '+x)
          if 'renameBtn' in s: raise SystemExit('pencil rename regression')
          forbidden=['background:#15151c','background:#0d0d12','background:#07070a','background:#24242d','background:#401a1e','background:#12301f','background:#33280f','background:#2b1518','background:#34161a','background:#1c1c25','background:rgba(11,11,15,.92)']
          for x in forbidden:
              if x in s: raise SystemExit('dark-only surface remains: '+x)
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          if len(js)!=1: raise SystemExit('script extraction failed')
          Path('/tmp/session-manager-v235.js').write_text(js[0])
          print('semantic validation PASS')
          PY
          node --check /tmp/session-manager-v235.js
          echo 'JavaScript syntax PASS'
      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'acmeproducts'
          git config user.email '182510693+acmeproducts@users.noreply.github.com'
          git rm .github/workflows/session-manager-v235-finalize.yml .github/workflows/session-manager-v235-unified-appearance.yml
          git add session-manager-v3.html
          git commit -m 'Session Manager v2.3.5 unify appearance surfaces'
          git push origin HEAD:agent/session-manager-v235-unified-appearance
