name: WorldPulse RSS cache collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "worldpulse-rss-collector.py"
      - "onxyview-event-collector.py"
      - ".github/workflows/worldpulse-news-collector.yml"

permissions:
  contents: write

concurrency:
  group: worldpulse-rss-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh per-source and combined news caches
        run: python3 worldpulse-rss-collector.py

      - name: Build OnxyView event cache
        run: python3 onxyview-event-collector.py

      - name: Commit refreshed data caches
        run: |
          if [ -z "$(git status --porcelain -- worldpulse-source-cache.json worldpulse-news-cache.json onxyview-event-cache.json)" ]; then
            echo "No news cache changes to commit."
            exit 0
          fi
          git config user.name "worldpulse-bot"
          git config user.email "worldpulse-bot@users.noreply.github.com"
          git add worldpulse-source-cache.json worldpulse-news-cache.json onxyview-event-cache.json
          git commit -m "data: refresh WorldPulse and OnxyView caches"
          git pull --rebase origin main
          git push origin HEAD:main
