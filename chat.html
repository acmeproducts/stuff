<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chat Tabletop</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e2e8f0}
body{display:flex;flex-direction:column}

.half{flex:1 1 50%;min-height:0;display:flex;padding:3px}
.half.north{transform:rotate(180deg)}
.shell{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:18px;
  overflow:hidden;box-shadow:0 2px 10px rgba(15,23,42,.10)}
.half.south .shell{border:2px solid rgba(59,130,246,.45)}
.half.north .shell{border:2px solid rgba(16,185,129,.45)}

.tx{flex:1;min-height:0;overflow-y:auto;padding:8px 8px 4px;display:flex;flex-direction:column;gap:6px}
.daysep{align-self:center;font-size:10px;font-weight:700;color:#94a3b8;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 10px;border-radius:999px;background:rgba(148,163,184,.14)}
.row{display:flex}
.row.own{justify-content:flex-end}
.row.them{justify-content:flex-start}
.bub{max-width:82%;border-radius:14px;padding:8px 10px;box-shadow:0 1px 3px rgba(15,23,42,.10)}
.bub.s{background:var(--sbg,#eff6ff);border-left:3px solid rgba(59,130,246,.75)}
.bub.n{background:var(--nbg,#f0fdf4);border-left:3px solid rgba(16,185,129,.7)}
.bhdr{display:flex;align-items:center;justify-content:flex-end;gap:6px;
  padding-bottom:5px;margin-bottom:5px;border-bottom:1px solid rgba(15,23,42,.07)}
.btime{font-size:10px;opacity:.55;font-variant-numeric:tabular-nums}
.bdel{width:20px;height:20px;border-radius:999px;border:1px solid rgba(148,163,184,.4);
  background:rgba(255,255,255,.7);color:#94a3b8;font-size:11px;line-height:1;padding:0;flex-shrink:0}
.bcols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bub.single .bcols{grid-template-columns:1fr}
.bcol{min-width:0;cursor:pointer}
.bcol+.bcol{border-left:1px solid rgba(15,23,42,.10);padding-left:8px}
.btxt{font-size:var(--fsz,15px);line-height:1.35;color:var(--txt,#0f172a);word-wrap:break-word}
.bacts{display:flex;gap:4px;margin-top:5px}
.bact{width:26px;height:26px;border-radius:999px;border:1px solid rgba(148,163,184,.4);
  background:rgba(255,255,255,.85);color:#475569;padding:5px;display:inline-flex;align-items:center;justify-content:center}
.bact svg{width:100%;height:100%}
.bact:active{background:#dbeafe;color:#1d4ed8}

.strip{display:flex;align-items:center;gap:5px;padding:6px;border-top:1px solid rgba(226,232,240,.9);background:#fff}
.ctl{flex:0 0 38px;width:38px;height:38px;border-radius:999px;border:1px solid rgba(226,232,240,.95);
  background:#fff;color:#475569;display:inline-flex;align-items:center;justify-content:center;padding:8px}
.ctl svg{width:100%;height:100%}
.ctl[data-on="true"]{background:linear-gradient(135deg,rgba(248,113,113,.95),rgba(239,68,68,.95));color:#fff;border-color:transparent}
.ctl[data-owned="true"]{box-shadow:0 0 0 2px rgba(59,130,246,.9)}
.ctl[data-pending="true"]{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.ctl.tts[data-on="true"]{background:rgba(191,219,254,.95);color:#1e40af;border-color:rgba(147,197,253,.9)}
.inwrap{flex:1;min-width:20px;position:relative;display:flex;align-items:center}
.inp{width:100%;height:38px;padding:0 30px 0 12px;border-radius:999px;border:1px solid rgba(226,232,240,.95);
  background:#fff;font-size:15px;line-height:38px;white-space:nowrap;overflow-x:auto;overflow-y:hidden}
.inp::-webkit-scrollbar{display:none}
.clearbtn{position:absolute;right:5px;width:22px;height:22px;border-radius:999px;border:1px solid rgba(203,213,225,.8);
  background:rgba(241,245,249,.95);color:#64748b;display:none;align-items:center;justify-content:center;font-size:12px;padding:0}
.clearbtn.show{display:inline-flex}
.sendbtn{flex:0 0 40px;width:40px;height:40px;background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));
  color:#fff;border-color:transparent}

/* keyboard — 44px minimum, may take up to 50vh */
.kb{flex:0 0 auto;max-height:0;overflow:hidden;background:#f1f5f9;transition:max-height .18s ease}
.kb.open{max-height:50vh;border-top:1px solid rgba(203,213,225,.9)}
.kbin{padding:4px;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column}
.kkeys{position:relative}
.swype-trail{position:absolute;inset:0;pointer-events:none;z-index:5}
.klang{font-size:11px;font-weight:700;color:#64748b;padding:2px 4px 4px}
.kcands{display:none;gap:5px;overflow-x:auto;padding:0 4px 5px;flex:0 0 auto;min-height:36px;align-items:center}
.kcands::-webkit-scrollbar{display:none}
.kcand{flex:0 0 auto;padding:7px 12px;border-radius:9px;border:1px solid rgba(203,213,225,.9);background:#fff;font-size:16px;min-height:36px}
.kcand.on{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff;border-color:transparent}
.krow{display:flex;gap:4px;margin-bottom:4px}
.key{flex:1 1 0;min-width:0;height:44px;border-radius:7px;border:1px solid rgba(203,213,225,.9);
  background:#fff;box-shadow:0 1px 0 rgba(15,23,42,.10);font-size:17px;color:#0f172a;padding:0;
  display:inline-flex;align-items:center;justify-content:center;
  touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .04s ease,background .04s ease}
.key.pressed{background:#dbeafe;transform:scale(0.92);box-shadow:none}
.key.swyping{background:#bfdbfe}
.key.fn{flex:1.3 1 0;font-size:13px;font-weight:600;color:#475569;background:#e2e8f0}
.key.space{flex:4 1 0;font-size:13px}
.key.enter{flex:1.7 1 0;background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));
  color:#fff;border-color:transparent;font-size:13px;font-weight:700}

/* request overlay */
.ask{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.45)}
.ask.show{display:flex}
.askcard{width:min(88%,330px);background:#fff;border-radius:16px;padding:16px;box-shadow:0 18px 40px rgba(15,23,42,.3)}
.ask-msg{font-size:15px;color:#0f172a;margin-bottom:14px;text-align:center;line-height:1.4}
.askbtns{display:flex;gap:10px}
.askbtns button{flex:1;height:46px;border-radius:12px;font-weight:700;font-size:15px;
  border:1px solid rgba(203,213,225,.9);background:#f1f5f9;color:#334155}
.askbtns .ask-ok{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff;border-color:transparent}

/* config modal */
#cfg{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.5);padding:14px}
#cfg.show{display:flex}
.cfgcard{width:min(94%,420px);max-height:86vh;overflow-y:auto;background:#fff;border-radius:18px;padding:18px}
.cfgcard h3{margin:0 0 14px;font-size:17px;color:#0f172a}
.cfgrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cfgrow label{flex:1;font-size:13px;color:#475569}
.cfgrow select,.cfgrow input[type=text],.cfgrow input[type=password]{
  flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(226,232,240,.95);border-radius:10px;font-size:14px}
.cfglab{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.sw{position:relative;width:44px;height:24px;flex:0 0 44px}
.sw input{opacity:0;width:0;height:0;position:absolute}
.swt{position:absolute;inset:0;border-radius:999px;background:#cbd5e1;transition:background .2s}
.swt::before{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+.swt{background:#3b82f6}
.sw input:checked+.swt::before{transform:translateX(20px)}
.cfgbtn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:15px;margin-top:8px}
.cfgbtn.primary{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff}
.cfgbtn.ghost{background:#f1f5f9;color:#475569;border:1px solid rgba(226,232,240,.95)}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.swatch{height:34px;border-radius:8px;border:2px solid transparent;padding:0}
.swatch.on{border-color:#3b82f6}

/* diagnostics */
#diag-panel{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;background:#0f172a;color:#e2e8f0}
#diag-panel.show{display:flex}
.diagtools{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.12);flex-shrink:0}
.diagtools b{font:600 13px ui-monospace,Menlo,monospace}
.diagtools button{font-size:12px;padding:7px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:#e2e8f0}
#diag-lines{flex:1;overflow:auto;padding:10px 12px;font:11px/1.5 ui-monospace,Menlo,monospace}
#diag-lines .err{color:#fca5a5}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);z-index:95;
  background:rgba(15,23,42,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:all .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="half north">
  <div class="shell" style="position:relative">
    <div class="tx" id="tx-north"></div>
    <div class="strip" id="strip-north"></div>
    <div class="kb" id="kb-north"><div class="kbin"><div class="klang"></div><div class="kcands"></div><div class="kkeys"><svg class="swype-trail" id="trail-north"></svg></div></div></div>
    <div class="ask" id="ask-north"><div class="askcard">
      <div class="ask-msg"></div><div class="askbtns"><button type="button" class="ask-no"></button><button type="button" class="ask-ok"></button></div>
    </div></div>
  </div>
</div>

<div class="half south">
  <div class="shell" style="position:relative">
    <div class="tx" id="tx-south"></div>
    <div class="strip" id="strip-south"></div>
    <div class="kb" id="kb-south"><div class="kbin"><div class="klang"></div><div class="kcands"></div><div class="kkeys"><svg class="swype-trail" id="trail-south"></svg></div></div></div>
    <div class="ask" id="ask-south"><div class="askcard">
      <div class="ask-msg"></div><div class="askbtns"><button type="button" class="ask-no"></button><button type="button" class="ask-ok"></button></div>
    </div></div>
  </div>
</div>

<div id="diag-panel">
  <div class="diagtools"><b>diagnostics</b><span style="flex:1"></span>
    <button type="button" id="dg-copy">Copy</button>
    <button type="button" id="dg-dl">Download</button>
    <button type="button" id="dg-clear">Clear</button>
    <button type="button" id="dg-close">✕</button></div>
  <div id="diag-lines"></div>
</div>

<div id="toast"></div>

<script>
(function duck2(){
    'use strict';

    function $(id){return document.getElementById(id)}

/* ######## ENGINE — bridge-turn27-base.html, VERBATIM ######## */
/* ===== bridge27: norm/uid ===== */
function norm(s){return(s||'').replace(/\s+/g,' ').trim()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
/* ===== bridge27: log ===== */
var debugLog=[];
function log(ev,d,lvl){debugLog.push({ts:new Date().toISOString(),ev:ev,d:d||{},lvl:lvl||'info'});if(debugLog.length>400)debugLog.shift()}
function toast(m,dur){var e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('show')},dur||2600)}
function lsGet(k,f){try{var r=localStorage.getItem(k);return r==null?f:JSON.parse(r)}catch(_){return f}}
/* ===== bridge27: LANGS ===== */
var LANGS={
  en:{flag:'🇺🇸',name:'English',tts:'en-US'},th:{flag:'🇹🇭',name:'Thai',tts:'th-TH'},
  es:{flag:'🇪🇸',name:'Spanish',tts:'es-ES'},ja:{flag:'🇯🇵',name:'Japanese',tts:'ja-JP'},
  ko:{flag:'🇰🇷',name:'Korean',tts:'ko-KR'},zh:{flag:'🇨🇳',name:'Chinese (Simplified)',tts:'zh-CN'},
  ar:{flag:'🇸🇦',name:'Arabic',tts:'ar-SA'},hi:{flag:'🇮🇳',name:'Hindi',tts:'hi-IN'},
  ru:{flag:'🇷🇺',name:'Russian',tts:'ru-RU'},fr:{flag:'🇫🇷',name:'French',tts:'fr-FR'},
  de:{flag:'🇩🇪',name:'German',tts:'de-DE'},it:{flag:'🇮🇹',name:'Italian',tts:'it-IT'},
  pt:{flag:'🇧🇷',name:'Portuguese',tts:'pt-BR'},vi:{flag:'🇻🇳',name:'Vietnamese',tts:'vi-VN'},
  id:{flag:'🇮🇩',name:'Indonesian',tts:'id-ID'},ms:{flag:'🇲🇾',name:'Malay',tts:'ms-MY'},
  fil:{flag:'🇵🇭',name:'Filipino',tts:'fil-PH'},nl:{flag:'🇳🇱',name:'Dutch',tts:'nl-NL'},
  sv:{flag:'🇸🇪',name:'Swedish',tts:'sv-SE'},pl:{flag:'🇵🇱',name:'Polish',tts:'pl-PL'},
  tr:{flag:'🇹🇷',name:'Turkish',tts:'tr-TR'}
};
/* ===== bridge27: LANG_ORDER ===== */
var LANG_ORDER=['en','th','es','ja','ko','zh','ar','hi','ru','fr','de','it','pt','vi','id','ms','fil','nl','sv','pl','tr'];
/* ===== bridge27: DG_WORKLET_CODE ===== */
var DG_WORKLET_CODE='class TBAudioCapture extends AudioWorkletProcessor{constructor(){super();this._b=[];this._n=4096;}process(inputs){var ch=inputs[0]&&inputs[0][0];if(ch){for(var i=0;i<ch.length;i++)this._b.push(ch[i]);}while(this._b.length>=this._n){var out=new Float32Array(this._b.splice(0,this._n));this.port.postMessage(out,[out.buffer]);}return true;}}registerProcessor(\'tb-audio-capture\',TBAudioCapture);';
/* ===== bridge27: gL ===== */
function gL(c){return LANGS[c]||{flag:'🏳',name:c,tts:c}}
/* ===== bridge27: trCache ===== */
var trCache=new Map(),TR_CACHE_MAX=200;
/* ===== bridge27: cleanTr ===== */
function cleanTr(t){return norm(String(t||'').replace(/<\/?[a-zA-Z][^>]*>/g,''))}
/* ===== bridge27: translateWithRetry ===== */
function translateWithRetry(text,from,to,retries){
  if(!text||!from||!to||from===to)return Promise.resolve({text:text,ok:true});
  var k=from+'|'+to+'|'+text;
  if(trCache.has(k)){var v=trCache.get(k);trCache.delete(k);trCache.set(k,v);return Promise.resolve({text:v,ok:true})}
  var attempt=function(n){
    return fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to)
      .then(function(r){return r.json()})
      .then(function(d){
        if(d&&d.responseStatus===200&&d.responseData){
          var t=d.responseData.translatedText;
          if(t&&t.indexOf('MYMEMORY')<0){
            t=cleanTr(t);
            if(trCache.size>=TR_CACHE_MAX){var first=trCache.keys().next().value;trCache.delete(first)}
            trCache.set(k,t);return{text:t,ok:true};
          }
        }
        throw new Error('bad response');
      })
      .catch(function(e){
        if(n>0){log('trans_retry',{left:n},'warn');return new Promise(function(res){setTimeout(res,300+((retries-n)*250))}).then(function(){return attempt(n-1)})}
        log('trans_fail',{from:from,to:to,e:String(e)},'error');
        return{text:text,ok:false};
      });
  };
  return attempt(retries||0);
}
/* ===== bridge27: speakText ===== */
function speakText(text,lang){
  text=norm(text);if(!text||!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang=gL(lang).tts;window.speechSynthesis.speak(u);
}
/* ===== bridge27: GEN ===== */
var GEN = {
  n: 1,
  bump: function (reason) {
    this.n++;
    try { log('gen_bump', { n: this.n, r: reason }, 'ok'); } catch (_) {}
    return this.n;
  },
  is: function (g) { return g === this.n; }
};
/* ===== bridge27: dgGen+DG_MULTI ===== */
var dgGen = 0;

/* Languages the transcription model can code-switch between in one socket.
   Outside this set a room falls back to single-language transcription, which is
   the pre-existing behaviour and is correct for pairs like English/Thai where
   the two scripts are unambiguous anyway. */
var DG_MULTI_LANGS = ['en', 'es', 'fr', 'de', 'hi', 'it', 'ja', 'nl', 'ru', 'pt'];

/* Languages the model cannot code-switch with English. Someone whose room
   language is one of these will still speak English some of the time, and a
   socket pinned to their own language transcribes that English phonetically —
   English words spelled in Thai letters, which is unusable.

/* ===== bridge27: normalization ===== */
var SCRIPT_TESTS = [
  { lang: 'th', re: /[\u0E00-\u0E7F]/ },
  { lang: 'ja', re: /[\u3040-\u30FF]/ },
  { lang: 'ko', re: /[\uAC00-\uD7AF\u1100-\u11FF]/ },
  { lang: 'zh', re: /[\u4E00-\u9FFF]/ },
  { lang: 'ar', re: /[\u0600-\u06FF]/ },
  { lang: 'ru', re: /[\u0400-\u04FF]/ },
  { lang: 'hi', re: /[\u0900-\u097F]/ }
];

function detectByScript(text) {
  var s = String(text || '');
  var letters = s.replace(/[^\p{L}]/gu, '');
  if (!letters) return null;
  for (var i = 0; i < SCRIPT_TESTS.length; i++) {
    var t = SCRIPT_TESTS[i];
    var hits = (letters.match(new RegExp(t.re.source, 'gu')) || []).length;
    if (hits / letters.length > 0.2) return t.lang;
  }
  return null;

/* ── Language-identification model (Latin script) ───────────────────────────
   Assets ship in the repo alongside the app. Loading is lazy and failure is
   never fatal: if the model cannot load, detection degrades to the room's own
   language rather than to a wrong answer. */
/* Asset paths must be absolute. The upstream loader resolves a relative model
   path against its own module URL, not against the page, so a relative string
   lands a directory too deep, the fetch returns a 404 page, and the runtime
   aborts on HTML it was handed instead of a model. Resolving against the
   fastType folder up front removes the ambiguity — this mirrors exactly what
   the package's own smoke test does, which is the configuration proven to work. */
var FT_DIR = (typeof location !== 'undefined') ? new URL('fastType/', location.href).href : 'fastType/';
var FT_WRAPPER = FT_DIR + 'fasttext-wrapper.umd.js';
var FT_MODEL = FT_DIR + 'model/lid.176.ftz';
var FT_WASM = FT_DIR + 'core/fasttext.wasm';
var _ft = null, _ftPromise = null, _ftFailed = false;

/* Only languages this app actually supports are trustworthy answers. Anything
   the model reports outside this set is treated as "unknown" — a confident
   wrong answer is worse than no answer, because it drives a wrong translation. */
function ftAllowed(code) { return LANG_ORDER.indexOf(code) >= 0; }

function loadFastText() {
  if (_ft || _ftFailed) return Promise.resolve(_ft);
  if (_ftPromise) return _ftPromise;
  _ftPromise = new Promise(function (resolve) {
    function fail(stage, why) {
      _ftFailed = true;
      var detail = (why && (why.stack || why.message)) ? (why.message || String(why)) : String(why);
      try { log('ft_unavailable', { stage: stage, why: detail }, 'error'); } catch (_) {}
      resolve(null);
    }
    try {
      /* The runtime asks for its own assets by bare filename; point it at the
         folder they actually live in. Set before the wrapper loads, as the
         package requires. */
      var cfg = {
        locateFile: function (path) {
          var name = String(path || '').split('/').pop();
          return /\.wasm$/i.test(name) ? FT_WASM : FT_DIR + name;
        }
      };
      window.Module = cfg;
      window.FastTextModule = cfg;

      var s = document.createElement('script');
      s.src = FT_WRAPPER;
      s.onerror = function () { fail('wrapper', 'script failed to load'); };
      s.onload = function () {
        try {
          var ft = new window.FastText();
          ft.loadModel(FT_MODEL).then(function () {
            _ft = ft;
            try { log('ft_ready', {}, 'ok'); } catch (_) {}
            resolve(ft);
          }).catch(function (e) { fail('model', e); });
        } catch (e) { fail('init', e); }
      };
      document.head.appendChild(s);
    } catch (e) { fail('setup', e); }
  });
  return _ftPromise;
}

/* Short fragments are not reliably identifiable. Below this length the model's
   answer is discarded rather than trusted — the room language is the safer
   assumption for a two-word utterance. */
var FT_MIN_CHARS = 8;

function ftDetect(text) {
  return loadFastText().then(function (ft) {
    if (!ft) return null;
    var s = String(text || '').trim();
    if (s.replace(/[^\p{L}]/gu, '').length < FT_MIN_CHARS) return null;
    try {
      var code = ft.detect(s);
      if (!code) return null;
      code = String(code).toLowerCase().split(/[-_]/)[0];
      return ftAllowed(code) ? code : null;
    } catch (e) {
      try { log('ft_detect_err', { e: String(e) }, 'warn'); } catch (_) {}
      return null;
    }
  });
}

/* The one detection entry point. Returns null when nothing is trustworthy. */
function detectLangAsync(text) {
  var byScript = detectByScript(text);
  if (byScript) return Promise.resolve(byScript);
  return ftDetect(text);
}

/* The base calls this synchronously to decide whether it needs to normalize.
   By the time it runs, normalization has already happened at the entry point,
   so the honest answer is "nothing to correct" — it declines rather than
   guessing English and sending correct text back through a pointless round
   trip. Replacing it is safe: it is a leaf, nothing hangs off it. */

    function isJamoV(j){return HG.JUNG.indexOf(j)>-1}
    function hgSyll(st){
        if(st.cho===null)return st.jung!==null?HG.JUNG[st.jung]:'';
        if(st.jung===null)return HG.CHO[st.cho];
        return String.fromCharCode(0xAC00+(st.cho*21+st.jung)*28+(st.jong||0));
    }
    function newKoState(){return{cho:null,jung:null,jong:0}}
    // returns {commit:'text flushed', state:newState}
    function koInput(st,j){
        var out='';
        if(isJamoV(j)){
            var vi=HG.JUNG.indexOf(j);
            if(st.cho!==null&&st.jung!==null&&st.jong){       // split final: previous syllable keeps first, new syllable starts
                var jongCh=HG.JONG[st.jong],moved,keep;
                if(HG.JONG_SPLIT[jongCh]){keep=HG.JONG_SPLIT[jongCh][0];moved=HG.JONG_SPLIT[jongCh][1]}
                else{keep='';moved=jongCh}
                st.jong=HG.JONG.indexOf(keep||'');
                out+=hgSyll(st);
                return{commit:out,state:{cho:HG.CHO.indexOf(moved),jung:vi,jong:0}};
            }
            if(st.cho!==null&&st.jung!==null){                 // vowel combo or new syllable
                var combo=HG.JUNG_COMBO[HG.JUNG[st.jung]+j];
                if(combo){st.jung=HG.JUNG.indexOf(combo);return{commit:'',state:st}}
                out+=hgSyll(st);
                return{commit:out,state:{cho:null,jung:vi,jong:0}};
            }
            if(st.cho!==null){st.jung=vi;return{commit:'',state:st}}
            if(st.jung!==null){                                 // standalone vowel combo
                var c2=HG.JUNG_COMBO[HG.JUNG[st.jung]+j];
                if(c2){st.jung=HG.JUNG.indexOf(c2);return{commit:'',state:st}}
                out+=hgSyll(st);return{commit:out,state:{cho:null,jung:vi,jong:0}};
            }
            return{commit:'',state:{cho:null,jung:vi,jong:0}};
        }
        // consonant
        var ci=HG.CHO.indexOf(j),ji=HG.JONG.indexOf(j);
        if(st.cho!==null&&st.jung!==null){
            if(st.jong){
                var cmb=HG.JONG_COMBO[HG.JONG[st.jong]+j];
                if(cmb){st.jong=HG.JONG.indexOf(cmb);return{commit:'',state:st}}
                out+=hgSyll(st);return{commit:out,state:{cho:ci>-1?ci:null,jung:null,jong:0}};
            }
            if(ji>0){st.jong=ji;return{commit:'',state:st}}
            out+=hgSyll(st);return{commit:out,state:{cho:ci>-1?ci:null,jung:null,jong:0}};
        }
        if(st.cho!==null||st.jung!==null){out+=hgSyll(st)}
        return{commit:out,state:{cho:ci>-1?ci:null,jung:null,jong:0}};
    }
    function koBackspace(st){
        if(st.jong){
            var ch=HG.JONG[st.jong];
            st.jong=HG.JONG_SPLIT[ch]?HG.JONG.indexOf(HG.JONG_SPLIT[ch][0]):0;
            return{state:st,ate:true};
        }
        if(st.jung!==null){
            var v=HG.JUNG[st.jung],parts=null;
            Object.keys(HG.JUNG_COMBO).forEach(function(k){if(HG.JUNG_COMBO[k]===v)parts=k});
            st.jung=parts?HG.JUNG.indexOf(parts[0]):null;
            return{state:st,ate:true};
        }
        if(st.cho!==null){st.cho=null;return{state:st,ate:true}}
        return{state:st,ate:false};
    }

    var ROMA=[['kya','きゃ'],['kyu','きゅ'],['kyo','きょ'],['sha','しゃ'],['shu','しゅ'],['sho','しょ'],['shi','し'],['cha','ちゃ'],['chu','ちゅ'],['cho','ちょ'],['chi','ち'],['tsu','つ'],['nya','にゃ'],['nyu','にゅ'],['nyo','にょ'],['hya','ひゃ'],['hyu','ひゅ'],['hyo','ひょ'],['mya','みゃ'],['myu','みゅ'],['myo','みょ'],['rya','りゃ'],['ryu','りゅ'],['ryo','りょ'],['gya','ぎゃ'],['gyu','ぎゅ'],['gyo','ぎょ'],['ja','じゃ'],['ju','じゅ'],['jo','じょ'],['ji','じ'],['bya','びゃ'],['byu','びゅ'],['byo','びょ'],['pya','ぴゃ'],['pyu','ぴゅ'],['pyo','ぴょ'],['fu','ふ'],
    ['ka','か'],['ki','き'],['ku','く'],['ke','け'],['ko','こ'],['sa','さ'],['su','す'],['se','せ'],['so','そ'],['ta','た'],['te','て'],['to','と'],['na','な'],['ni','に'],['nu','ぬ'],['ne','ね'],['no','の'],['ha','は'],['hi','ひ'],['he','へ'],['ho','ほ'],['ma','ま'],['mi','み'],['mu','む'],['me','め'],['mo','も'],['ya','や'],['yu','ゆ'],['yo','よ'],['ra','ら'],['ri','り'],['ru','る'],['re','れ'],['ro','ろ'],['wa','わ'],['wo','を'],
    ['ga','が'],['gi','ぎ'],['gu','ぐ'],['ge','げ'],['go','ご'],['za','ざ'],['zu','ず'],['ze','ぜ'],['zo','ぞ'],['da','だ'],['de','で'],['do','ど'],['ba','ば'],['bi','び'],['bu','ぶ'],['be','べ'],['bo','ぼ'],['pa','ぱ'],['pi','ぴ'],['pu','ぷ'],['pe','ぺ'],['po','ぽ'],
    ['a','あ'],['i','い'],['u','う'],['e','え'],['o','お'],['nn','ん'],['-','ー'],['.','。'],[',','、']];
    function romajiToKana(raw){
        var kana='',i=0;
        while(i<raw.length){
            if(raw[i]==='n'&&(i+1>=raw.length||!/[aiueoy]/.test(raw[i+1]))){kana+='ん';i++;continue}
            if(i+1<raw.length&&raw[i]===raw[i+1]&&/[a-z]/.test(raw[i])&&!/[aiueon]/.test(raw[i])){kana+='っ';i++;continue}
            var hit=null;
            for(var L=3;L>=1;L--){
                var seg=raw.substr(i,L);
                for(var k=0;k<ROMA.length;k++){if(ROMA[k][0]===seg){hit=ROMA[k];break}}
                if(hit){kana+=hit[1];i+=L;break}
            }
            if(!hit){kana+=raw[i];i++}
        }
        return kana;
    }
    function romajiTail(raw){ // trailing chars that can't resolve to kana yet
        var m=raw.match(/[a-z]{1,3}$/);
        if(!m)return '';
        var t=m[0];
        for(var L=t.length;L>=1;L--){
            var seg=t.slice(-L),ok=false;
            for(var k=0;k<ROMA.length;k++){if(ROMA[k][0].indexOf(seg)===0&&ROMA[k][0]!==seg){ok=true;break}}
            if(ok)return seg;
        }
        return '';
    }

            cb(list.slice(0,8));
        }).catch(function(e){cb(null,e.message)});
    }

/* ######## pipeline + switch ######## */
    /* Mirror bridge's log() into the diagnostics panel WITHOUT touching its bytes
       (GATE 2 requires byte-identity). Wrap, never replace. */
    (function(){
        var _log=log;
        log=function(ev,d,lvl){
            _log(ev,d,lvl);
            try{if(typeof diag==='function')
                diag('['+(lvl||'info')+'] '+ev+(d&&Object.keys(d).length?' '+JSON.stringify(d):''),
                     (lvl==='error'||lvl==='warn'))}catch(_){}

    /* ============================================================================
       PER-SIDE DEEPGRAM PIPELINE
       Mechanical refactor of bridge27's live startDeepgram (line 3341) from a
       device-wide singleton into an instantiable factory. Every module global
       becomes an instance property; every guard is preserved exactly:
         - socket identity check  (a superseded socket can't tear down its successor)
         - generation guard       (a socket from a previous session produces nothing)
         - 30s silence watchdog   - 2s reconnect backoff  - 3-strike credential fail
         - AudioWorklet with ScriptProcessor fallback
       Bridge's dual-socket English arbitration is NOT included: duck is one
       language per side, which is bridge's own single-language branch.
       ============================================================================ */
    var DG_WATCHDOG_MS=30000, DG_MAX_FAILS=3;
    function dgKey(){try{return(localStorage.getItem('tb_dg_key')||'').trim()}catch(e){return ''}}

    function createMicPipeline(side,onFinal){
        var P={
            on:false, stream:null,
            ws:null, enWs:null, active:false, audioCtx:null, src:null, proc:null,
            failCount:0, lastMsg:0, watchdog:null,
            gen:{n:1,bump:function(){this.n++;return this.n},is:function(g){return g===this.n}}
        };

        function stopAudio(){
            if(P.proc){try{P.proc.disconnect()}catch(e){}P.proc=null}
            if(P.src){try{P.src.disconnect()}catch(e){}P.src=null}
            if(P.audioCtx){try{P.audioCtx.close()}catch(e){}P.audioCtx=null}
        }
        function stopWatchdog(){if(P.watchdog){clearInterval(P.watchdog);P.watchdog=null}}

        function stopSocket(){
            P.gen.bump();
            if(P.ws){try{P.ws.close()}catch(e){}}
            if(P.enWs){try{P.enWs.close()}catch(e){}}
            P.ws=null; P.enWs=null; P.active=false;
            stopAudio(); stopWatchdog();
        }

        function connect(){
            if(!P.on)return;
            var key=dgKey();
            if(!key){diag(side+': Deepgram key missing — add it in Settings → Calling & Sync Keys',true);return}
            if(P.active||(P.ws&&P.ws.readyState<2))return;
            var stream=P.stream;
            if(!stream){diag(side+': no mic stream',true);return}

            var room=sideAsRoom(side);
            var lang=dgLangParam(room);
            var myGen=P.gen.n;
            var url='wss://api.deepgram.com/v1/listen?model=nova-3&language='+encodeURIComponent(lang)+
                    '&encoding=linear16&sample_rate=16000&channels=1&interim_results=false&punctuate=false&endpointing=400';
            P.ws=new WebSocket(url,['token',key]);
            var mySocket=P.ws;
            function live(){return P.ws===mySocket&&P.gen.is(myGen)}

            P.ws.onopen=function(){
                if(!live()){try{mySocket.close()}catch(e){}return}
                if(!P.on){try{P.ws.close()}catch(e){}return}
                P.failCount=0;
                diag(side+': listening in '+lang);
                try{
                    var tracks=(stream?stream.getAudioTracks():[]).filter(function(t){return t.readyState==='live'});
                    if(!tracks.length){diag(side+': no live audio track',true);P.ws.close();return}
                    P.audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
                    P.src=P.audioCtx.createMediaStreamSource(new MediaStream(tracks));
                    var silent=P.audioCtx.createGain();silent.gain.value=0;silent.connect(P.audioCtx.destination);

                    function pump(f){
                        if(!live()||P.ws.readyState!==1||!P.on)return;
                        var b=new Int16Array(f.length);
                        for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i]));b[i]=s<0?s*0x8000:s*0x7FFF}
                        P.ws.send(b.buffer);
                        if(P.enWs&&P.enWs.readyState===1)P.enWs.send(b.buffer);
                    }
                    function scriptProc(){
                        if(!live())return;
                        P.proc=P.audioCtx.createScriptProcessor(4096,1,1);
                        P.proc.onaudioprocess=function(e){pump(e.inputBuffer.getChannelData(0))};
                        P.src.connect(P.proc);P.proc.connect(silent);
                        P.active=true;
                    }
                    if(P.audioCtx.audioWorklet&&typeof AudioWorkletNode!=='undefined'){
                        var blob=new Blob([DG_WORKLET_CODE],{type:'application/javascript'});
                        var wurl=URL.createObjectURL(blob);
                        P.audioCtx.audioWorklet.addModule(wurl).then(function(){
                            URL.revokeObjectURL(wurl);
                            if(!live()||P.ws.readyState!==1)return;
                            var node=new AudioWorkletNode(P.audioCtx,'tb-audio-capture');
                            node.port.onmessage=function(ev){pump(ev.data)};
                            P.src.connect(node);node.connect(silent);
                            P.proc=node;P.active=true;
                        }).catch(function(e){URL.revokeObjectURL(wurl);scriptProc()});
                    }else scriptProc();
                }catch(e){diag(side+': audio setup failed — '+e.message,true);P.active=false}
            };

            P.ws.onmessage=function(e){
                if(!live())return;
                P.lastMsg=Date.now();
                try{
                    var d=JSON.parse(e.data);
                    var alt=d.channel&&d.channel.alternatives&&d.channel.alternatives[0];
                    if(alt&&alt.transcript&&d.is_final){
                        var t=String(alt.transcript).trim();
                        if(!t)return;
                        if(P.enWs){
                            /* Dual-channel room (zh/th/ko/ar): hold the native result briefly.
                               If the English channel returns something substantial inside the
                               window, the native text was phonetic nonsense and gets dropped. */
                            dgArbitrateNative(t,function(held){
                                if(live())onFinal(held,dgUseMulti(room)?null:room.myLang);
                            });
                        }else{
                            onFinal(t,dgUseMulti(room)?null:room.myLang);
                        }
                    }
                }catch(e2){}
            };
            P.ws.onerror=function(){if(live())diag(side+': socket error',true)};
            P.ws.onclose=function(ev){
                if(P.ws!==mySocket)return;
                if(!P.gen.is(myGen))return;
                var neverOpened=!P.active;
                P.active=false;stopAudio();stopWatchdog();
                if(!P.on)return;
                if(neverOpened){
                    P.failCount++;
                    if(P.failCount>=DG_MAX_FAILS){diag(side+': Deepgram rejected the key 3× — check it in Settings',true);return}
                }
                setTimeout(function(){if(P.gen.is(myGen)&&P.on&&!P.active)connect()},2000);
            };

            /* Second channel listening in English on the same audio — bridge's fix for
               rooms whose language cannot code-switch with English (zh/th/ko/ar). */
            if(dgUseDual(room)){
                var urlEn='wss://api.deepgram.com/v1/listen?model=nova-3&language=en'+
                          '&encoding=linear16&sample_rate=16000&channels=1&interim_results=false&punctuate=false&endpointing=400';
                P.enWs=new WebSocket(urlEn,['token',key]);
                var enSock=P.enWs;
                P.enWs.onmessage=function(e){
                    if(P.enWs!==enSock||!P.gen.is(myGen))return;
                    P.lastMsg=Date.now();
                    try{
                        var d=JSON.parse(e.data);
                        var alt=d.channel&&d.channel.alternatives&&d.channel.alternatives[0];
                        if(!(alt&&alt.transcript&&d.is_final))return;
                        var verdict=dgArbitrateEnglish(alt.transcript);
                        if(verdict==='ignored')return;
                        /* language known by construction: this channel hears only English */
                        if(live())onFinal(String(alt.transcript).trim(),'en');
                    }catch(_){}
                };
                P.enWs.onerror=function(){if(P.enWs===enSock)diag(side+': english channel error',true)};
                P.enWs.onclose=function(){if(P.enWs===enSock)P.enWs=null};
                log('dg_en_open',{myLang:room.myLang},'ok');
            }

            P.lastMsg=Date.now();stopWatchdog();
            P.watchdog=setInterval(function(){
                if(!P.gen.is(myGen)||!P.active||!P.on){stopWatchdog();return}
                if(Date.now()-P.lastMsg>DG_WATCHDOG_MS){
                    diag(side+': watchdog restart (silent '+Math.round((Date.now()-P.lastMsg)/1000)+'s)',true);
                    stopSocket();
                    setTimeout(function(){if(P.gen.is(myGen)&&P.on&&!P.active)connect()},1000);
                }
            },5000);
        }

        P.start=function(){
            if(P.on)return Promise.resolve();
            return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}})
                .then(function(s){P.stream=s;P.on=true;connect()})
                .catch(function(e){diag(side+': microphone permission needed',true);throw e});
        };
        /* hardStop — unconditional, idempotent, leaves nothing running.
           Safe to call on an already-stopped pipeline; that is required by the
           ownership switch, which calls it on both sides before every acquire. */
        P.hardStop=function(){
            P.on=false;
            stopSocket();
            if(P.stream){P.stream.getTracks().forEach(function(t){try{t.stop()}catch(e){}});P.stream=null}
        };
        return P;
    }

    /* ============================================================================
       OWNERSHIP SWITCH — the one module with no bridge equivalent.
       ONE rule: every acquisition tears down BOTH sides completely, first,
       unconditionally. No fast paths. No trusting remembered state.
       Nothing outside teardown()/acquire() may write INPUT or start a pipeline.
       ============================================================================ */
    /* ── Mic idle auto-stop ──────────────────────────────────────────────────
       DELIBERATE DIVERGENCE FROM BRIDGE, recorded so it is never mistaken for a
       port. Bridge's CHATMIC has no idle timer: its mic runs until the user taps
       it off, because bridge is one person on their own device — holding the mic
       costs nobody anything. duck is two people sharing one device, so an
       un-released mic blocks the other side's turn indefinitely. The switch
       therefore releases itself after a genuine silence.
       Timer is armed on acquire and re-armed on every final transcript, so it
       measures silence since the last thing you actually said — not since you
       started talking. */
    var MIC_IDLE_MS=6000, micIdleTimer=null;
    function armMicIdle(side){
        clearTimeout(micIdleTimer);
        micIdleTimer=setTimeout(function(){
            if(INPUT.owner===side&&INPUT.mode==='mic'){
                diag('mic idle '+(MIC_IDLE_MS/1000)+'s → releasing turn');
                teardown('mic-idle');
            }
        },MIC_IDLE_MS);
    }
    function clearMicIdle(){clearTimeout(micIdleTimer);micIdleTimer=null}

    var INPUT={owner:null,mode:null};          // owner: null|'south'|'north'   mode: null|'kb'|'mic'
    var mic={}, pendingReq=null, askTimer=null;

    function teardown(why){
        clearMicIdle();
        ['south','north'].forEach(function(s){
            if(mic[s])mic[s].hardStop();
            hideKeyboard(s);
            paintIdle(s);
        });
        INPUT.owner=null;INPUT.mode=null;
        try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
        clearAsk();
        diag('teardown ('+why+')');
    }

    function acquire(side,mode,why){
        teardown('acquire:'+side+'/'+mode);
        INPUT.owner=side;INPUT.mode=mode;
        if(mode==='mic'){
            mic[side].start().catch(function(){teardown('mic denied')});
            armMicIdle(side);
        }else{
            showKeyboard(side);
        }
        paintActive(side,mode);
        diag('acquire '+side+'/'+mode+(why?' ('+why+')':''));
    }

    /* The only entry point any UI control may call. */
    function requestInput(side,mode){
        if(INPUT.owner===side&&INPUT.mode===mode){teardown('self-toggle-off');return}
        if(INPUT.owner===null){acquire(side,mode,'free');return}
        if(INPUT.owner===side){acquire(side,mode,'switch-mode');return}
        askFor(side,mode);
    }

    /* ================= DIAGNOSTICS ================= */
    var diagLines=[];
    var remoteLogBuf=[];
    var REMOTE_LOG_PATH='logs/'+(ROOM?ROOM.id:'unknown')+'.jsonl';
    function remoteLog(kind,data){
        remoteLogBuf.push({t:Date.now(),k:kind,d:data});
        if(remoteLogBuf.length>=5)flushRemoteLog();
    }
    function flushRemoteLog(){
        if(!remoteLogBuf.length)return;
        var pat=null;try{pat=localStorage.getItem('duck_gh_pat')}catch(e){}
        if(!pat){remoteLogBuf=[];return}
        var batch=remoteLogBuf.slice();remoteLogBuf=[];
        var lines=batch.map(function(e){return JSON.stringify(e)}).join('\n')+'\n';
        var apiUrl='https://api.github.com/repos/acmeproducts/stuff/contents/'+REMOTE_LOG_PATH;
        fetch(apiUrl,{headers:{'Authorization':'Bearer '+pat}})
            .then(function(r){return r.ok?r.json():null})
            .then(function(existing){
                var content,sha;
                if(existing&&existing.content){
                    /* FIX: atob() alone returns a raw byte string (one char per byte).
                       The write side encodes with encodeURIComponent+unescape+btoa
                       (UTF-8-safe). Decoding must use the exact inverse
                       (escape+decodeURIComponent) or every non-ASCII byte gets
                       reinterpreted and mangled a little more on each append —
                       which is why the log got progressively more corrupted. */
                    content=decodeURIComponent(escape(atob(existing.content.replace(/\n/g,''))))+lines;
                    sha=existing.sha;
                }else{content=lines;sha=undefined}
                var body={message:'log '+batch.length+' events',content:btoa(unescape(encodeURIComponent(content)))};
                if(sha)body.sha=sha;
                return fetch(apiUrl,{method:'PUT',headers:{'Authorization':'Bearer '+pat,'Content-Type':'application/json'},body:JSON.stringify(body)});
            }).catch(function(){});
    }
    function diag(msg,err){
        diagLines.push((err?'! ':'· ')+new Date().toTimeString().slice(0,8)+' '+msg);
        if(diagLines.length>300)diagLines=diagLines.slice(-300);
        var b=document.getElementById('diag-lines');
        if(b&&document.getElementById('diag-panel').classList.contains('show'))renderDiag();
        remoteLog(err?'error':'info',msg);
    }
    function renderDiag(){
        var b=document.getElementById('diag-lines');if(!b)return;
        b.innerHTML='input: '+(INPUT.owner||'free')+(INPUT.mode?'/'+INPUT.mode:'')+'<br>'+
            diagLines.slice().reverse().map(function(l){
                return '<div class="'+(l[0]==='!'?'err':'')+'">'+l.replace(/[&<>]/g,'')+'</div>'}).join('');
    }
    function toastMsg(m){

    /* ================= SEND PIPELINE ================= */
    function sendFrom(side,textOverride,keepMic){
        var inp=document.getElementById('in-'+side);
        var text=norm(textOverride!=null?textOverride:(inp?inp.value:''));
        if(!text)return;
        /* G8: clear on EVERY path. */
        if(inp){inp.value='';updateClear(side)}
        /* G9: a spoken utterance must NOT end the turn. Deepgram endpoints on a
           natural pause and keeps the socket open; tearing down here turned the
           mic into push-to-talk. Only a typed/➤ send releases the switch. */
        if(!keepMic)teardown('sent');
        /* G7 PARITY: bridge's typed path calls normalizeOutgoing(room,text) with NO
           third argument, so `knownLang || await detectLangAsync(text)` always runs
           detection. Passing a knownLang here short-circuits detection and makes
           typed code-switches undetectable. Do not add a third argument. */
        normalizeOutgoing(sideAsRoom(side),text).then(function(r){
            addMessage(side,r.text,r.lang);
        }).catch(function(e){
            diag('normalize failed: '+e.message,true);
            addMessage(side,text,langOf(side));
        });
    }

    function addMessage(side,text,srcLang){
        var tgtLang=langOf(otherSide(side));
        var entry={id:Date.now()+'-'+Math.random().toString(36).slice(2,7),
                   side:side,text:text,src:srcLang,tgt:tgtLang,ts:Date.now(),tr:null};
        HIST.push(entry);saveHist();renderAll();
        if(srcLang===tgtLang){entry.tr=text;saveHist();renderAll();speakIfOn(side,text,tgtLang);return}
        translateWithRetry(text,srcLang,tgtLang,2).then(function(res){
            entry.tr=(res&&res.ok&&res.text)?norm(res.text):null;   // bridge: tgtText=norm(tr.text)
            saveHist();renderAll();
            if(entry.tr)speakIfOn(side,entry.tr,tgtLang);
            else diag('translation failed '+srcLang+'→'+tgtLang,true);
        });
    }

/* ######## keyboard ######## */
    /* ================= KEYBOARD — rebuilt, 44px minimum ================= */
    var LANG_KB={en:'latin',es:'es',fr:'fr',de:'de',it:'it',pt:'pt',nl:'latin',sv:'sv',pl:'pl',tr:'tr',
                 ru:'ru',ar:'ar',hi:'hi',th:'th',km:'km',lo:'lo',vi:'vi',id:'latin',ms:'latin',fil:'latin',
                 ja:'latin',ko:'ko',zh:'latin'};
    function layoutNameFor(code){return LANG_KB[code]||'latin'}

    var shifted={south:false,north:false},numMode={south:false,north:false};
    var comp={south:{raw:'',kana:'',ko:null},north:{raw:'',kana:'',ko:null}};
    var cands={south:[],north:[]},candIdx={south:-1,north:-1};

        var el=kbEl(side);if(!el)return;

            html+='<div class="krow">';
            r.forEach(function(k){
                if(k==='SHIFT')html+='<button type="button" class="key fn" data-k="SHIFT">⇧</button>';
                else if(k==='BKSP')html+='<button type="button" class="key fn" data-k="BKSP">⌫</button>';
                else html+='<button type="button" class="key" data-k="'+String(k).replace(/"/g,'&quot;')+'">'+String(k).replace(/[&<>]/g,'')+'</button>';
            });

        });

            '<button type="button" class="key fn" data-k="NUM">'+(numMode[side]?'ABC':'123')+'</button>'+
            '<button type="button" class="key space" data-k=" ">space</button>'+

        el.querySelector('.klang').textContent=(LANG_NAMES[langOf(side)]||langOf(side))+

    /* ================= B3: SWYPE — real gesture recognition over the real keys =================
       Same dictionary as B2 (duck_dict_<lang>), same candidate bar, same insertion
       path. Not a stub: a live pointer trail is collected over the actual .key
       buttons, every candidate word is scored against that trail by how well
       its letters fall along the path in order, best match wins.
       Only active when a real dictionary exists for the side's language — same
       silent no-op rule as B2 (see getDict). Latin-script only for now (path
       scoring assumes a QWERTY-style single-row-per-letter layout; IME
       languages already have their own composition path and are untouched). */
    var swype={active:false,side:null,pts:[],letters:[]};

    function keyRectsFor(side){
        var el=kbEl(side);if(!el)return[];
        var out=[];
        el.querySelectorAll('.key[data-k]').forEach(function(b){
            var k=b.dataset.k;
            if(k.length!==1||!/[a-zA-Z]/.test(k))return;   // letters only — not SHIFT/BKSP/space/etc
            var r=b.getBoundingClientRect();
            out.push({k:k.toLowerCase(),cx:r.left+r.width/2,cy:r.top+r.height/2});
        });
        return out;
    }
    function nearestKey(rects,x,y){
        var best=null,bd=Infinity;
        for(var i=0;i<rects.length;i++){
            var dx=rects[i].cx-x,dy=rects[i].cy-y,d=dx*dx+dy*dy;
            if(d<bd){bd=d;best=rects[i]}
        }
        return best;
    }
    function clearTrail(side){var t=document.getElementById('trail-'+side);if(t)t.innerHTML=''}
    function paintTrail(side){
        var t=document.getElementById('trail-'+side);if(!t||!swype.pts.length)return;
        var kkeys=t.parentElement;var r=kkeys.getBoundingClientRect();
        t.setAttribute('viewBox','0 0 '+r.width+' '+r.height);
        t.setAttribute('width',r.width);t.setAttribute('height',r.height);
        var d=swype.pts.map(function(p,i){return (i===0?'M':'L')+(p.x-r.left)+','+(p.y-r.top)}).join(' ');
        t.innerHTML='<path d="'+d+'" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>'+
            swype.pts.map(function(p){return '<circle cx="'+(p.x-r.left)+'" cy="'+(p.y-r.top)+'" r="3" fill="#3b82f6"/>'}).join('');
    }
    /* ================= UNIFIED KEYBOARD INPUT =================
       ONE handler chain per key, pointerdown-driven (not click — click waits
       for the full release cycle and reads as dead on mobile). Every press
       gets immediate visual feedback (.pressed class) and haptic feedback
       (navigator.vibrate) the instant the finger lands, matching how a real
       device keyboard feels. Swipe is not a bolted-on second system watching
       the same element — it's the same pointerdown/move/up sequence deciding,
       per gesture, whether it stayed a tap or became a swipe. */
    var HAPTIC_TAP=8, HAPTIC_SWYPE_TICK=4;
    function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

    /* Update key GLYPHS for a shift-state change without touching listeners.
       renderKeys()/wireKeyboard() rebuild everything and are for keyboard OPEN,
       language change, or explicit shift TAP — never for auto-lowercase after
       a single letter, which happens on nearly every keystroke and must not
       re-attach input handlers mid-typing. */
    function relabelKeysOnly(side){
        var el=kbEl(side);if(!el)return;
        var rows=layoutFor(side);
        var flat=[];rows.forEach(function(r){flat=flat.concat(r)});
        var i=0;
        el.querySelectorAll('.kkeys .key:not(.fn):not(.space):not(.enter)').forEach(function(btn){
            if(i>=flat.length)return;
            var k=flat[i++];
            btn.dataset.k=String(k);
            btn.textContent=String(k).replace(/[&<>]/g,'');
        });
    }
    function wireKeyboard(side){
        var el=kbEl(side);if(!el)return;
        var oldKkeys=el.querySelector('.kkeys');if(!oldKkeys)return;
        // idempotent: cloning drops any listeners a previous wireKeyboard call
        // left attached, so calling this twice can never stack duplicate
        // pointerdown/move/up handlers on the same element.
        var kkeys=oldKkeys.cloneNode(true);
        oldKkeys.parentNode.replaceChild(kkeys,oldKkeys);
        var rects=[];
        var pid=null, downBtn=null, downX=0, downY=0, isSwype=false, lastSwypeKey=null;

        kkeys.addEventListener('pointerdown',function(e){
            var target=e.target.closest('.key[data-k]');
            if(!target)return;
            e.preventDefault();
            pid=e.pointerId;downBtn=target;downX=e.clientX;downY=e.clientY;isSwype=false;lastSwypeKey=null;
            target.classList.add('pressed');
            haptic(HAPTIC_TAP);                          // fires immediately on contact, not on release
            kkeys.setPointerCapture&&kkeys.setPointerCapture(pid);

            var k=target.dataset.k;
            var swypeEligible = k.length===1 && /[a-zA-Z]/.test(k) &&
                !numMode[side] && !(comp[side].ko||comp[side].raw||comp[side].kana) && getDict(langOf(side));
            if(swypeEligible){
                rects=keyRectsFor(side);
                swype.side=side;swype.pts=[{x:e.clientX,y:e.clientY}];swype.letters=[k.toLowerCase()];
                swype.active=false;
            }else{
                swype.pts=[];   // not swype-eligible from this key — tap only
            }
        },{passive:false});

        kkeys.addEventListener('pointermove',function(e){
            if(e.pointerId!==pid)return;
            var dx=e.clientX-downX, dy=e.clientY-downY;
            var moved=(dx*dx+dy*dy)>=144;   // 12px threshold — matches native keyboard slop

            // live key-to-key visual tracking, tap OR swipe in progress
            var overEl=document.elementFromPoint(e.clientX,e.clientY);
            var overKey=overEl&&overEl.closest('.key[data-k]');
            if(downBtn&&overKey!==downBtn){
                if(downBtn)downBtn.classList.remove('pressed');
                downBtn=overKey;
                if(downBtn)downBtn.classList.add('pressed');
            }

            if(!moved||!swype.pts.length)return;
            if(!swype.active){
                swype.active=true;isSwype=true;
                if(downBtn)downBtn.classList.remove('pressed');
            }
            swype.pts.push({x:e.clientX,y:e.clientY});paintTrail(side);
            var nk=nearestKey(rects,e.clientX,e.clientY);
            if(nk&&nk.k!==lastSwypeKey){
                lastSwypeKey=nk.k;
                swype.letters.push(nk.k);
                haptic(HAPTIC_SWYPE_TICK);              // small tick per letter crossed, like real gesture typing
                var kb=el.querySelector('.key[data-k="'+nk.k.toUpperCase()+'"],.key[data-k="'+nk.k+'"]');
                if(kb){kb.classList.add('swyping');setTimeout(function(){kb.classList.remove('swyping')},120)}
            }
        },{passive:false});

        function finish(e){
            if(e.pointerId!==pid)return;
            if(downBtn)downBtn.classList.remove('pressed');
            var wasSwype=isSwype;
            pid=null;isSwype=false;

            if(wasSwype){
                swype.active=false;
                remoteLog('swype_attempt',{side:side,pts:swype.pts.length,letters:swype.letters.join('')});
                if(swype.pts.length>=4&&swype.letters.length>=2){haptic(HAPTIC_TAP);resolveSwype(side)}
                else remoteLog('swype_too_short',{pts:swype.pts.length,letters:swype.letters.length});
                swype.pts=[];swype.letters=[];clearTrail(side);
            }else if(downBtn){
                press(side,downBtn.dataset.k);           // plain tap — fires on release, same as before
            }
            downBtn=null;
        }
        kkeys.addEventListener('pointerup',finish);
        kkeys.addEventListener('pointercancel',function(e){
            if(e.pointerId!==pid)return;
            if(downBtn)downBtn.classList.remove('pressed');
            pid=null;isSwype=false;downBtn=null;
            swype.active=false;swype.pts=[];swype.letters=[];clearTrail(side);
        });
    }
    /* Score every dictionary word against the letter sequence the finger
       crossed: the word's letters must appear as a SUBSEQUENCE of the swyped
       path (in order, gaps allowed — this is what makes it gesture typing
       rather than exact spelling). Shorter gap-total among matches wins. */
    /* FIXED: direction was backwards. A swype path is a SPARSE sample of the
       word (start, corners, end) — it will almost never contain every letter
       of the target word. The check must be: does every PATH letter appear in
       the WORD, in order? Not the reverse (every word letter in the path),
       which required the path to be as long as the word itself and made
       "you" from a 2-point path [y,o] fail, since "you" has no way to place
       its middle "u" inside a 2-letter path. Lower score = tighter fit
       (fewer word-letters skipped between consecutive path hits). */
    function swypeScore(word,path){
        var w=word.toLowerCase(),wi=0,skips=0;
        for(var pi=0;pi<path.length;pi++){
            var found=false;
            while(wi<w.length){
                if(w[wi]===path[pi]){found=true;wi++;break}
                wi++;skips++;
            }
            if(!found)return null;
        }
        return skips;
    }
    function resolveSwype(side){
        var dict=getDict(langOf(side));if(!dict){remoteLog('swype_no_dict',{side:side,lang:langOf(side)});return}
        var path=swype.letters;
        var scored=[];
        for(var i=0;i<dict.length;i++){
            var w=dict[i];
            if(w.length<2||w[0].toLowerCase()!==path[0])continue;   // must start on the same key
            var s=swypeScore(w,path);
            if(s!==null)scored.push({w:w,s:s});
            if(scored.length>=400)break;   // bounded scan — dictionary is frequency-ranked,
                                            // so the first plausible matches are already the
                                            // most likely words; no need to score all 8000
        }
        if(!scored.length){remoteLog('swype_no_match',{path:path.join(''),dictSize:dict.length});return}
        scored.sort(function(a,b){return a.s-b.s});
        var top=scored.slice(0,5).map(function(x){return x.w});
        remoteLog('swype_resolved',{path:path.join(''),top:top});
        cands[side]=top;candIdx[side]=-1;acFragLen[side]=0;
        var ta=inputEl(side);
        var frag=currentWordFragment(side);
        if(frag)acFragLen[side]=frag.length;
        paintCands(side);
        // best guess inserted immediately (standard swype behaviour); still tap-correctable via the bar
        if(acFragLen[side])replaceComp(side,acFragLen[side],top[0]+' ');
        else insertAt(side,top[0]+' ');
        cands[side]=top.slice(1);candIdx[side]=-1;paintCands(side);
    }
    /* Track A: real autocomplete, reading the SAME asset chat-admin's download
       button writes (duck_dict_<lang> in localStorage). No dictionary = no
       suggestions, silently — this must never block typing or throw. */
    var dictCache={};
    function getDict(lang){
        // Only trust the cache for a POSITIVE result. A null/missing result is
        // re-checked every call — cheap, and fixes the real case where a
        // dictionary downloads in chat-admin AFTER this tab already checked
        // once and cached "not found".
        if(dictCache[lang])return dictCache[lang];
        var raw=null;try{raw=localStorage.getItem('duck_dict_'+lang)}catch(e){}
        if(!raw)return null;
        try{dictCache[lang]=JSON.parse(raw)}catch(e){return null}
        return dictCache[lang];
    }
    function currentWordFragment(side){
        var ta=inputEl(side);if(!ta)return'';
        var s=ta.selectionStart,text=ta.value.slice(0,s);
        var m=text.match(/[^\s]*$/);
        return m?m[0]:'';
    }
    function updateAutocomplete(side){
        if(comp[side].ko||comp[side].raw||comp[side].kana)return;   // IME composition owns the bar
        var lang=langOf(side);
        var dict=getDict(lang);
        if(!dict){if(cands[side].length){cands[side]=[];candIdx[side]=-1;paintCands(side)}return}
        var frag=currentWordFragment(side);
        if(!frag||frag.length<2){if(cands[side].length){cands[side]=[];candIdx[side]=-1;paintCands(side)}return}
        var lower=frag.toLowerCase();
        var out=[];
        for(var i=0;i<dict.length&&out.length<5;i++){
            if(dict[i].toLowerCase().indexOf(lower)===0)out.push(dict[i]);
        }
        cands[side]=out;candIdx[side]=-1;acFragLen[side]=frag.length;paintCands(side);
    }
    var acFragLen={south:0,north:0};

    function compText(side){
        var c=comp[side];
        if(c.ko)return hgSyll(c.ko);
        if(c.kana||c.raw)return c.kana+romajiTail(c.raw);
        return '';
    }
    function paintCands(side){
        var bar=kbEl(side)&&kbEl(side).querySelector('.kcands');if(!bar)return;
        if(!cands[side].length){bar.innerHTML='';bar.style.display='none';return}
        bar.style.display='flex';
        bar.innerHTML=cands[side].map(function(c,i){
            return '<button type="button" class="kcand'+(i===candIdx[side]?' on':'')+'" data-i="'+i+'">'+String(c).replace(/[&<>]/g,'')+'</button>'}).join('');
        bar.querySelectorAll('.kcand').forEach(function(b){
            b.addEventListener('pointerdown',function(e){e.preventDefault()});
            b.addEventListener('click',function(){pickCand(side,+b.dataset.i)});
        });
    }
    function inputEl(side){return document.getElementById('in-'+side)}
    function insertAt(side,str){
        var ta=inputEl(side),s=ta.selectionStart,e=ta.selectionEnd;
        ta.value=ta.value.slice(0,s)+str+ta.value.slice(e);
        var p=s+str.length;try{ta.setSelectionRange(p,p)}catch(x){}
        updateClear(side);
    }
    function replaceComp(side,oldLen,str){
        var ta=inputEl(side),s=ta.selectionStart;
        ta.value=ta.value.slice(0,s-oldLen)+str+ta.value.slice(s);
        var p=s-oldLen+str.length;try{ta.setSelectionRange(p,p)}catch(x){}
        updateClear(side);
    }
    function backspaceAt(side){
        var ta=inputEl(side),s=ta.selectionStart,e=ta.selectionEnd;
        if(s!==e){ta.value=ta.value.slice(0,s)+ta.value.slice(e);try{ta.setSelectionRange(s,s)}catch(x){}}
        else if(s>0){ta.value=ta.value.slice(0,s-1)+ta.value.slice(s);try{ta.setSelectionRange(s-1,s-1)}catch(x){}}
        updateClear(side);
    }
    function flushComp(side){
        var t=compText(side);if(!t){comp[side]={raw:'',kana:'',ko:null};return}
        var c=comp[side];
        var final=c.ko?hgSyll(c.ko):romajiToKana(c.raw);
        replaceComp(side,t.length,final);
        comp[side]={raw:'',kana:'',ko:null};cands[side]=[];candIdx[side]=-1;paintCands(side);
    }
    function paintComp(side,prevLen){
        var t=compText(side);
        if(prevLen)replaceComp(side,prevLen,t);else if(t)insertAt(side,t);
    }
    function press(side,k){
        var lang=langOf(side),ime=numMode[side]?null:(lang==='ko'?'ko':(lang==='ja'?'ja':null));
        if(k==='SHIFT'){shifted[side]=!shifted[side];renderKeys(side);return}
        if(k==='NUM'){flushComp(side);numMode[side]=!numMode[side];shifted[side]=false;renderKeys(side);return}
        if(k==='CLOSE'){teardown('kb-close');return}
        if(k==='ENTER'){
            if(cands[side].length&&candIdx[side]>=0){pickCand(side,candIdx[side]);return}
            flushComp(side);sendFrom(side);return;
        }
        if(k==='BKSP'){
            var prev=compText(side).length;
            if(ime==='ko'&&comp[side].ko){
                var r=koBackspace(comp[side].ko);
                comp[side].ko=(r.state.cho===null&&r.state.jung===null)?null:r.state;
                paintComp(side,prev);return;
            }
            if(ime==='ja'&&comp[side].raw){
                comp[side].raw=comp[side].raw.slice(0,-1);
                comp[side].kana=romajiToKana(comp[side].raw.slice(0,comp[side].raw.length-romajiTail(comp[side].raw).length));
                cands[side]=[];candIdx[side]=-1;paintCands(side);paintComp(side,prev);return;
            }
            backspaceAt(side);updateAutocomplete(side);return;
        }
        if(k===' '){
            if(ime==='ja'&&(comp[side].raw||comp[side].kana)){convertJa(side);return}
            flushComp(side);insertAt(side,' ');cands[side]=[];candIdx[side]=-1;paintCands(side);return;
        }
        var prevLen=compText(side).length;
        if(ime==='ko'){
            if(!comp[side].ko)comp[side].ko=newKoState();
            var res=koInput(comp[side].ko,k);
            if(res.commit){replaceComp(side,prevLen,res.commit);prevLen=0}
            comp[side].ko=res.state;
            paintComp(side,prevLen);
            if(shifted[side]){shifted[side]=false;renderKeys(side)}
            return;
        }
        if(ime==='ja'&&/^[a-zA-Z.,-]$/.test(k)){
            comp[side].raw+=k.toLowerCase();
            var tail=romajiTail(comp[side].raw);
            comp[side].kana=romajiToKana(comp[side].raw.slice(0,comp[side].raw.length-tail.length));
            cands[side]=[];candIdx[side]=-1;paintCands(side);
            paintComp(side,prevLen);
            if(shifted[side]){shifted[side]=false;relabelKeysOnly(side)}
            return;
        }
        flushComp(side);
        insertAt(side,k);
        if(shifted[side]&&String(k).length===1){
            shifted[side]=false;
            relabelKeysOnly(side);   // visual-only: no listener re-attachment, no full rebuild
        }
        updateAutocomplete(side);
    }
    function pickCand(side,i){
        var c=cands[side][i];if(c==null)return;
        var comping=comp[side].ko||comp[side].raw||comp[side].kana;
        if(comping){
            var cur=compText(side).length;
            comp[side]={raw:'',kana:'',ko:null};
            if(cur)replaceComp(side,cur,c);else insertAt(side,c);
        }else{
            /* Track A autocomplete: replace the fragment being typed, add a space */
            replaceComp(side,acFragLen[side]||0,c+' ');
        }
        cands[side]=[];candIdx[side]=-1;paintCands(side);
    }
    function convertJa(side){
        var kana=romajiToKana(comp[side].raw);
        if(!kana)return;
        if(cands[side].length){candIdx[side]=(candIdx[side]+1)%cands[side].length;paintCands(side);return}
        jaCandidates(kana,function(list,err){
            if(!list||!list.length){cands[side]=[kana];candIdx[side]=0;paintCands(side);return}
            if(list.indexOf(kana)<0)list.push(kana);
            cands[side]=list;candIdx[side]=0;paintCands(side);
        });
    }
    function updateClear(side){
        var inp=inputEl(side);if(!inp)return;
        var x=document.querySelector('#strip-'+side+' .clearbtn');
        if(x)x.classList.toggle('show',!!inp.value);
        inp.scrollLeft=inp.scrollWidth;
    }


/* ######## boot ######## */
    /* ================= LANGUAGE NAMES ================= */
    var LANG_NAMES={en:'English',th:'Thai',es:'Spanish',ja:'Japanese',ko:'Korean',zh:'Chinese (Simplified)',
      ar:'Arabic',hi:'Hindi',ru:'Russian',fr:'French',de:'German',it:'Italian',pt:'Portuguese',
      vi:'Vietnamese',id:'Indonesian',ms:'Malay',fil:'Filipino',nl:'Dutch',sv:'Swedish',pl:'Polish',
      tr:'Turkish',km:'Khmer',lo:'Lao'};
    var LANG_FLAGS={en:'🇺🇸',th:'🇹🇭',es:'🇪🇸',ja:'🇯🇵',ko:'🇰🇷',zh:'🇨🇳',ar:'🇸🇦',hi:'🇮🇳',ru:'🇷🇺',
      fr:'🇫🇷',de:'🇩🇪',it:'🇮🇹',pt:'🇧🇷',vi:'🇻🇳',id:'🇮🇩',ms:'🇲🇾',fil:'🇵🇭',nl:'🇳🇱',sv:'🇸🇪',
      pl:'🇵🇱',tr:'🇹🇷',km:'🇰🇭',lo:'🇱🇦'};
    var SWATCHES=['#eff6ff','#f0fdf4','#fef3c7','#fee2e2','#f3e8ff','#ffffff'];

    var MIC_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>';
    var SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
    var SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
    var GEAR_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>';
    var SEND_BIG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>';

    function buildStrip(side){
        var strip=document.getElementById('strip-'+side);
        strip.innerHTML=
            '<button type="button" class="ctl micbtn" data-on="false" data-owned="false" data-pending="false" aria-label="Speak">'+MIC_SVG+'</button>'+
            '<button type="button" class="ctl tts" data-on="false" aria-label="Read aloud">'+SPK_OFF+'</button>'+
            
            '<span class="inwrap"><input type="text" class="inp" id="in-'+side+'" inputmode="none" '+
              'autocomplete="new-password" role="presentation" placeholder="Message">'+
              '<button type="button" class="clearbtn" aria-label="Clear">✕</button></span>'+
            '<button type="button" class="ctl sendbtn" aria-label="Send">'+SEND_BIG+'</button>';

        strip.querySelector('.micbtn').addEventListener('click',function(){requestInput(side,'mic')});
        strip.querySelector('.sendbtn').addEventListener('click',function(){sendFrom(side)});
        strip.querySelector('.clearbtn').addEventListener('click',function(){
            var i=document.getElementById('in-'+side);i.value='';updateClear(side);
        });
        var tts=strip.querySelector('.tts');
        tts.addEventListener('click',function(){
            sessionTts[side]=!sessionTts[side];
            saveCfg();paintTts(side);
        });


        var inp=document.getElementById('in-'+side);
        inp.addEventListener('focus',function(){
            if(!(INPUT.owner===side&&INPUT.mode==='kb'))requestInput(side,'kb');
        });
        inp.addEventListener('input',function(){updateClear(side)});
        inp.addEventListener('keydown',function(e){
            if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFrom(side)}
        });
        paintTts(side);
    }
    function paintTts(side){
        var b=document.querySelector('#strip-'+side+' .tts');if(!b)return;
        var on=sessionTts[side];
        b.dataset.on=on?'true':'false';
        b.innerHTML=on?SPK_ON:SPK_OFF;
    }

    /* Gate 1: no room-creation, room-list, or key-entry UI lives in this file. */
    function applyRoomStyle(){
        var s=document.documentElement.style;
        s.setProperty('--sbg',ROOM.southBg||'#eff6ff');
        s.setProperty('--nbg',ROOM.northBg||'#f0fdf4');
        s.setProperty('--txt',ROOM.fontColor||'#0f172a');
        s.setProperty('--fsz',(ROOM.fontSize||15)+'px');
    }

    /* ================= BOOT ================= */
    function showNoRoomGate(){
        document.body.innerHTML =
            '<div style="height:100%;display:flex;align-items:center;justify-content:center;'+
            'padding:24px;text-align:center;font:15px -apple-system,sans-serif;color:#475569">'+
            'Open this from chat-admin.'+
            '</div>';
    }
    function boot(){
        ROOM=readRoomFromUrl();
        if(!ROOM){showNoRoomGate();return}   // Gate 2: no standalone mode
        loadHist();applyRoomStyle();

        ['south','north'].forEach(function(s){
            buildStrip(s);
            mic[s]=createMicPipeline(s,function(text,lang){
                sendFrom(s,text,true);       // keepMic: a pause is not end-of-turn
                armMicIdle(s);               // but sustained silence IS — re-arm the idle clock
            });
            var ov=document.getElementById('ask-'+s);
            ov.querySelector('.ask-ok').addEventListener('click',function(){resolveAsk(true)});
            ov.querySelector('.ask-no').addEventListener('click',function(){resolveAsk(false)});
        });

        document.getElementById('dg-close').addEventListener('click',function(){
            document.getElementById('diag-panel').classList.remove('show')});
        document.getElementById('dg-copy').addEventListener('click',function(){
            var b=this;navigator.clipboard.writeText(diagLines.slice().reverse().join('\n'))
                .then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1400)}).catch(function(){});
        });
        document.getElementById('dg-clear').addEventListener('click',function(){diagLines=[];renderDiag()});
        document.getElementById('dg-dl').addEventListener('click',function(){
            var blob=new Blob([diagLines.slice().reverse().join('\n')],{type:'text/plain'});
            var a=document.createElement('a');a.href=URL.createObjectURL(blob);
            a.download='duck-diag-'+new Date().toISOString().slice(0,19).replace(/:/g,'-')+'.txt';
            a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},3000);
        });

        renderAll();
        setTimeout(function(){try{loadFastText()}catch(e){}},1200);
        document.addEventListener('visibilitychange',function(){if(document.hidden)flushRemoteLog()});
        window.addEventListener('pagehide',flushRemoteLog);
        window.addEventListener('error',function(e){remoteLog('js_error',{msg:e.message,line:e.lineno,file:e.filename})});
        diag('chat.html ready — room='+ROOM.label+' south='+ROOM.southLang+' north='+ROOM.northLang);
        if(!dgKey())diag('no Deepgram key set — configure it in chat-admin',true);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

    if(typeof window!=="undefined"){window.INPUT=INPUT;window.mic=mic;window.requestInput=requestInput;
        window.teardown=teardown;window.acquire=acquire;window.resolveAsk=resolveAsk;window.sendFrom=sendFrom;
        Object.defineProperty(window,"pendingReq",{get:function(){return pendingReq}});
        window.detectByScript=detectByScript;window.applyNorthernThaiMap=applyNorthernThaiMap;
        window.resolveEffectiveLang=resolveEffectiveLang;window.normalizeOutgoing=normalizeOutgoing;
        window.detectLangAsync=detectLangAsync;window.loadFastText=loadFastText;
        window.sideAsRoom=sideAsRoom;window.ROOM=ROOM;window.translateWithRetry=translateWithRetry;window.press=press;window.cands=cands;window.pickCand=pickCand;window.getDict=getDict;window.updateAutocomplete=updateAutocomplete;window.comp=comp;window.langOf=langOf;window.swype=swype;window.resolveSwype=resolveSwype;window.swypeScore=swypeScore;window.keyRectsFor=keyRectsFor;window.wireKeyboard=wireKeyboard;window.haptic=haptic;
        window.renderAll=renderAll;window.debugLog=debugLog;window.MIC_IDLE_MS=MIC_IDLE_MS;
        window.dgUseDual=dgUseDual;window.dgUseMulti=dgUseMulti;window.dgLangParam=dgLangParam;
        window.dgArbitrateNative=dgArbitrateNative;window.dgArbitrateEnglish=dgArbitrateEnglish;
        window.setFtForTest=function(impl){_ft=impl;_ftFailed=!impl;_ftPromise=Promise.resolve(impl)};
        Object.defineProperty(window,"HIST",{get:function(){return HIST}});}
})();
