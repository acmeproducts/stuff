<script>
(()=>{'use strict';
const APP_VERSION='0.3.1',BUILD_ID='2026.08.11.4.9';
const FS_API='/report/api/sot/fs',PROJECT_API='/report/api/sot/projects',REPORT_API='/report/api/sot/reports';
const STATIC_PREVIEW=location.hostname.endsWith('.github.io')||location.hostname==='github.io';
const STAGES=['REGISTERED','SCANNING','HASHING','CRUNCHING','COPY_PLANNED','COPY_IN_PROGRESS','VERIFYING','VERIFIED'];
const STAGE_LABELS=['Register','Scan','Hash','Crunch','Plan','Copy','Verify','Complete'];
const HAS_DIRECTORY_PICKER=typeof window.showDirectoryPicker==='function';
const probe=document.createElement('input'),HAS_DIRECTORY_INPUT='webkitdirectory' in probe;
const state={route:'intake',projects:[],selectedToken:'',opsTab:'projects',reportMode:'aggregate',reportData:{},api:{live:false,version:'',build:'',engineReady:false,engineReason:''},fsLive:false,roots:[],debug:[],debugEnabled:localStorage.getItem('sot_portal_debug')==='1',intake:{name:'',sources:[],target:'',notes:'',review:false,idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())}};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(kind,msg,data){if(!state.debugEnabled)return;let line=`${new Date().toISOString()} ${kind} ${msg}`;if(data!==undefined){try{line+='\n'+JSON.stringify(data,null,2)}catch{}}state.debug.push(line);if(state.debug.length>1000)state.debug.splice(0,state.debug.length-1000)}
function toast(msg,type=''){const n=document.createElement('div');n.className='toast '+type;n.textContent=msg;$('#toastRoot').appendChild(n);setTimeout(()=>n.remove(),3500)}
function fmtDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}
function fmtBytes(n){if(n===null||n===undefined)return'—';n=Number(n);if(!Number.isFinite(n))return'—';if(n===0)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return`${n.toFixed(n>=10||i===0?0:1)} ${u[i]}`}
async function request(url,options={},timeout=12000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);const transport=url;log('TX',`${options.method||'GET'} ${url}`,options.body?JSON.parse(options.body):undefined);try{const r=await fetch(transport,{...options,signal:ctrl.signal,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const text=await r.text();let data={};if(text){try{data=JSON.parse(text)}catch{data={message:text}}}log('RX',`${r.status} ${url}`,data);if(!r.ok){const d=data?.detail;const msg=typeof d==='object'?(d.message||JSON.stringify(d)):(d||data.message||`HTTP ${r.status}`);throw new Error(msg)}return data}finally{clearTimeout(timer)}}
async function apiFs(path='/'){return request(`${FS_API}?path=${encodeURIComponent(path)}`)}
async function apiMkdir(parent,folder){return request(`${FS_API}/mkdir`,{method:'POST',body:JSON.stringify({parent_path:parent,folder_name:folder})},15000)}
async function checkServices(){if(STATIC_PREVIEW){state.api={live:false,version:'',build:'',engineReady:false,engineReason:'Static GitHub Pages preview'};state.fsLive=false;state.roots=[];updateChrome();return}try{const h=await request(`${PROJECT_API}/health`,{},4000);state.api={live:true,version:h.version||'',build:h.build||'',engineReady:!!h.engine_ready,engineReason:h.engine_reason||''}}catch(e){state.api={live:false,version:'',build:'',engineReady:false,engineReason:e.message}}try{const fs=await apiFs('/');if(!Array.isArray(fs.folders))throw new Error('Storage response did not contain locations');state.fsLive=true;state.roots=(fs.folders||[]).map(label=>({label,path:(fs.paths||{})[label]||label}))}catch(e){state.fsLive=false;state.roots=[];log('ERR','Storage root failed',{message:e.message})}updateChrome()}
function updateChrome(){if(STATIC_PREVIEW){$('#apiDot').className='dot';$('#fsDot').className='dot';$('#apiLabel').textContent='Static preview';$('#fsLabel').textContent='This device only';$('#sideVersion').textContent=APP_VERSION;$('#sideBuild').textContent=BUILD_ID;$('#buildPill').textContent=`UI v${APP_VERSION} · ${BUILD_ID}`;return}$('#apiDot').className='dot '+(state.api.live?'live':'dead');$('#fsDot').className='dot '+(state.fsLive?'live':'dead');$('#apiLabel').textContent=state.api.live?`SOT helper v${state.api.version}`:'SOT helper offline';$('#fsLabel').textContent=state.fsLive?`${state.roots.length} storage locations`:'Storage unavailable';$('#sideVersion').textContent=APP_VERSION;$('#sideBuild').textContent=BUILD_ID;$('#buildPill').textContent=`UI v${APP_VERSION} · ${BUILD_ID}`}
async function loadProjects(){if(!state.api.live){state.projects=[];return}const d=await request(PROJECT_API);state.projects=d.projects||[];if(state.selectedToken&&!state.projects.some(p=>p.project_token===state.selectedToken))state.selectedToken='';if(!state.selectedToken&&state.projects.length)state.selectedToken=state.projects[0].project_token}
function selected(){return state.projects.find(p=>p.project_token===state.selectedToken)||null}
function route(r){state.route=r;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));$('#pageTitle').textContent=r[0].toUpperCase()+r.slice(1);render();if(r==='reporting')loadReports().catch(e=>toast(e.message,'error'))}
function render(){if(state.route==='intake')renderIntake();else if(state.route==='operations')renderOperations();else renderReporting()}
function serviceBanner(){if(STATIC_PREVIEW)return`<div class="callout"><strong>Static preview.</strong> Server-backed WSL storage is intentionally hidden on GitHub Pages. Use This device here, or use the OpenClaw /report URL to test mounted WSL storage.</div>`;if(!state.api.live)return`<div class="callout error"><strong>SOT helper unavailable.</strong> Project creation is disabled until the existing helper responds.</div>`;if(!state.fsLive)return`<div class="callout error"><strong>Storage browser unavailable.</strong> The helper is live but no storage list was returned.</div>`;if(state.api.version!==APP_VERSION)return`<div class="callout warn"><strong>API version mismatch:</strong> UI ${esc(APP_VERSION)} · API ${esc(state.api.version)}. Builds: UI ${esc(BUILD_ID)} · API ${esc(state.api.build)}</div>`;return''}
function sourceDisplay(s){if(typeof s==='string')return s;return s.operator_label||s.current_path||s.locator||s.path||s.metadata?.directory_name||'Location'}
function sourceKey(s){if(typeof s==='string')return`wsl:${s}`;return`${s.source_type||'source'}:${s.client_source_id||s.source_fingerprint||sourceDisplay(s)}`}
function renderIntake(){const d=state.intake;if(d.review){renderIntakeReview();return}$('#content').innerHTML=`<div class="pageintro"><div><h2>Build a Source of Truth</h2><p>Start with the mess. Add every place that contains files you want reconciled. The destination comes later, after we know how much survives and how much space the SOT and its backup require.</p></div></div>${serviceBanner()}<div class="setup"><div class="card setup-card"><div class="field"><label class="label">Project name</label><input id="intakeName" class="input" value="${esc(d.name)}" placeholder="Example: DJI archive" autocomplete="off"></div><div class="setup-row"><div class="step">1</div><div><h3>Where is your stuff?</h3><p>Add every accessible location that belongs in this reconciliation.</p><div class="chips">${d.sources.length?d.sources.map((src,i)=>`<div class="chip"><span>📁</span><div class="loc">${esc(sourceDisplay(src))}</div><button data-rm-source="${i}" title="Remove">×</button></div>`).join(''):'<div class="subtle">No locations added yet.</div>'}</div><button class="btn" id="addLocations" ${state.fsLive||HAS_DIRECTORY_PICKER||HAS_DIRECTORY_INPUT?'':'disabled'}>＋ Add locations</button></div></div><div class="setup-row"><div class="step">2</div><div><h3>Destination comes after the scan</h3><p>Do not guess the target yet. First inventory and fingerprint the sources. Once we know the surviving size, choose storage with room for the SOT plus a backup and define how the SOT stays current.</p><div class="callout">SOT destination: <strong>not required for project creation.</strong></div></div></div><details class="details"><summary>Notes (optional)</summary><textarea id="intakeNotes" class="textarea" style="margin-top:8px" placeholder="Anything worth remembering about this reconciliation">${esc(d.notes)}</textarea></details><div class="setup-actions"><div class="hint">${d.sources.length} source location${d.sources.length===1?'':'s'} staged · nothing is fingerprinted yet</div><button class="btn primary" id="reviewProject" ${state.api.live&&d.sources.length?'':'disabled'}>Review project</button></div></div></div>`;bindIntake()}
function renderIntakeReview(){const d=state.intake;$('#content').innerHTML=`<div class="pageintro"><div><h2>Review project</h2><p>Nothing has been created or fingerprinted yet. This is the final check.</p></div></div>${serviceBanner()}<div class="setup"><div class="card setup-card reviewbox"><div class="reviewrow"><strong>Project name</strong><div>${esc(d.name||'Untitled')}</div></div><div class="reviewrow"><strong>Source locations · ${d.sources.length}</strong>${d.sources.map((src,i)=>`<div class="chip" style="margin-top:7px"><div class="loc">${esc(sourceDisplay(src))}</div><button data-review-rm-source="${i}" title="Remove">×</button></div>`).join('')}</div><div class="reviewrow"><strong>SOT destination</strong><div class="subtle">Not selected yet. It will be chosen after source inventory establishes required capacity and backup needs.</div></div>${d.notes?`<div class="reviewrow"><strong>Notes</strong><div>${esc(d.notes)}</div></div>`:''}<div class="setup-actions"><button class="btn" id="backToIntake">← Change project</button><div class="actions"><span class="subtle">Create = persist project + fingerprint registered sources</span><button class="btn primary" id="createProject" ${d.name&&d.sources.length?'':'disabled'}>Create project</button></div></div></div></div>`;$('#backToIntake').onclick=()=>{state.intake.review=false;renderIntake()};document.querySelectorAll('[data-review-rm-source]').forEach(b=>b.onclick=()=>{state.intake.sources.splice(Number(b.dataset.reviewRmSource),1);renderIntakeReview()});$('#createProject').onclick=createProject}
function bindIntake(){$('#intakeName').oninput=e=>{state.intake.name=e.target.value};$('#intakeNotes')?.addEventListener('input',e=>state.intake.notes=e.target.value);document.querySelectorAll('[data-rm-source]').forEach(b=>b.onclick=()=>{state.intake.sources.splice(Number(b.dataset.rmSource),1);renderIntake()});$('#addLocations').onclick=()=>openExplorer('source');$('#reviewProject').onclick=()=>{state.intake.name=$('#intakeName').value.trim();state.intake.notes=$('#intakeNotes')?.value.trim()||'';if(!state.intake.name||!state.intake.sources.length){toast('Project name and at least one source are required.','warn');return}state.intake.review=true;renderIntake()}}
async function createProject(){const d=state.intake;if(!d.name||!d.sources.length){toast('Project name and at least one source are required.','warn');return}const btn=$('#createProject');btn.disabled=true;try{const payload={project_name:d.name,sources:d.sources,target:null,notes:d.notes||null,idempotency_key:d.idempotencyKey};const res=await request(PROJECT_API,{method:'POST',headers:{'Idempotency-Key':d.idempotencyKey},body:JSON.stringify(payload)},30000);const p=res.project;state.intake={name:'',sources:[],target:'',notes:'',review:false,idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())};await loadProjects();state.selectedToken=p.project_token;state.opsTab='projects';toast(res.deduplicated?'Matching project opened.':'Project created and sources fingerprinted.');route('operations')}catch(e){btn.disabled=false;toast(`Project creation failed: ${e.message}`,'error')}}
function joinPath(base,name){return String(base).replace(/[\\/]+$/,'')+'/'+name}

function openSourceExplorer49(){
  const root=$('#modalRoot');let activeRoot=null,current=null,folders=[],files=[],history=[];let staged=[...state.intake.sources];const checked=new Set();const initialKeys=state.intake.sources.map(sourceKey).sort().join('\n');
  root.innerHTML=`<div class="modalback"><div class="modal pick49"><div class="modalhead"><div><h3>Add locations</h3><div class="subtle">Choose a location, select the whole volume or browse into folders, then add selected sources to the project.</div></div><button class="close" id="x">×</button></div><div class="pick49-grid"><aside class="pick49-pane pick49-left"><div class="pick49-title">Locations</div><div class="pick49-list" id="placesList"></div></aside><section class="pick49-pane pick49-center"><div class="pick49-toolbar"><button class="btn small" id="up" disabled>↑ Up</button><button class="btn small" id="rescan">↻ Rescan</button><div class="pick49-path" id="path">Select a location</div><button class="btn pick49-add" id="addChecked" disabled>＋ Add to project</button></div><div class="pick49-browser" id="browserList"><div class="pick49-empty"><strong>Select a location</strong>The selected volume appears here first. Check it to add the whole volume, or click its name to browse folders.</div></div><div class="pick49-status"><strong id="statusText">Nothing selected</strong><span id="itemCount">0 items</span></div></section><aside class="pick49-pane pick49-right"><div class="pick49-selected-head"><strong>Added to project <span class="badge" id="selectedCount">0</span></strong><div class="subtle">Click a source tile to add an optional note.</div></div><div class="pick49-selected" id="selectedList"></div><div class="pick49-actions"><button class="btn primary" id="saveLocations">Save selections</button><button class="btn" id="cancelLocations">Cancel</button></div></aside></div></div></div>`;
  const sourcePath=x=>typeof x==='string'?x:(x.path||x.locator||sourceDisplay(x));const sourceNote=x=>typeof x==='object'&&x?String(x.note||''):'';const makePathSource=path=>({source_type:'wsl_path',path,operator_label:path.split('/').filter(Boolean).pop()||path,note:''});const hasUnsaved=()=>staged.map(sourceKey).sort().join('\n')!==initialKeys;const close=(force=false)=>{if(!force&&hasUnsaved()&&!confirm('Discard the source selections you have not saved?'))return false;root.innerHTML='';return true};$('#x').onclick=()=>close(false);
  function stagedHasPath(path){return staged.some(x=>sourcePath(x)===path)}
  function renderPlaces(){let html='';if(!STATIC_PREVIEW&&state.fsLive)html+=state.roots.map(r=>`<button class="pick49-location ${activeRoot?.path===r.path?'active':''}" data-place="${esc(r.path)}">▣ ${esc(r.label)}<small>${esc(r.path)}</small></button>`).join('');if(HAS_DIRECTORY_PICKER||HAS_DIRECTORY_INPUT)html+=`<button class="pick49-location" id="devicePlace">▯ This device<small>Choose a browser-authorized folder</small></button>`;if(!html)html='<div class="pick49-static"><strong>No accessible locations</strong><small>Server-backed storage is not available on this host.</small></div>';$('#placesList').innerHTML=html;document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>selectVolume(state.roots.find(r=>r.path===b.dataset.place)));$('#devicePlace')?.addEventListener('click',showDeviceChoice)}
  function selectVolume(r){if(!r)return;activeRoot=r;current=r.path;history=[r.path];folders=[];files=[];checked.clear();renderPlaces();renderVolumeTile(r);updateAdd()}
  function renderVolumeTile(r){$('#path').textContent=r.path;$('#up').disabled=true;$('#statusText').textContent=r.label;$('#itemCount').textContent='1 volume';$('#browserList').innerHTML=`<div class="pick49-head"><span></span><span>Name</span><span>Type</span></div><div class="pick49-row"><input class="pick49-check" type="checkbox" data-source-check="${esc(r.path)}" ${checked.has(r.path)?'checked':''}><button class="pick49-open volume" id="openVolume">▣ ${esc(r.label)} · ${esc(r.path)}</button><span class="pick49-kind">Volume</span></div>`;$('[data-source-check]').onchange=e=>togglePath(r.path,e.target.checked);$('#openVolume').onclick=()=>load(r.path)}
  async function load(path){if(!activeRoot)return;$('#browserList').innerHTML='<div class="pick49-empty">Loading…</div>';try{const d=await apiFs(path);current=d.path||path;folders=d.folders||[];files=d.files||[];$('#path').textContent=current;$('#up').disabled=history.length<=1;renderDirectory()}catch(e){$('#browserList').innerHTML=`<div class="pick49-empty"><strong>Unable to browse</strong>${esc(e.message)}</div>`;toast(e.message,'error')}}
  function renderDirectory(){const head='<div class="pick49-head"><span></span><span>Name</span><span>Type</span></div>';const fr=folders.map(n=>{const path=joinPath(current,n);return`<div class="pick49-row"><input class="pick49-check" type="checkbox" data-source-check="${esc(path)}" ${checked.has(path)?'checked':''}><button class="pick49-open" data-drill="${esc(n)}">▱ ${esc(n)}</button><span class="pick49-kind">Folder</span></div>`}).join('');const fi=files.map(n=>`<div class="pick49-row"><span></span><span class="pick49-open" style="font-weight:500">▧ ${esc(n)}</span><span class="pick49-kind">File</span></div>`).join('');$('#browserList').innerHTML=head+(fr+fi||'<div class="pick49-empty">This folder is empty.</div>');$('#statusText').textContent=current;$('#itemCount').textContent=`${folders.length+files.length} item${folders.length+files.length===1?'':'s'}`;document.querySelectorAll('[data-source-check]').forEach(c=>c.onchange=e=>togglePath(c.dataset.sourceCheck,e.target.checked));document.querySelectorAll('[data-drill]').forEach(b=>b.onclick=async()=>{const next=joinPath(current,b.dataset.drill);history.push(next);await load(next)})}
  function togglePath(path,on){if(on)checked.add(path);else checked.delete(path);updateAdd()}function updateAdd(){const b=$('#addChecked');b.disabled=checked.size===0;b.textContent=checked.size?`＋ Add to project (${checked.size})`:'＋ Add to project'}
  function renderSelected(){$('#selectedCount').textContent=String(staged.length);$('#selectedList').innerHTML=staged.length?staged.map((src,i)=>{const full=sourcePath(src),note=sourceNote(src);return`<div class="pick49-card" data-note-index="${i}" title="${esc(full)}"><div class="pick49-card-main"><div class="pick49-card-path">${esc(full)}</div><div class="pick49-card-note">${note?esc(note):'Add optional note…'}</div></div><button class="pick49-remove" data-remove-index="${i}" title="Remove source">×</button></div>`}).join(''):'<div class="pick49-empty"><strong>Nothing added yet</strong>Selected volumes and folders will appear here.</div>';document.querySelectorAll('[data-note-index]').forEach(card=>card.onclick=e=>{if(e.target.closest('[data-remove-index]'))return;editNote(Number(card.dataset.noteIndex))});document.querySelectorAll('[data-remove-index]').forEach(b=>b.onclick=e=>{e.stopPropagation();staged.splice(Number(b.dataset.removeIndex),1);renderSelected()})}

  $('#addChecked').onclick=()=>{let added=0;for(const path of checked){if(!stagedHasPath(path)){staged.push(makePathSource(path));added++}}checked.clear();updateAdd();if(activeRoot&&history.length===1)renderVolumeTile(activeRoot);else if(activeRoot)renderDirectory();renderSelected();if(added)toast(`${added} source${added===1?'':'s'} added to project draft.`)};$('#up').onclick=async()=>{if(history.length<=1){renderVolumeTile(activeRoot);return}history.pop();if(history.length===1){renderVolumeTile(activeRoot);return}await load(history[history.length-1])};$('#rescan').onclick=()=>{if(STATIC_PREVIEW){renderPlaces();return}if(activeRoot&&history.length>1)load(current);else checkServices().then(()=>{renderPlaces();if(activeRoot){const fresh=state.roots.find(r=>r.path===activeRoot.path);if(fresh)selectVolume(fresh)}})};$('#saveLocations').onclick=()=>{state.intake.sources=staged;close(true);renderIntake();toast(`${staged.length} location${staged.length===1?'':'s'} saved to draft.`)};$('#cancelLocations').onclick=()=>close(false);
  function showDeviceChoice(){activeRoot=null;checked.clear();updateAdd();document.querySelectorAll('.pick49-location').forEach(x=>x.classList.remove('active'));$('#path').textContent='This device';$('#up').disabled=true;$('#statusText').textContent='Browser-local storage';$('#itemCount').textContent='';$('#browserList').innerHTML='<div class="pick49-empty"><strong>This device</strong><button class="btn" id="chooseDeviceFolder">Choose folder…</button><div style="margin-top:8px">Browser security requires you to authorize a folder before it can be staged.</div></div>';$('#chooseDeviceFolder').onclick=pickLocalSourceAndStage}async function pickLocalSourceAndStage(){const src=await pickLocalDeviceSource();if(src&&!staged.some(s=>sourceKey(s)===sourceKey(src))){staged.push({...src,note:''});renderSelected();toast('Device folder added to project draft.')}}
  renderPlaces();renderSelected();updateAdd();
}

function parentPath(path,root){if(path===root)return root;const parts=String(path).replace(/[\\/]+$/,'').split('/');parts.pop();return parts.join('/')||root}
function openExplorer(mode){if(mode==='source')return openSourceExplorer49();const root=$('#modalRoot');let selectedRoot=null,current=null,folders=[],files=[],history=[];let staged=mode==='source'?[...state.intake.sources]:[];const targetDefault=(state.intake.name||'SOT').trim()||'SOT';root.innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><div><h3>${mode==='source'?'Add locations':'Choose SOT workspace'}</h3><div class="subtle">${mode==='source'?'Browse on the left and center. Added locations stay visible on the right until you save them.':'Storage → optional parent folder → final SOT folder.'}</div></div><button class="close" id="x">×</button></div><div class="explorer ${mode==='source'?'three':''}"><aside class="places"><div class="places-title">Locations</div><div id="placesList"></div></aside><section class="explorer-main"><div class="explorerbar"><button class="btn small" id="up" disabled>↑ Up</button><div class="browserpath" id="path">Select a storage location</div><button class="btn small" id="rescan">↻ Rescan</button></div><div class="browserlist" id="browserList"><div class="empty"><strong>Choose a location</strong>Select storage on the left to browse its contents.</div></div><div class="explorerfoot" id="explorerFoot"></div></section>${mode==='source'?'<aside class="selectedpane"><div class="selectedhead"><strong>Added to project</strong><span class="subtle">Review before saving</span></div><div class="selectedlist" id="selectedList"></div><div class="selectedactions"><button class="btn primary" id="saveLocations">Save selections</button><button class="btn" id="cancelLocations">Cancel</button></div></aside>':''}</div></div></div>`;const initialKeys=mode==='source'?state.intake.sources.map(sourceKey).sort().join('\n'):'';const hasUnsaved=()=>mode==='source'&&staged.map(sourceKey).sort().join('\n')!==initialKeys;const close=(force=false)=>{if(!force&&hasUnsaved()&&!confirm('Discard the source selections you have not saved?'))return false;root.innerHTML='';return true};$('#x').onclick=()=>close(false);function renderPlaces(){const rows=state.roots.map(r=>`<button class="place ${selectedRoot?.path===r.path?'active':''}" data-place="${esc(r.path)}">💽 ${esc(r.label)}<small>${esc(r.path)}</small></button>`).join('');const local=(HAS_DIRECTORY_PICKER||HAS_DIRECTORY_INPUT)?`<button class="place" id="devicePlace">📱 This device<small>Local browser storage</small></button>`:'';$('#placesList').innerHTML=rows+local;document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>selectRoot(state.roots.find(r=>r.path===b.dataset.place)));$('#devicePlace')?.addEventListener('click',()=>mode==='source'?pickLocalSourceAndStage():pickLocalTargetAndClose())}function renderSelected(){if(mode!=='source')return;$('#selectedList').innerHTML=staged.length?staged.map((src,i)=>`<div class="selecteditem"><div class="loc">${esc(sourceDisplay(src))}</div><button data-unselect="${i}" title="Remove">×</button></div>`).join(''):'<div class="empty"><strong>Nothing added yet</strong>Use “Add this folder” or choose local device storage.</div>';document.querySelectorAll('[data-unselect]').forEach(b=>b.onclick=()=>{staged.splice(Number(b.dataset.unselect),1);renderSelected()})}async function selectRoot(r){selectedRoot=r;current=r.path;history=[current];renderPlaces();await load(current)}async function load(path){if(!selectedRoot)return;$('#browserList').innerHTML='<div class="empty">Loading…</div>';try{const d=await apiFs(path);current=d.path||path;folders=d.folders||[];files=d.files||[];$('#path').textContent=current;$('#up').disabled=history.length<=1;const fr=folders.map(n=>`<div class="row folder" data-folder="${esc(n)}"><span>📁</span><span class="name">${esc(n)}</span><span class="kind">Folder</span>${mode==='source'?`<button class="btn small folder-add" data-add-folder="${esc(n)}" title="Add this folder to the project">＋ Add</button>`:'<span></span>'}</div>`).join('');const fi=files.map(n=>`<div class="row"><span>📄</span><span class="name">${esc(n)}</span><span class="kind">File</span></div>`).join('');$('#browserList').innerHTML=fr+fi||'<div class="empty">This folder is empty.</div>';document.querySelectorAll('[data-folder]').forEach(row=>{row.ondblclick=async e=>{if(e.target.closest('[data-add-folder]'))return;const next=joinPath(current,row.dataset.folder);history.push(next);await load(next)};row.onclick=async e=>{if(e.target.closest('[data-add-folder]'))return;const next=joinPath(current,row.dataset.folder);history.push(next);await load(next)}});document.querySelectorAll('[data-add-folder]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const src=joinPath(current,btn.dataset.addFolder);if(src&&!staged.some(x=>sourceKey(x)===sourceKey(src))){staged.push(src);renderSelected();toast('Folder added to project draft.')}});renderFoot()}catch(e){$('#browserList').innerHTML=`<div class="empty"><strong>Unable to browse</strong>${esc(e.message)}</div>`;toast(e.message,'error')}}function renderFoot(){if(mode==='source'){$('#explorerFoot').innerHTML=`<div class="line"><div><strong>${esc(current||'Choose a folder')}</strong><div class="subtle">Adding only stages the location. Fingerprinting does not happen until the project is created.</div></div><button class="btn" id="addCurrent" ${current?'':'disabled'}>＋ Add current folder to project</button></div>`;$('#addCurrent').onclick=()=>{const src=current;if(src&&!staged.some(s=>sourceKey(s)===sourceKey(src))){staged.push(src);renderSelected();toast('Location staged.')}}}else{$('#explorerFoot').innerHTML=`<div class="line"><div class="target-name"><label class="label">Final SOT folder</label><input class="input" id="sotFolder" value="${esc(targetDefault)}" placeholder="SOT folder name"><div class="target-preview" id="preview"></div></div><button class="btn primary" id="useTarget" ${current?'':'disabled'}>Use workspace</button></div>`;const update=()=>{$('#preview').textContent=current?`${current}  →  ${joinPath(current,$('#sotFolder').value.trim()||'…')}`:'Choose storage first.'};$('#sotFolder').oninput=update;update();$('#useTarget').onclick=async()=>{const name=$('#sotFolder').value.trim();if(!name){toast('Final SOT folder name is required.','warn');return}try{const result=await apiMkdir(current,name);state.intake.target=result.path;close();renderIntake();toast(result.created?'SOT workspace created.':'Existing folder selected as SOT workspace.')}catch(e){toast(`Workspace failed: ${e.message}`,'error')}}}}$('#up').onclick=async()=>{if(history.length<=1)return;history.pop();await load(history[history.length-1])};$('#rescan').onclick=()=>current?load(current):checkServices().then(()=>{renderPlaces()});if(mode==='source'){$('#saveLocations').onclick=()=>{state.intake.sources=staged;close(true);renderIntake();toast(`${staged.length} location${staged.length===1?'':'s'} saved to draft.`)};$('#cancelLocations').onclick=()=>close(false)}renderPlaces();renderSelected();renderFoot();async function pickLocalSourceAndStage(){const src=await pickLocalDeviceSource();if(src&&!staged.some(s=>sourceKey(s)===sourceKey(src))){staged.push(src);renderSelected();toast('Device location staged.')}}async function pickLocalTargetAndClose(){if(!HAS_DIRECTORY_PICKER){toast('This browser cannot authorize a writable local target.','warn');return}const name=(prompt('Final SOT folder name:',targetDefault)||'').trim();if(!name)return;try{const handle=await window.showDirectoryPicker({mode:'readwrite'});let perm='granted';if(handle.requestPermission)perm=await handle.requestPermission({mode:'readwrite'});if(perm!=='granted'){toast('Write permission was not granted.','warn');return}await handle.getDirectoryHandle(name,{create:true});const rec=await saveLocalHandle(handle,'target');state.intake.target=`device-target://${rec.id}/${encodeURIComponent(handle.name)}/${encodeURIComponent(name)}`;close();renderIntake();toast('Local-device SOT workspace registered.')}catch(e){if(e?.name!=='AbortError')toast(`Device target failed: ${e.message}`,'error')}}}
const DEVICE_DB='sot-portal-device-locations-v3',DEVICE_STORE='handles';
function openDeviceDb(){return new Promise((resolve,reject)=>{const q=indexedDB.open(DEVICE_DB,1);q.onupgradeneeded=()=>{const db=q.result;if(!db.objectStoreNames.contains(DEVICE_STORE))db.createObjectStore(DEVICE_STORE,{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function allDeviceRecords(){const db=await openDeviceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readonly'),q=tx.objectStore(DEVICE_STORE).getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error);tx.oncomplete=()=>db.close()})}
async function saveLocalHandle(handle,kind='source',extra={}){for(const r of await allDeviceRecords()){try{if(r.handle&&r.handle.isSameEntry&&await r.handle.isSameEntry(handle)&&r.kind===kind){const u={...r,handle,name:handle.name,kind,...extra,savedAt:new Date().toISOString()};const db=await openDeviceDb();await new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readwrite');tx.objectStore(DEVICE_STORE).put(u);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)});return u}}catch{}}const id=crypto.randomUUID?crypto.randomUUID():`DEV-${Date.now()}-${Math.random().toString(36).slice(2)}`;const r={id,handle,name:handle.name,kind,...extra,savedAt:new Date().toISOString()};const db=await openDeviceDb();await new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readwrite');tx.objectStore(DEVICE_STORE).put(r);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>reject(tx.error)});return r}
async function sha256Json(v){const b=new TextEncoder().encode(JSON.stringify(v));const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function enumerateDirectoryHandle(h){let folders=0,files=0,total=0;const sample=[];for await(const e of h.values()){if(e.kind==='directory'){folders++;if(sample.length<512)sample.push(['d',e.name,0,0])}else{files++;try{const f=await e.getFile();total+=f.size;if(sample.length<512)sample.push(['f',e.name,f.size,f.lastModified])}catch{}}}sample.sort((a,b)=>String(a[1]).localeCompare(String(b[1])));const metadata={directory_name:h.name,top_level_folders:folders,top_level_files:files,top_level_bytes:total,sample};return{metadata,source_fingerprint:await sha256Json(metadata)}}
async function pickDirectoryInput(){return new Promise(resolve=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.setAttribute('webkitdirectory','');i.style.display='none';document.body.appendChild(i);i.onchange=()=>{const f=[...(i.files||[])];i.remove();resolve(f)};i.oncancel=()=>{i.remove();resolve([])};i.click()})}
async function pickLocalDeviceSource(){try{if(HAS_DIRECTORY_PICKER){const h=await window.showDirectoryPicker({mode:'read'}),e=await enumerateDirectoryHandle(h),r=await saveLocalHandle(h,'source',{fingerprint:e.source_fingerprint,metadata:e.metadata});return{source_type:'browser_local',client_source_id:r.id,operator_label:h.name,locator:`device://${r.id}/${encodeURIComponent(h.name)}`,source_fingerprint:e.source_fingerprint,metadata:e.metadata}}if(HAS_DIRECTORY_INPUT){const files=await pickDirectoryInput();if(!files.length)return null;const root=(files[0].webkitRelativePath||files[0].name).split('/')[0]||'Local folder';let total=0;const sample=[];for(const f of files){total+=f.size;if(sample.length<512)sample.push([f.webkitRelativePath||f.name,f.size,f.lastModified])}const metadata={directory_name:root,file_count:files.length,total_bytes:total,sample};const fp=await sha256Json(metadata),id=crypto.randomUUID?crypto.randomUUID():`DEV-${Date.now()}`;return{source_type:'browser_local',client_source_id:id,operator_label:root,locator:`device://${id}/${encodeURIComponent(root)}`,source_fingerprint:fp,metadata}}toast('No local directory picker is available.','warn');return null}catch(e){if(e?.name!=='AbortError')toast(`Local folder failed: ${e.message}`,'error');return null}}
function projectSelector(){return`<div class="projectbar"><select id="projectSelect" class="select"><option value="">Select project…</option>${state.projects.map(p=>`<option value="${esc(p.project_token)}" ${p.project_token===state.selectedToken?'selected':''}>${esc(p.project_name)} · ${esc(p.project_token.slice(-8))}</option>`).join('')}</select><button class="btn small" id="newProject">＋ New project</button></div>`}
function renderOperations(){const p=selected();$('#content').innerHTML=`<div class="pageintro"><div><h2>Operations</h2><p>Manage projects, see the current state at a glance, or inspect the details.</p></div>${projectSelector()}</div>${serviceBanner()}<div class="tabs"><button class="tab ${state.opsTab==='projects'?'active':''}" data-opstab="projects">Projects</button><button class="tab ${state.opsTab==='status'?'active':''}" data-opstab="status">Status</button><button class="tab ${state.opsTab==='detail'?'active':''}" data-opstab="detail">Detail</button></div>${p?operationsBody(p):'<div class="card empty"><strong>No project selected</strong>Create a project in Intake or select an existing one.</div>'}`;$('#projectSelect')?.addEventListener('change',e=>{state.selectedToken=e.target.value;renderOperations()});$('#newProject').onclick=()=>route('intake');document.querySelectorAll('[data-opstab]').forEach(b=>b.onclick=()=>{state.opsTab=b.dataset.opstab;renderOperations()});if(p)bindOperations(p)}
function operationsBody(p){if(state.opsTab==='projects')return projectManagement(p);if(state.opsTab==='status')return statusPanel(p);return detailPanel(p)}
function projectManagement(p){const src=p.sources||[];return`<div class="card panel"><div class="project-head"><div><h2>${esc(p.project_name)}</h2><div class="meta"><span class="badge">${esc(p.status)}</span><span class="token">${esc(p.project_token)}</span></div></div><div class="actions"><button class="btn small" id="renameProject">Rename</button><button class="btn danger small" id="deleteProject">Delete</button></div></div><div class="manage-grid section"><div><div class="sectionhead"><h3>Source locations</h3><button class="btn small" id="addProjectSource">＋ Add</button></div><div class="list">${src.length?src.map(s=>`<div class="item"><strong>${esc(s.operator_label||'Source')}</strong><code>${esc(s.current_path||s.locator||'')}</code><button class="btn danger small" data-remove-source="${esc(s.source_id)}" style="margin-top:7px">Remove</button></div>`).join(''):'<div class="subtle">No source locations.</div>'}</div></div><div><div class="sectionhead"><h3>SOT destination</h3></div>${p.target_path?`<div class="item"><strong>Assigned destination</strong><code>${esc(p.target_path)}</code></div>`:'<div class="callout"><strong>Not chosen yet.</strong><br>First inventory the sources and determine the surviving size. Then choose primary SOT storage together with its backup and ongoing update method.</div>'}</div></div></div>`}
function statusPanel(p){const idx=Math.max(0,STAGES.indexOf(p.current_stage||p.status));return`<div class="card panel"><div class="project-head"><div><h2>${esc(p.project_name)}</h2><div class="meta"><span class="badge">${esc(p.status)}</span><span>Updated ${esc(fmtDate(p.updated_at))}</span></div></div></div><div class="stagewrap section"><div class="stagebar">${STAGES.map((s,i)=>`<div class="stage ${i===idx?'active':''}"><div class="stagedot">${i+1}</div><div class="stagelabel">${STAGE_LABELS[i]}</div></div>`).join('')}</div></div><div class="status-actions">${engineButtons(p)}</div>${state.api.engineReady?'':'<div class="callout warn" style="margin-top:13px"><strong>Execution engine not active.</strong> Project setup is available; scan/copy controls remain disabled until sotctl is implemented.</div>'}</div>`}
function engineButtons(p){const dis=state.api.engineReady?'':'disabled';return`<button class="btn primary" data-engine="start" ${dis}>▶ Start</button><button class="btn" data-engine="pause" ${dis}>Ⅱ Pause</button><button class="btn" data-engine="restart" ${dis}>↺ Retry / restart</button>`}
function detailPanel(p){const src=p.sources||[];return`<div class="card panel"><div class="project-head"><div><h2>${esc(p.project_name)}</h2><div class="meta"><span class="token">${esc(p.project_token)}</span><span>Created ${esc(fmtDate(p.created_at))}</span></div></div></div><div class="manage-grid section"><div><h3>Sources</h3><div class="list">${src.map(s=>`<div class="item"><strong>${esc(s.operator_label||s.source_id)}</strong><code>${esc(s.current_path||'')}</code><div class="subtle">${esc(s.source_type||'wsl_path')} · ${esc(s.status||'')}</div></div>`).join('')||'<div class="subtle">None</div>'}</div></div><div><h3>Project</h3><div class="item"><strong>Target</strong><code>${esc(p.target_path||'—')}</code></div><div class="item" style="margin-top:7px"><strong>Current run</strong><code>${esc(p.current_run_id||'—')}</code></div></div></div></div>`}
function bindOperations(p){$('#renameProject')?.addEventListener('click',()=>renameProject(p));$('#deleteProject')?.addEventListener('click',()=>deleteProject(p));$('#addProjectSource')?.addEventListener('click',()=>openProjectSourceExplorer(p));document.querySelectorAll('[data-remove-source]').forEach(b=>b.onclick=()=>removeProjectSource(p,b.dataset.removeSource));document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>runEngine(p,b.dataset.engine))}
async function renameProject(p){const n=(prompt('Project name:',p.project_name)||'').trim();if(!n||n===p.project_name)return;try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}`,{method:'PATCH',body:JSON.stringify({project_name:n})});await loadProjects();renderOperations();toast('Project renamed.')}catch(e){toast(e.message,'error')}}
async function deleteProject(p){if(!confirm(`Delete project metadata for “${p.project_name}”?\n\nSource files are not deleted.`))return;try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}`,{method:'DELETE'});state.selectedToken='';await loadProjects();renderOperations();toast('Project deleted.')}catch(e){toast(e.message,'error')}}
async function removeProjectSource(p,id){if(!confirm('Remove this source from the project? Source files are not deleted.'))return;try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}/sources/${encodeURIComponent(id)}`,{method:'DELETE'});await loadProjects();renderOperations();toast('Source removed.')}catch(e){toast(e.message,'error')}}
function openProjectSourceExplorer(p){const saved=state.intake;state.intake={name:p.project_name,sources:[],target:p.target_path||'',notes:'',idempotencyKey:''};openExplorer('source');const timer=setInterval(async()=>{if(!$('#modalRoot .modal')){clearInterval(timer);const added=state.intake.sources;state.intake=saved;for(const src of added){try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}/sources`,{method:'POST',body:JSON.stringify(typeof src==='string'?{path:src}:{...src})},20000)}catch(e){toast(`Add source failed: ${e.message}`,'error')}}await loadProjects();renderOperations()}},250)}
function openProjectTargetExplorer(p){const saved=state.intake;state.intake={name:p.project_name,sources:[],target:p.target_path||'',notes:'',idempotencyKey:''};openExplorer('target');const timer=setInterval(async()=>{if(!$('#modalRoot .modal')){clearInterval(timer);const target=state.intake.target;state.intake=saved;if(target&&target!==p.target_path){try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}`,{method:'PATCH',body:JSON.stringify({target})});await loadProjects();renderOperations();toast('Workspace changed.')}catch(e){toast(e.message,'error')}}}},250)}
async function runEngine(p,op){if(!state.api.engineReady){toast('Execution engine is not active.','warn');return}try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}/${op}`,{method:'POST',body:'{}'},30000);await loadProjects();renderOperations()}catch(e){toast(e.message,'error')}}
async function loadReports(){if(!state.api.live)return;if(state.reportMode==='aggregate')state.reportData.aggregate=await request(`${REPORT_API}/aggregate`);else if(state.reportMode==='timeline')state.reportData.timeline=await request(`${REPORT_API}/timeline`);else if(state.selectedToken)state.reportData.detail=await request(`${PROJECT_API}/${encodeURIComponent(state.selectedToken)}/report`);renderReporting()}
function renderReporting(){$('#content').innerHTML=`<div class="pageintro"><div><h2>Reporting</h2><p>Reporting is intentionally conservative until real reconciliation runs exist. Current views show only authoritative project metadata and events.</p></div>${projectSelector()}</div>${serviceBanner()}<div class="tabs"><button class="tab ${state.reportMode==='aggregate'?'active':''}" data-report="aggregate">Overview</button><button class="tab ${state.reportMode==='timeline'?'active':''}" data-report="timeline">Timeline</button><button class="tab ${state.reportMode==='detail'?'active':''}" data-report="detail">Project detail</button></div><div id="reportBody">${reportHtml()}</div>`;$('#projectSelect')?.addEventListener('change',e=>{state.selectedToken=e.target.value;if(state.reportMode==='detail')loadReports();else renderReporting()});$('#newProject').onclick=()=>route('intake');document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{state.reportMode=b.dataset.report;loadReports().catch(e=>toast(e.message,'error'))})}
function reportHtml(){if(!state.api.live)return'<div class="card empty"><strong>SOT helper offline</strong></div>';if(state.reportMode==='aggregate'){const a=state.reportData.aggregate;if(!a)return'<div class="empty">Loading…</div>';return`<div class="stats">${stat('Projects',a.projects_total)}${stat('Sources',a.sources_total)}${stat('Runs',a.runs_total)}${stat('Events',a.events_total)}</div><div class="callout section">Byte-level reconciliation metrics remain blank until the deterministic engine produces them.</div>`}if(state.reportMode==='timeline'){const rows=state.reportData.timeline?.events||[];return`<div class="card panel"><div class="timeline">${rows.length?rows.map(e=>`<div class="event"><div>${esc(fmtDate(e.timestamp))}</div><div><strong>${esc(e.event_type)}</strong></div><div>${esc(e.project_name||e.project_token)}<br><span class="subtle">${esc(e.message||'')}</span></div></div>`).join(''):'<div class="empty">No events yet.</div>'}</div></div>`}const d=state.reportData.detail,p=d?.project;if(!p)return'<div class="card empty"><strong>Select a project</strong></div>';return`<div class="card panel"><h3>${esc(p.project_name)}</h3><div class="manage-grid"><div><div class="item"><strong>Token</strong><code>${esc(p.project_token)}</code></div><div class="item" style="margin-top:7px"><strong>Status</strong><code>${esc(p.status)}</code></div></div><div><div class="item"><strong>Sources</strong><code>${esc((d.sources||[]).length)}</code></div><div class="item" style="margin-top:7px"><strong>Targets</strong><code>${esc((d.targets||[]).length)}</code></div></div></div></div>`}
function stat(k,v){return`<div class="card stat"><div class="k">${esc(k)}</div><div class="v">${esc(v??0)}</div></div>`}
function openSettings(){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal" style="width:min(760px,100%);overflow:auto"><div class="modalhead"><h3>Settings & diagnostics</h3><button class="close" id="settingsX">×</button></div><div class="panel"><div class="manage-grid"><div class="item"><strong>UI</strong><code>${APP_VERSION} · ${BUILD_ID}</code></div><div class="item"><strong>API</strong><code>${esc(state.api.version||'offline')} · ${esc(state.api.build||'offline')}</code></div></div><div class="item section"><strong>Storage locations</strong><code>${esc(state.roots.map(r=>`${r.label} ${r.path}`).join('\n')||'none')}</code></div><label class="label section"><input type="checkbox" id="debugToggle" ${state.debugEnabled?'checked':''}> Debug logging</label>${state.debugEnabled?`<div class="code">${esc(state.debug.join('\n\n')||'No debug entries yet.')}</div>`:''}</div></div></div>`;$('#settingsX').onclick=()=>$('#modalRoot').innerHTML='';$('#debugToggle').onchange=e=>{state.debugEnabled=e.target.checked;localStorage.setItem('sot_portal_debug',e.target.checked?'1':'0');openSettings()}}
async function refresh(){await checkServices();await loadProjects();render()}
function setSidebarCollapsed(v){document.querySelector('.app').classList.toggle('nav-collapsed',!!v);localStorage.setItem('sot_nav_collapsed',v?'1':'0');$('#sidebarToggle').title=v?'Expand navigation':'Collapse navigation';$('#sidebarToggle').setAttribute('aria-label',v?'Expand navigation':'Collapse navigation')}
const initialSidebarCollapsed=localStorage.getItem('sot_nav_collapsed')==='1';setSidebarCollapsed(initialSidebarCollapsed);$('#sidebarToggle').onclick=()=>setSidebarCollapsed(!document.querySelector('.app').classList.contains('nav-collapsed'));
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));$('#refreshBtn').onclick=()=>refresh().catch(e=>toast(e.message,'error'));$('#settingsBtn').onclick=openSettings;refresh().catch(e=>toast(e.message,'error'));
})();
</script>
</body>
