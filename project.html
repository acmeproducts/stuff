<body><button class="hamburger" id="hamburger" title="Toggle navigation" aria-label="Toggle navigation">☰</button><div class="brand">SOT Project</div><div class="app" id="app"><aside class="sidebar"><nav class="nav" id="nav"></nav></aside><main class="main"><header class="topbar"><h1 id="topTitle">Configuration</h1><span class="buildpill" id="build"></span></header><div class="content" id="content"></div></main></div><div id="modalRoot"></div><div class="toastWrap" id="toasts"></div>
<script>
'use strict';
const VERSION='0.3.1',BUILD='2026.08.12.5.2',LOCAL=location.hostname.endsWith('.github.io'),API='/report/api/sot';
const ROUTES=[['configuration','⚙','Configuration'],['setup','＋','Project Setup'],['operations','▶','Project Operations'],['database','▦','Database Administration'],['build','⇢','SOT Build & Promotion'],['reporting','≡','Reporting']];
const state={route:'configuration',config:null,projects:[],selected:null,showDeleted:false,draft:{name:'',notes:'',sources:[]},roots:[],apiLive:false};const sessionFiles=new Map();const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,b=false){const d=document.createElement('div');d.className='toast'+(b?' bad':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3200)}function uid(){const a=new Uint8Array(12);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('')}function now(){return new Date().toISOString()}function fmtBytes(n){n=Number(n||0);if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`}
function renderNav(){$('#nav').innerHTML=ROUTES.map(([r,i,l])=>`<button data-route="${r}" class="${state.route===r?'active':''}" title="${esc(l)}"><span>${i}</span><span class="label">${esc(l)}</span></button>`).join('');$$('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route))}function route(r){state.route=r;$('#topTitle').textContent=ROUTES.find(x=>x[0]===r)?.[2]||'SOT';renderNav();render();if(innerWidth<=700)$('#app').classList.remove('mobile-open')}function toggleNav(){if(innerWidth<=700)$('#app').classList.toggle('mobile-open');else{$('#app').classList.toggle('nav-collapsed');localStorage.setItem('sot_nav_collapsed',$('#app').classList.contains('nav-collapsed')?'1':'0')}}$('#hamburger').onclick=toggleNav;if(innerWidth>700&&localStorage.getItem('sot_nav_collapsed')==='1')$('#app').classList.add('nav-collapsed');$('#build').textContent=`UI v${VERSION} · ${BUILD} · ${LOCAL?'Mobile/Pages':'WSL'}`;
function shell(t,d,b){$('#content').innerHTML=`<div class="pagehead"><h2>${esc(t)}</h2><p>${esc(d)}</p></div>${b}`}
// IndexedDB local authority
let idb=null;function openLocal(){if(idb)return Promise.resolve(idb);return new Promise((res,rej)=>{const q=indexedDB.open('sot-local-v1',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('config'))d.createObjectStore('config');if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'project_token'})};q.onsuccess=()=>{idb=q.result;res(idb)};q.onerror=()=>rej(q.error)})}async function idbGet(store,key){const d=await openLocal();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}async function idbPut(store,val,key){const d=await openLocal();return new Promise((res,rej)=>{const os=d.transaction(store,'readwrite').objectStore(store),q=key===undefined?os.put(val):os.put(val,key);q.onsuccess=()=>res(val);q.onerror=()=>rej(q.error)})}async function idbAll(store){const d=await openLocal();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d}
async function loadProjects(){if(LOCAL)state.projects=(await idbAll('projects')).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));else state.projects=await api('/projects?include_deleted=1')}async function saveLocalProject(p){p.updated_at=now();await idbPut('projects',p);await loadProjects();return p}async function getProject(t){return LOCAL?idbGet('projects',t):api('/projects/'+encodeURIComponent(t))}
async function boot(){renderNav();if(LOCAL){await openLocal();state.config=await idbGet('config','main')||{mode:'browser',database_path:'IndexedDB://sot-local-v1',database_backup_path:'',schema_version:1,created_at:now()};await idbPut('config',state.config,'main');state.apiLive=true;await loadProjects()}else{try{await api('/health');state.apiLive=true;state.config=await api('/config');await loadProjects();const r=await api('/fs?path=/');state.roots=r.locations||[]}catch(e){state.apiLive=false}}render()}
function render(){({configuration:renderConfig,setup:renderSetup,operations:renderOps,database:renderDatabase,build:renderBuild,reporting:renderReporting}[state.route]||renderConfig)()}
// Configuration
let cfgBrowseTarget='db',cfgPath='';async function renderConfig(){const c=state.config||{};shell('Configuration','Choose the project database location. On GitHub Pages/mobile the database is IndexedDB and is created automatically if it does not exist; on WSL the configured SQLite file is created automatically if missing.',`${LOCAL?'<div class="callout good">Mobile/Pages mode: this device is a complete project host. Project metadata is stored persistently in browser IndexedDB. WSL is optional and only improves access/throughput for attached drives.</div>':state.apiLive?'<div class="callout good">WSL mode: connected to the existing SOT server.</div>':'<div class="callout bad">WSL SOT API is not reachable.</div>'}<div class="card panel" style="margin-top:10px"><div class="grid2"><div class="field"><label class="label">Project database</label><div class="configRow"><input class="input mono" id="dbPath" value="${esc(c.database_path||'')}" ${LOCAL?'readonly':''}><button class="btn" id="browseDb">Browse</button></div></div><div class="field"><label class="label">Backup / export folder</label><div class="configRow"><input class="input mono" id="backupPath" value="${esc(c.database_backup_path||'')}" placeholder="Choose a folder"><button class="btn" id="browseBackup">Browse</button></div></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveValidate">Save & validate / create if missing</button><button class="btn" id="integrity">Integrity check</button></div><div id="cfgStatus" style="margin-top:9px"></div><div id="cfgBrowser"></div></div>`);$('#browseDb').onclick=()=>openConfigBrowser('db');$('#browseBackup').onclick=()=>openConfigBrowser('backup');$('#saveValidate').onclick=saveConfig;$('#integrity').onclick=integrityConfig}
async function saveConfig(){try{if(LOCAL){const c={...state.config,mode:'browser',database_path:'IndexedDB://sot-local-v1',database_backup_path:$('#backupPath').value.trim(),schema_version:1,updated_at:now()};await openLocal();await idbPut('config',c,'main');state.config=c;$('#cfgStatus').innerHTML='<div class="callout good">Validated. Local SOT database exists and is writable.</div>'}else{const c=await api('/config',{method:'POST',body:JSON.stringify({database_path:$('#dbPath').value.trim(),database_backup_path:$('#backupPath').value.trim(),create_if_missing:true})});state.config=c;$('#cfgStatus').innerHTML='<div class="callout good">Validated. SQLite database exists and is writable.</div>'}}catch(e){$('#cfgStatus').innerHTML=`<div class="callout bad">${esc(e.message)}</div>`}}
async function integrityConfig(){try{if(LOCAL){await idbPut('config',{...state.config,last_integrity_at:now()},'main');const n=(await idbAll('projects')).length;$('#cfgStatus').innerHTML=`<div class="callout good">IndexedDB integrity/read-write check passed · ${n} project(s).</div>`}else{const x=await api('/config/integrity');$('#cfgStatus').innerHTML=`<div class="callout ${x.ok?'good':'bad'}">Integrity: ${esc(x.result||x.status)}</div>`}}catch(e){toast(e.message,true)}}
async function openConfigBrowser(target){cfgBrowseTarget=target;if(LOCAL){const picked=await pickDirectoryFiles(false);if(!picked)return;const val='device://'+picked.root;if(target==='backup')$('#backupPath').value=val;else $('#dbPath').value='IndexedDB://sot-local-v1';$('#cfgBrowser').innerHTML=`<div class="folderPick"><div class="folderPickHead"><div class="folderPickPath mono">${esc(val)}</div></div><div class="folderList">${folderRowsFromFiles(picked.files,picked.root,'')}</div></div>`;return}cfgPath='/';renderCfgServerBrowser();await cfgServerLoad('/')}
function renderCfgServerBrowser(){$('#cfgBrowser').innerHTML=`<div class="folderPick"><div class="folderPickHead"><button class="btn" id="cfgUp">↑ Up</button><div class="folderPickPath mono" id="cfgPath">${esc(cfgPath)}</div><button class="btn primary" id="cfgUse">Use folder</button></div><div class="folderList" id="cfgList"></div></div>`;$('#cfgUp').onclick=()=>{const p=cfgPath.split('/').filter(Boolean);p.pop();cfgServerLoad('/'+p.join('/'))};$('#cfgUse').onclick=()=>{if(cfgBrowseTarget==='db')$('#dbPath').value=(cfgPath.replace(/\/$/,'')||'')+'/sot.sqlite';else $('#backupPath').value=cfgPath}}
async function cfgServerLoad(p){try{const d=await api('/fs?path='+encodeURIComponent(p));cfgPath=d.path||p;$('#cfgPath').textContent=cfgPath;$('#cfgList').innerHTML=(d.folders||[]).map(n=>`<div class="folderRow"><button data-folder="${esc(n)}">▱ ${esc(n)}</button><span class="folderKind">Folder</span></div>`).join(')||'<div class="empty">No folders</div>';$$('[data-folder]').forEach(b=>b.onclick=()=>cfgServerLoad((cfgPath.replace(/\/$/,'')||'')+'/'+b.dataset.folder))}catch(e){toast(e.message,true)}}
function pickDirectoryFiles(requireFiles=true){return new Promise(resolve=>{const i=document.createElement('input');i.type='file';i.webkitdirectory=true;i.multiple=true;i.onchange=()=>{const files=[...(i.files||[])];if(requireFiles&&!files.length){resolve(null);return}const first=files[0]?.webkitRelativePath||files[0]?.name||'Selected folder',root=first.split('/')[0]||'Selected folder';resolve({root,files})};i.click()})}function folderRowsFromFiles(files,root,prefix){const seen=new Set();for(const f of files){const rel=(f.webkitRelativePath||f.name).split('/').slice(1);if(prefix){const parts=prefix.split('/').filter(Boolean);if(parts.some((x,i)=>rel[i]!==x))continue;rel.splice(0,parts.length)}if(rel.length>1)seen.add(rel[0])}return[...seen].sort().map(n=>`<div class="folderRow"><button>▱ ${esc(n)}</button><span class="folderKind">Folder</span></div>`).join(')||'<div class="empty">Folder selected</div>'}
// Project Setup

function renderSourceCenterRoot(){const loc='device://'+browserCtx.root;$('#sourcePath').textContent=loc;$('#sourceUp').disabled=true;$('#sourcePane').innerHTML=`<div class="sourceHead"><span></span><span>Name / path</span><span>Type</span></div><div class="sourceRow"><input class="sourceCheck" type="checkbox" data-local-check="${esc(loc)}"><button class="sourceOpen" id="openLocalRoot" title="${esc(loc)}">▣ ${esc(browserCtx.root)}</button><span class="sourceKind">Folder</span></div>`;$('#openLocalRoot').onclick=()=>{browserCtx.prefix='';renderLocalDir()};$$('[data-local-check]').forEach(c=>c.onchange=e=>setChecked(loc,{source_type:'browser_local',locator:loc,operator_label:browserCtx.root,note:'',prefix:''},e.target.checked));$('#sourceUp').onclick=localUp;updateAdd()}

function localUp(){if(!browserCtx.prefix){renderSourceCenterRoot();return}const p=browserCtx.prefix.split('/');p.pop();browserCtx.prefix=p.join('/');renderLocalDir()}function setChecked(k,obj,on){on?browserCtx.checked.set(k,obj):browserCtx.checked.delete(k);updateAdd()}function updateAdd(){const b=$('#addSelected');if(!b)return;b.disabled=!browserCtx.checked.size;b.textContent=browserCtx.checked.size?`＋ Add selected (${browserCtx.checked.size})`:'＋ Add selected';b.onclick=()=>{for(const s of browserCtx.checked.values()){if(!state.draft.sources.some(x=>(x.locator||x.path)===(s.locator||s.path))){const files=s.source_type==='browser_local'?filesForSource(s):[];s.file_count=files.length;s.byte_size=files.reduce((a,f)=>a+Number(f.size||0),0);state.draft.sources.push({...s})}}browserCtx.checked.clear();renderStage();updateAdd()}}
function filesForSource(s){const all=sessionFiles.get('device://'+browserCtx.root)||browserCtx.files||[];if(!s.prefix)return all;const parts=s.prefix.split('/').filter(Boolean);return all.filter(f=>{const rel=(f.webkitRelativePath||f.name).split('/').slice(1);return parts.every((x,i)=>rel[i]===x)})}

let serverRoot=null,serverCurrent='';async function serverSelectRoot(r){serverRoot=r;serverCurrent=r.path;browserCtx.checked=new Map();$('#sourcePath').textContent=r.path;$('#sourceUp').disabled=true;$('#sourcePane').innerHTML=`<div class="sourceHead"><span></span><span>Name / path</span><span>Type</span></div><div class="sourceRow"><input class="sourceCheck" id="srvRootCheck" type="checkbox"><button class="sourceOpen" id="srvOpen">▣ ${esc(r.name||r.label)}</button><span class="sourceKind">Volume</span></div>`;$('#srvRootCheck').onchange=e=>setChecked(r.path,{source_type:'wsl_path',path:r.path,operator_label:r.name||r.label,note:''},e.target.checked);$('#srvOpen').onclick=()=>serverLoad(r.path);$('#sourceUp').onclick=serverUp;updateAdd()}async function serverLoad(p){try{const d=await api('/fs?path='+encodeURIComponent(p));serverCurrent=d.path||p;$('#sourcePath').textContent=serverCurrent;$('#sourceUp').disabled=serverCurrent===serverRoot.path;$('#sourcePane').innerHTML='<div class="sourceHead"><span></span><span>Name / path</span><span>Type</span></div>'+(d.folders||[]).map(n=>{const full=serverCurrent.replace(/\/$/,'')+'/'+n;return`<div class="sourceRow"><input class="sourceCheck" data-srv-check="${esc(full)}" type="checkbox"><button class="sourceOpen" data-srv-open="${esc(n)}" title="${esc(full)}">▱ ${esc(n)}</button><span class="sourceKind">Folder</span></div>`}).join(')+(d.files||[]).slice(0,250).map(n=>`<div class="sourceRow"><span></span><span class="sourceOpen">▧ ${esc(n)}</span><span class="sourceKind">File</span></div>`).join('');$$('[data-srv-check]').forEach(c=>c.onchange=e=>setChecked(c.dataset.srvCheck,{source_type:'wsl_path',path:c.dataset.srvCheck,operator_label:c.dataset.srvCheck.split('/').pop(),note:''},e.target.checked));$$('[data-srv-open]').forEach(b=>b.onclick=()=>serverLoad(serverCurrent.replace(/\/$/,'')+'/'+b.dataset.srvOpen))}catch(e){toast(e.message,true)}}function serverUp(){if(!serverRoot)return;const p=serverCurrent.split('/').filter(Boolean);p.pop();const x='/'+p.join('/');if(x.length<serverRoot.path.length)serverSelectRoot(serverRoot);else serverLoad(x)}
function setupGutters(){if(innerWidth<=1000)return;let widths=(localStorage.getItem('sot_source_widths')||'22,46,32').split(',').map(Number);$('#sourceGrid').style.setProperty('--p1',widths[0]+'%');$('#sourceGrid').style.setProperty('--p2',widths[1]+'%');$('#sourceGrid').style.setProperty('--p3',widths[2]+'%');$$('[data-gutter]').forEach(g=>g.onpointerdown=e=>{e.preventDefault();g.setPointerCapture(e.pointerId);const idx=Number(g.dataset.gutter),grid=$('#sourceGrid'),box=grid.getBoundingClientRect();g.classList.add('dragging');g.onpointermove=ev=>{const x=((ev.clientX-box.left)/box.width)*100;if(idx===1){const p1=Math.max(10,Math.min(35,x));const p2=Math.max(25,Math.min(65,widths[0]+widths[1]-p1));widths=[p1,p2,100-p1-p2]}else{const p3=Math.max(20,Math.min(45,100-x));const p2=Math.max(25,Math.min(65,100-widths[0]-p3));widths=[widths[0],p2,100-widths[0]-p2]}grid.style.setProperty('--p1',widths[0]+'%');grid.style.setProperty('--p2',widths[1]+'%');grid.style.setProperty('--p3',widths[2]+'%')};g.onpointerup=()=>{g.classList.remove('dragging');localStorage.setItem('sot_source_widths',widths.map(x=>x.toFixed(1)).join(','));g.onpointermove=null}})}
async function createProject(){const name=$('#projectName').value.trim();if(!name||!state.draft.sources.length){toast('Project name and at least one source are required.',true);return}try{let p;if(LOCAL){const t=uid(),ts=now();p={project_token:t,project_name:name,notes:$('#projectNote').value.trim(),active:1,status:'Pending',created_at:ts,updated_at:ts,deleted_at:null,current_stage:'setup',progress_percent:0,start_time:null,etc:null,sources:state.draft.sources.map(s=>({...s,source_id:uid(),registered_at:ts}))};await saveLocalProject(p)}else{p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,notes:$('#projectNote').value.trim(),active:true,sources:state.draft.sources})});await loadProjects()}state.draft={name:'',notes:'',sources:[]};state.selected=p;toast('Project created.');route('operations')}catch(e){toast(e.message,true)}}

function projectTip(p){return [p.notes,...(p.sources||[]).map(s=>`${s.locator||s.path}${s.note?' — '+s.note:''}`)].filter(Boolean).join('\n')}function renderOps(){const active=state.projects.filter(p=>!p.deleted_at),deleted=state.projects.filter(p=>p.deleted_at);if(state.selected&&!state.projects.find(p=>p.project_token===state.selected.project_token))state.selected=null;shell('Project Operations','Projects run here whether the authoritative database is local on this device or SQLite on WSL.',`<div class="card ops"><aside class="opsLeft"><div class="opsHead">Projects</div><div class="projectList"><button class="deletedToggle" id="deletedToggle">${state.showDeleted?'⌄':'›'} Deleted / Restore (${deleted.length})</button>${state.showDeleted?deleted.map(projectRowDeleted).join(''):''}${active.map(projectRow).join('')||'<div class="empty">No active projects</div>'}</div></aside><section class="opsMain" id="opsMain">${state.selected?opsDetail(state.selected):'<div class="empty"><strong>Select a project</strong>Project status and controls appear here.</div>'}</section></div>`);$('#deletedToggle').onclick=()=>{state.showDeleted=!state.showDeleted;renderOps()};$$('[data-project]').forEach(x=>x.onclick=async e=>{if(e.target.closest('[data-delete]'))return;state.selected=await getProject(x.dataset.project);renderOps()});$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();softDelete(b.dataset.delete)});$$('[data-restore]').forEach(b=>b.onclick=e=>{e.stopPropagation();restoreProject(b.dataset.restore)});if(state.selected)wireOps(state.selected)}function projectRow(p){return`<div class="projectItem ${state.selected?.project_token===p.project_token?'active':''}" data-project="${p.project_token}" title="${esc(projectTip(p))}"><strong>${esc(p.project_name)}</strong><small>${new Date(p.created_at).toLocaleDateString()}</small><button class="projectX" data-delete="${p.project_token}" title="Soft delete">×</button></div>`}function projectRowDeleted(p){return`<div class="pr function opsDetail(p){const pct=Number(p.progress_percent||0),wip=p.status==='WIP',closed=p.status==='Closed';return`<div class="sectionTitle"><h3>${esc(p.project_name)}</h3><button class="btn reportChip" id="reportChip">Reporting</button></div><div class="statusGrid"><div class="statusCell"><div class="k">Status</div><div class="v">${esc(p.status||'Pending')}</div></div><div class="statusCell"><div class="k">Created</div><div class="v">${new Date(p.created_at).toLocaleDateString()}</div></div><div class="statusCell"><div class="k">Activity</div><div class="v">${wip?'Running':closed?'Complete':'Idle'}</div></div><div class="statusCell"><div class="k">Complete</div><div class="v">${pct}%</div><div class="progressTrack"><div class="progressFill" style="width:${pct}%"></div></div></div><div class="statusCell"><div class="k">Start time</div><div class="v">${p.start_time?new Date(p.start_time).toLocaleTimeString():'—'}</div></div><div class="statusCell"><div class="k">ETC</div><div class="v">${p.etc?new Date(p.etc).toLocaleTimeString():'—'}</div></div></div><div class="opActions"><button class="btn primary" id="runBtn" ${wip||closed?'disabled':''}>Run</button><button class="btn" id="stopBtn" ${wip?'':'disabled'}>Stop</button><button class="btn" id="completeBtn" ${wip||closed?'disabled':''}>Complete Project</button>${LOCAL?'<button class="btn" id="reconnectBtn">Reconnect source</button>':''}<span class="badge ${closed?'good':'warn'}">${closed?'Closed':wip?'WIP':'Pending'}</span></div><div class="sourceMini">${(p.sources||[]).map(s=>`<div class="sourceMiniRow"><strong>${esc(s.operator_label||s.locator||s.path)}</strong><div class="mono muted" title="${esc(s.locator||s.path)}">${esc(s.locator||s.path)}</div><div class="muted">${esc(s.note||'')} ${s.file_count!=null?`· ${s.file_count} files · ${fmtBytes(s.byte_size)}`:''}</div></div>`).join('')||'<div class="muted">No sources</div>'}</div>`}
function wireOps(p){$('#reportChip').onclick=()=>showProjectReport(p);$('#completeBtn').onclick=()=>completeProject(p);$('#runBtn').onclick=()=>runProject(p);$('#stopBtn').onclick=()=>stopProject(p);$('#reconnectBtn')?.addEventListener('click',()=>reconnectProject(p))}
async function completeProject(p){if(!confirm(`Mark ${p.project_name} Closed?`))return;try{if(LOCAL){p.status='Closed';p.progress_percent=100;p.current_stage='closed';await saveLocalProject(p);state.selected=p}else{state.selected=await api('/projects/'+p.project_token,{method:'PATCH',body:JSON.stringify({status:'Closed',progress_percent:100,current_stage:'closed'})});await loadProjects()}renderOps();toast('Project completed.')}catch(e){toast(e.message,true)}}
async function reconnectProject(p){const pick=await pickDirectoryFiles(true);if(!pick)return;for(const s of p.sources||[]){if((s.locator||'').startsWith('device://')){const root=(s.locator||'').slice(9).split('/')[0];if(root===pick.root)sessionFiles.set('device://'+root,pick.files)}}toast('Local source reconnected for this session.')}
async function runProject(p){try{if(LOCAL){let any=false,total=0,bytes=0;for(const s of p.sources||[]){if(!(s.locator||'').startsWith('device://'))continue;const root=(s.locator||'').slice(9).split('/')[0],files=sessionFiles.get('device://'+root);if(!files)continue;any=true;const sub=(s.locator||'').slice(('device://'+root).length).replace(/^\//,'');const subset=!sub?files:files.filter(f=>(f.webkitRelativePath||f.name).split('/').slice(1).join('/').startsWith(sub+'/')||(f.webkitRelativePath||f.name).split('/').slice(1).join('/')===sub);s.file_count=subset.length;s.byte_size=subset.reduce((a,f)=>a+Number(f.size||0),0);total+=s.file_count;bytes+=s.byte_size}if(!any){toast('Reconnect the local source before Run so the browser can read it.',true);return}p.status='WIP';p.start_time=now();p.progress_percent=5;await saveLocalProject(p);state.selected=p;renderOps();await new Promise(r=>setTimeout(r,80));p.progress_percent=100;p.status='Pending';p.last_inventory_at=now();p.inventory_file_count=total;p.inventory_byte_size=bytes;await saveLocalProject(p);state.selected=p;renderOps();toast(`Inventory completed: ${total} files · ${fmtBytes(bytes)}. Project remains Pending until you complete it.`)}else{state.selected=await api('/projects/'+p.project_token+'/run',{method:'POST'});await loadProjects();renderOps()}}catch(e){toast(e.message,true)}}async function stopProject(p){try{if(LOCAL){p.status='Pending';p.progress_percent=Number(p.progress_percent||0);await saveLocalProject(p);state.selected=p}else{state.selected=await api('/projects/'+p.project_token+'/stop',{method:'POST'});await loadProjects()}renderOps()}catch(e){toast(e.message,true)}}
async function softDelete(t){try{if(LOCAL){const p=await getProject(t);p.deleted_at=now();await saveLocalProject(p)}else{await api('/projects/'+t,{method:'PATCH',body:JSON.stringify({deleted:true})});await loadProjects()}if(state.selected?.project_token===t)state.selected=null;renderOps()}catch(e){toast(e.message,true)}}async function restoreProject(t){try{if(LOCAL){const p=await getProject(t);p.deleted_at=null;await saveLocalProject(p)}else{await api('/projects/'+t,{method:'PATCH',body:JSON.stringify({restore:true})});await loadProjects()}renderOps()}catch(e){toast(e.message,true)}}

function renderDatabase(){const rows=state.projects;const sourceRows=rows.flatMap(p=>(p.sources||[]).map(s=>({...s,project_token:p.project_token,project_name:p.project_name})));shell('Database Administration','Basic CRUD across project/source metadata. Immutable identity columns remain read-only.',`<div class="card panel"><div class="dbToolbar"><select class="select" id="tableSelect" style="width:auto"><option value="projects">projects</option><option value="sources">sources</option></select><button class="btn" id="refreshDb">Refresh</button></div><div id="dbGrid"></div></div>`);function draw(){const t=$('#tableSelect').value,data=t==='projects'?rows:sourceRows;if(!data.length){$('#dbGrid').innerHTML='<div class="empty">No rows</div>';return}const cols=t==='projects'?['project_token','project_name','active','status','created_at','updated_at','notes','deleted_at']:['source_id','project_token','project_name','operator_label','operator_note','locator','path','file_count','byte_size'];$('#dbGrid').innerHTML=`<div class="tableWrap"><table class="dataTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${data.map((r,i)=>`<tr>${cols.map(c=>`<td class="${mutable(t,c)?'editable':''}" data-table="${t}" data-row="${i}" data-col="${c}"><span class="cell" title="${esc(r[c]??'')}">${esc(r[c]??'')}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$$('.editable').forEach(td=>td.onclick=()=>editCell(td,data[Number(td.dataset.row)],td.dataset.col))}$('#tableSelect').onchange=draw;$('#refreshDb').onclick=async()=>{await loadProjects();renderDatabase()};draw()}function mutable(t,c){return t==='projects'?['project_name','active','status','notes'].includes(c):['operator_label','operator_note'].includes(c)}async function editCell(td,row,col){const n=prompt(`Edit ${col}`,row[col]??'');if(n===null)return;try{if(LOCAL){const p=await getProject(row.project_token);if(td.dataset.table==='projects'){p[col]=col==='active'?Number(n?1:0):n}else{const s=(p.sources||[]).find(x=>x.source_id===row.source_id);if(s)s[col]=n}await saveLocalProject(p)}else if(td.dataset.table==='projects'){await api('/projects/'+row.project_token,{method:'PATCH',body:JSON.stringify({[col]:col==='active'?!!Number(n):n})})}else{await api('/sources/'+row.source_id,{method:'PATCH',body:JSON.stringify({[col]:n})});await loadProjects()}await loadProjects();renderDatabase()}catch(e){toast(e.message,true)}}
function renderBuild(){shell('SOT Build & Promotion','This stage remains gated until approved dedup/analysis evidence exists.',`<div class="card panel"><div class="callout">No copy plan is generated yet. The project database and project lifecycle now work in both mobile/browser mode and WSL mode; copy/promotion arrives in the planned engine releases.</div></div>`)}function renderReporting(){const active=state.projects.filter(p=>!p.deleted_at),closed=active.filter(p=>p.status==='Closed'),wip=active.filter(p=>p.status==='WIP'),pending=active.filter(p=>p.status!=='Closed'&&p.status!=='WIP'),sources=active.reduce((a,p)=>a+(p.sources||[]).length,0),files=active.reduce((a,p)=>a+Number(p.inventory_file_count||0),0),bytes=active.reduce((a,p)=>a+Number(p.inventory_byte_size||0),0);shell('Reporting','Basic schema-backed reporting from the current project database.',`<div class="grid2"><div class="card panel"><strong>Projects</strong><div style="font-size:28px;font-weight:850">${active.length}</div><div class="muted">${pending.length} Pending · ${wip.length} WIP · ${closed.length} Closed</div></div><div class="card panel"><strong>Sources</strong><div style="font-size:28px;font-weight:850">${sources}</div><div class="muted">${files?`${files} inventoried files · ${fmtBytes(bytes)}`:'No inventory evidence yet'}</div></div></div><div class="card panel" style="margin-top:10px"><div class="tableWrap"><table class="dataTable"><thead><tr><th>Project</th><th>Status</th><th>Created</th><th>Sources</th><th>Files</th><th>Bytes</th></tr></thead><tbody>${active.map(p=>`<tr><td>${esc(p.project_name)}</td><td>${esc(p.status)}</td><td>${esc(p.created_at)}</td><td>${(p.sources||[]).length}</td><td>${p.inventory_file_count??'—'}</td><td>${p.inventory_byte_size!=null?fmtBytes(p.inventory_byte_size):'—'}</td></tr>`).join('')||'<tr><td colspan="6">No projects</td></tr>'}</tbody></table></div></div>`)}
boot();
</script></body></html>
