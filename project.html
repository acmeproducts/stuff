-size:10px;color:#667085;white-space:nowrap}.sourceHead,.sourceRow{display:grid;grid-template-columns:32px minmax(120px,1fr) 86px 116px;gap:6px;align-items:center}.sourceHead{position:sticky;top:0;z-index:4;background:#f7f8fa;min-height:30px;padding:0 9px;border-bottom:1px solid var(--line);font-size:9px;font-weight:850;text-transform:uppercase;color:#667085}.sortBtn{border:0;background:transparent;text-align:left;padding:0;color:inherit;font-weight:inherit}.sourceRow{min-height:42px;padding:7px 9px;border-bottom:1px solid #edf0f2}.sourceRow:hover{background:#fafbfc}.sourceCheck{width:16px;height:16px;accent-color:#59687a}.sourceOpen{border:0;background:transparent;text-align:left;padding:0;color:#344054;font-weight:680;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.num{text-align:right;font-size:10px;color:#667085}.addBar{padding:7px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;gap:7px}.stageWrap{padding:7px}.stageCard{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:6px;cursor:pointer}.stagePath{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stageNote{font-size:10px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.stageX{border:0;background:transparent;color:var(--bad);font-size:16px}.empty{padding:24px 12px;text-align:center;color:#667085;font-size:11px}.empty strong{display:block;color:#344054;font-size:13px;margin-bottom:3px}.createBar{display:flex;justify-content:flex-end;margin-top:10px}
.fpLayout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:620px;overflow:hidden}.projectRail{border-right:1px solid var(--line);background:#fafbfc;display:flex;flex-direction:column}.projectList{overflow:auto;flex:1}.projectItem{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.projectItem:hover,.projectItem.active{background:#e9edf1}.projectItem strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fpMain{padding:14px;min-width:0}.statusGrid{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:7px}.statusCell{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.statusCell .k{font-size:9px;text-transform:uppercase;color:#667085;font-weight:800}.statusCell .v{font-size:14px;font-weight:800;margin-top:3px}.progressTrack{height:8px;background:#edf0f2;border-radius:999px;overflow:hidden;margin-top:6px}.progressFill{height:100%;background:#6f7e8f;width:0}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px;max-height:360px}.dataTable{border-collapse:collapse;width:100%;min-width:800px}.dataTable th,.dataTable td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.dataTable th{position:sticky;top:0;background:#fafbfc;z-index:2;font-size:9px;text-transform:uppercase;color:#667085}.toastWrap{position:fixed;right:14px;bottom:14px;z-index:220;display:grid;gap:6px}.toast{background:#111827;color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;max-width:380px}.toast.bad{background:#8f231a}
.fpLive{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc}.fpLiveTop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.fpLivePhase{font-weight:800}.fpLiveCount{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}.fpCurrent{font:11px ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}.progressTrack.indeterminate .progressFill{width:34%!important;animation:fpSweep 1.1s ease-in-out infinite}@keyframes fpSweep{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}\n@media(max-width:980px){.grid2{grid-template-columns:1fr}.sourceGrid{grid-template-columns:minmax(150px,18%) 5px minmax(360px,50%) 5px minmax(260px,32%)}.sourceBuilder{overflow:auto}.fpLayout{grid-template-columns:230px minmax(0,1fr)}.statusGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.app{grid-template-columns:1fr}.main{grid-column:1}.sidebar{width:230px;transform:translateX(-100%);box-shadow:8px 0 22px rgba(16,24,40,.12);transition:transform .16s}.app.mobile-open .sidebar{transform:translateX(0)}.app.nav-collapsed .sidebar{width:230px}.app.nav-collapsed .nav .label{display:block}.app.nav-collapsed .nav button{grid-template-columns:26px minmax(0,1fr)}.topbar{padding-left:60px}.content{padding:11px}.build{display:none}.sourceBuilder{height:var(--sourceHeightMobile,560px);resize:none;overflow-x:auto;scroll-snap-type:x proximity}.sourceGrid{min-width:980px;grid-template-columns:180px 5px 500px 5px 290px}.pane{scroll-snap-align:start}.sourceTools{grid-template-columns:auto auto minmax(110px,1fr) auto}.sourceTools .search{grid-column:3/5}.sourceTools .selCount{grid-column:1/3}.fpLayout{grid-template-columns:1fr}.projectRail{border-right:0;border-bottom:1px solid var(--line);max-height:210px}.statusGrid{grid-template-columns:repeat(2,1fr)}}

<body>
<button class="hamburger" id="hamburger" title="Toggle navigation" aria-label="Toggle navigation">☰</button><div class="brand">SOT Project</div>
<div class="app" id="app"><aside class="sidebar"><nav class="nav" id="nav"></nav></aside><main class="main"><header class="topbar"><h1 id="topTitle">Configuration</h1><span class="build">UI v0.4.1 · 2026.08.12.6.1</span></header><div class="content" id="content"></div></main></div><div class="toastWrap" id="toasts"></div>
<script>
'use strict';
const VERSION='0.4.1',BUILD='2026.08.17.6.4-wsl-live';
const WSL=location.pathname.startsWith('/report/')&&!location.hostname.endsWith('.github.io'),API='/report/api/sot';
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={error:text||('HTTP '+r.status)}}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));return data}
const ROUTES=[['configuration','⚙','Configuration'],['setup','＋','Project Setup'],['fingerprinting','●','Fingerprinting'],['database','▦','Database Administration'],['build','⇢','SOT Build & Promotion'],['reporting','≡','Reporting']];
const state={route:'configuration',draft:{name:'',note:'',sources:[]},roots:[],activeRoot:null,activePath:'',scope:[],selected:new Set(),search:'',sort:{key:'name',dir:1},projects:[],selectedProject:null,fp:{running:false,stop:false,live:null}};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,b=false){const d=document.createElement('div');d.className='toast'+(b?' bad':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3200)}
function navRender(){$('#nav').innerHTML=ROUTES.map(([r,i,l])=>`<button data-route="${r}" class="${state.route===r?'active':''}" title="${esc(l)}"><span>${i}</span><span class="label">${esc(l)}</span></button>`).join('');$$('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route))}
function route(r){state.route=r;$('#topTitle').textContent=ROUTES.find(x=>x[0]===r)?.[2]||'SOT';navRender();render();if(innerWidth<=720)$('#app').classList.remove('mobile-open')}
$('#hamburger').onclick=()=>{if(innerWidth<=720)$('#app').classList.toggle('mobile-open');else{$('#app').classList.toggle('nav-collapsed');localStorage.setItem('sot_nav_collapsed',$('#app').classList.contains('nav-collapsed')?'1':'0')}};if(innerWidth>720&&localStorage.getItem('sot_nav_collapsed')==='1')$('#app').classList.add('nav-collapsed');
function page(t,d,body){$('#content').innerHTML=`<div class="pagehead"><h2>${esc(t)}</h2><p>${esc(d)}</p></div>${body}`}
function fmtBytes(n){n=Number(n||0);if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<u.length-1);return n.toFixed(n>=100?0:n>=10?1:2)+' '+u[i]}
function fmtDate(n){if(!n)return'—';try{return new Date(n).toLocaleString()}catch{return'—'}}
function token(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)}
function reqToPromise(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
let DBP=null;async function db(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{const r=indexedDB.open('sot-local-v2',2);r.onupgradeneeded=()=>{const d=r.result;for(const [n,k] of [['roots','id'],['cache','id'],['projects','project_token'],['manifests','id'],['runs','run_id']])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:k})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return DBP}
async function storeGetAll(s){const d=await db();return reqToPromise(d.transaction(s).objectStore(s).getAll())}async function storePut(s,v){const d=await db();return reqToPromise(d.transaction(s,'readwrite').objectStore(s).put(v))}async function storeDelete(s,k){const d=await db();return reqToPromise(d.transaction(s,'readwrite').objectStore(s).delete(k))}async function storeClear(s){const d=await db();return reqToPromise(d.transaction(s,'readwrite').objectStore(s).clear())}
async function refreshRoots(){if(WSL){const x=await api('/fs?path=/');state.roots=(x.locations||[]).map(r=>({...r,permission:'granted',added_at:null}));return state.roots}const rows=await storeGetAll('roots');const live=[];for(const r of rows){try{let perm='granted';if(r.handle?.queryPermission)perm=await r.handle.queryPermission({mode:'read'});live.push({...r,permission:perm})}catch{live.push({...r,permission:'prompt'})}}state.roots=live.sort((a,b)=>a.label.localeCompare(b));return live}
async function addRoot(){if(WSL){toast('WSL volumes are discovered automatically.');return}if(!window.showDirectoryPicker){toast('This browser does not support persistent directory handles.',true);return}try{const h=await showDirectoryPicker({mode:'read'}),id='root:'+h.name+':'+token().slice(0,8),r={id,label:h.name,handle:h,added_at:Date.now(),permission:'granted'};await storePut('roots',r);await refreshRoots();state.activeRoot=r;state.activePath='';await loadScope(true);renderSetup()}catch(e){if(e.name!=='AbortError')toast(e.message,true)}}
async function ensurePermission(root){if(WSL)return !!root?.path;if(!root?.handle)return false;let p=await root.handle.queryPermission?.({mode:'read'})||'granted';if(p!=='granted'&&root.handle.requestPermission)p=await root.handle.requestPermission({mode:'read'});return p==='granted'}
async function handleForPath(root,path){let h=root.handle;if(!path)return h;for(const seg of path.split('/').filter(Boolean))h=await h.getDirectoryHandle(seg);return h}
async function shallowSignature(h){const names=[];for await(const [n,x] of h.entries())names.push((x.kind==='directory'?'d:':'f:')+n);names.sort();return names.join('|')}
async function folderStats(h){let bytes=0,last=0,files=0;for await(const [,x] of h.entries()){if(x.kind==='file'){try{const f=await x.getFile();bytes+=f.size;files++;last=Math.max(last,f.lastModified||0)}catch{}}else{const sub=await folderStats(x);bytes+=sub.bytes;files+=sub.files;last=Math.max(last,sub.last)}}return{bytes,last,files}}
function cacheId(rootId,path){return rootId+'::'+path}
async function scanScope(root,path,force=false){if(WSL){const target=path||root.path;renderReadStatus(force?'Checking for changes…':'Reading folders…');const x=await api('/fs?path='+encodeURIComponent(target)+(force?'&force=1':''));return{rows:(x.folders||[]).map(r=>({name:r.name,path:r.path,bytes:r.bytes,last:r.last,files:r.files})),status:x.status||'Ready',cached:!!x.cached}}const h=await handleForPath(root,path),id=cacheId(root.id,path),all=await storeGetAll('cache'),cached=all.find(x=>x.id===id),sig=await shallowSignature(h);if(cached&&!force&&cached.signature===sig){return{rows:cached.rows,status:'Ready · cached',cached:true}}const rows=[];for await(const [name,x] of h.entries()){if(x.kind!=='directory')continue;rows.push({name,path:[path,name].filter(Boolean).join('/'),bytes:null,last:null,files:null,handle:x})}renderReadStatus(`Reading ${rows.length} folder${rows.length===1?'':'s'}…`);let done=0;for(const row of rows){const st=await folderStats(row.handle);row.bytes=st.bytes;row.last=st.last;row.files=st.files;done++;renderReadStatus(`Reading folders… ${done}/${rows.length}`)}const serial=rows.map(({handle,...r})=>r);await storePut('cache',{id,root_id:root.id,path,signature:sig,rows:serial,updated_at:Date.now()});return{rows:serial,status:'Ready · updated',cached:false}}
function renderReadStatus(t){const el=$('#rootStatus');if(el)el.textContent=t}
async function loadScope(force=false){if(!state.activeRoot)return;if(!(await ensurePermission(state.activeRoot))){toast('Permission is required for this root.',true);return}state.scope=[];state.selected.clear();renderSetup(force?'Checking for changes…':'Reading folders…');const r=await scanScope(state.activeRoot,state.activePath,force);state.scope=r.rows;state.selected=new Set(r.rows.map(x=>x.path));renderSetup(r.status)}
function visibleRows(){let rows=state.scope.filter(r=>!state.search||r.name.toLowerCase().includes(state.search.toLowerCase()));const {key,dir}=state.sort;rows=[...rows].sort((a,b)=>{let av=a[key],bv=b[key];if(key==='name')return String(av).localeCompare(String(bv))*dir;av=Number(av||0);bv=Number(bv||0);return(av-bv)*dir});return rows}
function renderConfiguration(){if(WSL){page('Configuration','Validate the WSL-authoritative SOT database.',`<div class="card panel"><div class="callout good">Project database: WSL · SQLite · existing report server</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="initDb">Validate</button></div><div id="cfgStatus" class="muted" style="margin-top:9px"></div></div>`);$('#initDb').onclick=async()=>{try{const x=await api('/config/integrity');$('#cfgStatus').textContent=x.ok?'Ready · '+x.database_path:'Integrity failed: '+x.result}catch(e){$('#cfgStatus').textContent=e.message}};return}page('Configuration','Initialize and protect the browser-authoritative project database.',`<div class="card panel"><div class="callout good">Project database: On this device · IndexedDB</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="initDb">Initialize / Validate</button><button class="btn" id="exportDb">Export backup</button><button class="btn" id="importDb">Import backup</button><input id="importFile" type="file" accept="application/json" class="hidden"></div><div id="cfgStatus" class="muted" style="margin-top:9px"></div></div>`);$('#initDb').onclick=async()=>{await db();await storePut('runs',{run_id:'integrity:'+Date.now(),type:'integrity',created_at:Date.now()});$('#cfgStatus').textContent='Ready · database created/validated and writable.'};$('#exportDb').onclick=async()=>{const out={version:VERSION,exported_at:new Date().toISOString(),roots:(await storeGetAll('roots')).map(r=>({...r,handle:undefined})),projects:await storeGetAll('projects'),manifests:await storeGetAll('manifests'),runs:await storeGetAll('runs')};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='sot-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#importDb').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.version)throw new Error('Invalid backup');for(const p of x.projects||[])await storePut('projects',p);for(const m of x.manifests||[])await storePut('manifests',m);for(const r of x.runs||[])await storePut('runs',r);$('#cfgStatus').textContent='Backup imported.'}catch(err){toast(err.message,true)}}}
function rootsHtml(){return`<button class="locationRow ${!state.activeRoot?'active':''}" id="rootRow">⌂ Root<small>${WSL?'All server-visible volumes':'All authorized source roots'}</small></button>`+state.roots.map(r=>`<button class="locationRow ${state.activeRoot?.id===r.id?'active':''}" data-root-id="${esc(r.id)}">▣ ${esc(r.label)}<small>${WSL?esc(r.path):(r.permission==='granted'?'Available':'Needs permission')+' · added '+fmtDate(r.added_at)}</small></button>`).join('')+(WSL?'':`<button class="locationRow" id="addRoot">＋ This device<small>Authorize another local root once</small></button>`)}
function sourceRowsHtml(){const rows=visibleRows();if(!rows.length)return'<div class="empty"><strong>No matching folders</strong>Try clearing search or opening another root.</div>';return rows.map(r=>`<div class="sourceRow"><input class="sourceCheck" type="checkbox" data-check-path="${esc(r.path)}" ${state.selected.has(r.path)?'checked':''}><button class="sourceOpen" data-drill="${esc(r.path)}" title="${esc(r.path)}">${esc(r.name)}</button><span class="num">${fmtBytes(r.bytes)}</span><span class="num">${r.last?new Date(r.last).toLocaleDateString():'—'}</span></div>`).join('')}
function stagedHtml(){return state.draft.sources.length?state.draft.sources.map((s,i)=>`<div class="stageCard" data-note="${i}" title="${esc((s.root_label?s.root_label+' / ':'')+s.path)}"><div><strong>${esc(s.name)}</strong><div class="stagePath mono">${esc((s.root_label?s.root_label+' / ':'')+s.path)}</div><div class="stageNote">${s.note?esc(s.note):'Add optional note…'}</div></div><button class="stageX" data-rm="${i}">×</button></div>`).join(''):'<div class="empty"><strong>No sources added</strong>Select folders in Source(s), then Add selected.</div>'}
function renderSetup(statusText){const pname=state.draft.name||'Project',count=state.selected.size,total=state.scope.length,all=total>0&&count===total;page('Project Setup','Define the project and select sources with the persistent three-panel workflow.',`<div class="card panel"><div class="grid2"><div class="field"><label class="label">Project name</label><input class="input" id="projectName" value="${esc(state.draft.name)}" placeholder="Project name"></div><div class="field"><label class="label">Project note / description</label><input class="input" id="projectNote" value="${esc(state.draft.note)}" placeholder="Optional context"></div></div><div class="sourceBuilder ${localStorage.getItem('sot_drives_collapsed')==='1'?'drives-collapsed':''}" id="sourceBuilder"><div class="sourceGrid"><section class="pane"><div class="paneHeader"><button class="paneMenu" id="collapseDrives" title="Collapse Source Drives">☰</button><span class="grow driveText">Source Drives</span></div><div class="paneBody driveBody">${rootsHtml()}</div></section><div class="gutter" id="g1"></div><section class="pane"><div class="paneHeader"><span class="grow">Source(s)</span></div><div class="sourceTools"><button class="btn" id="up" ${!state.activeRoot||!state.activePath?'disabled':''}>↑ Up</button><label class="actions" style="gap:4px"><input type="checkbox" id="selectAll" ${all?'checked':''} ${!total?'disabled':''}> Select all</label><input class="input search" id="search" value="${esc(state.search)}" placeholder="Search folders"><span class="selCount">${count} of ${total} selected</span><button class="btn" id="refreshScope" ${!state.activeRoot?'disabled':''}>↻</button><div class="sourcePath mono">${state.activeRoot?esc(state.activeRoot.label+(state.activePath?' / '+state.activePath:'')):'Select Root or a source drive'}</div></div><div class="rootStatus" id="rootStatus">${esc(statusText||(!state.activeRoot?'Select a source drive':state.scope.length?'Ready':'Reading folders…'))}</div><div class="paneBody"><div class="sourceHead"><span></span><button class="sortBtn" data-sort="name">Name ${state.sort.key==='name'?(state.sort.dir===1?'↑':'↓'):''}</button><button class="sortBtn" data-sort="bytes">Size ${state.sort.key==='bytes'?(state.sort.dir===1?'↑':'↓'):''}</button><button class="sortBtn" data-sort="last">Last Updated ${state.sort.key==='last'?(state.sort.dir===1?'↑':'↓'):''}</button></div>${sourceRowsHtml()}</div><div class="addBar"><span class="muted">${count} selected</span><button class="btn primary" id="addSelected" ${!count?'disabled':''}>＋ Add selected</button></div></section><div class="gutter" id="g2"></div><section class="pane"><div class="paneHeader"><span class="grow">${esc(pname)}</span></div><div class="paneBody stageWrap">${stagedHtml()}</div></section></div></div><div class="createBar"><button class="btn primary" id="createProject" ${!state.draft.name.trim()||!state.draft.sources.length?'disabled':''}>Create Project</button></div></div>`);wireSetup()}
function wireSetup(){$('#projectName').oninput=e=>{state.draft.name=e.target.value;const h=$$('.paneHeader .grow')[2];if(h)h.textContent=e.target.value||'Project';$('#createProject').disabled=!state.draft.name.trim()||!state.draft.sources.length};$('#projectNote').oninput=e=>state.draft.note=e.target.value;$('#collapseDrives').onclick=()=>{const b=$('#sourceBuilder');b.classList.toggle('drives-collapsed');localStorage.setItem('sot_drives_collapsed',b.classList.contains('drives-collapsed')?'1':'0')};$('#rootRow').onclick=()=>{state.activeRoot=null;state.activePath='';state.scope=[];state.selected.clear();renderSetup()};if($('#addRoot'))$('#addRoot').onclick=addRoot;$$('[data-root-id]').forEach(b=>b.onclick=async()=>{state.activeRoot=state.roots.find(r=>r.id===b.dataset.rootId);state.activePath=WSL?state.activeRoot.path:'';await loadScope(false)});$('#search').oninput=e=>{state.search=e.target.value;renderSetup()};$('#selectAll').onchange=e=>{state.selected=e.target.checked?new Set(state.scope.map(x=>x.path)):new Set();renderSetup()};$$('[data-check-path]').forEach(c=>c.onchange=e=>{e.target.checked?state.selected.add(c.dataset.checkPath):state.selected.delete(c.dataset.checkPath);const total=state.scope.length;$('#selectAll').checked=total>0&&state.selected.size===total;$('.selCount').textContent=`${state.selected.size} of ${total} selected`;$('#addSelected').disabled=!state.selected.size});$$('[data-drill]').forEach(b=>b.onclick=async()=>{state.activePath=b.dataset.drill;state.search='';await loadScope(false)});$$('[data-sort]').forEach(b=>b.onclick=()=>{const k=b.dataset.sort;if(state.sort.key===k)state.sort.dir*=-1;else state.sort={key:k,dir:1};renderSetup()});$('#up').onclick=async()=>{if(WSL){if(state.activePath===state.activeRoot.path)return;const parent=state.activePath.split('/').slice(0,-1).join('/')||'/';state.activePath=parent.startsWith(state.activeRoot.path)?parent:state.activeRoot.path}else state.activePath=state.activePath.split('/').slice(0,-1).join('/');state.search='';await loadScope(false)};$('#refreshScope').onclick=()=>loadScope(true);$('#addSelected').onclick=()=>{for(const p of state.selected){const r=state.scope.find(x=>x.path===p);if(!r)continue;const s={id:state.activeRoot.id+'::'+p,root_id:state.activeRoot.id,root_label:state.activeRoot.label,path:p,name:r.name,note:''};if(!state.draft.sources.some(x=>x.id===s.id))state.draft.sources.push(s)}renderSetup()};$$('[data-note]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-rm]'))return;const i=Number(c.dataset.note),n=prompt('Optional source note',state.draft.sources[i].note||'');if(n!==null){state.draft.sources[i].note=n.trim();renderSetup()}});$$('[data-rm]').forEach(b=>b.onclick=e=>{e.stopPropagation();state.draft.sources.splice(Number(b.dataset.rm),1);renderSetup()});$('#createProject').onclick=createProject;wireGutters();wireHeight()}
function wireHeight(){const b=$('#sourceBuilder');const saved=localStorage.getItem(innerWidth<=720?'sot_source_height_mobile':'sot_source_height');if(saved)b.style.height=saved+'px';const ro=new ResizeObserver(()=>{const h=Math.round(b.getBoundingClientRect().height);localStorage.setItem(innerWidth<=720?'sot_source_height_mobile':'sot_source_height',h)});ro.observe(b)}
function wireGutters(){if(innerWidth<=720)return;const grid=$('.sourceGrid');let p1=Number(localStorage.getItem('sot_p1')||19),p2=Number(localStorage.getItem('sot_p2')||49);grid.style.setProperty('--p1',p1+'%');grid.style.setProperty('--p2',p2+'%');grid.style.setProperty('--p3',(100-p1-p2)+'%');function bind(g,which){g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);g.classList.add('dragging');const start=e.clientX,s1=p1,s2=p2;g.onpointermove=ev=>{const d=(ev.clientX-start)/grid.clientWidth*100;if(which===1)p1=Math.max(12,Math.min(35,s1+d));else p2=Math.max(32,Math.min(65,s2+d));const p3=100-p1-p2;if(p3<20)return;grid.style.setProperty('--p1',p1+'%');grid.style.setProperty('--p2',p2+'%');grid.style.setProperty('--p3',p3+'%')};g.onpointerup=()=>{g.classList.remove('dragging');localStorage.setItem('sot_p1',p1);localStorage.setItem('sot_p2',p2);g.onpointermove=null}}}bind($('#g1'),1);bind($('#g2'),2)}
async function createProject(){if(WSL){try{const p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:state.draft.name.trim(),notes:state.draft.note.trim(),sources:state.draft.sources.map(x=>({source_type:'wsl_path',path:x.path,operator_label:x.name,note:x.note||''}))})});state.selectedProject=p;state.draft={name:'',note:'',sources:[]};await refreshProjects();toast('Project created in WSL SQLite.');route('fingerprinting')}catch(e){toast(e.message,true)}return}const p={project_token:token(),project_name:state.draft.name.trim(),notes:state.draft.note.trim(),status:'Pending',active:1,created_at:Date.now(),updated_at:Date.now(),progress:0,sources:state.draft.sources.map(x=>({...x,registered_at:Date.now(),fingerprint:null,fingerprinted_at:null,file_count:0,byte_count:0}))};await storePut('projects',p);state.projects=await storeGetAll('projects');state.selectedProject=p;state.draft={name:'',note:'',sources:[]};toast('Project created.');route('fingerprinting')}
async function refreshProjects(){state.projects=WSL?await api('/projects'):(await storeGetAll('projects')).filter(p=>!p.deleted_at).sort((a,b)=>(b.updated_at||0)-(a.updated_at||0));if(state.selectedProject)state.selectedProject=state.projects.find(p=>p.project_token===state.selectedProject.project_token)||null}
function projectRail(){return state.projects.map(p=>`<div class="projectItem ${state.selectedProject?.project_token===p.project_token?'active':''}" data-project="${p.project_token}" title="${esc((p.notes||'')+'\n'+(p.sources||[]).map(s=>(s.root_label?s.root_label+' / ':'')+s.path+(s.note?' — '+s.note:'')).join('\n'))}"><strong>${esc(p.project_name)}</strong><small>${fmtDate(p.created_at)} · ${esc(p.status)}</small></div>`).join('')||'<div class="empty">No projects yet.</div>'}
function renderFingerprinting(){refreshProjects().then(()=>{const p=state.selectedProject||state.projects[0]||null;if(p&&!state.selectedProject)state.selectedProject=p;page('Fingerprinting','File-level fingerprinting and inventory. Progress reflects actual files processed.',`<div class="card fpLayout"><aside class="projectRail"><div class="paneHeader">Projects</div><div class="projectList">${projectRail()}</div></aside><section class="fpMain">${p?fingerprintProjectHtml(p):'<div class="empty"><strong>No project selected</strong>Create a project first.</div>'}</section></div>`);$$('[data-project]').forEach(x=>x.onclick=()=>{state.selectedProject=state.projects.find(p=>p.project_token===x.dataset.project);renderFingerprinting()});if(p){$('#runFp').onclick=()=>runFingerprint(p);$('#stopFp').onclick=async()=>{if(WSL){try{await api('/projects/'+encodeURIComponent(p.project_token)+'/fingerprint/stop',{method:'POST',body:'{}'});toast('Stop requested.')}catch(e){toast(e.message,true)}}else state.fp.stop=true}}})}
function fingerprintProjectHtml(p){const savedTotal=(p.sources||[]).reduce((a,s)=>a+Number(s.file_count||0),0),bytes=(p.sources||[]).reduce((a,s)=>a+Number(s.byte_count||0),0),live=WSL?state.fp.live:null,run=live?.run||null,job=live?.job||null,phase=job?.phase||(run?.status==='WIP'?'discovering':null),done=Number(job?.files_done??run?.files_done??0),total=Number(job?.files_total??run?.files_total??0),found=Number(job?.files_discovered??0),pct=total>0?Math.max(0,Math.min(100,Number(run?.progress_percent??job?.progress??0))):0,current=job?.current_file||'',source=job?.current_source||'',reused=Number(job?.files_reused||0),running=state.fp.running||run?.status==='WIP';const phaseText=phase==='discovering'?`Discovering files · ${found.toLocaleString()} found`:phase==='fingerprinting'?`Fingerprinting · ${done.toLocaleString()} / ${total.toLocaleString()}`:run?.status||p.status;const liveHtml=WSL&&running?`<div class="fpLive"><div class="fpLiveTop"><span class="fpLivePhase">${esc(phaseText)}</span><span class="fpLiveCount">${phase==='fingerprinting'?Math.round(pct)+'%': 'Building exact inventory…'}</span></div><div class="progressTrack ${phase==='discovering'?'indeterminate':''}"><div class="progressFill" style="width:${phase==='fingerprinting'?pct:34}%"></div></div><div class="fpCurrent" title="${esc(current)}">${current?esc((source?source+' · ':'')+current):phase==='discovering'?'Scanning folders to establish the exact file count…':'Waiting for next file…'}</div>${phase==='fingerprinting'?`<div class="muted" style="margin-top:6px">${reused.toLocaleString()} unchanged file hash${reused===1?'':'es'} reused</div>`:''}</div>`:'';return`<h3 style="margin-top:0">${esc(p.project_name)}</h3><div class="statusGrid"><div class="statusCell"><div class="k">Status</div><div class="v">${esc(p.status)}</div></div><div class="statusCell"><div class="k">Created</div><div class="v" style="font-size:11px">${fmtDate(p.created_at)}</div></div><div class="statusCell"><div class="k">Fingerprint</div><div class="v">${total>0?Math.round(pct):Math.round(p.progress||0)}%</div><div class="progressTrack"><div class="progressFill" style="width:${total>0?pct:Math.max(0,Math.min(100,p.progress||0))}%"></div></div></div><div class="statusCell"><div class="k">Files</div><div class="v">${total||savedTotal||found}</div></div><div class="statusCell"><div class="k">Bytes</div><div class="v">${fmtBytes(bytes)}</div></div><div class="statusCell"><div class="k">Updated</div><div class="v" style="font-size:11px">${fmtDate(p.updated_at)}</div></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="runFp" ${running?'disabled':''}>${p.status==='Stopped'?'Continue':'Run'}</button><button class="btn" id="stopFp" ${!running?'disabled':''}>Stop</button><span class="badge ${running?'warn':'good'}">${running?(phase==='discovering'?'Discovering':'Running'):'Ready'}</span></div>${liveHtml}<div class="tableWrap"><table class="dataTable"><thead><tr><th>Source</th><th>Files</th><th>Bytes</th><th>Fingerprint</th><th>Fingerprint time</th></tr></thead><tbody>${(p.sources||[]).map(s=>`<tr><td><strong>${esc(s.name)}</strong><div class="mono muted">${esc((s.root_label?s.root_label+' / ':'')+s.path)}</div>${s.note?`<div>${esc(s.note)}</div>`:''}</td><td>${s.file_count||0}</td><td>${fmtBytes(s.byte_count||0)}</td><td class="mono">${s.fingerprint?esc(s.fingerprint.slice(0,20))+'…':'—'}</td><td>${fmtDate(s.fingerprinted_at)}</td></tr>`).join('')}</tbody></table></div>`}
async function collectFiles(root,source){const h=await handleForPath(root,source.path),out=[];async function walk(dir,prefix){for await(const [n,x] of dir.entries()){const rel=prefix?prefix+'/'+n:n;if(x.kind==='file'){const f=await x.getFile();out.push({rel,size:f.size,mtime:f.lastModified,handle:x})}else await walk(x,rel)}}await walk(h,'');return out}
async function hashFile(file){const buf=await file.arrayBuffer(),d=await crypto.subtle.digest('SHA-256',buf);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function runFingerprint(project){if(state.fp.running)return;if(WSL){state.fp={running:true,stop:false,live:null};renderFingerprinting();try{await api('/projects/'+encodeURIComponent(project.project_token)+'/fingerprint/start',{method:'POST',body:'{}'});for(;;){await new Promise(r=>setTimeout(r,350));const live=await api('/projects/'+encodeURIComponent(project.project_token)+'/fingerprint/status');state.fp.live=live;project=live.project||project;state.selectedProject=project;const i=state.projects.findIndex(p=>p.project_token===project.project_token);if(i>=0)state.projects[i]=project;renderFingerprinting();const rs=live.run?.status||project.status;if(!['WIP','Running'].includes(rs))break}const rs=state.fp.live?.run?.status||project.status;if(rs==='Closed')toast('WSL file-level fingerprinting complete.');else if(rs==='Stopped')toast('Fingerprinting stopped.');else if(rs==='Error')toast(state.fp.live?.job?.error||'Fingerprinting failed.',true)}catch(e){toast(e.message,true)}finally{state.fp.running=false;await refreshProjects();state.selectedProject=state.projects.find(p=>p.project_token===project.project_token)||project;renderFingerprinting()}return}state.fp={running:true,stop:false};project.status='WIP';project.updated_at=Date.now();await storePut('projects',project);renderFingerprinting();try{let allCount=0,done=0;const work=[];for(const s of project.sources){const root=state.roots.find(r=>r.id===s.root_id);if(!root||!(await ensurePermission(root)))throw new Error(`Reconnect source root: ${s.root_label}`);const files=await collectFiles(root,s);allCount+=files.length;work.push({s,root,files})}for(const w of work){const old=(await storeGetAll('manifests')).filter(m=>m.project_token===project.project_token&&m.source_id===w.s.id);const byPath=new Map(old.map(m=>[m.relative_path,m]));const entries=[];for(const meta of w.files){if(state.fp.stop){project.status='Stopped';throw new Error('__STOP__')}let hash,prev=byPath.get(meta.rel);if(prev&&prev.size===meta.size&&prev.modified_at===meta.mtime&&prev.sha256)hash=prev.sha256;else hash=await hashFile(await meta.handle.getFile());const row={id:project.project_token+'::'+w.s.id+'::'+meta.rel,project_token:project.project_token,source_id:w.s.id,relative_path:meta.rel,size:meta.size,modified_at:meta.mtime,sha256:hash,inventory_at:Date.now()};await storePut('manifests',row);entries.push(row);done++;project.progress=allCount?done/allCount*100:100;project.updated_at=Date.now();await storePut('projects',project);if(done%5===0||done===allCount)renderFingerprinting()}entries.sort((a,b)=>a.relative_path.localeCompare(b.relative_path));const enc=new TextEncoder().encode(entries.map(e=>`${e.relative_path}\0${e.size}\0${e.modified_at}\0${e.sha256}`).join('\n')),dig=await crypto.subtle.digest('SHA-256',enc),fp=[...new Uint8Array(dig)].map(x=>x.toString(16).padStart(2,'0')).join('');w.s.fingerprint=fp;w.s.fingerprinted_at=Date.now();w.s.file_count=entries.length;w.s.byte_count=entries.reduce((a,e)=>a+e.size,0);project.updated_at=Date.now();await storePut('projects',project)}project.status='Closed';project.progress=100;project.updated_at=Date.now();await storePut('projects',project);toast('File-level fingerprinting complete.')}catch(e){if(e.message==='__STOP__'){await storePut('projects',project);toast('Fingerprinting stopped. Continue will reuse completed file hashes.')}else{project.status='Stopped';await storePut('projects',project);toast(e.message,true)}}finally{state.fp.running=false;await refreshProjects();state.selectedProject=state.projects.find(p=>p.project_token===project.project_token)||project;renderFingerprinting()}}
function renderDatabase(){refreshProjects().then(()=>page('Database Administration','Basic CRUD for project/source metadata. Immutable IDs and fingerprint evidence are read-only.',`<div class="card panel"><div class="tableWrap" style="max-height:none"><table class="dataTable"><thead><tr><th>Project</th><th>Status</th><th>Created</th><th>Sources</th><th>Token</th></tr></thead><tbody>${state.projects.map(p=>`<tr><td><button class="btn" data-edit-project="${p.project_token}">${esc(p.project_name)}</button></td><td>${esc(p.status)}</td><td>${fmtDate(p.created_at)}</td><td>${p.sources?.length||0}</td><td class="mono">${esc(p.project_token)}</td></tr>`).join('')||'<tr><td colspan="5">No projects</td></tr>'}</tbody></table></div></div>`)).then(()=>$$('[data-edit-project]').forEach(b=>b.onclick=async()=>{const p=state.projects.find(x=>x.project_token===b.dataset.editProject),n=prompt('Project name',p.project_name);if(n===null)return;const note=prompt('Project note',p.notes||'');if(note===null)return;p.project_name=n.trim()||p.project_name;p.notes=note;p.updated_at=Date.now();await storePut('projects',p);renderDatabase()}))}
function renderReporting(){refreshProjects().then(async()=>{let files=0,bytes=0;if(WSL){for(const p of state.projects){files+=(p.sources||[]).reduce((a,s)=>a+Number(s.file_count||0),0);bytes+=(p.sources||[]).reduce((a,s)=>a+Number(s.byte_count||0),0)}}else{const manifests=await storeGetAll('manifests');files=manifests.length;bytes=manifests.reduce((a,m)=>a+(m.size||0),0)}const fp=state.projects.reduce((a,p)=>a+(p.sources||[]).filter(s=>s.fingerprint).length,0);page('Reporting','Evidence-backed project, fingerprint, file, and byte totals.',`<div class="statusGrid"><div class="statusCell"><div class="k">Projects</div><div class="v">${state.projects.length}</div></div><div class="statusCell"><div class="k">Fingerprint sources</div><div class="v">${fp}</div></div><div class="statusCell"><div class="k">Files indexed</div><div class="v">${files}</div></div><div class="statusCell"><div class="k">Bytes indexed</div><div class="v">${fmtBytes(bytes)}</div></div></div>`)})}
function renderFuture(){page(ROUTES.find(x=>x[0]===state.route)?.[2]||'SOT','Downstream design follows after the file-level fingerprinting baseline is accepted.','<div class="card panel"><div class="callout">No fake downstream actions are exposed in this baseline candidate.</div></div>')}
function render(){({configuration:renderConfiguration,setup:()=>renderSetup(),fingerprinting:renderFingerprinting,database:renderDatabase,reporting:renderReporting,build:renderFuture}[state.route]||renderConfiguration)()}
async function boot(){if(!WSL)await db();await refreshRoots();await refreshProjects();navRender();render()}
boot();
