function renderConfiguration(){const c=state.config||{database_path:'',database_backup_path:''};shell('Configuration','Define and validate the authoritative SOT database before creating projects.',`${STATIC_PREVIEW?'<div class="callout warn">Static GitHub Pages preview: review the UI here; the SOT database is initialized on the WSL/OpenClaw runtime.</div>':state.apiLive?'<div class="callout good">Connected to the production SOT API.</div>':'<div class="callout bad">SOT API is not reachable. Database actions are disabled.</div>'}<div class="card panel" style="margin-top:12px"><div class="grid2"><div class="field"><label class="labelText">Authoritative SOT database path</label><input class="input mono" id="dbPath" value="${esc(c.database_path||'')}" placeholder="/home/support/.openclaw/sot/sot.sqlite"></div><div class="field"><label class="labelText">Database backup path</label><input class="input mono" id="dbBackup" value="${esc(c.database_backup_path||'')}" placeholder="/home/support/.openclaw/sot/backups"></div></div><div class="actions"><button class="btn primary" id="saveConfig" ${STATIC_PREVIEW||!state.apiLive?'disabled':''}>Save & validate</button><button class="btn" id="integrity" ${STATIC_PREVIEW||!state.apiLive?'disabled':''}>Integrity check</button></div><div id="configStatus" style="margin-top:12px"></div></div>`);$('#saveConfig').onclick=async()=>{try{state.config=await api('/config',{method:'POST',body:JSON.stringify({database_path:$('#dbPath').value.trim(),database_backup_path:$('#dbBackup').value.trim()})});toast('Configuration saved and database validated.');renderConfiguration()}catch(e){toast(e.message,true)}};$('#integrity').onclick=async()=>{try{const x=await api('/config/integrity');$('#configStatus').innerHTML=`<div class="callout ${x.ok?'good':'bad'}">Integrity: ${esc(x.result||x.status)}</div>`}catch(e){toast(e.message,true)}}}
function draftSourcesHtml(){if(!state.draft.sources.length)return'<div class="callout">No sources staged yet.</div>';return state.draft.sources.map(s=>`<div class="callout" style="margin-bottom:6px"><strong>${esc(s.operator_label||s.path||s.locator)}</strong><div class="mono" title="${esc(s.path||s.locator)}">${esc(s.path||s.locator)}</div>${s.note?`<div class="muted">${esc(s.note)}</div>`:''}</div>`).join('')}
function renderSetup(){const ready=STATIC_PREVIEW||!!state.config?.database_path;shell('Project Setup','Define the project and stage source locations. The final SOT target is deferred until analysis determines surviving capacity.',`${STATIC_PREVIEW?'<div class="callout warn">Static preview: authoritative Create Project is disabled because GitHub Pages cannot write the SOT DB. Source-selection UI remains testable.</div>':!ready?'<div class="callout bad">Configuration is required before Project Setup can create an authoritative project.</div>':''}<div class="card panel" style="margin-top:12px"><div class="grid2"><div class="field"><label class="labelText">Project name</label><input class="input" id="projectName" value="${esc(state.draft.name)}" placeholder="e.g. Family archive consolidation"></div><div class="field"><label class="labelText">Project status</label><select class="select" id="activeFlag"><option value="1">Active</option><option value="0">Inactive</option></select></div></div><div class="field"><label class="labelText">Project note (optional)</label><textarea class="textarea" id="projectNotes">${esc(state.draft.notes)}</textarea></div><div class="sectionTitle"><h3>Sources</h3><button class="btn" id="addLocations">＋ Add locations</button></div><div id="draftSources">${draftSourcesHtml()}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="createProject" ${STATIC_PREVIEW||!state.apiLive||!ready?'disabled':''}>Create project</button><span class="muted" style="align-self:center">Destination comes later, after inventory and dedup analysis.</span></div></div>`);$('#projectName').oninput=e=>state.draft.name=e.target.value;$('#projectNotes').oninput=e=>state.draft.notes=e.target.value;$('#addLocations').onclick=openSourcePicker;$('#createProject').onclick=async()=>{const name=$('#projectName').value.trim();if(!name||!state.draft.sources.length){toast('Project name and at least one source are required.',true);return}try{const p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,notes:$('#projectNotes').value,active:$('#activeFlag').value==='1',sources:state.draft.sources})});state.draft={name:'',notes:'',sources:[]};await refreshProjects();state.selectedProject=p;toast('Project created in authoritative SOT DB.');route('operations')}catch(e){toast(e.message,true)}}}
function renderOperations(){const opts=state.projects.map(p=>`<option value="${esc(p.project_token)}" ${state.selectedProject?.project_token===p.project_token?'selected':''}>${esc(p.project_name)} · ${esc(p.project_token.slice(0,8))}</option>`).join(''),p=state.selectedProject;shell('Project Operations','Operate projects from the authoritative SOT DB. Execution controls remain disabled until a real engine operation exists.',`<div class="card panel"><div class="field"><label class="labelText">Project</label><select class="select" id="projectSelect"><option value="">Select project</option>${opts}</select></div>${p?operationsProjectHtml(p):'<div class="callout">Select a project to view its authoritative status and sources.</div>'}</div>`);$('#projectSelect').onchange=async e=>{const t=e.target.value;if(!t){state.selectedProject=null;renderOperations();return}try{state.selectedProject=await api('/projects/'+encodeURIComponent(t));renderOperations()}catch(err){toast(err.message,true)}}}

function renderDatabase(){shell('Database Administration','Manage project/source metadata in the authoritative SOT DB. Identity fields remain immutable.',`${STATIC_PREVIEW?'<div class="callout warn">Static preview: database administration requires the WSL/OpenClaw runtime.</div>':''}<div class="card panel"><div class="sectionTitle"><h3>Projects</h3><div class="actions"><button class="btn" id="refreshDB" ${STATIC_PREVIEW?'disabled':''}>Refresh</button><button class="btn" id="integrityDB" ${STATIC_PREVIEW?'disabled':''}>Integrity check</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th></th><th>Project</th><th>Active</th><th>Created</th><th>Updated</th><th>Token</th></tr></thead><tbody>${state.projects.map(p=>`<tr><td><input type="checkbox" class="bulkCheck" value="${esc(p.project_token)}"></td><td><button class="btn" data-edit="${esc(p.project_token)}">${esc(p.project_name)}</button></td><td>${Number(p.active)!==0?'Active':'Inactive'}</td><td>${esc(p.created_at||'')}</td><td>${esc(p.updated_at||'')}</td><td class="mono">${esc(p.project_token)}</td></tr>`).join('')||'<tr><td colspan="6">No projects</td></tr>'}</tbody></table></div><div class="actions" style="margin-top:12px"><button class="btn" id="bulkActive" ${STATIC_PREVIEW?'disabled':''}>Set selected active</button><button class="btn" id="bulkInactive" ${STATIC_PREVIEW?'disabled':''}>Set selected inactive</button></div></div>`);$('#refreshDB').onclick=async()=>{await refreshProjects();renderDatabase()};$('#integrityDB').onclick=async()=>{try{const x=await api('/config/integrity');toast(`Integrity: ${x.result||x.status}`)}catch(e){toast(e.message,true)}};$$('[data-edit]').forEach(b=>b.onclick=()=>editProject(b.dataset.edit));$('#bulkActive').onclick=()=>bulkActive(true);$('#bulkInactive').onclick=()=>bulkActive(false)}async function bulkActive(active){const t=$$('.bulkCheck:checked').map(x=>x.value);if(!t.length){toast('Select at least one project.',true);return}try{await api('/projects/bulk',{method:'PATCH',body:JSON.stringify({project_tokens:t,active})});await refreshProjects();renderDatabase();toast(`${t.length} project(s) updated.`)}catch(e){toast(e.message,true)}}async function editProject(t){try{const p=await api('/projects/'+encodeURIComponent(t)),n=prompt('Project name',p.project_name);if(n===null)return;const notes=prompt('Project note',p.notes||'');if(notes===null)return;await api('/projects/'+encodeURIComponent(t),{method:'PATCH',body:JSON.stringify({project_name:n,notes})});await refreshProjects();renderDatabase();toast('Project metadata updated.')}catch(e){toast(e.message,true)}}function renderFuture(){const l=ROUTES.find(x=>x[0]===state.route)?.[2];shell(l,`${l} is in the accepted release plan but its deterministic engine functions ship in later releases.`,`<div class="card panel"><div class="callout">No fake results are shown here. This section activates when its planned backend stage is implemented and gated.</div></div>`)}
function sourceKey(s){return `${s.source_type||'wsl_path'}:${s.path||s.locator||''}`}function openSourcePicker(){const staged=state.draft.sources.map(x=>({...x}));let active=null,current=null,folders=[],files=[],history=[];const checked=new Set();$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><div><h3>Add locations</h3><div class="muted" style="font-size:12px">Locations → Contents / Select → Added to project</div></div><button class="close" id="closePicker">×</button></div><div class="sourceGrid"><section class="pane"><div class="paneHead">1 · Locations</div><div class="paneBody" id="locationsPane"></div></section><section class="pane"><div class="paneHead">2 · Contents / Select</div><div class="centerTools"><button class="btn" id="upBtn" disabled>↑ Up</button><div class="pathBox mono" id="pickerPath">Select a location</div><button class="btn primary addBtn" id="addChecked" disabled>＋ Add to project</button></div><div class="paneBody" id="contentsPane"><div class="empty"><strong>Select a location</strong>The location will appear here as a selectable row.</div></div></section><section class="pane"><div class="paneHead">3 · Added to project</div><div class="paneBody staged" id="stagedPane"></div><div class="paneFoot"><div class="actions"><button class="btn primary" id="saveStage">Save selections</button><button class="btn" id="cancelStage">Cancel</button></div></div></section></div></div></div>`;function renderLocations(){let h='';if(!STATIC_PREVIEW&&state.apiLive)h+=state.roots.map(r=>`<button class="locationBtn ${active?.path===r.path?'active':''}" data-root="${esc(r.path)}">▣ ${esc(r.name||r.label)}<small>${esc(r.path)}</small></button>`).join('');h+=`<button class="locationBtn" id="deviceLoc">▯ This device<small>Browser-authorized folder</small></button>`;$('#locationsPane').innerHTML=h;$$('[data-root]').forEach(b=>b.onclick=()=>selectRoot(state.roots.find(r=>r.path===b.dataset.root)));$('#deviceLoc').onclick=chooseDevice}function selectRoot(r){active=r;current=r.path;history=[r.path];folders=[];files=[];checked.clear();renderLocations();renderRootRow();updateAdd()}function renderRootRow(){const r=active;$('#pickerPath').textContent=r.path;$('#upBtn').disabled=true;$('#contentsPane').innerHTML=`<div class="sourceHead"><span></span><span>Name</span><span>Type</span></div><div class="sourceRow"><input class="check" type="checkbox" data-check="${esc(r.path)}"><button class="openRow" id="openRoot">▣ ${esc(r.name||r.label)}</button><span class="kind">Volume</span></div>`;$$('[data-check]').forEach(c=>c.onchange=e=>toggle(c.dataset.check,e.target.checked));$('#openRoot').onclick=()=>load(r.path)}async function load(p){try{const d=await api('/fs?path='+encodeURIComponent(p));current=d.path||p;folders=d.folders||[];files=d.files||[];$('#pickerPath').textContent=current;$('#upBtn').disabled=history.length<=1;renderDir()}catch(e){$('#contentsPane').innerHTML=`<div class="empty"><strong>Unable to browse</strong>${esc(e.message)}</div>`}}function renderDir(){const fr=folders.map(n=>{const p=current.replace(/\/$/,'')+'/'+n;return`<div class="sourceRow"><input class="check" type="checkbox" data-check="${esc(p)}" ${checked.has(p)?'checked':''}><button class="openRow" data-drill="${esc(n)}">▱ ${esc(n)}</button><span class="kind">Folder</span></div>`}).join(''),fi=files.map(n=>`<div class="sourceRow"><span></span><span class="openRow" style="font-weight:500">▧ ${esc(n)}</span><span class="kind">File</span></div>`).join('');$('#contentsPane').innerHTML='<div class="sourceHead"><span></span><span>Name</span><span>Type</span></div>'+(fr+fi||'<div class="empty">This folder is empty.</div>');$$('[data-check]').forEach(c=>c.onchange=e=>toggle(c.dataset.check,e.target.checked));$$('[data-drill]').forEach(b=>b.onclick=()=>{const next=current.replace(/\/$/,'')+'/'+b.dataset.drill;history.push(next);load(next)})}function toggle(p,on){on?checked.add(p):checked.delete(p);updateAdd()}function updateAdd(){const b=$('#addChecked');b.disabled=!checked.size;b.textContent=checked.size?`＋ Add to project (${checked.size})`:'＋ Add to project'}function renderStaged(){$('#stagedPane').innerHTML=staged.length?staged.map((s,i)=>{const full=s.path||s.locator||'';return`<div class="stageCard" data-note="${i}" title="${esc(full)}"><div><div class="stagePath mono">${esc(full)}</div><div class="stageNote">${s.note?esc(s.note):'Add optional note…'}</div></div><button class="remove" data-remove="${i}">×</button></div>`}).join(''):'<div class="empty"><strong>Nothing added yet</strong>Staged sources stay here until Save selections.</div>';$$('[data-note]').forEach(c=>c.onclick=e=>{if(e.target.closest('[data-remove]'))return;const i=Number(c.dataset.note),n=prompt('Optional source note',staged[i].note||'');if(n!==null){staged[i].note=n.trim();renderStaged()}});$$('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();staged.splice(Number(b.dataset.remove),1);renderStaged()})}$('#addChecked').onclick=()=>{for(const p of checked){const s={source_type:'wsl_path',path:p,operator_label:p.split('/').filter(Boolean).pop()||p,note:''};if(!staged.some(x=>sourceKey(x)===sourceKey(s)))staged.push(s)}checked.clear();updateAdd();active&&history.length===1?renderRootRow():renderDir();renderStaged()};$('#upBtn').onclick=()=>{if(history.length<=1){renderRootRow();return}history.pop();if(history.length===1){renderRootRow();return}load(history[history.length-1])};$('#saveStage').onclick=()=>{state.draft.sources=staged;$('#modalRoot').innerHTML='';renderSetup()};$('#cancelStage').onclick=$('#closePicker').onclick=()=>$('#modalRoot').innerHTML='';async function chooseDevice(){if(window.showDirectoryPicker){try{const h=await showDirectoryPicker(),s={source_type:'browser_local',locator:'device://'+h.name,operator_label:h.name,note:''};active=null;checked.clear();$('#pickerPath').textContent='This device';$('#contentsPane').innerHTML=`<div class="sourceHead"><span></span><span>Name</span><span>Type</span></div><div class="sourceRow"><input class="check" id="deviceCheck" type="checkbox"><span class="openRow">▯ ${esc(h.name)}</span><span class="kind">Folder</span></div>`;$('#deviceCheck').onchange=e=>{e.target.checked?checked.add(s.locator):checked.delete(s.locator);updateAdd()};$('#addChecked').onclick=()=>{if(checked.has(s.locator)&&!staged.some(x=>sourceKey(x)===sourceKey(s)))staged.push(s);checked.clear();updateAdd();renderStaged()}}catch(e){if(e.name!=='AbortError')toast(e.message,true)}}else{const i=document.createElement('input');i.type='file';i.webkitdirectory=true;i.multiple=true;i.onchange=()=>{const f=i.files?.[0];if(!f)return;const n=(f.webkitRelativePath||f.name).split('/')[0],s={source_type:'browser_local',locator:'device://'+n,operator_label:n,note:''};if(!staged.some(x=>sourceKey(x)===sourceKey(s)))staged.push(s);renderStaged()};i.click()}}renderLocations();renderStaged();updateAdd()}
boot();
</script></body></html>
