<button id="hamburger" class="hamburger" title="Toggle navigation" aria-label="Toggle navigation">☰</button><div class="brand">SOT Project</div><div id="app" class="app"><aside class="sidebar"><nav id="nav" class="nav"></nav></aside><main class="main"><header class="topbar"><h1 id="topTitle">Configuration</h1><span id="buildPill" class="buildpill"></span></header><div id="content" class="content"></div></main></div><div id="modalRoot"></div><div id="toasts" class="toastWrap"></div>
<script>
'use strict';
const APP_VERSION='0.3.1',BUILD_ID='2026.08.12.5.1',STATIC_PREVIEW=location.hostname.endsWith('.github.io'),API_BASE='/report/api/sot';
const ROUTES=[['configuration','⚙','Configuration'],['setup','＋','Project Setup'],['operations','▶','Project Operations'],['database','▦','Database Administration'],['build','⇢','SOT Build & Promotion'],['reporting','≡','Reporting']];
const state={route:'configuration',apiLive:false,config:null,roots:[],projects:[],deleted:[],projectCache:new Map(),selectedProject:null,draft:{name:'',notes:'',sources:[]},cfgTarget:null,cfgBrowser:null,opsDeletedOpen:false,dbTables:[],dbTable:null,reportSummary:null,reportTimeline:[]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,bad=false){const d=document.createElement('div');d.className='toast'+(bad?' bad':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3200)}
async function api(p,o={}){if(STATIC_PREVIEW)throw new Error('Static preview: server API unavailable');const r=await fetch(API_BASE+p,{headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d}
function navRender(){$('#nav').innerHTML=ROUTES.map(([r,i,l])=>`<button data-route="${r}" class="${state.route===r?'active':''}" title="${esc(l)}"><span class="ico">${i}</span><span class="label">${esc(l)}</span></button>`).join('');$$('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route))}
function route(r){state.route=r;$('#topTitle').textContent=ROUTES.find(x=>x[0]===r)?.[2]||'SOT';navRender();render();if(innerWidth<=700)$('#app').classList.remove('mobile-open')}
$('#hamburger').onclick=()=>{if(innerWidth<=700)$('#app').classList.toggle('mobile-open');else{$('#app').classList.toggle('nav-collapsed');localStorage.setItem('sot_nav_collapsed',$('#app').classList.contains('nav-collapsed')?'1':'0')}};if(innerWidth>700&&localStorage.getItem('sot_nav_collapsed')==='1')$('#app').classList.add('nav-collapsed');$('#buildPill').textContent=`UI v${APP_VERSION} · ${BUILD_ID}${STATIC_PREVIEW?' · static preview':''}`;
async function loadProjects(){if(STATIC_PREVIEW){state.projects=[];state.deleted=[];return}const all=await api('/projects?include_deleted=1');state.projects=all.filter(x=>!x.deleted_at);state.deleted=all.filter(x=>x.deleted_at)}
async function loadProject(t){if(!t)return null;if(state.projectCache.has(t))return state.projectCache.get(t);const p=await api('/projects/'+encodeURIComponent(t));state.projectCache.set(t,p);return p}
async function boot(){navRender();if(!STATIC_PREVIEW)try{await api('/health');state.apiLive=true;state.config=await api('/config');try{const f=await api('/fs?path=/');state.roots=f.locations||[]}catch{}await loadProjects()}catch(e){state.apiLive=false}render()}
function shell(title,desc,body){$('#content').innerHTML=`<div class="pagehead"><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>${body}`}
function render(){({configuration:renderConfiguration,setup:renderSetup,operations:renderOperations,database:renderDatabase,build:renderBuild,reporting:renderReporting}[state.route]||renderConfiguration)()}

/* ---------- reusable inline config folder browser ---------- */
function configBrowserHtml(){if(!state.cfgBrowser)return'';return`<div class="folderPicker" id="cfgPicker"><div class="fpHead"><button class="btn" id="cfgUp" ${!state.cfgBrowser.history?.length||state.cfgBrowser.history.length<=1?'disabled':''}>↑ Up</button><div class="fpPath mono" id="cfgPath">${esc(state.cfgBrowser.current||'Select a location')}</div><button class="btn primary" id="cfgUse" ${!state.cfgBrowser.current?'disabled':''}>Use this folder</button><button class="btn" id="cfgClose">Close</button></div><div class="fpGrid" id="cfgGrid"><div class="fpPlaces" id="cfgPlaces"></div><div class="fpList" id="cfgList"></div></div></div>`}
function renderConfigBrowser(){if(!state.cfgBrowser)return;const places=$('#cfgPlaces'),list=$('#cfgList');let ph='';if(!STATIC_PREVIEW&&state.apiLive)ph+=state.roots.map(r=>`<button class="placeBtn" data-cfg-root="${esc(r.path)}">${esc(r.name)}<small>${esc(r.path)}</small></button>`).join('');ph+=`<button class="placeBtn" id="cfgDevice">This device<small>Browser-authorized folder</small></button>`;places.innerHTML=ph;$$('[data-cfg-root]').forEach(b=>b.onclick=()=>cfgSelectRoot(b.dataset.cfgRoot));$('#cfgDevice').onclick=cfgChooseDevice;if(state.cfgBrowser.local){list.innerHTML=`<div class="empty"><strong>${esc(state.cfgBrowser.local.name)}</strong>Browser-local folder selected.</div>`;return}if(!state.cfgBrowser.current){list.innerHTML='<div class="empty"><strong>Select a location</strong>Browse to the directory you want to use.</div>';return}list.innerHTML=state.cfgBrowser.loading?'<div class="empty">Loading…</div>':`<div class="sourceTableHead" style="top:0"><span></span><span>Name</span><span>Type</span></div>${(state.cfgBrowser.folders||[]).map(n=>`<div class="sourceRow"><span></span><button class="sourceOpen" data-cfg-folder="${esc(n)}">▱ ${esc(n)}</button><span class="sourceKind">Folder</span></div>`).join('')||'<div class="empty">No child folders.</div>'}`;$$('[data-cfg-folder]').forEach(b=>b.onclick=()=>cfgDrill(b.dataset.cfgFolder))}
async function cfgSelectRoot(p){state.cfgBrowser={...state.cfgBrowser,current:p,history:[p],local:null,loading:true,folders:[]};renderConfiguration();try{const d=await api('/fs?path='+encodeURIComponent(p));state.cfgBrowser={...state.cfgBrowser,current:d.path||p,folders:d.folders||[],loading:false};renderConfiguration()}catch(e){toast(e.message,true);state.cfgBrowser.loading=false;renderConfiguration()}}
async function cfgDrill(n){const next=state.cfgBrowser.current.replace(/\/$/,'')+'/'+n;state.cfgBrowser.history.push(next);state.cfgBrowser.current=next;state.cfgBrowser.loading=true;renderConfiguration();try{const d=await api('/fs?path='+encodeURIComponent(next));state.cfgBrowser.current=d.path||next;state.cfgBrowser.folders=d.folders||[];state.cfgBrowser.loading=false;renderConfiguration()}catch(e){toast(e.message,true);state.cfgBrowser.loading=false;renderConfiguration()}}
async function cfgChooseDevice(){if(window.showDirectoryPicker){try{const h=await showDirectoryPicker();state.cfgBrowser={...state.cfgBrowser,current:'device://'+h.name,local:{name:h.name},history:['device://'+h.name],folders:[]};renderConfiguration()}catch(e){if(e.name!=='AbortError')toast(e.message,true)}}else{const i=document.createElement('input');i.type='file';i.webkitdirectory=true;i.onchange=()=>{const f=i.files?.[0];if(!f)return;const n=(f.webkitRelativePath||f.name).split('/')[0];state.cfgBrowser={...state.cfgBrowser,current:'device://'+n,local:{name:n},history:['device://'+n],folders:[]};renderConfiguration()};i.click()}}
function bindConfigBrowser(){if(!state.cfgBrowser)return;renderConfigBrowser();$('#cfgClose').onclick=()=>{state.cfgBrowser=null;renderConfiguration()};$('#cfgUse').onclick=()=>{const p=state.cfgBrowser.current;if(!p)return;if(state.cfgTarget==='db')$('#dbPath').value=p.startsWith('device://')?p:p.replace(/\/$/,'')+'/sot.sqlite';else $('#dbBackup').value=p;state.cfgBrowser=null;renderConfiguration()};$('#cfgUp').onclick=async()=>{if(state.cfgBrowser.history.length<=1)return;state.cfgBrowser.history.pop();const p=state.cfgBrowser.history[state.cfgBrowser.history.length-1];state.cfgBrowser.current=p;state.cfgBrowser.loading=true;renderConfiguration();if(p.startsWith('device://'))return;try{const d=await api('/fs?path='+encodeURIComponent(p));state.cfgBrowser.current=d.path||p;state.cfgBrowser.folders=d.folders||[];state.cfgBrowser.loading=false;renderConfiguration()}catch(e){toast(e.message,true)}}}

function sourceBuilderHtml(){const name=state.draft.name.trim()||'Project',collapsed=localStorage.getItem('sot_source_drives_collapsed')==='1',h=localStorage.getItem(innerWidth<=1000?'sot_source_height_mobile':'sot_source_height')||(innerWidth<=1000?'640px':'470px'),cols=JSON.parse(localStorage.getItem('sot_source_cols')||'[22,46,32]');return`<div id="sourceBuilder" class="sourceBuilder ${collapsed?'drives-collapsed':''}" style="--sourceHeight:${h};--sourceHeightMobile:${h};--p1:${cols[0]}%;--p2:${cols[1]}%;--p3:${cols[2]}%"><div id="sourceGrid" class="sourceGrid"><section class="pane"><div class="paneHeader"><button id="driveToggle" class="paneMenu" title="Open/close Source Drives">☰</button><span class="grow driveHeaderText">1 · Source Drives</span></div><div id="drivePane" class="paneBody driveBody"></div></section><div class="gutter" data-gutter="1"></div><section class="pane"><div class="paneHeader"><span class="grow">2 · Source(s)</span></div><div class="sourceToolbar"><button class="btn" id="sourceUp" disabled>↑ Up</button><div id="sourcePath" class="sourcePath mono">Select a source drive</div></div><div id="sourcePane" class="paneBody"><div class="empty"><strong>Select a source drive</strong>The selected drive/folder appears here first; check it to add the whole source or open it to browse.</div></div><div class="addBar"><button id="sourceAdd" class="btn primary" disabled>＋ Add selected</button></div></section><div class="gutter" data-gutter="2"></div><section class="pane"><div class="paneHeader"><span id="projectPaneTitle" class="grow">3 · ${esc(name)}</span></div><div id="stagedPane" class="paneBody stagedWrap"></div></section></div></div>`}
function renderSetup(){shell('Project Setup','Define the project and its source set on one surface.',`${STATIC_PREVIEW?'<div class="callout warn">Static preview: source-builder behavior is testable here. Create Project becomes authoritative after migration to WSL/OpenClaw.</div>':''}<div class="card panel"><div class="grid2"><div class="field"><label class="labelText">Project Name</label><input id="projectName" class="input" value="${esc(state.draft.name)}" placeholder="e.g. Family archive"></div><div class="field"><label class="labelText">Project Note / Description</label><input id="projectNote" class="input" value="${esc(state.draft.notes)}" placeholder="Optional context for this project"></div></div>${sourceBuilderHtml()}<div class="createBar"><button id="createProject" class="btn primary" ${STATIC_PREVIEW||!state.apiLive?'disabled':''}>Create Project</button></div></div>`);$('#projectName').oninput=e=>{state.draft.name=e.target.value;$('#projectPaneTitle').textContent='3 · '+(e.target.value.trim()||'Project')};$('#projectNote').oninput=e=>state.draft.notes=e.target.value;bindSourceBuilder();$('#createProject').onclick=createProject}
function bindResizePersistence(){const b=$('#sourceBuilder');if(!b)return;const save=()=>localStorage.setItem(innerWidth<=1000?'sot_source_height_mobile':'sot_source_height',`${Math.round(b.getBoundingClientRect().height)}px`);new ResizeObserver(save).observe(b);if(innerWidth<=1000)return;const grid=$('#sourceGrid');$$('.gutter').forEach(g=>g.onpointerdown=e=>{e.preventDefault();g.setPointerCapture(e.pointerId);g.classList.add('dragging');const start=e.clientX,rect=grid.getBoundingClientRect(),base=JSON.parse(localStorage.getItem('sot_source_cols')||'[22,46,32]');g.onpointermove=ev=>{const d=(ev.clientX-start)/rect.width*100;let c=[...base];if(g.dataset.gutter==='1'){c[0]=Math.max(12,Math.min(36,base[0]+d));c[1]=Math.max(28,Math.min(65,base[1]-d))}else{c[1]=Math.max(28,Math.min(65,base[1]+d));c[2]=Math.max(18,Math.min(45,base[2]-d))}const total=c.reduce((a,v)=>a+v,0);c=c.map(v=>v/total*100);grid.style.gridTemplateColumns=`${c[0]}% 5px ${c[1]}% 5px minmax(0,${c[2]}%)`;grid.dataset.cols=JSON.stringify(c)};g.onpointerup=()=>{g.classList.remove('dragging');if(grid.dataset.cols)localStorage.setItem('sot_source_cols',grid.dataset.cols);g.onpointermove=null;g.onpointerup=null}})}
function bindSourceBuilder(){const ctx={active:null,current:null,history:[],folders:[],files:[],checked:new Map(),localCandidate:null};$('#driveToggle').onclick=()=>{const b=$('#sourceBuilder');b.classList.toggle('drives-collapsed');localStorage.setItem('sot_source_drives_collapsed',b.classList.contains('drives-collapsed')?'1':'0')};bindResizePersistence();renderDrivePane(ctx);renderStaged();$('#sourceUp').onclick=()=>sourceUp(ctx);$('#sourceAdd').onclick=()=>addChecked(ctx)}
function renderDrivePane(ctx){let h='';if(!STATIC_PREVIEW&&state.apiLive)h+=state.roots.map(r=>`<button class="locationRow ${ctx.active?.path===r.path?'active':''}" data-source-root="${esc(r.path)}">${esc(r.name)}<small>${esc(r.path)}</small></button>`).join('');h+=`<button class="locationRow" id="sourceDevice">This device<small>Choose a browser-authorized folder</small></button>`;$('#drivePane').innerHTML=h;$$('[data-source-root]').forEach(b=>b.onclick=()=>selectSourceRoot(ctx,state.roots.find(r=>r.path===b.dataset.sourceRoot)));$('#sourceDevice').onclick=()=>selectLocalSource(ctx)}

async function loadSourceDir(ctx,p){$('#sourcePane').innerHTML='<div class="empty">Loading…</div>';try{const d=await api('/fs?path='+encodeURIComponent(p));ctx.current=d.path||p;ctx.folders=d.folders||[];ctx.files=d.files||[];$('#sourcePath').textContent=ctx.current;$('#sourceUp').disabled=ctx.history.length<=1;renderSourceDir(ctx)}catch(e){$('#sourcePane').innerHTML=`<div class="empty"><strong>Unable to browse</strong>${esc(e.message)}</div>`}}

function toggleChecked(ctx,key,obj,on){if(on)ctx.checked.set(key,obj);else ctx.checked.delete(key);updateAdd(ctx)}function updateAdd(ctx){const b=$('#sourceAdd');b.disabled=!ctx.checked.size;b.textContent=ctx.checked.size?`＋ Add selected (${ctx.checked.size})`:'＋ Add selected'}

async function createProject(){const name=$('#projectName').value.trim();if(!name||!state.draft.sources.length){toast('Project Name and at least one source are required.',true);return}try{const p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,notes:$('#projectNote').value,sources:state.draft.sources})});state.draft={name:'',notes:'',sources:[]};state.projectCache.clear();await loadProjects();state.selectedProject=p;toast('Project created.');route('operations')}catch(e){toast(e.message,true)}}

function renderProjectList(){const list=$('#projectList');if(!list)return;let h=`<button id="deletedToggle" class="deletedToggle">${state.opsDeletedOpen?'⌄':'›'} Deleted / Restore (${state.deleted.length})</button>`;if(state.opsDeletedOpen)h+=state.deleted.map(p=>`<div class="projectItem" title="${esc(projectTitle(p))}"><strong>${esc(p.project_name)}</strong><small>${esc(shortDate(p.created_at))}</small><button class="restoreBtn" data-restore="${esc(p.project_token)}">Restore</button></div>`).join('')||'<div class="empty">No deleted projects.</div>';h+=state.projects.map(p=>`<div class="projectItem ${state.selectedProject?.project_token===p.project_token?'active':''}" data-project="${esc(p.project_token)}" title="${esc(projectTitle(p))}"><strong>${esc(p.project_name)}</strong><small>${esc(shortDate(p.created_at))}</small><button class="projectDelete" data-soft-delete="${esc(p.project_token)}" title="Soft delete">×</button></div>`).join('')||'<div class="empty"><strong>No projects</strong>Create a project in Project Setup.</div>';list.innerHTML=h;$('#deletedToggle').onclick=()=>{state.opsDeletedOpen=!state.opsDeletedOpen;renderProjectList()};$$('[data-project]').forEach(x=>{x.onclick=async e=>{if(e.target.closest('[data-soft-delete]'))return;try{state.selectedProject=await loadProject(x.dataset.project);renderProjectList();renderOpsProject()}catch(err){toast(err.message,true)}};x.onmouseenter=async()=>{if(STATIC_PREVIEW)return;try{const p=await loadProject(x.dataset.project);x.title=projectHoverText(p)}catch{}}});$$('[data-soft-delete]').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(!confirm('Soft delete this project? It can be restored.'))return;try{await api('/projects/'+encodeURIComponent(b.dataset.softDelete),{method:'DELETE'});state.projectCache.clear();if(state.selectedProject?.project_token===b.dataset.softDelete)state.selectedProject=null;await loadProjects();renderOperations()}catch(err){toast(err.message,true)}});$$('[data-restore]').forEach(b=>b.on function renderOpsProject(){const el=$('#opsMain');if(!el)return;const p=state.selectedProject;if(!p){el.innerHTML='<div class="empty"><strong>Select a project</strong>Project status and operational evidence appear here.</div>';return}const run=p.run||null,progress=Math.max(0,Math.min(100,Number(run?.progress_percent||0))),status=p.status||'Pending',start=run?.started_at||'Not started',etc=run?.estimated_completion_at||'Not available';el.innerHTML=`<div class="sectionTitle"><div><h3>${esc(p.project_name)}</h3><div class="mono muted">${esc(p.project_token)}</div></div><button class="btn reportChip" id="opsReport">Reporting</button></div><div class="statusGrid"><div class="statusCell"><div class="k">Status</div><div class="v">${esc(status)}</div></div><div class="statusCell"><div class="k">Created</div><div class="v">${esc(shortDate(p.created_at))}</div></div><div class="statusCell"><div class="k">Activity</div><div class="v">${run?'Active evidence':'Pending'}</div></div><div class="statusCell"><div class="k">Completed</div><div class="v">${progress.toFixed(0)}%</div><div class="progressTrack"><div class="progressFill" style="width:${progress}%"></div></div></div><div class="statusCell"><div class="k">Start time</div><div class="v" style="font-size:11px">${esc(start)}</div></div><div class="statusCell"><div class="k">ETC</div><div class="v" style="font-size:11px">${esc(etc)}</div></div></div><div class="opActions"><button class="btn primary" disabled title="ENGINE_NOT_READY">Run</button><button class="btn" disabled title="ENGINE_NOT_READY">Stop</button><span class="badge warn">ENGINE_NOT_READY · fingerprint/inventory ships v0.4.0</span></div><div class="sectionTitle"><h3>Sources</h3><span class="muted">${(p.sources||[]).length} source(s)</span></div><div class="sourceMini">${(p.sources||[]).map(s=>`<div class="sourceMiniRow"><div class="mono">${esc(s.original_path_or_locator||s.path||'')}</div>${s.note?`<div class="muted">${esc(s.note)}</div>`:''}</div>`).join('')||'< async function openProjectReport(t){let r=null;if(!STATIC_PREVIEW)try{r=await api('/projects/'+encodeURIComponent(t)+'/report')}catch(e){toast(e.message,true);return}const p=r?.project||state.selectedProject,inv=r?.inventory,dup=r?.duplicates,conf=r?.conflicts;$('#modalRoot').innerHTML=`<div class="modalBack"><div class="modal"><div class="modalHead"><h3>Reporting · ${esc(p?.project_name||'Project')}</h3><button class="close" id="modalClose">×</button></div><div class="modalBody"><div class="grid3"><div class="statusCell"><div class="k">Sources</div><div class="v">${p?.sources?.length||0}</div></div><div class="statusCell"><div class="k">Files</div><div class="v">${inv?.available?Number(inv.files||0).toLocaleString():'Not inventoried'}</div></div><div class="statusCell"><div class="k">Size</div><div class="v">${inv?.available?formatBytes(inv.bytes):'Not inventoried'}</div></div></div><div class="sectionTitle" style="margin-top:14px"><h3>Sources</h3></div>${(p?.sources||[]).map(s=>`<div class="sourceMiniRow"><div class="mono">${esc(s.original_path_or_locator||'')}</div><div class="muted">${esc(s.note||'')}</div></div>`).join('')}<div class="sectionTitle" style="margin-top:14px"><h3>Exact duplicates</h3></div><div class="callout">${dup?.available?`${dup.duplicate_files||0} duplicate file(s), ${formatBytes(dup.duplicate_bytes||0)}`:'Not analyzed'}</div><div class="sectionTitle" style="margin-top:14px"><h3>Different / conflicts</h3></div><div class="callout">${conf?.available?`${conf.items.length} conflict(s)`:'Not analyzed'}</div></div></div></div>`;$('#modalClose').onclick=()=>$('#modalRoot').innerHTML=''}

async function ensureDbTables(){if(STATIC_PREVIEW)return;if(!state.dbTables.length)state.dbTables=await api('/db/tables')}
async function renderDatabase(){shell('Database Administration','Inspect the SOT database and edit allowed mutable columns. Identity columns remain protected.',`${STATIC_PREVIEW?'<div class="callout warn" style="margin-bottom:9px">Static preview: the data grid activates against the authoritative WSL database.</div>':''}<div class="card panel"><div class="dbToolbar"><select id="dbTableSelect" class="select" style="max-width:260px"><option value="">Select table</option></select><button id="dbRefresh" class="btn" ${STATIC_PREVIEW?'disabled':''}>Refresh</button><button id="dbIntegrity" class="btn" ${STATIC_PREVIEW?'disabled':''}>Integrity check</button><span id="dbStatus" class="muted"></span></div><div id="dbGrid" class="callout">Select an allowed table to view rows and columns.</div></div>`);if(STATIC_PREVIEW)return;try{await ensureDbTables();const s=$('#dbTableSelect');s.innerHTML='<option value="">Select table</option>'+state.dbTables.map(t=>`<option value="${esc(t.name)}" ${state.dbTable===t.name?'selected':''}>${esc(t.name)}</option>`).join('');s.onchange=async()=>{state.dbTable=s.value||null;await loadDbTable()};$('#dbRefresh').onclick=loadDbTable;$('#dbIntegrity').onclick=async()=>{try{const x=await api('/config/integrity');$('#dbStatus').textContent='Integrity: '+x.result}catch(e){toast(e.message,true)}};if(state.dbTable)await loadDbTable()}catch(e){$('#dbGrid').innerHTML=`<div class="callout bad">${esc(e.message)}</div>`}}
async function loadDbTable(){if(!state.dbTable){$('#dbGrid').innerHTML='Select an allowed table.';return}try{const d=await api('/db/table/'+encodeURIComponent(state.dbTable));const mutable=new Set((state.dbTables.find(x=>x.name===state.dbTable)?.columns||[]).filter(c=>!c.pk).map(c=>c.name));$('#dbGrid').className='tableWrap';$('#dbGrid').innerHTML=`<table class="dataTable"><thead><tr>${d.columns.map(c=>`<th>${esc(c.name)}${c.pk?' 🔒':''}</th>`).join('')}<th>Action</th></tr></thead><tbody>${d.rows.map(r=>`<tr>${d.columns.map(c=>`<td class="${c.pk?'':'editableCell'}" data-cell-col="${esc(c.name)}" data-cell-key="${esc(r[d.primary_key])}" title="${esc(r[c.name])}"><span class="cellValue">${esc(r[c.name])}</span></td>`).join('')}<td><button class="btn" data-db-delete="${esc(r[d.primary_key])}" ${state.dbTable==='projects'||state.dbTable==='meta'?'':'disabled'}>${state.dbTable==='projects'?'Soft delete':'Delete'}</button></td></tr>`).join('')||'<tr><td colspan="99">No rows</td></tr>'}</tbody></table>`;$$('.editableCell').forEach(td=>td.onclick=()=>editDbCell(td,d));$$('[data-db-delete]').forEach(b=>b.onclick=()=>deleteDbRow(b.dataset.dbDelete))}catch(e){toast(e.message,true)}}
async function editDbCell(td,d){const col=td.dataset.cellCol,key=td.dataset.cellKey,table=state.dbTable,allowed={projects:['project_name','active','status','current_stage','notes','deleted_at'],sources:['operator_label','operator_note','source_status','last_seen_at'],runs:['status','checkpoint_state','progress_percent','estimated_completion_at','ended_at'],meta:['value']}[table]||[];if(!allowed.includes(col)){toast('That column is read-only.',true);return}const old=td.textContent.trim(),v=prompt(`Edit ${table}.${col}`,old);if(v===null)return;let value=v;if(['active','progress_percent'].includes(col))value=Number(v);if(v==='NULL')value=null;try{await api(`/db/table/${encodeURIComponent(table)}/${encodeURIComponent(key)}`,{method:'PATCH',body:JSON.stringify({[col]:value})});await loadDbTable();toast('Row updated.')}catch(e){toast(e.message,true)}}
async function deleteDbRow(key){if(!confirm(`${state.dbTable==='projects'?'Soft delete':'Delete'} row ${key}?`))return;try{await api(`/db/table/${encodeURIComponent(state.dbTable)}/${encodeURIComponent(key)}`,{method:'DELETE'});await loadDbTable();if(state.dbTable==='projects'){state.projectCache.clear();await loadProjects()}toast('Row updated.')}catch(e){toast(e.message,true)}}

/* ---------- build and reporting ---------- */
function renderBuild(){shell('SOT Build & Promotion','This stage activates after Project Operations has approved dedup/analysis evidence.',`<div class="card panel"><div class="callout"><strong>Planned deterministic flow</strong><br>Choose Target SOT + backup → generate copy plan/scripts → preflight/dry run → execute copy-only plan → verify → promote → write lineage to the SOT DB.</div></div>`)}
async function renderReporting(){shell('Reporting','Basic reporting starts now from stored project/source/event evidence and expands as inventory/dedup/promotion evidence exists.',`${STATIC_PREVIEW?'<div class="callout warn" style="margin-bottom:9px">Static preview: authoritative report values appear after migration to WSL/OpenClaw.</div>':''}<div id="reportBody" class="card panel"><div class="empty">Loading report evidence…</div></div>`);if(STATIC_PREVIEW){$('#reportBody').innerHTML='<div class="callout">No authoritative database is available on GitHub Pages.</div>';return}try{state.reportSummary=await api('/reports/summary');state.reportTimeline=await api('/reports/timeline');const p=state.reportSummary.projects||{};$('#reportBody').innerHTML=`<div class="grid3"><div class="statusCell"><div class="k">Current projects</div><div class="v">${p.current||0}</div></div><div class="statusCell"><div class="k">Sources</div><div class="v">${state.reportSummary.sources||0}</div></div><div class="statusCell"><div class="k">Events</div><div class="v">${state.reportSummary.events||0}</div></div><div class="statusCell"><div class="k">Pending</div><div class="v">${p.pending||0}</div></div><div class="statusCell"><div class="k">WIP</div><div class="v">${p.wip||0}</div></div><div class="statusCell"><div class="k">Closed</div><div class="v">${p.closed||0}</div></div></div><div class="sectionTitle" style="margin-top:14px"><h3>Recent audit timeline</h3></div>${state.reportTimeline.slice(0,40).map(e=>`<div class="sourceMiniRow"><strong>${esc(e.event_type)}</strong> <span class="muted">${esc(e.created_at)}</span><div class="mono">${esc(e.project_token||'')}</div></div>`).join('')||'<div class="callout">No events yet.</div>'}`}catch(e){$('#reportBody').innerHTML=`<div class="callout bad">${esc(e.message)}</div>`}}

boot();
</script></body></html>
