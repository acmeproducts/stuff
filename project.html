<script>
'use strict';
const VERSION='0.4.0',BUILD='2026.08.12.6.0',LOCAL=location.hostname.endsWith('.github.io'),API='/report/api/sot';
const ROUTES=[['configuration','⚙','Configuration'],['setup','＋','Project Setup'],['fingerprinting','◉','Fingerprinting'],['database','▦','Database Administration'],['build','⇢','SOT Build & Promotion'],['reporting','≡','Reporting']];
const state={route:'configuration',config:null,projects:[],selected:null,draft:{name:'',notes:'',sources:[]},roots:[],authorizedRoots:new Map(),builder:{rootKey:null,path:'',search:'',sort:'name',dir:1,selected:new Map(),mobilePanel:'drives'},fpTab:'sources'};const runCtl={stop:false};let db=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function now(){return new Date().toISOString();}function uid(){const a=new Uint8Array(12);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,'0')).join('');}function fmtBytes(n){n=Number(n||0);if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return`${n.toFixed(i?1:0)} ${u[i]}`;}function fmtDate(v){if(!v)return'—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString();}function toast(m,b=false){const d=document.createElement('div');d.className='toast'+(b?' bad':'');d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3200);}function renderNav(){$('#nav').innerHTML=ROUTES.map(([r,i,l])=>`<button data-route="${r}" class="${state.route===r?'active':''}" title="${esc(l)}"><span>${i}</span><span class="label">${esc(l)}</span></button>`).join('');$$('[data-route]').forEach(b=>b.onclick=()=>route(b.dataset.route));}function route(r){state.route=r;$('#topTitle').textContent=ROUTES.find(x=>x[0]===r)?.[2]||'SOT';renderNav();render();if(innerWidth<=700)$('#app').classList.remove('mobile-open');}function toggleNav(){if(innerWidth<=700)$('#app').classList.toggle('mobile-open');else{$('#app').classList.toggle('nav-collapsed');localStorage.setItem('sot_nav_collapsed',$('#app').classList.contains('nav-collapsed')?'1':'0');}}$('#hamburger').onclick=toggleNav;if(innerWidth>700&&localStorage.getItem('sot_nav_collapsed')==='1')$('#app').classList.add('nav-collapsed');$('#build').textContent=`UI v${VERSION} · ${BUILD} · ${LOCAL?'Browser':'WSL'}`;function shell(t,d,b){$('#content').innerHTML=`<div class="pagehead"><h2>${esc(t)}</h2><p>${esc(d)}</p></div>${b}`;}
function openDB(){if(db)return Promise.resolve(db);return new Promise((res,rej)=>{const q=indexedDB.open('sot-local-v2',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('config'))d.createObjectStore('config');if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'project_token'});if(!d.objectStoreNames.contains('roots'))d.createObjectStore('roots',{keyPath:'key'});if(!d.objectStoreNames.contains('manifest'))d.createObjectStore('manifest',{keyPath:'id'});};q.onsuccess=()=>{db=q.result;res(db)};q.onerror=()=>rej(q.error);});}async function idbGet(store,key){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).get(key);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}async function idbPut(store,val,key){const d=await openDB();return new Promise((res,rej)=>{const os=d.transaction(store,'readwrite').objectStore(store),q=key===undefined?os.put(val):os.put(val,key);q.onsuccess=()=>res(val);q.onerror=()=>rej(q.error);});}async function idbAll(store){const d=await openDB();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);});}async function idbDeletePrefix(store,prefix){const d=await openDB();return new Promise((res,rej)=>{const tx=d.transaction(store,'readwrite'),os=tx.objectStore(store),q=os.openCursor();q.onsuccess=()=>{const c=q.result;if(!c)return;if(String(c.key).startsWith(prefix))c.delete();c.continue();};tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}async function api(path,opt={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json();}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d;}async function loadProjects(){state.projects=LOCAL?(await idbAll('projects')).sort((a,b)=>String(b.updated_at||b.created_at).localeCompare(String(a.updated_at||a.created_at))):await api('/projects?include_deleted=1');}async function getProject(t){return LOCAL?idbGet('projects',t):api('/projects/'+encodeURIComponent(t));}async function boot(){renderNav();if(LOCAL){await openDB();state.config=await idbGet('config','main')||{mode:'browser',ready:false,schema_version:2};await loadProjects();const roots=await idbAll('roots');for(const r of roots)state.authorizedRoots.set(r.key,r);}else{try{state.config=await api('/config');await loadProjects();const x=await api('/fs?path=/');state.roots=x.locations||[];}catch(e){state.config={error:e.message};}}render();}function render(){({configuration:renderConfig,setup:renderSetup,fingerprinting:renderFingerprinting,database:renderDatabase,build:renderBuild,reporting:renderReporting}[state.route]||renderConfig)();}
function renderConfig(){if(LOCAL){const ready=!!state.config?.ready;shell('Configuration','Initialize the authoritative project/fingerprint database and protect it with portable backups.',`<div class="card panel"><div class="sectionTitle"><h3>Project database</h3><span class="badge ${ready?'good':'warn'}">${ready?'Ready':'Not initialized'}</span></div><div class="callout">Stored on this device/browser profile. No filesystem path is required.</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="initDb">Initialize / Validate</button><button class="btn" id="exportDb" ${ready?'':'disabled'}>Export backup</button><label class="btn" for="importDb" ${ready?'':'style="opacity:.4"'}>Import backup</label><input id="importDb" type="file" accept="application/json,.json" class="hidden"></div><div id="cfgStatus" style="margin-top:9px"></div></div>`);$('#initDb').onclick=async()=>{state.config={mode:'browser',ready:true,schema_version:2,updated_at:now()};await idbPut('config',state.config,'main');$('#cfgStatus').innerHTML='<div class="callout good">Database initialized and read/write validated.</div>';renderConfig();};$('#exportDb').onclick=exportBackup;$('#importDb').onchange=importBackup;}else{const c=state.config||{};shell('Configuration','Configure the authoritative SQLite database used by the existing WSL SOT server.',`<div class="card panel"><div class="grid2"><div class="field"><label class="label">Project database</label><input class="input mono" id="dbPath" value="${esc(c.database_path||'')}"></div><div class="field"><label class="label">Backup folder</label><input class="input mono" id="backupPath" value="${esc(c.database_backup_path||'')}"></div></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveCfg">Save & validate</button><button class="btn" id="integrityCfg">Integrity check</button></div><div id="cfgStatus" style="margin-top:9px"></div></div>`);$('#saveCfg').onclick=async()=>{try{state.config=await api('/config',{method:'POST',body:JSON.stringify({database_path:$('#dbPath').value.trim(),database_backup_path:$('#backupPath').value.trim(),create_if_missing:true})});$('#cfgStatus').innerHTML='<div class="callout good">SQLite database validated.</div>';}catch(e){$('#cfgStatus').innerHTML=`<div class="callout bad">${esc(e.message)}</div>`;}};$('#integrityCfg').onclick=async()=>{try{const x=await api('/config/integrity');$('#cfgStatus').innerHTML=`<div class="callout ${x.ok?'good':'bad'}">${esc(x.result||x.status)}</div>`;}catch(e){toast(e.message,true);}};}}async function exportBackup(){const bundle={format:'sot-browser-backup',schema_version:2,exported_at:now(),config:state.config,projects:await idbAll('projects'),manifest:await idbAll('manifest')};const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sot-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}async function importBackup(e){const f=e.target.files?.[0];if(!f)return;try{const b=JSON.parse(await f.text());if(b.format!=='sot-browser-backup'||Number(b.schema_version)!==2)throw new Error('Unsupported backup format/schema');for(const p of b.projects||[])await idbPut('projects',p);for(const m of b.manifest||[])await idbPut('manifest',m);state.config={...(b.config||{}),ready:true,schema_version:2,updated_at:now()};await idbPut('config',state.config,'main');await loadProjects();toast('Backup imported.');renderConfig();}catch(err){toast(err.message,true);}finally{e.target.value='';}}

ne.innerHTML=`<div class="empty"><strong>Unable to browse</strong>${esc(e.message)}</div>`;}}function setupGutters(){if(innerWidth<=1000)return;let widths=(localStorage.getItem('sot_source_widths')||'21,49,30').split(',').map(Number);const grid=$('#sourceGrid');grid.style.setProperty('--p1',widths[0]+'%');grid.style.setProperty('--p2',widths[1]+'%');grid.style.setProperty('--p3',widths[2]+'%');$$('[data-gutter]').forEach(g=>g.onpointerdown=e=>{e.preventDefault();g.setPointerCapture(e.pointerId);const idx=Number(g.dataset.gutter),box=grid.getBoundingClientRect();g.classList.add('dragging');g.onpointermove=ev=>{const x=((ev.clientX-box.left)/box.width)*100;if(idx===1){const p1=Math.max(10,Math.min(35,x)),total=widths[0]+widths[1],p2=Math.max(30,total-p1);widths=[p1,p2,100-p1-p2];}else{const p3=Math.max(20,Math.min(42,100-x)),p2=100-widths[0]-p3;widths=[widths[0],p2,p3];}grid.style.setProperty('--p1',widths[0]+'%');grid.style.setProperty('--p2',widths[1]+'%');grid.style.setProperty('--p3',widths[2]+'%');};g.onpointerup=()=>{g.classList.remove('dragging');localStorage.setItem('sot_source_widths',widths.map(x=>x.toFixed(1)).join(','));g.onpointermove=null;};});}async function createProject(){const name=$('#projectName').value.trim();if(!name||!state.draft.sources.length){toast('Project name and at least one source are required.',true);return;}try{let p;if(LOCAL){const t=uid(),ts=now();p={project_token:t,project_name:name,notes:$('#projectNote').value.trim(),active:1,status:'Pending',current_stage:'fingerprinting',created_at:ts,updated_at:ts,deleted_at:null,progress_percent:0,start_time:null,etc:null,sources:state.draft.sources.map(s=>({...s,project_token:t}))};await idbPut('projects',p);await loadProjects();}else p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,notes:$('#projectNote').value.trim(),sources:state.draft.sources})});state.draft={name:'',notes:'',sources:[]};state.selected=p;toast('Project created.');route('fingerprinting');}catch function renderFingerprinting(){const active=state.projects.filter(p=>!p.deleted_at);if(state.selected&&!active.find(p=>p.project_token===state.selected.project_token))state.selected=null;shell('Fingerprinting','Fingerprint and inventory each project source. Progress reflects real source processing, not workflow stage completion.',`<div class="card fpLayout"><aside class="projectRail"><div class="railHead">Projects</div>${active.map(projectRow).join('')||'<div class="empty">No active projects</div>'}</aside><section class="fpMain" id="fpMain">${state.selected?fingerprintDetail(state.selected):'<div class="empty"><strong>Select a project</strong>Fingerprint status and controls appear here.</div>'}</section></div>`);$$('[data-project]').forEach(x=>x.onclick=async e=>{if(e.target.closest('[data-delete]'))return;state.selected=await getProject(x.dataset.project);renderFingerprinting();});$$('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();softDelete(b.dataset.delete);});if(state.selected)wireFingerprinting(state.selected);}function projectRow(p){return`<div class="projectItem ${state.selected?.project_token===p.project_token?'active':''}" data-project="${p.project_token}" title="${esc([p.notes,...(p.sources||[]).map(s=>(s.locator||s.path)+(s.note?' — '+s.note:''))].filter(Boolean).join('\n'))}"><strong>${esc(p.project_name)}</strong><small>${new Date(p.created_at).toLocaleDateString()} · ${esc(p.status||'Pending')}</small><button class="projectX" data-delete="${p.project_token}">×</button></div>`;}function fingerprintDetail(p){const pct=Math.round(Number(p.progress_percent||0)),wip=p.status==='WIP',complete=(p.sources||[]).length>0&&(p.sources||[]).every(s=>s.fingerprint);return`<div class="sectionTitle"><h3>${esc(p.project_name)}</h3><span class="badge ${complete?'good':'warn'}">${complete?'Fingerprint complete':wip?'WIP':'Pending'}</span></div><div class="statusGrid"><div class="statusCell"><div class="k">Status</div><div class="v">${esc(p.status||'Pending')}</div></div><div class="statusCell"><div class="k">Created</div><div class="v">${new Date(p.created_at).toLocaleDateString()}</div></div><div class="statusCell"><div class="k">Activity</div><div class="v">${wip?'Fingerprinting':'Idle'}</div></div><div class="statusCell"><div class="k">Fingerprint</div><div class="v">${pct}%</div><div class="progressTrack"><div class="progressFill" style="width:${pct}%"></div></div></div><div class="statusCell"><div class="k">Start time</div><div class="v">${p.start_time?new Date(p.start_time).toLocaleTimeString():'—'}</div></div><div class="statusCell"><div class="k">ETC</div><div class="v">${p.etc?new Date(p.etc).toLocaleTimeString():'—'}</div></div></div><div class="fpActions"><button class="btn primary" id="runFp" ${wip?'disabled':''}>${p.fingerprint_checkpoint?'Continue':'Run'}</button><button class="btn" id="stopFp" ${wip?'':'disabled'}>Stop</button><button class="btn" id="reauthFp" ${LOCAL?'':'disabled'}>Reconnect source</button></div><div class="tabs"><button data-fptab="sources" class="${state.fpTab==='sources'?'active':''}">Sources</button><button data-fptab="manifest" class="${state.fpTab==='manifest'?'active':''}">Manifest</button><button data-fptab="analysis" class="${state.fpTab==='analysis'?'active':''}">Dedup / Analysis</button><button data-fptab="recommend" class="${state.fpTab==='recommend'?'active':''}">Recommendation</button></div><div id="fpTabBody">${fingerprintTabBody(p)}</div>`;}function fingerprintTabBody(p){if(state.fpTab==='sources')return(p.sources||[]).map(s=>`<div class="sourceStatus"><div class="sourceStatusHead"><strong>${esc(s.operator_label||s.locator||s.path)}</strong><span class="badge ${s.fingerprint?'good':'warn'}">${s.fingerprint?'Fingerprint':'Pending'}</span></div><div class="sourceStatusPath mono" title="${esc(s.locator||s.path)}">${esc(s.locator||s.path)}</div><div class="muted">${esc(s.note||'')} · ${s.file_count??'—'} files · ${fmtBytes(s.byte_size)} · ${s.fingerprinted_at?`fingerprinted ${fmtDate(s.fingerprinted_at)}`:'not fingerprinted'}</div>${s.fingerprint?`<div class="mono" style="margin-top:5px">SHA-256 manifest: ${esc(s.fingerprint)}</div>`:''}</div>`).join('')||'<div class="empty">No sources</div>';if(state.fpTab==='manifest')return'<div id="manifestView"><div class="empty">Select Run to generate manifest evidence.</div></div>';if(state.fpTab==='analysis')return'<div class="callout">Exact duplicate analysis unlocks after content hashing in the next engine stage. No duplicate values are invented here.</div>';return'<div class="callout">Recommendation remains locked until dedup evidence exists.</div>';}function wireFingerprinting(p){$('#runFp').onclick=()=>runFingerprint(p);$('#stopFp').onclick=()=>{runCtl.stop=true;};$('#reauthFp').onclick=()=>reauthorizeProject(p);$$('[data-fptab]').forEach(b=>b.onclick=async()=>{state.fpTab=b.dataset.fptab;renderFingerprinting();if(state.fpTab==='manifest'&&state.selected)await renderManifest(state.selected);});if(state.fpTab==='manifest')renderManifest(p);}async function reauthorizeProject(p){const root=await authorizeRoot();if(!root)return;toast('Root authorized. If its name matches a project source root, Run can continue.');}async function hashText(s){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function runFingerprint(p){if(!LOCAL){toast('WSL fingerprint engine endpoint is not installed in this UI-only GitPages gate.',true);return;}runCtl.stop=false;p.status='WIP';p.start_time=p.start_time||now();p.progress_percent=Number(p.progress_percent||0);await idbPut('projects',p);state.selected=p;renderFingerprinting();try{let total=0,work=[];for(const s of p.sources||[]){const root=state.authorizedRoots.get(s.root_key);if(!root)throw new Error('Reconnect source root '+(s.root_key||s.locator));await ensureRootFiles(root);const files=sourceFiles(root,s.subpath);total+=files.length;work.push({s,root,files});}let done=0;const cp=p.fingerprint_checkpoint||{source:0,file:0};for(let si=0;si<work.length;si++){const {s,root,files}=work[si];if(si<cp.source){done+=files.length;continue;}const start=si===cp.source?cp.file:0,sig=[];if(start===0)await idbDeletePrefix('manifest',p.project_token+'|'+s.source_id+'|');else{const existing=(await idbAll('manifest')).filter(m=>m.project_token===p.project_token&&m.source_id===s.source_id).sort((a,b)=>a.relative_path.localeCompare(b.relative_path));for(const m of existing)sig.push(`${m.relative_path}|${m.size}|${m.modified}`);}for(let fi=start;fi<files.length;fi++){if(runCtl.stop){p.status='Pending';p.fingerprint_checkpoint={source:si,file:fi};p.progress_percent=total?Math.round((done/total)*100):0;await idbPut('projects',p);await loadProjects();state.selected=p;renderFingerprinting();toast('Fingerprinting stopped at checkpoint.');return;}const f=files[fi],rel=relPath(f,root.name),base=s.subpath?s.subpath.replace(/\/$/,'')+'/':'';if(base&&!(rel===s.subpath||rel.startsWith(base)))continue;let srcRel=s.subpath?rel.slice(s.subpath.length).replace(/^\//,''):rel;if(!srcRel)srcRel=f.name;const row={id:p.project_token+'|'+s.source_id+'|'+srcRel,project_token:p.project_token,source_id:s.source_id,relative_path:srcRel,normalized_relative_path:srcRel.toLowerCase(),filename:f.name,size:Number(f.size||0),modified:Number(f.lastModified||0),inventory_at:now(),signature:await hashText(`${srcRel}\0${f.size}\0${f.lastModified}`)};await idbPut('manifest',row);sig.push(`${srcRel}|${row.size}|${row.modified}`);done++;p.progress_percent=total?Math.min(99,Math.round((done/total)*100)):0;p.fingerprint_checkpoint={source:si,file:fi+1};if(done%20===0||done===total){await idbPut('projects',p);if($('#fpMain')){$('#fpMain').innerHTML=fingerprintDetail(p);wireFingerprinting(p);}await new Promise(r=>setTimeout(r,0));}}s.file_count=files.length;s.byte_size=files.reduce((a,f)=>a+Number(f.size||0),0);s.fingerprint=await hashText(sig.sort().join('\n'));s.fingerprint_version='manifest-sha256-v1';s.fingerprinted_at=now();s.last_seen_at=now();s.source_status='fingerprinted';p.fingerprint_checkpoint={source:si+1,file:0};await idbPut('projects',p);}p.status='Pending';p.progress_percent=100;p.fingerprint_checkpoint=null;p.current_stage='fingerprinted';p.last_activity_at=now();await idbPut('projects',p);await loadProjects();state.selected=p;renderFingerprinting();toast('Fingerprinting complete.');}catch(e){p.status='Pending';await idbPut('projects',p);await loadProjects();state.selected=p;renderFingerprinting();toast(e.message,true);}}
async function renderManifest(p){const el=$('#manifestView');if(!el)return;const rows=(await idbAll('manifest')).filter(m=>m.project_token===p.project_token).slice(0,2000);el.innerHTML=rows.length?`<div class="tableWrap"><table class="manifestTable"><thead><tr><th>Source</th><th>Path</th><th>Size</th><th>Modified</th><th>Signature</th></tr></thead><tbody>${rows.map(m=>`<tr><td class="mono">${esc(m.source_id.slice(0,8))}</td><td title="${esc(m.relative_path)}">${esc(m.relative_path)}</td><td>${fmtBytes(m.size)}</td><td>${m.modified?new Date(m.modified).toLocaleString():'—'}</td><td class="mono">${esc(m.signature.slice(0,16))}…</td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:6px">Showing ${rows.length} manifest rows.</div>`:'<div class="empty">No manifest rows yet.</div>';}async function softDelete(t){try{const p=await getProject(t);if(LOCAL){p.deleted_at=now();await idbPut('projects',p);}else await api('/projects/'+encodeURIComponent(t),{method:'PATCH',body:JSON.stringify({deleted_at:now()})});await loadProjects();if(state.selected?.project_token===t)state.selected=null;renderFingerprinting();}catch(e){toast(e.message,true);}}
function renderDatabase(){const projectRows=state.projects,sourceRows=projectRows.flatMap(p=>(p.sources||[]).map(s=>({...s,project_token:p.project_token,project_name:p.project_name})));shell('Database Administration','Search, sort, and edit mutable project/source metadata. Identity and fingerprint evidence remain protected.',`<div class="card panel"><div class="dbToolbar"><select class="select" id="dbTable" style="width:auto"><option value="projects">projects</option><option value="sources">sources</option></select><input class="input" id="dbSearch" style="max-width:280px" placeholder="Search rows"><button class="btn" id="dbRefresh">Refresh</button></div><div id="dbGrid"></div></div>`);const draw=()=>{const t=$('#dbTable').value,q=$('#dbSearch').value.trim().toLowerCase(),all=t==='projects'?projectRows:sourceRows,rows=all.filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q));if(!rows.length){$('#dbGrid').innerHTML='<div class="empty">No rows</div>';return;}const cols=t==='projects'?['project_token','project_name','active','status','created_at','updated_at','notes','deleted_at']:['source_id','project_token','project_name','operator_label','note','source_status','fingerprint','fingerprinted_at','file_count','byte_size'];$('#dbGrid').innerHTML=`<div class="tableWrap"><table class="dataTable"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td class="${mutableCell(t,c)?'editable':''}" data-t="${t}" data-i="${i}" data-c="${c}"><span class="cell" title="${esc(r[c]??'')}">${esc(r[c]??'')}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;$$('.editable').forEach(td=>td.onclick=()=>editCell(td,rows[Number(td.dataset.i)]));};$('#dbTable').onchange=draw;$('#dbSearch').oninput=draw;$('#dbRefresh').onclick=async()=>{await loadProjects();renderDatabase();};draw();}function mutableCell(t,c){return t==='projects'?['project_name','active','status','notes'].includes(c):['operator_label','note','source_status'].includes(c);}async function editCell(td,row){const c=td.dataset.c,n=prompt('Edit '+c,row[c]??'');if(n===null)return;try{if(LOCAL){const p=await getProject(row.project_token);if(td.dataset.t==='projects')p[c]=c==='active'?(n==='1'||n.toLowerCase()==='true'?1:0):n;else{const s=(p.sources||[]).find(x=>x.source_id===row.source_id);if(s)s[c]=n;}await idbPut('projects',p);}else toast('WSL metadata editing uses existing server API and will be gated after GitPages.',true);await loadProjects();renderDatabase();}catch(e){toast(e.message,true);}}
function renderBuild(){shell('SOT Build & Promotion','Build and promotion remain locked until dedup/recommendation evidence exists.',`<div class="card panel"><div class="callout">No copy plan is generated in v0.4.0. This release establishes project definition, real source fingerprinting, manifests, progress, administration, and reporting.</div></div>`);}function renderReporting(){const active=state.projects.filter(p=>!p.deleted_at),sources=active.flatMap(p=>p.sources||[]),fp=sources.filter(s=>s.fingerprint),files=sources.reduce((a,s)=>a+Number(s.file_count||0),0),bytes=sources.reduce((a,s)=>a+Number(s.byte_size||0),0);shell('Reporting','Evidence-backed project and fingerprint reporting.',`<div class="grid2"><div class="card panel"><strong>Projects</strong><div style="font-size:28px;font-weight:850">${active.length}</div><div class="muted">${active.filter(p=>p.status==='Pending').length} Pending · ${active.filter(p=>p.status==='WIP').length} WIP · ${active.filter(p=>p.status==='Closed').length} Closed</div></div><div class="card panel"><strong>Fingerprint evidence</strong><div style="font-size:28px;font-weight:850">${fp.length}/${sources.length}</div><div class="muted">${files} files · ${fmtBytes(bytes)}</div></div></div><div class="card panel" style="margin-top:10px"><div class="tableWrap"><table class="dataTable"><thead><tr><th>Project</th><th>Status</th><th>Sources</th><th>Fingerprint %</th><th>Files</th><th>Bytes</th></tr></thead><tbody>${active.map(p=>`<tr><td>${esc(p.project_name)}</td><td>${esc(p.status)}</td><td>${(p.sources||[]).length}</td><td>${Math.round(Number(p.progress_percent||0))}%</td><td>${(p.sources||[]).reduce((a,s)=>a+Number(s.file_count||0),0)}</td><td>${fmtBytes((p.sources||[]).reduce((a,s)=>a+Number(s.byte_size||0),0))}</td></tr>`).join('')||'<tr><td colspan="6">No projects</td></tr>'}</tbody></table></div></div>`);}window.addEventListener('resize',()=>{if(state.route==='setup')applyMobilePane();});boot();
</script>
