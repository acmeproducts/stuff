<style>

.app{min-height:100vh;display:grid;grid-template-columns:var(--side) minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;background:var(--nav);color:#d5dbe5;padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:3px 8px 22px;color:#fff;font-weight:850;font-size:16px}.logo{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#5272ff,#7b61ff);font-weight:900}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c7ced9;text-align:left;border-radius:9px;padding:10px 11px;font-weight:650}.nav button:hover,.nav button.active{background:#202b3e;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid #293548;padding:12px 8px 0;color:#8f9bad;font-size:11px}.service{display:flex;align-items:center;gap:7px;margin:5px 0}.dot{width:7px;height:7px;border-radius:50%;background:#98a2b3}.dot.live{background:#39c779}.dot.dead{background:#ef6a61}.version{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#748094;margin-top:7px}
.main{min-width:0}.topbar{height:62px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 22px}.topbar h1{font-size:18px;margin:0;flex:1}.buildpill{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:#536176;background:#f4f6f9;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.content{padding:22px;max-width:1450px;margin:0 auto}.pageintro{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:17px}.pageintro h2{font-size:22px;margin:0 0 3px}.pageintro p{margin:0;color:var(--muted);max-width:800px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.panel{padding:18px}.section{margin-top:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.sectionhead h3{margin:0;font-size:15px}.subtle{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 11px;font-weight:700;display:inline-flex;gap:6px;align-items:center;justify-content:center}.btn:hover{background:#f8fafc}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand2)}.btn.danger{color:var(--red);border-color:#efc6c0}.btn.small{padding:6px 8px;font-size:12px}.btn:disabled{opacity:.43;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.input,.select,.textarea{width:100%;border:1px solid #d7dde7;border-radius:9px;background:#fff;color:var(--ink);padding:9px 10px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#9aadeb;box-shadow:0 0 0 3px #eef2ff}.textarea{min-height:86px;resize:vertical}.label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field{margin-bottom:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:15px 16px}.stat .k{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.05em}.stat .v{font-size:24px;font-weight:850;margin-top:3px}
.callout{border:1px solid #d7e1ff;background:#f4f7ff;color:#37486f;border-radius:10px;padding:11px 12px;font-size:12px}.callout.warn{background:var(--amberbg);border-color:#ecd5a1;color:#6e5218}.callout.error{background:var(--redbg);border-color:#efc5bf;color:#85251e}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;letter-spacing:.03em;background:#eef1f5;color:#596274}.badge.running{background:#edf4ff;color:#175cd3}.badge.paused{background:var(--amberbg);color:var(--amber)}.badge.complete{background:var(--greenbg);color:var(--green)}.badge.error{background:var(--redbg);color:var(--red)}
.intake{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr);gap:16px;align-items:start}.sticky{position:sticky;top:80px}.pathlist{display:grid;gap:7px}.pathchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fafbfc;border-radius:9px;padding:8px 9px}.pathchip code{font-size:11px;word-break:break-all;flex:1}.pathchip button{border:0;background:transparent;color:var(--red)}.summaryline{display:grid;grid-template-columns:115px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}.summaryline:last-child{border-bottom:0}.summaryline .k{color:var(--muted);font-size:12px}.summaryline .v{font-weight:650;word-break:break-word}
.projectbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.projectbar .select{min-width:280px;max-width:480px}.projectheader{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:18px}.projectheader h2{margin:0 0 4px;font-size:22px}.token{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f7f8fa;border:1px solid var(--line);border-radius:7px;padding:4px 6px}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px}.flow{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:11px;align-items:center}.flowbox{border:1px solid var(--line);border-radius:12px;background:#fbfcfe;padding:14px;min-height:170px}.flowbox h4{margin:0 0 9px;font-size:13px}.arrow{text-align:center;font-size:28px;color:#9aa5b5}.sourceitem{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 9px;margin:6px 0}.sourceitem strong{font-size:12px}.sourceitem code{display:block;font-size:10px;color:var(--muted);word-break:break-all;margin-top:3px}.stagewrap{overflow:auto}.stages{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;min-width:590px}.stage{text-align:center}.stagedot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;background:#e8ecf2;color:#6f7989;font-size:9px;font-weight:900}.stage.done .stagedot{background:#2c9b63;color:#fff}.stage.active .stagedot{background:var(--brand);color:#fff}.stagelabel{font-size:9px;color:#6b7483}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:15px}.tab{border:0;background:transparent;padding:9px 11px;color:var(--muted);font-weight:700;border-bottom:2px solid transparent}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:10px;color:#6b7483;text-transform:uppercase;letter-spacing:.05em;background:#fafbfc}.timeline{display:grid}.event{display:grid;grid-template-columns:145px 145px 1fr;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.event .time{color:var(--muted)}.event .type{font-weight:750}.empty{text-align:center;color:var(--muted);padding:38px 18px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.modalback{position:fixed;inset:0;background:rgba(15,23,42,.54);z-index:100;display:grid;place-items:center;padding:18px}.modal{width:min(770px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;box-shadow:0 25px 85px rgba(0,0,0,.27)}.modalhead{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0}.modalbody{padding:17px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 17px;border-top:1px solid var(--line)}.close{border:0;background:transparent;color:#6c7584;font-size:20px}.browser{border:1px solid var(--line);border-radius:10px;overflow:hidden}.browserbar{display:flex;gap:7px;padding:8px;background:#f7f9fc;border-bottom:1px solid var(--line)}.browserpath{flex:1;background:#fff;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.browserlist{max-height:370px;overflow:auto}.folder,.file-row{display:flex;gap:8px;align-items:center;padding:10px 11px;border-bottom:1px solid #eef1f5}.folder button{border:0;background:transparent;color:#2548b6;font-weight:700;text-align:left;flex:1}.file-row{color:var(--muted);font-size:12px}.file-row span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.browserfoot{display:flex;justify-content:space-between;gap:8px;align-items:flex-end;padding:9px 11px;background:#fafbfc;border-top:1px solid var(--line)}.target-name{flex:1;min-width:180px}.target-name .label{margin-bottom:3px}.source-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.code{background:#111827;color:#d7deea;border-radius:9px;padding:11px;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:310px;overflow:auto}.toastwrap{position:fixed;right:16px;bottom:16px;z-index:250;display:grid;gap:7px}.toast{background:#111827;color:#fff;border-radius:9px;padding:10px 12px;min-width:260px;max-width:430px;box-shadow:var(--shadow);font-size:12px}.toast.error{background:#87251e}.toast.warn{background:#78580e}
@media(max-width:980px){:root{--side:76px}.brand span,.nav .txt,.sidefoot .txt{display:none}.nav button{text-align:center}.intake,.grid2{grid-template-columns:1fr}.sticky{position:static}.stats{grid-template-columns:repeat(2,1fr)}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
@media(max-width:650px){.app{grid-template-columns:1fr}.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:62px;z-index:70;padding:6px;display:block}.brand,.sidefoot{display:none}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:6px 3px;font-size:11px}.nav .txt{display:block}.main{padding-bottom:63px}.topbar{padding:0 12px}.buildpill{display:none}.content{padding:13px}.stats{grid-template-columns:1fr 1fr}.projectbar .select{min-width:0;max-width:none;flex:1}.projectheader{display:block}.projectheader .actions{margin-top:12px}.event{grid-template-columns:1fr;gap:2px}.pageintro{display:block}.pageintro .actions{margin-top:10px}}
</style>

<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="logo">S</div><span>SOT Project</span></div>
  <nav class="nav">
    <button data-route="intake" class="active">＋ <span class="txt">Intake</span></button>
    <button data-route="operations">⇄ <span class="txt">Operations</span></button>
    <button data-route="reporting">▤ <span class="txt">Reporting</span></button>
  </nav>
  <div class="sidefoot">
    <div class="service"><span id="apiDot" class="dot"></span><span class="txt" id="apiLabel">Project API checking</span></div>
    <div class="service"><span id="fsDot" class="dot"></span><span class="txt" id="fsLabel">Filesystem checking</span></div>
    <div class="version">UI v<span id="sideVersion"></span><br>build <span id="sideBuild"></span></div>
  </div>
</aside>
<main class="main">
  <header class="topbar"><h1 id="pageTitle">Intake</h1><span class="buildpill" id="buildPill"></span><button class="btn small" id="refreshBtn">↻ Refresh</button><button class="btn small" id="settingsBtn">⚙ Settings</button></header>
  <div id="content" class="content"></div>
</main>
</div>
<div id="modalRoot"></div><div id="browserRoot"></div><div id="toastRoot" class="toastwrap"></div>
<script>
(()=>{'use strict';
const APP_VERSION='0.3.1';
const BUILD_ID='2026.08.10.2';
const POLL_MS=5000;
const PROJECT_API='/api/fs/projects';
const REPORT_API='/api/fs/reports';
const FS_API='/api/fs';
const STAGES=['REGISTERED','SCANNING','HASHING','CRUNCHING','COPY_PLANNED','COPY_IN_PROGRESS','VERIFYING','VERIFIED'];
const STAGE_LABELS=['Register','Scan','Hash','Crunch','Plan','Copy','Verify','Complete'];
const HAS_DIRECTORY_PICKER=typeof window.showDirectoryPicker==='function';
const probeDirectoryInput=document.createElement('input');
const HAS_DIRECTORY_INPUT='webkitdirectory' in probeDirectoryInput;
const LOCAL_DEVICE_AVAILABLE=HAS_DIRECTORY_PICKER||HAS_DIRECTORY_INPUT;
const state={route:'intake',projects:[],selectedToken:'',api:{live:false,version:'',build:'',engineReady:false,engineReason:''},fsLive:false,reportMode:'aggregate',reportData:{},debugEnabled:localStorage.getItem('sot_portal_debug')==='1',debug:[],intake:{name:'',sources:[],target:'',notes:'',idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())},poll:null};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(kind,msg,data){if(!state.debugEnabled)return;let line=`${new Date().toISOString()} ${kind} ${msg}`;if(data!==undefined){try{line+='\n'+JSON.stringify(data,null,2)}catch{line+=' '+String(data)}}state.debug.push(line);if(state.debug.length>1200)state.debug.splice(0,state.debug.length-1200)}
function toast(msg,type=''){const n=document.createElement('div');n.className='toast '+type;n.textContent=msg;$('#toastRoot').appendChild(n);setTimeout(()=>n.remove(),3800)}
function fmtDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString()}
function fmtBytes(n){if(n===null||n===undefined)return '—';n=Number(n);if(!Number.isFinite(n))return '—';if(n===0)return '0 B';const u=['B','KB','MB','GB','TB','PB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(n>=10||i===0?0:1)} ${u[i]}`}
function statusClass(s){s=String(s||'REGISTERED').toUpperCase();if(['VERIFIED','RECONCILED_INTO_SOT'].includes(s))return'complete';if(s==='PAUSED'||s==='OFFLINE')return'paused';if(s==='ERROR'||s.includes('FAILED'))return'error';if(!['REGISTERED'].includes(s))return'running';return''}
async function request(url,options={},timeout=10000){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),timeout);log('TX',`${options.method||'GET'} ${url}`,options.body?JSON.parse(options.body):undefined);try{const res=await fetch(url,{...options,signal:ctrl.signal,headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const text=await res.text();let data={};if(text){try{data=JSON.parse(text)}catch{data={message:text}}}log('RX',`${res.status} ${url}`,data);if(!res.ok){const detail=data?.detail;const msg=typeof detail==='object'?(detail.message||JSON.stringify(detail)):(detail||data?.message||`HTTP ${res.status}`);const e=new Error(msg);e.status=res.status;e.data=data;throw e}return data}finally{clearTimeout(timer)}}
async function apiFs(path){return request(`${FS_API}?path=${encodeURIComponent(path)}`)}
async function apiMkdir(parentPath,folderName){return request(`${FS_API}/mkdir`,{method:'POST',body:JSON.stringify({parent_path:parentPath,folder_name:folderName})},15000)}
async function checkServices(){try{const h=await request(`${PROJECT_API}/health`,{},4000);state.api={live:true,version:h.version||'',build:h.build||'',engineReady:!!h.engine_ready,engineReason:h.engine_reason||''}}catch(e){state.api={live:false,version:'',build:'',engineReady:false,engineReason:'Project control API unavailable'};log('ERR','Project API health failed',{message:e.message})}try{await apiFs('/');state.fsLive=true}catch(e){state.fsLive=false;log('ERR','Filesystem health failed',{message:e.message})}updateChrome()}
function updateChrome(){$('#apiDot').className='dot '+(state.api.live?'live':'dead');$('#fsDot').className='dot '+(state.fsLive?'live':'dead');$('#apiLabel').textContent=state.api.live?`SOT helper v${state.api.version}`:'SOT helper project API offline';$('#fsLabel').textContent=state.fsLive?'Filesystem live':'Filesystem offline';$('#sideVersion').textContent=APP_VERSION;$('#sideBuild').textContent=BUILD_ID;$('#buildPill').textContent=`UI v${APP_VERSION} · ${BUILD_ID}`}
async function loadProjects(){if(!state.api.live){state.projects=[];return}const d=await request(PROJECT_API);state.projects=d.projects||[];if(state.selectedToken&&!state.projects.some(p=>p.project_token===state.selectedToken))state.selectedToken='';if(!state.selectedToken&&state.projects.length)state.selectedToken=state.projects[0].project_token}
function selected(){return state.projects.find(p=>p.project_token===state.selectedToken)||null}
function route(r){state.route=r;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r));$('#pageTitle').textContent=r[0].toUpperCase()+r.slice(1);render();if(r==='reporting')loadReports().catch(e=>toast(e.message,'error'))}
function render(){if(state.route==='intake')renderIntake();else if(state.route==='operations')renderOperations();else renderReporting()}
function serviceBanner(){if(!state.api.live)return `<div class="callout error"><strong>SOT helper project API is not deployed yet.</strong> The existing 8081 helper can already browse WSL sources; deploy the updated <code>file_browser.py</code> to add project persistence. No additional service or port is required.</div>`;if(state.api.version!==APP_VERSION||state.api.build!==BUILD_ID)return `<div class="callout warn"><strong>Version mismatch:</strong> UI v${esc(APP_VERSION)} build ${esc(BUILD_ID)} · API v${esc(state.api.version)} build ${esc(state.api.build||'unknown')}.</div>`;return `<div class="callout"><strong>Version verified:</strong> UI/API v${esc(APP_VERSION)} · build ${esc(BUILD_ID)} · single SOT helper on 8081.</div>`}
function sourceDisplay(src){if(typeof src==='string')return src;if(src.source_type==='browser_local')return src.operator_label||src.metadata?.directory_name||src.locator||'This device';return src.current_path||src.path||src.locator||src.name||'Source'}
function sourceKey(src){if(typeof src==='string')return `wsl:${src}`;return `${src.source_type||'source'}:${src.client_source_id||src.source_fingerprint||sourceDisplay(src)}`}
function sourceTypeLabel(src){if(typeof src==='string')return 'WSL / mounted';const t=src.source_type==='browser-device'?'browser_local':src.source_type;return t==='browser_local'?'This device':(t==='wsl_path'?'WSL / mounted':(t||'Source'))}
function renderIntake(){const d=state.intake;$('#content').innerHTML=`<div class="pageintro"><div><h2>Enter Project</h2><p>The only project-creation path. A successful intake creates one immutable project token; the visible project name can change later.</p></div></div>${serviceBanner()}<div class="intake section"><div class="card panel"><div class="field"><label class="label">Project name</label><input id="intakeName" class="input" value="${esc(d.name)}" placeholder="Example: 2026 Storage Consolidation" autocomplete="off"></div><div class="field"><label class="label">Source(s) · read only</label><div id="sourceList" class="pathlist">${d.sources.length?d.sources.map((src,i)=>`<div class="pathchip"><span class="badge">${esc(sourceTypeLabel(src))}</span><code>${esc(sourceDisplay(src))}</code><button data-rm-source="${i}">×</button></div>`).join(''):'<div class="subtle">No sources assigned.</div>'}</div><div class="source-actions"><button class="btn small" id="addSource" ${state.fsLive?'':'disabled'}>＋ WSL / mounted source</button><button class="btn small" id="addDeviceSource" ${LOCAL_DEVICE_AVAILABLE?'':'disabled'}>＋ This device</button></div>${LOCAL_DEVICE_AVAILABLE?'<div class="subtle" style="margin-top:5px">On Android, “This device” opens Chrome\'s local folder picker so folders such as DCIM can be authorized read-only.</div>':'<div class="subtle" style="margin-top:5px">This browser does not expose a supported local-directory picker.</div>'}</div><div class="field"><label class="label">Initial target · optional</label><div id="targetList">${d.target?`<div class="pathchip"><code>${esc(d.target)}</code><button id="removeTarget">×</button></div>`:'<div class="subtle">No initial target assigned.</div>'}</div><button class="btn small" id="chooseTarget" style="margin-top:8px" ${state.fsLive?'':'disabled'}>Choose target parent + create folder</button><div class="subtle" style="margin-top:5px">The new target folder defaults to the project name and can be renamed before creation.</div></div><div class="field"><label class="label">Notes · optional</label><textarea id="intakeNotes" class="textarea" placeholder="Context for this reconciliation turn">${esc(d.notes)}</textarea></div></div><div class="card panel sticky"><div class="sectionhead"><h3>Project intake</h3><span class="badge">NEW</span></div>${sum('Identity','Generated by server')}${sum('Sources',d.sources.length)}${sum('Target',d.target||'Not assigned')}${sum('Created','On successful submit')}<div class="callout" style="margin-top:13px">Retry/double-click protection is enforced by an idempotency key and server-side duplicate detection.</div><button class="btn primary" id="enterProject" style="width:100%;margin-top:13px" ${state.api.live?'':'disabled'}>Enter Project</button></div></div>`;bindIntake()}
function sum(k,v){return `<div class="summaryline"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`}
function bindIntake(){$('#intakeName').oninput=e=>state.intake.name=e.target.value;$('#intakeNotes').oninput=e=>state.intake.notes=e.target.value;document.querySelectorAll('[data-rm-source]').forEach(b=>b.onclick=()=>{state.intake.sources.splice(Number(b.dataset.rmSource),1);renderIntake()});$('#removeTarget')?.addEventListener('click',()=>{state.intake.target='';renderIntake()});$('#addSource').onclick=()=>openBrowser('source',src=>{if(!state.intake.sources.some(s=>sourceKey(s)===sourceKey(src)))state.intake.sources.push(src);renderIntake()});$('#addDeviceSource').onclick=()=>pickLocalDeviceSource(src=>{if(!state.intake.sources.some(s=>sourceKey(s)===sourceKey(src)))state.intake.sources.push(src);renderIntake()});$('#chooseTarget').onclick=()=>openBrowser('target',p=>{state.intake.target=p;renderIntake()},{defaultFolderName:state.intake.name.trim()});$('#enterProject').onclick=createProject}
async function createProject(){const d=state.intake;d.name=$('#intakeName').value.trim();d.notes=$('#intakeNotes').value.trim();if(!d.name||!d.sources.length){toast('Project name and at least one source are required.','warn');return}const btn=$('#enterProject');btn.disabled=true;try{const payload={project_name:d.name,sources:d.sources,target:d.target||null,notes:d.notes||null,idempotency_key:d.idempotencyKey};const res=await request(PROJECT_API,{method:'POST',headers:{'Idempotency-Key':d.idempotencyKey},body:JSON.stringify(payload)},30000);const p=res.project;state.intake={name:'',sources:[],target:'',notes:'',idempotencyKey:crypto.randomUUID?crypto.randomUUID():String(Date.now())};await loadProjects();state.selectedToken=p.project_token;toast(res.deduplicated?'Existing matching project opened.':'Project created.');route('operations')}catch(e){toast(`Project creation failed: ${e.message}`,'error');btn.disabled=false}}

function operationsProject(p){const src=p.sources||[],idx=Math.max(0,STAGES.indexOf(p.current_stage||p.status));return `<div class="card projectheader section"><div><h2>${esc(p.project_name)}</h2><div class="meta"><span class="badge ${statusClass(p.status)}">${esc(p.status)}</span><span class="token" id="tokenText">${esc(p.project_token)}</span><button class="btn small" id="copyToken">Copy token</button><span>Created ${esc(fmtDate(p.created_at))}</span></div></div><div class="actions"><button class="btn small" id="renameProject">Rename</button><button class="btn danger small" id="deleteProject">Delete</button></div></div><div class="card panel section"><div class="sectionhead"><div><h3>Source(s) → Target</h3><div class="subtle">The active reconciliation turn.</div></div><div class="actions">${operationButtons(p)}</div></div><div class="flow"><div class="flowbox"><h4>Source(s)</h4><div>${src.length?src.map((s,i)=>`<div class="sourceitem"><div class="meta"><span class="badge">${esc(sourceTypeLabel(s))}</span><strong>${esc(s.operator_label||`Source ${i+1}`)}</strong></div><code>${esc(s.current_path||s.path||s.locator)}</code>${s.source_type==='browser_local'?`<button class="btn small" data-reauth-source="${esc(s.source_id)}" style="margin-top:7px">Reauthorize / verify</button>`:''}</div>`).join(''):'<span class="subtle">No sources.</span>'}</div></div><div class="arrow">→</div><div class="flowbox"><h4>Target</h4>${p.target_path?`<div class="sourceitem"><strong>Candidate target</strong><code>${esc(p.target_path)}</code></div>`:'<div class="subtle">No target assigned.</div>'}<button class="btn small" id="changeTarget" style="margin-top:8px" ${state.fsLive?'':'disabled'}>${p.target_path?'Change target':'Assign target'}</button></div></div><div class="stagewrap section"><div class="stages">${STAGES.map((s,i)=>`<div class="stage ${i<idx?'done':i===idx?'active':''}"><div class="stagedot">${i<idx?'✓':i+1}</div><div class="stagelabel">${STAGE_LABELS[i]}</div></div>`).join('')} function operationButtons(p){const s=String(p.status||'REGISTERED').toUpperCase(),ready=state.api.engineReady;let a=[];if(['REGISTERED','ERROR'].includes(s))a.push(`<button class="btn primary small" data-op="start" ${ready?'':'disabled'}>▶ Start</button>`);if(!['REGISTERED','PAUSED','VERIFIED','RECONCILED_INTO_SOT','ERROR'].includes(s))a.push(`<button class="btn small" data-op="pause" ${ready?'':'disabled'}>Ⅱ Pause</button>`);if(s==='PAUSED')a.push(`<button class="btn primary small" data-op="resume" ${ready?'':'disabled'}>▶ Resume</button>`);if(!['REGISTERED'].includes(s))a.push(`<button class="btn small" data-op="restart" ${ready?'':'disabled'}>↺ Restart run</button>`);return a.join('')}

async function renameProject(p){const name=prompt('Project name:',p.project_name);if(!name||name.trim()===p.project_name)return;try{await request(`${PROJECT_API}/${encodeURIComponent(p.project_token)}`,{method:'PATCH',body:JSON.stringify({project_name:name.trim()})});await loadProjects();toast('Project renamed');renderOperations()}catch(e){toast(`Rename failed: ${e.message}`,'error')}}

async function loadReports(){if(!state.api.live)return;if(state.reportMode==='aggregate')state.reportData.aggregate=await request(`${REPORT_API}/aggregate`);else if(state.reportMode==='timeline')state.reportData.timeline=await request(`${REPORT_API}/timeline`);else if(state.selectedToken)state.reportData.detail=await request(`${PROJECT_API}/${encodeURIComponent(state.selectedToken)}/report`);renderReporting()}
function renderReporting(){$('#content').innerHTML=`<div class="pageintro"><div><h2>Reporting</h2><p>Read-only views of project identity, history and aggregate reconciliation activity.</p></div>${projectSelector()}</div>${serviceBanner()}<div class="tabs"><button class="tab ${state.reportMode==='aggregate'?'active':''}" data-report="aggregate">Aggregate</button><button class="tab ${state.reportMode==='timeline'?'active':''}" data-report="timeline">Timeline</button><button class="tab ${state.reportMode==='detail'?'active':''}" data-report="detail">Project Detail</button></div><div id="reportBody">${reportHtml()}</div>`;$('#projectSelect')?.addEventListener('change',e=>{state.selectedToken=e.target.value;if(state.reportMode==='detail')loadReports();else renderReporting()});document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>{state.reportMode=b.dataset.report;loadReports().catch(e=>toast(e.message,'error'))})}
function reportHtml(){if(!state.api.live)return'<div class="card empty"><strong>Project API offline</strong>Reports require the server-side project database.</div>';if(state.reportMode==='aggregate'){const a=state.reportData.aggregate;if(!a)return'<div class="empty">Loading aggregate report…</div>';return `<div class="stats">${stat('Projects',a.projects_total)}${stat('Active',a.projects_active)}${stat('Paused',a.projects_paused)}${stat('Complete',a.projects_complete)}</div><div class="stats section">${stat('Sources',a.sources_total)}${stat('Raw bytes',fmtBytes(a.raw_bytes_scanned))}${stat('Unique bytes',fmtBytes(a.unique_bytes))}${stat('Duplicates',fmtBytes(a.exact_duplicate_bytes))}</div>`}if(state.reportMode==='timeline'){const rows=state.reportData.timeline?.events||[];return `<div class="card panel"><div class="timeline">${rows.length?rows.map(e=>`<div class="event"><div class="time">${esc(fmtDate(e.timestamp))}</div><div class="type">${esc(e.event_type)}</div><div><strong>${esc(e.project_name||e.project_token)}</strong><br>${esc(e.message||'')}</div></div>`).join(''):'<div class="empty">No timeline events yet.</div>'}</div></div>`}const d=state.reportData.detail,p=d?.project;if(!p)return'<div class="card empty"><strong>No project selected</strong>Select a project for its detailed audit record.</div>';return `<div class="grid2"><div class="card panel"><h3 style="margin-top:0">Project</h3>${sum('Name',p.project_name)}${sum('Token',p.project_token)}${sum('Status',p.status)}${sum('Created',fmtDate(p.created_at))}${sum('Current run',p.current_run_id||'—')}${sum('OpenClaw session',p.openclaw_session_key||'—')}</div><div class="card panel"><h3 style="margin-top:0">Inventory</h3>${sum('Sources',(d.sources||[]).length)}${sum('Targets',(d.targets||[]).length)}${sum('Runs',(d.runs||[]).length)}${sum('Events',(d.events||[]).length)}</div></div><div class="card panel section"><div class="sectionhead"><h3>Source registry</h3></div><div class="tablewrap"><table class="table"><thead><tr><th>Type</th><th>Label</th><th>Current locator</th><th>Fingerprint</th><th>Status</th></tr></thead><tbody>${(d.sources||[]).map(s=>`<tr><td>${esc(sourceTypeLabel(s))}</td><td>${esc(s.operator_label||s.source_id)}</td><td><code>${esc(s.current_path)}</code></td><td><code>${esc(s.source_fingerprint)}</code></td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table></div></div>`}
function stat(k,v){return `<div class="card stat"><div class="k">${esc(k)}</div><div class="v">${esc(v??0)}</div></div>`}
function joinPath(base,name){return base==='/'?name:String(base).replace(/[\\/]+$/,'')+'/'+name}
function createPathHistory(start='/'){const stack=[start];return {current:()=>stack[stack.length-1],depth:()=>stack.length,previous:()=>stack.length>1?stack[stack.length-2]:stack[0],push(path){if(path!==stack[stack.length-1])stack.push(path);return stack[stack.length-1]},commitUp(){if(stack.length>1)stack.pop();return stack[stack.length-1]},snapshot:()=>[...stack]}}
function openBrowser(mode,onPick,options={}){if(!state.fsLive){toast('Filesystem API is offline.','error');return}const root=$('#browserRoot');let current='/';const nav=createPathHistory('/');const defaultName=String(options.defaultFolderName||'').trim();root.innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h3>${mode==='source'?'Add WSL / mounted source':'Choose target parent'}</h3><button class="close" id="browserClose">×</button></div><div class="modalbody"><div class="browser"><div class="browserbar"><button class="btn small" id="browserUp">↑ Up</button><div class="browserpath" id="browserPath">/</div><button class="btn small" id="browserReload">↻ Rescan</button></div><div class="browserlist" id="browserList"><div class="empty">Loading…</div></div><div class="browserfoot">${mode==='target'?`<div class="target-name"><label class="label">New target folder</label><input id="targetFolderName" class="input" value="${esc(defaultName)}" placeholder="Project folder name"><div class="subtle" id="targetPreview" style="margin-top:4px"></div></div><button class="btn primary small" id="pickHere">Create & use target</button>`:`<span class="subtle" id="browserCounts">Read-only source assignment</span><button class="btn primary small" id="pickHere">Select this folder</button>`}</div></div></div></div></div>`;const close=()=>root.innerHTML='';const updatePreview=()=>{const p=$('#targetPreview');if(p){const n=$('#targetFolderName')?.value.trim()||'';p.textContent=n&&current!=='/'?`Target: ${joinPath(current,n)}`:'Choose a parent and enter a folder name.'}};$('#browserClose').onclick=close;$('#browserUp').onclick=async()=>{if(nav.depth()<=1)return;const previous=nav.previous();const ok=await load(previous,false);if(ok)current=nav.commitUp()};$('#browserReload').onclick=()=>load(current,false);$('#targetFolderName')?.addEventListener('input',updatePreview);$('#pickHere').onclick=async()=>{if(current==='/'){toast('Open a volume or folder first.','warn');return}if(mode==='target'){const name=$('#targetFolderName').value.trim();if(!name){toast('Target folder name is required.','warn');return}const btn=$('#pickHere');btn.disabled=true;try{const result=await apiMkdir(current,name);onPick(result.path);toast(result.created?'Target folder created.':'Target folder already existed; selected.');close()}catch(e){btn.disabled=false;toast(`Target folder failed: ${e.message}`,'error')}}else{onPick(current);close()}};async function navigate(path){const ok=await load(path,true);return ok}async function load(path,push=false){$('#browserList').innerHTML='<div class="empty">Loading…</div>';try{const data=await apiFs(path);const resolved=data.path||path;if(push&&resolved!==current)nav.push(resolved);current=resolved;$('#browserPath').textContent=current;$('#browserUp').disabled=nav.depth()<=1;const folders=data.folders||[],files=data.files||[],paths=data.paths||{};const folderRows=folders.map(name=>{const next=current==='/'&&paths[name]?paths[name]:joinPath(current,name);return `<div class="folder"><span>📁</span><button data-path="${esc(next)}">${esc(name)}</button></div>`}).join('');const fileRows=files.map(name=>`<div class="file-row"><span>📄</span><span>${esc(name)}</span></div>`).join('');let empty='';if(!folders.length&&!files.length)empty='<div class="empty">This folder is empty.</div>';$('#browserList').innerHTML=folderRows+fileRows+empty;$('#browserCounts')&&($('#browserCounts').textContent=`${folders.length} folder${folders.length===1?'':'s'} · ${files.length} file${files.length===1?'':'s'} · rescanned now`);document.querySelectorAll('#browserList [data-path]').forEach(b=>b.onclick=()=>navigate(b.dataset.path));updatePreview();return true}catch(e){$('#browserList').innerHTML=`<div class="empty"><strong>Unable to browse</strong>${esc(e.message)}<br><button class="btn small" id="retryBrowse" style="margin-top:8px">↻ Rescan</button></div>`;$('#retryBrowse')?.addEventListener('click',()=>load(path,false));return false}}load('/',false)}
const DEVICE_DB='sot-portal-device-sources-v2',DEVICE_STORE='handles';
function openDeviceDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DEVICE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DEVICE_STORE))db.createObjectStore(DEVICE_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function deviceRecords(){const db=await openDeviceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readonly'),req=tx.objectStore(DEVICE_STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function deviceRecord(id){const db=await openDeviceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readonly'),req=tx.objectStore(DEVICE_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close()})}
async function saveDeviceRecord(record){const db=await openDeviceDb();return new Promise((resolve,reject)=>{const tx=db.transaction(DEVICE_STORE,'readwrite');tx.objectStore(DEVICE_STORE).put(record);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function sha256Json(value){const bytes=new TextEncoder().encode(JSON.stringify(value));const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function enumerateDirectoryHandle(handle){let folders=0,files=0,totalBytes=0;const sample=[];for await(const entry of handle.values()){if(entry.kind==='directory'){folders++;if(sample.length<512)sample.push(['d',entry.name,0,0])}else if(entry.kind==='file'){files++;try{const f=await entry.getFile();totalBytes+=Number(f.size||0);if(sample.length<512)sample.push(['f',entry.name,Number(f.size||0),Number(f.lastModified||0)])}catch{if(sample.length<512)sample.push(['f',entry.name,null,null])}}}sample.sort((a,b)=>String(a[1]).localeCompare(String(b[1])));const identity={directory_name:handle.name,top_level_folders:folders,top_level_files:files,top_level_bytes:totalBytes,sample};return {...identity,source_fingerprint:await sha256Json(identity),picker:'showDirectoryPicker'}}
async function ensureDeviceHandleRecord(handle,metadata){for(const record of await deviceRecords()){try{if(record.handle&&record.handle.isSameEntry&&await record.handle.isSameEntry(handle)){const updated={...record,name:handle.name,handle,fingerprint:metadata.source_fingerprint,metadata,savedAt:new Date().toISOString()};await saveDeviceRecord(updated);return updated}}catch{}}const id=crypto.randomUUID?crypto.randomUUID():`DEV-${Date.now()}-${Math.random().toString(36).slice(2)}`;const record={id,name:handle.name,handle,fingerprint:metadata.source_fingerprint,metadata,savedAt:new Date().toISOString()};await saveDeviceRecord(record);return record}
function sourceFromDeviceRecord(record){return {source_type:'browser_local',client_source_id:record.id,name:record.name,operator_label:`This device · ${record.name}`,locator:`device://${record.id}/${encodeURIComponent(record.name)}`,source_fingerprint:record.fingerprint,metadata:record.metadata||{}}}
function pickDirectoryInput(){return new Promise((resolve,reject)=>{const input=document.createElement('input');input.type='file';input.multiple=true;input.setAttribute('webkitdirectory','');input.style.display='none';document.body.appendChild(input);let settled=false;const finish=(files=[])=>{if(settled)return;settled=true;window.removeEventListener('focus',onFocus);setTimeout(()=>input.remove(),0);resolve(files)};const onFocus=()=>setTimeout(()=>finish([...(input.files||[])]),350);input.onchange=()=>finish([...(input.files||[])]);input.onerror=()=>{if(settled)return;settled=true;window.removeEventListener('focus',onFocus);input.remove();reject(new Error('Local directory picker failed'))};input.oncancel=()=>finish([]);window.addEventListener('focus',onFocus,{once:true});input.click()})}
async function sourceFromDirectoryFiles(files){if(!files.length)return null;const first=files[0].webkitRelativePath||files[0].name;const root=(first.split('/')[0]||'Local folder').trim();let totalBytes=0;const sample=[];for(const f of files){totalBytes+=Number(f.size||0);if(sample.length<512)sample.push([f.webkitRelativePath||f.name,Number(f.size||0),Number(f.lastModified||0)])}sample.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));const identity={directory_name:root,file_count:files.length,total_bytes:totalBytes,sample};const fingerprint=await sha256Json(identity);let existing=(await deviceRecords()).find(r=>!r.handle&&r.fingerprint===fingerprint);const id=existing?.id||(crypto.randomUUID?crypto.randomUUID():`DEV-${Date.now()}-${Math.random().toString(36).slice(2)}`);const metadata={...identity,source_fingerprint:fingerprint,picker:'webkitdirectory',reauthorization:'reselect-required'};const record={id,name:root,fingerprint,metadata,savedAt:new Date().toISOString()};await saveDeviceRecord(record);return sourceFromDeviceRecord(record)}
async function pickLocalDeviceSource(onPick){try{let source=null;if(HAS_DIRECTORY_PICKER){const handle=await window.showDirectoryPicker({mode:'read'});const metadata=await enumerateDirectoryHandle(handle);const record=await ensureDeviceHandleRecord(handle,metadata);source=sourceFromDeviceRecord(record)}else if(HAS_DIRECTORY_INPUT){source=await sourceFromDirectoryFiles(await pickDirectoryInput())}else{toast('This browser does not provide a supported local-directory picker.','warn');return null}if(source&&onPick)onPick(source);return source}catch(e){if(e?.name!=='AbortError')toast(`Local device folder failed: ${e.message}`,'error');return null}}
async function reauthorizeLocalSource(source){try{const record=source.client_source_id?await deviceRecord(source.client_source_id):null;if(record?.handle){let permission='prompt';try{permission=await record.handle.queryPermission({mode:'read'})}catch{}if(permission!=='granted')permission=await record.handle.requestPermission({mode:'read'});if(permission!=='granted'){toast('Local folder permission was not granted.','warn');return}const metadata=await enumerateDirectoryHandle(record.handle);const updated={...record,fingerprint:metadata.source_fingerprint,metadata,savedAt:new Date().toISOString()};await saveDeviceRecord(updated);if(source.source_fingerprint&&source.source_fingerprint!==metadata.source_fingerprint)toast('Folder reauthorized, but its current sample differs from the registered fingerprint. Relink handling is planned for v0.4.0.','warn');else toast('Local source reauthorized and recognized.');return}const picked=await pickLocalDeviceSource();if(!picked)return;if(source.source_fingerprint&&picked.source_fingerprint===source.source_fingerprint)toast('Reselected folder matches the registered source fingerprint.');else toast('Reselected folder does not match the registered source fingerprint.','warn')}catch(e){toast(`Reauthorization failed: ${e.message}`,'error')}}
function openSettings(){$('#modalRoot').innerHTML=`<div class="modalback"><div class="modal"><div class="modalhead"><h3>Settings & Diagnostics</h3><button class="close" id="settingsClose">×</button></div><div class="modalbody"><div class="grid2"><div class="card panel"><h3 style="margin-top:0">Version evidence</h3>${sum('UI version',APP_VERSION)}${sum('UI build',BUILD_ID)}${sum('API version',state.api.version||'offline')}${sum('API build',state.api.build||'offline')}${sum('Match',state.api.version===APP_VERSION&&state.api.build===BUILD_ID?'YES':'NO')}</div><div class="card panel"><h3 style="margin-top:0">Services</h3>${sum('SOT helper API',state.api.live?'LIVE':'OFFLINE')}${sum('Filesystem',state.fsLive?'LIVE':'OFFLINE')}${sum('Engine',state.api.engineReady?'READY':'NOT INSTALLED')}</div></div><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="debugCheck" type="checkbox" ${state.debugEnabled?'checked':''}> Enable debug logging</label><div class="subtle" style="margin-top:4px">Captures portal API calls and errors. No API keys are used or stored by this portal.</div><div id="debugArea" class="${state.debugEnabled?'':'hidden'}" style="margin-top:12px"><div class="actions" style="margin-bottom:7px"><button class="btn small" id="copyDebug">Copy debug log</button><button class="btn small" id="clearDebug">Clear</button></div><pre class="code" id="debugLog">${esc(state.debug.join('\n'))}</pre></div></div><div class="modalfoot"><button class="btn primary" id="settingsDone">Done</button></div></div></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#settingsClose').onclick=close;$('#settingsDone').onclick=close;$('#debugCheck').onchange=e=>{state.debugEnabled=e.target.checked;localStorage.setItem('sot_portal_debug',state.debugEnabled?'1':'0');$('#debugArea').classList.toggle('hidden',!state.debugEnabled)};$('#copyDebug')?.addEventListener('click',()=>copyText(state.debug.join('\n'),'Debug log copied'));$('#clearDebug')?.addEventListener('click',()=>{state.debug=[];$('#debugLog').textContent=''})}
async function copyText(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg)}}
async function refreshAll(){await checkServices();if(state.api.live){await loadProjects();if(state.route==='reporting')await loadReports()}render()}
function bindGlobal(){document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>route(b.dataset.route));$('#refreshBtn').onclick=()=>refreshAll().then(()=>toast('Refreshed')).catch(e=>toast(e.message,'error'));$('#settingsBtn').onclick=openSettings}
async function boot(){bindGlobal();updateChrome();render();await refreshAll();state.poll=setInterval(async()=>{if(state.route==='operations'&&state.api.live){try{await loadProjects();renderOperations()}catch(e){log('ERR','Polling failed',{message:e.message})}}},POLL_MS)}
boot();
})();
</script>
</body>
</html>
