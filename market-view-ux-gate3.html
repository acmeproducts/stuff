<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market View — Gate 3 Workspace</title><style>:root{color-scheme:dark;--bg:#070b11;--rail:#0b111a;--line:#283342;--text:#f4f7fb;--muted:#8996a8;--risk:#ff5964;--growth:#4f9dff;--macro:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.app{min-height:100dvh;display:flex}.rail{width:190px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.rail.closed{width:0;border:0}.rail h1{font-size:15px;margin:18px 16px}.rail nav{display:grid;padding:0 8px}.rail button{background:transparent;border:0;text-align:left}.config{margin-top:auto;padding:8px 8px 18px}.work{min-width:0;flex:1}.ribbon{position:sticky;top:0;z-index:10;background:#070b11f2;border-bottom:1px solid var(--line)}.r1{height:48px;display:flex;align-items:center;padding:0 10px;gap:9px}.menu{font-size:20px}.context{font-size:17px;font-weight:800}.sentiment{font-weight:500;color:var(--muted)}.qa{margin-left:auto;font-size:10px}.r2{display:flex;justify-content:center;gap:2px;padding:0 5px 7px;overflow:auto}.r2 button{padding:6px 9px;border:0;background:transparent;color:var(--muted)}.r2 button.on{color:var(--text);border-bottom:2px solid #7f92aa;border-radius:0}.qaBox{display:none;padding:7px 12px;border-top:1px dashed #465466;color:#9eabbc;font-size:10px}.qaBox.on{display:block}.body{max-width:1000px;margin:auto;padding:0 12px}.chartSection{padding:12px 0 14px;border-bottom:1px solid var(--line)}.legend{display:flex;justify-content:center;gap:7px;overflow:auto;padding-bottom:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.chart{height:min(48vh,430px);min-height:300px}.chart canvas{width:100%;height:100%;display:block}.ai{padding:15px 4px 17px;border-bottom:1px solid var(--line);line-height:1.45}.ai h2{font-size:15px;margin:0 0 7px}.ai p{margin:5px 0}.why{color:#c6d0dc}.evidence{display:none;color:var(--muted);font-size:12px;padding-top:8px}.evidence.on{display:block}.actions{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:9px 0 18px}.right{margin-left:auto;display:flex;gap:7px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 auto 9px;max-width:600px}.compare select{width:100%}.compare label{font-size:10px;color:var(--muted)}button,select{font:inherit;color:var(--text);background:#101721;border:1px solid #303d4e;border-radius:8px;padding:7px 10px}.placeholder{padding:50px 10px;color:var(--muted);text-align:center}@media(max-width:650px){.rail{position:fixed;z-index:40;inset:0 auto 0 0;width:190px;box-shadow:8px 0 25px #0008}.rail.closed{transform:translateX(-100%);width:190px}.body{padding:0 9px}.chart{height:46vh;min-height:285px}.r2{justify-content:space-around}.r2 button{padding:6px 7px}}</style></head><body><div class="app"><aside class="rail closed" id="rail"><h1>MARKET VIEW</h1><nav><button data-nav="now">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav><div class="config"><button data-nav="config">CONFIG</button></div></aside><main class="work"><header class="ribbon"><div class="r1"><button class="menu" id="menu">☰</button><div class="context" id="context"></div><button class="qa" id="qa">QA</button></div><div class="r2" id="horizons"></div><div class="qaBox" id="qaBox">Gate 3 workspace prototype · representative data · diagnostics hidden from product surface.</div></header><div class="body" id="body"></div></main></div><script>const $=s=>document.querySelector(s),H=['1D','5D','MTD','YTD','1YR','3YR','5YR'];const IDX={risk:{name:'Risk',abbr:'RSK',color:'#ff5964',sent:'Mixed',pov:'Risk appetite is mixed rather than broadly defensive.',why:'Volatility is contained while credit and financial conditions carry more of the risk signal.',components:[['vix','VIX'],['hys','HYS'],['nfc','NFC'],['r10','R10']]},growth:{name:'Growth',abbr:'GRW',color:'#4f9dff',sent:'Moderating',pov:'Growth remains positive, but the recent impulse is uneven.',why:'Consumption and activity remain firmer than forward labor evidence.',components:[['ret','RET'],['pay','PAY'],['ipr','IPR'],['clm','CLM']]},macro:{name:'Macro',abbr:'MAC',color:'#f4f7fb',sent:'Balanced',pov:'Headline macro conditions are stable while inflation and rates remain the tension.',why:'The aggregate masks different release cadences and policy/inflation relationships.',components:[['cpi','CPI'],['wti','WTI'],['ffr','FFR'],['bei','BEI']]}};const SER={vix:['VIX','Index','#a98cff'],hys:['HYS','bps','#59c7d2'],nfc:['NFC','Index','#dc995d'],r10:['R10','%','#bd91d8'],ret:['RET','%','#59c7d2'],pay:['PAY','000s','#a98cff'],ipr:['IPR','Index','#dc995d'],clm:['CLM','000s','#7caeb2'],cpi:['CPI','Index','#a98cff'],wti:['WTI','$/bbl','#59c7d2'],ffr:['FFR','%','#dc995d'],bei:['BEI','%','#bd91d8']};let S={nav:'now',screen:'market',index:null,component:null,h:'5D',evidence:false,compare:['cpi','wti']};function lines(){if(S.screen==='market')return Object.entries(IDX).map(([id,z])=>({id,label:z.abbr,color:z.color}));if(S.screen==='index')return IDX[S.index].components.map(([id,a])=>({id,label:a,color:SER[id][2]}));if(S.screen==='component'){let q=SER[S.component];return[{id:S.component,label:q[0],color:q[2]}]}let a=SER[S.compare[0]],b=SER[S.compare[1]];return[{id:S.compare[0],label:a[0],color:a[2]},{id:S.compare[1],label:b[0],color:b[2]}]}function context(){if(S.nav!=='now')return S.nav.toUpperCase();if(S.screen==='market')return'Market: <span class="sentiment">Mixed / balanced</span>';if(S.screen==='index'){let z=IDX[S.index];return z.name+': <span class="sentiment">'+z.sent+'</span>'}if(S.screen==='component')return SER[S.component][0]+': <span class="sentiment">'+IDX[S.index].name+' component</span>';return SER[S.compare[0]][0]+' + '+SER[S.compare[1]][0]+': <span class="sentiment">Comparison</span>'}function legend(){return'<div class="legend">'+lines().map(x=>'<button data-series="'+x.id+'"><i class="dot" style="background:'+x.color+'"></i>'+x.label+'</button>').join('')+'</div>'}function ai(){let t='Market POV',p='Risk, growth and macro are not expressing one dominant regime.',w='Choose an index to see which components are producing the aggregate signal.';if(S.screen==='index'){let z=IDX[S.index];t=z.name+' POV';p=z.pov;w=z.why}else if(S.screen==='component'){let q=SER[S.component][0];t=q+' POV';p=q+' is shown in native evidence context.';w='Interpret it relative to the '+IDX[S.index].name+' question that led here.'}else if(S.screen==='compare'){let a=SER[S.compare[0]][0],b=SER[S.compare[1]][0];t='Comparison POV';p=a+' and '+b+' test whether their moves reinforce the thesis.';w='A comparison should answer a question rather than merely add another line.'}return'<section class="ai"><h2>'+t+'</h2><p><b>What changed:</b> '+p+'</p><p class="why"><b>Why it matters:</b> '+w+'</p><button id="evidenceBtn">'+(S.evidence?'Hide evidence':'Evidence & reasoning')+'</button><div class="evidence '+(S.evidence?'on':'')+'">Representative evidence: observations, cadence, provenance, contribution and challenges.</div></section>'}function cmp(){if(S.screen!=='compare')return'';let o=Object.entries(SER).map(([id,q])=>'<option value="'+id+'">'+q[0]+'</option>').join('');return'<div class="compare"><label>Series 1<select data-slot="0">'+o+'</select></label><label>Series 2<select data-slot="1">'+o+'</select></label></div>'}function actions(){let b=S.screen==='market'?'':'<button id="back">← Back</button>',e=S.screen==='component'?'<button id="compare">+ Compare</button>':'';return'<div class="actions">'+b+'<div class="right">'+e+'<button>Save to Library</button></div></div>'}function surface(){return'<section class="chartSection">'+cmp()+legend()+'<div class="chart"><canvas id="chart"></canvas></div></section>'+ai()+actions()}function render(){$('#context').innerHTML=context();$('#horizons').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(S.h===h?'on':'')+'">'+h+'</button>').join('');$('#body').innerHTML=S.nav==='now'?surface():'<div class="placeholder">'+S.nav.toUpperCase()+' is present in the application frame; Gate 3 is evaluating the analytical journey first.</div>';wire();if(S.nav==='now')draw()}function rnd(s,n=42){let a=[],v=100;for(let i=0;i<n;i++){v+=Math.sin(i*.65+s)*.8+Math.cos(i*.29+s)*.38;a.push(v)}return a}function draw(){let c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,L=42,R=12,T=12,B=26;x.strokeStyle='#253141';x.fillStyle='#8290a3';x.font='10px system-ui';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(String(104-i*2),5,y+3)}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);x.stroke();let labs=S.h==='5D'?['Mon','Tue','Wed','Thu','Fri']:S.h==='1D'?['Open','10','12','14','Close']:S.h==='MTD'?['1','8','15','22','29']:S.h==='YTD'?['Jan','Mar','May','Jul','Aug']:S.h==='1YR'?['Sep','Dec','Mar','Jun','Aug']:S.h==='3YR'?['2024','2025','2026']:['2022','2023','2024','2025','2026'];labs.forEach((z,i)=>x.fillText(z,L+(W-L-R-24)*i/Math.max(1,labs.length-1),HH-7));lines().forEach((s,k)=>{let a=rnd(k+1),mn=Math.min(...a),mx=Math.max(...a);x.strokeStyle=s.color;x.lineWidth=2.2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(mx-v)/(mx-mn||1)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;render()});document.querySelectorAll('[data-series]').forEach(b=>b.onclick=()=>{let id=b.dataset.series;if(S.screen==='market'){S.index=id;S.screen='index'}else if(S.screen==='index'){S.component=id;S.screen='component'}S.evidence=false;render()});$('#evidenceBtn')?.addEventListener('click',()=>{S.evidence=!S.evidence;render()});$('#back')?.addEventListener('click',()=>{if(S.screen==='compare')S.screen='component';else if(S.screen==='component')S.screen='index';else{S.screen='market';S.index=null}render()});$('#compare')?.addEventListener('click',()=>{S.compare=[S.component,S.component==='wti'?'cpi':'wti'];S.screen='compare';render()});document.querySelectorAll('[data-slot]').forEach(s=>{s.value=S.compare[+s.dataset.slot];s.onchange=()=>{S.compare[+s.dataset.slot]=s.value;render()}})}$('#menu').onclick=()=>$('#rail').classList.toggle('closed');$('#qa').onclick=()=>$('#qaBox').classList.toggle('on');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});window.onresize=()=>{if(S.nav==='now')draw()};render();</script></body></html>
