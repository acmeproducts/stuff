afe-area-inset-left));display:flex;gap:7px}.composer input{flex:1;min-width:0}.composer button{padding:7px 12px}.modalWrap{position:fixed;z-index:80;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(660px,100%);max-height:82vh;background:#101721;border:1px solid #344256;border-radius:18px 18px 0 0;padding:14px;overflow:auto}.modalHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.modalHead h2{margin:0;font-size:17px}.modalHead button{margin-left:auto}.search{width:100%;margin-bottom:10px}.pick{display:grid;gap:6px}.pick button{text-align:left;display:flex;justify-content:space-between;align-items:center}.pick button.sel{border-color:#8297b3;background:#172234}.pick small{color:var(--muted)}.modalFoot{position:sticky;bottom:-14px;background:#101721;padding:10px 0 0;margin-top:10px;display:flex;justify-content:flex-end;gap:8px}.placeholder{padding:50px 10px;color:var(--muted);text-align:center}button,input{font:inherit;color:var(--text);background:#101721;border:1px solid #303d4e;border-radius:8px;padding:7px 10px}@media(max-width:720px){.rail{position:fixed;z-index:40;inset:0 auto 0 0;width:190px;box-shadow:8px 0 25px #0008}.rail.closed{transform:translateX(-100%);width:190px}.body{padding:0 9px}.r2{grid-template-columns:minmax(65px,1fr) auto 34px;padding-left:8px;padding-right:5px}.horizons button{padding:5px 5px;font-size:11px}.chart{height:46vh;min-height:285px}}</style></head><body><div class="app"><aside class="rail closed" id="rail"><h1>MARKET VIEW</h1><nav><button data-nav="now">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav><div class="config"><button data-nav="config">CONFIG</button></div></aside><main class="work"><header class="ribbon"><div class="r1"><button class="menu" id="menu">☰</button><div class="context" id="context"></div></div><div class="r2"><div class="crumbs" id="crumbs"></div><div class="horizons" id="horizons"></div><div class="moreWrap"><button class="moreBtn" id="more">…</button><div class="moreMenu" id="moreMenu"><button id="moreAdd">Add to Analysis</button><button>Save to Library</button><button>Print</button><button>Download</button></div></div></div></header><div class="body" id="body"></div></main></div><div class="composer"><input id="ask" placeholder="Ask about this POV or evidence…"><button id="send">↑</button></div><div id="tipRoot"></div><div id="modalRoot"></div><script>const $=s=>document.querySelector(s),H=['1D','5D','MTD','YTD','1YR','3YR','5YR'];const IDX={risk:{name:'Risk',abbr:'RSK',color:'#ff5964',sent:'Mixed',pov:'Risk appetite is mixed rather than broadly defensive.',why:'Volatility is contained while credit and financial conditions carry more of the risk signal.',components:['vix','hys','nfc','r10'],desc:'Composite view of volatility, credit and financial-condition stress.'},growth:{name:'Growth',abbr:'GRW',color:'#4f9dff',sent:'Moderating',pov:'Growth remains positive, but the recent impulse is uneven.',why:'Consumption and activity remain firmer than forward labor evidence.',components:['ret','pay','ipr','clm'],desc:'Composite view of activity, labor and production momentum.'},macro:{name:'Macro',abbr:'MAC',color:'#f4f7fb',sent:'Balanced',pov:'Headline macro conditions are stable while inflation and rates remain the tension.',why:'The aggregate masks different release cadences and policy/inflation relationships.',components:['cpi','wti','ffr','bei'],desc:'Composite view of inflation, rates and broad macro conditions.'}};const SER={vix:{n:'VIX',u:'Index',f:'index',c:'#a98cff',g:'Risk',d:'CBOE volatility index; a market-implied gauge of expected equity volatility.',use:'Used as a fast-moving risk and uncertainty signal.',why:'Sharp changes can reveal stress before slower economic releases.'},hys:{n:'HYS',u:'bps',f:'percent',c:'#59c7d2',g:'Risk',d:'High-yield credit spread proxy.',use:'Tracks the extra compensation demanded for lower-quality credit.',why:'Widening spreads often indicate deteriorating risk appetite.'},nfc:{n:'NFC',u:'Index',f:'index',c:'#dc995d',g:'Risk',d:'Financial conditions indicator.',use:'Summarizes whether financing conditions are tightening or easing.',why:'Conditions transmit rates and market stress into the real economy.'},r10:{n:'R10',u:'%',f:'percent',c:'#bd91d8',g:'Risk',d:'10-year Treasury yield.',use:'Represents a core long-duration benchmark rate.',why:'It affects discount rates, borrowing costs and asset valuation.'},ret:{n:'RET',u:'%',f:'percent',c:'#59c7d2',g:'Growth',d:'Retail activity growth proxy.',use:'Tracks consumer demand momentum.',why:'Consumption is a major component of economic activity.'},pay:{n:'PAY',u:'000s',f:'count',c:'#a98cff',g:'Growth',d:'Payroll employment change.',use:'Measures net labor-market job creation.',why:'Employment supports income, consumption and the growth cycle.'},ipr:{n:'IPR',u:'Index',f:'index',c:'#dc995d',g:'Growth',d:'Industrial production index.',use:'Tracks real output in industry.',why:'Production helps identify cyclical acceleration or slowdown.'},clm:{n:'CLM',u:'000s',f:'count',c:'#7caeb2',g:'Growth',d:'Initial unemployment claims.',use:'Provides a relatively high-frequency labor stress signal.',why:'Claims can turn before slower employment aggregates.'},cpi:{n:'CPI',u:'Index',f:'index',c:'#d8a4ff',g:'Macro',d:'Consumer Price Index.',use:'Measures the price level of a broad consumer basket.',why:'Inflation shapes purchasing power and monetary-policy decisions.'},wti:{n:'WTI',u:'$/bbl',f:'dollar',c:'#52c7d7',g:'Macro',d:'West Texas Intermediate crude oil price.',use:'Tracks a daily market price for a major energy benchmark.',why:'Energy prices affect inflation, activity and market expectations.'},ffr:{n:'FFR',u:'%',f:'percent',c:'#e5a25f',g:'Macro',d:'Federal funds policy rate.',use:'Represents the central bank policy-rate setting.',why:'It anchors short rates and influences financing conditions.'},bei:{n:'BEI',u:'%',f:'percent',c:'#c893df',g:'Macro',d:'Breakeven inflation expectation proxy.',use:'Tracks market-implied inflation compensation.',why:'It provides a market-based counterpart to released inflation data.'},spy:{n:'SPY',u:'$',f:'dollar',c:'#77a7ff',g:'Market',d:'S&P 500 ETF price.',use:'Broad U.S. equity-market proxy.',why:'It summarizes large-cap equity pricing and risk appetite.'},qqq:{n:'QQQ',u:'$',f:'dollar',c:'#6f93e8',g:'Market',d:'Nasdaq-100 ETF price.',use:'Large-cap growth and technology equity proxy.',why:'It is sensitive to growth expectations and discount rates.'},gold:{n:'GLD',u:'$',f:'dollar',c:'#d5aa66',g:'Market',d:'Gold ETF price.',use:'Liquid proxy for gold-market pricing.',why:'Gold can respond to real rates, currency moves and risk demand.'},dxy:{n:'DXY',u:'Index',f:'index',c:'#b8c2d0',g:'Market',d:'U.S. Dollar Index proxy.',use:'Tracks broad dollar strength.',why:'Dollar moves affect global financial conditions and commodity pricing.'}};let S={nav:'now',screen:'market',index:null,h:'5D',info:false,analysis:[],active:null,cross:null};function ids(){if(S.screen==='market')return Object.keys(IDX);if(S.screen==='index')return IDX[S.index].components;return S.analysis}function meta(id){if(IDX[id])return{n:IDX[id].abbr,u:'Indexed 100',f:'indexed',c:IDX[id].color,g:'Index',d:IDX[id].desc,use:'Used as a top-level analytical context.',why:'It identifies which evidence family deserves deeper investigation.'};return SER[id]}function context(){if(S.nav!=='now')return S.nav.toUpperCase();if(S.screen==='market')return'Market: <span class="sentiment">Mixed / balanced</span>';if(S.screen==='index'){let z=IDX[S.index];return z.name+': <span class="sentiment">'+z.sent+'</span>'}let root=meta(S.analysis[0]);return root.n+': <span class="sentiment">'+IDX[S.index].name+' analysis'+(S.analysis.length>1?' · '+S.analysis.length+' series':'')+'</span>'}function crumbs(){if(S.nav!=='now')return'<button>Now</button><span class="sep">›</span><button>'+S.nav+'</button>';let a=['<button data-crumb="market">Now</button>'];if(S.screen!=='market')a.push('<span class="sep">›</span><button data-crumb="index">'+IDX[S.index].name+'</button>');if(S.screen==='analysis')a.push('<span class="sep">›</span><button>'+meta(S.analysis[0]).n+'</button>');return a.join('')}function fams(){return S.screen==='analysis'?[...new Set(S.analysis.map(id=>SER[id].f))]:['indexed']}function representation(){let f=fams();return f.length===1?{mode:'single',families:f}:f.length===2?{mode:'dual',families:f}:{mode:'indexed',families:['indexed']}}function axisLabel(f){let q={percent:'% / bps',dollar:'$ / $-based',index:'Index',count:'Count',indexed:'Indexed 100'};return q[f]||f}function legend(){let a=ids().map(id=>{let q=meta(id),remove=S.screen==='analysis'&&S.analysis.length>1?'<span class="x" data-remove="'+id+'">×</span>':'';return'<button class="chip" data-series="'+id+'" data-help="'+id+'"><i class="dot" style="background:'+q.c+'"></i>'+q.n+remove+'</button>'}).join('');if(S.screen==='analysis')a+='<button class="add" id="add" title="Add series">+</button>';let rep=representation(),note=S.screen==='analysis'?(rep.mode==='dual'?axisLabel(rep.families[0])+' left · '+axisLabel(rep.families[1])+' right':rep.mode==='indexed'?'3+ unit families · Indexed 100':'Native '+axisLabel(rep.families[0])):'';return'<div class="legendWrap"><div class="legend">'+a+'</div></div><div class="axisNote '+(note?'on':'')+'">'+note+'</div>'}function ai(){let t='Market POV',p='Risk, growth and macro are not expressing one dominant regime.',w='Choose an index to see which components are producing the aggregate signal.';if(S.screen==='index'){let z=IDX[S.index];t=z.name+' POV';p=z.pov;w=z.why}else if(S.screen==='analysis'){let names=S.analysis.map(id=>meta(id).n),rep=representation();t=(names.length===1?names[0]:'Analysis')+' POV';p=names.length===1?names[0]+' is shown in native evidence context.':names.join(', ')+' are being investigated in one analytical state.';w=rep.mode==='dual'?'The chart keeps native evidence because the series resolve into two compatible unit families.':rep.mode==='indexed'?'The series span more than two unit families, so the chart normalizes rather than inventing another native axis.':'All represented series share one compatible native unit family.'}return'<section class="ai"><div class="aiHead"><h2>'+t+'</h2><button class="infoBtn" id="info" aria-label="Information">ⓘ</button></div><p><b>What changed:</b> '+p+'</p><p class="why"><b>Why it matters:</b> '+w+'</p><div class="info '+(S.info?'on':'')+'"><b>Evidence & method</b><br>Representative prototype data. Sources, latest observations, cadence, units, provenance and axis/normalization decisions belong here.<br><br><b>Open validation</b><br>Mixed-frequency real-data rendering remains unproven in this mock. CPI (monthly) versus WTI (daily) is the canonical acceptance case.<br><br><b>QA</b><br>Gate 3 journey · breadcrumbs · legend help · additive analysis · unit-family axes · persistent AI composer.</div></section>'}function surface(){return'<section class="chartSection">'+legend()+'<div class="chart" id="chartbox"><canvas id="chart"></canvas><div class="valueTag" id="valueTag"></div><div class="dateTag" id="dateTag"></div></div></section>'+ai()}function render(){S.cross=null;$('#context').innerHTML=context();$('#crumbs').innerHTML=crumbs();$('#horizons').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(S.h===h?'on':'')+'">'+h+'</button>').join('');$('#body').innerHTML=S.nav==='now'?surface():'<div class="placeholder">'+S.nav.toUpperCase()+' remains in the application frame; Gate 3 is evaluating the analytical journey.</div>';wire();if(S.nav==='now')draw()}function rnd(s,n=42){let a=[],v=100;for(let i=0;i<n;i++){v+=Math.sin(i*.65+s)*.8+Math.cos(i*.29+s)*.38;a.push(v)}return a}function dataFor(id,k){let q=meta(id),a=rnd(k+1);if(q.f==='percent')return a.map(v=>(v-100)*.4+3);if(q.f==='dollar')return a.map(v=>v*1.8+30);if(q.f==='count')return a.map(v=>(v-95)*35+120);return a}function draw(){let c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,rep=representation(),L=48,R=rep.mode==='dual'?52:12,T=12,B=28,series=ids().map((id,k)=>({id,q:meta(id),a:dataFor(id,k)}));let groups={};if(rep.mode==='indexed'){series.forEach(s=>{let b=s.a[0]||1;s.plot=s.a.map(v=>100+(v/b-1)*100)});groups.indexed=series.flatMap(s=>s.plot)}else{series.forEach(s=>s.plot=s.a);for(let f of rep.families)groups[f]=series.filter(s=>s.q.f===f).flatMap(s=>s.plot)}let range=f=>{let a=groups[f]||[0,1],mn=Math.min(...a),mx=Math.max(...a),pad=(mx-mn||1)*.12;return[mn-pad,mx+pad]};let leftFam=rep.mode==='indexed'?'indexed':rep.families[0],rightFam=rep.mode==='dual'?rep.families[1]:null,left=range(leftFam),right=rightFam?range(rightFam):null;x.font='10px system-ui';x.strokeStyle='#253141';x.fillStyle='#8290a3';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();let lv=left[1]-(left[1]-left[0])*i/4;x.fillText(formatTick(lv),4,y+3);if(right){let rv=right[1]-(right[1]-right[0])*i/4;x.fillText(formatTick(rv),W-R+7,y+3)}}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);if(right){x.moveTo(W-R,T);x.lineTo(W-R,HH-B)}x.stroke();let labs=S.h==='5D'?['Mon','Tue','Wed','Thu','Fri']:S.h==='1D'?['Open','10','12','14','Close']:S.h==='MTD'?['1','8','15','22','29']:S.h==='YTD'?['Jan','Mar','May','Jul','Aug']:S.h==='1YR'?['Sep','Dec','Mar','Jun','Aug']:S.h==='3YR'?['2024','2025','2026']:['2022','2023','2024','2025','2026'];labs.forEach((z,i)=>x.fillText(z,L+(W-L-R-24)*i/Math.max(1,labs.length-1),HH-7));S.plot={L,R,T,B,W,HH,series,left,right,leftFam,rightFam};series.forEach(s=>{let rr=rep.mode==='indexed'?left:(s.q.f===leftFam?left:right),a=s.plot;x.strokeStyle=s.q.c;x.lineWidth=2.2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(rr[1]-v)/(rr[1]-rr[0]||1)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});if(S.cross)drawCross(x)}function formatTick(v){let a=Math.abs(v);return a>=1000?Math.round(v).toLocaleString():a>=100?Math.round(v).toString():v.toFixed(a<10?1:0)}function inspect(ev){if(!S.plot)return;let r=$('#chart').getBoundingClientRect(),px=ev.clientX-r.left,p=S.plot;if(px<p.L||px>p.W-p.R)return;let s=p.series.find(z=>z.id===S.active)||p.series[0];if(!s)return;S.active=s.id;let i=Math.max(0,Math.min(s.plot.length-1,Math.round((px-p.L)/(p.W-p.L-p.R)*(s.plot.length-1))));S.cross={id:s.id,i};draw()}function drawCross(x){let p=S.plot,s=p.series.find(z=>z.id===S.cross.id);if(!s)return;let rep=representation(),rr=rep.mode==='indexed'?p.left:(s.q.f===p.leftFam?p.left:p.right),v=s.plot[S.cross.i],raw=s.a[S.cross.i],px=p.L+(p.W-p.L-p.R)*S.cross.i/(s.plot.length-1),py=p.T+(rr[1]-v)/(rr[1]-rr[0]||1)*(p.HH-p.T-p.B);x.strokeStyle='#8392a8';x.lineWidth=1;x.beginPath();x.moveTo(px,p.T);x.lineTo(px,p.HH-p.B);x.stroke();x.fillStyle=s.q.c;x.beginPath();x.arc(px,py,4,0,Math.PI*2);x.fill();let vt=$('#valueTag'),dt=$('#dateTag');vt.textContent=s.q.n+' '+formatTick(raw)+' '+s.q.u;vt.style.display='block';vt.style.left=Math.min(p.W-110,px+7)+'px';vt.style.top=Math.max(4,py-15)+'px';dt.textContent=S.h+' point '+(S.cross.i+1);dt.style.display='block';dt.style.left=Math.max(2,Math.min(p.W-75,px-30))+'px';dt.style.top=(p.HH-p.B+3)+'px'}function showTip(id,el){let q=meta(id),r=el.getBoundingClientRect(),top=Math.min(innerHeight-190,r.bottom+7),left=Math.max(12,Math.min(innerWidth-312,r.left));$('#tipRoot').innerHTML='<div class="tip" id="tip" style="top:'+top+'px;left:'+left+'px"><b>'+q.n+'</b><p>'+q.d+'</p><p><strong>Used here:</strong> '+q.use+'</p><p><strong>Why it matters:</strong> '+q.why+'</p><a href="?analysis='+id+'" target="_blank">More → standalone analysis</a></div>'}function hideTip(){setTimeout(()=>{let t=$('#tip');if(t&&!t.matches(':hover'))$('#tipRoot').innerHTML=''},120)}function openPicker(){let available=Object.entries(SER).filter(([id])=>!S.analysis.includes(id)),chosen=new Set();$('#modalRoot').innerHTML='<div class="modalWrap" id="shade"><div class="modal"><div class="modalHead"><h2>Add series</h2><button id="close">×</button></div><input class="search" id="search" placeholder="Search all series"><div class="pick">'+available.map(([id,q])=>'<button data-pick="'+id+'"><span><i class="dot" style="background:'+q.c+'"></i>'+q.n+'</span><small>'+q.g+' · '+q.u+'</small></button>').join('')+'</div><div class="modalFoot"><button id="cancel">Cancel</button><button id="addSelected" disabled>Add selected</button></div></div></div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;chosen.has(id)?chosen.delete(id):chosen.add(id);b.classList.toggle('sel',chosen.has(id));$('#addSelected').disabled=!chosen.size;$('#addSelected').textContent=chosen.size?'Add '+chosen.size:'Add selected'});let close=()=>$('#modalRoot').innerHTML='';$('#close').onclick=close;$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target.id==='shade')close()};$('#addSelected').onclick=()=>{S.analysis.push(...chosen);close();S.info=false;S.active=S.analysis[0];render()};$('#search').oninput=e=>{let v=e.target.value.toLowerCase();document.querySelectorAll('[data-pick]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(v)?'flex':'none')}}function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.info=false;render()});document.querySelectorAll('[data-series]').forEach(b=>{b.onclick=e=>{if(e.target.dataset.remove)return;let id=b.dataset.series;if(S.screen==='market'){S.index=id;S.screen='index'}else if(S.screen==='index'){S.analysis=[id];S.active=id;S.screen='analysis'}else S.active=id;S.info=false;render()};b.onmouseenter=()=>showTip(b.dataset.help,b);b.onmouseleave=hideTip;b.oncontextmenu=e=>{e.preventDefault();showTip(b.dataset.help,b)}});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.stopPropagation();S.analysis=S.analysis.filter(id=>id!==x.dataset.remove);if(!S.analysis.includes(S.active))S.active=S.analysis[0];S.info=false;render()});document.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>{if(b.dataset.crumb==='market'){S.screen='market';S.index=null;S.analysis=[]}else if(b.dataset.crumb==='index'){S.screen='index';S.analysis=[]}S.info=false;render()});$('#add')?.addEventListener('click',openPicker);$('#info')?.addEventListener('click',()=>{S.info=!S.info;render()});$('#chart')?.addEventListener('pointerdown',inspect)}$('#menu').onclick=()=>$('#rail').classList.toggle('closed');$('#more').onclick=e=>{e.stopPropagation();$('#moreMenu').classList.toggle('on')};$('#moreAdd').onclick=()=>{if(S.screen==='analysis')openPicker();else if(S.screen==='index'){S.analysis=[IDX[S.index].components[0]];S.active=S.analysis[0];S.screen='analysis';render()}};document.addEventListener('click',e=>{if(!e.target.closest('.moreWrap'))$('#moreMenu').classList.remove('on')});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});$('#send').onclick=()=>{let v=$('#ask').value.trim();if(v){$('#ask').value='';S.info=true;render()}};window.onresize=()=>{if(S.nav==='now')draw()};let p=new URLSearchParams(location.search),aid=p.get('analysis');if(aid&&SER[aid]){S.index=SER[aid].g.toLowerCase();if(!IDX[S.index])S.index='macro';S.screen='analysis';S.analysis=[aid];S.active=aid}render();</script></body></html>
