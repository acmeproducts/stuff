<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market View — Gate 3 UX Journey</title><style>
:root{color-scheme:dark;--bg:#070b11;--panel:#0d131d;--line:#202a38;--text:#f4f7fb;--muted:#8d9aae;--blue:#4f9dff;--red:#ff565f;--white:#f4f7fb;--violet:#a88bff;--cyan:#51cbd7;--orange:#e89b55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;min-height:100dvh;padding-bottom:72px}.top{position:sticky;top:0;z-index:20;background:#070b11ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 12px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.brand{font-weight:800;letter-spacing:.02em}.crumb{color:var(--muted);font-size:11px;margin-top:3px}.qa{font-size:10px;padding:5px 8px}.qaBox{display:none;margin-top:8px;padding:8px;border:1px dashed #566579;color:#aeb9c8;font-size:10px}.qaBox.on{display:block}.main{padding:12px}.hero{padding:2px 2px 8px}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.hero h1{font-size:25px;margin:3px 0 2px}.hero p{margin:0;color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}.chart{height:260px;position:relative}.chart canvas{width:100%;height:100%;touch-action:none}.horizons,.pills,.actions{display:flex;gap:6px;overflow:auto;scrollbar-width:none}.horizons{margin:8px 0}.horizons button{min-width:43px}.pills{padding:4px 0 8px}.pill{display:flex;align-items:center;gap:6px;white-space:nowrap}.dot{width:9px;height:9px;border-radius:50%}button,select{background:#101824;color:var(--text);border:1px solid #2b384a;border-radius:9px;padding:8px 10px;font:inherit}button{cursor:pointer}.active{border-color:#6f87a8;background:#172235}.indexGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.index{padding:12px 8px;text-align:left}.index b{display:block;font-size:14px}.index small{color:var(--muted)}.ai{border-left:3px solid #65748b}.ai h3{margin:0 0 6px;font-size:14px}.ai p{margin:4px 0;line-height:1.38}.why{color:#c8d3e0}.evidence{display:none;border-top:1px solid var(--line);margin-top:9px;padding-top:9px;color:var(--muted);font-size:12px}.evidence.on{display:block}.back{padding:6px 9px}.componentList{display:grid;gap:7px}.component{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left}.component span:last-child{color:var(--muted);font-size:11px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:7px}.compare label{font-size:10px;color:var(--muted)}.compare select{width:100%;margin-top:4px}.tabs{display:flex;gap:4px;margin-top:8px}.tabs button{flex:1;font-size:11px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#090f17ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:30}.bottom button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:7px 2px}.bottom button.on{color:var(--text)}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.value{font-size:11px;color:var(--muted)}.sectionTitle{font-size:12px;font-weight:800;margin:0 0 8px}.semantic{font-size:10px;color:var(--muted);margin-top:7px}@media(min-width:700px){body{background:#030609}.app{box-shadow:0 0 0 1px #18202c}}
</style></head><body><div class="app"><header class="top"><div class="row between"><div><div class="brand">MARKET VIEW</div><div class="crumb" id="crumb">Now / Market</div></div><button class="qa" id="qaBtn">QA</button></div><div class="qaBox" id="qaBox">Gate 3 prototype · navigation/context/AI placement only · chart geometry is representative · diagnostics intentionally hidden from product surface.</div></header><main class="main" id="main"></main><nav class="bottom"><button data-nav="now" class="on">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav></div><script>
const $=s=>document.querySelector(s),C={risk:'#ff565f',growth:'#4f9dff',macro:'#f4f7fb'},H=['1D','5D','1M','YTD','1Y','3Y','5Y'];
const indices={risk:{name:'Risk',abbr:'RSK',color:C.risk,summary:'Risk appetite is mixed, with volatility contained but credit conditions doing more of the work.',why:'The signal is not a broad risk-off move; the component mix matters.',components:[['vix','VIX','Volatility'],['hy','HYS','High Yield Spread'],['nfci','NFC','Financial Conditions'],['r10','R10','Real 10Y']]},growth:{name:'Growth',abbr:'GRW',color:C.growth,summary:'Growth remains positive but the recent impulse is uneven across activity and labor.',why:'The aggregate line hides a divergence between consumption and softer forward labor evidence.',components:[['ret','RET','Retail Sales'],['pay','PAY','Payrolls'],['ip','IPR','Industrial Production'],['clm','CLM','Initial Claims']]},macro:{name:'Macro',abbr:'MAC',color:C.macro,summary:'Macro conditions are stable at the headline level while inflation and rates remain the key tension.',why:'The neutral aggregate masks different release cadences and the policy/inflation relationship.',components:[['cpi','CPI','Consumer Prices'],['wti','WTI','WTI Crude'],['ffr','FFR','Fed Funds'],['bei','BEI','10Y Breakeven']]}};
const series={vix:['VIX','Index','#a88bff'],hy:['HYS','bps','#51cbd7'],nfci:['NFC','Index','#e89b55'],r10:['R10','%','#bd91d8'],ret:['RET','%','#51cbd7'],pay:['PAY','000s','#a88bff'],ip:['IPR','Index','#e89b55'],clm:['CLM','000s','#71b9a5'],cpi:['CPI','Index','#a88bff'],wti:['WTI','$/bbl','#51cbd7'],ffr:['FFR','%','#e89b55'],bei:['BEI','%','#bd91d8']};
let S={nav:'now',screen:'market',index:null,component:null,h:'5D',evidence:false,compare:['cpi','wti']};
function rnd(seed,n=36){let a=[],v=100;for(let i=0;i<n;i++){v+=(Math.sin(i*.7+seed)*1.1+Math.cos(i*.31+seed)*.55);a.push(v)}return a}
function chart(lines){return `<div class="chart"><canvas id="chart"></canvas></div><div class="horizons">${H.map(h=>`<button data-h="${h}" class="${S.h===h?'active':''}">${h}</button>`).join('')}</div><div class="pills">${lines.map(x=>`<button class="pill" data-line="${x.id}"><i class="dot" style="background:${x.color}"></i>${x.label}</button>`).join('')}</div>`}
function draw(lines){let c=$('#chart');if(!c)return;let d=devicePixelRatio||1,r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,Hh=r.height,L=38,R=10,T=12,B=25;x.strokeStyle='#273344';x.fillStyle='#7f8da1';x.font='10px system-ui';x.lineWidth=1;for(let i=0;i<5;i++){let y=T+(Hh-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(String(104-i*2),4,y+3)}x.beginPath();x.moveTo(L,T);x.lineTo(L,Hh-B);x.lineTo(W-R,Hh-B);x.stroke();['Mon','Tue','Wed','Thu','Fri'].forEach((z,i)=>x.fillText(z,L+(W-L-R-20)*i/4,Hh-7));lines.forEach((s,k)=>{let a=rnd(k+1),min=Math.min(...a),max=Math.max(...a);x.strokeStyle=s.color;x.lineWidth=2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(max-v)/(max-min||1)*(Hh-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
function ai(title,body,why){return `<section class="card ai"><h3>${title}</h3><p>${body}</p><p class="why"><b>Why it matters:</b> ${why}</p><button id="evidenceBtn">${S.evidence?'Hide evidence':'Evidence & reasoning'}</button><div class="evidence ${S.evidence?'on':''}">Representative evidence layer: latest observations, release cadence, source provenance, component contribution and challenges to the interpretation would appear here without permanently reducing chart space.</div></section>`}
function market(){let lines=Object.entries(indices).map(([id,z])=>({id,label:z.abbr,color:z.color}));return `<div class="hero"><div class="eyebrow">Now · 5-day default</div><h1>Market</h1><p>Three peer indices. Nothing is selected until you choose a context.</p></div><section class="card">${chart(lines)}<div class="indexGrid">${Object.entries(indices).map(([id,z])=>`<button class="index" data-index="${id}" style="border-top:2px solid ${z.color}"><b>${z.name}</b><small>${z.abbr}</small></button>`).join('')}</div><div class="semantic">Risk = red · Growth = blue · Macro = neutral</div></section>${ai('Market POV','The market is not expressing one dominant regime across risk, growth and macro.','The useful next step is choosing the index whose components you want to interrogate.')}`}
function indexView(){let z=indices[S.index],lines=z.components.map(([id,a])=>({id,label:a,color:series[id][2]}));return `<div class="hero"><button class="back" data-back="market">← Market</button><div class="eyebrow">Index context</div><h1 style="color:${z.color}">${z.name}</h1><p>${z.abbr} components · choose a component to investigate.</p></div><section class="card">${chart(lines)}<div class="componentList">${z.components.map(([id,a,n])=>`<button class="component" data-component="${id}"><span><i class="dot" style="background:${series[id][2]};display:inline-block;margin-right:7px"></i><b>${a}</b> · ${n}</span><span>Explore →</span></button>`).join('')}</div></section>${ai(`${z.name} POV`,z.summary,z.why)}`}
function componentView(){let z=indices[S.index],q=series[S.component];let lines=[{id:S.component,label:q[0],color:q[2]}];return `<div class="hero"><button class="back" data-back="index">← ${z.name}</button><div class="eyebrow">Explore · ${z.name} component</div><h1>${q[0]}</h1><p>${z.name} → ${q[0]} · native ${q[1]}</p></div><section class="card">${chart(lines)}<div class="actions"><button id="compareBtn">+ Compare</button><button>Data</button><button>Statistics</button><button>Save</button></div></section>${ai(`${q[0]} interpretation`,`${q[0]} is being viewed in its native evidence context rather than as an isolated chart.`,`Its meaning is interpreted relative to the ${z.name} question that brought you here.`)}`}
function compareView(){let a=series[S.compare[0]],b=series[S.compare[1]],lines=[{id:S.compare[0],label:a[0],color:a[2]},{id:S.compare[1],label:b[0],color:b[2]}];let opts=Object.entries(series).map(([id,q])=>`<option value="${id}">${q[0]}</option>`).join('');return `<div class="hero"><button class="back" data-back="component">← Component</button><div class="eyebrow">Explore · comparison</div><h1>${a[0]} + ${b[0]}</h1><p>Two-series paved road · native dual axis when units differ.</p></div><section class="card"><div class="compare"><label>Series 1<select data-slot="0">${opts}</select></label><label>Series 2<select data-slot="1">${opts}</select></label></div>${chart(lines)}<div class="tabs"><button>Chart</button><button>Data</button><button>Statistics</button><button>POV</button></div></section>${ai('Comparison POV',`${a[0]} and ${b[0]} are shown together to test whether their recent moves reinforce or challenge the current thesis.`,`The comparison should answer a question, not merely add another line.`)}`}
function placeholder(name){return `<div class="hero"><div class="eyebrow">${name}</div><h1>${name}</h1></div><div class="card empty">Gate 3 keeps this destination present in the application map but does not build its production feature set yet.</div>`}
function render(){let m=$('#main');$('#crumb').textContent=S.nav==='now'?(S.screen==='market'?'Now / Market':S.screen==='index'?`Now / ${indices[S.index].name}`:`Explore / ${indices[S.index]?.name||''} / ${S.component?series[S.component][0]:'Compare'}`):S.nav[0].toUpperCase()+S.nav.slice(1);document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.nav));if(S.nav!=='now')m.innerHTML=placeholder(S.nav.toUpperCase());else m.innerHTML=S.screen==='market'?market():S.screen==='index'?indexView():S.screen==='component'?componentView():compareView();wire();let lines;if(S.screen==='market')lines=Object.entries(indices).map(([id,z])=>({id,label:z.abbr,color:z.color}));else if(S.screen==='index')lines=indices[S.index].components.map(([id,a])=>({id,label:a,color:series[id][2]}));else if(S.screen==='component'){let q=series[S.component];lines=[{id:S.component,label:q[0],color:q[2]}]}else{let a=series[S.compare[0]],b=series[S.compare[1]];lines=[{id:S.compare[0],label:a[0],color:a[2]},{id:S.compare[1],label:b[0],color:b[2]}]}draw(lines)}
function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;render()});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{S.index=b.dataset.index;S.screen='index';S.evidence=false;render()});document.querySelectorAll('[data-component]').forEach(b=>b.onclick=()=>{S.component=b.dataset.component;S.screen='component';S.evidence=false;render()});document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{S.screen=b.dataset.back;render()});$('#evidenceBtn')?.addEventListener('click',()=>{S.evidence=!S.evidence;render()});$('#compareBtn')?.addEventListener('click',()=>{S.compare=[S.component,S.component==='wti'?'cpi':'wti'];S.screen='compare';render()});document.querySelectorAll('[data-slot]').forEach((s,i)=>{s.value=S.compare[i];s.onchange=()=>{S.compare[i]=s.value;render()}})}
$('#qaBtn').onclick=()=>$('#qaBox').classList.toggle('on');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;if(S.nav==='now'&&['component','compare'].includes(S.screen))S.screen='market';render()});render();addEventListener('resize',()=>render());
</script></body></html>
