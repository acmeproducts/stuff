<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market View — Gate 3 Additive Analysis</title><style>:root{color-scheme:dark;--bg:#070b11;--rail:#0b111a;--line:#283342;--text:#f4f7fb;--muted:#8996a8;--risk:#ff5964;--growth:#4f9dff;--macro:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.app{min-height:100dvh;display:flex}.rail{width:190px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.rail.closed{width:0;border:0}.rail h1{font-size:15px;margin:18px 16px}.rail nav{display:grid;padding:0 8px}.rail button{background:transparent;border:0;text-align:left}.config{margin-top:auto;padding:8px 8px 18px}.work{min-width:0;flex:1}.ribbon{position:sticky;top:0;z-index:10;background:#070b11f2;border-bottom:1px solid var(--line)}.r1{height:48px;display:flex;align-items:center;padding:0 10px;gap:9px}.menu{font-size:20px}.context{font-size:17px;font-weight:800}.sentiment{font-weight:500;color:var(--muted)}.r2{display:flex;justify-content:center;gap:2px;padding:0 5px 7px;overflow:auto}.r2 button{padding:6px 9px;border:0;background:transparent;color:var(--muted)}.r2 button.on{color:var(--text);border-bottom:2px solid #7f92aa;border-radius:0}.body{max-width:1000px;margin:auto;padding:0 12px}.chartSection{padding:12px 0 14px;border-bottom:1px solid var(--line)}.legend{display:flex;justify-content:center;align-items:center;gap:7px;overflow:auto;padding-bottom:8px;scrollbar-width:none}.chip{white-space:nowrap}.chip .x{margin-left:8px;color:var(--muted);font-weight:800}.add{font-size:20px;line-height:1;padding:5px 11px;border-radius:18px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.chart{height:min(48vh,430px);min-height:300px}.chart canvas{width:100%;height:100%;display:block;touch-action:none}.ai{padding:15px 4px 17px;border-bottom:1px solid var(--line);line-height:1.45}.aiHead{display:flex;align-items:center;gap:8px}.ai h2{font-size:15px;margin:0}.infoBtn{margin-left:auto;border-radius:50%;padding:3px 8px;font-weight:800}.ai p{margin:5px 0}.why{color:#c6d0dc}.info{display:none;color:var(--muted);font-size:12px;padding-top:9px}.info.on{display:block}.actions{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:9px 0 18px}.right{margin-left:auto}.modalWrap{position:fixed;z-index:80;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(620px,100%);max-height:78vh;background:#101721;border:1px solid #344256;border-radius:18px 18px 0 0;padding:14px;overflow:auto}.modalHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.modalHead h2{margin:0;font-size:17px}.modalHead button{margin-left:auto}.search{width:100%;margin-bottom:10px}.pick{display:grid;gap:6px}.pick button{text-align:left;display:flex;justify-content:space-between}.pick small{color:var(--muted)}button,input{font:inherit;color:var(--text);background:#101721;border:1px solid #303d4e;border-radius:8px;padding:7px 10px}.placeholder{padding:50px 10px;color:var(--muted);text-align:center}@media(max-width:650px){.rail{position:fixed;z-index:40;inset:0 auto 0 0;width:190px;box-shadow:8px 0 25px #0008}.rail.closed{transform:translateX(-100%);width:190px}.body{padding:0 9px}.chart{height:46vh;min-height:285px}.r2{justify-content:space-around}.r2 button{padding:6px 7px}}</style></head><body><div class="app"><aside class="rail closed" id="rail"><h1>MARKET VIEW</h1><nav><button data-nav="now">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav><div class="config"><button data-nav="config">CONFIG</button></div></aside><main class="work"><header class="ribbon"><div class="r1"><button class="menu" id="menu">☰</button><div class="context" id="context"></div></div><div class="r2" id="horizons"></div></header><div class="body" id="body"></div></main></div><div id="modalRoot"></div><script>const $=s=>document.querySelector(s),H=['1D','5D','MTD','YTD','1YR','3YR','5YR'];const IDX={risk:{name:'Risk',abbr:'RSK',color:'#ff5964',sent:'Mixed',pov:'Risk appetite is mixed rather than broadly defensive.',why:'Volatility is contained while credit and financial conditions carry more of the risk signal.',components:['vix','hys','nfc','r10']},growth:{name:'Growth',abbr:'GRW',color:'#4f9dff',sent:'Moderating',pov:'Growth remains positive, but the recent impulse is uneven.',why:'Consumption and activity remain firmer than forward labor evidence.',components:['ret','pay','ipr','clm']},macro:{name:'Macro',abbr:'MAC',color:'#f4f7fb',sent:'Balanced',pov:'Headline macro conditions are stable while inflation and rates remain the tension.',why:'The aggregate masks different release cadences and policy/inflation relationships.',components:['cpi','wti','ffr','bei']}};const SER={vix:['VIX','Index','#a98cff','Risk'],hys:['HYS','bps','#59c7d2','Risk'],nfc:['NFC','Index','#dc995d','Risk'],r10:['R10','%','#bd91d8','Risk'],ret:['RET','%','#59c7d2','Growth'],pay:['PAY','000s','#a98cff','Growth'],ipr:['IPR','Index','#dc995d','Growth'],clm:['CLM','000s','#7caeb2','Growth'],cpi:['CPI','Index','#d8a4ff','Macro'],wti:['WTI','$/bbl','#52c7d7','Macro'],ffr:['FFR','%','#e5a25f','Macro'],bei:['BEI','%','#c893df','Macro'],spy:['SPY','$','#77a7ff','Market'],dxy:['DXY','Index','#b8c2d0','Market']};let S={nav:'now',screen:'market',index:null,h:'5D',info:false,analysis:[]};function ids(){if(S.screen==='market')return Object.keys(IDX);if(S.screen==='index')return IDX[S.index].components;return S.analysis}function meta(id){if(IDX[id])return[IDX[id].abbr,'Indexed 100',IDX[id].color,'Index'];return SER[id]}function context(){if(S.nav!=='now')return S.nav.toUpperCase();if(S.screen==='market')return'Market: <span class="sentiment">Mixed / balanced</span>';if(S.screen==='index'){let z=IDX[S.index];return z.name+': <span class="sentiment">'+z.sent+'</span>'}let root=meta(S.analysis[0]);return root[0]+': <span class="sentiment">'+IDX[S.index].name+' analysis'+(S.analysis.length>1?' · '+S.analysis.length+' series':'')+'</span>'}function legend(){let a=ids().map((id,i)=>{let q=meta(id),remove=S.screen==='analysis'&&S.analysis.length>1?'<span class="x" data-remove="'+id+'">×</span>':'';return'<button class="chip" data-series="'+id+'"><i class="dot" style="background:'+q[2]+'"></i>'+q[0]+remove+'</button>'}).join('');if(S.screen==='analysis')a+='<button class="add" id="add" title="Add series">+</button>';return'<div class="legend">'+a+'</div>'}function ai(){let t='Market POV',p='Risk, growth and macro are not expressing one dominant regime.',w='Choose an index to see which components are producing the aggregate signal.';if(S.screen==='index'){let z=IDX[S.index];t=z.name+' POV';p=z.pov;w=z.why}else if(S.screen==='analysis'){let names=S.analysis.map(id=>meta(id)[0]);t=(names.length===1?names[0]:'Analysis')+' POV';p=names.length===1?names[0]+' is shown in native evidence context.':names.join(', ')+' are being investigated in one analytical state.';w=names.length===1?'Interpret it relative to the '+IDX[S.index].name+' question that led here.':'Axis assignment follows compatible unit families; adding lines does not create a new comparison mode.'}return'<section class="ai"><div class="aiHead"><h2>'+t+'</h2><button class="infoBtn" id="info" aria-label="Information">ⓘ</button></div><p><b>What changed:</b> '+p+'</p><p class="why"><b>Why it matters:</b> '+w+'</p><div class="info '+(S.info?'on':'')+'"><b>Evidence & method</b><br>Representative prototype data. Sources, latest observations, cadence, units, provenance and axis/normalization decisions belong here.<br><br><b>QA</b><br>Gate 3 navigation prototype · seven-horizon control · series set recomputes axes · diagnostics remain hidden by default.</div></section>'}function actions(){let back=S.screen==='market'?'':'<button id="back">← Back</button>';return'<div class="actions">'+back+'<div class="right"><button>Save to Library</button></div></div>'}function surface(){return'<section class="chartSection">'+legend()+'<div class="chart"><canvas id="chart"></canvas></div></section>'+ai()+actions()}function render(){$('#context').innerHTML=context();$('#horizons').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(S.h===h?'on':'')+'">'+h+'</button>').join('');$('#body').innerHTML=S.nav==='now'?surface():'<div class="placeholder">'+S.nav.toUpperCase()+' remains in the application frame; Gate 3 is evaluating the analytical journey.</div>';wire();if(S.nav==='now')draw()}function unitMode(){if(S.screen!=='analysis')return['Indexed 100'];let fam=[...new Set(S.analysis.map(id=>SER[id][1]))];return fam.length<=2?fam:['Indexed 100']}function rnd(s,n=42){let a=[],v=100;for(let i=0;i<n;i++){v+=Math.sin(i*.65+s)*.8+Math.cos(i*.29+s)*.38;a.push(v)}return a}function draw(){let c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,L=44,R=S.screen==='analysis'&&unitMode().length===2?44:12,T=12,B=26;x.strokeStyle='#253141';x.fillStyle='#8290a3';x.font='10px system-ui';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(String(104-i*2),5,y+3);if(R>20)x.fillText(String(80-i*10),W-R+8,y+3)}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);if(R>20){x.moveTo(W-R,T);x.lineTo(W-R,HH-B)}x.stroke();let labs=S.h==='5D'?['Mon','Tue','Wed','Thu','Fri']:S.h==='1D'?['Open','10','12','14','Close']:S.h==='MTD'?['1','8','15','22','29']:S.h==='YTD'?['Jan','Mar','May','Jul','Aug']:S.h==='1YR'?['Sep','Dec','Mar','Jun','Aug']:S.h==='3YR'?['2024','2025','2026']:['2022','2023','2024','2025','2026'];labs.forEach((z,i)=>x.fillText(z,L+(W-L-R-24)*i/Math.max(1,labs.length-1),HH-7));ids().forEach((id,k)=>{let q=meta(id),a=rnd(k+1),mn=Math.min(...a),mx=Math.max(...a);x.strokeStyle=q[2];x.lineWidth=2.2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(mx-v)/(mx-mn||1)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}function openPicker(){let available=Object.entries(SER).filter(([id])=>!S.analysis.includes(id));$('#modalRoot').innerHTML='<div class="modalWrap" id="shade"><div class="modal"><div class="modalHead"><h2>Add series</h2><button id="close">×</button></div><input class="search" id="search" placeholder="Search all series"><div class="pick" id="pick">'+available.map(([id,q])=>'<button data-pick="'+id+'"><span><i class="dot" style="background:'+q[2]+'"></i>'+q[0]+'</span><small>'+q[3]+' · '+q[1]+'</small></button>').join('')+'</div></div></div>';function pw(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.analysis.push(b.dataset.pick);$('#modalRoot').innerHTML='';S.info=false;render()})}pw();$('#close').onclick=()=>$('#modalRoot').innerHTML='';$('#shade').onclick=e=>{if(e.target.id==='shade')$('#modalRoot').innerHTML=''};$('#search').oninput=e=>{let v=e.target.value.toLowerCase();document.querySelectorAll('[data-pick]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(v)?'flex':'none')}}function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.info=false;render()});document.querySelectorAll('[data-series]').forEach(b=>b.onclick=e=>{if(e.target.dataset.remove)return;let id=b.dataset.series;if(S.screen==='market'){S.index=id;S.screen='index'}else if(S.screen==='index'){S.analysis=[id];S.screen='analysis'}S.info=false;render()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.stopPropagation();S.analysis=S.analysis.filter(id=>id!==x.dataset.remove);S.info=false;render()});$('#add')?.addEventListener('click',openPicker);$('#info')?.addEventListener('click',()=>{S.info=!S.info;render()});$('#back')?.addEventListener('click',()=>{if(S.screen==='analysis')S.screen='index';else{S.screen='market';S.index=null}S.info=false;render()})}$('#menu').onclick=()=>$('#rail').classList.toggle('closed');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});window.onresize=()=>{if(S.nav==='now')draw()};render();</script></body></html>
