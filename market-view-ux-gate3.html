<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market View — Gate 3 Additive Analysis</title><style>:root{color-scheme:dark;--bg:#070b11;--rail:#0b111a;--line:#283342;--text:#f4f7fb;--muted:#8996a8;--risk:#ff5964;--growth:#4f9dff;--macro:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}.app{min-height:100dvh;display:flex}.rail{width:190px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.rail.closed{width:0;border:0}.rail h1{font-size:15px;margin:18px 16px}.rail nav{display:grid;padding:0 8px}.rail button{background:transparent;border:0;text-align:left}.config{margin-top:auto;padding:8px 8px 18px}.work{min-width:0;flex:1}.ribbon{position:sticky;top:0;z-index:10;background:#070b11f2;border-bottom:1px solid var(--line)}.r1{height:48px;display:flex;align-items:center;padding:0 10px;gap:9px}.menu{font-size:20px}.context{font-size:17px;font-weight:800}.sentiment{font-weight:500;color:var(--muted)}.r2{display:flex;justify-content:center;gap:2px;padding:0 5px 7px;overflow:auto}.r2 button{padding:6px 9px;border:0;background:transparent;color:var(--muted)}.r2 button.on{color:var(--text);border-bottom:2px solid #7f92aa;border-radius:0}.body{max-width:1100px;margin:auto;padding:0 12px}.chartSection{padding:12px 0 14px;border-bottom:1px solid var(--line)}.legendWrap{display:flex;justify-content:center;align-items:center}.legend{display:flex;align-items:center;gap:7px;overflow:auto;padding:0 2px 8px;scrollbar-width:none;max-width:100%}.chip{white-space:nowrap}.chip .x{margin-left:8px;color:var(--muted);font-weight:800}.add{font-size:20px;line-height:1;padding:5px 11px;border-radius:18px;flex:0 0 auto}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.axisNote{display:none;text-align:center;color:var(--muted);font-size:10px;margin:-2px 0 5px}.axisNote.on{display:block}.chart{height:min(49vh,450px);min-height:300px;position:relative}.chart canvas{width:100%;height:100%;display:block;touch-action:none}.valueTag,.dateTag{display:none;position:absolute;z-index:4;background:#09111dcc;border:1px solid #53657b;border-radius:6px;padding:4px 6px;font-size:10px;pointer-events:none}.ai{padding:15px 4px 17px;border-bottom:1px solid var(--line);line-height:1.45}.aiHead{display:flex;align-items:center;gap:8px}.ai h2{font-size:15px;margin:0}.infoBtn{margin-left:auto;border-radius:50%;padding:3px 8px;font-weight:800}.ai p{margin:5px 0}.why{color:#c6d0dc}.info{display:none;color:var(--muted);font-size:12px;padding-top:9px}.info.on{display:block}.actions{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:9px 0 18px}.right{margin-left:auto}.modalWrap{position:fixed;z-index:80;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(660px,100%);max-height:82vh;background:#101721;border:1px solid #344256;border-radius:18px 18px 0 0;padding:14px;overflow:auto}.modalHead{display:flex;align-items:center;gap:8px;margin-bottom:10px}.modalHead h2{margin:0;font-size:17px}.modalHead button{margin-left:auto}.search{width:100%;margin-bottom:10px}.pick{display:grid;gap:6px}.pick button{text-align:left;display:flex;justify-content:space-between;align-items:center}.pick button.sel{border-color:#8297b3;background:#172234}.pick small{color:var(--muted)}.modalFoot{position:sticky;bottom:-14px;background:#101721;padding:10px 0 0;margin-top:10px;display:flex;justify-content:flex-end;gap:8px}.placeholder{padding:50px 10px;color:var(--muted);text-align:center}button,input{font:inherit;color:var(--text);background:#101721;border:1px solid #303d4e;border-radius:8px;padding:7px 10px}@media(max-width:650px){.rail{position:fixed;z-index:40;inset:0 auto 0 0;width:190px;box-shadow:8px 0 25px #0008}.rail.closed{transform:translateX(-100%);width:190px}.body{padding:0 9px}.chart{height:47vh;min-height:290px}.r2{justify-content:space-around}.r2 button{padding:6px 7px}}</style></head><body><div class="app"><aside class="rail closed" id="rail"><h1>MARKET VIEW</h1><nav><button data-nav="now">NOW</button><button data-nav="explore">EXPLORE</button><button data-nav="library">LIBRARY</button><button data-nav="health">HEALTH</button></nav><div class="config"><button data-nav="config">CONFIG</button></div></aside><main class="work"><header class="ribbon"><div class="r1"><button class="menu" id="menu">☰</button><div class="context" id="context"></div></div><div class="r2" id="horizons"></div></header><div class="body" id="body"></div></main></div><div id="modalRoot"></div><script>const $=s=>document.querySelector(s),H=['1D','5D','MTD','YTD','1YR','3YR','5YR'];const IDX={risk:{name:'Risk',abbr:'RSK',color:'#ff5964',sent:'Mixed',pov:'Risk appetite is mixed rather than broadly defensive.',why:'Volatility is contained while credit and financial conditions carry more of the risk signal.',components:['vix','hys','nfc','r10']},growth:{name:'Growth',abbr:'GRW',color:'#4f9dff',sent:'Moderating',pov:'Growth remains positive, but the recent impulse is uneven.',why:'Consumption and activity remain firmer than forward labor evidence.',components:['ret','pay','ipr','clm']},macro:{name:'Macro',abbr:'MAC',color:'#f4f7fb',sent:'Balanced',pov:'Headline macro conditions are stable while inflation and rates remain the tension.',why:'The aggregate masks different release cadences and policy/inflation relationships.',components:['cpi','wti','ffr','bei']}};const SER={vix:{n:'VIX',u:'Index',f:'index',c:'#a98cff',g:'Risk'},hys:{n:'HYS',u:'bps',f:'percent',c:'#59c7d2',g:'Risk'},nfc:{n:'NFC',u:'Index',f:'index',c:'#dc995d',g:'Risk'},r10:{n:'R10',u:'%',f:'percent',c:'#bd91d8',g:'Risk'},ret:{n:'RET',u:'%',f:'percent',c:'#59c7d2',g:'Growth'},pay:{n:'PAY',u:'000s',f:'count',c:'#a98cff',g:'Growth'},ipr:{n:'IPR',u:'Index',f:'index',c:'#dc995d',g:'Growth'},clm:{n:'CLM',u:'000s',f:'count',c:'#7caeb2',g:'Growth'},cpi:{n:'CPI',u:'Index',f:'index',c:'#d8a4ff',g:'Macro'},wti:{n:'WTI',u:'$/bbl',f:'dollar',c:'#52c7d7',g:'Macro'},ffr:{n:'FFR',u:'%',f:'percent',c:'#e5a25f',g:'Macro'},bei:{n:'BEI',u:'%',f:'percent',c:'#c893df',g:'Macro'},spy:{n:'SPY',u:'$',f:'dollar',c:'#77a7ff',g:'Market'},qqq:{n:'QQQ',u:'$',f:'dollar',c:'#6f93e8',g:'Market'},gold:{n:'GLD',u:'$',f:'dollar',c:'#d5aa66',g:'Market'},dxy:{n:'DXY',u:'Index',f:'index',c:'#b8c2d0',g:'Market'}};let S={nav:'now',screen:'market',index:null,h:'5D',info:false,analysis:[],active:null,cross:null};function ids(){if(S.screen==='market')return Object.keys(IDX);if(S.screen==='index')return IDX[S.index].components;return S.analysis}function meta(id){if(IDX[id])return{n:IDX[id].abbr,u:'Indexed 100',f:'indexed',c:IDX[id].color,g:'Index'};return SER[id]}function context(){if(S.nav!=='now')return S.nav.toUpperCase();if(S.screen==='market')return'Market: <span class="sentiment">Mixed / balanced</span>';if(S.screen==='index'){let z=IDX[S.index];return z.name+': <span class="sentiment">'+z.sent+'</span>'}let root=meta(S.analysis[0]);return root.n+': <span class="sentiment">'+IDX[S.index].name+' analysis'+(S.analysis.length>1?' · '+S.analysis.length+' series':'')+'</span>'}function fams(){return S.screen==='analysis'?[...new Set(S.analysis.map(id=>SER[id].f))]:['indexed']}function representation(){let f=fams();return f.length===1?{mode:'single',families:f}:f.length===2?{mode:'dual',families:f}:{mode:'indexed',families:['indexed']}}function axisLabel(f){let q={percent:'% / bps',dollar:'$ / $-based',index:'Index',count:'Count',indexed:'Indexed 100'};return q[f]||f}function legend(){let a=ids().map(id=>{let q=meta(id),remove=S.screen==='analysis'&&S.analysis.length>1?'<span class="x" data-remove="'+id+'">×</span>':'';return'<button class="chip" data-series="'+id+'"><i class="dot" style="background:'+q.c+'"></i>'+q.n+remove+'</button>'}).join('');if(S.screen==='analysis')a+='<button class="add" id="add" title="Add series">+</button>';let rep=representation(),note=S.screen==='analysis'?(rep.mode==='dual'?axisLabel(rep.families[0])+' left · '+axisLabel(rep.families[1])+' right':rep.mode==='indexed'?'3+ unit families · Indexed 100':'Native '+axisLabel(rep.families[0])):'';return'<div class="legendWrap"><div class="legend">'+a+'</div></div><div class="axisNote '+(note?'on':'')+'">'+note+'</div>'}function ai(){let t='Market POV',p='Risk, growth and macro are not expressing one dominant regime.',w='Choose an index to see which components are producing the aggregate signal.';if(S.screen==='index'){let z=IDX[S.index];t=z.name+' POV';p=z.pov;w=z.why}else if(S.screen==='analysis'){let names=S.analysis.map(id=>meta(id).n),rep=representation();t=(names.length===1?names[0]:'Analysis')+' POV';p=names.length===1?names[0]+' is shown in native evidence context.':names.join(', ')+' are being investigated in one analytical state.';w=rep.mode==='dual'?'The chart keeps native evidence because the series resolve into two compatible unit families.':rep.mode==='indexed'?'The series span more than two unit families, so the chart normalizes rather than inventing another native axis.':'All represented series share one compatible native unit family.'}return'<section class="ai"><div class="aiHead"><h2>'+t+'</h2><button class="infoBtn" id="info" aria-label="Information">ⓘ</button></div><p><b>What changed:</b> '+p+'</p><p class="why"><b>Why it matters:</b> '+w+'</p><div class="info '+(S.info?'on':'')+'"><b>Evidence & method</b><br>Representative prototype data. Sources, latest observations, cadence, units, provenance and axis/normalization decisions belong here.<br><br><b>Current representation</b><br>'+representation().mode.toUpperCase()+' · '+fams().map(axisLabel).join(' · ')+'<br><br><b>QA</b><br>Gate 3 navigation prototype · seven horizons · additive legend management · point inspection · unit-family axis recomputation.</div></section>'}function actions(){let back=S.screen==='market'?'':'<button id="back">← Back</button>';return'<div class="actions">'+back+'<div class="right"><button>Save to Library</button></div></div>'}function surface(){return'<section class="chartSection">'+legend()+'<div class="chart" id="chartbox"><canvas id="chart"></canvas><div class="valueTag" id="valueTag"></div><div class="dateTag" id="dateTag"></div></div></section>'+ai()+actions()}function render(){S.cross=null;$('#context').innerHTML=context();$('#horizons').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(S.h===h?'on':'')+'">'+h+'</button>').join('');$('#body').innerHTML=S.nav==='now'?surface():'<div class="placeholder">'+S.nav.toUpperCase()+' remains in the application frame; Gate 3 is evaluating the analytical journey.</div>';wire();if(S.nav==='now')draw()}function rnd(s,n=42){let a=[],v=100;for(let i=0;i<n;i++){v+=Math.sin(i*.65+s)*.8+Math.cos(i*.29+s)*.38;a.push(v)}return a}function dataFor(id,k){let q=meta(id),a=rnd(k+1);if(q.f==='percent')return a.map(v=>(v-100)*.4+3);if(q.f==='dollar')return a.map(v=>v*1.8+30);if(q.f==='count')return a.map(v=>(v-95)*35+120);return a}function draw(){let c=$('#chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,rep=representation(),L=48,R=rep.mode==='dual'?52:12,T=12,B=28,series=ids().map((id,k)=>({id,q:meta(id),a:dataFor(id,k)}));let groups={};if(rep.mode==='indexed'){series.forEach(s=>{let b=s.a[0]||1;s.plot=s.a.map(v=>100+(v/b-1)*100)});groups.indexed=series.flatMap(s=>s.plot)}else{series.forEach(s=>s.plot=s.a);for(let f of rep.families)groups[f]=series.filter(s=>s.q.f===f).flatMap(s=>s.plot)}let range=f=>{let a=groups[f]||[0,1],mn=Math.min(...a),mx=Math.max(...a),pad=(mx-mn||1)*.12;return[mn-pad,mx+pad]};let leftFam=rep.mode==='indexed'?'indexed':rep.families[0],rightFam=rep.mode==='dual'?rep.families[1]:null,left=range(leftFam),right=rightFam?range(rightFam):null;x.font='10px system-ui';x.strokeStyle='#253141';x.fillStyle='#8290a3';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();let lv=left[1]-(left[1]-left[0])*i/4;x.fillText(formatTick(lv),4,y+3);if(right){let rv=right[1]-(right[1]-right[0])*i/4;x.fillText(formatTick(rv),W-R+7,y+3)}}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);if(right){x.moveTo(W-R,T);x.lineTo(W-R,HH-B)}x.stroke();let labs=S.h==='5D'?['Mon','Tue','Wed','Thu','Fri']:S.h==='1D'?['Open','10','12','14','Close']:S.h==='MTD'?['1','8','15','22','29']:S.h==='YTD'?['Jan','Mar','May','Jul','Aug']:S.h==='1YR'?['Sep','Dec','Mar','Jun','Aug']:S.h==='3YR'?['2024','2025','2026']:['2022','2023','2024','2025','2026'];labs.forEach((z,i)=>x.fillText(z,L+(W-L-R-24)*i/Math.max(1,labs.length-1),HH-7));S.plot={L,R,T,B,W,HH,series,left,right,leftFam,rightFam};series.forEach(s=>{let rr=rep.mode==='indexed'?left:(s.q.f===leftFam?left:right),a=s.plot;x.strokeStyle=s.q.c;x.lineWidth=2.2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(rr[1]-v)/(rr[1]-rr[0]||1)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});if(S.cross)drawCross(x)}function formatTick(v){let a=Math.abs(v);return a>=1000?Math.round(v).toLocaleString():a>=100?Math.round(v).toString():v.toFixed(a<10?1:0)}function inspect(ev){if(!S.plot)return;let r=$('#chart').getBoundingClientRect(),px=ev.clientX-r.left,p=S.plot;if(px<p.L||px>p.W-p.R)return;let s=p.series.find(z=>z.id===S.active)||p.series[0];if(!s)return;S.active=s.id;let i=Math.max(0,Math.min(s.plot.length-1,Math.round((px-p.L)/(p.W-p.L-p.R)*(s.plot.length-1))));S.cross={id:s.id,i};draw()}function drawCross(x){let p=S.plot,s=p.series.find(z=>z.id===S.cross.id);if(!s)return;let rep=representation(),rr=rep.mode==='indexed'?p.left:(s.q.f===p.leftFam?p.left:p.right),v=s.plot[S.cross.i],raw=s.a[S.cross.i],px=p.L+(p.W-p.L-p.R)*S.cross.i/(s.plot.length-1),py=p.T+(rr[1]-v)/(rr[1]-rr[0]||1)*(p.HH-p.T-p.B);x.strokeStyle='#8392a8';x.lineWidth=1;x.beginPath();x.moveTo(px,p.T);x.lineTo(px,p.HH-p.B);x.stroke();x.fillStyle=s.q.c;x.beginPath();x.arc(px,py,4,0,Math.PI*2);x.fill();let vt=$('#valueTag'),dt=$('#dateTag');vt.textContent=s.q.n+' '+formatTick(raw)+' '+s.q.u;vt.style.display='block';vt.style.left=Math.min(p.W-110,px+7)+'px';vt.style.top=Math.max(4,py-15)+'px';dt.textContent=S.h+' point '+(S.cross.i+1);dt.style.display='block';dt.style.left=Math.max(2,Math.min(p.W-75,px-30))+'px';dt.style.top=(p.HH-p.B+3)+'px'}function openPicker(){let available=Object.entries(SER).filter(([id])=>!S.analysis.includes(id)),chosen=new Set();$('#modalRoot').innerHTML='<div class="modalWrap" id="shade"><div class="modal"><div class="modalHead"><h2>Add series</h2><button id="close">×</button></div><input class="search" id="search" placeholder="Search all series"><div class="pick" id="pick">'+available.map(([id,q])=>'<button data-pick="'+id+'"><span><i class="dot" style="background:'+q.c+'"></i>'+q.n+'</span><small>'+q.g+' · '+q.u+'</small></button>').join('')+'</div><div class="modalFoot"><button id="cancel">Cancel</button><button id="addSelected" disabled>Add selected</button></div></div></div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{let id=b.dataset.pick;chosen.has(id)?chosen.delete(id):chosen.add(id);b.classList.toggle('sel',chosen.has(id));$('#addSelected').disabled=!chosen.size;$('#addSelected').textContent=chosen.size?'Add '+chosen.size:'Add selected'});let close=()=>$('#modalRoot').innerHTML='';$('#close').onclick=close;$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target.id==='shade')close()};$('#addSelected').onclick=()=>{S.analysis.push(...chosen);close();S.info=false;S.active=S.analysis[0];render()};$('#search').oninput=e=>{let v=e.target.value.toLowerCase();document.querySelectorAll('[data-pick]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(v)?'flex':'none')}}function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.info=false;render()});document.querySelectorAll('[data-series]').forEach(b=>b.onclick=e=>{if(e.target.dataset.remove)return;let id=b.dataset.series;if(S.screen==='market'){S.index=id;S.screen='index'}else if(S.screen==='index'){S.analysis=[id];S.active=id;S.screen='analysis'}else S.active=id;S.info=false;render()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.stopPropagation();S.analysis=S.analysis.filter(id=>id!==x.dataset.remove);if(!S.analysis.includes(S.active))S.active=S.analysis[0];S.info=false;render()});$('#add')?.addEventListener('click',openPicker);$('#info')?.addEventListener('click',()=>{S.info=!S.info;render()});$('#back')?.addEventListener('click',()=>{if(S.screen==='analysis')S.screen='index';else{S.screen='market';S.index=null}S.info=false;render()});$('#chart')?.addEventListener('pointerdown',inspect)}$('#menu').onclick=()=>$('#rail').classList.toggle('closed');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});window.onresize=()=>{if(S.nav==='now')draw()};render();</script></body></html>
