,5,y+3);if(R>20)x.fillText(String(80-i*10),W-R+7,y+3)}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);if(R>20){x.moveTo(W-R,T);x.lineTo(W-R,HH-B)}x.stroke();let labs=S.h==='5D'?['Mon','Tue','Wed','Thu','Fri']:S.h==='1D'?['Open','10','12','14','Close']:S.h==='MTD'?['1','8','15','22','29']:S.h==='YTD'?['Jan','Mar','May','Jul','Aug']:S.h==='1YR'?['Sep','Dec','Mar','Jun','Aug']:S.h==='3YR'?['2024','2025','2026']:['2022','2023','2024','2025','2026'];labs.forEach((q,i)=>x.fillText(q,L+(W-L-R-22)*i/Math.max(1,labs.length-1),HH-7));ids().forEach((id,k)=>{let a=[],v=100;for(let i=0;i<42;i++){v+=Math.sin(i*.65+k+1)*.8+Math.cos(i*.29+k+1)*.38;a.push(v)}let mn=Math.min(...a),mx=Math.max(...a);x.strokeStyle=m(id)[3];x.lineWidth=2.2;x.beginPath();a.forEach((v,i)=>{let px=L+(W-L-R)*i/(a.length-1),py=T+(mx-v)/(mx-mn||1)*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}function openTip(id,el){let q=m(id),b=el.getBoundingClientRect(),left=Math.max(12,Math.min(innerWidth-322,b.left));$('#tipRoot').innerHTML='<div class="tip" id="tip" style="left:'+left+'px;top:'+Math.min(innerHeight-245,b.bottom+6)+'px"><div class="tipHead"><b>'+q[0]+'</b><button class="tipClose" id="tipClose">×</button></div><p><b>What is it?</b> '+q[4]+'</p><p><b>How is it used here?</b> '+q[5]+'</p><p><b>Why does it matter?</b> It provides evidence for the current market question.</p><a href="market-view-ux-gate3-p2.html?series='+id+'" target="_blank" rel="noopener">More →</a></div>';$('#tipClose').onclick=()=>$('#tipRoot').innerHTML=''}function picker(){let chosen=new Set(),avail=allSeries().filter(id=>!S.analysis.includes(id));$('#modalRoot').innerHTML='<div class="modalWrap" id="shade"><div class="modal"><div class="modalHead"><h2>Add to Analysis</h2><button id="close">×</button></div><input class="search" id="search" placeholder="Search all series"><div class="pick" id="pick">'+avail.map(id=>'<button data-pick="'+id+'"><span><i class="dot" style="background:'+m(id)[3]+'"></i>'+m(id)[0]+ reAdd').onclick=picker;$('#saveLib').onclick=()=>{localStorage.setItem('market-view-poc-library',JSON.stringify({screen:S.screen,index:S.index,analysis:S.analysis,h:S.h,savedAt:new Date().toISOString()}));$('#moreMenu').classList.remove('on');$('#saveLib').textContent='Saved to Library'};$('#download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='market-view-analysis.json';a.click()}}document.onclick=e=>{if(!e.target.closest('.moreWrap'))$('#moreMenu')?.classList.remove('on');if(!e.target.closest('.tip')&&!e.target.closest('.chip'))$('#tipRoot').innerHTML=''};$('#menu').onclick=()=>$('#rail').classList.toggle('closed');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});$('#send').onclick=()=>{if($('#ask').value.trim()){$('#ask').value='';}};window.onresize=()=>{if(S.nav==='now')draw()};let qs=new URLSearchParams(location.search),sid=qs.get('series');if(sid&&SER[sid]){S.nav='now';S.screen='analysis';S.index=Object.keys(IDX).find(k=>IDX[k].components.includes(sid))||'macro';S.analysis=[sid]}render();</script></body></html>
