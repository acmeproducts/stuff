<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Best OC Scraper</title>
<style>
:root{--bg:#0f1722;--panel:#15212e;--panel2:#1b2b3a;--line:#26384a;--txt:#dce7f0;--muted:#7e93a6;--accent:#22c55e;--accent2:#38bdf8;--warn:#f59e0b;--bad:#ef4444;--ok:#22c55e;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.4}
header{padding:18px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--bg),#13202c)}
header h1{font-size:20px;color:var(--accent)}
header p{color:var(--muted);font-size:13px;margin-top:4px}
nav{display:flex;gap:6px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
nav button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:9px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
nav button.active{background:var(--accent);color:#06251a;border-color:var(--accent)}
.tab{display:none;padding:18px 20px;max-width:1500px;margin:0 auto}
.tab.active{display:block}
h2{font-size:17px;color:var(--accent2);margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
input,textarea,select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:260px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn{background:var(--accent);color:#06251a;border:none;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;margin:6px 14px 6px 0}
.chk input{width:16px;height:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;margin-right:6px}
.pill.fire{background:#0e2a3a;color:var(--accent2)}
.pill.proxy{background:#13351f;color:var(--ok)}
.pill.jina{background:#33240e;color:var(--warn)}
.pill.fail{background:#3a1414;color:var(--bad)}
.src-item{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel2)}
.src-item .meta{flex:1}
.log{background:#0a1119;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:220px;overflow:auto;color:#9fb3c6}
.toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--accent);border-left:4px solid var(--accent);padding:12px 18px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.4);z-index:50}
</style>
</head>
<body>
<header>
  <h1>📍 OC Scraper – Best‑of‑All</h1>
  <p>Dark UI, tight regexes, Cloudflare‑worker fallback, SQLite/JSON storage.</p>
</header>
<nav>
  <button data-tab="settings" class="active">⚙️ Settings</button>
  <button data-tab="rules">📝 Rules</button>
  <button data-tab="scrape">⚡ Scrape</button>
  <button data-tab="data">📊 Data</button>
</nav>
<!-- SETTINGS -->
<section id="tab-settings" class="tab active">
  <h2>Configuration</h2>
  <div class="card">
    <label>Cloudflare Worker URL (optional)</label>
    <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev">
    <div class="note">If set, all fetches go through this worker (CORS‑proxy fallback).</div>
  </div>
  <div class="card">
    <label>Method order (primary → tertiary)</label>
    <select id="methodOrder">
      <option value="firecrawl,cors-proxy,jina">Firecrawl → CORS‑proxy → Jina</option>
      <option value="cors-proxy,jina,firecrawl">CORS‑proxy → Jina → Firecrawl</option>
      <option value="jina,cors-proxy,firecrawl">Jina → CORS‑proxy → Firecrawl</option>
    </select>
  </div>
  <div class="card">
    <label>Scrape mode</label>
    <div class="row">
      <label class="chk"><input type="radio" name="mode" value="fast" checked> Fast (list only)</label>
      <label class="chk"><input type="radio" name="mode" value="full"> Full (details)</label>
    </div>
  </div>
  <div class="card">
    <h2>Database</h2>
    <div class="row">
      <button class="btn sec" onclick="exportJSON()">Export JSON</button>
      <button class="btn sec" onclick="exportCSV()">Export CSV</button>
      <button class="btn sec" onclick="importJSON()">Import JSON</button>
      <button class="btn sec" onclick="clearData()" style="border-color:var(--bad);color:var(--bad)">Clear All</button>
    </div>
    <div class="note" id="dbMeta">Records: 0</div>
  </div>
</section>
<!-- RULES -->
<section id="tab-rules" class="tab">
  <h2>Scraping Rules (JSON)</h2>
  <div class="card"><textarea id="rulesJson"></textarea>
    <div class="row">
      <button class="btn" onclick="saveRules()">💾 Save</button>
      <button class="btn sec" onclick="copyRules()">📋 Copy</button>
      <button class="btn sec" onclick="resetRules()">↺ Defaults</button>
    </div>
  </div>
</section>
<!-- SCRAPE -->
<section id="tab-scrape" class="tab">
  <h2>Execute Scrape</h2>
  <div class="card" id="sourceList"></div>
  <div class="row">
    <button class="btn" id="scrapeBtn" onclick="startScrape()">🚀 Start Scraping</button>
    <button class="btn sec" id="cancelBtn" onclick="cancelScrape()" disabled>⛔ Cancel</button>
    <label class="chk"><input type="checkbox" id="verbose"> Verbose logs</label>
  </div>
  <div class="log" id="log"></div>
</section>
<!-- DATA -->
<section id="tab-data" class="tab">
  <h2>Results</h2>
  <div class="stats" id="statsBar"></div>
  <div class="row">
    <input type="text" id="search" placeholder="🔍 Search…" oninput="renderGrid()">
    <button class="btn sec" onclick="getMissingDetails()">🔍 Get Missing Details</button>
  </div>
  <div class="grid-wrap"><table id="grid"><thead><tr id="gridHead"></tr></thead><tbody id="gridBody"></tbody></table></div>
</section>
<div id="toastBox"></div>
<script>
/* ---------- State & storage ---------- */
const LS={rules:'oc_rules',records:'oc_records',methods:'oc_methods'};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
/* ---------- Default rules ---------- */
const DEFAULT_RULES={
  defaultMethodOrder:['firecrawl','cors-proxy','jina'],
  corsProxies:['https://api.allorigins.win/raw?url=','https://corsproxy.io/?url=','https://api.codetabs.com/v1/proxy/?quest='],
  sources:[
    {id:'cakdolls',name:'CakDolls',domain:'cakdolls.com',listingUrl:'https://cakdolls.com/oc/',listing:{linkRegex:'https://cakdolls.com/escort/[^"\\s]+',nameFrom:'altOrText'},detail:{ageRegex:'Age[:\\s]+(\\d+)',heightRegex:"(\\d+)'(\\d+)\"",weightRegex:'(\\d+)\\s*lbs',statsLineRegex:'Stats[:\\s]*([^<]+)'}},
    {id:'get9irl',name:'Get9IRL',domain:'get9irl.com',listingUrl:'https://get9irl.com/index.php?route=product/category&path=2_11',listing:{linkRegex:'https://get9irl.com/[^"\\s]+',nameFrom:'text'},detail:{ogDescRegex:'<meta property="og:description" content="([^\"]+)"',heightRegex:"(\\d+)'(\\d+)\"",weightRegex:'(\\d+)\\s*lbs'}},
    {id:'topangels',name:'TopAngels',domain:'topangels.ch',listingUrl:'https://topangels.ch/incall-escorts/orange-county/',listing:{linkRegex:'https://topangels.ch/topangel/[^"\\s]+',nameFrom:'heading'},detail:{statsLineRegex:'Stats[:\\s]*([^<]+)'}}
  ]
};
const state={records:load(LS.records,[]),rules:load(LS.rules,null),methods:load(LS.methods,{}});
if(!state.rules||!Array.isArray(state.rules.sources)) state.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));
/* ---------- Worker fetch ---------- */
let _worker=null,_seq=0,_waiters={};
function getWorker(){if(_worker!==null) return _worker;const code=`self.onmessage=async e=>{const{id,url,headers}=e.data;try{const r=await fetch(url,{headers});const t=await r.text();self.postMessage({id,ok:true,text:t});}catch(err){self.postMessage({id,ok:false,error:String(err)});}};`;const blob=new Blob([code],{type:'application/javascript'});_worker=new Worker(URL.createObjectURL(blob));_worker.onmessage=e=>{const d=e.data,w=_waiters[d.id];if(w){delete _waiters[d.id];d.ok?w.resolve(d.text):w.reject(new Error(d.error));}};return _worker;}
function workerFetch(url,headers){const w=getWorker();if(!w) return fetch(url,{headers}).then(r=>r.text());return new Promise((res,rej)=>{const id=++_seq;_waiters[id]={resolve:res,reject:rej};w.postMessage({id,url,headers});setTimeout(()=>{if(_waiters[id]){delete _waiters[id];rej(new Error('worker timeout'))}},30000);});}
/* ---------- Methods ---------- */
async function methodFirecrawl(url){const headers={'Content-Type':'application/json'};const body=JSON.stringify({url,pageOptions:{includeHtml:true,includeMarkdown:true}});const r=await fetch('https://api.firecrawl.dev/v1/scrape',{method:'POST',headers,body});if(!r.ok) throw new Error('Firecrawl HTTP '+r.status);const j=await r.json();if(j.error) throw new Error(j.error);const d=j.data||{};return {html:d.html||'',markdown:d.markdown||'',text:d.markdown||d.html||''};}
async function methodCorsProxy(url,rules){const proxies=rules&&Array.isArray(rules.corsProxies)?rules.corsProxies:DEFAULT_RULES.corsProxies;for(const base of proxies){try{const txt=await workerFetch(base+encodeURIComponent(url));if(txt && txt.length>500) return {html:txt,markdown:'',text:txt}}catch(e){}}throw new Error('All CORS proxies failed');}
async function methodJina(url){const txt=await workerFetch('https://r.jina.ai/'+url);if(!txt||txt.length<200) throw new Error('Jina empty');return {html:'',markdown:txt,text:txt};}
const METHODS={firecrawl:{fn:methodFirecrawl,label:'Firecrawl',cls:'fire'},'cors-proxy':{fn:methodCorsProxy,label:'CORS‑proxy',cls:'proxy'},jina:{fn:methodJina,label:'Jina',cls:'jina'}};
async function fetchAny(url,order,rules){let lastErr;for(const m of order){try{log(' ↳ trying '+METHODS[m].label);const res=await METHODS[m].fn(url,rules);if(res && (res.html||res.markdown)) return {res,method:m};lastErr=new Error('empty result');}catch(e){lastErr=e;log(' ✗ '+METHODS[m].label+' failed: '+e.message);}}throw lastErr||new Error('no method succeeded');}
/* ---------- Parsing ---------- */
function extractListings(content,src){if(!src||!src.listing||!src.listing.linkRegex) return [];const re=new RegExp(src.listing.linkRegex,'i');const out=[];const seen=new Set();function push(name,url){url=url.trim();if(!re.test(url)||seen.has(url))return;seen.add(url);out.push({name:(name||'').replace(/\s+/g,' ').trim(),profile_url:url});}
if(content.html){const doc=new DOMParser().parseFromString(content.html,'text/html');doc.querySelectorAll('a[href]').forEach(a=>{const href=a.getAttribute('href');if(!re.test(href))return;let name='';if(src.listing.nameFrom==='altOrText'){const img=a.querySelector('img');name=(img&&img.alt)||a.textContent}else if(src.listing.nameFrom==='heading'){const h=a.querySelector('h1,h2,h3,h4')||a.closest('h1,h2,h3,h4');name=h?h.textContent:a.textContent}else name=a.textContent;push(name,href);});}
if(out.length===0 && content.markdown){const mdRe=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g;let m;while((m=mdRe.exec(content.markdown))) push(m[1],m[2]);}
return out;}
function parseDetail(content,src){const txt=(content.html||content.markdown||'').replace(/\s+/g,' ');const d=src.detail||{};const res={age:null,height:null,weight:null,terms:'',services:''};if(d.ogDescRegex){const m=txt.match(new RegExp(d.ogDescRegex,'i'));if(m)res.terms=m[1].trim();}if(d.statsLineRegex){const m=txt.match(new RegExp(d.statsLineRegex,'i'));if(m)res.terms=(res.terms+' '+m[1]).trim();}if(d.ageRegex){const m=txt.match(new RegExp(d.ageRegex,'i'));if(m)res.age=parseInt(m[1],10);}if(d.heightRegex){const m=txt.match(new RegExp(d.heightRegex,'i'));if(m)res.height=m[1]+"'"+m[2]+"\"";}if(d.weightRegex){const m=txt.match(new RegExp(d.weightRegex,'i'));if(m)res.weight=m[1]+" lbs";}return res;}
/* ---------- DB ---------- */
function upsert(rec){const today=new Date().toISOString().slice(0,10);const ex=state.records.find(r=>r.profile_url===rec.profile_url);if(ex){ex.name=rec.name||ex.name;if(rec.age!=null)ex.age=rec.age;ex.height=rec.height||ex.height;ex.weight=rec.weight||ex.weight;ex.terms=rec.terms||ex.terms;ex.services=rec.services||ex.services;ex.location=rec.location||ex.location;ex.source=rec.source||ex.source;ex.date_last_seen=today;}else{rec.date_first_seen=today;rec.date_last_seen=today;state.records.push(rec);}}
/* ---------- UI ---------- */
function log(m){const l=document.getElementById('log');l.textContent+=m+'\n';l.scrollTop=l.scrollHeight;}
function toast(m,type){const t=document.createElement('div');t.className='toast';t.textContent=m;t.style.borderLeftColor=type==='bad'?'var(--bad)':'var(--accent)';document.getElementById('toastBox').appendChild(t);setTimeout(()=>t.remove(),3500);}
function renderSourceList(){const box=document.getElementById('sourceList');box.innerHTML='';DEFAULT_RULES.sources.forEach(s=>{const mem=state.methods[s.id];const div=document.createElement('div');div.className='src-item';div.innerHTML=`<div class="meta"><b>${s.name}</b><small>${s.listingUrl}</small>${mem?`<span class="pill ${METHODS[mem].cls}">last: ${METHODS[mem].label}</span>`:'<span class="pill fail">no method yet</span>'}</div><label class="chk"><input type="checkbox" id="en_${s.id}" ${mem?'checked':''}> enable</label>`;box.appendChild(div);});}
function renderGrid(){const head=document.getElementById('gridHead');head.innerHTML='';const COLS=[{k:'num',l:'#'},{k:'date_first_seen',l:'First'},{k:'date_last_seen',l:'Updated'},{k:'name',l:'Name'},{k:'age',l:'Age'},{k:'height',l:'Height'},{k:'weight',l:'Weight'},{k:'terms',l:'Terms'},{k:'location',l:'Location'},{k:'source',l:'Source'}];COLS.forEach(c=>{const th=document.createElement('th');th.textContent=c.l;th.onclick=()=>{state.sort={col:c.k,dir:state.sort?.col===c.k?(state.sort.dir==='asc'?'desc':'asc'):'asc'};renderGrid();};head.appendChild(th);});const linkTh=document.createElement('th');linkTh.textContent='Profile';head.appendChild(linkTh);
const q=document.getElementById('search').value.toLowerCase();let rows=state.records;if(q) rows=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));rows.sort((a,b)=>{let x=a[state.sort.col]||'',y=b[state.sort.col]||'';if(typeof x==='string')x=x.toLowerCase();if(typeof y==='string')y=y.toLowerCase();return (x<y?-1:x>y?1:0)*(state.sort.dir==='asc'?1:-1);});
const body=document.getElementById('gridBody');body.innerHTML='';if(rows.length===0){body.innerHTML='<tr><td colspan="11" class="empty">No data yet.</td></tr>';return;}rows.forEach((r,i)=>{const tr=document.createElement('tr');const cells=[i+1,r.date_first_seen||'',r.date_last_seen||'',r.name||'',r.age||'',r.height||'',r.weight||'',(r.terms||'').slice(0,60),r.location||'',r.source||''];cells.forEach((v,idx)=>{const td=document.createElement('td');if([4,5,6].includes(idx)&&!v)td.className='missing';td.textContent=v;tr.appendChild(td);});const td=document.createElement('td');td.innerHTML=`<a href="${r.profile_url}" target="_blank">🔗</a>`;tr.appendChild(td);body.appendChild(tr);});document.getElementById('dbMeta').textContent='Records: '+state.records.length;}
function startScrape(){ensureValidRules();const order=document.getElementById('methodOrder').value.split(',').filter(Boolean);const mode=document.querySelector('input[name=mode]:checked').value;const enabled=DEFAULT_RULES.sources.filter(s=>document.getElementById('en_'+s.id).checked);if(enabled.length===0){toast('Select a source','bad');return;}_cancel=false;document.getElementById('scrapeBtn').disabled=true;document.getElementById('cancelBtn').disabled=false;clearLog();log('Starting scrape – mode: '+mode);
(async()=>{let newC=0,updC=0;for(const src of enabled){if(_cancel)break;let used=null,content=null;for(const m of order){try{const r=await fetchAny(src.listingUrl,[m],state.rules);const listings=extractListings(r.res,src);if(listings.length){used=m;content=r.res;break;}log(' (0 listings via '+METHODS[m].label+')');}catch(e){}if(_cancel)break;}if(!used){log('✗ '+src.name+' failed');continue;}state.methods[src.id]=used;save(LS.methods,state.methods);log('✓ '+src.name+' via '+METHODS[used].label);const listings=extractListings(content,src);log(' found '+listings.length+' profiles');for(const item of listings){if(_cancel)break;const rec={name:item.name,profile_url:item.profile_url,source:src.domain,location:'Orange County',terms:'',services:''};if(mode==='full'){try{const dr=await fetchAny(item.profile_url,[used],state.rules);Object.assign(rec,parseDetail(dr.res,src));if(rec.location==='Orange County'&&rec.terms&&/(Irvine|Tustin|Costa Mesa|Newport|Anaheim|Los Angeles|San Diego)/i.test(rec.terms))rec.location=rec.terms.match(/(Irvine|Tustin|Costa Mesa|Newport|Anaheim|Los Angeles|San Diego)/i)[0]+', Orange County';}catch(e){}}const before=state.records.length;upsert(rec);if(state.records.length>before)newC++;else updC++;}
save(LS.records,state.records);}document.getElementById('scrapeBtn').disabled=false;document.getElementById('cancelBtn').disabled=true;renderGrid();toast('Scrape complete – '+newC+' new, '+updC+' updated','ok');})();}
let _cancel=false;function cancelScrape(){_cancel=true;log('⛔ Cancel requested');}
function clearLog(){document.getElementById('log').textContent='';}
function ensureValidRules(){if(!state.rules||!Array.isArray(state.rules.sources)){state.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));save(LS.rules,state.rules);}}
function saveRules(){try{state.rules=JSON.parse(document.getElementById('rulesJson').value);ensureValidRules();save(LS.rules,state.rules);toast('Rules saved','ok');renderSourceList();}catch(e){toast('Invalid JSON: '+e.message,'bad');}}
function resetRules(){state.rules=JSON.parse(JSON.stringify(DEFAULT_RULES));save(LS.rules,state.rules);document.getElementById('rulesJson').value=JSON.stringify(DEFAULT_RULES,null,2);toast('Defaults restored','ok');renderSourceList();}
function copyRules(){navigator.clipboard.writeText(document.getElementById('rulesJson').value);toast('Copied','ok');}
function exportJSON(){const blob=new Blob([JSON.stringify(state.records,null,2)],{type:'application/json'});download(blob,'oc-data.json');}
function exportCSV(){const cols=['source','name','age','height','weight','terms','location','profile_url','date_first_seen','date_last_seen'];let csv=cols.join(',')+'\n';state.records.forEach(r=>{csv+=cols.map(c=>`"${(r[c]||'').toString().replace(/"/g,'""')}`).join(',')+'\n';});const blob=new Blob([csv],{type:'text/csv'});download(blob,'oc-data.csv');}
function importJSON(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const fr=new FileReader();fr.onload=()=>{try{const arr=JSON.parse(fr.result);if(Array.isArray(arr)){arr.forEach(r=>upsert(r));save(LS.records,state.records);renderGrid();toast('Imported '+arr.length+' records','ok');}}catch(e){toast('Invalid JSON','bad');}};fr.readAsText(inp.files[0]);};inp.click();}
function clearData(){if(confirm('Clear all data?')){state.records=[];save(LS.records,[]);renderGrid();toast('Cleared','ok');}}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function getMissingDetails(){const missing=state.records.filter(r=>!r.age&&!r.height&&!r.weight);if(!missing.length){toast('No missing details','ok');return;}ensureValidRules();toast('Fetching missing for '+missing.length,'ok');(async()=>{for(const rec of missing){const src=DEFAULT_RULES.sources.find(s=>s.domain===rec.source);if(!src)continue;const order=state.methods[src.id]?[state.methods[src.id]]:state.rules.defaultMethodOrder;try{const r=await fetchAny(rec.profile_url,order,state.rules);Object.assign(rec,parseDetail(r.res,src));save(LS.records,state.records);}catch(e){}}renderGrid();toast('Missing details updated','ok');})();}
/* ---------- Init ---------- */
document.addEventListener('DOMContentLoaded',()=>{renderSourceList();renderGrid();document.getElementById('rulesJson').value=JSON.stringify(state.rules||DEFAULT_RULES,null,2);});
/* ---------- Tab navigation ---------- */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+b.dataset.tab).classList.add('active');});
</script>
</body>
</html>
