<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chat Admin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#fff;min-height:100%}

header{padding:16px 18px 10px;border-bottom:1px solid rgba(226,232,240,.9);flex:0 0 auto}
header h1{margin:0;font-size:19px;color:#0f172a}
header p{margin:2px 0 0;font-size:12px;color:#94a3b8}

.tabs{display:flex;border-bottom:1px solid rgba(226,232,240,.9);flex:0 0 auto}
.tab{flex:1;padding:13px 4px;font-size:14px;font-weight:700;color:#94a3b8;background:none;border:none;border-bottom:2px solid transparent}
.tab.on{color:#3b82f6;border-color:#3b82f6}

#tab-rooms{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---- portal: single-column full-width list, test.html's card-list pattern ---- */
.list-toolbar{padding:12px 16px 0;flex:0 0 auto}
.newbtn{width:100%;padding:13px;border-radius:12px;border:1.5px dashed rgba(148,163,184,.6);
  background:#f8fafc;color:#3b82f6;font-weight:700;font-size:14px}
.room-list{flex:1;overflow-y:auto;padding:10px 16px 16px}

.room-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(226,232,240,.9);
  border-radius:14px;margin-bottom:8px;background:#fff}
.room-row.sel{border-color:#3b82f6;background:#eff6ff;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.room-pair{font-size:24px;line-height:1;flex:0 0 auto}
.room-info{flex:1;min-width:0}
.room-name{font-size:14px;font-weight:700;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-sub{font-size:11px;color:#94a3b8;margin-top:1px}
.room-launch{flex:0 0 auto;padding:9px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.4);
  background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;white-space:nowrap}
.room-edit{flex:0 0 auto;width:34px;height:34px;border-radius:999px;border:1px solid rgba(226,232,240,.95);
  background:#f8fafc;color:#64748b;font-size:14px}

.empty{text-align:center;padding:28px 16px;color:#94a3b8;font-size:13px}

/* ---- trash: own section at the bottom of the list, collapsed by default,
   NEVER auto-expanded, never a container that a live room can render inside ---- */
.trash-section{margin-top:14px;border-top:1px solid rgba(226,232,240,.9);padding-top:10px}
.trash-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;color:#94a3b8;
  font-size:12px;font-weight:700;padding:4px 0;width:100%;text-align:left}
.trash-toggle .chev{display:inline-block;transition:transform .15s;font-size:10px}
.trash-toggle .chev.open{transform:rotate(90deg)}
.trash-body{display:none;margin-top:8px}
.trash-body.open{display:block}
.trash-row{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid rgba(226,232,240,.7);
  border-radius:10px;margin-bottom:6px;background:#fafafa}
.trash-row .room-name{font-size:13px}
.smallbtn{flex:0 0 auto;padding:7px 11px;border-radius:8px;border:1px solid rgba(226,232,240,.95);
  background:#fff;color:#475569;font-size:11px;font-weight:700}
.smallbtn.danger{color:#ef4444;border-color:rgba(239,68,68,.3)}

/* ---- edit sheet: a real overlay, only exists once a room is selected ---- */
#edit-sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(15,23,42,.4);align-items:flex-end}
#edit-sheet.show{display:flex}
.edit-panel{width:100%;max-width:520px;margin:0 auto;max-height:88vh;background:#fff;
  border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.edit-bar{display:flex;gap:8px;padding:14px 16px;border-bottom:1px solid rgba(226,232,240,.9);flex:0 0 auto}
.ebtn{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid rgba(203,213,225,.9)}
.ebtn.cancel{background:#f1f5f9;color:#475569}
.ebtn.save{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff;border-color:transparent}
.edit-body{flex:1;overflow-y:auto;padding:16px}

.cfglab{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.cfglab:first-child{margin-top:0}
.cfgrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cfgrow label{flex:0 0 70px;font-size:13px;color:#475569}
.cfgrow select,.cfgrow input[type=text],.cfgrow input[type=password],.cfgrow input[type=number]{
  flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(226,232,240,.95);border-radius:10px;font-size:14px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:4px}
.swatch{height:34px;border-radius:8px;border:2px solid transparent;padding:0}
.swatch.on{border-color:#3b82f6}
.launch-full{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:15px;
  background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff}

/* Track A: per-room dictionary status. Non-blocking to Save/Launch — a prompt,
   not a gate. Chinese/Korean/Japanese are excluded (composed-script input is
   Track B, or already hand-built for ko/ja) — those show no row at all. */
.dictrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(226,232,240,.9);
  border-radius:10px;margin-bottom:8px;background:#fafafa}
.dictrow.ok{border-color:rgba(16,185,129,.35);background:#f0fdf4}
.dictrow.missing{border-color:rgba(245,158,11,.4);background:#fffbeb}
.dictrow .dlbl{flex:1;font-size:12px;color:#475569}
.dictrow .dstate{font-size:11px;font-weight:700}
.dictrow.ok .dstate{color:#10b981}
.dictrow.missing .dstate{color:#b45309}
.dictbtn{flex:0 0 auto;padding:7px 12px;border-radius:8px;border:1px solid rgba(180,83,9,.35);
  background:#fff;color:#b45309;font-size:11px;font-weight:700}

#tab-global{padding:16px}
.cfgbtn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:15px;margin-top:8px;
  background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);z-index:95;
  background:rgba(15,23,42,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header><h1>Chat Admin</h1><p>Create and launch tabletop conversations</p></header>
<div class="tabs">
  <button type="button" class="tab on" data-tab="rooms">Rooms</button>
  <button type="button" class="tab" data-tab="global">Global</button>
</div>

<div id="tab-rooms">
  <div class="list-toolbar"><button type="button" class="newbtn" id="conv-new">＋ New room</button></div>
  <div class="room-list" id="room-list"></div>
</div>

<div id="tab-global" style="display:none">
  <div class="cfglab">Calling &amp; Sync Keys</div>
  <div class="cfgrow"><label>Deepgram</label>
    <input type="text" id="cfg-dg" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" placeholder="Paste key…"></div>
  <div class="cfgrow"><label>GitHub PAT</label>
    <input type="text" id="cfg-pat" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" placeholder="Not active yet"></div>
  <button type="button" class="cfgbtn" id="cfg-keys-save">Save keys</button>

  <div class="cfglab">Keyboard haptics</div>
  <div class="cfgrow"><label>Strength</label>
    <select id="cfg-haptic"><option value="off">Off</option><option value="light">Light</option><option value="medium">Medium</option><option value="strong">Strong</option></select></div>
  <button type="button" class="cfgbtn" id="cfg-haptic-test" style="background:#f1f5f9;color:#475569;border:1px solid rgba(226,232,240,.95)">Test haptic</button>
  <div id="haptic-result" style="font-size:12px;color:#64748b;margin-top:6px"></div>
</div>

<!-- ---- edit sheet: only appears on demand, never sits open under the list ---- -->
<div id="edit-sheet">
  <div class="edit-panel">
    <div class="edit-bar">
      <button type="button" class="ebtn cancel" id="cfg-cancel">Cancel</button>
      <button type="button" class="ebtn save" id="cfg-save">Save</button>
    </div>
    <div class="edit-body">
      <div class="cfglab">Name</div>
      <div class="cfgrow"><input type="text" id="cfg-thread-name" placeholder="🏳️🏳️" maxlength="30"></div>
      <div class="cfglab">Languages</div>
      <div class="cfgrow"><label>South</label><select id="cfg-south-lang"></select></div>
      <div class="cfgrow"><label>North</label><select id="cfg-north-lang"></select></div>
      <div class="cfglab">South bubble colour</div>
      <div class="swatches" id="sw-south"></div>
      <div class="cfglab">North bubble colour</div>
      <div class="swatches" id="sw-north"></div>
      <div class="cfglab">Font colour</div>
      <div class="swatches" id="sw-font"></div>
      <div class="cfglab">Font size</div>
      <div class="cfgrow"><label>Size (px)</label><input type="number" id="cfg-font-size" min="12" max="24" value="15"></div>
      <div class="cfglab" id="dict-lab" style="display:none">Dictionary (autocomplete &amp; swype)</div>
      <div id="dict-status"></div>
      <button type="button" class="launch-full" id="launch-btn">Launch this room →</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function chatAdmin(){
    'use strict';
    /* ================= TRACK A: per-room dictionary status =================
       Honest scope: the browser has no API to ask "is this OS-level dictionary
       installed." What CAN be checked truthfully is whether OUR OWN downloadable
       word-list asset for a language exists in this browser's storage — that's
       the thing chat.html's autocomplete/swype actually reads, so it's the thing
       worth checking. "Installed on the device" (an OS keyboard concept) is a
       different, unverifiable claim and this deliberately does not make it.
       Track-A-eligible = has an entry in DICT_SOURCES below. zh/ko/ja are
       excluded here on purpose (ko/ja already work via the hand-built IME;
       zh is Track B, not this build). */
    var DICT_SOURCES={
        en:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/en.json',
        th:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/th.json',
        es:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/es.json',
        fr:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/fr.json',
        de:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/de.json',
        it:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/it.json',
        pt:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/pt.json',
        vi:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/vi.json',
        id:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/id.json',
        ms:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/ms.json',
        fil:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/fil.json',
        nl:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/nl.json',
        sv:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/sv.json',
        pl:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/pl.json',
        tr:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/tr.json',
        ru:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/ru.json',
        ar:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/ar.json',
        hi:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/hi.json',
        ko:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/ko.json',
        ja:'https://raw.githubusercontent.com/acmeproducts/stuff/main/dict/ja.json'
    };
    function dictKey(lang){return 'duck_dict_'+lang}
    function dictInstalled(lang){try{return !!localStorage.getItem(dictKey(lang))}catch(e){return false}}
    function downloadDict(lang,btn){
        if(!DICT_SOURCES[lang])return;
        btn.disabled=true;btn.textContent='Downloading…';
        fetch(DICT_SOURCES[lang]).then(function(r){
            if(!r.ok)throw new Error('HTTP '+r.status);
            return r.text();
        }).then(function(text){
            try{localStorage.setItem(dictKey(lang),text)}catch(e){throw e}
            renderDictStatus();
            toastMsg('Dictionary downloaded');
        }).catch(function(e){
            btn.disabled=false;btn.textContent='Retry';
            toastMsg('Download failed — check connection');
        });
    }
    function renderDictStatus(){
        var lab=$('dict-lab'), host=$('dict-status');
        if(!editBuf){lab.style.display='none';host.innerHTML='';return}
        var langs=[editBuf.southLang,editBuf.northLang].filter(function(l,i,a){return a.indexOf(l)===i});
        var eligible=langs.filter(function(l){return !!DICT_SOURCES[l]});
        if(!eligible.length){lab.style.display='none';host.innerHTML='';return}
        lab.style.display='';
        host.innerHTML='';
        eligible.forEach(function(lang){
            var row=document.createElement('div');
            row.className='dictrow missing';
            var existingTs='';try{existingTs=localStorage.getItem('duck_dict_ts_'+lang)||''}catch(e){}
            row.innerHTML='<span class="dlbl">'+(LANG_FLAGS[lang]||'')+' '+LANG_NAMES[lang]+'</span>'+
                '<span class="dstate" id="dstate-'+lang+'">'+(existingTs?existingTs+' → ':'')+'Updating…</span>';
            host.appendChild(row);
            /* Always fetch fresh — no ready/cache check */
            try{localStorage.removeItem('duck_dict_'+lang)}catch(e){}
            fetch(DICT_SOURCES[lang]).then(function(r){
                if(!r.ok)throw new Error('HTTP '+r.status);
                return r.text();
            }).then(function(text){
                try{localStorage.setItem('duck_dict_'+lang,text)}catch(e){throw e}
                var ts=new Date().toLocaleString();
                var count=0;try{count=JSON.parse(text).length}catch(e){}
                try{localStorage.setItem('duck_dict_ts_'+lang,ts+' · '+count+' words')}catch(e){}
                row.className='dictrow ok';
                var s=document.getElementById('dstate-'+lang);
                if(s)s.textContent=count+' words · '+ts;
                toastMsg((LANG_NAMES[lang]||lang)+' ready — '+count+' words');
            }).catch(function(e){
                row.className='dictrow missing';
                var s=document.getElementById('dstate-'+lang);
                if(s)s.textContent='Failed — check connection';
            });
        });
    }

    var LANG_NAMES={en:'English',th:'Thai',es:'Spanish',ja:'Japanese',ko:'Korean',zh:'Chinese (Simplified)',
      ar:'Arabic',hi:'Hindi',ru:'Russian',fr:'French',de:'German',it:'Italian',pt:'Portuguese',
      vi:'Vietnamese',id:'Indonesian',ms:'Malay',fil:'Filipino',nl:'Dutch',sv:'Swedish',pl:'Polish',tr:'Turkish'};
    var LANG_FLAGS={en:'🇺🇸',th:'🇹🇭',es:'🇪🇸',ja:'🇯🇵',ko:'🇰🇷',zh:'🇨🇳',ar:'🇸🇦',hi:'🇮🇳',ru:'🇷🇺',
      fr:'🇫🇷',de:'🇩🇪',it:'🇮🇹',pt:'🇧🇷',vi:'🇻🇳',id:'🇮🇩',ms:'🇲🇾',fil:'🇵🇭',nl:'🇳🇱',sv:'🇸🇪',pl:'🇵🇱',tr:'🇹🇷'};
    var BG_SWATCHES=['#eff6ff','#f0fdf4','#fef3c7','#fee2e2','#f3e8ff','#ffffff'];
    var FONT_SWATCHES=['#0f172a','#1e293b','#334155','#7f1d1d','#1e3a8a','#14532d'];
    var DEFAULT_S='#eff6ff', DEFAULT_N='#f0fdf4', DEFAULT_FONT='#0f172a';

    function $(id){return document.getElementById(id)}
    function toastMsg(m){var e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');
        clearTimeout(toastMsg._t);toastMsg._t=setTimeout(function(){e.classList.remove('show')},2000)}

    var IDX_KEY='duck_rooms_index';
    var rooms=[];
    function loadRooms(){try{rooms=JSON.parse(localStorage.getItem(IDX_KEY)||'[]')}catch(e){rooms=[]}if(!Array.isArray(rooms))rooms=[]}
    function saveRooms(){try{localStorage.setItem(IDX_KEY,JSON.stringify(rooms))}catch(e){}}
    function newId(){
        var a=new Uint8Array(16);(crypto||window.crypto).getRandomValues(a);
        return Array.from(a,function(b){return b.toString(36)}).join('').slice(0,22);
    }
    function activeRooms(){return rooms.filter(function(r){return !r.trashedAt})}
    function trashedRooms(){return rooms.filter(function(r){return r.trashedAt})}
    function roomLabel(r){return r.label||((LANG_FLAGS[r.southLang]||'')+' + '+(LANG_FLAGS[r.northLang]||''))}
    function roomSub(r){return LANG_NAMES[r.southLang]+' ↔ '+LANG_NAMES[r.northLang]}

    var selected=null, editBuf=null;
    var trashOpen=false;

    function loadEditBuf(){
        var r=rooms.filter(function(x){return x.id===selected})[0];
        editBuf=r?{southLang:r.southLang,northLang:r.northLang,southBg:r.southBg,northBg:r.northBg,
                    fontColor:r.fontColor,fontSize:r.fontSize,label:r.label}
                 :{southLang:'en',northLang:'th',southBg:DEFAULT_S,northBg:DEFAULT_N,
                    fontColor:DEFAULT_FONT,fontSize:15,label:null};
        paintEditBuf();
    }
    function paintEditBuf(){
        var ll=$('cfg-south-lang'), nl=$('cfg-north-lang');
        if(!ll.options.length){[ll,nl].forEach(function(sel){
            Object.keys(LANG_NAMES).forEach(function(c){var o=document.createElement('option');o.value=c;
                o.textContent=(LANG_FLAGS[c]||'')+'  '+LANG_NAMES[c];sel.appendChild(o)});
        })}
        ll.value=editBuf.southLang;nl.value=editBuf.northLang;
        var nameInp=$('cfg-thread-name');
        nameInp.value=editBuf.label||'';
        nameInp.placeholder=(LANG_FLAGS[editBuf.southLang]||'')+' + '+(LANG_FLAGS[editBuf.northLang]||'');
        $('cfg-font-size').value=editBuf.fontSize||15;
        buildSwatches();
        renderDictStatus();
    }
    function buildSwatches(){
        [['sw-south','southBg',BG_SWATCHES],['sw-north','northBg',BG_SWATCHES],['sw-font','fontColor',FONT_SWATCHES]]
        .forEach(function(p){
            var host=$(p[0]);host.innerHTML='';
            p[2].forEach(function(c){
                var b=document.createElement('button');b.type='button';
                b.className='swatch'+(editBuf[p[1]]===c?' on':'');b.style.background=c;
                b.addEventListener('click',function(){editBuf[p[1]]=c;buildSwatches()});
                host.appendChild(b);
            });
        });
    }
    function commitEditBuf(){
        var r=rooms.filter(function(x){return x.id===selected})[0];if(!r)return;
        r.southLang=editBuf.southLang;r.northLang=editBuf.northLang;
        r.southBg=editBuf.southBg;r.northBg=editBuf.northBg;
        r.fontColor=editBuf.fontColor;r.fontSize=parseInt($('cfg-font-size').value,10)||15;
        r.label=editBuf.label||null;
        saveRooms();
    }

    function openEditSheet(id){
        selected=id;loadEditBuf();
        $('edit-sheet').classList.add('show');
    }
    function closeEditSheet(){$('edit-sheet').classList.remove('show')}

    /* ---- portal render: full-width rows, trash is its own collapsed section,
       never a container a live room's card can end up inside ---- */
    function renderRoomList(){
        var host=$('room-list');host.innerHTML='';
        var active=activeRooms().slice().reverse();

        if(!active.length){
            host.innerHTML='<div class="empty">No rooms yet — tap New room above.</div>';
        }else{
            active.forEach(function(r){
                var row=document.createElement('div');row.className='room-row';
                var pair=(LANG_FLAGS[r.southLang]||'')+(LANG_FLAGS[r.northLang]||'');
                row.innerHTML=
                    '<div class="room-pair">'+pair+'</div>'+
                    '<div class="room-info"><div class="room-name">'+String(roomLabel(r)).replace(/[&<>]/g,'')+'</div>'+
                    '<div class="room-sub">'+roomSub(r)+'</div></div>'+
                    '<button type="button" class="room-edit" title="Edit">⚙</button>'+
                    '<button type="button" class="room-del smallbtn danger" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>'+
                    '<button type="button" class="room-launch">Launch →</button>';
                row.querySelector('.room-edit').addEventListener('click',function(){openEditSheet(r.id)});
                row.querySelector('.room-del').addEventListener('click',function(){
                    if(!confirm('Move this room to trash?'))return;
                    r.trashedAt=Date.now();saveRooms();renderRoomList();toastMsg('Moved to trash');
                });
                row.querySelector('.room-launch').addEventListener('click',function(){launchRoom(r.id)});
                host.appendChild(row);
            });
        }

        // trash: appended AFTER the list, own section, collapsed unless the user opened it
        var trashed=trashedRooms();
        var sec=document.createElement('div');sec.className='trash-section';
        sec.innerHTML='<button type="button" class="trash-toggle" id="trash-toggle">'+
            '<span class="chev'+(trashOpen?' open':'')+'">▸</span> Trash ('+trashed.length+')</button>'+
            '<div class="trash-body'+(trashOpen?' open':'')+'" id="trash-body"></div>';
        host.appendChild(sec);
        $('trash-toggle').addEventListener('click',function(){trashOpen=!trashOpen;renderRoomList()});

        var body=$('trash-body');
        if(!trashed.length){
            body.innerHTML='<div class="empty" style="padding:12px">Trash is empty</div>';
        }else{
            trashed.forEach(function(r){
                var row=document.createElement('div');row.className='trash-row';
                row.innerHTML='<div class="room-info"><div class="room-name">'+
                    String(roomLabel(r)).replace(/[&<>]/g,'')+'</div></div>'+
                    '<button type="button" class="smallbtn">Restore</button>'+
                    '<button type="button" class="smallbtn danger">Delete</button>';
                row.querySelectorAll('.smallbtn')[0].addEventListener('click',function(){
                    delete r.trashedAt;saveRooms();renderRoomList();toastMsg('Restored');
                });
                row.querySelectorAll('.smallbtn')[1].addEventListener('click',function(){
                    if(!confirm('Delete this room permanently? Its conversation history is deleted too.'))return;
                    try{localStorage.removeItem('duck_room_'+r.id)}catch(e){}
                    rooms=rooms.filter(function(x){return x.id!==r.id});saveRooms();renderRoomList();
                });
                body.appendChild(row);
            });
        }
    }

    function launchRoom(id){location.href='chat.html?room='+encodeURIComponent(id)}

    function boot(){
        loadRooms();renderRoomList();

        document.querySelectorAll('.tab').forEach(function(t){
            t.addEventListener('click',function(){
                document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});
                $('tab-rooms').style.display=t.dataset.tab==='rooms'?'':'none';
                $('tab-global').style.display=t.dataset.tab==='global'?'':'none';
            });
        });

        var nameInp=$('cfg-thread-name');
        function commitName(){editBuf.label=nameInp.value.trim()||null}
        nameInp.addEventListener('blur',commitName);
        nameInp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commitName();nameInp.blur()}});
        $('cfg-south-lang').addEventListener('change',function(){editBuf.southLang=this.value;renderDictStatus()});
        $('cfg-north-lang').addEventListener('change',function(){editBuf.northLang=this.value;renderDictStatus()});

        $('conv-new').addEventListener('click',function(){
            var id=newId();
            rooms.push({id:id,createdAt:Date.now(),count:0,label:null,
                southLang:'en',northLang:'th',southBg:DEFAULT_S,northBg:DEFAULT_N,
                fontColor:DEFAULT_FONT,fontSize:15});
            saveRooms();renderRoomList();
            openEditSheet(id);
            toastMsg('New room created');
        });

        $('cfg-save').addEventListener('click',function(){
            commitEditBuf();renderRoomList();closeEditSheet();toastMsg('Saved');
        });
        $('cfg-cancel').addEventListener('click',closeEditSheet);

        $('launch-btn').addEventListener('click',function(){
            commitEditBuf();launchRoom(selected);
        });

        $('cfg-keys-save').addEventListener('click',function(){
            var dg=$('cfg-dg').value.trim(), pat=$('cfg-pat').value.trim();
            try{if(dg)localStorage.setItem('tb_dg_key',dg);if(pat)localStorage.setItem('duck_gh_pat',pat)}catch(e){}
            toastMsg('Keys saved');
        });
        $('cfg-haptic').value=(function(){try{return localStorage.getItem('duck_haptic')||'medium'}catch(e){return 'medium'}})();
        $('cfg-haptic').addEventListener('change',function(){try{localStorage.setItem('duck_haptic',this.value)}catch(e){}});
        $('cfg-haptic-test').addEventListener('click',function(){
            var s=$('cfg-haptic').value,m=s==='off'?0:s==='light'?1:s==='strong'?3:2;
            var out=$('haptic-result');
            if(!navigator.vibrate){out.textContent='navigator.vibrate not available on this browser (iOS has no web vibration API).';return}
            var r=false;try{r=navigator.vibrate([30*m,60,30*m,60,60*m])}catch(e){}
            out.textContent='vibrate('+(30*m)+'ms x2, '+(60*m)+'ms) returned '+r+'. If you felt nothing, check the phone\'s Touch feedback / Vibration setting.';
        });
        $('cfg-dg').value=(function(){try{return localStorage.getItem('tb_dg_key')||''}catch(e){return ''}})();
        $('cfg-pat').value=(function(){try{return localStorage.getItem('duck_gh_pat')||''}catch(e){return ''}})();
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

    if(typeof window!=='undefined'){window.rooms=rooms;window.newId=newId;window.loadRooms=loadRooms;
        window.saveRooms=saveRooms;window.activeRooms=activeRooms;window.trashedRooms=trashedRooms;}
})();
</script>
</body>
</html>
