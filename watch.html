<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Watch</title>
<style>
:root{
  --bg:#e8edf2; --ring-hi:#f7f9fa; --ring-lo:#c3c8ce;
  --engrave:#7e858c; --engrave-soft:#9aa1a8; --ped-hi:#d7dbe0; --ped-lo:#b8bdc3;
  --led:#ffffff; --led-off:rgba(120,130,140,.16); --ball-a:#8f959c; --ball-b:#fbfcfd;
  --shadow:rgba(35,45,58,.20); --panel:#f4f6f8; --panel-txt:#3a4048; --accent:#5a6472;
  --sun:#f2ede2; --moon:#4a515a;
}
[data-theme="midnight"]{
  --bg:#101318; --ring-hi:#343a41; --ring-lo:#181c21;
  --engrave:#8b929a; --engrave-soft:#5c636b; --ped-hi:#2b3037; --ped-lo:#15181d;
  --led:#eef2f6; --led-off:rgba(238,242,246,.07); --ball-a:#565d65; --ball-b:#e8ecf0;
  --shadow:rgba(0,0,0,.55); --panel:#1a1e24; --panel-txt:#d7dce2; --accent:#9fb2c8;
  --sun:#e9e2d0; --moon:#0d1014;
}
[data-theme="amber"]{
  --bg:#12100c; --ring-hi:#3a352c; --ring-lo:#1a1712;
  --engrave:#9c8f76; --engrave-soft:#5f5744; --ped-hi:#2e2a22; --ped-lo:#171410;
  --led:#ffb454; --led-off:rgba(255,180,84,.08); --ball-a:#6b6250; --ball-b:#ffcf8a;
  --shadow:rgba(0,0,0,.6); --panel:#1c1913; --panel-txt:#e6d9c2; --accent:#ffb454;
  --sun:#ffd9a0; --moon:#0e0c08;
}
[data-theme="ember"]{
  --bg:#160d0b; --ring-hi:#4a2e26; --ring-lo:#20120e;
  --engrave:#b08a7a; --engrave-soft:#6b4a3e; --ped-hi:#38221c; --ped-lo:#1a0f0c;
  --led:#ff8a5c; --led-off:rgba(255,138,92,.09); --ball-a:#7a4a38; --ball-b:#ffc3a6;
  --shadow:rgba(0,0,0,.6); --panel:#211310; --panel-txt:#f0d5c8; --accent:#ff8a5c;
  --sun:#ffb98a; --moon:#120906;
}
[data-theme="forest"]{
  --bg:#0c1410; --ring-hi:#2c4436; --ring-lo:#111d16;
  --engrave:#8ab098; --engrave-soft:#48604f; --ped-hi:#1f3328; --ped-lo:#0e1913;
  --led:#7ce8a8; --led-off:rgba(124,232,168,.08); --ball-a:#3f6450; --ball-b:#c8f5da;
  --shadow:rgba(0,0,0,.6); --panel:#12201a; --panel-txt:#d4ecdc; --accent:#7ce8a8;
  --sun:#c9f0b8; --moon:#081009;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  overflow:hidden;transition:background .4s}
#scene{position:fixed;inset:0;width:100vw;height:100dvh;touch-action:none;display:block}
text{user-select:none}
.eng{fill:var(--engrave);font-weight:600;letter-spacing:.06em}
.eng-soft{fill:var(--engrave-soft);font-weight:500}
body.flash::before{content:"";position:fixed;inset:0;background:var(--led);opacity:.14;
  z-index:5;pointer-events:none;animation:ff 1.1s ease-out forwards}
@keyframes ff{to{opacity:0}}
.cbtn{position:fixed;width:clamp(32px,9vmin,44px);height:clamp(32px,9vmin,44px);border:none;border-radius:50%;
  background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--panel-txt);
  font-size:clamp(14px,4.4vmin,19px);box-shadow:0 2px 10px var(--shadow);z-index:30;cursor:pointer}
#gear{top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
#tmr{top:calc(env(safe-area-inset-top,0px) + 10px);left:12px}
#calChip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);
  z-index:30;border:none;border-radius:16px;padding:7px 14px;font-size:12px;letter-spacing:.08em;
  background:color-mix(in srgb,var(--panel) 85%,transparent);color:var(--panel-txt);
  box-shadow:0 2px 10px var(--shadow);cursor:pointer;display:none}
body[data-cal="1"] #calChip{display:block}
/* mode dots */
#modeDots{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;
  transform:translateX(-50%);display:flex;gap:7px;z-index:20;pointer-events:none}
#modeDots i{width:6px;height:6px;border-radius:50%;background:var(--engrave-soft);opacity:.4}
#modeDots i.on{background:var(--accent);opacity:1}
#modeName{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);left:50%;
  transform:translateX(-50%);font-size:11px;letter-spacing:.28em;color:var(--engrave-soft);
  z-index:20;pointer-events:none;opacity:0;transition:opacity .4s;text-transform:uppercase}
#modeName.show{opacity:.9}
/* calendar bars */
#calBars{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);left:8px;right:8px;z-index:24;
  display:none;flex-direction:column;gap:6px;max-height:40dvh;overflow:auto}
#calBars.open{display:flex}
.calRow{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px var(--shadow)}
.calLbl{font-size:10px;letter-spacing:.14em;color:var(--panel-txt);opacity:.6;width:52px;flex:0 0 52px}
.calBar{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.calSeg{flex:1;min-width:8px;height:16px;border-radius:4px;background:var(--led-off);
  font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--panel-txt)}
.calSeg.done{background:color-mix(in srgb,var(--accent) 45%,transparent)}
.calSeg.cur{background:var(--accent);color:var(--panel);font-weight:700;min-width:22px}
/* panel */
#cfg{position:fixed;top:0;right:0;height:100%;width:min(340px,94vw);background:var(--panel);
  color:var(--panel-txt);z-index:40;padding:20px 18px calc(env(safe-area-inset-bottom,0px)+26px);
  transform:translateX(105%);transition:transform .28s ease;box-shadow:-6px 0 30px var(--shadow);
  overflow-y:auto;font-size:15px;-webkit-overflow-scrolling:touch}
#cfg.open{transform:translateX(0)}
#cfg h2{font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin:0 0 14px}
.grp{margin-bottom:18px}
.grp.hid{display:none}
.grp>label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 30%;min-height:38px;padding:7px 6px;border:1px solid color-mix(in srgb,var(--panel-txt) 18%,transparent);
  background:transparent;color:var(--panel-txt);border-radius:9px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;min-height:40px;gap:10px}
.row span{font-size:14px}
.sw{position:relative;flex:0 0 50px;width:50px;height:28px;border-radius:14px;border:none;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 22%,transparent);transition:background .2s}
.sw.on{background:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on::after{left:25px}
.srow{display:grid;grid-template-columns:74px 1fr 48px;gap:8px;align-items:center;min-height:34px}
.srow .sl{font-size:12px;opacity:.65}
.srow output{font-size:11px;opacity:.6;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.crow{display:grid;grid-template-columns:1fr 44px 30px;gap:8px;align-items:center;min-height:38px}
.crow span{font-size:13px;opacity:.8}
input[type=color]{width:44px;height:30px;border:1px solid color-mix(in srgb,var(--panel-txt) 25%,transparent);
  border-radius:8px;background:transparent;padding:2px;cursor:pointer}
.xbtn{width:28px;height:28px;border:none;border-radius:7px;font-size:13px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.ghost{width:100%;min-height:38px;border:1px dashed color-mix(in srgb,var(--panel-txt) 30%,transparent);
  background:transparent;color:var(--panel-txt);border-radius:9px;font-size:13px;cursor:pointer;margin-top:6px}
.solid{width:100%;min-height:42px;border:none;border-radius:10px;font-size:15px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.half{display:flex;gap:8px}.half>*{flex:1}
.bhdr{font-size:11px;font-weight:700;letter-spacing:.15em;opacity:.6;margin:10px 0 4px}
select,input[type=number]{min-height:38px;border:1px solid color-mix(in srgb,var(--panel-txt) 22%,transparent);
  background:var(--panel);color:var(--panel-txt);border-radius:9px;padding:4px 8px;font-size:14px}
.chk{display:flex;gap:14px;align-items:center;font-size:13px;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
#toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px)+52px);left:50%;transform:translateX(-50%);
  background:var(--panel);color:var(--panel-txt);border-radius:10px;padding:8px 16px;font-size:13px;
  box-shadow:0 4px 16px var(--shadow);z-index:60;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* timer dialog */
dialog{border:none;border-radius:18px;background:var(--panel);color:var(--panel-txt);
  padding:18px;width:min(330px,94vw);box-shadow:0 12px 50px var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.4)}
#tsvg{width:min(220px,60vw);height:auto;display:block;margin:6px auto}
.tnum{display:flex;gap:8px;justify-content:center;margin:8px 0}
.tnum input{width:72px;text-align:center;font-size:17px}
.tbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tbtns button{flex:1 1 40%;min-height:44px;border:none;border-radius:10px;font-size:15px;cursor:pointer;
  background:color-mix(in srgb,var(--panel-txt) 12%,transparent);color:var(--panel-txt)}
.tbtns button.primary{background:var(--accent);color:var(--panel);font-weight:600}
.tbtns button:disabled{opacity:.4}
.drop{transition:transform .55s cubic-bezier(.25,.9,.3,1.05),opacity .3s}
.fall{transition:transform .9s cubic-bezier(.2,.7,.3,1)}
.xfer{transition:transform .9s cubic-bezier(.4,.1,.3,1),opacity .2s .8s}
@media (prefers-reduced-motion:reduce){.drop,.fall,.xfer{transition:none}}
@media (max-width:300px),(max-height:300px){ /* watch */
  #modeDots,#calChip{display:none!important}
}
</style>
</head>
<body data-theme="studio" data-cal="0">
<svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg>
<button id="gear" class="cbtn" aria-label="Settings">⚙</button>
<button id="tmr" class="cbtn" aria-label="Timer">⏱</button>
<button id="calChip">Calendar ▾</button>
<div id="calBars"></div>
<div id="modeDots"></div>
<div id="modeName"></div>
<div id="toast"></div>
<div id="scrim"></div>

<aside id="cfg">
  <h2>Watch · Settings</h2>
  <div class="grp"><label>Mode — or swipe the clock ⇄</label><div class="seg" id="segMode"></div></div>
  <div class="grp"><label>Theme</label><div class="seg" id="segTheme"></div></div>
  <div class="grp"><label>Readout</label>
    <div class="row"><span>24-hour</span><button class="sw" id="sw24"></button></div>
    <div class="row" id="rowSec"><span>Seconds</span><button class="sw" id="swSec"></button></div>
    <div class="row" id="rowDate"><span>Date</span><button class="sw" id="swDate"></button></div>
    <div class="srow"><span class="sl">Scale</span><input type="range" id="rgScale" min="55" max="140" step="5"><output id="rgScaleO"></output></div>
  </div>
  <div class="grp"><label>Colors</label><div id="colorRows"></div>
    <button class="ghost" id="colReset">Reset colors to theme</button></div>

  <div class="grp hid" id="grpRings"><label>Rings</label>
    <div class="srow"><span class="sl">Thickness</span><input type="range" id="rTh" min="6" max="26" step="1"><output id="rThO"></output></div>
    <div class="srow"><span class="sl">Glow</span><input type="range" id="rGl" min="0" max="20" step="1"><output id="rGlO"></output></div>
  </div>

  <div class="grp hid" id="grpMosaic"><label>Mosaic</label>
    <div class="row"><span>Effect</span><select id="mfx">
      <option value="breathe">Breathe</option><option value="wave">Wave (Rows)</option>
      <option value="scan">Scan (Columns)</option><option value="snake">Snake</option>
      <option value="fade">Fade</option><option value="sparkle">Sparkle</option>
      <option value="ripple">Ripple (Center Out)</option><option value="cascade">Cascade (Diagonal)</option>
      <option value="pulse">Pulse (Checkerboard)</option><option value="rain">Rain (Falling)</option>
      <option value="heartbeat">Heartbeat</option><option value="spiral">Spiral</option>
      <option value="none">None</option></select></div>
    <div class="row"><span>Orientation</span><select id="mor">
      <option value="h">Horizontal</option><option value="v">Vertical</option></select></div>
    <div class="srow"><span class="sl">Dot size</span><input type="range" id="mdot" min="50" max="160" step="5"><output id="mdotO"></output></div>
  </div>

  <div class="grp hid" id="grpBuckets"><label>Buckets — drag them anywhere</label>
    <div id="bucketCtl"></div>
    <div class="half">
      <button class="ghost" id="bPosReset">Reset positions</button>
      <button class="ghost" id="bReset">Reset sizes</button>
    </div>
  </div>

  <div class="grp"><label>Calendar progress</label>
    <div class="row"><span>Show calendar</span><button class="sw" id="swCal"></button></div>
    <div class="chk"><input type="checkbox" id="cuM" checked><span>Months</span>
      <input type="checkbox" id="cuD" checked><span>Days</span>
      <input type="checkbox" id="cuW" checked><span>Week</span></div>
  </div>

  <div class="grp"><label>Sound &amp; signals</label>
    <div class="row"><span>Hourly chime</span><button class="sw" id="swChime"></button></div>
    <div class="row"><span>Hourly flash</span><button class="sw" id="swFlash"></button></div>
    <div class="srow"><span class="sl">Volume</span><input type="range" id="rgVol" min="0" max="100" step="5"><output id="rgVolO"></output></div>
    <button class="ghost" id="testChime">Test chime</button>
  </div>

  <div class="grp"><label>Preferences</label>
    <div class="half">
      <button class="ghost" id="expCfg">Export</button>
      <button class="ghost" id="impCfg">Import</button>
    </div>
    <input type="file" id="impFile" accept="application/json" hidden>
  </div>
  <button class="solid" id="closeCfg">Done</button>
  <p style="margin-top:14px;font-size:11px;opacity:.4;letter-spacing:.05em">watch v1.0 · acmeproducts · consolidates look + time + clock</p>
</aside>

<dialog id="tdlg">
  <h2 style="font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.6">Timer</h2>
  <div class="row" style="margin-top:6px"><span>Mode</span><select id="tmode">
    <option value="countdown">Countdown</option><option value="countup">Count up</option></select></div>
  <div class="row"><span>Visual</span><select id="tvis">
    <option value="ring">Ring</option><option value="spiral">Spiral</option><option value="grid">Grid</option></select></div>
  <div class="tnum">
    <input type="number" id="tH" min="0" max="99" value="0" inputmode="numeric" aria-label="Hours">
    <input type="number" id="tM" min="0" max="59" value="5" inputmode="numeric" aria-label="Minutes">
    <input type="number" id="tS" min="0" max="59" value="0" inputmode="numeric" aria-label="Seconds">
  </div>
  <svg id="tsvg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="tbtns">
    <button id="tStart" class="primary">Start</button>
    <button id="tPause" disabled>Pause</button>
    <button id="tReset">Reset</button>
    <button id="tClose">Close</button>
  </div>
</dialog>

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("scene");
const $=id=>document.getElementById(id);
const reduced=matchMedia("(prefers-reduced-motion: reduce)");

/* ================= config ================= */
const DEF={
  mode:"orbit",theme:"studio",h24:false,sec:false,date:true,scale:100,
  colors:{},chime:false,flash:false,vol:50,
  rings:{th:14,glow:8},
  mosaic:{fx:"breathe",orient:"h",dot:100},
  buckets:{
    pos:{s:{x:.5,y:.17},m:{x:.5,y:.46},h:{x:.5,y:.73}},
    s:{w:100,h:100,cols:12,dot:100},
    m:{w:100,h:100,cols:12,dot:100},
    h:{w:100,h:100,cols:12,dot:100}
  },
  cal:{open:false,m:true,d:true,w:true},
  timer:{mode:"countdown",vis:"ring",h:0,m:5,s:0}
};
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])){t[k]=t[k]&&typeof t[k]==="object"?t[k]:{};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}
let cfg=structuredClone(DEF);
try{deepMerge(cfg,JSON.parse(localStorage.getItem("watch-config")||"{}"))}catch(e){}
function saveCfg(){try{localStorage.setItem("watch-config",JSON.stringify(cfg))}catch(e){}}
function toast(s){const t=$("toast");t.textContent=s;t.classList.add("show");
  clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2200)}

const MODES=[["orbit","Orbit"],["rings","Rings"],["analog","Analog"],["eclipse","Eclipse"],
  ["orrery","Orrery"],["rain","Rain"],["buckets","Buckets"],["mosaic","Mosaic"],["verbal","Verbal"]];
const THEMES=[["studio","Studio"],["midnight","Midnight"],["amber","Amber"],["ember","Ember"],["forest","Forest"]];
const RELEVANT={
  orbit:{sec:true,date:true},rings:{sec:false,date:true},analog:{sec:false,date:true},
  eclipse:{sec:true,date:true},orrery:{sec:false,date:false},rain:{sec:true,date:true},
  buckets:{sec:false,date:true},mosaic:{sec:true,date:true},verbal:{sec:false,date:true}
};
const COLOR_DEFS={
  common:[["led","Digits / LED","--led"],["engrave","Engraving","--engrave"],["bg","Background","--bg"]],
  orbit:[["ballH","Hour bearing","--ball-a"],["ballM","Minute bearing","--ball-b"]],
  rings:[["rS","Seconds ring","--led"],["rM","Minutes ring","--ball-b"],["rH","Hours ring","--ball-a"]],
  analog:[["hH","Hour hand","--engrave"],["hM","Minute hand","--engrave"],["hS","Second hand","--led"]],
  eclipse:[["sun","Sun","--sun"],["moon","Shade","--moon"]],
  orrery:[["pH","Hour planet","--ball-a"],["pM","Minute planet","--ball-b"],["pS","Second planet","--led"]],
  rain:[["arc","Seconds arc","--led"]],
  buckets:[["bS","Seconds fill","--led"],["bM","Minutes fill","--led"],["bH","Hours fill","--led"],["bCur","Falling dot","--ball-b"]],
  mosaic:[],verbal:[]
};
function themeVal(v){return getComputedStyle(document.body).getPropertyValue(v).trim()}
function C(key,defVar){return cfg.colors[key]||`var(${defVar})`}

/* ================= viewport ================= */
let VB={w:420,h:560,cx:210,cy:280,min:420};
function fitVB(){
  const ar=innerWidth/Math.max(1,innerHeight);
  if(ar>=1){VB.h=420;VB.w=Math.min(1200,420*ar)}
  else{VB.w=420;VB.h=Math.min(900,420/ar)}
  VB.cx=VB.w/2;VB.cy=VB.h/2;VB.min=Math.min(VB.w,VB.h);
  svg.setAttribute("viewBox",`0 0 ${VB.w} ${VB.h}`);
}
fitVB();
addEventListener("resize",()=>{fitVB();hardRedraw()});

/* ================= panel ================= */
function buildSeg(el2,items,cur,fn){
  el2.innerHTML="";
  items.forEach(([v,label])=>{
    const b=document.createElement("button");b.textContent=label;
    if(v===cur)b.classList.add("on");
    b.onclick=()=>{fn(v);buildSeg(el2,items,v,fn)};
    el2.appendChild(b);
  });
}
function buildSw(el2,get,set){
  el2.classList.toggle("on",get());
  el2.onclick=()=>{set(!get());el2.classList.toggle("on",get());saveCfg();hardRedraw()};
}
function buildColors(){
  const host=$("colorRows");host.innerHTML="";
  [...COLOR_DEFS.common,...(COLOR_DEFS[cfg.mode]||[])].forEach(([key,label,dv])=>{
    const row=document.createElement("div");row.className="crow";
    const sp=document.createElement("span");sp.textContent=label;
    const inp=document.createElement("input");inp.type="color";
    inp.value=cfg.colors[key]||themeVal(dv)||"#ffffff";
    inp.oninput=()=>{cfg.colors[key]=inp.value;saveCfg();hardRedraw()};
    const x=document.createElement("button");x.className="xbtn";x.textContent="↺";
    x.onclick=()=>{delete cfg.colors[key];inp.value=themeVal(dv)||"#ffffff";saveCfg();hardRedraw()};
    row.append(sp,inp,x);host.appendChild(row);
  });
}
function buildBucketCtl(){
  const host=$("bucketCtl");host.innerHTML="";
  [["s","SECONDS",60],["m","MINUTES",60],["h","HOURS",24]].forEach(([k,label,total])=>{

const FONT={
"0":["01110","10001","10011","10101","11001","10001","01110"],
"1":["00100","01100","00100","00100","00100","00100","01110"],
"2":["01110","10001","00001","00010","00100","01000","11111"],
"3":["11111","00010","00100","00010","00001","10001","01110"],
"4":["00010","00110","01010","10010","11111","00010","00010"],
"5":["11111","10000","11110","00001","00001","10001","01110"],

"7":["11111","00001","00010","00100","01000","01000","01000"],

"9":["01110","10001","10001","01111","00001","00010","01100"],
":":["000","000","010","000","010","000","000"]," ":["000","000","000","000","000","000","000"]};
function matrixCells(str){
  let col=0;const cells=[];
  for(const ch of str){
    const gl=FONT[ch]||FONT[" "];const w=gl[0].length;
    for(let r=0;r<7;r++)for(let c=0;c<w;c++)cells.push({col:col+c,row:r,on:gl[r][c]==="1"});
    col+=w+1;
  }
  return{cells,cols:col-1};
}
function drawMatrix(parent,cx,cy,str,pitch,rad,withOff,fill){
  const{cells,cols}=matrixCells(str);
  const x0=cx-(cols-1)*pitch/2, y0=cy-3*pitch;
  cells.forEach(c=>{
    if(!c.on&&!withOff)return;
    el("circle",{cx:x0+c.col*pitch,cy:y0+c.row*pitch,r:rad,
      fill:c.on?(fill||C("led","--led")):"var(--led-off)"},parent);

/* ================= time strings ================= */
function fmt(n){return String(n).padStart(2,"0")}
function timeStr(d){
  let h=d.getHours();
  if(!cfg.h24){h=h%12;if(h===0)h=12}
  let s=fmt(h)+":"+fmt(d.getMinutes());
  if(cfg.sec&&RELEVANT[cfg.mode].sec)s+=":"+fmt(d.getSeconds());
  return s;
}
const DAYS=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function dateStr(d){return DAYS[d.getDay()]+" "+fmt(d.getDate())+" "+MON[d.getMonth()]}
function daysInMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
const ONES=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven",
"twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty"];
function numWord(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?"-"+ONES[n%10]:"")}
function verbalTime(d){
  const m=d.getMinutes();let h=d.getHours()%12;if(h===0)h=12;
  let h2=(d.getHours()+1)%12;if(h2===0)h2=12;
  const per=d.getHours()<5?"at night":d.getHours()<12?"in the morning":
    d.getHours()<17?"in the afternoon":d.getHours()<21?"in the evening":"at night";
  let s;
  if(m===0)s=`${numWord(h)} o'clock`;
  else if(m===15)s=`quarter past ${numWord(h)}`;
  else if(m===30)s=`half past ${numWord(h)}`;
  else if(m===45)s=`quarter to ${numWord(h2)}`;
  else if(m<30)s=`${numWord(m)} ${m===1?"minute":"minutes"} past ${numWord(h)}`;
  else s=`${numWord(60-m)} ${60-m===1?"minute":"minutes"} to ${numWord(h2)}`;
  return"It's "+s+" "+per;
}

/* ================= chime ================= */
let audioCtx=null,lastHour=new Date().getHours();
function chime(){
  try{
    audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    const now=audioCtx.currentTime;
    [0,.18].forEach((delay,i)=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.frequency.value=i?659.25:523.25;
      g.gain.setValueAtTime(cfg.vol/100*.18,now+delay);
      g.gain.exponentialRampToValueAtTime(.001,now+delay+.55);
      o.connect(g).connect(audioCtx.destination);
      o.start(now+delay);o.stop(now+delay+.6);
    });
  }catch(e){}
}
function hourlyCheck(d){
  if(d.getHours()!==lastHour){
    lastHour=d.getHours();
    if(cfg.chime)chime();
    if(cfg.flash){document.body.classList.remove("flash");void document.body.offsetWidth;
      document.body.classList.add("flash")}
  }
}

  el("circle",{cx,cy,r:R,fill:"url(#ringG)"});
  el("circle",{cx,cy,r:R*.832,fill:C("bg","--bg")});
  const n=daysInMonth(d);
  for(let day=1;day<=n;day++){
    const a=(day-1)/n*360,[x,y]=pt(cx,cy,R*.916,a);
    const today=day===d.getDate();
    const t=txt(x,y,fmt(day),(today?11:8)*R/166,today?"eng":"eng-soft",root,a);
    if(today)t.setAttribute("font-weight","800");
    if(cfg.colors.engrave)t.setAttribute("fill",cfg.colors.engrave);
  }
  const tracks=[
    [R*.71,((d.getHours()%12)+d.getMinutes()/60)/12,12*R/166,C("pH","--ball-a")],
    [R*.52,(d.getMinutes()+d.getSeconds()/60)/60,8.5*R/166,C("pM","--ball-b")],
    [R*.33,(d.getSeconds()+d.getMilliseconds()/1000)/60,5.5*R/166,C("pS","--led")]
  ];
  tracks.forEach(([r,f,size,fill])=>{
    el("circle",{cx,cy,r,fill:"none",stroke:"var(--engrave-soft)","stroke-opacity":".3","stroke-width":"1"});
    const a=f*360;
    if(a>1)el("path",{d:arcPath(cx,cy,r,0,a),fill:"none",stroke:fill,
      "stroke-opacity":".3","stroke-width":size*.35,"stroke-linecap":"round"});
    const[x,y]=pt(cx,cy,r,a);
    el("circle",{cx:x,cy:y+1.5,r:size,fill:"var(--shadow)",opacity:".4"});
    el("circle",{cx:x,cy:y,r:size,fill:fill});
  });
  const df=(d.getDate()-1+d.getHours()/24)/n*360,[dx,dy]=pt(cx,cy,R*.916,df);
  el("circle",{cx:dx,cy:dy,r:13*R/166,fill:"none",stroke:C("led","--led"),"stroke-width":"1.5",opacity:".9"});
  el("circle",{cx,cy,r:10*R/166,fill:C("sun","--sun")});
  el("circle",{cx,cy,r:18*R/166,fill:"url(#glow)"});
  txt(cx,cy+R+24,MON[d.getMonth()]+" · "+timeStr(d),11,"eng-soft").setAttribute("letter-spacing",".3em");
}

/* ============ RAIN ============ */
let rainKey="";
function drawRain(d,soft){
  const cx=VB.cx,footH=44,cy=(VB.h-footH)/2+6;
  const R=Math.min(VB.min*.42,(VB.h-footH)/2-12);
  el("circle",{cx,cy,r:R,fill:"url(#ringG)"});
  el("circle",{cx,cy,r:R-13,fill:C("bg","--bg")});
  el("circle",{cx,cy,r:R-13,fill:"none",stroke:"var(--ring-lo)","stroke-width":"1.5"});
  const sf=(d.getSeconds()+d.getMilliseconds()/1000)/60;
  el("path",{id:"secArc",d:sf>0.002?arcPath(cx,cy,R-6.5,0,sf*360):"M 0 0",fill:"none",
    stroke:C("arc","--led"),"stroke-width":"3","stroke-linecap":"round",opacity:".85"});
  const str=timeStr(d);
  const g=el("g",{});
  const{cells,cols}=matrixCells(str);
  const pitch=Math.min(9*R/168,(2*(R-36))/cols), rad=pitch*.34;
  const x0=cx-(cols-1)*pitch/2, y0=cy-3*pitch;
  const animate=!reduced.matches&&str!==rainKey&&!soft;
  cells.forEach(c=>{
    if(!c.on)return;
    const dot=el("circle",{cx:x0+c.col*pitch,cy:y0+c.row*pitch,r:rad,fill:C("led","--led"),class:"fall"},g);
    if(animate){
      dot.style.transform=`translateY(${-(VB.h*.6+Math.random()*160)}px)`;
      dot.style.transitionDelay=(Math.random()*.45)+"s";
      requestAnimationFrame(()=>requestAnimationFrame(()=>{dot.style.transform="translateY(0)"}));
    }
  });
  rainKey=str;
  if(cfg.date)txt(cx,cy+R*.35,dateStr(d),10,"eng-soft").setAttribute("letter-spacing",".3em");
}

let swipe=null;
/* ============ BUCKETS (faithful to time.html, no connectors) ============ */
let bucketHits={};
function bregion(){return{x:14,y:34,w:VB.w-28,h:VB.h-118}}
function bucketGeom(k,total){
  const RG=bregion(),b=cfg.buckets[k],cols=b.cols,rows=Math.ceil(total/cols);
  const base=Math.min(RG.w*.62,VB.min*.56);
  const w=Math.min(RG.w,base*b.w/100);
  const h=Math.min(RG.h*.6,(rows*15+24)*Math.min(1.6,base/220)*b.h/100);
  const p=cfg.buckets.pos[k];
  const x=Math.max(RG.x,Math.min(RG.x+RG.w-w,RG.x+p.x*RG.w-w/2));
  const y=Math.max(RG.y,Math.min(RG.y+RG.h-h,RG.y+p.y*RG.h-h/2));
  return{x,y,w,h,cols,rows};
}
function cellXY(g0,i){
  const padX=12,top=20,padB=8;
  const cw=(g0.w-padX*2)/g0.cols,ch=(g0.h-top-padB)/g0.rows;
  return{x:g0.x+padX+(i%g0.cols+.5)*cw,y:g0.y+top+(Math.floor(i/g0.cols)+.5)*ch,cw,ch};
}
function bucketPlate(k,label,total,count,fill,fallFrac){
  const g0=bucketGeom(k,total);
  const grp=el("g",{});
  el("rect",{x:g0.x,y:g0.y,width:g0.w,height:g0.h,rx:10,fill:"url(#pedG)"},grp);
  el("rect",{x:g0.x,y:g0.y,width:g0.w,height:g0.h,rx:10,fill:"none",stroke:"var(--ring-hi)","stroke-opacity":".45"},grp);
  const t=txt(g0.x+11,g0.y+12,label,7.5,"eng-soft",grp);
  t.setAttribute("text-anchor","start");t.setAttribute("letter-spacing",".26em");
  const c2=txt(g0.x+g0.w-11,g0.y+12,fmt(count),9,"eng",grp);c2.setAttribute("text-anchor","end");
  for(let i=0;i<total;i++){
    const q=cellXY(g0,i);
    const r=Math.max(1.1,Math.min(q.cw,q.ch)*.30*cfg.buckets[k].dot/100);
    el("circle",{cx:q.x,cy:q.y,r,fill:i<count?fill:"var(--led-off)"},grp);
  }
  /* time.html falling second: a dot drops from the plate top into the next cell */
  if(k==="s"&&count<total&&!reduced.matches){
    const q=cellXY(g0,count);
    const r=Math.max(1.6,Math.min(q.cw,q.ch)*.30*cfg.buckets[k].dot/100);
    const p=Math.min(1,fallFrac/.8);
    const y=g0.y+4+(q.y-g0.y-4)*p*p;      /* accelerating fall */
    el("circle",{cx:q.x,cy:y,r:r*1.05,fill:C("bCur","--ball-b"),
      stroke:"var(--ring-hi)","stroke-width":".8"},grp);
  }
  el("rect",{x:g0.x,y:g0.y,width:g0.w,height:g0.h,rx:10,fill:"transparent",
    "data-drag":k,style:"cursor:grab;touch-action:none"},grp);
  bucketHits[k]=g0;
}
function transferFX(fromK,toK,toIdx,frac){
  /* dot flies from source plate into the newly-filled cell; positional so it
     survives the per-frame rebuild. frac 0→1 over the first .9s of the rollover */
  if(reduced.matches)return;
  const a=bucketHits[fromK],g0=bucketHits[toK];
  if(!a||!g0)return;
  const q=cellXY(g0,Math.max(0,toIdx));
  const r=Math.max(2,Math.min(q.cw,q.ch)*.32);
  const sx=a.x+a.w/2,sy=a.y+a.h/2;
  const t=Math.min(1,frac), u=1-t;
  /* quadratic arc via lifted midpoint (time.html transferPoint) */
  const mxp=(sx+q.x)/2, myp=Math.min(sy,q.y)-35;
  const x=u*u*sx+2*u*t*mxp+t*t*q.x;
  const y=u*u*sy+2*u*t*myp+t*t*q.y;
  el("circle",{cx:x,cy:y,r,fill:C("bCur","--ball-b"),opacity:String(1-t*.25)});
}
function drawBucketsMode(d){
  bucketHits={};
  const ms=d.getMilliseconds()/1000, boundary=d.getSeconds()+ms;
  bucketPlate("s","SECONDS",60,d.getSeconds(),C("bS","--led"),ms);
  bucketPlate("m","MINUTES",60,d.getMinutes(),C("bM","--led"),0);
  bucketPlate("h","HOURS / DAY",24,d.getHours(),C("bH","--led"),0);
  if(boundary<0.9){                          /* rollover moment */
    transferFX("s","m",d.getMinutes()-1,boundary/.9);
    if(d.getMinutes()===0)transferFX("m","h",d.getHours()-1,boundary/.9);
  }
  footer(d,VB.h-58,true);
}
/* unconstrained drag */
let bdrag=null;
function svgPoint(e){
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
  return{x:p.x,y:p.y};
}
svg.addEventListener("pointerdown",e=>{
  if(cfg.mode!=="buckets")return;
  const k=e.target.getAttribute&&e.target.getAttribute("data-drag");
  if(!k)return;
  const p=svgPoint(e),g0=bucketHits[k];
  bdrag={k,id:e.pointerId,off:{x:p.x-(g0.x+g0.w/2),y:p.y-(g0.y+g0.h/2)},moved:false};
  swipe=null;
  svg.setPointerCapture(e.pointerId);
  e.stopPropagation();
});
svg.addEventListener("pointermove",e=>{
  if(!bdrag||bdrag.id!==e.pointerId)return;
  bdrag.moved=true;
  const p=svgPoint(e),RG=bregion();
  cfg.buckets.pos[bdrag.k]={
    x:Math.max(0,Math.min(1,(p.x-bdrag.off.x-RG.x)/RG.w)),
    y:Math.max(0,Math.min(1,(p.y-bdrag.off.y-RG.y)/RG.h))};
  render("soft");
});
function endB(e){if(bdrag&&bdrag.id===e.pointerId){if(bdrag.moved)saveCfg();bdrag=null}}
svg.addEventListener("pointerup",endB);svg.addEventListener("pointercancel",endB);

/* ============ MOSAIC (clock.html — all 13 effects) ============ */
let mosaicDots=null,mosaicKey="";
function buildMosaic(d){
  const str=timeStr(d);
  const grp=el("g",{});
  mosaicDots=[];
  const parts=str.split(":");
  const lines=cfg.mosaic.orient==="v"?parts:[str];
  const lineData=lines.map(s=>matrixCells(cfg.mosaic.orient==="v"?s:str));
  const maxCols=Math.max(...lineData.map(l=>l.cols));
  const availW=VB.w-40, availH=VB.h-120;
  const pitch=Math.min(availW/maxCols, availH/(lines.length*8+1));
  const rad=pitch*.36*cfg.mosaic.dot/100;
  const totalH=lines.length*8*pitch;
  let snakeN=0;
  lineData.forEach((ld,li)=>{
    const x0=VB.cx-(ld.cols-1)*pitch/2;
    const y0=VB.cy-24-totalH/2+li*8*pitch+pitch;
    ld.cells.forEach(c=>{
      const cx=x0+c.col*pitch,cy=y0+c.row*pitch;
      const dot=el("circle",{cx,cy,r:rad,fill:c.on?C("led","--led"):"var(--led-off)"},grp);
      mosaicDots.push({dot,on:c.on,col:c.col,row:c.row+li*8,cx,cy,n:c.on?snakeN++:0});
    });
  });
  mosaicDots.total=snakeN;
  if(cfg.date)txt(VB.cx,VB.cy-24+totalH/2+30,dateStr(d),10,"eng-soft").setAttribute("letter-spacing",".3em");
  mosaicKey=str+"|"+cfg.mosaic.orient+"|"+cfg.mosaic.dot+"|"+VB.w;
}
function mosaicFrame(){
  if(!mosaicDots)return;
  const t=performance.now()/1000,fx=cfg.mosaic.fx;
  if(fx==="none"||reduced.matches){mosaicDots.forEach(m=>{if(m.on)m.dot.setAttribute("opacity",1)});return}
  const N=Math.max(1,mosaicDots.total||1);
  mosaicDots.forEach(m=>{
    if(!m.on){m.dot.setAttribute("opacity",1);return}
    let o=1;
    const w=(v)=>.4+.6*(.5+.5*v);
    if(fx==="breathe")o=.55+.45*Math.sin(t*1.6);
    else if(fx==="wave")o=w(Math.sin(t*2.2-m.row*.55));
    else if(fx==="scan")o=w(Math.sin(t*2.2-m.col*.4));
    else if(fx==="snake"){const ph=(t*N*.35)%N;const dd=Math.abs(m.n-ph);
      o=dd<N*.12||dd>N*.88?1:.35}
    else if(fx==="fade"){const c=(t*.5)%2;o=.25+.75*(c<1?c:2-c)}
    else if(fx==="sparkle")o=w(Math.sin(t*3+(m.col*13.37+m.row*7.91)%6.28*7));
    else if(fx==="ripple"){const dd=Math.hypot(m.cx-VB.cx,m.cy-VB.cy);o=w(Math.sin(t*2.5-dd*.045))}
    else if(fx==="cascade")o=w(Math.sin(t*2.4-(m.row+m.col)*.35));
    else if(fx==="pulse")o=((m.row+m.col)%2===Math.floor(t*2)%2)?1:.35;
    else if(fx==="rain")o=w(Math.sin(t*3-m.row*.9+m.col*1.7));
    else if(fx==="heartbeat"){const p=(t%1.2)/1.2;
      o=.35+.65*Math.max(Math.exp(-Math.pow((p-.15)*9,2)),.85*Math.exp(-Math.pow((p-.4)*9,2)))}
    else if(fx==="spiral"){const a=Math.atan2(m.cy-VB.cy,m.cx-VB.cx),dd=Math.hypot(m.cx-VB.cx,m.cy-VB.cy);
      o=w(Math.sin(t*2.4-a*2-dd*.02))}
    m.dot.setAttribute("opacity",o.toFixed(3));
  });
}

/* ============ VERBAL ============ */
function drawVerbal(d){
  const words=verbalTime(d).split(" ");
  const size=Math.min(30,VB.min*.072);
  const maxW=VB.w*.82;
  const lines=[];let line="";
  words.forEach(w2=>{
    const test=line?line+" "+w2:w2;
    if(test.length*size*.5>maxW&&line){lines.push(line);line=w2}else line=test;
  });
  lines.push(line);
  const y0=VB.cy-28-(lines.length-1)*size*.65;
  lines.forEach((ln,i)=>{
    const t=txt(VB.cx,y0+i*size*1.3,ln,size,"eng");
    t.setAttribute("fill",C("led","--led"));
    t.setAttribute("font-weight","300");
  });
  footer(d,VB.cy+lines.length*size*.7+52,true);
}

/* ================= swipe to change mode ================= */
svg.addEventListener("pointerdown",e=>{
  if(bdrag)return;
  swipe={x:e.clientX,y:e.clientY,id:e.pointerId};
},true);
svg.addEventListener("pointerup",e=>{
  if(!swipe||swipe.id!==e.pointerId||bdrag){swipe=null;return}
  const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){
    const i=MODES.findIndex(m=>m[0]===cfg.mode);
    const j=(i+(dx<0?1:-1)+MODES.length)%MODES.length;
    setMode(MODES[j][0],true);
  }
});

/* ================= timer ================= */
const tdlg=$("tdlg"),tsvg=$("tsvg");
let timer={state:"idle",elapsed:0,started:0},tDone=false;
$("tmr").onclick=()=>tdlg.showModal();
$("tClose").onclick=()=>tdlg.close();
["tmode","tvis","tH","tM","tS"].forEach(id=>$(id).addEventListener("change",()=>{
  cfg.timer={mode:$("tmode").value,vis:$("tvis").value,
    h:+$("tH").value||0,m:+$("tM").value||0,s:+$("tS").value||0};
  saveCfg();
  if(timer.state==="idle"||timer.state==="done")tResetFn();
}));
$("tmode").value=cfg.timer.mode;$("tvis").value=cfg.timer.vis;
$("tH").value=cfg.timer.h;$("tM").value=cfg.timer.m;$("tS").value=cfg.timer.s;
function tDur(){return Math.max(1,(+$("tH").value||0)*3600+(+$("tM").value||0)*60+(+$("tS").value||0))}
function tElapsed(){return timer.elapsed+(timer.state==="running"?(performance.now()-timer.started)/1000:0)}
function tFmt(n){n=Math.max(0,Math.ceil(n));
  return fmt(Math.floor(n/3600))+":"+fmt(Math.floor(n/60)%60)+":"+fmt(n%60)}
$("tStart").onclick=()=>{
  if(timer.state==="idle"||timer.state==="done")timer.elapsed=0;
  timer.started=performance.now();timer.state="running";tDone=false;
  $("tStart").textContent="Resume";$("tPause").disabled=false;
};
$("tPause").onclick=()=>{timer.elapsed=tElapsed();timer.state="paused";$("tPause").disabled=true};
function tResetFn(){timer={state:"idle",elapsed:0,started:0};tDone=false;
  $("tStart").textContent="Start";$("tPause").disabled=true}
$("tReset").onclick=tResetFn;
function timerFrame(){
  if(tdlg.open){
    const total=tDur(),mode=$("tmode").value,vis=$("tvis").value;
    let e=Math.min(tElapsed(),total),remain=Math.max(0,total-e);
    if(e>=total&&timer.state==="running"){
      timer.elapsed=total;timer.state="done";$("tPause").disabled=true;
      if(!tDone){tDone=true;chime();setTimeout(chime,450);toast("Timer complete")}
    }
    const f=mode==="countdown"?remain/total:e/total;
    tsvg.innerHTML="";
    const T=(tag,attrs)=>{const n=document.createElementNS(NS,tag);
      for(const k in attrs)n.setAttribute(k,attrs[k]);tsvg.appendChild(n);return n};
    if(vis==="ring"){
      T("circle",{cx:110,cy:110,r:92,fill:"url(#pedG)"});
      T("circle",{cx:110,cy:110,r:74,fill:"var(--panel)"});
      if(f>0.003){
        const[x0,y0]=pt(110,110,83,0),[x1,y1]=pt(110,110,83,f*360);
        T("path",{d:`M ${x0} ${y0} A 83 83 0 ${f*360>180?1:0} 1 ${x1} ${y1}`,fill:"none",
          stroke:C("led","--led"),"stroke-width":"10","stroke-linecap":"round"});
      }
    }else if(vis==="spiral"){
      for(const[col,end]of[["var(--led-off)",1],[C("led","--led"),f]]){
        let dstr="";
        for(let i=0;i<=200*end;i++){
          const a=i/200*Math.PI*5,r=8+i/200*82;
          const x=110+Math.cos(a)*r,y=110+Math.sin(a)*r;
          dstr+=(i?" L ":"M ")+x.toFixed(1)+" "+y.toFixed(1);
        }
        if(dstr)T("path",{d:dstr,fill:"none",stroke:col,"stroke-width":"8","stroke-linecap":"round"});
      }
    }else{ /* grid depletion / fill */
      const total2=100,lit=Math.round(f*total2);
      for(let i=0;i<total2;i++){
        const x=30+(i%10)*17.8,y=30+Math.floor(i/10)*17.8;
        T("circle",{cx:x,cy:y,r:6,fill:i<lit?C("led","--led"):"var(--led-off)"});
      }
    }
    const tt=T("text",{x:110,y:vis==="grid"?208:104,"text-anchor":"middle","dominant-baseline":"middle",
      "font-size":"21","font-weight":"600",fill:"var(--panel-txt)"});
    tt.textContent=tFmt(mode==="countdown"?remain:e);
    if(vis!=="grid"){
      const st=T("text",{x:110,y:130,"text-anchor":"middle","font-size":"9",
        fill:"var(--panel-txt)",opacity:".55","letter-spacing":".2em"});
      st.textContent=timer.state==="done"?"COMPLETE":mode.toUpperCase();
    }
  }
  requestAnimationFrame(timerFrame);
}

/* ================= render ================= */
let lastKey="";
function scaleWrap(){
  root=svg;
  const s=cfg.scale/100;
  if(s!==1)root=el("g",{transform:`translate(${VB.cx} ${VB.cy}) scale(${s}) translate(${-VB.cx} ${-VB.cy})`},svg);
}
function render(force){
  const d=new Date();
  hourlyCheck(d);renderCal(d);
  if(!force&&cfg.mode==="rain"&&timeStr(d)===rainKey){
    const arc=document.getElementById("secArc");
    if(arc){
      const footH=44,cy=(VB.h-footH)/2+6;
      const R=Math.min(VB.min*.42,(VB.h-footH)/2-12);
      const sf=(d.getSeconds()+d.getMilliseconds()/1000)/60;
      arc.setAttribute("d",sf>0.002?arcPath(VB.cx,cy,R-6.5,0,sf*360):"M 0 0");
      return;
    }
  }
  if(!force&&cfg.mode==="mosaic"&&(timeStr(d)+"|"+cfg.mosaic.orient+"|"+cfg.mosaic.dot+"|"+VB.w)===mosaicKey){
    mosaicFrame();return;
  }
  const smooth=cfg.mode==="orrery"||cfg.mode==="analog"||cfg.mode==="rings"||cfg.mode==="buckets";
  const key=cfg.mode+"|"+timeStr(d)+"|"+(smooth?d.getTime():"");
  if(!force&&key===lastKey)return;
  lastKey=key;
  const soft=force==="soft";
  svg.innerHTML="";defs();scaleWrap();
  mosaicDots=null;
  if(cfg.mode==="orbit")drawOrbit(d);
  else if(cfg.mode==="rings")drawRings(d);
  else if(cfg.mode==="analog")drawAnalog(d);
  else if(cfg.mode==="eclipse")drawEclipse(d);
  else if(cfg.mode==="rain")drawRain(d,soft);
  else if(cfg.mode==="buckets")drawBucketsMode(d);
  else if(cfg.mode==="mosaic")buildMosaic(d);
  else if(cfg.mode==="verbal")drawVerbal(d);
  else drawOrrery(d);
}
function hardRedraw(){rainKey="";mosaicKey="";render("soft")}
function loop(){render();requestAnimationFrame(loop)}
syncCal();render(true);loop();timerFrame();
document.addEventListener("visibilitychange",()=>{if(!document.hidden){lastHour=new Date().getHours();hardRedraw()}});
</script>
