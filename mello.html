<style>

<body>
  <div class="portal">
    <header class="topbar">
      <button id="sidebarToggle" class="icon-btn" type="button" aria-label="Collapse application sidebar" aria-controls="sidebar" aria-expanded="true"><span aria-hidden="true">☰</span></button>
      <strong id="headerTitle">Mello Matrix</strong>
      <div id="appControls" class="app-controls" aria-label="Application controls"></div>
      <span id="syncState" class="sync-state" role="status">Loading boards…</span>
    </header>
    <aside id="sidebar" class="sidebar" aria-label="Applications">
      <div class="brand"><span class="brand-mark">M</span><span><strong id="portalName">Mello</strong><small>Cards · boards · matrices</small></span></div>
      <nav>
        <button class="app-link" data-app="matrix"><span>▦</span><span>Board Matrix</span></button>
        <button class="app-link" data-app="transfer"><span>⇄</span><span>Card Transfer</span></button>
        <button class="app-link" data-app="create"><span>＋</span><span>Create Matrix</span></button>
        <button class="app-link" data-app="use"><span>▶</span><span>Use Matrix</span></button>
        <button class="app-link" data-app="mashup"><span>▥</span><span>Create Matrix Mashup</span></button>
        <button class="app-link" data-app="config"><span>⚙</span><span>Configuration</span></button>
      </nav>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
  <div id="scrim" class="scrim"></div>
  <dialog id="cardDialog"></dialog>
  <dialog id="nameDialog"></dialog>
  <dialog id="confirmDialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
(() => {
  "use strict";
  const FILES={index:"kanban-boards.json",switch:"kanban-switch.json"};
  const KEY="mello_configuration_v1", TOKEN_KEY="github_pat";
  const AXES=["title","platform","stage","lineage","statusColor","cardColor","dev","live"];
  const DISPLAY=["title","platform","stage","lineage","statusColor","dev","live","tags","notes"];
  const APP_NAMES={matrix:"Board Matrix",transfer:"Card Transfer",create:"Create Matrix",use:"Use Matrix",mashup:"Create Matrix Mashup",config:"Configuration"};
  const THEME={bg:"#f4f6fa",surface:"#ffffff",sidebar:"#101827",ink:"#142033",muted:"#667085",line:"#dfe4ec",accent:"#6658e8",accentSoft:"#eeecff",danger:"#cf3f4f",card:"#ffffff"};
  const THEME_NAMES={bg:"Portal background",surface:"Surface / panel background",sidebar:"Sidebar background",ink:"Primary text",muted:"Muted text",line:"Border",accent:"Accent",accentSoft:"Accent hover / soft color",danger:"Danger",card:"Card default"};
  const PRESETS=[{name:"Slate",color:"#64748b"},{name:"Red",color:"#ef4444"},{name:"Orange",color:"#f97316"},{name:"Yellow",color:"#eab308"},{name:"Green",color:"#22c55e"},{name:"Teal",color:"#14b8a6"},{name:"Blue",color:"#3b82f6"},{name:"Purple",color:"#8b5cf6"}];
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
  const slug=s=>String(s||"").trim().toLowerCase().replace(/[^a-z0-9_-]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};
  const validHex=v=>/^#[0-9a-f]{6}$/i.test(v||"");
  const defaults=()=>({version:3,portalName:"Mello",github:{owner:"acmeproducts",repo:"stuff",branch:"main",pat:localStorage.getItem(TOKEN_KEY)||""},theme:{...THEME},cardColors:PRESETS.map(x=>({...x})),matrices:[],selectedApp:"matrix",sidebarCollapsed:false});
  let config=defaults(), index={boards:[]}, repoCfg={}, boardData={}, state={}, drag=null, touch=null, saveQueue=Promise.resolve(), toastTimer, pendingImport=null;

  function migrate(){
    const modern=read(KEY,null); if(modern&&modern.version===3)config={...defaults(),...modern,github:{...defaults().github,...modern.github},theme:{...THEME,...modern.theme}};
    else {const old=read("program_portal_config_v2",{}),defs=read("program_matrix_definitions_v2",[]);config={...defaults(),portalName:old.portalName||"Mello",github:{...defaults().github,owner:old.owner||"acmeproducts",repo:old.repo||"stuff",branch:old.branch||"main"},cardColors:(old.colors||[]).filter(validHex).map((color,i)=>({name:`Color ${i+1}`,color})),matrices:defs.map(d=>({...d,intersection:d.intersection||"title",fields:d.fields||[],updatedAt:d.updatedAt||d.createdAt||Date.now()}))};}
    if(!config.github.pat)config.github.pat=localStorage.getItem(TOKEN_KEY)||""; persist();
  }
  function persist(){localStorage.setItem(KEY,JSON.stringify(config));localStorage.setItem(TOKEN_KEY,config.github.pat||"");applyTheme()}
  function applyTheme(){Object.entries(config.theme||{}).forEach(([k,v])=>{const map={sidebar:"sidebar-bg",accentSoft:"accent-soft"};if(validHex(v))document.documentElement.style.setProperty(`--${map[k]||k}`,v)});$("#portalName").textContent=config.portalName;document.title=`${config.portalName} Portal`}
  function notify(s){const t=$("#toast");t.textContent=s;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
  function sync(s,kind=""){$("#syncState").textContent=s;$("#syncState").className=`sync-state ${kind}`}
  async function fetchJson(path){const r=await fetch(path,{cache:"no-store"});if(!r.ok)throw new Error(`${r.status} loading ${path}`);return r.json()}
  const boardPath=n=>`${typeof repoCfg.pathPrefix==="string"?repoCfg.pathPrefix:""}${slug(n)}.json`;
  const indexedBoards=()=>Array.isArray(index.boards)?index.boards.filter(b=>!b.archived):[];
  const boards=()=>indexedBoards().filter(b=>Object.hasOwn(boardData,b.name)), cards=n=>boardData[n]?.cards||[];
  const defaultBoard=()=>boards().find(b=>b.name===index.activeBoard)?.name||boards()[0]?.name||"";
  function stages(n){const b=boardData[n]||{};return [...new Set([...(b.stages||b.lanes||[]).map(x=>typeof x==="string"?x:x.name),...cards(n).map(c=>c.stage||c.lane||"Backlog")])].filter(Boolean)}
  const options=(values,selected,blank="")=>`${blank?`<option value="">${esc(blank)}</option>`:""}${values.map(v=>`<option value="${esc(v)}" ${v===selected?"selected":""}>${esc(v)}</option>`).join("")}`;
  const boardOptions=s=>options(boards().map(b=>b.name),s,"Select board");
  const axisOptions=s=>options(AXES,s,"Select field");
  const value=(c,f)=>String(c?.[f]??(f==="stage"?c?.lane:"")).trim()||"Unassigned";
  const activeDefs=()=>config.matrices.filter(d=>!d.deletedAt);

  async function boot(){migrate();repoCfg=await fetchJson(FILES.switch).catch(()=>({}));index=await fetchJson(FILES.index);if(!Array.isArray(index.boards))throw new Error(`${FILES.index} does not contain a boards array.`);const failures=[];await Promise.all(indexedBoards().map(async b=>{const path=boardPath(b.name);try{const data=await fetchJson(path);if(!data||typeof data!=="object"||!Array.isArray(data.cards))throw new Error("invalid board data");boardData[b.name]=data}catch(e){failures.push(`${b.name} (${path}: ${e.message})`)}}));if(!boards().length)throw new Error(`No board data could be loaded.${failures.length?` ${failures.join("; ")}`:""}`);bindShell();setSidebar(!config.sidebarCollapsed);const status=`${boards().length} board${boards().length===1?"":"s"} ready${failures.length?` · ${failures.length} unavailable`:""}`;sync(status,failures.length?"error":"");$("#syncState").title=failures.join("\n");openApp(APP_NAMES[config.selectedApp]?config.selectedApp:"matrix")}

  function colorRow(key,name,color,type){return `<div class="color-row" data-${type}="${esc(key)}"><span class="swatch" style="background:${esc(color)}" aria-label="Current ${esc(name)}"></span><label>${esc(name)}<input type="text" value="${esc(color)}" aria-label="${esc(name)} hex"></label><input type="color" value="${esc(color)}" aria-label="Pick ${esc(name)}"></div>`}
  function presetRow(p,i){return `<div class="color-row" data-preset="${i}"><button class="btn" data-up aria-label="Move preset up">↑</button><button class="btn" data-down aria-label="Move preset down">↓</button><span class="swatch" style="background:${esc(p.color)}"></span><input data-name value="${esc(p.name||"")}" aria-label="Preset name"><input data-hex value="${esc(p.color)}" aria-label="Preset hex"><input type="color" value="${esc(p.color)}" aria-label="Preset color"><button class="btn danger" data-remove aria-label="Remove preset">×</button></div>`}
  function wireColors(root){$$('[data-theme]',root).forEach(row=>{const key=row.dataset.theme,text=$('input[type=text]',row),pick=$('input[type=color]',row),swatch=$(".swatch",row);const apply=v=>{if(!validHex(v)){text.setAttribute("aria-invalid","true");return}text.removeAttribute("aria-invalid");config.theme[key]=v.toLowerCase();pick.value=v;swatch.style.background=v;persist()};text.onchange=()=>apply(text.value);pick.oninput=()=>{text.value=pick.value;apply(pick.value)}});$$('[data-preset]',root).forEach(row=>{const i=+row.dataset.preset,name=$('[data-name]',row),hex=$('[data-hex]',row),pick=$('input[type=color]',row),swatch=$(".swatch",row);name.onchange=()=>{config.cardColors[i].name=name.value;persist()};const apply=v=>{if(!validHex(v)){hex.setAttribute("aria-invalid","true");return}hex.removeAttribute("aria-invalid");config.cardColors[i].color=v;hex.value=v;pick.value=v;swatch.style.background=v;persist()};hex.onchange=()=>apply(hex.value);pick.oninput=()=>apply(pick.value);$('[data-remove]',row).onclick=()=>{config.cardColors.splice(i,1);persist();renderConfig()};$('[data-up]',row).onclick=()=>reorderPreset(i,i-1);$('[data-down]',row).onclick=()=>reorderPreset(i,i+1)})}
  function reorderPreset(from,to){if(to<0||to>=config.cardColors.length)return;config.cardColors.splice(to,0,config.cardColors.splice(from,1)[0]);persist();renderConfig()}
  function confirmAction(message,fn){const d=$("#confirmDialog");d.innerHTML=`<form method="dialog" class="dialog-body"><h2>Confirm change</h2><p>${esc(message)}</p><div class="dialog-actions"><button class="btn" value="cancel">Cancel</button><button class="btn danger" value="yes">Confirm</button></div></form>`;d.onclose=()=>{if(d.returnValue==="yes")fn()};d.showModal()}
  function exportConfig(){const blob=new Blob([JSON.stringify(config,null,2)+"\n"],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${slug(config.portalName)||"program"}-configuration.json`;a.click();URL.revokeObjectURL(a.href)}
  function validateImport(x){if(!x||typeof x!=="object"||x.version!==3)return "Expected a version 3 configuration object.";if(typeof x.portalName!=="string"||!x.github||typeof x.github!=="object")return "Portal name or GitHub settings are invalid.";if(!x.theme||Object.keys(THEME).some(k=>!validHex(x.theme[k])))return "Every theme color must be a six-digit hex color.";if(!Array.isArray(x.cardColors)||x.cardColors.some(p=>typeof p.name!=="string"||!validHex(p.color)))return "Card-color presets are invalid.";if(!Array.isArray(x.matrices)||x.matrices.some(d=>typeof d.id!=="string"||typeof d.name!=="string"||validateDefinition(d)))return "Matrix definitions are invalid.";if(!APP_NAMES[x.selectedApp]||typeof x.sidebarCollapsed!=="boolean")return "Selected application or sidebar state is invalid.";return ""}
  async function importFile(e){const out=$("[data-import-message]",$("#view"));try{pendingImport=JSON.parse(await e.target.files[0].text());const error=validateImport(pendingImport);if(error)throw new Error(error);confirmAction("Replace all portal settings, matrix definitions, theme, and PAT with this file?",()=>{config=pendingImport;persist();setSidebar(!config.sidebarCollapsed);openApp(config.selectedApp);notify("Configuration imported")})}catch(err){out.innerHTML=`<p class="message error">Import failed: ${esc(err.message)}</p>`}finally{e.target.value=""}}

  async function githubFetch(url,options={}){const token=config.github.pat?.trim()||localStorage.getItem(TOKEN_KEY)?.trim();if(!token)throw new Error("Add a GitHub PAT in Configuration and retry.");const r=await fetch(url,{...options,headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,...options.headers}});if(!r.ok)throw new Error(`GitHub returned ${r.status} ${r.statusText}`);return r.status===204?{}:r.json()}
  const b64=s=>btoa(unescape(encodeURIComponent(s)));
  async function putJson(path,data,message){const base=`https://api.github.com/repos/${encodeURIComponent(config.github.owner)}/${encodeURIComponent(config.github.repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`,ref=`?ref=${encodeURIComponent(config.github.branch)}`;let sha;try{sha=(await githubFetch(base+ref)).sha}catch(e){if(!e.message.includes("404"))throw e}await githubFetch(base,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,content:b64(JSON.stringify(data,null,2)+"\n"),branch:config.github.branch,...(sha?{sha}:{})})})}
  function saveBoards(names,message,withIndex=false){const unique=[...new Set(names)];saveQueue=saveQueue.catch(()=>{}).then(async()=>{sync("Saving…");for(const name of unique)await putJson(boardPath(name),boardData[name],message);if(withIndex)await putJson(FILES.index,index,message);sync("Saved");notify("Saved to GitHub")}).catch(e=>{sync(`Save failed — ${e.message}`,"error");notify("Save failed. Fix Configuration and retry by making another update.")});return saveQueue}

  /* Mello interaction model -------------------------------------------------
     Matrix axis order, lane visibility, and card visibility are deliberately
     separate persisted maps. Closing a lane never changes any card's state. */
  function melloState(){
    config.matrixOrder ||= {};
    config.cardOpen ||= {};
    config.laneOpen ||= {};
    return config;
  }
  function cardStateKey(board,id){return `${board}::${id}`}
  function laneStateKey(board,stage){return `${board}::${stage}`}
  function orderKey(def,axis){return `${def.board}::${axis}::${def[axis]}`}
  function orderedValues(list,field,def,axis){
    const values=[...new Set(list.map(c=>value(c,field)))];
    const saved=melloState().matrixOrder[orderKey(def,axis)]||[];
    return [...saved.filter(v=>values.includes(v)),...values.filter(v=>!saved.includes(v)).sort((a,b)=>a.localeCompare(b))];
  }
  function allFieldValues(board,field){return [...new Set(cards(board).map(c=>value(c,field)).filter(v=>v!=="Unassigned"))].sort()}
  function cardMarkup(c,board,def){
    const primary=value(c,def.intersection||"title"), key=cardStateKey(board,c.id), open=melloState().cardOpen[key]===true;
    const tags=(c.tags||[]).filter(Boolean), known=[...new Set(cards(board).flatMap(x=>x.tags||[]))].filter(t=>!tags.includes(t)).slice(0,6);
    return `<article class="card ${open?'is-open':''}" draggable="${open?'false':'true'}" tabindex="0" data-card="${esc(c.id)}" data-board="${esc(board)}" style="--card-color:${esc(cardColor(c))}">
      <div class="card-summary"><button class="card-toggle" type="button" aria-expanded="${open}" aria-label="${open?'Close':'Open'} card">${open?'−':'+'}</button><button class="card-title" type="button">${esc(primary)}</button></div>
      <form class="card-editor" data-inline-editor novalidate>
        <label class="wide">Title<input name="title" required value="${esc(c.title)}"></label>
        <label>Platform<select name="platform" required>${options(allFieldValues(board,'platform'),c.platform,'Choose platform')}</select></label>
        <label>Stage<select name="stage" required>${options(stages(board),c.stage||c.lane,'Choose stage')}</select></label>
        <label>Lineage<select name="lineage">${options(allFieldValues(board,'lineage'),c.lineage,'No lineage')}</select></label>
        <label>Status<select name="statusColor"><option value="">No status</option>${options(['green','yellow','red','blue'],c.statusColor)}</select></label>
        <label class="wide">Tags<input name="tags" list="mello-tags-${esc(c.id)}" value="${esc(tags.join(', '))}" placeholder="Comma-separated tags"><datalist id="mello-tags-${esc(c.id)}">${known.map(t=>`<option value="${esc(t)}">`).join('')}</datalist><span class="card-tags-editor">${known.map(t=>`<button class="tag-suggestion" type="button" data-tag="${esc(t)}">+ ${esc(t)}</button>`).join('')}</span></label>
        <label class="wide">Development link<input name="dev" type="url" value="${esc(c.dev)}" placeholder="https://"></label>
        <label class="wide">Live link<input name="live" type="url" value="${esc(c.live)}" placeholder="https://"></label>
        <label class="wide">Notes<textarea name="notes">${esc(c.notes)}</textarea></label>
      </form></article>`;
  }
  function saveInlineCard(el){
    const c=cards(el.dataset.board).find(x=>String(x.id)===String(el.dataset.card)), form=$('[data-inline-editor]',el); if(!c||!form||!form.reportValidity())return;
    const f=new FormData(form); Object.assign(c,{title:f.get('title').trim(),platform:f.get('platform'),stage:f.get('stage'),lineage:f.get('lineage'),statusColor:f.get('statusColor'),tags:f.get('tags').split(',').map(x=>x.trim()).filter(Boolean),dev:f.get('dev').trim(),live:f.get('live').trim(),notes:f.get('notes'),updatedAt:new Date().toISOString()});
    if('lane' in c)c.lane=c.stage; persist(); saveBoards([el.dataset.board],`Update ${c.title||c.id}`); notify('Card saved');
  }
  function wireCards(root){$$('.card',root).forEach(el=>{
    const toggle=$('.card-toggle',el); toggle.onclick=e=>{e.stopPropagation();const key=cardStateKey(el.dataset.board,el.dataset.card);melloState().cardOpen[key]=!el.classList.contains('is-open');persist();rerender()};
    $('.card-title',el).onclick=e=>{e.stopPropagation();toggle.click()};
    if(el.draggable){el.ondragstart=()=>{drag={board:el.dataset.board,id:el.dataset.card};el.classList.add('selected')};el.ondragend=()=>{drag=null;el.classList.remove('selected')}}
    const form=$('[data-inline-editor]',el);if(form){form.onchange=()=>saveInlineCard(el);form.onsubmit=e=>e.preventDefault();$$('[data-tag]',form).forEach(b=>b.onclick=()=>{const input=$('[name=tags]',form),set=new Set(input.value.split(',').map(x=>x.trim()).filter(Boolean));set.add(b.dataset.tag);input.value=[...set].join(', ');saveInlineCard(el);b.remove()})}
  })}
  function drawMatrix(root,def,zValue="",context="matrix"){
    let list=cards(def.board);if(def.z&&zValue)list=list.filter(c=>value(c,def.z)===zValue);const xs=orderedValues(list,def.x,def,'x'),ys=orderedValues(list,def.y,def,'y');
    if(!xs.length||!ys.length){root.innerHTML='<div class="empty">No cards match this matrix.</div>';return}root.dataset.context=context;root.style.setProperty('--matrix-columns',xs.length);root.style.setProperty('--matrix-rows',ys.length);
    root.innerHTML=`<div class="matrix-corner">${esc(def.y)} ↓ / ${esc(def.x)} →</div>${xs.map(x=>`<div class="matrix-header" draggable="true" data-axis="x" data-value="${esc(x)}">${esc(x)}</div>`).join('')}`;
    ys.forEach(y=>{root.insertAdjacentHTML('beforeend',`<div class="matrix-rowhead" draggable="true" data-axis="y" data-value="${esc(y)}">${esc(y)}</div>`);xs.forEach(x=>{const cs=list.filter(c=>value(c,def.x)===x&&value(c,def.y)===y).sort((a,b)=>(a.matrixPosition??a.position??0)-(b.matrixPosition??b.position??0));root.insertAdjacentHTML('beforeend',`<div class="matrix-cell" data-board="${esc(def.board)}" data-x="${esc(x)}" data-y="${esc(y)}" data-context="${context}">${cs.map(c=>cardMarkup(c,def.board,def)).join('')}</div>`)})});
    wireCards(root);wireDrops(root,'.matrix-cell',(el,d)=>moveMatrixCard(d,def,el.dataset.x,el.dataset.y));wireAxisOrder(root,def,xs,ys);
  }
  function wireAxisOrder(root,def,xs,ys){let moving=null;$$('[data-axis]',root).forEach(el=>{el.ondragstart=e=>{moving={axis:el.dataset.axis,value:el.dataset.value};e.dataTransfer.setData('text/mello-axis',JSON.stringify(moving));el.classList.add('axis-dragging')};el.ondragover=e=>{if(moving?.axis===el.dataset.axis){e.preventDefault();e.stopPropagation();el.classList.add('axis-drop')}};el.ondragleave=()=>el.classList.remove('axis-drop');el.ondrop=e=>{if(!moving||moving.axis!==el.dataset.axis)return;e.preventDefault();e.stopPropagation();const values=[...(moving.axis==='x'?xs:ys)],from=values.indexOf(moving.value),to=values.indexOf(el.dataset.value);values.splice(to,0,values.splice(from,1)[0]);melloState().matrixOrder[orderKey(def,moving.axis)]=values;persist();drawMatrix(root,def,'',root.dataset.context)};el.ondragend=()=>{moving=null;el.classList.remove('axis-dragging')}})}
  function drawPane(root,side){const board=state[side],other=state[side==='left'?'right':'left'],pane=$(`[data-side=${side}]`,root);pane.innerHTML=`<div class="control"><label>${side} board<select>${boards().map(b=>`<option value="${esc(b.name)}" ${b.name===board?'selected':''} ${b.name===other?'disabled':''}>${esc(b.name)}</option>`).join('')}</select></label></div><div class="mini-board">${stages(board).map(st=>{const open=melloState().laneOpen[laneStateKey(board,st)]!==false;return `<div class="lane ${open?'':'is-closed'}" data-board="${esc(board)}" data-stage="${esc(st)}"><div class="lane-head"><h3>${esc(st)}</h3><button class="lane-toggle" aria-expanded="${open}" type="button">${open?'−':'+'}</button></div><div class="lane-cards">${cards(board).filter(c=>(c.stage||c.lane||'Backlog')===st).sort((a,b)=>(a.position??a.pos??0)-(b.position??b.pos??0)).map(c=>cardMarkup(c,board,{intersection:'title',fields:['platform','stage']})).join('')}</div></div>`}).join('')}</div>`;$('select',pane).onchange=e=>{state[side]=e.target.value;renderTransfer()};$$('.lane-toggle',pane).forEach(b=>b.onclick=e=>{e.stopPropagation();const lane=b.closest('.lane'),key=laneStateKey(lane.dataset.board,lane.dataset.stage);melloState().laneOpen[key]=lane.classList.contains('is-closed');persist();renderTransfer()})}

  window.addEventListener("keydown",e=>{if(e.key==="Escape")$(".color-menu")?.remove()});
  boot().catch(e=>{sync("Portal failed to load","error");$("#view").innerHTML=`<div class="panel empty"><b>Mello could not start.</b><br>${esc(e.message)}</div>`;bindShell()});
})();

</script>
