<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chat Admin</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e2e8f0}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:#fff;min-height:100%}
header{padding:16px 18px 10px;border-bottom:1px solid rgba(226,232,240,.9)}
header h1{margin:0;font-size:19px;color:#0f172a}
header p{margin:2px 0 0;font-size:12px;color:#94a3b8}

.tabs{display:flex;border-bottom:1px solid rgba(226,232,240,.9)}
.tab{flex:1;padding:13px 4px;font-size:14px;font-weight:700;color:#94a3b8;background:none;border:none;border-bottom:2px solid transparent}
.tab.on{color:#3b82f6;border-color:#3b82f6}

#tab-rooms{display:flex;flex-direction:column;flex:1;min-height:0}
.top{flex:0 0 auto;max-height:44vh;overflow-y:auto;padding:14px 16px 8px;border-bottom:1px solid rgba(226,232,240,.9)}
.bottom{flex:1;overflow-y:auto;padding:14px 16px 24px;min-height:0}

.trashtoggle{display:flex;align-items:center;gap:5px;background:none;border:none;color:#64748b;font-size:12px;font-weight:600;padding:4px 0;margin-bottom:6px}
.trashtoggle .chev{display:inline-block;transition:transform .15s}
.trashempty{font-size:12px;color:#94a3b8;padding:8px 0}
.trashrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(226,232,240,.6)}
#trash-box{margin-bottom:10px}

.convgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.convcard{border:1px solid rgba(226,232,240,.95);border-radius:12px;padding:10px;background:#fff;position:relative}
.convcard.sel{border-color:#3b82f6;background:#eff6ff;box-shadow:0 0 0 2px rgba(59,130,246,.25)}
.ccpair{font-size:20px;line-height:1}
.ccname{font-size:12px;font-weight:600;color:#0f172a;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cclaunch{width:100%;margin-top:8px;padding:6px;border-radius:8px;border:1px solid rgba(59,130,246,.4);
  background:#eff6ff;color:#1d4ed8;font-size:11px;font-weight:700}

.cfgbtn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:15px;margin-top:8px}
.cfgbtn.primary{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff}
.cfgbtn.ghost{background:#f1f5f9;color:#475569;border:1px solid rgba(226,232,240,.95)}
.convdel{width:28px;height:28px;border-radius:999px;border:1px solid rgba(203,213,225,.8);background:#f8fafc;color:#94a3b8;font-size:13px;padding:0;flex:0 0 28px}
.convdel:active{color:#ef4444;border-color:#ef4444}

.editbar{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;background:#fff;padding-bottom:8px}
.ebtn{flex:1;height:42px;border-radius:10px;font-weight:700;font-size:14px;border:1px solid rgba(203,213,225,.9)}
.ebtn.cancel{background:#f1f5f9;color:#475569}
.ebtn.save{background:linear-gradient(135deg,rgba(96,165,250,.95),rgba(59,130,246,.95));color:#fff;border-color:transparent}

.cfglab{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.cfgrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cfgrow label{flex:0 0 70px;font-size:13px;color:#475569}
.cfgrow select,.cfgrow input[type=text],.cfgrow input[type=password],.cfgrow input[type=number]{
  flex:1;min-width:0;padding:9px 10px;border:1px solid rgba(226,232,240,.95);border-radius:10px;font-size:14px}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.swatch{height:34px;border-radius:8px;border:2px solid transparent;padding:0}
.swatch.on{border-color:#3b82f6}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);z-index:95;
  background:rgba(15,23,42,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header><h1>Chat Admin</h1><p>Create and launch tabletop conversations</p></header>
<div class="tabs">
  <button type="button" class="tab on" data-tab="rooms">Rooms</button>
  <button type="button" class="tab" data-tab="global">Global</button>
</div>

<div id="tab-rooms">
  <div class="top">
    <button type="button" class="trashtoggle" id="trash-toggle"><span class="chev">▾</span> Trash</button>
    <div id="trash-box" style="display:none"><div id="trash-list"></div></div>
    <div id="conv-list" class="convgrid"></div>
    <button type="button" class="cfgbtn ghost" id="conv-new">＋ New room</button>
  </div>
  <div class="bottom">
    <div class="editbar">
      <button type="button" class="ebtn cancel" id="cfg-cancel">Cancel</button>
      <button type="button" class="ebtn save" id="cfg-save">Save</button>
    </div>
    <div class="cfglab">Name</div>
    <div class="cfgrow"><input type="text" id="cfg-thread-name" placeholder="🏳️🏳️" maxlength="30"></div>
    <div class="cfglab">Languages</div>
    <div class="cfgrow"><label>South</label><select id="cfg-south-lang"></select></div>
    <div class="cfgrow"><label>North</label><select id="cfg-north-lang"></select></div>
    <div class="cfglab">South bubble colour</div>
    <div class="swatches" id="sw-south"></div>
    <div class="cfglab">North bubble colour</div>
    <div class="swatches" id="sw-north"></div>
    <div class="cfglab">Font colour</div>
    <div class="swatches" id="sw-font"></div>
    <div class="cfglab">Font size</div>
    <div class="cfgrow"><label>Size (px)</label><input type="number" id="cfg-font-size" min="12" max="24" value="15"></div>
    <button type="button" class="cfgbtn primary" id="launch-btn">Launch this room →</button>
  </div>
</div>

<div id="tab-global" style="display:none;padding:14px 16px">
  <div class="cfglab">Calling &amp; Sync Keys</div>
  <div class="cfgrow"><label>Deepgram</label>
    <input type="password" id="cfg-dg" autocomplete="new-password" role="presentation" placeholder="Paste key…"></div>
  <div class="cfgrow"><label>GitHub PAT</label>
    <input type="password" id="cfg-pat" autocomplete="new-password" role="presentation" placeholder="Not active yet"></div>
  <button type="button" class="cfgbtn primary" id="cfg-keys-save">Save keys</button>
</div>

<div id="toast"></div>

<script>
(function chatAdmin(){
    'use strict';
    var LANG_NAMES={en:'English',th:'Thai',es:'Spanish',ja:'Japanese',ko:'Korean',zh:'Chinese (Simplified)',
      ar:'Arabic',hi:'Hindi',ru:'Russian',fr:'French',de:'German',it:'Italian',pt:'Portuguese',
      vi:'Vietnamese',id:'Indonesian',ms:'Malay',fil:'Filipino',nl:'Dutch',sv:'Swedish',pl:'Polish',tr:'Turkish'};
    var LANG_FLAGS={en:'🇺🇸',th:'🇹🇭',es:'🇪🇸',ja:'🇯🇵',ko:'🇰🇷',zh:'🇨🇳',ar:'🇸🇦',hi:'🇮🇳',ru:'🇷🇺',
      fr:'🇫🇷',de:'🇩🇪',it:'🇮🇹',pt:'🇧🇷',vi:'🇻🇳',id:'🇮🇩',ms:'🇲🇾',fil:'🇵🇭',nl:'🇳🇱',sv:'🇸🇪',pl:'🇵🇱',tr:'🇹🇷'};
    var BG_SWATCHES=['#eff6ff','#f0fdf4','#fef3c7','#fee2e2','#f3e8ff','#ffffff'];
    var FONT_SWATCHES=['#0f172a','#1e293b','#334155','#7f1d1d','#1e3a8a','#14532d'];
    var DEFAULT_S='#eff6ff', DEFAULT_N='#f0fdf4', DEFAULT_FONT='#0f172a';

    function $(id){return document.getElementById(id)}
    function toastMsg(m){var e=$('toast');if(!e)return;e.textContent=m;e.classList.add('show');
        clearTimeout(toastMsg._t);toastMsg._t=setTimeout(function(){e.classList.remove('show')},2000)}

    /* ---- storage: SAME KEYS chat.html reads — this is the only writer ---- */
    var IDX_KEY='duck_rooms_index';
    var rooms=[];
    function loadRooms(){try{rooms=JSON.parse(localStorage.getItem(IDX_KEY)||'[]')}catch(e){rooms=[]}if(!Array.isArray(rooms))rooms=[]}
    function saveRooms(){try{localStorage.setItem(IDX_KEY,JSON.stringify(rooms))}catch(e){}}
    function newId(){
        var a=new Uint8Array(16);(crypto||window.crypto).getRandomValues(a);
        return Array.from(a,function(b){return b.toString(36)}).join('').slice(0,22);
    }
    function activeRooms(){return rooms.filter(function(r){return !r.trashedAt})}
    function trashedRooms(){return rooms.filter(function(r){return r.trashedAt})}
    function roomLabel(r){return r.label||((LANG_FLAGS[r.southLang]||'')+(LANG_FLAGS[r.northLang]||''))}

    var selected=null, editBuf=null;

    function loadEditBuf(){
        var r=rooms.filter(function(x){return x.id===selected})[0];
        editBuf=r?{southLang:r.southLang,northLang:r.northLang,southBg:r.southBg,northBg:r.northBg,
                    fontColor:r.fontColor,fontSize:r.fontSize,label:r.label}
                 :{southLang:'en',northLang:'th',southBg:DEFAULT_S,northBg:DEFAULT_N,
                    fontColor:DEFAULT_FONT,fontSize:15,label:null};
        paintEditBuf();
    }
    function paintEditBuf(){
        var ll=$('cfg-south-lang'), nl=$('cfg-north-lang');
        if(!ll.options.length){[ll,nl].forEach(function(sel){
            Object.keys(LANG_NAMES).forEach(function(c){var o=document.createElement('option');o.value=c;
                o.textContent=(LANG_FLAGS[c]||'')+'  '+LANG_NAMES[c];sel.appendChild(o)});
        })}
        ll.value=editBuf.southLang;nl.value=editBuf.northLang;
        var nameInp=$('cfg-thread-name');
        nameInp.value=editBuf.label||'';
        nameInp.placeholder=(LANG_FLAGS[editBuf.southLang]||'')+(LANG_FLAGS[editBuf.northLang]||'');
        $('cfg-font-size').value=editBuf.fontSize||15;
        buildSwatches();
    }
    function buildSwatches(){
        [['sw-south','southBg',BG_SWATCHES],['sw-north','northBg',BG_SWATCHES],['sw-font','fontColor',FONT_SWATCHES]]
        .forEach(function(p){
            var host=$(p[0]);host.innerHTML='';
            p[2].forEach(function(c){
                var b=document.createElement('button');b.type='button';
                b.className='swatch'+(editBuf[p[1]]===c?' on':'');b.style.background=c;
                b.addEventListener('click',function(){editBuf[p[1]]=c;buildSwatches()});
                host.appendChild(b);
            });
        });
    }
    function commitEditBuf(){
        var r=rooms.filter(function(x){return x.id===selected})[0];if(!r)return;
        r.southLang=editBuf.southLang;r.northLang=editBuf.northLang;
        r.southBg=editBuf.southBg;r.northBg=editBuf.northBg;
        r.fontColor=editBuf.fontColor;r.fontSize=parseInt($('cfg-font-size').value,10)||15;
        r.label=editBuf.label||null;
        saveRooms();
    }

    function renderRoomList(){
        var host=$('conv-list');host.innerHTML='';
        activeRooms().slice().reverse().forEach(function(r){
            var card=document.createElement('div');
            card.className='convcard'+(r.id===selected?' sel':'');
            var pair=(LANG_FLAGS[r.southLang]||'')+(LANG_FLAGS[r.northLang]||'');
            card.innerHTML='<div class="ccpair">'+pair+'</div><div class="ccname">'+
                String(roomLabel(r)).replace(/[&<>]/g,'')+'</div>';
            card.addEventListener('click',function(){selected=r.id;loadEditBuf();renderRoomList()});
            var launch=document.createElement('button');launch.type='button';launch.className='cclaunch';
            launch.textContent='Launch →';
            launch.addEventListener('click',function(ev){ev.stopPropagation();launchRoom(r.id)});
            card.appendChild(launch);
            host.appendChild(card);
        });
        if(!activeRooms().length)host.innerHTML='<div class="trashempty">No rooms yet — tap New room.</div>';
    }
    function renderTrashList(){
        var host=$('trash-list');var items=trashedRooms();host.innerHTML='';
        if(!items.length){host.innerHTML='<div class="trashempty">Trash is empty</div>';return}
        items.forEach(function(r){
            var row=document.createElement('div');row.className='trashrow';
            row.innerHTML='<div style="flex:1;font-size:13px;font-weight:600">'+
                String(roomLabel(r)).replace(/[&<>]/g,'')+'</div>';
            var restore=document.createElement('button');restore.type='button';restore.className='cfgbtn ghost';
            restore.style.cssText='width:auto;padding:6px 10px;font-size:12px;margin:0';restore.textContent='Restore';
            restore.addEventListener('click',function(){delete r.trashedAt;saveRooms();renderRoomList();renderTrashList()});
            var purge=document.createElement('button');purge.type='button';purge.className='convdel';purge.textContent='✕';
            purge.title='Delete permanently';
            purge.addEventListener('click',function(){
                if(!confirm('Delete this room permanently? Its conversation history is deleted too. This cannot be undone.'))return;
                try{localStorage.removeItem('duck_room_'+r.id)}catch(e){}
                rooms=rooms.filter(function(x){return x.id!==r.id});saveRooms();renderTrashList();
            });
            row.appendChild(restore);row.appendChild(purge);
            host.appendChild(row);
        });
    }

    function launchRoom(id){location.href='chat.html?room='+encodeURIComponent(id)}

    function boot(){
        loadRooms();
        if(activeRooms().length){selected=activeRooms()[activeRooms().length-1].id}
        loadEditBuf();renderRoomList();renderTrashList();

        document.querySelectorAll('.tab').forEach(function(t){
            t.addEventListener('click',function(){
                document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===t)});
                $('tab-rooms').style.display=t.dataset.tab==='rooms'?'':'none';
                $('tab-global').style.display=t.dataset.tab==='global'?'':'none';
            });
        });

        $('trash-toggle').addEventListener('click',function(){
            var box=$('trash-box'),open=box.style.display!=='none';
            box.style.display=open?'none':'block';
            this.querySelector('.chev').style.transform=open?'':'rotate(180deg)';
        });

        var nameInp=$('cfg-thread-name');
        function commitName(){editBuf.label=nameInp.value.trim()||null;renderRoomList()}
        nameInp.addEventListener('blur',commitName);
        nameInp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commitName();nameInp.blur()}});
        $('cfg-south-lang').addEventListener('change',function(){editBuf.southLang=this.value});
        $('cfg-north-lang').addEventListener('change',function(){editBuf.northLang=this.value});

        $('conv-new').addEventListener('click',function(){
            var id=newId();
            rooms.push({id:id,createdAt:Date.now(),count:0,label:null,
                southLang:'en',northLang:'th',southBg:DEFAULT_S,northBg:DEFAULT_N,
                fontColor:DEFAULT_FONT,fontSize:15});
            saveRooms();selected=id;loadEditBuf();renderRoomList();
            toastMsg('New room created');
        });

        $('cfg-save').addEventListener('click',function(){
            if(!selected){toastMsg('Select or create a room first');return}
            commitEditBuf();renderRoomList();toastMsg('Saved');
        });
        $('cfg-cancel').addEventListener('click',function(){loadEditBuf()});

        $('launch-btn').addEventListener('click',function(){
            if(!selected){toastMsg('Select or create a room first');return}
            commitEditBuf();launchRoom(selected);
        });

        $('cfg-keys-save').addEventListener('click',function(){
            var dg=$('cfg-dg').value.trim(), pat=$('cfg-pat').value.trim();
            try{if(dg)localStorage.setItem('tb_dg_key',dg);if(pat)localStorage.setItem('duck_gh_pat',pat)}catch(e){}
            toastMsg('Keys saved');
        });
        $('cfg-dg').value=(function(){try{return localStorage.getItem('tb_dg_key')||''}catch(e){return ''}})();
        $('cfg-pat').value=(function(){try{return localStorage.getItem('duck_gh_pat')||''}catch(e){return ''}})();
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();

    if(typeof window!=='undefined'){window.rooms=rooms;window.newId=newId;window.loadRooms=loadRooms;
        window.saveRooms=saveRooms;window.activeRooms=activeRooms;window.trashedRooms=trashedRooms;}
})();
</script>
</body>
</html>
