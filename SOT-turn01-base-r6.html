'}`)}${section(p,'activity','Activity / diagnostics',`${events.length} recent events`,`<div>${events.slice(0,100).map(e=>`<div class="event"><b>${esc(e.event_type||e.type||e.state||'event')}</b><span>${esc(e.created_at||e.timestamp||'')}</span></div>`).join('')||'No recent activity.'}</div>${m.fail?`<div class="errorDetail"><b>Technical detail</b><br>${esc(m.fail)}</div>`:''}`)}`;document.querySelectorAll('details[data-section]').forEach(d=>d.ontoggle=()=>rememberDetails(p.project_token));document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>doAction({...m,kind:b.dataset.do}));$('nextAction').onclick=()=>doAction(m)}function section(p,id,title,sum,body){let k=openKey(p.project_token,id),open=state.open[k]??(id==='setup'||id==='index');return `<details class="section" data-section="${id}" ${open?'open':''}><summary>${title}<span class="sum">${esc(sum)}</span></summary><div class="sectionBody">${body}</div></details>`}function renderOverview(){let ms=state.projects.map(p=>({p,m:model(p)})),attention=ms.filter(x=>/Needs|attention|Paused/i.test(x.m.title));$('surface').innerHTML=`<h1>SSOT Overview</h1><div class="projectMeta">One reconciliation view across every project SOT.</div><div class="statusBox"><div class="eyebrow">STORAGE ESTATE</div><h2>${attention.length?`${attention.length} project${attention.length===1?'':'s'} need attention`:'No immediate attention required'}</h2><p>Each item below states what is true, what is missing, and the direct next action.</p></div><div class="grid3" style="margin-top:10px">${ms.map(({p,m})=>`<div class="box"><h3>${esc(p.project_name)}</h3><b>${esc(m.title)}</b><div class="path">${esc(m.desc)}</div><button class="btn ${/Needs|attention/i.test(m.title)?'primary':''}" data-over="${esc(p.project_token)}" style="margin-top:8px">${esc(m.action)}</button></div>`).join('')}</div>`;document.querySelectorAll('[data-over]').forEach(b=>b.onclick=()=>select(b.dataset.over).then(()=>doAction(model(proj()))))}async function select(t){st ,role,selected){let multi=role==='sources',vols=state.volumes||[],current=selected[0]||'',data=null;modal(role==='sources'?'Choose Sources':role==='target'?'Choose Target':'Choose Backup','<div id="pickMount">Loading storage…</div>');let root=$('pickMount');async function browse(path){current=path;data=await api(`/turn01/fs?path=${encodeURIComponent(path)}`);draw()}function draw(){root.innerHTML=`<div class="picker"><div class="pane"><div class="paneHead">Volumes</div>${vols.map(v=>`<button class="pick ${current.startsWith(v.path)?'active':''}" data-vol="${esc(v.path)}">${esc(v.name||v.path)}<br><small>${bytes(v.free_bytes)} free</small></button>`).join('')}</div><div class="pane"><div class="paneHead">Folders · ${esc(data?.path||'')}</div>${data?.parent?`<div class="folder"><button data-browse="${esc(data.parent)}">..</button><span></span></div>`:''}${(data?.folders||[]).map(f=>`<div class="folder"><button data-browse="${esc(f.path)}">${esc(f.name||f.path)}</button><button class="btn" data-add="${esc(f.path)}">Use</button></div>`).join('')}</div><div class="pane"><div class="paneHead">Selected</div>${selected.map(x=>`<div class="selected"><span>${esc(x)}</span><button class="btn" data-remove="${esc(x)}">×</button></div>`).join('')||'<div class="selected">Nothing selected</div>'}<div style="padding:8px"><button id="savePick" class="btn primary" ${selected.length?'':'disabled'}>Save ${role==='sources'?'Sources':role==='target'?'Target':'Backup'}</button></div></div></div>`;document.querySelectorAll('[data-vol]').forEach(b=>b.onclick=()=>browse(b.dataset.vol));document.querySelectorAll('[data-browse]').forEach(b=>b.onclick=()=>browse(b.dataset.browse));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let x=b.dataset.add;if(multi){if(!selected.includes(x))selected.push(x)}else selected=[x];draw()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected=selected.filter(x=>x!==b.dataset.remove);draw()});$('savePick').onclick=save}async function save(){let t=encodeURIComponent(p.project_token);if(role==='sources')await api(`/turn01/projects/${t}/sources`,{method:'PUT',body:JSON.stringify({sources:selected})});else{let body={};body[`${role}_root`]=selected[0]||'';await api(`/turn01/projects/${t}/storage`,{method:'PUT',body:JSON.stringify(body)})}closeModal();toast(`${role} saved`);await hydrate(p.project_token);renderCards();ssot();renderProject()}try{if(!vols.length){let v=await api('/turn01/volumes');vols=v.volumes||[];state.volumes=vols}let start=selected[0]||vols[0]?.path;if(!start){root.textContent='No storage volumes available.';return}await browse(start)}catch(e){root.textContent=e.message}}async function load(){let d=await api('/projects');state.projects=d.projects||d||[];if(!state.selected||!state.projects.some(p=>p.project_token===state.selected))state.selected=state.projects[0]?.project_token||'';await Promise.all(state.projects.map(p=>hydrate(p.project_token)));renderCards();ssot();renderProject()}async function poll(){if(state.polling)return;state.polling=true;try{let d=await api('/projects'),next=d.projects||d||[];state.projects=next;for(let p of next){let s=snap(p.project_token);try{s.status=await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`)}catch{}state.snap.set(p.project_token,s)}renderCards();ssot();if(proj())patchLive()}finally{state.polling=false}}function patchLive(){let p=proj(),s=snap(p.project_token),m=model(p,s);let h=document.querySelector('.statusBox h2'),q=document.querySelector('.statusBox p');if(h)h.textContent=m.title;if(q)q.textContent=m.desc;let b=$('nextAction');if(b)b.textContent=m.action}$('search').oninput=e=>{state.query=e.target.value;renderCards()};$('overview').onclick=()=>{state.selected='';localStorage.removeItem('sot.r6.selected');renderCards();renderOverview()};$('refresh').onclick=()=>load().catch(e=>toast(e.message));load().catch(e=>{$('surface').innerHTML=`<div class="errorDetail">${esc(e.message)}</div>`});setInterval(poll,3000);</script></body></html>
