<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Navigator custom displays</title><style>body{margin:0;padding:20px;background:#081321;color:#e6edf5;font:14px system-ui}main{max-width:1200px;margin:auto}h1{font-size:22px}h2{font-size:16px}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}article{min-width:0}.details{color:#91a8bb}a{color:#27d3f5}dialog{max-width:min(90vw,800px);max-height:80vh;background:#0d1b29;color:#e6edf5;border:1px solid #294459;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:8px;background:#173047;color:#e6edf5;border:1px solid #294459;border-radius:6px;cursor:pointer}#status{min-height:22px}</style></head><body><main><h1>Custom chart displays</h1><p>Three independent charts using the same qualified data. Change a chart's horizon or display without affecting the others.</p><p><a href="market-navigator-rebuild-candidate.html">Open Market Navigator</a></p><p id="status">Loading qualified market data…</p><div class="charts"><article><h2>QQQ and WTI</h2><p class="details" id="size-one"></p><div id="one"></div></article><article><h2>Risk, Growth and QQQ</h2><p class="details" id="size-two"></p><div id="two"></div></article><article><h2>Initial unemployment claims</h2><p class="details" id="size-three"></p><div id="three"></div></article></div></main><dialog id="report"><form method="dialog"><button>Close</button></form><pre id="report-text"></pre><button id="copy">Copy</button><button id="download">Download Markdown</button></dialog><script>__MN_STANDALONE__</script><script>
(()=>{'use strict';let charts=[],generation=null,loading=false;const status=document.getElementById('status'),keys=['one','two','three'],widths=[612,480,320],heights=[280,240,200];const options=[{view:'series',anchor:'qqq',series:['qqq','wti'],horizon:'1YR',display:'horizon'},{view:'series',anchor:'risk',series:['risk','growth','qqq'],horizon:'5D',display:'fixed',axes:{left:{series:['risk','growth'],scale:'indexed'},right:{series:['qqq'],scale:'native',label:'QQQ USD'}}},{view:'series',anchor:'initialClaims',series:['initialClaims'],horizon:'1YR',display:'horizon'}];
function markdown(state){return '# Chart display\n\nSeries: '+state.series.join(', ')+'\n\nHorizon: '+state.horizon+'\n\nWindow: '+state.chart.window.startLabel+' to '+state.chart.window.endLabel+'\n\n'+state.chart.series.map(z=>{const last=z.points.at(-1);return '## '+z.full+'\n\nLatest native date: '+(last?new Date(last.sourceT).toISOString().slice(0,10):'Unavailable')+'\n\nDisplay: '+(z.normalization?.mode||'Governed index')+'\n\nAxis: '+z.axisLabel+'\n\nObservations: '+z.points.length}).join('\n\n')}
function download(text,type,name){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),0)}
function info(state){const text=markdown(state);document.getElementById('report-text').textContent=text;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(text);document.getElementById('download').onclick=()=>download(text,'text/markdown','chart-display.md');document.getElementById('report').showModal()}
function action(kind,state){if(kind==='json')download(JSON.stringify(state,null,2),'application/json','chart-display.json');else if(kind==='csv'){const rows=['series,date,value,indexed,axis'];for(const z of state.chart.series)for(const p of z.points)rows.push([z.id,new Date(p.sourceT).toISOString().slice(0,10),p.raw,p.idx,z.axis].join(','));download(rows.join('\n'),'text/csv','chart-display.csv')}else if(kind==='md')download(markdown(state),'text/markdown','chart-display.md');else if(kind==='print')window.print();else info(state)}
function size(index){const host=document.getElementById(keys[index]),width=Math.max(128,Math.min(widths[index],host.parentElement.clientWidth-2));document.getElementById('size-'+keys[index]).textContent=Math.round(width)+' × '+heights[index]+' canvas';return{width,height:heights[index],pixelRatio:'auto'}}
async function load(){if(loading)return;loading=true;status.textContent='Qualifying market data…';try{const broker=globalThis.__mnDataBroker,next=broker?await broker.check():null;if(next&&next.generation===generation){broker.commit(next);status.textContent='Qualified data · '+next.revision;return}const json=async path=>{if(broker)return broker.json(path,next.generation);const r=await fetch('market-navigator-rebuild-data/'+path,{cache:'no-store'});if(!r.ok)throw Error('Qualified data unavailable');return r.json()};const [derived,def,health,catalog,sourceRegistry]=await Promise.all(['market-evidence/derived-indices-persistent-v1.json','data/market-backend/derived-index-definition-persistent-v1.json','market-evidence/health-envelope.json','data/market-backend/data-catalog.json','data/market-backend/source-registry.json'].map(json));const metadata={derived,def,health,catalog,sourceRegistry},cache=new Map(),services={metadata,getSeries:id=>{if(!cache.has(id))cache.set(id,json('market-evidence/series/'+id+'.json'));return cache.get(id)},onInfo:info,onAction:action,actions:['data','print','md','csv','json']};const saved=charts.map(c=>c.getOptions());for(const c of charts)c.destroy();charts=keys.map((key,index)=>MNChart.mount(document.getElementById(key),{...(saved[index]||options[index]),canvas:size(index)},services));await Promise.all(charts.map(c=>c.whenReady()));if(broker)broker.commit(next);generation=next?.generation||'fixture';status.textContent='Qualified data · '+(next?.revision||derived.commonMarketAnchor);globalThis.__mnCustomDisplays={charts,metadata};}catch(error){status.textContent='Repairing market data. This display will retry automatically.';setTimeout(load,15000)}finally{loading=false}}
let frame=0;window.addEventListener('resize',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>charts.forEach((c,index)=>{void c.resize(size(index))}))});window.addEventListener('focus',load);document.addEventListener('visibilitychange',()=>{if(!document.hidden)void load()});setInterval(load,60000);void load();})();
</script></body></html>
