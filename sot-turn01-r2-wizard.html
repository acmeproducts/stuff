<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOT TURN01 R2 Wizard</title><style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#182230;--muted:#667085;--line:#d7dde5;--soft:#eef2f6;--accent:#344054;--good:#137547;--warn:#8a6500;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}.topline{display:flex;gap:10px;align-items:center}.brand{font-weight:900}.build{font:10px ui-monospace,Consolas,monospace;color:var(--muted)}.projectBadge{margin-left:auto;font-weight:800;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.step{border:1px solid var(--line);border-radius:999px;padding:6px 8px;text-align:center;font-size:10px;font-weight:900;color:var(--muted);background:#fafbfc;white-space:nowrap}.step.active{background:var(--accent);border-color:var(--accent);color:#fff}.step.done{background:#eef7f2;color:var(--good);border-color:#b8dcca}.wrap{max-width:1180px;margin:auto;padding:18px 14px 100px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.hero h1{margin:0 0 4px;font-size:24px}.hero p{margin:0;color:var(--muted)}.section{margin-top:14px}.label{display:block;font-size:11px;font-weight:900;margin-bottom:4px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;color:var(--ink)}.textarea{min-height:80px;resize:vertical}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-weight:800;color:var(--ink);cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--bad)}.btn:disabled{opacity:.4;cursor:not-allowed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.metric{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafbfc}.metric small{display:block;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.metric b{display:block;margin-top:3px}.list{border:1px solid var(--line);border-radius:8px;overflow:hidden}.row{padding:9px;border-bottom:1px solid #edf0f2}.row:last-child{border-bottom:0}.projectRow{cursor:pointer}.projectRow:hover{background:#fafbfc}.sourceRow{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center}.mono{font:11px ui-monospace,Consolas,monospace}.muted{color:var(--muted)}.callout{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafbfc}.callout.good{background:#eff8f3;border-color:#b8dcca;color:#0f5f3b}.callout.warn{background:#fff9e8;border-color:#ead59f;color:#755800}.callout.bad{background:#fff1f0;border-color:#f0c0bb;color:#8f231a}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:52vh}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:7px 8px;border-bottom:1px solid #edf0f2;text-align:left;vertical-align:top}.table th{position:sticky;top:0;background:#fafbfc;font-size:9px;text-transform:uppercase;color:var(--muted)}.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;z-index:40}.footerIn{max-width:1180px;margin:auto;display:flex;gap:10px;align-items:center}.footer .spacer{flex:1}.gate{font-size:11px;color:var(--muted);max-width:58%;text-align:right}.progress{height:10px;border-radius:999px;background:#edf0f2;overflow:hidden}.bar{height:100%;background:#667085;width:0}.workers{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.worker{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafbfc;min-width:0}.worker .mono{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:80;display:grid;place-items:center;padding:12px}.hidden{display:none!important}.modalCard{background:#fff;width:min(1050px,96vw);height:min(760px,92vh);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.modalHead,.modalFoot{padding:9px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}.modalFoot{border-top:1px solid var(--line);border-bottom:0}.picker{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:0;flex:1}.roots{border-right:1px solid var(--line);overflow:auto}.rootBtn{display:block;width:100%;border:0;border-bottom:1px solid #edf0f2;background:#fff;text-align:left;padding:9px;font-weight:800}.browser{min-width:0;display:flex;flex-direction:column}.browseHead{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}.browsePath{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.browseList{overflow:auto;flex:1}.browseRow{display:grid;grid-template-columns:28px minmax(0,1fr) 90px;gap:7px;padding:8px;border-bottom:1px solid #edf0f2;align-items:center}.openFolder{border:0;background:transparent;text-align:left;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toast{position:fixed;right:14px;bottom:82px;background:#111827;color:#fff;padding:9px 11px;border-radius:8px;z-index:100}.completed{font-size:22px;font-weight:900;color:var(--good)}@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.workers{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.steps{overflow:auto;display:flex}.step{min-width:92px}.wrap{padding:10px 9px 100px}.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.sourceRow{grid-template-columns:minmax(0,1fr) auto}.sourceRow .sourceNote{grid-column:1/-1}.picker{grid-template-columns:110px minmax(360px,1fr);overflow:auto}.gate{display:none}.projectBadge{max-width:40vw}}
</style></head><body><header class="top"><div class="topline"><div class="brand">SOT</div><span class="build">TURN01 R2 · 2026.08.22.turn01-r2-wizard</span><div class="projectBadge" id="projectBadge">No project selected</div></div><div class="steps" id="steps"></div></header><main class="wrap"><div class="card hero" id="app">Loading…</div></main><footer class="footer"><div class="footerIn"><button class="btn" id="backBtn">← Back</button><div class="spacer"></div><div class="gate" id="gateText"></div><button class="btn primary" id="forwardBtn">Continue →</button></div></footer><div class="modal hidden" id="picker"><div class="modalCard"><div class="modalHead"><b>Add source paths</b><span class="muted" id="pickStatus"></span><span style="flex:1"></span><button class="btn" id="pickClose">Close</button></div><div class="picker"><div class="roots" id="roots"></div><div class="browser"><div class="browseHead"><button class="btn" id="pickUp">Up</button><div class="browsePath mono" id="browsePath">/</div></div><div class="browseList" id="browseList"></div></div></div><div class="modalFoot"><span id="pickCount">0 selected</span><span style="flex:1"></span><button class="btn primary" id="pickAdd">Add selected</button></div></div></div><script>
'use strict';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const STEPS=['Project','Sources','Process','Review','Plan','Execute','Certify'];
const state={token:'',snap:null,projects:[],draftSources:[],picker:{path:'/',parent:'/',roots:[],rows:[],selected:new Map()},poll:null};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n||0);if(!n)return'0 B';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return(n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+' '+u[i]};
async function api(p,o={}){const r=await fetch(API+p,{cache:'no-store',headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let x={};try{x=await r.json()}catch{}if(!r.ok)throw new Error(x.error||r.statusText);return x}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function metric(k,v){return `<div class="metric"><small>${esc(k)}</small><b>${esc(v)}</b></div>`}
async function loadProjects(){const x=await api('/turn01/projects');state.projects=x.projects||[]}
async function loadSnap(){if(!state.token){state.snap=null;return}state.snap=await api('/turn01/workflow/'+encodeURIComponent(state.token));state.draftSources=(state.snap.sources||[]).map(s=>({path:s.path||s.last_observed_locator,operator_label:s.operator_label||s.label||s.path,note:s.operator_note||''}))}
function step(){return Number(state.snap?.workflow?.current_step||1)}
function drawSteps(){const s=step();$('#steps').innerHTML=STEPS.map((x,i)=>`<div class="step ${i+1===s?'active':i+1<s?'done':''}">${i+1} ${x}</div>`).join('');$('#projectBadge').textContent=state.snap?.project?.project_name||'No project selected'}
function configureFooter(){const s=step(),gate=state.snap?.gates?.[s]||{ok:false,reason:'Select or create a project.'};$('#backBtn').style.visibility=s>1?'visible':'hidden';$('#backBtn').disabled=s<=1;const names={1:'Choose Sources →',2:'Process Sources →',3:'Review Findings →',4:'Create Plan →',5:'Approve Plan →',6:'Verify Results →',7:'Complete Project'};$('#forwardBtn').textContent=names[s]||'Continue →';$('#forwardBtn').disabled=!state.token||!gate.ok||!!state.snap?.workflow?.completed_at;$('#gateText').textContent=gate.ok?'Ready to continue':gate.reason||''}
async function render(){drawSteps();configureFooter();const s=step();if(s===1)renderProject();else if(s===2)renderSources();else if(s===3)renderProcess();else if(s===4)renderReview();else if(s===5)renderPlan();else if(s===6)renderExecute();else renderCertify()}
function renderProject(){const p=state.snap?.project;$('#app').innerHTML=`<h1>1. Project</h1><p>Choose an existing project or define a new one. This is the only setup required before choosing sources.</p><div class="section grid2"><div><label class="label">Find existing project</label><input class="input" id="projectSearch" placeholder="Search projects"><div class="list" id="projectList" style="margin-top:7px;max-height:260px;overflow:auto"></div></div><div><label class="label">Project name</label><input class="input" id="projectName" value="${esc(p?.project_name||'')}" placeholder="Project name"><label class="label" style="margin-top:9px">Project note</label><textarea class="textarea" id="projectNote" placeholder="What is this project for?">${esc(p?.notes||'')}</textarea><div class="callout" style="margin-top:9px">The forward action will create or save this project, then move to Sources.</div></div></div>`;wireProjectList();$('#projectSearch').oninput=wireProjectList}
function wireProjectList(){const q=($('#projectSearch')?.value||'').toLowerCase();const rows=state.projects.filter(p=>!q||[p.project_name,p.notes].join(' ').toLowerCase().includes(q));$('#projectList').innerHTML=rows.map(p=>`<div class="row projectRow" data-token="${esc(p.project_token)}"><b>${esc(p.project_name)}</b><div class="muted">${esc(p.status)} · ${esc(p.current_stage)}</div></div>`).join('')||'<div class="row muted">No matching projects.</div>';$$('.projectRow').forEach(r=>r.onclick=async()=>{state.token=r.dataset.token;await loadSnap();render()})}
function renderSources(){const src=state.draftSources;$('#app').innerHTML=`<h1>2. Sources</h1><p>Define exactly what belongs in this project. Changing source scope invalidates later workflow results and requires processing again.</p><div class="section toolbar"><button class="btn" id="addSource">+ Add source path</button><span class="muted">${src.length} source${src.length===1?'':'s'}</span></div><div class="section list">${src.map((s,i)=>`<div class="row sourceRow"><div class="mono">${esc(s.path)}</div><input class="input sourceNote" data-note="${i}" value="${esc(s.note||'')}" placeholder="Source note"><button class="btn danger" data-remove="${i}">Remove</button></div>`).join('')||'<div class="row muted">No source paths selected.</div>'}</div>`;$('#addSource').onclick=openPicker;$$('[data-remove]').forEach(b=>b.onclick=()=>{state.draftSources.splice(Number(b.dataset.remove),1);renderSources();configureFooterLocalSources()});$$('[data-note]').forEach(i=>i.oninput=()=>state.draftSources[Number(i.dataset.note)].note=i.value);configureFooterLocalSources()}
function configureFooterLocalSources(){if(step()!==2)return;const ok=state.draftSources.length>0;$('#forwardBtn').disabled=!ok;$('#gateText').textContent=ok?'Ready to process':'Add at least one source path.'}
function renderProcess(){const p=state.snap.processing||{},s=p.summary||{},t=s.totals||{},pr=s.progress||{},workers=(s.job?.workers||s.summary?.workers||[]);const pct=Math.max(Number(pr.bytes_percent||0),Number(pr.files_percent||0));$('#app').innerHTML=`<h1>3. Process</h1><p>SOT is discovering files, reusing known fingerprints where valid, and adding current evidence to the central corpus.</p><div class="section callout ${p.complete?'good':'warn'}"><b>${esc(p.state)}</b> · ${esc(p.phase)}${p.complete?' · review is available':''}</div><div class="section progress"><div class="bar" style="width:${Math.min(100,pct)}%"></div></div><div class="section metrics">${metric('Files discovered',t.files||0)}${metric('Files done',t.done||0)}${metric('Bytes discovered',bytes(t.bytes))}${metric('Bytes done',bytes(t.bytes_done))}${metric('Throughput',bytes(pr.bytes_per_second||0)+'/s')}${metric('ETA',pr.eta_seconds?Math.round(pr.eta_seconds/60)+' min':'—')}</div><div class="section"><b>Current work</b><div class="workers" id="workerGrid"></div></div>`;loadSchedulerWorkers()}
async function loadSchedulerWorkers(){try{const x=await api('/scheduler/status');const ws=x.workers||[];if($('#workerGrid'))$('#workerGrid').innerHTML=ws.map(w=>`<div class="worker"><b>Worker ${w.worker_id}</b><div>${esc(w.phase||'idle')}</div><div class="mono">${esc(w.path||'')}</div><div class="mono">${esc(w.item||'')}</div></div>`).join('')}catch{}}
function renderReview(){const i=state.snap.intelligence||{};$('#app').innerHTML=`<h1>4. Review</h1><p>Review what SOT now knows. These findings are derived from current corpus evidence, not a separate analysis job.</p><div class="section metrics">${metric('Observations',i.observations||0)}${metric('Unique content',i.unique_content||0)}${metric('Source bytes',bytes(i.bytes))}${metric('Duplicate bytes',bytes(i.duplicate_bytes))}${metric('Target missing',bytes(i.target_missing_bytes))}${metric('Backup missing',bytes(i.backup_missing_bytes))}</div><div class="section"><b>Source evidence</b><div class="tableWrap" style="margin-top:7px"><table class="table"><thead><tr><th>Source</th><th>Files</th><th>Bytes</th><th>Unique</th><th>Duplicate</th><th>Target</th><th>Backup</th></tr></thead><tbody>${(state.snap.sources||[]).map(s=>`<tr><td class="mono">${esc(s.path||s.last_observed_locator)}</td><td>${s.observations||s.file_count||0}</td><td>${bytes(s.bytes||s.byte_count)}</td><td>${s.unique_content||0}</td><td>${bytes(s.duplicate_bytes)}</td><td>${s.target_coverage_percent||0}%</td><td>${s.backup_coverage_percent||0}%</td></tr>`).join('')}</tbody></table></div></div>`}
function renderPlan(){const p=state.snap.plan||{},t=p.totals||{};$('#app').innerHTML=`<h1>5. Plan</h1><p>This plan is derived from fingerprints and current Target/Backup evidence. Approving it freezes the current plan revision for execution.</p><div class="section metrics">${metric('No-op',`${t.noop_files||0} · ${bytes(t.noop_bytes)}`)}${metric('Transfer',`${t.transfer_files||0} · ${bytes(t.transfer_bytes)}`)}${metric('Backup',`${t.backup_files||0} · ${bytes(t.backup_bytes)}`)}${metric('Verify target',`${t.verify_target_files||0} · ${bytes(t.verify_target_bytes)}`)}${metric('Unresolved',`${t.unresolved_files||0} · ${bytes(t.unresolved_bytes)}`)}${metric('Plan items',(p.items||[]).length)}</div><div class="section tableWrap"><table class="table"><thead><tr><th>Action</th><th>File</th><th>Size</th><th>Source</th><th>Target</th><th>Backup</th></tr></thead><tbody>${(p.items||[]).slice(0,1500).map((x,i)=>`<tr><td><b>${esc(x.action)}</b></td><td>${esc(x.filename)}</td><td>${bytes(x.size)}</td><td class="mono">${esc(x.source_path)}</td><td class="mono">${esc(x.target_path||x.target_status)}</td><td class="mono">${esc(x.backup_path||x.backup_status)}</td></tr>`).join('')}</tbody></table></div>`}
function renderExecute(){const p=state.snap.plan||{},items=p.items||[];const todo=items.filter(x=>x.action!=='noop');$('#app').innerHTML=`<h1>6. Execute</h1><p>Establish and verify Target and Backup evidence. The workflow cannot advance until the dynamic plan reports no remaining transfer, backup, verification, or unresolved work.</p><div class="section callout ${todo.length?'warn':'good'}">${todo.length?`${todo.length} current plan items still require evidence.`:'All current plan items are verified.'}</div><div class="section grid2"><div><label class="label">Plan item</label><select class="select" id="execItem"><option value="">Choose item…</option>${todo.slice(0,3000).map((x,i)=>`<option value="${i}">${esc(x.action)} · ${esc(x.filename)} · ${bytes(x.size)}</option>`).join('')}</select><label class="label" style="margin-top:8px">Target path</label><input class="input" id="targetPath" placeholder="Target path"><label class="label" style="margin-top:8px">Backup path</label><input class="input" id="backupPath" placeholder="Backup path"><label class="label" style="margin-top:8px">Library / physical location</label><input class="input" id="library" placeholder="Location"><label class="label" style="margin-top:8px">Note</label><textarea class="textarea" id="execNote"></textarea><div class="toolbar" style="margin-top:8px"><button class="btn" id="recordTarget">Record verified Target</button><button class="btn" id="recordBackup">Record verified Backup</button></div></div><div><b>Remaining work</b><div class="list" style="margin-top:7px;max-height:430px;overflow:auto">${todo.slice(0,500).map(x=>`<div class="row"><b>${esc(x.action)}</b> · ${esc(x.filename)}<div class="mono muted">${esc(x.source_path)}</div></div>`).join('')||'<div class="row">All required Target/Backup evidence is verified.</div>'}</div></div></div>`;let chosen=null;$('#execItem').onchange=()=>{chosen=todo[Number($('#execItem').value)]||null;if(chosen){$('#targetPath').value=chosen.target_path||'';$('#backupPath').value=chosen.backup_path||''}};$('#recordTarget').onclick=()=>recordHolding('target',()=>chosen);$('#recordBackup').onclick=()=>recordHolding('backup',()=>chosen)}
async function recordHolding(kind,getChosen){const x=getChosen();if(!x)return toast('Choose a plan item first');const pathEl=kind==='target'?$('#targetPath'):$('#backupPath'),v=pathEl.value.trim();if(!v)return toast(`Enter a ${kind} path`);const route=kind==='target'?'/turn01/holdings/target':'/turn01/holdings/backup';const body=kind==='target'?{file_fingerprint:x.file_fingerprint,target_path:v,library_location:$('#library').value,verification_status:'verified',note:$('#execNote').value}:{file_fingerprint:x.file_fingerprint,backup_path:v,library_location:$('#library').value,verification_status:'verified',note:$('#execNote').value};await api(route,{method:'POST',body:JSON.stringify(body)});toast(`${kind} evidence recorded`);await loadSnap();render()}
function renderCertify(){const p=state.snap.plan||{},w=state.snap.workflow||{},done=!!w.completed_at;$('#app').innerHTML=`<h1>7. Certify</h1><p>Certification closes the project workflow only after current Target and Backup evidence remains fully verified.</p><div class="section ${done?'completed':''}">${done?'PROJECT COMPLETE':'Ready for final certification'}</div><div class="section metrics">${metric('Verified content',p.totals?.noop_files||0)}${metric('Verified bytes',bytes(p.totals?.noop_bytes))}${metric('Transfer remaining',p.totals?.transfer_files||0)}${metric('Backup remaining',p.totals?.backup_files||0)}${metric('Unresolved',p.totals?.unresolved_files||0)}${metric('Completed',w.completed_at?new Date(w.completed_at).toLocaleString():'Not yet')}</div><div class="section callout good">SOT does not delete source material. Completion records certification state; source retirement/disposition remains an explicit later operation.</div>`}
async function saveStep1(){const name=$('#projectName').value.trim(),note=$('#projectNote').value;if(!name)throw new Error('Enter a project name.');if(!state.token){const p=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name,project_note:note})});state.token=p.project_token}else await api('/turn01/projects/'+encodeURIComponent(state.token),{method:'PATCH',body:JSON.stringify({project_name:name,project_note:note})});await loadProjects();await loadSnap()}
async function saveSources(){const p=state.snap.project;await api('/turn01/projects/'+encodeURIComponent(state.token),{method:'PATCH',body:JSON.stringify({project_name:p.project_name,project_note:p.notes||'',sources:state.draftSources})});await loadSnap()}
async function forward(){try{const s=step();if(s===1)await saveStep1();if(s===2)await saveSources();state.snap=await api('/turn01/workflow/'+encodeURIComponent(state.token)+'/forward',{method:'POST',body:'{}'});render()}catch(e){toast(e.message)}}
async function back(){try{state.snap=await api('/turn01/workflow/'+encodeURIComponent(state.token)+'/back',{method:'POST',body:'{}'});render()}catch(e){toast(e.message)}}
async function openPicker(){state.picker.selected=new Map();$('#picker').classList.remove('hidden');const x=await api('/fs?path=%2F');state.picker.roots=x.locations||[];drawRoots();const first=state.picker.roots.find(r=>r.available!==false);if(first)browse(first.path)}
function drawRoots(){$('#roots').innerHTML=state.picker.roots.map(r=>`<button class="rootBtn" data-root="${esc(r.path)}" ${r.available===false?'disabled':''}>${esc(r.label||r.name)}</button>`).join('');$$('[data-root]').forEach(b=>b.onclick=()=>browse(b.dataset.root))}
async function browse(p){$('#pickStatus').textContent='Reading…';const x=await api('/fs?path='+encodeURIComponent(p));state.picker.path=x.path||p;state.picker.parent=x.parent||'/';state.picker.rows=x.folders||[];if(x.locations?.length)state.picker.roots=x.locations;$('#pickStatus').textContent=x.status||'Ready';$('#browsePath').textContent=state.picker.path;drawRoots();drawBrowse()}
function drawBrowse(){const sel=state.picker.selected;$('#browseList').innerHTML=state.picker.rows.map(r=>`<div class="browseRow"><input type="checkbox" data-pick="${esc(r.path)}" ${sel.has(r.path)?'checked':''}><button class="openFolder" data-open="${esc(r.path)}">${esc(r.name)}</button><span>${r.bytes==null?'—':bytes(r.bytes)}</span></div>`).join('')||'<div class="row muted">No folders.</div>';$$('[data-pick]').forEach(c=>c.onchange=()=>{if(c.checked)sel.set(c.dataset.pick,{path:c.dataset.pick,operator_label:c.dataset.pick.split('/').pop(),note:''});else sel.delete(c.dataset.pick);$('#pickCount').textContent=sel.size+' selected'});$$('[data-open]').forEach(b=>b.onclick=()=>browse(b.dataset.open));$('#pickCount').textContent=sel.size+' selected'}
function addPicked(){for(const x of state.picker.selected.values())if(!state.draftSources.some(s=>s.path===x.path))state.draftSources.push(x);$('#picker').classList.add('hidden');renderSources();configureFooterLocalSources()}
$('#backBtn').onclick=back;$('#forwardBtn').onclick=forward;$('#pickClose').onclick=()=>$('#picker').classList.add('hidden');$('#pickUp').onclick=()=>browse(state.picker.parent);$('#pickAdd').onclick=addPicked;
async function poll(){if(!state.token||!state.snap)return;const s=step();if(s===3||s===6){try{await loadSnap();render()}catch{}}}
async function boot(){await loadProjects();render();state.poll=setInterval(poll,2500)}
boot().catch(e=>{$('#app').innerHTML=`<h1>SOT could not start</h1><div class="callout bad">${esc(e.message)}</div>`});
</script></body></html>
