<style>

.project-table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.project-table{width:100%;border-collapse:collapse;min-width:1080px}.project-table th,.project-table td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.project-table th{background:#171f2b;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}.project-table tbody tr{cursor:pointer}.project-table tbody tr:hover{background:#ffffff05}.project-table tbody tr.selected{background:#77b7ff14;box-shadow:inset 3px 0 var(--accent)}.project-name-cell{min-width:390px;max-width:620px}.inline-name{width:100%;min-width:220px;border:0;background:transparent;color:var(--text);font-weight:780;outline:none;padding:2px 0}.inline-name:focus{box-shadow:0 2px 0 var(--accent)}.row-readout,.row-workers,.row-heartbeat{display:block;max-width:590px;margin-top:4px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-readout b{color:var(--text)}.row-workers{color:var(--accent)}.row-heartbeat.live{color:var(--good)}.row-heartbeat.stale{color:var(--warn)}.row-progress{height:4px;max-width:590px;margin-top:6px;border-radius:999px;background:#202b39;overflow:hidden}.row-progress>i{display:block;height:100%;background:var(--accent)}.row-state{display:block;font-size:10px}.row-state small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.row-controls{display:flex;gap:5px}.row-control{display:grid;place-items:center;width:31px;height:31px;border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);font-weight:900}.row-control:hover{border-color:#5b7190;background:#223044}.row-control.stop{color:var(--bad)}.row-control.activity-log{color:var(--accent)}.row-control:disabled{opacity:.3;cursor:not-allowed}.blank-metric{color:#596576}.empty{border:1px dashed #344154;border-radius:10px;padding:36px;text-align:center;color:var(--muted)}

ono-Regular,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:100;border:1px solid var(--line);border-radius:10px;background:#182231;padding:10px 14px;box-shadow:var(--shadow)}.toast.error{border-color:#79393e;background:#31191c;color:#ffd4d6}.modal-backdrop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:14px;background:#030508d4}.modal{width:min(620px,100%);max-height:min(820px,95vh);overflow:auto;border:1px solid #344154;border-radius:14px;background:#111720;box-shadow:var(--shadow)}.modal.project-modal{width:min(1220px,100%);height:min(760px,94vh);display:flex;flex-direction:column;overflow:hidden}.modal.activity-modal{width:min(980px,100%)}.modal-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:17px}.modal-close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:23px}.modal-body{padding:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 15px;border-top:1px solid var(--line)}.field{display:grid;gap:5px;margin-bottom:14px}.field label{color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#0b1017;color:var(--text);padding:9px 10px;outline:none}.input:focus{border-color:var(--accent)}.event-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.event-row{display:grid;grid-template-columns:145px 150px 210px minmax(0,1fr);gap:10px;padding:9px 11px;border-bottom:1px solid var(--line);align-items:start}.event-row:last-child{border-bottom:0}.event-row time,.event-row .event-project{color:var(--muted);font-size:10px}.event-type{color:var(--accent);font-weight:800}.event-detail{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px}
.project-picker{display:grid;grid-template-columns:190px minmax(360px,1fr) minmax(270px,34%);min-height:0;flex:1}.picker-pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.picker-pane:last-child{border-right:0}.picker-head{height:40px;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid var(--line);background:#151d28;font-size:11px;font-weight:850;text-transform:uppercase}.picker-body{min-height:0;flex:1;overflow:auto}.volume-button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:11px;text-align:left;font-weight:760}.volume-button small{display:block;color:var(--muted);font-weight:500}.volume-button.active,.volume-button:hover{background:#77b7ff12}.explorer-tools{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;padding:7px;border-bottom:1px solid var(--line)}.current-path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--line);border-radius:7px;padding:7px 8px;background:#0b1017}.explorer-row{display:grid;grid-template-columns:28px minmax(0,1fr) 32px;align-items:center;gap:5px;min-height:42px;padding:5px 8px;border-bottom:1px solid var(--line)}.explorer-open{border:0;background:transparent;color:var(--text);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}.explorer-enter{border:0;background:transparent;color:var(--muted);font-size:18px}.explorer-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border-top:1px solid var(--line)}.project-name-field{padding:10px;border-bottom:1px solid var(--line)}.staged-list{padding:8px}.staged-path{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#0d141e;margin-bottom:6px}.staged-path code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.staged-remove{border:0;background:transparent;color:var(--bad);font-size:18px}.scope-note{padding:8px 10px;color:var(--muted);font-size:10px;border-bottom:1px solid var(--line)}
@media(max-width:820px){.top-ribbon{flex-wrap:wrap;height:auto}.brand-button{order:1}.search-wrap{order:3;flex-basis:100%;max-width:none}.top-ribbon>.icon-button{order:2;margin-left:auto}.shell{padding:10px 8px 54px}.project-picker{min-width:940px}.modal.project-modal{overflow-x:auto}.stage-rail{overflow-x:auto;grid-template-columns:repeat(5,100px)}.metrics{grid-template-columns:1fr 1fr}.findings{grid-template-columns:1fr}.content{padding:13px}.project-head{padding:12px}.footer-actions{padding:10px 12px}}
@media(max-width:480px){.metrics{grid-template-columns:1fr}.footer-actions{align-items:stretch;flex-direction:column}.right-actions{display:grid}.footer-actions .btn{width:100%}}
</style>

<body>
<header class="app-header">
  <div class="top-ribbon">
    <button id="projectHome" class="brand-button" title="Projects">SOT <small id="build">loading</small></button>
    <div class="search-wrap">
      <input id="projectSearch" class="omnisearch" autocomplete="off" placeholder="Omnisearch projects…">
      <button id="clearSearch" class="search-clear" aria-label="Clear search">×</button>
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <button id="adminButton" class="icon-button" title="Administration" aria-label="Administration">⚙</button>
  </div>
  <div class="project-ribbon">
    <button id="newProject" class="icon-button" title="Add project" aria-label="Add project">＋</button>
    <button id="deleteProject" class="icon-button" title="Delete selected project" aria-label="Delete selected project" disabled>×</button>
    <button id="activityButton" class="icon-button" title="SOT activity log" aria-label="SOT activity log">☷</button>
    <span id="selectionStatus" class="selection-status">No project selected</span>
    <span id="liveHeartbeat" class="live-heartbeat connecting">Connecting…</span>
    <span id="sotRollup" class="sot-rollup">SOT · loading corpus</span>
  </div>
</header>
<main class="shell"><section id="workspace" class="workspace"><div id="projectHead" class="project-head hidden"><input id="projectName" class="project-name" aria-label="Project name"><div><span id="projectStatus" class="status-pill"></span></div></div><div id="stageRail" class="stage-rail"></div><div id="content" class="content"></div><div class="footer-actions"><button id="backButton" class="btn hidden">← Back</button><div class="right-actions"><button id="secondaryButton" class="btn hidden"></button><button id="primaryButton" class="btn primary" disabled>Select project</button></div></div></section></main>
<div id="toast" class="toast hidden"></div><div id="modalRoot"></div>
<script>
'use strict';
const BUILD='2026.08.24.sot-live-progress-5';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const $=selector=>document.querySelector(selector),$$=selector=>[...document.querySelectorAll(selector)];
const state={health:null,projects:[],snapshot:null,folders:[],activity:[],sotActivity:[],rollup:null,selectedToken:'',home:true,searchTimer:null,pollTimer:null,heartbeatTimer:null,activityTimer:null,busy:false,refreshing:false,picker:null,lastRefreshAt:0,lastRefreshStartedAt:0,lastRefreshDuration:0,refreshSequence:0,lastRefreshError:'',visibleNow:Date.now()};
const stageLabels=['Project','Processing','Review','Execute','Certify'];
function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
function formatBytes(value){let n=Number(value||0);const units=['B','KB','MB','GB','TB','PB'];let i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return `${n.toFixed(i?2:0)} ${units[i]}`}
function formatNumber(value){return Number(value||0).toLocaleString()}function formatDate(value){if(!value)return '—';const date=new Date(value);return Number.isNaN(date.valueOf())?'—':date.toLocaleString()}function clamp(value,min,max){return Math.max(min,Math.min(max,value))}function encodedToken(){return encodeURIComponent(state.snapshot?.project?.project_token||'')}
function ageText(value){const timestamp=typeof value==='number'?value:Date.parse(value||'');if(!timestamp||Number.isNaN(timestamp))return 'never';const seconds=Math.max(0,Math.floor((state.visibleNow-timestamp)/1000));if(seconds<1)return '<1s ago';if(seconds<60)return `${seconds}s ago`;const minutes=Math.floor(seconds/60);if(minutes<60)return `${minutes}m ago`;return `${Math.floor(minutes/60)}h ago`}
function markRefreshSuccess(startedAt){state.lastRefreshAt=Date.now();state.visibleNow=state.lastRefreshAt;state.lastRefreshDuration=state.lastRefreshAt-startedAt;state.refreshSequence+=1;state.lastRefreshError='';updateHeartbeat()}
function markRefreshFailure(error){state.visibleNow=Date.now();state.lastRefreshError=String(error?.message||error||'Refresh failed');updateHeartbeat()}
function updateHeartbeat(){const node=$('#liveHeartbeat');if(!node)return;state.visibleNow=Date.now();const age=state.lastRefreshAt?state.visibleNow-state.lastRefreshAt:Infinity;if(state.refreshing&&state.lastRefreshStartedAt&&state.visibleNow-state.lastRefreshStartedAt>1500){node.className='live-heartbeat stale';node.textContent=`Updating · ${((state.visibleNow-state.lastRefreshStartedAt)/1000).toFixed(1)}s`;return}if(state.lastRefreshError&&age>2500){node.className='live-heartbeat offline';node.textContent=`Offline · ${state.lastRefreshError}`;return}if(age>5000){node.className='live-heartbeat stale';node.textContent=`Stale · last update ${ageText(state.lastRefreshAt)}`;return}if(state.lastRefreshAt){node.className='live-heartbeat';node.textContent=`Live · update #${state.refreshSequence} · ${ageText(state.lastRefreshAt)} · ${state.lastRefreshDuration}ms`;return}node.className='live-heartbeat connecting';node.textContent='Connecting…'}
function projectRunState(project){if(project.processing_phase==='stopped')return 'Stopped';return project.processing_state||'Ready'}
function projectPercent(project){const files=Number(project.files_discovered||0),bytes=Number(project.size_bytes||0);if(bytes)return clamp(Number(project.bytes_processed||0)/bytes*100,0,100);if(files)return clamp(Number(project.files_processed||0)/files*100,0,100);return 0}
function projectRunReadout(project){if(!project.processing_state)return 'Ready to index';const files=Number(project.files_discovered||0),processed=Number(project.files_processed||0),bytes=Number(project.size_bytes||0),doneBytes=Number(project.bytes_processed||0),parts=[project.processing_phase||project.processing_state,`${formatNumber(processed)} / ${formatNumber(files)} files`,`${formatBytes(doneBytes)} / ${formatBytes(bytes)}`,`${formatNumber(project.folder_count)} folders`,`${formatNumber(project.hashes_reused)} reused`,`${formatNumber(project.hashes_computed)} computed`,`${formatNumber(project.active_workers)} workers`];if(Number(project.processing_warnings))parts.push(`${formatNumber(project.processing_warnings)} warnings`);if(Number(project.processing_errors))parts.push(`${formatNumber(project.processing_errors)} errors`);if(project.current_item)parts.push(project.current_item);return parts.join(' · ')}
function workerReadout(project){const workers=project.workers||[];if(!workers.length)return project.current_item||project.current_source||'';return workers.map(worker=>`W${worker.worker_id} ${worker.path||worker.item||worker.phase}${Number(worker.bytes_total)?` · ${formatBytes(worker.bytes_hashed)} / ${formatBytes(worker.bytes_total)}`:''}`).join(' · ')}
function toast(message,error=false){const node=$('#toast');node.textContent=message;node.className=`toast${error?' error':''}`;clearTimeout(node._timer);node._timer=setTimeout(()=>node.classList.add('hidden'),3800)}
async function api(pathname,options={}){const response=await fetch(API+pathname,{cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let payload={};try{payload=await response.json()}catch{}if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
async function action(work){if(state.busy)return;state.busy=true;renderActions();try{return await work()}catch(error){toast(error.message,true);throw error}finally{state.busy=false;renderActions()}}
function backendStep(){return Number(state.snapshot?.workflow?.current_step||1)}function visualStep(step=backendStep()){if(step<=2)return 1;if(step===3)return 2;if(step<=5)return 3;if(step===6)return 4;return 5}
async function loadProjects(query=''){const result=await api(`/turn01/projects?q=${encodeURIComponent(query)}`);state.projects=result.projects||[];return state.projects}
async function loadSnapshot(token){const encoded=encodeURIComponent(token),[snapshot,folders,activity]=await Promise.all([api(`/turn01/workflow/${encoded}`),api(`/projects/${encoded}/fingerprint/folders`),api(`/activity?project_token=${encoded}&limit=20`)]);state.snapshot=snapshot;state.folders=folders.folders||[];state.activity=activity.events||[];state.selectedToken=token;return state.snapshot}
async function selectProject(token,open=false){await loadSnapshot(token);state.home=!open||backendStep()<=2;$('#searchResults').classList.add('hidden');render()}
async function refresh(){const startedAt=Date.now(),work=[api('/rollup'),loadProjects($('#projectSearch').value),api('/activity?limit=12')];if(state.selectedToken)work.push(loadSnapshot(state.selectedToken));try{const [rollup,,activity]=await Promise.all(work);state.rollup=rollup;state.sotActivity=activity.events||[];markRefreshSuccess(startedAt);render()}catch(error){markRefreshFailure(error);throw error}}
async function liveTick(){if(state.refreshing)return;state.refreshing=true;state.lastRefreshStartedAt=Date.now();try{const editingName=document.activeElement?.matches?.('.inline-name,.project-name'),work=[api('/rollup'),loadProjects($('#projectSearch').value),api('/activity?limit=12')];if(state.selectedToken)work.push(loadSnapshot(state.selectedToken));const [rollup,,activity]=await Promise.all(work);state.rollup=rollup;state.sotActivity=activity.events||[];markRefreshSuccess(state.lastRefreshStartedAt);if(!editingName)render();else updateRibbon()}catch(error){markRefreshFailure(error);console.warn('SOT live refresh',error)}finally{state.refreshing=false;state.lastRefreshStartedAt=0;updateHeartbeat()}}

function activeVolume(){return state.picker?.roots.find(root=>scopeContains(root.path,state.picker.current))||null}
async function loadPickerPath(value){const listing=await api(`/fs?path=${encodeURIComponent(value)}`);if(listing.locations?.length)state.picker.roots=listing.locations;state.picker.current=listing.path;state.picker.parent=listing.parent;state.picker.folders=listing.folders||[];state.picker.checked.clear();drawPicker()}
function drawPicker(){const picker=state.picker;if(!picker)return;const volume=activeVolume();$('#pickerRoots').innerHTML=picker.roots.map(root=>`<button class="volume-button ${volume?.path===root.path?'active':''}" data-volume="${escapeHtml(root.path)}">${escapeHtml(root.name)}<small>${escapeHtml(root.path)}</small></button>`).join('')||'<div class="empty">No mounted volumes available.</div>';$('#pickerCurrent').textContent=picker.current==='/'?'Select a volume':picker.current;$('#pickerUp').disabled=!volume||picker.current===volume.path;$('#addCurrent').disabled=!volume;$('#addCurrent').textContent=volume&&picker.current===volume.path?'Add entire volume →':'Add current folder →';$('#pickerFolders').innerHTML=picker.folders.length?picker.folders.map(folder=>`<div class="explorer-row"><input type="checkbox" data-folder-check="${escapeHtml(folder.path)}" ${picker.checked.has(folder.path)?'checked':''}><button class="explorer-open" data-folder-open="${escapeHtml(folder.path)}" title="${escapeHtml(folder.path)}">${escapeHtml(folder.name)}</button><button class="explorer-enter" data-folder-open="${escapeHtml(folder.path)}" aria-label="Open ${escapeHtml(folder.name)}">›</button></div>`).join(''):'<div class="empty">No child folders.</div>';$('#addChecked').disabled=!picker.checked.size;$('#addChecked').textContent=picker.checked.size?`Add selected (${picker.checked.size}) →`:'Add selected →';$('#stagedPaths').innerHTML=picker.paths.length?picker.paths.map((scope,index)=>`<div class="staged-path"><code title="${escapeHtml(scope)}">${escapeHtml(scope)}</code><button class="staged-remove" data-staged-remove="${index}" aria-label="Remove path">×</button></div>`).join(''):'<div class="empty">Add a volume or folder from the middle pane.</div>';$('#saveProject').disabled=!picker.name.trim()||!picker.paths.length||state.busy;$$('[data-volume]').forEach(button=>button.onclick=()=>loadPickerPath(button.dataset.volume).catch(error=>toast(error.message,true)));$$('[data-folder-open]').forEach(button=>button.onclick=()=>loadPickerPath(button.dataset.folderOpen).catch(error=>toast(error.message,true)));$$('[data-folder-check]').forEach(input=>input.onchange=()=>{input.checked?picker.checked.add(input.dataset.folderCheck):picker.checked.delete(input.dataset.folderCheck);$('#addChecked').disabled=!picker.checked.size;$('#addChecked').textContent=picker.checked.size?`Add selected (${picker.checked.size}) →`:'Add selected →'});$$('[data-staged-remove]').forEach(button=>button.onclick=()=>{picker.paths.splice(Number(button.dataset.stagedRemove),1);drawPicker()})}
async function openProjectModal(snapshot=null){const editing=!!snapshot,picker={editingToken:editing?snapshot.project.project_token:'',name:editing?snapshot.project.project_name:'',paths:editing?(snapshot.sources||[]).map(source=>source.normalized_path):[],roots:[],current:'/',parent:'/',folders:[],checked:new Set()};state.picker=picker;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal project-modal"><div class="modal-head"><h2>${editing?'Edit project':'Add project'}</h2><span class="muted">One volume or parent folder includes every descendant recursively.</span><button class="modal-close" aria-label="Close">×</button></div><div class="project-picker"><section class="picker-pane"><div class="picker-head">Volumes</div><div id="pickerRoots" class="picker-body"></div></section><section class="picker-pane"><div class="picker-head">Source(s)</div><div class="explorer-tools"><button id="pickerUp" class="btn">↑</button><div id="pickerCurrent" class="current-path mono">Select a volume</div><button id="addCurrent" class="btn primary">Add current →</button></div><div class="scope-note">Choose an entire volume here, or open a folder and add that parent once.</div><div id="pickerFolders" class="picker-body"></div><div class="explorer-footer"><span class="muted">Check multiple sibling folders only when needed.</span><button id="addChecked" class="btn" disabled>Add selected →</button></div></section><section class="picker-pane"><div class="picker-head">Project</div><div class="project-name-field"><input id="pickerName" class="input" value="${escapeHtml(picker.name)}" placeholder="Project name" autocomplete="off"></div><div id="stagedPaths" class="picker-body staged-list"></div></section></div><div class="modal-actions"><button class="btn cancel">Cancel</button><button id="saveProject" class="btn primary" disabled>${editing?'Save project':'Create project'}</button></div></div></div>`;$('.modal-close').onclick=closeModal;$('.cancel').onclick=closeModal;$('#pickerName').oninput=event=>{picker.name=event.target.value;$('#saveProject').disabled=!picker.name.trim()||!picker.paths.length||state.busy};$('#pickerUp').onclick=()=>loadPickerPath(picker.parent).catch(error=>toast(error.message,true));$('#addCurrent').onclick=()=>stageScopePath(picker.current);$('#addChecked').onclick=()=>{for(const value of picker.checked)stageScopePath(value);picker.checked.clear();drawPicker()};$('#saveProject').onclick=saveProjectDefinition;const rootListing=await api('/fs?path=%2F');picker.roots=rootListing.locations||[];const initial=picker.paths[0]||picker.roots[0]?.path||'/';await loadPickerPath(initial);setTimeout(()=>$('#pickerName')?.focus(),0)}
async function saveProjectDefinition(){const picker=state.picker,name=picker.name.trim();if(!name||!picker.paths.length)return;await action(async()=>{let token=picker.editingToken;if(token){await api(`/turn01/projects/${encodeURIComponent(token)}`,{method:'PATCH',body:JSON.stringify({project_name:name})});await api(`/turn01/projects/${encodeURIComponent(token)}/sources`,{method:'PUT',body:JSON.stringify({sources:picker.paths.map(path=>({path}))})})}else{const project=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name,sources:picker.paths.map(path=>({path}))})});token=project.project_token}const preflight=await api(`/admin/projects/${encodeURIComponent(token)}/preflight`);closeModal();$('#projectSearch').value='';await loadProjects('');await loadSnapshot(token);state.home=true;render();toast(preflight.ready?'Project saved and ready to process':`Project saved · ${preflight.blocking_count} source(s) need attention`,!preflight.ready)})}
async function editProjectScope(token){try{if(state.selectedToken!==token)await loadSnapshot(token);await openProjectModal(state.snapshot)}catch(error){toast(error.message,true)}}
async function deleteSelectedProject(){const token=state.selectedToken;if(!token)return;const project=state.projects.find(item=>item.project_token===token)||state.snapshot?.project;if(!confirm(`Delete project "${project?.project_name||token}"? Source, Target, and Backup files are not deleted.`))return;await action(async()=>{await api(`/turn01/projects/${encodeURIComponent(token)}`,{method:'DELETE'});state.selectedToken='';state.snapshot=null;state.home=true;await loadProjects($('#projectSearch').value);render();toast('Project deleted')})}
async function openSettings(){try{const config=await api('/admin/settings');$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Administration</h2><button class="modal-close" aria-label="Close">×</button></div><div class="modal-body"><div class="field"><label>Target root</label><input id="targetRoot" class="input" value="${escapeHtml(config.target_root||'')}"></div><div class="field"><label>Backup root</label><input id="backupRoot" class="input" value="${escapeHtml(config.backup_root||'')}"></div><div class="field"><label>Hash workers</label><input id="hashWorkers" class="input" type="number" min="1" max="16" value="${escapeHtml(config.hash_workers||4)}"></div><div style="display:flex;gap:16px"><button id="adminActivity" class="btn">Activity log</button><a href="sot-dbadmin.html" style="color:var(--accent);align-self:center">Database administration</a></div></div><div class="modal-actions"><button class="btn cancel">Cancel</button><button id="saveSettings" class="btn primary">Save</button></div></div></div>`;$('.modal-close').onclick=closeModal;$('.cancel').onclick=closeModal;$('#adminActivity').onclick=()=>openActivity().catch(error=>toast(error.message,true));$('#saveSettings').onclick=async()=>{await action(async()=>{await api('/admin/settings',{method:'PUT',body:JSON.stringify({target_root:$('#targetRoot').value,backup_root:$('#backupRoot').value,hash_workers:Number($('#hashWorkers').value)})});closeModal();toast('Settings saved')})}}catch(error){toast(error.message,true)}}
$('#projectHome').onclick=async()=>{state.home=true;$('#projectSearch').value='';await loadProjects('');render()};$('#projectSearch').addEventListener('input',event=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(async()=>{try{await loadProjects(event.target.value);state.home?render():renderSearchResults(event.target.value)}catch(error){toast(error.message,true)}},130)});$('#projectSearch').addEventListener('focus',()=>renderSearchResults($('#projectSearch').value));$('#clearSearch').onclick=async()=>{$('#projectSearch').value='';await loadProjects('');state.home?render():renderSearchResults('');$('#projectSearch').focus()};$('#newProject').onclick=()=>openProjectModal().catch(error=>toast(error.message,true));$('#deleteProject').onclick=deleteSelectedProject;$('#activityButton').onclick=()=>openActivity().catch(error=>toast(error.message,true));$('#adminButton').onclick=openSettings;$('#projectName').addEventListener('change',saveHeader);$('#projectName').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();event.currentTarget.blur()}});document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))$('#searchResults').classList.add('hidden')});
(async()=>{const startedAt=Date.now();try{const [health,rollup,,activity]=await Promise.all([api('/health'),api('/rollup'),loadProjects(''),api('/activity?limit=12')]);state.health=health;state.rollup=rollup;state.sotActivity=activity.events||[];$('#build').textContent=`v${state.health.version} · schema ${state.health.database_version} · live 5`;markRefreshSuccess(startedAt);render();state.pollTimer=setInterval(liveTick,1000);state.heartbeatTimer=setInterval(updateHeartbeat,250)}catch(error){markRefreshFailure(error);toast(error.message,true);$('#content').innerHTML=`<div class="empty"><strong>SOT is not ready.</strong><br>${escapeHtml(error.message)}</div>`}})();
</script>
