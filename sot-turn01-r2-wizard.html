<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SOT Corpus Workflow</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#11161f;--panel2:#171e29;--line:#2a3442;--text:#eef3f8;--muted:#8f9bad;--accent:#77b7ff;--accent2:#3b82f6;--good:#63d49a;--warn:#f1bf64;--bad:#ff7b82;--shadow:0 18px 60px #0007;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#15263d 0,#080b10 38%);color:var(--text);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1160px,100%);margin:auto;padding:24px 22px 72px}.topbar{display:flex;align-items:center;gap:16px;margin-bottom:20px}.brand{min-width:150px}.brand h1{font-size:24px;line-height:1;margin:0 0 7px;letter-spacing:-.03em}.build{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.search-wrap{position:relative;flex:1}.project-search{width:100%;height:52px;border:1px solid #415169;border-radius:14px;background:#101722;color:var(--text);padding:0 48px 0 18px;font-size:17px;outline:none;box-shadow:inset 0 0 0 1px #0004}.project-search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #77b7ff22}.clear-search{position:absolute;right:8px;top:8px;width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:23px;border-radius:9px}.clear-search:hover{color:var(--text);background:#ffffff0b}.search-results{position:absolute;top:58px;left:0;right:0;z-index:20;border:1px solid var(--line);border-radius:14px;background:#111822;box-shadow:var(--shadow);padding:6px;max-height:340px;overflow:auto}.search-result{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:transparent;color:var(--text);padding:12px}.search-result:hover{background:#77b7ff16}.search-result strong,.search-result span{display:block}.search-result span{font-size:12px;color:var(--muted);margin-top:3px}.hidden{display:none!important}.btn{border:1px solid var(--line);border-radius:11px;background:#192231;color:var(--text);padding:10px 15px;font-weight:700}.btn:hover{border-color:#506079;background:#202c3d}.btn.primary{border-color:#4e9eff;background:linear-gradient(180deg,#438fe9,#276dc5);color:white}.btn.primary:hover{background:linear-gradient(180deg,#57a7ff,#347bd3)}.btn.ghost{background:transparent}.btn.danger{border-color:#7a343a;color:#ffadb1;background:#2b1518}.btn:disabled{cursor:not-allowed;opacity:.45}.top-actions{display:flex;gap:8px}.workspace{border:1px solid var(--line);border-radius:18px;background:#0e131bdf;box-shadow:var(--shadow);overflow:hidden}.project-head{padding:22px 24px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px 20px;align-items:center}.project-name,.project-note{width:100%;border:0;background:transparent;color:var(--text);outline:none;padding:0}.project-name{font-size:25px;font-weight:800;letter-spacing:-.025em}.project-note{color:var(--muted);font-size:14px}.project-name:focus,.project-note:focus{box-shadow:0 2px 0 var(--accent)}.head-status{text-align:right}.status-pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:#141c27;color:var(--muted);padding:6px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.stage-rail{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:#0b1017}.stage{position:relative;padding:17px 8px 15px;text-align:center;color:#657184;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.stage:after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:transparent}.stage.done{color:var(--good)}.stage.active{color:var(--text);background:#77b7ff0a}.stage.active:after{background:var(--accent)}.stage-number{display:block;font-size:10px;opacity:.7;margin-bottom:4px}.content{min-height:430px;padding:28px 24px}.content h2{font-size:21px;margin:0 0 6px}.lede{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin-bottom:18px}.field label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.input,.textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#0b1017;color:var(--text);padding:11px 12px;outline:none}.input:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #77b7ff18}.textarea{min-height:90px;resize:vertical}.source-add{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:18px}.source-list{display:grid;gap:9px}.source{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#111720}.source-path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}.source-meta{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px;margin-top:5px}.source-remove{border:0;background:transparent;color:var(--muted);font-size:22px;width:34px;height:34px;border-radius:8px}.source-remove:hover{background:#ff7b8215;color:var(--bad)}.state{font-weight:800}.state.ready,.state.Closed,.state.complete,.state.certified{color:var(--good)}.state.WIP,.state.Queued,.state.executing{color:var(--accent)}.state.Error,.state.error,.state.not_mounted,.state.missing,.state.unreadable{color:var(--bad)}.state.Paused,.state.ignored_recycle_bin{color:var(--warn)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}.metric{padding:15px;border:1px solid var(--line);border-radius:12px;background:#111720}.metric b{display:block;font-size:21px;letter-spacing:-.02em}.metric span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.progress{height:10px;background:#06090d;border:1px solid #26303e;border-radius:999px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#337ee0,#79bcff);transition:width .3s}.activity{border:1px solid var(--line);border-radius:12px;overflow:hidden}.activity-row{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}.activity-row:last-child{border-bottom:0}.activity-row span:first-child{color:var(--muted);font-weight:800}.activity-row code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.findings{display:grid;grid-template-columns:1fr 1fr;gap:14px}.finding{border:1px solid var(--line);border-radius:13px;background:#111720;padding:17px}.finding h3{font-size:14px;margin:0 0 13px}.finding-line{display:flex;justify-content:space-between;gap:20px;padding:7px 0;border-top:1px solid #25303d;color:var(--muted)}.finding-line b{color:var(--text)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#171f2b;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}td.hash{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;max-width:190px;overflow:hidden;text-overflow:ellipsis}.empty{border:1px dashed #344154;border-radius:13px;padding:40px;text-align:center;color:var(--muted)}.footer-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:#0b1017}.right-actions{display:flex;gap:9px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;max-width:min(560px,calc(100% - 30px));border:1px solid var(--line);border-radius:12px;background:#182231;color:var(--text);padding:11px 15px;box-shadow:var(--shadow)}.toast.error{border-color:#79393e;background:#31191c;color:#ffd4d6}.modal-backdrop{position:fixed;inset:0;z-index:50;background:#030508c9;display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);max-height:min(760px,90vh);overflow:auto;border:1px solid #344154;border-radius:18px;background:#111720;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:19px}.modal-close{border:0;background:transparent;color:var(--muted);font-size:24px}.modal-body{padding:20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:15px 20px;border-top:1px solid var(--line)}.browser-path{display:flex;gap:8px;margin-bottom:12px}.browser-list{display:grid;gap:5px}.browser-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;border-radius:9px;background:#17202c;color:var(--text);padding:10px 12px}.browser-item:hover{background:#202c3d}.browser-item small{color:var(--muted)}
@media(max-width:820px){.shell{padding:14px 10px 50px}.topbar{align-items:stretch;flex-wrap:wrap}.brand{min-width:0}.search-wrap{order:3;flex-basis:100%}.top-actions{margin-left:auto}.project-head{padding:18px 16px}.stage-rail{overflow-x:auto;grid-template-columns:repeat(7,92px)}.content{padding:22px 16px}.metrics{grid-template-columns:1fr 1fr}.findings{grid-template-columns:1fr}.source-add{grid-template-columns:1fr auto}.source-add .browse-button{grid-column:1/-1}.footer-actions{padding:14px 16px}.project-name{font-size:21px}}
@media(max-width:480px){.brand .build{display:none}.top-actions .admin-label{display:none}.metrics{grid-template-columns:1fr}.project-head{grid-template-columns:1fr}.head-status{text-align:left}.source-add{grid-template-columns:1fr}.source-add .btn{width:100%}.footer-actions{align-items:stretch;flex-direction:column}.footer-actions .btn{width:100%}.right-actions{display:grid}.content{min-height:380px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><h1>SOT</h1><div id="build" class="build">Corpus workflow</div></div>
    <div class="search-wrap">
      <input id="projectSearch" class="project-search" autocomplete="off" placeholder="Search projects…">
      <button id="clearSearch" class="clear-search" aria-label="Clear search">×</button>
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <div class="top-actions">
      <button id="adminButton" class="btn ghost"><span class="admin-label">Admin</span></button>
      <button id="newProject" class="btn primary">+ New</button>
    </div>
  </header>

  <section id="workspace" class="workspace hidden">
    <div class="project-head">
      <div>
        <input id="projectName" class="project-name" aria-label="Project name">
        <input id="projectNote" class="project-note" aria-label="Project note" placeholder="Add a note">
      </div>
      <div class="head-status"><span id="projectStatus" class="status-pill"></span></div>
    </div>
    <div id="stageRail" class="stage-rail"></div>
    <div id="content" class="content"></div>
    <div class="footer-actions">
      <button id="backButton" class="btn ghost">← Back</button>
      <div class="right-actions">
        <button id="secondaryButton" class="btn hidden"></button>
        <button id="primaryButton" class="btn primary"></button>
      </div>
    </div>
  </section>
  <section id="welcome" class="workspace"><div class="content empty">Create a project to begin the clean corpus workflow.</div></section>
</main>

<div id="toast" class="toast hidden"></div>
<div id="modalRoot"></div>

<script>
'use strict';
const BUILD='2026.08.23.sot-clean-ui-1';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const $=selector=>document.querySelector(selector);
const state={health:null,projects:[],snapshot:null,searchTimer:null,pollTimer:null,busy:false};
const stepLabels=['Project','Sources','Process','Review','Plan','Execute','Certify'];

function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}
function formatBytes(value){let n=Number(value||0);const units=['B','KB','MB','GB','TB','PB'];let i=0;while(n>=1024&&i<units.length-1){n/=1024;i++}return `${n.toFixed(i?2:0)} ${units[i]}`}
function formatNumber(value){return Number(value||0).toLocaleString()}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function encodedToken(){return encodeURIComponent(state.snapshot?.project?.project_token||'')}
function toast(message,error=false){const node=$('#toast');node.textContent=message;node.className=`toast${error?' error':''}`;clearTimeout(node._timer);node._timer=setTimeout(()=>node.classList.add('hidden'),4200)}
async function api(pathname,options={}){const response=await fetch(API+pathname,{cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let payload={};try{payload=await response.json()}catch{}if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
async function action(work){if(state.busy)return;state.busy=true;renderActions();try{return await work()}catch(error){toast(error.message,true);throw error}finally{state.busy=false;renderActions()}}

async function loadProjects(query=''){const result=await api(`/turn01/projects?q=${encodeURIComponent(query)}`);state.projects=result.projects||[];renderSearchResults(query);return state.projects}
async function selectProject(token){clearInterval(state.pollTimer);state.pollTimer=null;state.snapshot=await api(`/turn01/workflow/${encodeURIComponent(token)}`);$('#projectSearch').value=state.snapshot.project.project_name;$('#searchResults').classList.add('hidden');render();startPollingIfNeeded()}
async function refresh(){if(!state.snapshot)return;state.snapshot=await api(`/turn01/workflow/${encodedToken()}`);render();startPollingIfNeeded()}
function startPollingIfNeeded(){clearInterval(state.pollTimer);state.pollTimer=null;const step=Number(state.snapshot?.workflow?.current_step||0);const runState=state.snapshot?.processing?.state;const planState=state.snapshot?.plan?.state;if((step===3&&['Queued','WIP'].includes(runState))||(step===6&&planState==='executing'))state.pollTimer=setInterval(refresh,900)}

function renderSearchResults(query=''){const root=$('#searchResults');if(!query&&document.activeElement!==$('#projectSearch')){root.classList.add('hidden');return}root.innerHTML=state.projects.length?state.projects.map(project=>`<button class="search-result" data-token="${escapeHtml(project.project_token)}"><strong>${escapeHtml(project.project_name)}</strong><span>${escapeHtml(project.project_note||'No note')} · ${project.source_count||0} source${Number(project.source_count)===1?'':'s'}</span></button>`).join(''):'<div class="empty" style="padding:18px">No projects found.</div>';root.classList.remove('hidden');root.querySelectorAll('[data-token]').forEach(button=>button.onclick=()=>selectProject(button.dataset.token))}

function render(){const snapshot=state.snapshot;if(!snapshot){$('#workspace').classList.add('hidden');$('#welcome').classList.remove('hidden');return}$('#welcome').classList.add('hidden');$('#workspace').classList.remove('hidden');$('#projectName').value=snapshot.project.project_name||'';$('#projectNote').value=snapshot.project.project_note||'';$('#projectStatus').textContent=snapshot.project.status||snapshot.workflow.step_name;const current=Number(snapshot.workflow.current_step||1);$('#stageRail').innerHTML=stepLabels.map((label,index)=>`<div class="stage ${index+1<current?'done':''} ${index+1===current?'active':''}"><span class="stage-number">0${index+1}</span>${label}</div>`).join('');const renderStep=[null,renderProject,renderSources,renderProcess,renderReview,renderPlan,renderExecute,renderCertify][current]||renderProject;$('#content').innerHTML=renderStep(snapshot);wireStep(current);renderActions()}

function renderProject(snapshot){return `<h2>Define the project</h2><p class="lede">A project is an editable scope. Corpus evidence remains global and durable.</p><div class="field"><label>Project name</label><input id="detailName" class="input" value="${escapeHtml(snapshot.project.project_name)}"></div><div class="field"><label>Note</label><textarea id="detailNote" class="textarea">${escapeHtml(snapshot.project.project_note||'')}</textarea></div>`}
function sourceState(source){return source.preflight_status||'unknown'}
function renderSources(snapshot){const sources=snapshot.sources||[];return `<h2>Choose source paths</h2><p class="lede">Every source is preflighted before processing. Unmounted Windows drives cannot start.</p><div class="source-add"><input id="sourcePath" class="input" placeholder="/mnt/q/Photos or /home/support/fixture"><button id="addSource" class="btn">Add path</button><button id="browseSource" class="btn browse-button">Browse</button></div><div class="source-list">${sources.length?sources.map(source=>`<div class="source"><div><div class="source-path">${escapeHtml(source.normalized_path)}</div><div class="source-meta"><span class="state ${escapeHtml(sourceState(source))}">${escapeHtml(sourceState(source))}</span><span>${escapeHtml(source.preflight_message||'')}</span></div></div><button class="source-remove" data-source="${escapeHtml(source.source_id)}" aria-label="Remove source">×</button></div>`).join(''):'<div class="empty">Add at least one source path.</div>'}</div>`}
function renderProcess(snapshot){const status=snapshot.processing||{};const run=status.run||{};const progress=status.progress||{};const percent=clamp(Number(progress.bytes_percent||progress.files_percent||0),0,100);const workers=status.workers||[];return `<h2>Processing corpus</h2><p class="lede">Inventory and fingerprint work runs asynchronously through the global scheduler.</p><div class="metrics"><div class="metric"><b>${formatNumber(run.files_discovered)}</b><span>Files discovered</span></div><div class="metric"><b>${formatBytes(run.bytes_discovered)}</b><span>Bytes discovered</span></div><div class="metric"><b>${formatNumber(run.hashes_reused)}</b><span>Hashes reused</span></div><div class="metric"><b>${formatBytes(progress.bytes_per_second)}/s</b><span>Throughput</span></div></div><div class="progress"><div style="width:${percent}%"></div></div><div class="activity"><div class="activity-row"><span>State</span><code class="state ${escapeHtml(status.state)}">${escapeHtml(status.state||'NotStarted')} · ${escapeHtml(status.phase||'idle')}</code></div><div class="activity-row"><span>Current</span><code>${escapeHtml(run.current_item||run.current_source||'Waiting for work')}</code></div>${workers.map(worker=>`<div class="activity-row"><span>Worker ${worker.worker_id}</span><code>${escapeHtml(worker.item||worker.path||'idle')}</code></div>`).join('')}</div>`}
function metric(label,value){return `<div class="metric"><b>${value}</b><span>${label}</span></div>`}
function renderReview(snapshot){const finding=snapshot.review||{};return `<h2>Review findings</h2><p class="lede">These conclusions are deterministic and derived from current authoritative observations.</p><div class="metrics">${metric('Source files',formatNumber(finding.files))}${metric('Source bytes',formatBytes(finding.bytes))}${metric('Unique content',formatNumber(finding.unique_content))}${metric('Unique bytes',formatBytes(finding.unique_bytes))}${metric('Duplicate copies',formatNumber(finding.duplicate_copies))}${metric('Duplicate bytes',formatBytes(finding.duplicate_bytes))}${metric('Changed paths',formatNumber(finding.changed_paths))}${metric('Blocking sources',formatNumber(finding.blocking_sources))}</div><div class="findings"><div class="finding"><h3>Target coverage</h3><div class="finding-line"><span>Verified content</span><b>${formatNumber(finding.target_content)} / ${formatNumber(finding.unique_content)}</b></div><div class="finding-line"><span>Verified bytes</span><b>${formatBytes(finding.target_bytes)}</b></div><div class="finding-line"><span>New Target required</span><b>${formatBytes(finding.target_missing_bytes)}</b></div></div><div class="finding"><h3>Backup coverage</h3><div class="finding-line"><span>Verified content</span><b>${formatNumber(finding.backup_content)} / ${formatNumber(finding.unique_content)}</b></div><div class="finding-line"><span>Verified bytes</span><b>${formatBytes(finding.backup_bytes)}</b></div><div class="finding-line"><span>New Backup required</span><b>${formatBytes(finding.backup_missing_bytes)}</b></div></div></div>`}
function planTable(plan){const items=plan?.items||[];return `<div class="table-wrap"><table><thead><tr><th>Content SHA-256</th><th>Action</th><th>Size</th><th>State</th></tr></thead><tbody>${items.map(item=>`<tr><td class="hash" title="${escapeHtml(item.content_sha256)}">${escapeHtml(item.content_sha256)}</td><td>${escapeHtml(item.action.replaceAll('_',' '))}</td><td>${formatBytes(item.size)}</td><td class="state ${escapeHtml(item.state)}">${escapeHtml(item.state)}</td></tr>`).join('')}</tbody></table></div>`}
function renderPlan(snapshot){const plan=snapshot.plan||{totals:{},items:[]};const totals=plan.totals||{};return `<h2>Approve deterministic plan</h2><p class="lede">No source file is deleted. Each new content object is established in Target, verified, backed up, and verified again.</p><div class="metrics">${metric('No action',formatNumber(totals.no_action))}${metric('Copy to Target',formatNumber(totals.target_files))}${metric('Target bytes',formatBytes(totals.target_bytes))}${metric('Backup bytes',formatBytes(totals.backup_bytes))}</div>${planTable(plan)}`}
function renderExecute(snapshot){const plan=snapshot.plan||{totals:{},items:[]};const totals=plan.totals||{};const percent=totals.items?totals.complete/totals.items*100:0;return `<h2>Execute and verify</h2><p class="lede">Content-addressed copies are promoted only after SHA-256 verification.</p><div class="metrics">${metric('Plan state',`<span class="state ${escapeHtml(plan.state)}" style="font-size:21px">${escapeHtml(plan.state||'pending')}</span>`)}${metric('Complete',`${formatNumber(totals.complete)} / ${formatNumber(totals.items)}`)}${metric('Errors',formatNumber(totals.errors))}${metric('Backup bytes',formatBytes(totals.backup_bytes))}</div><div class="progress"><div style="width:${clamp(percent,0,100)}%"></div></div>${planTable(plan)}`}
function renderCertify(snapshot){const finding=snapshot.review||{};const certification=snapshot.certification;const certified=certification?.status==='certified'&&Number(certification.evidence_revision)===Number(snapshot.project.evidence_revision);return `<h2>${certified?'Certified source evidence':'Certify source evidence'}</h2><p class="lede">Certification records that every current content object has verified Target and Backup coverage. It never deletes the source.</p><div class="findings"><div class="finding"><h3>Coverage gate</h3><div class="finding-line"><span>Current files</span><b>${formatNumber(finding.files)}</b></div><div class="finding-line"><span>Target missing</span><b>${formatNumber(finding.target_missing_content)}</b></div><div class="finding-line"><span>Backup missing</span><b>${formatNumber(finding.backup_missing_content)}</b></div><div class="finding-line"><span>Blocking sources</span><b>${formatNumber(finding.blocking_sources)}</b></div></div><div class="finding"><h3>Certification</h3><div class="finding-line"><span>Status</span><b class="state ${certified?'certified':''}">${certified?'CERTIFIED':'READY'}</b></div><div class="finding-line"><span>Evidence revision</span><b>${formatNumber(snapshot.project.evidence_revision)}</b></div><div class="finding-line"><span>Certified at</span><b>${certified?new Date(certification.certified_at).toLocaleString():'—'}</b></div></div></div>`}

function wireStep(step){if(step===1){$('#detailName').onchange=saveProjectDetails;$('#detailNote').onchange=saveProjectDetails}if(step===2){$('#addSource').onclick=addSource;$('#sourcePath').onkeydown=event=>{if(event.key==='Enter')addSource()};$('#browseSource').onclick=()=>openBrowser('/');document.querySelectorAll('.source-remove').forEach(button=>button.onclick=()=>removeSource(button.dataset.source))}}
async function saveProjectDetails(){const name=($('#detailName')||$('#projectName')).value.trim();const note=($('#detailNote')||$('#projectNote')).value;await action(async()=>{await api(`/turn01/projects/${encodedToken()}`,{method:'PATCH',body:JSON.stringify({project_name:name,project_note:note})});await loadProjects('');await refresh();toast('Project updated')})}
async function saveHeader(){if(!state.snapshot)return;const name=$('#projectName').value.trim();const note=$('#projectNote').value;await action(async()=>{await api(`/turn01/projects/${encodedToken()}`,{method:'PATCH',body:JSON.stringify({project_name:name,project_note:note})});await loadProjects('');await refresh();toast('Project updated')})}
function currentSourcePayload(excludeId=null,addPath=null){const sources=(state.snapshot.sources||[]).filter(source=>source.source_id!==excludeId).map(source=>({path:source.normalized_path,operator_label:source.operator_label,operator_note:source.operator_note}));if(addPath)sources.push({path:addPath});return sources}
async function addSource(pathValue=null){const input=$('#sourcePath');const sourcePath=(pathValue||input?.value||'').trim();if(!sourcePath)return;await action(async()=>{await api(`/turn01/projects/${encodedToken()}/sources`,{method:'PUT',body:JSON.stringify({sources:currentSourcePayload(null,sourcePath)})});await api(`/admin/projects/${encodedToken()}/preflight`);await refresh();toast('Source added and preflighted')})}
async function removeSource(sourceId){await action(async()=>{await api(`/turn01/projects/${encodedToken()}/sources`,{method:'PUT',body:JSON.stringify({sources:currentSourcePayload(sourceId)})});await refresh();toast('Source removed from project scope')})}

function renderActions(){
  const primary=$('#primaryButton'),secondary=$('#secondaryButton'),back=$('#backButton');
  if(!state.snapshot)return;
  const step=Number(state.snapshot.workflow.current_step||1),runState=state.snapshot.processing?.state,planState=state.snapshot.plan?.state;
  back.classList.toggle('hidden',step<=1);back.disabled=state.busy||runState==='WIP'||planState==='executing';back.onclick=()=>moveBack();
  secondary.classList.add('hidden');primary.disabled=state.busy;primary.textContent='Continue';primary.onclick=null;
  if(step===1){primary.textContent='SOURCES →';primary.onclick=()=>forward()}
  if(step===2){const ready=state.snapshot.preflight?.ready;primary.textContent=ready?'PROCESS PROJECT →':'RUN PREFLIGHT';primary.onclick=ready?()=>startProcess():()=>runPreflight()}
  if(step===3){
    if(runState==='Closed'){primary.textContent='REVIEW FINDINGS →';primary.onclick=()=>forward()}
    else if(runState==='Paused'){primary.textContent='RESUME PROCESSING';primary.onclick=()=>resumeProcess()}
    else if(['Error','Interrupted'].includes(runState)){primary.textContent='RESTART PROCESSING';primary.onclick=()=>startProcess()}
    else{primary.textContent='PROCESSING…';primary.disabled=true}
    if(['Queued','WIP'].includes(runState)){secondary.textContent='Pause processing';secondary.classList.remove('hidden');secondary.onclick=()=>pauseProcess()}
  }
  if(step===4){primary.textContent='GENERATE PLAN →';primary.onclick=()=>generatePlan()}
  if(step===5){const draft=planState==='draft';primary.textContent=draft?'APPROVE & EXECUTE →':'REGENERATE PLAN';primary.onclick=draft?()=>startExecute():()=>generatePlan()}
  if(step===6){
    if(planState==='complete'){primary.textContent='CERTIFY →';primary.onclick=()=>forward()}
    else{primary.textContent=planState==='error'?'EXECUTION FAILED':'EXECUTING…';primary.disabled=true}
  }
  if(step===7){const certified=state.snapshot.certification?.status==='certified'&&Number(state.snapshot.certification.evidence_revision)===Number(state.snapshot.project.evidence_revision);primary.textContent=certified?'CERTIFIED':'CERTIFY SOURCE →';primary.disabled=state.busy||certified;primary.onclick=certified?null:()=>certify()}
}
async function forward(){await action(async()=>{await api(`/turn01/workflow/${encodedToken()}/forward`,{method:'POST',body:'{}'});await refresh()})}
async function moveBack(){await action(async()=>{await api(`/turn01/workflow/${encodedToken()}/back`,{method:'POST',body:'{}'});await refresh()})}
async function runPreflight(){await action(async()=>{const result=await api(`/admin/projects/${encodedToken()}/preflight`);await refresh();toast(result.ready?'All sources ready':`${result.blocking_count} source(s) blocked`,!result.ready)})}
async function startProcess(){await action(async()=>{await api(`/projects/${encodedToken()}/fingerprint/start`,{method:'POST',body:'{}'});await refresh()})}
async function pauseProcess(){await action(async()=>{await api(`/projects/${encodedToken()}/fingerprint/pause`,{method:'POST',body:'{}'});toast('Pause requested');await refresh()})}
async function resumeProcess(){await action(async()=>{await api(`/projects/${encodedToken()}/fingerprint/continue`,{method:'POST',body:'{}'});await refresh()})}
async function generatePlan(){await action(async()=>{await api(`/turn01/projects/${encodedToken()}/plan`,{method:'POST',body:'{}'});await refresh()})}
async function startExecute(){await action(async()=>{await api(`/turn01/projects/${encodedToken()}/execute`,{method:'POST',body:'{}'});await refresh()})}
async function certify(){await action(async()=>{await api(`/turn01/projects/${encodedToken()}/certify`,{method:'POST',body:'{}'});await refresh();toast('Source evidence certified')})}

function closeModal(){$('#modalRoot').innerHTML=''}
function openNewProject(){$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>New project</h2><button class="modal-close">×</button></div><div class="modal-body"><div class="field"><label>Project name</label><input id="newName" class="input" autofocus></div><div class="field"><label>Note</label><textarea id="newNote" class="textarea"></textarea></div></div><div class="modal-actions"><button class="btn cancel">Cancel</button><button id="createProject" class="btn primary">Create project</button></div></div></div>`;$('.modal-close').onclick=closeModal;$('.cancel').onclick=closeModal;$('#newName').onkeydown=event=>{if(event.key==='Enter')createProject()};$('#createProject').onclick=createProject;setTimeout(()=>$('#newName').focus(),0)}
async function createProject(){const name=$('#newName').value.trim(),note=$('#newNote').value;if(!name){toast('Project name is required',true);return}await action(async()=>{const project=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name,project_note:note})});closeModal();await loadProjects('');await selectProject(project.project_token);toast('Project created')})}

async function openSettings(){const config=await api('/admin/settings');$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Target and Backup</h2><button class="modal-close">×</button></div><div class="modal-body"><p class="lede">Target and Backup must be separate, non-nested paths.</p><div class="field"><label>Target root</label><input id="targetRoot" class="input" value="${escapeHtml(config.target_root||'')}"></div><div class="field"><label>Backup root</label><input id="backupRoot" class="input" value="${escapeHtml(config.backup_root||'')}"></div><div class="field"><label>Hash workers</label><input id="hashWorkers" class="input" type="number" min="1" max="16" value="${escapeHtml(config.hash_workers||4)}"></div><p><a href="sot-dbadmin.html" style="color:var(--accent)">Open database administration</a></p></div><div class="modal-actions"><button class="btn cancel">Cancel</button><button id="saveSettings" class="btn primary">Save settings</button></div></div></div>`;$('.modal-close').onclick=closeModal;$('.cancel').onclick=closeModal;$('#saveSettings').onclick=async()=>{await action(async()=>{await api('/admin/settings',{method:'PUT',body:JSON.stringify({target_root:$('#targetRoot').value,backup_root:$('#backupRoot').value,hash_workers:Number($('#hashWorkers').value)})});closeModal();toast('Settings saved')})}}

async function openBrowser(startPath){let current=startPath;async function load(){const listing=await api(`/fs?path=${encodeURIComponent(current)}`);current=listing.path;$('#modalRoot').innerHTML=`<div class="modal-backdrop"><div class="modal"><div class="modal-head"><h2>Add source path</h2><button class="modal-close">×</button></div><div class="modal-body"><div class="browser-path"><input id="browserPath" class="input" value="${escapeHtml(current)}"><button id="goPath" class="btn">Go</button></div><div class="browser-list">${current!=='/'?`<button class="browser-item" data-path="${escapeHtml(listing.parent)}">↑ <small>Parent</small></button>`:''}${(listing.locations||[]).map(item=>`<button class="browser-item" data-path="${escapeHtml(item.path)}">${escapeHtml(item.name)} <small>${escapeHtml(item.path)}</small></button>`).join('')}${(listing.folders||[]).map(item=>`<button class="browser-item" data-path="${escapeHtml(item.path)}">${escapeHtml(item.name)}</button>`).join('')}</div></div><div class="modal-actions"><button class="btn cancel">Cancel</button><button id="choosePath" class="btn primary" ${current==='/'?'disabled':''}>Use this folder</button></div></div></div>`;$('.modal-close').onclick=closeModal;$('.cancel').onclick=closeModal;$('#goPath').onclick=()=>{current=$('#browserPath').value;load().catch(error=>toast(error.message,true))};document.querySelectorAll('.browser-item').forEach(button=>button.onclick=()=>{current=button.dataset.path;load().catch(error=>toast(error.message,true))});$('#choosePath').onclick=()=>{const selected=current;closeModal();addSource(selected)}}await load()}

$('#projectSearch').addEventListener('input',event=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>loadProjects(event.target.value).catch(error=>toast(error.message,true)),160)});$('#projectSearch').addEventListener('focus',()=>renderSearchResults($('#projectSearch').value));$('#clearSearch').onclick=()=>{$('#projectSearch').value='';loadProjects('');$('#projectSearch').focus()};$('#newProject').onclick=openNewProject;$('#adminButton').onclick=openSettings;$('#projectName').addEventListener('change',saveHeader);$('#projectNote').addEventListener('change',saveHeader);document.addEventListener('click',event=>{if(!event.target.closest('.search-wrap'))$('#searchResults').classList.add('hidden')});

(async()=>{try{state.health=await api('/health');$('#build').textContent=`${state.health.version} · clean schema v${state.health.database_version}`;const projects=await loadProjects('');if(projects.length)await selectProject(projects[0].project_token);else render()}catch(error){toast(error.message,true);$('#welcome').innerHTML=`<div class="content empty"><strong>SOT is not ready.</strong><br>${escapeHtml(error.message)}</div>`}})();
</script>
</body>
