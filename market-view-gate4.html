function unitFamily(u=''){u=u.toLowerCase();if(u.includes('usd'))return'dollar';if(u.includes('percent')||u==='%'||u.includes('bps'))return'percent';if(u.includes('count')||u.includes('000'))return'count';return'index'}

function crumbs(){if(S.nav!=='now')return'<button data-crumb="market">Market</button>';let a=['<button data-crumb="market" class="'+(S.screen==='market'?'current':'')+'">Market</button>'];if(S.screen!=='market')a.push('<span class="sep">/</span><button data-crumb="index" class="'+(S.screen==='index'?'current':'')+'">'+DEFS[S.index].name+'</button>');if(S.screen==='analysis')a.push('<span class="sep">/</span><button class="current">'+meta(S.analysis[0]).abbr+'</button>');return a.join('')}

async function boot(){try{let [c,d]=await Promise.all([fetch('data/market-backend/data-catalog.json').then(r=>r.json()),fetch('data/market-backend/derived-index-definition.json').then(r=>r.json())]);CATALOG=Object.fromEntries(c.series.filter(x=>x.enabled!==false).map(x=>[x.id,x]));DEFS=d.indices;S.ready=true;render();await ensureActive();render()}catch(e){FAIL.boot=e.message;S.ready=true;render()}}
function sourcePath(id){let q=CATALOG[id];return'data/market-backend/sources/'+(q?.domain==='market'?'market':'macro')+'/'+id+'.json'}
function extractRecords(j){let a=j.records||j.daily||j.data||[];return a.filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.v)).sort((a,b)=>a.t-b.t)}
async function loadSeries(id){if(CACHE[id])return CACHE[id];if(!CATALOG[id]){FAIL[id]='Missing catalog entry';return[]}try{let r=await fetch(sourcePath(id));if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json(),a=extractRecords(j);if(!a.length)throw Error('No canonical records');CACHE[id]=a;delete FAIL[id];return a}catch(e){FAIL[id]=e.message;CACHE[id]=[];return[]}}
async function ensureActive(){let need=[];if(S.screen==='market')need=[...new Set(Object.values(DEFS).flatMap(z=>z.components.map(x=>x.id)))];else need=ids();await Promise.all(need.map(loadSeries))}
function endTs(){let a=ids().flatMap(id=>(CACHE[id]||[]).map(r=>r.t));return a.length?Math.max(...a):Date.now()}
function startTs(end){let d=new Date(end),x=new Date(end);if(S.h==='1D')return end-86400000;if(S.h==='5D')return end-7*86400000;if(S.h==='MTD'){x.setDate(1);x.setHours(0,0,0,0);return +x}if(S.h==='YTD'){x=new Date(d.getFullYear(),0,1);return +x}let yrs=S.h==='1YR'?1:S.h==='3YR'?3:5;x.setFullYear(x.getFullYear()-yrs);return +x}
function slice(id,start,end){return(CACHE[id]||[]).filter(r=>r.t>=start&&r.t<=end)}
function normalize(a,dir=1){if(!a.length)return[];let b=a[0].v;if(!(b>0))return[];return a.map(r=>({t:r.t,v:100+dir*((r.v/b)-1)*100,sourceT:r.t}))}
function plotSeries(start,end){if(S.screen==='analysis')return ids().map(id=>({id,m:meta(id),a:slice(id,start,end)}));if(S.screen==='index'){let comps=DEFS[S.index].components;return comps.map(c=>({id:c.id,m:meta(c.id),a:normalize(slice(c.id,start,end),c.direction)})).filter(x=>x.a.length)}let out=[];for(let key of ['risk','growth','macro']){let z=DEFS[key],series=z.components.map(c=>({c,a:normalize(slice(c.id,start,end),c.direction)})).filter(x=>x.a.length);let times=[...new Set(series.flatMap(x=>x.a.map(r=>r.t)))].sort((a,b)=>a-b),vals=[];for(let t of times){let v=[];for(let s of series){let hit=[...s.a].reverse().find(r=>r.t<=t);if(hit)v.push(hit.v)}if(v.length)vals.push({t,v:v.reduce((a,b)=>a+b,0)/v.length})}out.push({id:key,m:meta(key),a:vals})}return out}
function yRange(vals){if(!vals.length)return[0,1];let mn=Math.min(...vals),mx=Math.max(...vals),p=(mx-mn||1)*.1;return[mn-p,mx+p]}
function format(v){let a=Math.abs(v);return a>=1000?v.toFixed(0):a>=100?v.toFixed(1):v.toFixed(2)}
function draw(){let c=$('#chart');if(!c)return;let box=c.parentElement,r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);let W=r.width,HH=r.height,end=endTs(),start=startTs(end),series=plotSeries(start,end).filter(s=>s.a.length),rp=rep(),L=54,R=rp.mode==='dual'?58:14,T=12,B=32;if($('#loading'))$('#loading').style.display=series.length?'none':'grid';if(!series.length)return;let minT=Math.min(...series.flatMap(s=>s.a.map(r=>r.t))),maxT=Math.max(...series.flatMap(s=>s.a.map(r=>r.t)));if(maxT===minT){minT-=43200000;maxT+=43200000}let groups={};if(rp.mode==='indexed'||S.screen!=='analysis'){for(let s of series){if(S.screen==='analysis'){let b=s.a[0].v||1;s.p=s.a.map(r=>({t:r.t,v:100+(r.v/b-1)*100,raw:r.v}))}else s.p=s.a}groups.indexed=series.flatMap(s=>(s.p||s.a).map(r=>r.v))}else{for(let s of series)s.p=s.a;for(let f of rp.f)groups[f]=series.filter(s=>s.m.f===f).flatMap(s=>s.p.map(r=>r.v))}let lf=(rp.mode==='indexed'||S.screen!=='analysis')?'indexed':rp.f[0],rf=rp.mode==='dual'?rp.f[1]:null,lr=yRange(groups[lf]||[]),rr=rf?yRange(groups[rf]||[]):null;x.font='10px system-ui';x.strokeStyle='#253141';x.fillStyle='#8290a3';for(let i=0;i<5;i++){let y=T+(HH-T-B)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(W-R,y);x.stroke();x.fillText(format(lr[1]-(lr[1]-lr[0])*i/4),4,y+3);if(rr)x.fillText(format(rr[1]-(rr[1]-rr[0])*i/4),W-R+6,y+3)}x.beginPath();x.moveTo(L,T);x.lineTo(L,HH-B);x.lineTo(W-R,HH-B);if(rr){x.moveTo(W-R,T);x.lineTo(W-R,HH-B)}x.stroke();for(let i=0;i<5;i++){let t=minT+(maxT-minT)*i/4,label=new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});x.fillText(label,L+(W-L-R)*i/4-12,HH-8)}for(let s of series){let fam=rp.mode==='dual'?s.m.f:lf,yr=fam===rf?rr:lr,a=s.p||s.a;x.strokeStyle=s.m.c;x.lineWidth=2.1;x.beginPath();a.forEach((p,i)=>{let px=L+(p.t-minT)/(maxT-minT)*(W-L-R),py=T+(yr[1]-p.v)/(yr[1]-yr[0])*(HH-T-B);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();if(a.length<24){x.fillS function inspect(e,series,g){let id=S.active&&series.some(s=>s.id===S.active)?S.active:series[0].id,s=series.find(q=>q.id===id),rect=e.currentTarget.getBoundingClientRect(),tx=g.minT+Math.max(0,Math.min(1,(e.clientX-rect.left-g.L)/(g.W-g.L-g.R)))*(g.maxT-g.minT),p=s.a.reduce((best,q)=>Math.abs(q.t-tx)<Math.abs(best.t-tx)?q:best,s.a[0]);S.active=id;draw();let c=$('#chart'),x=c.getContext('2d'),d=devicePixelRatio||1;x.save();x.scale(d,d);let px=g.L+(p.t-g.minT)/(g.maxT-g.minT)*(g.W-g.L-g.R);x.strokeStyle=s.m.c;x.beginPath();x.moveTo(px,g.T);x.lineTo(px,g.HH-g.B);x.stroke();x.fillStyle=s.m.c;x.beginPath();x.arc(px,g.HH-g.B,3,0,Math.PI*2);x.fill();x.restore();let vt=$('#valueTag'),dt=$('#dateTag');vt.textContent=s.m.abbr+' '+format(p.v)+' '+s.m.u;vt.style.display='block';vt.style.left=Math.min(g.W-130,px+6)+'px';vt.style.top='8px';dt.textContent=new Date(p.t).toLocaleDateString();dt.style.display='block';dt.style.left=Math.max(0,Math.min(g.W-90,px-35))+'px';dt.style.bottom='2px'}
function openTip(id,el){let q=meta(id),b=el.getBoundingClientRect(),left=Math.max(12,Math.min(innerWidth-322,b.left));$('#tipRoot').innerHTML='<div class="tip" id="tip" style="left:'+left+'px;top:'+Math.min(innerHeight-245,b.bottom+6)+'px"><div class="tipHead"><b>'+q.abbr+'</b><button class="tipClose" id="tipClose">×</button></div><p><b>What is it?</b> '+q.d+'</p><p><b>How is it used here?</b> '+q.role+'</p><p><b>Why does it matter?</b> It is canonical evidence for the current market question.</p><a href="market-view-gate4.html?series='+id+'" target="_blank" rel="noopener">More →</a></div>';$('#tipClose').onclick=()=>$('#tipRoot').innerHTML=''}
function picker(){let chosen=new Set(),avail=Object.keys(CATALOG).filter(id=>!S.analysis.includes(id));$('#modalRoot').innerHTML='<div class="modalWrap" id="shade"><div class="modal"><div class="modalHead"><h2>Add to Analysis</h2><button id="close">×</button></div><input class="search" id="search" placeholder="Search canonical series"><div class="pick" id="pick">'+avail.map(id=>'<button data-pick="'+id+'"><span><i class="dot" style="background:'+meta(id).c+'"></i>'+meta(id).abbr+'</span><small>'+meta(id).u+'</small></button>').join('')+'</div><div class="modalFoot"><button id="cancel">Cancel</button><button id="apply">Add selected</button></div></div></div>';document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{chosen.has(b.dataset.pick)?chosen.delete(b.dataset.pick):chosen.add(b.dataset.pick);b.classList.toggle('sel')});$('#search').oninput=e=>document.querySelectorAll('[data-pick]').forEach(b=>b.style.display=b.textContent.toLowerCase().includes(e.target.value.toLowerCase())?'flex':'none');let close=()=>$('#modalRoot').innerHTML='';$('#close').onclick=$('#cancel').onclick=close;$('#shade').onclick=e=>{if(e.target.id==='shade')close()};$('#apply').onclick=async()=>{if(chosen.size){if(S.screen!=='analysis'){S.index=S.index||'risk';S.analysis=[];S.screen='analysis'}S.analysis.push(...chosen);S.analysis=[...new Set(S.analysis)];await ensureActive()}close();render()}}
async function render(){if(!S.ready){$('#context').textContent='Market';$('#crumbs').innerHTML='<button class="current">Market</button>';$('#horizons').innerHTML=H.map(h=>'<button>'+h+'</button>').join('');$('#body').innerHTML='<div class="placeholder">Loading canonical Market Navigator evidence…</div>';return}$('#context').innerHTML=ctx();$('#crumbs').innerHTML=crumbs();$('#horizons').innerHTML=H.map(h=>'<button data-h="'+h+'" class="'+(h===S.h?'on':'')+'">'+h+'</button>').join('');$('#body').innerHTML=S.nav==='now'?surface():'<div class="placeholder">'+S.nav.toUpperCase()+' remains behind the approved application frame for the next Gate 4 slice.</div>';wire();if(S.nav==='now')requestAnimationFrame(draw)}
function wire(){document.querySelectorAll('[data-h]').forEach(b=>b.onclick=async()=>{S.h=b.dataset.h;S.cross=null;render()});document.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=async()=>{if(b.dataset.crumb==='market'){S.screen='market';S.index=null;S.analysis=[]}else if(b.dataset.crumb==='index'){S.screen='index';S.analysis=[]}await ensureActive();render()});document.querySelectorAll('[data-series]').forEach(b=>{b.onclick=async e=>{if(e.target.dataset.remove)return;let id=b.dataset.series;if(S.screen==='market'){S.index=id;S.screen='index';await ensureActive();render()}else if(S.screen==='index'){S.analysis=[id];S.screen='analysis';S.active=id;await ensureActive();render()}else{S.active=id;openTip(id,b);draw()}};b.oncontextmenu=e=>{e.preventDefault();openTip(b.dataset.series,b)}});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=e=>{e.stopPropagation();S.analysis=S.analysis.filter(id=>id!==x.dataset.remove);S.active=S.analysis[0]||null;render()});$('#add')?.addEventListener('click',picker);$('#info')?.addEventListener('click',()=>{S.info=!S.info;render()});$('#more').onclick=e=>{e.stopPropagation();$('#moreMenu').classList.toggle('on')};$('#moreAdd').onclick=picker;$('#saveLib').onclick=()=>{localStorage.setItem('market-view-gate4-library',JSON.stringify({screen:S.screen,index:S.index,analysis:S.analysis,h:S.h,savedAt:new Date().toISOString()}));$('#moreMenu').classList.remove('on');$('#saveLib').textContent='Saved to Library'};$('#download').onclick=()=>{let rows=['series,date,value'];for(let id of ids())for(let r of(CACHE[id]||[]))rows.push([id,new Date(r.t).toISOString(),r.v].join(','));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='market-view-evidence.csv';a.click()}}
document.onclick=e=>{if(!e.target.closest('.moreWrap'))$('#moreMenu')?.classList.remove('on');if(!e.target.closest('.tip')&&!e.target.closest('.chip'))$('#tipRoot').innerHTML=''};$('#menu').onclick=()=>$('#rail').classList.toggle('closed');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.nav=b.dataset.nav;$('#rail').classList.add('closed');render()});$('#send').onclick=()=>{if($('#ask').value.trim())$('#ask').value=''};window.onresize=()=>{if(S.nav==='now')draw()};
(async()=>{await boot();let qs=new URLSearchParams(location.search),sid=qs.get('series');if(sid&&CATALOG[sid]){S.nav='now';S.screen='analysis';S.index=Object.keys(DEFS).find(k=>DEFS[k].components.some(x=>x.id===sid))||'macro';S.analysis=[sid];S.active=sid;await ensureActive();render()}})();
</script></body></html>
