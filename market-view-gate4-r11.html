<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Navigator R11</title><style>:root{--bg:#08111f;--p:#0d192b;--l:#263954;--t:#eef5ff;--m:#91a5bf;--a:#69b8ff;--r:#ff6677}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t);font:14px system-ui}button,input{font:inherit}.top{height:54px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--l);gap:10px}.top b{font-size:17px}.status{margin-left:auto;color:var(--m);font-size:11px}.shell{height:calc(100% - 54px);display:grid;grid-template-columns:170px 1fr}.rail{border-right:1px solid var(--l);padding:10px;display:flex;flex-direction:column}.rail button{border:0;background:transparent;color:var(--m);padding:12px;text-align:left;font-weight:800;border-radius:8px}.rail button.on{background:#193354;color:#fff}.rail .cfg{margin-top:auto}.work{min-width:0;display:grid;grid-template-rows:44px 42px 1fr}.crumb,.ranges{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--l);gap:7px}.crumb button{border:0;background:none;color:#b9cce2;font-weight:800}.ranges{justify-content:center}.ranges button,.pill,.btn{border:1px solid var(--l);background:#101d31;color:#c4d2e3;border-radius:999px;padding:6px 10px;font-weight:800}.ranges button.on{border-color:var(--a);background:#203d64;color:white}.page{display:none;min-height:0;padding:12px}.page.on{display:block}.panel{height:100%;background:var(--p);border:1px solid var(--l);border-radius:13px;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px}.head{display:flex;align-items:center;gap:10px}.head h1{font-size:20px;margin:0}.head small{color:var(--m)}.head .right{margin-left:auto}.legend{display:flex;gap:6px;overflow:auto}.pill{font-size:11px;white-space:nowrap}.pill.sel{border-color:var(--a)}.chart{position:relative;min-height:0;border:1px solid #1c2e49;border-radius:10px;overflow:hidden}.chart canvas{width:100%;height:100%;display:block}.empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;color:var(--m)}.info{position:absolute;z-index:4;left:10px;right:10px;bottom:10px;background:#101f34f5;border:1px solid #3a5576;border-radius:10px;padding:10px;display:none}.info.on{display:grid;grid-template-columns:1fr auto;gap:8px}.info h3{margin:0}.info p{margin:4px 0;color:#b6c7da;font-size:12px}.meta{font-size:11px;color:var(--m)}.btn{border-radius:8px}.primary{background:var(--a);color:#07111f;border-color:var(--a)}.explore{height:100%;overflow:auto}.tabs{display:flex;gap:6px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border:1px solid var(--l);background:#0d192b;color:var(--t);border-radius:10px;padding:12px;text-align:left}.modal{position:fixed;z-index:20;inset:0;background:#02060de8;display:none;padding:14px}.modal.on{display:flex}.modalbox{margin:auto;width:min(1100px,100%);height:min(90vh,800px);background:#0d192b;border:1px solid #3a5576;border-radius:13px;display:grid;grid-template-rows:48px minmax(0,1fr) 190px}.mhead{display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--l);gap:8px}.mhead .close{margin-left:auto}.analysis{min-height:0;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}.conversation{border-top:1px solid var(--l);display:grid;grid-template-rows:1fr 45px;min-height:0}.msgs{overflow:auto;padding:9px}.compose{display:flex;padding:6px;border-top:1px solid var(--l);gap:6px}.compose input{flex:1;border:1px solid var(--l);border-radius:20px;background:#071321;color:white;padding:8px 12px}.inspect{position:absolute;display:none;background:white;color:#07111f;padding:6px 8px;border-radius:7px;font-size:11px;pointer-events:none}.inspect.on{display:block}@media(max-width:700px){.shell{grid-template-columns:1fr}.rail{display:none}.work{grid-template-rows:40px 40px 1fr}.page{padding:7px}.panel{padding:8px}.grid{grid-template-columns:1fr 1fr}.status{display:none}.modal{padding:5px}.modalbox{height:96vh}.ranges{overflow:auto;justify-content:flex-start}}</style></head><body><header class="top"><b>Market Navigator</b><span>Gate 4 R11</span><span class="status" id="status">Loading canonical evidence…</span></header><div class="shell"><aside class="rail"><button class="on" data-page="now">NOW</button><button data-page="explore">EXPLORE</button><button data-page="library">LIBRARY</button><button data-page="health">HEALTH</button><button class="cfg">CONFIG</button></aside><section class="work"><div class="crumb"><button id="marketCrumb">Market</button><span id="crumb">/ Overview</span></div><div class="ranges" id="ranges"></div><div class="page on" id="now"><div class="panel"><div class="head"><div><small id="level">V1 · MARKET</small><h1 id="title">Market</h1></div><button class="btn right" id="back" hidden>Back to Market</button></div><div class="legend" id="legend"></div><div class="chart"><canvas id="chart"></canvas><div class="empty" id="empty"></div><div class="inspect" id="inspect"></div><div class="info" id="info"><div><h3 id="infoTitle"></h3><p id="infoText"></p><div class="meta" id="infoMeta"></div></div><button class="btn primary" id="more">More info</button></div></div></div></div><div class="page" id="explore"><div class="explore"><h2>Explore</h2><input id="search" placeholder="Search series" style="width:100%;padding:10px;background:#071321;color:white;border:1px solid var(--l);border-radius:9px"><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div></div></div><div class="page" id="library"><h2>Library</h2><div id="lib"></div></div><div class="page" id="health"><h2>Health</h2><div id="healthBody"></div></div></section></div><div class="modal" id="modal"><div class="modalbox"><div class="mhead"><b id="mcrumb">Analysis</b><button class="btn" id="add">Add Series</button><button class="btn close" id="close">×</button></div><div class="analysis"><div class="legend" id="alegend"></div><div class="chart"><canvas id="achart"></canvas><div class="empty" id="aempty"></div><div class="inspect" id="ainspect"></div></div></div><div class="conversation"><div class="msgs" id="msgs"><div><b>AI POV</b><br><span style="color:var(--m)">Evidence-grounded analysis begins here when an AI provider is configured and validated.</span></div></div><div class="compose"><input placeholder="Continue analysis…"><button class="btn primary">Send</button></div></div></div></div><script>'use strict';const H=['1D','5D','MTD','YTD','1YR','3YR','5YR'],DEF={risk:{name:'Risk',abbr:'RSK',color:'#ff6677',c:[['spy',-1,'broad equity risk appetite'],['vix',1,'equity volatility'],['hySpread',1,'credit spread'],['hyg',-1,'high-yield risk appetite'],['dxy',1,'dollar pressure'],['move',1,'Treasury volatility'],['nfci',1,'financial conditions']]},growth:{name:'Growth',abbr:'GRW',color:'#69b8ff',c:[['qqq',1,'Nasdaq/growth leadership'],['copper',1,'industrial/cyclical demand'],['smallCaps',1,'small-cap activity'],['manufacturingProduction',1,'Federal Reserve manufacturing output'],['wti',1,'cyclical demand context'],['unemployment',-1,'labor deterioration'],['payrolls',1,'employment activity']]},macro:{name:'Macro',abbr:'MAC',color:'#edf4ff',c:[['tenYear',1,'10-year nominal rate'],['twoYear',1,'2-year nominal rate'],['curve10y2y',1,'10Y-2Y curve'],['curve10y3m',1,'10Y-3M curve'],['cpi',1,'headline inflation'],['corePce',1,'core PCE inflation'],['fedFunds',1,'policy rate']]}};const S={h:'5D',idx:null,sel:null,series:{},analysis:[],manifest:null};const $=id=>document.getElementById(id);async function J(p){let r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function t0(){let d=new Date();if(S.h==='1D')d.setDate(d.getDate()-1);if(S.h==='5D')d.setDate(d.getDate()-5);if(S.h==='MTD')d.setDate(1);if(S.h==='YTD')d.setMonth(0,1);if(S.h==='1YR')d.setFullYear(d.getFullYear()-1);if(S.h==='3YR')d.setFullYear(d.getFullYear()-3);if(S.h==='5YR')d.setFullYear(d.getFullYear()-5);return +d}function cut(o){return (o||[]).filter(p=>+p.t>=t0())}async function load(id){if(S.series[id])return S.series[id];try{return S.series[id]=await J('market-data/series/'+id+'.json')}catch{return S.series[id]={id,name:id,short:id,status:'unavailable',cadence:'unknown',provider:null,observations:[]}}}function reb(o,dir=1){let p=cut(o),b=p[0]?.v;if(!p.length||!Number.isFinite(+b)||+b===0)return[];return p.map(x=>({t:+x.t,v:100+dir*((+x.v/+b)-1)*100}))}function avg(lines){let ts=[...new Set(lines.flatMap(x=>x.p.map(q=>q.t)))].sort();return ts.map(t=>{let v=lines.map(x=>{let q=x.p.filter(z=>z.t<=t).at(-1);return q?.v}).filter(Number.isFinite);return v.length?{t,v:v.reduce((a,b)=>a+b,0)/v.length}:null}).filter(Boolean)}function draw(canvas,lines,empty,inspect){let c=$(canvas),box=c.parentElement,r=box.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);let pts=lines.flatMap(l=>l.p);if(!pts.length){$(empty).style.display='grid';$(empty).textContent='No real canonical observations for this horizon.';return}$(empty).style.display='none';let mn=Math.min(...pts.map(p=>p.t)),mx=Math.max(...pts.map(p=>p.t)),lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(lo===hi){lo-=1;hi+=1}let X=t=>45+(t-mn)/(mx-mn||1)*(r.width-60),Y=v=>15+(hi-v)/(hi-lo)*(r.height-45);x.strokeStyle='#263954';x.fillStyle='#91a5bf';x.font='10px system-ui';for(let i=0;i<5;i++){let y=15+i*(r.height-45)/4;x.beginPath();x.moveTo(42,y);x.lineTo(r.width-10,y);x.stroke();x.fillText((hi-i*(hi-lo)/4).toFixed(1),4,y+3)}lines.forEach((l,i)=>{if(!l.p.length)return;x.strokeStyle=l.color||['#69b8ff','#ff6677','#edf4ff','#c19cff','#65d6ad'][i%5];x.lineWidth=l.width||1.7;x.beginPath();l.p.forEach((p,j)=>j?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));x.stroke()});c.onpointermove=e=>{let rr=c.getBoundingClientRect(),px=e.clientX-rr.left,all=lines.flatMap(l=>l.p.map(p=>({...p,n:l.name})));let q=all.reduce((a,b)=>Math.abs(X(b.t)-px)<Math.abs(X(a.t)-px)?b:a,all[0]);if(!q)return;let z=$(inspect);z.textContent=q.n+' · '+q.v.toFixed(2)+' · '+new Date(q.t).toLocaleDateString();z.style.left=Math.min(r.width-190,Math.max(5,X(q.t)+7))+'px';z.style.top=Math.max(5,Y(q.v)-25)+'px';z.classList.add('on')};c.onpointerleave=()=>$(inspect).classList.remove('on')}function ranges(){ $('ranges').innerHTML=H.map(h=>`<button class="${h===S.h?'on':''}" data-h="${h}">${h}</button>`).join('');$('ranges').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.h=b.dataset.h;S.sel=null;$('info').classList.remove('on');ranges();renderNow();if($('modal').classList.contains('on'))renderAnalysis()})}async function renderNow(){if(!S.idx){$('level').textContent='V1 · MARKET';$('title').textContent='Market';$('crumb').textContent='/ Overview';$('back').hidden=true;let lines=[];for(let [k,v] of Object.entries(DEF)){let ls=[];for(let c of v.c){let o=await load(c[0]),p=reb(o.observations,c[1]);if(p.length)ls.push({p})}let p=avg(ls);lines.push({name:v.abbr,p,color:v.color,width:2.3})}$('legend').innerHTML=Object.entries(DEF).map(([k,v])=>`<button class="pill" data-i="${k}">${v.abbr}</button>`).join('');$('legend').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.idx=b.dataset.i;S.sel=null;renderNow()});draw('chart',lines,'empty','inspect');return}let d=DEF[S.idx];$('level').textContent='V2 · '+d.name.toUpperCase();$('title').textContent=d.name;$('crumb').textContent='/ '+d.name;$('back').hidden=false;let lines=[],children=[];for(let c of d.c){let o=await load(c[0]),p=reb(o.observations,c[1]);children.push({name:o.short||c[0],p,color:'#91a5bf',id:c[0],o,c});if(p.length)lines.push(children.at(-1))}let ix=avg(children.filter(x=>x.p.length));lines.unshift({name:d.abbr,p:ix,color:d.color,width:2.8});$('legend').innerHTML=`<button class="pill">${d.abbr}</button>`+children.map(x=>`<button class="pill ${S.sel===x.id?'sel':''}" data-c="${x.id}">${x.name}</button>`).join('');$('legend').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>selectComp(b.dataset.c));draw('chart',lines,'empty','inspect')}async function selectComp(id){S.sel=id;let c=DEF[S.idx].c.find(x=>x[0]===id),o=await load(id),p=cut(o.observations),q=p.at(-1);$('infoTitle').textContent=(o.short||id)+' · '+(o.name||id);$('infoText').textContent=c[2];$('infoMeta').textContent=`${o.provider||'No provider'} · ${o.cadence||'unknown cadence'} · ${q?new Date(q.t).toLocaleDateString()+' · '+q.v:'no observation'} · ${o.status||'unknown'}`;$('info').classList.add('on');renderNow()}async function openV3(ids){S.analysis=[...new Set(ids)];$('modal').classList.add('on');await renderAnalysis()}async function renderAnalysis(){let ls=[];for(let id of S.analysis){let o=await load(id),p=cut(o.observations);ls.push({name:o.short||id,p:p.map(q=>({t:+q.t,v:+q.v}))})}let units=S.analysis.map(id=>S.series[id]?.unit).filter(Boolean),indexed=S.analysis.length>=3&&new Set(units).size>1;if(indexed)ls=ls.map(l=>({...l,p:reb(l.p,1)}));$('mcrumb').textContent=(S.idx?'Market / '+DEF[S.idx].name+' / ':'Explore / ')+S.analysis.map(id=>S.series[id]?.short||id).join(' + ')+(indexed?' · Indexed 100':'');$('alegend').innerHTML=ls.map(l=>`<span class="pill">${l.name}</span>`).join('');draw('achart',ls,'aempty','ainspect')}async function explore(){let ids=[...new Set(Object.values(DEF).flatMap(d=>d.c.map(c=>c[0])))];await Promise.all(ids.map(load));$('tabs').innerHTML=['Market','Risk','Growth','Macro','Other'].map(x=>`<button class="pill">${x}</button>`).join('');$('grid').innerHTML=ids.map(id=>{let o=S.series[id];return `<button class="card" data-id="${id}"><b>${o.short||id}</b><br><small>${o.name||id}</small><br><span class="meta">${o.provider||'unavailable'} · ${o.cadence||'unknown'}</span></button>`}).join('');$('grid').querySelectorAll('button').forEach(b=>b.onclick=()=>openV3([b.dataset.id]))}async function boot(){try{S.manifest=await J('market-data/manifest.json');$('status').textContent='canonical DB '+(S.manifest.revision||'ready')}catch(e){$('status').textContent='canonical evidence unavailable'}ranges();renderNow();explore();$('healthBody').textContent=S.manifest?`Database ${S.manifest.databaseVersion||''} · ${S.manifest.status||''} · synthetic history prohibited`:'Manifest unavailable'}$('back').onclick=()=>{S.idx=null;S.sel=null;$('info').classList.remove('on');renderNow()};$('marketCrumb').onclick=$('back').onclick;$('more').onclick=()=>S.sel&&openV3([S.sel]);$('close').onclick=()=>{$('modal').classList.remove('on');renderNow()};$('add').onclick=async()=>{let id=prompt('Canonical series id to add');if(id){await load(id);S.analysis.push(id);renderAnalysis()}};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.page));if(b.dataset.page==='explore')explore()});window.addEventListener('resize',()=>{renderNow();if($('modal').classList.contains('on'))renderAnalysis()})}boot();</script></body></html>
