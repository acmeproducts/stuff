<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1e3a">
<title>Snowman Coal-Cart Line Rider</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1e3a;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  #game{position:fixed;inset:0;display:block;touch-action:none;}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;
    display:flex;justify-content:center;align-items:baseline;gap:16px;
    pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.65);z-index:5;}
  #hud .score{font-size:28px;font-weight:800;letter-spacing:1px;}
  #hud .best{font-size:13px;font-weight:600;opacity:.85;}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:12px;right:12px;
    text-align:center;pointer-events:none;color:#eaf6ff;font-size:15px;
    text-shadow:0 2px 6px rgba(0,0,0,.75);z-index:5;}
  #diag{position:fixed;left:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);z-index:6;
    pointer-events:none;font:10px/1.5 ui-monospace,Menlo,monospace;color:#9fd8ff;
    background:rgba(4,16,32,.55);padding:3px 7px;border-radius:6px;max-width:72vw;white-space:pre;}
  #err{position:fixed;top:0;left:0;right:0;z-index:9;display:none;background:#7a0e0e;color:#fff;
    font:12px/1.4 ui-monospace,monospace;padding:6px 10px;white-space:pre-wrap;}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(3,10,22,.72);z-index:8;color:#fff;text-align:center;touch-action:none;}
  #overlay h1{margin:0 0 6px;font-size:30px;font-weight:700;}
  #overlay .big{font-size:52px;font-weight:900;margin:4px 0;text-shadow:0 3px 12px rgba(0,0,0,.8);}
  #overlay p{margin:4px 0;opacity:.9;}
  #overlay .cta{margin-top:16px;font-size:18px;font-weight:700;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="score" id="score">0</div><div class="best" id="best">BEST 0</div></div>
<div id="hint"></div>
<div id="diag">booting…</div>
<div id="err"></div>
<div id="overlay">
  <h1>⛄🛒 → 🕳️</h1>
  <div class="big" id="finalScore">0</div>
  <p id="finalBest"></p>
  <div class="cta">TAP TO RIDE AGAIN</div>
</div>
<script>
(function(){
"use strict";

// ---- Snowman Coal-Cart Line Rider (per wsl.md Define) ----
var cvs=document.getElementById('game');
var ctx=cvs.getContext('2d');
var elScore=document.getElementById('score'),
    elBest=document.getElementById('best'),
    elHint=document.getElementById('hint'),
    elDiag=document.getElementById('diag'),
    elErr=document.getElementById('err'),
    elOverlay=document.getElementById('overlay'),
    elFinal=document.getElementById('finalScore'),
    elFinalBest=document.getElementById('finalBest');

var W=0,H=0,DPR=1;
var stars=[],flakes=[];

var ST={READY:0,RUN:1,FALL:2,SUCK:3,OVER:4};
var STNAME=['READY','RUN','FALL','SUCK','OVER'];
var state=ST.READY;

var pts=[],cum=[],totalLen=0;                 // track polyline + arc lengths
var cart={s:0,v:0,x:0,y:0,ang:0};            // cart on track (arc-length param)
var fall={x:0,y:0,vx:0,vy:0,rot:0,spin:0,t:0};
var hole={x:0,y:0};
var suck={t:0,scale:1,rot:0};
var camX=0,camY=0;
var score=0,best=0,maxPage=0,pageW=800;
var floaters=[];
var stuckT=0,diagT=0,diagExtra='',fpsEMA=60,lastT=0,errShown=0;

var G=900,DRAG=0.10,ROLL=4,VMAX=1400;        // physics constants
var AC=null;

// ---------- setup ----------
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  seedSky();
}
function seedSky(){
  stars=[];var i;
  for(i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()<0.8?1:2,a:0.3+Math.random()*0.6});
  if(flakes.length===0)for(i=0;i<44;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,v:18+Math.random()*30,d:Math.random()*6.28});
}
function stepFlakes(dt){
  var now=performance.now()/900;
  for(var i=0;i<flakes.length;i++){var f=flakes[i];
    f.y+=f.v*dt;f.x+=Math.sin(f.d+now)*12*dt;
    if(f.y>H+4){f.y=-4;f.x=Math.random()*W;}
    if(f.x>W+4)f.x=-4;else if(f.x<-4)f.x=W+4;
  }
}

// ---------- track ----------
function resetTrack(){pts=[];cum=[];totalLen=0;}
function addPoint(x,y){
  var n=pts.length;
  if(n===0){pts.push({x:x,y:y});cum.push(0);return;}
  var dx=x-pts[n-1].x,dy=y-pts[n-1].y,d=Math.hypot(dx,dy);
  if(d<8)return;
  pts.push({x:x,y:y});totalLen+=d;cum.push(totalLen);
}
function pointAt(s){
  if(pts.length===0)return{x:0,y:0,ang:0};
  if(pts.length===1)return{x:pts[0].x,y:pts[0].y,ang:0};
  var a,b;
  if(s<=0){a=pts[0];b=pts[1];return{x:a.x,y:a.y,ang:Math.atan2(b.y-a.y,b.x-a.x)};}
  if(s>=totalLen){a=pts[pts.length-2];b=pts[pts.length-1];return{x:b.x,y:b.y,ang:Math.atan2(b.y-a.y,b.x-a.x)};}
  var lo=0,hi=cum.length-1;
  while(lo<hi){var mid=(lo+hi)>>1;if(cum[mid]<s)lo=mid+1;else hi=mid;}
  var i=Math.max(1,lo),s0=cum[i-1],s1=cum[i];
  var t=(s-s0)/Math.max(1e-6,s1-s0);
  var p0=pts[i-1],p1=pts[i];
  return{x:p0.x+(p1.x-p0.x)*t,y:p0.y+(p1.y-p0.y)*t,ang:Math.atan2(p1.y-p0.y,p1.x-p0.x)};
}
function nearestOnTrack(x,y){
  var bestS=0,bestD=1e9;
  for(var i=1;i<pts.length;i++){
    var ax=pts[i-1].x,ay=pts[i-1].y,bx=pts[i].x,by=pts[i].y;
    var abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby||1e-9;
    var t=((x-ax)*abx+(y-ay)*aby)/len2;t=Math.max(0,Math.min(1,t));
    var px=ax+abx*t,py=ay+aby*t,d=Math.hypot(x-px,y-py);
    if(d<bestD){bestD=d;bestS=cum[i-1]+Math.sqrt(len2)*t;}
  }
  return{s:bestS,d:bestD};
}

// ---------- game flow ----------
function snapCamera(){
  var e=pts[pts.length-1];
  camX=Math.max(-10,e.x-W*0.62);
  camY=e.y-H*0.55;
}
function reset(){
  resetTrack();
  var y0=H*0.38;
  addPoint(70,y0);
  addPoint(W*0.30,y0+34);
  addPoint(W*0.50,y0+84);
  addPoint(W*0.66,y0+104);
  state=ST.READY;
  cart.s=0;cart.v=0;
  var p=pointAt(0);cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
  score=0;maxPage=0;pageW=Math.max(280,W);
  floaters.length=0;stuckT=0;fall.t=0;
  snapCamera();
  elOverlay.style.display='none';
  setHint('Drag to draw & angle the track • Tap ON the track to release ⛄🛒');
}
function release(s){
  state=ST.RUN;
  cart.s=s;cart.v=2;
  var p=pointAt(s);cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
  setHint('Draw ahead of the cart — don\'t run out of track!');
  beep(520);
}
function startFall(dir){
  var p,tx,ty;
  if(dir===0){                                  // stalled: hole opens below
    fall.x=cart.x;fall.y=cart.y;fall.vx=0;fall.vy=0;
  }else{
    p=pointAt(dir<0?0:totalLen);
    tx=Math.cos(p.ang);ty=Math.sin(p.ang);
    fall.x=p.x;fall.y=p.y;
    fall.vx=tx*cart.v;fall.vy=ty*cart.v;
    if(dir<0)fall.vx=-Math.abs(fall.vx)-60;
  }
  fall.rot=cart.ang;
  fall.spin=fall.vx>=0?9:-9;
  fall.t=0;
  if(dir===0){hole.x=fall.x;hole.y=fall.y+160;}
  else{hole.x=fall.x+(fall.vx>=0?1:-1)*240;hole.y=fall.y+130;}
  state=ST.FALL;
  setHint('');
  beep(160);
}
function gameOver(){
  state=ST.OVER;
  if(score>best){best=score;try{localStorage.setItem('scl_best',String(best));}catch(e){diagExtra='no-storage';}}
  elFinal.textContent=score+' PTS';
  elFinalBest.textContent='Best: '+best+' • Pages: '+maxPage;
  elOverlay.style.display='flex';
  setHint('');
}

// ---------- update ----------
function update(dt){
  if(state===ST.RUN){
    var p0=pointAt(cart.s);
    var acc=G*Math.sin(p0.ang)-DRAG*cart.v-(cart.v>0?ROLL:(cart.v<0?-ROLL:0));
    cart.v+=acc*dt;
    if(cart.v>VMAX)cart.v=VMAX;else if(cart.v<-900)cart.v=-900;
    cart.s+=cart.v*dt;
    var p=pointAt(cart.s);
    cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
    var page=Math.floor(cart.x/pageW);
    if(page>maxPage){maxPage=page;score+=100;addFloater(cart.x,cart.y-46,'+100','#8cff5a');beep(880);}
    if(cart.s>=totalLen-0.5&&cart.v>0)startFall(1);
    else if(cart.s<=0.5&&cart.v<0)startFall(-1);
    else if(Math.abs(cart.v)<4&&Math.abs(G*Math.sin(p.ang))<40){stuckT+=dt;if(stuckT>1.4)startFall(0);}
    else stuckT=0;
  }else if(state===ST.FALL){
    fall.t+=dt;fall.vy+=G*dt;
    fall.x+=fall.vx*dt;fall.y+=fall.vy*dt;fall.rot+=fall.spin*dt;
    cart.x=fall.x;cart.y=fall.y;cart.ang=fall.rot;
    if(fall.t>0.9||Math.hypot(hole.x-fall.x,hole.y-fall.y)<70){state=ST.SUCK;suck.t=0;suck.scale=1;suck.rot=fall.rot;}
  }else if(state===ST.SUCK){
    suck.t+=dt;
    var dx=hole.x-cart.x,dy=hole.y-cart.y,d=Math.hypot(dx,dy)||1;
    var pull=280+suck.t*1000;
    cart.x+=dx/d*pull*dt;cart.y+=dy/d*pull*dt;
    suck.rot+=13*dt;cart.ang=suck.rot;
    suck.scale=Math.max(0,1-suck.t*1.6);
    if(suck.t>0.7||suck.scale<=0.02)gameOver();
  }
  // camera
  var tx,ty;
  if(state===ST.READY){
    var e=pts.length?pts[pts.length-1]:{x:0,y:0};
    tx=Math.max(-10,e.x-W*0.62);ty=e.y-H*0.55;
  }else{
    tx=cart.x-W*0.32;ty=cart.y-H*0.55;
  }
  var k=Math.min(1,dt*4);
  camX+=(tx-camX)*k;camY+=(ty-camY)*k;
}

// ---------- draw ----------
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#081226');g.addColorStop(0.6,'#10294a');g.addColorStop(1,'#1d3f66');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var i,sx,sy;
  for(i=0;i<stars.length;i++){var s=stars[i];
    sx=(s.x-camX*0.15)%W;if(sx<0)sx+=W;
    sy=(s.y-camY*0.15)%H;if(sy<0)sy+=H;
    ctx.globalAlpha=s.a;ctx.fillStyle='#dfeaff';ctx.fillRect(sx,sy,s.r,s.r);
  }
  ctx.globalAlpha=1;
  ctx.save();ctx.translate(-camX,-camY);
  drawTrack();
  drawEndMarker();
  if(state===ST.READY)drawTapHint();
  if(state===ST.RUN||state===ST.FALL||state===ST.SUCK)
    drawCart(cart.x,cart.y,cart.ang,state===ST.SUCK?suck.scale:1);
  if(state===ST.FALL||state===ST.SUCK||state===ST.OVER)drawHole();
  for(i=0;i<floaters.length;i++){var f=floaters[i];
    ctx.globalAlpha=Math.max(0,1-f.t/1.4);
    ctx.fillStyle=f.color;ctx.font='bold 22px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y-34*f.t);
  }
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(i=0;i<flakes.length;i++){ctx.beginPath();ctx.arc(flakes[i].x,flakes[i].y,1.6,0,7);ctx.fill();}
}
function drawTrack(){
  if(pts.length<2)return;
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.strokeStyle='#5b3a1a';ctx.lineWidth=7;ctx.stroke();
  ctx.strokeStyle='#caa06a';ctx.lineWidth=3;ctx.stroke();
}
function drawEndMarker(){
  if(state!==ST.READY&&state!==ST.RUN)return;
  var e=pts[pts.length-1],t=performance.now()/300;
  ctx.beginPath();ctx.arc(e.x,e.y,6+Math.sin(t)*2,0,7);
  ctx.fillStyle='rgba(255,220,120,.9)';ctx.fill();
}
function drawTapHint(){
  if(pts.length<2)return;
  var p=pointAt(Math.min(totalLen*0.2,120));
  var b=Math.sin(performance.now()/280)*5;
  ctx.font='26px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.globalAlpha=0.9;ctx.fillText('👆',p.x,p.y-26+b);ctx.globalAlpha=1;
}
function drawCart(x,y,ang,scale){
  if(scale<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(scale,scale);
  ctx.fillStyle='#1c1c22';
  ctx.beginPath();ctx.arc(-9,0,5.5,0,7);ctx.arc(9,0,5.5,0,7);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-17,-2);ctx.lineTo(17,-2);ctx.lineTo(11,-14);ctx.lineTo(-11,-14);ctx.closePath();
  ctx.fillStyle='#3a3f4a';ctx.fill();
  ctx.strokeStyle='#14161c';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#101014';
  ctx.beginPath();ctx.arc(-7,-14,4,0,7);ctx.arc(1,-16,4.5,0,7);ctx.arc(8,-14,3.6,0,7);ctx.fill();
  ctx.font='22px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('⛄',0,-16);
  ctx.restore();
}
function drawHole(){
  var t=performance.now()/1000,i,a0;
  var grd=ctx.createRadialGradient(hole.x,hole.y,4,hole.x,hole.y,60);
  grd.addColorStop(0,'rgba(0,0,0,1)');
  grd.addColorStop(0.55,'rgba(40,0,60,.9)');
  grd.addColorStop(1,'rgba(120,60,255,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(hole.x,hole.y,60,0,7);ctx.fill();
  ctx.strokeStyle='rgba(170,110,255,.85)';ctx.lineWidth=3;
  for(i=0;i<3;i++){a0=t*3+i*2.1;ctx.beginPath();ctx.arc(hole.x,hole.y,30+i*9,a0,a0+2.2);ctx.stroke();}
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hole.x,hole.y,20,0,7);ctx.fill();
}
function addFloater(x,y,text,color){floaters.push({x:x,y:y,text:text,color:color||'#fff',t:0});}

// ---------- audio (tiny, non-fatal) ----------
function beep(f){
  try{
    if(!AC){var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();}
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    o.frequency.value=f;o.type='triangle';
    g.gain.setValueAtTime(0.06,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+0.18);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+0.2);
  }catch(e){diagExtra='audio-off';}
}

// ---------- input ----------
var drawing=false,moved=false,downX=0,downY=0;
function toWorld(cx,cy){return{x:cx+camX,y:cy+camY};}
function setHint(s){elHint.textContent=s;}

window.addEventListener('pointerdown',function(e){
  e.preventDefault();
  downX=e.clientX;downY=e.clientY;moved=false;
  if(state===ST.OVER){reset();return;}
  if(state===ST.READY||state===ST.RUN)drawing=true;
},{passive:false});
window.addEventListener('pointermove',function(e){
  if(!drawing)return;
  e.preventDefault();
  if(!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)>12)moved=true;
  if(moved){var w=toWorld(e.clientX,e.clientY);addPoint(w.x,w.y);}
},{passive:false});
window.addEventListener('pointerup',function(e){
  if(!drawing)return;
  drawing=false;
  if(state===ST.READY&&!moved){
    var w=toWorld(e.clientX,e.clientY);
    var r=nearestOnTrack(w.x,w.y);
    if(r.d<44)release(r.s);
    else addFloater(w.x,w.y,'tap ON the line to release','#ffd76a');
  }
});
window.addEventListener('pointercancel',function(){drawing=false;});
document.addEventListener('gesturestart',function(e){e.preventDefault();});

// ---------- diagnostics (in-app only) ----------
window.addEventListener('error',function(e){
  elErr.style.display='block';
  elErr.textContent='ERROR: '+(e.message||e.type)+(e.lineno?(' @'+e.lineno):'');
});
function updateDiag(dt){
  diagT+=dt;if(diagT<0.2)return;diagT=0;
  elDiag.textContent='state '+STNAME[state]+' | fps '+Math.round(fpsEMA)+
    ' | v '+Math.round(cart.v)+'px/s | pts '+pts.length+' | len '+Math.round(totalLen)+
    ' | page '+maxPage+(diagExtra?' | '+diagExtra:'');
}

// ---------- main loop ----------
function frame(t){
  requestAnimationFrame(frame);
  try{
    if(!lastT)lastT=t;
    var dt=Math.min(0.033,Math.max(0.001,(t-lastT)/1000));lastT=t;
    fpsEMA=fpsEMA*0.95+(1/dt)*0.05;
    stepFlakes(dt);
    for(var i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;if(floaters[i].t>1.4)floaters.splice(i,1);}
    update(dt);
    draw();
    elScore.textContent=score;
    elBest.textContent='BEST '+best;
    updateDiag(dt);
  }catch(err){
    var now=performance.now();
    if(now-errShown>1000){errShown=now;elErr.style.display='block';
      elErr.textContent='ERROR: '+(err&&err.message?err.message:err);}
  }
}

try{best=parseInt(localStorage.getItem('scl_best')||'0',10)||0;}catch(e){diagExtra='no-storage';}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
