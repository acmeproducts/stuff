<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1e3a">
<title>Snowman Coal-Cart Line Rider</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b1e3a;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  #game{position:fixed;inset:0;display:block;touch-action:none;}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;
    display:flex;justify-content:center;align-items:baseline;gap:16px;
    pointer-events:none;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.65);z-index:5;}
  #hud .score{font-size:28px;font-weight:800;letter-spacing:1px;}
  #hud .best{font-size:13px;font-weight:600;opacity:.85;}
  #hud .timer{font-size:22px;font-weight:700;color:#8cff5a;min-width:64px;text-align:center;}
  #btnSettings{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:20;
    width:44px;height:44px;border-radius:50%;border:none;background:#2a3a5a;
    color:#fff;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.4);pointer-events:auto;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;cursor:pointer;
  }
  #btnSettings:active{transform:scale(0.92);background:#3a4a7a;}
  #hint{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);left:12px;right:12px;
    text-align:center;pointer-events:none;color:#eaf6ff;font-size:15px;
    text-shadow:0 2px 6px rgba(0,0,0,.75);z-index:5;}
  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;background:rgba(3,10,22,.9);z-index:8;color:#fff;text-align:center;touch-action:none;}
  #overlay h1{margin:0 0 6px;font-size:30px;font-weight:700;}
  #overlay .big{font-size:56px;font-weight:900;margin:4px 0;text-shadow:0 3px 12px rgba(0,0,0,.8);}
  #overlay .sub{margin:8px 0;font-size:18px;opacity:.9;}
  #overlay .cta{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  #ctrlRow{
    position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    left:0;right:0;display:flex;justify-content:center;align-items:center;gap:10px;
    padding:0 12px;z-index:10;pointer-events:none;
    transition:all .3s ease;
  }
  .ctrl-btn{
    height:64px;min-width:72px;flex:1 1 auto;max-width:160px;
    padding:0 10px;border-radius:16px;border:none;
    font-weight:900;font-size:14px;letter-spacing:0.5px;color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.25);
    pointer-events:auto;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    transition:transform .06s ease;user-select:none;
    background:linear-gradient(180deg,#444,#222);
  }
  .ctrl-btn:active{transform:scale(0.92);}
  #btnRescue{background:linear-gradient(180deg,#f5a623,#d78a00);}
  #btnBack{background:linear-gradient(180deg,#00aaff,#0077aa);}
  #btnJump{background:linear-gradient(180deg,#39b54a,#2a8a36);}
  #btnFront{background:linear-gradient(180deg,#ff4444,#cc0000);}

  /* Landscape optimization */
  @media (orientation: landscape) and (min-aspect-ratio: 16/9){
    #ctrlRow{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);}
    .ctrl-btn{height:48px;min-width:60px;font-size:12px;border-radius:12px;}
    #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 110px);font-size:13px;}
  }

  #settingsPanel{
    position:fixed;inset:0;background:rgba(5,12,28,.95);z-index:30;
    display:none;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);
    color:#fff;overflow-y:auto;touch-action:pan-y;
  }
  #settingsPanel h2{margin:0 0 20px;font-size:24px;}
  .setting-group{width:100%;max-width:400px;margin-bottom:20px;background:rgba(255,255,255,.08);padding:16px;border-radius:12px;}
  .setting-group h3{margin:0 0 12px;font-size:16px;color:#8cff5a;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .preset-btn{flex:1;min-width:60px;padding:10px;border-radius:8px;border:2px solid #444;background:#222;color:#fff;font-weight:700;font-size:14px;pointer-events:auto;}
  .preset-btn.active{border-color:#8cff5a;background:#1a3a1a;}
  .slider-wrap{display:flex;align-items:center;gap:12px;margin-top:8px;}
  .slider-wrap input[type=range]{flex:1;}
  .slider-label{min-width:80px;font-size:14px;font-weight:600;}
  .value-display{min-width:40px;text-align:right;font-size:14px;font-family:monospace;}
  select{width:100%;padding:10px;border-radius:8px;border:2px solid #444;background:#222;color:#fff;font-size:15px;margin-top:8px;}
  #closeSettings{margin-top:auto;width:100%;max-width:400px;padding:16px;border-radius:12px;border:none;background:linear-gradient(180deg,#39b54a,#2a8a36);color:#fff;font-weight:800;font-size:16px;pointer-events:auto;}
  .obstacle-preview{display:flex;gap:10px;margin-top:10px;align-items:center;font-size:13px;opacity:.8;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="score" id="score">0</div>
  <div class="timer" id="timer">0:00</div>
  <div class="best" id="best">BEST 0</div>
</div>
<button id="btnSettings" aria-label="Settings">⚙️</button>
<div id="hint">Draw to extend • Tap track to release ⛄🛒</div>

<div id="overlay">
  <h1>⛄🛒 → 🕳️</h1>
  <div class="big" id="finalScore">0</div>
  <div class="sub" id="finalBreakdown"></div>
  <div class="cta">TAP TO RIDE AGAIN</div>
</div>

<div id="ctrlRow">
  <button id="btnRescue" class="ctrl-btn">RESCUE x3</button>
  <button id="btnBack" class="ctrl-btn">BACK &lt;</button>
  <button id="btnJump" class="ctrl-btn">JUMP</button>
  <button id="btnFront" class="ctrl-btn">FRONT &gt;</button>
</div>

<div id="settingsPanel">
  <h2>⚙️ Settings</h2>
  
  <div class="setting-group">
    <h3>Intensity Preset</h3>
    <div class="btn-row">
      <button class="preset-btn" data-preset="low">Low</button>
      <button class="preset-btn" data-preset="med">Med</button>
      <button class="preset-btn" data-preset="high">High</button>
      <button class="preset-btn active" data-preset="custom">Custom</button>
    </div>
    <div class="slider-wrap" style="margin-top:12px;">
      <span class="slider-label">Jump</span>
      <input type="range" id="jumpForce" min="400" max="2000" step="100" value="800">
      <span class="value-display" id="jumpVal">800</span>
    </div>
    <div class="slider-wrap">
      <span class="slider-label">Flip</span>
      <input type="range" id="flipForce" min="200" max="1200" step="100" value="400">
      <span class="value-display" id="flipVal">400</span>
    </div>
  </div>

  <div class="setting-group">
    <h3>Audio Theme</h3>
    <select id="audioTheme">
      <option value="calm">Calm (Soft sine)</option>
      <option value="fun">Fun (Triangle up)</option>
      <option value="whimsical">Whimsical (Square vibrato)</option>
      <option value="zen">Zen (Sine reverb)</option>
    </select>
  </div>

  <div class="setting-group">
    <h3>Difficulty / Obstacles</h3>
    <div class="slider-wrap">
      <span class="slider-label">Zen</span>
      <input type="range" id="difficulty" min="0" max="3" step="1" value="1">
      <span class="slider-label">Hard</span>
    </div>
    <div class="obstacle-preview" id="diffLabel">Low: Few black holes</div>
  </div>

  <button id="closeSettings">SAVE & CLOSE</button>
</div>

<script>
(function(){
"use strict";

var cvs=document.getElementById('game'),ctx=cvs.getContext('2d',{alpha:false});
var elScore=document.getElementById('score'),elBest=document.getElementById('best'),
    elTimer=document.getElementById('timer'),elHint=document.getElementById('hint'),
    elOverlay=document.getElementById('overlay'),elFinal=document.getElementById('finalScore'),
    elBreak=document.getElementById('finalBreakdown'),
    btnRescue=document.getElementById('btnRescue'),btnBack=document.getElementById('btnBack'),
    btnJump=document.getElementById('btnJump'),btnFront=document.getElementById('btnFront'),
    btnSettings=document.getElementById('btnSettings'),
    settingsPanel=document.getElementById('settingsPanel'),
    closeSettings=document.getElementById('closeSettings'),
    jumpSlider=document.getElementById('jumpForce'),flipSlider=document.getElementById('flipForce'),
    jumpVal=document.getElementById('jumpVal'),flipVal=document.getElementById('flipVal'),
    audioSelect=document.getElementById('audioTheme'),diffSlider=document.getElementById('difficulty'),
    diffLabel=document.getElementById('diffLabel');

var W=0,H=0,DPR=1,zoom=1;
var stars=[],flakes=[];
var ST={READY:0,RUN:1,FALL:2,RESCUE_EDIT:3,SUCK:4,OVER:5};
var state=ST.READY;

var tracks=[],editTrack=0;
var cart={track:0,s:0,v:0,x:0,y:0,ang:0,flip:0,flipAng:0};
var fall={vx:0,vy:0,rot:0,spin:0,t:0,grace:0};
var hole={x:0,y:0};
var suck={t:0,scale:1,rot:0};
var camX=0,camY=0;
var maxPage=0,pageW=0;
var floaters=[];
var lastT=0;
var pointers=new Map();

var G=1050,DRAG=0.1,ROLL=5,VMAX=2000;
var AC=null;

var rescueCharges=3;
var survivalSeconds=0,runStartTime=0,isTiming=false;
var baseScore=0,rescueEditTrackIndex=-1;

// Settings & Physics
var settings={
  intensity:'med', // low/med/high/custom
  jumpForce:1200,
  flipForce:400,
  audioTheme:'fun',
  difficulty:1 // 0=zen,1=low,2=med,3=high
};
var jumpChain=0,jumpChainTime=0;
var obstacles=[];

// Presets
var PRESETS={
  low:{jump:800,flip:300},
  med:{jump:1200,flip:400},
  high:{jump:1800,flip:800}
};

function loadSettings(){
  try{
    var s=localStorage.getItem('scl_settings');
    if(s){
      settings=JSON.parse(s);
      applyUIFromSettings();
    }
  }catch(e){}
}
function saveSettings(){
  try{localSettings.setItem('scl_settings',JSON.stringify(settings));}catch(e){}
}
function applyUIFromSettings(){
  jumpSlider.value=settings.jumpForce;jumpVal.textContent=settings.jumpForce;
  flipSlider.value=settings.flipForce;flipVal.textContent=settings.flipForce;
  audioSelect.value=settings.audioTheme;
  diffSlider.value=settings.difficulty;
  updateDiffLabel(settings.difficulty);
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.toggle('active',b.dataset.preset===settings.intensity));
}
function updateDiffLabel(v){
  var txt=['Zen: No obstacles','Low: Few black holes','Med: Holes & rocks','Hard: Dense obstacles + fences'][v]||'Low';
  diffLabel.textContent=txt;
}

// Audio themes
function beep(f,dur){
  dur=dur||140;
  try{
    if(!AC){var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();}
    if(AC.state==='suspended')AC.resume();
    var o=AC.createOscillator(),g=AC.createGain();
    var theme=settings.audioTheme;
    if(theme==='calm'){o.type='sine';g.gain.setValueAtTime(0.06,AC.currentTime);}
    else if(theme==='whimsical'){o.type='square';g.gain.setValueAtTime(0.04,AC.currentTime);o.detune.value=Math.sin(Date.now()/50)*20;}
    else if(theme==='zen'){o.type='sine';g.gain.setValueAtTime(0.08,AC.currentTime);}
    else{o.type='triangle';g.gain.setValueAtTime(0.09,AC.currentTime);} // fun default
    o.frequency.value=f;
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur/1000);
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur/1000);
  }catch(e){}
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  pageW=Math.max(320,W);
  cvs.width=Math.round(W*DPR);cvs.height=Math.round(H*DPR);
  cvs.style.width=W+'px';cvs.style.height=H+'px';
  ctx.setTransform(DPR*zoom,0,0,DPR*zoom,0,0);
  seedSky();
}
function seedSky(){
  stars=[];flakes=[];
  for(var i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()<0.8?1:2,a:0.25+Math.random()*0.7});
  for(var i=0;i<50;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,v:16+Math.random()*34,d:Math.random()*6.28});
}
function stepFlakes(dt){
  var now=performance.now()/800;
  for(var i=0;i<flakes.length;i++){
    var f=flakes[i];f.y+=f.v*dt;f.x+=Math.sin(f.d+now)*10*dt;
    if(f.y>H+6){f.y=-6;f.x=Math.random()*W;}
    if(f.x>W+6)f.x=-6;else if(f.x<-6)f.x=W+6;
  }
}

function mkTrack(col){return{pts:[],cum:[0],totalLen:0,color:col||'#caa06a',rescue:false};}
function addPoint(ti,x,y){
  var tr=tracks[ti];if(!tr)return;
  if(tr.pts.length===0){tr.pts.push({x:x,y:y});return;}
  var last=tr.pts[tr.pts.length-1],dx=x-last.x,dy=y-last.y,d=Math.hypot(dx,dy);
  if(d<3)return;
  tr.pts.push({x:x,y:y});tr.totalLen+=d;tr.cum.push(tr.totalLen);
}
function pointAt(ti,s){
  var tr=tracks[ti];
  if(!tr||tr.pts.length===0)return{x:0,y:0,ang:0};
  if(tr.pts.length===1){var a=tr.pts[0];return{x:a.x,y:a.y,ang:0};}
  if(s<=0){var b=tr.pts[1];return{x:tr.pts[0].x,y:tr.pts[0].y,ang:Math.atan2(b.y-tr.pts[0].y,b.x-tr.pts[0].x)};}
  if(s>=tr.totalLen){var n=tr.pts.length,a=tr.pts[n-2],b=tr.pts[n-1];return{x:b.x,y:b.y,ang:Math.atan2(b.y-a.y,b.x-a.x)};}
  var i=1;while(i<tr.cum.length&&tr.cum[i]<s)i++;
  var i0=i-1,s0=tr.cum[i0],s1=tr.cum[i],t=(s-s0)/(s1-s0||1);
  var p0=tr.pts[i0],p1=tr.pts[i];
  return{x:p0.x+(p1.x-p0.x)*t,y:p0.y+(p1.y-p0.y)*t,ang:Math.atan2(p1.y-p0.y,p1.x-p0.x)};
}
function nearestOnAnyTrack(x,y){
  var best={track:-1,s:0,d:1e9};
  for(var i=0;i<tracks.length;i++){
    var tr=tracks[i],bS=0,bD=1e9;
    if(!tr||tr.pts.length<2)continue;
    for(var j=1;j<tr.pts.length;j++){
      var ax=tr.pts[j-1].x,ay=tr.pts[j-1].y,bx=tr.pts[j].x,by=tr.pts[j].y;
      var abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby||1e-9;
      var t=((x-ax)*abx+(y-ay)*aby)/len2;t=Math.max(0,Math.min(1,t));
      var px=ax+abx*t,py=ay+aby*t,d=Math.hypot(x-px,y-py);
      if(d<bD){bD=d;bS=tr.cum[j-1]+Math.sqrt(len2)*t;}
    }
    if(bD<best.d){best.track=i;best.s=bS;best.d=bD;}
  }
  return best;
}

// Obstacles
function generateObstacles(){
  obstacles=[];
  var d=settings.difficulty;
  if(d===0)return; // Zen
  var count=[0,3,6,12][d]||3;
  var types=d>=3?['blackhole','rock','fence']:['blackhole','rock'];
  for(var i=0;i<count;i++){
    var ox=800+Math.random()*3000;
    var oy=(H*0.2)+Math.random()*(H*0.5);
    var type=types[Math.floor(Math.random()*types.length)];
    var o={x:ox,y:oy,type:type,r:20+Math.random()*25};
    if(type==='fence'){o.w=80+Math.random()*60;o.h=12;}
    obstacles.push(o);
  }
}
function drawObstacles(){
  for(var i=0;i<obstacles.length;i++){
    var ob=obstacles[i];
    if(ob.type==='blackhole'){
      var grd=ctx.createRadialGradient(ob.x,ob.y,2,ob.x,ob.y,ob.r);
      grd.addColorStop(0,'rgba(0,0,0,1)');grd.addColorStop(1,'rgba(80,0,120,0)');
      ctx.fillStyle=grd;ctx.beginPath();ctx.arc(ob.x,ob.y,ob.r,0,Math.PI*2);ctx.fill();
    }else if(ob.type==='rock'){
      ctx.fillStyle='#5a5a5a';ctx.beginPath();
      ctx.arc(ob.x,ob.y,ob.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.stroke();
    }else if(ob.type==='fence'){
      ctx.fillStyle='#8b4513';ctx.fillRect(ob.x-ob.w/2,ob.y-ob.h/2,ob.w,ob.h);
      ctx.strokeStyle='#5c2e0b';ctx.strokeRect(ob.x-ob.w/2,ob.y-ob.h/2,ob.w,ob.h);
    }
  }
}
function checkObstacleCollisions(){
  if(settings.difficulty===0)return;
  for(var i=0;i<obstacles.length;i++){
    var ob=obstacles[i];
    var hit=false;
    if(ob.type==='blackhole'){
      if(Math.hypot(cart.x-ob.x,cart.y-ob.y)<ob.r-5)hit=true;
    }else if(ob.type==='rock'){
      if(Math.hypot(cart.x-ob.x,cart.y-ob.y)<ob.r+10)hit=true;
    }else if(ob.type==='fence'){
      if(Math.abs(cart.x-ob.x)<ob.w/2+12 && Math.abs(cart.y-ob.y)<ob.h/2+12)hit=true;
    }
    if(hit){crash('Obstacle!');return;}
  }
}
function crash(reason){
  addFloater(cart.x,cart.y,reason,'#ff4444');
  die();
}

function toWorld(cx,cy){return{x:cx/zoom+camX,y:cy/zoom+camY};}
function formatTime(sec){
  var m=Math.floor(sec/60),s=Math.floor(sec%60);
  return m+':'+(s<10?'0':'')+s;
}
function updateButtonText(){
  btnRescue.textContent='RESCUE x'+Math.max(0,rescueCharges);
}

function reset(){
  tracks=[mkTrack()];editTrack=0;
  var y0=H*0.38;
  addPoint(0,W*0.10,y0);addPoint(0,W*0.35,y0+40);addPoint(0,W*0.60,y0+90);
  state=ST.READY;
  cart={track:0,s:0,v:0,x:0,y:0,ang:0,flip:0,flipAng:0};
  var p=pointAt(0,0);cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
  baseScore=0;maxPage=0;floaters=[];fall.t=0;fall.grace=0;jumpChain=0;
  rescueCharges=3;rescueEditTrackIndex=-1;
  survivalSeconds=0;isTiming=false;runStartTime=0;
  zoom=1;resize();snapCamera();
  elOverlay.style.display='none';
  elHint.textContent='Draw to extend • Tap track to release ⛄🛒';
  generateObstacles();
  beep(600,80);
  updateButtonText();
}
function snapCamera(){
  var e=tracks[editTrack].pts[tracks[editTrack].pts.length-1];
  camX=Math.max(-10,e.x-W*0.58/zoom);camY=e.y-H*0.55/zoom;
}
function release(s,trackIdx){
  if(state!==ST.READY && state!==ST.RESCUE_EDIT)return;
  state=ST.RUN;cart.track=trackIdx||0;cart.s=s;cart.v=Math.max(cart.v,0);cart.flip=0;cart.flipAng=0;
  if(cart.v<200)cart.v=200;
  var p=pointAt(cart.track,cart.s);cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
  if(!isTiming){runStartTime=performance.now();isTiming=true;}
  elHint.textContent='Draw ahead • JUMP to fly • Flip if falling • RESCUE anytime';
  beep(520,100);
  updateButtonText();
}
function startFallOffTrack(reason){
  if(state!==ST.RUN)return;
  var p=pointAt(cart.track,Math.max(0,Math.min(tracks[cart.track].totalLen,cart.s)));
  fall.vx=Math.cos(cart.ang)*cart.v;
  fall.vy=Math.sin(cart.ang)*cart.v*0.5;
  fall.rot=cart.ang;
  fall.spin=fall.vx>=0?4:-4;
  fall.t=0;fall.grace=0.15;
  hole.x=p.x+(fall.vx>=0?300:-300);
  hole.y=p.y+180;
  state=ST.FALL;
  elHint.textContent='Falling! Draw to rescue • JUMP • Flip • RESCUE';
  beep(160,180);
}
function landOnTrack(ti,s){
  var p=pointAt(ti,s);
  cart.track=ti;cart.s=s;cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
  var dot=fall.vx*Math.cos(p.ang)+fall.vy*Math.sin(p.ang);
  cart.v=Math.min(VMAX,Math.max(-VMAX,dot));
  state=ST.RUN;cart.flip=0;cart.flipAng=0;fall.grace=0;jumpChain=0;
  if(!isTiming){runStartTime=performance.now();isTiming=true;}
  addFloater(cart.x,cart.y-50,'LAND','#8cff5a');
  beep(880,120);
}
function doRescue(){
  if(rescueCharges<=0){
    addFloater(cart.x,cart.y,'NO CHARGES','#ff4444');
    beep(150,100);beep(150,100);
    return;
  }
  rescueCharges--;
  var col='#ffaa00';
  if(rescueCharges===1)col='#00aaff';
  if(rescueCharges===0)col='#ff3333';
  var idx=tracks.length;
  var tr=mkTrack(col);tr.rescue=true;tracks.push(tr);
  rescueEditTrackIndex=idx;
  editTrack=idx;
  var p;
  if(state===ST.READY||state===ST.RUN){
    p={x:cart.x,y:cart.y+10};
  }else if(state===ST.FALL){
    p={x:cart.x,y:cart.y+10};
  }else{
    p=pointAt(cart.track,Math.min(cart.s,tracks[cart.track].totalLen));
  }
  addPoint(idx,p.x,p.y);
  addPoint(idx,p.x+120,p.y+10);
  state=ST.RESCUE_EDIT;
  camX+=(p.x-camX)*0.5;camY+=(p.y-camY)*0.5;
  elHint.textContent='Rescue freeze! Draw, then tap the cart';
  beep(900,160);
  updateButtonText();
}
function doJump(){
  var now=performance.now();
  if(now-jumpChainTime>800)jumpChain=0;
  jumpChainTime=now;jumpChain++;

  var force=settings.jumpForce;
  if(jumpChain>=3)force=Math.min(2200,force*1.6);// Triple jump = big pop

  if(state===ST.RUN){
    fall.vx=Math.cos(cart.ang)*Math.abs(cart.v);
    fall.vy=-force;
    fall.rot=cart.ang;
    fall.spin=0;
    fall.t=0;fall.grace=0.12;
    cart.flip=0;cart.flipAng=0;
    state=ST.FALL;
    beep(520+jumpChain*80,140);
    addFloater(cart.x,cart.y-50,jumpChain>=3?'BIG JUMP!':'JUMP','#8cff5a');
  }else if(state===ST.FALL){
    fall.vy-=force*0.6;
    if(fall.vy<-4000)fall.vy=-4000;
    fall.spin+=(fall.vx>=0?3:-3);
    beep(800,100);
    addFloater(cart.x,cart.y-70,'BOOST','#ffd700');
  }else{
    beep(200,60);
  }
}
function triggerFlip(isFront){
  if(state===ST.RUN){
    fall.vx=Math.cos(cart.ang)*Math.abs(cart.v);
    fall.vy=-settings.flipForce;
    fall.rot=cart.ang;
    fall.spin=0;
    fall.t=0;fall.grace=0.12;
    cart.flip=1;cart.flipAng=0;
    state=ST.FALL;
    beep(520,100);
  }else if(state===ST.FALL){
    cart.flip=1;cart.flipAng=0;fall.grace=0.12;
  }else{
    return;
  }

  var f=settings.flipForce;
  if(isFront){
    fall.vx = Math.abs(fall.vx) + f*0.8;
    fall.vy -= f*0.6;
    if(fall.vy < -3500) fall.vy = -3500;
    fall.spin += 6;
    beep(600,100);beep(950,130);
    addFloater(cart.x,cart.y-60,'FLIP >','#ff6666');
  }else{
    fall.vx = -Math.abs(fall.vx) - f*0.5;
    fall.vy -= f*0.8;
    if(fall.vy < -3500) fall.vy = -3500;
    fall.spin -= 5;
    beep(450,130);beep(700,160);
    addFloater(cart.x,cart.y-60,'< FLIP','#66ccff');
  }
}
function die(){
  if(isTiming){survivalSeconds+=(performance.now()-runStartTime)/1000;isTiming=false;}
  state=ST.SUCK;suck.t=0;suck.scale=1;suck.rot=cart.ang;
  beep(120,300);
}
function gameOver(){
  state=ST.OVER;
  var finalScore=baseScore+Math.floor(survivalSeconds*10);
  try{if(finalScore>parseInt(localStorage.getItem('scl_best')||'0',10))localStorage.setItem('scl_best',String(finalScore));}catch(e){}
  var bestScore=0;try{bestScore=parseInt(localStorage.getItem('scl_best')||'0',10);}catch(e){}
  elFinal.textContent=finalScore+' PTS';
  elBreak.textContent='Base '+baseScore+' • Time '+formatTime(Math.floor(survivalSeconds))+' ×10 • Best '+bestScore;
  elOverlay.style.display='flex';
  elHint.textContent='';
}
function addFloater(x,y,text,color){
  floaters.push({x:x,y:y,text:text,color:color||'#fff',t:0});
}
function update(dt){
  if(isTiming&&(state===ST.RUN||state===ST.FALL)){
    var now=performance.now();
    var current=survivalSeconds+(now-runStartTime)/1000;
    elTimer.textContent=formatTime(Math.floor(current));
  }else{
    elTimer.textContent=formatTime(Math.floor(survivalSeconds));
  }

  if(state===ST.RESCUE_EDIT){
    camX+=(cart.x-W*0.35/zoom - camX)*Math.min(1,dt*4);
    camY+=(cart.y-H*0.55/zoom - camY)*Math.min(1,dt*4);
    return;
  }

  // Camera follow with deadzone to keep cart visible
  var tx,ty;
  if(state===ST.READY){var e=tracks[editTrack].pts[tracks[editTrack].pts.length-1];tx=e.x-W*0.58/zoom;ty=e.y-H*0.55/zoom;}
  else if(state===ST.RUN||state===ST.FALL){
    tx=cart.x-W*0.35/zoom;ty=cart.y-H*0.55/zoom;
    // If falling high, keep camera lower so cart stays in view
    if(state===ST.FALL && cart.y<camY+H*0.2){ty=cart.y-H*0.3/zoom;}
  }else if(state===ST.SUCK||state===ST.OVER){tx=camX;ty=camY;}
  
  var k=Math.min(1,dt*4);camX+=(tx-camX)*k;camY+=(ty-camY)*k;

  if(state===ST.RUN){
    checkObstacleCollisions();
    var tr=tracks[cart.track];
    if(!tr||tr.pts.length<2){startFallOffTrack('notrack');return;}
    var p0=pointAt(cart.track,cart.s);
    var acc=G*Math.sin(p0.ang)-DRAG*cart.v-(cart.v>0?ROLL:(cart.v<0?-ROLL:0));
    cart.v+=acc*dt;
    if(cart.v>VMAX)cart.v=VMAX;else if(cart.v<-VMAX)cart.v=-VMAX;
    cart.s+=cart.v*dt;
    
    if(cart.s>tr.totalLen&&cart.v>0){startFallOffTrack('end');return;}
    
    var p=pointAt(cart.track,cart.s);cart.x=p.x;cart.y=p.y;cart.ang=p.ang;
    var page=Math.floor(cart.x/pageW);
    if(page>maxPage){maxPage=page;baseScore+=100;addFloater(cart.x,cart.y-50,'+100','#8cff5a');beep(880,100);}
  }else if(state===ST.FALL){
    fall.t+=dt;
    if(fall.grace>0)fall.grace-=dt;
    if(cart.flip===1){
      cart.flipAng+= (Math.PI*2)/0.5 * dt;
      if(cart.flipAng>=Math.PI*2){cart.flip=2;cart.flipAng=Math.PI*2;}
    }
    fall.vy+=G*dt;
    fall.vx*=0.998;
    cart.x+=fall.vx*dt;cart.y+=fall.vy*dt;
    cart.ang+=fall.spin*dt;
    
    var land=nearestOnAnyTrack(cart.x,cart.y);
    if(fall.grace<=0 && land.d<38 && land.d < Math.abs(fall.vy)*0.06+16 && fall.vy>0){
      landOnTrack(land.track,land.s);return;
    }
    if(cart.y > Math.max(H/zoom,camY+H/zoom)+500 || fall.t>10){
      hole.x=cart.x;hole.y=cart.y+200;die();
    }
  }else if(state===ST.SUCK){
    suck.t+=dt;
    var dx=hole.x-cart.x,dy=hole.y-cart.y,d=Math.hypot(dx,dy)||1;
    var pull=600+suck.t*2000;
    cart.x+=dx/d*pull*dt;cart.y+=dy/d*pull*dt;
    suck.rot+=22*dt;cart.ang=suck.rot;
    suck.scale=Math.max(0,1-suck.t*2);
    if(suck.t>0.8||suck.scale<=0.02)gameOver();
  }
}
function draw(){
  ctx.save();
  ctx.setTransform(DPR*zoom,0,0,DPR*zoom,-camX*DPR*zoom,-camY*DPR*zoom);
  ctx.fillStyle='#0b1e3a';ctx.fillRect(camX,camY,W/zoom,H/zoom);
  for(var i=0;i<stars.length;i++){
    var s=stars[i],sx=(s.x-camX*0.1*zoom)%W;if(sx<0)sx+=W;
    var sy=(s.y-camY*0.1*zoom)%H;if(sy<0)sy+=H;
    ctx.globalAlpha=s.a;ctx.fillStyle='#dfeaff';ctx.fillRect(sx/zoom+camX,sy/zoom+camY,s.r/zoom,s.r/zoom);
  }
  ctx.globalAlpha=1;
  for(var ti=0;ti<tracks.length;ti++){
    var tr=tracks[ti];if(!tr||tr.pts.length<2)continue;
    ctx.beginPath();ctx.moveTo(tr.pts[0].x,tr.pts[0].y);
    for(var j=1;j<tr.pts.length;j++)ctx.lineTo(tr.pts[j].x,tr.pts[j].y);
    ctx.strokeStyle='#5b3a1a';ctx.lineWidth=9/zoom;ctx.stroke();
    ctx.strokeStyle=tr.color;ctx.lineWidth=3.5/zoom;ctx.stroke();
    if(tr.rescue){ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=8/zoom;ctx.stroke();}
  }
  drawObstacles();
  if(state===ST.READY||state===ST.RESCUE_EDIT){
    var et=tracks[editTrack];if(et&&et.pts.length){
      var e=et.pts[et.pts.length-1],t=performance.now()/250;
      ctx.beginPath();ctx.arc(e.x,e.y,9+Math.sin(t)*4,0,Math.PI*2);
      ctx.fillStyle='rgba(255,220,120,.9)';ctx.fill();
    }
  }
  if(state===ST.FALL||state===ST.SUCK||state===ST.OVER)drawHole();
  var scl=(state===ST.SUCK)?suck.scale:1;
  var ang=cart.ang+((state===ST.FALL&&cart.flip>0)?cart.flipAng:0);
  drawCart(cart.x,cart.y,ang,scl);
  for(i=0;i<floaters.length;i++){
    var f=floaters[i];f.t+=0.016;
    ctx.globalAlpha=Math.max(0,1-f.t/1.2);
    ctx.fillStyle=f.color;ctx.font='bold 24px system-ui,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.text,f.x,f.y-50*f.t);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.85)';
  for(i=0;i<flakes.length;i++){
    var fx=(flakes[i].x-camX*0.04*zoom)%W;if(fx<0)fx+=W;
    var fy=(flakes[i].y-camY*0.04*zoom)%H;if(fy<0)fy+=H;
    ctx.beginPath();ctx.arc(fx/zoom+camX,fy/zoom+camY,2.5/zoom,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawCart(x,y,a,s){
  if(s<=0)return;
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.scale(s,s);
  ctx.fillStyle='#1c1c22';ctx.beginPath();ctx.arc(-10,0,6,0,Math.PI*2);ctx.arc(10,0,6,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-18,-3);ctx.lineTo(18,-3);ctx.lineTo(12,-16);ctx.lineTo(-12,-16);ctx.closePath();
  ctx.fillStyle='#3a3f4a';ctx.fill();ctx.strokeStyle='#14161c';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#101014';ctx.beginPath();ctx.arc(-8,-16,4,0,Math.PI*2);ctx.arc(0,-18,5,0,Math.PI*2);ctx.arc(8,-16,4,0,Math.PI*2);ctx.fill();
  ctx.font='24px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('⛄',0,-18);
  ctx.restore();
}
function drawHole(){
  var t=performance.now()/900;
  var grd=ctx.createRadialGradient(hole.x,hole.y,8,hole.x,hole.y,90);
  grd.addColorStop(0,'rgba(0,0,0,1)');grd.addColorStop(0.5,'rgba(40,0,70,.95)');grd.addColorStop(1,'rgba(130,60,255,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(hole.x,hole.y,90,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(180,120,255,.9)';ctx.lineWidth=4/zoom;
  for(var i=0;i<3;i++){var a0=t+i*2.1;ctx.beginPath();ctx.arc(hole.x,hole.y,40+i*15,a0,a0+2.4);ctx.stroke();}
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(hole.x,hole.y,26,0,Math.PI*2);ctx.fill();
}

var drawing=false,moved=false,downX=0,downY=0,pinchStartDist=0,startZoom=1;

btnRescue.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();doRescue();});
btnBack.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();triggerFlip(false);});
btnFront.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();triggerFlip(true);});
btnJump.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();doJump();});

// Settings UI handlers
btnSettings.addEventListener('click',function(){
  settingsPanel.style.display='flex';
});
closeSettings.addEventListener('click',function(){
  settingsPanel.style.display='none';
  saveSettings();
});

document.querySelectorAll('.preset-btn').forEach(function(btn){
  btn.addEventListener('click',function(){
    var p=btn.dataset.preset;
    settings.intensity=p;
    document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(PRESETS[p]){
      settings.jumpForce=PRESETS[p].jump;
      settings.flipForce=PRESETS[p].flip;
      jumpSlider.value=settings.jumpForce;jumpVal.textContent=settings.jumpForce;
      flipSlider.value=settings.flipForce;flipVal.textContent=settings.flipForce;
    }
  });
});
jumpSlider.addEventListener('input',function(){
  settings.intensity='custom';
  settings.jumpForce=parseInt(this.value);
  jumpVal.textContent=this.value;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-preset="custom"]').classList.add('active');
});
flipSlider.addEventListener('input',function(){
  settings.intensity='custom';
  settings.flipForce=parseInt(this.value);
  flipVal.textContent=this.value;
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-preset="custom"]').classList.add('active');
});
audioSelect.addEventListener('change',function(){settings.audioTheme=this.value;});
diffSlider.addEventListener('input',function(){
  settings.difficulty=parseInt(this.value);
  updateDiffLabel(settings.difficulty);
});

window.addEventListener('pointerdown',function(e){
  if(e.target.closest('.ctrl-btn')||e.target.closest('#settingsPanel')||e.target.closest('#btnSettings'))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){
    var pts=Array.from(pointers.values()),dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
    pinchStartDist=Math.hypot(dx,dy);startZoom=zoom;drawing=false;return;
  }
  downX=e.clientX;downY=e.clientY;moved=false;
  if(state===ST.OVER){reset();return;}
  if(state===ST.READY||state===ST.RUN||state===ST.RESCUE_EDIT){
    drawing=true;
  }else if(state===ST.FALL){
    // Draw-to-rescue: touching canvas while falling initiates rescue mode
    doRescue();
    if(state===ST.RESCUE_EDIT) drawing=true;
  }
},{passive:false});
window.addEventListener('pointermove',function(e){
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&pinchStartDist>0){
    var pts=Array.from(pointers.values()),dx=pts[0].x-pts[1].x,dy=pts[0].y-pts[1].y;
    zoom=Math.max(0.35,Math.min(3.5,startZoom*Math.hypot(dx,dy)/pinchStartDist));
    resize();return;
  }
  if(!drawing)return;
  if(!moved&&Math.hypot(e.clientX-downX,e.clientY-downY)>10)moved=true;
  if(moved){
    var w=toWorld(e.clientX,e.clientY);addPoint(editTrack,w.x,w.y);
  }
},{passive:false});
window.addEventListener('pointerup',function(e){
  pointers.delete(e.pointerId);if(pointers.size<2)pinchStartDist=0;
  if(e.target.closest('.ctrl-btn')||e.target.closest('#settingsPanel')||e.target.closest('#btnSettings'))return;
  var wasDrawing=drawing;drawing=false;
  if(state===ST.OVER)return;
  if(state===ST.READY&&wasDrawing&&!moved){
    var w=toWorld(e.clientX,e.clientY),best=nearestOnAnyTrack(w.x,w.y);
    if(best.track>=0&&best.d<70)release(best.s,best.track);
    else addFloater(w.x,w.y,'Tap track','#ffd76a');
  }else if(state===ST.RESCUE_EDIT&&wasDrawing&&!moved){
    var w=toWorld(e.clientX,e.clientY);
    if(Math.hypot(w.x-cart.x,w.y-cart.y)<100){
      var rt=tracks[rescueEditTrackIndex];
      if(rt&&rt.pts.length>=2){
        release(0,rescueEditTrackIndex);
      }else{
        addFloater(cart.x,cart.y,'Draw the line','#ffaa00');
      }
    }else{
      addPoint(editTrack,w.x,w.y);
    }
  }
});
window.addEventListener('pointercancel',function(){drawing=false;pointers.clear();pinchStartDist=0;});
window.addEventListener('wheel',function(e){
  if(e.ctrlKey||e.metaKey){e.preventDefault();zoom=Math.max(0.35,Math.min(3.5,zoom*(e.deltaY>0?0.9:1.1)));resize();}
},{passive:false});
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,300);});

loadSettings();
resize();reset();
requestAnimationFrame(function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.04,Math.max(0.001,(t-(lastT||t))/1000));lastT=t;
  stepFlakes(dt);
  for(var i=floaters.length-1;i>=0;i--){if(floaters[i].t>1.3)floaters.splice(i,1);}
  update(dt);draw();
  elScore.textContent=baseScore;
  try{var b=parseInt(localStorage.getItem('scl_best')||'0',10);elBest.textContent='BEST '+b;}catch(e){elBest.textContent='BEST 0';}
});
})();
</script>
