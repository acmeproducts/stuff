<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rent vs Buy Analyzer Pro</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Loaded sequentially) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for parsing JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Recharts Dependencies (Stable versions to prevent crashes) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>

    <style>
      /* Print-specific styling to ensure clean PDF exports */
      @media print {
        body * { visibility: hidden; }
        .print-wrapper, .print-wrapper * { visibility: visible; }
        .print-wrapper { position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0; }
        .hide-on-print { display: none !important; }
        .print-title { display: block !important; margin-bottom: 20px; }
        .no-page-break { page-break-inside: avoid; }
        .chart-container { border: none !important; box-shadow: none !important; }
        @page { margin: 1cm; }
      }
      
      /* Smooth animations */
      .fade-in { animation: fadeIn 0.3s ease-in-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      /* Hide scrollbar for cleaner look */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = window.React;
        const { 
          LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, 
          Legend, ResponsiveContainer, Area, AreaChart 
        } = window.Recharts;

        // Constants for Local Storage
        const STORAGE_KEY_CONFIG = 'analyzer_pro_config_openrouter';
        const STORAGE_KEY_LIBRARY = 'analyzer_pro_library_analyses';
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        // Locked Free Model for 100% Free Inference
        const FREE_AI_MODEL = 'meta-llama/llama-3.1-8b-instruct:free';

        const Menu = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const Settings = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const CalculatorIcon = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><line x1="8" y1="10" x2="8" y2="10.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="16" y1="10" x2="16" y2="10.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="8" y1="18" x2="8" y2="18.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line></svg>;
        const Sparkles = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const BookOpen = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const ChevronRight = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const Save = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const Printer = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const Trash2 = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Check = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const AlertCircle = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const ArrowRight = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const Home = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const Clock = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const Search = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;

        const runFinancialAnalysis = (params) => {
          const {
            homePrice, downPaymentPct, mortgageRate, taxRate, hoa, insurance, appreciation,
            rentPrice, rentInflation, investmentReturn, years
          } = params;

          let currentHomeValue = parseFloat(homePrice);
          let loanBalance = currentHomeValue * (1 - parseFloat(downPaymentPct) / 100);
          let initialDownPayment = currentHomeValue - loanBalance;
          
          let monthlyRate = (parseFloat(mortgageRate) / 100) / 12;
          let totalMonths = 30 * 12;
          
          let monthlyMortgage = 0;
          if (monthlyRate > 0) {
            monthlyMortgage = loanBalance * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
          } else {
            monthlyMortgage = loanBalance / totalMonths;
          }

          let currentRent = parseFloat(rentPrice);
          let portfolio = initialDownPayment; // Renter invests the exact same initial cash layout

          let monthlyInvRate = (parseFloat(investmentReturn) / 100) / 12;
          let annualApprecRate = parseFloat(appreciation) / 100;
          let annualRentInfRate = parseFloat(rentInflation) / 100;

          let chartData = [];
          let buyTotalCashSpent = initialDownPayment;
          let rentTotalCashSpent = 0; 

          let year1BuyMonthly = 0;
          let year1RentMonthly = 0;
          let finalBuyMonthly = 0;
          let finalRentMonthly = 0;

          chartData.push({
            year: 0,
            buyNetWorth: initialDownPayment,
            rentNetWorth: initialDownPayment,
            buyCost: 0,
            rentCost: 0
          });

          for (let m = 1; m <= years * 12; m++) {
            let yearIndex = Math.floor((m - 1) / 12);
            
            let monthlyTax = (currentHomeValue * (parseFloat(taxRate) / 100)) / 12;
            let inflatedHoa = parseFloat(hoa) * Math.pow(1.03, yearIndex);
            let inflatedIns = parseFloat(insurance) * Math.pow(1.03, yearIndex);
            
            let buyMonthlyCost = monthlyMortgage + monthlyTax + inflatedHoa + inflatedIns;
            let actualRentCost = currentRent * Math.pow(1 + annualRentInfRate, yearIndex);

            if (m === 1) {
              year1BuyMonthly = buyMonthlyCost;
              year1RentMonthly = actualRentCost;
            }
            if (m === years * 12) {
              finalBuyMonthly = buyMonthlyCost;
              finalRentMonthly = actualRentCost;
            }

            buyTotalCashSpent += buyMonthlyCost;
            rentTotalCashSpent += actualRentCost;

            // THE DELTA EQUALIZER
            let delta = buyMonthlyCost - actualRentCost;
            portfolio = portfolio * (1 + monthlyInvRate) + delta;

            // Amortization
            let interest = loanBalance * monthlyRate;
            let principal = monthlyMortgage - interest;
            loanBalance = Math.max(0, loanBalance - principal);
            
            // Appreciation
            currentHomeValue *= Math.pow(1 + annualApprecRate, 1/12);

            if (m % 12 === 0) {
              chartData.push({
                year: m / 12,
                buyNetWorth: Math.max(0, currentHomeValue - loanBalance),
                rentNetWorth: Math.max(0, portfolio),
                buyCost: buyMonthlyCost,
                rentCost: actualRentCost
              });
            }
          }

          const finalBuyWealth = currentHomeValue - loanBalance;
          const finalRentWealth = portfolio;

          return {
            chartData,
            summary: {
              year1BuyMonthly,
              year1RentMonthly,
              finalBuyMonthly,
              finalRentMonthly,
              buyTotalCashSpent,
              rentTotalCashSpent,
              finalBuyWealth,
              finalRentWealth,
              netAdvantage: finalBuyWealth - finalRentWealth,
              winner: finalBuyWealth > finalRentWealth ? 'Buy' : 'Rent'
            },
            params
          };
        };

        const Toast = ({ message, type = 'success', onClose }) => {
          if (!message) return null;
          return (
            <div className="fixed bottom-4 right-4 z-[9999] fade-in">
              <div className={`flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                {type === 'success' ? <Check size={16} /> : <AlertCircle size={16} />}
                {message}
                <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100">×</button>
              </div>
            </div>
          );
        };

        const TabButton = ({ active, children, onClick }) => (
          <button
            onClick={onClick}
            className={`px-4 py-3 font-medium text-sm transition-colors border-b-2 whitespace-nowrap ${
              active ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
            }`}
          >
            {children}
          </button>
        );

        const InputField = ({ label, value, onChange, icon: Icon, prefix, suffix, type = "number", className="" }) => (
          <div className={`flex flex-col gap-1.5 ${className}`}>
            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">{label}</label>
            <div className="relative flex items-center bg-gray-50 border border-gray-200 rounded-md overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
              {Icon && <div className="pl-3 pr-2 text-gray-400"><Icon size={14} /></div>}
              {prefix && <span className="pl-3 pr-1 text-gray-500 font-medium text-sm">{prefix}</span>}
              <input
                type={type}
                value={value}
                onChange={(e) => onChange(e.target.value)}
                className="w-full py-2 px-2 bg-transparent text-sm font-semibold text-gray-900 outline-none"
              />
              {suffix && <span className="pr-3 pl-1 text-gray-500 font-medium text-sm">{suffix}</span>}
            </div>
          </div>
        );

        // Helper to extract JSON from free LLMs that like to inject text
        const extractJSON = (rawText) => {
          try {
            const start = rawText.indexOf('{');
            const end = rawText.lastIndexOf('}');
            if (start === -1 || end === -1) throw new Error("Could not locate JSON in response.");
            const jsonString = rawText.substring(start, end + 1);
            return JSON.parse(jsonString);
          } catch (e) {
            console.error("Parse error. Raw text was:", rawText);
            throw new Error("Failed to parse AI output. Try again.");
          }
        };

        const ConfigStep = ({ setToast }) => {
          const [apiKey, setApiKey] = useState('');
          const [isLoading, setIsLoading] = useState(false);
          const [apiError, setApiError] = useState('');
          const [successMsg, setSuccessMsg] = useState('');

          useEffect(() => {
            const savedKey = localStorage.getItem(STORAGE_KEY_CONFIG);
            if (savedKey) setApiKey(savedKey);
          }, []);

          const testAndSaveConfig = async () => {
            setIsLoading(true);
            setApiError('');
            setSuccessMsg('');
            try {
              if (!apiKey.trim()) throw new Error("API Key cannot be empty.");
              
              // Perform a live ping to verify the key against the free model
              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${apiKey}`,
                  "Content-Type": "application/json",
                  "HTTP-Referer": window.location.href,
                  "X-Title": "Rent vs Buy Analyzer"
                },
                body: JSON.stringify({
                  model: FREE_AI_MODEL,
                  messages: [{ role: "user", content: "Respond strictly with the word 'OK'." }]
                })
              });

              if (!response.ok) {
                const errorData = await response.text();
                throw new Error(`API Verification Failed (${response.status}): ${errorData}`);
              }

              // Key is valid, save to storage
              localStorage.setItem(STORAGE_KEY_CONFIG, apiKey);
              setSuccessMsg(`API Key validated successfully. The app is locked to the 100% free model: ${FREE_AI_MODEL}`);
              setToast({ message: 'Configuration Saved!', type: 'success' });
            } catch (error) {
              setApiError(error.message);
              setToast({ message: 'Error validating key.', type: 'error' });
            }
            setIsLoading(false);
          };

          return (
            <div className="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-sm border border-gray-100 fade-in">
              <div className="flex items-center gap-3 mb-6">
                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Settings size={24} /></div>
                <div>
                  <h2 className="text-xl font-bold text-gray-900">Application Configuration</h2>
                  <p className="text-sm text-gray-500">Set up your API key to enable AI-powered comp generation.</p>
                </div>
              </div>
              <div className="space-y-5">
                
                <div className="flex flex-col gap-1.5">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">OpenRouter API Key</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="sk-or-v1-..."
                    className="w-full p-3 bg-gray-50 border border-gray-200 rounded-md text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  />
                  <p className="text-xs text-gray-400 mt-1">Stored securely in your browser's local storage.</p>
                </div>

                <div className="p-4 bg-emerald-50 text-emerald-800 text-sm border border-emerald-200 rounded-lg flex gap-3">
                  <Sparkles size={20} className="shrink-0 text-emerald-600 mt-0.5" />
                  <div>
                    <strong>100% Free Inference Guaranteed</strong>
                    <p className="mt-1 opacity-90">This application is hardcoded to route all requests through <code>{FREE_AI_MODEL}</code>. You will never be charged for API usage.</p>
                  </div>
                </div>

                {apiError && (
                  <div className="p-4 bg-red-50 text-red-700 text-sm border border-red-200 rounded-lg break-words max-h-48 overflow-y-auto font-mono">
                    <strong>Validation Error:</strong><br/>{apiError}
                  </div>
                )}
                
                {successMsg && (
                  <div className="p-4 bg-green-50 text-green-700 text-sm border border-green-200 rounded-lg">
                    {successMsg}
                  </div>
                )}

                <button
                  onClick={testAndSaveConfig}
                  disabled={isLoading}
                  className="w-full sm:w-auto px-6 py-2.5 bg-gray-900 text-white font-medium rounded-md hover:bg-gray-800 disabled:opacity-50 transition-colors flex justify-center items-center gap-2"
                >
                  {isLoading ? 'Testing Key...' : <><Check size={16}/> Test & Save Configuration</>}
                </button>
              </div>
            </div>
          );
        };

        const ResultsDisplay = ({ analysis, onCommit, isSaving }) => {
          if (!analysis) return <div className="p-8 text-center text-gray-500">Run an analysis to see results.</div>;
          const { summary, chartData } = analysis;
          const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);

          return (
            <div className="space-y-8 fade-in duration-500 print-wrapper max-w-5xl mx-auto">
              
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b pb-4 hide-on-print">
                <h2 className="text-xl font-bold text-gray-900">Analysis Results</h2>
                <div className="flex gap-2 w-full sm:w-auto">
                  <button onClick={() => window.print()} className="flex-1 sm:flex-none justify-center flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-md transition-colors">
                    <Printer size={16} /> Print
                  </button>
                  {onCommit && (
                    <button onClick={onCommit} disabled={isSaving} className="flex-1 sm:flex-none justify-center flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors disabled:opacity-50">
                      <Save size={16} /> {isSaving ? 'Saving...' : 'Commit to Library'}
                    </button>
                  )}
                </div>
              </div>

              <div className="hidden print-title text-2xl font-bold mb-6 text-gray-900">
                Rent vs. Buy Financial Analysis ({analysis.params.years}-Year Outlook)
              </div>

              <div className={`p-6 rounded-xl border-l-4 shadow-sm ${summary.winner === 'Buy' ? 'bg-emerald-50 border-emerald-500' : 'bg-blue-50 border-blue-500'}`}>
                <h3 className="text-lg font-bold text-gray-900 mb-2">The Bottom Line</h3>
                <p className="text-sm text-gray-700 leading-relaxed">
                  Based on the Delta Equalizer model, <strong>{summary.winner}ing</strong> is the financially optimal strategy over a {analysis.params.years}-year horizon. 
                  It generates <strong>{formatCurrency(Math.abs(summary.netAdvantage))}</strong> more in total asset wealth compared to the alternative.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="p-5 bg-white border border-gray-200 rounded-xl shadow-sm">
                  <div className="flex items-center gap-2 mb-4 text-blue-700 font-bold"><Home size={18} /> Purchase Scenario</div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Year 1 Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.year1BuyMonthly)}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Final Year Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.finalBuyMonthly)}</span></div>
                    <div className="h-px bg-gray-100 my-2"></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Ending Asset Wealth:</span><span className="font-bold text-emerald-600">{formatCurrency(summary.finalBuyWealth)}</span></div>
                  </div>
                </div>
                <div className="p-5 bg-white border border-gray-200 rounded-xl shadow-sm">
                  <div className="flex items-center gap-2 mb-4 text-purple-700 font-bold"><Clock size={18} /> Rental Scenario</div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Year 1 Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.year1RentMonthly)}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Final Year Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.finalRentMonthly)}</span></div>

            try {
              const items = JSON.parse(localStorage.getItem(STORAGE_KEY_LIBRARY) || '[]');
              items.sort((a, b) => b.timestamp - a.timestamp);
              setAnalyses(items);
            } catch (error) {
              setToast({ message: 'Error loading library.', type: 'error' });
            } finally {
              setLoading(false);
            }
          }, []);

          const handleDeleteConfirm = (id, e) => {
            e.stopPropagation();
            try {
              const items = JSON.parse(localStorage.getItem(STORAGE_KEY_LIBRARY) || '[]');
              const updatedItems = items.filter(item => item.id !== id);
              localStorage.setItem(STORAGE_KEY_LIBRARY, JSON.stringify(updatedItems));
              setAnalyses(updatedItems);
              setToast({ message: 'Deleted successfully.', type: 'success' });
              setItemToDelete(null);
              if (viewingResult?.id === id) setViewingResult(null);
            } catch (err) {
              setToast({ message: 'Error deleting item.', type: 'error' });
            }
          };

          const loadResult = (item) => {
            if(itemToDelete === item.id) return; 
            const recalculated = runFinancialAnalysis(item.params);
            setViewingResult({ ...recalculated, id: item.id, title: item.title });
          };

          if (viewingResult) {
            return (
              <div className="h-full flex flex-col fade-in">
                <button onClick={() => setViewingResult(null)} className="hide-on-print self-start mb-6 flex items-center text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                  <ArrowRight className="rotate-180 mr-2" size={16} /> Back to Library
                </button>
                <ResultsDisplay analysis={viewingResult} />
              </div>
            );
          }

          return (
            <div className="max-w-4xl mx-auto fade-in">
              <h2 className="text-2xl font-bold text-gray-900 mb-6">Saved Analyses Library</h2>
              {loading ? (
                <div className="p-8 text-center text-gray-500">Loading library...</div>
              ) : analyses.length === 0 ? (
                <div className="p-12 border-2 border-dashed border-gray-200 rounded-2xl text-center text-gray-500">
                  No saved analyses yet. Run a manual or auto analysis and click "Commit to Library".
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-12">
                  {analyses.map(item => (
                    <div 
                      key={item.id} 
                      onClick={() => loadResult(item)}
                      className="group p-5 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md cursor-pointer transition-all relative overflow-hidden"
                    >
                      <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                          {item.type === 'auto' ? <Sparkles size={16} className="text-indigo-500" /> : <CalculatorIcon size={16} className="text-blue-500" />}
                          <h3 className="font-semibold text-gray-900 truncate pr-4">{item.title}</h3>
                        </div>
                        
                        {itemToDelete === item.id ? (
                           <div className="flex gap-2 absolute top-3 right-3 z-10 bg-white p-1 rounded-md shadow-sm border border-red-100">
                             <button onClick={(e) => { e.stopPropagation(); setItemToDelete(null); }} className="px-2 py-1 text-xs text-gray-500 hover:bg-gray-100 rounded">Cancel</button>
                             <button onClick={(e) => handleDeleteConfirm(item.id, e)} className="px-2 py-1 text-xs text-white bg-red-600 hover:bg-red-700 rounded font-bold">Confirm</button>
                           </div>
                        ) : (
                          <button 
                            onClick={(e) => { e.stopPropagation(); setItemToDelete(item.id); }} 
                            className="text-gray-300 hover:text-red-500 transition-colors opacity-100 sm:opacity-0 group-hover:opacity-100"
                          >
                            <Trash2 size={16} />
                          </button>
                        )}
                      </div>
                      
                      <div className="grid grid-cols-2 gap-2 text-sm">
                        <div className="bg-gray-50 p-2 rounded">
                          <div className="text-gray-500 text-xs">Home Price</div>
                          <div className="font-semibold">${parseInt(item.params.homePrice).toLocaleString()}</div>
                        </div>
                        <div className="bg-gray-50 p-2 rounded">
                          <div className="text-gray-500 text-xs">Rent Price</div>
                          <div className="font-semibold">${parseInt(item.params.rentPrice).toLocaleString()}/mo</div>
                        </div>
                      </div>
                      <div className="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
                        <span className="text-xs text-gray-500">Winner: <strong className={item.summary.winner === 'Buy' ? 'text-emerald-600' : 'text-blue-600'}>{item.summary.winner}</strong></span>
                        <span className="text-xs font-medium text-gray-400 flex items-center gap-1">View Details <ChevronRight size={14}/></span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        };

        function App() {
          const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 768);
          const [currentStep, setCurrentStep] = useState('manual');
          const [toast, setToast] = useState(null);

          useEffect(() => {
            const handleResize = () => {
              if (window.innerWidth >= 768) setSidebarOpen(true);
              else setSidebarOpen(false);
            };
            window.addEventListener('resize', handleResize);
            return () => window.removeEventListener('resize', handleResize);
          }, []);

          const steps = [
            { id: 'config', label: 'Configuration', icon: Settings },
            { id: 'manual', label: 'Manual Analysis', icon: CalculatorIcon },
            { id: 'auto', label: 'Auto Analysis', icon: Sparkles },
            { id: 'library', label: 'Library', icon: BookOpen },
          ];

          const currentStepData = steps.find(s => s.id === currentStep);
          const CurrentIcon = currentStepData?.icon;

          return (
            <div className="flex h-screen w-full bg-gray-50 overflow-hidden text-gray-900 relative">
              
              {/* Mobile Overlay - Clicking this closes the sidebar */}
              {sidebarOpen && (
                <div 
                  className="fixed inset-0 bg-black/40 z-30 md:hidden transition-opacity"
                  onClick={() => setSidebarOpen(false)}
                ></div>
              )}

              {/* Sidebar */}
              <div 
                className={`fixed inset-y-0 left-0 z-40 flex flex-col bg-gray-900 text-white transition-transform duration-300 ease-in-out hide-on-print h-full shrink-0
                  ${sidebarOpen ? 'translate-x-0 w-64' : '-translate-x-full w-64'} 
                  md:static md:translate-x-0 md:w-64`}
              >
                <div className="h-16 flex items-center px-4 border-b border-gray-800 shrink-0">
                  <div className="p-1 rounded-md text-gray-300">
                    <CalculatorIcon size={24} />
                  </div>
                  <span className="ml-3 font-bold tracking-wide whitespace-nowrap overflow-hidden">Analyzer Pro</span>
                </div>
                
                <nav className="flex-1 py-4 flex flex-col gap-1 overflow-y-auto">
                  {steps.map(step => {
                    const Icon = step.icon;
                    const isActive = currentStep === step.id;
                    return (
                      <button
                        key={step.id}
                        onClick={() => {
                          setCurrentStep(step.id);
                          if (window.innerWidth < 768) setSidebarOpen(false);
                        }}
                        className={`flex items-center px-4 py-3 mx-2 rounded-lg transition-colors overflow-hidden whitespace-nowrap ${
                          isActive ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                        }`}
                      >
                        <Icon size={20} className="shrink-0" />
                        <span className="ml-3 font-medium text-sm">{step.label}</span>
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* Main Workspace */}
              <div className="flex-1 flex flex-col h-full w-full overflow-hidden relative hide-on-print bg-gray-50">
                {/* Header */}
                <header className="h-16 bg-white border-b border-gray-200 flex items-center px-4 md:px-6 shrink-0 z-10 w-full gap-3 shadow-sm">
                  <button 
                    onClick={() => setSidebarOpen(true)} 
                    className="p-2 -ml-2 hover:bg-gray-100 rounded-lg transition-colors text-gray-700 md:hidden"
                  >
                    <Menu size={24} />
                  </button>
                  <h1 className="text-lg font-bold text-gray-800 capitalize flex items-center gap-2">
                    {CurrentIcon && <CurrentIcon size={20} className="text-blue-600 md:hidden" />}
                    {currentStepData?.label}
                  </h1>
                </header>

                {/* Main Content Area - Click anywhere to close sidebar if open on mobile */}
                <main 
                  className="flex-1 overflow-y-auto overflow-x-hidden p-4 md:p-6 lg:p-8 relative w-full"
                  onClick={() => {
                    if (sidebarOpen && window.innerWidth < 768) setSidebarOpen(false);
                  }}
                >
                  {currentStep === 'config' && <ConfigStep setToast={setToast} />}
                  {currentStep === 'manual' && <ManualAnalysisStep setToast={setToast} />}
                  {currentStep === 'auto' && <AutoAnalysisStep setToast={setToast} />}
                  {currentStep === 'library' && <LibraryStep setToast={setToast} />}
                </main>
              </div>
              
              {/* Toast Notifications */}
              {toast && (
                <Toast 
                  message={toast.message} 
                  type={toast.type} 
                  onClose={() => setToast(null)} 
                />
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
