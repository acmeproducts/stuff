<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent vs Buy Analyzer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts - Pinned to stable version with prop-types to fix UMD ForwardRef bug -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.1.12/umd/Recharts.js"></script>
    
    <!-- Firebase V8 Compat for simpler in-browser HTML usage -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
      @media print {
        body * { visibility: hidden; }
        .print-wrapper, .print-wrapper * { visibility: visible; }
        .print-wrapper { position: absolute; left: 0; top: 0; width: 100%; }
        .hide-on-print { display: none !important; }
        .print-title { display: block !important; }
        .no-page-break { page-break-inside: avoid; }
        .chart-container { border: none !important; box-shadow: none !important; }
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, Area, AreaChart } = window.Recharts;

        const Menu = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const Settings = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const Calculator = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><line x1="8" y1="10" x2="8" y2="10.01"></line><line x1="12" y1="10" x2="12" y2="10.01"></line><line x1="16" y1="10" x2="16" y2="10.01"></line><line x1="8" y1="14" x2="8" y2="14.01"></line><line x1="12" y1="14" x2="12" y2="14.01"></line><line x1="8" y1="18" x2="8" y2="18.01"></line><line x1="12" y1="18" x2="12" y2="18.01"></line></svg>;
        const Sparkles = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>;
        const BookOpen = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
        const ChevronRight = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="9 18 15 12 9 6"></polyline></svg>;
        const Save = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
        const Printer = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>;
        const Trash2 = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Check = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const AlertCircle = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const ArrowRight = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const Home = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const Clock = (p) => <svg width={p.size||24} height={p.size||24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={p.className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo" };
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const runFinancialAnalysis = (params) => {
          const {
            homePrice, downPaymentPct, mortgageRate, taxRate, hoa, insurance, appreciation,
            rentPrice, rentInflation, investmentReturn, years
          } = params;

          let currentHomeValue = parseFloat(homePrice);
          let loanBalance = currentHomeValue * (1 - parseFloat(downPaymentPct) / 100);
          let initialDownPayment = currentHomeValue - loanBalance;
          
          let monthlyRate = (parseFloat(mortgageRate) / 100) / 12;
          let totalMonths = 30 * 12;
          
          let monthlyMortgage = 0;
          if (monthlyRate > 0) {
            monthlyMortgage = loanBalance * (monthlyRate * Math.pow(1 + monthlyRate, totalMonths)) / (Math.pow(1 + monthlyRate, totalMonths) - 1);
          } else {
            monthlyMortgage = loanBalance / totalMonths;
          }

          let currentRent = parseFloat(rentPrice);
          let portfolio = initialDownPayment; 

          let monthlyInvRate = (parseFloat(investmentReturn) / 100) / 12;
          let annualApprecRate = parseFloat(appreciation) / 100;
          let annualRentInfRate = parseFloat(rentInflation) / 100;

          let chartData = [];
          let buyTotalCashSpent = initialDownPayment;
          let rentTotalCashSpent = 0; 
          let year1BuyMonthly = 0;
          let year1RentMonthly = 0;
          let finalBuyMonthly = 0;
          let finalRentMonthly = 0;

          chartData.push({
            year: 0,
            buyNetWorth: initialDownPayment,
            rentNetWorth: initialDownPayment,
            buyCost: 0,
            rentCost: 0
          });

          for (let m = 1; m <= years * 12; m++) {
            let yearIndex = Math.floor((m - 1) / 12);
            let monthlyTax = (currentHomeValue * (parseFloat(taxRate) / 100)) / 12;
            let inflatedHoa = parseFloat(hoa) * Math.pow(1.03, yearIndex);
            let inflatedIns = parseFloat(insurance) * Math.pow(1.03, yearIndex);
            
            let buyMonthlyCost = monthlyMortgage + monthlyTax + inflatedHoa + inflatedIns;
            let actualRentCost = currentRent * Math.pow(1 + annualRentInfRate, yearIndex);

            if (m === 1) {
              year1BuyMonthly = buyMonthlyCost;
              year1RentMonthly = actualRentCost;
            }
            if (m === years * 12) {
              finalBuyMonthly = buyMonthlyCost;
              finalRentMonthly = actualRentCost;
            }

            buyTotalCashSpent += buyMonthlyCost;
            rentTotalCashSpent += actualRentCost;

            let delta = buyMonthlyCost - actualRentCost;
            portfolio = portfolio * (1 + monthlyInvRate) + delta;

            let interest = loanBalance * monthlyRate;
            let principal = monthlyMortgage - interest;
            loanBalance = Math.max(0, loanBalance - principal);
            
            currentHomeValue *= Math.pow(1 + annualApprecRate, 1/12);

            if (m % 12 === 0) {
              chartData.push({
                year: m / 12,
                buyNetWorth: Math.max(0, currentHomeValue - loanBalance),
                rentNetWorth: Math.max(0, portfolio),
                buyCost: buyMonthlyCost,
                rentCost: actualRentCost
              });
            }
          }

          const finalBuyWealth = currentHomeValue - loanBalance;
          const finalRentWealth = portfolio;

          return {
            chartData,
            summary: {
              year1BuyMonthly,
              year1RentMonthly,
              finalBuyMonthly,
              finalRentMonthly,
              buyTotalCashSpent,
              rentTotalCashSpent, 
              finalBuyWealth,
              finalRentWealth,
              netAdvantage: finalBuyWealth - finalRentWealth,
              winner: finalBuyWealth > finalRentWealth ? 'Buy' : 'Rent'
            },
            params
          };
        };

        const Toast = ({ message, type = 'success', onClose }) => {
          if (!message) return null;
          return (
            <div className="fixed bottom-4 right-4 z-50 animate-in slide-in-from-bottom-5">
              <div className={`flex items-center gap-2 px-4 py-3 rounded-lg shadow-lg text-sm font-medium text-white ${type === 'success' ? 'bg-green-600' : 'bg-red-600'}`}>
                {type === 'success' ? <Check size={16} /> : <AlertCircle size={16} />}
                {message}
                <button onClick={onClose} className="ml-4 opacity-70 hover:opacity-100">×</button>
              </div>
            </div>
          );
        };

        const TabButton = ({ active, children, onClick }) => (
          <button
            onClick={onClick}
            className={`px-4 py-2 font-medium text-sm transition-colors border-b-2 ${
              active ? 'border-blue-600 text-blue-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'
            }`}
          >
            {children}
          </button>
        );

        const InputField = ({ label, value, onChange, icon: Icon, prefix, suffix, type = "number" }) => (
          <div className="flex flex-col gap-1.5">
            <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">{label}</label>
            <div className="relative flex items-center bg-gray-50 border border-gray-200 rounded-md overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all">
              {Icon && <div className="pl-3 pr-2 text-gray-400"><Icon size={14} /></div>}
              {prefix && <span className="pl-3 pr-1 text-gray-500 font-medium text-sm">{prefix}</span>}
              <input
                type={type}
                value={value}
                onChange={(e) => onChange(e.target.value)}
                className="w-full py-2 px-2 bg-transparent text-sm font-semibold text-gray-900 outline-none"
              />
              {suffix && <span className="pr-3 pl-1 text-gray-500 font-medium text-sm">{suffix}</span>}
            </div>
          </div>
        );

        const ConfigStep = ({ user, setToast }) => {
          const [apiKey, setApiKey] = useState('');
          const [isLoading, setIsLoading] = useState(false);

          useEffect(() => {
            if (!user) return;
            const fetchConfig = async () => {
              const docRef = db.doc(`artifacts/${appId}/users/${user.uid}/config/openrouter`);
              const docSnap = await docRef.get();
              if (docSnap.exists && docSnap.data().key) {
                setApiKey(docSnap.data().key);
              }
            };
            fetchConfig();
          }, [user]);

          const saveConfig = async () => {
            if (!user) return;
            setIsLoading(true);
            try {
              await db.doc(`artifacts/${appId}/users/${user.uid}/config/openrouter`).set({
                key: apiKey,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
              setToast({ message: 'API Key saved securely.', type: 'success' });
            } catch (error) {
              setToast({ message: 'Error saving config.', type: 'error' });
            }
            setIsLoading(false);
          };

          return (
            <div className="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-sm border border-gray-100">
              <div className="flex items-center gap-3 mb-6">
                <div className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Settings size={24} /></div>
                <div>
                  <h2 className="text-xl font-bold text-gray-900">Application Configuration</h2>
                  <p className="text-sm text-gray-500">Set up your API keys to enable automated ad analysis.</p>
                </div>
              </div>
              
              <div className="space-y-4">
                <div className="flex flex-col gap-1.5">
                  <label className="text-xs font-semibold text-gray-500 uppercase tracking-wider">OpenRouter API Key</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => setApiKey(e.target.value)}
                    placeholder="sk-or-v1-..."
                    className="w-full p-3 bg-gray-50 border border-gray-200 rounded-md text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                  />
                  <p className="text-xs text-gray-400 mt-1">Stored securely in your database profile.</p>
                </div>
                <button
                  onClick={saveConfig}
                  disabled={isLoading}
                  className="px-6 py-2.5 bg-gray-900 text-white font-medium rounded-md hover:bg-gray-800 disabled:opacity-50 transition-colors"
                >
                  {isLoading ? 'Saving...' : 'Save Configuration'}
                </button>
              </div>
            </div>
          );
        };

        const ResultsDisplay = ({ analysis, onCommit, isSaving }) => {
          if (!analysis) return <div className="p-8 text-center text-gray-500">Run an analysis to see results.</div>;
          const { summary, chartData } = analysis;
          const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);

          return (
            <div className="space-y-8 animate-in fade-in duration-500 print-wrapper">
              <div className="flex justify-between items-center border-b pb-4 hide-on-print">
                <h2 className="text-xl font-bold text-gray-900">Analysis Results</h2>
                <div className="flex gap-2">
                  <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-md transition-colors">
                    <Printer size={16} /> Print / PDF
                  </button>
                  {onCommit && (
                    <button onClick={onCommit} disabled={isSaving} className="flex items-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-md transition-colors disabled:opacity-50">
                      <Save size={16} /> {isSaving ? 'Saving...' : 'Commit to Library'}
                    </button>
                  )}
                </div>
              </div>

              <div className="hidden print-title text-2xl font-bold mb-6 text-gray-900">
                Rent vs. Buy Financial Analysis (10-Year Outlook)
              </div>

              <div className={`p-6 rounded-xl border-l-4 shadow-sm ${summary.winner === 'Buy' ? 'bg-emerald-50 border-emerald-500' : 'bg-blue-50 border-blue-500'}`}>
                <h3 className="text-lg font-bold text-gray-900 mb-2">The Bottom Line</h3>
                <p className="text-sm text-gray-700">
                  Based on the Delta Equalizer model, <strong>{summary.winner}ing</strong> is the financially optimal strategy over a {analysis.params.years}-year horizon. 
                  It generates <strong>{formatCurrency(Math.abs(summary.netAdvantage))}</strong> more in total asset wealth compared to the alternative.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="p-5 bg-white border border-gray-200 rounded-xl shadow-sm">
                  <div className="flex items-center gap-2 mb-4 text-blue-700 font-bold"><Home size={18} /> Purchase Scenario</div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Year 1 Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.year1BuyMonthly)}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Final Year Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.finalBuyMonthly)}</span></div>
                    <div className="h-px bg-gray-100 my-2"></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Ending Asset Wealth:</span><span className="font-bold text-emerald-600">{formatCurrency(summary.finalBuyWealth)}</span></div>
                  </div>
                </div>
                <div className="p-5 bg-white border border-gray-200 rounded-xl shadow-sm">
                  <div className="flex items-center gap-2 mb-4 text-purple-700 font-bold"><Clock size={18} /> Rental Scenario</div>
                  <div className="space-y-3">
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Year 1 Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.year1RentMonthly)}</span></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Final Year Monthly Cost:</span><span className="font-semibold text-gray-900">{formatCurrency(summary.finalRentMonthly)}</span></div>
                    <div className="h-px bg-gray-100 my-2"></div>
                    <div className="flex justify-between text-sm"><span className="text-gray-500">Ending Asset Wealth:</span><span className="font-bold text-emerald-600">{formatCurrency(summary.finalRentWealth)}</span></div>
                  </div>
                </div>
              </div>

              <div className="p-5 bg-white border border-gray-200 rounded-xl shadow-sm chart-container">
                <h3 className="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4">Total Net Worth Over Time</h3>
                <div className="h-72 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <AreaChart data={chartData} margin={{ top: 10, right: 10, left: 0, bottom: 0 }}>
                      <defs>
                        <linearGradient id="colorBuy" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#10b981" stopOpacity={0.1}/>
                          <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                        </linearGradient>
                        <linearGradient id="colorRent" x1="0" y1="0" x2="0" y2="1">
                          <stop offset="5%" stopColor="#6366f1" stopOpacity={0.1}/>
                          <stop offset="95%" stopColor="#6366f1" stopOpacity={0}/>
                        </linearGradient>
                      </defs>
                      <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#e5e7eb" />
                      <XAxis dataKey="year" tickFormatter={(v) => `Yr ${v}`} stroke="#9ca3af" fontSize={12} tickLine={false} axisLine={false} />
                      <YAxis tickFormatter={(v) => `$${(v/1000).toFixed(0)}k`} stroke="#9ca3af" fontSize={12} tickLine={false} axisLine={false} />
                      <RechartsTooltip 
                        formatter={(value) => formatCurrency(value)}
                        labelFormatter={(label) => `Year ${label}`}
                        contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }}
                      />
                      <Legend verticalAlign="top" height={36}/>
                      <Area type="monotone" name="Buy Equity" dataKey="buyNetWorth" stroke="#10b981" strokeWidth={3} fillOpacity={1} fill="url(#colorBuy)" />
                      <Area type="monotone" name="Rent Portfolio" dataKey="rentNetWorth" stroke="#6366f1" strokeWidth={3} fillOpacity={1} fill="url(#colorRent)" />
                    </AreaChart>
                  </ResponsiveContainer>
                </div>
              </div>

              <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden no-page-break">
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-sm text-gray-500">
                    <thead className="text-xs text-gray-700 uppercase bg-gray-50 border-b border-gray-200">
                      <tr>
                        <th className="px-6 py-3">Year</th>
                        <th className="px-6 py-3 text-right">Buy Net Worth</th>
                        <th className="px-6 py-3 text-right">Rent Net Worth</th>
                        <th className="px-6 py-3 text-right">Buy Monthly Cost</th>
                        <th className="px-6 py-3 text-right">Rent Monthly Cost</th>
                      </tr>
                    </thead>
                    <tbody>
                      {chartData.map((row, idx) => (
                        <tr key={idx} className="border-b border-gray-100 hover:bg-gray-50">
                          <td className="px-6 py-3 font-medium text-gray-900">{row.year}</td>
                          <td className="px-6 py-3 text-right font-mono">{formatCurrency(row.buyNetWorth)}</td>
                          <td className="px-6 py-3 text-right font-mono">{formatCurrency(row.rentNetWorth)}</td>
                          <td className="px-6 py-3 text-right font-mono">{formatCurrency(row.buyCost)}</td>
                          <td className="px-6 py-3 text-right font-mono">{formatCurrency(row.rentCost)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );
        };

        const ManualAnalysisStep = ({ user, setToast }) => {
          const [activeTab, setActiveTab] = useState('setup');
          const [isSaving, setIsSaving] = useState(false);
          const [analysisResult, setAnalysisResult] = useState(null);
          
          const [params, setParams] = useState({
            homePrice: 450000, downPaymentPct: 40, mortgageRate: 7.0, taxRate: 1.0, 
            hoa: 400, insurance: 100, appreciation: 4.0,
            rentPrice: 2800, rentInflation: 3.0, investmentReturn: 6.0, years: 10
          });

          const handleCalculate = () => {
            const result = runFinancialAnalysis(params);
            setAnalysisResult(result);
            setActiveTab('results');
          };

          const handleCommit = async () => {
            if (!user || !analysisResult) return;
            setIsSaving(true);
            try {
              await db.collection(`artifacts/${appId}/users/${user.uid}/analyses`).add({
                type: 'manual',
                title: `Manual Analysis - ${new Date().toLocaleDateString()}`,
                params: analysisResult.params,
                summary: analysisResult.summary,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
              setToast({ message: 'Analysis saved to library.', type: 'success' });
            } catch (err) {
              setToast({ message: 'Failed to save analysis.', type: 'error' });
            }
            setIsSaving(false);
          };

          return (
            <div className="max-w-5xl mx-auto h-full flex flex-col">
              <div className="flex border-b border-gray-200 mb-6 hide-on-print">
                <TabButton active={activeTab === 'setup'} onClick={() => setActiveTab('setup')}>Setup Parameters</TabButton>
                <TabButton active={activeTab === 'results'} onClick={() => { if(analysisResult) setActiveTab('results'); }}>Analysis & Results</TabButton>
              </div>

              {activeTab === 'setup' && (
                <div className="flex-1 animate-in fade-in space-y-8">
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div className="p-6 bg-white border border-gray-200 rounded-xl shadow-sm space-y-4">
                      <h3 className="flex items-center gap-2 text-lg font-bold text-gray-900 border-b pb-2"><Home size={20} className="text-blue-600"/> Purchase Scenario</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <InputField label="Home Price" value={params.homePrice} onChange={(v) => setParams({...params, homePrice: v})} prefix="$" />
                        <InputField label="Down Payment" value={params.downPaymentPct} onChange={(v) => setParams({...params, downPaymentPct: v})} suffix="%" />
                        <InputField label="Mortgage Rate" value={params.mortgageRate} onChange={(v) => setParams({...params, mortgageRate: v})} suffix="%" />
                        <InputField label="Property Tax Rate" value={params.taxRate} onChange={(v) => setParams({...params, taxRate: v})} suffix="%" />
                        <InputField label="Monthly HOA" value={params.hoa} onChange={(v) => setParams({...params, hoa: v})} prefix="$" />
                        <InputField label="Monthly Insurance" value={params.insurance} onChange={(v) => setParams({...params, insurance: v})} prefix="$" />
                        <InputField label="Annual Appreciation" value={params.appreciation} onChange={(v) => setParams({...params, appreciation: v})} suffix="%" />
                      </div>
                    </div>

                    <div className="p-6 bg-white border border-gray-200 rounded-xl shadow-sm space-y-4">
                      <h3 className="flex items-center gap-2 text-lg font-bold text-gray-900 border-b pb-2"><Clock size={20} className="text-purple-600"/> Rental & Macro Scenario</h3>
                      <div className="grid grid-cols-2 gap-4">
                        <InputField label="Base Monthly Rent" value={params.rentPrice} onChange={(v) => setParams({...params, rentPrice: v})} prefix="$" />
                        <InputField label="Annual Rent Inflation" value={params.rentInflation} onChange={(v) => setParams({...params, rentInflation: v})} suffix="%" />
                        <InputField label="Investment Return" value={params.investmentReturn} onChange={(v) => setParams({...params, investmentReturn: v})} suffix="%" />
                        <InputField label="Time Horizon" value={params.years} onChange={(v) => setParams({...params, years: v})} suffix="Years" />
                      </div>
                      
                      <div className="pt-6 mt-auto">
                        <button 
                          onClick={handleCalculate}
                          className="w-full flex justify-center items-center gap-2 px-6 py-3 bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-lg shadow-sm transition-colors"
                        >
                          <Calculator size={18} /> Run Analysis
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'results' && (
                <ResultsDisplay analysis={analysisResult} onCommit={handleCommit} isSaving={isSaving} />
              )}
            </div>
          );
        };

        const AutoAnalysisStep = ({ user, setToast }) => {
          const [activeTab, setActiveTab] = useState('setup');
          const [inputData, setInputData] = useState('');
          const [isProcessing, setIsProcessing] = useState(false);
          const [analysisResult, setAnalysisResult] = useState(null);
          const [isSaving, setIsSaving] = useState(false);

          const processAd = async () => {
            if (!inputData.trim()) return setToast({ message: 'Please enter ad text or link.', type: 'error' });
            if (!user) return setToast({ message: 'Authentication required.', type: 'error' });

            setIsProcessing(true);
            try {
              const docSnap = await db.doc(`artifacts/${appId}/users/${user.uid}/config/openrouter`).get();
              const apiKey = docSnap.exists ? docSnap.data().key : null;
              
              if (!apiKey) {
                setIsProcessing(false);
                return setToast({ message: 'OpenRouter API Key not found. Please configure it first.', type: 'error' });
              }

              const prompt = `
                Analyze the following real estate text/link.
                1. Determine if it is a "rent" or "buy" (sale) listing.
                2. Extract the price, beds, baths, sqft, and monthly HOA (default 0 if unknown).
                3. To run a Rent vs Buy analysis, provide a plausible real-world benchmark for the OPPOSITE scenario for a comparable home in the same general market.
                
                Output valid JSON ONLY. No markdown, no extra text. Format:
                {
                  "type": "rent" | "buy",
                  "price": number (the price extracted, either monthly rent or home price),
                  "hoa": number,
                  "benchmarkOppositePrice": number (if input is rent, provide a realistic home purchase price. If input is buy, provide a realistic monthly rent.)
                }
                
                Input text:
                ${inputData.substring(0, 2000)}
              `;

              const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                  "Authorization": `Bearer ${apiKey}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  model: "google/gemini-flash-1.5-8b", 
                  messages: [{ role: "user", content: prompt }]
                })
              });

              if (!response.ok) throw new Error('API Request Failed');
              const data = await response.json();
              const rawText = data.choices[0].message.content.replace(/```json/g, '').replace(/```/g, '').trim();
              const extracted = JSON.parse(rawText);

              let params = {
                downPaymentPct: 20, mortgageRate: 6.5, taxRate: 1.1, 
                insurance: 150, appreciation: 4.0, rentInflation: 3.5, investmentReturn: 6.0, years: 10
              };

              if (extracted.type === 'buy') {
                params.homePrice = extracted.price;
                params.hoa = extracted.hoa || 0;
                params.rentPrice = extracted.benchmarkOppositePrice || (extracted.price * 0.005);
              } else {
                params.rentPrice = extracted.price;
                params.homePrice = extracted.benchmarkOppositePrice || (extracted.price * 200);
                params.hoa = extracted.hoa || 0;
              }

              const result = runFinancialAnalysis(params);
              setAnalysisResult(result);
              setActiveTab('results');
              setToast({ message: 'AI Analysis Complete!', type: 'success' });

            } catch (err) {
              console.error(err);
              setToast({ message: 'Error processing ad. Ensure valid API key or text.', type: 'error' });
            }
            setIsProcessing(false);
          };

          const handleCommit = async () => {
            if (!user || !analysisResult) return;
            setIsSaving(true);
            try {
              await db.collection(`artifacts/${appId}/users/${user.uid}/analyses`).add({
                type: 'auto',
                title: `AI Extracted Analysis - ${new Date().toLocaleDateString()}`,
                params: analysisResult.params,
                summary: analysisResult.summary,
                sourceText: inputData.substring(0, 100),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
              });
              setToast({ message: 'Analysis saved to library.', type: 'success' });
            } catch (err) {
              setToast({ message: 'Failed to save analysis.', type: 'error' });
            }
            setIsSaving(false);
          };

          return (
            <div className="max-w-5xl mx-auto h-full flex flex-col">
              <div className="flex border-b border-gray-200 mb-6 hide-on-print">
                <TabButton active={activeTab === 'setup'} onClick={() => setActiveTab('setup')}>Input Data</TabButton>
                <TabButton active={activeTab === 'results'} onClick={() => { if(analysisResult) setActiveTab('results'); }}>Analysis Results</TabButton>
              </div>

              {activeTab === 'setup' && (
                <div className="flex-1 animate-in fade-in max-w-2xl mx-auto w-full mt-8">
                  <div className="p-8 bg-white border border-gray-200 rounded-2xl shadow-sm text-center">
                    <div className="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full mb-6">
                      <Sparkles size={32} />
                    </div>
                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Automated Ad Parsing</h2>
                    <p className="text-gray-500 mb-8">Paste a rental or real estate listing description below. The AI will extract the financial details and benchmark the opposite scenario automatically.</p>
                    
                    <textarea
                      value={inputData}
                      onChange={(e) => setInputData(e.target.value)}
                      placeholder="Paste listing text or URL here..."
                      className="w-full h-40 p-4 bg-gray-50 border border-gray-200 rounded-xl resize-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all mb-6 text-sm"
                    />
                    
                    <button
                      onClick={processAd}
                      disabled={isProcessing}
                      className="w-full flex justify-center items-center gap-2 px-6 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition-all disabled:opacity-70 disabled:cursor-not-allowed"
                    >
                      {isProcessing ? (
                        <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      ) : (
                        <><Sparkles size={18} /> Analyze with AI</>
                      )}
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'results' && (
                <ResultsDisplay analysis={analysisResult} onCommit={handleCommit} isSaving={isSaving} />
              )}
            </div>
          );
        };

        const LibraryStep = ({ user, setToast }) => {
          const [analyses, setAnalyses] = useState([]);
          const [loading, setLoading] = useState(true);
          const [viewingResult, setViewingResult] = useState(null);

          useEffect(() => {
            if (!user) return;
            const unsubscribe = db.collection(`artifacts/${appId}/users/${user.uid}/analyses`)
              .orderBy('timestamp', 'desc')
              .onSnapshot((snapshot) => {
                const items = [];
                snapshot.forEach((doc) => items.push({ id: doc.id, ...doc.data() }));
                setAnalyses(items);
                setLoading(false);
              }, (error) => {
                console.error(error);
                setLoading(false);
                setToast({ message: 'Error loading library.', type: 'error' });
              });
            return () => unsubscribe();
          }, [user]);

          const handleDelete = async (id, e) => {
            e.stopPropagation();
            if (!window.confirm('Delete this saved analysis?')) return;
            try {
              await db.doc(`artifacts/${appId}/users/${user.uid}/analyses/${id}`).delete();
              setToast({ message: 'Deleted successfully.', type: 'success' });
              if (viewingResult?.id === id) setViewingResult(null);
            } catch (err) {
              setToast({ message: 'Error deleting item.', type: 'error' });
            }
          };

          const loadResult = (item) => {
            const recalculated = runFinancialAnalysis(item.params);
            setViewingResult({ ...recalculated, id: item.id, title: item.title });
          };

          if (viewingResult) {
            return (
              <div className="h-full flex flex-col">
                <button onClick={() => setViewingResult(null)} className="hide-on-print self-start mb-6 flex items-center text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors">
                  <ArrowRight className="rotate-180 mr-2" size={16} /> Back to Library
                </button>
                <ResultsDisplay analysis={viewingResult} />
              </div>
            );
          }

          return (
            <div className="max-w-4xl mx-auto">
              <h2 className="text-2xl font-bold text-gray-900 mb-6">Saved Analyses Library</h2>
              {loading ? (
                <div className="p-8 text-center text-gray-500">Loading library...</div>
              ) : analyses.length === 0 ? (
                <div className="p-12 border-2 border-dashed border-gray-200 rounded-2xl text-center text-gray-500">
                  No saved analyses yet. Run a manual or auto analysis and click "Commit to Library".
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {analyses.map(item => (
                    <div 
                      key={item.id} 
                      onClick={() => loadResult(item)}
                      className="group p-5 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md cursor-pointer transition-all relative"
                    >
                      <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                          {item.type === 'auto' ? <Sparkles size={16} className="text-indigo-500" /> : <Calculator size={16} className="text-blue-500" />}
                          <h3 className="font-semibold text-gray-900">{item.title}</h3>
                        </div>
                        <button 
                          onClick={(e) => handleDelete(item.id, e)} 
                          className="text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100"
                        >
                          <Trash2 size={16} />
                        </button>
                      </div>
                      
                      <div className="grid grid-cols-2 gap-2 text-sm">
                        <div className="bg-gray-50 p-2 rounded">
                          <div className="text-gray-500 text-xs">Home Price</div>
                          <div className="font-semibold">${parseInt(item.params.homePrice).toLocaleString()}</div>
                        </div>
                        <div className="bg-gray-50 p-2 rounded">
                          <div className="text-gray-500 text-xs">Rent Price</div>
                          <div className="font-semibold">${parseInt(item.params.rentPrice).toLocaleString()}/mo</div>
                        </div>
                      </div>
                      <div className="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
                        <span className="text-xs text-gray-500">Winner: <strong className={item.summary.winner === 'Buy' ? 'text-emerald-600' : 'text-blue-600'}>{item.summary.winner}</strong></span>
                        <span className="text-xs font-medium text-gray-400 flex items-center gap-1">View Details <ChevronRight size={14}/></span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        };

        function App() {
          const [user, setUser] = useState(null);
          const [sidebarOpen, setSidebarOpen] = useState(true);
          const [currentStep, setCurrentStep] = useState('manual');
          const [toast, setToast] = useState(null);

          useEffect(() => {
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await auth.signInWithCustomToken(__initial_auth_token);
                } else {
                  await auth.signInAnonymously();
                }
              } catch (err) {
                console.error("Auth init error", err);
              }
            };
            initAuth();
            const unsubscribe = auth.onAuthStateChanged(setUser);
            return () => unsubscribe();
          }, []);

          const steps = [
            { id: 'config', label: 'Configuration', icon: Settings },
            { id: 'manual', label: 'Manual Analysis', icon: Calculator },
            { id: 'auto', label: 'Auto Analysis', icon: Sparkles },
            { id: 'library', label: 'Library', icon: BookOpen },
          ];

          const currentStepData = steps.find(s => s.id === currentStep);
          const CurrentIcon = currentStepData?.icon;

          return (
            <div className="flex h-screen bg-gray-50 font-sans overflow-hidden">
              <div className={`flex flex-col bg-gray-900 text-white transition-all duration-300 ease-in-out hide-on-print ${sidebarOpen ? 'w-64' : 'w-16'}`}>
                <div className="h-16 flex items-center px-4 border-b border-gray-800 shrink-0">
                  <button onClick={() => setSidebarOpen(!sidebarOpen)} className="p-1 hover:bg-gray-800 rounded-md transition-colors text-gray-300">
                    <Menu size={24} />
                  </button>
                  {sidebarOpen && <span className="ml-3 font-bold tracking-wide">Analyzer Pro</span>}
                </div>
                
                <nav className="flex-1 py-4 flex flex-col gap-1 overflow-y-auto">
                  {steps.map(step => {
                    const Icon = step.icon;
                    const isActive = currentStep === step.id;
                    return (
                      <button
                        key={step.id}
                        onClick={() => setCurrentStep(step.id)}
                        className={`flex items-center px-4 py-3 mx-2 rounded-lg transition-colors overflow-hidden whitespace-nowrap ${
                          isActive ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'
                        }`}
                        title={!sidebarOpen ? step.label : ''}
                      >
                        <Icon size={20} className="shrink-0" />
                        {sidebarOpen && <span className="ml-3 font-medium text-sm">{step.label}</span>}
                      </button>
                    );
                  })}
                </nav>
              </div>

              <div className="flex-1 flex flex-col h-full overflow-hidden relative hide-on-print">
                <header className="h-16 bg-white border-b border-gray-200 flex items-center px-6 shrink-0 z-10 hide-on-print">
                  <h1 className="text-lg font-bold text-gray-800 capitalize flex items-center gap-2">
                    {CurrentIcon && <CurrentIcon size={20} className="text-blue-600" />}
                    {currentStepData?.label}
                  </h1>
                </header>

                <main className="flex-1 overflow-y-auto p-6 lg:p-8 relative">
                  {user === null ? (
                    <div className="flex items-center justify-center h-full text-gray-400">Authenticating...</div>
                  ) : (
                    <>
                      {currentStep === 'config' && <ConfigStep user={user} setToast={setToast} />}
                      {currentStep === 'manual' && <ManualAnalysisStep user={user} setToast={setToast} />}
                      {currentStep === 'auto' && <AutoAnalysisStep user={user} setToast={setToast} />}
                      {currentStep === 'library' && <LibraryStep user={user} setToast={setToast} />}
                    </>
                  )}
                </main>
              </div>
              
              {toast && (
                <Toast 
                  message={toast.message} 
                  type={toast.type} 
                  onClose={() => setToast(null)} 
                />
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
