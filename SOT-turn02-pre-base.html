<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SOT Turn 02</title><style>
:root{color-scheme:dark;--bg:#081018;--panel:#0f1a24;--line:#263746;--text:#f2f6f8;--mut:#9fb0bd;--accent:#3a8fd8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}.top{position:sticky;top:0;z-index:5;background:#0a141d;border-bottom:1px solid var(--line);padding:10px}.brand{font-weight:900;font-size:18px;margin-bottom:8px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.nav button,.btn{min-height:44px;border:1px solid var(--line);border-radius:9px;background:#132330;color:var(--text);font-weight:800}.nav button.on,.btn.primary{background:var(--accent)}main{padding:12px;max-width:720px;margin:auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}.mut{color:var(--mut)}input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:9px;background:#0a141d;color:var(--text);padding:10px;font:inherit}.list{display:grid;gap:6px;margin-top:10px}.item{width:100%;text-align:left;min-height:48px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#101f2b;color:var(--text)}.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.crumb{border:1px solid var(--line);border-radius:16px;background:#10202c;color:var(--text);padding:7px 10px;min-height:38px}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:16px;background:#173049;padding:5px 8px;margin:3px 4px 3px 0}.chip button{border:0;background:transparent;color:var(--text);font-size:18px;line-height:1}.empty{padding:18px 4px;color:var(--mut)}.meta{display:grid;grid-template-columns:105px 1fr;gap:8px;font-size:14px}.meta b{color:var(--mut)}.hide{display:none!important}@media(min-width:760px){body{font-size:15px}}
</style></head><body><header class="top"><div class="brand">SOT · Turn 02 pre-base</div><nav class="nav"><button data-tab="discover" class="on">Discover</button><button data-tab="profile">Profile</button><button data-tab="action">Action</button></nav></header><main id="app"></main><script>
const BUILD='SOT-turn02-pre-base-simple-mobile',API='/report/api/sot';
const state={tab:'discover',discover:{sources:[]},profile:{profile:{revision:0},items:[],tags:[]},folder:'',selected:null,error:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>{n=Number(n||0);if(!n)return'0 B';let u=['B','KB','MB','GB','TB'];let i=Math.min(u.length-1,Math.floor(Math.log(n)/Math.log(1024)));return`${(n/1024**i).toFixed(i?1:0)} ${u[i]}`};
async function api(path,opts={}){let r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||`HTTP ${r.status}`);return x}
function parentPath(p){p=String(p||'').replace(/[\\/]+$/,'');let i=Math.max(p.lastIndexOf('/'),p.lastIndexOf('\\'));return i>0?p.slice(0,i):''}
function roots(){let folders=(state.profile.items||[]).filter(x=>x.type==='folder'),paths=new Set(folders.map(x=>x.path));return folders.filter(x=>!paths.has(parentPath(x.path))).sort((a,b)=>String(a.path).localeCompare(String(b.path)))}
function children(path){return(state.profile.items||[]).filter(x=>parentPath(x.path)===path).sort((a,b)=>a.type===b.type?String(a.name||a.path).localeCompare(String(b.name||b.path)):a.type==='folder'?-1:1)}
function currentFolder(){return(state.profile.items||[]).find(x=>x.type==='folder'&&x.path===state.folder)||null}
async function refresh(){state.error='';try{let[d,p]=await Promise.all([api('/turn01/discover'),api('/turn01/profile?limit=5000')]);state.discover=d;state.profile=p;if(state.folder&&!currentFolder())state.folder='';}catch(e){state.error=e.message}draw()}
function tabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===state.tab))}
function discoverView(){let s=state.discover.sources||[];return`<section class="card"><h2>Sources</h2><div class="mut">Add one folder at a time. Nothing refreshes in the background.</div><div class="row" style="margin-top:10px"><input id="sourcePath" class="grow" placeholder="/path/to/source" autocomplete="off"><button class="btn primary" id="addSource">Add</button></div>${state.error?`<div class="empty">${esc(state.error)}</div>`:''}<div class="list">${s.length?s.map(x=>`<div class="item"><b>${esc(x.normalized_path)}</b><small>${esc(x.preflight_status||'admitted')}</small><button class="btn" style="margin-top:8px" onclick='removeSource(${JSON.stringify(x.source_id)})'>Remove</button></div>`).join(''):'<div class="empty">No sources. This database is intentionally empty.</div>'}</div></section><button class="btn" onclick="refresh()">Refresh</button>`}
function crumbs(){if(!state.folder)return'<button class="crumb" onclick="openFolder(\'\')">Root</button>';let seg=state.folder.split(/[\\/]/).filter(Boolean),acc=state.folder.startsWith('/')?'/':'';let out=['<button class="crumb" onclick="openFolder(\'\')">Root</button>'];for(let s of seg){acc+=(acc&&acc!=='/'?'/':'')+s;out.push(`<button class="crumb" onclick='openFolder(${JSON.stringify(acc)})'>${esc(s)}</button>`)}return out.join('')}
function profileView(){let list=state.folder?children(state.folder):roots();return`<section class="card"><div class="row"><div class="grow"><h2 style="margin:0">Profile r${Number(state.profile.profile?.revision||0)}</h2><div class="mut">Manual refresh only</div></div><button class="btn" onclick="refresh()">Refresh</button></div><div class="crumbs">${crumbs()}</div><input id="searchBox" placeholder="Filter this folder" autocomplete="off"><div class="list" id="fileList">${list.length?list.map(itemButton).join(''):'<div class="empty">No indexed folders or files yet.</div>'}</div></section>`}
function itemButton(x){return`<button class="item" data-filter="${esc([x.name,x.path,x.fingerprint,...(x.effective_tags||[]).map(t=>t.name)].join(' ').toLowerCase())}" onclick='${x.type==='folder'?`openFolder(${JSON.stringify(x.path)})`:`selectItem(${JSON.stringify(x.type)},${JSON.stringify(x.key)})`}'><b>${x.type==='folder'?'Folder · ':''}${esc(x.name||x.path)}</b><small>${esc(x.path)} · ${x.type==='file'?bytes(x.size):Number(x.file_count||0).toLocaleString()+' files'}</small></button>`}
function selected(){if(!state.selected)return null;return(state.profile.items||[]).find(x=>x.type===state.selected.type&&x.key===state.selected.key)||null}
function chips(x){return(x?.effective_tags||[]).map(t=>`<span class="chip">${esc(t.display_name||t.name)}<button aria-label="Remove tag" onclick='removeTag(${JSON.stringify(t.name)},${JSON.stringify(t.direct?x.type:'folder')},${JSON.stringify(t.direct?x.key:t.from)})'>×</button></span>`).join('')}
function actionView(){let x=selected();return`<section class="card"><h2>Action</h2>${x?`<div class="meta"><b>Item</b><span>${esc(x.path)}</span><b>Type</b><span>${esc(x.type)}</span><b>Size</b><span>${bytes(x.size)}</span><b>Fingerprint</b><span>${esc(x.fingerprint||'')}</span></div><div style="margin-top:12px">${chips(x)||'<span class="mut">No tags</span>'}</div><div class="row" style="margin-top:10px"><input id="tagInput" class="grow" placeholder="Type tag and press Enter" autocomplete="off"><button class="btn primary" id="addTag">Add</button></div><div class="mut" style="margin-top:8px">Only tagging exists in pre-base. No copy, delete, reconcile, or bulk actions.</div>`:'<div class="empty">Select a file from Profile first.</div>'}</section>`}
function draw(){tabs();document.querySelector('#app').innerHTML=state.tab==='discover'?discoverView():state.tab==='profile'?profileView():actionView();wire()}
function wire(){document.querySelector('#addSource')?.addEventListener('click',addSource);document.querySelector('#sourcePath')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addSource()}});document.querySelector('#searchBox')?.addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('hide',q&&!n.dataset.filter.includes(q)))});document.querySelector('#addTag')?.addEventListener('click',addTag);document.querySelector('#tagInput')?.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTag()}})}
async function addSource(){let el=document.querySelector('#sourcePath'),path=el?.value.trim();if(!path)return;try{await api('/turn01/discover',{method:'POST',body:JSON.stringify({path})});el.value='';await refresh()}catch(e){state.error=e.message;draw()}}
async function removeSource(source_id){await api('/turn01/discover/remove',{method:'POST',body:JSON.stringify({source_id})});await refresh()}
function openFolder(path){state.folder=path;state.tab='profile';draw()}
function selectItem(type,key){state.selected={type,key};state.tab='action';draw()}
async function addTag(){let x=selected(),el=document.querySelector('#tagInput'),tag=el?.value.trim();if(!x||!tag)return;await api('/turn01/tags/bulk',{method:'POST',body:JSON.stringify({profile_revision:state.profile.profile.revision,operation:'add',tag,targets:[{type:x.type,key:x.key}]})});await refresh();state.tab='action';draw()}
async function removeTag(tag,type,key){await api('/turn01/tags/bulk',{method:'POST',body:JSON.stringify({profile_revision:state.profile.profile.revision,operation:'remove',tag,targets:[{type,key}]})});await refresh();state.tab='action';draw()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;draw()}));refresh();
</script></body></html>
