            var r=rec[side];if(r){try{r.stop()}catch(e){}}
            return;
        }
        recOn[side]=true;
        rec[side]=newRecognizer(side);
        try{rec[side].start();diag('listening on '+side+' in '+langOf(side)+' (auto-send after '+STT_PAUSE_MS+'ms pause)')}
        catch(e){diag('could not start mic: '+e.message,true);recOn[side]=false}
    }

    /* ---- swype gesture ---- */
    function enableSwype(side){
        var el=kb[side],pts=[],tracking=false,centers=[],moved=0,trail=null;
        el.addEventListener('pointerdown',function(e){
            if(!e.target.closest('.duck-key')||numMode[side])return;
            tracking=true;moved=0;pts=[{x:e.clientX,y:e.clientY}];centers=keyCenters(side);
            if(!trail){trail={cv:document.createElement('canvas')};trail.cv.className='duck-trail';el.appendChild(trail.cv)}
        });
        el.addEventListener('pointermove',function(e){
            if(!tracking)return;
            var last=pts[pts.length-1],d=Math.hypot(e.clientX-last.x,e.clientY-last.y);
            if(d<6)return;
            moved+=d;pts.push({x:e.clientX,y:e.clientY});drawTrail(el,trail,pts);
        });
        function finish(e){
            if(!tracking)return;tracking=false;clearTrail(trail);
            if(moved<70){pts=[];return}
            e.preventDefault();e.stopPropagation();
            var seq=pathToKeys(pts,centers);pts=[];
            if(seq.length<2)return;
            var lang=langOf(side);
            if(lang==='ko'||lang==='ja'){seq.forEach(function(c){press(side,c)});diag('swype('+lang+'): '+seq.join(''));return}
            var list=swypeCandidates(seq,lang);
            if(!list.length)return;
            insertAt(side,list[0]+' ');
            cands[side]=list;candIdx[side]=0;paintCands(side);
            diag('swype: "'+seq.join('')+'" → '+list.slice(0,3).join(', '));
        }
        el.addEventListener('pointerup',finish);
        el.addEventListener('pointercancel',finish);
    }
    function keyCenters(side){
        var out=[];
        kb[side].querySelectorAll('.duck-key').forEach(function(b){
            var k=b.dataset.k;
            if(!k||k.length!==1||!/\S/.test(k))return;
            var r=b.getBoundingClientRect();
            out.push({k:k,x:r.left+r.width/2,y:r.top+r.height/2,r:Math.max(r.width,r.height)/2});
        });
        return out;
    }
    function drawTrail(el,trail,pts){
        var c=trail.cv,r=el.getBoundingClientRect();
        if(c.width!==r.width||c.height!==r.height){c.width=r.width;c.height=r.height}
        var g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);
        g.strokeStyle='rgba(59,130,246,.55)';g.lineWidth=5;g.lineCap='round';g.lineJoin='round';g.beginPath();
        pts.forEach(function(p,i){var x=p.x-r.left,y=p.y-r.top;i?g.lineTo(x,y):g.moveTo(x,y)});
        g.stroke();
    }
    function clearTrail(t){if(!t)return;var g=t.cv.getContext('2d');g.clearRect(0,0,t.cv.width,t.cv.height)}

    /* ---- open/close/handoff ---- */
    function openKb(side,why){
        if(owner&&owner!==side)closeKb(owner,'replaced');
        owner=side;kb[side].classList.add('open');shellOf(side).classList.add('kb-open');
        ctl[side].dataset.owned='true';ctl[other(side)].dataset.owned='false';
        try{inputs[side].focus({preventScroll:true})}catch(e){}   // inputmode=none is permanent now — set at creation
        renderKeys(side);diag('keyboard → '+side+(why?' ('+why+')':''));
    }
    function closeKb(side,why){
        if(!kb[side])return;
        flushComposition(side);
        kb[side].classList.remove('open');shellOf(side).classList.remove('kb-open');ctl[side].dataset.owned='false';
        if(owner===side)owner=null;
        diag('keyboard closed on '+side+(why?' ('+why+')':''));
    }
    // Single gate for BOTH the keyboard button and the mic button — whichever side holds input
    // access, the other side must request it. Granting it forcibly releases the holder's keyboard
    // AND stops their mic if it's hot, so two channels can never run at once.
    function requestInputAccess(side,after){
        if(owner===side){after();return}
        if(!owner){owner=side;ctl[side].dataset.owned='true';ctl[other(side)].dataset.owned='false';after();return}
        ask(side,after);
    }
    function releaseSide(side,why){
        if(kb[side]&&kb[side].classList.contains('open'))closeKb(side,why);
        if(recOn[side]){recOn[side]=false;var r=rec[side];if(r){try{r.stop()}catch(e){}}}
        if(owner===side)owner=null;
    }
    function onKbButton(side){
        if(owner===side&&kb[side].classList.contains('open')){closeKb(side,'button');return}
        requestInputAccess(side,function(){openKb(side,'button')});
    }
    function ask(fromSide,onGranted){
        var target=other(fromSide);pendingFrom=fromSide;pendingGrantFn=onGranted;
        ctl[fromSide].dataset.pending='true';
        var card=askEl[target],lang=langOf(target);
        setText(card.querySelector('.duck-ask-msg'),'The other person would like to use the keyboard.',lang);
        setText(card.querySelector('.ok'),'Allow',lang);
        setText(card.querySelector('.no'),'Decline',lang);
        card.classList.add('show');
        diag('request: '+fromSide+' → '+target);
        clearTimeout(askTimer);askTimer=setTimeout(function(){resolveAsk(false,true)},20000);
    }
    function setText(el,en,lang){
        el.textContent=en;
        if(!lang||lang==='en')return;
        try{translateText(en,lang,'en').then(function(t){if(t)el.textContent=t}).catch(function(){})}catch(e){}
    }
    function resolveAsk(granted,silent){
        clearTimeout(askTimer);
        Object.keys(askEl).forEach(function(k){askEl[k].classList.remove('show')});
        var from=pendingFrom,fn=pendingGrantFn;pendingFrom=null;pendingGrantFn=null;
        if(from)ctl[from].dataset.pending='false';
        if(!from)return;
        if(granted){
            releaseSide(other(from),'granted to '+from);   // stop whatever the holder was doing — keyboard or mic
            owner=from;ctl[from].dataset.owned='true';ctl[other(from)].dataset.owned='false';
            if(fn)fn();
        } else diag('request '+(silent?'expired':'declined'));
    }
    function buildAsk(side){
        var host=halfOf(side);
        var a=document.createElement('div');a.className='duck-ask';
        a.innerHTML='<div class="duck-ask-card"><div class="message-row peer"><div class="message-bubble peer duck-ask-bubble">'+
            '<div class="bubble-col" style="grid-column:1/-1"><span class="duck-ask-msg"></span></div></div></div>'+
            '<div class="duck-ask-btns"><button type="button" class="no"></button><button type="button" class="ok"></button></div></div>';
        host.style.position=host.style.position||'relative';
        host.appendChild(a);
        a.querySelector('.ok').addEventListener('click',function(){resolveAsk(true)});
        a.querySelector('.no').addEventListener('click',function(){resolveAsk(false)});
        return a;
    }

    /* ================= scroll follow / jump-to-latest (bridge pattern) ================= */
    var NEAR_BOTTOM=180, SHOW_JUMP=200, jumpBtn={};
    function transcriptOf(side){return document.getElementById(side==='local'?'local-transcript':'peer-transcript')}
    function isNearBottom(t){return t.scrollHeight-t.scrollTop-t.clientHeight<NEAR_BOTTOM}
    function scrollToLatest(side){
        var t=transcriptOf(side);if(!t)return;
        requestAnimationFrame(function(){t.scrollTop=t.scrollHeight;paintJump(side)});
    }
    function paintJump(side){
        var t=transcriptOf(side),b=jumpBtn[side];
        if(!t||!b)return;
        var behind=t.scrollHeight-t.scrollTop-t.clientHeight;
        b.classList.toggle('show',behind>SHOW_JUMP);
        var n=+(b.dataset.unread||0);
        b.querySelector('.n').textContent=n>0?(n>9?'9+':n):'';
        b.querySelector('.n').style.display=n>0?'inline-flex':'none';
    }
    function buildJump(side){
        var shell=shellOf(side);
        var b=document.createElement('button');
        b.type='button';b.className='duck-jump';b.dataset.unread='0';
        b.innerHTML='<span class="material-symbols-outlined" style="font-size:18px">arrow_downward</span><span class="n"></span>';
        b.addEventListener('click',function(){b.dataset.unread='0';scrollToLatest(side)});
        shell.appendChild(b);
        jumpBtn[side]=b;
        var t=transcriptOf(side);
        if(t)t.addEventListener('scroll',function(){
            if(isNearBottom(t))b.dataset.unread='0';
            paintJump(side);
        },{passive:true});
        return b;
    }

    /* ================= bubbles with sender + timestamp + day separators ================= */
    function dayKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
    function dayLabel(ts){
        var d=new Date(ts),t=new Date(),y=new Date(Date.now()-864e5);
        if(dayKey(ts)===dayKey(t.getTime()))return 'Today';
        if(dayKey(ts)===dayKey(y.getTime()))return 'Yesterday';
        return d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
    }
    function timeLabel(ts){return new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
    function dateTimeLabel(ts){return new Date(ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
    function duckRenderChat(opts){
        opts=opts||{};
        var cols=[document.getElementById('peer-transcript'),document.getElementById('local-transcript')].filter(Boolean);
        var sides=['peer','local'];
        var follow={},prevTop={};
        sides.forEach(function(s){
            var t=transcriptOf(s);
            follow[s]=!t||isNearBottom(t)||opts.sentBy===s;
            prevTop[s]=t?t.scrollTop:0;
            if(!follow[s]&&opts.newEntry&&jumpBtn[s])jumpBtn[s].dataset.unread=(+(jumpBtn[s].dataset.unread||0))+1;
        });
        cols.forEach(function(c){c.innerHTML=''});
        var lastId=chatHistory.length?chatHistory[chatHistory.length-1].id:null,save=false;
        var lastDay=cols.map(function(){return null});
        chatHistory.forEach(function(entry){
            var speaker=entry.speaker,cls=speaker==='local'?'local':'peer';
            var srcL=entry.sourceLanguage||(speaker==='local'?settings.localLanguage:settings.peerLanguage);
            var tgtL=entry.targetLanguage||(speaker==='local'?settings.peerLanguage:settings.localLanguage);
            if(!entry.sourceLanguage||!entry.targetLanguage){entry.sourceLanguage=srcL;entry.targetLanguage=tgtL;save=true}
            var text=entry.message||'',key=srcL+'|'+tgtL;
            entry.translations=entry.translations||{};
            var cached=entry.translations[key]||translationCache.get(srcL+'|'+tgtL+'|'+text);
            var tcols=[];
            var dk=dayKey(entry.ts||Date.now());
            cols.forEach(function(col,ci){
                if(lastDay[ci]!==dk){lastDay[ci]=dk;var sep=document.createElement('div');sep.className='duck-daysep';sep.textContent=dayLabel(entry.ts||Date.now());col.appendChild(sep)}
                var row=document.createElement('div');row.className='message-row '+cls;
                var bub=document.createElement('div');
                bub.className='message-bubble '+cls+' duck-'+(speaker==='local'?'s':'n')+(entry.id===lastId?' latest-bubble':'');
                var hdr=document.createElement('div');hdr.className='duck-hdr';
                hdr.innerHTML='<span class="duck-time">'+dateTimeLabel(entry.ts||Date.now())+'</span>'+
                    '<button type="button" class="duck-del" data-entry-id="'+entry.id+'" aria-label="Delete">✕</button>';
                var sc=document.createElement('div');sc.className='bubble-col';
                var tc=document.createElement('div');tc.className='bubble-col';
                bub.appendChild(hdr);bub.append(sc,tc);row.appendChild(bub);
                hdr.querySelector('.duck-del').addEventListener('click',function(ev){
                    ev.stopPropagation();deleteEntryById(entry.id);
                });
                sc.innerHTML=renderMarkdown(text);
                if(srcL===tgtL||!tgtL){bub.classList.add('single');tc.style.display='none'}
                else if(cached)tc.innerHTML=renderMarkdown(cached);
                else{tc.innerHTML='<span class="duck-pending">translating…</span>'}
                tcols.push(tc);col.appendChild(row);
            });
            if(srcL!==tgtL&&!cached){
                translateText(text,tgtL,srcL).then(function(tr){
                    if(!tr){tcols.forEach(function(c){
                        var b=c.closest('.message-bubble');if(b)b.classList.add('single');
                        c.style.display='none';
                    });diag('translation failed '+srcL+'→'+tgtL,true);return}
                    entry.translations[key]=tr;saveHistory();
                    tcols.forEach(function(c){c.innerHTML=renderMarkdown(tr)});
                });
            }
        });
        if(save)saveHistory();
        sides.forEach(function(s){
            var t=transcriptOf(s);if(!t)return;
            if(follow[s])t.scrollTop=t.scrollHeight; else t.scrollTop=prevTop[s];
            paintJump(s);
        });
    }
    // baseline callers (and its own scroll helper) route through the follow-aware renderer
    window.scrollTranscriptsToBottom=scrollTranscriptsToBottom=function(){
        ['local','peer'].forEach(function(s){var t=transcriptOf(s);if(t&&isNearBottom(t))t.scrollTop=t.scrollHeight;paintJump(s)});
    };

    /* ================= speech: same normalization path ================= */
    (function hookSpeech(){
        if(typeof addChatEntry!=='function')return;
        var _add=addChatEntry,busy=false;
        window.addChatEntry=addChatEntry=function(message,speaker){
            if(busy||!message)return _add(message,speaker);
            if(duckJustNormalized){duckJustNormalized=false;return _add(message,speaker)}
            var side=speaker==='local'?'local':'peer';
            var known=(side==='peer'&&peerRecognizerLang)||langOf(side);
            normalizeOutgoing(side,String(message),known).then(function(r){
                busy=true;try{_add(r.text,speaker)}finally{busy=false}
                if(r.normalized)diag('spoken text normalized on '+side+' → '+r.lang);
            });
        };
    })();

    /* ---- #1 translation: the donor's LibreTranslate endpoint is dead; MyMemory leads now ---- */
    function installTranslator(){
        if(typeof translateText!=='function')return;
        var _orig=translateText;
        window.translateText=translateText=function(text,target,source){
            source=source||'auto';
            if(!text||!target)return Promise.resolve(null);
            var ck=source+'|'+target+'|'+text;
            try{if(translationCache.has(ck))return Promise.resolve(translationCache.get(ck))}catch(e){}
            var pair=(source==='auto'?'en':source)+'|'+target;
            var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(pair);
            return fetch(url).then(function(r){return r.json()}).then(function(j){
                var t=j&&j.responseData&&j.responseData.translatedText;
                if(t&&!/^MYMEMORY WARNING|^QUERY LENGTH LIMIT|^INVALID/i.test(t)){
                    try{translationCache.set(ck,t)}catch(e){}
                    return t;
                }
                diag('MyMemory declined ('+String(t||'no text').slice(0,60)+') — trying donor chain',true);
                return _orig(text,target,source);
            }).catch(function(e){
                diag('MyMemory unreachable: '+e.message+' — trying donor chain',true);
                return _orig(text,target,source);
            });
        };
        diag('translator: MyMemory primary, donor chain fallback');
    }

    /* ---- #3: TTS re-gated to the listener's own toggle (shared physical speaker) ---- */
    (function fixTtsGating(){
        if(typeof speakIfEnabled!=='function')return;
        window.speakIfEnabled=speakIfEnabled=function(message,speaker){
            var enabled=speaker==='local'?settings.ttsEnabledPeer:settings.ttsEnabledLocal;   // listener's toggle, not speaker's
            if(!enabled||!('speechSynthesis' in window))return;
            var receiverLanguage=speaker==='local'?settings.peerLanguage:settings.localLanguage;
            var sourceLanguage=speaker==='local'?settings.localLanguage:settings.peerLanguage;
            var voiceName=speaker==='local'?settings.peerVoice:settings.localVoice;
            function speak(text){
                var u=new SpeechSynthesisUtterance(text);
                if(receiverLanguage)u.lang=receiverLanguage;
                if(voiceName){var v=availableVoices.find(function(x){return x.name===voiceName});if(v)u.voice=v}
                speechSynthesis.speak(u);
            }
            if(!receiverLanguage||receiverLanguage===sourceLanguage){speak(message);return}
            // never speak raw untranslated text — that means playing a phrase the listener cannot understand
            translateText(message,receiverLanguage,sourceLanguage).then(function(t){
                if(t)speak(t);else diag('TTS skipped — no translation '+sourceLanguage+'→'+receiverLanguage+' (would have spoken a foreign phrase)',true);
            });
        };
    })();

    /* ================= init ================= */
    function stripDefunctSettings(){
        try{if(typeof scheduleAutoSubmit==='function'){window.scheduleAutoSubmit=scheduleAutoSubmit=function(){};}}catch(e){}
        var inp=document.getElementById('typing-pause-input');
        if(inp){var lab=inp.closest('label');if(lab)lab.style.display='none';else inp.style.display='none';
            try{if(typeof clearTypingTimer==='function')clearTypingTimer()}catch(e){}
            diag('typing-pause setting removed (defunct)');}
    }
    function init(){
        // baseline language selects stay as the data source; fill them with the full flagged set
        ['local-language-select','peer-language-select'].forEach(function(id){
            var sel=document.getElementById(id);if(!sel)return;
            var cur=sel.value;
            sel.innerHTML=LANGS.map(function(l){return '<option value="'+l.code+'">'+l.flag+'  '+l.label+'</option>'}).join('');
            sel.value=LANG_BY[cur]?cur:'en';
        });
        ['local','peer'].forEach(function(side){
            buildComposer(side);buildJump(side);
            kb[side]=buildKeyboard(side);
            askEl[side]=buildAsk(side);
            ctl[side].dataset.owned='false';
        });
        stripDefunctSettings();installTranslator();
        // both baseline composers retire; each side now has an identical full-capability strip
        document.querySelectorAll('.tabletop-composer').forEach(function(c){c.style.display='none'});
        // language selects in the settings modal keep working and repaint everything
        ['local-language-select','peer-language-select'].forEach(function(id){
            var el=document.getElementById(id);
            if(el)el.addEventListener('change',function(){paintLangbars();if(owner)renderKeys(owner)});
        });
        // take over rendering so bubbles get headers/timestamps
        window.renderChat=renderChat=function(){
            var o={newEntry:true,sentBy:duckSentBy};duckSentBy=null;return duckRenderChat(o);
        };
        duckRenderChat({});
        ['local','peer'].forEach(function(s){scrollToLatest(s)});
        // mic remembers which language it listened in
        ['local','peer'].forEach(function(s){paintTts(s)});
        // diagnostics
        var b=document.createElement('button');b.id='duck-diag-btn';b.type='button';b.textContent='⌁';
        var p=document.createElement('div');p.id='duck-diag';
        p.innerHTML='<div class="duck-diag-tools"><b>diagnostics</b><span style="flex:1"></span><button type="button" id="duck-diag-copy">Copy</button><button type="button" id="duck-diag-close">✕</button></div><div id="duck-diag-lines"></div>';
        document.body.appendChild(b);document.body.appendChild(p);
        b.addEventListener('click',function(){p.classList.toggle('show');if(p.classList.contains('show'))renderDiag()});
        p.querySelector('#duck-diag-copy').addEventListener('click',function(){
            var txt=diagLines.slice().reverse().join('\n');
            var btn=this;
            navigator.clipboard.writeText(txt).then(function(){btn.textContent='Copied!';setTimeout(function(){btn.textContent='Copy'},1200)})
                .catch(function(e){diag('copy failed: '+e.message,true)});
        });
        p.querySelector('#duck-diag-close').addEventListener('click',function(){p.classList.remove('show')});
        document.addEventListener('keydown',function(e){
            if(e.key==='Enter'&&!e.shiftKey&&owner==='peer'&&document.activeElement===inputs.peer){e.preventDefault();send('peer')}
        });
        diag('duck ready — '+LANGS.length+' languages · ko/ja native IME · swype · fixed-mode normalization');
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
