<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>duck · R1 — translation harness</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#131826; --panel2:#1a2132; --line:#263049;
    --ink:#e8edf7; --dim:#8b96ad; --acc:#4da3ff; --ok:#2fd07f; --err:#ff5d6c; --warn:#ffb84d;
    --radius:14px;
    --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    padding:calc(10px + var(--sat)) 12px calc(10px + var(--sab));
  }
  header{display:flex;align-items:baseline;gap:10px;padding:4px 2px 12px}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
  main{flex:1;display:flex;flex-direction:column;gap:12px;max-width:720px;width:100%;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .langrow{display:flex;gap:8px;align-items:center}
  select{
    flex:1;min-width:0;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:16px;
  }
  #swap{
    flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--acc);font-size:20px;line-height:1;cursor:pointer;
  }
  #swap:active{transform:scale(.94)}
  textarea{
    width:100%;min-height:96px;resize:vertical;background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit;
  }
  textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .row{display:flex;gap:8px;align-items:center}
  #go{
    flex:1;height:50px;border:0;border-radius:12px;background:var(--acc);color:#04121f;
    font-size:17px;font-weight:700;cursor:pointer;letter-spacing:.3px;
  }
  #go:disabled{opacity:.45;cursor:default}
  #go:not(:disabled):active{transform:scale(.98)}
  #clear{
    width:56px;height:50px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--dim);font-size:15px;cursor:pointer;
  }
  #out{
    min-height:64px;font-size:20px;white-space:pre-wrap;word-break:break-word;
  }
  #out.placeholder{color:var(--dim);font-size:15px}
  #out[dir="rtl"]{text-align:right}
  .outmeta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
  .pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px;white-space:nowrap}
  .pill.ok{color:var(--ok);border:1px solid var(--ok)}
  .pill.slow{color:var(--warn);border:1px solid var(--warn)}
  .pill.err{color:var(--err);border:1px solid var(--err)}
  #copy{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
  details{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  summary{padding:12px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--dim)}
  summary::-webkit-details-marker{display:none}
  summary .chev{transition:transform .15s}
  details[open] summary .chev{transform:rotate(180deg)}
  #diag{max-height:34dvh;overflow-y:auto;border-top:1px solid var(--line);padding:8px 12px;font-size:12.5px}
  .drow{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line)}
  .drow:last-child{border-bottom:0}
  .drow time{color:var(--dim);flex:0 0 62px;font-variant-numeric:tabular-nums}
  .drow .what{flex:1;min-width:0;word-break:break-word}
  .drow .ms{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700}
  .ms.ok{color:var(--ok)} .ms.slow{color:var(--warn)} .ms.err{color:var(--err)}
  .foot{text-align:center;color:var(--dim);font-size:11px;padding:6px 0 0}
</style>
</head>
<body>
<header>
  <h1>🦆 duck</h1>
  <span class="tag">R1 · MyMemory integration harness</span>
</header>

<main>
  <section class="card" aria-label="translation controls">
    <div class="langrow">
      <select id="src" aria-label="source language"></select>
      <button id="swap" type="button" title="Swap languages" aria-label="Swap languages">⇄</button>
      <select id="tgt" aria-label="target language"></select>
    </div>
    <div style="height:10px"></div>
    <form id="form">
      <textarea id="in" placeholder="Type text to translate…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
      <div style="height:10px"></div>
      <div class="row">
        <button id="go" type="submit">Translate</button>
        <button id="clear" type="button" aria-label="Clear input">✕</button>
      </div>
    </form>
  </section>

  <section class="card" aria-label="translation result">
    <div id="out" class="placeholder">Translation appears here.</div>
    <div class="outmeta">
      <span id="status" class="pill" style="visibility:hidden">idle</span>
      <button id="copy" type="button" hidden>Copy</button>
    </div>
  </section>

  <details id="diagbox" open>
    <summary><span>Diagnostics — target ≤ <b id="target"></b> ms round-trip</span><span class="chev">▾</span></summary>
    <div id="diag"></div>
  </details>

  <div class="foot">Provider: MyMemory (anonymous tier) · all diagnostics in-app</div>
</main>

<script>
(function(){
  "use strict";

  /* ---------- CONFIG (single source of truth) ---------- */
  var CONFIG = {
    ENDPOINT: "https://api.mymemory.translated.net/get",
    LATENCY_TARGET_MS: 1000,
    // Launch language set (default fallback per plan; replace with test.html set when supplied).
    // Codes are MyMemory langpair codes.
    LANGS: [
      {code:"en",    label:"English"},
      {code:"es",    label:"Español"},
      {code:"fr",    label:"Français"},
      {code:"de",    label:"Deutsch"},
      {code:"pt",    label:"Português"},
      {code:"it",    label:"Italiano"},
      {code:"nl",    label:"Nederlands"},
      {code:"zh-CN", label:"中文 (简体)"},
      {code:"ja",    label:"日本語"},
      {code:"ko",    label:"한국어"},
      {code:"ar",    label:"العربية", rtl:true},
      {code:"ru",    label:"Русский"},
      {code:"hi",    label:"हिन्दी"}
    ]
  };

  /* ---------- DOM ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var srcEl=$("src"), tgtEl=$("tgt"), inEl=$("in"), outEl=$("out"),
      statusEl=$("status"), copyBtn=$("copy"), diagEl=$("diag");

  $("target").textContent = CONFIG.LATENCY_TARGET_MS;

  /* ---------- Language pickers ---------- */
  function fill(sel){
    CONFIG.LANGS.forEach(function(l){
      var o=document.createElement("option");
      o.value=l.code; o.textContent=l.label; sel.appendChild(o);
    });
  }
  fill(srcEl); fill(tgtEl);
  try{
    srcEl.value = localStorage.getItem("duck.src") || "en";
    tgtEl.value = localStorage.getItem("duck.tgt") || "es";
  }catch(e){ srcEl.value="en"; tgtEl.value="es"; }
  if(srcEl.value===tgtEl.value) tgtEl.value = (srcEl.value==="en") ? "es" : "en";
  function persist(){
    try{ localStorage.setItem("duck.src",srcEl.value); localStorage.setItem("duck.tgt",tgtEl.value); }catch(e){}
  }
  srcEl.addEventListener("change",persist);
  tgtEl.addEventListener("change",persist);
  $("swap").addEventListener("click",function(){
    var a=srcEl.value; srcEl.value=tgtEl.value; tgtEl.value=a; persist();
    if(lastText) translate(lastText); // re-run with swapped pair for instant feel
  });

  /* ---------- Diagnostics (in-app only, never console-only) ---------- */
  function now(){
    var d=new Date();
    return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
  }
  function diag(msg, ms, cls){
    var row=document.createElement("div"); row.className="drow";
    var t=document.createElement("time"); t.textContent=now();
    var w=document.createElement("div"); w.className="what"; w.textContent=msg;
    row.appendChild(t); row.appendChild(w);
    if(ms!=null){
      var m=document.createElement("span");
      m.className="ms "+(cls||"");
      m.textContent=Math.round(ms)+" ms";
      row.appendChild(m);
    }
    diagEl.insertBefore(row, diagEl.firstChild);
    while(diagEl.children.length>60) diagEl.removeChild(diagEl.lastChild);
  }
  function setStatus(text, cls){
    statusEl.style.visibility="visible";
    statusEl.textContent=text;
    statusEl.className="pill "+cls;
  }

  /* ---------- Helpers ---------- */
  function decodeEntities(s){
    var ta=document.createElement("textarea");
    ta.innerHTML=s; return ta.value;
  }
  function isRtl(code){
    for(var i=0;i<CONFIG.LANGS.length;i++) if(CONFIG.LANGS[i].code===code) return !!CONFIG.LANGS[i].rtl;
    return false;
  }

  /* ---------- Translation ---------- */
  var inFlight=false, lastText="";
  var goBtn=$("go"), form=$("form");

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var text=inEl.value.trim();
    if(!text){ setStatus("nothing to translate","err"); diag("Translate pressed with empty input.",null,"err"); return; }
    translate(text);
  });
  $("clear").addEventListener("click",function(){
    inEl.value=""; inEl.focus();
    outEl.textContent="Translation appears here."; outEl.className="placeholder"; outEl.removeAttribute("dir");
    statusEl.style.visibility="hidden"; copyBtn.hidden=true;
  });
  copyBtn.addEventListener("click",function(){
    var txt=outEl.textContent;
    function done(){ copyBtn.textContent="Copied"; setTimeout(function(){copyBtn.textContent="Copy";},1200); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,function(){ diag("Clipboard write failed.",null,"err"); });
    }else{
      var ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ diag("Clipboard write failed (execCommand).",null,"err"); }
      document.body.removeChild(ta);
    }
  });

  function translate(text){
    if(inFlight){ diag("Call ignored — a request is already in flight.",null,"err"); return; }
    var src=srcEl.value, tgt=tgtEl.value;
    if(src===tgt){ setStatus("same language","err"); diag("Source and target are identical ("+src+"). Pick different languages.",null,"err"); return; }

    lastText=text;
    inFlight=true; goBtn.disabled=true;
    setStatus("translating…","slow");

    var url=CONFIG.ENDPOINT+"?q="+encodeURIComponent(text)+"&langpair="+encodeURIComponent(src+"|"+tgt);
    diag("→ "+src+" → "+tgt+" · “"+(text.length>60?text.slice(0,60)+"…":text)+"”");

    var t0=performance.now();
    fetch(url,{cache:"no-store"})
      .then(function(res){
        var ms=performance.now()-t0;
        if(!res.ok){
          throw {http:res.status, ms:ms, quota:(res.status===429)};
        }
        return res.json().then(function(body){ return {body:body, ms:ms}; });
      })
      .then(function(r){
        var body=r.body, ms=r.ms;
        var st=body.responseStatus;
        var details=body.responseDetails||"";
        var quotaHit = (st===429) || (st===403) || /quota|free translations|429/i.test(details);
        if(st!==200 && st!=="200"){
          var kind = quotaHit ? "QUOTA" : ("API "+st);
          throw {api:kind, ms:ms, quota:quotaHit, details:details};
        }
        var translated = decodeEntities((body.responseData&&body.responseData.translatedText)||"");
        if(!translated) throw {api:"EMPTY", ms:ms, details:"Empty translatedText in response."};

        outEl.textContent=translated;
        outEl.className="";
        if(isRtl(tgt)) outEl.setAttribute("dir","rtl"); else outEl.removeAttribute("dir");
        copyBtn.hidden=false;

        var ok = ms<=CONFIG.LATENCY_TARGET_MS;
        setStatus(Math.round(ms)+" ms "+(ok?"✓":"(slow)"), ok?"ok":"slow");
        diag("← OK · "+src+" → "+tgt, ms, ok?"ok":"slow");
      })
      .catch(function(err){
        var ms = (err && err.ms!=null) ? err.ms : (performance.now()-t0);
        var msg;
        if(err && err.quota){
          msg="MyMemory quota exceeded (anonymous tier daily limit). "+(err.details||"");
        }else if(err && err.http){
          msg="HTTP "+err.http+" from MyMemory.";
        }else if(err && err.api){
          msg="API error ["+err.api+"] "+(err.details||"");
        }else{
          msg="Network error: "+((err&&err.message)||"request failed")+" (offline or CORS blocked).";
        }
        setStatus("error","err");
        diag("✗ "+msg, ms, "err");
        outEl.textContent="⚠ "+msg;
        outEl.className="";
        copyBtn.hidden=true;
      })
      .then(function(){
        inFlight=false; goBtn.disabled=false;
      });
  }

  diag("duck R1 harness ready. Provider: MyMemory anonymous endpoint. Target ≤ "+CONFIG.LATENCY_TARGET_MS+" ms round-trip.");
})();
</script>
</body>
</html>
