<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
    <meta name="google" content="notranslate">
    <meta name="googlebot" content="notranslate">
    <title>Chat Tabletop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
    <style>
        :root {
            --bubble-local-bg: #eff6ff;
            --bubble-local-text: #1f2937;
            --bubble-peer-bg: #ffffff;
            --bubble-peer-text: #0f172a;
            --bubble-font-size: 14px;
            --chat-bg-color: #ffffff;
        }
        html,
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100dvh;
            height: 100%;
            overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal { transition: opacity 0.2s ease, visibility 0.2s ease; }
        .modal.invisible { opacity: 0; visibility: hidden; pointer-events: none; }
        .modal.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-content { transition: transform 0.2s ease; }
        .scale-in { transform: scale(1); }
        .scale-out { transform: scale(0.98); }
        .tabletop-view {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr);
            height: 100dvh;
            gap: 2px;
        }
        .tabletop-half {
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 4px;
            min-height: 0;
        }
        .tabletop-north { transform: rotate(180deg); }
        .client-shell {
            width: min(92%, 520px);
            height: 100%;
            border-radius: 28px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 18px 30px rgba(15, 23, 42, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tabletop-transcript {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--chat-bg-color);
        }
        #peer-transcript {
            background-color: var(--chat-bg-peer, var(--chat-bg-color));
        }
        #local-transcript {
            background-color: var(--chat-bg-local, var(--chat-bg-color));
        }
        .tabletop-composer {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-top: 1px solid rgba(226, 232, 240, 0.9);
            background: rgba(255, 255, 255, 0.98);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }
        .tabletop-input {
            flex: 1;
            min-width: 0;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            background: white;
            font-size: 0.95rem;
        }
        .tabletop-talk {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.95), rgba(59, 130, 246, 0.95));
            color: white;
            border: none;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }
        .tabletop-talk[data-listening="true"] {
            background: linear-gradient(135deg, rgba(248, 113, 113, 0.95), rgba(239, 68, 68, 0.95));
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
        }
        .tabletop-talk:active { transform: scale(0.98); }
        .message-row {
            display: flex;
        }
        .message-row.peer { justify-content: flex-start; }
        .message-row.local { justify-content: flex-end; }
        .message-bubble {
            max-width: 96%;
            border-radius: 20px;
            padding: 10px 40px 10px 14px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: var(--bubble-font-size, 0.95rem);
            position: relative;
        }
        .message-bubble.latest-bubble { border-width: 3px; font-weight: 600; }
        .message-bubble.local {
            background: var(--bubble-local-bg);
            color: var(--bubble-local-text);
            font-size: var(--bubble-font-size-local, var(--bubble-font-size, 0.95rem));
        }
        .message-bubble.peer {
            background: var(--bubble-peer-bg);
            color: var(--bubble-peer-text);
            font-size: var(--bubble-font-size-peer, var(--bubble-font-size, 0.95rem));
        }
        .message-bubble .bubble-col {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            word-break: break-word;
        }
        .message-bubble .bubble-col + .bubble-col {
            border-left: 1px solid rgba(226, 232, 240, 0.9);
            padding-left: 12px;
        }
        .speaker-indicator {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            height: 40px;
        }
        .speaker-indicator::before {
            content: '';
            position: absolute;
            left: 18px;
            right: 18px;
            top: 50%;
            height: 2px;
            background: rgba(148, 163, 184, 0.6);
        }
        #speaker-toggle {
            pointer-events: auto;
            width: 52px;
            height: 52px;
            border-radius: 999px;
            border: 1px solid rgba(226, 232, 240, 0.8);
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 25px rgba(148, 163, 184, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s ease;
        }
        #speaker-toggle .speaker-arrow {
            font-size: 28px;
            color: rgba(59, 130, 246, 0.9);
            transition: transform 0.25s ease;
        }
        #speaker-toggle[data-active="peer"] .speaker-arrow { transform: rotate(180deg); }
        .bubble-delete {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(255, 255, 255, 0.9);
            color: rgba(71, 85, 105, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .bubble-delete:hover { color: rgba(239, 68, 68, 0.9); }
        .tts-toggle {
            width: 36px;
            height: 36px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(226, 232, 240, 0.6);
            color: rgba(100, 116, 139, 0.9);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .tts-toggle[data-enabled="true"] {
            background: rgba(191, 219, 254, 0.8);
            color: rgba(30, 64, 175, 0.9);
            border-color: rgba(147, 197, 253, 0.9);
        }
        .settings-matrix {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            align-items: center;
        }
        .settings-matrix .matrix-head {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
        }
        .settings-matrix .matrix-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
        }
        #gear-fab {
            cursor: grab;
            touch-action: none;
        }
        #gear-fab.dragging {
            cursor: grabbing;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800">
    <main class="tabletop-view">
        <div class="tabletop-half tabletop-north">
            <div class="client-shell">
                <div id="peer-transcript" class="tabletop-transcript no-scrollbar"></div>
                <div class="tabletop-composer">
                    <button id="peer-tts-toggle" class="tts-toggle" type="button" aria-label="Toggle peer read aloud">
                        <span class="material-symbols-outlined text-base">volume_off</span>
                    </button>
                    <button id="peer-talk" class="tabletop-talk" type="button" aria-label="Hold to talk" aria-pressed="false">
                        <span class="material-symbols-outlined text-base">mic</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="speaker-indicator">
            <button id="speaker-toggle" type="button" data-active="local" aria-label="Toggle active speaker">
                <span class="material-symbols-outlined speaker-arrow">arrow_upward</span>
            </button>
        </div>
        <div class="tabletop-half tabletop-south">
            <div class="client-shell">
                <div id="local-transcript" class="tabletop-transcript no-scrollbar"></div>
                <div class="tabletop-composer">
                    <button id="local-tts-toggle" class="tts-toggle" type="button" aria-label="Toggle local text to speech">
                        <span class="material-symbols-outlined text-base">volume_off</span>
                    </button>
                    <textarea id="local-input" rows="1" class="tabletop-input" placeholder="Enter local text"></textarea>
                    <button id="local-send" class="tabletop-talk" type="button" aria-label="Send local message">
                        <span class="material-symbols-outlined text-base">send</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <button id="gear-fab" class="fixed z-40 w-12 h-12 rounded-full bg-white/90 border border-slate-200 shadow-lg flex items-center justify-center text-slate-600 hover:text-slate-800 hover:bg-white" aria-label="Open controls">
        <span class="material-symbols-outlined text-[22px]">settings</span>
    </button>

    <input id="drawer-import-input" type="file" accept="application/json" class="hidden">

    <div id="controls-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center invisible modal">
        <div id="controls-content" class="bg-white rounded-2xl shadow-2xl w-11/12 max-w-md p-6 transform scale-out modal-content flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-xl font-bold text-gray-800">Controls</h3>
                <button id="close-controls" class="text-gray-400 hover:text-gray-800 p-2 hover:bg-gray-100 rounded-full transition-colors">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <div class="grid gap-4 text-sm flex-1 overflow-y-auto pr-1">
                <div class="settings-matrix">
                    <div></div>
                    <div class="matrix-head">Local</div>
                    <div class="matrix-head">Peer</div>

                    <div class="matrix-label">Language</div>
                    <select id="local-language-select" class="px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-300 bg-white">
                        <option value="en">English</option>
                        <option value="zh">Chinese</option>
                        <option value="km">Cambodian</option>
                        <option value="id">Indonesian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="lo">Lao</option>
                        <option value="ms">Malay</option>
                        <option value="th">Thai</option>
                        <option value="vi">Vietnamese</option>
                    </select>
                    <select id="peer-language-select" class="px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-300 bg-white">
                        <option value="en">English</option>
                        <option value="zh">Chinese</option>
                        <option value="km">Cambodian</option>
                        <option value="id">Indonesian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="lo">Lao</option>
                        <option value="ms">Malay</option>
                        <option value="th">Thai</option>
                        <option value="vi">Vietnamese</option>
                    </select>

                    <div class="matrix-label">Bubble color</div>
                    <input id="style-local-bg" type="color" class="h-8 w-full border border-slate-200 rounded-lg">
                    <input id="style-peer-bg" type="color" class="h-8 w-full border border-slate-200 rounded-lg">

                    <div class="matrix-label">Font color</div>
                    <input id="style-local-text" type="color" class="h-8 w-full border border-slate-200 rounded-lg">
                    <input id="style-peer-text" type="color" class="h-8 w-full border border-slate-200 rounded-lg">

                    <div class="matrix-label">Font size</div>
                    <input id="style-local-font-size" type="number" min="10" max="48" step="1" class="w-full px-2 py-1 text-xs border border-slate-200 rounded-lg text-slate-700">
                    <input id="style-peer-font-size" type="number" min="10" max="48" step="1" class="w-full px-2 py-1 text-xs border border-slate-200 rounded-lg text-slate-700">

                    <div class="matrix-label">Bkrnd color</div>
                    <input id="style-local-bg-panel" type="color" class="h-8 w-full border border-slate-200 rounded-lg">
                    <input id="style-peer-bg-panel" type="color" class="h-8 w-full border border-slate-200 rounded-lg">

                    <div class="matrix-label">TTS voice</div>
                    <select id="local-voice-select" class="px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-300 bg-white"></select>
                    <select id="peer-voice-select" class="px-3 py-2 text-xs border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-300 focus:border-blue-300 bg-white"></select>
                </div>
                <label class="flex items-center justify-between gap-3 px-3 py-2 rounded-lg border border-slate-200 text-slate-600">
                    <span class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-base">timer</span>
                        Typing pause (seconds)
                    </span>
                    <input id="typing-pause-input" type="number" min="1" max="10" step="0.5" class="w-20 px-2 py-1 text-xs border border-slate-200 rounded-lg text-slate-700">
                </label>
                <div class="flex justify-end gap-2">
                    <button id="style-reset" class="px-3 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg hover:bg-slate-200 transition">Reset</button>
                    <button id="style-save" class="px-3 py-2 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition">Save</button>
                </div>
                <button id="drawer-import" class="flex items-center gap-3 px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:text-slate-800 hover:bg-slate-50">
                    <span class="material-symbols-outlined text-base">upload_file</span>
                    Import chat
                </button>
                <button id="drawer-export" class="flex items-center gap-3 px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:text-slate-800 hover:bg-slate-50">
                    <span class="material-symbols-outlined text-base">download</span>
                    Export chat
                </button>
                <button id="drawer-clear" class="flex items-center gap-3 px-3 py-2 rounded-lg border border-rose-100 text-rose-500 hover:text-rose-600 hover:bg-rose-50">
                    <span class="material-symbols-outlined text-base">delete_sweep</span>
                    Export &amp; clear
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = {
            history: 'tabletop_chat_history',
            settings: 'tabletop_chat_settings',
            styles: 'tabletop_chat_styles',
            background: 'tabletop_chat_background'
        };
        const DEFAULT_SETTINGS = {
            peerLanguage: 'en',
            localLanguage: 'en',
            typingPauseMs: 3000,
            activeSpeaker: 'local',
            ttsEnabledLocal: false,
            ttsEnabledPeer: false,
            localVoice: '',
            peerVoice: ''
        };
        const DEFAULT_STYLES = {
            localBg: '#eff6ff',
            localText: '#1f2937',
            peerBg: '#ffffff',
            peerText: '#0f172a',
            localFontSize: 14,
            peerFontSize: 14
        };
        const DEFAULT_BACKGROUND = {
            localColor: '#ffffff',
            peerColor: '#ffffff'
        };

        const peerTranscript = document.getElementById('peer-transcript');
        const localTranscript = document.getElementById('local-transcript');
        const localInput = document.getElementById('local-input');
        const peerTalk = document.getElementById('peer-talk');
        const localSend = document.getElementById('local-send');
        const peerTtsToggle = document.getElementById('peer-tts-toggle');
        const localTtsToggle = document.getElementById('local-tts-toggle');
        const speakerToggle = document.getElementById('speaker-toggle');
        const gearFab = document.getElementById('gear-fab');
        const controlsModal = document.getElementById('controls-modal');
        const controlsContent = document.getElementById('controls-content');
        const closeControls = document.getElementById('close-controls');
        const peerLanguageSelect = document.getElementById('peer-language-select');
        const localLanguageSelect = document.getElementById('local-language-select');
        const typingPauseInput = document.getElementById('typing-pause-input');
        const styleLocalBg = document.getElementById('style-local-bg');
        const styleLocalText = document.getElementById('style-local-text');
        const stylePeerBg = document.getElementById('style-peer-bg');
        const stylePeerText = document.getElementById('style-peer-text');
        const styleLocalFontSize = document.getElementById('style-local-font-size');
        const stylePeerFontSize = document.getElementById('style-peer-font-size');
        const styleLocalBgPanel = document.getElementById('style-local-bg-panel');
        const stylePeerBgPanel = document.getElementById('style-peer-bg-panel');
        const localVoiceSelect = document.getElementById('local-voice-select');
        const peerVoiceSelect = document.getElementById('peer-voice-select');
        const styleReset = document.getElementById('style-reset');
        const styleSave = document.getElementById('style-save');
        const drawerImport = document.getElementById('drawer-import');
        const drawerExport = document.getElementById('drawer-export');
        const drawerClear = document.getElementById('drawer-clear');
        const drawerImportInput = document.getElementById('drawer-import-input');

        let chatHistory = [];
        let settings = { ...DEFAULT_SETTINGS };
        let styles = { ...DEFAULT_STYLES };
        let background = { ...DEFAULT_BACKGROUND };
        let typingTimer = null;
        const translationCache = new Map();
        const pendingTranslations = new Map();
        let availableVoices = [];
        let gearWasDragged = false;
        let gearPositionLocked = false;
        let peerRecognizer = null;
        let peerListening = false;

        const LANGUAGE_PREFIXES = {
            en: 'en',
            zh: 'zh',
            km: 'km',
            id: 'id',
            ja: 'ja',
            ko: 'ko',
            lo: 'lo',
            ms: 'ms',
            th: 'th',
            vi: 'vi'
        };

        function readStorage(key) {
            try {
                return localStorage.getItem(key);
            } catch (_) {
                return null;
            }
        }

        function writeStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (_) {}
        }

        function loadSettings() {
            const raw = readStorage(STORAGE_KEYS.settings);
            if (!raw) return { ...DEFAULT_SETTINGS };
            try {
                return { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
            } catch (_) {
                return { ...DEFAULT_SETTINGS };
            }
        }

        function saveSettings() {
            writeStorage(STORAGE_KEYS.settings, JSON.stringify(settings));
        }

        function loadHistory() {
            const raw = readStorage(STORAGE_KEYS.history);
            if (!raw) return [];
            try {
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (_) {
                return [];
            }
        }

        function saveHistory() {
            writeStorage(STORAGE_KEYS.history, JSON.stringify(chatHistory.slice(-200)));
        }

        function loadStyles() {
            const raw = readStorage(STORAGE_KEYS.styles);
            if (!raw) return { ...DEFAULT_STYLES };
            try {
                return { ...DEFAULT_STYLES, ...JSON.parse(raw) };
            } catch (_) {
                return { ...DEFAULT_STYLES };
            }
        }

        function saveStyles() {
            writeStorage(STORAGE_KEYS.styles, JSON.stringify(styles));
        }

        function loadBackground() {
            const raw = readStorage(STORAGE_KEYS.background);
            if (!raw) return { ...DEFAULT_BACKGROUND };
            try {
                return { ...DEFAULT_BACKGROUND, ...JSON.parse(raw) };
            } catch (_) {
                return { ...DEFAULT_BACKGROUND };
            }
        }

        function saveBackground() {
            writeStorage(STORAGE_KEYS.background, JSON.stringify(background));
        }

        function applyStyles() {
            const root = document.documentElement;
            root.style.setProperty('--bubble-local-bg', styles.localBg);
            root.style.setProperty('--bubble-local-text', styles.localText);
            root.style.setProperty('--bubble-peer-bg', styles.peerBg);
            root.style.setProperty('--bubble-peer-text', styles.peerText);
            root.style.setProperty('--bubble-font-size-local', `${styles.localFontSize}px`);
            root.style.setProperty('--bubble-font-size-peer', `${styles.peerFontSize}px`);
        }

        function applyBackground() {
            const root = document.documentElement;
            root.style.setProperty('--chat-bg-local', background.localColor || DEFAULT_BACKGROUND.localColor);
            root.style.setProperty('--chat-bg-peer', background.peerColor || DEFAULT_BACKGROUND.peerColor);
            root.style.setProperty('--chat-bg-color', DEFAULT_BACKGROUND.localColor);
        }

        function updateControls() {
            peerLanguageSelect.value = settings.peerLanguage;
            localLanguageSelect.value = settings.localLanguage;
            typingPauseInput.value = (settings.typingPauseMs / 1000).toFixed(1).replace(/\.0$/, '');
            styleLocalBg.value = styles.localBg;
            styleLocalText.value = styles.localText;
            stylePeerBg.value = styles.peerBg;
            stylePeerText.value = styles.peerText;
            styleLocalFontSize.value = styles.localFontSize;
            stylePeerFontSize.value = styles.peerFontSize;
            styleLocalBgPanel.value = background.localColor;
            stylePeerBgPanel.value = background.peerColor;
            updateTtsToggle(localTtsToggle, settings.ttsEnabledLocal);
            updateTtsToggle(peerTtsToggle, settings.ttsEnabledPeer);
            updateVoiceSelectors();
            updateSpeakerIndicator();
        }

        function toggleModal(isOpen) {
            if (!controlsModal || !controlsContent) return;
            if (isOpen) {
                controlsModal.classList.remove('invisible');
                controlsModal.classList.add('visible');
                controlsContent.classList.remove('scale-out');
                controlsContent.classList.add('scale-in');
            } else {
                controlsModal.classList.add('invisible');
                controlsModal.classList.remove('visible');
                controlsContent.classList.add('scale-out');
                controlsContent.classList.remove('scale-in');
            }
        }

        function updateSpeakerIndicator() {
            if (!speakerToggle) return;
            speakerToggle.dataset.active = settings.activeSpeaker;
        }

        function clearTypingTimer() {
            if (typingTimer) {
                clearTimeout(typingTimer);
            }
            typingTimer = null;
        }

        function flipActiveSpeaker() {
            settings.activeSpeaker = settings.activeSpeaker === 'local' ? 'peer' : 'local';
            updateSpeakerIndicator();
            saveSettings();
            scrollTranscriptsToBottom();
        }

        function scheduleAutoSubmit(input, speaker) {
            clearTypingTimer();
            typingTimer = setTimeout(() => {
                const value = (input?.value || '').trim();
                if (!value) return;
                settings.activeSpeaker = speaker;
                updateSpeakerIndicator();
                saveSettings();
                addChatEntry(value, speaker);
                if (input) {
                    input.value = '';
                }
                flipActiveSpeaker();
            }, settings.typingPauseMs);
        }

        function scrollTranscriptsToBottom() {
            [peerTranscript, localTranscript].forEach(column => {
                if (!column) return;
                if (typeof column.scrollTo === 'function') {
                    column.scrollTo({ top: column.scrollHeight, behavior: 'smooth' });
                } else {
                    column.scrollTop = column.scrollHeight;
                }
            });
        }

        function createEntryId() {
            return (crypto.randomUUID ? crypto.randomUUID() : `entry_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
        }

        async function translateText(text, target, source = 'auto') {
            if (!text || !target) return null;
            const cacheKey = `${source}|${target}|${text}`;
            if (translationCache.has(cacheKey)) return translationCache.get(cacheKey);
            if (pendingTranslations.has(cacheKey)) return pendingTranslations.get(cacheKey);
            const pendingPromise = (async () => {
                try {
                    const res = await fetch('https://libretranslate.de/translate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ q: text, source, target, format: 'text' })
                    });
                    if (!res.ok) throw new Error('Translation failed');
                    const data = await res.json();
                    const translated = data?.translatedText || null;
                    if (translated) {
                        translationCache.set(cacheKey, translated);
                    }
                    return translated;
                } catch (_) {
                    try {
                        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(source)}&tl=${encodeURIComponent(target)}&dt=t&q=${encodeURIComponent(text)}`);
                        if (!res.ok) throw new Error('Translation fallback failed');
                        const data = await res.json();
                        const translated = Array.isArray(data?.[0])
                            ? data[0].map(part => part?.[0]).filter(Boolean).join('')
                            : null;
                        if (translated) {
                            translationCache.set(cacheKey, translated);
                        }
                        return translated;
                    } catch (_) {
                        return null;
                    }
                } finally {
                    pendingTranslations.delete(cacheKey);
                }
            })();
            pendingTranslations.set(cacheKey, pendingPromise);
            return pendingPromise;
        }

        function escapeHtml(text) {
            return (text || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderMarkdown(text) {
            let html = escapeHtml(text || '');
            html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre class="bg-slate-900 text-slate-100 rounded p-2 text-[11px] overflow-auto"><code>${code}</code></pre>`);
            html = html.replace(/`([^`]+)`/g, '<code class="bg-slate-100 px-1 rounded">$1</code>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
            html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        function renderChat() {
            const transcripts = [peerTranscript, localTranscript].filter(Boolean);
            transcripts.forEach(column => {
                column.innerHTML = '';
            });
            const lastEntryId = chatHistory.length ? chatHistory[chatHistory.length - 1].id : null;
            let shouldSaveHistory = false;
            chatHistory.forEach(entry => {
                const speaker = entry.speaker;
                const bubbleClass = speaker === 'local' ? 'local' : 'peer';
                const defaultSource = speaker === 'local' ? settings.localLanguage : settings.peerLanguage;
                const defaultTarget = speaker === 'local' ? settings.peerLanguage : settings.localLanguage;
                const sourceLanguage = entry.sourceLanguage || defaultSource;
                const targetLanguage = entry.targetLanguage || defaultTarget;
                if (!entry.sourceLanguage || !entry.targetLanguage) {
                    entry.sourceLanguage = sourceLanguage;
                    entry.targetLanguage = targetLanguage;
                    shouldSaveHistory = true;
                }
                const text = entry.message || '';
                const translationKey = `${sourceLanguage}|${targetLanguage}`;
                entry.translations = entry.translations || {};
                const cached = entry.translations[translationKey] || translationCache.get(`${sourceLanguage}|${targetLanguage}|${text}`);
                const translationCols = [];

                transcripts.forEach(column => {
                    const row = document.createElement('div');
                    row.className = `message-row ${bubbleClass}`;
                    const bubble = document.createElement('div');
                    bubble.className = `message-bubble ${bubbleClass}${entry.id === lastEntryId ? ' latest-bubble' : ''}`;

                    const sourceCol = document.createElement('div');
                    sourceCol.className = 'bubble-col';
                    const translationCol = document.createElement('div');
                    translationCol.className = 'bubble-col';
                    const deleteButton = document.createElement('button');
                    deleteButton.type = 'button';
                    deleteButton.className = 'bubble-delete material-symbols-outlined';
                    deleteButton.textContent = 'close';
                    deleteButton.dataset.entryId = entry.id;
                    bubble.append(sourceCol, translationCol);
                    bubble.appendChild(deleteButton);
                    row.appendChild(bubble);

                    sourceCol.innerHTML = renderMarkdown(text);
                    if (sourceLanguage === targetLanguage || !targetLanguage) {
                        translationCol.innerHTML = renderMarkdown(text);
                    } else if (cached) {
                        translationCol.innerHTML = renderMarkdown(cached);
                    } else {
                        translationCol.textContent = '…';
                    }

                    translationCols.push(translationCol);
                    column.appendChild(row);
                });

                if (sourceLanguage !== targetLanguage && !cached) {
                    translateText(text, targetLanguage, sourceLanguage).then(translated => {
                        if (!translated) {
                            translationCols.forEach(col => {
                                col.textContent = 'Translation unavailable.';
                            });
                            return;
                        }
                        entry.translations[translationKey] = translated;
                        saveHistory();
                        translationCols.forEach(col => {
                            col.innerHTML = renderMarkdown(translated);
                        });
                    });
                }
            });
            if (shouldSaveHistory) {
                saveHistory();
            }
            scrollTranscriptsToBottom();
        }

        function addChatEntry(message, speaker) {
            const trimmed = (message || '').trim();
            if (!trimmed) return;
            const sourceLanguage = speaker === 'local' ? settings.localLanguage : settings.peerLanguage;
            const targetLanguage = speaker === 'local' ? settings.peerLanguage : settings.localLanguage;
            chatHistory.push({
                id: createEntryId(),
                message: trimmed,
                speaker,
                ts: Date.now(),
                translations: {},
                sourceLanguage,
                targetLanguage
            });
            saveHistory();
            renderChat();
            scrollTranscriptsToBottom();
            speakIfEnabled(trimmed, speaker);
        }

        function handleSubmit(input, speaker) {
            const value = input.value || '';
            if (!value.trim()) return;
            clearTypingTimer();
            settings.activeSpeaker = speaker;
            updateSpeakerIndicator();
            saveSettings();
            addChatEntry(value, speaker);
            input.value = '';
            flipActiveSpeaker();
        }

        function handleTyping(input, speaker) {
            settings.activeSpeaker = speaker;
            updateSpeakerIndicator();
            saveSettings();
            scheduleAutoSubmit(input, speaker);
        }

        function updatePeerTalkState(isListening) {
            peerListening = isListening;
            if (!peerTalk) return;
            peerTalk.dataset.listening = isListening ? 'true' : 'false';
            peerTalk.setAttribute('aria-pressed', isListening ? 'true' : 'false');
            const icon = peerTalk.querySelector('.material-symbols-outlined');
            if (icon) {
                icon.textContent = isListening ? 'stop_circle' : 'mic';
            }
        }

        function initPeerRecognizer() {
            if (peerRecognizer || !peerTalk) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                peerTalk.disabled = true;
                peerTalk.setAttribute('aria-label', 'Voice input not supported');
                return;
            }
            peerRecognizer = new SpeechRecognition();
            peerRecognizer.interimResults = false;
            peerRecognizer.maxAlternatives = 1;
            peerRecognizer.continuous = false;
            peerRecognizer.addEventListener('start', () => updatePeerTalkState(true));
            peerRecognizer.addEventListener('end', () => updatePeerTalkState(false));
            peerRecognizer.addEventListener('error', () => updatePeerTalkState(false));
            peerRecognizer.addEventListener('result', event => {
                const transcript = Array.from(event.results || [])
                    .map(result => result?.[0]?.transcript)
                    .filter(Boolean)
                    .join(' ')
                    .trim();
                if (!transcript) return;
                settings.activeSpeaker = 'peer';
                updateSpeakerIndicator();
                saveSettings();
                addChatEntry(transcript, 'peer');
                flipActiveSpeaker();
            });
        }

        function exportChat() {
            const payload = {
                history: chatHistory,
                settings,
                styles,
                background
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'tabletop-chat.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function importChat(file) {
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const payload = JSON.parse(reader.result);
                    if (Array.isArray(payload?.history)) {
                        chatHistory = payload.history;
                        saveHistory();
                    }
                    if (payload?.settings) {
                        settings = { ...DEFAULT_SETTINGS, ...payload.settings };
                        saveSettings();
                    }
                    if (payload?.styles) {
                        styles = { ...DEFAULT_STYLES, ...payload.styles };
                        saveStyles();
                    }
                    if (payload?.background) {
                        background = { ...DEFAULT_BACKGROUND, ...payload.background };
                        saveBackground();
                    }
                    applyStyles();
                    applyBackground();
                    updateControls();
                    renderChat();
                } catch (_) {}
            };
            reader.readAsText(file);
        }

        function clearChat() {
            chatHistory = [];
            saveHistory();
            renderChat();
        }

        function updateTtsToggle(button, enabled) {
            if (!button) return;
            button.dataset.enabled = enabled ? 'true' : 'false';
            const icon = button.querySelector('.material-symbols-outlined');
            if (icon) {
                icon.textContent = enabled ? 'volume_up' : 'volume_off';
            }
        }

        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = speechSynthesis.getVoices().slice().sort((a, b) => a.name.localeCompare(b.name));
            updateVoiceSelectors();
        }

        function updateVoiceSelectors() {
            if (!localVoiceSelect || !peerVoiceSelect) return;
            const defaultOption = '<option value="">Default voice</option>';
            localVoiceSelect.innerHTML = defaultOption;
            peerVoiceSelect.innerHTML = defaultOption;
            const localCandidates = filterVoicesByLanguage(settings.localLanguage);
            const peerCandidates = filterVoicesByLanguage(settings.peerLanguage);
            populateVoiceOptions(localVoiceSelect, localCandidates);
            populateVoiceOptions(peerVoiceSelect, peerCandidates);
            if (settings.localVoice && !localCandidates.some(voice => voice.name === settings.localVoice)) {
                settings.localVoice = '';
            }
            if (settings.peerVoice && !peerCandidates.some(voice => voice.name === settings.peerVoice)) {
                settings.peerVoice = '';
            }
            localVoiceSelect.value = settings.localVoice || '';
            peerVoiceSelect.value = settings.peerVoice || '';
            saveSettings();
        }

        function filterVoicesByLanguage(languageCode) {
            const prefix = (LANGUAGE_PREFIXES[languageCode] || languageCode || '').toLowerCase();
            if (!prefix) return [];
            return availableVoices.filter(voice => (voice.lang || '').toLowerCase().startsWith(prefix));
        }

        function guessVoiceGender(voice) {
            const name = (voice.name || '').toLowerCase();
            if (/(female|woman|girl|zira|susan|kate|samantha|victoria|karen|moira|tessa|veena|aria|jenny|olivia|emily|emma|amy|linda|zoe|serena|luna)/.test(name)) {
                return 'female';
            }
            if (/(male|man|boy|david|mark|alex|daniel|tom|liam|guy|fred|jorge|kiko|matthew|michael|ryan|sean|george|paul|jorge)/.test(name)) {
                return 'male';
            }
            return 'neutral';
        }

        function populateVoiceOptions(selectEl, voices) {
            const groups = {
                female: [],
                male: [],
                neutral: []
            };
            voices.forEach(voice => {
                groups[guessVoiceGender(voice)].push(voice);
            });
            const labels = {
                female: 'Female',
                male: 'Male',
                neutral: 'Neutral'
            };
            ['female', 'male', 'neutral'].forEach(group => {
                groups[group].forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang}, ${labels[group]})`;
                    selectEl.appendChild(option);
                });
            });
        }

        function speakIfEnabled(message, speaker) {
            const enabled = speaker === 'local' ? settings.ttsEnabledLocal : settings.ttsEnabledPeer;
            if (!enabled || !('speechSynthesis' in window)) return;
            const receiverLanguage = speaker === 'local' ? settings.peerLanguage : settings.localLanguage;
            const sourceLanguage = speaker === 'local' ? settings.localLanguage : settings.peerLanguage;
            const voiceName = speaker === 'local' ? settings.peerVoice : settings.localVoice;
            const speak = text => {
                const utterance = new SpeechSynthesisUtterance(text);
                if (receiverLanguage) {
                    utterance.lang = receiverLanguage;
                }
                if (voiceName) {
                    const voice = availableVoices.find(item => item.name === voiceName);
                    if (voice) utterance.voice = voice;
                }
                speechSynthesis.speak(utterance);
            };
            if (!receiverLanguage || receiverLanguage === sourceLanguage) {
                speak(message);
                return;
            }
            translateText(message, receiverLanguage, sourceLanguage).then(translated => {
                if (translated) {
                    speak(translated);
                } else {
                    speak(message);
                }
            });
        }

        function deleteEntryById(entryId) {
            const next = chatHistory.filter(entry => entry.id !== entryId);
            if (next.length === chatHistory.length) return;
            chatHistory = next;
            saveHistory();
            renderChat();
        }

        function restoreGearPosition() {
            const stored = readStorage('tabletop_chat_gear_position');
            if (!stored) {
                positionGearDefault();
                return;
            }
            try {
                const { left, top } = JSON.parse(stored);
                if (Number.isFinite(left) && Number.isFinite(top)) {
                    gearFab.style.left = `${left}px`;
                    gearFab.style.top = `${top}px`;
                    gearFab.style.right = 'auto';
                    gearFab.style.bottom = 'auto';
                    gearPositionLocked = true;
                    return;
                }
            } catch (_) {}
            positionGearDefault();
        }

        function positionGearDefault() {
            if (!gearFab || !speakerToggle) return;
            const anchorRect = speakerToggle.getBoundingClientRect();
            const fabRect = gearFab.getBoundingClientRect();
            const desiredLeft = anchorRect.right + 12;
            const desiredTop = anchorRect.top + (anchorRect.height / 2) - (fabRect.height / 2);
            const clampedLeft = Math.min(window.innerWidth - fabRect.width - 8, Math.max(8, desiredLeft));
            const clampedTop = Math.min(window.innerHeight - fabRect.height - 8, Math.max(8, desiredTop));
            gearFab.style.left = `${clampedLeft}px`;
            gearFab.style.top = `${clampedTop}px`;
            gearFab.style.right = 'auto';
            gearFab.style.bottom = 'auto';
        }

        function enableGearDrag() {
            if (!gearFab) return;
            let isDragging = false;
            let offsetX = 0;
            let offsetY = 0;
            let hasMoved = false;
            let startX = 0;
            let startY = 0;
            const onMove = event => {
                if (!isDragging) return;
                if (!hasMoved) {
                    if (Math.hypot(event.clientX - startX, event.clientY - startY) <= 4) {
                        return;
                    }
                    hasMoved = true;
                }
                const x = event.clientX - offsetX;
                const y = event.clientY - offsetY;
                gearFab.style.left = `${Math.max(8, x)}px`;
                gearFab.style.top = `${Math.max(8, y)}px`;
                gearFab.style.right = 'auto';
                gearFab.style.bottom = 'auto';
            };
            const onUp = () => {
                if (!isDragging) return;
                isDragging = false;
                gearFab.classList.remove('dragging');
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('pointerup', onUp);
                if (hasMoved) {
                    writeStorage('tabletop_chat_gear_position', JSON.stringify({
                        left: gearFab.offsetLeft,
                        top: gearFab.offsetTop
                    }));
                    gearPositionLocked = true;
                    gearWasDragged = true;
                }
            };
            gearFab.addEventListener('pointerdown', event => {
                if (event.button !== 0) return;
                isDragging = true;
                hasMoved = false;
                gearWasDragged = false;
                gearFab.classList.add('dragging');
                const rect = gearFab.getBoundingClientRect();
                offsetX = event.clientX - rect.left;
                offsetY = event.clientY - rect.top;
                startX = event.clientX;
                startY = event.clientY;
                document.addEventListener('pointermove', onMove);
                document.addEventListener('pointerup', onUp);
            });
        }

        settings = loadSettings();
        styles = loadStyles();
        background = loadBackground();
        chatHistory = loadHistory();
        applyStyles();
        applyBackground();
        restoreGearPosition();
        enableGearDrag();
        window.addEventListener('resize', () => {
            if (!gearPositionLocked) {
                positionGearDefault();
            }
        });
        if ('speechSynthesis' in window) {
            loadVoices();
            speechSynthesis.addEventListener('voiceschanged', loadVoices);
        }
        updateControls();
        renderChat();

        speakerToggle.addEventListener('click', () => {
            settings.activeSpeaker = settings.activeSpeaker === 'local' ? 'peer' : 'local';
            updateSpeakerIndicator();
            saveSettings();
        });

        gearFab.addEventListener('click', () => {
            if (gearWasDragged) {
                gearWasDragged = false;
                return;
            }
            toggleModal(true);
        });
        closeControls.addEventListener('click', () => toggleModal(false));
        controlsModal.addEventListener('click', event => {
            if (event.target === controlsModal) toggleModal(false);
        });

        localSend.addEventListener('click', () => handleSubmit(localInput, 'local'));
        localTtsToggle.addEventListener('click', () => {
            settings.ttsEnabledLocal = !settings.ttsEnabledLocal;
            updateTtsToggle(localTtsToggle, settings.ttsEnabledLocal);
            saveSettings();
        });
        peerTtsToggle.addEventListener('click', () => {
            settings.ttsEnabledPeer = !settings.ttsEnabledPeer;
            updateTtsToggle(peerTtsToggle, settings.ttsEnabledPeer);
            saveSettings();
        });

        localInput.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                handleSubmit(localInput, 'local');
            }
        });

        localInput.addEventListener('input', () => handleTyping(localInput, 'local'));

        initPeerRecognizer();
        if (peerTalk) {
            peerTalk.addEventListener('click', () => {
                if (!peerRecognizer) return;
                if (peerListening) {
                    peerRecognizer.stop();
                    return;
                }
                peerRecognizer.lang = settings.peerLanguage || 'en';
                peerRecognizer.start();
            });
        }

        peerLanguageSelect.addEventListener('change', () => {
            settings.peerLanguage = peerLanguageSelect.value;
            saveSettings();
            updateVoiceSelectors();
            renderChat();
        });
        localLanguageSelect.addEventListener('change', () => {
            settings.localLanguage = localLanguageSelect.value;
            saveSettings();
            updateVoiceSelectors();
            renderChat();
        });

        typingPauseInput.addEventListener('change', () => {
            const value = Number(typingPauseInput.value);
            if (Number.isFinite(value) && value > 0) {
                settings.typingPauseMs = Math.min(10000, Math.max(1000, Math.round(value * 1000)));
                saveSettings();
            }
        });

        localVoiceSelect.addEventListener('change', () => {
            settings.localVoice = localVoiceSelect.value;
            saveSettings();
        });
        peerVoiceSelect.addEventListener('change', () => {
            settings.peerVoice = peerVoiceSelect.value;
            saveSettings();
        });

        styleReset.addEventListener('click', () => {
            styles = { ...DEFAULT_STYLES };
            background = { ...DEFAULT_BACKGROUND };
            applyStyles();
            applyBackground();
            updateControls();
            saveStyles();
            saveBackground();
        });

        styleSave.addEventListener('click', () => {
            const clampFontSize = (value, fallback) => {
                const numberValue = Number(value);
                if (!Number.isFinite(numberValue)) return fallback;
                return Math.min(48, Math.max(10, Math.round(numberValue)));
            };
            styles = {
                localBg: styleLocalBg.value,
                localText: styleLocalText.value,
                peerBg: stylePeerBg.value,
                peerText: stylePeerText.value,
                localFontSize: clampFontSize(styleLocalFontSize.value, DEFAULT_STYLES.localFontSize),
                peerFontSize: clampFontSize(stylePeerFontSize.value, DEFAULT_STYLES.peerFontSize)
            };
            background = {
                localColor: styleLocalBgPanel.value,
                peerColor: stylePeerBgPanel.value
            };
            applyStyles();
            applyBackground();
            updateControls();
            saveStyles();
            saveBackground();
        });

        [peerTranscript, localTranscript].forEach(column => {
            if (!column) return;
            column.addEventListener('click', event => {
                const target = event.target;
                if (!(target instanceof HTMLElement)) return;
                if (target.classList.contains('bubble-delete')) {
                    deleteEntryById(target.dataset.entryId);
                }
            });
        });

        drawerImport.addEventListener('click', () => drawerImportInput.click());
        drawerImportInput.addEventListener('change', event => {
            const file = event.target.files?.[0];
            if (file) {
                importChat(file);
                drawerImportInput.value = '';
            }
        });

        drawerExport.addEventListener('click', () => exportChat());
        drawerClear.addEventListener('click', () => {
            exportChat();
            clearChat();
        });
    </script>

    function isJamoV(j){return HG.JUNG.indexOf(j)>-1}
    function hgSyll(st){
        if(st.cho===null)return st.jung!==null?HG.JUNG[st.jung]:'';
        if(st.jung===null)return HG.CHO[st.cho];
        return String.fromCharCode(0xAC00+(st.cho*21+st.jung)*28+(st.jong||0));

        var out='';
        if(isJamoV(j)){
            var vi=HG.JUNG.indexOf(j);
            if(st.cho!==null&&st.jung!==null&&st.jong){       // split final: previous syllable keeps first, new syllable starts
                var jongCh=HG.JONG[st.jong],moved,keep;
                if(HG.JONG_SPLIT[jongCh]){keep=HG.JONG_SPLIT[jongCh][0];moved=HG.JONG_SPLIT[jongCh][1]}
                else{keep='';moved=jongCh}
                st.jong=HG.JONG.indexOf(keep||'');
                out+=hgSyll(st);
                return{commit:out,state:{cho:HG.CHO.indexOf(moved),jung:vi,jong:0}};
            }
            if(st.cho!==null&&st.jung!==null){                 // vowel combo or new syllable
                var combo=HG.JUNG_COMBO[HG.JUNG[st.jung]+j];
                if(combo){st.jung=HG.JUNG.indexOf(combo);return{commit:'',state:st}}
                out+=hgSyll(st);
                return{commit:out,state:{cho:null,jung:vi,jong:0}};
            }
            if(st.cho!==null){st.jung=vi;return{commit:'',state:st}}
            if(st.jung!==null){                                 // standalone vowel combo
                var c2=HG.JUNG_COMBO[HG.JUNG[st.jung]+j];
                if(c2){st.jung=HG.JUNG.indexOf(c2);return{commit:'',state:st}}
                out+=hgSyll(st);return{commit:out,state:{cho:null,jung:vi,jong:0}};
            }
            return{commit:'',state:{cho:null,jung:vi,jong:0}};
        }
        // consonant
        var ci=HG.CHO.indexOf(j),ji=HG.JONG.indexOf(j);
        if(st.cho!==null&&st.jung!==null){
            if(st.jong){
                var cmb=HG.JONG_COMBO[HG.JONG[st.jong]+j];
                if(cmb){st.jong=HG.JONG.indexOf(cmb);return{commit:'',state:st}}

            out+=hgSyll(st);return{commit:out,state:{cho:ci>-1?ci:null,jung:null,jong:0}};

    function pathToKeys(pts,centers){
        var seq=[],last=null;
        pts.forEach(function(p){
            var best=null,bd=1e9;
            centers.forEach(function(c){
                var d=Math.hypot(c.x-p.x,c.y-p.y);
                if(d<bd){bd=d;best=c}
            });
            if(best&&bd<best.r*1.15){
                if(!last||last!==best.k){seq.push(best.k);last=best.k}
            }
        });
        // collapse immediate repeats
        return seq.filter(function(k,i){return i===0||k!==seq[i-1]});
    }
    function swypeCandidates(seq,lang){
        if(!seq.length)return[];
        var list=SWYPE_WORDS[lang];
        var joined=seq.join('');
        if(!list)return[joined];
        var first=seq[0],last=seq[seq.length-1],setSeq={};seq.forEach(function(c){setSeq[c]=1});
        var scored=[];
        list.forEach(function(w){
            if(w[0]!==first)return;
            if(w[w.length-1]!==last)return;
            var i=0,ok=true;
            for(var c=0;c<w.length;c++){                 // word letters must appear in path order
                var idx=seq.indexOf(w[c],i);
                if(idx<0){ok=false;break}
                i=idx;
            }
            if(!ok)return;
            var extra=0;seq.forEach(function(c){if(w.indexOf(c)<0)extra++});
            scored.push({w:w,s:Math.abs(w.length-seq.length)+extra*0.6});
        });
        scored.sort(function(a,b){return a.s-b.s});
        var out=scored.slice(0,7).map(function(x){return x.w});
        if(out.indexOf(joined)<0)out.push(joined);      // literal path always available
        return out;
    }

/* ================= GAP B · language resolution: detection + normalization =================
       Law (from TalkBridge): in 'fixed' mode everything a person produces is shown and sent in
       THEIR OWN language regardless of what they actually typed or spoke — the partner's
       experience never changes because someone code-switched. 'auto' lets the produced language
       become the source. Hooked BEFORE the baseline's addChatEntry; nothing baseline is replaced. */
    var SCRIPT_TESTS=[
        {lang:'th',re:/[\u0E00-\u0E7F]/},{lang:'ja',re:/[\u3040-\u30FF]/},
        {lang:'ko',re:/[\uAC00-\uD7AF\u1100-\u11FF]/},{lang:'zh',re:/[\u4E00-\u9FFF]/},
        {lang:'ar',re:/[\u0600-\u06FF]/},{lang:'ru',re:/[\u0400-\u04FF]/},

        var s=String(text||''),letters=s.replace(/[^\p{L}]/gu,'');

            var t=SCRIPT_TESTS[i];
            var hits=(letters.match(new RegExp(t.re.source,'gu'))||[]).length;
            if(hits/letters.length>0.2)return t.lang;
        }
        return null;
    }

       Assets already live in the repo alongside this file. */
    var FT_DIR=new URL('fastType/',location.href).href,
        FT_WRAPPER=FT_DIR+'fasttext-wrapper.umd.js',

        FT_WASM=FT_DIR+'core/fasttext.wasm';

    function loadFastText(){
        if(_ft||_ftFailed)return Promise.resolve(_ft);
        if(_ftPromise)return _ftPromise;
        _ftPromise=new Promise(function(resolve){
            function fail(stage,why){_ftFailed=true;diag('lang model unavailable at '+stage+': '+(why&&why.message||why),true);resolve(null)}
            try{
                var cfg={locateFile:function(p){var n=String(p||'').split('/').pop();return /\.wasm$/i.test(n)?FT_WASM:FT_DIR+n}};
                window.Module=cfg;window.FastTextModule=cfg;
                var s=document.createElement('script');
                s.src=FT_WRAPPER;
                s.onerror=function(){fail('wrapper','script failed to load')};
                s.onload=function(){
                    try{
                        var ft=new window.FastText();
                        ft.loadModel(FT_MODEL).then(function(){_ft=ft;diag('language model ready (lid.176)');resolve(ft)})
                          .catch(function(e){fail('model',e)});
                    }catch(e){fail('init',e)}
                };

            }catch(e){fail('setup',e)}
        });

    var FT_MIN_CHARS=8;   // below this a model answer is noise; the room language is safer
    function ftDetect(text){
        return loadFastText().then(function(ft){
            if(!ft)return null;
            var s=String(text||'').trim();
            if(s.replace(/[^\p{L}]/gu,'').length<FT_MIN_CHARS)return null;
            try{
                var code=ft.detect(s);
                if(!code)return null;
                code=String(code).toLowerCase().split(/[-_]/)[0];
                return ftAllowed(code)?code:null;
            }catch(e){diag('detect error: '+e.message,true);return null}
        });

    function composingText(side){

    function paintCands(side){
        var bar=kb[side].querySelector('.duck-cands');

        bar.style.display='flex';
        bar.innerHTML=cands[side].map(function(c,i){return '<button type="button" class="duck-cand'+(i===candIdx[side]?' on':'')+'" data-i="'+i+'">'+String(c).replace(/[&<>]/g,'')+'</button>'}).join('');

        b.addEventListener('pointerdown',function(e){e.preventDefault()});

    });
    }
    function pickCand(side,i){
        var c=cands[side][i];if(c==null)return;
        var cur=composingText(side).length;
        comp[side]={raw:'',kana:'',ko:null};
        if(cur)replaceComposing(side,cur,c+(comp[side].swype?'':''));else insertAt(side,c);
        cands[side]=[];candIdx[side]=-1;paintCands(side);
        diag('candidate: '+c);
    }
    function flushComposition(side){
        var c=comp[side],t=composingText(side);
        if(!t){comp[side]={raw:'',kana:'',ko:null};return}
        var final=c.ko?hgSyll(c.ko):romajiToKana(c.raw);
        replaceComposing(side,t.length,final);
        comp[side]={raw:'',kana:'',ko:null};cands[side]=[];candIdx[side]=-1;
        if(kb[side])paintCands(side);
    }
    function paintComposing(side,prevLen){
        var t=composingText(side);

    }
    function press(side,k){
        var lang=langOf(side),ime=numMode[side]?null:(lang==='ko'?'ko':(lang==='ja'?'ja':null));
        if(k==='SHIFT'){shifted[side]=!shifted[side];renderKeys(side);return}
        if(k==='NUM'){flushComposition(side);numMode[side]=!numMode[side];shifted[side]=false;renderKeys(side);return}
        if(k==='MIC'){toggleSTT(side);return}
        if(k==='CLOSE'){flushComposition(side);closeKb(side,'closed');return}
        if(k==='ENTER'){
            if(cands[side].length&&candIdx[side]>=0){pickCand(side,candIdx[side]);return}
            flushComposition(side);send(side);return;
        }
        if(k==='BKSP'){
            var prev=composingText(side).length;
            if(ime==='ko'&&comp[side].ko){
                var r=koBackspace(comp[side].ko);
                comp[side].ko=(r.state.cho===null&&r.state.jung===null)?null:r.state;
                paintComposing(side,prev);return;
            }
            if(ime==='ja'&&comp[side].raw){
                comp[side].raw=comp[side].raw.slice(0,-1);
                comp[side].kana=romajiToKana(comp[side].raw.slice(0,comp[side].raw.length-romajiTail(comp[side].raw).length));
                cands[side]=[];candIdx[side]=-1;paintCands(side);paintComposing(side,prev);return;
            }
            backspaceAt(side);return;
        }
        if(k===' '){
            if(ime==='ja'&&(comp[side].raw||comp[side].kana)){convertJa(side);return}
            flushComposition(side);insertAt(side,' ');return;
        }
        var prevLen=composingText(side).length;
        if(ime==='ko'){
            if(!comp[side].ko)comp[side].ko=newKoState();
            var res=koInput(comp[side].ko,k);
            if(res.commit){ // committed syllables leave composition and become real text
                replaceComposing(side,prevLen,res.commit);prevLen=0;
            }
            comp[side].ko=res.state;
            paintComposing(side,prevLen);
            if(shifted[side]){shifted[side]=false;renderKeys(side)}
            return;
        }
        if(ime==='ja'&&/^[a-zA-Z.,-]$/.test(k)){
            comp[side].raw+=k.toLowerCase();
            var tail=romajiTail(comp[side].raw);
            comp[side].kana=romajiToKana(comp[side].raw.slice(0,comp[side].raw.length-tail.length));
            cands[side]=[];candIdx[side]=-1;paintCands(side);
            paintComposing(side,prevLen);
            if(shifted[side]){shifted[side]=false;renderKeys(side)}
            return;
        }
        flushComposition(side);
        insertAt(side,k);
        if(shifted[side]&&String(k).length===1){shifted[side]=false;renderKeys(side)}
    }
    function convertJa(side){
        var kana=romajiToKana(comp[side].raw);

        if(cands[side].length){candIdx[side]=(candIdx[side]+1)%cands[side].length;paintCands(side);return}
        diag('ja: converting "'+kana+'"');
        jaCandidates(kana,function(list,err){
            if(!list||!list.length){cands[side]=[kana];candIdx[side]=0;paintCands(side);diag('ja: kanji service unavailable'+(err?' ('+err+')':''),true);return}
            if(list.indexOf(kana)<0)list.push(kana);
            cands[side]=list;candIdx[side]=0;paintCands(side);
        });
    }

    /* ---- speech to text, per side, into the input ---- */
    var rec={local:null,peer:null},recOn={local:false,peer:false};
    function micBtn(side){return kb[side]&&kb[side].querySelector('.duck-key.mic')}
    function setMic(side,on){
        recOn[side]=on;
        var b=micBtn(side);if(b)b.dataset.on=on?'true':'false';
        var c=micCtl[side];
        if(c){c.dataset.on=on?'true':'false';var ic=c.querySelector('.material-symbols-outlined');if(ic)ic.textContent=on?'stop_circle':'mic'}
    }
    var pauseTimer={local:null,peer:null},STT_PAUSE_MS=1100;
    function newRecognizer(side){
        var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        var r=new SR();
        r.lang=langOf(side);r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
        var settled='';                                    // scoped to THIS instance only — never leaks across restarts
        r.onstart=function(){setMic(side,true)};
        r.onerror=function(e){
            if(e.error==='no-speech'||e.error==='aborted')return;   // onend handles restart/cleanup
            recOn[side]=false;clearTimeout(pauseTimer[side]);setMic(side,false);
            diag('speech error on '+side+': '+e.error,true);
        };
        r.onresult=function(ev){
            var interim='';
            for(var i=0;i<ev.results.length;i++){          // continuous=false → this instance's results always start at 0
                var t=ev.results[i][0].transcript;
                if(ev.results[i].isFinal)settled+=t;else interim+=t;
            }
            var txt=(settled+interim).trim();
            insertAtEnd(side,txt);
            armPause(side);
        };
        r.onend=function(){
            clearTimeout(pauseTimer[side]);
            if(!recOn[side]){setMic(side,false);if(side==='peer')peerRecognizerLang=r.lang;diag('stopped listening on '+side);return}
            var txt=(inputs[side].value||'').trim();
            if(txt){diag('utterance ended on '+side+' → auto-send');send(side)}
            rec[side]=newRecognizer(side);                 // fresh instance = fresh result buffer, every time
            try{rec[side].start()}catch(e){diag('restart failed on '+side+': '+e.message,true);recOn[side]=false;setMic(side,false)}
        };

    }
    function armPause(side){
        clearTimeout(pauseTimer[side]);
        pauseTimer[side]=setTimeout(function(){
            var r=rec[side];if(r){try{r.stop()}catch(e){}}   // graceful stop → fires final onresult, then onend auto-sends
        },STT_PAUSE_MS);
    }
    function insertAtEnd(side,text){                        // whole-utterance replace: sets value directly, no caret math needed
        var ta=inputs[side];ta.value=text;
        try{ta.setSelectionRange(text.length,text.length)}catch(e){}
        ta.scrollLeft=ta.scrollWidth;
        ta.dispatchEvent(new Event('input'));
    }
    function toggleSTT(side){
        var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        if(!SR){diag('speech recognition not supported in this browser',true);return}
