<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OpenClaw Session Manager</title>
<style>
:root{--bg:#0b0b0f;--p:#13131a;--p2:#1b1b24;--ln:#2b2b34;--tx:#e4e4e7;--mu:#8b8b97;--am:#f59e0b;--gr:#22c55e;--rd:#ef4444;--bl:#3b82f6;--yl:#facc15}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{height:100%;display:flex}#sidebar{width:370px;min-width:290px;background:var(--p);border-right:1px solid var(--ln);display:flex;flex-direction:column}#sidebar.collapsed{display:none}.bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--ln)}.sidebarTop{padding-left:52px}.mainbar{transition:padding .12s}#app.sidebar-closed .mainbar{padding-left:52px}.grow{flex:1}.brand{font-weight:750}.version{font-size:9px;color:#70707b;font-weight:650;margin-left:5px}.btn{border:1px solid #383842;background:var(--p2);color:var(--tx);border-radius:7px;padding:7px 9px}.btn:hover{background:#25252f}.btn.primary{background:var(--am);border-color:var(--am);color:#111;font-weight:750}.btn:disabled{opacity:.45;cursor:not-allowed}#menu{position:fixed;top:8px;left:8px;z-index:1000;width:36px;height:36px;padding:0;border:1px solid #383842;background:#15151c;color:var(--am);border-radius:7px;font-size:21px;line-height:34px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--rd)}#dot.connecting{background:var(--am)}#dot.connected{background:var(--gr)}#searchWrap{padding:10px;border-bottom:1px solid var(--ln)}.input{width:100%;border:1px solid #393943;background:#0e0e14;color:#fff;border-radius:7px;padding:9px 10px;outline:none}.input:focus{border-color:#806019}#stats{font-size:10px;color:var(--mu);margin-top:6px}.legend{display:flex;gap:11px;align-items:center;margin-top:6px;font-size:9px;color:#6f6f7a}.legend span{display:flex;align-items:center;gap:4px}.legendDot,.sessionState{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}.legendDot.ready,.sessionState.ready{background:var(--bl)}.legendDot.working,.sessionState.working{background:var(--gr)}.legendDot.errorState,.sessionState.errorState{background:var(--yl)}#sessionList{flex:1;overflow:auto}.session{padding:12px 13px;border-bottom:1px solid var(--ln);border-left:3px solid transparent;cursor:pointer}.session:hover{background:#17171f}.session.active{border-left-color:var(--am);background:#1b180f}.sessionHead{display:flex;align-items:center;gap:8px;min-width:0}.labelWrap{position:relative;display:flex;align-items:center;gap:5px;min-width:0;flex:1}.label{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.renameInput{display:none;width:100%;border:1px solid var(--am);background:#0e0e14;color:#fff;border-radius:5px;padding:4px 7px;font-weight:700;outline:none}.labelWrap.editing .label,.labelWrap.editing .renameBtn{display:none}.labelWrap.editing .renameInput{display:block}.renameBtn{border:0;background:transparent;color:#6f6f7a;padding:0 3px;opacity:0;font-size:11px}.session:hover .renameBtn,.session.active .renameBtn{opacity:1}.renameBtn:hover{color:var(--am)}.key{font:10px ui-monospace,Consolas,monospace;color:#5f5f69;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.meta,.preview{font-size:10px;color:var(--mu);margin-top:4px}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:35px;text-align:center;color:var(--mu)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}#chatTitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#chatInfo{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.titlewrap{min-width:0;flex:1}#pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#2a1717;color:#fca5a5}#pill.connected{background:#10261a;color:#86efac}#pill.connecting{background:#2a210f;color:#fbbf24}.workPill{display:none;align-items:center;gap:6px;font-size:10px;padding:4px 8px;border-radius:999px;border:1px solid #34343d;background:#121219;color:#d4d4d8}.workPill.show{display:inline-flex}.workPill:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--bl)}.workPill.working:before{background:var(--gr);box-shadow:0 0 0 3px #22c55e22;animation:pulse 1.2s ease-in-out infinite}.workPill.errorState:before{background:var(--yl)}@keyframes pulse{50%{opacity:.35}}
#error{display:none;padding:10px 13px;background:#2b1518;color:#fecaca;border-bottom:1px solid #632b31;font-size:11px;white-space:pre-wrap;word-break:break-word}#error.show{display:block}#emptyState{flex:1;display:grid;place-items:center;text-align:center;color:var(--mu)}#chat{display:none;flex:1;min-height:0;flex-direction:column}#chat.active{display:flex}#messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:min(85%,900px);padding:12px 14px;border-radius:9px;border:1px solid var(--ln);white-space:pre-wrap;word-break:break-word}.msg.user{align-self:flex-end;background:#1c1a1c;border-left:3px solid var(--am)}.msg.assistant{align-self:flex-start;background:var(--p);border-left:3px solid var(--gr)}.msg.system{align-self:center;background:#121923}.sender{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}.user .sender{color:var(--am)}.assistant .sender{color:var(--gr)}.time{font-size:9px;color:#5c5c66;margin-top:7px;text-align:right}.attHistory{font-size:10px;color:#bbb;margin-top:7px}.streaming{outline:1px solid #274d37}
.msgHead{display:flex;align-items:center;gap:8px;margin-bottom:5px}.msgHead .sender{margin-bottom:0}.copyMsg{margin-left:auto;border:1px solid var(--ln);background:transparent;color:var(--mu);border-radius:5px;padding:2px 6px;font-size:9px}.copyMsg:hover{color:var(--tx);background:var(--p2)}.msgBody{white-space:normal}.msgBody p{margin:.35em 0}.msgBody h1,.msgBody h2,.msgBody h3{margin:.55em 0 .3em;line-height:1.25}.msgBody h1{font-size:1.25em}.msgBody h2{font-size:1.15em}.msgBody h3{font-size:1.05em}.msgBody pre{white-space:pre;overflow:auto;background:#09090d;border:1px solid var(--ln);border-radius:7px;padding:9px}.msgBody code{font-family:ui-monospace,Consolas,monospace;background:#09090d;border:1px solid var(--ln);border-radius:4px;padding:1px 4px}.msgBody pre code{border:0;padding:0}.msgBody ul{margin:.35em 0;padding-left:1.35em}.msgBody a{color:var(--bl)}.headerAction{white-space:nowrap}.stopBtn{height:46px;min-width:62px;background:#34161a;border-color:#71333a;color:#fecaca}.stopBtn:hover{background:#451c22}
#typing{display:none;align-items:center;gap:7px;padding:8px 18px;border-top:1px solid var(--ln);font-size:11px;color:var(--mu)}#typing.show{display:flex}.spin{width:12px;height:12px;border:2px solid #3b3b44;border-top-color:var(--am);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}#composer{padding:10px 12px;background:var(--p);border-top:1px solid var(--ln)}#tray{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}.chip{display:flex;gap:6px;align-items:center;border:1px solid #454550;background:#1c1c25;border-radius:7px;padding:5px 7px;font-size:10px;max-width:280px}.chip span:first-of-type{white-space:nowrap;overflow:hidden;text-overflow:elmarkdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeFileName(name(state.current))+'.md';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Transcript downloaded','ok')}
async function shareTranscript(){if(!state.current)return;let md=transcriptMarkdown();try{if(navigator.share){await navigator.share({title:name(state.current),text:md});return}}catch(e){if(e?.name==='AbortError')return}await copyText(md);toast('Transcript copied for sharing','ok')}
function beginRename(k,row){let s=state.sessions.find(x=>x.key===k);if(!s||!row)return;if(!canRename()){showError('Rename requires operator.admin. This v2.2 client requests that scope; approve the browser device scope upgrade and reconnect.');toast('Rename requires operator.admin','err');return}let wrap=row.querySelector('.labelWrap'),input=row.querySelector('.renameInput');input.dataset.cancel='';input.value=s.label||name(s);wrap.classList.add('editing');input.focus();input.select()}
function cancelRename(row){let wrap=row?.querySelector('.labelWrap'),input=row?.querySelector('.renameInput');if(!wrap||!input)return;input.dataset.cancel='1';wrap.classList.remove('editing');setTimeout(()=>{input.dataset.cancel=''},0)}
function renameKey(e,k,row){if(e.key==='Enter'){e.preventDefault();saveRename(k,row)}else if(e.key==='Escape'){e.preventDefault();cancelRename(row);row.focus?.()}}
async function saveRename(k,row){let s=state.sessions.find(x=>x.key===k),wrap=row?.querySelector('.labelWrap'),input=row?.querySelector('.renameInput');if(!s||!wrap||!input||input.dataset.saving==='1')return;let l=input.value.trim();if(!l){toast('Session label cannot be empty','err');input.focus();return}if(l===(s.label||name(s))){wrap.classList.remove('editing');return}if(!canRename()){showError('Rename requires operator.admin. Approve the requested browser-device scope upgrade and reconnect.');toast('Rename requires operator.admin','err');input.focus();return}input.dataset.saving='1';input.disabled=true;try{await rpc('sessions.patch',{key:s.key,label:l},15000);s.label=l;let i=state.sessions.findIndex(x=>x.key===s.key);if(i>=0)state.sessions[i]={...state.sessions[i],label:l};if(state.current?.key===s.key)state.current={...state.current,label:l};header();renderSessions();clearError();toast('Session label saved to OpenClaw','ok');dbg('SESS','Label patched',{key:s.key,label:l})}catch(e){input.disabled=false;input.dataset.saving='';showError('Rename failed: '+e.message);toast('Rename failed: '+e.message,'err');dbg('ERROR','sessions.patch: '+e.message);input.focus();return}input.disabled=false;input.dataset.saving=''}
function settings(){$('modal').innerHTML=`<div class="modalbg"><div class="modal"><div class="mhead"><b>Connection & diagnostics</b><span class="grow"></span><button class="btn" id="sc">×</button></div><div class="mbody"><div class="field"><label>Gateway WebSocket URL</label><input id="su" class="input" value="${esc(state.settings.gatewayUrl)}"></div><div class="field"><label>Gateway token</label><input id="stok" class="input" type="password" value="${esc(token())}"><div class="help">Stored for this browser tab only. The old openclaw_token value remains a fallback.</div></div><div class="notice">${state.connected?`Connected · protocol ${esc(state.hello?.protocol||PV)} · scopes ${esc(state.scopes.join(', '))}`:'Not connected'}${state.identity?.deviceId?`<br>Device ${esc(state.identity.deviceId)}`:''}</div><label class="check"><input id="sd" type="checkbox" ${state.settings.debugEnabled?'checked':''}><span><b>Enable debug log</b><div class="help">Captures WS/RPC/chat/subscription/attachment/error traces. Tokens, signatures and attachment payloads are redacted.</div></span></label><label class="check"><input id="sdt" type="checkbox" ${state.settings.debugText?'checked':''} ${state.settings.debugEnabled?'':'disabled'}><span><b>Include message text in debug log</b><div class="help">Off by default.</div></span></label></div><div class="mfoot"><button class="btn" id="sr">Reconnect</button><button class="btn primary" id="ss">Save</button></div></div></div>`;let close=()=>$('modal').innerHTML='';$('sc').onclick=close;$('sd').onchange=e=>$('sdt').disabled=!e.target.checked;let apply=()=>{let u=$('su').value.trim();if(!/^wss?:\/\//i.test(u))throw Error('Gateway URL must start with ws:// or wss://');state.settings.gatewayUrl=u;state.settings.debugEnabled=$('sd').checked;state.settings.debugText=$('sdt').checked&&state.settings.debugEnabled;setToken($('stok').value);saveSettings();$('debugBtn').classList.toggle('hidden',!state.settings.debugEnabled);if(!state.settings.debugEnabled)closeDebug()};$('ss').onclick=()=>{try{apply();close();toast('Settings saved','ok')}catch(e){toast(e.message,'err')}};$('sr').onclick=()=>{try{apply();close();reconnect();toast('Reconnecting…')}catch(e){toast(e.message,'err')}}}
function openDebug(){if(!state.settings.debugEnabled)return;state.debugOpen=true;$('debugRoot').innerHTML=`<div id="debugPanel"><div class="bar"><b>Debug log</b><span style="font-size:10px;color:#777">secrets/payloads redacted</span><span class="grow"></span><button class="btn" id="dcopy">Copy</button><button class="btn" id="dclear">Clear</button><button class="btn" id="dclose">×</button></div><pre id="debugOut"></pre></div>`;$('debugOut').textContent=state.debug.join('\n');$('dcopy').onclick=async()=>{let t=state.debug.join('\n');try{await navigator.clipboard.writeText(t)}catch{let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Debug log copied','ok')};$('dclear').onclick=()=>{state.debug=[];$('debugOut').textContent=''};$('dclose').onclick=closeDebug}function closeDebug(){state.debugOpen=false;$('debugRoot').innerHTML=''}
function bind(){$('menu').onclick=toggleSidebar;$('settings').onclick=settings;$('debugBtn').onclick=openDebug;$('refresh').onclick=loadSessions;$('search').oninput=renderSessions;$('attach').onclick=()=>$('files').click();$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};$('send').onclick=send;$('stop').onclick=stopRun;$('downloadSession').onclick=downloadTranscript;$('shareSession').onclick=shareTranscript;$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('message').oninput=function(){this.style.height='46px';this.style.height=Math.min(this.scrollHeight,180)+'px'};$('message').onpaste=e=>{let f=[...(e.clipboardData?.files||[])];if(f.length)addFiles(f)};let depth=0,m=$('main');m.ondragenter=e=>{e.preventDefault();depth++;$('drop').classList.add('show')};m.ondragover=e=>e.preventDefault();m.ondragleave=e=>{e.preventDefault();depth=Math.max(0,depth-1);if(!depth)$('drop').classList.remove('show')};m.ondrop=e=>{e.preventDefault();depth=0;$('drop').classList.remove('show');if(e.dataTransfer?.files?.length)addFiles(e.dataTransfer.files)};$('debugBtn').classList.toggle('hidden',!state.settings.debugEnabled)}
async function init(){setSidebar(true);bind();updateComposer();updateWorkPill();try{await identity()}catch(e){showError(e.message);return}connect()}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!state.connected&&!state.connecting&&!state.pairing)connect()});window.addEventListener('beforeunload',()=>{state.manual=true;try{state.ws?.close(1000,'page unload')}catch{}});init();
})();
</script>
</body>
