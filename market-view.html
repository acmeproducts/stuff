order:0;border-radius:8px;background:transparent;color:var(--muted);padding:8px 12px;font-weight:760;white-space:nowrap}.tabs button.active{background:#18263d;color:var(--text)}.globalRange{height:42px;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;align-items:center;padding:5px 0}.globalRange button{min-width:0;border:1px solid var(--line);background:#111d31;color:var(--muted);border-radius:999px;padding:6px 4px;font-size:11px;font-weight:800}.globalRange button.active{background:#203b61;border-color:var(--accent);color:var(--text)}.viewport{height:calc(100vh - var(--head) - 148px);padding-top:8px;overflow:hidden}.section,.story{display:none}.section.active,.story.active{display:block;height:100%}.snapshot{height:100%;display:grid;gap:10px;grid-template-rows:auto minmax(0,1fr)}.hero{display:grid;grid-template-columns:.9fr 1.4fr;gap:10px}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:13px;min-width:0}.card h2,.card h3{margin:4px 0}.regime{display:flex;align-items:center;gap:14px}.gauge{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--warn) 180deg,#273850 0);position:relative;flex:none}.gauge:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#101b2d}.gauge strong{z-index:1;font-size:24px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:#1a2942;color:var(--text);padding:8px 11px;font-weight:780}.btn.primary{border:0;background:var(--accent);color:#07111e}.storyGrid{display:grid;gap:10px;height:100%;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr)}.storyCard{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;cursor:pointer;min-height:0}.storyCard:hover{border-color:var(--accent)}.row{display:flex;justify-content:space-between;gap:8px}.value{font-size:24px;font-weight:900}.chip,.badge{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:850;padding:4px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}.chip.good,.badge.good{color:#9af0bd;background:#12352b;border-color:#205943}.chip.bad,.badge.bad{color:#ffb7bc;background:#3b2229;border-color:#63313b}.chip.neutral,.badge.neutral{color:#f7d782;background:#342f23;border-color:#5b4e2c}.spark{width:100%;height:100%;min-height:62px;touch-action:none;cursor:crosshair}.meta{font-size:10px;color:var(--muted)}.macroGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:100%}.newsList,.libraryList,.logList{height:100%;display:grid;gap:6px;align-content:start}.newsRow,.libraryRow,.logRow{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:0}.newsRow{display:grid;grid-template-columns:1fr auto;gap:10px}.newsRow a{color:var(--text);text-decoration:none;font-weight:800}.newsMeta{font-size:10px;color:var(--muted);margin-top:3px}.analysisGrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:10px;height:100%}.analysisControls{display:grid;align-content:start;gap:9px}.field{display:grid;gap:4px}.field label{font-size:11px;color:var(--muted);font-weight:800}select,input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#091424;color:var(--text)}.chartBox{height:100%;min-height:0}.chart{width:100%;height:100%;touch-action:none}.providerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;height:100%;align-content:start}.provider dl{display:grid;grid-template-columns:1fr 1fr;gap:5px}.provider dt{color:var(--muted)}.provider dd{margin:0;text-align:right}.modal{position:fixed;z-index:100;inset:0;background:#02060ddd;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modalPanel{width:min(960px,100%);height:min(88vh,760px);background:#101b2d;border:1px solid var( <script>
'use strict';
const VERSION='3.9.0', DB='market-navigator-db', DBV=2; let db;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const H={'1d':{label:'1D',intraday:true,range:'1d',interval:'5m'},'5d':{label:'5D',intraday:true,range:'5d',interval:'30m'},'1mo':{label:'1M',days:30},'3mo':{label:'3M',days:90},'6mo':{label:'6M',days:180},ytd:{label:'YTD',ytd:true},'1y':{label:'1Y',days:365},'5y':{label:'5Y',days:1825},max:{label:'All',max:true}};
const META={spy:{symbol:'SPY',short:'SPY',name:'S&P 500 ETF',unit:'$',dec:2,role:'Broad equities',color:'#42d77d'},tenYear:{symbol:'^TNX',short:'10Y',name:'U.S. 10-Year Treasury Yield',suffix:'%',dec:2,role:'Cost of capital',color:'#a78bfa'},wti:{symbol:'CL=F',short:'WTI',name:'West Texas Intermediate crude oil',unit:'$',dec:2,role:'U.S. oil benchmark',color:'#fb7185'},cpi:{short:'CPI YoY',name:'Consumer Price Inflation',suffix:'%',dec:2,role:'Inflation',color:'#f97316'},fedFunds:{short:'Fed Funds',name:'Federal Funds Rate',suffix:'%',dec:2,role:'Policy rate',color:'#14b8a6'},twoYear:{short:'2Y',name:'U.S. 2-Year Treasury Yield',suffix:'%',dec:2,role:'Policy expectations',color:'#8b5cf6'},thirtyYear:{short:'30Y',name:'U.S. 30-Year Treasury Yield',suffix:'%',dec:2,role:'Long-term rates',color:'#6d28d9'}};
const NAV=[['now','Now'],['macro','Macro'],['news','News'],['analysis','Analysis'],['library','Analysis Library'],['providers','Providers'],['logs','Logs'],['about','About']];
const TABS={now:[['Snapshot','nowSnapshot'],['Regime Trend','nowTrend']],macro:[['Inflation','macroInflation'],['Rates','macroRates']],news:[['Latest','newsLatest'],['Geopolitics','newsGeo'],['Outlooks','newsOutlook']],analysis:[['Compare','analysisCompare'],['Correlations','analysisCorrelation']],library:[['Saved','librarySaved']],providers:[['Health','providersHealth']],logs:[['Activity','logsActivity']],about:[['About','aboutMain']]};
const state={section:'now',tab:'nowSnapshot',range:'3mo',series:{},meta:{},providers:{},news:[],analyses:[],logs:[],config:{},detail:null,intraday:{},regimeHistory:[]};
function toast(x){let e=$('#toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}function log(x,l='info'){state.logs.unshift({ts:Date.now(),l,x});state.logs=state.logs.slice(0,200);renderLogs()}function fmt(id,v){const m=META[id];if(!Number.isFinite(v))return'Unavailable';return(m.unit||'')+v.toFixed(m.dec)+(m.suffix||'')}function pct(v){return Number.isFinite(v)?`${v>=0?'+':''}${v.toFixed(2)}%`:'Unavailable'}function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,DBV);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('series'))d.createObjectStore('series',{keyPath:'id'});if(!d.objectStoreNames.contains('observations')){let s=d.createObjectStore('observations',{keyPath:'id'});s.createIndex('seriesId','seriesId')}if(!d.objectStoreNames.contains('regimeHistory'))d.createObjectStore('regimeHistory',{keyPath:'id'});if(!d.objectStoreNames.contains('news'))d.createObjectStore('news',{keyPath:'id'});if(!d.objectStoreNames.contains('analyses'))d.createObjectStore('analyses',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function all(st){return new Promise((ok,no)=>{let r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}function put(st,v){return new Promise((ok,no)=>{let r=db.transaction(st,'readwrite').objectStore(st).put(v);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function canon(id,data){const monthly=id==='cpi',m=new Map();for(const p of data||[]){if(!Number.isFinite(p.t)||!Number.isFinite(p.v))continue;const d=new Date(p.t),k=monthly?`${d.getUTCFullYear()}-${d.getUTCMonth()}`:d.toISOString().slice(0,10);m.set(k,p)}return[...m.values()].sort((a,b)=>a.t-b.t)}async function loadStored(){for(const m of await all('series'))state.meta[m.id]=m;for(const o of await all('observations'))(state.series[o.seriesId]??=[]).push({t:o.t,v:o.v});for(const id of Object.keys(state.series))state.series[id]=canon(id,state.series[id]);state.news=(await all('news')).sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));state.analyses=(await all('analyses')).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));state.regimeHistory=(await all('regimeHistory')).sort((a,b)=>(a.ts||0)-(b.ts||0));state.providers=JSON.parse(localStorage.getItem('mn-provider-health')||'{}')}
function configLoad(){let n={};try{n=JSON.parse(localStorage.getItem('mrm-config')||'{}')}catch{}let s={};try{s=JSON.parse(localStorage.getItem('mrm-secrets')||sessionStorage.getItem('mrm-secrets')||'{}')}catch{}state.config={...n,...s};$('#avKey').value=state.config.alphaVantageKey||'';$('#orKey').value=state.config.openRouterKey||'';$('#orModel').value=state.config.model||'openrouter/free'}function configSave(){state.config={...state.config,alphaVantageKey:$('#avKey').value.trim(),openRouterKey:$('#orKey').value.trim(),model:$('#orModel').value.trim()||'openrouter/free'};localStorage.setItem('mrm-config',JSON.stringify({model:state.config.model,rememberSecrets:true}));localStorage.setItem('mrm-secrets',JSON.stringify({alphaVantageKey:state.config.alphaVantageKey,openRouterKey:state.config.openRouterKey}));$('#configModal').classList.remove('open');toast('Configuration saved')}
function rangeData(id,r,data=null){const a=data||state.series[id]||[];if(!a.length||r==='max')return a;const end=a.at(-1).t;if(r==='ytd'){const d=new Date(end),cut=Date.UTC(d.getUTCFullYear(),0,1);return a.filter(x=>x.t>=cut)}const days=H[r]?.days||90,cut=end-days*864e5;return a.filter(x=>x.t>=cut)}function q(id,r=state.range,data=null){const a=rangeData(id,r,data);if(!a.length)return null;const f=a[0],l=a.at(-1);return{value:l.v,t:l.t,p:f.v?(l.v/f.v-1)*100:null,count:a.length,start:f.t,end:l.t}}function coverage(id,r){const a=rangeData(id,r);if(H[r]?.intraday)return true;if(!a.length)return false;if(r==='ytd')return a.length>=20;if(r==='1mo')return a.length>=15;if(r==='3mo')return a.length>=45;if(r==='6mo')return a.length>=90;if(r==='1y')return a.length>=180;if(r==='5y')return a.length>=800;return true}
async function jsonRoutes(url){let last;for(const u of [url,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,`https://corsproxy.io/?url=${encodeURIComponent(url)}`]){try{const r=await fetch(u),t=await r.text();if(!r.ok)throw Error(r.status);return JSON.parse(t)}catch(e){last=e}}throw last||Error('Unavailable')}async function yahoo(id,range='5y',interval='1d'){const m=META[id],url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(m.symbol)}?range=${range}&interval=${interval}&includePrePost=true`;const j=await jsonRoutes(url),r=j?.chart?.result?.[0];if(!r)throw Error(j?.chart?.error?.description||'No data');const close=r.indicators?.quote?.[0]?.close||[];return(r.timestamp||[]).map((t,i)=>({t:t*1000,v:+close[i]})).filter(x=>Number.isFinite(x.v))}async function saveSeries(id,data,provider='Yahoo Finance'){const merged=canon(id,[...(state.series[id]||[]),...data]);state.series[id]=merged;for(const p of data)await put('observations',{id:`${id}:${p.t}`,seriesId:id,t:p.t,v:p.v,source:provider,retrievedAt:Date.now()});state.meta[id]={...(state.meta[id]||{}),id,provider,lastSuccessfulFetchAt:Date.now(),latestDate:merged.at(-1)?.t,earliestDate:merged[0]?.t,nextEligibleFetchAt:Date.now()+3600e3};await put('series',state.meta[id]);providerMark(provider,true,`${META[id]?.short||id} updated`)}function providerMark(n,ok,msg){state.providers[n]={...(state.providers[n]||{}),connected:ok,message:msg,[ok?'lastSuccess':'lastFailure']:Date.now()};localStorage.setItem('mn-provider-health',JSON.stringify(state.providers));renderProviders()}
function progress(open,title='',text='',pctv=0){$('#progress').classList.toggle('open',open);if(open){$('#progressTitle').textContent=title;$('#progressText').textContent=text;$('#progressBar').style.width=`${pctv}%`}}async function foundation(){const ids=['spy','tenYear','wti'],need=ids.filter(id=>!coverage(id,'5y'));if(!need.length)return;progress(true,'Building historical foundation','Preparing 5-year daily history…',0);let i=0;for(const id of need){progress(true,'Building historical foundation',`Fetching ${META[id].name}`,Math.round(i/need.length*100));try{const d=await yahoo(id,'5y','1d');await saveSeries(id,d)}catch(e){providerMark('Yahoo Finance',false,e.message);log(`${META[id].short} history unavailable: ${e.message}`,'error')}i++}progress(false);await buildRegimeHistory()}
async function incremental(force=false){for(const id of ['spy','tenYear','wti']){const due=force||Date.now()>=(state.meta[id]?.nextEligibleFetchAt||0);if(!due)continue;try{const d=await yahoo(id,'5d','1d');await saveSeries(id,d)}catch(e){providerMark('Yahoo Finance',false,e.message)}}await refreshNews(force);await buildRegimeHistory();renderAll();$('#dot').className='dot good';$('#status').textContent='Updated '+new Date().toLocaleTimeString()}
function nearest(a,t){let lo=0,hi=a.length-1,best=null;while(lo<=hi){let m=(lo+hi)>>1;if(a[m].t<=t){best=a[m];lo=m+1}else hi=m-1}return best}function clamp(x,a=-1,b=1){return Math.max(a,Math.min(b,x))}function regimeAt(t){const S=state.series.spy||[],Y=state.series.tenYear||[],O=state.series.wti||[];const s=nearest(S,t),y=nearest(Y,t),o=nearest(O,t),s0=nearest(S,t-30*864e5),y0=nearest(Y,t-30*864e5),o0=nearest(O,t-30*864e5);if(!s||!y||!o||!s0||!y0||!o0)return null;const sp=(s.v/s0.v-1)*100,yp=(y.v-y0.v)*100,op=(o.v/o0.v-1)*100;const score=Math.round(clamp(50+20*clamp(sp/5)-15*clamp(yp/30)-10*clamp(op/10),0,100));return{score,label:score>=62?'Optimistic':score<=38?'Pessimistic':'Neutral',sp,yp,op,t}}async function buildRegimeHistory(){const S=state.series.spy||[];if(S.length<40)return;const cut=Date.now()-370*864e5,out=[];for(const p of S.filter(x=>x.t>=cut)){const r=regimeAt(p.t);if(r)out.push(r)}state.regimeHistory=out;for(const r of out)await put('regimeHistory',{id:`v38:${new Date(r.t).toISOString().slice(0,10)}`,ts:r.t,score:r.score,regime:r.label,version:'3.8'})}
function setupCanvas(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.max(1,r.width*d);c.height=Math.max(1,r.height*d);const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);return{x,w:r.width,h:r.height}}function axisDate(t,r){const d=new Date(t);if(r==='1d')return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(r==='5d')return d.toLocaleDateString([],{weekday:'short'});if(['1mo','3mo'].includes(r))return d.toLocaleDateString([],{month:'short',day:'numeric'});if(['6mo','ytd','1y'].includes(r))return d.toLocaleDateString([],{month:'short'});return d.toLocaleDateString([],{month:'short',year:'2-digit'})}function chart(canvas,list,{range='3mo',axes=true,normalized=false}={}){const{x,w,h}=setupCanvas(canvas),pad=axes?{l:58,r:10,t:10,b:30}:{l:2,r:2,t:2,b:2},pts=list.flatMap(s=>s.data||[]);x.clearRect(0,0,w,h);if(!pts.length){x.fillStyle='#91a3bb';x.fillText('Data unavailable',10,22);return}let t0=Math.min(...pts.map(p=>p.t)),t1=Math.max(...pts.map(p=>p.t));if(t0===t1)t1+=864e5;let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));let p=(hi-lo||1)*.08;lo-=p;hi+=p;if(axes){x.strokeStyle='#263854';x.fillStyle='#91a3bb';x.font='10px system-ui';for(let i=0;i<5;i++){let y=pad.t+(h-pad.t-pad.b)*i/4,val=hi-(hi-lo)*i/4;x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(normalized?val.toFixed(0):list.length===1?fmt(list[0].id,val):val.toFixed(1),3,y+3)}for(let i=0;i<5;i++){let t=t0+(t1-t0)*i/4,px=pad.l+(w-pad.l-pad.r)*i/4;x.fillText(axisDate(t,range),Math.max(2,Math.min(w-48,px-16)),h-7)}}for(const s of list){x.strokeStyle=s.color;x.lineWidth=axes?2:1.6;x.beginPath();s.data.forEach((pt,i)=>{const px=pad.l+(pt.t-t0)/(t1-t0)*(w-pad.l-pad.r),py=pad.t+(hi-pt.v)/(hi-lo)*(h-pad.t-pad.b);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}const inspect=e=>{e.stopPropagation();document.getElementById('tip')?.remove();const r=canvas.getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(e.clientX-r.left-pad.l)/(r.width-pad.l-pad.r))),target=t0+ratio*(t1-t0),tip=document.createElement('div');tip.id='tip';tip.style.cssText=`position:fixed;z-index:150;background:#eef5ff;color:#07111e;padding:7px 9px;border-radius:8px;font-size:11px;left:${Math.min(innerWidth-220,e.clientX+8)}px;top:${Math.max(8,e.clientY-70)}px`;tip.innerHTML=list.map(s=>{const p=s.data.reduce((a,b)=>Math.abs(b.t-target)<Math.abs(a.t-target)?b:a,s.data[0]);return`<div><b>${s.name}</b> · ${normalized?p.v.toFixed(1):fmt(s.id,p.v)} · ${new Date(p.t).toLocaleString()}</div>`}).join('');document.body.appendChild(tip)};canvas.onpointerdown=inspect;canvas.onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons)inspect(e)};canvas.onpointerleave=()=>document.getElementById('tip')?.remove()}

async function fetchFeed(url){for(const u of [url,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`])try{const r=await fetch(u);if(r.ok)return await r.text()}catch{}throw Error('Feed unavailable')}function parseFeed(xml,source){const d=new DOMParser().parseFromString(xml,'text/xml');if(d.querySelector('parsererror'))return[];return[...d.querySelectorAll('item,entry')].slice(0,30).map(x=>{const title=x.querySelector('title')?.textContent?.trim()||'Untitled',link=x.querySelector('link')?.getAttribute('href')||x.querySelector('link')?.textContent?.trim()||'',date=x.querySelector('pubDate,published,updated')?.textContent||'',description=x.querySelector('description,summary')?.textContent||'';return{id:link||`${source}:${title}`,title,link,source,description,publishedAt:Date.parse(date)||Date.now(),topic:/missile|war|iran|israel|ukrain|sanction|hormuz|shipping/i.test(title+' '+description)?'geopolitics':/oil|crude|opec/i.test(title+' '+description)?'oil':/rate|fed|yield|inflation/i.test(title+' '+description)?'rates':'markets'}})}async function refreshNews(force=false){const last=+(localStorage.getItem('mn38-news-last')||0);if(!force&&Date.now()-last<45*60000)return;const feeds=['https://finance.yahoo.com/news/rssindex','https://feeds.bbci.co.uk/news/business/rss.xml','https://www.ft.com/markets?format=rss','https://feeds.marketwatch.com/marketwatch/topstories/'];let m=new Map(state.news.map(n=>[n.id,n]));for(const f of feeds)try{for(const n of parseFeed(await fetchFeed(f),new URL(f).hostname))m.set(n.id,{...(m.get(n.id)||{}),...n})}catch(e){log(`Feed unavailable: ${f}`,'warning')}state.news=[...m.values()].sort((a,b)=>b.publishedAt-a.publishedAt).slice(0,300);for(const n of state.news)await put('news',n);localStorage.setItem('mn38-news-last',Date.now());renderNews()}
function normalize(ids,r){const a=ids.map(id=>({id,d:rangeData(id,r)})).filter(x=>x.d.length>1);if(a.length<2)return[];const start=Math.max(...a.map(x=>x.d[0].t)),end=Math.min(...a.map(x=>x.d.at(-1).t));return a.map(x=>{const d=x.d.filter(p=>p.t>=start&&p.t<=end),b=d[0]?.v;return{id:x.id,name:META[x.id].short,color:META[x.id].color,data:b?d.map(p=>({t:p.t,v:p.v/b*100})):[]}})}function corr(a,b){let A=new Map(a.map(x=>[new Date(x.t).toISOString().slice(0,10),x.v])),p=[];for(const x of b){let k=new Date(x.t).toISOString().slice(0,10);if(A.has(k))p.push([A.get(k),x.v])}if(p.length<20)return null;let x=[],y=[];for(let i=1;i<p.length;i++){x.push(p[i][0]/p[i-1][0]-1);y.push(p[i][1]/p[i-1][1]-1)}let mx=x.reduce((a,b)=>a+b,0)/x.length,my=y.reduce((a,b)=>a+b,0)/y.length,n=0,dx=0,dy=0;for(let i=0;i<x.length;i++){let a=x[i]-mx,b=y[i]-my;n+=a*b;dx+=a*a;dy+=b*b}return n/Math.sqrt(dx*dy)}function renderAnalysis(){$('#analysisCompare').innerHTML=`<div class="analysisGrid"><article class="card analysisControls"><div class="kicker">AD HOC ANALYSIS</div><h2>Normalized comparison</h2><div class="field"><label>Horizon</label><select id="compareRange">${['1mo','3mo','6mo','ytd','1y','5y'].map(r=>`<option value="${r}" ${r==='1y'?'selected':''}>${H[r].label}</option>`).join('')}</select></div>${['spy','tenYear','wti'].map(id=>`<label><input type="checkbox" data-compare="${id}" checked style="width:auto"> ${META[id].name}</label>`).join('')}<button id="saveCompare" class="btn primary">Save to Analysis</button></article><article class="card chartBox"><canvas id="compareChart" class="chart"></canvas></article></div>`;const redraw=()=>{let ids=$$('[data-compare]').filter(x=>x.checked).map(x=>x.dataset.compare),r=$('#compareRange').value,list=normalize(ids,r);chart($('#compareChart'),list,{range:r,axes:true,normalized:true})};setTimeout(()=>{$$('[data-compare]').forEach(x=>x.onchange=redraw);$('#compareRange').onchange=redraw;$('#saveCompare').onclick=()=>saveAnalysis('Normalized comparison',{type:'comparison',range:$('#compareRange').value,series:$$('[data-compare]').filter(x=>x.checked).map(x=>x.dataset.compare)});redraw()},0);const c1=corr(rangeData('spy','1y'),rangeData('tenYear','1y')),c2=corr(rangeData('spy','1y'),rangeData('wti','1y')),c3=corr(rangeData('tenYear','1y'),rangeData('wti','1y'));$('#analysisCorrelation').innerHTML=`<div class="storyGrid">${[['SPY ↔ 10Y',c1],['SPY ↔ WTI',c2],['10Y ↔ WTI',c3]].map(([n,c])=>`<article class="card"><div class="kicker">1Y DAILY RETURN CORRELATION</div><h2>${n}</h2><div class="value">${Number.isFinite(c)?c.toFixed(2):'Unavailable'}</div></article>`).join('')}</div>`}

function renderProviders(){const defs=[['Yahoo Finance',true],['Alpha Vantage',!!state.config.alphaVantageKey],['OpenRouter',!!state.config.openRouterKey],['RSS / Atom',true]];$('#providersHealth').innerHTML=`<div class="providerGrid">${defs.map(([n,c])=>{let p=state.providers[n]||{};return`<article class="card provider"><div class="row"><h3>${n}</h3><span class="badge ${p.connected===true?'good':p.connected===false?'bad':'neutral'}">${!c?'Not configured':p.connected===true?'Connected':p.connected===false?'Unavailable':'Not tested'}</span></div><dl><dt>Last success</dt><dd>${p.lastSuccess?new Date(p.lastSuccess).toLocaleString():'Unavailable'}</dd><dt>Last failure</dt><dd>${p.lastFailure?new Date(p.lastFailure).toLocaleString():'Unavailable'}</dd><dt>Status</dt><dd>${p.message||'No live test this session'}</dd></dl></article>`}).join('')}</div>`}function renderLogs(){$('#logsActivity').innerHTML=`<div class="logList">${state.logs.slice(0,12).map(l=>`<div class="logRow"><span class="muted tiny">${new Date(l.ts).toLocaleTimeString()} · ${l.l.toUpperCase()}</span><div>${l.x}</div></div>`).join('')||'<div class="card muted">No activity yet.</div>'}</div>`}function renderAbout(){$('#aboutMain').innerHTML=`<div class="storyGrid">${[['Now','One fixed snapshot: SPY, 10Y, WTI and the regime.'],['Macro','Slow inflation and rate context, separated by tabs.'],['News','A compact event layer; no endless feed.'],['Analysis','The only place for ad-hoc comparisons and correlations.'],['Drill-down','Cards open modals. Modals contain detailed charts and Save to Analysis.'],['Navigation','No hidden Markets route and no second path to the same chart.']].map(([a,b])=>`<article class="card"><div class="kicker">${a}</div><h2>${b}</h2></article>`).join('')}</div>`}
async function openDetail(id){state.detail={id,range:'3mo'};$('#saveDetail').style.display='';$('#detailModal').classList.add('open');await drawDetail()}async function drawDetail(){const {id,range}=state.detail,m=META[id];$('#detailKicker').textContent=m.role;$('#detailTitle').textContent=m.name;$('#detailRanges').innerHTML=Object.entries(H).map(([k,v])=>`<button data-dr="${k}" class="${k===range?'active':''}">${v.label}</button>`).join('');let data;if(H[range].intraday&&m.symbol){if(!state.intraday[`${id}:${range}`]){progress(true,'Loading intraday data',`${m.name} · ${H[range].label}`,30);try{state.intraday[`${id}:${range}`]=await yahoo(id,H[range].range,H[range].interval)}catch(e){toast('Intraday data unavailable')}progress(false)}data=state.intraday[`${id}:${range}`]||[]}else{if(m.symbol&&!coverage(id,range)){progress(true,'Extending history',`${m.name} · ${H[range].label}`,30);try{await saveSeries(id,await yahoo(id,range==='5y'||range==='max'?'5y':'1y','1d'))}catch(e){toast('Historical data unavailable')}progress(false)}data=rangeData(id,range)}chart($('#detailChart'),[{id,name:m.short,color:m.color,data}],{range,axes:true});const z=quoteAny(data),start=data[0],end=data.at(-1);$('#detailStats').innerHTML=`<div class="stat"><span class="kicker">LATEST</span><b>${end?fmt(id,end.v):'Unavailable'}</b></div><div class="stat"><span class="kicker">CHANGE</span><b>${z?pct(z.p):'Unavailable'}</b></div><div class="stat"><span class="kicker">OBS</span><b>${data.length}</b></div><div class="stat"><span class="kicker">FROM</span><b>${start?new Date(start.t).toLocaleDateString():'—'}</b></div><div class="stat"><span class="kicker">TO</span><b>${end?new Date(end.t).toLocaleDateString():'—'}</b></div>`;$$('[data-dr]').forEach(b=>b.onclick=async()=>{state.detail.range=b.dataset.dr;await drawDetail()});$('#saveDetail').onclick=()=>saveAnalysis(`${m.short} ${H[range].label} detail`,{type:'series',id,range,data:data.slice(-500)})}function quoteAny(a){if(!a?.length)return null;cons (async()=>{configLoad();await openDB();await loadStored();renderAll();setSection('now');await foundation();await incremental(false);$('#status').textContent='Ready';$('#dot').className='dot good'})().catch(e=>{log(e.message,'error');$('#status').textContent='Using stored data';$('#dot').className='dot bad'});

/* 3.8.1 regime-history repair: authoritative SPY/10Y/WTI backfill + incremental tail refresh */
const REGIME_SERIES=['spy','tenYear','wti'];
const REGIME_FOUNDATION_KEY='mn-regime-foundation-381';
function regimeDateKey(t){const d=new Date(t);return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
function regimeCanonical(data){const m=new Map();for(const p of data||[]){if(Number.isFinite(p?.t)&&Number.isFinite(p?.v))m.set(regimeDateKey(p.t),{t:p.t,v:p.v})}return[...m.values()].sort((a,b)=>a.t-b.t)}
function regimeLatestAgeDays(id){const a=state.series[id]?.at(-1)?.t;return a?((Date.now()-a)/86400000):Infinity}
function regimeHistoryYears(id){const d=state.series[id]||[];return d.length>1?(d.at(-1).t-d[0].t)/(365.25*86400000):0}
async function regimeYahooJson(url,label){let last;for(const u of [url,`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,`https://corsproxy.io/?url=${encodeURIComponent(url)}`]){try{const r=await fetch(u);const t=await r.text();if(!r.ok)throw new Error(`${r.status}`);const j=JSON.parse(t);if(j?.chart?.error)throw new Error(j.chart.error.description||'Yahoo error');return j}catch(e){last=e}}throw new Error(`${label}: ${last?.message||'unavailable'}`)}
async function regimeFetch(id,range){const m=META[id],url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(m.symbol)}?range=${range}&interval=1d&includePrePost=false&events=div%2Csplits`;const j=await regimeYahooJson(url,`Yahoo ${m.short}`),r=j?.chart?.result?.[0],close=r?.indicators?.quote?.[0]?.close||[];const d=(r?.timestamp||[]).map((t,i)=>({t:t*1000,v:Number(close[i])})).filter(x=>Number.isFinite(x.v));if(d.length<2)throw new Error(`${m.short}: insufficient Yahoo history`);return regimeCanonical(d)}
async function regimePersist(id,incoming){const existing=regimeCanonical(state.series[id]||[]),map=new Map(existing.map(p=>[regimeDateKey(p.t),p]));for(const p of incoming)map.set(regimeDateKey(p.t),p);const merged=[...map.values()].sort((a,b)=>a.t-b.t);state.series[id]=merged;state.meta[id]={...(state.meta[id]||{}),id,provider:'Yahoo Finance',earliestDate:merged[0]?.t||null,latestDate:merged.at(-1)?.t||null,observationCount:merged.length,lastSuccessfulFetchAt:Date.now(),lastError:null};if(db){const tr=db.transaction(['observations','series'],'readwrite'),obs=tr.objectStore('observations'),meta=tr.objectStore('series');for(const p of incoming)obs.put({id:`${id}:${p.t}`,seriesId:id,t:p.t,v:p.v,source:'Yahoo Finance',retrievedAt:Date.now()});meta.put(state.meta[id]);await new Promise((res,rej)=>{tr.oncomplete=res;tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error)})}return merged}
function regimeFreshness(){return REGIME_SERIES.map(id=>({id,latest:state.series[id]?.at(-1)?.t||null,ageDays:regimeLatestAgeDays(id),years:regimeHistoryYears(id)}))}
function regimeNeedsFoundation(){const flag=localStorage.getItem(REGIME_FOUNDATION_KEY);return !flag||REGIME_SERIES.some(id=>regimeHistoryYears(id)<4.75)}
function regimeNeedsTail(){return REGIME_SERIES.some(id=>regimeLatestAgeDays(id)>1.5)}
async function repairRegimeHistory(forceFull=false){if(state.__regimeRepairBusy)return;const full=forceFull||regimeNeedsFoundation(),tail=regimeNeedsTail();if(!full&&!tail)return;state.__regimeRepairBusy=true;try{const box=$('#progress'),text=$('#progressText'),bar=$('#progressBar'),title=$('#progressTitle');if(box)box.classList.add('open');if(title)title.textContent=full?'Building five-year regime history':'Updating regime history';for(let i=0;i<REGIME_SERIES.length;i++){const id=REGIME_SERIES[i],m=META[id];if(text)text.textContent=`${full?'Backfilling':'Updating'} ${m.short} (${i+1} of ${REGIME_SERIES.length})`;if(bar)bar.style.width=`${Math.round(i/REGIME_SERIES.length*100)}%`;const d=await regimeFetch(id,full?'5y':'1mo');await regimePersist(id,d)}if(full)localStorage.setItem(REGIME_FOUNDATION_KEY,new Date().toISOString());if(bar)bar.style.width='100%';state.providers['Yahoo Finance']={...(state.providers['Yahoo Finance']||{}),connected:true,lastSuccess:Date.now(),message:'SPY, 10Y and WTI history current'};localStorage.setItem('mn-provider-health',JSON.stringify(state.providers));if(typeof rebuildRegimeHistory==='function')await rebuildRegimeHistory();else if(typeof primeRegimeHistory==='function')await primeRegimeHistory();if(typeof renderAll==='function')renderAll();else {if(typeof renderNow==='function')renderNow();if(typeof renderTrend==='function')renderTrend()}const f=regimeFreshness();log(`Regime history repaired · ${f.map(x=>`${META[x.id].short} ${state.series[x.id]?.length||0} obs through ${x.latest?new Date(x.latest).toLocaleDateString():'n/a'}`).join(' · ')}`);if($('#status'))$('#status').textContent='Regime history current'}catch(e){state.providers['Yahoo Finance']={...(state.providers['Yahoo Finance']||{}),connected:false,lastFailure:Date.now(),message:e.message};localStorage.setItem('mn-provider-health',JSON.stringify(state.providers));log(`Regime history repair failed: ${e.message}`,'error');if($('#status'))$('#status').textContent='Regime data incomplete'}finally{state.__regimeRepairBusy=false;if($('#progress'))setTimeout(()=>$('#progress').classList.remove('open'),250)}}
setTimeout(()=>repairRegimeHistory(false),1200);


/* 3.8.2: reject Yahoo null closes, purge synthetic zero observations, and force clean regime re-backfill */
function regimeCanonical(data){const m=new Map();for(const p of data||[]){if(!Number.isFinite(p?.t)||!Number.isFinite(p?.v)||p.v<=0)continue;m.set(regimeDateKey(p.t),{t:p.t,v:p.v})}return[...m.values()].sort((a,b)=>a.t-b.t)}
async function regimeFetch(id,range){const m=META[id],url=`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(m.symbol)}?range=${range}&interval=1d&includePrePost=false&events=div%2Csplits`;const j=await regimeYahooJson(url,`Yahoo ${m.short}`),r=j?.chart?.result?.[0],ts=r?.timestamp||[],close=r?.indicators?.quote?.[0]?.close||[],d=[];for(let i=0;i<ts.length;i++){const raw=close[i];if(typeof raw!=='number'||!Number.isFinite(raw)||raw<=0)continue;d.push({t:ts[i]*1000,v:raw})}const clean=regimeCanonical(d);if(clean.length<2)throw new Error(`${m.short}: insufficient valid Yahoo history`);return clean}
async function regimePersist(id,incoming){const existing=regimeCanonical(state.series[id]||[]),map=new Map(existing.map(p=>[regimeDateKey(p.t),p]));for(const p of regimeCanonical(incoming))map.set(regimeDateKey(p.t),p);const merged=[...map.values()].sort((a,b)=>a.t-b.t);state.series[id]=merged;state.meta[id]={...(state.meta[id]||{}),id,provider:'Yahoo Finance',earliestDate:merged[0]?.t||null,latestDate:merged.at(-1)?.t||null,observationCount:merged.length,lastSuccessfulFetchAt:Date.now(),lastError:null};if(db){const tr=db.transaction(['observations','series'],'readwrite'),obs=tr.objectStore('observations'),meta=tr.objectStore('series');for(const p of incoming){if(!Number.isFinite(p?.v)||p.v<=0)continue;obs.put({id:`${id}:${p.t}`,seriesId:id,t:p.t,v:p.v,source:'Yahoo Finance',retrievedAt:Date.now()})}for(const bad of (await new Promise((res,rej)=>{const rq=obs.index('seriesId').getAll(IDBKeyRange.only(id));rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)}))){if(!Number.isFinite(bad.v)||bad.v<=0)obs.delete(bad.id)}meta.put(state.meta[id]);await new Promise((res,rej)=>{tr.oncomplete=res;tr.onerror=()=>rej(tr.error);tr.onabort=()=>rej(tr.error)})}return merged}
localStorage.removeItem(REGIME_FOUNDATION_KEY);
setTimeout(()=>repairRegimeHistory(true),500);


/* 3.9: one global horizon, explicit regime semantics, category indexes, linear modal drill-down */
const CATEGORY={
  risk:{name:'Risk',desc:'Risk appetite and market stress proxy',components:['spy','wti']},
  growth:{name:'Growth',desc:'Equity direction versus cost of capital',components:['spy','tenYear']},
  macro:{name:'Macro',desc:'Rates and energy pressure',components:['tenYear','wti']}
};
function rangeStartTs(r,end=Date.now()){const h=H[r];if(!h)return null;if(h.max)return null;if(h.ytd)return new Date(new Date(end).getFullYear(),0,1).getTime();return end-(h.days||0)*864e5}
function regimeHistorySlice(r){const d=(state.regimeHistory||[]).map(x=>({t:x.t||x.ts,v:x.score})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.v));if(!d.length)return[];if(H[r]?.intraday)return d.slice(-2);const start=rangeStartTs(r,d.at(-1).t);return start?d.filter(x=>x.t>=start):d}
function categoryIndex(key,r=state.range){const c=CATEGORY[key];let parts=[];for(const id of c.components){const z=q(id,r);if(!z||!coverage(id,r))continue;let effect=0;if(id==='spy')effect=clamp(z.p/8);if(id==='tenYear')effect=-clamp(z.p/6);if(id==='wti')effect=-clamp(z.p/12);parts.push({id,effect,p:z.p})}if(!parts.length)return null;const score=Math.round(50+35*(parts.reduce((a,b)=>a+b.effect,0)/parts.length));const s=Math.max(0,Math.min(100,score));return{score:s,label:s>=58?'Positive':s<=42?'Negative':'Neutral',cls:s>=58?'good':s<=42?'bad':'neutral',parts}}
function regimeSummary(r=state.range){const current=regimeAt(Date.now());if(!current)return null;const hist=regimeHistorySlice(r),start=hist[0]?.v,end=hist.at(-1)?.v??current.score;const periodPct=Number.isFinite(start)&&start!==0?(end/start-1)*100:null;const basePct=(current.score/50-1)*100;return{...current,periodPct,basePct,start,end}}
function renderGlobalRange(){const e=$('#globalRange');if(!e)return;e.innerHTML=Object.entries(H).map(([k,v])=>`<button data-global-range="${k}" class="${k===state.range?'active':''}">${v.label}</button>`).join('');$$('[data-global-range]').forEach(b=>b.onclick=async()=>{state.range=b.dataset.globalRange;if(!H[state.range].intraday&&['spy','tenYear','wti'].some(id=>!coverage(id,state.range)))await foundation();if(state.detail){state.detail.range=state.range;await drawDetail()}renderAll();renderGlobalRange()})}
function categoryCard(key){const c=CATEGORY[key],z=categoryIndex(key,state.range);return`<article class="card storyCard" data-category="${key}"><div class="row"><div><div class="kicker">CATEGORY INDEX</div><h3>${c.name}</h3></div><span class="chip ${z?.cls||'neutral'}">${z?.label||'Unavailable'}</span></div><div><div class="value">${z?z.score:'—'}<span class="muted" style="font-size:13px"> / 100</span></div><div class="muted tiny">${H[state.range].label} · baseline 50 · ${z?`${z.score>=50?'+':''}${((z.score/50-1)*100).toFixed(1)}% vs baseline`:'insufficient data'}</div></div><div class="muted" style="align-self:center">${c.desc}</div><div class="meta">Open to inspect ${c.components.map(id=>META[id].short).join(' + ')}</div></article>`}
function renderNow(){const r=regimeSummary(state.range);$('#nowSnapshot').innerHTML=`<div class="snapshot"><div class="hero"><article class="card regime" data-regime-open><div class="gauge"><strong>${r?r.score:'—'}</strong></div><div><div class="kicker">REGIME SENTIMENT INDEX · 0–100</div><h2>${r?r.label:'Unavailable'}</h2><div class="muted">Neutral baseline 50 · ${r?`${r.basePct>=0?'+':''}${r.basePct.toFixed(1)}% vs baseline`:'insufficient history'} · ${H[state.range].label} change ${r&&Number.isFinite(r.periodPct)?pct(r.periodPct):'Unavailable'}</div></div></article><article class="card"><div class="kicker">HOW TO READ IT</div><h2>One horizon controls the entire view</h2><p class="muted">Regime is a sentiment index, not a portfolio value. Risk, Growth and Macro are component indexes on the same 0–100 / baseline-50 convention.</p></article></div><div class="storyGrid">${['risk','growth','macro'].map(categoryCard).join('')}</div></div>`;setTimeout(()=>{$$('[data-category]').forEach(e=>e.onclick=()=>openCategory(e.dataset.category));$('[data-regime-open]')?.addEventListener('click',()=>setSection('now','nowTrend'))},0);renderRegimeTrend();renderGlobalRange()}
function renderRegimeTrend(){const d=regimeHistorySlice(state.range),z=regimeSummary(state.range);$('#nowTrend').innerHTML=`<div class="snapshot"><article class="card" style="height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden"><div class="row"><div><div class="kicker">REGIME SENTIMENT INDEX · ${H[state.range].label}</div><h2>${z?`${z.score}/100 · ${z.label}`:'Unavailable'}</h2><div class="muted tiny">Baseline 50 · ${z?`${z.basePct>=0?'+':''}${z.basePct.toFixed(1)}% vs baseline`:''} · period ${z&&Number.isFinite(z.periodPct)?pct(z.periodPct):'Unavailable'}</div></div><span class="chip ${z?.score>=58?'good':z?.score<=42?'bad':'neutral'}">${z?.score>=58?'Positive':z?.score<=42?'Negative':'Neutral'}</span></div><div class="chartBox"><canvas id="regimeChart" class="chart"></canvas></div><div class="actions"><button class="btn primary" id="saveRegime">Save to Analysis</button></div></article></div>`;setTimeout(()=>{chart($('#regimeChart'),[{id:'spy',name:'Regime index',color:'#6db7ff',data:d}],{range:state.range,axes:true,normalized:false});$('#saveRegime').onclick=()=>saveAnalysis(`Regime ${H[state.range].label}`,{type:'regime',range:state.range,data:d})},0);renderGlobalRange()}

async function drawCategory(){const key=state.detail.category,c=CATEGORY[key],z=categoryIndex(key,state.range);$('#detailKicker').textContent='CATEGORY INDEX';$('#detailTitle').textContent=`${c.name} · ${z?z.score:'—'}/100`;$('#detailRanges').innerHTML=Object.entries(H).map(([k,v])=>`<button data-cr="${k}" class="${k===state.range?'active':''}">${v.label}</button>`).join('');const list=normalize(c.components.filter(id=>META[id]?.symbol),state.range);chart($('#detailChart'),list,{range:state.range,axes:true,normalized:true});$('#detailStats').innerHTML=`<div class="stat"><span class="kicker">INDEX</span><b>${z?z.score:'—'} / 100</b></div><div class="stat"><span class="kicker">SIGNAL</span><b><span class="chip ${z?.cls||'neutral'}">${z?.label||'Unavailable'}</span></b></div>${c.components.map(id=>{const qv=q(id,state.range);return`<button class="stat" data-component="${id}" style="color:inherit;text-align:left;cursor:pointer"><span class="kicker">${META[id].short} · ${H[state.range].label}</span><b>${qv?pct(qv.p):'Unavailable'}</b></button>`}).join('')}`;$$('[data-cr]').forEach(b=>b.onclick=async()=>{state.range=b.dataset.cr;state.detail.range=state.range;renderGlobalRange();await drawCategory();renderAll()});$$('[data-component]').forEach(b=>b.onclick=()=>openDetail(b.dataset.component));$('#saveDetail').onclick=()=>saveAnalysis(`${c.name} ${H[state.range].label} category`,{type:'category',category:key,range:state.range,index:z,components:c.components})}

async function drawDetail(){const {id}=state.detail,range=state.range,m=META[id];state.detail.range=range;$('#detailKicker').textContent=m.role;$('#detailTitle').textContent=m.name;$('#detailRanges').innerHTML=Object.entries(H).map(([k,v])=>`<button data-dr="${k}" class="${k===range?'active':''}">${v.label}</button>`).join('');let data;if(H[range].intraday&&m.symbol){if(!state.intraday[`${id}:${range}`]){progress(true,'Loading intraday data',`${m.name} · ${H[range].label}`,30);try{state.intraday[`${id}:${range}`]=await yahoo(id,H[range].range,H[range].interval)}catch(e){toast('Intraday data unavailable')}progress(false)}data=state.intraday[`${id}:${range}`]||[]}else{if(m.symbol&&!coverage(id,range)){progress(true,'Extending history',`${m.name} · ${H[range].label}`,30);try{await saveSeries(id,await yahoo(id,range==='5y'||range==='max'?'5y':'1y','1d'))}catch(e){toast('Historical data unavailable')}progress(false)}data=rangeData(id,range)}chart($('#detailChart'),[{id,name:m.short,color:m.color,data}],{range,axes:true});const z=quoteAny(data),start=data[0],end=data.at(-1);$('#detailStats').innerHTML=`<div class="stat"><span class="kicker">LATEST</span><b>${end?fmt(id,end.v):'Unavailable'}</b></div><div class="stat"><span class="kicker">${H[range].label} CHANGE</span><b>${z?pct(z.p):'Unavailable'}</b></div><div class="stat"><span class="kicker">OBS</span><b>${data.length}</b></div><div class="stat"><span class="kicker">FROM</span><b>${start?new Date(start.t).toLocaleDateString():'—'}</b></div><div class="stat"><span class="kicker">TO</span><b>${end?new Date(end.t).toLocaleDateString():'—'}</b></div>`;$$('[data-dr]').forEach(b=>b.onclick=async()=>{state.range=b.dataset.dr;state.detail.range=state.range;renderGlobalRange();renderAll();await drawDetail()});$('#saveDetail').onclick=()=>saveAnalysis(`${m.short} ${H[range].label} detail`,{type:'series',id,range,data:data.slice(-500)})}
