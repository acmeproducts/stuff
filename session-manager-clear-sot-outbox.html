<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProjectChat Storage Recovery</title>
<style>
html,body{margin:0;min-height:100%;background:#111;color:#fff;font:17px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{max-width:680px;margin:0 auto;padding:28px 20px}.card{background:#1c1c1c;border:1px solid #555;border-radius:14px;padding:20px}h1{font-size:24px;margin:0 0 12px}.ok{color:#7ee2a8;font-weight:800}.bad{color:#ff9090;font-weight:800}.meta{color:#ccc;font-size:14px;margin:12px 0}.btn{display:inline-block;border:1px solid #59b9ff;background:#0c78b8;color:#fff;border-radius:10px;padding:12px 16px;text-decoration:none;font-weight:800;margin-top:12px}code{background:#000;padding:2px 5px;border-radius:5px;word-break:break-all}
</style>
</head>
<body>
<main><div class="card"><h1>ProjectChat storage recovery</h1><div id="status">Clearing only the SOT outbox…</div><div class="meta" id="details"></div><a class="btn" id="continue" href="session-manager-v3.html?v=2.9.1-storage-recovery">Continue to ProjectChat v2.9.1</a></div></main>
<script>
(()=>{'use strict';const KEY='oc_session_manager_sot_outbox_v1',status=document.getElementById('status'),details=document.getElementById('details');try{const before=localStorage.getItem(KEY)||'',beforeBytes=new Blob([before]).size;localStorage.removeItem(KEY);const after=localStorage.getItem(KEY);if(after===null){status.className='ok';status.textContent='SOT outbox cleared successfully.';details.innerHTML=`Removed <b>${beforeBytes.toLocaleString()}</b> bytes from <code>${KEY}</code>.<br>No other ProjectChat localStorage keys were changed.`}else throw new Error('The key is still present after removeItem.')}catch(e){status.className='bad';status.textContent='Recovery failed: '+e.message;details.textContent='No other storage keys were intentionally changed.'}})();
</script>
</body>
</html>
