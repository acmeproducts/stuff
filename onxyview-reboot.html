<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:var(--top) var(--strip) minmax(0,1fr)}

.stage{position:relative;min-height:0;overflow:hidden}.tree{position:absolute;inset:0;padding:6px;background:#071019}.group{position:absolute;overflow:hidden;border:1px solid #ffffff20;background:#0b1723}.grouphead{position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;gap:5px;padding:0 7px;background:#0f2030;border-bottom:1px solid #ffffff15;font-size:9px;font-weight:900;z-index:5}.grouphead small{color:var(--muted);font-weight:600}.event{position:absolute;overflow:hidden;border:1px solid #ffffff18;padding:5px 6px;text-align:left;color:#fff;transition:filter .1s}.event:hover{filter:brightness(1.08)}.event h3{margin:0;font-weight:850;line-height:1.12;overflow:hidden}.event .meta{position:absolute;left:6px;right:6px;bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eef7ffcc}.event .corro{position:absolute;right:4px;top:4px;border:1px solid #ffffff35;border-radius:999px;padding:1px 4px;background:#08121dcc}.event.more{display:grid;place-items:center;text-align:center;background:#122236!important;color:#b8ccdc}.event.more strong{font-size:14px}.tray{position:absolute;z-index:30;left:50%;top:0;transform:translate(-50%,-105%);width:min(760px,96vw);max-height:65vh;border:1px solid #33506c;border-radius:0 0 14px 14px;background:#091522f8;backdrop-filter:blur(18px);transition:transform .15s;overflow:hidden}.tray.open{transform:translate(-50%,0)}.tabs{height:35px;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.tab.on{color:#fff;box-shadow:inset 0 -2px var(--accent)}.body{padding:10px;max-height:calc(65vh - 35px);overflow:auto}.row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;margin-bottom:9px}.row label{font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}.row select{height:32px;border:1px solid var(--line);border-radius:9px;back @media(max-width:640px){:root{--top:38px}.brand{font-size:13px}.brand small,.status{display:none}.top{gap:5px;padding:4px 5px}.search{height:29px}.search input{font-size:10px}.gear{width:29px;height:29px}.tree{padding:3px}.grouphead{height:20px;font-size:8px}.event{padding:4px}.reader.open{max-height:128px}.reader h2{font-size:13px}.chip{font-size:8px;padding:0 7px}}
@media(min-width:900px){.reader{left:auto;right:8px;top:8px;bottom:8px;width:min(390px,31vw)}.reader.open{max-height:none}.tree.readerOpen{right:calc(min(390px,31vw) + 14px)}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">OnxyView <small>v1.0.0</small></div><div class="search"><input id="q" autocomplete="off" placeholder="Search events, #tags, #favorite, sources…"><button id="clear">×</button></div><div id="status" class="status">Starting…</div><button id="gear" class="gear">⚙</button></header><div class="strip"><button id="openTray" class="chev">⌄</button><div id="micro"></div></div><main class="stage"><div id="tree" class="tree"></div><div id="tray" class="tray"><div class="tabs"><button class="tab on" data-tab="group">Group</button><button class="tab" data-tab="color">Color</button><button class="tab" data-tab="size">Size</button><button class="tab" data-tab="lens">Lens</button></div><div id="trayBody" class="body"></div></div><article id="reader" class="reader"></article><div id="startup" class="startup"><div class="start"><h1 style="font-size:20px;margin:0 0 7px">Opening OnxyView</h1><p style="font-size:10px;color:var(--muted)">Loading event intelligence…</p><div class="bar"><i id="bar"></i></div><div id="progress" class="progress">Reading cache…</div></div></div></main></div>
<script>
(()=>{'use strict';const URL='./onxyview-event-cache.json',FKEY='onxyview.favorites',HKEY='onxyview.searchHistory',$=id=>document.getElementById(id),E={q:$('q'),clear:$('clear'),status:$('status'),tree:$('tree'),tray:$('tray'),openTray:$('openTray'),trayBody:$('trayBody'),micro:$('micro'),reader:$('reader'),startup:$('startup'),bar:$('bar'),progress:$('progress')};let data={events:[],sourcePacks:{}},events=[],visible=[],tab='group',current=null,fav=new Set(read(FKEY,[])),hist=read(HKEY,[]);const state={group:'subject',color:'sentiment',size:'importance',pack:'Core Global',hours:504,minSources:1,filters:{}};const COLORS={positive:'#2fb87a',neutral:'#d2a83d',negative:'#e75d70'};function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function packNames(e){const out=[];for(const [n,srcs] of Object.entries(data.sourcePacks||{}))if((e.sources||[]).some(s=>srcs.includes(s)))out.push(n);return out.length?out:['Other']}function val(e,f){if(f==='pack')return packNames(e)[0];if(f==='corroboration')return e.independentSourceCount>=5?'5+ sources':e.independentSourceCount>=3?'3–4 sources':e.independentSourceCount>=2?'2 sources':'1 source';if(f==='age'){const h=(Date.now()-e.lastSeen)/36e5;return h<6?'<6h':h<24?'6–24h':h<72?'1–3d':h<168?'3–7d':h<336?'7–14d':'14–21d'}return e[f]||'Unknown'}function sizeValue(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,72-Math.min(71,(Date.now()-e.lastSeen)/36e5));return Math.max(1,e.importance||1)}function colorOf(e){const v=val(e,state.color);if(state.color==='sentiment')return COLORS[v]||COLORS.neutral;let h=0;for(const c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 48% 38%)`}function text(e){return `${e.headline} ${e.subject} ${e.region} ${(e.tags||[]).join(' ')} ${(e.sources||[]).join(' ')}`.toLowerCase()}function passPack(e){if(state.pack==='All')return true;const p=new Set(data.sourcePacks?.[state.pack]||[]);return(e.sources||[]).some(s=>p.has(s))}function apply(){const q=E.q.value.trim().toLowerCase(),cut=Date.now()-state.hours*36e5;visible=events.filter(e=>e.lastSeen>=cut&&(e.independentSourceCount||1)>=state.minSources&&passPack(e)&&(!q||(q==='#favorite'?fav.has(e.eventId):text(e).includes(q.replace(/^#/,'')))));E.status.textContent=`${visible.length} events · ${data.articleCount||0} articles`;renderMicro();renderTree()}
function layout(values,width,height){const dims=[];if(!values.length||width<=0||height<=0)return dims;const total=values.reduce((a,b)=>a+b,0)||1,ratio=height/width;let vw=Math.sqrt(total/ratio),vh=vw*ratio,scale=width/vw,horiz=width<height,row=[],cx=0,cy=0;const worst=(R,w)=>{if(!R.length)return Infinity;const s=R.reduce((a,b)=>a+b,0),mx=Math.max(...R),mn=Math.min(...R);return Math.max((w*w*mx)/(s*s),(s*s)/(w*w*mn))};const finalize=()=>{if(!row.length)return;const sum=row.reduce((a,b)=>a+b,0);let rw,rh,x=cx,y=cy;if(!horiz){rw=sum/vh;rh=vh;vw-=rw;cx+=rw}else{rw=vw;rh=sum/vw;vh-=rh;cy+=rh}for(const value of row){let w,h;if(!horiz){w=rw;h=value/rw}else{w=value/rh;h=rh}dims.push({left:x*scale,top:y*scale,width:w*scale,height:h*scale});if(!horiz)y+=h;else x+=w}horiz=!horiz;row=[]};values.forEach((v,i)=>{const fixed=horiz?vw:vh;const before=worst(row,fixed),after=worst([...row,v],fixed);if(row.length&&after>before)finalize();row.push(v)});finalize();return dims}
function renderTree(){E.tree.innerHTML='';const r=E.tree.getBoundingClientRect(),groups={};for(const e of visible)(groups[val(e,state.group)]??=[]).push(e);const gs=Object.entries(groups).map(([name,items])=>({name,items,weight:items.reduce((s,e)=>s+sizeValue(e),0)})).sort((a,b)=>b.weight-a.weight);const gd=layout(gs.map(g=>g.weight),r.width,r.height);gs.forEach((g,gi)=>{const d=gd[gi];if(!d||d.width<18||d.height<18)return;const box=document.createElement('section');box.className='group';Object.assign(box.style,{left:`${d.left}px`,top:`${d.top}px`,width:`${d.width}px`,height:`${d.height}px`});const head=document.createElement('button');head.className='grouphead';head.innerHTML=`${esc(g.name)} <small>${g.items.length}</small>`;head.onclick=()=>focusGroup(g.name);box.appendChild(head);const inner={left:0,top:22,width:d.width,height:Math.max(0,d.height-22)};const minArea=inner.width<500?4200:6800,maxReadable=Math.max(1,Math.floor(inner.width*inner.height/minArea));const sorted=[...g.items].sort((a,b)=>sizeValue(b)-sizeValue(a));let shown=sorted.slice(0,maxReadable),hidden=Math.max(0,sorted.length-shown.length);let items=shown.map(e=>({e,w:sizeValue(e),more:false}));if(hidden){const hiddenWeight=Math.max(1,sorted.slice(maxReadable).reduce((s,e)=>s+sizeValue(e),0));items.push({e:null,w:Math.max(hiddenWeight*.35,shown[shown.length-1]?sizeValue(shown[shown.length-1]):1),more:true})}const id=layout(items.map(x=>x.w),inner.width,inner.height);items.forEach((it,i)=>{const q=id[i];if(!q)return;const b=document.createElement('button');b.className='event'+(it.more?' more':'');Object.assign(b.style,{left:`${q.left}px`,top:`${22+q.top}px`,width:`${q.width}px`,height:`${q.height}px`});if(it.more){b.innerHTML=`<div><strong>+${hidden}</strong><br><span>more ${esc(g.name)}</span></div>`;b.onclick=()=>focusGroup(g.name)}else{const e=it.e,area=q.width*q.height,font=Math.max(8,Math.min(24,Math.sqrt(area)/9)),meta=area>7000,corro=area>4000;b.style.background=colorOf(e);b.innerHTML=`${corro?`<span class="corro">${e.independentSourceCount||1} src</span>`:''}<h3 style="font-size:${font}px">${esc(e.headline)}</h3>${meta?`<div class="meta">${esc(e.region||'Global')} · ${esc((e.sources||[]).slice(0,2).join(' + '))}</div>`:''}`;b.onclick=()=>openReader(e)}box.appendChild(b)});E.tree.appendChild(box)})}
function focusGroup(name){state.filters.group=name;const keep=visible.filter(e=>val(e,state.group)===name);if(keep.length){const all=events;events=keep;apply();events=all;E.micro.dataset.focus=name;renderMicro()}}
function renderMicro(){const focus=E.micro.dataset.focus;E.micro.innerHTML=`<button class="chip" data-open="group">Group <b>${esc(state.group)}</b></button><button class="chip" data-open="color">Color <b>${esc(state.color)}</b></button><button class="chip" data-open="size">Size <b>${esc(state.size)}</b></button><button class="chip" data-open="lens">Lens <b>${esc(state.pack)}</b></button>${focus?`<button class="chip" data-clearfocus>× ${esc(focus)}</button>`:''}`}
function options(f){if(f==='group')return[['subject','Topic'],['region','Region'],['pack','Source Pack'],['sentiment','Sentiment'],['corroboration','Corroboration'],['age','Age']];if(f==='color')return[['sentiment','Sentiment'],['subject','Topic'],['region','Region'],['pack','Source Pack'],['corroboration','Corroboration']];if(f==='size')return[['importance','Importance'],['sources','Independent sources'],['recency','Recency']];return[]}
function renderTray(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));if(tab==='lens'){const packs=['All',...Object.keys(data.sourcePacks||{})];E.trayBody.innerHTML=`<div class="row"><label>Source pack</label><select id="pack">${packs.map(p=>`<option ${p===state.pack?'selected':''}>${esc(p)}</option>`).join('')}</select></div><div class="row"><label>Time</label><select id="hours"><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="240">10 days</option><option value="336">2 weeks</option><option value="504">3 weeks</option></select></div><div class="row"><label>Corroboration</label><select id="mins"><option value="1">All events</option><option value="2">2+ independent sources</option><option value="3">3+ independent sources</option><option value="5">5+ independent sources</option></select></div>`;document.getElementById('hours').value=String(state.hours);document.getElementById('mins').value=String(state.minSources);document.getElementById('pack').onchange=e=>{state.pack=e.target.value;apply();renderMicro()};document.getElementById('hours').onchange=e=>{state.hours=+e.target.value;apply()};document.getElementById('mins').onchange=e=>{state.minSources=+e.target.value;apply()};return}const list=options(tab);E.trayBody.innerHTML=`<div class="row"><label>${tab}</label><select id="dim">${list.map(([v,n])=>`<option value="${v}" ${state[tab]===v?'selected':''}>${n}</option>`).join('')}</select></div><div style="font-size:9px;color:var(--muted)">${tab==='group'?'Partitions the treemap into independently laid-out groups.':tab==='color'?'Changes tile color only.':'Changes tile area only.'}</div>`;document.getElementById('dim').onchange=e=>{state[tab]=e.target.value;apply();renderMicro()}}
function openReader(e){current=e;E.reader.className='reader open';if(innerWidth>=900)E.tree.classList.add('readerOpen');const on=fav.has(e.eventId);E.reader.innerHTML=`<div class="rhead"><span class="pill">Importance ${e.importance||0}</span><span class="pill">${e.independentSourceCount||1} independent</span><div class="actions"><button class="small" data-fav>${on?'★':'☆'}</button><button class="small" data-prev>‹</button><button class="small" data-next>›</button><button class="small" data-expand>⌃</button><button class="small" data-close>×</button></div></div><h2>${esc(e.headline)}</h2><div class="summary">${esc(e.summary||e.description||'')}</div><div class="tags">${(e.tags||[]).map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div><div class="sources">${(e.articles||[]).map(a=>`<div class="source"><a href="${esc(a.link||a.url)}" target="_blank" rel="noopener">${esc(a.title||a.headline||e.headline)}</a><small>${esc(a.source||'Source')}</small></div>`).join('')}</div>`;E.reader.onclick=ev=>{if(ev.target.closest('[data-close]'))closeReader();else if(ev.target.closest('[data-expand]'))E.reader.classList.toggle('expanded');else if(ev.target.closest('[data-fav]')){fav.has(e.eventId)?fav.delete(e.eventId):fav.add(e.eventId);save(FKEY,[...fav]);openReader(e)}else if(ev.target.closest('[data-prev]'))page(-1);else if(ev.target.closest('[data-next]'))page(1);else{const t=ev.target.closest('[data-tag]');if(t){E.q.value=t.dataset.tag;apply()}}}}
function closeReader(){E.reader.className='reader';E.tree.classList.remove('readerOpen');current=null}function page(dir){if(!visible.length)return;let i=current?visible.findIndex(x=>x.eventId===current.eventId):0;i=(i+dir+visible.length)%visible.length;openReader(visible[i])}
function bind(){E.openTray.onclick=()=>{E.tray.classList.toggle('open');E.openTray.textContent=E.tray.classList.contains('open')?'⌃':'⌄'};document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;renderTray()};E.micro.onclick=e=>{const b=e.target.closest('[data-open]');if(b){tab=b.dataset.open;renderTray();E.tray.classList.add('open');E.openTray.textContent='⌃'}if(e.target.closest('[data-clearfocus]')){delete E.micro.dataset.focus;apply()}};E.q.oninput=apply;E.q.onkeydown=e=>{if(e.key==='Enter'&&E.q.value.trim()){const q=E.q.value.trim(),i=hist.findIndex(x=>x.q===q);if(i>=0)hist[i].n++;else hist.unshift({q,n:1});hist.sort((a,b)=>b.n-a.n);save(HKEY,hist.slice(0,30))}};E.clear.onclick=()=>{E.q.value='';apply()};window.addEventListener('resize',()=>renderTree())}
async function load(){E.progress.textContent='Reading event cache…';const r=await fetch(`${URL}?v=${Math.floor(Date.now()/900000)}`,{cache:'no-cache'});if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json();events=data.events||[];if(!data.sourcePacks?.[state.pack])state.pack='All';E.bar.style.width='75%';E.progress.textContent=`Preparing ${events.length} events…`;bind();renderTray();apply();E.startup.classList.add('done')}
load().catch(err=>{E.progress.textContent=`Unable to load: ${err.message}`;E.status.textContent='Cache unavailable'});
})();
</script></body></html>
