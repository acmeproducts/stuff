<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TalkBridge</title>
<!-- STABLE ENTRY POINT.
     The manifest's start_url must never change between releases: an installed
     app launches at whatever start_url said when it was installed, forever. If
     that pointed at a build filename (bridge-turn24-base.html) the installed
     app would be pinned to that build and would 404 the moment it was rolled
     back or superseded. This file is the fixed address; it forwards to the
     current release, so an installed app always gets the current build. -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TalkBridge">
<meta name="theme-color" content="#2E8B8B">
<style>html,body{background:#FDFAF7;margin:0;height:100%}</style>
</head>
<body>
<script>
/* Preserve any hash (the iOS restore token / invite payload) across the
   forward, otherwise installing on iOS would drop the very state this
   mechanism exists to carry. */
(function () {
  var CURRENT = 'bridge-turn24-post-ship.html';
  location.replace(CURRENT + location.search + location.hash);
})();
</script>
</body>
</html>
