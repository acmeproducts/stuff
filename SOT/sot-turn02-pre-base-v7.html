<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02 v7</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e8edf2}header{position:sticky;top:0;background:#11151a;border-bottom:1px solid #303943;padding:10px 14px;z-index:3}.top{display:flex;gap:12px;align-items:center}.brand{font-weight:800}.search{flex:1;background:#191f26;border:1px solid #38424d;color:white;padding:9px;border-radius:8px}.health{font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b33;margin-right:5px}.tabs{display:flex;gap:6px;overflow:auto;padding-top:10px}.tabs button,.btn{background:#202832;color:#e8edf2;border:1px solid #3b4652;border-radius:8px;padding:8px 11px}.tabs button.on{background:#354354}main{padding:12px;max-width:1200px;margin:auto}.pane{display:none}.pane.on{display:block}.metrics{display:grid;grid-template-columns:repeat(6,minmax(100px,1fr));gap:7px;margin-bottom:10px}.metric,.card{background:#12171d;border:1px solid #2d3741;border-radius:9px;padding:10px}.metric b{display:block;font-size:18px}.picker{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.list{height:45vh;overflow:auto}.item{padding:9px;border-bottom:1px solid #28313a;cursor:pointer}.item.sel{background:#263342}.item.disabled{opacity:.48;cursor:not-allowed}.catalog{margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.source{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr 2fr;gap:6px;border-bottom:1px solid #28313a;padding:7px 0;font-size:13px}.events,.table{overflow:auto;max-height:48vh}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px;border-bottom:1px solid #28313a;text-align:left;white-space:nowrap}.muted{color:#94a0ac}.bad{color:#ff9a9a}.good{color:#8fe0a5}.toast{position:fixed;right:16px;bottom:16px;background:#202832;border:1px solid #566575;padding:10px 14px;border-radius:8px;z-index:9}.copycell{cursor:copy}.copycell:hover{background:#1b2530}@media(max-width:700px){.metrics{grid-template-columns:repeat(3,1fr)}.picker{grid-template-columns:1fr}.list{height:25vh}.source{grid-template-columns:1fr 1fr}.source span:last-child{grid-column:1/-1}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}}</style></head><body><header><div class="top"><span class="brand">SOT Turn 02 v7</span><input id="omni" class="search" placeholder="OMNISEARCH"><span class="health"><i id="dot" class="dot"></i><span id="health">Disconnected</span></span><button class="btn" onclick="configure()">⚙</button></div><div class="tabs" id="tabs"></div></header><main><section id="Estate" class="pane"></section><section id="Analyze" class="pane"></section><section id="Database" class="pane"></section><section id="Plan" class="pane"></section><section id="Activity" class="pane"></section></main><script>
const names=['Estate','Analyze','Database','Plan','Activity'];let api=localStorage.sotV5Api||new URLSearchParams(location.search).get('api')||'https://oc-ref.fell-dojo.ts.net';let selected=new Map(),volumes=[],folderPath='',folders=[],snap=null,placements=[],events=[],estates=[],activeVolume='',failCount=0;
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){n=+n||0;for(const u of ['B','KB','MB','GB','TB']){if(Math.abs(n)<1024)return n.toFixed(n<10&&u!='B'?1:0)+' '+u;n/=1024}return n.toFixed(1)+' PB'}function age(t){return t?Math.max(0,Date.now()/1000-t).toFixed(0)+'s':'—'}
async function req(path,opt={}){let ac=new AbortController(),to=setTimeout(()=>ac.abort(),5000);try{let r=await fetch(api+path,{...opt,signal:ac.signal,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||r.status);return j}finally{clearTimeout(to)}}function show(n){names.forEach(x=>{document.getElementById(x).classList.toggle('on',x==n);document.querySelector(`[data-tab="${x}"]`).classList.toggle('on',x==n)});render(n)}
document.getElementById('tabs').innerHTML=names.map(x=>`<button data-tab="${x}" onclick="show('${x}')">${x}</button>`).join('');show('Estate');
function configure(){let x=prompt('Private SOT HTTPS backend',api);if(x){api=x.replace(/\/$/,'');localStorage.sotV5Api=api;poll()}}
async function poll(){try{let h=await req('/api/health');failCount=0;document.getElementById('dot').style.background='#3dbb68';health.textContent='Connected · '+h.version;let j=await req('/api/job/latest');snap=j.snapshot;events=(await req('/api/events')).events;placements=(await req('/api/placements')).placements;estates=(await req('/api/estates')).estates;render(document.querySelector('.pane.on')?.id||'Estate')}catch(e){failCount++;document.getElementById('dot').style.background=failCount<3?'#d7a928':'#d44';health.textContent=(failCount<3?'Reconnecting':'Disconnected')+' · '+e.message}}setInterval(poll,2000);poll();
async function loadVolumes(){let j=await req('/api/volumes');volumes=j.volumes;if(activeVolume&&!volumes.some(v=>v.path===activeVolume)){activeVolume='';folderPath='';folders=[]}renderEstate()}async function browse(p){activeVolume=p;folderPath=p;let j=await req('/api/folders?path='+encodeURIComponent(p));folders=j.folders;renderEstate()}function choose(p,name){selected.set(p,{path:p,label:name||p});renderEstate()}function remove(p){selected.delete(p);renderEstate()}
function renderEstate(){let e=document.getElementById('Estate');e.innerHTML=`<div class="actions"><button class="btn" onclick="loadVolumes()">Refresh volumes</button></div><div class="picker"><div class="card"><b>Available Volumes</b><div class="list">${volumes.map(v=>`<div class="item ${activeVolume===v.path?'sel':''}" onclick="browse('${esc(v.path)}')">${esc(v.label)}<div class=muted>${esc(v.path)}</div></div>`).join('')||'<div class="item muted">Refresh to load volumes</div>'}</div></div><div class="card"><b>Folders</b><div class=muted>${esc(folderPath||'Select a volume')}</div><div class="list">${folders.filter(f=>!selected.has(f.path)).map(f=>f.estate_overlap?`<div class="item disabled" title="Already overlaps ${esc(f.estate)}">${esc(f.name)}<div class=muted>Estate: ${esc(f.estate)} · already covered</div></div>`:`<div class="item" onclick="choose('${esc(f.path)}','${esc(f.name)}')">${esc(f.name)}</div>`).join('')}</div></div><div class="card"><b>Selected Folders</b><div class="list">${[...selected.values()].map(x=>`<div class="item">${esc(x.label)}<div class=muted>${esc(x.path)}</div><button class=btn onclick="remove('${esc(x.path)}')">Remove</button></div>`).join('')||'<div class="item muted">None selected</div>'}</div><button class=btn onclick="registerSelected()">Register selected</button></div></div><div class="card catalog"><b>Estate Catalog</b><div class="table"><table><tr><th>Estate</th><th>Root</th><th>Role</th><th>Failure domain</th></tr>${estates.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.root)}</td><td>${esc(x.role)}</td><td>${esc(x.failure_domain)}</td></tr>`).join('')||'<tr><td colspan=4 class=muted>No registered estate roots.</td></tr>'}</table></div></div>`}
async function registerSelected(){for(const x of selected.values())await req('/api/sources',{method:'POST',body:JSON.stringify({label:x.label,root:x.path,failure_domain:x.path,role:'primary'})});selected.clear();alert('Sources registered.');}
function metrics(){let m=snap?.metrics||{};return `<div class=metrics>${[['Discovered',m.discovered_files],['Scanned',m.hashed_files],['Bytes',fmt(m.hashed_bytes)],['Review',m.review_count],['Reclaimable',fmt(m.reclaimable_bytes)],['State',snap?.job?.state||'IDLE']].map(x=>`<div class=metric><span class=muted>${x[0]}</span><b>${x[1]??0}</b></div>`).join('')}</div>`}
async function start(){let s=(await req('/api/sources')).sources;if(!s.length)return alert('Register at least one source in Estate.');await req('/api/job/start',{method:'POST',body:'{}'});poll()}async function ctl(x){await req('/api/job/'+x,{method:'POST',body:'{}'});poll()}
function renderAnalyze(){let e=document.getElementById('Analyze');e.innerHTML=metrics()+`<div class=actions><button class=btn onclick=start()>Start / Restart</button><button class=btn onclick="ctl('pause')">Pause</button><button class=btn onclick="ctl('resume')">Resume</button><button class=btn onclick="ctl('stop')">Stop</button></div><div class=card><b>Sources / queues / workers</b>${(snap?.sources||[]).map(s=>`<div class=source><span><b>${esc(s.label)}</b><br><span class=muted>${esc(s.producer_state)}</span></span><span>${s.hashed_files}/${s.discovered_files} files</span><span>${fmt(s.hashed_bytes)}/${fmt(s.discovered_bytes)}</span><span>Q ${s.queue_depth}/${s.queue_capacity}<br>W ${s.active_workers}</span><span>${esc(s.current_folder||'')}<br><span class=muted>${esc(s.current_file||'')} · last ${age(s.last_progress)}</span></span></div>`).join('')||'<div class=muted>No active job.</div>'}</div><div class=card><b>Live Activity</b><div class=events>${(snap?.events||[]).map(v=>`<div class=item><span class=${v.severity=='ERROR'?'bad':''}>${esc(v.event_type)}</span> · ${esc(v.message)}</div>`).join('')}</div></div>`}
function filtered(){let q=omni.value.trim().toLowerCase();return placements.filter(p=>!q||[p.placement_id,p.estate,p.filename,p.extension,p.path,p.created,p.modified,p.size,p.fingerprint,p.source_id,p.plan,p.lifecycle,p.duplicate_group,p.availability].some(v=>String(v??'').toLowerCase().includes(q)))}
function mb(n){return ((+n||0)/1048576).toFixed(2)}function ts(v){if(v==null||v==='')return '';let n=+v;return Number.isFinite(n)?new Date(n*1000).toLocaleString():String(v)}function toast(msg){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),1400)}async function copyCell(el){let v=el.dataset.copy??el.textContent;try{await navigator.clipboard.writeText(v);toast('Copied: '+v)}catch(e){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied: '+v)}}function cell(v,display=v){return `<td class="copycell" data-copy="${esc(v)}" onclick="copyCell(this)">${esc(display)}</td>`}omni.oninput=()=>render(document.querySelector('.pane.on').id);
function renderDatabase(){let a=filtered();Database.innerHTML=`<div class=card><b>Evidence Database</b><div class=muted>${a.length} rows · tap any cell to copy</div><div class=table><table><thead><tr><th>Key</th><th>Estate</th><th>Created</th><th>Modified</th><th>Size MB</th><th>Filename</th><th>Extension</th><th>Path</th><th>Fingerprint</th><th>Status</th><th>Plan</th><th>Group</th><th>Availability</th></tr></thead><tbody>${a.map(p=>`<tr>${cell(p.placement_id)}${cell(p.estate)}${cell(p.created,ts(p.created))}${cell(p.modified,ts(p.modified))}${cell(p.size,mb(p.size))}${cell(p.filename)}${cell(p.extension)}${cell(p.path)}${cell(p.fingerprint)}${cell(p.lifecycle)}${cell(p.plan)}${cell(p.duplicate_group)}${cell(p.availability)}</tr>`).join('')}</tbody></table></div></div>`}
function renderPlan(){let a=filtered();Plan.innerHTML=metrics()+`<div class=card><b>Recommended consolidation plan</b><p class=muted>Advisory only. Turn 02 performs no filesystem changes.</p><div class=table><table><tr><th>Plan</th><th>File</th><th>Path</th><th>Rationale</th></tr>${a.filter(p=>p.plan).map(p=>`<tr><td><b>${esc(p.plan)}</b></td><td>${esc(p.filename)}</td><td>${esc(p.path)}</td><td>${esc(p.rationale)}</td></tr>`).join('')}</table></div></div>`}
function renderActivity(){Activity.innerHTML=`<div class=card><b>Durable Activity</b><div class=events>${events.map(v=>`<div class=item><b>${esc(v.severity)}</b> · ${esc(v.event_type)} · ${esc(v.message)}<div class=muted>${new Date(v.ts*1000).toLocaleString()} · ${esc(v.source_id||'global')}</div></div>`).join('')}</div></div>`}
function render(n){if(n=='Estate')renderEstate();if(n=='Analyze')renderAnalyze();if(n=='Database')renderDatabase();if(n=='Plan')renderPlan();if(n=='Activity')renderActivity()}
</script></body></html>
