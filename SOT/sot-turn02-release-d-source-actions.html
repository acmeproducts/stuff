<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02 Release D · Source actions candidate</title><style>html,body,#app{width:100%;height:100%;margin:0;border:0;display:block;background:#0b0d10}</style></head><body><iframe id="app" title="SOT Turn 02 Release D"></iframe><script>
const BASE='./sot-turn02-release-d.html';
const frame=document.getElementById('app');
frame.src=BASE+location.search;
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 if(!w||!d||typeof w.renderAnalyze!=='function'||typeof w.renderAI!=='function')return;
 w.openAiCatalog=function(){w.eval('aiTaskId=null;renderAI()')};
 w.aiTaskSafeName=function(t){let x=String(t?.title||t?.task_type||'ai-task').trim().replace(/[^a-z0-9._-]+/gi,'-').replace(/^-+|-+$/g,'');return x||'ai-task'};
 w.aiTaskMarkdown=function(t){let lines=['# '+String(t.title||'AI Task'),'','- Task ID: `'+String(t.task_id||'')+'`','- Task type: `'+String(t.task_type||'')+'`','- Status: '+String(t.status||''),'- Scope: '+w.scopeCaption(t.scope)+': '+w.scopeLabel(t.scope),'- Evidence revision: '+String(t.evidence_revision??'—'),'- Created: '+(t.created?new Date(t.created*1000).toISOString():'—'),'- Updated: '+(t.updated?new Date(t.updated*1000).toISOString():'—'),'','## Transcript',''];for(const x of(t.turns||[])){lines.push('### '+String(x.role||'turn')+' — '+(x.created?new Date(x.created*1000).toISOString():'—'),'');if(x.provider||x.model)lines.push('Provider/model: '+[x.provider,x.model].filter(Boolean).join(' / '),'');lines.push(String(x.content||x.error_detail||''),'');let m=x.evidence_manifest||{};if(x.evidence_revision!=null||Object.keys(m).length)lines.push('Evidence revision: '+String(x.evidence_revision??'—'),'')}return lines.join('\n')};
 w.downloadAiTask=async function(kind){let id=w.eval('aiTaskId');if(!id)return;let t=(await w.req('/api/ai/task?id='+encodeURIComponent(id),{},8000)).task,stamp=new Date().toISOString().replace(/[:.]/g,'-'),base=w.aiTaskSafeName(t)+'-'+stamp;if(kind==='json')w.downloadBlob(base+'.json','application/json;charset=utf-8',JSON.stringify(t,null,2));else w.downloadBlob(base+'.md','text/markdown;charset=utf-8',w.aiTaskMarkdown(t));w.closeModal()};
 w.openAiDownload=function(){if(!w.eval('aiTaskId'))return;w.openModal('Download AI Task','<div class="actions"><button class="btn live" onclick="downloadAiTask(\'md\')">Markdown</button><button class="btn" onclick="downloadAiTask(\'json\')">JSON</button></div><div class="muted">Markdown contains the readable transcript and evidence context. JSON contains the complete persisted task record.</div>',null,{hideOk:true})};
 const decorateAI=()=>{let head=d.querySelector('.ai-rail-head');if(head&&!head.querySelector('.ai-new-task')){let b=d.createElement('button');b.className='btn ai-new-task';b.title='New AI task';b.setAttribute('aria-label','New AI task');b.textContent='+';b.onclick=w.openAiCatalog;head.appendChild(b)}let actions=d.querySelector('.ai-head-actions');if(actions&&!actions.querySelector('.ai-download-task')){let b=d.createElement('button');b.className='btn ai-download-task';b.textContent='Download';b.onclick=w.openAiDownload;actions.prepend(b)}};
 new MutationObserver(decorateAI).observe(d.body,{childList:true,subtree:true});decorateAI();
 const css=d.createElement('style');
 css.textContent=`
 .source-summarybar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:stretch;margin:0 0 10px}.source-summarycell{background:#12171d;border:1px solid #303943;border-radius:8px;padding:9px 10px}.source-summarycell b{display:block;font-size:18px;line-height:1.1}.source-summarycell span{display:block;color:#94a0ac;font-size:11px;margin-top:3px}.source-summarycell.need{border-color:#8e4949}.source-summarycell.run{border-color:#315d78}.source-summarycell.done{border-color:#315d42}.source-summarybar>.btn{min-width:112px;font-weight:800}.source-toolbar{display:flex;align-items:center;gap:8px;margin:3px 0 8px}.source-toolbar .muted{margin-left:auto}.sourcecard{padding:0!important;overflow:hidden}.sourcecard-summary{padding:10px 12px!important;gap:10px}.sourcecard-summary .summary-main{min-width:0}.sourcecard-summary .summary-main b{font-size:14px}.sourcecard-summary .summary-main .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-quick{display:flex;align-items:center;gap:8px;margin-left:auto}.source-quick .btn{padding:5px 9px;font-size:12px;white-space:nowrap}.sourceCardDetails{padding:0 12px 4px}.source-detail-grid.clean{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:4px 0 8px}.source-fact{background:#0f1419;border:1px solid #28313a;border-radius:7px;padding:7px 8px;min-width:0}.source-fact b{display:block;font-size:10px;color:#94a0ac;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}.source-fact span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-fact.wide{grid-column:span 2}.source-actions{padding:0 12px 10px;margin:0!important}.source-actions .danger{margin-left:auto}.status-group-summary{min-height:40px}.status-group-summary .group-copy{display:flex;align-items:baseline;gap:8px;min-width:0}.status-group-summary .group-copy small{font-weight:500;color:#94a0ac}.status-group.action-needed>.status-group-summary{border-left:3px solid #d46a6a}.status-group.running>.status-group-summary{border-left:3px solid #5c9ed1}.status-group.completed>.status-group-summary{border-left:3px solid #55c878}.estate-catalog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.estate-catalog-row .canonical-status{justify-self:end}
 @media(max-width:700px){.source-summarybar{grid-template-columns:repeat(2,minmax(0,1fr))}.source-summarybar>.btn{grid-column:1/-1;min-height:42px}.source-detail-grid.clean{grid-template-columns:repeat(2,minmax(0,1fr))}.source-fact.wide{grid-column:1/-1}.sourcecard-summary{align-items:center}.source-quick .canonical-status{display:none}.source-toolbar .muted{display:none}.status-group-summary .group-copy small{display:none}}
 `;
 d.head.appendChild(css);
 w.sourceGroupHint=function(name,n){if(name==='Action Needed')return n?(n+' need analysis'):'Nothing needs action';if(name==='Running')return n?(n+' being analyzed'):'Nothing running';if(name==='Completed')return n?(n+' current'):'None current';return n?(n+' removed'):'None removed'};
 w.statusGroupBlock=function(kind,name,rows,renderer){let set=kind==='job'?w.eval('jobGroupOpen'):w.eval('sourceGroupOpen'),open=rows.length>0&&set.has(name)?' open':'',toggle=kind==='job'?'setJobGroupOpen':'setSourceGroupOpen',cls='status-group '+name.toLowerCase().replaceAll(' ','-'),hint=kind==='source'?'<small>'+w.sourceGroupHint(name,rows.length)+'</small>':'';return '<details class="'+cls+'"'+open+' ontoggle="'+toggle+'(\''+name+'\',this.open)"><summary class="status-group-summary"><span class="group-copy"><span>'+w.esc(name)+'</span>'+hint+'</span><b>'+rows.length+'</b></summary><div class="status-group-body">'+rows.map(renderer).join('')+'</div></details>'};
 w.enqueueSources=async function(ids,label){ids=[...new Set((ids||[]).filter(Boolean))];if(!ids.length)return w.toast('No sources need analysis',3000);try{let z=await w.req('/api/job/enqueue',{method:'POST',body:JSON.stringify({source_ids:ids})},30000);await w.dataPoll();if(z.created){let n=z.queued_source_count??ids.length,extra=z.suppressed_source_count?(' · '+z.suppressed_source_count+' already covered'):'';w.toast((label||'Analysis')+' queued · '+n+' source'+(n===1?'':'s')+extra,4500)}else w.toast('No duplicate work created · requested source'+(ids.length===1?' is':'s are')+' already queued/running',4500)}catch(e){w.toast('Could not queue analysis · '+e.message,5000)}};
 w.analyzeSource=function(id){return w.enqueueSources([id],'Analysis')};
 w.analyzeNeededSources=function(){let live=w.liveJobSourceIds(),ids=(w.pendingSources()||[]).filter(x=>!live.has(x.source_id)).map(x=>x.source_id);return w.enqueueSources(ids,'Action-needed analysis')};
 w.sourceCardDetails=function(src){let files=Number(src.last_success_files||src.last_hashed_files||0),bytes=Number(src.last_success_bytes||src.last_hashed_bytes||0),success=src.last_success_ended?new Date(Number(src.last_success_ended)*1000).toLocaleString():'Never',errors=Number(src.last_errors)||0,latest=src.latest_error_message?w.esc(src.latest_error_message):'None',analysis=String(src.analysis_state||'READY').toUpperCase(),where=src.last_current_folder?w.esc(src.last_current_folder)+(src.last_current_file?' / '+w.esc(src.last_current_file):''):w.esc(src.root);return '<div class="sourceCardDetails"><div class="source-detail-grid clean"><div class="source-fact"><b>Currentness</b><span>'+w.esc(analysis)+'</span></div><div class="source-fact"><b>Last analyzed</b><span>'+w.esc(success)+'</span></div><div class="source-fact"><b>Processed</b><span>'+files.toLocaleString()+' files · '+w.fmt(bytes)+'</span></div><div class="source-fact"><b>Errors</b><span class="'+(errors?'bad':'good')+'">'+errors+'</span></div><div class="source-fact wide"><b>Root</b><span title="'+w.esc(src.root)+'">'+w.esc(src.root)+'</span></div><div class="source-fact wide"><b>Last path</b><span title="'+where+'">'+where+'</span></div>'+(errors?'<div class="source-fact wide"><b>Latest error</b><span class="bad">'+latest+'</span></div>':'')+'</div></div>'};
 w.sourceCard=function(src){let id=String(src.source_id||''),group=w.sourceStatusGroup(src),open=w.eval('sourceCardOpen').has(id)?' open':'',deleted=!!src.soft_deleted,live=group==='Running',need=group==='Action Needed',action=(deleted||live)?'':('<button class="btn '+(need?'live':'')+'" onclick="event.preventDefault();event.stopPropagation();analyzeSource(\''+w.esc(id)+'\')">'+(need?'Analyze':'Analyze again')+'</button>'),badge=w.canonicalStatusBadge(group),quick='<span class="source-quick">'+action+badge+'</span>',buttons=deleted?'<button class="btn live" onclick="event.preventDefault();sourceAction(\''+w.esc(id)+'\',\'restore\')">Restore</button><button class="btn danger" onclick="event.preventDefault();confirmSourcePurge(\''+w.esc(id)+'\')">Permanently delete</button>':(live?'<span class="muted">Analysis is already running.</span>':'')+'<button class="btn danger" onclick="event.preventDefault();sourceAction(\''+w.esc(id)+'\',\'soft-delete\')">Soft delete</button>';return '<details class="card sourcecard collapsible-card" data-source-id="'+w.esc(id)+'"'+open+' ontoggle="setSourceCardOpen(\''+w.esc(id)+'\',this.open)"><summary class="sourcecard-summary"><span class="summary-main"><b>'+w.esc(src.estate||src.label)+'</b><span class="muted">'+w.esc(src.root)+'</span></span>'+quick+'</summary>'+w.sourceCardDetails(src)+'<div class="actions source-actions">'+buttons+'</div></details>'};
 const originalRenderAnalyze=w.renderAnalyze.bind(w);
 w.renderAnalyze=function(){originalRenderAnalyze();if(w.eval('analyzeTab')!=='Sources')return;let body=d.querySelector('#Analyze .workbody');if(!body)return;let rows=w.eval('sources')||[],deleted=rows.filter(x=>x.soft_deleted).length,live=w.liveJobSourceIds(),pending=w.pendingSources(),need=pending.filter(x=>!live.has(x.source_id)).length,running=rows.filter(x=>w.sourceStatusGroup(x)==='Running').length,done=rows.filter(x=>w.sourceStatusGroup(x)==='Completed').length,toolbar=body.querySelector('.source-toolbar');if(toolbar)toolbar.innerHTML='<b>Sources</b><span class="muted">'+rows.length+' registered'+(deleted?' · '+deleted+' soft deleted':'')+'</span>';let bar=d.createElement('div');bar.className='source-summarybar';bar.innerHTML='<div class="source-summarycell need"><b>'+need+'</b><span>Need analysis</span></div><div class="source-summarycell run"><b>'+running+'</b><span>Running</span></div><div class="source-summarycell done"><b>'+done+'</b><span>Current</span></div><div class="source-summarycell"><b>'+rows.length+'</b><span>Registered</span></div><button class="btn live" '+(!need?'disabled':'')+' onclick="analyzeNeededSources()">Analyze '+need+'</button>';if(toolbar)toolbar.after(bar)};
 const originalRenderEstate=w.renderEstate.bind(w);
 w.renderEstate=function(){originalRenderEstate();if(w.eval('estateTab')!=='Catalog')return;let box=d.querySelector('#Estate .workbody');if(!box)return;let rows=w.eval('sources')||[];box.innerHTML='<b>Estate Catalog</b><div class="muted" style="margin:4px 0 8px">Registered roots and current analysis status. Run analysis from Analyze → Sources.</div>'+rows.map(s=>'<div class="item estate-catalog-row"><span><b>'+w.esc(s.estate)+'</b><div class="muted">'+w.esc(s.root)+'</div></span>'+w.canonicalStatusBadge(w.sourceStatusGroup(s))+'</div>').join('')};
 w.renderAnalyze();w.renderEstate();
});
</script></body></html>
