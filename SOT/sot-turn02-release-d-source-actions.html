<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02 Release D · Continuous SSOT</title><style>html,body,#app{width:100%;height:100%;margin:0;border:0;display:block;background:#0b0d10}</style></head><body><iframe id="app" title="SOT Turn 02 Release D"></iframe><script>
const BASE='./sot-turn02-release-d.html';
const frame=document.getElementById('app');
frame.src=BASE+location.search;
frame.addEventListener('load',()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 if(!w||!d||typeof w.renderAnalyze!=='function'||typeof w.renderAI!=='function')return;

 w.openAiCatalog=function(){w.eval('aiTaskId=null;renderAI()')};
 w.aiTaskSafeName=function(t){let x=String(t?.title||t?.task_type||'ai-task').trim().replace(/[^a-z0-9._-]+/gi,'-').replace(/^-+|-+$/g,'');return x||'ai-task'};
 w.aiTaskMarkdown=function(t){let lines=['# '+String(t.title||'AI Task'),'','- Task ID: `'+String(t.task_id||'')+'`','- Task type: `'+String(t.task_type||'')+'`','- Status: '+String(t.status||''),'- Scope: '+w.scopeCaption(t.scope)+': '+w.scopeLabel(t.scope),'- Evidence revision: '+String(t.evidence_revision??'—'),'- Created: '+(t.created?new Date(t.created*1000).toISOString():'—'),'- Updated: '+(t.updated?new Date(t.updated*1000).toISOString():'—'),'','## Transcript',''];for(const x of(t.turns||[])){lines.push('### '+String(x.role||'turn')+' — '+(x.created?new Date(x.created*1000).toISOString():'—'),'');if(x.provider||x.model)lines.push('Provider/model: '+[x.provider,x.model].filter(Boolean).join(' / '),'');lines.push(String(x.content||x.error_detail||''),'');let m=x.evidence_manifest||{};if(x.evidence_revision!=null||Object.keys(m).length)lines.push('Evidence revision: '+String(x.evidence_revision??'—'),'')}return lines.join('\n')};
 w.downloadAiTask=async function(kind){let id=w.eval('aiTaskId');if(!id)return;let t=(await w.req('/api/ai/task?id='+encodeURIComponent(id),{},8000)).task,stamp=new Date().toISOString().replace(/[:.]/g,'-'),base=w.aiTaskSafeName(t)+'-'+stamp;if(kind==='json')w.downloadBlob(base+'.json','application/json;charset=utf-8',JSON.stringify(t,null,2));else w.downloadBlob(base+'.md','text/markdown;charset=utf-8',w.aiTaskMarkdown(t));w.closeModal()};
 w.openAiDownload=function(){if(!w.eval('aiTaskId'))return;w.openModal('Download AI Task','<div class="actions"><button class="btn live" onclick="downloadAiTask(\'md\')">Markdown</button><button class="btn" onclick="downloadAiTask(\'json\')">JSON</button></div><div class="muted">Markdown contains the readable transcript and evidence context. JSON contains the complete persisted task record.</div>',null,{hideOk:true})};
 const decorateAI=()=>{let head=d.querySelector('.ai-rail-head');if(head&&!head.querySelector('.ai-new-task')){let b=d.createElement('button');b.className='btn ai-new-task';b.title='New AI task';b.setAttribute('aria-label','New AI task');b.textContent='+';b.onclick=w.openAiCatalog;head.appendChild(b)}let actions=d.querySelector('.ai-head-actions');if(actions&&!actions.querySelector('.ai-download-task')){let b=d.createElement('button');b.className='btn ai-download-task';b.textContent='Download';b.onclick=w.openAiDownload;actions.prepend(b)}};
 new MutationObserver(decorateAI).observe(d.body,{childList:true,subtree:true});decorateAI();

 const css=d.createElement('style');css.textContent=`
 .ssot-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}.ssot-head h2{font-size:16px;margin:0}.ssot-head .muted{flex:1}.ssot-head .btn{white-space:nowrap}
 .ssot-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px}.ssot-summary>div{background:#12171d;border:1px solid #303943;border-radius:8px;padding:8px 10px}.ssot-summary b{display:block;font-size:18px}.ssot-summary span{display:block;font-size:11px;color:#94a0ac;margin-top:2px}.ssot-summary .current{border-color:#315d42}.ssot-summary .syncing{border-color:#315d78}.ssot-summary .problem{border-color:#8e4949}
 .sourcecard{padding:0!important;overflow:hidden}.sourcecard-summary{padding:10px 12px!important;gap:10px}.sourcecard-summary .summary-main{min-width:0}.sourcecard-summary .summary-main b{font-size:14px}.sourcecard-summary .summary-main .muted{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-quick{display:flex;align-items:center;gap:8px;margin-left:auto}
 .sourceCardDetails{padding:0 12px 4px}.source-detail-grid.clean{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:4px 0 8px}.source-fact{background:#0f1419;border:1px solid #28313a;border-radius:7px;padding:7px 8px;min-width:0}.source-fact b{display:block;font-size:10px;color:#94a0ac;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}.source-fact span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source-fact.wide{grid-column:span 2}.source-actions{padding:0 12px 10px;margin:0!important}.source-actions .danger{margin-left:auto}
 .status-group.syncing>.status-group-summary{border-left:3px solid #5c9ed1}.status-group.current>.status-group-summary{border-left:3px solid #55c878}.status-group.problem>.status-group-summary{border-left:3px solid #d46a6a}
 .maintenance{display:inline-block}.maintenance>summary{list-style:none}.maintenance>summary::-webkit-details-marker{display:none}
 .estate-catalog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.estate-catalog-row .canonical-status{justify-self:end}
 @media(max-width:700px){.ssot-head{align-items:flex-start;flex-wrap:wrap}.ssot-head .muted{flex-basis:100%;order:3}.ssot-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.source-detail-grid.clean{grid-template-columns:repeat(2,minmax(0,1fr))}.source-fact.wide{grid-column:1/-1}.source-quick .canonical-status{display:none}}
 `;d.head.appendChild(css);

 const SOURCE_GROUPS=['Problem','Syncing','Current','Soft Deleted'];
 w.liveSourceProgress=function(id){
   let rows=w.eval('jobs')||[];
   for(const z of rows){
     let j=z?.job||{},raw=String(j.state||'').toUpperCase(),effective=String(j.effective_state||raw).toUpperCase();
     if(!['QUEUED','RUNNING','PAUSED','STOPPING','STALLED'].includes(effective)&&!['QUEUED','RUNNING','PAUSED','STOPPING'].includes(raw))continue;
     let scope=z?.scope_sources||[];
     if(!scope.some(x=>String(x.source_id)===String(id)))continue;
     let p=(z?.sources||[]).find(x=>String(x.source_id)===String(id))||{};
     return {z,j,p,raw,effective};
   }
   return null
 };
 w.sourceStatusGroup=function(src){
   if(src?.soft_deleted)return 'Soft Deleted';
   let live=w.liveSourceProgress(src?.source_id);
   if(live&&live.effective==='STALLED')return 'Problem';
   if(live)return 'Syncing';
   let errors=Number(src?.last_errors)||0,last=String(src?.last_job_state||'').toUpperCase(),analysis=String(src?.analysis_state||'').toUpperCase();
   if(errors>0||['FAILED','ERROR','INTERRUPTED','ABORTED','STOPPED'].includes(last))return 'Problem';
   if(src?.pending||['READY','STALE','RETRY'].includes(analysis))return 'Syncing';
   return 'Current'
 };
 w.sourceGroupHint=function(name,n){if(name==='Problem')return n?(n+' need attention'):'No problems';if(name==='Syncing')return n?(n+' updating automatically'):'Nothing syncing';if(name==='Current')return n?(n+' current'):'None current';return n?(n+' removed'):'None removed'};
 w.statusGroupBlock=function(kind,name,rows,renderer){let set=w.eval('sourceGroupOpen'),open=rows.length>0&&set.has(name)?' open':'',cls='status-group '+name.toLowerCase().replaceAll(' ','-');return '<details class="'+cls+'"'+open+' ontoggle="setSourceGroupOpen(\''+name+'\',this.open)"><summary class="status-group-summary"><span>'+w.esc(name)+' <small style="margin-left:8px;color:#94a0ac;font-weight:500">'+w.sourceGroupHint(name,rows.length)+'</small></span><b>'+rows.length+'</b></summary><div class="status-group-body">'+rows.map(renderer).join('')+'</div></details>'};
 w.renderSourceStatusGroups=function(rows){let groups=new Map(SOURCE_GROUPS.map(x=>[x,[]]));for(const row of rows||[])groups.get(w.sourceStatusGroup(row)).push(row);return SOURCE_GROUPS.map(name=>w.statusGroupBlock('source',name,groups.get(name),w.sourceCard)).join('')};

 w.sourceCardDetails=function(src){
   let live=w.liveSourceProgress(src.source_id),status=w.sourceStatusGroup(src),errors=Number(src.last_errors)||0,success=src.last_success_ended?new Date(Number(src.last_success_ended)*1000).toLocaleString():'Never',files=Number(src.last_success_files||src.last_hashed_files||0),bytes=Number(src.last_success_bytes||src.last_hashed_bytes||0),where=src.last_current_folder?src.last_current_folder+(src.last_current_file?' / '+src.last_current_file:''):src.root,progress='';
   if(live){
     let p=live.p||{},disc=Number(p.discovered_files)||0,hashed=Number(p.hashed_files)||0,rem=p.remaining_files!=null?Number(p.remaining_files):Math.max(0,disc-hashed),pct=disc?Math.min(100,hashed/disc*100):0,now=(p.current_folder||src.root)+(p.current_file?' / '+p.current_file:'');
     progress='<div class="source-fact"><b>Progress</b><span>'+hashed.toLocaleString()+' / '+disc.toLocaleString()+' · '+pct.toFixed(1)+'%</span></div><div class="source-fact"><b>Remaining</b><span>'+rem.toLocaleString()+'</span></div><div class="source-fact wide"><b>Now</b><span title="'+w.esc(now)+'">'+w.esc(now)+'</span></div>'
   }else progress='<div class="source-fact"><b>Last synchronized</b><span>'+w.esc(success)+'</span></div><div class="source-fact"><b>Processed</b><span>'+files.toLocaleString()+' · '+w.fmt(bytes)+'</span></div><div class="source-fact wide"><b>Last path</b><span title="'+w.esc(where)+'">'+w.esc(where)+'</span></div>';
   let problem=status==='Problem'?'<div class="source-fact wide"><b>Problem</b><span class="bad">'+w.esc(src.latest_error_message||live?.j?.state||src.last_job_state||'Synchronization could not continue')+'</span></div>':'';
   return '<div class="sourceCardDetails"><div class="source-detail-grid clean"><div class="source-fact"><b>SSOT</b><span>'+w.esc(status)+'</span></div><div class="source-fact"><b>Errors</b><span class="'+(errors?'bad':'good')+'">'+errors+'</span></div><div class="source-fact wide"><b>Root</b><span title="'+w.esc(src.root)+'">'+w.esc(src.root)+'</span></div>'+progress+problem+'</div></div>'
 };
 w.sourceCard=function(src){let id=String(src.source_id||''),group=w.sourceStatusGroup(src),open=w.eval('sourceCardOpen').has(id)?' open':'',deleted=!!src.soft_deleted,badge=w.canonicalStatusBadge(group),message=group==='Syncing'?'SOT is updating this source automatically.':group==='Problem'?'SOT cannot continue this source automatically.':'SOT is current.',buttons=deleted?'<button class="btn live" onclick="event.preventDefault();sourceAction(\''+w.esc(id)+'\',\'restore\')">Restore</button><button class="btn danger" onclick="event.preventDefault();confirmSourcePurge(\''+w.esc(id)+'\')">Permanently delete</button>':'<span class="muted">'+message+'</span><button class="btn danger" onclick="event.preventDefault();sourceAction(\''+w.esc(id)+'\',\'soft-delete\')">Soft delete</button>';return '<details class="card sourcecard collapsible-card" data-source-id="'+w.esc(id)+'"'+open+' ontoggle="setSourceCardOpen(\''+w.esc(id)+'\',this.open)"><summary class="sourcecard-summary"><span class="summary-main"><b>'+w.esc(src.estate||src.label)+'</b><span class="muted">'+w.esc(src.root)+'</span></span><span class="source-quick">'+badge+'</span></summary>'+w.sourceCardDetails(src)+'<div class="actions source-actions">'+buttons+'</div></details>'};

 w.setAnalyzeTab=function(){w.renderAnalyze()};
 w.renderAnalyze=function(){
   w.captureAnalyzeUi();
   let e=d.getElementById('Analyze'),rows=w.eval('sources')||[],deleted=rows.filter(x=>x.soft_deleted).length,problem=rows.filter(x=>w.sourceStatusGroup(x)==='Problem').length,syncing=rows.filter(x=>w.sourceStatusGroup(x)==='Syncing').length,current=rows.filter(x=>w.sourceStatusGroup(x)==='Current').length,sch=w.eval('scheduler')||{},toggle='<button class="btn '+(sch.paused?'live':'')+'" onclick="schedulerToggle()">'+(sch.paused?'Resume':'Pause')+'</button>';
   let head='<div class="ssot-head"><h2>SSOT</h2><span class="muted">SOT keeps registered sources current automatically.</span>'+toggle+'<details class="maintenance"><summary class="btn">Maintenance</summary><div class="card" style="position:absolute;right:12px;z-index:20"><button class="btn" onclick="backfillCreated()">Backfill Created</button></div></details></div>';
   let summary='<div class="ssot-summary"><div class="current"><b>'+current+'</b><span>Current</span></div><div class="syncing"><b>'+syncing+'</b><span>Syncing</span></div><div class="problem"><b>'+problem+'</b><span>Problem</span></div><div><b>'+rows.length+'</b><span>Registered'+(deleted?' · '+deleted+' removed':'')+'</span></div></div>';
   let groups='<div class="status-groups sourcequeue">'+(rows.length?w.renderSourceStatusGroups(rows):'<div class="card muted">No registered sources.</div>')+'</div>';
   e.innerHTML='<div class="workspace"><div class="workbody anbody" onscroll="analyzeScrollTop=this.scrollTop">'+head+summary+groups+'</div></div>';
   w.restoreAnalyzeUi()
 };

 const originalRenderEstate=w.renderEstate.bind(w);
 w.renderEstate=function(){originalRenderEstate();if(w.eval('estateTab')!=='Catalog')return;let box=d.querySelector('#Estate .workbody');if(!box)return;let rows=w.eval('sources')||[];box.innerHTML='<b>Estate Catalog</b><div class="muted" style="margin:4px 0 8px">Registration is standing permission for SOT to keep each source synchronized automatically.</div>'+rows.map(s=>'<div class="item estate-catalog-row"><span><b>'+w.esc(s.estate)+'</b><div class="muted">'+w.esc(s.root)+'</div></span>'+w.canonicalStatusBadge(w.sourceStatusGroup(s))+'</div>').join('')};

 w.renderAnalyze();w.renderEstate()
});
</script></body></html>
