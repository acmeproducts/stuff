function subnav(items,active,fn){return `<div class="subtabs">${items.map(x=>`<button class="btn ${x===active?'on':''}" onclick="${fn}('${x}')">${x}</button>`).join('')}</div>`}function setEstateTab(x){estateTab=x;renderEstate()}function setAnalyzeTab(x){analyzeTab=x;renderAnalyze()}function pickerScrollState(){let s={};for(const id of ['volumeList','folderTree','selectedList','pickerStrip']){let el=document.getElementById(id);if(el)s[id]={top:el.scrollTop,left:el.scrollLeft}}return s}function restorePickerScroll(s){requestAnimationFrame(()=>{for(const [id,v] of Object.entries(s)){let el=document.getElementById(id);if(el){el.scrollTop=v.top;el.scrollLeft=v.left}}})}function renderEstate(){let e=document.getElementById('Estate'),scrollState=pickerScrollState();if(!volumeLoaded&&health.textContent.startsWith('Connected')){volumeLoaded=true;loadVolumes().catch(x=>{volumeLoaded=false;toast('Volume inventory retrying')})}if(estateTab==='Catalog'){e.innerHTML=`<div class=workspace>${subnav(['Picker','Catalog'],estateTab,'setEstateTab')}<div class="workbody scrollbox card"><b>Estate Catalog</b>${sources.map(s=>`<div class=item><b>${esc(s.estate)}</b><div class=muted>${esc(s.root)}</div></div>`).join('')||'<div class="item muted">No registered Estate roots</div>'}</div></div>`;return}e.innerHTML=`<div class=workspace>${subnav(['Picker','Catalog'],estateTab,'setEstateTab')}<div class="actions"><button class=btn onclick="loadVolumes()">Refresh volumes</button></div><div class="workbody estategrid"><div id=pickerStrip class=picker><div class=card><b>Available Volumes</b><div id=volumeList class=list>${volumes.map(v=>`<div class="item ${activeVolume===v.path?'sel':''}" onclick="browse('${esc(v.path)}')">${esc(v.label)}<div class=muted>${esc(v.path)}</div></div>`).join('')||'<div class="item muted">Loading volumes…</div>'}</div></div><div class=card><b>Folder Tree</b><div class=muted>${esc(activeVolume||'Select a volume')}</div><div id=folderTree class=list onscroll="if(activeVolume)treeScroll.set(activeVolume,this.scrollTop)">${activeVolume?treeRows(activeVolume):''}</div></div><div class=card><b>Selected Estate Roots</b><div id=selectedList class=list>${[...selected.values()].map(x=>`<div class=item><b>${esc(x.label)}</b><div class=muted>${esc(x.path)}</div><button class=btn onclick="remove('${esc(x.path)}')">Remove</button></div>`).join('')||'<div class="item muted">None selected</div>'}</div><button class=btn onclick="registerSelected()">Register selected</button></div></div></div></div>`;restorePickerScroll(scrollState)}
async function registerSelected(){for(const x of selected.values())await req('/api/sources',{method:'POST',body:JSON.stringify({estate:x.label,label:x.label,root:x.path,failure_domain:x.path,role:'primary'})});selected.clear();toast('Sources registered.');renderEstate();}
function activityStrip(){let st=snap?.job?.state||'IDLE',a=snap?.activity||[];if(st==='RUNNING'&&a.length){let z=a.slice().sort((p,q)=>q.updated-p.updated)[0],pct=z.size?Math.min(100,Math.round(100*z.bytes/z.size)):0;return '<div class="liverow"><i class="pulse"></i><b>PROCESSING</b><span>Worker '+esc(z.worker)+'</span><span>'+pct+'%</span><span>'+fmt(z.bytes)+' / '+fmt(z.size)+'</span><span>'+((z.mbps||0).toFixed(1))+' MB/s</span><span class="livefile">'+esc(z.filename)+' · '+esc(z.path)+'</span><span>updated '+age(z.updated)+'</span></div>'}if(st==='RUNNING')return '<div class="liverow idle"><i class="pulse"></i><b>WAITING</b><span>No worker currently reports file activity</span></div>';if(st==='INTERRUPTED')return '<div class="liverow idle"><i class="pulse"></i><b>INTERRUPTED</b><span>Backend restarted during analysis. Start a new analysis to continue.</span></div>';return '<div class="liverow idle"><i class="pulse"></i><b>'+esc(st)+'</b><span>'+(st==='COMPLETED'?'Analysis complete':st==='PAUSED'?'Analysis paused':'No active file reported')+'</span></div>'}function metrics(){let m=snap?.metrics||{};return `<div class=metrics>${[['Discovered',m.discovered_files],['Scanned',m.hashed_files],['Bytes',fmt(m.hashed_bytes)],['Review',m.review_count],['Reclaimable',fmt(m.reclaimable_bytes)],['State',snap?.job?.state||'IDLE']].map(x=>`<div class=metric><span class=muted>${x[0]}</span><b>${x[1]??0}</b></div>`).join('')}</div>`}

function renderAnalyze(){let e=document.getElementById('Analyze'),nav=subnav(['Overview','Sources','Activity'],analyzeTab,'setAnalyzeTab');let body='';if(analyzeTab==='Overview'){let st=snap?.job?.state||'IDLE',run=st==='RUNNING',active=run||st==='STOPPING';body=metrics()+activityStrip()+'<div class="actions"><button class="btn '+(!active?'live':'')+'" '+(active?'disabled':'')+' onclick=start()>Start</button><button class="btn '+(active?'danger':'')+'" '+(!active?'disabled':'')+' onclick="ctl(\'stop\')">Stop</button></div><div class=card><b>Authoritative job</b><div class=item>State: '+esc(snap?.job?.state||'IDLE')+' · Revision: '+esc(snap?.job?.revision||'—')+' · Last progress: '+age(snap?.job?.last_progress)+'</div></div>'}if(analyzeTab==='Sources')body='<div class="card scrollbox"><b>Sources / queues / workers</b>'+((snap?.sources||[]).map(s=>'<div class=source><span><b>'+esc(s.label)+'</b><br><span class=muted>'+esc(s.producer_state)+'</span></span><span>'+s.hashed_files+'/'+s.discovered_files+' files</span><span>'+fmt(s.hashed_bytes)+'/'+fmt(s.discovered_bytes)+'</span><span>Q '+s.queue_depth+'/'+s.queue_capacity+'<br>W '+s.active_workers+'</span><span>'+esc(s.current_folder||'')+'<br><span class=muted>'+esc(s.current_file||'')+' · last '+age(s.last_progress)+'</span></span></div>').join('')||'<div class=muted>No active job.</div>')+'</div>';if(analyzeTab==='Activity')body='<div class="card scrollbox"><b>Live Activity</b>'+((snap?.events||[]).map(v=>'<div class=item><span class="'+(v.severity==='ERROR'?'bad':'')+'">'+esc(v.event_type)+'</span> · '+esc(v.message)+'</div>').join('')||'<div class=muted>No activity.</div>')+'</div>';e.innerHTML='<div class=workspace>'+nav+'<div class="workbody anbody">'+body+'</div></div>'}
function val(p,f){let map={status:'lifecycle',key:'placement_id',group:'duplicate_group'};if(f==='path'){let s=String(p.path||''),n=String(p.filename||'');if(n&&s.endsWith('/'+n))return s.slice(0,-n.length-1)||'/'}return p[map[f]||f]}function globRx(q){let z='';for(const c of String(q)){if(c==='*')z+='.*';else if(c==='?')z+='.';else z+=c.replace(/[\\^$.*+?()[\]{}|]/g,'\\$&')}return new RegExp('^'+z+'$','i')}function atomMatch(p,t){let neg=t.startsWith('-');if(neg)t=t.slice(1);if(t.startsWith('#'))t=t.slice(1);let k=t.indexOf(':'),field=k>0?t.slice(0,k).toLowerCase():null,q=k>0?t.slice(k+1):t;if(!q)return true;let wild=q.includes('*')||q.includes('?'),match=v=>wild?globRx(q).test(String(v??'')):String(v??'').toLowerCase().includes(q.toLowerCase()),hit=field?match(val(p,field)):dbFields.some(f=>match(val(p,f)));return neg?!hit:hit}function omniEl(){return document.getElementById('omni')}function filtered(){let raw=omniQuery.trim();if(!raw)return placements;let groups=raw.split(/\s+OR\s+/i).map(x=>x.match(/(?:[^\s"]+:"[^"]*"|"[^"]*"|[^\s]+)/g)||[]);return placements.filter(p=>groups.some(ts=>ts.every(t=>atomMatch(p,t.replace(/^"|"$/g,'').replace(/:"([^"]*)"$/,':$1')))))}function updateSuggest(){let omni=omniEl();if(!omni)return;let q=omni.value,cursor=omni.selectionStart??q.length,prefix=q.slice(0,cursor),m=prefix.match(/(^|\s)(-?)([\w]*)(?::([^\s]*))?$/);if(!m){suggest.classList.remove('on');return}let neg=m[2],field=m[3].toLowerCase(),value=m[4],opts=[];if(value===undefined)opts=dbFields.filter(f=>f.startsWith(field)).slice(0,12).map(f=>neg+f+':');else{let f=field;opts=[...new Set(placements.map(p=>String(val(p,f)??'')).filter(v=>v&&v.toLowerCase().includes(value.toLowerCase())))].slice(0,12).map(v=>neg+f+':'+v)}if(!opts.length){suggest.classList.remove('on');return}let r=omni.getBoundingClientRect();suggest.style.left=r.left+'px';suggest.style.top=r.bottom+'px';suggest.style.width=r.width+'px';suggest.innerHTML=opts.map(x=>'<div onmousedown="pickSuggest(\''+esc(x).replace(/'/g,"\\'")+'\')">'+esc(x)+'</div>').join('');suggest.classList.add('on')}function pickSuggest(x){let omni=omniEl();if(!omni)return;let q=omni.value,c=omni.selectionStart??q.length,start=q.slice(0,c).search(/\S+$/);if(start<0)start=c;omni.value=q.slice(0,start)+x+q.slice(c);omniQuery=omni.value;suggest.classList.remove('on');omni.focus();renderDatabase()}
function mb(n){return ((+n||0)/1048576).toFixed(2)}function ts(v){if(v==null||v==='')return 'Unavailable';let n=+v;return Number.isFinite(n)?new Date(n*1000).toLocaleString():String(v)}function toast(msg,ms=1800){let x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),ms)}async function copyCell(el){let v=el.dataset.copy??el.textContent;try{await navigator.clipboard.writeText(v);toast('Copied: '+v)}catch(e){let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied: '+v)}}function cell(v,display=v){return `<td class="copycell" data-copy="${esc(v)}" onclick="copyCell(this)">${esc(display)}</td>`}
function filenameCell(p){return `<td><div class="filecell"><span class="fname" title="Copy filename" onclick="copyText('${esc(p.filename).replace(/'/g,"\\'")}')">${esc(p.filename)}</span><button class="btn openbtn viewerlaunch" title="Open viewer" onclick="event.stopPropagation();previewFile('${esc(p.placement_id)}')">↗</button></div></td>`}function copyText(v){navigator.clipboard?.writeText(v).then(()=>toast('Copied: '+v)).catch(()=>{let t=document.createElement('textarea');t.value=v;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Copied: '+v)})}
function csvValue(v){v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadBlob(name,type,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
function exportResults(kind){let a=filtered(),stamp=new Date().toISOString().replace(/[:.]/g,'-');if(kind==='json')return downloadBlob('sot-search-'+stamp+'.json','application/json',JSON.stringify(a,null,2));let head=dbFields.map(csvValue).join(','),rows=a.map(p=>dbFields.map(f=>csvValue(p[f])).join(',')).join('\n');downloadBlob('sot-search-'+stamp+'.csv','text/csv;charset=utf-8',head+'\n'+rows)}
function closeViewer(){saveViewerBox();fileviewer.classList.remove('on');viewerId=null}function viewerRows(){return filtered()}function stepViewer(d){let a=viewerRows(),i=a.findIndex(v=>v.placement_id===viewerId);if(i<0)return;let n=i+d;if(n>=0&&n<a.length)previewFile(a[n].placement_id)}function saveViewerBox(){let r=fileviewer.getBoundingClientRect();localStorage.sotViewerBox=JSON.stringify({left:r.left,top:r.top,width:r.width,height:r.height})}function restoreViewerBox(){try{let r=JSON.parse(localStorage.sotViewerBox||'null');if(r){fileviewer.style.left=Math.max(0,Math.min(r.left,innerWidth-80))+'px';fileviewer.style.top=Math.max(0,Math.min(r.top,innerHeight-60))+'px';fileviewer.style.width=Math.min(r.width,innerWidth)+'px';fileviewer.style.height=Math.min(r.height,innerHeight)+'px'}}catch(e){}}function initViewerDrag(){viewerhead.onpointerdown=e=>{if(e.target.closest('button'))return;let r=fileviewer.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;viewerhead.setPointerCapture(e.pointerId);viewerhead.onpointermove=v=>{fileviewer.style.left=Math.max(0,v.clientX-dx)+'px';fileviewer.style.top=Math.max(0,v.clientY-dy)+'px'};viewerhead.onpointerup=()=>{viewerhead.onpointermove=null;saveViewerBox()}};new ResizeObserver(saveViewerBox).observe(fileviewer)}initViewerDrag();async function previewFile(id){try{viewerId=id;let j=await req('/api/file/info?id='+encodeURIComponent(id),{},10000),u=api+'/api/file/content?id='+encodeURIComponent(id);viewertitle.textContent=j.filename;let meta='<div class="muted">'+esc(j.filename)+' · '+esc(j.mime)+' · '+fmt(j.size)+'</div>';let body=meta;if(j.preview==='image')body+='<img class="previewimg" src="'+esc(u)+'">';else if(j.preview==='video')body+='<div id="videoWait" class="muted">Preparing video preview…</div><video class="previewvideo" controls preload="metadata" src="'+esc(u)+'" onloadedmetadata="document.getElementById(\'videoWait\')?.remove()" onerror="let w=document.getElementById(\'videoWait\');if(w)w.textContent=\'Browser cannot decode this video. Use native viewer.\'"></video>';else if(j.preview==='text'){let r=await fetch(u);body+='<pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(await r.text())+'</pre>'}else if(j.preview==='frame')body+='<iframe class="previewframe" sandbox src="'+esc(u)+'"></iframe>';else body+='<p>Preview is not supported for this file type.</p>';body+='<div class="actions"><button class="btn" onclick="openExternal(\''+esc(id)+'\')">↗ Open with OS application</button></div>';viewerbody.innerHTML=body;let a=viewerRows(),i=a.findIndex(v=>v.placement_id===id);viewerprev.disabled=i<=0;viewernext.disabled=i<0||i>=a.length-1;restoreViewerBox();fileviewer.classList.add('on')}catch(e){toast(e.message,3500)}}function confirmTrash(){if(!viewerId)return;let p=placements.find(v=>v.placement_id===viewerId);openModal('Move file to trash?','<p>'+esc(p?.filename||'file')+'</p><p>This removes the file from SOT and asks the device to move it to its Trash/Recycle Bin.</p>',async()=>{let j=await req('/api/file/delete',{method:'POST',body:JSON.stringify({id:viewerId,mode:'trash'})},15000);if(j.needs_permanent){closeModal();openModal('PERMANENTLY DELETE THIS FILE — ARE YOU SURE?','<p class="dangertext">Trash is unavailable for this device. This action permanently deletes the file and removes it from SOT.</p>',async()=>deletePermanent())}else{afterDelete(j)}})}async function deletePermanent(){let j=await req('/api/file/delete',{method:'POST',body:JSON.stringify({id:viewerId,mode:'permanent'})},15000);afterDelete(j)}function afterDelete(j){let id=viewerId;placements=placements.filter(v=>v.placement_id!==id);placementsLoadedAt=Date.now();try{localStorage.sotPlacementsCache=JSON.stringify({model:PLACEMENT_CACHE_MODEL,revision:placementsRevision,ts:placementsLoadedAt,rows:placements})}catch(e){};closeViewer();renderDatabase();toast(j.message||'File removed')}async function openExternal(id){try{let j=await req('/api/file/open',{method:'POST',body:JSON.stringify({id})},10000);toast(j.message||'Open requested')}catch(e){toast(e.message,3500)}}
const cols=[['placement_no','#'],['filename','Filename'],['size','Size MB'],['lifecycle','Status'],['plan','Plan'],['path','Path'],['created','Created'],['modified','Modified'],['estate','Estate'],['extension','Extension'],['fingerprint','Fingerprint']];const defaultWidths={placement_no:46,filename:190,size:70,lifecycle:76,plan:68,path:300,created:145,modified:145,estate:90,extension:70,fingerprint:130};function disp(p,f){if(['created','modified','last_verified','scanned_at'].includes(f))return ts(p[f]);if(f==='size')return mb(p[f]);return p[f]}function beginResize(ev,f){ev.preventDefault();ev.stopPropagation();let th=ev.currentTarget.parentElement,start=ev.clientX,w=th.getBoundingClientRect().width;function move(v){colWidths[f]=Math.max(45,w+v.clientX-start);th.style.width=colWidths[f]+'px'}function up(){localStorage.sotDbWidths=JSON.stringify(colWidths);removeEventListener('pointermove',move);removeEventListener('pointerup',up)}addEventListener('pointermove',move);addEventListener('pointerup',up)}function sortRows(a){return a.slice().sort((u,v)=>{let A=val(u,sortField),B=val(v,sortField);if(A==null)A='';if(B==null)B='';if(typeof A==='number'&&typeof B==='number')return (A-B)*sortDir;return String(A).localeCompare(String(B),undefined,{numeric:true,sensitivity:'base'})*sortDir})}function setSort(f){if(sortField===f)sortDir*=-1;else{sortField=f;sortDir=1}renderDatabase()}function sortMark(f){return sortField===f?(sortDir>0?'▲':'▼'):''}function liveActivity(){return activityStrip()}function runOmni(){let o=omniEl();if(o)omniDraft=o.value;omniQuery=omniDraft.trim();renderDatabase();requestAnimationFrame(()=>omniEl()?.focus())}function clearOmni(){omniDraft='';omniQuery='';renderDatabase();requestAnimationFrame(()=>omniEl()?.focus())}function toggleFieldMenu(){fieldMenuOpen=!fieldMenuOpen;let m=document.getElementById('fieldmenu');if(m)m.classList.toggle('on',fieldMenuOpen)}function addField(f){let o=omniEl(),q=o?.value??omniDraft,c=(o&&document.activeElement===o)?(o.selectionStart??q.length):q.length,left=q.slice(0,c),right=q.slice(c),sep=left&&!/\s$/.test(left)?' ':'';omniDraft=left+sep+'#'+f+':'+right;fieldMenuOpen=false;renderDatabase();requestAnimationFrame(()=>{let n=omniEl();n?.focus();let pos=(left+sep+'#'+f+':').length;n?.setSelectionRange(pos,pos)})}function renderDatabase(){let old=document.querySelector('#Database .dbgrid');if(old)dbScroll={left:old.scrollLeft,top:old.scrollTop};let a=sortRows(filtered()),shown=a.slice(0,600);Database.innerHTML='<div class="workspace"><div class="card dbcard"><div class=dbmeta><b>Evidence Database</b>'+liveActivity()+'<div class=dbtools><div class="searchwrap"><input id="omni" class="search" placeholder="OMNISEARCH · *.jpg · filename:*.jpg · -path:*cache* · OR" value="'+esc(omniDraft)+'"><button class="clearsearch" title="Clear search" onclick="clearOmni()">×</button></div><button class="btn querybtn" onclick="runOmni()">Go</button><div class="fieldhelper"><button class="btn querybtn" title="Column search" onclick="toggleFieldMenu()">#</button><div id="fieldmenu" class="fieldmenu'+(fieldMenuOpen?' on':'')+'">'+cols.map(([f,l])=>'<button onclick="addField(\''+f+'\')"># '+esc(l)+'</button>').join('')+'</div></div><div id="suggest" class="suggest"></div><button class=btn onclick="exportResults(\'csv\')">Export CSV</button><button class=btn onclick="exportResults(\'json\')">Export JSON</button></div><div class=muted>'+a.length+' rows'+(a.length>shown.length?' · showing first '+shown.length:'')+' · local persistent cache · resize/sort columns · tap filename to copy · ↗ viewer</div></div><div class="table dbgrid" onscroll="dbScroll={left:this.scrollLeft,top:this.scrollTop}"><table><thead><tr>'+cols.map(([f,l])=>'<th class="sorthead" onclick="setSort(\''+f+'\')" style="width:'+(colWidths[f]||defaultWidths[f]||100)+'px">'+esc(l)+'<span class="sortmark">'+sortMark(f)+'</span><i class=resize onpointerdown="beginResize(event,\''+f+'\')"></i></th>').join('')+'</tr></thead><tbody>'+shown.map(p=>'<tr>'+cols.map(([f])=>f==='filename'?filenameCell(p):cell(p[f],disp(p,f))).join('')+'</tr>').join('')+'</tbody></table></div></div></div>';let o=omniEl();o.addEventListener('focus',()=>{omniDraft=o.value});o.addEventListener('input',()=>{omniDraft=o.value});o.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();runOmni()}});requestAnimationFrame(()=>{let grid=document.querySelector('#Database .dbgrid');if(grid){grid.scrollLeft=dbScroll.left;grid.scrollTop=dbScroll.top}})}
function renderPlan(){let a=placements.filter(v=>v.availability!=='ERROR'),byfp=new Map();for(const r of a){if(!r.fingerprint)continue;let z=byfp.get(r.fingerprint)||{size:r.size||0,rows:[]};z.rows.push(r);byfp.set(r.fingerprint,z)}let unique=[...byfp.values()],bytes=unique.reduce((n,z)=>n+(z.size||0),0),groups={};for(const r of a){let k=r.estate||'Unassigned';let z=groups[k]||(groups[k]={files:0,bytes:0,unique:new Set});z.files++;z.bytes+=r.size||0;if(r.fingerprint)z.unique.add(r.fingerprint)}let rows=Object.entries(groups).sort((a,b)=>b[1].bytes-a[1].bytes);Plan.innerHTML=metrics()+`<div class=card><b>SSOT Landing Plan</b><p class=muted>Current phase: establish authoritative source evidence. TARGET is not configured yet; no landing or source disposition action is authorized.</p><div class=metrics><div class=metric><span>Unique content</span><strong>${unique.length}</strong></div><div class=metric><span>Unique bytes</span><strong>${fmt(bytes)}</strong></div><div class=metric><span>Source placements</span><strong>${a.length}</strong></div><div class=metric><span>Target</span><strong>${esc((targetCfg().configured&&targetCfg().available)?targetCfg().label||targetCfg().path:'NOT CONFIGURED')}</strong></div><div class=metric><span>Landed + verified</span><strong>0</strong></div><div class=metric><span>In play</span><strong>${a.length}</strong></div></div><h3>Source readiness</h3><div class=table><table><tr><th>Estate</th><th>Placements</th><th>Unique content</th><th>Bytes in play</th><th>State</th></tr>${rows.map(([k,z])=>`<tr><td>${esc(k)}</td><td>${z.files}</td><td>${z.unique.size}</td><td>${fmt(z.bytes)}</td><td><b>IN PLAY</b></td></tr>`).join('')}</table></div><h3>Next phase contract</h3><p>SOURCE → IN PLAY → LAND IN TARGET → VERIFY TARGET → SOURCE DISPOSITION</p><p class=muted>After independent TARGET fingerprint verification, each source placement may be governed as KEEP, COLD STORAGE, ARCHIVE with retention/optional auto-delete, or DELETE. TARGET backup policy is function renderActivity(){Activity.innerHTML=`<div class=card><b>Durable Activity</b><div class=events>${events.map(v=>`<div class=item><b>${esc(v.severity)}</b> · ${esc(v.event_type)} · ${esc(v.message)}<div class=muted>${new Date(v.ts*1000).toLocaleString()} · ${esc(v.source_id||'global')}</div></div>`).join('')}</div></div>`}
function render(n){if(n=='Estate')renderEstate();if(n=='Analyze')renderAnalyze();if(n=='Database')renderDatabase();if(n=='Plan')renderPlan();if(n=='Activity')renderActivity()}
