<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02 Release D · Report + Estate</title><style>html,body,#shell{width:100%;height:100%;margin:0;border:0;display:block;background:#0b0d10}</style></head><body><iframe id="shell" title="SOT Turn 02 Release D"></iframe><script>
const shell=document.getElementById('shell');shell.src='./sot-turn02-release-d-complete.html'+location.search;
function install(){const c=shell.contentDocument?.getElementById('shell'),o=c?.contentDocument?.getElementById('app'),w=o?.contentWindow,d=o?.contentDocument;if(!w||!d||typeof w.req!=='function'||!w.__ssotCompletePlacementRefresh)return false;if(w.__reportEstateInstalled)return true;w.__reportEstateInstalled=true;w.__reportEstateSort={key:'root',dir:1};
const css=d.createElement('style');css.textContent=`.report-summary{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:7px;margin:8px 0}.report-summary .metric{min-width:0}.report-summary .metric strong{display:block;font-size:18px}.report-summary .danger{border-color:#d46a6a;background:#32191b}.report-summary .danger strong{color:#ff9a9a}.capacity-track{position:relative;height:34px;border:1px solid #596774;border-radius:6px;background:#18212a;overflow:visible;margin:10px 0 5px}.capacity-target{position:absolute;inset:0;background:#2f9cf4}.capacity-over{position:absolute;left:100%;top:-1px;height:34px;background:#ef4444;border:1px solid #ff7777}.capacity-marker{position:absolute;right:-1px;top:-7px;height:48px;border-right:2px solid #fff}.capacity-note{font-weight:800;color:#ff9a9a;margin:7px 0}.estate-table{height:100%;overflow:auto}.estate-table th{position:sticky;top:0;background:#12171d;cursor:pointer;z-index:2}.estate-table tr.overflow td{background:#8b1f24!important;color:#fff!important;font-weight:800}.estate-table tr:nth-child(even):not(.overflow) td{background:#171d23}.estate-root{max-width:55vw;overflow:hidden;text-overflow:ellipsis}.job-status-table{height:100%;overflow:auto}.job-status-table th{position:sticky;top:0;background:#12171d;z-index:2}.status-pill{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid #566575;font-weight:800}.status-pill.running,.status-pill.queued{border-color:#5c9ed1}.status-pill.completed{border-color:#55c878}.status-pill.failed,.status-pill.interrupted{border-color:#d46a6a;color:#ffb1b1}@media(max-width:700px){.report-summary{grid-template-columns:repeat(2,minmax(130px,1fr));overflow:auto}.estate-root{max-width:48vw}}`;d.head.appendChild(css);
const esc=w.esc||((x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))),fmt=w.fmt||((n)=>(Number(n||0)/1073741824).toFixed(1)+' GB');
w.__reportEstateNav=function(mode){return '<div class="ssot-report-switch"><button class="btn '+(mode==='Report'?'on':'')+'" onclick="__reportEstateOpen(\'Report\')">Report</button><button class="btn '+(mode==='Jobs'?'on':'')+'" onclick="__reportEstateOpen(\'Jobs\')">Job Status</button></div>'};
w.__reportEstateOpen=function(mode){w.__ssotReportMode=mode==='Jobs'?'Jobs':'Report';w.__ssotBaseShow(mode==='Jobs'?'Analyze':'Plan');w.__ssotMarkReportTab();requestAnimationFrame(()=>{w.__ssotDecorateTabs();mode==='Jobs'?w.__renderJobStatus():w.__renderReportEstate()})};
w.__reportMetrics=function(){let p=w.eval('placements')||[],a=p.filter(v=>v.availability!=='ERROR'&&v.fingerprint),u=a.filter(v=>v.system_classification==='UNIQUE'),k=a.filter(v=>v.system_classification==='KEEP'),x=a.filter(v=>v.system_classification==='EXCESS');if(!u.length&&!k.length&&!x.length&&a.length){let by=new Map();for(const r of a){let z=by.get(r.fingerprint)||[];z.push(r);by.set(r.fingerprint,z)}for(const rows of by.values()){rows.sort((aa,bb)=>(aa.placement_no||0)-(bb.placement_no||0));if(rows.length===1)u.push(rows[0]);else{k.push(rows[0]);x.push(...rows.slice(1))}}}let sum=r=>r.reduce((n,v)=>n+(Number(v.size)||0),0),ub=sum(u),kb=sum(k),xb=sum(x),estate=ub+kb,t=w.eval('targetState')||{},target=Number(t.free_bytes||t.registered_free_bytes||0),deficit=Math.max(0,estate-target),open=Math.max(0,target-estate);return{u,k,x,ub,kb,xb,scanned:estate+xb,estate,target,deficit,open,configured:!!t.configured}};
w.__reportAnalysis=function(){let m=w.__reportMetrics(),def=m.configured&&m.deficit>0;return '<div class="report-summary"><div class="metric"><span>SCANNED</span><strong>'+fmt(m.scanned)+'</strong><small>UNIQUE + KEEP + EXCESS</small></div><div class="metric"><span>− EXCESS</span><strong>'+fmt(m.xb)+'</strong><small>Cleanup opportunity</small></div><div class="metric"><span>ESTATE</span><strong>'+fmt(m.estate)+'</strong><small>UNIQUE + KEEP</small></div><div class="metric"><span>TARGET</span><strong>'+(m.configured?fmt(m.target):'Not configured')+'</strong><small>Destination capacity</small></div><div class="metric '+(def?'danger':'')+'"><span>'+(def?'DEFICIT':'OPEN')+'</span><strong>'+(m.configured?fmt(def?m.deficit:m.open):'—')+'</strong><small>'+(def?'Must be removed to fit':'Capacity remaining')+'</small></div></div>'+(def?'<div class="capacity-note">'+fmt(m.deficit)+' MUST BE REMOVED FROM ESTATE TO FIT TARGET</div>':'')+(m.configured?'<div class="capacity-track"><div class="capacity-target"></div>'+(def?'<div class="capacity-over" style="width:'+Math.min(45,m.deficit/m.target*100)+'%"></div>':'')+'<div class="capacity-marker" title="Target capacity"></div></div>':'')+'<div class="plantable"><table><thead><tr><th>Stage</th><th>Files</th><th>Size</th></tr></thead><tbody><tr><td>SCANNED</td><td>'+(m.u.length+m.k.length+m.x.length).toLocaleString()+'</td><td>'+fmt(m.scanned)+'</td></tr><tr><td>− EXCESS</td><td>'+m.x.length.toLocaleString()+'</td><td>'+fmt(m.xb)+'</td></tr><tr class="total"><td>ESTATE</td><td>'+(m.u.length+m.k.length).toLocaleString()+'</td><td>'+fmt(m.estate)+'</td></tr><tr><td>TARGET</td><td>—</td><td>'+(m.configured?fmt(m.target):'—')+'</td></tr><tr class="'+(def?'bad':'good')+'"><td>'+(def?'DEFICIT':'OPEN')+'</td><td>—</td><td>'+(m.configured?fmt(def?m.deficit:m.open):'—')+'</td></tr></tbody></table></div>'};
w.__renderEstateTable=function(){let m=w.__reportMetrics(),rows=(w.eval('sources')||[]).filter(s=>!s.soft_deleted),s=w.__reportEstateSort,arr=rows.map(r=>({...r,__files:Number(r.last_success_files||r.last_hashed_files||0),__bytes:Number(r.last_success_bytes||r.last_hashed_bytes||0),__sync:Number(r.last_success_ended||0)}));arr.sort((a,b)=>{let av=s.key==='files'?a.__files:s.key==='size'?a.__bytes:s.key==='synced'?a.__sync:String(a.root||'').toLowerCase(),bv=s.key==='files'?b.__files:s.key==='size'?b.__bytes:s.key==='synced'?b.__sync:String(b.root||'').toLowerCase();return(av<bv?-1:av>bv?1:0)*s.dir});let cumulative=0,body=arr.map(r=>{cumulative+=r.__bytes;let over=m.configured&&cumulative>m.target;return '<tr class="'+(over?'overflow':'')+'"><td class="estate-root" title="'+esc(r.root)+'">'+esc(r.root)+'</td><td>'+r.__files.toLocaleString()+'</td><td>'+fmt(r.__bytes)+'</td><td>'+(r.__sync?new Date(r.__sync*1000).toLocaleString():'Never')+'</td><td>'+esc(w.sourceStatusGroup?w.sourceStatusGroup(r):(r.analysis_state||'—'))+'</td></tr>'}).join('');return '<div class="report-summary"><div class="metric"><span>ESTATE</span><strong>'+fmt(m.estate)+'</strong></div><div class="metric"><span>TARGET</span><strong>'+(m.configured?fmt(m.target):'—')+'</strong></div><div class="metric '+(m.deficit?'danger':'')+'"><span>'+(m.deficit?'DEFICIT':'OPEN')+'</span><strong>'+(m.configured?fmt(m.deficit||m.open):'—')+'</strong></div></div><div class="estate-table"><table><thead><tr><th onclick="__estateSort(\'root\')">Root</th><th onclick="__estateSort(\'files\')">Files</th><th onclick="__estateSort(\'size\')">Size</th><th onclick="__estateSort(\'synced\')">Last Synced</th><th>Status</th></tr></thead><tbody>'+body+'</tbody></table></div>'};
w.__estateSort=function(key){let s=w.__reportEstateSort;s.dir=s.key===key?-s.dir:1;s.key=key;w.__renderReportEstate()};
w.__renderReportEstate=function(){let pane=d.getElementById('Plan');if(!pane)return;let tab=w.eval('planTab');if(!['Analysis','Capacity','Operations','Estate'].includes(tab))tab='Analysis';let content='';if(tab==='Analysis')content=w.__reportAnalysis();else if(tab==='Estate')content=w.__renderEstateTable();else{w.renderPlan();let body=pane.querySelector('.planbody');content=body?body.innerHTML:''}pane.innerHTML='<div class="planworkspace">'+w.__reportEstateNav('Report')+'<div class="subtabs">'+['Analysis','Capacity','Operations','Estate'].map(x=>'<button class="btn '+(x===tab?'on':'')+'" onclick="planTab=\''+x+'\';localStorage.sotPlanTab=planTab;__renderReportEstate()">'+x+'</button>').join('')+'</div><div class="planbody">'+content+'</div></div>'};
w.__renderJobStatus=function(){let pane=d.getElementById('Analyze');if(!pane)return;let rows=(w.eval('jobs')||[]).slice();rows.sort((a,b)=>Number(b?.job?.created||0)-Number(a?.job?.created||0));let body=rows.map(z=>{let j=z.job||z,state=String(j.effective_state||j.state||'UNKNOWN').toUpperCase(),scope=(z.scope_sources||[]).map(x=>x.label||x.root||x.source_id).join(', '),progress=(z.sources||[]).reduce((n,x)=>n+Number(x.hashed_files||0),0),total=(z.sources||[]).reduce((n,x)=>n+Number(x.discovered_files||0),0);return '<tr><td><span class="status-pill '+state.toLowerCase()+'">'+esc(state)+'</span></td><td>'+esc(j.title||j.job_type||'Job')+'</td><td>'+esc(scope||'—')+'</td><td>'+(total?progress.toLocaleString()+' / '+total.toLocaleString():'—')+'</td><td>'+(j.created?new Date(Number(j.created)*1000).toLocaleString():'—')+'</td></tr>'}).join('');pane.innerHTML='<div class="workspace">'+w.__reportEstateNav('Jobs')+'<div class="workbody job-status-table"><table><thead><tr><th>Status</th><th>Job</th><th>Scope</th><th>Progress</th><th>Created</th></tr></thead><tbody>'+body+'</tbody></table></div></div>'};
w.__ssotOpenReportMode=function(mode){return w.__reportEstateOpen(mode==='Analyze'?'Jobs':'Report')};w.__ssotReportNav=function(mode){return w.__reportEstateNav(mode==='Analyze'?'Jobs':'Report')};
w.setPlanTab=function(x){w.eval('planTab='+JSON.stringify(x)+';localStorage.sotPlanTab=planTab');w.__renderReportEstate()};
requestAnimationFrame(()=>w.__renderReportEstate());return true}
const timer=setInterval(()=>{if(install())clearInterval(timer)},120);setTimeout(()=>clearInterval(timer),15000);
</script></body></html>
