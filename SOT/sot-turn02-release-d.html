function aiRailCards(){let q=aiSearch.trim().toLowerCase(),a=aiTasks.filter(x=>!q||[x.title,x.task_type,x.status,x.summary].some(v=>String(v||'').toLowerCase().includes(q)));return a.map(t=>'<div class="ai-task-card '+(t.task_id===aiTaskId?'on':'')+'" data-task-id="'+esc(t.task_id)+'" onclick="loadAiTask(\''+esc(t.task_id)+'\')"><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px"><input class="ai-card-title" value="'+esc(t.title)+'" onclick="event.stopPropagation()" onblur="saveAiCardTitle(\''+esc(t.task_id)+'\',this.value)"><button class="ai-card-delete" title="Delete task" onclick="event.stopPropagation();deleteAiTaskById(\''+esc(t.task_id)+'\')">×</button></div><div class="ai-task-meta">'+esc((aiTaskTypes[t.task_type]?.title)||t.task_type)+'</div><div class="ai-task-meta">'+scopeCaption(t.scope)+': '+esc(scopeLabel(t.scope))+'</div><div class="ai-task-status '+esc(t.status)+'">'+esc(t.status)+'</div></div>').join('')||'<div class="muted" style="padding:8px">No tasks</div>'}
function md(x){if(!x)return '';try{return DOMPurify.sanitize(marked.parse(String(x)))}catch(e){return '<pre>'+esc(x)+'</pre>'}}
function evidenceHtml(turn){let m=turn.evidence_manifest||{};if(m.scope_type==='compare_converted_files')return '<div class="ai-evidence">Converted-file evidence · '+esc(m.files??0)+' files · '+esc(m.groups??0)+' groups · ffprobe '+(m.ffprobe_available?'available':'not installed')+' · ffmpeg '+(m.ffmpeg_available?'available':'not installed')+' · signature '+esc(String(m.evidence_signature||'').slice(0,12))+'<details><summary>Comparison Sources</summary>'+((m.comparison_sources||[]).map(x=>'<div>'+esc(x)+'</div>').join(''))+'</details></div>';let ids=m.included_placement_ids||[],by=new Map(placements.map(p=>[p.placement_id,p]));let links=ids.slice(0,12).map(id=>{let p=by.get(id);return p?'<button class="btn" onclick="previewFile(\''+esc(id)+'\')">'+esc(p.filename)+'</button>':''}).join('');return '<div class="ai-evidence">Evidence r'+esc(turn.evidence_revision??'—')+' · '+esc(m.total_placements??ids.length)+' placements'+(m.truncated?' · deterministic sample':'')+(links?'<details><summary>Evidence references</summary>'+links+'</details>':'')+'</div>'}
function transcriptHtml(t){return (t.turns||[]).map(x=>{let body=x.status==='failed'?'<div class="bad">'+esc(x.error_detail||'Task failed')+'</div>':x.role==='assistant'?'<div class="ai-assistant">'+md(x.content)+'</div>':'<div class="ai-user">'+esc(x.content)+'</div>';return '<div class="ai-turn"><div class="ai-turn-meta">'+esc(x.role)+' · '+new Date(x.created*1000).toLocaleString()+'</div>'+body+evidenceHtml(x)+'</div>'}).join('')}
function proposalHtml(t){if(t.task_type!=='auto_tag'||!t.proposal)return '';let by=new Map(placements.map(p=>[p.placement_id,p])),rows=t.proposal.changes||[];return '<div class="ai-proposal"><h3>Auto Tag proposal · '+rows.length+' placements</h3><div class="muted">'+esc(t.proposal.summary||'')+' · evidence r'+esc(t.proposal.evidence_revision??t.evidence_revision)+'</div><div class="ai-proposal-list">'+rows.map(x=>{let p=by.get(x.placement_id);return '<div class="ai-proposal-row"><div><b>'+esc(p?.filename||x.placement_id)+'</b><div class="muted">Current: '+esc(tagsOf(p||{}).join(', ')||'none')+'</div></div><div><b>+ '+esc((x.add||[]).join(', ')||'none')+'</b><div>- '+esc((x.remove||[]).join(', ')||'none')+'</div><div class="muted">'+esc(x.reason||'')+'</div></div></div>'}).join('')+'</div><div class="ai-apply"><button class="btn" onclick="runAiTask(\'Refine this proposal using my latest instruction.\')">Refine</button><button class="btn live" onclick="confirmApplyAutoTag()">Apply approved tags</button></div></div>'}
function catalogHtml(){return '<div class="ai-empty"><div><h2>Launch a SOT Task</h2><div class="ai-catalog">'+AI_CATALOG.map(x=>'<button class="btn" onclick="createAiTask(\''+x[0]+'\')"><b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span></button>').join('')+'</div></div></div>'}
function renderAI(){let root=document.getElementById('AI');if(!root)return;let brief=taskById(aiTaskId);root.innerHTML='<div class="ai-workspace '+(aiRailClosed?'rail-closed':'')+'"><aside class="ai-rail"><div class="ai-rail-head"><button class="btn ai-rail-toggle" title="Collapse task rail" onclick="toggleAiRail()">'+(aiRailClosed?'›':'‹')+'</button><span class="ai-rail-title">AI Tasks · '+aiTasks.length+'</span></div><div class="ai-rail-search"><input class="search" placeholder="Search tasks" value="'+esc(aiSearch)+'" oninput="aiSearch=this.value;renderAI()"></div><div class="ai-rail-body">'+aiRailCards()+'</div></aside><section class="ai-stage" id="aiStage">'+(brief?'<div class="ai-empty">Loading task…</div>':catalogHtml())+'</section></div>';if(brief)loadAiTaskDetail(brief.task_id)}
let cmpVolumes=[],cmpActiveVolume='',cmpTreeNodes=new Map(),cmpExpanded=new Set(),cmpRoots=new Map();
function compareJobHtml(z){let a=z?.compare_jobs||[],j=a[0];if(!j)return '<div class="comparejob empty"><b>Deterministic comparison job</b><div class="muted">Choose Comparison Sources and press Go! to create a persistent job.</div></div>';let state=j.effective_status||j.status,done=['COMPLETED','FAILED','ABORTED','INTERRUPTED'].includes(j.status),active=['QUEUED','RUNNING','STOPPING'].includes(j.status),counts='Verified '+(j.verified||0)+' · Review '+(j.review||0)+' · Suspect '+(j.suspect||0)+' · Legacy '+(j.legacy_only||0)+' · Converted '+(j.converted_only||0)+' · Ambiguous '+(j.ambiguous||0),where=(j.current_path||'—')+(j.current_file?' / '+j.current_file:''),speed=j.seconds_per_media_minute==null?'—':Number(j.seconds_per_media_minute).toFixed(2)+' sec / media min';return '<div class="comparejob"><div class="jobhead"><div><b>Comparison job '+esc(String(j.compare_job_id||'').slice(0,8))+'</b><div class="muted">'+esc(j.phase||'—')+' · '+(j.scope?.roots||[]).length+' persisted source'+((j.scope?.roots||[]).length===1?'':'s')+'</div></div><span class="jobstate '+esc(String(state).toLowerCase())+'">'+esc(state)+'</span></div><div class="jobmetrics"><span>'+esc(j.files_scanned||0)+' files read</span><span>'+esc(j.media_files||0)+' media</span><span>'+esc(j.probed_files||0)+' probed</span><span>'+esc(j.validated_files||0)+' validated</span><span>'+esc(j.groups_compared||0)+' groups</span><span>'+secondsText(j.elapsed_seconds)+'</span><span>'+esc(speed)+'</span><span class="'+(state==='STALLED'?'bad':'muted')+'">last '+Math.round(j.last_progress_age||0)+'s</span></div><div class="jobwhere"><b>Now</b><span>'+esc(where)+'</span></div><div class="item"><b>Running results</b><div>'+esc(counts)+'</div></div>'+(j.error_detail?'<div class="item bad">'+esc(j.error_detail)+'</div>':'')+'<div class="actions">'+(active?'<button class="btn danger" onclick="compareJobAction(\''+esc(j.compare_job_id)+'\',\'abort-delete\')">Abort + Delete</button>':done?'<button class="btn live" onclick="compareJobAction(\''+esc(j.compare_job_id)+'\',\'restart\')">Restart</button><button class="btn danger" onclick="compareJobAction(\''+esc(j.compare_job_id)+'\',\'delete\')">Delete</button>':'')+'</div><details class="joblog"><summary>Job log · '+(j.events||[]).length+'</summary><div class="joblogrows">'+((j.events||[]).map(v=>'<div class="joblogrow"><span>'+new Date((v.ts||0)*1000).toLocaleTimeString()+'</span><b>'+esc(v.phase||v.severity)+'</b><span>'+esc(v.message)+'</span></div>').join('')||'<div class="muted">No events yet.</div>')+'</div></details></div>'}
function compareControls(z,running){if(z.task_type!=='compare_converted_files')return '';let roots=z.scope?.roots||[];return '<div class="ai-proposal"><div class="ai-proposal-row"><div><h3>Compare Converted Files</h3><div class="muted">'+roots.length+' persisted Comparison Source'+(roots.length===1?'':'s')+' · deterministic ffprobe + read-only ffmpeg validation runs as a job</div></div><button class="btn" onclick="openComparisonPicker()">Comparison Sources</button></div><div id="compareJobPanel">'+compareJobHtml(z)+'</div></div>'}
async function openComparisonPicker(){if(!aiTaskId)return;let t=taskById(aiTaskId),vs=(await req('/api/volumes',{},30000)).volumes||[];cmpVolumes=vs;cmpActiveVolume='';cmpTreeNodes=new Map();cmpExpanded=new Set();cmpRoots=new Map((t?.scope?.roots||[]).map(x=>[x,{path:x,label:x.split('/').filter(Boolean).pop()||x}]));openModal('Comparison Sources',comparisonPickerHtml(),null,{wide:true,hideOk:true,hideCancel:true});renderComparisonPicker()}
function comparisonPickerHtml(){return '<button class="tag-modal-x" type="button" aria-label="Cancel source selection" title="Cancel" onclick="closeModal()">×</button><div class="picker cmp-picker"><div class="card"><b>Available Volumes</b><div id="cmpVolList" class="list"></div></div><div class="card"><b>FOLDER SEARCH</b><div class="folder-search-head"><div class="folder-search-wrap"><input id="cmpFolderSearch" class="search" placeholder="#folder:*video*  #file:*.mp4" value="'+esc(folderSearchDraftComparison)+'" oninput="setFolderSearchDraft(\'comparison\',this.value)" onkeydown="folderSearchInputKey(event,\'comparison\')"><button class="folder-search-clear" type="button" title="Clear search" onclick="clearFolderSearchInput(\'comparison\')">×</button></div><button class="btn" onclick="openFolderSearch(\'comparison\')">Search</button></div><b>Folder Tree</b><div id="cmpPath" class="muted">Select a volume</div><div id="cmpFolderTree" class="list"></div></div><div class="card"><b>Comparison Sources</b><div id="cmpSelected" class="list"></div><div class="actions"><button class="btn live" id="cmpGo" onclick="commitComparisonJob()">Go!</button></div><div class="muted">Go! persists this exact path list as a new job snapshot. × cancels this draft.</div></div></div>'}
function renderComparisonPicker(){let vl=document.getElementById('cmpVolList'),ft=document.getElementById('cmpFolderTree'),sl=document.getElementById('cmpSelected'),pe=document.getElementById('cmpPath'),go=document.getElementById('cmpGo');if(vl)vl.innerHTML=cmpVolumes.map((v,i)=>'<div class="item '+(cmpActiveVolume===v.path?'sel':'')+' '+(!v.available?'volume-unavailable':'')+'" onclick="cmpChooseVolume('+i+')">'+esc(v.label)+'<div class="muted">'+esc(volumeDetail(v))+'</div></div>').join('');if(pe)pe.textContent=cmpActiveVolume||'Select a volume';if(ft)ft.innerHTML=cmpActiveVolume?cmpTreeRows(cmpActiveVolume):'';if(sl)sl.innerHTML=[...cmpRoots.values()].map(r=>'<div class="item"><b>'+esc(r.label)+'</b><div class="muted">'+esc(r.path)+'</div><button class="btn" onclick="removeComparisonRoot(\''+esc(r.path).replace(/'/g,"\\'")+'\')">Remove</button></div>').join('')||'<div class="item muted">None selected</div>';if(go)go.disabled=!cmpRoots.size}
async function cmpChooseVolume(i){let v=cmpVolumes[i];if(!v||!v.available)return toast(v?.mount_error||'Volume unavailable',3500);triggerVolumeFreshness(v.path);cmpActiveVolume=v.path;if(!cmpTreeNodes.has(v.path)){let z=await req('/api/folders?path='+encodeURIComponent(v.path),{},30000);cmpTreeNodes.set(v.path,z.folders||[])}renderComparisonPicker()}
async function cmpToggle(path){if(cmpExpanded.has(path))cmpExpanded.delete(path);else{cmpExpanded.add(path);if(!cmpTreeNodes.has(path)){let z=await req('/api/folders?path='+encodeURIComponent(path),{},30000);cmpTreeNodes.set(path,z.folders||[])}}renderComparisonPicker()}
function cmpTreeRows(parent,depth=0){let kids=cmpTreeNodes.get(parent)||[];return kids.map(f=>{let open=cmpExpanded.has(f.path),exact=cmpRoots.has(f.path);return '<div class="item" style="padding-left:'+(8+depth*16)+'px;display:flex;align-items:center;gap:6px"><button class="btn" onclick="event.stopPropagation();cmpToggle(\''+esc(f.path).replace(/'/g,"\\'")+'\')">'+(open?'▾':'▸')+'</button><span style="flex:1" onclick="cmpToggle(\''+esc(f.path).replace(/'/g,"\\'")+'\')">'+esc(f.name)+'</span><button class="btn foldergo" '+(exact?'disabled':'')+' onclick="event.stopPropagation();addComparisonRoot(\''+esc(f.path).replace(/'/g,"\\'")+'\',false)">&gt;</button></div>'+(open?cmpTreeRows(f.path,depth+1):'')}).join('')}
function addComparisonRoot(path){if(cmpRoots.has(path))return;cmpRoots.set(path,{path,label:path.split('/').filter(Boolean).pop()||path});renderComparisonPicker()}
function removeComparisonRoot(path){cmpRoots.delete(path);renderComparisonPicker()}
async function commitComparisonJob(){if(!aiTaskId||!cmpRoots.size)return;let scope={type:'compare_converted_files',roots:[...cmpRoots.keys()]},z=await req('/api/ai/compare/enqueue',{method:'POST',body:JSON.stringify({task_id:aiTaskId,scope})},15000);let i=aiTasks.findIndex(x=>x.task_id===aiTaskId);if(i>=0)aiTasks[i]=z.task;closeModal();toast('Comparison job '+String(z.job?.compare_job_id||'').slice(0,8)+' queued',3500);loadAiTaskDetail(aiTaskId)}
async function compareJobAction(id,action){let z=await req('/api/ai/compare/control',{method:'POST',body:JSON.stringify({compare_job_id:id,action})},15000);if(action==='restart'&&z.job)toast('Comparison restart queued',2500);await refreshCompareJobPanel()}
async function refreshCompareJobPanel(){if(!aiTaskId||taskById(aiTaskId)?.task_type!=='compare_converted_files'||document.querySelector('.pane.on')?.id!=='AI')return;try{let z=await req('/api/ai/compare/jobs?task_id='+encodeURIComponent(aiTaskId),{},8000),t=taskById(aiTaskId);if(t)t.compare_jobs=z.jobs||[];let p=document.getElementById('compareJobPanel');if(p)p.innerHTML=compareJobHtml({compare_jobs:z.jobs||[]})}catch(e){}}
async function loadAiTaskDetail(id){let z;try{z=(await req('/api/ai/task?id='+encodeURIComponent(id),{},8000)).task}catch(e){return toast(e.message,3000)}if(aiTaskId!==id)return;let idx=aiTasks.findIndex(x=>x.task_id===id);if(idx>=0)aiTasks[idx]={...aiTasks[idx],...z};let stage=document.getElementById('aiStage');if(!stage)return;let running=['analyzing','applying'].includes(z.status),draftPrompt=(z.turns||[]).length?'':defaultTaskPrompt(z.task_type),scopeText=scopeLabel(z.scope),scopeName=scopeCaption(z.scope),isCompare=z.task_type==='compare_converted_files',hasCompare=!isCompare||(z.compare_jobs||[]).some(x=>x.status==='COMPLETED');stage.innerHTML='<div class="ai-stage-head"><div><input class="ai-title-input" value="'+esc(z.title)+'" onblur="saveAiTitle(this.value)"><div class="ai-head-meta">'+esc((aiTaskTypes[z.task_type]?.title)||z.task_type)+' · '+scopeName+': '+esc(scopeText)+' · evidence r'+esc(z.evidence_revision??'—')+' · '+esc(z.status)+'</div></div><div class="ai-head-actions"><button class="btn danger" '+(running?'disabled':'')+' onclick="deleteAiTask()">Delete</button></div></div><div class="ai-transcript">'+compareControls(z,running)+proposalHtml(z)+transcriptHtml(z)+'</div><div class="ai-compose"><textarea id="aiPrompt" placeholder="'+(isCompare?'Ask about the latest completed deterministic comparison…':'Ask, refine, exclude, or rerun this task…')+'" '+(running?'disabled':'')+'>'+esc(draftPrompt)+'</textarea><button class="btn live" '+(running||!hasCompare?'disabled':'')+' onclick="runAiTask()">'+(running?'<span class="ai-running"></span>Running':isCompare?'Send':'Run')+'</button><div class="ai-compose-status">'+(z.error_detail?'<span class="bad">'+esc(z.error_detail)+'</span>':running?'AI response is running independently; you can navigate away.':isCompare?(hasCompare?'Send discusses the latest completed deterministic evidence. It does not rescan files.':'Run Comparison Sources → Go! before sending AI questions.'):'Scope is the shared Database/Grid search. Blank search means Entire SOT.')+'</div></div>';let tr=stage.querySelector('.ai-transcript');if(tr)tr.scrollTop=tr.scrollHeight}
async function createAiTask(type){let scope=type==='compare_converted_files'?{type:'compare_converted_files',roots:[]}:buildAiScope(),z=await req('/api/ai/task/create',{method:'POST',body:JSON.stringify({task_type:type,scope})},8000);aiTasks.unshift(z.task);aiTaskId=z.task.task_id;renderAI()}
async function saveAiTitle(title){if(!aiTaskId)return;let z=await req('/api/ai/task/title',{method:'POST',body:JSON.stringify({task_id:aiTaskId,title})});let i=aiTasks.findIndex(x=>x.task_id===aiTaskId);if(i>=0)aiTasks[i]=z.task;renderAI()}
async function saveAiCardTitle(id,title){let z=await req('/api/ai/task/title',{method:'POST',body:JSON.stringify({task_id:id,title})});let i=aiTasks.findIndex(x=>x.task_id===id);if(i>=0)aiTasks[i]=z.task;if(document.querySelector('.pane.on')?.id==='AI')renderAI()}
function deleteAiTaskById(id){let t=taskById(id);openModal('Delete AI Task','<p>Delete <b>'+esc(t?.title||'this task')+'</b> and its durable transcript?</p>',async()=>{await req('/api/ai/task/delete',{method:'POST',body:JSON.stringify({task_id:id})});aiTasks=aiTasks.filter(x=>x.task_id!==id);if(aiTaskId===id)aiTaskId=null;renderAI()},{ok:'Delete',danger:true})}
async function deleteAiTask(){if(aiTaskId)deleteAiTaskById(aiTaskId)}
async function runAiTask(override){if(!aiTaskId)return;let cfg=activeAiConfig();if(!cfg.api_key||!cfg.model)return openModal('AI Configuration Required','<p>Configure an API key and model in Settings before sending this AI request.</p>',async()=>{closeModal();configure()},{ok:'Open Settings'});let task=taskById(aiTaskId),p=document.getElementById('aiPrompt'),prompt=override||p?.value.trim()||defaultTaskPrompt(task?.task_type),scope=task?.task_type==='compare_converted_files'?{type:'compare_converted_files',roots:[...(task.scope?.roots||[])]}:buildAiScope();try{let z=await req('/api/ai/task/run',{method:'POST',body:JSON.stringify({task_id:aiTaskId,prompt,provider:cfg.provider,model:cfg.model,api_key:cfg.api_key,scope})},12000);let i=aiTasks.findIndex(x=>x.task_id===aiTaskId);if(i>=0)aiTasks[i]=z.task;renderAI();aiPoll()}catch(e){toast('AI message could not start: '+e.message,5000)}}
function confirmApplyAutoTag(){if(!aiTaskId)return;let t=taskById(aiTaskId);openModal('Apply Auto Tag proposal','<p>Apply the reviewed owner-tag proposal through the governed metadata engine?</p><p class="muted">System classification cannot be changed. A stale evidence revision will be rejected.</p>',async()=>{toast('Updating Database and report…',4000);let z=await req('/api/ai/task/apply',{method:'POST',body:JSON.stringify({task_id:aiTaskId,approval_note:'Explicit owner approval from Release C UI'})},60000);await refreshAfterMutation({catalog_revision:z.task.evidence_revision},false);await loadAiTasks(true);await loadAiTask(aiTaskId);toast('Auto Tag applied · Database and report refreshed',4000)},{ok:'Apply tags'})}
async function aiPoll(){let running=aiTasks.filter(x=>['analyzing','applying'].includes(x.status)),before=new Map(aiTasks.map(x=>[x.task_id,x.status]));if(running.length){await loadAiTasks(true,false);for(const t of aiTasks){let card=document.querySelector('.ai-task-card[data-task-id="'+CSS.escape(t.task_id)+'"] .ai-task-status');if(card){card.textContent=t.status;card.className='ai-task-status '+t.status}}if(aiTaskId&&before.get(aiTaskId)!==taskById(aiTaskId)?.status&&document.querySelector('.pane.on')?.id==='AI')loadAiTaskDetail(aiTaskId)}await refreshCompareJobPanel()}

function renderActivity(){Activity.innerHTML=`<div class=card><b>Durable Activity</b><div class=events>${events.map(v=>`<div class=item><b>${esc(v.severity)}</b> · ${esc(v.event_type)} · ${esc(v.message)}<div class=muted>${new Date(v.ts*1000).toLocaleString()} · ${esc(v.source_id||'global')}</div></div>`).join('')}</div></div>`}
function render(n){if(n=='Estate')renderEstate();if(n=='Analyze')renderAnalyze();if(n=='Database')renderDatabase();if(n=='Grid')renderGrid();if(n=='Plan')renderPlan();if(n=='AI')renderAI();if(n=='Activity')renderActivity()}
</script></body></html>
