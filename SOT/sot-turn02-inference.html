<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02 — Inference Gate</title><style>body{font:15px system-ui;margin:0;background:#0b0d10;color:#e8edf2}main{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end}.pass{color:#69d58b}.muted{color:#9aa6b2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:20px 0}.card,section{background:#151a20;border:1px solid #2a333d;border-radius:10px;padding:14px}.n{font-size:26px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #29313a;vertical-align:top}code{font-size:12px}.KEEP{color:#7dd3fc}.PROTECT{color:#86efac}.REMOVE{color:#fca5a5}.REVIEW{color:#fcd34d}.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.gate{padding:10px;border:1px solid #26303a;border-radius:7px}.gate b{color:#69d58b}@media(max-width:700px){main{padding:14px}table{font-size:11px}.hide{display:none}}</style></head><body><main><div class="top"><div><h1>SOT Turn 02 — Inference Qualification</h1><div class="muted">Known-truth synthetic estate · clean lineage · non-destructive</div></div><strong class="pass">12 / 12 PASS</strong></div><div class="cards"><div class="card"><div class="n">24</div>Placements</div><div class="card"><div class="n">12</div>Content objects</div><div class="card"><div class="n">7</div>Duplicate groups</div><div class="card"><div class="n KEEP">11</div>KEEP</div><div class="card"><div class="n PROTECT">5</div>PROTECT</div><div class="card"><div class="n REMOVE">5</div>REMOVE</div><div class="card"><div class="n REVIEW">3</div>REVIEW</div><div class="card"><div class="n">36 B</div>Reclaimable</div></div><section><h2>Mechanical gates</h2><div class="gates" id="gates"></div></section><section><h2>Consolidation decisions</h2><table><thead><tr><th>Decision</th><th>Authority</th><th>Path</th><th class="hide">Role</th><th>Reason</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const decisions=[['PROTECT','B','/backup/video/v.mp4','backup','required independent backup placement'],['REMOVE','C','/cloud/video/v.mp4','source','exact-content placement redundant after canonical/protection requirements'],['REMOVE','C','/phone/video/v2.mp4','source','exact-content placement redundant after canonical/protection requirements'],['KEEP','A','/primary/video/v.mp4','canonical','explicit canonical placement'],['PROTECT','B','/backup/music/song.flac','backup','required independent backup placement'],['KEEP','A','/primary/music/song.flac','canonical','explicit canonical placement'],['KEEP','B','/backup/unique/b.bin','backup','unique content retained'],['PROTECT','B','/backup/work/report.docx','backup','required independent backup placement'],['REVIEW','C','/cloud/report.docx','source','placement evidence unavailable/stale; unsafe to decide'],['KEEP','A','/primary/work/report.docx','canonical','explicit canonical placement'],['KEEP','A','/primary/notes/same.txt','canonical','unique content retained'],['KEEP','C','/phone/unique/c.bin','source','unique content retained'],['PROTECT','B','/backup/docs/tax.txt','backup','required independent backup placement'],['KEEP','A','/primary/docs/tax.txt','canonical','explicit canonical placement'],['REMOVE','C','/sync/tax-copy.txt','source','exact-content placement redundant after canonical/protection requirements'],['KEEP','A','/primary/unique/a.bin','canonical','unique content retained'],['REMOVE','C','/phone/DCIM/a-renamed.jpg','source','exact-content placement redundant after canonical/protection requirements'],['KEEP','A','/primary/photos/a.jpg','canonical','explicit canonical placement'],['REVIEW','C','/cloud/ambiguous/x-copy.dat','source','no unique canonical placement established'],['REVIEW','A','/primary/ambiguous/x.dat','source','no unique canonical placement established'],['PROTECT','B','/backup/archive/manual.pdf','backup','required independent backup placement'],['REMOVE','C','/cloud/manual-copy.pdf','source','exact-content placement redundant after canonical/protection requirements'],['KEEP','A','/primary/archive/manual.pdf','canonical','explicit canonical placement'],['KEEP','B','/backup/notes/same.txt','backup','unique content retained']];const gates=['Content identity: 12 known content objects','Placement accounting: all 24 accounted for exactly once','Duplicate inference: 7 known duplicate groups','KEEP classification: exactly 11','PROTECT classification: exactly 5','REMOVE classification: exactly 5','REVIEW classification: exactly 3','Protection safety: PROTECT excluded from reclaimable waste','Reclamation arithmetic: exactly 36 bytes','Determinism: repeated identical evidence produces identical decision content','Explainability: every placement has a reason','Non-destructive: no copy, move, rename or delete'];document.querySelector('#gates').innerHTML=gates.map((x,i)=>`<div class="gate"><b>PASS ${i+1}</b> · ${x}</div>`).join('');document.querySelector('#rows').innerHTML=decisions.map(d=>`<tr><td class="${d[0]}"><b>${d[0]}</b></td><td>${d[1]}</td><td><code>${d[2]}</code></td><td class="hide">${d[3]}</td><td>${d[4]}</td></tr>`).join('');</script></body></html>
