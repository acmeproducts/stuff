<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOT Turn 02</title><style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#0d1014;color:#e9eef4}header{height:58px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid #29323c;background:#151a20}header b{font-size:20px}.status{margin-left:auto}.ok{color:#72dc91}.bad{color:#ff8d8d}main{max-width:1200px;margin:auto;padding:18px}.bar,.cards,section{margin-bottom:14px}.bar{display:flex;gap:8px;flex-wrap:wrap}input,select,button{background:#1a2027;color:#eef;border:1px solid #35414d;border-radius:7px;padding:10px}input{min-width:220px;flex:1}button{cursor:pointer}button.primary{font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.card,section{background:#151a20;border:1px solid #29323c;border-radius:9px;padding:13px}.n{font-size:24px;font-weight:700}.sources{display:grid;gap:7px}.source{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;border-bottom:1px solid #28313a;padding:8px 0}.muted{color:#9da9b5;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #29323c}.KEEP{color:#7dd3fc}.PROTECT{color:#86efac}.REMOVE{color:#fca5a5}.REVIEW{color:#fcd34d}dialog{background:#151a20;color:#eee;border:1px solid #3b4652;border-radius:10px;max-width:560px;width:94%}dialog .row{display:flex;gap:8px;margin:9px 0}dialog input{width:100%}@media(max-width:650px){main{padding:10px}.source{grid-template-columns:1fr auto}.source .muted{grid-column:1/-1}table{font-size:11px}.hide{display:none}}</style></head><body><header><b>SOT Turn 02</b><span>Global Storage Truth</span><span id="status" class="status bad">Backend disconnected</span></header><main><div class="bar"><input id="api" placeholder="Backend URL, e.g. http://100.x.x.x:8765"><button onclick="connect()">Connect</button><button onclick="add.showModal()">+ Add Source</button><button class="primary" onclick="analyze()">Analyze Estate</button></div><div class="cards"><div class="card"><div class="n" id="placements">—</div>Placements</div><div class="card"><div class="n" id="objects">—</div>Unique content</div><div class="card"><div class="n" id="bytes">—</div>Observed</div><div class="card"><div class="n REMOVE" id="reclaim">—</div>Reclaimable</div><div class="card"><div class="n REVIEW" id="review">—</div>Review</div></div><section><h2>Storage Estate</h2><div id="sources" class="sources"><span class="muted">Connect backend to load storage sources.</span></div></section><section><h2>Consolidation Plan</h2><div id="job" class="muted"></div><table><thead><tr><th>Decision</th><th>Source</th><th>Path</th><th class="hide">Size</th><th>Reason</th></tr></thead><tbody id="plan"></tbody></table></section></main><dialog id="add"><h2>Add Storage Source</h2><div class="row"><input id="name" placeholder="Name (e.g. Primary SSD)"></div><div class="row"><input id="path" placeholder="WSL path (e.g. /mnt/d/Photos)"></div><div class="row"><select id="role"><option value="source">Source</option><option value="canonical">Canonical</option><option value="backup">Backup / Protection</option></select><input id="domain" placeholder="Failure domain (e.g. SSD-D)"></div><div class="row"><button onclick="add.close()">Cancel</button><button class="primary" onclick="saveSource()">Add Source</button></div></dialog><script>let A=localStorage.sotApi||'';api.value=A;const fmt=n=>n==null?'—':n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB';async function q(p,o){let r=await fetch(A+p,o);let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}async function connect(){A=api.value.replace(/\/$/,'');localStorage.sotApi=A;try{await q('/api/health');status.textContent='Backend connected';status.className='status ok';await refresh()}catch(e){status.textContent='Backend disconnected';status.className='status bad'}}async function refresh(){let [s,p]=await Promise.all([q('/api/sources'),q('/api/plan')]);sources.innerHTML=s.length?s.map(x=>`<div class="source"><div><b>${x.name}</b><div class="muted">${x.path}</div></div><span>${x.role}</span><span class="muted">${x.failure_domain}</span><button onclick="del('${x.id}')">×</button></div>`).join(''):'<span class="muted">No sources registered.</span>';let z=p.summary;placements.textContent=z.placements;objects.textContent=z.contentObjects;bytes.textContent=fmt(z.observedBytes);reclaim.textContent=fmt(z.reclaimableBytes);review.textContent=z.counts.REVIEW;plan.innerHTML=p.decisions.map(x=>`<tr><td class="${x.decision}"><b>${x.decision}</b></td><td>${x.source_name}</td><td>${x.path}</td><td class="hide">${fmt(x.size)}</td><td>${x.reason}</td></tr>`).join('')}async function saveSource(){try{await q('/api/sources',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,path:path.value,role:role.value,failure_domain:domain.value})});add.close();await refresh()}catch(e){alert(e.message)}}async function del(id){if(confirm('Remove this source registration? Files are not deleted.')){await q('/api/sources/'+id,{method:'DELETE'});refresh()}}async function analyze(){try{let j=await q('/api/analyze',{method:'POST'});job.textContent='Analyzing storage estate…';let t=setInterval(async()=>{let a=await q('/api/jobs'),x=a.find(y=>y.id===j.id);if(x)job.textContent=x.state==='scanning'?`Scanning sources ${x.done}/${x.total}…`:x.state;if(x&&['complete','failed'].includes(x.state)){clearInterval(t);await refresh()}},700)}catch(e){alert(e.message)}}if(A)connect();</script></body></html>
