 w.__ssotEstateKey={root:r=>r.root,files:r=>r.files,size:r=>r.bytes,synced:r=>r.synced,status:r=>r.status};

  return '<div class="plansec card">'+sum+'<div class="estate-wrap"><table class="estate-table"><thead><tr>'+th('root','Root','28%')+th('files','Files','10%')+th('size','Size','18%')+th('synced','Last Synced','25%')+th('status','Status','19%')+'</tr></thead><tbody>'+body+'</tbody></table></div>'+(rows.some(r=>r.beyond)?'<div class="estate-note">Red = beyond TARGET capacity in root order · not a delete list</div>':'')+'</div>'};
 const baseRenderPlan=typeof w.renderPlan==='function'?w.renderPlan.bind(w):null;
 w.renderPlan=function(){
  let pane=d.getElementById('Plan');if(!pane)return;let tab=w.eval('planTab');if(!w.__ssotPlanTabs.includes(tab))tab='Analysis';

 let ownerUiScheduled=false;const ownerUiObserver=new MutationObserver(()=>{if(ownerUiScheduled)return;ownerUiScheduled=true;requestAnimationFrame(()=>{ownerUiScheduled=false;w.__ssotDecorateTabs();if(d.getElementById('Plan')?.classList.contains('on')){w.__ssotDecorateReportSurface('Report');w.__ssotDecorateReportRows()}if(d.getElementById('Analyze')?.classList.contains('on'))w.__ssotDecorateReportSurface('Analyze');if(d.getElementById('Database')?.classList.contains('on')||d.getElementById('Grid')?.classList.contains('on'))w.__ssotDecorateSearchSurface();if(d.querySelector('.config-tabs'))w.__ssotDecorateConfig()})});

 w.loadPlacements=async function(force=false){if(w.__ssotPlacementBusy){if(force)w.__ssotPlacementPending=true;return}let current=Number(w.eval('placements.length'))||0;if(!force&&current)return;w.__ssotPlacementBusy=true;w.__ssotSetRefreshBlocker(true);try{if(force){try{let freshness=await w.req('/api/ssot/refresh-staleness',{method:'POST',body:'{}'},120000);if(freshness.errors?.length)w.toast('Freshness check completed with '+freshness.errors.length+' source error(s)',3500)}catch(e){w.toast('Freshness check unavailable; loading database',3000)}}let rows=[],after=0,rev=null,total=null,pages=0;while(true){let z=await w.req('/api/placements/page?after='+encodeURIComponent(after)+'&limit=5000',{},30000);if(!z||!z.ok)throw Error(z?.error||'Placement page failed');if(rev!==null&&z.catalog_revision!==rev){w.__ssotPlacementPending=true;break}rev=z.catalog_revision;total=Number(z.total);let page=z.placements||[];rows.push(...page);pages++;if(!z.has_more)break;let next=Number(z.next_after);if(!Number.isFinite(next)||next<=after||pages>10000)throw Error('Placement paging did not advance');after=next}if(!w.__ssotPlacementPending){if(Number.isFinite(total)&&rows.length!==total)throw Error('Placement paging incomplete: '+rows.length+' / '+total);w.__ssotApplyPlacements(rows,rev);w.__ssotPlacementFails=0}}catch(e){w.__ssotPlacementFails=(w.__ssotPlacementFails||0)+1;if(w.__ssotPlacementFails<=3){w.toast('Database data retrying',2500);w.__ssotPlacementPending=true}else{w.__ssotPlacementFails=0;w.toast('Database load failed: '+(e&&e.message||e),6000)}}finally{w.__ssotPlacementBusy=false;if(w.__ssotPlacementPending){w.__ssotPlacementPending=false;setTimeout(()=>w.loadPlacements(true),100)}else w.__ssotSetRefreshBlocker(false)}};
 w.__ssotSetRefreshBlocker(true);if(baseShow)baseShow('Plan');requestAnimationFrame(()=>{w.__ssotDecorateTabs();w.__ssotDecorateReportSurface('Report');w.__ssotDecorateReportRows()});w.loadPlacements(true);return true
