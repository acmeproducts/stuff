 w.__ssotLoadLog=async function(){let box=d.getElementById('ssotLogBox'),status=d.getElementById('ssotLogStatus');try{let z=await w.req('/api/diagnostics/log?limit=3000',{},10000);w.__ssotLogText=(z.lines||[]).join('\n');if(box)box.textContent=w.__ssotLogText||'No log entries.';if(status)status.textContent=z.publish?.configured?(z.publish.last_error?'GitHub log sync error: '+z.publish.last_error:'GitHub log sync enabled'):'GitHub log sync waiting for the private diagnostics repository checkout.'}catch(e){if(box)box.textContent='Log unavailable: '+e.message}};
 w.__ssotCopyLog=async function(){try{await navigator.clipboard.writeText(w.__ssotLogText||'');w.toast('Log copied')}catch(e){w.toast('Copy failed: '+e.message,3500)}};
 w.__ssotDownloadLog=function(){w.downloadBlob('sot-release-d-log-'+new Date().toISOString().replace(/[:.]/g,'-')+'.jsonl','application/x-ndjson;charset=utf-8',w.__ssotLogText||'')};
 w.__ssotClearLog=async function(){try{await w.req('/api/diagnostics/log/clear',{method:'POST',body:'{}'},10000);await w.__ssotLoadLog();w.toast('Runtime log cleared')}catch(e){w.toast('Clear failed: '+e.message,3500)}};
 w.__ssotDecorateConfig=function(){let tabs=d.querySelector('.config-tabs');if(!tabs||tabs.querySelector('[data-config-tab="Log"]'))return;let b=d.createElement('button');b.className='btn';b.dataset.configTab='Log';b.textContent='Log / Activity';b.onclick=()=>{w.setConfigTab('Log');w.__ssotLoadLog()};tabs.appendChild(b);let colors=d.querySelector('[data-config-panel="Colors"]'),panel=d.createElement('div');panel.className='config-panel';panel.dataset.configPanel='Log';panel.innerHTML='<div class="ssot-log-actions"><button class="btn" type="button" onclick="__ssotDownloadLog()">Download</button><button class="btn" type="button" onclick="__ssotCopyLog()">Copy</button><button class="btn danger" type="button" onclick="__ssotClearLog()">Clear</button></div><div id="ssotLogStatus" class="muted" style="margin-bottom:8px"></div><div id="ssotLogBox" class="ssot-log-box">Loading…</div>';(colors?.parentNode||tabs.parentNode).appendChild(panel);if(w.eval('configTab')==='Log'){w.setConfigTab('Log');w.__ssotLoadLog()}};
 const baseConfigure=typeof w.configure==='function'?w.configure.bind(w):null;if(baseConfigure)w.configure=async function(){let r=await baseConfigure();requestAnimationFrame(w.__ssotDecorateConfig);return r};
 w.__ssotDecorateTabs();
 if(baseShow)w.show=function(n){if(n==='Database'||n==='Grid')return w.__ssotSetSearchView(n==='Grid'?'Grid':'Table');if(n==='Plan'||n==='Analyze')return w.__ssotOpenReportMode(n==='Analyze'?'Analyze':'Report');if(n==='Estate')return w.__ssotOpenAddToEstate();if(n==='Activity')return w.configure();let r=baseShow(n);requestAnimationFrame(()=>w.__ssotDecorateTabs());return r};
 let ownerUiScheduled=false;const ownerUiObserver=new MutationObserver(()=>{if(ownerUiScheduled)return;ownerUiScheduled=true;requestAnimationFrame(()=>{ownerUiScheduled=false;w.__ssotDecorateTabs();if(d.getElementById('Plan')?.classList.contains('on')){w.__ssotDecorateReportSurface('Report');w.__ssotDecorateReportRows()}if(d.getElementById('Analyze')?.classList.contains('on'))w.__ssotDecorateReportSurface('Analyze');if(d.getElementById('Database')?.classList.contains('on')||d.getElementById('Grid')?.classList.contains('on'))w.__ssotDecorateSearchSurface();if(d.querySelector('.config-tabs'))w.__ssotDecorateConfig()})});
 for(const node of [d.getElementById('tabs'),d.getElementById('Plan'),d.getElementById('Analyze'),d.getElementById('Database'),d.getElementById('Grid'),d.getElementById('modalback')])if(node)ownerUiObserver.observe(node,{childList:true,subtree:true});
 w.loadPlacements=async function(force=false){if(w.__ssotPlacementBusy){if(force)w.__ssotPlacementPending=true;return}let current=Number(w.eval('placements.length'))||0;if(!force&&current)return;w.__ssotPlacementBusy=true;w.__ssotSetRefreshBlocker(true);try{let rows=[],after=0,rev=null,total=null,pages=0;while(true){let z=await w.req('/api/placements/page?after='+encodeURIComponent(after)+'&limit=5000',{},30000);if(!z||!z.ok)throw Error(z?.error||'Placement page failed');if(rev!==null&&z.catalog_revision!==rev){w.__ssotPlacementPending=true;break}rev=z.catalog_revision;total=Number(z.total);let page=z.placements||[];rows.push(...page);pages++;if(!z.has_more)break;let next=Number(z.next_after);if(!Number.isFinite(next)||next<=after||pages>10000)throw Error('Placement paging did not advance');after=next}if(!w.__ssotPlacementPending){if(Number.isFinite(total)&&rows.length!==total)throw Error('Placement paging incomplete: '+rows.length+' / '+total);w.__ssotApplyPlacements(rows,rev)}}catch(e){w.toast('Database data retrying',2500);w.__ssotPlacementPending=true}finally{w.__ssotPlacementBusy=false;if(w.__ssotPlacementPending){w.__ssotPlacementPending=false;setTimeout(()=>w.loadPlacements(true),100)}else w.__ssotSetRefreshBlocker(false)}};
 w.__ssotSetRefreshBlocker(true);if(baseShow)baseShow('Plan');requestAnimationFrame(()=>{w.__ssotDecorateTabs();w.__ssotDecorateReportSurface('Report');w.__ssotDecorateReportRows()});w.loadPlacements(true);return true
}
function arm(){const outerDoc=shell.contentDocument,inner=outerDoc&&outerDoc.getElementById('app');if(inner&&!inner.__ssotCompleteListener){inner.__ssotCompleteListener=true;inner.addEventListener('load',()=>setTimeout(installCompletePlacementRefresh,0))}if(!installCompletePlacementRefresh())setTimeout(arm,50)}
shell.addEventListener('load',arm);
