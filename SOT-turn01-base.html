#app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c1118}.brand{font-weight:950;font-size:21px;white-space:nowrap}.brand small{font-size:9px;color:var(--muted);letter-spacing:.09em;margin-left:6px}.searchWrap{position:relative;flex:1;max-width:880px;margin:auto}.search{width:100%;height:40px;border:1px solid #43536b;border-radius:10px;background:#111925;color:var(--text);padding:0 42px 0 13px;outline:none}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #68b6ff20}.clear{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:21px}.gear{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:20px}

.workspace{min-width:0;min-height:0;overflow:auto;scroll-behavior:auto}.surface{max-width:1180px;margin:0 auto;padding:14px 16px 44px}.projectHead{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 0 11px;background:linear-gradient(var(--bg) 82%,transparent)}.projectName{min-width:0;flex:1;font-size:21px;font-weight:900;border:1px solid transparent;background:transparent;color:var(--text);border-radius:8px;padding:5px 7px}.projectName:focus{outline:none;border-color:var(--accent);background:#101823}.headMeta{font-size:10px;color:var(--muted)}.headActions{display:flex;gap:6px}.btn{border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);padding:8px 11px;font-weight:800}.btn:hover{border-color:#54667f;background:#223044}.btn.primary{background:#2b76cc;border-color:#4b9af2}.btn.good{color:#bff3d5;border-color:#376a50}.btn.danger{color:#ffb1b5;border-color:#71343b;background:#2a1518}.btn:disabled{opacity:.38;cursor:not-allowed}.flow{display:grid;gap:11px}.step{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;scroll-margin-top:72px}.stepHead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);background:#111923}.stepNum{width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:900;color:var(--muted)}.stepTitle{font-weight:900}.stepState{margin-left:auto;font-size:10px;color:var(--muted)}.stepBody{padding:13px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:9px;background:#111923;padding:10px}.metric b{display:block;font-size:17px}.metric span{font-size:9px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.storage{border:1px solid var(--line);border-radius:9px;background:#111923;padding:10px}.storage h3{font-size:11px;margin:0 0 7px}.path{font-size:10px;word-break:break-all;color:#d5deea}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:8px 9px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:2px}.notice{border:1px solid #66572f;border-radius:9px;background:#211c0d;padding:9px 11px;color:#f6d993}.errorBox{border:1px solid #73363d;border-radius:9px;background:#2a161a;padding:9px 11px;color:#ffd3d6;white-space:pre-wrap}.progress{height:8px;border-radius:999px;background:#202a37;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--accent)}.dupGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.dup{border:1px solid var(--line);border-radius:9px;background:#111923;padding:10px;text-align:left;color:var(--text)}.dup b{display:block;font-size:18px}.activity{max-height:330px;overflow:auto}.event{padding:8px 9px;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.eventHead{display:flex;gap:8px}.eventHead b{font-size:11px}.eventHead time{margin-left:auto;font-size:9px;color:var(--muted)}.event pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:9px;color:var(--muted)}.aiBox{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}.aiBox textarea{width:100%;min-height:82px;resize:vertical}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#080d13;color:var(--text);padding:9px 10px;outline:none}.input:focus{border-color:var(--accent)}.aiAnswer{white-space:pre-wrap;word-break:break-word;margin-top:8px}
.modalBg{position:fixed;inset:0;z-index:100;background:#020406d9;display:grid;place-items:center;padding:12px}.modal{width:min(980px,100%);max-height:94dvh;display:flex;flex-direction:column;border:1px solid #39475b;border-radius:13px;background:#10161f;box-shadow:var(--shadow);overflow:hidden}.modalHead,.modalFoot{display:flex;align-items:center;gap:8px;padding:11px 13px}.modalHead{border-bottom:1px solid var(--line)}.modalHead b{font-size:15px}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{min-height:0;overflow:auto;padding:13px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase}.picker{display:grid;grid-template-columns:180px minmax(280px,1fr) minmax(240px,.8fr);height:500px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.pane:last-child{border-right:0}.paneHead{padding:8px 9px;border-bottom:1px solid var(--line);font-size:9px;font-weight:900;text-transform:uppercase}.paneBody{min-height:0;overflow:auto}.pickBtn{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:9px;text-align:left}.pickBtn:hover,.pickBtn.active{background:#68b6ff12}.folderRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.folderRow button:first-child{border:0;background:transparent;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pathBar{padding:8px;border-bottom:1px solid var(--line);font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selectedRow{display:flex;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}.selectedRow span{min-width:0;flex:1;word-break:break-all;font-size:10px}.createRow{display:flex;gap:6px;padding:8px}.createRow input{flex:1}.toast{position:fixed;left:50%;bottom:18px;z-index:160;transform:translateX(-50%);border:1px solid var(--line);border-radius:9px;background:#17212d;padding:9px 12px;box-shadow:var(--shadow)}
@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.picker{grid-template-columns:150px minmax(220px,1fr) 230px}.split{grid-template-columns:1fr}}
@media(max-width:760px){#app{grid-template-rows:54px minmax(0,1fr)}.top{padding:6px 8px}.brand{font-size:17px}.brand small{display:none}.body{grid-template-columns:1fr;grid-template-rows:176px minmax(0,1fr)}.rail{border-right:0;border-bottom:1px solid var(--line)}.railHead{padding:6px 8px}.cards{display:flex;gap:7px;overflow:auto;padding:7px}.card{min-width:235px;margin:0}.surface{padding:8px 9px 34px}.projectHead{padding-top:6px}.projectName{font-size:18px}.metrics{grid-template-columns:1fr 1fr}.dupGrid{grid-template-columns:1fr}.picker{display:block;height:auto;max-height:78dvh;overflow:auto}.pane{border-right:0;border-bottom:1px solid var(--line)}.paneBody{max-height:230px}.headMeta{display:none}}

<body>
<div id="app">
<header class="top"><div class="brand">SOT <small>TURN 01 · BASE · SINGLE SURFACE</small></div><div class="searchWrap"><input id="search" class="search" placeholder="OMNISEARCH — projects" autocomplete="off"><button id="clearSearch" class="clear" aria-label="Clear">×</button></div><button id="gear" class="gear" title="Configuration">⚙</button></header>
<div class="body"><aside class="rail"><div class="railHead"><b>Projects</b><button id="addProject" class="add">+ Project</button></div><div id="cards" class="cards"></div></aside><main id="workspace" class="workspace"><div id="surface" class="surface"></div></main></div>
</div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const BUILD='SOT-turn01-base-single-surface-r2';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const SOT_SUPERVISOR_PROMPT=`You are the SOT supervisor analyst. The SOT database and deterministic fingerprint/evidence records supplied to you are factual authority. You interpret evidence and may propose actions, but you are never filesystem authority, storage authority, approval authority, or execution authority. Never invent files, paths, hashes, capacities, volume state, duplicate groups, plan state, approvals, execution results, or facts absent from supplied evidence. Express actions only as proposals subject to deterministic validation, SOT plan compilation, required approval, and deterministic execution. If evidence is missing, stale, conflicting, or insufficient, state that explicitly rather than filling gaps with assumptions. Preserve project boundaries and identify cross-project implications instead of silently resolving them.`;
const state={projects:[],health:null,rollup:null,scheduler:null,selected:localStorage.getItem('sot.selected')||'__sot__',query:'',detail:null,storage:null,status:null,review:null,dups:null,plan:null,activity:null,polling:false,volumes:null,folderCache:new Map()};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(v){let n=Number(v||0),i=0,u=['B','KB','MB','GB','TB','PB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function pct(v){return Math.max(0,Math.min(100,Number(v||0))).toFixed(0)+'%'}
function toast(m,bad=false){let n=$('toast');n.textContent=m;n.classList.toggle('bad',bad);n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),2800)}
async function api(path,opt={}){let r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d}
function project(){return state.projects.find(p=>p.project_token===state.selected)||null}
function processingState(p){return String(p?.processing_state||p?.status||'Idle')}
function projectProgress(p){let total=Number(p?.size_bytes||0),done=Number(p?.bytes_processed||0);return total?done/total*100:0}
function operatorBusy(){let a=document.activeElement;return !!$('modalRoot').firstChild||!!(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))}
function closeModal(){$('modalRoot').innerHTML=''}
function openModal(title,body,foot='<button class="btn" data-close>Close</button>'){$('modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><div class="modalHead"><b>${esc(title)}</b><button class="btn" style="margin-left:auto" data-close>×</button></div><div class="modalBody">${body}</div><div class="modalFoot">${foot}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(n=>n.onclick=closeModal)}
function renderRail(){let q=state.query.trim().toLowerCase(),ps=state.projects.filter(p=>!q||String(p.project_name).toLowerCase().includes(q)),r=state.rollup||{};let out=`<div class="card ${state.selected==='__sot__'?'active':''}" data-project="__sot__"><div class="cardHead"><div class="cardName">SOT</div><div class="cardStatus">${esc(state.health?.status||'…')}</div></div><div class="cardMeta">${state.projects.length} projects · ${Number(r.active_jobs||0)} active · ${Number(r.failed_jobs||0)} failed</div></div>`;out+=ps.map(p=>{let s=processingState(p),pr=projectProgress(p);return `<div class="card ${state.selected===p.project_token?'active':''}" data-project="${esc(p.project_token)}"><div class="cardHead"><div class="cardName">${esc(p.project_name)}</div><div class="cardStatus">${esc(s)}</div></div><div class="cardMeta">${bytes(p.size_bytes)} · ${Number(p.files_discovered||0).toLocaleString()} files · ${Number(p.folder_count||0).toLocaleString()} folders</div>${['Queued','WIP','Paused','Processing','Reindexing'].includes(s)?`<div class="cardProgress"><i style="width:${pr}%"></i></div>`:''}<div class="cardControls"><button class="mini" data-play="${esc(p.project_token)}">▶</button><button class="mini" data-pause="${esc(p.project_token)}">Ⅱ</button><button class="mini stop" data-stop="${esc(p.project_token)}">■</button></div></div>`}).join('');$('cards').innerHTML=out;document.querySelectorAll('[data-project]').forEach(n=>n.onclick=e=>{if(e.target.closest('button'))return;selectProject(n.dataset.project)});document.querySelectorAll('[data-play]').forEach(n=>n.onclick=()=>processingAction(n.dataset.play,'play'));document.querySelectorAll('[data-pause]').forEach(n=>n.onclick=()=>processingAction(n.dataset.pause,'pause'));document.querySelectorAll('[data-stop]').forEach(n=>n.onclick=()=>processingAction(n.dataset.stop,'stop'))}
async function selectProject(token){state.selected=token;localStorage.setItem('sot.selected',token);state.detail=state.storage=state.status=state.review=state.dups=state.plan=state.activity=null;renderRail();await refreshProject(true);$('workspace').scrollTop=0}
async function processingAction(token,kind){try{let p=state.projects.find(x=>x.project_token===token),s=processingState(p),a=kind;if(kind==='play')a=s==='Paused'?'continue':(['Closed','Error','Interrupted','Stopped'].includes(s)?'restart':'start');await api(`/projects/${encodeURIComponent(token)}/fingerprint/${a}`,{method:'POST',body:'{}'});toast(`${a} requested`);await refresh(true)}catch(e){toast(e.message,true)}}
function globalSurface(){let r=state.rollup||{},s=state.scheduler||{};$('surface').innerHTML=`<div class="projectHead"><div><div style="font-size:22px;font-weight:950">SOT</div><div class="headMeta">Central status, scheduler, database and cross-project truth</div></div></div><div class="flow"><section class="step"><div class="stepHead"><div class="stepNum">S</div><div class="stepTitle">System overview</div><div class="stepState">${esc(state.health?.build||'')}</div></div><div class="stepBody"><div class="metrics"><div class="metric"><b>${state.projects.length}</b><span>Projects</span></div><div class="metric"><b>${Number(r.active_jobs||0)}</b><span>Active jobs</span></div><div class="metric"><b>${Number(r.failed_jobs||0)}</b><span>Failed jobs</span></div><div class="metric"><b>${Number(r.files_discovered||0).toLocaleString()}</b><span>Files discovered</span></div><div class="metric"><b>${bytes(r.bytes_discovered||0)}</b><span>Bytes discovered</span></div></div><div class="notice" style="margin-top:10px">Scheduler is non-blocking. Projects may progress concurrently; each project retains one mutation owner at a time.</div></div></section><section class="step"><div class="stepHead"><div class="stepNum">A</div><div class="stepTitle">Active work</div><div class="stepState">${esc(s.status||'')}</div></div><div class="stepBody">${state.projects.length?`<div class="list">${state.projects.map(p=>`<div class="row"><div><b>${esc(p.project_name)}</b><small>${esc(processingState(p))} · ${Number(p.files_processed||0).toLocaleString()} / ${Number(p.files_discovered||0).toLocaleString()} files</small></div><button class="btn" data-open="${esc(p.project_token)}">Open</button></div>`).join('')}</div>`:'<div class="muted">No projects yet.</div>'}</div></section></div>`;document.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>selectProject(n.dataset.open))}
function planIsCurrent(p,plan){return !!plan&&plan.state!=='none'&&plan.state!=='stale'&&Number(plan.evidence_revision)===Number(p.evidence_revision)}
function projectSurface(p){let d=state.detail||{},st=state.storage||{},rs=state.status||{},rv=state.review||{},du=state.dups?.counts||{},pl=state.plan||{state:'none',items:[],totals:{}},events=state.activity?.events||state.activity||[],ps=rs.state||processingState(p),progress=rs.progress||{},sources=d.sources||[],currentPlan=planIsCurrent(p,pl),run=rs.run||{};let activeAI=aiActive();let scroll=$('workspace').scrollTop;$('surface').innerHTML=`<div class="projectHead"><div style="min-width:0;flex:1"><input id="projectName" class="projectName" value="${esc(p.project_name)}" aria-label="Project name"><div class="headMeta">${esc(p.project_token)} · evidence rev ${Number(p.evidence_revision||0)} · ${esc(p.status||ps)}</div></div><div class="headActions"><button class="btn" id="headPlay">▶</button><button class="btn" id="headPause">Ⅱ</button><button class="btn danger" id="headStop">■</button><button class="btn danger" id="deleteProject">Delete</button></div></div><div class="flow">
<section class="step" id="scope"><div class="stepHead"><div class="stepNum">1</div><div class="stepTitle">Scope / Storage</div><div class="stepState">${sources.length} source${sources.length===1?'':'s'}</div></div><div class="stepBody"><div class="split"><div class="storage"><h3>Source</h3>${sources.length?sources.map(s=>`<div class="path">${esc(s.normalized_path)}</div>`).join(''):'<div class="muted">Not configured</div>'}<button class="btn" id="editSources" style="margin-top:8px">Select Source</button></div><div><div class="storage"><h3>Target</h3><div class="path">${esc(st.target_root||'Not configured')}</div><button class="btn" id="editTarget" style="margin-top:8px">Select Target</button></div><div class="storage" style="margin-top:8px"><h3>Backup</h3><div class="path">${esc(st.backup_root||'Not configured')}</div><button class="btn" id="editBackup" style="margin-top:8px">Select Backup</button></div></div></div></div></section>
<section class="step" id="index"><div class="stepHead"><div class="stepNum">2</div><div class="stepTitle">Index</div><div class="stepState">${esc(ps)}</div></div><div class="stepBody"><div class="metrics"><div class="metric"><b>${Number(run.files_processed||p.files_processed||0).toLocaleString()}</b><span>Files processed</span></div><div class="metric"><b>${Number(run.files_discovered||p.files_discovered||0).toLocaleString()}</b><span>Files discovered</span></div><div class="metric"><b>${bytes(run.bytes_processed||p.bytes_processed||0)}</b><span>Bytes processed</span></div><div class="metric"><b>${Number(run.hashes_reused||p.hashes_reused||0).toLocaleString()}</b><span>Hashes reused</span></div><div class="metric"><b>${Number(run.hashes_computed||p.hashes_computed||0).toLocaleString()}</b><span>Hashes computed</span></div></div><div class="progress"><i style="width:${pct(progress.bytes_percent||projectProgress(p))}"></i></div><div class="muted">${esc(run.current_item||p.current_item||'Idle')} ${progress.eta_seconds!=null?'· ETA '+Math.ceil(progress.eta_seconds)+'s':''}</div><div class="actions" style="margin-top:9px"><button class="btn primary" id="indexPlay">${ps==='Paused'?'Continue':(['Closed','Error','Interrupted','Stopped'].includes(ps)?'Re-index':'Start Index')}</button><button class="btn" id="indexPause">Pause</button><button class="btn danger" id="indexStop">Stop</button></div></div></section>
<section class="step" id="review"><div class="stepHead"><div class="stepNum">3</div><div class="stepTitle">Review</div><div class="stepState">evidence rev ${Number(rv.evidence_revision||p.evidence_revision||0)}</div></div><div class="stepBody">${Number(rv.files||0)?`<div class="metrics"><div class="metric"><b>${Number(rv.files||0).toLocaleString()}</b><span>Files</span></div><div class="metric"><b>${bytes(rv.bytes||0)}</b><span>Bytes</span></div><div class="metric"><b>${Number(rv.unique_content||0).toLocaleString()}</b><span>Unique content</span></div><div class="metric"><b>${Number(rv.duplicate_groups||0).toLocaleString()}</b><span>Duplicate groups</span></div><div class="metric"><b>${bytes(rv.duplicate_bytes||0)}</b><span>Duplicate bytes</span></div></div><div class="dupGrid" style="margin-top:9px"><button class="dup" data-bucket="2"><b>${Number(du.two||0)}</b>2-copy groups</button><button class="dup" data-bucket="3"><b>${Number(du.three||0)}</b>3-copy groups</button><button class="dup" data-bucket="4plus"><b>${Number(du.four_plus||du.fourPlus||0)}</b>4+ copy groups</button></div><div id="dupDrill" class="list" style="margin-top:8px"></div>`:`<div class="notice">Complete Index to establish deterministic review evidence.</div>`}<div class="aiBox"><div class="row" style="padding:0 0 8px;border:0"><div><b>AI POV</b><small>${activeAI?esc(activeAI.provider+' · '+activeAI.model):'No active provider'}</small></div><button class="btn" id="aiConfig">Configure</button></div><textarea id="aiPrompt" class="input" placeholder="Ask SOT to explain evidence, risks, duplicates or recommendations…" ${activeAI?'':'disabled'}></textarea><div class="actions" style="margin-top:7px"><button id="aiAsk" class="btn primary" ${activeAI?'':'disabled'}>Ask SOT</button><button id="aiClear" class="btn" ${activeAI?'':'disabled'}>Clear</button></div><div id="aiAnswer" class="aiAnswer muted">${activeAI?'Supervisor guardrails and exact project evidence are injected automatically.':'Configure and validate Venice or OpenRouter to enable AI POV.'}</div></div></div></section>

function wireProject(p){let name=$('projectName'),original=p.project_name;name.onkeydown=e=>{if(e.key==='Enter')name.blur();if(e.key==='Escape'){name.value=original;name.blur()}};name.onblur=async()=>{let v=name.value.trim();if(!v||v===original){name.value=original;return}try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}`,{method:'PATCH',body:JSON.stringify({project_name:v})});toast('Project renamed');await refresh(true)}catch(e){name.value=original;toast(e.message,true)}};$('deleteProject').onclick=()=>confirmDelete(p);['headPlay','indexPlay'].forEach(id=>$(id).onclick=()=>processingAction(p.project_token,'play'));['headPause','indexPause'].forEach(id=>$(id).onclick=()=>processingAction(p.project_token,'pause'));['headStop','indexStop'].forEach(id=>$(id).onclick=()=>processingAction(p.project_token,'stop'));$('editSources').onclick=()=>openProjectPicker(p,'source');$('editTarget').onclick=()=>openProjectPicker(p,'target');$('editBackup').onclick=()=>openProjectPicker(p,'backup');document.querySelectorAll('[data-bucket]').forEach(n=>n.onclick=async()=>{try{let z=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/duplicates?bucket=${encodeURIComponent(n.dataset.bucket)}`),groups=z.groups||[];$('dupDrill').innerHTML=groups.length?groups.map(g=>`<div class="row"><div><b>${esc(g.content_sha256||'')}</b><small>${Number(g.copies||0)} copies · ${bytes(g.size||0)}</small></div></div>`).join(''):'<div class="muted" style="padding:9px">No groups in this bucket.</div>'}catch(e){toast(e.message,true)}});$('generatePlan').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Current plan generated');await refreshProject(true)}catch(e){toast(e.message,true)}};$('executePlan').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started');await refresh(true)}catch(e){toast(e.message, const AI_STORE={active:'sot.ai.activeProvider',venice:{key:'sot.veniceKey',model:'sot.ai.venice.model',validated:'sot.ai.venice.validated'},openrouter:{key:'sot.openrouterKey',model:'sot.ai.openrouter.model',validated:'sot.ai.openrouter.validated'}};
function aiGet(provider){let s=AI_STORE[provider];return{key:localStorage.getItem(s.key)||'',model:localStorage.getItem(s.model)||'',validated:localStorage.getItem(s.validated)==='1'}}
function aiActive(){let provider=localStorage.getItem(AI_STORE.active)||'';if(!AI_STORE[provider])return null;let c=aiGet(provider);return c.validated&&c.key&&c.model?{provider,key:c.key,model:c.model}:null}
function aiInvalidate(provider){let s=AI_STORE[provider];localStorage.removeItem(s.validated);if(localStorage.getItem(AI_STORE.active)===provider)localStorage.removeItem(AI_STORE.active)}
async function aiLoadModels(provider,key){if(provider==='venice'){let r=await fetch('https://api.venice.ai/api/v1/models',{cache:'no-store',headers:{Authorization:'Bearer '+key}}),j=await r.json();if(!r.ok)throw new Error(j?.error?.message||'Venice '+r.status);return(j.data||[]).map(x=>x.id).filter(Boolean).sort()}let ar=await fetch('https://openrouter.ai/api/v1/auth/key',{cache:'no-store',headers:{Authorization:'Bearer '+key}});if(!ar.ok)throw new Error('OpenRouter key validation '+ar.status);let r=await fetch('https://openrouter.ai/api/v1/models',{cache:'no-store'}),j=await r.json();if(!r.ok)throw new Error('OpenRouter models '+r.status);return(j.data||[]).map(x=>x.id).filter(Boolean).sort()}

async function openConfig(){let cfg={};try{cfg=await api('/admin/settings')}catch{};let ven=aiGet('venice'),op=aiGet('openrouter');openModal('Configuration',`<div class="split"><div class="storage"><h3>Default Target</h3><div class="path">${esc(cfg.target_root||'Not set')}</div><button id="defaultTarget" class="btn">Select</button></div><div class="storage"><h3>Default Backup</h3><div class="path">${esc(cfg.backup_root||'Not set')}</div><button id="defaultBackup" class="btn">Select</button></div></div><div class="step" style="margin-top:10px"><div class="stepHead"><div class="stepTitle">Operational AI</div></div><div class="stepBody"><div class="split"><div><div class="field"><label>Venice API key — browser local only</label><input id="venKey" class="input" type="password" value="${esc(ven.key)}"></div><button id="venModels" class="btn">Load models</button><select id="venModel" class="input" style="margin-top:7px"><option value="${esc(ven.model)}">${esc(ven.model||'— select model —')}</option></select><button id="venValidate" class="btn primary" style="margin-top:7px">Validate & activate</button></div><div><div class="field"><label>OpenRouter API key — browser local only</label><input id="orKey" class="input" type="password" value="${esc(op.key)}"></div><button id="orModels" class="btn">Load models</button><select id="orModel" class="input" style="margin-top:7px"><option value="${esc(op.model)}">${esc(op.model||'— select model —')}</option></select><button id="orValidate" class="btn primary" style="margin-top:7px">Validate & activate</button></div></div></div></div>`,`<button class="btn" data-close>Close</button>`);let target=cfg.target_root?[cfg.target_root]:[],backup=cfg.backup_root?[cfg.backup_root]:[];$('defaultTarget').onclick=()=>openFolderSelector({title:'Default Target',selected:target,onDone:async x=>{target=x;await saveDefaults(target,backup)}});$('defaultBackup').onclick=()=>openFolderSelector({title:'Default Backup',selected:backup,onDone:async x=>{backu async function runAI(p){let active=aiActive(),prompt=$('aiPrompt').value.trim();if(!active||!prompt)return;let answer=$('aiAnswer');answer.textContent='Working…';try{let ctx={project:{project_token:p.project_token,project_name:p.project_name,evidence_revision:p.evidence_revision,sources:(state.detail?.sources||[]).map(s=>s.normalized_path)},evidence:state.review||{},duplicates:state.dups?.counts||{},plan:{state:state.plan?.state||'none',evidence_revision:state.plan?.evidence_revision??null,totals:state.plan?.totals||{}}},key='sot.ai.history.'+p.project_token,h=[];try{h=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!Array.isArray(h))h=[];let messages=[{role:'system',content:SOT_SUPERVISOR_PROMPT},{role:'system',content:'SOT PROJECT / EVIDENCE CONTEXT (authoritative):\n'+JSON.stringify(ctx,null,2)}].concat(h.slice(-12)).concat([{role:'user',content:prompt}]),url=active.provider==='venice'?'https://api.venice.ai/api/v1/chat/completions':'https://openrouter.ai/api/v1/chat/completions',r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+active.key},body:JSON.stringify({model:active.model,max_tokens:3000,messages})}),j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.error?.message||active.provider+' '+r.status);let out=j?.choices?.[0]?.message?.content;if(!out)throw new Error('Provider returned no answer');answer.textContent=out;h.push({role:'user',content:prompt},{role:'assistant',content:out});localStorage.setItem(key,JSON.stringify(h.slice(-12)))}catch(e){answer.textContent='AI error: '+e.message}}
async function refreshProject(forceRender=false){let p=project();if(!p){state.selected='__sot__';globalSurface();return}let t=encodeURIComponent(p.project_token);try{let [d,st,rs,rv,du,pl,ac]=await Promise.all([api(`/turn01/projects/${t}`),api(`/turn01/projects/${t}/storage`).catch(()=>({})),api(`/projects/${t}/fingerprint/status`).catch(()=>({})),api(`/turn01/projects/${t}/review`).catch(()=>({})),api(`/turn01/projects/${t}/duplicates`).catch(()=>({counts:{}})),api(`/turn01/projects/${t}/plan`).catch(()=>({state:'none',items:[],totals:{}})),api(`/activity?project_token=${t}&limit=100`).catch(()=>({events:[]}))]);state.detail=d;state.storage=st;state.status=rs;state.review=rv;state.dups=du;state.plan=pl;state.activity=ac;if(forceRender||!operatorBusy())projectSurface(project())}catch(e){if(forceRender)$('surface').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
