<!doctype html>
<html lang="en">
<head>

<title>SOT Turn 01 Base</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--panel:#10151d;--panel2:#171e29;--line:#303a49;--text:#f3f6f9;--muted:#94a0b1;--accent:#68b6ff;--good:#63d49a;--warn:#f2c66d;--bad:#ff7e86;--shadow:0 20px 60px #0008;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}#app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden}.top{display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c1118}.brand{display:flex;align-items:baseline;gap:7px;min-width:max-content;font-size:21px;font-weight:900}.brand small{font-size:9px;color:var(--muted);letter-spacing:.08em}.searchWrap{position:relative;flex:1;max-width:900px;margin:auto}.search{width:100%;height:40px;border:1px solid #43536b;border-radius:10px;background:#111925;color:var(--text);padding:0 42px 0 13px;font-size:15px;outline:none}.clear{position:absolute;right:5px;top:4px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);font-size:21px}.gear{width:39px;height:39px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);font-size:20px}.body{min-height:0;display:grid;grid-template-columns:330px minmax(0,1fr)}.rail{min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#0c1118}.railHead{height:45px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line)}.railHead b{font-size:11px;text-transform:uppercase;letter-spacing:.08em}.add{margin-left:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:6px 10px;font-weight:800}.cards{min-height:0;overflow:auto;padding:8px}.card{border:1px solid var(--line);border-left:3px solid transparent;border-radius:10px;background:var(--panel);padding:11px;margin-bottom:8px;cursor:pointer}.card:hover{background:var(--panel2)}.card.active{border-left-color:var(--accent);background:var(--panel2)}.cardHead{display:flex;align-items:center;gap:8px}.cardName{font-weight:850;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardStatus{margin-left:auto;font-size:9px;font-weight:850;text-transform:uppercase;color:var(--muted)}.cardMeta{font-size:10px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cardControls{display:flex;gap:5px;margin-top:8px}.mini{width:30px;height:29px;border:1px solid var(--line);border-radius:7px;background:#17202c;color:var(--text);font-weight:900}.mini.stop{color:var(--bad)}.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg)}.workspaceHead{padding:12px 16px;border-bottom:1px solid var(--line);background:#0d1219}.workspaceTitle h1{margin:0;font-size:20px}.workspaceTitle div{font-size:10px;color:var(--muted);margin-top:2px}.tabs{display:flex;gap:2px;overflow:auto;padding:7px 10px;border-bottom:1px solid var(--line);background:#0b1016}.tab{border:0;border-radius:7px;background:transparent;color:var(--muted);padding:8px 12px;font-size:11px;font-weight:850;white-space:nowrap}.tab.active{background:#68b6ff18;color:var(--text);box-shadow:inset 0 -2px var(--accent)}.content{min-height:0;overflow:auto;padding:16px}.section{border:1px solid var(--line);border-radius:11px;background:var(--panel);margin-bottom:12px;overflow:hidden}.sectionHead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}.sectionHead h2{margin:0;font-size:13px}.sectionHead .spacer{flex:1}.sectionBody{padding:13px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.metric{border:1px solid var(--line);border-radius:9px;background:#111923;padding:12px}.metric b{display:block;font-size:18px}.metric span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.btn{border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);padding:8px 11px;font-weight:750}.btn.primary{background:#2b76cc;border-color:#4b9af2}.btn.danger{color:#ffb1b5;border-color:#71343b;background:#2a1518}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:3px}.empty{padding:24px;text-align:center;color:var(--muted)}.progress{height:8px;border-radius:999px;background:#202a37;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}.notice{border:1px solid #66572f;border-radius:9px;background:#211c0d;padding:10px 12px;color:#f6d993}.errorBox{border:1px solid #73363d;border-radius:9px;background:#2a161a;padding:10px 12px;color:#ffd3d6;white-space:pre-wrap}.storageGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.storageCard{border:1px solid var(--line);border-radius:10px;background:#111923;padding:12px}.storageCard h3{margin:0 0 7px;font-size:12px}.storagePath{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}.modalBg{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:12px;background:#020406d8}.modal{width:min(980px,100%);max-height:94dvh;display:flex;flex-direction:column;border:1px solid #39475b;border-radius:13px;background:#10161f;box-shadow:var(--shadow);overflow:hidden}.modalHead,.modalFoot{display:flex;align-items:center;gap:8px;padding:11px 13px}.modalHead{border-bottom:1px solid var(--line)}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{min-height:0;overflow:auto;padding:13px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#080d13;color:var(--text);padding:9px 10px;outline:none}.picker3{display:grid;grid-template-columns:190px minmax(280px,1fr) minmax(260px,.8fr);height:500px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.pane:last-child{border-right:0}.paneHead{padding:9px 10px;border-bottom:1px solid var(--line);font-size:10px;font-weight:850;text-transform:uppercase}.paneBody{min-height:0;overflow:auto}.pickBtn{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:10px;text-align:left}.pickBtn small{display:block;color:var(--muted);margin-top:2px}.pickBtn.active,.pickBtn:hover{background:#68b6ff12}.folderRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}.folderRow button{border:0;background:transparent;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.folderRow .select{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#182231}.pathBar{padding:8px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.choice{padding:12px}.choicePath{border:1px solid var(--line);border-radius:8px;background:#0b1017;padding:9px;word-break:break-all}.createRow{display:flex;gap:7px;margin-top:10px}.createRow input{flex:1}.toast{position:fixed;left:50%;bottom:18px;z-index:150;transform:translateX(-50%);border:1px solid var(--line);border-radius:9px;background:#17212d;padding:9px 12px;box-shadow:var(--shadow)}@media(max-width:900px){.body{grid-template-columns:280px minmax(0,1fr)}.metrics,.storageGrid{grid-template-columns:1fr 1fr}.picker3{grid-template-columns:150px minmax(220px,1fr) 240px}}@media(max-width:680px){.body{grid-template-columns:min(62vw,270px) minmax(0,1fr)}.content{padding:10px}.metrics,.storageGrid{grid-template-columns:1fr}.picker3{display:block;height:auto;max-height:78dvh;overflow:auto}.pane{border-right:0;border-bottom:1px solid var(--line)}.paneBody{max-height:230px}.brand small{display:none}}
</style>

<body>
<div id="app"><header class="top"><div class="brand">SOT <small>TURN 01 · BASE</small></div><div class="searchWrap"><input id="search" class="search" placeholder="Omnisearch projects…"><button id="clearSearch" class="clear">×</button></div><button id="gear" class="gear">⚙</button></header><div class="body"><aside class="rail"><div class="railHead"><b>Projects</b><button id="addProject" class="add">+ Project</button></div><div id="cards" class="cards"></div></aside><main class="workspace"><div id="workspaceHead" class="workspaceHead"></div><nav id="tabs" class="tabs"></nav><section id="content" class="content"></section></main></div></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const BUILD='SOT-turn01-base';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const state={projects:[],selected:'__sot__',tab:'overview',query:'',health:null,rollup:null};
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(v){let n=Number(v||0),i=0,u=['B','KB','MB','GB','TB','PB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function toast(m){let n=$('toast');n.textContent=m;n.classList.remove('hidden');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.add('hidden'),2600)}
async function api(path,opt={}){let r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||r.statusText);return d}
function selectedProject(){return state.projects.find(p=>p.project_token===state.selected)||null}
function renderCards(){let q=state.query.trim().toLowerCase(),ps=state.projects.filter(p=>!q||String(p.project_name).toLowerCase().includes(q)),r=state.rollup||{};let html=`<div class="card ${state.selected==='__sot__'?'active':''}" data-select="__sot__"><div class="cardHead"><div class="cardName">SOT</div><div class="cardStatus">${esc(state.health?.status||'…')}</div></div><div class="cardMeta">${state.projects.length} projects · ${Number(r.active_jobs||0)} active · ${Number(r.failed_jobs||0)} failed</div></div>`;html+=ps.map(p=>`<div class="card ${state.selected===p.project_token?'active':''}" data-select="${esc(p.project_token)}"><div class="cardHead"><div class="cardName">${esc(p.project_name)}</div><div class="cardStatus">${esc(p.processing_state||p.status||'Idle')}</div></div><div class="cardMeta">${bytes(p.size_bytes||0)} · ${Number(p.files_discovered||0).toLocaleString()} files · ${Number(p.source_count||0)} sources</div><div class="cardControls"><button class="mini" data-run="${esc(p.project_token)}">▶</button><button class="mini" data-pause="${esc(p.project_token)}">Ⅱ</button><button class="mini stop" data-stop="${esc(p.project_token)}">■</button></div></div>`).join('');$('cards').innerHTML=html;document.querySelectorAll('[data-select]').forEach(n=>n.onclick=e=>{if(e.target.closest('button'))return;state.selected=n.dataset.select;state.tab=state.selected==='__sot__'?'overview':'scope';renderCards();renderWorkspace()});document.querySelectorAll('[data-run]').forEach(n=>n.onclick=()=>runAction(n.dataset.run,'start'));document.querySelectorAll('[data-pause]').forEach(n=>n.onclick=()=>runAction(n.dataset.pause,'pause'));document.querySelectorAll('[data-stop]').forEach(n=>n.onclick=()=>runAction(n.dataset.stop,'stop'))}
function renderWorkspace(){if(state.selected==='__sot__'){renderSot();return}let p=selectedProject();if(!p){state.selected='__sot__';renderSot();return}$('workspaceHead').innerHTML=`<div class="workspaceTitle"><h1>${esc(p.project_name)}</h1><div>${esc(p.processing_state||p.status||'Idle')}</div></div>`;let tabs=['scope','index','plan','execute','insights'];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(n=>n.onclick=()=>{state.tab=n.dataset.tab;renderWorkspace()});if(state.tab==='scope')renderScope(p);else if(state.tab==='index')renderIndex(p);else if(state.tab==='plan')renderPlan(p);else if(state.tab==='execute')renderExecute(p);else renderInsights(p)}
function renderSot(){$('workspaceHead').innerHTML='<div class="workspaceTitle"><h1>SOT</h1><div>Central database, scheduler and Master Plan</div></div>';$('tabs').innerHTML='<button class="tab active">Overview</button><button class="tab">Master Plan</button><button class="tab">Activity</button><button class="tab">Insights</button>';$('content').innerHTML=`<div class="metrics"><div class="metric"><b>${state.projects.length}</b><span>Projects</span></div><div class="metric"><b>${Number(state.rollup?.active_jobs||0)}</b><span>Active jobs</span></div><div class="metric"><b>${Number(state.rollup?.failed_jobs||0)}</b><span>Failed jobs</span></div><div class="metric"><b>${bytes(state.rollup?.bytes_discovered||0)}</b><span>Discovered</span></div></div>`}
async function renderScope(p){let c=$('content');c.innerHTML='<div class="empty">Loading Scope…</div>';try{let [d,storage]=await Promise.all([api(`/turn01/projects/${encodeURIComponent(p.project_token)}`),api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`)]),src=d.sources||[];c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Source</h2><div class="spacer"></div><button id="editSources" class="btn">Select folders</button></div><div class="sectionBody"><div class="list">${src.map(s=>`<div class="row"><div><b>${esc(s.operator_label||s.normalized_path)}</b><small class="mono">${esc(s.normalized_path)}</small></div><span>${esc(s.preflight_status||'unknown')}</span></div>`).join('')||'<div class="empty">No sources assigned.</div>'}</div><div class="actions" style="margin-top:10px"><button id="preflight" class="btn">Run preflight</button></div></div></div><div class="section"><div class="sectionHead"><h2>Destination</h2></div><div class="sectionBody"><div class="storageGrid"><div class="storageCard"><h3>Target</h3><div class="storagePath mono">${esc(storage.target_root||'Not selected')}</div><button class="btn" id="chooseTarget">${storage.target_root?'Change':'Select / Create folder'}</button>${storage.target_volume?`<small class="muted">${esc(storage.target_volume.name)} · ${bytes(storage.target_volume.free_bytes)} free</small>`:''}</div><div class="storageCard"><h3>Backup</h3><div class="storagePath mono">${esc(storage.backup_root||'Not selected')}</div><button class="btn" id="chooseBackup">${storage.backup_root?'Change':'Select / Create folder'}</button>${storage.backup_volume?`<small class="muted">${esc(storage.backup_volume.name)} · ${bytes(storage.backup_volume.free_bytes)} free</small>`:''}</div></div></div></div>`;$('editSources').onclick=()=>openSourcePicker(p,src);$('chooseTarget').onclick=()=>openDestinationPicker(p,'target',storage);$('chooseBackup').onclick=()=>openDestinationPicker(p,'backup',storage);$('preflight').onclick=async()=>{try{let x=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/preflight`);toast(x.ready?'Preflight ready':`${x.blocking_count} blocking issue(s)`);renderScope(p)}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderIndex(p){let c=$('content');try{let s=await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/status`),r=s.run||{},pr=s.progress||{};c.innerHTML=`<div class="metrics"><div class="metric"><b>${Number(r.files_discovered||0).toLocaleString()}</b><span>Files discovered</span></div><div class="metric"><b>${Number(r.files_processed||0).toLocaleString()}</b><span>Files processed</span></div><div class="metric"><b>${bytes(r.bytes_processed||0)}</b><span>Bytes processed</span></div><div class="metric"><b>${esc(s.state||'NotStarted')}</b><span>Activity</span></div></div><div class="section"><div class="sectionHead"><h2>Index / Fingerprint</h2></div><div class="sectionBody"><div class="progress"><i style="width:${Number(pr.bytes_percent||0)}%"></i></div><div class="actions" style="margin-top:10px"><button class="btn primary" id="idxStart">Start / Continue</button><button class="btn" id="idxPause">Pause</button><button class="btn danger" id="idxStop">Stop</button></div></div></div>`;$('idxStart').onclick=()=>runAction(p.project_token,'start');$('idxPause').onclick=()=>runAction(p.project_token,'pause');$('idxStop').onclick=()=>runAction(p.project_token,'stop')}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderPlan(p){let c=$('content');try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`);c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Project Plan</h2><div class="spacer"></div><button id="generatePlan" class="btn primary">Generate current plan</button></div><div class="sectionBody"><p>State: <b>${esc(d.state||'none')}</b></p></div></div>`;$('generatePlan').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Plan generated');renderPlan(p)}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderExecute(p){let c=$('content');try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`),ok=d.state==='draft';c.innerHTML=`<div class="section"><div class="sectionHead"><h2>Execute</h2></div><div class="sectionBody"><p>Current plan: <b>${esc(d.state||'none')}</b></p><button id="execute" class="btn primary" ${ok?'':'disabled'}>Execute current plan</button></div></div>`;if(ok)$('execute').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started')}catch(e){toast(e.message)}}}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function renderInsights(p){let c=$('content');try{let d=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/review`);c.innerHTML=`<div class="metrics"><div class="metric"><b>${Number(d.files||0).toLocaleString()}</b><span>Files</span></div><div class="metric"><b>${bytes(d.bytes||0)}</b><span>Bytes</span></div><div class="metric"><b>${Number(d.unique_content||0).toLocaleString()}</b><span>Unique content</span></div><div class="metric"><b>${Number(d.duplicate_groups||0).toLocaleString()}</b><span>Duplicate groups</span></div></div>`}catch(e){c.innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function runAction(token,action){try{let s=await api(`/projects/${encodeURIComponent(token)}/fingerprint/status`),route=action;if(action==='start')route=s.state==='Paused'?'continue':'start';await api(`/projects/${encodeURIComponent(token)}/fingerprint/${route}`,{method:'POST',body:'{}'});toast(`${route} requested`);setTimeout(load,400)}catch(e){toast(e.message)}}
function openModal(title,body,foot=''){ $('modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><div class="modalHead"><b>${esc(title)}</b></div><div class="modalBody">${body}</div><div class="modalFoot">${foot||'<button class="btn" data-close>Close</button>'}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(n=>n.onclick=()=>$('modalRoot').innerHTML='')}
function newProject(){openModal('New project','<div class="field"><label>Project name</label><input id="newProjectName" class="input"></div>','<button class="btn" data-close>Cancel</button><button id="createProject" class="btn primary">Create</button>');$('createProject').onclick=async()=>{let name=$('newProjectName').value.trim();if(!name)return;try{let p=await api('/turn01/projects',{method:'POST',body:JSON.stringify({project_name:name})});$('modalRoot').innerHTML='';state.selected=p.project_token;state.tab='scope';load()}catch(e){toast(e.message)}}}
async function openSourcePicker(p,current){let staged=current.map(s=>s.normalized_path);openModal('Select source folders','<div id="pickMount" class="empty">Loading…</div>','<button class="btn" data-close>Cancel</button>');let root=$('pickMount');async function browse(x='/'){try{let d=await api(`/fs?path=${encodeURIComponent(x)}`);root.className='';root.innerHTML=`<div class="picker3"><div class="pane"><div class="paneHead">Volumes</div><div class="paneBody">${(d.locations||[]).map(v=>`<button class="pickBtn" data-browse="${esc(v.path)}"><b>${esc(v.name)}</b><small>${esc(v.path)}</small></button>`).join('')}</div></div><div class="pane"><div class="paneHead">Folders</div><div class="pathBar">${esc(d.path)}</div><div class="paneBody">${d.path!=='/'?`<div class="folderRow"><button data-browse="${esc(d.parent)}">..</button><button class="select" data-use="${esc(d.path)}">Add this</button></div>`:''}${(d.folders||[]).map(f=>`<div class="folderRow"><button data-browse="${esc(f.path)}">${esc(f.name)}</button><button class="select" data-use="${esc(f.path)}">Add</button></div>`).join('')}</div></div><div class="pane"><div class="paneHead">Selected</div><div class="choice"><div id="sourceSelected"></div><button id="saveSources" class="btn primary">Save sources</button></div></div></div>`;function draw(){ $('sourceSelected').innerHTML=staged.map(v=>`<div class="row"><div class="mono">${esc(v)}</div><button class="btn" data-remove="${esc(v)}">Remove</button></div>`).join('')||'<div class="empty">None selected</div>';document.querySelectorAll('[data-remove]').forEach(n=>n.onclick=()=>{staged=staged.filter(v=>v!==n.dataset.remove);draw()})}draw();document.querySelectorAll('[data-browse]').forEach(n=>n.onclick=()=>browse(n.dataset.browse));document.querySelectorAll('[data-use]').forEach(n=>n.onclick=()=>{if(!staged.includes(n.dataset.use))staged.push(n.dataset.use);draw()});$('saveSources').onclick=async()=>{try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/sources`,{method:'PUT',body:JSON.stringify({sources:staged})});$('modalRoot').innerHTML='';renderScope(p);toast('Sources saved')}catch(e){toast(e.message)}}}catch(e){root.className='errorBox';root.textContent=e.message}}browse('/')}
async function openDestinationPicker(p,kind,storage){let selected=storage[`${kind}_root`]||'',currentPath='/';openModal(`${kind==='target'?'Target':'Backup'} — select or create folder`,'<div id="destMount" class="empty">Loading WSL volumes…</div>','<button class="btn" data-close>Cancel</button>');let root=$('destMount');async function draw(pathValue='/'){currentPath=pathValue;try{let [v,d]=await Promise.all([api('/turn01/volumes'),api(`/fs?path=${encodeURIComponent(pathValue)}`)]);let volumes=v.volumes||[];root.className='';root.innerHTML=`<div class="picker3"><div class="pane"><div class="paneHead">Available to WSL</div><div class="paneBody">${volumes.map(vol=>`<button class="pickBtn ${currentPath===vol.path||currentPath.startsWith(vol.path+'/')?'active':''}" data-open="${esc(vol.path)}"><b>${esc(vol.name)}</b><small>${bytes(vol.free_bytes)} free · ${esc(vol.path)}</small></button>`).join('')||'<div class="empty">No WSL volumes available</div>'}</div></div><div class="pane"><div class="paneHead">Folders</div><div class="pathBar">${esc(d.path)}</div><div class="paneBody">${d.path!=='/'?`<div class="folderRow"><button data-open="${esc(d.parent)}">..</button><button class="select" data-select-folder="${esc(d.path)}">Select</button></div>`:''}${(d.folders||[]).map(f=>`<div class="folderRow"><button data-open="${esc(f.path)}">${esc(f.name)}</button><button class="select" data-select-folder="${esc(f.path)}">Select</button></div>`).join('')||'<div class="empty">No subfolders</div>'}</div></div><div class="pane"><div class="paneHead">Chosen ${kind}</div><div class="choice"><div class="choicePath mono">${esc(selected||'Nothing selected')}</div><div class="createRow"><input id="newFolderName" class="input" placeholder="New folder name"><button id="createFolder" class="btn">+ Create</button></div><p class="muted">Creates a folder inside the currently open WSL-visible folder.</p><button id="saveDestination" class="btn primary" ${selected?'':'disabled'}>Save ${kind}</button></div></div></div>`;document.querySelectorAll('[data-open]').forEach(n=>n.onclick=()=>draw(n.dataset.open));document.querySelectorAll('[data-select-folder]').forEach(n=>n.onclick=()=>{selected=n.dataset.selectFolder;draw(currentPath)});$('createFolder').onclick=async()=>{let name=$('newFolderName').value.trim();if(!name)return;try{let made=await api('/turn01/fs/folder',{method:'POST',body:JSON.stringify({parent:d.path,name})});selected=made.path;await draw(d.path);toast('Folder created and selected')}catch(e){toast(e.message)}};$('saveDestination').onclick=async()=>{try{let body={};body[`${kind}_root`]=selected;await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`,{method:'PUT',body:JSON.stringify(body)});$('modalRoot').innerHTML='';renderScope(p);toast(`${kind} saved`)}catch(e){toast(e.message)}}}catch(e){root.className='errorBox';root.textContent=e.message}}try{let vols=await api('/turn01/volumes');currentPath=(selected||(vols.volumes||[])[0]?.path||'/');draw(currentPath)}catch(e){root.className='errorBox';root.textContent=e.message}}
function openConfig(){let ven=localStorage.getItem('sot.veniceKey')||'',op=localStorage.getItem('sot.openrouterKey')||'';openModal('Configuration',`<div class="field"><label>Venice API key — local only</label><input id="veniceKey" class="input" type="password" value="${esc(ven)}"></div><div class="field"><label>OpenRouter API key — local only</label><input id="openrouterKey" class="input" type="password" value="${esc(op)}"></div>`,'<button class="btn" data-close>Cancel</button><button id="saveConfig" class="btn primary">Save</button>');$('saveConfig').onclick=()=>{localStorage.setItem('sot.veniceKey',$('veniceKey').value.trim());localStorage.setItem('sot.openrouterKey',$('openrouterKey').value.trim());$('modalRoot').innerHTML='';toast('Keys saved locally')}}
async function load(){try{let [p,h,r]=await Promise.all([api('/projects'),api('/health'),api('/rollup')]);state.projects=Array.isArray(p)?p:(p.projects||[]);state.health=h;state.rollup=r;if(state.selected!=='__sot__'&&!state.projects.some(x=>x.project_token===state.selected))state.selected='__sot__';renderCards();renderWorkspace()}catch(e){$('cards').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`;$('content').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
$('addProject').onclick=newProject;$('gear').onclick=openConfig;$('search').oninput=e=>{state.query=e.target.value;renderCards()};$('clearSearch').onclick=()=>{$('search').value='';state.query='';renderCards()};load();setInterval(()=>load().catch(()=>{}),5000);
</script>
</body>
