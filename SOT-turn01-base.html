<style>

.workspace{min-height:0;overflow:auto}.surface{max-width:1160px;margin:0 auto;padding:14px 18px 50px}.projectHead{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 83%,transparent);padding:6px 0 12px}.projectTitle{font-size:24px;font-weight:950}.projectSub{margin-top:3px;font-size:11px;color:var(--muted)}.next{margin-top:8px;border:1px solid #3d638b;border-radius:10px;background:#102238;padding:11px 13px;display:flex;gap:12px;align-items:center}.nextText{min-width:0;flex:1}.nextText b{display:block;font-size:15px}.nextText small{display:block;color:#b7c9db;margin-top:2px}.btn{border:1px solid var(--line);border-radius:8px;background:#192331;color:var(--text);padding:8px 11px;font-weight:800}.btn.primary{background:#286fbd;border-color:#4a97e7}.btn.danger{color:#ffb8bd;border-color:#713940;background:#29171a}.btn.good{color:#c3f3d7;border-color:#39684f}.btn:disabled{opacity:.35;cursor:not-allowed}
.flow{display:grid;gap:9px}.stage{border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}.stage.current{border-color:#497cad}.stage.done{border-color:#315443}.stage summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;background:#111923}.stage summary::-webkit-details-marker{display:none}.stageNo{width:25px;height:25px;border:1px solid var(--line);border-radius:999px;display:grid;place-items:center;font-size:10px;font-weight:900;color:var(--muted)}.stage.done .stageNo{color:var(--green);border-color:#3f6c55}.stage.current .stageNo{color:var(--blue);border-color:#4d82b7}.stageTitle{font-weight:900}.stageSummary{margin-left:auto;font-size:10px;color:var(--muted);text-align:right}.stageBody{padding:13px;border-top:1px solid var(--line)}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.box{border:1px solid var(--line);border-radius:9px;background:#0f161f;padding:10px}.box h3{font-size:10px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.path{word-break:break-all;font-size:11px}.metric{border:1px solid var(--line);border-radius:9px;background:#0f161f;padding:10px}.metric b{display:block;font-size:17px}.metric span{font-size:9px;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.notice{border:1px solid #66582f;border-radius:9px;background:#201b0c;padding:9px 11px;color:#f4d88f}.success{border:1px solid #315c46;border-radius:9px;background:#102319;padding:10px 12px;color:#c7f2d8}.errorBox{border:1px solid #74383e;border-radius:9px;background:#281619;padding:9px 11px;color:#ffd5d8}.dupGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.dup{border:1px solid var(--line);border-radius:9px;background:#0f161f;padding:11px;text-align:left;color:var(--text)}.dup b{display:block;font-size:19px}.list{border:1px solid var(--line);border-radius:9px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 9px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:2px}.activity{max-height:320px;overflow:auto}.event{padding:8px 9px;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.eventHead{display:flex;gap:8px}.eventHead time{margin-left:auto;font-size:9px;color:var(--muted)}.event pre{white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:9px;margin:4px 0 0}
.modalBg{position:fixed;inset:0;z-index:100;background:#020406dc;display:grid;place-items:center;padding:12px}.modal{width:min(980px,100%);max-height:94dvh;display:flex;flex-direction:column;border:1px solid #3a4a5f;border-radius:12px;background:#10161f;overflow:hidden}.modalHead,.modalFoot{display:flex;gap:8px;align-items:center;padding:11px 13px}.modalHead{border-bottom:1px solid var(--line)}.modalFoot{border-top:1px solid var(--line);justify-content:flex-end}.modalBody{min-height:0;overflow:auto;padding:13px}.input{width:100%;border:1px solid var(--line);border-radius:8px;background:#080d13;color:var(--text);padding:9px 10px;outline:none}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:9px;text-transform:uppercase;color:var(--muted);font-weight:850}.picker{display:grid;grid-template-columns:180px minmax(280px,1fr) minmax(230px,.8fr);height:500px;border:1px solid var(--line);border-radius:9px;overflow:hidden}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}.pane:last-child{border-right:0}.paneHead{padding:8px 9px;border-bottom:1px solid var(--line);font-size:9px;font-weight:900;text-transform:uppercase}.paneBody{min-height:0;overflow:auto}.pickBtn{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:9px;text-align:left}.pickBtn.active,.pickBtn:hover{background:#67b4ff14}.folderRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}.folderRow button:first-child{border:0;background:transparent;color:var(--text);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pathBar{padding:8px;border-bottom:1px solid var(--line);font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.selectedRow{display:flex;gap:6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line)}.selectedRow span{flex:1;min-width:0;word-break:break-all;font-size:10px}.createRow{display:flex;gap:6px;padding:8px}.createRow input{flex:1}.toast{position:fixed;left:50%;bottom:18px;z-index:160;transform:translateX(-50%);border:1px solid var(--line);border-radius:9px;background:#17212d;padding:9px 12px}
@media(max-width:900px){.grid5{grid-template-columns:repeat(3,1fr)}.picker{grid-template-columns:150px minmax(220px,1fr) 220px}}
@media(max-width:760px){.brand small{display:none}.body{grid-template-columns:1fr;grid-template-rows:170px minmax(0,1fr)}.rail{border-right:0;border-bottom:1px solid var(--line)}.cards{display:flex;gap:7px;overflow:auto}.card{min-width:235px;margin:0}.surface{padding:9px 10px 36px}.grid3,.grid5{grid-template-columns:1fr 1fr}.picker{display:block;height:auto;max-height:78dvh;overflow:auto}.pane{border-right:0;border-bottom:1px solid var(--line)}.paneBody{max-height:230px}.next{align-items:flex-start;flex-direction:column}}

<body>
<div id="app"><header class="top"><div class="brand">SOT <small>TURN 01 · BASE · R3</small></div><div class="searchWrap"><input id="search" class="search" placeholder="OMNISEARCH — projects" autocomplete="off"><button id="clearSearch" class="clear" aria-label="Clear">×</button></div><button id="addProject" class="topBtn">+ Project</button><button id="gear" class="topBtn" title="Storage defaults">⚙</button></header><div class="body"><aside class="rail"><div class="railHead">Projects — live status</div><div id="cards" class="cards"></div></aside><main id="workspace" class="workspace"><div id="surface" class="surface"></div></main></div></div><div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const BUILD='SOT-turn01-base-deterministic-r3';
const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';
const state={projects:[],health:null,rollup:null,scheduler:null,selected:localStorage.getItem('sot.selected')||'__sot__',query:'',detail:null,storage:null,status:null,review:null,dups:null,plan:null,activity:null,polling:false,volumes:null,folderCache:new Map()};
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(v){let n=Number(v||0),i=0,u=['B','KB','MB','GB','TB','PB'];while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function pct(v){return Math.max(0,Math.min(100,Number(v||0))).toFixed(0)+'%'}
function n(v){return Number(v||0)}
function toast(m,bad=false){let x=$('toast');x.textContent=m;x.classList.toggle('bad',bad);x.classList.remove('hidden');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.add('hidden'),2600)}
async function api(path,opt={}){let r=await fetch(API+path,{cache:'no-store',headers:{'Content-Type':'application/json'},...opt}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d}
function project(){return state.projects.find(p=>p.project_token===state.selected)||null}
function processingState(p){return String(p?.processing_state||p?.status||'Idle')}
function progressOf(p){let total=n(p?.size_bytes),done=n(p?.bytes_processed);return total?done/total*100:0}
function operatorBusy(){let a=document.activeElement;return !!$('modalRoot').firstChild||!!(a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName))}
function closeModal(){$('modalRoot').innerHTML=''}
function openModal(title,body,foot='<button class="btn" data-close>Close</button>'){$('modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><div class="modalHead"><b>${esc(title)}</b><button class="btn" style="margin-left:auto" data-close>×</button></div><div class="modalBody">${body}</div><div class="modalFoot">${foot}</div></div></div>`;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}
function planCurrent(p,pl){return !!pl&&pl.state!=='none'&&pl.state!=='stale'&&n(pl.evidence_revision)===n(p.evidence_revision)}
function isIndexing(s){return ['Queued','WIP','Processing','Reindexing','Indexing'].includes(s)}
function stageModel(p){let d=state.detail||{},st=state.storage||{},rv=state.review||{},pl=state.plan||{},s=(state.status?.state)||processingState(p),sources=d.sources||[],storageReady=sources.length&&st.target_root,hasEvidence=n(rv.files)>0||n(p.evidence_revision)>0,current=planCurrent(p,pl),complete=['complete','completed','certified'].includes(String(pl.state||'').toLowerCase());if(!storageReady)return{key:'storage',title:'Configure storage',detail:'Choose Source and Target before indexing.'};if(isIndexing(s)||s==='Paused')return{key:'index',title:s==='Paused'?'Continue indexing':'Indexing in progress',detail:`${n(state.status?.run?.files_processed||p.files_processed).toLocaleString()} of ${n(state.status?.run?.files_discovered||p.files_discovered).toLocaleString()} files processed.`};if(!hasEvidence)return{key:'index',title:'Index this project',detail:'Fingerprint the Source to establish deterministic evidence.'};if(!current)return{key:'review',title:'Review indexed storage facts',detail:`Evidence revision ${n(rv.evidence_revision||p.evidence_revision)} is ready. Review protection and duplicate findings, then generate a plan.`};if(current&&!complete)return{key:'plan',title:'Execute the current plan',detail:`Plan ${esc(pl.plan_id||'current')} is bound to evidence revision ${n(pl.evidence_revision)}.`};return{key:'protected',title:'Protected',detail:'Current evidence and plan have completed. Review verification and activity below.'}}
function renderRail(){let q=state.query.trim().toLowerCase(),ps=state.projects.filter(p=>!q||String(p.project_name||'').toLowerCase().includes(q)),r=state.rollup||{};let out=`<div class="card ${state.selected==='__sot__'?'active':''}" data-project="__sot__"><div class="cardTop"><div class="cardName">SOT</div><div class="badge">${esc(state.health?.status||'…')}</div></div><div class="cardMeta">${state.projects.length} projects · ${n(r.active_jobs)} active · ${n(r.failed_jobs)} failed</div></div>`;out+=ps.map(p=>{let s=processingState(p),pr=progressOf(p);return `<div class="card ${state.selected===p.project_token?'active':''}" data-project="${esc(p.project_token)}"><div class="cardTop"><div class="cardName">${esc(p.project_name)}</div><div class="badge">${esc(s)}</div></div><div class="cardMeta">${bytes(p.size_bytes)} · ${n(p.files_discovered).toLocaleString()} files · rev ${n(p.evidence_revision)}</div>${isIndexing(s)?`<div class="bar"><i style="width:${pr}%"></i></div>`:''}</div>`}).join('');$('cards').innerHTML=out;document.querySelectorAll('[data-project]').forEach(x=>x.onclick=()=>selectProject(x.dataset.project))}
async function selectProject(token){state.selected=token;localStorage.setItem('sot.selected',token);state.detail=state.storage=state.status=state.review=state.dups=state.plan=state.activity=null;renderRail();if(token==='__sot__')globalSurface();else await refreshProject(true);$('workspace').scrollTop=0}
function globalSurface(){let r=state.rollup||{};$('surface').innerHTML=`<div class="projectHead"><div class="projectTitle">SOT</div><div class="projectSub">Cross-project status only. Select a project on the left to work it.</div></div><div class="grid5"><div class="metric"><b>${state.projects.length}</b><span>Projects</span></div><div class="metric"><b>${n(r.active_jobs)}</b><span>Active jobs</span></div><div class="metric"><b>${n(r.failed_jobs)}</b><span>Failed jobs</span></div><div class="metric"><b>${n(r.files_discovered).toLocaleString()}</b><span>Files discovered</span></div><div class="metric"><b>${bytes(r.bytes_discovered)}</b><span>Bytes discovered</span></div></div><div class="notice" style="margin-top:10px">Projects run independently. Each project has one mutating lifecycle owner; indexing, planning and execution may overlap across different projects.</div>`}
function stageClass(key,current,done){return `stage ${current===key?'current':''} ${done?'done':''}`}
function projectSurface(p){let d=state.detail||{},st=state.storage||{},rs=state.status||{},rv=state.review||{},du=state.dups?.counts||{},pl=state.plan||{state:'none',items:[],totals:{}},events=state.activity?.events||state.activity||[],sources=d.sources||[],s=rs.state||processingState(p),run=rs.run||{},currentPlan=planCurrent(p,pl),next=stageModel(p),storageDone=!!(sources.length&&st.target_root),indexDone=n(rv.files)>0||n(p.evidence_revision)>0,reviewDone=indexDone,planDone=currentPlan,executeDone=['complete','completed','certified'].includes(String(pl.state||'').toLowerCase()),targetMissing=n(rv.target_missing_content),backupMissing=n(rv.backup_missing_content),protectedCount=Math.max(0,n(rv.unique_content)-Math.max(targetMissing,backupMissing)),totalUnique=n(rv.unique_content),scroll=$('workspace').scrollTop;
$('surface').innerHTML=`<div class="projectHead"><div class="projectTitle">${esc(p.project_name)}</div><div class="projectSub">${sources.map(x=>esc(x.normalized_path)).join(', ')||'Source not set'} → ${esc(st.target_root||'Target not set')}${st.backup_root?' + '+esc(st.backup_root):''} · evidence rev ${n(p.evidence_revision)}</div><div class="next"><div class="nextText"><b>${esc(next.title)}</b><small>${esc(next.detail)}</small></div><button id="nextAction" class="btn primary">${next.key==='storage'?'Configure storage':next.key==='index'?(s==='Paused'?'Continue index':'Start index'):next.key==='review'?'Review findings':next.key==='plan'?'Execute plan':'View protection'}</button></div></div><div class="flow">
<details class="${stageClass('storage',next.key,storageDone)}" id="storage" ${next.key==='storage'?'open':''}><summary><span class="stageNo">${storageDone?'✓':'1'}</span><span class="stageTitle">Storage</span><span class="stageSummary">${storageDone?`${sources.length} source · Target configured${st.backup_root?' · Backup configured':''}`:'Source and Target required'}</span></summary><div class="stageBody"><div class="grid3"><div class="box"><h3>Source</h3><div class="path">${sources.length?sources.map(x=>esc(x.normalized_path)).join('<br>'):'Not configured'}</div><div class="actions"><button id="editSources" class="btn">Change</button></div></div><div class="box"><h3>Target</h3><div class="path">${esc(st.target_root||'Not configured')}</div><div class="actions"><button id="editTarget" class="btn">Change</button></div></div><div class="box"><h3>Backup</h3><div class="path">${esc(st.backup_root||'Not configured')}</div><div class="actions"><button id="editBackup" class="btn">Change</button></div></div></div></div></details>
<details class="${stageClass('index',next.key,indexDone)}" id="index" ${next.key==='index'?'open':''}><summary><span class="stageNo">${indexDone?'✓':'2'}</span><span class="stageTitle">Index</span><span class="stageSummary">${indexDone?`${n(rv.files||p.files_discovered).toLocaleString()} files · ${bytes(rv.bytes||p.size_bytes)} · evidence rev ${n(rv.evidence_revision||p.evidence_revision)}`:esc(s)}</span></summary><div class="stageBody"><div class="grid5"><div class="metric"><b>${n(run.files_processed||p.files_processed).toLocaleString()}</b><span>Processed</span></div><div class="metric"><b>${n(run.files_discovered||p.files_discovered).toLocaleString()}</b><span>Discovered</span></div><div class="metric"><b>${bytes(run.bytes_processed||p.bytes_processed)}</b><span>Bytes processed</span></div><div class="metric"><b>${n(run.hashes_reused||p.hashes_reused).toLocaleString()}</b><span>Hashes reused</span></div><div class="metric"><b>${n(run.hashes_computed||p.hashes_computed).toLocaleString()}</b><span>Hashes computed</span></div></div><div class="bar" style="height:8px;margin-top:10px"><i style="width:${pct(rs.progress?.bytes_percent||progressOf(p))}"></i></div><div class="projectSub">${esc(run.current_item||p.current_item||'Idle')}</div><div class="actions"><button id="indexPlay" class="btn primary">${s==='Paused'?'Continue':indexDone?'Re-index':'Start Index'}</button><button id="indexPause" class="btn">Pause</button><button id="indexStop" class="btn danger">Stop</button></div></div></details>
<details class="${stageClass('review',next.key,reviewDone)}" id="review" ${next.key==='review'?'open':''}><summary><span class="stageNo">${reviewDone?'✓':'3'}</span><span class="stageTitle">Review</span><span class="stageSummary">${indexDone?`${n(rv.unique_content).toLocaleString()} unique · ${bytes(rv.duplicate_bytes)} duplicate storage`:'Waiting for Index'}</span></summary><div class="stageBody">${indexDone?`<div class="notice"><b>${bytes(rv.bytes)} indexed.</b> ${bytes(rv.duplicate_bytes)} is duplicate storage. These are deterministic fingerprint results.</div><div class="grid5" style="margin-top:9px"><div class="metric"><b>${n(rv.files).toLocaleString()}</b><span>Files observed</span></div><div class="metric"><b>${n(rv.unique_content).toLocaleString()}</b><span>Unique content</span></div><div class="metric"><b>${n(rv.duplicate_groups).toLocaleString()}</b><span>Duplicate groups</span></div><div class="metric"><b>${targetMissing.toLocaleString()}</b><span>Missing on Target</span></div><div class="metric"><b>${backupMissing.toLocaleString()}</b><span>Missing on Backup</span></div></div><div class="dupGrid"><button class="dup" data-bucket="2"><b>${n(du.two)}</b>2-copy groups</button><button class="dup" data-bucket="3"><b>${n(du.three)}</b>3-copy groups</button><button class="dup" data-bucket="4plus"><b>${n(du.four_plus||du.fourPlus)}</b>4+ copy groups</button></div><div id="dupDrill" class="list" style="margin-top:8px"></div><div class="actions"><button id="generatePlan" class="btn primary">Generate deterministic plan</button></div>`:'<div class="notice">Complete Index first. Review is generated from persisted fingerprints and evidence only.</div>'}</div></details>
<details class="${stageClass('plan',next.key,planDone)}" id="plan" ${next.key==='plan'?'open':''}><summary><span class="stageNo">${planDone?'✓':'4'}</span><span class="stageTitle">Plan</span><span class="stageSummary">${currentPlan?`CURRENT · evidence rev ${n(pl.evidence_revision)} · ${n(pl.totals?.items||(pl.items||[]).length)} actions`:pl.state&&pl.state!=='none'?'STALE / previous plan':'Waiting for Review'}</span></summary><div class="stageBody">${pl.state&&pl.state!=='none'?`<div class="${currentPlan?'success':'errorBox'}"><b>${currentPlan?'CURRENT PLAN':'STALE PLAN'}</b> · evidence rev ${n(pl.evidence_revision)} · state ${esc(pl.state)}</div><div class="grid5" style="margin-top:9px"><div class="metric"><b>${n(pl.totals?.items||(pl.items||[]).length)}</b><span>Actions</span></div><div class="metric"><b>${n(pl.totals?.target_files)}</b><span>Target writes</span></div><div class="metric"><b>${n(pl.totals?.backup_files)}</b><span>Backup writes</span></div><div class="metric"><b>${bytes(pl.totals?.target_bytes)}</b><span>Target bytes</span></div><div class="metric"><b>${bytes(pl.totals?.backup_bytes)}</b><span>Backup bytes</span></div></div>`:'<div class="notice">No plan yet. Generate one from the current committed evidence.</div>'}<div class="actions"><button id="regeneratePlan" class="btn" ${indexDone?'':'disabled'}>${pl.state&&pl.state!=='none'?'Regenerate current plan':'Generate plan'}</button></div></div></details>
<details class="${stageClass('execute',next.key,executeDone)}" id="execute" ${next.key==='plan'?'open':''}><summary><span class="stageNo">${executeDone?'✓':'5'}</span><span class="stageTitle">Execute</span><span class="stageSummary">${executeDone?'Completed':currentPlan?'Ready for current plan':'Waiting for current Plan'}</span></summary><div class="stageBody">${currentPlan?`<div class="notice">Execution uses the approved deterministic plan only. It writes to configured destinations and verifies results before recording completion.</div><div class="actions"><button id="executePlan" class="btn primary" ${pl.state==='draft'?'':'disabled'}>Execute current plan</button><button id="certify" class="btn good" ${String(pl.state).toLowerCase()==='complete'?'':'disabled'}>Certify</button></div>`:'<div class="notice">A current plan bound to the current evidence revision is required.</div>'}</div></details>
<details class="${stageClass('protected',next.key,executeDone)}" id="protected" ${next.key==='protected'?'open':''}><summary><span class="stageNo">${executeDone?'✓':'6'}</span><span class="stageTitle">Protected / Result</span><span class="stageSummary">${totalUnique?`${protectedCount.toLocaleString()} / ${totalUnique.toLocaleString()} unique objects protected`:'Waiting for evidence'}</span></summary><div class="stageBody">${executeDone?`<div class="success"><b>Protected</b><br>${protectedCount.toLocaleString()} / ${totalUnique.toLocaleString()} unique content objects meet the current deterministic protection result.</div>`:`<div class="notice">Protection becomes final only after deterministic execution and verification.</div>`}</div></details>
<details class="stage" id="activity"><summary><span class="stageNo">A</span><span class="stageTitle">Activity / Diagnostics</span><span class="stageSummary">${Array.isArray(events)?events.length:0} events</span></summary><div class="stageBody"><div class="activity list">${Array.isArray(events)&&events.length?events.map(e=>`<div class="event"><div class="eventHead"><b>${esc(e.event_type||e.type||'event')}</b><time>${esc(e.created_at||e.at||'')}</time></div><pre>${esc(typeof e.detail_json==='string'?e.detail_json:JSON.stringify(e.detail||e.detail_json||{},null,2))}</pre></div>`).join(''):'<div class="muted" style="padding:10px">No activity recorded.</div>'}</div></div></details>
</div>`;wireProject(p,next);requestAnimationFrame(()=>$('workspace').scrollTop=scroll)}
function wireProject(p,next){$('editSources').onclick=()=>openProjectPicker(p,'source');$('editTarget').onclick=()=>openProjectPicker(p,'target');$('editBackup').onclick=()=>openProjectPicker(p,'backup');$('indexPlay').onclick=()=>processingAction(p,'play');$('indexPause').onclick=()=>processingAction(p,'pause');$('indexStop').onclick=()=>processingAction(p,'stop');document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=()=>loadDup(p,x.dataset.bucket));let gp=$('generatePlan'),rp=$('regeneratePlan');if(gp)gp.onclick=()=>generatePlan(p);if(rp)rp.onclick=()=>generatePlan(p);let ex=$('executePlan');if(ex)ex.onclick=()=>executePlan(p);let cert=$('certify');if(cert)cert.onclick=()=>certify(p);$('nextAction').onclick=()=>{let id=next.key==='storage'?'storage':next.key==='index'?'index':next.key==='review'?'review':next.key==='plan'?'execute':'protected',x=$(id);if(x){x.open=true;x.scrollIntoView({behavior:'smooth',block:'start'})}}}
async function processingAction(p,kind){try{let s=(state.status?.state)||processingState(p),a=kind;if(kind==='play')a=s==='Paused'?'continue':((n(p.evidence_revision)>0||['Closed','Error','Interrupted','Stopped'].includes(s))?'restart':'start');await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/${a}`,{method:'POST',body:'{}'});toast(`${a} requested`);await refresh(true)}catch(e){toast(e.message,true)}}
async function loadDup(p,bucket){try{let z=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/duplicates?bucket=${encodeURIComponent(bucket)}`),groups=z.groups||[];$('dupDrill').innerHTML=groups.length?groups.map(g=>`<div class="row"><div><b class="mono">${esc(g.content_sha256||'')}</b><small>${n(g.copies)} copies · ${bytes(g.size)}</small></div></div>`).join(''):'<div class="muted" style="padding:9px">No groups in this bucket.</div>'}catch(e){toast(e.message,true)}}
async function generatePlan(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Deterministic plan generated');await refreshProject(true)}catch(e){toast(e.message,true)}}
async function executePlan(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started');await refresh(true)}catch(e){toast(e.message,true)}}
async function certify(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/certify`,{method:'POST',body:'{}'});toast('Certification recorded');await refresh(true)}catch(e){toast(e.message,true)}}
async function loadVolumes(force=false){if(state.volumes&&!force)return state.volumes;let d=await api('/turn01/volumes');state.volumes=d.volumes||[];return state.volumes}
async function folder(path,force=false){if(!force&&state.folderCache.has(path))return state.folderCache.get(path);let d=await api('/turn01/fs?path='+encodeURIComponent(path));state.folderCache.set(path,d);return d}
async function openFolderSelector({title,selected=[],multiple=false,onDone}){let chosen=[...selected],vols=await loadVolumes(),current=chosen[0]||vols.find(v=>v.mounted!==false)?.path||vols[0]?.path||'';async function draw(){let d=current?await folder(current):{folders:[],parent:null},available=(d.folders||[]).filter(f=>!chosen.includes(f.path)),volumePath=(d.volume&&d.volume.path)||vols.find(v=>current===v.path||current.startsWith(v.path+'/'))?.path||'';openModal(title,`<div class="picker"><div class="pane"><div class="paneHead">Volumes</div><div class="paneBody">${vols.map(v=>`<button class="pickBtn ${volumePath===v.path?'active':''}" data-volume="${esc(v.path)}"><b>${esc(v.name)}</b><small>${v.free_bytes!=null?' · '+bytes(v.free_bytes)+' free':''}</small></button>`).join('')}<button id="refreshVolumes" class="pickBtn">↻ Refresh inventory</button></div></div><div class="pane"><div class="paneHead">Folders</div><div class="pathBar">${esc(current)}</div><div class="paneBody">${d.parent?`<div class="folderRow"><button data-open-folder="${esc(d.parent)}">..</button><span></span></div>`:''}${available.map(f=>`<div class="folderRow"><button data-open-folder="${esc(f.path)}">${esc(f.name)}</button><button class="btn" data-add-folder="${esc(f.path)}">Add</button></div>`).join('')}</div><div class="createRow"><input id="newFolder" class="input" placeholder="New folder name"><button id="createFolder" class="btn">Create</button></div></div><div class="pane"><div class="paneHead">Selected</div><div class="paneBody">${chosen.length?chosen.map(x=>`<div class="selectedRow"><span>${esc(x)}</span><button class="btn" data-remove-folder="${esc(x)}">×</button></div>`).join(''):'<div class="muted" style="padding:10px">Nothing selected</div>'}</div></div></div>`,`<button class="btn" data-close>Cancel</button><button id="selectorCommit" class="btn primary">Use selection</button>`);document.querySelectorAll('[data-volume]').forEach(x=>x.onclick=async()=>{current=x.dataset.volume;await draw()});document.querySelectorAll('[data-open-folder]').forEach(x=>x.onclick=async()=>{current=x.dataset.openFolder;await draw()});document.querySelectorAll('[data-add-folder]').forEach(x=>x.onclick=async()=>{if(!multiple)chosen=[];if(!chosen.includes(x.dataset.addFolder))chosen.push(x.dataset.addFolder);await draw()});document.querySelectorAll('[data-remove-folder]').forEach(x=>x.onclick=async()=>{chosen=chosen.filter(v=>v!==x.dataset.removeFolder);await draw()});$('refreshVolumes').onclick=async()=>{state.folderCache.clear();vols=await loadVolumes(true);await draw()};$('createFolder').onclick=async()=>{let name=$('newFolder').value.trim();if(!name)return;try{let z=await api('/turn01/fs/folder',{method:'POST',body:JSON.stringify({parent:current,name})});state.folderCache.delete(current);current=z.path;await draw()}catch(e){toast(e.message,true)}};$('selectorCommit').onclick=()=>{onDone([...chosen]);closeModal()}}await draw()}
async function openProjectPicker(p,role){try{let d=state.detail||await api(`/turn01/projects/${encodeURIComponent(p.project_token)}`),st=state.storage||await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`),selected=role==='source'?(d.sources||[]).map(x=>x.normalized_path):[role==='target'?st.target_root:st.backup_root].filter(Boolean);await openFolderSelector({title:role==='source'?'Source':role==='target'?'Target':'Backup',selected,multiple:role==='source',onDone:async paths=>{try{if(role==='source')await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/sources`,{method:'PUT',body:JSON.stringify({sources:paths})});else await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`,{method:'PUT',body:JSON.stringify(role==='target'?{target_root:paths[0]||''}:{backup_root:paths[0]||''})});toast(`${role} saved`);await refreshProject(true)}catch(e){toast(e.message,true)}}})}catch(e){toast(e.message,true)}}
async function addProject(){let cfg={};try{cfg=await api('/admin/settings')}catch{}let name='',source=[],target=cfg.target_root?[cfg.target_root]:[],backup=cfg.backup_root?[cfg.backup_root]:[];function draw(){openModal('Add Project',`<div class="field"><label>Project name</label><input id="newProjectName" class="input" value="${esc(name)}"></div><div class="grid3"><div class="box"><h3>Source</h3><div class="path">${source.map(esc).join('<br>')||'Required'}</div><div class="actions"><button id="newSource" class="btn">Select</button></div></div><div class="box"><h3>Target</h3><div class="path">${target.map(esc).join('<br>')||'Required'}</div><div class="actions"><button id="newTarget" class="btn">Select</button></div></div><div class="box"><h3>Backup</h3><div class="path">${backup.map(esc).join('<br>')||'Optional'}</div><div class="actions"><button id="newBackup" class="btn">Select</button></div></div></div>`,`<button class="btn" data-close>Cancel</button><button id="createProject" class="btn primary">Create Project</button>`);$('newProjectName').oninput=e=>name=e.target.value;$('newSource').onclick=()=>{name=$('newProjectName').value;openFolderSelector({title:'Source',selected:source,multiple:true,onDone:x=>{source=x;draw()}})};$('newTarget').onclick=()=>{name=$('newProjectName').value;openFolderSelector({title:'Target',selected:target,onDone:x=>{target=x;draw()}})};$('newBackup').onclick=()=>{name=$('newProjectName').value;openFolderSelector({title:'Backup',selected:backup,onDone:x=>{backup=x;draw()}})};$('createProject').onclick=async()=>{name=$('newProjectName').value.trim();if(!name||!source.length||!target.length){toast('Project name, Source and Target are required',true);return}try{let p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,sources:source})});await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`,{method:'PUT',body:JSON.stringify({target_root:target[0],backup_root:backup[0]||''})});closeModal();state.selected=p.project_token;localStorage.setItem('sot.selected',p.project_token);await refresh(true);toast('Project created')}catch(e){toast(e.message,true)}}}draw()}
async function openConfig(){let cfg={};try{cfg=await api('/admin/settings')}catch{}let target=cfg.target_root?[cfg.target_root]:[],backup=cfg.backup_root?[cfg.backup_root]:[];function draw(){openModal('Storage defaults',`<div class="grid3"><div class="box"><h3>Default Target</h3><div class="path">${target.map(esc).join('<br>')||'Not set'}</div><div class="actions"><button id="defaultTarget" class="btn">Select</button></div></div><div class="box"><h3>Default Backup</h3><div class="path">${backup.map(esc).join('<br>')||'Not set'}</div><div class="actions"><button id="defaultBackup" class="btn">Select</button></div></div><div class="box"><h3>R3 policy</h3><div class="muted">No AI or inference in the operational path. Review, Plan and Execute are deterministic.</div></div></div>`,`<button class="btn" data-close>Close</button><button id="saveDefaults" class="btn primary">Save defaults</button>`);$('defaultTarget').onclick=()=>openFolderSelector({title:'Default Target',selected:target,onDone:x=>{target=x;draw()}});$('defaultBackup').onclick=()=>openFolderSelector({title:'Default Backup',selected:backup,onDone:x=>{backup=x;draw()}});$('saveDefaults').onclick=async()=>{try{await api('/admin/settings',{method:'PUT',body:JSON.stringify({target_root:target[0]||'',backup_root:backup[0]||''})});closeModal();toast('Storage defaults saved')}catch(e){toast(e.message,true)}}}draw()}
async function refreshProject(force=false){let p=project();if(!p){state.selected='__sot__';globalSurface();return}let t=encodeURIComponent(p.project_token);try{let [d,st,rs,rv,du,pl,ac]=await Promise.all([api(`/turn01/projects/${t}`),api(`/turn01/projects/${t}/storage`).catch(()=>({})),api(`/projects/${t}/fingerprint/status`).catch(()=>({})),api(`/turn01/projects/${t}/review`).catch(()=>({})),api(`/turn01/projects/${t}/duplicates`).catch(()=>({counts:{}})),api(`/turn01/projects/${t}/plan`).catch(()=>({state:'none',items:[],totals:{}})),api(`/activity?project_token=${t}&limit=100`).catch(()=>({events:[]}))]);state.detail=d;state.storage=st;state.status=rs;state.review=rv;state.dups=du;state.plan=pl;state.activity=ac;if(force||!operatorBusy())projectSurface(project())}catch(e){if(force)$('surface').innerHTML=`<div class="errorBox">${esc(e.message)}</div>`}}
async function refresh(force=false){if(state.polling)return;state.polling=true;try{let [ps,h,r,s]=await Promise.all([api('/projects'),api('/health'),api('/rollup'),api('/scheduler/status').catch(()=>({}))]);state.projects=Array.isArray(ps)?ps:(ps.projects||[]);state.health=h;state.rollup=r;state.scheduler=s;if(state.selected!=='__sot__'&&!state.projects.some(p=>p.project_token===state.selected))state.selected='__sot__';renderRail();if(state.selected==='__sot__'){if(force||!operatorBusy())globalSurface()}else await refreshProject(force)}catch(e){toast(e.message,true)}finally{state.polling=false}}
$('search').oninput=e=>{state.query=e.target.value;renderRail()};$('clearSearch').onclick=()=>{$('search').value='';state.query='';renderRail();$('search').focus()};$('addProject').onclick=addProject;$('gear').onclick=openConfig;refresh(true);setInterval(()=>refresh(false),3000);
</script>
