<details id="activity" class="stage"><summary><span class="num">A</span><span class="stageTitle">Activity / Diagnostics</span><span class="stageSummary">${Array.isArray(events)?events.length:0} events</span></summary><div class="stageBody"><div class="list">${Array.isArray(events)&&events.length?events.map(e=>`<div class="row"><b>${esc(e.event_type||e.type||'event')}</b><br>${esc(e.created_at||e.at||'')}</div>`).join(''):'<div class="row">No events</div>'}</div></div></details></div>`;wire(p,next);requestAnimationFrame(()=>$('workspace').scrollTop=scroll)}function wire(p,next){$('source').onclick=()=>pickerProject(p,'source');$('target').onclick=()=>pickerProject(p,'target');$('backup').onclick=()=>pickerProject(p,'backup');$('play').onclick=()=>process(p,'play');$('pause').onclick=()=>process(p,'pause');$('stop').onclick=()=>process(p,'stop');document.querySelectorAll('[data-bucket]').forEach(x=>x.onclick=()=>dup(p,x.dataset.bucket));for(const id of ['makePlan','regen']){let x=$(id);if(x)x.onclick=()=>makePlan(p)}let ex=$('exec');if(ex)ex.onclick=()=>execute(p);let c=$('cert');if(c)c.onclick=()=>certify(p);$('next').onclick=()=>{let id=next.key==='execute'?'execute':next.key;let x=$(id);if(x){x.open=true;x.scrollIntoView({block:'start'})}}}
async function process(p,k){try{let s=state.status?.state||ps(p),a=k;if(k==='play')a=s==='Paused'?'continue':((n(p.evidence_revision)>0||['Closed','Error','Interrupted','Stopped'].includes(s))?'restart':'start');await api(`/projects/${encodeURIComponent(p.project_token)}/fingerprint/${a}`,{method:'POST',body:'{}'});toast(a+' requested');await refresh(true)}catch(e){toast(e.message,true)}}async function dup(p,b){try{let z=await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/duplicates?bucket=${encodeURIComponent(b)}`),g=z.groups||[];$('dupDrill').innerHTML=g.length?g.map(x=>`<div class="row"><b>${esc(x.content_sha256||'')}</b><br>${n(x.copies)} copies · ${bytes(x.size)}</div>`).join(''):'<div class="row">No groups</div>'}catch(e){toast(e.message,true)}}async function makePlan(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/plan`,{method:'POST',body:'{}'});toast('Plan generated');await refreshProject(true)}catch(e){toast(e.message,true)}}async function execute(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/execute`,{method:'POST',body:'{}'});toast('Execution started');await refresh(true)}catch(e){toast(e.message,true)}}async function certify(p){try{await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/certify`,{method:'POST',body:'{}'});toast('Certified');await refresh(true)}catch(e){toast(e.message,true)}}async function volumes(force=false){if(state.volumes&&!force)return state.volumes;let d=await api('/turn01/volumes');state.volumes=d.volumes||[];return state.volumes}async function folder(path,force=false){if(!force&&state.folderCache.has(path))return state.folderCache.get(path);let d=await api('/turn01/fs?path='+encodeURIComponent(path));state.folderCache.set(path,d);return d}
async function picker({title,selected=[],multiple=false,onDone}){let chosen=[...selected],vs=await volumes(),current=chosen[0]||vs.find(v=>v.mounted!==false)?.path||vs[0]?.path||'';async function draw(){let d=current?await folder(current):{folders:[],parent:null},avail=(d.folders||[]).filter(f=>!chosen.includes(f.path));modal(title,`<div class="picker"><div class="pane"><div class="paneHead">Volumes</div><div class="paneBody">${vs.map(v=>`<button class="pick ${current===v.path||current.startsWith(v.path+'/')?'active':''}" data-vol="${esc(v.path)}"><b>${esc(v.name)}</b><br><small>${v.free_bytes!=null?bytes(v.free_bytes)+' free':''}</small></button>`).join('')}</div></div><div class="pane"><div class="paneHead">Folders · ${esc(current)}</div><div class="paneBody">${d.parent?`<button class="folder" data-open="${esc(d.parent)}">..</button>`:''}${avail.map(f=>`<div class="folderLine"><button data-open="${esc(f.path)}">${esc(f.name)}</button><button data-add="${esc(f.path)}">Add</button></div>`).join('')}</div></div><div class="pane"><div class="paneHead">Selected</div><div class="paneBody">${chosen.length?chosen.map(x=>`<div class="folderLine"><span style="padding:8px;word-break:break-all">${esc(x)}</span><button data-rm="${esc(x)}">×</button></div>`).join(''):'<div class="row">Nothing selected</div>'}</div></div></div>`,`<button class="btn" data-close>Cancel</button><button id="use" class="btn primary">Use selection</button>`);document.querySelectorAll('[data-vol]').forEach(x=>x.onclick=async()=>{current=x.dataset.vol;await draw()});document.querySelectorAll('[data-open]').forEach(x=>x.onclick=async()=>{current=x.dataset.open;await draw()});document.querySelectorAll('[data-add]').forEach(x=>x.onclick=async()=>{if(!multiple)chosen=[];if(!chosen.includes(x.dataset.add))chosen.push(x.dataset.add);await draw()});document.querySelectorAll('[data-rm]').forEach(x=>x.onclick=async()=>{chosen=chosen.filter(v=>v!==x.dataset.rm);await draw()});$('use').onclick=()=>{onDone(chosen);closeModal()}}await draw()}
async function pickerProject(p,role){let d=state.detail||{},st=state.storage||{},selected=role==='source'?(d.sources||[]).map(x=>x.normalized_path):[role==='target'?st.target_root:st.backup_root].filter(Boolean);await picker({title:role.toUpperCase(),selected,multiple:role==='source',onDone:async paths=>{try{if(role==='source')await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/sources`,{method:'PUT',body:JSON.stringify({sources:paths})});else await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`,{method:'PUT',body:JSON.stringify(role==='target'?{target_root:paths[0]||''}:{backup_root:paths[0]||''})});toast(role+' saved');await refreshProject(true)}catch(e){toast(e.message,true)}}})}
async function addProject(){let cfg={};try{cfg=await api('/admin/settings')}catch{}let name='',src=[],tgt=cfg.target_root?[cfg.target_root]:[],bak=cfg.backup_root?[cfg.backup_root]:[];function draw(){modal('Add Project',`<input id="newName" class="input" placeholder="Project name" value="${esc(name)}"><div class="grid3" style="margin-top:8px"><div class="box"><h3>Source</h3><div class="path">${src.map(esc).join('<br>')||'Required'}</div><button id="newSrc" class="btn">Select</button></div><div class="box"><h3>Target</h3><div class="path">${tgt.map(esc).join('<br>')||'Required'}</div><button id="newTgt" class="btn">Select</button></div><div class="box"><h3>Backup</h3><div class="path">${bak.map(esc).join('<br>')||'Optional'}</div><button id="newBak" class="btn">Select</button></div></div>`,`<button class="btn" data-close>Cancel</button><button id="create" class="btn primary">Create</button>`);$('newName').oninput=e=>name=e.target.value;$('newSrc').onclick=()=>{name=$('newName').value;picker({title:'SOURCE',selected:src,multiple:true,onDone:x=>{src=x;draw()}})};$('newTgt').onclick=()=>{name=$('newName').value;picker({title:'TARGET',selected:tgt,onDone:x=>{tgt=x;draw()}})};$('newBak').onclick=()=>{name=$('newName').value;picker({title:'BACKUP',selected:bak,onDone:x=>{bak=x;draw()}})};$('create').onclick=async()=>{name=$('newName').value.trim();if(!name||!src.length||!tgt.length)return toast('Name, Source and Target required',true);try{let p=await api('/projects',{method:'POST',body:JSON.stringify({project_name:name,sources:src})});await api(`/turn01/projects/${encodeURIComponent(p.project_token)}/storage`,{method:'PUT',body:JSON.stringify({target_root:tgt[0],backup_root:bak[0]||''})});closeModal();state.selected=p.project_token;localStorage.setItem('sot.selected',p.project_token);await refresh(true)}catch(e){toast(e.message,true)}}}draw()}
async function config(){let cfg={};try{cfg=await api('/admin/settings')}catch{}let tgt=cfg.target_root?[cfg.target_root]:[],bak=cfg.backup_root?[cfg.backup_root]:[];function draw(){modal('Storage defaults',`<div class="grid3"><div class="box"><h3>Default Target</h3><div class="path">${tgt.map(esc).join('<br>')||'Not set'}</div><button id="dT" class="btn">Select</button></div><div class="box"><h3>Default Backup</h3><div class="path">${bak.map(esc).join('<br>')||'Not set'}</div><button id="dB" class="btn">Select</button></div><div class="box"><h3>Policy</h3><div class="path">Deterministic only. No inference.</div></div></div>`,`<button class="btn" data-close>Close</button><button id="save" class="btn primary">Save</button>`);$('dT').onclick=()=>picker({title:'DEFAULT TARGET',selected:tgt,onDone:x=>{tgt=x;draw()}});$('dB').onclick=()=>picker({title:'DEFAULT BACKUP',selected:bak,onDone:x=>{bak=x;draw()}});$('save').onclick=async()=>{await api('/admin/settings',{method:'PUT',body:JSON.stringify({target_root:tgt[0]||'',backup_root:bak[0]||''})});closeModal();toast('Defaults saved')}}draw()}
async function refreshProject(force=false){let p=project();if(!p)return;let t=encodeURIComponent(p.project_token);try{let [d,st,rs,rv,du,pl,ac]=await Promise.all([api(`/turn01/projects/${t}`),api(`/turn01/projects/${t}/storage`).catch(()=>({})),api(`/projects/${t}/fingerprint/status`).catch(()=>({})),api(`/turn01/projects/${t}/review`).catch(()=>({})),api(`/turn01/projects/${t}/duplicates`).catch(()=>({counts:{}})),api(`/turn01/projects/${t}/plan`).catch(()=>({state:'none',items:[],totals:{}})),api(`/activity?project_token=${t}&limit=100`).catch(()=>({events:[]}))]);Object.assign(state,{detail:d,storage:st,status:rs,review:rv,dups:du,plan:pl,activity:ac});if(force||!busy())surface(project())}catch(e){if(force)$('surface').innerHTML=`<div class="error">${esc(e.message)}</div>`}}
async function refresh(force=false){if(state.polling)return;state.polling=true;try{let [p,h,r,s]=await Promise.all([api('/projects'),api('/health'),api('/rollup'),api('/scheduler/status').catch(()=>({}))]);state.projects=Array.isArray(p)?p:(p.projects||[]);state.health=h;state.rollup=r;state.scheduler=s;if(!state.projects.length){state.selected='';renderRail();$('surface').innerHTML='<div class="head"><div class="title">No projects</div><div class="next"><div class="nextText"><b>Create a project</b><small>Choose Source and Target to begin.</small></div><button class="btn primary" onclick="addProject()">+ Project</button></div></div>';return}if(!state.projects.some(x=>x.project_token===state.selected)){state.selected=state.projects[0].project_token;localStorage.setItem('sot.selected',state.selected)}renderRail();await refreshProject(force)}catch(e){toast(e.message,true)}finally{state.polling=false}}
$('search').oninput=e=>{state.query=e.target.value;renderRail()};$('add').onclick=addProject;$('gear').onclick=config;refresh(true);setInterval(()=>refresh(false),3000);
</script></body></html>
