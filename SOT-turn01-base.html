'use strict';const BUILD='SOT-turn01-base-r5-simple-protect';const API=location.pathname.startsWith('/report/')?'/report/api/sot':'/api/sot';const state={projects:[],selected:localStorage.getItem('sot.selected')||'',detail:null,storage:null,status:null,review:null,plan:null,activity:null,query:'',polling:false};const $=id=>document.getElementById(id),n=v=>Number(v||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bytes(v){let x=n(v),i=0,u=['B','KB','MB','GB','TB','PB'];while(x>=1024&&i<u.length-1){x/=1024;i++}return `${x.toFixed(i?1:0)} ${u[i]}`}async function api(p,o={}){let r=await fetch(API+p,{cache:'no-store',headers:{'Content-Type':'application/json'},...o}),d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`${r.status} ${r.statusText}`);return d}function project(){return state.projects.find(p=>p.project_token===state.selected)||null}function currentPlan(p){let x=state.plan||{};return x&&x.state!=='none'&&x.state!=='stale'&&n(x.evidence_revision)===n(p?.evidence_revision)}function renderRail(){let q=state.query.toLowerCase().trim(),arr=state.projects.filter(p=>!q||String(p.project_name).toLowerCase().includes(q));$('cards').innerHTML=arr.map(p=>`<div class="card ${p.project_token===state.selected?'active':''}" data-project="${esc(p.project_token)}"><div class="cardName">${esc(p.project_name)}</div><div class="cardMeta">${bytes(p.size_bytes)} · ${n(p.files_discovered).toLocaleString()} files<br>${esc(p.processing_state||p.status||'')}</div></div>`).join('');document.querySelectorAll('[data-project]').forEach(x=>x.onclick=()=>select(x.dataset.project))}async function select(t){state.selected=t;localStorage.setItem('sot.selected',t);renderRail();await loadProject(true);$('workspace').scrollTop=0}function lastFailure(events){let xs=Array.isArray(events)?events:[];let e=xs.find(x=>String(x.event_type||x.type||'').match(/failed|error/i));if(!e)return'';let d=e.detail||e.detail_json||e.message||'';if(typeof d==='string'){try{let j=JSON.parse(d);d=j.error||j.message||j.reason||d}catch{}}else d=d.error||d.message||d.reason||JSON.stringify(d);return String(d||'Previous attempt failed. Open Details for the recorded event.')}function nextModel(p){let d=state.detail||{},st=state.storage||{},rv=state.review||{},pl=state.plan||{},sources=d.sources||[],s=state.status?.state||p.processing_state||p.status||'',indexed=n(rv.files)>0||n(p.evidence_revision)>0,storage=sources.length&&st.target_root&&st.backup_root,cur=currentPlan(p),done=['complete','completed','certified'].includes(String(pl.state||'').toLowerCase());if(!sources.length)return['files','Choose where your files are','SOT needs at least one source folder.'];if(!indexed)return['findings',/paused/i.test(s)?'Continue checking your files':'Check my files','SOT will inventory and fingerprint the source without changing it.'];if(!storage)return['copies','Choose two safe-copy locations','Set both a Target and Backup before protecting anything.'];if(!cur)return['review','Build protection plan','SOT has finished checking the files. Review what it found, then build the copy plan.'];if(!done)return['protect','Ready to protect your files','Review the exact destinations and copy totals below, then start protection.'];return['result','Protection run finished','Review the verified result below.']}function render(p){let d=state.detail||{},st=state.storage||{},rv=state.review||{},pl=state.plan||{},events=state.activity?.events||state.activity||[],sources=d.sources||[],next=nextModel(p),indexed=n(rv.files)>0||n(p.evidence_revision)>0,cur=currentPlan(p),done=['complete','completed','certified'].includes(String(pl.state||'').toLowerCase()),targetMissing=n(rv.target_missing_content),backupMissing=n(rv.backup_missing_content),fullyProtected=indexed&&targetMissing===0&&backupMissing===0,fail=lastFailure(events),tot=pl.totals||{},targetFiles=n(tot.target_files),backupFiles=n(tot.backup_files),targetBytes=n(tot.targ <details class="step ${sources.length?'done':''}" id="files"><summary><span class="num">${sources.length?'✓':'1'}</span><span class="stepTitle">1. My files</span><span class="stepSummary">${sources.length?sources.length+' source location'+(sources.length>1?'s':''):'Choose source'}</span></summary><div class="stepBody"><div class="grid3">${sources.map((x,i)=>`<div class="box"><h3>Source ${i+1}</h3><div class="path">${esc(x.normalized_path||x.path||x)}</div></div>`).join('')||'<div class="warnBox">No source folders configured.</div>'}</div></div></details>

<details class="step ${cur?'done':''} ${next[0]==='protect'?'current':''}" id="protect" ${next[0]==='protect'?'open':''}><summary><span class="num">${cur?'✓':'4'}</span><span class="stepTitle">4. Review & protect</span><span class="stepSummary">${cur?'Ready':'Build plan first'}</span></summary><div class="stepBody">${cur?`<div class="grid3"><div class="metric"><span>Files to Target</span><b>${targetFiles.toLocaleString()}</b><small>${bytes(targetBytes)}</small></div><div class="metric"><span>Files to Backup</span><b>${backupFiles.toLocaleString()}</b><small>${bytes(backupBytes)}</small></div><div class="metric"><span>Total copy work</span><b>${(targetFiles+backupFiles).toLocaleString()}</b><small>${bytes(targetBytes+backupBytes)}</small></div></div><div class="box" style="margin-top:8px"><h3>Exactly where the copies go</h3><div class="path">Target: ${esc(st.target_root||'NOT SET')}<br>Backup: ${esc(st.backup_root||'NOT SET')}</div></div>${fail?`<div class="badBox" style="margin-top:8px"><b>Previous attempt failed:</b><br>${esc(fail)}</div>`:''}<button id="protectNow" class="btn primary" style="width:100%;margin-top:10px" ${canProtect?'':'disabled'}>Protect my files</button>`:`<div class="warnBox">No current protection plan. Build it from the latest file check.</div><div class="actions"><button id="buildPlan" class="btn primary" ${indexed&&st.target_root&&st.backup_root?'':'disabled'}>Build protection plan</button></div>`}</div></details>
<details class="step ${fullyProtected?'done':''}" id="result"><summary><span class="num">${fullyProtected?'✓':'5'}</span><span class="stepTitle">5. Result</span><span class="stepSummary">${fullyProtected?'Protected':`${targetMissing.toLocaleString()} target gaps · ${backupMissing.toLocaleString()} backup gaps`}</span></summary><div class="stepBody">${fullyProtected?'<div class="goodBox"><b>Your files are protected on both destinations.</b></div>':`<div class="warnBox">Not fully protected yet. Target is missing ${targetMissing.toLocaleString()} unique files; Backup is missing ${backupMissing.toLocaleString()}.</div>`}</div></details>
<details class="step details" id="details"><summary><span class="num">i</span><span class="stepTitle">Details / diagnostics</span><span class="stepSummary">${Array.isArray(events)?events.length:0} recent events</span></summary><div class="stepBody"><div class="box"><h3>Technical state</h3><div class="path">Evidence revision ${n(rv.evidence_revision||p.evidence_revision)} · plan ${esc(pl.state||'none')} · processing ${esc(state.status?.state||p.processing_state||p.status||'')}</div></div><div class="box" style="margin-top:8px">${Array.isArray(events)&&events.length?events.slice(0,20).map(e=>`<div class="event"><b>${esc(e.event_type||e.type||'event')}</b><small>${esc(e.created_at||e.at||'')}</small></div>`).join(''):'No recent events.'}</div></div></details></div>`;wire(p,next)}function wire(p,next){let t=encodeURIComponent(p.project_token);let call=async(fn)=>{try{await fn();await refresh(true)}catch(e){alert(e.message)}};let primary=$('primary');if(primary)primary.onclick=()=>{let id=next[0]==='files'?'files':next[0]==='findings'?'findings':next[0]==='copies'?'copies':next[0]==='review'?'protect':next[0]==='protect'?'protect':'result',x=$(id);if(x){x.open=true;x.scrollIntoView({behavior:'smooth',block:'start'})}};let idx=$('index');if(idx)idx.onclick=()=>call(()=>api(`/projects/${t}/fingerprint/start`,{method:'POST',body:'{}'}));let re=$('reindex');if(re)re.onclick=()=>call(()=>api(`/projects/${t}/fingerprint/restart`,{method:'POST',body:'{}'}));let bp=$('buildPlan');if(bp)bp.onclick=()=>call(()=>api(`/turn01/projects/${t}/plan`,{method:'POST',body:'{}'}));let pn=$('protectNow');if(pn)pn.onclick=()=>{if(!confirm(`Protect this project now?\n\nTarget: ${state.storage.target_root}\nBackup: ${state.storage.backup_root}\n\nSOT will perform the current verified copy plan.`))return;call(()=>api(`/turn01/projects/${t}/execute`,{method:'POST',body:'{}'}))}}async function loadProject(force=false){let p=project();if(!p)return;let t=encodeURIComponent(p.project_token),[d,st,rs,
