<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071019">
<title>OnxyView v1.1.0</title>
<style>
:root{--bg:#071019;--panel:#0b1621;--panel2:#101e2c;--line:#263746;--text:#f4f7f9;--muted:#94a4b2;--accent:#78d2ff;--pos:#2a8f6a;--neu:#9a7427;--neg:#a74457;--top:44px;--strip:34px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:var(--top) var(--strip) minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);background:#08121d}.brand{font-size:16px;font-weight:900;white-space:nowrap}.brand small{font-size:9px;color:var(--muted);margin-left:5px}.search{flex:1;max-width:760px;margin-left:auto;height:31px;border:1px solid #31506a;border-radius:999px;background:#0a1723;padding:0 13px;outline:0;font-size:11px}.status{font-size:9px;color:var(--muted);white-space:nowrap}.gear{width:31px;height:31px;border:1px solid var(--line);border-radius:9px;background:#0e1c2b}.strip{display:flex;align-items:center;gap:6px;padding:4px 7px;border-bottom:1px solid var(--line);background:#0a1622;overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}.chip{height:25px;flex:none;border:1px solid var(--line);border-radius:999px;background:#102033;padding:0 9px;font-size:9px;font-weight:800;white-space:nowrap}.chip b{color:var(--accent)}.chip.focus{border-color:var(--accent);color:var(--accent)}
.stage{position:relative;min-height:0;overflow:hidden}.map{position:absolute;inset:0;background:#071019;overflow:hidden}.group{position:absolute;overflow:hidden;border:1px solid #071019;background:#0b1723;transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease}.group.focused{outline:2px solid var(--accent);z-index:2}.glabel{position:absolute;z-index:5;left:5px;top:4px;max-width:calc(100% - 10px);border:0;border-radius:7px;background:#071019b8;color:#fff;padding:3px 6px;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px)}.glabel small{font-weight:600;color:#b7c5d0;margin-left:4px}.tile{position:absolute;border:1px solid #071019;overflow:hidden;padding:0;text-align:left;color:white;transition:left .18s ease,top .18s ease,width .18s ease,height .18s ease,filter .08s ease;background:#284c5e}.tile:hover,.tile:focus-visible{filter:brightness(1.14);z-index:4;outline:1px solid white}.tile .wash{position:absolute;inset:0;background:linear-gradient(150deg,#ffffff12,#00000020)}.tile .headline{position:absolute;inset:0;padding:5px 6px;display:block;font-weight:850;line-height:1.06;overflow:hidden;text-shadow:0 1px 2px #0008}.tile .meta{position:absolute;left:6px;right:6px;bottom:4px;font-size:8px;color:#f2f8fbcc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile.tiny .headline,.tile.tiny .meta{display:none}.tile.micro .meta{display:none}.tile.micro .headline{padding:3px;font-size:8px;line-height:1.02}.tile.small .headline{font-size:9px}.tile.medium .headline{font-size:11px}.tile.large .headline{font-size:14px;line-height:1.08}.tile.hero .headline{font-size:clamp(16px,2.1vw,27px);line-height:1.04;padding:9px 10px}.tile.hero .meta{font-size:9px;bottom:7px;left:10px;right:10px}.sentline{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.tray{position:absolute;z-index:30;left:50%;top:0;transform:translate(-50%,-105%);width:min(760px,96vw);max-height:70vh;border:1px solid #355670;border-radius:0 0 14px 14px;background:#091522f7;backdrop-filter:blur(18px);transition:transform .15s;overflow:hidden}.tray.open{transform:translate(-50%,0)}.tabs{height:35px;display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:900;text-transform:uppercase}.tab.on{color:#fff;box-shadow:inset 0 -2px var(--accent)}.body{padding:10px;max-height:calc(70vh - 35px);overflow:auto}.row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;margin-bottom:9px}.row label{font-size:8px;color:var(--muted);font-weight:900;text-transform:uppercase}.row select{height:32px;border:1px solid var(--line);border-radius:9px;background:#0f1e2d;padding:0 8px;font-size:10px}.vals{display:flex;gap:5px;flex-wrap:wrap}.val{min-height:27px;border:1px solid var(--line);border-radius:999px;background:#102033;padding:3px 8px;font-size:9px;opacity:.35}.val.on{opacity:1;border-color:#ffffff66}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}
.reader{position:absolute;z-index:40;right:7px;top:7px;bottom:7px;width:min(410px,34vw);border:1px solid #3a5a73;border-radius:14px;background:#0a1622f5;backdrop-filter:blur(18px);padding:12px;transform:translateX(calc(100% + 16px));transition:transform .16s;overflow:auto}.reader.open{transform:none}.rbar{display:flex;gap:4px;align-items:center}.rbar .spacer{flex:1}.rbtn{height:28px;min-width:29px;border:1px solid var(--line);border-radius:8px;background:#102033}.reader h1{font-size:19px;line-height:1.12;margin:9px 0 6px}.summary{font-size:11px;line-height:1.45;color:#cad5dd}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.pill{font-size:8px;border:1px solid #ffffff25;border-radius:999px;padding:3px 6px;color:#c7d6e1}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tag{border:0;background:#102033;border-radius:999px;padding:3px 6px;color:#8fdcff;font-size:8px}.source{display:block;padding:8px 0;border-top:1px solid #ffffff12;text-decoration:none;color:#dcecf5;font-size:10px}.source small{display:block;color:var(--muted);margin-top:2px}.loading{position:absolute;inset:0;z-index:100;background:#071019;display:grid;place-items:center}.loading.done{display:none}.loadbox{width:min(390px,84vw)}.loadbar{height:4px;border-radius:999px;background:#17283a;overflow:hidden}.loadbar i{display:block;width:15%;height:100%;background:var(--accent);transition:width .18s}.loadtext{font-size:9px;color:var(--muted);margin-top:6px}
@media(max-width:700px){:root{--top:39px;--strip:31px}.brand{font-size:13px}.brand small,.status{display:none}.top{padding:4px 5px;gap:4px}.search{height:29px;font-size:10px;padding:0 10px}.gear{width:29px;height:29px}.strip{padding:3px 5px;gap:4px}.chip{height:24px;font-size:8px;padding:0 7px}.glabel{font-size:8px;top:2px;left:3px;padding:2px 4px}.tile .headline{padding:3px 4px}.tile.small .headline{font-size:8px}.tile.medium .headline{font-size:9px}.tile.large .headline{font-size:11px}.tile.hero .headline{font-size:14px;padding:6px}.tile .meta{font-size:7px;left:4px;right:4px;bottom:3px}.reader{left:5px;right:5px;top:auto;bottom:5px;width:auto;height:min(43vh,335px);transform:translateY(calc(100% + 10px))}.reader.open{transform:none}.reader h1{font-size:15px}.row{grid-template-columns:70px 1fr}.body{padding:8px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">OnxyView <small>v1.1.0</small></div><input id="q" class="search" autocomplete="off" placeholder="Search events, #tags, #favorite, sources…"><div id="status" class="status">Starting…</div><button id="gear" class="gear">⚙</button></header>
<nav class="strip"><button id="openTray" class="chip">⌄</button><button id="gChip" class="chip"></button><button id="cChip" class="chip"></button><button id="sChip" class="chip"></button><button id="lChip" class="chip"></button><button id="focusChip" class="chip focus" hidden></button></nav>
<main class="stage"><div id="map" class="map"></div><div id="tray" class="tray"><div class="tabs"><button class="tab on" data-tab="group">Group</button><button class="tab" data-tab="color">Color</button><button class="tab" data-tab="size">Size</button><button class="tab" data-tab="lens">Lens</button></div><div id="trayBody" class="body"></div></div><aside id="reader" class="reader"></aside><div id="loading" class="loading"><div class="loadbox"><h1 style="font-size:19px;margin:0 0 6px">Opening OnxyView</h1><div class="loadbar"><i id="loadbar"></i></div><div id="loadtext" class="loadtext">Reading event cache…</div></div></div></main>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),E={q:$('q'),status:$('status'),map:$('map'),tray:$('tray'),trayBody:$('trayBody'),reader:$('reader'),loading:$('loading'),loadbar:$('loadbar'),loadtext:$('loadtext'),focusChip:$('focusChip')};
let data={events:[],sourcePacks:{}},events=[],visible=[],tab='group',focus=null,current=null;const FKEY='onxyview.favorites.v2',HKEY='onxyview.searchHistory.v2';let fav=new Set(read(FKEY,[]));
const state={group:'subject',color:'sentiment',size:'importance',pack:'All',hours:504,minSources:1};
const SENT={positive:'#2a8f6a',neutral:'#9a7427',negative:'#a74457'};const DIM={group:['subject','region','sentiment','corroboration','age','pack'],color:['sentiment','subject','region','corroboration','pack'],size:['importance','sources','recency'],lens:['pack','hours','minSources']};
function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function attr(s){return esc(s)}
function packNames(e){const out=[];for(const [n,srcs] of Object.entries(data.sourcePacks||{}))if((e.sources||[]).some(s=>srcs.includes(s)))out.push(n);return out.length?out:['Other']}
function value(e,f){if(f==='pack')return packNames(e)[0];if(f==='corroboration'){const n=e.independentSourceCount||1;return n>=5?'5+ sources':n>=3?'3–4 sources':n===2?'2 sources':'1 source'}if(f==='age'){const h=(Date.now()-(e.lastSeen||0))/36e5;return h<6?'<6h':h<24?'6–24h':h<72?'1–3d':h<168?'3–7d':h<336?'7–14d':'14–21d'}return e[f]||'Unknown'}
function sizeValue(e){if(state.size==='sources')return Math.max(1,e.independentSourceCount||1);if(state.size==='recency')return Math.max(1,100-Math.min(99,(Date.now()-(e.lastSeen||0))/36e5));return Math.max(1,e.importance||1)}
function hashColor(v){let h=0;for(const c of String(v))h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 44% 38%)`}
function colorOf(e){const v=value(e,state.color);return state.color==='sentiment'?(SENT[v]||SENT.neutral):hashColor(v)}
function text(e){return `${e.headline} ${e.subject} ${e.region} ${(e.tags||[]).join(' ')} ${(e.sources||[]).join(' ')} ${packNames(e).join(' ')}`.toLowerCase()}
function passPack(e){if(state.pack==='All')return true;return packNames(e).includes(state.pack)}
function filterEvents(){const cut=Date.now()-state.hours*36e5,q=E.q.value.trim().toLowerCase();visible=events.filter(e=>(e.lastSeen||0)>=cut&&(e.independentSourceCount||1)>=state.minSources&&passPack(e)&&(!q||(q==='#favorite'?fav.has(e.eventId):text(e).includes(q.replace(/^#/,'')))));if(focus)visible=visible.filter(e=>value(e,state.group)===focus);E.status.textContent=`${visible.length} events · ${data.articleCount||0} articles`;render();chips()}
// Exact geometric baseline adapted from IJMacD/newsmap-js layoutTreeMap.js.
function layoutTreeMap(values,{width,height}){const dimensions=[];if(!values.length||width<=0||height<=0)return dimensions;const ratio=height/width,totalValue=values.reduce(sum,0);if(!totalValue)return dimensions;let valueWidth=Math.sqrt(totalValue/ratio),valueHeight=valueWidth*ratio;const scale=width/valueWidth;let horizontal=width<height,row=[],currentX=0,currentY=0;values.forEach((value,i,a)=>{const rowFixedDimension=horizontal?valueWidth:valueHeight;let worstCurrent,worstAddition;if(i===a.length-1){let remaining;if(horizontal){const rowWidth=value/valueHeight;remaining=valueWidth-rowWidth}else{const rowHeight=value/valueWidth;remaining=valueHeight-rowHeight}worstCurrent=worstAspectRatio([value],Math.max(.0001,remaining));worstAddition=worstAspectRatio([...row,value],rowFixedDimension)}else{worstCurrent=worstAspectRatio(row,rowFixedDimension);worstAddition=worstAspectRatio([...row,value],rowFixedDimension)}if(worstAddition>worstCurrent)finalizeRow();row.push(value)});if(row.length)finalizeRow();return dimensions;function finalizeRow(){if(!row.length)return;const rowValue=row.reduce(sum,0);let rowWidth,rowHeight,x=currentX,y=currentY;if(!horizontal){rowWidth=rowValue/valueHeight;rowHeight=valueHeight;valueWidth-=rowWidth;currentX+=rowWidth}else{rowWidth=valueWidth;rowHeight=rowValue/valueWidth;valueHeight-=rowHeight;currentY+=rowHeight}for(const value of row){let vw,vh;if(!horizontal){vw=rowWidth;vh=value/rowWidth}else{vw=value/rowHeight;vh=rowHeight}dimensions.push({top:y*scale,left:x*scale,width:vw*scale,height:vh*scale});if(!horizontal)y+=vh;else x+=vw}horizontal=!horizontal;row.length=0}}
function worstAspectRatio(R,w){if(!R.length)return Infinity;const w2=w*w,s=R.reduce(sum,0),s2=s*s,rmax=R[0],rmin=R[R.length-1];return Math.max(w2*rmin/s2,s2/(w2*rmax))}function sum(a,b){return a+b}
function render(){const root=E.map.getBoundingClientRect();E.map.innerHTML='';if(!visible.length){E.map.innerHTML='<div style="padding:24px;color:#94a4b2">No events match the current view.</div>';return}const groups={};for(const e of visible)(groups[value(e,state.group)]??=[]).push(e);const gs=Object.entries(groups).map(([name,items])=>({name,items:items.sort((a,b)=>sizeValue(b)-sizeValue(a)),weight:items.reduce((s,e)=>s+sizeValue(e),0)})).sort((a,b)=>b.weight-a.weight);const gd=layoutTreeMap(gs.map(g=>g.weight),{width:root.width,height:root.height});gs.forEach((g,gi)=>{const d=gd[gi];if(!d)return;const section=document.createElement('section');section.className='group'+(focus===g.name?' focused':'');Object.assign(section.style,{left:`${d.left}px`,top:`${d.top}px`,width:`${d.width}px`,height:`${d.height}px`});const label=document.createElement('button');label.className='glabel';label.innerHTML=`${esc(g.name)} <small>${g.items.length}</small>`;label.onclick=ev=>{ev.stopPropagation();focus=focus===g.name?null:g.name;filterEvents()};section.appendChild(label);const id=layoutTreeMap(g.items.map(sizeValue),{width:d.width,height:d.height});g.items.forEach((e,i)=>{const x=id[i];if(!x)return;const b=document.createElement('button');const area=x.width*x.height;let cls='tiny';if(x.width>=38&&x.height>=24)cls='micro';if(x.width>=75&&x.height>=42)cls='small';if(x.width>=125&&x.height>=65)cls='medium';if(x.width>=220&&x.height>=110)cls='large';if(area>=65000)cls='hero';b.className='tile '+cls;Object.assign(b.style,{left:`${x.left}px`,top:`${x.top}px`,width:`${x.width}px`,height:`${x.height}px`,background:colorOf(e)});const meta=`${e.independentSourceCount||1} src · ${e.region||'Global'}`;b.innerHTML=`<span class="wash"></span><span class="headline">${esc(e.headline||'Untitled event')}</span><span class="meta">${esc(meta)}</span><span class="sentline" style="background:${SENT[e.sentiment]||SENT.neutral}"></span>`;b.onclick=()=>openReader(e);section.appendChild(b)});E.map.appendChild(section)});}
function openReader(e){current=e;const idx=visible.indexOf(e),summary=(e.articles||[]).find(a=>a.description)?.description||'';E.reader.innerHTML=`<div class="rbar"><button class="rbtn" id="prev">‹</button><button class="rbtn" id="next">›</button><span class="spacer"></span><button class="rbtn" id="tts" title="Read aloud">◖))</button><button class="rbtn" id="star">${fav.has(e.eventId)?'★':'☆'}</button><button class="rbtn" id="close">×</button></div><h1>${esc(e.headline)}</h1><div class="badges"><span class="pill">importance ${e.importance||0}</span><span class="pill">${e.independentSourceCount||1} independent</span><span class="pill">${esc(e.region||'Global')}</span><span class="pill">${esc(e.sentiment||'neutral')}</span></div><div class="summary">${esc(summary)}</div><div class="tags">${(e.tags||[]).map(t=>`<button class="tag" data-tag="${attr(t)}">${esc(t)}</button>`).join('')}</div>${(e.articles||[]).map(a=>`<a class="source" target="_blank" rel="noopener" href="${attr(a.url||'#')}">${esc(a.source||'Source')}<small>${esc(a.title||'Open report')}</small></a>`).join('')}`;E.reader.classList.add('open');$('close').onclick=()=>E.reader.classList.remove('open');$('prev').onclick=()=>{if(visible.length)openReader(visible[(idx-1+visible.length)%visible.length])};$('next').onclick=()=>{if(visible.length)openReader(visible[(idx+1)%visible.length])};$('tts').onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(`${e.headline}. ${summary}`))};$('star').onclick=()=>{fav.has(e.eventId)?fav.delete(e.eventId):fav.add(e.eventId);save(FKEY,[...fav]);openReader(e)};E.reader.querySelectorAll('.tag').forEach(t=>t.onclick=()=>{E.q.value=t.dataset.tag;filterEvents()})}
function chips(){$('gChip').innerHTML=`Group <b>${esc(state.group)}</b>`;$('cChip').innerHTML=`Color <b>${esc(state.color)}</b>`;$('sChip').innerHTML=`Size <b>${esc(state.size)}</b>`;$('lChip').innerHTML=`Lens <b>${esc(state.pack)}</b>`;E.focusChip.hidden=!focus;E.focusChip.textContent=focus?`× ${focus}`:''}
function renderTray(){const packOpts=['All',...Object.keys(data.sourcePacks||{})];if(tab==='group'||tab==='color'||tab==='size'){const vals=DIM[tab];E.trayBody.innerHTML=`<div class="row"><label>${tab}</label><select id="dimSel">${vals.map(v=>`<option value="${v}" ${state[tab]===v?'selected':''}>${v}</option>`).join('')}</select></div>`;$('dimSel').onchange=e=>{state[tab]=e.target.value;focus=null;filterEvents();renderTray()}}else E.trayBody.innerHTML=`<div class="row"><label>Source pack</label><select id="packSel">${packOpts.map(v=>`<option ${state.pack===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="row"><label>Window</label><select id="hourSel"><option value="24">24 hours</option><option value="72">3 days</option><option value="168">7 days</option><option value="336">2 weeks</option><option value="504">3 weeks</option></select></div><div class="row"><label>Corroboration</label><select id="srcSel"><option value="1">All events</option><option value="2">2+ sources</option><option value="3">3+ sources</option><option value="5">5+ sources</option></select></div>`;if(tab==='lens'){$('packSel').onchange=e=>{state.pack=e.target.value;filterEvents()};$('hourSel').value=String(state.hours);$('hourSel').onchange=e=>{state.hours=+e.target.value;filterEvents()};$('srcSel').value=String(state.minSources);$('srcSel').onchange=e=>{state.minSources=+e.target.value;filterEvents()}}}
async function boot(){try{E.loadbar.style.width='35%';E.loadtext.textContent='Reading event intelligence…';const r=await fetch('./onxyview-event-cache.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();events=data.events||[];E.loadbar.style.width='78%';E.loadtext.textContent='Laying out newsmap…';renderTray();filterEvents();requestAnimationFrame(()=>{E.loadbar.style.width='100%';setTimeout(()=>E.loading.classList.add('done'),120)})}catch(err){E.loadtext.textContent='Event cache unavailable · '+err.message}}
$('openTray').onclick=() => E.tray.classList.toggle('open');$('gear').onclick=() => E.tray.classList.toggle('open');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));renderTray()});$('gChip').onclick=()=>{tab='group';E.tray.classList.add('open');document.querySelector('[data-tab="group"]').click()};$('cChip').onclick=()=>{tab='color';E.tray.classList.add('open');document.querySelector('[data-tab="color"]').click()};$('sChip').onclick=()=>{tab='size';E.tray.classList.add('open');document.querySelector('[data-tab="size"]').click()};$('lChip').onclick=()=>{tab='lens';E.tray.classList.add('open');document.querySelector('[data-tab="lens"]').click()};E.focusChip.onclick=()=>{focus=null;filterEvents()};E.q.oninput=()=>{clearTimeout(window._q);window._q=setTimeout(filterEvents,100)};addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(render,100)});boot();
})();
</script>
</body>
</html>
