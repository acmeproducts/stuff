<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Market Navigator 3.9.12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f}iframe{display:block;width:100%;height:100%;border:0;background:#08111f}</style></head><body><iframe id="app" src="market-view.html?v=3.9.12-cachefirst" title="Market Navigator 3.9.12"></iframe><script>
'use strict';
const f=document.getElementById('app');
f.addEventListener('load',()=>{
  const d=f.contentDocument;if(!d)return;

  /* BOOT GUARD — must execute synchronously before the external 3.9.12 patch.
     The legacy 3.9.7 app schedules direct browser market refreshes shortly after
     startup. 3.9.12 is cache-first: IndexedDB paints immediately, then the
     GitHub manifest/cache patch checks for newer revisions in the background.
     Nothing in that refresh path is allowed to block the UI. */
  const guard=d.createElement('script');
  guard.textContent=`
  (function(){
    window.__MN_CACHE_FIRST_BOOT__=true;
    var st=document.createElement('style');
    st.textContent='.progress{display:none!important;pointer-events:none!important}.progress.open{display:none!important}';
    document.head.appendChild(st);
    var p=document.querySelector('.progress');if(p)p.classList.remove('open');
    try{ if(typeof incremental==='function') incremental=async function(){return false}; }catch(e){}
    try{ if(typeof foundation==='function') foundation=async function(){return false}; }catch(e){}
    try{ if(typeof ensureFoundation392==='function') ensureFoundation392=async function(){return false}; }catch(e){}
    try{ if(typeof refreshStale392==='function') refreshStale392=async function(){return false}; }catch(e){}
    try{ if(typeof prog==='function') prog=function(){ var q=document.querySelector('.progress');if(q)q.classList.remove('open'); }; }catch(e){}
    try{ if(typeof progress==='function') progress=function(){ var q=document.querySelector('.progress');if(q)q.classList.remove('open'); }; }catch(e){}
    var status=document.getElementById('status');if(status)status.textContent='Loading cached market snapshot…';
  })();`;
  d.body.appendChild(guard);

  const s=d.createElement('script');
  s.src='market-view-3.9.12-patch.js?v=3.9.12-cachefirst';
  d.body.appendChild(s);
});
</script></body></html>
